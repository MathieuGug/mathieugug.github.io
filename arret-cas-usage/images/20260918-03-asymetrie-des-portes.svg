<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-label="L'asymétrie entre la porte d'entrée d'un cas d'usage, entièrement instrumentée, et la porte de sortie, qui ne dispose d'aucun des six artefacts équivalents">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="860" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La porte d'entrée est instrumentée, la porte de sortie est nue</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Six artefacts organisent l'ouverture d'un cas d'usage. Aucun n'a d'équivalent pour la fermeture.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Panneau gauche : porte d'entrée -->
  <g class="interactive" data-card="porte-entree" tabindex="0" role="button" aria-label="La porte d'entrée — cliquez pour les détails">
    <rect x="64" y="190" width="520" height="340" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="190" width="520" height="5" fill="#1F5560"/>
    <text x="88" y="228" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">PORTE D'ENTRÉE</text>
    <text x="88" y="262" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Ouvrir un cas d'usage</text>
    <line x1="88" y1="282" x2="560" y2="282" stroke="#E5E1D8" stroke-width="0.5"/>

    <circle cx="96" cy="298" r="5" fill="#1F5560"/>
    <text x="114" y="303" class="body" font-size="13.5" fill="#1A1A1A">Un dossier de cadrage, avec un format imposé</text>
    <circle cx="96" cy="336" r="5" fill="#1F5560"/>
    <text x="114" y="341" class="body" font-size="13.5" fill="#1A1A1A">Une grille de notation, pondérée et classante</text>
    <circle cx="96" cy="374" r="5" fill="#1F5560"/>
    <text x="114" y="379" class="body" font-size="13.5" fill="#1A1A1A">Un comité constitué, qui se réunit à date fixe</text>
    <circle cx="96" cy="412" r="5" fill="#1F5560"/>
    <text x="114" y="417" class="body" font-size="13.5" fill="#1A1A1A">Une ligne budgétaire ouverte à l'exercice</text>
    <circle cx="96" cy="450" r="5" fill="#1F5560"/>
    <text x="114" y="455" class="body" font-size="13.5" fill="#1A1A1A">Un sponsor nommé, qui porte le dossier</text>
    <circle cx="96" cy="488" r="5" fill="#1F5560"/>
    <text x="114" y="493" class="body" font-size="13.5" fill="#1A1A1A">Une entrée au registre des cas d'usage</text>
  </g>

  <!-- Panneau droit : porte de sortie -->
  <g class="interactive" data-card="porte-sortie" tabindex="0" role="button" aria-label="La porte de sortie — cliquez pour les détails">
    <rect x="616" y="190" width="520" height="340" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="616" y="190" width="520" height="5" fill="#B7332C"/>
    <text x="640" y="228" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">PORTE DE SORTIE</text>
    <text x="640" y="262" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Fermer un cas d'usage</text>
    <line x1="640" y1="282" x2="1112" y2="282" stroke="#E5E1D8" stroke-width="0.5"/>

    <circle cx="648" cy="298" r="5" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="666" y="303" class="body" font-size="13.5" fill="#8A8478">Aucun dossier d'arrêt normalisé</text>
    <circle cx="648" cy="336" r="5" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="666" y="341" class="body" font-size="13.5" fill="#8A8478">Aucun critère de réfutation écrit au cadrage</text>
    <circle cx="648" cy="374" r="5" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="666" y="379" class="body" font-size="13.5" fill="#8A8478">Aucune instance de désengagement</text>
    <circle cx="648" cy="412" r="5" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="666" y="417" class="body" font-size="13.5" fill="#8A8478">Aucun poste budgétaire pour le coût d'arrêt</text>
    <circle cx="648" cy="450" r="5" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="666" y="455" class="body" font-size="13.5" fill="#8A8478">Aucun signataire de l'arrêt désigné</text>
    <circle cx="648" cy="488" r="5" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="666" y="493" class="body" font-size="13.5" fill="#8A8478">Une ligne de registre souvent supprimée</text>
  </g>

  <!-- Bandeau coût -->
  <g class="interactive" data-card="cout-invisible" tabindex="0" role="button" aria-label="Le coût de la non-fermeture — cliquez pour les détails">
    <rect x="64" y="556" width="1072" height="72" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="556" width="5" height="72" fill="#B58A2C"/>
    <text x="92" y="584" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B58A2C">CONSÉQUENCE ÉCONOMIQUE</text>
    <text x="92" y="612" class="display" font-size="19" font-style="italic" fill="#1A1A1A">Le coût de l'ouverture est visible, daté et budgété. Le coût de la non-fermeture est invisible, étalé, porté par les équipes.</text>
  </g>

  <!-- Distribution des arrêts par porte -->
  <g class="interactive" data-card="concentration-g2" tabindex="0" role="button" aria-label="La concentration des arrêts à la deuxième porte — cliquez pour les détails">
    <text x="64" y="672" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">OÙ LES ARRÊTS SE PRODUISENT — PROFIL QUALITATIF D'APRÈS COOPER, 2021</text>

    <path d="M200,756 L260,712 L420,676 L580,738 L740,748 L900,752 L1000,754 L1000,756 Z" fill="#B7332C" fill-opacity="0.12" stroke="#B7332C" stroke-width="1.5"/>
    <line x1="180" y1="756" x2="1020" y2="756" stroke="#1A1A1A" stroke-width="1.25"/>

    <line x1="260" y1="756" x2="260" y2="762" stroke="#5A5A5A" stroke-width="0.75"/>
    <line x1="420" y1="756" x2="420" y2="762" stroke="#5A5A5A" stroke-width="0.75"/>
    <line x1="580" y1="756" x2="580" y2="762" stroke="#5A5A5A" stroke-width="0.75"/>
    <line x1="740" y1="756" x2="740" y2="762" stroke="#5A5A5A" stroke-width="0.75"/>
    <line x1="900" y1="756" x2="900" y2="762" stroke="#5A5A5A" stroke-width="0.75"/>

    <text x="260" y="778" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">Porte 1</text>
    <text x="420" y="778" class="mono" font-size="11" font-weight="600" fill="#B7332C" text-anchor="middle">Porte 2</text>
    <text x="580" y="778" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">Porte 3</text>
    <text x="740" y="778" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">Porte 4</text>
    <text x="900" y="778" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">Porte 5</text>

    <line x1="200" y1="658" x2="500" y2="658" stroke="#B7332C" stroke-width="1"/>
    <text x="200" y="650" class="body" font-size="12" font-style="italic" fill="#B7332C">Fenêtre d'arrêt réelle</text>
    <line x1="560" y1="658" x2="1000" y2="658" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="560" y="650" class="body" font-size="12" font-style="italic" fill="#8A8478">Au-delà, le processus enregistre plus qu'il ne décide</text>

    <text x="1040" y="706" class="body" font-size="12" fill="#5A5A5A">Passé la deuxième</text>
    <text x="1040" y="724" class="body" font-size="12" fill="#5A5A5A">porte, le coût engagé</text>
    <text x="1040" y="742" class="body" font-size="12" fill="#5A5A5A">et l'élan interne</text>
    <text x="1040" y="760" class="body" font-size="12" fill="#5A5A5A">prennent le relais.</text>
  </g>

  <line x1="64" y1="806" x2="1136" y2="806" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="828" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Sources : R. G. Cooper, Unlocking Pipeline Gridlock, 2021 ; McKinsey, Make milestones matter with decision gates ; Stage-Gate International, Improving Go/Kill Decision Culture.</text>
  <text x="64" y="848" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Le profil de distribution est qualitatif : Cooper établit la concentration à la deuxième porte sans publier de répartition chiffrée.</text>
</svg>
