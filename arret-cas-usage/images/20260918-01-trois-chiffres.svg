<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Quatre statistiques de l'échec des projets d'IA, décomposées par population comptée, unité, définition de la fin et décision dont elles sont la trace">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Quatre chiffres, quatre populations</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Les statistiques de l'échec sont citées ensemble. Une seule décrit un acte de gouvernance.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Row labels -->
  <text x="64" y="300" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUI EST COMPTÉ</text>
  <text x="64" y="382" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">UNITÉ</text>
  <text x="64" y="436" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">DÉFINITION DE LA FIN</text>
  <text x="64" y="518" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">MÉTHODE</text>
  <text x="64" y="600" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">TRACE D'UNE DÉCISION ?</text>

  <line x1="64" y1="352" x2="1130" y2="352" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="64" y1="406" x2="1130" y2="406" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="64" y1="488" x2="1130" y2="488" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="64" y1="570" x2="1130" y2="570" stroke="#B7332C" stroke-width="1"/>

  <!-- Colonne 1 — MIT NANDA 95 % -->
  <g class="interactive" data-card="nanda-95" tabindex="0" role="button" aria-label="Les 95 pour cent du MIT NANDA — cliquez pour les détails">
    <rect x="280" y="176" width="205" height="490" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="280" y="176" width="205" height="5" fill="#1F5560"/>
    <text x="292" y="232" class="display" font-size="38" font-weight="600" fill="#1A1A1A">95 %</text>
    <text x="292" y="256" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#1F5560">MIT NANDA · AOÛT 2025</text>

    <text x="292" y="288" class="body" font-size="12.5" fill="#1A1A1A">Organisations sans retour</text>
    <text x="292" y="306" class="body" font-size="12.5" fill="#1A1A1A">mesurable sur leurs</text>
    <text x="292" y="324" class="body" font-size="12.5" fill="#1A1A1A">expérimentations</text>

    <text x="292" y="382" class="display" font-size="16" font-style="italic" fill="#1F5560">L'organisation</text>

    <text x="292" y="432" class="body" font-size="12.5" fill="#1A1A1A">Aucune. Les dispositifs</text>
    <text x="292" y="450" class="body" font-size="12.5" fill="#1A1A1A">comptés sont vivants et</text>
    <text x="292" y="468" class="body" font-size="12.5" fill="#1A1A1A">continuent de coûter.</text>

    <text x="292" y="514" class="body" font-size="12" fill="#5A5A5A">153 dirigeants, 52 entretiens,</text>
    <text x="292" y="532" class="body" font-size="12" fill="#5A5A5A">300 déploiements publics</text>
    <text x="292" y="550" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Enquête</text>

    <text x="292" y="598" class="mono" font-size="12" letter-spacing="0.06em" fill="#B7332C">NON</text>
    <text x="292" y="622" class="body" font-size="12.5" fill="#5A5A5A">Personne n'a rien signé.</text>
    <text x="292" y="640" class="body" font-size="12.5" fill="#5A5A5A">Le dispositif tourne.</text>
  </g>

  <!-- Colonne 2 — S&P Global 42 % -->
  <g class="interactive" data-card="sp-42" tabindex="0" role="button" aria-label="Les 42 pour cent de S&amp;P Global Market Intelligence — cliquez pour les détails">
    <rect x="495" y="176" width="205" height="490" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="495" y="176" width="205" height="5" fill="#1F5560"/>
    <text x="507" y="232" class="display" font-size="38" font-weight="600" fill="#1A1A1A">42 %</text>
    <text x="507" y="256" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#1F5560">S&amp;P GLOBAL · OCT. 2025</text>

    <text x="507" y="288" class="body" font-size="12.5" fill="#1A1A1A">Entreprises abandonnant</text>
    <text x="507" y="306" class="body" font-size="12.5" fill="#1A1A1A">la plupart de leurs</text>
    <text x="507" y="324" class="body" font-size="12.5" fill="#1A1A1A">initiatives (17 % un an plus tôt)</text>

    <text x="507" y="382" class="display" font-size="16" font-style="italic" fill="#1F5560">L'initiative</text>

    <text x="507" y="432" class="body" font-size="12.5" fill="#1A1A1A">Abandon déclaré par le</text>
    <text x="507" y="450" class="body" font-size="12.5" fill="#1A1A1A">répondant. 46 % des</text>
    <text x="507" y="468" class="body" font-size="12.5" fill="#1A1A1A">démonstrations arrêtées.</text>

    <text x="507" y="514" class="body" font-size="12" fill="#5A5A5A">Plus de 1 000 répondants,</text>
    <text x="507" y="532" class="body" font-size="12" fill="#5A5A5A">Amérique du Nord et Europe</text>
    <text x="507" y="550" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Enquête déclarative</text>

    <text x="507" y="598" class="mono" font-size="12" letter-spacing="0.06em" fill="#B7332C">INDÉTERMINÉ</text>
    <text x="507" y="622" class="body" font-size="12.5" fill="#5A5A5A">Rien ne distingue l'arrêt</text>
    <text x="507" y="640" class="body" font-size="12.5" fill="#5A5A5A">décidé de l'extinction.</text>
  </g>

  <!-- Colonne 3 — Gartner 40 % -->
  <g class="interactive" data-card="gartner-40" tabindex="0" role="button" aria-label="Les 40 pour cent de projets agentiques annulés prévus par Gartner — cliquez pour les détails">
    <rect x="710" y="176" width="205" height="490" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="710" y="176" width="205" height="5" fill="#B7332C"/>
    <text x="722" y="232" class="display" font-size="38" font-weight="600" fill="#1A1A1A">40 %</text>
    <text x="722" y="256" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C">GARTNER · JUIN 2025</text>

    <text x="722" y="288" class="body" font-size="12.5" fill="#1A1A1A">Projets agentiques annulés</text>
    <text x="722" y="306" class="body" font-size="12.5" fill="#1A1A1A">d'ici la fin 2027</text>

    <text x="722" y="382" class="display" font-size="16" font-style="italic" fill="#B7332C">Le projet</text>

    <text x="722" y="432" class="body" font-size="12.5" fill="#1A1A1A">Annulation. Coûts qui</text>
    <text x="722" y="450" class="body" font-size="12.5" fill="#1A1A1A">dérivent, valeur floue,</text>
    <text x="722" y="468" class="body" font-size="12.5" fill="#1A1A1A">contrôles insuffisants.</text>

    <text x="722" y="514" class="body" font-size="12" fill="#5A5A5A">Sondage de janvier 2025,</text>
    <text x="722" y="532" class="body" font-size="12" fill="#5A5A5A">3 412 répondants</text>
    <text x="722" y="550" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Prévision</text>

    <text x="722" y="598" class="mono" font-size="12" letter-spacing="0.06em" fill="#2F5D3F">OUI</text>
    <text x="722" y="622" class="body" font-size="12.5" fill="#5A5A5A">Une annulation suppose</text>
    <text x="722" y="640" class="body" font-size="12.5" fill="#5A5A5A">un signataire.</text>
  </g>

  <!-- Colonne 4 — Gartner 60 % -->
  <g class="interactive" data-card="gartner-60" tabindex="0" role="button" aria-label="Les 60 pour cent de projets abandonnés faute de données prêtes — cliquez pour les détails">
    <rect x="925" y="176" width="205" height="490" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="925" y="176" width="205" height="5" fill="#1F5560"/>
    <text x="937" y="232" class="display" font-size="38" font-weight="600" fill="#1A1A1A">60 %</text>
    <text x="937" y="256" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#1F5560">GARTNER · FÉV. 2025</text>

    <text x="937" y="288" class="body" font-size="12.5" fill="#1A1A1A">Projets abandonnés d'ici</text>
    <text x="937" y="306" class="body" font-size="12.5" fill="#1A1A1A">2026 faute de données</text>
    <text x="937" y="324" class="body" font-size="12.5" fill="#1A1A1A">prêtes pour l'usage</text>

    <text x="937" y="382" class="display" font-size="16" font-style="italic" fill="#1F5560">Le projet</text>

    <text x="937" y="432" class="body" font-size="12.5" fill="#1A1A1A">Abandon présenté comme</text>
    <text x="937" y="450" class="body" font-size="12.5" fill="#1A1A1A">la conséquence d'un</text>
    <text x="937" y="468" class="body" font-size="12.5" fill="#1A1A1A">facteur unique.</text>

    <text x="937" y="514" class="body" font-size="12" fill="#5A5A5A">Enquête T3 2024,</text>
    <text x="937" y="532" class="body" font-size="12" fill="#5A5A5A">248 responsables données</text>
    <text x="937" y="550" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Prévision</text>

    <text x="937" y="598" class="mono" font-size="12" letter-spacing="0.06em" fill="#B7332C">NON</text>
    <text x="937" y="622" class="body" font-size="12.5" fill="#5A5A5A">Une conséquence n'a</text>
    <text x="937" y="640" class="body" font-size="12.5" fill="#5A5A5A">pas de signataire.</text>
  </g>

  <line x1="64" y1="706" x2="1136" y2="706" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="730" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Sources : MIT NANDA, The GenAI Divide, 2025 ; S&amp;P Global Market Intelligence, 2025 ; Gartner, communiqués du 25 juin 2025 et du 26 février 2025.</text>
  <text x="64" y="750" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Lecture : additionner ces quatre énoncés produit un taux qui ne correspond à aucune population réelle.</text>
</svg>
