<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Anatomie d'une clause d'arrêt en cinq champs : grandeur observée, seuil, date d'observation, signataire et sort des actifs">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Anatomie d'une clause d'arrêt</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Cinq champs, signés en même temps que le dossier de cadrage, avant que l'engagement n'existe.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <rect x="64" y="190" width="620" height="500" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
  <rect x="64" y="190" width="620" height="5" fill="#B7332C"/>
  <text x="92" y="228" class="mono" font-size="11" letter-spacing="0.11em" fill="#B7332C">CLAUSE D'ARRÊT</text>
  <text x="92" y="256" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Annexe obligatoire du dossier de cadrage</text>
  <line x1="92" y1="272" x2="656" y2="272" stroke="#E5E1D8" stroke-width="1"/>

  <!-- 1 -->
  <g class="interactive" data-card="grandeur" tabindex="0" role="button" aria-label="Champ 1, la grandeur observée — cliquez pour les détails">
    <rect x="76" y="280" width="596" height="78" fill="#FFFFFF" fill-opacity="0"/>
    <text x="92" y="304" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">1 · GRANDEUR OBSERVÉE</text>
    <text x="92" y="332" class="display" font-size="16" font-style="italic" fill="#1A1A1A">Part des dossiers traités sans reprise humaine</text>
    <line x1="92" y1="346" x2="656" y2="346" stroke="#E5E1D8" stroke-width="0.5"/>
  </g>

  <!-- 2 -->
  <g class="interactive" data-card="seuil" tabindex="0" role="button" aria-label="Champ 2, le seuil — cliquez pour les détails">
    <rect x="76" y="358" width="596" height="78" fill="#FFFFFF" fill-opacity="0"/>
    <text x="92" y="382" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">2 · SEUIL ET SENS DE FRANCHISSEMENT</text>
    <text x="92" y="410" class="display" font-size="16" font-style="italic" fill="#1A1A1A">En dessous de 35 %, la clause se déclenche</text>
    <line x1="92" y1="424" x2="656" y2="424" stroke="#E5E1D8" stroke-width="0.5"/>
  </g>

  <!-- 3 -->
  <g class="interactive" data-card="date-butoir" tabindex="0" role="button" aria-label="Champ 3, la date d'observation — cliquez pour les détails">
    <rect x="76" y="436" width="596" height="78" fill="#FFFFFF" fill-opacity="0"/>
    <text x="92" y="460" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">3 · DATE D'OBSERVATION</text>
    <text x="92" y="488" class="display" font-size="16" font-style="italic" fill="#1A1A1A">31 mars 2027, relevé par l'équipe d'observabilité</text>
    <line x1="92" y1="502" x2="656" y2="502" stroke="#E5E1D8" stroke-width="0.5"/>
  </g>

  <!-- 4 -->
  <g class="interactive" data-card="signataire" tabindex="0" role="button" aria-label="Champ 4, le signataire de l'arrêt — cliquez pour les détails">
    <rect x="76" y="514" width="596" height="78" fill="#FFFFFF" fill-opacity="0"/>
    <text x="92" y="538" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">4 · SIGNATAIRE DE L'ARRÊT</text>
    <text x="92" y="566" class="display" font-size="16" font-style="italic" fill="#1A1A1A">Nom et fonction, distincts du sponsor du cas d'usage</text>
    <line x1="92" y1="580" x2="656" y2="580" stroke="#B7332C" stroke-width="1"/>
  </g>

  <!-- 5 -->
  <g class="interactive" data-card="sort-des-actifs" tabindex="0" role="button" aria-label="Champ 5, le sort des actifs — cliquez pour les détails">
    <rect x="76" y="592" width="596" height="78" fill="#FFFFFF" fill-opacity="0"/>
    <text x="92" y="616" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">5 · SORT DES ACTIFS EN CAS D'ARRÊT</text>
    <text x="92" y="644" class="display" font-size="15" font-style="italic" fill="#1A1A1A">Jeu d'évaluation, connecteurs, définitions : destinataire nommé</text>
    <line x1="92" y1="658" x2="656" y2="658" stroke="#E5E1D8" stroke-width="0.5"/>
  </g>

  <!-- Annotations -->
  <circle cx="712" cy="314" r="9" fill="#1F5560"/>
  <text x="712" y="318" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
  <line x1="721" y1="314" x2="748" y2="314" stroke="#8A8478" stroke-width="0.75"/>
  <text x="756" y="304" class="body" font-size="12" fill="#1A1A1A">Une quantité mesurable sur le dispositif, productible par</text>
  <text x="756" y="322" class="body" font-size="12" fill="#1A1A1A">l'instrumentation existante. Une grandeur qu'il faudra</text>
  <text x="756" y="340" class="body" font-size="12" fill="#1A1A1A">fabriquer à la main ne sera jamais produite.</text>

  <circle cx="712" cy="392" r="9" fill="#1F5560"/>
  <text x="712" y="396" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
  <line x1="721" y1="392" x2="748" y2="392" stroke="#8A8478" stroke-width="0.75"/>
  <text x="756" y="382" class="body" font-size="12" fill="#1A1A1A">Le niveau se justifie au moment où on l'écrit, par</text>
  <text x="756" y="400" class="body" font-size="12" fill="#1A1A1A">référence à ce que le cas d'usage remplace. Un seuil sans</text>
  <text x="756" y="418" class="body" font-size="12" fill="#1A1A1A">référence observable sera renégocié.</text>

  <circle cx="712" cy="470" r="9" fill="#1F5560"/>
  <text x="712" y="474" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
  <line x1="721" y1="470" x2="748" y2="470" stroke="#8A8478" stroke-width="0.75"/>
  <text x="756" y="460" class="body" font-size="12" fill="#1A1A1A">Une date calendaire. « À la fin du pilote » ne convient</text>
  <text x="756" y="478" class="body" font-size="12" fill="#1A1A1A">pas, la fin du pilote étant elle-même négociable. Quatre</text>
  <text x="756" y="496" class="body" font-size="12" fill="#1A1A1A">à six mois est un compromis courant.</text>

  <circle cx="712" cy="548" r="9" fill="#B7332C"/>
  <text x="712" y="552" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">4</text>
  <line x1="721" y1="548" x2="748" y2="548" stroke="#B7332C" stroke-width="0.75"/>
  <text x="756" y="538" class="body" font-size="12" fill="#B7332C">Le champ le plus difficile à obtenir et le plus</text>
  <text x="756" y="556" class="body" font-size="12" fill="#B7332C">déterminant. Un mandat écrit qui inclut le fait d'arrêter,</text>
  <text x="756" y="574" class="body" font-size="12" fill="#B7332C">et aucun intérêt à la poursuite.</text>

  <circle cx="712" cy="626" r="9" fill="#1F5560"/>
  <text x="712" y="630" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">5</text>
  <line x1="721" y1="626" x2="748" y2="626" stroke="#8A8478" stroke-width="0.75"/>
  <text x="756" y="616" class="body" font-size="12" fill="#1A1A1A">Sans ce champ, l'arrêt est une perte sèche. Avec lui,</text>
  <text x="756" y="634" class="body" font-size="12" fill="#1A1A1A">c'est une réaffectation — ce qui change entièrement la</text>
  <text x="756" y="652" class="body" font-size="12" fill="#1A1A1A">position de la personne qui signe.</text>

  <!-- Erreurs récurrentes -->
  <rect x="64" y="712" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <rect x="64" y="712" width="5" height="76" fill="#B58A2C"/>
  <text x="92" y="738" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B58A2C">DEUX ERREURS RÉCURRENTES</text>
  <text x="92" y="762" class="body" font-size="13" fill="#1A1A1A">Écrire une clause dont le franchissement déclenche « une revue » : une revue remet la décision à zéro et ramène à la situation de départ.</text>
  <text x="92" y="780" class="body" font-size="13" fill="#1A1A1A">Multiplier les critères : au-delà de deux grandeurs, il se trouvera toujours une grandeur au vert pour compenser une grandeur au rouge.</text>

  <line x1="64" y1="818" x2="1136" y2="818" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="842" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Grille proposée par l'auteur. Technique d'écriture recommandée : l'examen anticipé d'échec, conduit à la date de cadrage.</text>
  <text x="64" y="862" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Valeurs portées dans les champs : exemples illustratifs.</text>
</svg>
