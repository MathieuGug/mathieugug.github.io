<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Deux portefeuilles au même taux d'échec et au même rythme de consommation, dont les coûts d'arrêt diffèrent d'un facteur quatorze selon le délai de signature">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le coût d'arrêt sépare deux portefeuilles que le taux d'échec confond</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Délai entre le franchissement du critère et la signature, multiplié par la consommation mensuelle.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Panneau A -->
  <rect x="64" y="190" width="520" height="370" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <rect x="64" y="190" width="520" height="5" fill="#1F5560"/>
  <text x="88" y="226" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#1F5560">PORTEFEUILLE A · CLAUSE ÉCRITE AU CADRAGE</text>
  <text x="88" y="252" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Signature six semaines après le seuil</text>

  <line x1="124" y1="480" x2="564" y2="480" stroke="#1A1A1A" stroke-width="1.25"/>
  <line x1="124" y1="290" x2="124" y2="480" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="108" y="296" class="mono" font-size="10" fill="#5A5A5A" text-anchor="end">€</text>

  <g class="interactive" data-card="seuil-franchi" tabindex="0" role="button" aria-label="Le franchissement du critère d'arrêt — cliquez pour les détails">
    <rect x="196" y="280" width="32" height="220" fill="#FFFFFF" fill-opacity="0"/>
    <line x1="211" y1="300" x2="211" y2="480" stroke="#B58A2C" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="211" cy="430" r="4.5" fill="#B58A2C"/>
    <text x="186" y="292" class="mono" font-size="10" letter-spacing="0.06em" fill="#B58A2C" text-anchor="middle">SEUIL</text>
  </g>

  <polygon points="211,480 211,430 229,420 229,480" fill="#1F5560" fill-opacity="0.22" stroke="#1F5560" stroke-width="1"/>
  <path d="M124,480 L229,420 L564,420" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="229" y1="300" x2="229" y2="480" stroke="#1F5560" stroke-width="1.25"/>
  <circle cx="229" cy="420" r="5" fill="#1F5560"/>
  <text x="248" y="316" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#1F5560">SIGNATURE</text>
  <text x="248" y="342" class="display" font-size="17" font-style="italic" fill="#1F5560">Coût d'arrêt ≈ 1,5 mois</text>
  <text x="248" y="364" class="body" font-size="12" fill="#5A5A5A">de consommation du dispositif</text>
  <text x="248" y="392" class="body" font-size="12" fill="#5A5A5A">Au-delà, la consommation</text>
  <text x="248" y="410" class="body" font-size="12" fill="#5A5A5A">s'interrompt.</text>

  <text x="124" y="502" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">M0</text>
  <text x="229" y="502" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">M6</text>
  <text x="334" y="502" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">M12</text>
  <text x="439" y="502" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">M18</text>
  <text x="544" y="502" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">M24</text>

  <text x="88" y="532" class="body" font-size="12" fill="#5A5A5A">Actifs restitués : jeu d'évaluation, connecteurs,</text>
  <text x="88" y="550" class="body" font-size="12" fill="#5A5A5A">définitions métier, ligne de registre conservée.</text>

  <!-- Panneau B -->
  <rect x="616" y="190" width="520" height="370" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
  <rect x="616" y="190" width="520" height="5" fill="#B7332C"/>
  <text x="640" y="226" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">PORTEFEUILLE B · SANS CLAUSE</text>
  <text x="640" y="252" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Signature quatorze mois après le seuil</text>

  <line x1="676" y1="480" x2="1116" y2="480" stroke="#1A1A1A" stroke-width="1.25"/>
  <line x1="676" y1="290" x2="676" y2="480" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="660" y="296" class="mono" font-size="10" fill="#5A5A5A" text-anchor="end">€</text>

  <g class="interactive" data-card="aire-de-derive" tabindex="0" role="button" aria-label="L'aire de dérive entre le seuil et la signature — cliquez pour les détails">
    <polygon points="763,480 763,430 1008,285 1008,480" fill="#B7332C" fill-opacity="0.16" stroke="#B7332C" stroke-width="1"/>
    <text x="812" y="452" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C">AIRE DE DÉRIVE</text>
  </g>

  <line x1="763" y1="300" x2="763" y2="480" stroke="#B58A2C" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="763" cy="430" r="4.5" fill="#B58A2C"/>
  <text x="738" y="292" class="mono" font-size="10" letter-spacing="0.06em" fill="#B58A2C" text-anchor="middle">SEUIL</text>

  <path d="M676,480 L1008,285 L1116,285" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>

  <g class="interactive" data-card="signature" tabindex="0" role="button" aria-label="La date de signature de l'arrêt — cliquez pour les détails">
    <rect x="992" y="270" width="32" height="220" fill="#FFFFFF" fill-opacity="0"/>
    <line x1="1008" y1="270" x2="1008" y2="480" stroke="#B7332C" stroke-width="1.25"/>
    <circle cx="1008" cy="285" r="5" fill="#B7332C"/>
    <text x="1008" y="262" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#B7332C" text-anchor="middle">SIGNATURE</text>
  </g>

  <text x="700" y="326" class="display" font-size="17" font-style="italic" fill="#B7332C">Coût d'arrêt ≈ 14 mois</text>
  <text x="700" y="348" class="body" font-size="12" fill="#5A5A5A">de consommation du dispositif</text>

  <text x="676" y="502" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">M0</text>
  <text x="781" y="502" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">M6</text>
  <text x="886" y="502" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">M12</text>
  <text x="991" y="502" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">M18</text>
  <text x="1096" y="502" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">M24</text>

  <text x="640" y="532" class="body" font-size="12" fill="#5A5A5A">Actifs restitués : aucun destinataire prévu, la ligne</text>
  <text x="640" y="550" class="body" font-size="12" fill="#5A5A5A">de registre est supprimée à la fermeture.</text>

  <!-- Indicateurs -->
  <g class="interactive" data-card="indicateurs" tabindex="0" role="button" aria-label="Les trois indicateurs de portefeuille — cliquez pour les détails">
    <rect x="64" y="592" width="1072" height="96" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="592" width="5" height="96" fill="#1F5560"/>
    <text x="92" y="618" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#1F5560">TROIS INDICATEURS À PORTER AU COMITÉ</text>
    <line x1="418" y1="632" x2="418" y2="676" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="772" y1="632" x2="772" y2="676" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="92" y="648" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Taux d'arrêt</text>
    <text x="92" y="670" class="body" font-size="12" fill="#5A5A5A">Cas arrêtés / cas ouverts sur l'exercice.</text>
    <text x="446" y="648" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Coût d'arrêt moyen</text>
    <text x="446" y="670" class="body" font-size="12" fill="#5A5A5A">Délai de décision × consommation mensuelle.</text>
    <text x="800" y="648" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Couverture par clause</text>
    <text x="800" y="670" class="body" font-size="12" fill="#5A5A5A">Le seul des trois mesurable dès aujourd'hui.</text>
  </g>

  <line x1="64" y1="712" x2="1136" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="736" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Construction de l'auteur. Les deux portefeuilles partagent le même taux de passage en production et la même consommation mensuelle par cas d'usage.</text>
  <text x="64" y="756" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Postes de consommation retenus : appels aux modèles, hébergement, astreinte, maintenance des connecteurs, temps d'équipe de maintien.</text>
</svg>
