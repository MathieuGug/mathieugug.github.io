<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Les quatre sorties possibles d'un cas d'usage : passage en production, arrêt décidé, abandon subi et survie sans production, avec pour chacune son signataire, son coût et sa trace">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#8A8478"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Quatre sorties, un seul signataire</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un cas d'usage peut cesser de trois manières. Une seule laisse une trace exploitable.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Cohorte -->
  <g>
    <rect x="64" y="210" width="200" height="442" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="210" width="200" height="5" fill="#5A5A5A"/>
    <text x="84" y="252" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">COHORTE</text>
    <text x="84" y="290" class="display" font-size="24" font-weight="600" fill="#1A1A1A">100 cas d'usage</text>
    <text x="84" y="318" class="display" font-size="24" font-weight="600" fill="#1A1A1A">ouverts</text>
    <line x1="84" y1="344" x2="244" y2="344" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="84" y="378" class="body" font-size="12" fill="#5A5A5A">Les proportions ne sont</text>
    <text x="84" y="396" class="body" font-size="12" fill="#5A5A5A">pas représentées : aucune</text>
    <text x="84" y="414" class="body" font-size="12" fill="#5A5A5A">enquête publiée ne</text>
    <text x="84" y="432" class="body" font-size="12" fill="#5A5A5A">distingue les quatre</text>
    <text x="84" y="450" class="body" font-size="12" fill="#5A5A5A">sorties.</text>
    <text x="84" y="500" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Test de portefeuille :</text>
    <text x="84" y="520" class="body" font-size="12" fill="#5A5A5A">demander la liste des cas</text>
    <text x="84" y="538" class="body" font-size="12" fill="#5A5A5A">arrêtés sur douze mois,</text>
    <text x="84" y="556" class="body" font-size="12" fill="#5A5A5A">avec date et signataire.</text>
    <text x="84" y="586" class="body" font-size="12" fill="#5A5A5A">Une liste vide est déjà</text>
    <text x="84" y="604" class="body" font-size="12" fill="#5A5A5A">une information.</text>
  </g>

  <path d="M264,431 C330,431 330,260 394,260" fill="none" stroke="#8A8478" stroke-width="1.25" marker-end="url(#arw02)"/>
  <path d="M264,431 C330,431 330,374 394,374" fill="none" stroke="#8A8478" stroke-width="1.25" marker-end="url(#arw02)"/>
  <path d="M264,431 C330,431 330,488 394,488" fill="none" stroke="#8A8478" stroke-width="1.25" marker-end="url(#arw02)"/>
  <path d="M264,431 C330,431 330,602 394,602" fill="none" stroke="#8A8478" stroke-width="1.25" marker-end="url(#arw02)"/>

  <text x="820" y="196" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">SIGNATAIRE</text>
  <text x="970" y="196" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">COÛT PORTÉ</text>

  <!-- 1 · Production -->
  <g class="interactive" data-card="production" tabindex="0" role="button" aria-label="Passage en production — cliquez pour les détails">
    <rect x="400" y="210" width="736" height="100" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="400" y="210" width="5" height="100" fill="#2F5D3F"/>
    <text x="420" y="244" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Passage en production</text>
    <text x="420" y="270" class="body" font-size="12.5" fill="#5A5A5A">Le dispositif produit un effet mesurable et entre en exploitation. Les</text>
    <text x="420" y="288" class="body" font-size="12.5" fill="#5A5A5A">obligations d'exploitation commencent à ce point.</text>
    <line x1="798" y1="222" x2="798" y2="298" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="948" y1="222" x2="948" y2="298" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="820" y="252" class="body" font-size="12" fill="#1A1A1A">Comité</text>
    <text x="820" y="270" class="body" font-size="12" fill="#1A1A1A">d'engagement</text>
    <text x="970" y="252" class="body" font-size="12" fill="#1A1A1A">Exploitation,</text>
    <text x="970" y="270" class="body" font-size="12" fill="#1A1A1A">connue et budgétée</text>
  </g>

  <!-- 2 · Arrêt décidé -->
  <g class="interactive" data-card="arret-decide" tabindex="0" role="button" aria-label="Arrêt décidé — cliquez pour les détails">
    <rect x="400" y="324" width="736" height="100" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="400" y="324" width="5" height="100" fill="#1F5560"/>
    <text x="420" y="358" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Arrêt décidé</text>
    <text x="560" y="358" class="mono" font-size="10.5" letter-spacing="0.07em" fill="#1F5560">LE SEUL RÉGIME QUI PRODUIT UNE DÉCISION</text>
    <text x="420" y="384" class="body" font-size="12.5" fill="#5A5A5A">Une instance constate qu'un critère fixé au cadrage n'est pas atteint,</text>
    <text x="420" y="402" class="body" font-size="12.5" fill="#5A5A5A">prononce la fin et statue sur le sort des actifs produits.</text>
    <line x1="798" y1="336" x2="798" y2="412" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="948" y1="336" x2="948" y2="412" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="820" y="366" class="body" font-size="12" fill="#1F5560">Nommé au</text>
    <text x="820" y="384" class="body" font-size="12" fill="#1F5560">cadrage</text>
    <text x="970" y="366" class="body" font-size="12" fill="#1A1A1A">Le plus faible :</text>
    <text x="970" y="384" class="body" font-size="12" fill="#1A1A1A">la décision est</text>
    <text x="970" y="402" class="body" font-size="12" fill="#1A1A1A">précoce</text>
  </g>

  <!-- 3 · Abandon subi -->
  <g class="interactive" data-card="abandon-subi" tabindex="0" role="button" aria-label="Abandon subi — cliquez pour les détails">
    <rect x="400" y="438" width="736" height="100" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="400" y="438" width="5" height="100" fill="#B58A2C"/>
    <text x="420" y="472" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Abandon subi</text>
    <text x="560" y="472" class="mono" font-size="10.5" letter-spacing="0.07em" fill="#B58A2C">≈ CE QUE DÉCRIVENT LES 42 %</text>
    <text x="420" y="498" class="body" font-size="12.5" fill="#5A5A5A">Le sponsor change de poste, le budget n'est pas reconduit, l'équipe est</text>
    <text x="420" y="516" class="body" font-size="12.5" fill="#5A5A5A">réaffectée. Le projet s'éteint par retrait progressif des moyens.</text>
    <line x1="798" y1="450" x2="798" y2="526" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="948" y1="450" x2="948" y2="526" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="820" y="480" class="mono" font-size="12" fill="#B7332C">AUCUN</text>
    <text x="970" y="480" class="body" font-size="12" fill="#1A1A1A">Supérieur : les</text>
    <text x="970" y="498" class="body" font-size="12" fill="#1A1A1A">moyens se</text>
    <text x="970" y="516" class="body" font-size="12" fill="#1A1A1A">consomment au bout</text>
  </g>

  <!-- 4 · Survie sans production -->
  <g class="interactive" data-card="zombie" tabindex="0" role="button" aria-label="Survie sans production — cliquez pour les détails">
    <rect x="400" y="552" width="736" height="100" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="400" y="552" width="5" height="100" fill="#B7332C"/>
    <text x="420" y="586" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Survie sans production</text>
    <text x="620" y="586" class="mono" font-size="10.5" letter-spacing="0.07em" fill="#B7332C">≈ CE QUE DÉCRIVENT LES 95 %</text>
    <text x="420" y="612" class="body" font-size="12.5" fill="#5A5A5A">Le dispositif reste branché, consomme jetons, astreintes et habilitations,</text>
    <text x="420" y="630" class="body" font-size="12.5" fill="#5A5A5A">et ne franchit jamais le seuil de la production réelle.</text>
    <line x1="798" y1="564" x2="798" y2="640" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="948" y1="564" x2="948" y2="640" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="820" y="594" class="mono" font-size="12" fill="#B7332C">AUCUN</text>
    <text x="970" y="594" class="body" font-size="12" fill="#1A1A1A">Le plus élevé :</text>
    <text x="970" y="612" class="body" font-size="12" fill="#1A1A1A">rien ne vient</text>
    <text x="970" y="630" class="body" font-size="12" fill="#1A1A1A">l'interrompre</text>
  </g>

  <line x1="64" y1="706" x2="1136" y2="706" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="730" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Lecture : les trois régimes de fin appellent des remèdes opposés. Renforcer le processus d'entrée n'agit sur aucun des trois.</text>
  <text x="64" y="750" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Rapprochements avec les statistiques publiées : lecture de l'auteur, non revendiquée par les publications citées.</text>
</svg>
