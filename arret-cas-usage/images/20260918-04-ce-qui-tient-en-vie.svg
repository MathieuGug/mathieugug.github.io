<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Sept mécanismes, quatre individuels et trois organisationnels, convergent vers la reconduction par défaut d'un cas d'usage">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Sept mécanismes, aucune mauvaise foi</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce qui maintient un cas d'usage en vie une fois la porte d'entrée franchie.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="200" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">MÉCANISMES INDIVIDUELS · DOCUMENTÉS EN PSYCHOLOGIE DE LA DÉCISION</text>

  <g class="interactive" data-card="escalade" tabindex="0" role="button" aria-label="L'escalade d'engagement — cliquez pour les détails">
    <rect x="64" y="214" width="636" height="56" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="214" width="4" height="56" fill="#1F5560"/>
    <text x="88" y="240" class="display" font-size="17" font-weight="600" fill="#1A1A1A">L'escalade d'engagement</text>
    <text x="88" y="260" class="body" font-size="12" fill="#5A5A5A">Staw, 1976 : on engage le plus de moyens dans une voie dont on est soi-même responsable.</text>
  </g>

  <g>
    <rect x="64" y="278" width="636" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="278" width="4" height="56" fill="#1F5560"/>
    <text x="88" y="304" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Le coût irrécupérable</text>
    <text x="88" y="324" class="body" font-size="12" fill="#5A5A5A">Ce qui est déjà dépensé se transforme en argument de poursuite.</text>
  </g>

  <g>
    <rect x="64" y="342" width="636" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="342" width="4" height="56" fill="#1F5560"/>
    <text x="88" y="368" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Le biais d'achèvement</text>
    <text x="88" y="388" class="body" font-size="12" fill="#5A5A5A">Plus la fin paraît proche, plus renoncer devient difficile — et une démonstration paraît toujours proche.</text>
  </g>

  <g class="interactive" data-card="optimisme" tabindex="0" role="button" aria-label="L'optimisme de prévision — cliquez pour les détails">
    <rect x="64" y="406" width="636" height="56" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="406" width="4" height="56" fill="#1F5560"/>
    <text x="88" y="432" class="display" font-size="17" font-weight="600" fill="#1A1A1A">L'optimisme de prévision</text>
    <text x="88" y="452" class="body" font-size="12" fill="#5A5A5A">Lovallo et Kahneman, 2003 : la projection se construit depuis l'intérieur du projet, sans classe de référence.</text>
  </g>

  <text x="64" y="492" class="mono" font-size="11" letter-spacing="0.09em" fill="#B58A2C">MÉCANISMES ORGANISATIONNELS · PROPRES AU DISPOSITIF DE DÉCISION</text>

  <g class="interactive" data-card="sponsor-juge" tabindex="0" role="button" aria-label="Le sponsor juge de son propre dossier — cliquez pour les détails">
    <rect x="64" y="504" width="636" height="56" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="64" y="504" width="4" height="56" fill="#B58A2C"/>
    <text x="88" y="530" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Le sponsor juge de son propre dossier</text>
    <text x="88" y="550" class="body" font-size="12" fill="#5A5A5A">Celui qui a défendu l'ouverture est celui à qui l'on demande s'il faut poursuivre.</text>
  </g>

  <g class="interactive" data-card="inertie-demo" tabindex="0" role="button" aria-label="L'inertie de la démonstration — cliquez pour les détails">
    <rect x="64" y="568" width="636" height="56" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="64" y="568" width="4" height="56" fill="#B58A2C"/>
    <text x="88" y="594" class="display" font-size="17" font-weight="600" fill="#1A1A1A">L'inertie de la démonstration</text>
    <text x="88" y="614" class="body" font-size="12" fill="#5A5A5A">Un prototype montré au comité ou à un client devient une pièce de récit, indépendante de ses résultats.</text>
  </g>

  <g>
    <rect x="64" y="632" width="636" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="632" width="4" height="56" fill="#B58A2C"/>
    <text x="88" y="658" class="display" font-size="17" font-weight="600" fill="#1A1A1A">L'absence de destinataire</text>
    <text x="88" y="678" class="body" font-size="12" fill="#5A5A5A">Aucun mandat écrit, dans l'organigramme courant, n'inclut le fait de mettre fin.</text>
  </g>

  <line x1="700" y1="242" x2="740" y2="242" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="700" y1="306" x2="740" y2="306" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="700" y1="370" x2="740" y2="370" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="700" y1="434" x2="740" y2="434" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="700" y1="532" x2="740" y2="532" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="700" y1="596" x2="740" y2="596" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="700" y1="660" x2="740" y2="660" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="740" y1="242" x2="740" y2="660" stroke="#B8B5AE" stroke-width="1.25"/>
  <line x1="740" y1="451" x2="800" y2="451" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arw04)"/>

  <g>
    <rect x="812" y="330" width="324" height="242" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="812" y="330" width="324" height="5" fill="#B7332C"/>
    <text x="836" y="368" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">RÉSULTAT</text>
    <text x="836" y="404" class="display" font-size="24" font-weight="600" fill="#1A1A1A">La reconduction</text>
    <text x="836" y="432" class="display" font-size="24" font-weight="600" fill="#1A1A1A">par défaut</text>
    <line x1="836" y1="454" x2="1112" y2="454" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="836" y="482" class="body" font-size="12.5" fill="#5A5A5A">Aucun des sept mécanismes</text>
    <text x="836" y="500" class="body" font-size="12.5" fill="#5A5A5A">n'exige de mauvaise foi ni</text>
    <text x="836" y="518" class="body" font-size="12.5" fill="#5A5A5A">d'incompétence. Leur</text>
    <text x="836" y="536" class="body" font-size="12.5" fill="#5A5A5A">combinaison suffit à produire</text>
    <text x="836" y="554" class="body" font-size="12.5" fill="#5A5A5A">la poursuite du projet.</text>
  </g>

  <text x="812" y="622" class="body" font-size="12" font-style="italic" fill="#B7332C">Les deux premières causes racines</text>
  <text x="812" y="640" class="body" font-size="12" font-style="italic" fill="#B7332C">recensées par la RAND sont détectables</text>
  <text x="812" y="658" class="body" font-size="12" font-style="italic" fill="#B7332C">au cadrage : 84 % des personnes</text>
  <text x="812" y="676" class="body" font-size="12" font-style="italic" fill="#B7332C">interrogées citent la direction.</text>

  <line x1="64" y1="716" x2="1136" y2="716" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="740" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Sources : B. M. Staw, Organizational Behavior and Human Performance, 1976 ; Lovallo &amp; Kahneman, Harvard Business Review, 2003 ; Project Management Institute ; RAND RR-A2680-1, 2024.</text>
  <text x="64" y="760" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Regroupement en deux familles : lecture de l'auteur.</text>
</svg>
