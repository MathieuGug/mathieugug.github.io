<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Quatre méthodes de distillation ordonnées par le degré d'accès qu'elles exigent sur le modèle professeur">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="840" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 02 · LES MÉTHODES</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Quatre méthodes — et c'est <tspan font-style="italic">l'accès au professeur</tspan> qui choisit.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Le débat méthodologique se referme dès qu'on écrit ce à quoi on a légalement et techniquement accès.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">CE QU'IL FAUT AVOIR SUR LE PROFESSEUR</text>

  <!-- AXE HAUT -->
  <line x1="60" y1="222" x2="1130" y2="222" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="184" y1="216" x2="184" y2="228" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="461" y1="216" x2="461" y2="228" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="738" y1="216" x2="738" y2="228" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="1015" y1="216" x2="1015" y2="228" stroke="#1A1A1A" stroke-width="1"/>
  <text x="60" y="248" class="mono" font-size="10.5" letter-spacing="1.5" fill="#5A5A5A">L'INTERFACE SEULE — BOÎTE NOIRE</text>
  <text x="1130" y="248" class="mono" font-size="10.5" letter-spacing="1.5" fill="#5A5A5A" text-anchor="end">POIDS + CHAÎNE D'ENTRAÎNEMENT</text>

  <!-- MÉTHODE A -->
  <g class="interactive" data-card="methode-traces" tabindex="0" role="button" aria-label="Réglage fin sur traces générées — détails">
    <rect x="60" y="272" width="249" height="368" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="78" y="302" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">MÉTHODE A</text>
    <text x="78" y="336" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Réglage fin sur</text>
    <text x="78" y="358" class="display" font-size="19" font-weight="600" fill="#1A1A1A">traces générées</text>
    <text x="78" y="394" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">SIGNAL TRANSMIS</text>
    <text x="78" y="414" class="body" font-size="11.5" fill="#5A5A5A">Le texte produit par le</text>
    <text x="78" y="430" class="body" font-size="11.5" fill="#5A5A5A">professeur, et rien d'autre.</text>
    <text x="78" y="466" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CAS DE RÉFÉRENCE</text>
    <text x="78" y="486" class="body" font-size="11.5" fill="#1A1A1A">DeepSeek-R1 → Qwen, Llama.</text>
    <text x="78" y="502" class="body" font-size="11.5" fill="#1A1A1A">≈ 800 000 échantillons de</text>
    <text x="78" y="518" class="body" font-size="11.5" fill="#1A1A1A">raisonnement générés.</text>
    <text x="78" y="538" class="mono" font-size="10" letter-spacing="0.5" fill="#B7332C">DeepSeek-AI [7]</text>
    <text x="78" y="576" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'IL FAUT EN RETENIR</text>
    <text x="78" y="598" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Le seul chemin ouvert quand</text>
    <text x="78" y="614" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">le professeur est fermé —</text>
    <text x="78" y="630" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">et il suffit souvent.</text>
  </g>

  <!-- MÉTHODE B -->
  <g class="interactive" data-card="methode-logits" tabindex="0" role="button" aria-label="Distillation des distributions de sortie — détails">
    <rect x="337" y="272" width="249" height="368" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="355" y="302" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">MÉTHODE B</text>
    <text x="355" y="336" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Distillation des</text>
    <text x="355" y="358" class="display" font-size="19" font-weight="600" fill="#1A1A1A">distributions</text>
    <text x="355" y="394" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">SIGNAL TRANSMIS</text>
    <text x="355" y="414" class="body" font-size="11.5" fill="#5A5A5A">La probabilité de chaque</text>
    <text x="355" y="430" class="body" font-size="11.5" fill="#5A5A5A">alternative écartée — ce que</text>
    <text x="355" y="446" class="body" font-size="11.5" fill="#5A5A5A">le professeur a failli dire.</text>
    <text x="355" y="482" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">PRIX D'ENTRÉE</text>
    <text x="355" y="502" class="body" font-size="11.5" fill="#1A1A1A">Les poids du professeur, et</text>
    <text x="355" y="518" class="body" font-size="11.5" fill="#1A1A1A">son exécution pendant tout</text>
    <text x="355" y="534" class="body" font-size="11.5" fill="#1A1A1A">l'entraînement de l'élève.</text>
    <text x="355" y="576" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'IL FAUT EN RETENIR</text>
    <text x="355" y="598" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Beaucoup plus d'information</text>
    <text x="355" y="614" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">par exemple — donc moins</text>
    <text x="355" y="630" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">d'exemples nécessaires.</text>
  </g>

  <!-- MÉTHODE C -->
  <g class="interactive" data-card="methode-sur-politique" tabindex="0" role="button" aria-label="Distillation sur-politique — détails">
    <rect x="614" y="272" width="249" height="368" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="632" y="302" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">MÉTHODE C</text>
    <text x="632" y="336" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Distillation</text>
    <text x="632" y="358" class="display" font-size="19" font-weight="600" fill="#1A1A1A">sur-politique</text>
    <text x="632" y="394" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">SIGNAL TRANSMIS</text>
    <text x="632" y="414" class="body" font-size="11.5" fill="#5A5A5A">Une correction jeton par</text>
    <text x="632" y="430" class="body" font-size="11.5" fill="#5A5A5A">jeton sur les phrases que</text>
    <text x="632" y="446" class="body" font-size="11.5" fill="#5A5A5A">l'élève a lui-même écrites.</text>
    <text x="632" y="482" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CHIFFRE ANNONCÉ</text>
    <text x="632" y="502" class="body" font-size="11.5" fill="#1A1A1A">9 à 30× d'efficacité de calcul</text>
    <text x="632" y="518" class="body" font-size="11.5" fill="#1A1A1A">contre l'apprentissage par</text>
    <text x="632" y="534" class="body" font-size="11.5" fill="#1A1A1A">renforcement, à parité.</text>
    <text x="632" y="554" class="mono" font-size="10" letter-spacing="0.5" fill="#B7332C">Thinking Machines Lab [11]</text>
    <text x="632" y="592" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'IL FAUT EN RETENIR</text>
    <text x="632" y="614" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Le professeur peut être de</text>
    <text x="632" y="630" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">la taille de l'élève.</text>
  </g>

  <!-- MÉTHODE D -->
  <g class="interactive" data-card="methode-elagage" tabindex="0" role="button" aria-label="Élagage puis redistillation — détails">
    <rect x="891" y="272" width="249" height="368" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="909" y="302" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">MÉTHODE D</text>
    <text x="909" y="336" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Élagage puis</text>
    <text x="909" y="358" class="display" font-size="19" font-weight="600" fill="#1A1A1A">redistillation</text>
    <text x="909" y="394" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">SIGNAL TRANSMIS</text>
    <text x="909" y="414" class="body" font-size="11.5" fill="#5A5A5A">Le modèle intact répare le</text>
    <text x="909" y="430" class="body" font-size="11.5" fill="#5A5A5A">modèle qu'on vient d'amputer</text>
    <text x="909" y="446" class="body" font-size="11.5" fill="#5A5A5A">de sa capacité.</text>
    <text x="909" y="482" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CAS DE RÉFÉRENCE</text>
    <text x="909" y="502" class="body" font-size="11.5" fill="#1A1A1A">Nemotron 15 Md → 8 et 4 Md.</text>
    <text x="909" y="518" class="body" font-size="11.5" fill="#1A1A1A">Jusqu'à 40× moins de jetons</text>
    <text x="909" y="534" class="body" font-size="11.5" fill="#1A1A1A">qu'un entraînement direct.</text>
    <text x="909" y="554" class="mono" font-size="10" letter-spacing="0.5" fill="#B7332C">NVIDIA, Minitron [13]</text>
    <text x="909" y="592" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'IL FAUT EN RETENIR</text>
    <text x="909" y="614" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Hors de portée d'un déployeur</text>
    <text x="909" y="630" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">— mais produit ses élèves.</text>
  </g>

  <!-- BANDEAU -->
  <g class="interactive" data-card="acces-decide" tabindex="0" role="button" aria-label="Le régime d'accès décide de la méthode — détails">
    <rect x="60" y="672" width="1080" height="112" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="698" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LA MÉTHODE EST CHOISIE AVANT QU'ON L'AIT CHOISIE</text>
    <text x="80" y="728" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le régime d'accès est fixé par le contrat, pas par l'ingénierie.</text>
    <text x="80" y="754" class="body" font-size="12.5" fill="#5A5A5A">Un professeur derrière une interface fermée ferme d'un coup les méthodes B, C et D : il ne reste que la méthode A, et son usage est lui-même encadré (schéma 5).</text>
    <text x="80" y="773" class="body" font-size="12.5" fill="#5A5A5A">Un professeur à poids ouverts les rouvre toutes. La question « quelle méthode » est donc en pratique la question « quel professeur ai-je le droit d'utiliser ».</text>
  </g>

  <line x1="60" y1="804" x2="1140" y2="804" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="824" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">SOURCES [5] [7] [11] [12] [13] · ORDONNANCEMENT SUR L'AXE : LECTURE DE L'AUTEUR · CHIFFRES ANNONCÉS PAR LEURS AUTEURS, NON RÉPLIQUÉS</text>
</svg>
