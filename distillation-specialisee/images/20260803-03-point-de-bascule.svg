<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Point de bascule entre appel d'interface frontière et modèle distillé, avec les quatre postes de coût fixe">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="840" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 03 · LE SEUIL</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Le point de bascule est une propriété du <tspan font-style="italic">cas d'usage</tspan>, pas de la technique.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Deux tâches techniquement identiques, l'une à 500 appels par jour et l'autre à 500 000, tombent de part et d'autre du seuil.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">COÛT CUMULÉ SELON LE VOLUME — ALLURE, PAS ÉCHELLE</text>

  <!-- ZONE GAUCHE OMBRÉE -->
  <rect x="100" y="240" width="326" height="320" fill="#F2EFE7"/>

  <!-- AXES -->
  <line x1="100" y1="560" x2="690" y2="560" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="100" y1="560" x2="100" y2="236" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="100" y="630" class="mono" font-size="10.5" letter-spacing="1.5" fill="#5A5A5A">VOLUME CUMULÉ D'APPELS</text>
  <text x="0" y="0" transform="translate(76,400) rotate(-90)" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1.5" fill="#5A5A5A">COÛT CUMULÉ</text>

  <!-- LIGNE API -->
  <line x1="100" y1="545" x2="660" y2="268" stroke="#1A1A1A" stroke-width="2"/>
  <text x="556" y="304" class="mono" font-size="11.5" font-weight="500" fill="#1A1A1A" text-anchor="end">APPEL D'INTERFACE FRONTIÈRE</text>
  <text x="556" y="320" class="body" font-size="11" font-style="italic" fill="#5A5A5A" text-anchor="end">coût purement variable, sans fin</text>

  <!-- LIGNE DISTILLÉ -->
  <line x1="100" y1="420" x2="660" y2="358" stroke="#B7332C" stroke-width="2"/>
  <text x="656" y="392" class="mono" font-size="11.5" font-weight="500" fill="#B7332C" text-anchor="end">MODÈLE DISTILLÉ</text>
  <text x="656" y="408" class="body" font-size="11" font-style="italic" fill="#5A5A5A" text-anchor="end">coût fixe important, variable faible</text>

  <!-- COÛT FIXE — accolade -->
  <line x1="88" y1="420" x2="88" y2="545" stroke="#B7332C" stroke-width="1.25"/>
  <line x1="84" y1="420" x2="92" y2="420" stroke="#B7332C" stroke-width="1.25"/>
  <line x1="84" y1="545" x2="92" y2="545" stroke="#B7332C" stroke-width="1.25"/>
  <text x="0" y="0" transform="translate(62,482) rotate(-90)" text-anchor="middle" class="mono" font-size="10" letter-spacing="1.2" fill="#B7332C">COÛT FIXE D'ENTRÉE</text>

  <!-- SEUIL -->
  <line x1="426" y1="384" x2="426" y2="560" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 3"/>
  <circle cx="426" cy="384" r="5" fill="#B7332C"/>
  <text x="426" y="580" class="mono" font-size="11" font-weight="500" fill="#B7332C" text-anchor="middle">SEUIL D'AMORTISSEMENT</text>

  <!-- LABELS DE ZONE -->
  <text x="100" y="604" class="mono" font-size="10.5" letter-spacing="1.2" fill="#5A5A5A">← SOUS LE SEUIL : L'INTERFACE</text>
  <text x="680" y="604" class="mono" font-size="10.5" letter-spacing="1.2" fill="#5A5A5A" text-anchor="end">LE DISTILLÉ S'AMORTIT →</text>

  <!-- POSTES DE COÛT -->
  <text x="720" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">LES QUATRE POSTES DU COÛT FIXE</text>

  <g class="interactive" data-card="poste-corpus" tabindex="0" role="button" aria-label="Poste 1 — la génération du corpus — détails">
    <rect x="720" y="216" width="420" height="90" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="740" y="240" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">POSTE 1 · LA GÉNÉRATION DU CORPUS</text>
    <text x="740" y="262" class="body" font-size="12" fill="#5A5A5A">Facturée au tarif plein du professeur, sur des milliers à</text>
    <text x="740" y="279" class="body" font-size="12" fill="#5A5A5A">centaines de milliers d'exemples. Le seul poste que les</text>
    <text x="740" y="296" class="body" font-size="12" fill="#5A5A5A">calculateurs des fournisseurs affichent correctement.</text>
  </g>

  <g class="interactive" data-card="poste-entrainement" tabindex="0" role="button" aria-label="Poste 2 — l'entraînement — détails">
    <rect x="720" y="320" width="420" height="72" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="740" y="344" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">POSTE 2 · L'ENTRAÎNEMENT</text>
    <text x="740" y="366" class="body" font-size="12" fill="#5A5A5A">Le moins cher des quatre, et de loin, pour un élève de taille</text>
    <text x="740" y="383" class="body" font-size="12" fill="#5A5A5A">modeste. Ce n'est plus le poste qui décide.</text>
  </g>

  <g class="interactive" data-card="poste-evaluation" tabindex="0" role="button" aria-label="Poste 3 — le jeu d'évaluation — détails">
    <rect x="720" y="406" width="420" height="90" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="740" y="430" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">POSTE 3 · LE JEU D'ÉVALUATION</text>
    <text x="740" y="452" class="body" font-size="12" fill="#1A1A1A">Manuel, étiqueté par des experts métier, gelé. Le vrai coût</text>
    <text x="740" y="469" class="body" font-size="12" fill="#1A1A1A">d'entrée — et le seul poste dont la dépense produit un actif</text>
    <text x="740" y="486" class="body" font-size="12" fill="#1A1A1A">qui survit au modèle qu'il a servi à valider (schéma 7).</text>
  </g>

  <g class="interactive" data-card="poste-hebergement" tabindex="0" role="button" aria-label="Poste 4 — l'hébergement — détails">
    <rect x="720" y="510" width="420" height="90" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="740" y="534" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">POSTE 4 · L'HÉBERGEMENT ET L'EXPLOITATION</text>
    <text x="740" y="556" class="body" font-size="12" fill="#5A5A5A">Un modèle personnalisé occupe de la mémoire en permanence, et</text>
    <text x="740" y="573" class="body" font-size="12" fill="#5A5A5A">sa réservation de débit court même à trafic nul : un cas à</text>
    <text x="740" y="590" class="body" font-size="12" fill="#5A5A5A">faible volume peut être plus cher distillé qu'appelé.</text>
  </g>

  <!-- BANDEAU LATENCE -->
  <g class="interactive" data-card="seuil-latence" tabindex="0" role="button" aria-label="Ce que le seuil ne dit pas en euros — détails">
    <rect x="60" y="660" width="1080" height="112" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25" stroke-dasharray="5 3"/>
    <text x="80" y="686" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">CE QUE LE SEUIL NE DIT PAS EN EUROS</text>
    <text x="80" y="716" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Une latence médiane qui passe de 950 à 180 millisecondes ne se convertit pas en économie.</text>
    <text x="80" y="742" class="body" font-size="12.5" fill="#5A5A5A">Elle change ce qu'on a le droit de mettre dans un parcours. Validation en cours de saisie, orchestration d'agent appelant le modèle des dizaines de fois par tâche :</text>
    <text x="80" y="761" class="body" font-size="12.5" fill="#5A5A5A">là, la distillation n'optimise pas un coût — elle est la condition d'existence du cas d'usage. Chiffre de latence annoncé par le fournisseur sur un cas qu'il a choisi [6].</text>
  </g>

  <line x1="60" y1="792" x2="1140" y2="792" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="812" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">SOURCES [1] [2] [6] · COURBES SCHÉMATIQUES : ALLURE ET POSITION RELATIVE, SANS ÉCHELLE NUMÉRIQUE · DÉCOMPOSITION EN QUATRE POSTES : LECTURE DE L'AUTEUR</text>
</svg>
