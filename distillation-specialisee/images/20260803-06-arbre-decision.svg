<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" role="img" aria-label="Arbre de décision en six questions, et les issues qui ne sont pas la distillation">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7332C"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="930" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 06 · LA GRILLE</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Six questions, et la distillation n'est qu'<tspan font-style="italic">une issue sur cinq</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">La première réponse négative arrête l'examen — c'est le service qu'une grille rend à un portefeuille.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">LA DESCENTE</text>
  <text x="580" y="196" class="mono" font-size="11" letter-spacing="2" fill="#B7332C">CE QUI SE PASSE SI LA RÉPONSE EST NON</text>

  <!-- QUESTION 1 -->
  <g class="interactive" data-card="question-1" tabindex="0" role="button" aria-label="Question 1 — échoue ou coûte — détails">
    <rect x="60" y="216" width="480" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="82" y="240" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579">QUESTION 1 · LE DIAGNOSTIC</text>
    <text x="82" y="266" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Le cas d'usage échoue-t-il, ou coûte-t-il ?</text>
  </g>
  <line x1="544" y1="250" x2="566" y2="250" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="interactive" data-card="issue-recuperation" tabindex="0" role="button" aria-label="Issue — la récupération — détails">
    <rect x="580" y="216" width="560" height="68" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.25"/>
    <text x="600" y="240" class="mono" font-size="9.5" letter-spacing="1.5" fill="#B7332C">S'IL ÉCHOUE → LA RÉCUPÉRATION</text>
    <text x="600" y="260" class="body" font-size="11.5" fill="#5A5A5A">Le levier est la récupération, pas la distillation. Distiller un modèle qui se trompe</text>
    <text x="600" y="276" class="body" font-size="11.5" fill="#5A5A5A">produit un petit modèle qui se trompe plus vite et moins cher.</text>
  </g>

  <!-- QUESTION 2 -->
  <g class="interactive" data-card="question-2" tabindex="0" role="button" aria-label="Question 2 — stabilité de la spécification — détails">
    <rect x="60" y="300" width="480" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="82" y="324" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579">QUESTION 2 · LA STABILITÉ</text>
    <text x="82" y="350" class="display" font-size="16" font-weight="600" fill="#1A1A1A">La spécification est-elle stable sur douze mois ?</text>
  </g>
  <line x1="544" y1="334" x2="566" y2="334" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="interactive" data-card="issue-interface-stabilite" tabindex="0" role="button" aria-label="Issue — rester sur l'interface, instabilité — détails">
    <rect x="580" y="300" width="560" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="600" y="324" class="mono" font-size="9.5" letter-spacing="1.5" fill="#B7332C">SI NON → RESTER SUR L'INTERFACE</text>
    <text x="600" y="344" class="body" font-size="11.5" fill="#5A5A5A">Une tâche dont les règles bougent périme son élève avant l'amortissement.</text>
    <text x="600" y="360" class="body" font-size="11.5" fill="#5A5A5A">C'est le prédicteur le plus fort de la rentabilité, et le moins souvent examiné.</text>
  </g>

  <!-- QUESTION 3 -->
  <g class="interactive" data-card="question-3" tabindex="0" role="button" aria-label="Question 3 — le volume — détails">
    <rect x="60" y="384" width="480" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="82" y="408" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579">QUESTION 3 · LE VOLUME</text>
    <text x="82" y="434" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Le volume franchit-il le seuil, hébergement compris ?</text>
  </g>
  <line x1="544" y1="418" x2="566" y2="418" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="interactive" data-card="issue-interface-volume" tabindex="0" role="button" aria-label="Issue — rester sur l'interface, volume insuffisant — détails">
    <rect x="580" y="384" width="560" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="600" y="408" class="mono" font-size="9.5" letter-spacing="1.5" fill="#B7332C">SI NON → RESTER SUR L'INTERFACE</text>
    <text x="600" y="428" class="body" font-size="11.5" fill="#5A5A5A">Compter les quatre postes du schéma 3, pas l'entraînement seul :</text>
    <text x="600" y="444" class="body" font-size="11.5" fill="#5A5A5A">la réservation de débit d'un modèle personnalisé court même à trafic nul.</text>
  </g>

  <!-- QUESTION 4 -->
  <g class="interactive" data-card="question-4" tabindex="0" role="button" aria-label="Question 4 — le jeu d'évaluation — détails">
    <rect x="60" y="468" width="480" height="68" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="82" y="492" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579">QUESTION 4 · LE PRÉALABLE</text>
    <text x="82" y="518" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Le jeu d'évaluation existe-t-il déjà ?</text>
  </g>
  <line x1="544" y1="502" x2="566" y2="502" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="interactive" data-card="issue-construire-eval" tabindex="0" role="button" aria-label="Issue — construire le jeu d'évaluation d'abord — détails">
    <rect x="580" y="468" width="560" height="68" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.25"/>
    <text x="600" y="492" class="mono" font-size="9.5" letter-spacing="1.5" fill="#B7332C">SI NON → LE CONSTRUIRE D'ABORD</text>
    <text x="600" y="512" class="body" font-size="11.5" fill="#5A5A5A">Sans suite de tests gelée et étiquetée, on ne peut ni valider l'élève, ni détecter</text>
    <text x="600" y="528" class="body" font-size="11.5" fill="#5A5A5A">sa dégradation, ni justifier son maintien devant un contrôle.</text>
  </g>

  <!-- QUESTION 5 -->
  <g class="interactive" data-card="question-5" tabindex="0" role="button" aria-label="Question 5 — le droit d'usage — détails">
    <rect x="60" y="552" width="480" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="82" y="576" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579">QUESTION 5 · LE DROIT D'USAGE</text>
    <text x="82" y="602" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Le professeur autorise-t-il à sortir avec le résultat ?</text>
  </g>
  <line x1="544" y1="586" x2="566" y2="586" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="interactive" data-card="issue-changer-professeur" tabindex="0" role="button" aria-label="Issue — changer de professeur — détails">
    <rect x="580" y="552" width="560" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="600" y="576" class="mono" font-size="9.5" letter-spacing="1.5" fill="#B7332C">SI NON → CHANGER DE PROFESSEUR</text>
    <text x="600" y="596" class="body" font-size="11.5" fill="#5A5A5A">Basculer sur un modèle à poids ouverts (schéma 5). Question contractuelle à trancher</text>
    <text x="600" y="612" class="body" font-size="11.5" fill="#5A5A5A">avant l'expérimentation : elle détermine aussi la méthode disponible (schéma 2).</text>
  </g>

  <!-- QUESTION 6 -->
  <g class="interactive" data-card="question-6" tabindex="0" role="button" aria-label="Question 6 — la propriété de l'élève — détails">
    <rect x="60" y="636" width="480" height="68" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="82" y="660" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579">QUESTION 6 · LE PRÉALABLE</text>
    <text x="82" y="686" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Qui possède l'élève une fois qu'il tourne ?</text>
  </g>
  <line x1="544" y1="670" x2="566" y2="670" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="interactive" data-card="issue-sans-proprietaire" tabindex="0" role="button" aria-label="Issue — pas de propriétaire nommé — détails">
    <rect x="580" y="636" width="560" height="68" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.25"/>
    <text x="600" y="660" class="mono" font-size="9.5" letter-spacing="1.5" fill="#B7332C">SI PERSONNE → NE PAS DISTILLER</text>
    <text x="600" y="680" class="body" font-size="11.5" fill="#5A5A5A">Un modèle sans propriétaire nommé est une dette : il faut quelqu'un pour la</text>
    <text x="600" y="696" class="body" font-size="11.5" fill="#5A5A5A">revalidation, la surveillance de dérive et la re-distillation.</text>
  </g>

  <!-- SPINE VERTICALE -->
  <line x1="300" y1="284" x2="300" y2="294" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <line x1="300" y1="368" x2="300" y2="378" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <line x1="300" y1="452" x2="300" y2="462" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <line x1="300" y1="536" x2="300" y2="546" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <line x1="300" y1="620" x2="300" y2="630" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <line x1="300" y1="704" x2="300" y2="722" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-ink)"/>

  <!-- ISSUE FINALE -->
  <g class="interactive" data-card="issue-distiller" tabindex="0" role="button" aria-label="Issue — distiller — détails">
    <rect x="60" y="736" width="1080" height="116" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <text x="80" y="762" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">SI OUI AUX SIX → DISTILLER</text>
    <text x="80" y="792" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Distiller — et provisionner dès le cadrage ce que la distillation laisse derrière elle.</text>
    <text x="80" y="818" class="body" font-size="12.5" fill="#5A5A5A">L'hébergement, la surveillance de dérive, la cadence de revalidation et la re-distillation à la disparition du professeur ne sont pas des coûts d'exploitation :</text>
    <text x="80" y="837" class="body" font-size="12.5" fill="#5A5A5A">ce sont les conditions de validité de la décision qu'on vient de prendre. Les omettre revient à répondre non à la question 6 sans le dire.</text>
  </g>

  <line x1="60" y1="882" x2="1140" y2="882" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="902" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">GRILLE DE DÉCISION : CONSTRUCTION DE L'AUTEUR, ADOSSÉE AUX SCHÉMAS 2, 3 ET 5 · SOURCES [1] [2] [14]</text>
</svg>
