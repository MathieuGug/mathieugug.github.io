<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" role="img" aria-label="Carte des permissions par type de modèle professeur, et obligations qui en découlent">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>

  <rect x="0" y="0" width="1200" height="970" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 05 · LE DROIT D'USAGE</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">La question n'est pas « puis-je distiller » — c'est <tspan font-style="italic">que puis-je faire du résultat</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Le professeur légitime d'une distillation d'entreprise est un modèle à poids ouverts, ou un modèle qu'on a acheté le droit de distiller.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">CE QUE CHAQUE TYPE DE PROFESSEUR AUTORISE</text>

  <!-- EN-TÊTES DE COLONNE -->
  <text x="60" y="246" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579">TYPE DE PROFESSEUR</text>
  <text x="420" y="230" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579" text-anchor="middle">DISTILLER</text>
  <text x="420" y="246" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579" text-anchor="middle">POUR SOI</text>
  <text x="570" y="230" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579" text-anchor="middle">SORTIR AVEC</text>
  <text x="570" y="246" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579" text-anchor="middle">LE RÉSULTAT</text>
  <text x="725" y="230" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579" text-anchor="middle">REDISTRIBUER</text>
  <text x="725" y="246" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579" text-anchor="middle">L'ÉLÈVE</text>
  <text x="800" y="246" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8A8579">L'OBLIGATION PRINCIPALE</text>

  <line x1="60" y1="258" x2="1140" y2="258" stroke="#1A1A1A" stroke-width="1.25"/>

  <!-- LIGNE 1 — INTERFACE FERMÉE -->
  <g class="interactive" data-card="permis-api-fermee" tabindex="0" role="button" aria-label="Interface fermée — détails">
    <rect x="60" y="258" width="1080" height="74" fill="#F6E7E3"/>
    <text x="80" y="292" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Interface fermée</text>
    <text x="80" y="314" class="mono" font-size="9.5" letter-spacing="1.2" fill="#8A8579">OPENAI · ANTHROPIC · MISTRAL · XAI</text>
    <text x="420" y="292" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="420" y="311" class="body" font-size="10.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">dans la plateforme</text>
    <text x="570" y="292" class="mono" font-size="13" font-weight="600" fill="#B7332C" text-anchor="middle">NON</text>
    <text x="570" y="311" class="body" font-size="10.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">clause contractuelle</text>
    <text x="725" y="292" class="mono" font-size="13" font-weight="600" fill="#B7332C" text-anchor="middle">NON</text>
    <text x="800" y="288" class="body" font-size="11.5" fill="#1A1A1A">Interdiction d'entraîner un modèle concurrent sur les</text>
    <text x="800" y="306" class="body" font-size="11.5" fill="#1A1A1A">sorties. Détection active, sanction immédiate. [4]</text>
  </g>
  <line x1="60" y1="332" x2="1140" y2="332" stroke="#E5E1D8" stroke-width="1"/>

  <!-- LIGNE 2 — APACHE 2.0 -->
  <g class="interactive" data-card="permis-apache" tabindex="0" role="button" aria-label="Poids ouverts sous Apache 2.0 — détails">
    <text x="80" y="366" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Apache 2.0</text>
    <text x="80" y="388" class="mono" font-size="9.5" letter-spacing="1.2" fill="#8A8579">POIDS OUVERTS · FAMILLE QWEN</text>
    <text x="420" y="366" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="570" y="366" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="725" y="366" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="800" y="362" class="body" font-size="11.5" fill="#5A5A5A">Aucune obligation de nommage du modèle dérivé.</text>
    <text x="800" y="380" class="body" font-size="11.5" fill="#5A5A5A">Le régime le plus simple à porter en production.</text>
  </g>
  <line x1="60" y1="406" x2="1140" y2="406" stroke="#E5E1D8" stroke-width="1"/>

  <!-- LIGNE 3 — LICENCE COMMUNAUTAIRE -->
  <g class="interactive" data-card="permis-communautaire" tabindex="0" role="button" aria-label="Poids ouverts sous licence communautaire — détails">
    <text x="80" y="440" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Licence communautaire</text>
    <text x="80" y="462" class="mono" font-size="9.5" letter-spacing="1.2" fill="#8A8579">POIDS OUVERTS · FAMILLE LLAMA</text>
    <text x="420" y="440" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="570" y="440" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="725" y="440" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="725" y="459" class="body" font-size="10.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">sous conditions</text>
    <text x="800" y="436" class="body" font-size="11.5" fill="#5A5A5A">Nommage imposé du modèle dérivé, politique d'usage</text>
    <text x="800" y="454" class="body" font-size="11.5" fill="#5A5A5A">acceptable, seuil d'utilisateurs, clauses régionales.</text>
  </g>
  <line x1="60" y1="480" x2="1140" y2="480" stroke="#E5E1D8" stroke-width="1"/>

  <!-- LIGNE 4 — MIT -->
  <g class="interactive" data-card="permis-mit" tabindex="0" role="button" aria-label="Poids ouverts sous licence MIT — détails">
    <text x="80" y="514" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Licence MIT</text>
    <text x="80" y="536" class="mono" font-size="9.5" letter-spacing="1.2" fill="#8A8579">POIDS OUVERTS · DEEPSEEK</text>
    <text x="420" y="514" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="570" y="514" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="725" y="514" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="800" y="510" class="body" font-size="11.5" fill="#5A5A5A">La plus permissive du tableau : la distillation vers</text>
    <text x="800" y="528" class="body" font-size="11.5" fill="#5A5A5A">d'autres modèles y est explicitement autorisée.</text>
  </g>
  <line x1="60" y1="554" x2="1140" y2="554" stroke="#E5E1D8" stroke-width="1"/>

  <!-- LIGNE 5 — MODÈLE PROPRE -->
  <g class="interactive" data-card="permis-propre" tabindex="0" role="button" aria-label="Modèle entraîné en propre — détails">
    <text x="80" y="588" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Modèle entraîné en propre</text>
    <text x="80" y="610" class="mono" font-size="9.5" letter-spacing="1.2" fill="#8A8579">AUCUN TIERS DANS LA CHAÎNE</text>
    <text x="420" y="588" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="570" y="588" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="725" y="588" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">OUI</text>
    <text x="800" y="584" class="body" font-size="11.5" fill="#5A5A5A">Aucune — mais il a fallu l'entraîner, ce qui est</text>
    <text x="800" y="602" class="body" font-size="11.5" fill="#5A5A5A">précisément la dépense qu'on cherchait à éviter.</text>
  </g>
  <line x1="60" y1="628" x2="1140" y2="628" stroke="#1A1A1A" stroke-width="1.25"/>

  <!-- BANDEAU A — LICENCE DE L'ÉLÈVE -->
  <g class="interactive" data-card="licence-elve" tabindex="0" role="button" aria-label="La licence de l'élève est celle de sa base — détails">
    <rect x="60" y="668" width="1080" height="112" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="694" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LE PIÈGE LE PLUS SOUVENT MANQUÉ</text>
    <text x="80" y="724" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La licence qui s'applique au modèle distillé est celle du modèle de base de l'élève — pas celle du professeur.</text>
    <text x="80" y="750" class="body" font-size="12.5" fill="#5A5A5A">Les versions distillées de R1 fondées sur Qwen héritent d'Apache 2.0 ; celles fondées sur Llama héritent de la licence communautaire Llama, avec ses obligations propres.</text>
    <text x="80" y="769" class="body" font-size="12.5" fill="#5A5A5A">Le choix de la base de l'élève est donc un choix contractuel autant qu'un choix de performance — et il se fait au premier jour du projet.</text>
  </g>

  <!-- BANDEAU B — AI ACT -->
  <g class="interactive" data-card="ai-act-25" tabindex="0" role="button" aria-label="Article 25 du règlement européen sur l'IA — détails">
    <rect x="60" y="800" width="1080" height="112" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="80" y="826" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">L'ÉTAGE RÉGLEMENTAIRE — RÈGLEMENT (UE) 2024/1689, ARTICLE 25</text>
    <text x="80" y="856" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Modifier un modèle peut faire basculer un déployeur dans le régime d'obligations du fournisseur.</text>
    <text x="80" y="882" class="body" font-size="12.5" fill="#5A5A5A">Lignes directrices de la Commission, juillet 2025 : une modification mobilisant au moins un tiers du calcul d'origine est présumée substantielle [17].</text>
    <text x="80" y="901" class="body" font-size="12.5" fill="#5A5A5A">Une distillation d'entreprise reste très en deçà — mais une modification plus légère peut suffire si elle change les capacités ou le profil de risque [16].</text>
  </g>

  <line x1="60" y1="932" x2="1140" y2="932" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="952" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">SOURCES [4] [7] [16] [17] · LECTURE DES LICENCES ET DES CONDITIONS D'UTILISATION PAR L'AUTEUR — NE CONSTITUE PAS UN AVIS JURIDIQUE</text>
</svg>
