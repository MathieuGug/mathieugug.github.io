<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Quatre leviers de spécialisation d'un cas d'usage, rangés par réversibilité décroissante">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 01 · LES LEVIERS</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Quatre leviers, et un <tspan font-style="italic">ordre d'essai</tspan> qui est une décision budgétaire.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Ce qui les sépare n'est pas la performance obtenue, c'est ce qu'ils déplacent et ce qu'ils laissent derrière eux.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">DU PLUS RÉVERSIBLE AU PLUS PATRIMONIAL</text>

  <!-- LEVIER 1 -->
  <g class="interactive" data-card="levier-invite" tabindex="0" role="button" aria-label="Le levier de l'invite — détails">
    <rect x="60" y="216" width="249" height="336" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="78" y="246" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LEVIER 1</text>
    <text x="78" y="280" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'invite</text>
    <text x="78" y="316" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'ON DÉPLACE</text>
    <text x="78" y="336" class="body" font-size="11.5" fill="#5A5A5A">L'instruction donnée au</text>
    <text x="78" y="352" class="body" font-size="11.5" fill="#5A5A5A">modèle, à l'exécution.</text>
    <text x="78" y="388" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'IL FAUT POSSÉDER</text>
    <text x="78" y="408" class="body" font-size="11.5" fill="#1A1A1A">Rien, sinon un accès</text>
    <text x="78" y="424" class="body" font-size="11.5" fill="#1A1A1A">au modèle.</text>
    <text x="78" y="460" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">SE DÉFAIT EN</text>
    <text x="78" y="482" class="mono" font-size="14" font-weight="500" fill="#B7332C">quelques heures</text>
    <text x="78" y="522" class="body" font-size="11" font-style="italic" fill="#8A8579">Le premier essai, toujours.</text>
  </g>

  <!-- LEVIER 2 -->
  <g class="interactive" data-card="levier-recuperation" tabindex="0" role="button" aria-label="Le levier de la récupération — détails">
    <rect x="337" y="216" width="249" height="336" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="355" y="246" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LEVIER 2</text>
    <text x="355" y="280" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La récupération</text>
    <text x="355" y="316" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'ON DÉPLACE</text>
    <text x="355" y="336" class="body" font-size="11.5" fill="#5A5A5A">Le contexte injecté dans</text>
    <text x="355" y="352" class="body" font-size="11.5" fill="#5A5A5A">la fenêtre à chaque appel.</text>
    <text x="355" y="388" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'IL FAUT POSSÉDER</text>
    <text x="355" y="408" class="body" font-size="11.5" fill="#1A1A1A">Un corpus indexé et</text>
    <text x="355" y="424" class="body" font-size="11.5" fill="#1A1A1A">tenu à jour.</text>
    <text x="355" y="460" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">SE DÉFAIT EN</text>
    <text x="355" y="482" class="mono" font-size="14" font-weight="500" fill="#B7332C">quelques jours</text>
    <text x="355" y="522" class="body" font-size="11" font-style="italic" fill="#8A8579">Répond à « le modèle ignore ».</text>
  </g>

  <!-- LEVIER 3 -->
  <g class="interactive" data-card="levier-reglage-fin" tabindex="0" role="button" aria-label="Le levier du réglage fin sur étiquettes humaines — détails">
    <rect x="614" y="216" width="249" height="336" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="632" y="246" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LEVIER 3</text>
    <text x="632" y="280" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le réglage fin</text>
    <text x="632" y="316" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'ON DÉPLACE</text>
    <text x="632" y="336" class="body" font-size="11.5" fill="#5A5A5A">Les poids, à partir</text>
    <text x="632" y="352" class="body" font-size="11.5" fill="#5A5A5A">d'étiquettes humaines.</text>
    <text x="632" y="388" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'IL FAUT POSSÉDER</text>
    <text x="632" y="408" class="body" font-size="11.5" fill="#1A1A1A">Un corpus annoté par</text>
    <text x="632" y="424" class="body" font-size="11.5" fill="#1A1A1A">des experts métier.</text>
    <text x="632" y="460" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">SE DÉFAIT EN</text>
    <text x="632" y="482" class="mono" font-size="14" font-weight="500" fill="#B7332C">on ne le défait pas</text>
    <text x="632" y="522" class="body" font-size="11" font-style="italic" fill="#8A8579">Coûteux en temps d'expert.</text>
  </g>

  <!-- LEVIER 4 -->
  <g class="interactive" data-card="levier-distillation" tabindex="0" role="button" aria-label="Le levier de la distillation — détails">
    <rect x="891" y="216" width="249" height="336" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="909" y="246" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LEVIER 4</text>
    <text x="909" y="280" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La distillation</text>
    <text x="909" y="316" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'ON DÉPLACE</text>
    <text x="909" y="336" class="body" font-size="11.5" fill="#5A5A5A">Les poids, à partir</text>
    <text x="909" y="352" class="body" font-size="11.5" fill="#5A5A5A">d'étiquettes produites</text>
    <text x="909" y="368" class="body" font-size="11.5" fill="#5A5A5A">par un autre modèle.</text>
    <text x="909" y="388" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'IL FAUT POSSÉDER</text>
    <text x="909" y="408" class="body" font-size="11.5" fill="#1A1A1A">Un professeur autorisé</text>
    <text x="909" y="424" class="body" font-size="11.5" fill="#1A1A1A">et un jeu d'évaluation.</text>
    <text x="909" y="460" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">SE DÉFAIT EN</text>
    <text x="909" y="482" class="mono" font-size="14" font-weight="500" fill="#B7332C">on ne le défait pas</text>
    <text x="909" y="522" class="body" font-size="11" font-style="italic" fill="#8A8579">Le seul levier dont l'entrée</text>
    <text x="909" y="538" class="body" font-size="11" font-style="italic" fill="#8A8579">est un autre modèle.</text>
  </g>

  <!-- AXE -->
  <line x1="60" y1="586" x2="1130" y2="586" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="184" y1="580" x2="184" y2="592" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="461" y1="580" x2="461" y2="592" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="738" y1="580" x2="738" y2="592" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="1015" y1="580" x2="1015" y2="592" stroke="#1A1A1A" stroke-width="1"/>
  <text x="60" y="612" class="mono" font-size="10.5" letter-spacing="1.5" fill="#5A5A5A">SE DÉFAIT EN UNE JOURNÉE</text>
  <text x="1130" y="612" class="mono" font-size="10.5" letter-spacing="1.5" fill="#5A5A5A" text-anchor="end">PRODUIT UN OBJET À MAINTENIR</text>

  <!-- BANDEAU QUANTIFICATION -->
  <g class="interactive" data-card="pas-un-levier" tabindex="0" role="button" aria-label="Ce qui n'est pas un levier de spécialisation — détails">
    <rect x="60" y="640" width="1080" height="106" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25" stroke-dasharray="5 3"/>
    <text x="80" y="666" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">CE QUI N'EST PAS UN LEVIER DE SPÉCIALISATION</text>
    <text x="80" y="696" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La quantification rend un modèle moins cher à servir — elle ne change rien à ce qu'il sait.</text>
    <text x="80" y="722" class="body" font-size="12.5" fill="#5A5A5A">Elle réduit la précision numérique des poids d'un modèle donné. Elle s'applique après, à l'élève comme au professeur, et se compose avec les quatre leviers.</text>
    <text x="80" y="740" class="body" font-size="12.5" fill="#5A5A5A">La confondre avec la distillation conduit à l'erreur de cadrage la plus fréquente : croire qu'on peut rétrécir un modèle frontière par un réglage d'infrastructure.</text>
  </g>

  <line x1="60" y1="766" x2="1140" y2="766" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="786" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">ORDONNANCEMENT ET DÉLAIS : LECTURE DE L'AUTEUR · DISTINCTION RÉGLAGE FIN / DISTILLATION D'APRÈS SOURCE [5]</text>
</svg>
