<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" role="img" aria-label="Cinq modes de rupture d'une distillation, avec le signal qui les révèle et la parade correspondante">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>

  <rect x="0" y="0" width="1200" height="890" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 04 · LES RUPTURES</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Les échecs de distillation sont <tspan font-style="italic">silencieux</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Le modèle répond, ses réponses sont plausibles, et la dégradation ne se voit que sur une mesure qu'on n'a pas forcément mise en place.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <!-- LÉGENDE -->
  <rect x="60" y="186" width="6" height="14" fill="#1A1A1A"/>
  <text x="76" y="197" class="mono" font-size="10" letter-spacing="1.2" fill="#5A5A5A">CE QUE LA MESURE ATTRAPE</text>
  <rect x="290" y="186" width="6" height="14" fill="#B7332C"/>
  <text x="306" y="197" class="mono" font-size="10" letter-spacing="1.2" fill="#5A5A5A">CE QUE SEULE UNE DÉCISION DE GOUVERNANCE ATTRAPE</text>

  <!-- RUPTURE 01 -->
  <g class="interactive" data-card="rupture-capacite" tabindex="0" role="button" aria-label="L'écart de capacité — détails">
    <rect x="60" y="216" width="1080" height="110" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="60" y="216" width="6" height="110" fill="#1A1A1A"/>
    <text x="84" y="248" class="mono" font-size="12" font-weight="600" letter-spacing="1.5" fill="#B7332C">01</text>
    <text x="84" y="276" class="display" font-size="17" font-weight="600" fill="#1A1A1A">L'écart de capacité</text>
    <text x="84" y="300" class="body" font-size="11.5" font-style="italic" fill="#8A8579">le professeur trop fort</text>
    <text x="384" y="246" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QUI SE PASSE</text>
    <text x="384" y="268" class="body" font-size="11.5" fill="#5A5A5A">Au-delà d'un certain écart de capacité, un professeur</text>
    <text x="384" y="286" class="body" font-size="11.5" fill="#5A5A5A">plus fort produit un élève moins bon : la fonction à</text>
    <text x="384" y="304" class="body" font-size="11.5" fill="#5A5A5A">reproduire dépasse ce que l'élève peut représenter.</text>
    <text x="720" y="246" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">LE SIGNAL QUI LE RÉVÈLE</text>
    <text x="720" y="268" class="body" font-size="11.5" fill="#1A1A1A">L'élève plafonne alors qu'un</text>
    <text x="720" y="286" class="body" font-size="11.5" fill="#1A1A1A">professeur plus faible faisait</text>
    <text x="720" y="304" class="body" font-size="11.5" fill="#1A1A1A">mieux au même budget.</text>
    <text x="946" y="246" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">LA PARADE</text>
    <text x="946" y="268" class="body" font-size="11.5" fill="#5A5A5A">Calibrer le professeur sur</text>
    <text x="946" y="286" class="body" font-size="11.5" fill="#5A5A5A">la taille de l'élève, pas</text>
    <text x="946" y="304" class="body" font-size="11.5" fill="#5A5A5A">sur son classement. [14]</text>
  </g>

  <!-- RUPTURE 02 -->
  <g class="interactive" data-card="rupture-derive" tabindex="0" role="button" aria-label="La dérive de distribution — détails">
    <rect x="60" y="338" width="1080" height="110" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="60" y="338" width="6" height="110" fill="#1A1A1A"/>
    <text x="84" y="370" class="mono" font-size="12" font-weight="600" letter-spacing="1.5" fill="#B7332C">02</text>
    <text x="84" y="398" class="display" font-size="17" font-weight="600" fill="#1A1A1A">La dérive de distribution</text>
    <text x="84" y="422" class="body" font-size="11.5" font-style="italic" fill="#8A8579">l'élève hors de son corpus</text>
    <text x="384" y="368" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QUI SE PASSE</text>
    <text x="384" y="390" class="body" font-size="11.5" fill="#5A5A5A">L'élève n'a vu que des phrases écrites par le</text>
    <text x="384" y="408" class="body" font-size="11.5" fill="#5A5A5A">professeur ; dès qu'il s'écarte, il se trouve dans un</text>
    <text x="384" y="426" class="body" font-size="11.5" fill="#5A5A5A">état qu'aucun exemple ne couvre, et l'erreur se compose.</text>
    <text x="720" y="368" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">LE SIGNAL QUI LE RÉVÈLE</text>
    <text x="720" y="390" class="body" font-size="11.5" fill="#1A1A1A">Bon en évaluation hors ligne,</text>
    <text x="720" y="408" class="body" font-size="11.5" fill="#1A1A1A">mauvais sur les trajectoires</text>
    <text x="720" y="426" class="body" font-size="11.5" fill="#1A1A1A">longues et les appels d'outils.</text>
    <text x="946" y="368" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">LA PARADE</text>
    <text x="946" y="390" class="body" font-size="11.5" fill="#5A5A5A">Passer à la distillation</text>
    <text x="946" y="408" class="body" font-size="11.5" fill="#5A5A5A">sur-politique — méthode C</text>
    <text x="946" y="426" class="body" font-size="11.5" fill="#5A5A5A">du schéma 2.</text>
  </g>

  <!-- RUPTURE 03 -->
  <g class="interactive" data-card="rupture-retrecissement" tabindex="0" role="button" aria-label="Le rétrécissement — détails">
    <rect x="60" y="460" width="1080" height="110" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
    <rect x="60" y="460" width="6" height="110" fill="#B7332C"/>
    <text x="84" y="492" class="mono" font-size="12" font-weight="600" letter-spacing="1.5" fill="#B7332C">03</text>
    <text x="84" y="520" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Le rétrécissement</text>
    <text x="84" y="544" class="body" font-size="11.5" font-style="italic" fill="#8A8579">l'élève ne sait plus que ça</text>
    <text x="384" y="490" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QUI SE PASSE</text>
    <text x="384" y="512" class="body" font-size="11.5" fill="#5A5A5A">Un réglage fin sur une distribution étroite tire les</text>
    <text x="384" y="530" class="body" font-size="11.5" fill="#5A5A5A">paramètres hors des optima antérieurs. L'élève devient</text>
    <text x="384" y="548" class="body" font-size="11.5" fill="#5A5A5A">excellent sur la tâche et perd ce qu'on ne testait pas.</text>
    <text x="720" y="490" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">LE SIGNAL QUI LE RÉVÈLE</text>
    <text x="720" y="512" class="body" font-size="11.5" fill="#1A1A1A">Aucun — sauf si le jeu</text>
    <text x="720" y="530" class="body" font-size="11.5" fill="#1A1A1A">d'évaluation couvre aussi les</text>
    <text x="720" y="548" class="body" font-size="11.5" fill="#1A1A1A">usages non ciblés.</text>
    <text x="946" y="490" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">LA PARADE</text>
    <text x="946" y="512" class="body" font-size="11.5" fill="#5A5A5A">Décider du périmètre de la</text>
    <text x="946" y="530" class="body" font-size="11.5" fill="#5A5A5A">recette avant de distiller,</text>
    <text x="946" y="548" class="body" font-size="11.5" fill="#5A5A5A">pas après l'incident.</text>
  </g>

  <!-- RUPTURE 04 -->
  <g class="interactive" data-card="rupture-signal-bruite" tabindex="0" role="button" aria-label="Le signal bruité — détails">
    <rect x="60" y="582" width="1080" height="110" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="60" y="582" width="6" height="110" fill="#1A1A1A"/>
    <text x="84" y="614" class="mono" font-size="12" font-weight="600" letter-spacing="1.5" fill="#B7332C">04</text>
    <text x="84" y="642" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Le signal bruité</text>
    <text x="84" y="666" class="body" font-size="11.5" font-style="italic" fill="#8A8579">là où l'élève a déjà raison</text>
    <text x="384" y="612" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QUI SE PASSE</text>
    <text x="384" y="634" class="body" font-size="11.5" fill="#5A5A5A">La correspondance entre le signal du professeur et le</text>
    <text x="384" y="652" class="body" font-size="11.5" fill="#5A5A5A">signal idéal est bien meilleure sur les productions</text>
    <text x="384" y="670" class="body" font-size="11.5" fill="#5A5A5A">incorrectes de l'élève que sur les correctes.</text>
    <text x="720" y="612" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">LE SIGNAL QUI LE RÉVÈLE</text>
    <text x="720" y="634" class="body" font-size="11.5" fill="#1A1A1A">Le gain plafonne, puis régresse</text>
    <text x="720" y="652" class="body" font-size="11.5" fill="#1A1A1A">en fin d'entraînement.</text>
    <text x="946" y="612" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">LA PARADE</text>
    <text x="946" y="634" class="body" font-size="11.5" fill="#5A5A5A">Aucune recette n'est</text>
    <text x="946" y="652" class="body" font-size="11.5" fill="#5A5A5A">transférable d'un cas à</text>
    <text x="946" y="670" class="body" font-size="11.5" fill="#5A5A5A">l'autre : mesurer. [15]</text>
  </g>

  <!-- RUPTURE 05 -->
  <g class="interactive" data-card="rupture-peremption" tabindex="0" role="button" aria-label="La péremption du professeur — détails">
    <rect x="60" y="704" width="1080" height="110" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="60" y="704" width="6" height="110" fill="#B7332C"/>
    <text x="84" y="736" class="mono" font-size="12" font-weight="600" letter-spacing="1.5" fill="#B7332C">05</text>
    <text x="84" y="764" class="display" font-size="17" font-weight="600" fill="#1A1A1A">La péremption du professeur</text>
    <text x="84" y="788" class="body" font-size="11.5" font-style="italic" fill="#8A8579">l'instantané qui vieillit</text>
    <text x="384" y="734" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QUI SE PASSE</text>
    <text x="384" y="756" class="body" font-size="11.5" fill="#5A5A5A">Le modèle qui a servi de référence est retiré du</text>
    <text x="384" y="774" class="body" font-size="11.5" fill="#5A5A5A">catalogue. Les préavis publiés sont d'au moins six mois,</text>
    <text x="384" y="792" class="body" font-size="11.5" fill="#5A5A5A">trois pour les variantes spécialisées.</text>
    <text x="720" y="734" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">LE SIGNAL QUI LE RÉVÈLE</text>
    <text x="720" y="756" class="body" font-size="11.5" fill="#1A1A1A">Aucun. Le modèle continue de</text>
    <text x="720" y="774" class="body" font-size="11.5" fill="#1A1A1A">fonctionner, et l'écart avec</text>
    <text x="720" y="792" class="body" font-size="11.5" fill="#1A1A1A">l'état de l'art se creuse.</text>
    <text x="946" y="734" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">LA PARADE</text>
    <text x="946" y="756" class="body" font-size="11.5" fill="#5A5A5A">Un propriétaire nommé, une</text>
    <text x="946" y="774" class="body" font-size="11.5" fill="#5A5A5A">cadence de re-distillation,</text>
    <text x="946" y="792" class="body" font-size="11.5" fill="#5A5A5A">une veille de cycle de vie. [3]</text>
  </g>

  <line x1="60" y1="846" x2="1140" y2="846" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="866" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">SOURCES [3] [14] [15] · TYPOLOGIE ET RÉPARTITION MESURE / GOUVERNANCE : LECTURE DE L'AUTEUR</text>
</svg>
