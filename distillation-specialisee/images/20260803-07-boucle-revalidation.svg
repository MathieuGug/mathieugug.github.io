<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-label="Architecture hétérogène et boucle de revalidation, avec le jeu d'évaluation comme point fixe">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-emph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="920" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 07 · LE DISPOSITIF</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Le modèle se périme. Le <tspan font-style="italic">jeu d'évaluation</tspan> reste.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">La seule pièce du dispositif qu'une organisation ne peut pas acheter — et la seule qui survive quand les autres changent.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <!-- PARTIE A -->
  <text x="60" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">A · L'ARCHITECTURE CESSE D'ÊTRE HOMOGÈNE</text>

  <!-- ENTRÉE -->
  <rect x="60" y="300" width="170" height="70" rx="3" fill="#F2EFE7" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="145" y="330" class="mono" font-size="10" letter-spacing="1.5" fill="#8A8579" text-anchor="middle">EN ENTRÉE</text>
  <text x="145" y="352" class="display" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">Un appel</text>

  <line x1="234" y1="335" x2="266" y2="335" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ROUTAGE -->
  <g class="interactive" data-card="routage" tabindex="0" role="button" aria-label="Le routage — détails">
    <rect x="280" y="300" width="170" height="70" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="365" y="330" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C" text-anchor="middle">LA DÉCISION AJOUTÉE</text>
    <text x="365" y="352" class="display" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">Le routage</text>
  </g>

  <!-- BRANCHE HAUTE -->
  <line x1="454" y1="322" x2="546" y2="266" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="288" class="mono" font-size="9.5" letter-spacing="1.2" fill="#8A8579">DÉCIDER</text>

  <!-- BRANCHE BASSE -->
  <line x1="454" y1="352" x2="546" y2="424" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="398" class="mono" font-size="9.5" letter-spacing="1.2" fill="#8A8579">EXÉCUTER</text>

  <!-- GÉNÉRALISTE -->
  <g class="interactive" data-card="generaliste" tabindex="0" role="button" aria-label="Le modèle généraliste — détails">
    <rect x="560" y="216" width="300" height="104" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="580" y="242" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LA MINORITÉ DES APPELS</text>
    <text x="580" y="268" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Le modèle généraliste</text>
    <text x="580" y="290" class="body" font-size="11.5" fill="#5A5A5A">Réservé aux moments où il faut décider,</text>
    <text x="580" y="306" class="body" font-size="11.5" fill="#5A5A5A">planifier, ou sortir du cadre.</text>
  </g>

  <!-- ÉLÈVES -->
  <g class="interactive" data-card="eleves-specialises" tabindex="0" role="button" aria-label="Les élèves spécialisés — détails">
    <rect x="560" y="336" width="300" height="188" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="580" y="362" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LA GRANDE MAJORITÉ DES APPELS</text>
    <text x="580" y="388" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Les élèves spécialisés</text>
    <line x1="580" y1="402" x2="840" y2="402" stroke="#E0C9C2" stroke-width="1"/>
    <text x="580" y="424" class="body" font-size="12" fill="#1A1A1A">Extraire un champ d'un document.</text>
    <text x="580" y="448" class="body" font-size="12" fill="#1A1A1A">Classer, router, reformuler une requête.</text>
    <text x="580" y="472" class="body" font-size="12" fill="#1A1A1A">Choisir un outil, formater une sortie.</text>
    <line x1="580" y1="488" x2="840" y2="488" stroke="#E0C9C2" stroke-width="1"/>
    <text x="580" y="510" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Tâches répétitives, contraintes, étroites [2].</text>
  </g>

  <!-- SORTIE -->
  <line x1="864" y1="266" x2="906" y2="316" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="864" y1="424" x2="906" y2="356" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="920" y="300" width="180" height="70" rx="3" fill="#F2EFE7" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="1010" y="330" class="mono" font-size="10" letter-spacing="1.5" fill="#8A8579" text-anchor="middle">EN SORTIE</text>
  <text x="1010" y="352" class="display" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">Une réponse</text>

  <!-- NOTE ARCHITECTURE -->
  <g class="interactive" data-card="cout-du-routage" tabindex="0" role="button" aria-label="Ce que l'architecture hétérogène présuppose — détails">
    <rect x="60" y="410" width="390" height="114" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25" stroke-dasharray="5 3"/>
    <text x="80" y="436" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">CE QUE ÇA PRÉSUPPOSE</text>
    <text x="80" y="460" class="body" font-size="12" fill="#5A5A5A">Un système hétérogène demande une décision</text>
    <text x="80" y="478" class="body" font-size="12" fill="#5A5A5A">explicite sur quel appel va où — documentée,</text>
    <text x="80" y="496" class="body" font-size="12" fill="#5A5A5A">mesurée, révisable — et donc une instrumentation</text>
    <text x="80" y="514" class="body" font-size="12" fill="#5A5A5A">par appel qui, souvent, n'existe pas encore.</text>
  </g>

  <line x1="60" y1="556" x2="1140" y2="556" stroke="#E5E1D8" stroke-width="1"/>

  <!-- PARTIE B -->
  <text x="60" y="592" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">B · LA BOUCLE — ET SON POINT FIXE</text>

  <!-- RETOUR -->
  <path d="M 1020 616 L 1020 596 L 180 596 L 180 602" fill="none" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-emph)"/>
  <text x="600" y="590" class="mono" font-size="9.5" letter-spacing="1.2" fill="#B7332C" text-anchor="middle">RE-DISTILLATION</text>

  <!-- ÉTAPES -->
  <g class="interactive" data-card="etape-professeur" tabindex="0" role="button" aria-label="Étape 1 — le professeur choisi — détails">
    <rect x="60" y="616" width="240" height="80" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="640" class="mono" font-size="9.5" letter-spacing="1.5" fill="#B7332C">ÉTAPE 1</text>
    <text x="80" y="664" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Le professeur</text>
    <text x="80" y="684" class="body" font-size="11.5" fill="#5A5A5A">Calibré, autorisé, daté.</text>
  </g>
  <line x1="304" y1="656" x2="326" y2="656" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="interactive" data-card="etape-eleve" tabindex="0" role="button" aria-label="Étape 2 — l'élève distillé — détails">
    <rect x="340" y="616" width="240" height="80" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="360" y="640" class="mono" font-size="9.5" letter-spacing="1.5" fill="#B7332C">ÉTAPE 2</text>
    <text x="360" y="664" class="display" font-size="16" font-weight="600" fill="#1A1A1A">L'élève distillé</text>
    <text x="360" y="684" class="body" font-size="11.5" fill="#5A5A5A">Validé, ou refusé.</text>
  </g>
  <line x1="584" y1="656" x2="606" y2="656" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="interactive" data-card="etape-production" tabindex="0" role="button" aria-label="Étape 3 — la mise en production — détails">
    <rect x="620" y="616" width="240" height="80" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="640" y="640" class="mono" font-size="9.5" letter-spacing="1.5" fill="#B7332C">ÉTAPE 3</text>
    <text x="640" y="664" class="display" font-size="16" font-weight="600" fill="#1A1A1A">La production</text>
    <text x="640" y="684" class="body" font-size="11.5" fill="#5A5A5A">Un propriétaire nommé.</text>
  </g>
  <line x1="864" y1="656" x2="886" y2="656" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="interactive" data-card="etape-derive" tabindex="0" role="button" aria-label="Étape 4 — la dérive mesurée — détails">
    <rect x="900" y="616" width="240" height="80" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="920" y="640" class="mono" font-size="9.5" letter-spacing="1.5" fill="#B7332C">ÉTAPE 4</text>
    <text x="920" y="664" class="display" font-size="16" font-weight="600" fill="#1A1A1A">La dérive mesurée</text>
    <text x="920" y="684" class="body" font-size="11.5" fill="#5A5A5A">À cadence fixée.</text>
  </g>

  <!-- CONNECTEURS VERS LE POINT FIXE -->
  <line x1="180" y1="696" x2="180" y2="744" stroke="#B7332C" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="460" y1="696" x2="460" y2="744" stroke="#B7332C" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="740" y1="696" x2="740" y2="744" stroke="#B7332C" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="1020" y1="696" x2="1020" y2="744" stroke="#B7332C" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- POINT FIXE -->
  <g class="interactive" data-card="point-fixe" tabindex="0" role="button" aria-label="Le jeu d'évaluation comme point fixe — détails">
    <rect x="60" y="744" width="1080" height="108" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="2"/>
    <text x="80" y="770" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LE POINT FIXE — CE QUI ALIMENTE LES QUATRE ÉTAPES</text>
    <text x="80" y="800" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le jeu d'évaluation n'est pas une étape du projet. C'est ce autour de quoi les autres tournent.</text>
    <text x="80" y="826" class="body" font-size="12.5" fill="#5A5A5A">Il valide un élève, mais aussi : arbitre entre deux fournisseurs, mesure une régression après changement de version, tranche un désaccord entre le métier et la technique,</text>
    <text x="80" y="845" class="body" font-size="12.5" fill="#5A5A5A">démontre à un contrôle que le système fait ce qu'on annonce. Il vaut indépendamment de la décision de distiller — c'est ce qui en fait un investissement sans regret.</text>
  </g>

  <line x1="60" y1="878" x2="1140" y2="878" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="898" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">SOURCE [2] POUR L'ARCHITECTURE HÉTÉROGÈNE · BOUCLE DE REVALIDATION ET THÈSE DU POINT FIXE : CONSTRUCTION DE L'AUTEUR</text>
</svg>
