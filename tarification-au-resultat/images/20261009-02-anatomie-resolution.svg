<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Chronologie d'une conversation facturée : la fenêtre de silence convertit une absence de signal en présomption de résolution, et trois trajectoires distinctes produisent le même enregistrement de facturation.">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect.hit { fill: #B7332C; fill-opacity: .05; }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5A5A5A" stroke-width="1.3"/>
    </marker>
    <marker id="a2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#B7332C" stroke-width="1.5"/>
    </marker>
    <marker id="a2t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1F5560" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="52" class="mono" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#B7332C">SCHÉMA 02</text>
  <text x="60" y="92" class="display" font-size="28" font-weight="600" fill="#1A1A1A" letter-spacing="-0.01em">Anatomie d'une résolution facturée</text>
  <text x="60" y="122" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le compteur ne mesure pas un succès : il mesure une absence de contestation pendant un délai.</text>
  <line x1="60" y1="144" x2="1140" y2="144" stroke="#E5E1D8" stroke-width="1"/>

  <!-- timeline axis -->
  <text x="60" y="186" class="mono" font-size="10.5" letter-spacing="0.14em" fill="#B8B5AE">CHRONOLOGIE D'UN ÉCHANGE</text>
  <line x1="92" y1="258" x2="1030" y2="258" stroke="#B8B5AE" stroke-width="1.25"/>
  <text x="1040" y="262" class="mono" font-size="10.5" fill="#B8B5AE">t</text>

  <!-- silence window band -->
  <g class="interactive" data-card="fenetre-silence" tabindex="0" role="button" aria-label="La fenêtre de silence — cliquez pour les détails">
    <rect class="hit" x="560" y="200" width="300" height="118" rx="3" fill="#B58A2C" fill-opacity="0.09" stroke="#B58A2C" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="710" y="222" class="mono" font-size="11" font-weight="600" letter-spacing="0.1em" fill="#B58A2C" text-anchor="middle">FENÊTRE DE SILENCE</text>
    <text x="710" y="300" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">24 h ou 72 h selon les relevés</text>
  </g>

  <!-- events -->
  <g class="interactive" data-card="ouverture" tabindex="0" role="button" aria-label="Ouverture de la conversation — cliquez pour les détails">
    <rect class="hit" x="92" y="206" width="130" height="104" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
    <circle cx="157" cy="258" r="7" fill="#1F5560"/>
    <text x="157" y="234" class="body" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">Ouverture</text>
    <text x="157" y="288" class="mono" font-size="10" fill="#1F5560" text-anchor="middle">NE FACTURE PAS</text>
  </g>

  <g class="interactive" data-card="echange" tabindex="0" role="button" aria-label="Les réponses de l'agent — cliquez pour les détails">
    <rect class="hit" x="250" y="206" width="180" height="104" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
    <circle cx="300" cy="258" r="5.5" fill="#1F5560"/>
    <circle cx="340" cy="258" r="5.5" fill="#1F5560"/>
    <circle cx="380" cy="258" r="5.5" fill="#1F5560"/>
    <text x="340" y="234" class="body" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">n réponses de l'agent</text>
    <text x="340" y="288" class="mono" font-size="10" fill="#1F5560" text-anchor="middle">FACTURE UNE SEULE FOIS</text>
  </g>

  <text x="470" y="244" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">dernier</text>
  <text x="470" y="262" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">message</text>
  <line x1="438" y1="258" x2="430" y2="258" stroke="#5A5A5A" stroke-width="0.75"/>
  <line x1="510" y1="258" x2="552" y2="258" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#a2)"/>

  <g class="interactive" data-card="presomption" tabindex="0" role="button" aria-label="La présomption de résolution — cliquez pour les détails">
    <rect class="hit" x="888" y="206" width="142" height="104" rx="3" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="2.5"/>
    <circle cx="959" cy="258" r="9" fill="#B7332C"/>
    <text x="959" y="232" class="body" font-size="12" font-weight="600" fill="#B7332C" text-anchor="middle">Résolution présumée</text>
    <text x="959" y="288" class="mono" font-size="10" font-weight="600" fill="#B7332C" text-anchor="middle">LIGNE DE FACTURE</text>
  </g>
  <line x1="862" y1="258" x2="880" y2="258" stroke="#B7332C" stroke-width="1.5" marker-end="url(#a2c)"/>

  <!-- three trajectories -->
  <line x1="60" y1="356" x2="1140" y2="356" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="392" class="mono" font-size="10.5" letter-spacing="0.14em" fill="#B8B5AE">TROIS TRAJECTOIRES, UN SEUL ENREGISTREMENT</text>

  <g class="interactive" data-card="trois-trajectoires" tabindex="0" role="button" aria-label="Les trois trajectoires indiscernables — cliquez pour les détails">
    <rect class="hit" x="60" y="408" width="700" height="188" rx="3" fill="#B7332C" fill-opacity="0.04" stroke="#B7332C" stroke-width="1.25"/>

    <circle cx="96" cy="444" r="9" fill="#2F5D3F"/>
    <text x="96" y="448" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">a</text>
    <text x="120" y="442" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Le client est servi et s'en va satisfait.</text>
    <text x="120" y="462" class="body" font-size="11" fill="#5A5A5A">Le seul cas où la facture correspond à ce qu'elle prétend mesurer.</text>

    <circle cx="96" cy="500" r="9" fill="#B58A2C"/>
    <text x="96" y="504" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">b</text>
    <text x="120" y="498" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Le client renonce et traite son problème ailleurs.</text>
    <text x="120" y="518" class="body" font-size="11" fill="#5A5A5A">Autre canal, panier abandonné, résiliation. Aucune trace chez le fournisseur.</text>

    <circle cx="96" cy="556" r="9" fill="#B7332C"/>
    <text x="96" y="560" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">c</text>
    <text x="120" y="554" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Le client reçoit une réponse fausse qu'il ne détecte pas.</text>
    <text x="120" y="574" class="body" font-size="11" fill="#5A5A5A">Il revient plus tard, hors fenêtre, avec un problème plus coûteux.</text>
  </g>

  <!-- escalade / reouverture -->
  <g class="interactive" data-card="escalade" tabindex="0" role="button" aria-label="L'escalade, échec déclaré — cliquez pour les détails">
    <rect class="hit" x="790" y="408" width="350" height="86" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
    <text x="818" y="438" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Escalade vers un humain</text>
    <text x="818" y="460" class="mono" font-size="10.5" fill="#1F5560">ÉCHEC DÉCLARÉ · NE FACTURE PAS</text>
    <text x="818" y="480" class="body" font-size="11" fill="#5A5A5A">La trace existe dans le système des deux parties.</text>
  </g>

  <g class="interactive" data-card="reouverture" tabindex="0" role="button" aria-label="La réouverture hors fenêtre — cliquez pour les détails">
    <rect class="hit" x="790" y="510" width="350" height="86" rx="3" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="1.25"/>
    <text x="818" y="540" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Réouverture hors fenêtre</text>
    <text x="818" y="562" class="mono" font-size="10.5" font-weight="600" fill="#B7332C">FACTURE UNE SECONDE FOIS</text>
    <text x="818" y="582" class="body" font-size="11" fill="#5A5A5A">Le premier échec a déjà été encaissé comme résolution.</text>
  </g>

  <line x1="760" y1="556" x2="782" y2="556" stroke="#B7332C" stroke-width="1.5" marker-end="url(#a2c)"/>
  <line x1="760" y1="451" x2="782" y2="451" stroke="#1F5560" stroke-width="1.4" marker-end="url(#a2t)"/>

  <!-- punchline -->
  <rect x="60" y="620" width="1080" height="86" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
  <circle cx="92" cy="650" r="9" fill="#B7332C"/>
  <text x="92" y="654" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
  <line x1="101" y1="650" x2="130" y2="650" stroke="#5A5A5A" stroke-width="0.75"/>
  <text x="136" y="648" class="body" font-size="12.5" fill="#1A1A1A">Un compteur qui facture le renoncement silencieux et exonère l'escalade déclarée rémunère la <tspan font-weight="600">discrétion</tspan> de l'échec</text>
  <text x="136" y="668" class="body" font-size="12.5" fill="#1A1A1A">plutôt que son absence. L'escalade et l'échec ne sont pas la même chose : l'une laisse une trace, l'autre non.</text>
  <text x="136" y="690" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Conséquence de rédaction : la durée de la fenêtre est une variable tarifaire, et elle appartient à l'annexe du contrat.</text>

  <line x1="60" y1="742" x2="1140" y2="742" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="766" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : documentation Zendesk et Intercom, 2026 (définitions publiées) ; durées de fenêtre issues de relevés secondaires, à faire confirmer par écrit ; analyse de l'auteur.</text>
  <text x="1140" y="766" class="mono" font-size="9.5" letter-spacing="0.1em" fill="#B8B5AE" text-anchor="end">QUI TIENT LE COMPTEUR · 09.10.2026</text>
</svg>
