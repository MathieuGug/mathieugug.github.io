<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Trois compteurs de facturation empilés : le siège, l'action et le résultat. Seul le compteur au résultat délègue au fournisseur la définition de l'événement facturable.">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect.hit { fill: #B7332C; fill-opacity: .05; }
  </style>
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5A5A5A" stroke-width="1.3"/>
    </marker>
    <marker id="ar1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#B7332C" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- header -->
  <text x="60" y="52" class="mono" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#B7332C">SCHÉMA 01</text>
  <text x="60" y="92" class="display" font-size="28" font-weight="600" fill="#1A1A1A" letter-spacing="-0.01em">Trois compteurs, et un seul change de camp</text>
  <text x="60" y="122" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Du siège à l'action, l'acheteur perd le contrôle de la valeur. De l'action au résultat, il perd celui de la définition.</text>
  <line x1="60" y1="144" x2="1140" y2="144" stroke="#E5E1D8" stroke-width="1"/>

  <!-- column headers -->
  <text x="94" y="178" class="mono" font-size="10.5" letter-spacing="0.14em" fill="#B8B5AE">UNITÉ FACTURÉE</text>
  <text x="470" y="178" class="mono" font-size="10.5" letter-spacing="0.14em" fill="#B8B5AE">CE QUE LE COMPTEUR ENREGISTRE</text>
  <text x="800" y="178" class="mono" font-size="10.5" letter-spacing="0.14em" fill="#B8B5AE">QUI CONTRÔLE LA VALEUR</text>

  <!-- ROW 1 — siege -->
  <g class="interactive" data-card="compteur-siege" tabindex="0" role="button" aria-label="Le compteur au siège — cliquez pour les détails">
    <rect class="hit" x="60" y="196" width="1080" height="124" rx="3" fill="#2F5D3F" fill-opacity="0.05" stroke="#2F5D3F" stroke-width="1.25"/>
    <text x="94" y="236" class="display" font-size="19" fill="#1A1A1A">Le siège</text>
    <text x="94" y="262" class="mono" font-size="11" fill="#2F5D3F">droit d'accès nommé</text>
    <text x="94" y="296" class="body" font-size="11" fill="#5A5A5A">modèle historique du logiciel</text>
    <line x1="440" y1="206" x2="440" y2="310" stroke="#E5E1D8" stroke-width="1"/>
    <text x="470" y="232" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Un nombre de comptes ouverts</text>
    <text x="470" y="256" class="body" font-size="11" fill="#5A5A5A">Fait administratif stable, révisé une fois l'an,</text>
    <text x="470" y="274" class="body" font-size="11" fill="#5A5A5A">vérifiable dans l'annuaire interne.</text>
    <line x1="770" y1="206" x2="770" y2="310" stroke="#E5E1D8" stroke-width="1"/>
    <text x="800" y="232" class="mono" font-size="12" font-weight="600" fill="#2F5D3F">L'ACHETEUR</text>
    <text x="800" y="254" class="body" font-size="11" fill="#5A5A5A">il ouvre et ferme</text>
    <text x="800" y="272" class="body" font-size="11" fill="#5A5A5A">les comptes</text>
    <line x1="955" y1="206" x2="955" y2="310" stroke="#E5E1D8" stroke-width="1"/>
    <text x="985" y="232" class="mono" font-size="12" font-weight="600" fill="#2F5D3F">SANS OBJET</text>
    <text x="985" y="254" class="body" font-size="11" fill="#5A5A5A">rien à définir :</text>
    <text x="985" y="272" class="body" font-size="11" fill="#5A5A5A">un compte existe</text>
    <text x="985" y="290" class="body" font-size="11" fill="#5A5A5A">ou n'existe pas</text>
  </g>

  <!-- ROW 2 — action -->
  <g class="interactive" data-card="compteur-action" tabindex="0" role="button" aria-label="Le compteur à l'action — cliquez pour les détails">
    <rect class="hit" x="60" y="336" width="1080" height="124" rx="3" fill="#B58A2C" fill-opacity="0.06" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="94" y="376" class="display" font-size="19" fill="#1A1A1A">L'action</text>
    <text x="94" y="402" class="mono" font-size="11" fill="#B58A2C">crédit par opération</text>
    <text x="94" y="436" class="body" font-size="11" fill="#5A5A5A">Agentforce : 20 crédits ≈ 0,10 $</text>
    <line x1="440" y1="346" x2="440" y2="450" stroke="#E5E1D8" stroke-width="1"/>
    <text x="470" y="372" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Un appel d'outil, horodaté</text>
    <text x="470" y="396" class="body" font-size="11" fill="#5A5A5A">Compteur <tspan font-weight="600">descriptif</tspan> : l'événement s'est produit</text>
    <text x="470" y="414" class="body" font-size="11" fill="#5A5A5A">ou non, et sa trace est dans les journaux.</text>
    <line x1="770" y1="346" x2="770" y2="450" stroke="#E5E1D8" stroke-width="1"/>
    <text x="800" y="372" class="mono" font-size="12" font-weight="600" fill="#B58A2C">LE SYSTÈME</text>
    <text x="800" y="394" class="body" font-size="11" fill="#5A5A5A">l'agent décide</text>
    <text x="800" y="412" class="body" font-size="11" fill="#5A5A5A">de sa chaîne d'appels</text>
    <line x1="955" y1="346" x2="955" y2="450" stroke="#E5E1D8" stroke-width="1"/>
    <text x="985" y="372" class="mono" font-size="12" font-weight="600" fill="#B58A2C">PERSONNE</text>
    <text x="985" y="394" class="body" font-size="11" fill="#5A5A5A">l'événement est</text>
    <text x="985" y="412" class="body" font-size="11" fill="#5A5A5A">un fait technique,</text>
    <text x="985" y="430" class="body" font-size="11" fill="#5A5A5A">non une appréciation</text>
  </g>

  <!-- ROW 3 — resultat -->
  <g class="interactive" data-card="compteur-resultat" tabindex="0" role="button" aria-label="Le compteur au résultat — cliquez pour les détails">
    <rect class="hit" x="60" y="476" width="1080" height="150" rx="3" fill="#B7332C" fill-opacity="0.07" stroke="#B7332C" stroke-width="2.5"/>
    <text x="94" y="516" class="display" font-size="19" fill="#1A1A1A">Le résultat</text>
    <text x="94" y="542" class="mono" font-size="11" fill="#B7332C">résolution · ticket · qualification</text>
    <text x="94" y="576" class="body" font-size="11" fill="#5A5A5A">0,99 $ · 1,50 $ · 2,00 $</text>
    <text x="94" y="600" class="body" font-size="11" fill="#5A5A5A">selon le fournisseur</text>
    <line x1="440" y1="486" x2="440" y2="616" stroke="#E5E1D8" stroke-width="1"/>
    <text x="470" y="512" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Une appréciation sur un échange</text>
    <text x="470" y="536" class="body" font-size="11" fill="#5A5A5A">Compteur <tspan font-weight="600">interprétatif</tspan> : aucun événement</text>
    <text x="470" y="554" class="body" font-size="11" fill="#5A5A5A">technique ne dit « ce client est servi ». Il faut</text>
    <text x="470" y="572" class="body" font-size="11" fill="#5A5A5A">une règle, et la règle est un énoncé normatif.</text>
    <line x1="770" y1="486" x2="770" y2="616" stroke="#E5E1D8" stroke-width="1"/>
    <text x="800" y="512" class="mono" font-size="12" font-weight="600" fill="#B7332C">LE CLIENT FINAL</text>
    <text x="800" y="534" class="body" font-size="11" fill="#5A5A5A">son silence suffit</text>
    <text x="800" y="552" class="body" font-size="11" fill="#5A5A5A">à déclencher</text>
    <text x="800" y="570" class="body" font-size="11" fill="#5A5A5A">la facture</text>
    <line x1="955" y1="486" x2="955" y2="616" stroke="#E5E1D8" stroke-width="1"/>
    <text x="985" y="512" class="mono" font-size="12" font-weight="600" fill="#B7332C">LE FOURNISSEUR</text>
    <text x="985" y="534" class="body" font-size="11" fill="#5A5A5A">il rédige la règle,</text>
    <text x="985" y="552" class="body" font-size="11" fill="#5A5A5A">la publie en partie,</text>
    <text x="985" y="570" class="body" font-size="11" fill="#5A5A5A">et peut la modifier</text>
  </g>

  <!-- bascule arrow + annotation -->
  <g class="interactive" data-card="ligne-de-partage" tabindex="0" role="button" aria-label="La ligne de partage — cliquez pour les détails">
    <rect class="hit" x="60" y="640" width="1080" height="82" rx="3" fill="#FAF8F3" fill-opacity="0.01" stroke="none"/>
    <line x1="1070" y1="258" x2="1070" y2="398" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#ar1)"/>
    <line x1="1070" y1="420" x2="1070" y2="540" stroke="#B7332C" stroke-width="1.5" marker-end="url(#ar1c)"/>
    <circle cx="74" cy="664" r="9" fill="#B7332C"/>
    <text x="74" y="668" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <line x1="83" y1="664" x2="112" y2="664" stroke="#5A5A5A" stroke-width="0.75"/>
    <text x="118" y="662" class="body" font-size="12.5" fill="#1A1A1A">La bascule qui compte n'est pas celle du siège vers l'usage, largement commentée, mais celle de l'action vers le résultat.</text>
    <text x="118" y="682" class="body" font-size="12.5" fill="#1A1A1A">La première déplace le contrôle de la <tspan font-weight="600">valeur</tspan> du compteur ; la seconde déplace le contrôle de sa <tspan font-weight="600">définition</tspan>.</text>
    <text x="118" y="704" class="body" font-size="12.5" fill="#5A5A5A">Un plafond répond à la première. Seule une annexe de comptage répond à la seconde, et presque aucun contrat n'en contient.</text>
  </g>

  <!-- interactive column header: definition -->
  <g class="interactive" data-card="zone-definition" tabindex="0" role="button" aria-label="La colonne qui décide de la facture — cliquez pour les détails">
    <rect class="hit" x="963" y="158" width="177" height="28" rx="3" fill="#B7332C" fill-opacity="0.06" stroke="#B7332C" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="1051" y="178" class="mono" font-size="10.5" letter-spacing="0.14em" fill="#B7332C" text-anchor="middle">QUI ÉCRIT LA DÉFINITION</text>
  </g>

  <!-- footer -->
  <line x1="60" y1="742" x2="1140" y2="742" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="766" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : documentation tarifaire des fournisseurs (Salesforce, Zendesk, Intercom), 2026 ; Gartner, communiqués de presse 2025-2026 ; analyse de l'auteur.</text>
  <text x="1140" y="766" class="mono" font-size="9.5" letter-spacing="0.1em" fill="#B8B5AE" text-anchor="end">QUI TIENT LE COMPTEUR · 09.10.2026</text>
</svg>
