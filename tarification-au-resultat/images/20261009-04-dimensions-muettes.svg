<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="Holmström et Milgrom transposés : une seule des cinq dimensions d'un agent de relation client est mesurée par le compteur de facturation, les quatre autres restent muettes.">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect.hit, .interactive:hover circle.hit { fill: #B7332C; fill-opacity: .07; }
  </style>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5A5A5A" stroke-width="1.3"/>
    </marker>
    <marker id="a4c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#B7332C" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="900" height="900" fill="#FAF8F3"/>

  <text x="60" y="52" class="mono" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#B7332C">SCHÉMA 04</text>
  <text x="60" y="92" class="display" font-size="28" font-weight="600" fill="#1A1A1A" letter-spacing="-0.01em">La dimension payée et les dimensions muettes</text>
  <text x="60" y="122" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Holmström et Milgrom, 1991 : rémunérer une tâche multiple sur sa seule</text>
  <text x="60" y="146" class="display" font-size="18" font-style="italic" fill="#5A5A5A">dimension mesurable détourne l'effort des dimensions qui ne le sont pas.</text>
  <line x1="60" y1="168" x2="840" y2="168" stroke="#E5E1D8" stroke-width="1"/>

  <!-- central measured dimension -->
  <g class="interactive" data-card="dimension-payee" tabindex="0" role="button" aria-label="La dimension payée — cliquez pour les détails">
    <circle class="hit" cx="450" cy="440" r="108" fill="#B7332C" fill-opacity="0.10" stroke="#B7332C" stroke-width="2.5"/>
    <text x="450" y="412" class="mono" font-size="10" font-weight="600" letter-spacing="0.14em" fill="#B7332C" text-anchor="middle">DIMENSION PAYÉE</text>
    <text x="450" y="444" class="display" font-size="19" font-weight="600" fill="#1A1A1A" text-anchor="middle">Terminer</text>
    <text x="450" y="468" class="display" font-size="19" font-weight="600" fill="#1A1A1A" text-anchor="middle">sans escalade</text>
    <text x="450" y="494" class="mono" font-size="11" fill="#B7332C" text-anchor="middle">1,50 $</text>
  </g>

  <!-- four mute dimensions -->
  <g class="interactive" data-card="dimensions-muettes" tabindex="0" role="button" aria-label="Les quatre dimensions muettes — cliquez pour les détails">
    <rect class="hit" x="60" y="196" width="780" height="82" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
    <text x="450" y="226" class="body" font-size="13" font-weight="500" fill="#1A1A1A" text-anchor="middle">Exactitude de la réponse</text>
    <text x="450" y="250" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">Aucun compteur ne la mesure. Une réponse plausible et fausse facture</text>
    <text x="450" y="268" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">exactement comme une réponse juste.</text>

    <rect class="hit" x="60" y="602" width="780" height="82" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
    <text x="450" y="632" class="body" font-size="13" font-weight="500" fill="#1A1A1A" text-anchor="middle">Satisfaction réelle du client</text>
    <text x="450" y="656" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">Mesurée, le cas échéant, dans le canal du fournisseur, par un dispositif</text>
    <text x="450" y="674" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">que l'acheteur ne contrôle pas.</text>

    <rect class="hit" x="60" y="330" width="178" height="220" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
    <text x="149" y="378" class="body" font-size="13" font-weight="500" fill="#1A1A1A" text-anchor="middle">Conformité</text>
    <text x="149" y="404" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">Obligations</text>
    <text x="149" y="422" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">sectorielles :</text>
    <text x="149" y="440" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">devoir de conseil,</text>
    <text x="149" y="458" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">information</text>
    <text x="149" y="476" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">obligatoire,</text>
    <text x="149" y="494" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">traçabilité.</text>
    <text x="149" y="522" class="mono" font-size="10" fill="#1F5560" text-anchor="middle">NON MESURÉE</text>

    <rect class="hit" x="662" y="330" width="178" height="220" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
    <text x="751" y="378" class="body" font-size="13" font-weight="500" fill="#1A1A1A" text-anchor="middle">Coût aval</text>
    <text x="751" y="404" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">Le problème</text>
    <text x="751" y="422" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">non traité qui</text>
    <text x="751" y="440" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">revient ailleurs :</text>
    <text x="751" y="458" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">recontact,</text>
    <text x="751" y="476" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">réclamation,</text>
    <text x="751" y="494" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">résiliation.</text>
    <text x="751" y="522" class="mono" font-size="10" fill="#1F5560" text-anchor="middle">NON MESURÉ</text>
  </g>

  <!-- arrows: effort drawn toward paid dimension -->
  <line x1="450" y1="288" x2="450" y2="322" stroke="#B7332C" stroke-width="1.6" marker-end="url(#a4c)"/>
  <line x1="450" y1="592" x2="450" y2="558" stroke="#B7332C" stroke-width="1.6" marker-end="url(#a4c)"/>
  <line x1="248" y1="440" x2="332" y2="440" stroke="#B7332C" stroke-width="1.6" marker-end="url(#a4c)"/>
  <line x1="652" y1="440" x2="568" y2="440" stroke="#B7332C" stroke-width="1.6" marker-end="url(#a4c)"/>

  <!-- arbitrage annotation -->
  <g class="interactive" data-card="arbitrage" tabindex="0" role="button" aria-label="Les arbitrages rationnels du fournisseur — cliquez pour les détails">
    <rect class="hit" x="60" y="702" width="390" height="104" rx="3" fill="#B58A2C" fill-opacity="0.06" stroke="#B58A2C" stroke-width="1.25"/>
    <circle cx="86" cy="728" r="9" fill="#B58A2C"/>
    <text x="86" y="732" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">a</text>
    <text x="106" y="726" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">Trois arbitrages rationnels</text>
    <text x="106" y="748" class="body" font-size="11" fill="#5A5A5A">Retarder l'escalade quand elle est incertaine.</text>
    <text x="106" y="766" class="body" font-size="11" fill="#5A5A5A">Formuler une réponse plausible plutôt qu'avouer</text>
    <text x="106" y="784" class="body" font-size="11" fill="#5A5A5A">une lacune. Allonger le délai avant d'offrir un humain.</text>
  </g>

  <g class="interactive" data-card="contre-mesure" tabindex="0" role="button" aria-label="La contre-mesure de l'acheteur — cliquez pour les détails">
    <rect class="hit" x="470" y="702" width="370" height="104" rx="3" fill="#2F5D3F" fill-opacity="0.06" stroke="#2F5D3F" stroke-width="1.25"/>
    <circle cx="496" cy="728" r="9" fill="#2F5D3F"/>
    <text x="496" y="732" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">b</text>
    <text x="516" y="726" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">La seule contre-mesure</text>
    <text x="516" y="748" class="body" font-size="11" fill="#5A5A5A">Un second instrument, tenu par l'acheteur, qui</text>
    <text x="516" y="766" class="body" font-size="11" fill="#5A5A5A">mesure au moins une dimension muette. Sans lui,</text>
    <text x="516" y="784" class="body" font-size="11" fill="#5A5A5A">l'incitation existe et personne ne la pilote.</text>
  </g>

  <line x1="60" y1="836" x2="840" y2="836" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="860" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Source : B. Holmström &amp; P. Milgrom, « Multitask Principal-Agent Analyses », Journal of Law, Economics, and Organization, 1991 ;</text>
  <text x="60" y="876" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">B. Holmström, conférence Nobel, 8 décembre 2016. Transposition au contrat d'agent par l'auteur.</text>
  <text x="840" y="876" class="mono" font-size="9.5" letter-spacing="0.1em" fill="#B8B5AE" text-anchor="end">QUI TIENT LE COMPTEUR</text>
</svg>
