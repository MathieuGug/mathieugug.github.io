<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Matrice comparative de quatre fournisseurs : unité facturée, tarif publié, événement déclencheur, ce qui ne facture pas, et vérifiabilité par l'acheteur. La colonne de vérifiabilité est vide chez les quatre.">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect.hit { fill: #B7332C; fill-opacity: .05; }
  </style>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="52" class="mono" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#B7332C">SCHÉMA 03</text>
  <text x="60" y="92" class="display" font-size="28" font-weight="600" fill="#1A1A1A" letter-spacing="-0.01em">Quatre fournisseurs, quatre définitions</text>
  <text x="60" y="122" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La colonne que les comparatifs n'ont pas : par quel moyen l'acheteur peut-il recompter ce qui lui est facturé.</text>
  <line x1="60" y1="144" x2="1140" y2="144" stroke="#E5E1D8" stroke-width="1"/>

  <!-- column headers -->
  <text x="78" y="186" class="mono" font-size="10.5" letter-spacing="0.12em" fill="#B8B5AE">FOURNISSEUR</text>
  <text x="258" y="186" class="mono" font-size="10.5" letter-spacing="0.12em" fill="#B8B5AE">UNITÉ FACTURÉE</text>
  <text x="430" y="186" class="mono" font-size="10.5" letter-spacing="0.12em" fill="#B8B5AE">TARIF PUBLIÉ</text>
  <text x="600" y="186" class="mono" font-size="10.5" letter-spacing="0.12em" fill="#B8B5AE">ÉVÉNEMENT DÉCLENCHEUR</text>
  <text x="852" y="186" class="mono" font-size="10.5" letter-spacing="0.12em" fill="#B8B5AE">N'EST PAS FACTURÉ</text>
  <text x="1012" y="186" class="mono" font-size="10.5" letter-spacing="0.12em" fill="#B7332C">VÉRIFIABILITÉ</text>
  <line x1="60" y1="198" x2="1140" y2="198" stroke="#1A1A1A" stroke-width="1.25"/>

  <!-- verifiability column band -->
  <rect x="996" y="198" width="144" height="420" fill="#B7332C" fill-opacity="0.05"/>

  <!-- Fin -->
  <g class="interactive" data-card="fin" tabindex="0" role="button" aria-label="Fin d'Intercom — cliquez pour les détails">
    <rect class="hit" x="60" y="200" width="1080" height="104" rx="2" fill="#FAF8F3" stroke="none"/>
    <text x="78" y="232" class="display" font-size="18" fill="#1A1A1A">Fin</text>
    <text x="78" y="254" class="body" font-size="11" fill="#5A5A5A">Intercom</text>
    <text x="258" y="230" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">Le résultat</text>
    <text x="258" y="250" class="body" font-size="11" fill="#5A5A5A">une fois par conversation,</text>
    <text x="258" y="268" class="body" font-size="11" fill="#5A5A5A">quel que soit le nombre</text>
    <text x="258" y="286" class="body" font-size="11" fill="#5A5A5A">de questions traitées</text>
    <text x="430" y="230" class="mono" font-size="14" font-weight="500" fill="#B7332C">0,99 $</text>
    <text x="430" y="252" class="body" font-size="11" fill="#5A5A5A">qualification</text>
    <text x="430" y="270" class="body" font-size="11" fill="#5A5A5A">commerciale ≈ 9,99 $</text>
    <text x="600" y="230" class="body" font-size="11.5" fill="#1A1A1A">Résolution, transfert vers une</text>
    <text x="600" y="248" class="body" font-size="11.5" fill="#1A1A1A">procédure, ou disqualification.</text>
    <text x="600" y="270" class="body" font-size="11" font-style="italic" fill="#B58A2C">Clôture par silence de 24 h</text>
    <text x="600" y="288" class="body" font-size="11" font-style="italic" fill="#B58A2C">(relevé secondaire).</text>
    <text x="852" y="230" class="body" font-size="11.5" fill="#5A5A5A">Les questions</text>
    <text x="852" y="248" class="body" font-size="11.5" fill="#5A5A5A">supplémentaires</text>
    <text x="852" y="266" class="body" font-size="11.5" fill="#5A5A5A">d'une même</text>
    <text x="852" y="284" class="body" font-size="11.5" fill="#5A5A5A">conversation.</text>
    <text x="1068" y="240" class="mono" font-size="20" fill="#B8B5AE" text-anchor="middle">○</text>
    <text x="1068" y="266" class="body" font-size="10.5" fill="#5A5A5A" text-anchor="middle">non documentée</text>
  </g>
  <line x1="60" y1="304" x2="1140" y2="304" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Zendesk -->
  <g class="interactive" data-card="zendesk" tabindex="0" role="button" aria-label="Zendesk — cliquez pour les détails">
    <rect class="hit" x="60" y="306" width="1080" height="104" rx="2" fill="#FAF8F3" stroke="none"/>
    <text x="78" y="338" class="display" font-size="18" fill="#1A1A1A">Zendesk</text>
    <text x="78" y="360" class="body" font-size="11" fill="#5A5A5A">revendique l'antériorité</text>
    <text x="258" y="336" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">La résolution automatisée</text>
    <text x="258" y="356" class="body" font-size="11" fill="#5A5A5A">définition déclinée</text>
    <text x="258" y="374" class="body" font-size="11" fill="#5A5A5A">par canal</text>
    <text x="430" y="336" class="mono" font-size="14" font-weight="500" fill="#B7332C">1,50 $</text>
    <text x="430" y="358" class="body" font-size="11" fill="#5A5A5A">quota inclus,</text>
    <text x="430" y="376" class="body" font-size="11" fill="#5A5A5A">dépassement facturé</text>
    <text x="600" y="336" class="body" font-size="11.5" fill="#1A1A1A">Demande traitée entièrement</text>
    <text x="600" y="354" class="body" font-size="11.5" fill="#1A1A1A">par l'agent, sans intervention</text>
    <text x="600" y="372" class="body" font-size="11.5" fill="#1A1A1A">humaine.</text>
    <text x="600" y="394" class="body" font-size="11" font-style="italic" fill="#B58A2C">Confirmation à 72 h (relevé).</text>
    <text x="852" y="336" class="body" font-size="11.5" font-weight="500" fill="#2F5D3F">Pas de résolution,</text>
    <text x="852" y="354" class="body" font-size="11.5" font-weight="500" fill="#2F5D3F">pas de facture.</text>
    <text x="852" y="376" class="body" font-size="11" fill="#5A5A5A">Toute intervention</text>
    <text x="852" y="394" class="body" font-size="11" fill="#5A5A5A">humaine exonère.</text>
    <text x="1068" y="346" class="mono" font-size="20" fill="#B8B5AE" text-anchor="middle">○</text>
    <text x="1068" y="372" class="body" font-size="10.5" fill="#5A5A5A" text-anchor="middle">non documentée</text>
  </g>
  <line x1="60" y1="410" x2="1140" y2="410" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Agentforce -->
  <g class="interactive" data-card="agentforce" tabindex="0" role="button" aria-label="Agentforce de Salesforce — cliquez pour les détails">
    <rect class="hit" x="60" y="412" width="1080" height="104" rx="2" fill="#B58A2C" fill-opacity="0.05" stroke="none"/>
    <text x="78" y="444" class="display" font-size="18" fill="#1A1A1A">Agentforce</text>
    <text x="78" y="466" class="body" font-size="11" fill="#5A5A5A">Salesforce</text>
    <text x="258" y="442" class="body" font-size="12.5" font-weight="500" fill="#B58A2C">L'action</text>
    <text x="258" y="462" class="body" font-size="11" fill="#5A5A5A">après avoir facturé</text>
    <text x="258" y="480" class="body" font-size="11" fill="#5A5A5A">la conversation</text>
    <text x="258" y="498" class="body" font-size="11" fill="#5A5A5A">à 2,00 $</text>
    <text x="430" y="442" class="mono" font-size="14" font-weight="500" fill="#B58A2C">0,10 $</text>
    <text x="430" y="464" class="body" font-size="11" fill="#5A5A5A">20 crédits par action ;</text>
    <text x="430" y="482" class="body" font-size="11" fill="#5A5A5A">100 000 crédits = 500 $ ;</text>
    <text x="430" y="500" class="body" font-size="11" fill="#5A5A5A">action vocale = 30 crédits</text>
    <text x="600" y="442" class="body" font-size="11.5" fill="#1A1A1A">Chaque opération exécutée.</text>
    <text x="600" y="464" class="body" font-size="11" font-style="italic" fill="#1F5560">Compteur descriptif : un fait</text>
    <text x="600" y="482" class="body" font-size="11" font-style="italic" fill="#1F5560">technique horodaté, et non</text>
    <text x="600" y="500" class="body" font-size="11" font-style="italic" fill="#1F5560">une appréciation.</text>
    <text x="852" y="442" class="body" font-size="11.5" fill="#5A5A5A">Sans objet : le</text>
    <text x="852" y="460" class="body" font-size="11.5" fill="#5A5A5A">modèle ne promet</text>
    <text x="852" y="478" class="body" font-size="11.5" fill="#5A5A5A">aucun résultat.</text>
    <text x="1068" y="452" class="mono" font-size="20" fill="#B58A2C" text-anchor="middle">◐</text>
    <text x="1068" y="478" class="body" font-size="10.5" fill="#5A5A5A" text-anchor="middle">grille publiée,</text>
    <text x="1068" y="494" class="body" font-size="10.5" fill="#5A5A5A" text-anchor="middle">détail non stipulé</text>
  </g>
  <line x1="60" y1="516" x2="1140" y2="516" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Sierra -->
  <g class="interactive" data-card="sierra" tabindex="0" role="button" aria-label="Sierra — cliquez pour les détails">
    <rect class="hit" x="60" y="518" width="1080" height="100" rx="2" fill="#FAF8F3" stroke="none"/>
    <text x="78" y="550" class="display" font-size="18" fill="#1A1A1A">Sierra</text>
    <text x="78" y="572" class="body" font-size="11" fill="#5A5A5A">rien de publié</text>
    <text x="258" y="548" class="body" font-size="12.5" font-weight="500" fill="#B8B5AE">Non publiée</text>
    <text x="258" y="568" class="body" font-size="11" fill="#5A5A5A">décrite comme « au résultat »</text>
    <text x="258" y="586" class="body" font-size="11" fill="#5A5A5A">sans spécification accessible</text>
    <text x="430" y="548" class="mono" font-size="14" fill="#B8B5AE">—</text>
    <text x="430" y="570" class="body" font-size="11" fill="#5A5A5A">les montants qui circulent</text>
    <text x="430" y="588" class="body" font-size="11" fill="#5A5A5A">sont des estimations tierces,</text>
    <text x="430" y="606" class="body" font-size="11" fill="#5A5A5A">non reprises ici</text>
    <text x="600" y="548" class="body" font-size="11.5" fill="#1A1A1A">Inconnu.</text>
    <text x="600" y="570" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Conséquence pratique : on ne</text>
    <text x="600" y="588" class="body" font-size="11" font-style="italic" fill="#5A5A5A">peut pas préparer la négociation</text>
    <text x="600" y="606" class="body" font-size="11" font-style="italic" fill="#5A5A5A">du compteur avant d'y entrer.</text>
    <text x="852" y="548" class="body" font-size="11.5" fill="#5A5A5A">Inconnu.</text>
    <text x="1068" y="558" class="mono" font-size="20" fill="#B8B5AE" text-anchor="middle">○</text>
    <text x="1068" y="584" class="body" font-size="10.5" fill="#5A5A5A" text-anchor="middle">aucune pièce</text>
    <text x="1068" y="600" class="body" font-size="10.5" fill="#5A5A5A" text-anchor="middle">publique</text>
  </g>
  <line x1="60" y1="618" x2="1140" y2="618" stroke="#1A1A1A" stroke-width="1.25"/>

  <!-- legend + annotation -->
  <g class="interactive" data-card="colonne-verifiabilite" tabindex="0" role="button" aria-label="La colonne de vérifiabilité — cliquez pour les détails">
    <rect class="hit" x="60" y="630" width="1080" height="88" rx="3" fill="#B7332C" fill-opacity="0.04" stroke="#B7332C" stroke-width="1.25"/>
    <circle cx="92" cy="660" r="9" fill="#B7332C"/>
    <text x="92" y="664" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <line x1="101" y1="660" x2="130" y2="660" stroke="#5A5A5A" stroke-width="0.75"/>
    <text x="136" y="658" class="body" font-size="12.5" fill="#1A1A1A">Aucun des quatre ne documente publiquement comment un client recompte ce qui lui est facturé. Le marché n'a pas convergé</text>
    <text x="136" y="678" class="body" font-size="12.5" fill="#1A1A1A">vers le résultat : son acteur le plus volumineux a fait le chemin inverse, de la conversation vers le crédit par action.</text>
    <text x="136" y="702" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Légende · ● documenté et vérifiable   ◐ grille publiée, détail du comptage non stipulé   ○ non documenté</text>
  </g>

  <line x1="60" y1="742" x2="1140" y2="742" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="766" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : Salesforce, article d'aide Agentforce Pricing (document primaire) ; Zendesk, salle de presse et blogue ; Intercom, centre d'apprentissage ; relevés secondaires signalés en italique orange. Relevé arrêté au 9 octobre 2026.</text>
  <text x="1140" y="766" class="mono" font-size="9.5" letter-spacing="0.1em" fill="#B8B5AE" text-anchor="end">QUI TIENT LE COMPTEUR · 09.10.2026</text>
</svg>
