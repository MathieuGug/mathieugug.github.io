<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le fournisseur entre deux compteurs : il vend un résultat à prix fixe et achète du calcul à prix croissant. Trois voies de reprise de marge, toutes observables dans le marché.">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect.hit { fill: #B7332C; fill-opacity: .05; }
  </style>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5A5A5A" stroke-width="1.3"/>
    </marker>
    <marker id="a5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#B7332C" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="52" class="mono" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#B7332C">SCHÉMA 05</text>
  <text x="60" y="92" class="display" font-size="28" font-weight="600" fill="#1A1A1A" letter-spacing="-0.01em">Où va vraiment la variance</text>
  <text x="60" y="122" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le fournisseur a deux compteurs. Il vend sur l'un et achète sur l'autre, et seul le second monte.</text>
  <line x1="60" y1="144" x2="1140" y2="144" stroke="#E5E1D8" stroke-width="1"/>

  <!-- the vendor box -->
  <rect x="470" y="212" width="260" height="196" rx="3" fill="#F2EFE7" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="600" y="248" class="mono" font-size="10.5" letter-spacing="0.14em" fill="#B8B5AE" text-anchor="middle">LE FOURNISSEUR</text>
  <text x="600" y="288" class="display" font-size="20" fill="#1A1A1A" text-anchor="middle">Un éditeur pris</text>
  <text x="600" y="314" class="display" font-size="20" fill="#1A1A1A" text-anchor="middle">entre deux compteurs</text>
  <text x="600" y="350" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">Il garantit un prix unitaire de sortie</text>
  <text x="600" y="368" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">sur un coût d'entrée qu'il ne maîtrise</text>
  <text x="600" y="386" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">pas et qui s'allonge.</text>

  <!-- left: achat jeton -->
  <g class="interactive" data-card="achat-jeton" tabindex="0" role="button" aria-label="Le compteur d'achat — cliquez pour les détails">
    <rect class="hit" x="60" y="212" width="340" height="196" rx="3" fill="#B7332C" fill-opacity="0.07" stroke="#B7332C" stroke-width="1.25"/>
    <text x="88" y="248" class="mono" font-size="10.5" letter-spacing="0.14em" fill="#B7332C">CE QU'IL ACHÈTE</text>
    <text x="88" y="286" class="display" font-size="19" fill="#1A1A1A">Du calcul, au jeton</text>
    <text x="88" y="318" class="mono" font-size="22" font-weight="500" fill="#B7332C">× 5</text>
    <text x="148" y="318" class="body" font-size="12.5" fill="#1A1A1A">et plus, par flux agentique,</text>
    <text x="148" y="336" class="body" font-size="12.5" fill="#1A1A1A">d'ici 2028 (Gartner, août 2026)</text>
    <text x="88" y="368" class="body" font-size="11" fill="#5A5A5A">La cause n'est pas le prix du jeton, qui baisse, mais</text>
    <text x="88" y="386" class="body" font-size="11" fill="#5A5A5A">l'allongement des chaînes d'exécution à périmètre constant.</text>
  </g>
  <line x1="408" y1="310" x2="462" y2="310" stroke="#B7332C" stroke-width="1.5" marker-end="url(#a5c)"/>

  <!-- right: vente resultat -->
  <g class="interactive" data-card="vente-resultat" tabindex="0" role="button" aria-label="Le compteur de vente — cliquez pour les détails">
    <rect class="hit" x="800" y="212" width="340" height="196" rx="3" fill="#2F5D3F" fill-opacity="0.06" stroke="#2F5D3F" stroke-width="1.25"/>
    <text x="828" y="248" class="mono" font-size="10.5" letter-spacing="0.14em" fill="#2F5D3F">CE QU'IL VEND</text>
    <text x="828" y="286" class="display" font-size="19" fill="#1A1A1A">Un résultat, à prix fixe</text>
    <text x="828" y="318" class="mono" font-size="22" font-weight="500" fill="#2F5D3F">1,50 $</text>
    <text x="908" y="318" class="body" font-size="12.5" fill="#1A1A1A">par résolution, tarif</text>
    <text x="908" y="336" class="body" font-size="12.5" fill="#1A1A1A">annoncé et stable</text>
    <text x="828" y="368" class="body" font-size="11" fill="#5A5A5A">C'est l'argument de vente : le fournisseur partage le risque.</text>
    <text x="828" y="386" class="body" font-size="11" fill="#5A5A5A">L'argument se vérifie, il ne se déclare pas.</text>
  </g>
  <line x1="738" y1="310" x2="792" y2="310" stroke="#5A5A5A" stroke-width="1.3" marker-end="url(#a5)"/>

  <!-- three recovery routes -->
  <line x1="60" y1="440" x2="1140" y2="440" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="476" class="mono" font-size="10.5" letter-spacing="0.14em" fill="#B8B5AE">TROIS VOIES DE REPRISE, TOUTES OBSERVABLES</text>

  <g class="interactive" data-card="plancher-engagement" tabindex="0" role="button" aria-label="Le plancher d'engagement — cliquez pour les détails">
    <rect class="hit" x="60" y="494" width="340" height="166" rx="3" fill="#B58A2C" fill-opacity="0.06" stroke="#B58A2C" stroke-width="1.25"/>
    <circle cx="86" cy="522" r="9" fill="#B58A2C"/>
    <text x="86" y="526" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <text x="106" y="520" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Le plancher d'engagement</text>
    <text x="88" y="552" class="body" font-size="11.5" fill="#5A5A5A">Le tarif unitaire bas est consenti</text>
    <text x="88" y="570" class="body" font-size="11.5" fill="#5A5A5A">contre un volume minimum garanti,</text>
    <text x="88" y="588" class="body" font-size="11.5" fill="#5A5A5A">payé qu'il soit atteint ou non.</text>
    <text x="88" y="616" class="body" font-size="11.5" font-style="italic" fill="#1A1A1A">Test : si le plancher représente</text>
    <text x="88" y="634" class="body" font-size="11.5" font-style="italic" fill="#1A1A1A">l'essentiel du volume prévisionnel,</text>
    <text x="88" y="652" class="body" font-size="11.5" font-style="italic" fill="#1A1A1A">le contrat est un forfait déguisé.</text>
  </g>

  <g class="interactive" data-card="redefinition-unite" tabindex="0" role="button" aria-label="La redéfinition de l'unité — cliquez pour les détails">
    <rect class="hit" x="430" y="494" width="340" height="166" rx="3" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="2.5"/>
    <circle cx="456" cy="522" r="9" fill="#B7332C"/>
    <text x="456" y="526" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
    <text x="476" y="520" class="body" font-size="14" font-weight="600" fill="#1A1A1A">La redéfinition de l'unité</text>
    <text x="458" y="552" class="body" font-size="11.5" fill="#5A5A5A">La règle de comptage n'étant presque</text>
    <text x="458" y="570" class="body" font-size="11.5" fill="#5A5A5A">jamais annexée au contrat, elle peut</text>
    <text x="458" y="588" class="body" font-size="11.5" fill="#5A5A5A">être ajustée sans recours.</text>
    <text x="458" y="616" class="body" font-size="11.5" font-style="italic" fill="#B7332C">Passer la fenêtre de silence de 72 h</text>
    <text x="458" y="634" class="body" font-size="11.5" font-style="italic" fill="#B7332C">à 24 h augmente la facture à</text>
    <text x="458" y="652" class="body" font-size="11.5" font-style="italic" fill="#B7332C">comportement client inchangé.</text>
  </g>

  <g class="interactive" data-card="retour-credit" tabindex="0" role="button" aria-label="Le retour au compteur descriptif — cliquez pour les détails">
    <rect class="hit" x="800" y="494" width="340" height="166" rx="3" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="1.25"/>
    <circle cx="826" cy="522" r="9" fill="#1F5560"/>
    <text x="826" y="526" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
    <text x="846" y="520" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Le retour au descriptif</text>
    <text x="828" y="552" class="body" font-size="11.5" fill="#5A5A5A">Abandonner le résultat et facturer</text>
    <text x="828" y="570" class="body" font-size="11.5" fill="#5A5A5A">l'action : 20 crédits, 0,10 $, un fait</text>
    <text x="828" y="588" class="body" font-size="11.5" fill="#5A5A5A">technique vérifiable.</text>
    <text x="828" y="616" class="body" font-size="11.5" font-style="italic" fill="#1F5560">La voie la plus honnête : elle dit</text>
    <text x="828" y="634" class="body" font-size="11.5" font-style="italic" fill="#1F5560">que le fournisseur facture son</text>
    <text x="828" y="652" class="body" font-size="11.5" font-style="italic" fill="#1F5560">activité et non son résultat.</text>
  </g>

  <!-- the test -->
  <rect x="60" y="680" width="1080" height="46" rx="3" fill="#1A1A1A"/>
  <text x="88" y="700" class="mono" font-size="9.5" letter-spacing="0.16em" fill="#B8B5AE">LE TEST DE COSHOW · GARTNER</text>
  <text x="88" y="718" class="display" font-size="17" font-style="italic" fill="#FAF8F3">« Si le fournisseur ne prend pas le risque, pourquoi vous embarrassez-vous d'une tarification au résultat ? »</text>

  <line x1="60" y1="748" x2="1140" y2="748" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="770" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : Gartner, communiqué du 17 août 2026 (coût d'inférence par flux agentique) ; propos de Tom Coshow rapportés par Channel Dive, 2026 ; Salesforce, article d'aide Agentforce Pricing. Aucune marge fournisseur n'est estimée ici.</text>
  <text x="1140" y="770" class="mono" font-size="9.5" letter-spacing="0.1em" fill="#B8B5AE" text-anchor="end">QUI TIENT LE COMPTEUR · 09.10.2026</text>
</svg>
