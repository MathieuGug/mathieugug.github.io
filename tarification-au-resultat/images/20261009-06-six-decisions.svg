<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Six décisions contractuelles rangées par la fenêtre où chacune reste possible : avant l'appel d'offres, à la signature, en exploitation. La dernière ne coûte rien et devient irrattrapable.">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect.hit { fill: #B7332C; fill-opacity: .05; }
  </style>
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5A5A5A" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="52" class="mono" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#B7332C">SCHÉMA 06</text>
  <text x="60" y="92" class="display" font-size="28" font-weight="600" fill="#1A1A1A" letter-spacing="-0.01em">Six décisions, et la fenêtre où chacune reste possible</text>
  <text x="60" y="122" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le classement compte autant que le contenu : trois des six cessent d'être négociables à la signature.</text>
  <line x1="60" y1="144" x2="1140" y2="144" stroke="#E5E1D8" stroke-width="1"/>

  <!-- timeline -->
  <line x1="60" y1="190" x2="1140" y2="190" stroke="#B8B5AE" stroke-width="1.25"/>
  <circle cx="230" cy="190" r="5" fill="#1F5560"/>
  <circle cx="600" cy="190" r="5" fill="#B7332C"/>
  <circle cx="970" cy="190" r="5" fill="#2F5D3F"/>
  <text x="230" y="176" class="mono" font-size="10" letter-spacing="0.12em" fill="#1F5560" text-anchor="middle">AVANT L'APPEL D'OFFRES</text>
  <text x="600" y="176" class="mono" font-size="10" letter-spacing="0.12em" fill="#B7332C" text-anchor="middle">À LA SIGNATURE</text>
  <text x="970" y="176" class="mono" font-size="10" letter-spacing="0.12em" fill="#2F5D3F" text-anchor="middle">EN EXPLOITATION</text>

  <!-- window 1 -->
  <g class="interactive" data-card="avant-ao" tabindex="0" role="button" aria-label="Fenêtre 1, avant l'appel d'offres — cliquez pour les détails">
    <rect class="hit" x="60" y="214" width="340" height="242" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
    <text x="88" y="248" class="mono" font-size="10.5" letter-spacing="0.12em" fill="#1F5560">FENÊTRE 1 · GRATUITE</text>

    <text x="88" y="284" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">D1 · Exiger la règle de comptage</text>
    <text x="88" y="302" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">comme pièce de candidature</text>
    <text x="88" y="326" class="body" font-size="11" fill="#5A5A5A">Définition exacte de l'événement facturable,</text>
    <text x="88" y="344" class="body" font-size="11" fill="#5A5A5A">durée de la fenêtre, événements exonérés,</text>
    <text x="88" y="362" class="body" font-size="11" fill="#5A5A5A">traitement de la réouverture.</text>

    <line x1="88" y1="380" x2="372" y2="380" stroke="#E5E1D8" stroke-width="1"/>

    <text x="88" y="404" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">D2 · Décider si l'on veut</text>
    <text x="88" y="422" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">un compteur interprétatif</text>
    <text x="88" y="444" class="body" font-size="11" fill="#5A5A5A">Sur un périmètre où la qualité se mesure mal,</text>
    <text x="88" y="462" class="body" font-size="11" fill="#5A5A5A">le compteur à l'action expose à moins de</text>
    <text x="88" y="480" class="body" font-size="11" fill="#5A5A5A">déformation.</text>
  </g>

  <!-- window 2 -->
  <g class="interactive" data-card="signature" tabindex="0" role="button" aria-label="Fenêtre 2, à la signature — cliquez pour les détails">
    <rect class="hit" x="430" y="214" width="340" height="320" rx="3" fill="#B7332C" fill-opacity="0.07" stroke="#B7332C" stroke-width="2.5"/>
    <text x="458" y="248" class="mono" font-size="10.5" letter-spacing="0.12em" fill="#B7332C">FENÊTRE 2 · IRRÉVERSIBLE APRÈS</text>

    <text x="458" y="284" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">D3 · Annexer la règle de comptage,</text>
    <text x="458" y="302" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">versionnée, avec préavis</text>
    <text x="458" y="324" class="body" font-size="11" fill="#5A5A5A">Toute modification de l'annexe vaut modification</text>
    <text x="458" y="342" class="body" font-size="11" fill="#5A5A5A">tarifaire. C'est la clause qui transforme une</text>
    <text x="458" y="360" class="body" font-size="11" fill="#5A5A5A">variance de définition en variance négociée.</text>

    <line x1="458" y1="378" x2="742" y2="378" stroke="#E5E1D8" stroke-width="1"/>

    <text x="458" y="402" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">D4 · Restituer le détail du comptage,</text>
    <text x="458" y="420" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">et le conserver</text>
    <text x="458" y="442" class="body" font-size="11" fill="#5A5A5A">Une ligne par événement, horodatée, avec version</text>
    <text x="458" y="460" class="body" font-size="11" fill="#5A5A5A">d'agent. Le droit d'audit se rédige dans la même</text>
    <text x="458" y="478" class="body" font-size="11" fill="#5A5A5A">clause que l'obligation de rétention.</text>

    <line x1="458" y1="494" x2="742" y2="494" stroke="#E5E1D8" stroke-width="1"/>

    <text x="458" y="518" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">D5 · Plafond de dépense, en montant</text>
  </g>

  <!-- window 3 -->
  <g class="interactive" data-card="exploitation" tabindex="0" role="button" aria-label="Fenêtre 3, en exploitation — cliquez pour les détails">
    <rect class="hit" x="800" y="214" width="340" height="320" rx="3" fill="#2F5D3F" fill-opacity="0.06" stroke="#2F5D3F" stroke-width="1.25"/>
    <text x="828" y="248" class="mono" font-size="10.5" letter-spacing="0.12em" fill="#2F5D3F">FENÊTRE 3 · DÈS LE PREMIER JOUR</text>

    <text x="828" y="284" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">D6 · Tenir soi-même la mesure</text>
    <text x="828" y="302" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">des dimensions muettes</text>
    <text x="828" y="326" class="body" font-size="11" fill="#5A5A5A">Taux de réouverture au-delà de la fenêtre.</text>
    <text x="828" y="344" class="body" font-size="11" fill="#5A5A5A">Taux de recontact par un autre canal.</text>
    <text x="828" y="362" class="body" font-size="11" fill="#5A5A5A">Exactitude sur échantillon tiré par l'acheteur.</text>
    <text x="828" y="380" class="body" font-size="11" fill="#5A5A5A">Satisfaction mesurée hors du canal fournisseur.</text>

    <line x1="828" y1="398" x2="1112" y2="398" stroke="#E5E1D8" stroke-width="1"/>

    <text x="828" y="424" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#2F5D3F">POURQUOI C'EST LA PREMIÈRE</text>
    <text x="828" y="450" class="body" font-size="11.5" fill="#5A5A5A">Elle ne demande l'accord de personne à l'extérieur.</text>
    <text x="828" y="472" class="body" font-size="11.5" fill="#5A5A5A">Elle ne coûte qu'un relevé périodique sur des</text>
    <text x="828" y="490" class="body" font-size="11.5" fill="#5A5A5A">données déjà détenues.</text>
    <text x="828" y="514" class="body" font-size="11.5" font-weight="600" fill="#B7332C">Et un historique de douze mois ne se reconstitue pas.</text>
  </g>

  <!-- punchline band -->
  <g class="interactive" data-card="d-gratuite" tabindex="0" role="button" aria-label="La décision la moins chère du dossier — cliquez pour les détails">
    <rect class="hit" x="60" y="568" width="1080" height="96" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <circle cx="92" cy="598" r="9" fill="#B7332C"/>
    <text x="92" y="602" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <line x1="101" y1="598" x2="130" y2="598" stroke="#5A5A5A" stroke-width="0.75"/>
    <text x="136" y="596" class="body" font-size="12.5" fill="#1A1A1A">Deux décisions coûtent zéro et sont les plus rentables du dossier : exiger la règle de comptage au cahier des charges, et tenir sa</text>
    <text x="136" y="616" class="body" font-size="12.5" fill="#1A1A1A">propre mesure dès la mise en service. Les deux sont irrattrapables après coup, pour la même raison : elles produisent un historique.</text>
    <text x="136" y="642" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Un acheteur sans historique qui contredit le compteur du fournisseur n'a rien à opposer qu'une impression.</text>
  </g>

  <!-- closing window -->
  <rect x="60" y="684" width="1080" height="44" rx="3" fill="#1A1A1A"/>
  <text x="88" y="702" class="mono" font-size="9.5" letter-spacing="0.16em" fill="#B8B5AE">LA FENÊTRE SE REFERME</text>
  <text x="88" y="720" class="body" font-size="12.5" fill="#FAF8F3">Le parc d'applications dotées d'agents passe de moins de 5 % en 2025 à 40 % fin 2026 : les contrats se signent plus vite qu'ils ne se renégocient.</text>

  <line x1="60" y1="750" x2="1140" y2="750" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="772" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : Mayer Brown, « Key Contract Issues in Agentic AI Implementation and Integration Deals », juin 2026 ; Gartner, communiqué du 26 août 2025 ; Holmström &amp; Milgrom, 1991 ; rédaction des clauses par l'auteur.</text>
  <text x="1140" y="772" class="mono" font-size="9.5" letter-spacing="0.1em" fill="#B8B5AE" text-anchor="end">QUI TIENT LE COMPTEUR · 09.10.2026</text>
</svg>
