<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Chronologie 2023-2027 en trois pistes : incidents documentés, décisions et sanctions, cadre applicable">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Quatre ans d'incidents, aucune règle nouvelle</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce qui a bougé n'est pas le droit applicable, c'est le coût de ne pas pouvoir se défendre</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- lane backgrounds -->
  <rect x="150" y="188" width="990" height="152" fill="#F2EFE7" opacity="0.55"/>
  <rect x="150" y="502" width="990" height="176" fill="#F2EFE7" opacity="0.55"/>

  <!-- lane labels -->
  <text x="64" y="212" class="mono" font-size="12" letter-spacing="0.08em" fill="#B7332C">INCIDENTS</text>
  <text x="64" y="228" class="mono" font-size="12" letter-spacing="0.08em" fill="#B7332C">DOCUMENTÉS</text>
  <text x="64" y="378" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560">DÉCISIONS</text>
  <text x="64" y="394" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560">ET SANCTIONS</text>
  <text x="64" y="530" class="mono" font-size="12" letter-spacing="0.08em" fill="#B58A2C">CADRE</text>
  <text x="64" y="546" class="mono" font-size="12" letter-spacing="0.08em" fill="#B58A2C">APPLICABLE</text>

  <!-- today marker -->
  <line x1="862" y1="180" x2="862" y2="712" stroke="#B7332C" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
  <text x="862" y="174" class="mono" font-size="11" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">7 AOÛT 2026</text>

  <!-- ===== LANE 1 : incidents ===== -->
  <line x1="150" y1="264" x2="1140" y2="264" stroke="#E5E1D8" stroke-width="1"/>

  <g class="interactive" data-card="nyc-mycity" tabindex="0" role="button" aria-label="Agent MyCity de la ville de New York — cliquez pour les détails">
    <rect x="278" y="192" width="180" height="14" fill="transparent"/>
    <circle cx="307" cy="264" r="5.5" fill="#B7332C"/>
    <line x1="307" y1="258" x2="307" y2="216" stroke="#B8B5AE" stroke-width="1"/>
    <text x="299" y="210" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="end">MyCity mis en ligne</text>
    <text x="299" y="226" class="mono" font-size="11" fill="#5A5A5A" text-anchor="end">OCT 2023</text>
    <circle cx="389" cy="264" r="5.5" fill="#B7332C"/>
    <line x1="389" y1="258" x2="389" y2="216" stroke="#B8B5AE" stroke-width="1"/>
    <text x="397" y="210" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Enquête · conseils illégaux</text>
    <text x="397" y="226" class="mono" font-size="11" fill="#5A5A5A">MARS 2024</text>
  </g>

  <g class="interactive" data-card="wolf-river" tabindex="0" role="button" aria-label="Assignation de Google pour un résumé génératif diffamatoire — cliquez pour les détails">
    <circle cx="585" cy="264" r="5.5" fill="#B7332C"/>
    <line x1="585" y1="270" x2="585" y2="306" stroke="#B8B5AE" stroke-width="1"/>
    <text x="577" y="322" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="end">Résumé génératif diffamatoire</text>
    <text x="577" y="338" class="mono" font-size="11" fill="#5A5A5A" text-anchor="end">MARS 2025</text>
  </g>

  <g class="interactive" data-card="cursor" tabindex="0" role="button" aria-label="Agent de support inventant une politique d'abonnement — cliquez pour les détails">
    <circle cx="601" cy="264" r="5.5" fill="#B7332C"/>
    <line x1="601" y1="258" x2="601" y2="216" stroke="#B8B5AE" stroke-width="1"/>
    <text x="609" y="210" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Politique inventée · résiliations</text>
    <text x="609" y="226" class="mono" font-size="11" fill="#5A5A5A">AVRIL 2025</text>
  </g>

  <g class="interactive" data-card="deloitte" tabindex="0" role="button" aria-label="Rapport public à citations fabriquées — cliquez pour les détails">
    <circle cx="650" cy="264" r="5.5" fill="#B7332C"/>
    <line x1="650" y1="270" x2="650" y2="284" stroke="#B8B5AE" stroke-width="1"/>
    <text x="658" y="300" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Rapport public · citations fabriquées</text>
    <text x="658" y="316" class="mono" font-size="11" fill="#5A5A5A">JUILLET 2025</text>
  </g>

  <!-- ===== LANE 2 : décisions ===== -->
  <line x1="150" y1="428" x2="1140" y2="428" stroke="#E5E1D8" stroke-width="1"/>

  <g class="interactive" data-card="air-canada" tabindex="0" role="button" aria-label="Décision Moffatt contre Air Canada — cliquez pour les détails">
    <circle cx="372" cy="428" r="7" fill="#1F5560"/>
    <circle cx="372" cy="428" r="12" fill="none" stroke="#1F5560" stroke-width="1" opacity="0.45"/>
    <line x1="372" y1="416" x2="372" y2="392" stroke="#1F5560" stroke-width="1"/>
    <text x="372" y="386" class="display" font-size="15" font-weight="600" fill="#1F5560" text-anchor="middle">Moffatt c. Air Canada</text>
    <text x="372" y="370" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">14 FÉV 2024 · 812,02 $ CA</text>
  </g>

  <g class="interactive" data-card="mobley" tabindex="0" role="button" aria-label="Affaire Mobley contre Workday, trois étapes — cliquez pour les détails">
    <circle cx="454" cy="428" r="5.5" fill="#1F5560"/>
    <line x1="454" y1="434" x2="454" y2="452" stroke="#B8B5AE" stroke-width="1"/>
    <text x="454" y="468" class="body" font-size="13" fill="#1A1A1A" text-anchor="middle">Théorie de l'agent</text>
    <text x="454" y="484" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">JUIL 2024</text>
    <circle cx="617" cy="428" r="5.5" fill="#1F5560"/>
    <line x1="617" y1="434" x2="617" y2="452" stroke="#B8B5AE" stroke-width="1"/>
    <text x="617" y="468" class="body" font-size="13" fill="#1A1A1A" text-anchor="middle">Action collective certifiée</text>
    <text x="617" y="484" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">MAI 2025</text>
    <circle cx="813" cy="428" r="5.5" fill="#1F5560"/>
    <line x1="813" y1="416" x2="813" y2="398" stroke="#B8B5AE" stroke-width="1"/>
    <text x="813" y="392" class="body" font-size="13" fill="#1A1A1A" text-anchor="middle">Tests protégés par le secret</text>
    <text x="813" y="376" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">MAI 2026</text>
  </g>

  <g class="interactive" data-card="deloitte-refund" tabindex="0" role="button" aria-label="Remboursement partiel du contrat public — cliquez pour les détails">
    <circle cx="699" cy="428" r="5.5" fill="#1F5560"/>
    <line x1="699" y1="416" x2="699" y2="398" stroke="#B8B5AE" stroke-width="1"/>
    <text x="699" y="392" class="body" font-size="13" fill="#1A1A1A" text-anchor="middle">Remboursement partiel</text>
    <text x="699" y="376" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">OCT 2025</text>
  </g>

  <!-- ===== LANE 3 : cadre ===== -->
  <line x1="150" y1="590" x2="1140" y2="590" stroke="#E5E1D8" stroke-width="1"/>

  <g class="interactive" data-card="pld" tabindex="0" role="button" aria-label="Directive 2024/2853 sur la responsabilité du fait des produits défectueux — cliquez pour les détails">
    <rect x="536" y="574" width="391" height="32" fill="#B58A2C" opacity="0.16"/>
    <circle cx="536" cy="590" r="5.5" fill="#B58A2C"/>
    <text x="544" y="568" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Directive 2024/2853 · en vigueur</text>
    <text x="544" y="552" class="mono" font-size="11" fill="#5A5A5A">DÉC 2024</text>
    <circle cx="927" cy="590" r="7" fill="#B58A2C"/>
    <line x1="927" y1="598" x2="927" y2="622" stroke="#B58A2C" stroke-width="1"/>
    <text x="927" y="638" class="display" font-size="15" font-weight="600" fill="#B58A2C" text-anchor="middle">Transposition · présomption</text>
    <text x="927" y="654" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">9 DÉC 2026</text>
  </g>

  <g class="interactive" data-card="aild" tabindex="0" role="button" aria-label="Retrait de la directive responsabilité IA — cliquez pour les détails">
    <circle cx="568" cy="590" r="5.5" fill="#B8B5AE"/>
    <line x1="568" y1="598" x2="568" y2="622" stroke="#B8B5AE" stroke-width="1"/>
    <text x="568" y="638" class="body" font-size="13" fill="#5A5A5A" text-anchor="middle">Retrait directive resp. IA</text>
    <text x="568" y="654" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">FÉV → OCT 2025</text>
  </g>

  <g class="interactive" data-card="assurance" tabindex="0" role="button" aria-label="Exclusions d'assurance visant l'IA générative — cliquez pour les détails">
    <circle cx="748" cy="590" r="5.5" fill="#B7332C"/>
    <line x1="748" y1="582" x2="748" y2="558" stroke="#B7332C" stroke-width="1"/>
    <text x="748" y="552" class="body" font-size="13" font-weight="600" fill="#B7332C" text-anchor="middle">Exclusions IA générative</text>
    <text x="748" y="536" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">1ᵉʳ JAN 2026</text>
  </g>

  <g class="interactive" data-card="aiact" tabindex="0" role="button" aria-label="Calendrier de l'AI Act, article 50 et article 26 — cliquez pour les détails">
    <circle cx="862" cy="590" r="7" fill="#B58A2C"/>
    <line x1="862" y1="598" x2="862" y2="622" stroke="#B58A2C" stroke-width="1"/>
    <text x="862" y="638" class="display" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="middle">AI Act art. 50</text>
    <text x="862" y="654" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">2 AOÛT 2026</text>
    <circle cx="1124" cy="590" r="5.5" fill="#B8B5AE"/>
    <line x1="1124" y1="582" x2="1124" y2="558" stroke="#B8B5AE" stroke-width="1"/>
    <text x="1136" y="552" class="body" font-size="13" fill="#5A5A5A" text-anchor="end">AI Act art. 26 · haut risque</text>
    <text x="1136" y="536" class="mono" font-size="11" fill="#5A5A5A" text-anchor="end">2 DÉC 2027 (reporté)</text>
  </g>

  <!-- ===== axis ===== -->
  <line x1="150" y1="712" x2="1148" y2="712" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arw1)"/>
  <g class="mono" font-size="12" fill="#5A5A5A" text-anchor="middle">
    <text x="160" y="734">2023</text>
    <text x="356" y="734">2024</text>
    <text x="552" y="734">2025</text>
    <text x="748" y="734">2026</text>
    <text x="944" y="734">2027</text>
    <text x="1140" y="734">2028</text>
  </g>
  <g stroke="#B8B5AE" stroke-width="1">
    <line x1="160" y1="706" x2="160" y2="718"/>
    <line x1="356" y1="706" x2="356" y2="718"/>
    <line x1="552" y1="706" x2="552" y2="718"/>
    <line x1="748" y1="706" x2="748" y2="718"/>
    <line x1="944" y1="706" x2="944" y2="718"/>
    <line x1="1140" y1="706" x2="1140" y2="718"/>
  </g>

  <!-- footer note -->
  <line x1="64" y1="770" x2="1136" y2="770" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="794" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Douze mois séparent la sanction civile de l'absence de journal (déc. 2026) de l'obligation réglementaire de le tenir (déc. 2027).</text>
  <text x="64" y="814" class="mono" font-size="11" letter-spacing="0.06em" fill="#B8B5AE">CORPUS DATÉ ET PUBLIC · SOURCES [1] [3] [4] [6] [7] [8] [9] [11] [13] [16]</text>
</svg>
