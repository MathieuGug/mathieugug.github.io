<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Le dossier de preuve d'un agent : sept postes, qui les produit, s'ils existent par défaut et combien de temps les conserver">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Sept postes — trois existent déjà, quatre se paient</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le dossier qu'il faudra ouvrir six mois après l'incident, et qui ne se constitue pas rétroactivement</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <g class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A">
    <text x="64" y="192">LE POSTE</text>
    <text x="500" y="192">CE QU'IL ÉTABLIT</text>
    <text x="850" y="192">EXISTE PAR DÉFAUT ?</text>
    <text x="1020" y="192">CONSERVATION</text>
  </g>
  <line x1="64" y1="202" x2="1136" y2="202" stroke="#B8B5AE" stroke-width="1"/>

  <g class="interactive" data-card="journal-echange" tabindex="0" role="button" aria-label="Postes 1 à 3, la trace de l'échange — cliquez pour les détails">
    <rect x="64" y="210" width="1072" height="78" fill="#F2EFE7" opacity="0.7"/>
    <text x="82" y="240" class="mono" font-size="12" fill="#1F5560">01</text>
    <text x="116" y="240" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Transcription horodatée</text>
    <text x="116" y="264" class="body" font-size="13" fill="#5A5A5A">identifiant de session · identité du mandant si l'agent agit pour un compte</text>
    <text x="500" y="240" class="body" font-size="14" fill="#1A1A1A">Ce qui a effectivement été dit</text>
    <text x="500" y="264" class="body" font-size="13" font-style="italic" fill="#5A5A5A">La pièce zéro : sans elle, rien d'autre ne sert</text>
    <text x="850" y="240" class="body" font-size="14" font-weight="600" fill="#1F5560">Souvent</text>
    <text x="1020" y="240" class="body" font-size="14" fill="#1A1A1A">Prescription civile</text>

    <rect x="64" y="292" width="1072" height="78" fill="#FAF8F3"/>
    <text x="82" y="322" class="mono" font-size="12" fill="#B7332C">02</text>
    <text x="116" y="322" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Version du système</text>
    <text x="116" y="346" class="body" font-size="13" fill="#5A5A5A">invite · modèle · base documentaire · configuration des garde-fous</text>
    <text x="500" y="322" class="body" font-size="14" fill="#1A1A1A">Sur quelle base l'agent a répondu</text>
    <text x="500" y="346" class="body" font-size="13" font-style="italic" fill="#B7332C">Le poste le plus souvent manquant</text>
    <text x="850" y="322" class="body" font-size="14" font-weight="600" fill="#B7332C">Non</text>
    <text x="1020" y="322" class="body" font-size="14" fill="#1A1A1A">Prescription civile</text>

    <rect x="64" y="374" width="1072" height="78" fill="#F2EFE7" opacity="0.7"/>
    <text x="82" y="404" class="mono" font-size="12" fill="#B7332C">03</text>
    <text x="116" y="404" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Outils appelés et résultats</text>
    <text x="116" y="428" class="body" font-size="13" fill="#5A5A5A">paramètres transmis · valeur retournée · échecs</text>
    <text x="500" y="404" class="body" font-size="14" fill="#1A1A1A">Si l'agent a agi ou seulement parlé</text>
    <text x="500" y="428" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Distinction qui commande le régime applicable</text>
    <text x="850" y="404" class="body" font-size="14" font-weight="600" fill="#B7332C">Non</text>
    <text x="1020" y="404" class="body" font-size="14" fill="#1A1A1A">Prescription civile</text>
  </g>

  <g class="interactive" data-card="frontiere-outils" tabindex="0" role="button" aria-label="Postes 4 et 5, la frontière déclarée et le jeu d'évaluation — cliquez pour les détails">
    <rect x="64" y="456" width="1072" height="78" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25"/>
    <text x="82" y="486" class="mono" font-size="12" fill="#B7332C">04</text>
    <text x="116" y="486" class="display" font-size="17" font-weight="600" fill="#1A1A1A">La frontière déclarée</text>
    <text x="116" y="510" class="body" font-size="13" fill="#5A5A5A">ce que l'agent n'a pas le droit d'affirmer ni d'engager — écrit et daté</text>
    <text x="500" y="486" class="body" font-size="14" font-weight="600" fill="#1A1A1A">La diligence</text>
    <text x="500" y="510" class="body" font-size="13" font-style="italic" fill="#B7332C">Sans valeur si postérieure à l'incident</text>
    <text x="850" y="486" class="body" font-size="14" font-weight="600" fill="#B7332C">Jamais</text>
    <text x="1020" y="486" class="body" font-size="14" fill="#1A1A1A">Permanente, versionnée</text>

    <rect x="64" y="538" width="1072" height="78" fill="#F2EFE7" opacity="0.7"/>
    <text x="82" y="568" class="mono" font-size="12" fill="#B7332C">05</text>
    <text x="116" y="568" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Jeu d'évaluation et résultats</text>
    <text x="116" y="592" class="body" font-size="13" fill="#5A5A5A">avec la date de chaque passage</text>
    <text x="500" y="568" class="body" font-size="14" fill="#1A1A1A">« Aviez-vous vérifié ? »</text>
    <text x="500" y="592" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Sous réserve de l'arbitrage de secret professionnel</text>
    <text x="850" y="568" class="body" font-size="14" font-weight="600" fill="#B7332C">Non</text>
    <text x="1020" y="568" class="body" font-size="14" fill="#1A1A1A">Permanente</text>
  </g>

  <g class="interactive" data-card="retention" tabindex="0" role="button" aria-label="Postes 6 et 7, les escalades et la politique de conservation — cliquez pour les détails">
    <rect x="64" y="620" width="1072" height="78" fill="#FAF8F3"/>
    <text x="82" y="650" class="mono" font-size="12" fill="#1F5560">06</text>
    <text x="116" y="650" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Journal des escalades</text>
    <text x="116" y="674" class="body" font-size="13" fill="#5A5A5A">les cas où l'agent a passé la main — et ceux où il aurait dû</text>
    <text x="500" y="650" class="body" font-size="14" fill="#1A1A1A">Que la surveillance humaine existait</text>
    <text x="500" y="674" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Exigible à l'art. 26 à partir de décembre 2027</text>
    <text x="850" y="650" class="body" font-size="14" font-weight="600" fill="#B58A2C">Partiellement</text>
    <text x="1020" y="650" class="body" font-size="14" fill="#1A1A1A">6 mois minimum</text>

    <rect x="64" y="702" width="1072" height="78" fill="#F2EFE7" opacity="0.7"/>
    <text x="82" y="732" class="mono" font-size="12" fill="#1F5560">07</text>
    <text x="116" y="732" class="display" font-size="17" font-weight="600" fill="#1A1A1A">La politique de conservation</text>
    <text x="116" y="756" class="body" font-size="13" fill="#5A5A5A">opposable — et respectée</text>
    <text x="500" y="732" class="body" font-size="14" fill="#1A1A1A">Que la destruction n'était pas opportune</text>
    <text x="500" y="756" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Six mois est un plancher, pas une cible</text>
    <text x="850" y="732" class="body" font-size="14" font-weight="600" fill="#B7332C">Jamais</text>
    <text x="1020" y="732" class="body" font-size="14" fill="#1A1A1A">Décision de direction</text>
  </g>

  <line x1="64" y1="800" x2="1136" y2="800" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="824" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Le plancher réglementaire est de six mois ; les délais de prescription civile, eux, se comptent en années. L'écart est une décision, pas un oubli.</text>
</svg>
