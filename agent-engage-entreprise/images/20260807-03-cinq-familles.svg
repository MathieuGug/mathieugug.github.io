<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Cinq familles d'engagement : ce qui bascule, le régime juridique mobilisé et l'incident emblématique de chacune">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Cinq familles, cinq régimes, aucune orpheline</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce qui distingue les incidents n'est pas la technique employée — c'est ce que la sortie de l'agent fait basculer</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- column heads -->
  <g class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A">
    <text x="64" y="192">LA FAMILLE</text>
    <text x="352" y="192">CE QUI BASCULE</text>
    <text x="686" y="192">RÉGIME MOBILISÉ</text>
    <text x="944" y="192">INCIDENT EMBLÉMATIQUE</text>
  </g>
  <line x1="64" y1="202" x2="1136" y2="202" stroke="#B8B5AE" stroke-width="1"/>

  <!-- row 1 -->
  <g class="interactive" data-card="parole" tabindex="0" role="button" aria-label="Famille 1, la parole qui devient promesse — cliquez pour les détails">
    <rect x="64" y="210" width="1072" height="100" fill="#F2EFE7" opacity="0.7"/>
    <rect x="64" y="210" width="4" height="100" fill="#B7332C"/>
    <text x="88" y="240" class="mono" font-size="11" fill="#B7332C">01</text>
    <text x="88" y="266" class="display" font-size="18" font-weight="600" fill="#1A1A1A">La parole</text>
    <text x="88" y="288" class="display" font-size="18" font-weight="600" fill="#1A1A1A">qui devient promesse</text>
    <text x="352" y="248" class="body" font-size="14" fill="#1A1A1A">L'agent énonce une politique commerciale</text>
    <text x="352" y="270" class="body" font-size="14" fill="#1A1A1A">qui n'existe pas, et le client agit dessus.</text>
    <text x="352" y="292" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Le préjudice est immédiat et chiffrable.</text>
    <text x="686" y="248" class="body" font-size="14" fill="#1A1A1A">Responsabilité contractuelle</text>
    <text x="686" y="270" class="body" font-size="14" fill="#1A1A1A">et précontractuelle · obligation</text>
    <text x="686" y="292" class="body" font-size="14" fill="#1A1A1A">d'information · pratique trompeuse</text>
    <text x="944" y="248" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Air Canada · 2024</text>
    <text x="944" y="270" class="body" font-size="14" fill="#5A5A5A">Cursor · 2025</text>
  </g>

  <!-- row 2 -->
  <g class="interactive" data-card="contenu" tabindex="0" role="button" aria-label="Famille 2, le contenu qui devient préjudice — cliquez pour les détails">
    <rect x="64" y="318" width="1072" height="100" fill="#FAF8F3"/>
    <rect x="64" y="318" width="4" height="100" fill="#B7332C"/>
    <text x="88" y="348" class="mono" font-size="11" fill="#B7332C">02</text>
    <text x="88" y="374" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Le contenu</text>
    <text x="88" y="396" class="display" font-size="18" font-weight="600" fill="#1A1A1A">qui devient préjudice</text>
    <text x="352" y="356" class="body" font-size="14" fill="#1A1A1A">L'agent affirme un fait faux sur un tiers</text>
    <text x="352" y="378" class="body" font-size="14" fill="#1A1A1A">identifiable, et l'affirmation est publiée.</text>
    <text x="352" y="400" class="body" font-size="13" font-style="italic" fill="#5A5A5A">La victime n'est pas le client.</text>
    <text x="686" y="356" class="body" font-size="14" fill="#1A1A1A">Diffamation · dénigrement</text>
    <text x="686" y="378" class="body" font-size="14" fill="#1A1A1A">concurrence déloyale</text>
    <text x="944" y="356" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Résumé génératif</text>
    <text x="944" y="378" class="body" font-size="14" fill="#5A5A5A">Minnesota · 2025-2026</text>
  </g>

  <!-- row 3 -->
  <g class="interactive" data-card="decision" tabindex="0" role="button" aria-label="Famille 3, la décision qui devient discrimination — cliquez pour les détails">
    <rect x="64" y="426" width="1072" height="100" fill="#F2EFE7" opacity="0.7"/>
    <rect x="64" y="426" width="4" height="100" fill="#1F5560"/>
    <text x="88" y="456" class="mono" font-size="11" fill="#1F5560">03</text>
    <text x="88" y="482" class="display" font-size="18" font-weight="600" fill="#1A1A1A">La décision qui</text>
    <text x="88" y="504" class="display" font-size="18" font-weight="600" fill="#1A1A1A">devient discrimination</text>
    <text x="352" y="464" class="body" font-size="14" fill="#1A1A1A">L'agent trie, classe, filtre — et le tri</text>
    <text x="352" y="486" class="body" font-size="14" fill="#1A1A1A">reproduit un critère protégé.</text>
    <text x="352" y="508" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Le dommage est collectif et rétroactif.</text>
    <text x="686" y="464" class="body" font-size="14" fill="#1A1A1A">Non-discrimination · théorie</text>
    <text x="686" y="486" class="body" font-size="14" fill="#1A1A1A">de l'agent · RGPD art. 22</text>
    <text x="686" y="508" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Le fournisseur devient co-défendeur.</text>
    <text x="944" y="464" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Mobley c. Workday</text>
    <text x="944" y="486" class="body" font-size="14" fill="#5A5A5A">2024 · 2025 · 2026</text>
  </g>

  <!-- row 4 -->
  <g class="interactive" data-card="livrable" tabindex="0" role="button" aria-label="Famille 4, le livrable qui devient inexécution — cliquez pour les détails">
    <rect x="64" y="534" width="1072" height="100" fill="#FAF8F3"/>
    <rect x="64" y="534" width="4" height="100" fill="#B58A2C"/>
    <text x="88" y="564" class="mono" font-size="11" fill="#B58A2C">04</text>
    <text x="88" y="590" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Le livrable qui</text>
    <text x="88" y="612" class="display" font-size="18" font-weight="600" fill="#1A1A1A">devient inexécution</text>
    <text x="352" y="572" class="body" font-size="14" fill="#1A1A1A">L'agent produit un travail commandé,</text>
    <text x="352" y="594" class="body" font-size="14" fill="#1A1A1A">et ce travail contient des éléments fabriqués.</text>
    <text x="352" y="616" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Le client découvre par un tiers lecteur.</text>
    <text x="686" y="572" class="body" font-size="14" fill="#1A1A1A">Responsabilité contractuelle</text>
    <text x="686" y="594" class="body" font-size="14" fill="#1A1A1A">obligation renforcée du</text>
    <text x="686" y="616" class="body" font-size="14" fill="#1A1A1A">prestataire intellectuel</text>
    <text x="944" y="572" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Rapport public</text>
    <text x="944" y="594" class="body" font-size="14" fill="#5A5A5A">Australie · 2025</text>
  </g>

  <!-- row 5 -->
  <g class="interactive" data-card="detourne" tabindex="0" role="button" aria-label="Famille 5, l'agent qui devient vecteur — cliquez pour les détails">
    <rect x="64" y="642" width="1072" height="100" fill="#F2EFE7" opacity="0.7"/>
    <rect x="64" y="642" width="4" height="100" fill="#B8B5AE"/>
    <text x="88" y="672" class="mono" font-size="11" fill="#5A5A5A">05</text>
    <text x="88" y="698" class="display" font-size="18" font-weight="600" fill="#1A1A1A">L'agent qui</text>
    <text x="88" y="720" class="display" font-size="18" font-weight="600" fill="#1A1A1A">devient vecteur</text>
    <text x="352" y="680" class="body" font-size="14" fill="#1A1A1A">L'agent exécute ce qu'un tiers a écrit</text>
    <text x="352" y="702" class="body" font-size="14" fill="#1A1A1A">dans un document qu'il a lu.</text>
    <text x="352" y="724" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Démonstrations nombreuses, jugements rares.</text>
    <text x="686" y="680" class="body" font-size="14" fill="#1A1A1A">Manquement à la sécurité</text>
    <text x="686" y="702" class="body" font-size="14" fill="#1A1A1A">au sens du RGPD · art. 32</text>
    <text x="944" y="680" class="body" font-size="14" font-style="italic" fill="#5A5A5A">Sous-représentée :</text>
    <text x="944" y="702" class="body" font-size="14" font-style="italic" fill="#5A5A5A">préjudice diffus</text>
  </g>

  <line x1="64" y1="758" x2="1136" y2="758" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="782" class="mono" font-size="11" letter-spacing="0.06em" fill="#B8B5AE">CORPUS RESTREINT AUX INCIDENTS DATÉS, PUBLICS ET VÉRIFIABLES · SOURCES [1] [3] [4] [5] [6] [7]</text>
</svg>
