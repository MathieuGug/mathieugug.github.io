<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Carte des régimes de responsabilité applicables en 2026 : cinq fondements cumulatifs et la case laissée ouverte par le retrait de la directive responsabilité IA">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>
  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Il n'y a pas de vide — il y a un cumul</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Cinq fondements visent le déployeur, et ils ne s'excluent pas : ils s'additionnent sur le même incident</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- central node -->
  <rect x="440" y="184" width="320" height="52" fill="#1A1A1A"/>
  <text x="600" y="216" class="display" font-size="20" font-weight="600" fill="#FAF8F3" text-anchor="middle">LE DÉPLOYEUR DE L'AGENT</text>

  <!-- connectors -->
  <g stroke="#B8B5AE" stroke-width="1">
    <line x1="168" y1="256" x2="168" y2="278"/>
    <line x1="384" y1="256" x2="384" y2="278"/>
    <line x1="600" y1="240" x2="600" y2="278"/>
    <line x1="816" y1="256" x2="816" y2="278"/>
    <line x1="1032" y1="256" x2="1032" y2="278"/>
    <line x1="168" y1="256" x2="1032" y2="256"/>
  </g>

  <!-- card 1 -->
  <g class="interactive" data-card="contrat" tabindex="0" role="button" aria-label="Droit des contrats et de la consommation — cliquez pour les détails">
    <rect x="64" y="278" width="208" height="286" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="64" y="278" width="208" height="4" fill="#1F5560"/>
    <text x="84" y="308" class="mono" font-size="11" letter-spacing="0.06em" fill="#1F5560">DÉJÀ APPLICABLE</text>
    <text x="84" y="338" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Contrats et</text>
    <text x="84" y="358" class="display" font-size="17" font-weight="600" fill="#1A1A1A">consommation</text>
    <line x1="84" y1="374" x2="252" y2="374" stroke="#E5E1D8" stroke-width="1"/>
    <text x="84" y="398" class="body" font-size="13" fill="#5A5A5A">Qui est visé</text>
    <text x="84" y="418" class="body" font-size="14" fill="#1A1A1A">Le déployeur, seul</text>
    <text x="84" y="446" class="body" font-size="13" fill="#5A5A5A">Ce qu'il faut produire</text>
    <text x="84" y="466" class="body" font-size="14" fill="#1A1A1A">Ce qui a été dit,</text>
    <text x="84" y="486" class="body" font-size="14" fill="#1A1A1A">et sur quelle base</text>
    <text x="84" y="522" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Le plus rapide et</text>
    <text x="84" y="540" class="body" font-size="13" font-style="italic" fill="#5A5A5A">le moins commenté.</text>
  </g>

  <!-- card 2 -->
  <g class="interactive" data-card="pld" tabindex="0" role="button" aria-label="Directive 2024/2853 sur la responsabilité du fait des produits — cliquez pour les détails">
    <rect x="280" y="278" width="208" height="286" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="280" y="278" width="208" height="4" fill="#B7332C"/>
    <text x="300" y="308" class="mono" font-size="11" letter-spacing="0.06em" fill="#B7332C">9 DÉCEMBRE 2026</text>
    <text x="300" y="338" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Directive (UE)</text>
    <text x="300" y="358" class="display" font-size="17" font-weight="600" fill="#1A1A1A">2024/2853</text>
    <line x1="300" y1="374" x2="468" y2="374" stroke="#E5E1D8" stroke-width="1"/>
    <text x="300" y="398" class="body" font-size="13" fill="#5A5A5A">Qui est visé</text>
    <text x="300" y="418" class="body" font-size="14" fill="#1A1A1A">Le producteur du</text>
    <text x="300" y="438" class="body" font-size="14" fill="#1A1A1A">logiciel, et la chaîne</text>
    <text x="300" y="466" class="body" font-size="13" fill="#5A5A5A">Ce qu'il faut produire</text>
    <text x="300" y="486" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Tout élément</text>
    <text x="300" y="506" class="body" font-size="14" font-weight="600" fill="#1A1A1A">demandé — sinon</text>
    <text x="300" y="526" class="body" font-size="14" font-weight="600" fill="#B7332C">présomption</text>
    <text x="300" y="550" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Responsabilité sans faute.</text>
  </g>

  <!-- card 3 -->
  <g class="interactive" data-card="aiact50" tabindex="0" role="button" aria-label="AI Act article 50, obligation de transparence — cliquez pour les détails">
    <rect x="496" y="278" width="208" height="286" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="496" y="278" width="208" height="4" fill="#B58A2C"/>
    <text x="516" y="308" class="mono" font-size="11" letter-spacing="0.06em" fill="#B58A2C">2 AOÛT 2026 · EN VIGUEUR</text>
    <text x="516" y="338" class="display" font-size="17" font-weight="600" fill="#1A1A1A">AI Act</text>
    <text x="516" y="358" class="display" font-size="17" font-weight="600" fill="#1A1A1A">article 50</text>
    <line x1="516" y1="374" x2="684" y2="374" stroke="#E5E1D8" stroke-width="1"/>
    <text x="516" y="398" class="body" font-size="13" fill="#5A5A5A">Qui est visé</text>
    <text x="516" y="418" class="body" font-size="14" fill="#1A1A1A">Fournisseur et</text>
    <text x="516" y="438" class="body" font-size="14" fill="#1A1A1A">déployeur</text>
    <text x="516" y="466" class="body" font-size="13" fill="#5A5A5A">Ce qu'il faut produire</text>
    <text x="516" y="486" class="body" font-size="14" fill="#1A1A1A">La mention que</text>
    <text x="516" y="506" class="body" font-size="14" fill="#1A1A1A">l'interlocuteur est</text>
    <text x="516" y="526" class="body" font-size="14" fill="#1A1A1A">une IA</text>
    <text x="516" y="550" class="body" font-size="13" font-style="italic" fill="#5A5A5A">La seule qui morde aujourd'hui.</text>
  </g>

  <!-- card 4 -->
  <g class="interactive" data-card="aiact26" tabindex="0" role="button" aria-label="AI Act article 26, obligations du déployeur de système à haut risque — cliquez pour les détails">
    <rect x="712" y="278" width="208" height="286" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="5 4"/>
    <rect x="712" y="278" width="208" height="4" fill="#B8B5AE"/>
    <text x="732" y="308" class="mono" font-size="11" letter-spacing="0.06em" fill="#5A5A5A">2 DÉC. 2027 · REPORTÉ</text>
    <text x="732" y="338" class="display" font-size="17" font-weight="600" fill="#5A5A5A">AI Act</text>
    <text x="732" y="358" class="display" font-size="17" font-weight="600" fill="#5A5A5A">article 26</text>
    <line x1="732" y1="374" x2="900" y2="374" stroke="#E5E1D8" stroke-width="1"/>
    <text x="732" y="398" class="body" font-size="13" fill="#5A5A5A">Qui est visé</text>
    <text x="732" y="418" class="body" font-size="14" fill="#1A1A1A">Le déployeur d'un</text>
    <text x="732" y="438" class="body" font-size="14" fill="#1A1A1A">système à haut risque</text>
    <text x="732" y="466" class="body" font-size="13" fill="#5A5A5A">Ce qu'il faut produire</text>
    <text x="732" y="486" class="body" font-size="14" fill="#1A1A1A">Journaux ≥ 6 mois,</text>
    <text x="732" y="506" class="body" font-size="14" fill="#1A1A1A">surveillance humaine</text>
    <text x="732" y="540" class="body" font-size="13" font-style="italic" fill="#B7332C">Exigible après la</text>
    <text x="732" y="556" class="body" font-size="13" font-style="italic" fill="#B7332C">présomption civile.</text>
  </g>

  <!-- card 5 -->
  <g class="interactive" data-card="discrimination" tabindex="0" role="button" aria-label="Non-discrimination et décision automatisée — cliquez pour les détails">
    <rect x="928" y="278" width="208" height="286" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="928" y="278" width="208" height="4" fill="#1F5560"/>
    <text x="948" y="308" class="mono" font-size="11" letter-spacing="0.06em" fill="#1F5560">DÉJÀ APPLICABLE</text>
    <text x="948" y="338" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Non-discrimination</text>
    <text x="948" y="358" class="display" font-size="17" font-weight="600" fill="#1A1A1A">et RGPD art. 22</text>
    <line x1="948" y1="374" x2="1116" y2="374" stroke="#E5E1D8" stroke-width="1"/>
    <text x="948" y="398" class="body" font-size="13" fill="#5A5A5A">Qui est visé</text>
    <text x="948" y="418" class="body" font-size="14" fill="#1A1A1A">Le déployeur — et le</text>
    <text x="948" y="438" class="body" font-size="14" fill="#1A1A1A">fournisseur comme agent</text>
    <text x="948" y="466" class="body" font-size="13" fill="#5A5A5A">Ce qu'il faut produire</text>
    <text x="948" y="486" class="body" font-size="14" fill="#1A1A1A">La logique du tri</text>
    <text x="948" y="506" class="body" font-size="14" fill="#1A1A1A">et les tests de biais</text>
    <text x="948" y="540" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Un second défendeur,</text>
    <text x="948" y="556" class="body" font-size="13" font-style="italic" fill="#5A5A5A">pas un substitut.</text>
  </g>

  <!-- AILD empty box -->
  <g class="interactive" data-card="aild-vide" tabindex="0" role="button" aria-label="La case laissée ouverte par le retrait de la directive responsabilité IA — cliquez pour les détails">
    <rect x="64" y="600" width="1072" height="92" fill="none" stroke="#B8B5AE" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="88" y="630" class="mono" font-size="11" letter-spacing="0.08em" fill="#B8B5AE">RETIRÉE — FÉVRIER 2025 (ANNONCE) → OCTOBRE 2025 (RETRAIT FORMEL)</text>
    <text x="88" y="660" class="display" font-size="19" font-weight="600" fill="#5A5A5A">Directive sur la responsabilité en matière d'IA</text>
    <text x="560" y="660" class="body" font-size="15" fill="#1A1A1A">Elle devait harmoniser les présomptions. Son abandon n'exonère personne :</text>
    <text x="560" y="682" class="body" font-size="15" font-weight="600" fill="#1A1A1A">il renvoie à vingt-sept droits nationaux. La variance augmente, pas le risque zéro.</text>
  </g>

  <line x1="64" y1="722" x2="1136" y2="722" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="748" class="mono" font-size="11" letter-spacing="0.06em" fill="#B8B5AE">SOURCES [5] [8] [9] [10] [11] [13] [14] · REPORT DE L'ARTICLE 26 : ACCORD OMNIBUS NUMÉRIQUE, APPROBATION PARLEMENTAIRE DU 16 JUIN 2026</text>
</svg>
