<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Le renversement probatoire : ce que le demandeur devait établir avant décembre 2026 et ce que le défendeur doit produire après">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>
  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La charge de la preuve change de camp</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ne pas pouvoir produire cesse d'être une faiblesse tactique pour devenir une présomption contre soi</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ============ LEFT : avant ============ -->
  <g class="interactive" data-card="avant" tabindex="0" role="button" aria-label="Le régime avant la transposition — cliquez pour les détails">
    <rect x="64" y="188" width="480" height="384" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <text x="88" y="220" class="mono" font-size="12" letter-spacing="0.08em" fill="#5A5A5A">JUSQU'AU 8 DÉCEMBRE 2026</text>
    <text x="88" y="252" class="display" font-size="22" font-weight="600" fill="#1A1A1A">La faute doit être prouvée</text>
    <line x1="88" y1="270" x2="520" y2="270" stroke="#B8B5AE" stroke-width="1"/>

    <text x="88" y="300" class="mono" font-size="11" letter-spacing="0.08em" fill="#1F5560">CE QUE LE DEMANDEUR DOIT ÉTABLIR</text>
    <g class="body" font-size="15" fill="#1A1A1A">
      <circle cx="96" cy="322" r="3.5" fill="#1F5560"/><text x="110" y="327">Une faute — négligence, manquement</text>
      <circle cx="96" cy="350" r="3.5" fill="#1F5560"/><text x="110" y="355">L'inexactitude de la déclaration</text>
      <circle cx="96" cy="378" r="3.5" fill="#1F5560"/><text x="110" y="383">Le lien de causalité</text>
      <circle cx="96" cy="406" r="3.5" fill="#1F5560"/><text x="110" y="411">Le dommage</text>
    </g>

    <line x1="88" y1="436" x2="520" y2="436" stroke="#E5E1D8" stroke-width="1"/>
    <text x="88" y="466" class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A">POSITION DU DÉFENDEUR</text>
    <text x="88" y="494" class="body" font-size="16" fill="#1A1A1A">Il peut se taire.</text>
    <text x="88" y="522" class="body" font-size="15" fill="#5A5A5A">L'absence de journal est une faiblesse</text>
    <text x="88" y="544" class="body" font-size="15" fill="#5A5A5A">tactique — c'est ce qui a coûté Air Canada.</text>
  </g>

  <!-- ============ CENTER arrow ============ -->
  <line x1="560" y1="380" x2="636" y2="380" stroke="#B7332C" stroke-width="2" marker-end="url(#arw5)"/>
  <text x="598" y="362" class="mono" font-size="11" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">DIR. 2024/2853</text>

  <!-- ============ RIGHT : après ============ -->
  <g class="interactive" data-card="presomption" tabindex="0" role="button" aria-label="La présomption de défectuosité — cliquez pour les détails">
    <rect x="656" y="188" width="480" height="384" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="680" y="220" class="mono" font-size="12" letter-spacing="0.08em" fill="#B7332C">À PARTIR DU 9 DÉCEMBRE 2026</text>
    <text x="680" y="252" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Le défaut peut être présumé</text>
    <line x1="680" y1="270" x2="1112" y2="270" stroke="#B8B5AE" stroke-width="1"/>

    <text x="680" y="300" class="mono" font-size="11" letter-spacing="0.08em" fill="#1F5560">CE QUE LE DEMANDEUR DOIT ÉTABLIR</text>
    <g class="body" font-size="15" fill="#1A1A1A">
      <circle cx="688" cy="322" r="3.5" fill="#1F5560"/><text x="702" y="327">Un défaut du produit — plus une faute</text>
      <circle cx="688" cy="350" r="3.5" fill="#1F5560"/><text x="702" y="355">Le dommage</text>
      <circle cx="688" cy="378" r="3.5" fill="#B8B5AE"/><text x="702" y="383" fill="#5A5A5A">Le lien causal — présumable si la preuve</text>
      <text x="702" y="401" fill="#5A5A5A">est rendue excessivement difficile</text>
    </g>

    <line x1="680" y1="436" x2="1112" y2="436" stroke="#E5E1D8" stroke-width="1"/>
    <text x="680" y="466" class="mono" font-size="11" letter-spacing="0.08em" fill="#B7332C">POSITION DU DÉFENDEUR</text>
    <text x="680" y="494" class="body" font-size="16" font-weight="600" fill="#1A1A1A">Il doit produire les éléments demandés.</text>
    <text x="680" y="522" class="body" font-size="15" font-weight="600" fill="#B7332C">Refuser — ou ne pas pouvoir — fonde</text>
    <text x="680" y="544" class="body" font-size="15" font-weight="600" fill="#B7332C">la présomption de défectuosité.</text>
  </g>

  <!-- bottom : divulgation + privilège -->
  <g class="interactive" data-card="divulgation" tabindex="0" role="button" aria-label="L'obligation de divulgation des éléments de preuve — cliquez pour les détails">
    <rect x="64" y="600" width="524" height="110" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="64" y="600" width="4" height="110" fill="#B58A2C"/>
    <text x="88" y="628" class="mono" font-size="11" letter-spacing="0.08em" fill="#B58A2C">LE MÉCANISME</text>
    <text x="88" y="654" class="display" font-size="17" font-weight="600" fill="#1A1A1A">L'obligation de divulgation</text>
    <text x="88" y="680" class="body" font-size="14" fill="#1A1A1A">Le juge peut enjoindre au défendeur de produire</text>
    <text x="88" y="700" class="body" font-size="14" fill="#1A1A1A">les éléments pertinents dont il dispose.</text>
  </g>

  <g class="interactive" data-card="privilege" tabindex="0" role="button" aria-label="La parade du secret professionnel et son coût — cliquez pour les détails">
    <rect x="612" y="600" width="524" height="110" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="612" y="600" width="4" height="110" fill="#1F5560"/>
    <text x="636" y="628" class="mono" font-size="11" letter-spacing="0.08em" fill="#1F5560">LA PARADE — ET SON COÛT · MAI 2026</text>
    <text x="636" y="654" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Les tests passent sous secret professionnel</text>
    <text x="636" y="680" class="body" font-size="14" fill="#1A1A1A">L'entreprise gagne une protection en litige et perd</text>
    <text x="636" y="700" class="body" font-size="14" fill="#1A1A1A">un instrument de pilotage. L'arbitrage n'est pas le sien.</text>
  </g>

  <line x1="64" y1="738" x2="1136" y2="738" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="762" class="mono" font-size="11" letter-spacing="0.06em" fill="#B8B5AE">SOURCES [8] [14] [15] · LE LOGICIEL, SYSTÈMES D'IA COMPRIS, EST UN PRODUIT AU SENS DE LA DIRECTIVE</text>
</svg>
