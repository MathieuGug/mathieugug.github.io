<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Anatomie de la décision Moffatt contre Air Canada : la chaîne des faits et les trois arguments de défense rejetés">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois arguments, trois rejets</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Moffatt c. Air Canada, 2024 BCCRT 149 — la décision la plus citée du corpus tient en une page de raisonnement</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ================= LEFT : chaîne des faits ================= -->
  <text x="64" y="196" class="mono" font-size="12" letter-spacing="0.08em" fill="#5A5A5A">LA CHAÎNE DES FAITS</text>

  <g class="body" font-size="14" fill="#1A1A1A">
    <rect x="64" y="212" width="416" height="56" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <text x="82" y="236" font-size="11" class="mono" fill="#5A5A5A">NOV. 2022</text>
    <text x="82" y="256">Le client interroge l'agent sur les tarifs de deuil</text>

    <line x1="272" y1="268" x2="272" y2="286" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arw2)"/>

    <rect x="64" y="292" width="416" height="56" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <text x="82" y="316" font-size="11" class="mono" fill="#B7332C">L'AFFIRMATION</text>
    <text x="82" y="336">« Demandez le remboursement sous 90 jours »</text>

    <line x1="272" y1="348" x2="272" y2="366" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arw2)"/>

    <rect x="64" y="372" width="416" height="56" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25"/>
    <text x="82" y="396" font-size="11" class="mono" fill="#B7332C">LA CONTRADICTION</text>
    <text x="82" y="416">La page « politique » du même site dit l'inverse</text>

    <line x1="272" y1="428" x2="272" y2="446" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arw2)"/>

    <rect x="64" y="452" width="416" height="56" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <text x="82" y="476" font-size="11" class="mono" fill="#5A5A5A">LA CONFIANCE</text>
    <text x="82" y="496">Il réserve au tarif plein, demande, se voit refuser</text>

    <line x1="272" y1="508" x2="272" y2="526" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arw2)"/>

    <rect x="64" y="532" width="416" height="56" fill="#1F5560"/>
    <text x="82" y="556" font-size="11" class="mono" fill="#FAF8F3">14 FÉVRIER 2024</text>
    <text x="82" y="576" fill="#FAF8F3">Déclaration inexacte par négligence — établie</text>
  </g>

  <g class="interactive" data-card="quantum" tabindex="0" role="button" aria-label="Le quantum de la condamnation — cliquez pour les détails">
    <rect x="64" y="604" width="416" height="64" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="82" y="630" class="display" font-size="20" font-weight="600" fill="#1A1A1A">812,02 $ CA</text>
    <text x="200" y="630" class="body" font-size="13" fill="#5A5A5A">dommages, frais et intérêts</text>
    <text x="82" y="654" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Le montant est anecdotique. Le raisonnement ne l'est pas.</text>
  </g>

  <!-- ================= RIGHT : arguments ================= -->
  <line x1="520" y1="180" x2="520" y2="680" stroke="#E5E1D8" stroke-width="1"/>
  <text x="560" y="196" class="mono" font-size="12" letter-spacing="0.08em" fill="#5A5A5A">LA DÉFENSE, ET CE QUE LE TRIBUNAL EN A FAIT</text>

  <g class="interactive" data-card="entite-distincte" tabindex="0" role="button" aria-label="Argument de l'entité juridique distincte — cliquez pour les détails">
    <rect x="560" y="212" width="576" height="140" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="560" y="212" width="4" height="140" fill="#B7332C"/>
    <text x="584" y="238" class="mono" font-size="11" letter-spacing="0.08em" fill="#B7332C">ARGUMENT 1 · L'EXONÉRATION PAR L'AGENT</text>
    <text x="584" y="262" class="display" font-size="16" font-style="italic" fill="#1A1A1A">« L'agent conversationnel est une entité distincte,</text>
    <text x="584" y="284" class="display" font-size="16" font-style="italic" fill="#1A1A1A">responsable de ses propres actes. »</text>
    <text x="584" y="312" class="mono" font-size="11" letter-spacing="0.08em" fill="#1F5560">REJET</text>
    <text x="584" y="334" class="body" font-size="14" fill="#1A1A1A">L'agent est une partie du site. L'entreprise répond de tout ce qu'elle publie.</text>
  </g>

  <g class="interactive" data-card="lien-hypertexte" tabindex="0" role="button" aria-label="Argument du lien hypertexte vers la bonne page — cliquez pour les détails">
    <rect x="560" y="372" width="576" height="140" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="560" y="372" width="4" height="140" fill="#B7332C"/>
    <text x="584" y="398" class="mono" font-size="11" letter-spacing="0.08em" fill="#B7332C">ARGUMENT 2 · L'INFORMATION ÉTAIT AILLEURS</text>
    <text x="584" y="422" class="display" font-size="16" font-style="italic" fill="#1A1A1A">« Un lien menait à la page décrivant la vraie</text>
    <text x="584" y="444" class="display" font-size="16" font-style="italic" fill="#1A1A1A">politique. Le client aurait dû cliquer. »</text>
    <text x="584" y="472" class="mono" font-size="11" letter-spacing="0.08em" fill="#1F5560">REJET</text>
    <text x="584" y="494" class="body" font-size="14" fill="#1A1A1A">On n'exige pas d'un client qu'il arbitre entre deux pages du même site.</text>
  </g>

  <g class="interactive" data-card="diligence" tabindex="0" role="button" aria-label="Argument de la diligence raisonnable — cliquez pour les détails">
    <rect x="560" y="532" width="576" height="140" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="560" y="532" width="4" height="140" fill="#B7332C"/>
    <text x="584" y="558" class="mono" font-size="11" letter-spacing="0.08em" fill="#B7332C">ARGUMENT 3 · LA DILIGENCE</text>
    <text x="584" y="582" class="display" font-size="16" font-style="italic" fill="#1A1A1A">« Des mesures raisonnables avaient été prises</text>
    <text x="584" y="604" class="display" font-size="16" font-style="italic" fill="#1A1A1A">pour assurer l'exactitude de l'agent. »</text>
    <text x="584" y="632" class="mono" font-size="11" letter-spacing="0.08em" fill="#1F5560">REJET — ET C'EST LE POINT QUI COMPTE</text>
    <text x="584" y="654" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Aucune pièce produite : ni transcription, ni version, ni contrôle antérieur.</text>
  </g>

  <!-- footer -->
  <line x1="64" y1="716" x2="1136" y2="716" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="742" class="display" font-size="17" font-style="italic" fill="#1A1A1A">Air Canada n'a pas perdu parce que son agent s'était trompé — mais parce qu'elle n'a rien pu opposer à cette erreur.</text>
  <text x="64" y="770" class="mono" font-size="11" letter-spacing="0.06em" fill="#B8B5AE">TRIBUNAL DES PETITES CRÉANCES DE COLOMBIE-BRITANNIQUE · SANS AUTORITÉ DE PRÉCÉDENT · SOURCES [1] [2]</text>
</svg>
