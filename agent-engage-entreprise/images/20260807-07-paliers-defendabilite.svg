<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Les quatre paliers d'autonomie relus selon ce que l'entreprise pourra prouver après un incident">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le palier d'autonomie relu par ce qu'on saura prouver</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Non pas ce que l'agent sait faire, mais ce qui reste au dossier quand un tiers réclame des comptes</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- gradient axis -->
  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A">AUTONOMIE CROISSANTE</text>
  <line x1="270" y1="187" x2="1136" y2="187" stroke="#B8B5AE" stroke-width="1" marker-end="url(#arw7)"/>

  <!-- card 1 -->
  <g class="interactive" data-card="proposer" tabindex="0" role="button" aria-label="Palier 1, proposer — cliquez pour les détails">
    <rect x="64" y="206" width="250" height="416" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="64" y="206" width="250" height="5" fill="#1F5560"/>
    <text x="88" y="240" class="mono" font-size="12" fill="#1F5560">PALIER 1</text>
    <text x="88" y="272" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Proposer</text>
    <line x1="88" y1="292" x2="290" y2="292" stroke="#E5E1D8" stroke-width="1"/>
    <text x="88" y="318" class="body" font-size="13" fill="#5A5A5A">Ce que fait l'agent</text>
    <text x="88" y="340" class="body" font-size="14" fill="#1A1A1A">Il rédige, suggère,</text>
    <text x="88" y="360" class="body" font-size="14" fill="#1A1A1A">prépare. Rien ne sort</text>
    <text x="88" y="380" class="body" font-size="14" fill="#1A1A1A">sans un humain.</text>
    <text x="88" y="418" class="body" font-size="13" fill="#5A5A5A">La pièce de preuve</text>
    <text x="88" y="440" class="body" font-size="14" font-weight="600" fill="#1A1A1A">L'acte humain final,</text>
    <text x="88" y="460" class="body" font-size="14" font-weight="600" fill="#1A1A1A">daté et imputable</text>
    <rect x="88" y="490" width="202" height="46" fill="#1F5560"/>
    <text x="189" y="519" class="display" font-size="17" font-weight="600" fill="#FAF8F3" text-anchor="middle">Défendable</text>
    <text x="88" y="566" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Le dossier existe sans</text>
    <text x="88" y="584" class="body" font-size="13" font-style="italic" fill="#5A5A5A">qu'on l'ait construit :</text>
    <text x="88" y="602" class="body" font-size="13" font-style="italic" fill="#5A5A5A">c'est la signature.</text>
  </g>

  <!-- card 2 -->
  <g class="interactive" data-card="valider" tabindex="0" role="button" aria-label="Palier 2, exécuter sous validation — cliquez pour les détails">
    <rect x="338" y="206" width="250" height="416" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="338" y="206" width="250" height="5" fill="#1F5560"/>
    <text x="362" y="240" class="mono" font-size="12" fill="#1F5560">PALIER 2</text>
    <text x="362" y="272" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Exécuter sous</text>
    <text x="362" y="294" class="display" font-size="22" font-weight="600" fill="#1A1A1A">validation</text>
    <line x1="362" y1="312" x2="564" y2="312" stroke="#E5E1D8" stroke-width="1"/>
    <text x="362" y="338" class="body" font-size="13" fill="#5A5A5A">Ce que fait l'agent</text>
    <text x="362" y="360" class="body" font-size="14" fill="#1A1A1A">Il agit, mais chaque</text>
    <text x="362" y="380" class="body" font-size="14" fill="#1A1A1A">action est approuvée</text>
    <text x="362" y="400" class="body" font-size="14" fill="#1A1A1A">avant de produire effet.</text>
    <text x="362" y="428" class="body" font-size="13" fill="#5A5A5A">La pièce de preuve</text>
    <text x="362" y="450" class="body" font-size="14" font-weight="600" fill="#1A1A1A">La validation datée,</text>
    <text x="362" y="470" class="body" font-size="14" font-weight="600" fill="#1A1A1A">action par action</text>
    <rect x="362" y="490" width="202" height="46" fill="#1F5560"/>
    <text x="463" y="519" class="display" font-size="17" font-weight="600" fill="#FAF8F3" text-anchor="middle">Défendable</text>
    <text x="362" y="566" class="body" font-size="13" font-style="italic" fill="#5A5A5A">À condition que la</text>
    <text x="362" y="584" class="body" font-size="13" font-style="italic" fill="#5A5A5A">validation ne soit pas</text>
    <text x="362" y="602" class="body" font-size="13" font-style="italic" fill="#5A5A5A">un clic sans lecture.</text>
  </g>

  <!-- card 3 -->
  <g class="interactive" data-card="notifier" tabindex="0" role="button" aria-label="Palier 3, exécuter et notifier — cliquez pour les détails">
    <rect x="612" y="206" width="250" height="416" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="612" y="206" width="250" height="5" fill="#B58A2C"/>
    <text x="636" y="240" class="mono" font-size="12" fill="#B58A2C">PALIER 3</text>
    <text x="636" y="272" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Exécuter et</text>
    <text x="636" y="294" class="display" font-size="22" font-weight="600" fill="#1A1A1A">notifier</text>
    <line x1="636" y1="312" x2="838" y2="312" stroke="#E5E1D8" stroke-width="1"/>
    <text x="636" y="338" class="body" font-size="13" fill="#5A5A5A">Ce que fait l'agent</text>
    <text x="636" y="360" class="body" font-size="14" fill="#1A1A1A">Il agit seul et informe</text>
    <text x="636" y="380" class="body" font-size="14" fill="#1A1A1A">après coup. Aucune</text>
    <text x="636" y="400" class="body" font-size="14" fill="#1A1A1A">décision humaine.</text>
    <text x="636" y="428" class="body" font-size="13" fill="#5A5A5A">La pièce de preuve</text>
    <text x="636" y="450" class="body" font-size="14" font-weight="600" fill="#B58A2C">Le dossier des sept</text>
    <text x="636" y="470" class="body" font-size="14" font-weight="600" fill="#B58A2C">postes — ou rien</text>
    <rect x="636" y="490" width="202" height="46" fill="#B58A2C"/>
    <text x="737" y="519" class="display" font-size="17" font-weight="600" fill="#FAF8F3" text-anchor="middle">Conditionnel</text>
    <text x="636" y="566" class="body" font-size="13" font-style="italic" fill="#5A5A5A">La notification crée une</text>
    <text x="636" y="584" class="body" font-size="13" font-style="italic" fill="#5A5A5A">trace, pas une décision.</text>
    <text x="636" y="602" class="body" font-size="13" font-style="italic" fill="#5A5A5A">C'est le palier charnière.</text>
  </g>

  <!-- card 4 -->
  <g class="interactive" data-card="executer" tabindex="0" role="button" aria-label="Palier 4, exécuter sans notification — cliquez pour les détails">
    <rect x="886" y="206" width="250" height="416" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="886" y="206" width="250" height="5" fill="#B7332C"/>
    <text x="910" y="240" class="mono" font-size="12" fill="#B7332C">PALIER 4</text>
    <text x="910" y="272" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Exécuter</text>
    <line x1="910" y1="292" x2="1112" y2="292" stroke="#E5E1D8" stroke-width="1"/>
    <text x="910" y="318" class="body" font-size="13" fill="#5A5A5A">Ce que fait l'agent</text>
    <text x="910" y="340" class="body" font-size="14" fill="#1A1A1A">Il agit, engage, répond</text>
    <text x="910" y="360" class="body" font-size="14" fill="#1A1A1A">au client. Personne</text>
    <text x="910" y="380" class="body" font-size="14" fill="#1A1A1A">n'est dans la boucle.</text>
    <text x="910" y="418" class="body" font-size="13" fill="#5A5A5A">La pièce de preuve</text>
    <text x="910" y="440" class="body" font-size="14" font-weight="600" fill="#B7332C">Sans journalisation</text>
    <text x="910" y="460" class="body" font-size="14" font-weight="600" fill="#B7332C">intégrale : aucune</text>
    <rect x="910" y="490" width="202" height="46" fill="#B7332C"/>
    <text x="1011" y="519" class="display" font-size="17" font-weight="600" fill="#FAF8F3" text-anchor="middle">Indéfendable en l'état</text>
    <text x="910" y="566" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Ce n'est pas la</text>
    <text x="910" y="584" class="body" font-size="13" font-style="italic" fill="#5A5A5A">performance du modèle</text>
    <text x="910" y="602" class="body" font-size="13" font-style="italic" fill="#5A5A5A">qui autorise ce palier.</text>
  </g>

  <!-- bottom rule -->
  <rect x="64" y="650" width="1072" height="52" fill="#1A1A1A"/>
  <text x="88" y="672" class="mono" font-size="11" letter-spacing="0.08em" fill="#B8B5AE">LA RÈGLE OPPOSABLE</text>
  <text x="88" y="692" class="display" font-size="17" font-weight="600" fill="#FAF8F3">Aucun agent n'accède au palier 3 en contact externe tant que les sept postes ne sont pas produits et conservés.</text>

  <text x="64" y="734" class="mono" font-size="11" letter-spacing="0.06em" fill="#B8B5AE">GRILLE DE L'AUTEUR · CROISE L'ÉCHELLE D'AUTONOMIE USUELLE AVEC LE DOSSIER DE PREUVE DU SCHÉMA 06</text>
</svg>
