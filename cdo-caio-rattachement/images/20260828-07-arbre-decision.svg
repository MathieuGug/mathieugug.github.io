<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Arbre de décision : faut-il créer un poste de directeur IA, et sous quelle charte">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 07</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Faut-il créer le poste ?</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre questions, cinq issues, chacune avec son coût de sortie</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Connecteurs -->
  <line x1="250" y1="390" x2="286" y2="390" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow07)"/>
  <path d="M155,435 C155,520 200,590 286,590" fill="none" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow07)"/>
  <path d="M500,390 C524,390 524,270 536,270" fill="none" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow07)"/>
  <path d="M500,390 C524,390 524,510 536,510" fill="none" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow07)"/>
  <path d="M750,270 C774,270 774,200 786,200" fill="none" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow07)"/>
  <path d="M750,270 C774,270 774,330 786,330" fill="none" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow07)"/>
  <path d="M750,510 C774,510 774,460 786,460" fill="none" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow07)"/>
  <path d="M750,510 C774,510 774,590 786,590" fill="none" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow07)"/>

  <text x="264" y="382" class="mono" font-size="11" fill="#1F5560">oui</text>
  <text x="168" y="500" class="mono" font-size="11" fill="#B7332C">non</text>
  <text x="512" y="316" class="mono" font-size="11" fill="#1F5560">oui</text>
  <text x="512" y="468" class="mono" font-size="11" fill="#B7332C">non</text>
  <text x="762" y="238" class="mono" font-size="11" fill="#1F5560">oui</text>
  <text x="762" y="316" class="mono" font-size="11" fill="#B7332C">non</text>
  <text x="762" y="480" class="mono" font-size="11" fill="#1F5560">oui</text>
  <text x="762" y="574" class="mono" font-size="11" fill="#B7332C">non</text>

  <!-- Q1 -->
  <g>
    <rect x="60" y="345" width="190" height="90" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="374" class="body" font-size="13" fill="#1A1A1A">La liste des décisions</text>
    <text x="80" y="396" class="body" font-size="13" fill="#1A1A1A">que personne ne tranche</text>
    <text x="80" y="418" class="body" font-size="13" fill="#1A1A1A">dépasse-t-elle cinq lignes ?</text>
  </g>

  <!-- Q2 -->
  <g class="interactive" data-card="q-budget" tabindex="0" role="button" aria-label="Question du budget propre — cliquez pour les détails">
    <rect x="300" y="345" width="200" height="90" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
    <text x="320" y="374" class="body" font-size="13" fill="#1A1A1A">Peut-on écrire un budget</text>
    <text x="320" y="396" class="body" font-size="13" fill="#1A1A1A">propre et un seuil de</text>
    <text x="320" y="418" class="body" font-size="13" fill="#1A1A1A">signature ?</text>
  </g>

  <!-- Q4 -->
  <g>
    <rect x="550" y="225" width="200" height="90" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="570" y="262" class="body" font-size="13" fill="#1A1A1A">Le contrôle est-il séparé</text>
    <text x="570" y="284" class="body" font-size="13" fill="#1A1A1A">de la conduite ?</text>
  </g>

  <!-- Q3 -->
  <g class="interactive" data-card="q-arret" tabindex="0" role="button" aria-label="Question du droit d'arrêt et de l'accès à l'instance — cliquez pour les détails">
    <rect x="550" y="465" width="200" height="90" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
    <text x="570" y="494" class="body" font-size="13" fill="#1A1A1A">Peut-on écrire le droit</text>
    <text x="570" y="516" class="body" font-size="13" fill="#1A1A1A">d'arrêt et l'accès à</text>
    <text x="570" y="538" class="body" font-size="13" fill="#1A1A1A">l'instance ?</text>
  </g>

  <!-- Leaf 5 -->
  <g class="interactive" data-card="issue-charte" tabindex="0" role="button" aria-label="Créer le poste avec la charte complète — cliquez pour les détails">
    <rect x="800" y="155" width="340" height="90" rx="3" fill="#1F5560" fill-opacity="0.12" stroke="#1F5560" stroke-width="2.5"/>
    <text x="824" y="192" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Créer le poste, avec les sept lignes</text>
    <text x="824" y="222" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Coût de sortie : une réorganisation</text>
  </g>

  <!-- Leaf 4 -->
  <g>
    <rect x="800" y="285" width="340" height="90" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="824" y="322" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Séparer d'abord, nommer ensuite</text>
    <text x="824" y="352" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Coût de sortie : un trimestre</text>
  </g>

  <!-- Leaf 3 -->
  <g class="interactive" data-card="issue-cumul" tabindex="0" role="button" aria-label="Cumuler dans la direction data existante — cliquez pour les détails">
    <rect x="800" y="415" width="340" height="90" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="824" y="452" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Cumuler dans la direction data</text>
    <text x="824" y="482" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Coût de sortie : un avenant à la lettre de mission</text>
  </g>

  <!-- Leaf 2 -->
  <g class="interactive" data-card="issue-sans-charte" tabindex="0" role="button" aria-label="Créer sans charte, déconseillé — cliquez pour les détails">
    <rect x="800" y="545" width="340" height="90" rx="3" fill="#B7332C" fill-opacity="0.10" stroke="#B7332C" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="824" y="582" class="body" font-size="15" font-weight="500" fill="#B7332C">Créer sans charte : déconseillé</text>
    <text x="824" y="612" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Coût de sortie : la crédibilité de la fonction</text>
  </g>

  <!-- Leaf 1 -->
  <g>
    <rect x="300" y="545" width="200" height="90" rx="3" fill="#FFFFFF" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="320" y="582" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Ne rien créer,</text>
    <text x="320" y="604" class="body" font-size="15" font-weight="500" fill="#1A1A1A">et le dire</text>
    <text x="320" y="626" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Coût de sortie : nul</text>
  </g>

  <line x1="60" y1="712" x2="1140" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="740" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Arbre de décision dérivé de la grille des quatre attributs (schéma 03) et du critère de séparation posé par la CJUE dans l'affaire C-453/21.</text>
  <text x="60" y="762" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Note : construction de l'auteur. Les coûts de sortie sont des ordres de grandeur d'organisation, non des estimations chiffrées.</text>
</svg>
