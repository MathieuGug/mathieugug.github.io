<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La charte fédérale américaine en cinq organes, et le résultat mesuré huit ans après la loi qui a créé le directeur des données">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 05</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La charte fédérale en cinq organes</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce qu'une administration centrale écrit quand elle crée la fonction</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Organe 1 : titulaire -->
  <g class="interactive" data-card="titulaire" tabindex="0" role="button" aria-label="Le titulaire — cliquez pour les détails">
    <rect x="120" y="178" width="610" height="80" rx="3" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="2.5"/>
    <text x="146" y="206" class="mono" font-size="12" fill="#B7332C" letter-spacing="0.06em">ORGANE 1 · LE TITULAIRE</text>
    <text x="146" y="230" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Directeur IA de l'agence</text>
    <text x="146" y="250" class="body" font-size="13" fill="#5A5A5A">Poste de haut encadrement dirigeant · autorité budgétaire · pouvoir de décision réel</text>
  </g>
  <line x1="425" y1="258" x2="425" y2="284" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow05)"/>

  <!-- Organes 2 et 3 : instances -->
  <g class="interactive" data-card="conseil-gouvernance" tabindex="0" role="button" aria-label="Le conseil de gouvernance IA — cliquez pour les détails">
    <rect x="120" y="298" width="295" height="88" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="144" y="326" class="mono" font-size="12" fill="#1F5560" letter-spacing="0.06em">ORGANE 2</text>
    <text x="144" y="350" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Conseil de gouvernance IA</text>
    <text x="144" y="372" class="body" font-size="13" fill="#5A5A5A">L'instance interne qui arbitre</text>
  </g>
  <g>
    <rect x="435" y="298" width="295" height="88" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="459" y="326" class="mono" font-size="12" fill="#1F5560" letter-spacing="0.06em">ORGANE 3</text>
    <text x="459" y="350" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Conseil interagences</text>
    <text x="459" y="372" class="body" font-size="13" fill="#5A5A5A">Doctrine et modèles partagés</text>
  </g>
  <line x1="267" y1="386" x2="267" y2="412" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow05)"/>
  <line x1="582" y1="386" x2="582" y2="412" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow05)"/>

  <!-- Organes 4 et 5 : dispositifs -->
  <g class="interactive" data-card="inventaire" tabindex="0" role="button" aria-label="L'inventaire des cas d'usage — cliquez pour les détails">
    <rect x="120" y="426" width="295" height="88" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
    <text x="144" y="454" class="mono" font-size="12" fill="#1F5560" letter-spacing="0.06em">ORGANE 4</text>
    <text x="144" y="478" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Inventaire des cas d'usage</text>
    <text x="144" y="500" class="body" font-size="13" fill="#5A5A5A">Publié, tenu par l'agence</text>
  </g>
  <g class="interactive" data-card="derogation" tabindex="0" role="button" aria-label="La dérogation documentée — cliquez pour les détails">
    <rect x="435" y="426" width="295" height="88" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
    <text x="459" y="454" class="mono" font-size="12" fill="#1F5560" letter-spacing="0.06em">ORGANE 5</text>
    <text x="459" y="478" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Dérogation documentée</text>
    <text x="459" y="500" class="body" font-size="13" fill="#5A5A5A">On peut passer outre, par écrit</text>
  </g>

  <!-- Spine -->
  <rect x="120" y="544" width="610" height="56" rx="3" fill="#1A1A1A"/>
  <text x="146" y="568" class="mono" font-size="12" fill="#B8B5AE" letter-spacing="0.06em">CATÉGORIES QUI DÉCLENCHENT LES PROCÉDURES RENFORCÉES</text>
  <text x="146" y="590" class="body" font-size="14" fill="#FAF8F3">Incidence sur les droits  ·  incidence sur la sécurité</text>

  <!-- Panneau résultat -->
  <g class="interactive" data-card="resultat-mesure" tabindex="0" role="button" aria-label="Le résultat mesuré — cliquez pour les détails">
    <rect x="800" y="178" width="340" height="422" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="800" y="178" width="4" height="422" fill="#B58A2C"/>
    <text x="826" y="208" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Le résultat mesuré</text>
    <text x="826" y="230" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Directeurs des données fédéraux</text>
    <line x1="826" y1="244" x2="1114" y2="244" stroke="#E5E1D8" stroke-width="0.5"/>

    <text x="826" y="272" class="body" font-size="13" fill="#5A5A5A">Mission jugée « très » ou</text>
    <text x="826" y="292" class="body" font-size="13" fill="#5A5A5A">« complètement » réussie</text>

    <line x1="866" y1="430" x2="1100" y2="430" stroke="#1A1A1A" stroke-width="1.25"/>
    <polyline points="886,404 986,383 1086,320" fill="none" stroke="#B7332C" stroke-width="2.5"/>
    <circle cx="886" cy="404" r="5" fill="#B7332C"/>
    <circle cx="986" cy="383" r="5" fill="#B7332C"/>
    <circle cx="1086" cy="320" r="5" fill="#B7332C"/>
    <text x="886" y="392" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">37 %</text>
    <text x="986" y="371" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">43 %</text>
    <text x="1086" y="308" class="mono" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">61 %</text>
    <text x="886" y="450" class="body" font-size="12" fill="#B8B5AE" text-anchor="middle">2023</text>
    <text x="986" y="450" class="body" font-size="12" fill="#B8B5AE" text-anchor="middle">2024</text>
    <text x="1086" y="450" class="body" font-size="12" fill="#B8B5AE" text-anchor="middle">2025</text>

    <line x1="826" y1="478" x2="1114" y2="478" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="826" y="514" class="mono" font-size="26" font-weight="600" fill="#B7332C">39 %</text>
    <text x="826" y="544" class="body" font-size="13" fill="#1A1A1A">réclament encore une clarification</text>
    <text x="826" y="566" class="body" font-size="13" fill="#1A1A1A">de leurs responsabilités et de</text>
    <text x="826" y="588" class="body" font-size="13" fill="#1A1A1A">leurs autorités, huit ans après la loi.</text>
  </g>

  <line x1="60" y1="712" x2="1140" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="740" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : mémorandums OMB M-24-10 (28 mars 2024) et M-25-21 (2025) ; enquête annuelle auprès des directeurs des données fédéraux, 6ᵉ édition, publiée le 24 mars 2026.</text>
  <text x="60" y="762" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Note : les taux de réussite sont des auto-évaluations déclaratives. Le schéma décrit le contenu des chartes, non la trajectoire administrative de leur mise en œuvre.</text>
</svg>
