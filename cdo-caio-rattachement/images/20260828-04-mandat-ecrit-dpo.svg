<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Anatomie d'un mandat écrit : ce que chaque article du RGPD produit comme attribut pour le délégué à la protection des données">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 04</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Anatomie d'un mandat écrit</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le délégué à la protection des données, article par article</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <text x="80" y="162" class="mono" font-size="12" fill="#B8B5AE" letter-spacing="0.06em">CE QUE LE TEXTE ÉCRIT</text>
  <text x="640" y="162" class="mono" font-size="12" fill="#B8B5AE" letter-spacing="0.06em">CE QUE ÇA PRODUIT</text>

  <!-- 1 : art. 37 -->
  <g class="interactive" data-card="art-37" tabindex="0" role="button" aria-label="Article 37, désignation — cliquez pour les détails">
    <rect x="80" y="170" width="350" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="104" y="198" class="mono" font-size="13" font-weight="600" fill="#1F5560">Art. 37</text>
    <text x="104" y="220" class="body" font-size="13" fill="#1A1A1A">Désignation sur les qualités professionnelles</text>
  </g>
  <line x1="430" y1="204" x2="626" y2="204" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow04)"/>
  <rect x="640" y="182" width="420" height="44" rx="3" fill="#1F5560" fill-opacity="0.08"/>
  <text x="662" y="210" class="body" font-size="14" fill="#1A1A1A">Une compétence opposable, pas une nomination d'opportunité</text>

  <!-- 2 : art. 38(1) -->
  <g>
    <rect x="80" y="248" width="350" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="104" y="276" class="mono" font-size="13" font-weight="600" fill="#1F5560">Art. 38 § 1</text>
    <text x="104" y="298" class="body" font-size="13" fill="#1A1A1A">Rapport direct au niveau le plus élevé</text>
  </g>
  <line x1="430" y1="282" x2="626" y2="282" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow04)"/>
  <rect x="640" y="260" width="420" height="44" rx="3" fill="#1F5560" fill-opacity="0.08"/>
  <text x="662" y="288" class="body" font-size="14" fill="#1A1A1A">Accès garanti à l'instance, sans filtre hiérarchique</text>

  <!-- 3 : art. 38(3) -->
  <g class="interactive" data-card="art-38-3" tabindex="0" role="button" aria-label="Article 38 paragraphe 3, protection du mandat — cliquez pour les détails">
    <rect x="80" y="326" width="350" height="68" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <text x="104" y="354" class="mono" font-size="13" font-weight="600" fill="#B7332C">Art. 38 § 3</text>
    <text x="104" y="376" class="body" font-size="13" fill="#1A1A1A">Aucune instruction ; ni révocation ni sanction</text>
  </g>
  <line x1="430" y1="360" x2="626" y2="360" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arrow04)"/>
  <rect x="640" y="338" width="420" height="44" rx="3" fill="#B7332C" fill-opacity="0.10"/>
  <text x="662" y="366" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Protection du mandat : il peut refuser et rester en poste</text>

  <!-- 4 : art. 38(6) -->
  <g class="interactive" data-card="art-38-6" tabindex="0" role="button" aria-label="Article 38 paragraphe 6 et arrêt X-FAB, conflit d'intérêts — cliquez pour les détails">
    <rect x="80" y="404" width="350" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="104" y="432" class="mono" font-size="13" font-weight="600" fill="#1F5560">Art. 38 § 6 · CJUE C-453/21</text>
    <text x="104" y="454" class="body" font-size="13" fill="#1A1A1A">Conflit d'intérêts : finalités et moyens</text>
  </g>
  <line x1="430" y1="438" x2="626" y2="438" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow04)"/>
  <rect x="640" y="416" width="420" height="44" rx="3" fill="#1F5560" fill-opacity="0.08"/>
  <text x="662" y="444" class="body" font-size="14" fill="#1A1A1A">Séparation du contrôle et de la conduite</text>

  <!-- 5 : art. 39 -->
  <g>
    <rect x="80" y="482" width="350" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="104" y="510" class="mono" font-size="13" font-weight="600" fill="#1F5560">Art. 39</text>
    <text x="104" y="532" class="body" font-size="13" fill="#1A1A1A">Point de contact de l'autorité de contrôle</text>
  </g>
  <line x1="430" y1="516" x2="626" y2="516" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow04)"/>
  <rect x="640" y="494" width="420" height="44" rx="3" fill="#1F5560" fill-opacity="0.08"/>
  <text x="662" y="522" class="body" font-size="14" fill="#1A1A1A">Un recours externe qui ne dépend pas de l'employeur</text>

  <!-- Case vide -->
  <g class="interactive" data-card="case-vide" tabindex="0" role="button" aria-label="La case volontairement vide — cliquez pour les détails">
    <rect x="80" y="576" width="980" height="112" rx="3" fill="none" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="104" y="606" class="body" font-size="14" font-weight="500" fill="#1A1A1A">La case volontairement vide</text>
    <line x1="104" y1="618" x2="1036" y2="618" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="104" y="644" class="body" font-size="13" fill="#5A5A5A">Pas de budget propre, et un droit d'arrêt seulement indirect : il alerte, il documente, il saisit l'autorité.</text>
    <text x="104" y="668" class="body" font-size="13" fill="#5A5A5A">Le modèle est transposable à une fonction de contrôle, jamais à une fonction qui conduit un portefeuille.</text>
  </g>

  <line x1="60" y1="712" x2="1140" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="740" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : règlement (UE) 2016/679, art. 37 à 39 ; CJUE, arrêt du 9 février 2023, aff. C-453/21, X-FAB Dresden GmbH &amp; Co. KG c. FC.</text>
  <text x="60" y="762" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Note : la colonne de droite est une lecture analytique de l'auteur ; le texte du règlement n'emploie pas le vocabulaire des attributs.</text>
</svg>
