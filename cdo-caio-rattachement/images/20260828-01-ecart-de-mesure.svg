<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="L'écart de mesure : deux enquêtes de 2026 comptent 38,5 % et 76 % d'entreprises dotées d'un directeur IA">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 01</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'écart de mesure</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Deux enquêtes de 2026, un même objet, trente-huit points d'écart</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Grid -->
  <line x1="150" y1="560" x2="640" y2="560" stroke="#1A1A1A" stroke-width="1.25"/>
  <line x1="150" y1="380" x2="640" y2="380" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="150" y1="200" x2="640" y2="200" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="140" y="564" class="mono" font-size="12" fill="#B8B5AE" text-anchor="end">0 %</text>
  <text x="140" y="384" class="mono" font-size="12" fill="#B8B5AE" text-anchor="end">50 %</text>
  <text x="140" y="204" class="mono" font-size="12" fill="#B8B5AE" text-anchor="end">100 %</text>

  <!-- Ghost bars: année précédente -->
  <g class="interactive" data-card="serie-longue" tabindex="0" role="button" aria-label="Les valeurs de l'année précédente — cliquez pour les détails">
    <rect x="180" y="441" width="60" height="119" fill="none" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="210" y="432" class="mono" font-size="12" fill="#B8B5AE" text-anchor="middle">33,1</text>
    <rect x="430" y="466" width="60" height="94" fill="none" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="460" y="457" class="mono" font-size="12" fill="#B8B5AE" text-anchor="middle">26</text>
    <text x="180" y="600" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Pointillé : année précédente</text>
  </g>

  <!-- Bar 1 -->
  <g class="interactive" data-card="enquete-bean" tabindex="0" role="button" aria-label="Enquête de référence, 38,5 % — cliquez pour les détails">
    <rect x="250" y="421" width="60" height="139" rx="3" fill="#1F5560"/>
    <text x="280" y="410" class="mono" font-size="17" font-weight="600" fill="#1F5560" text-anchor="middle">38,5 %</text>
    <text x="245" y="638" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Enquête de référence</text>
    <text x="245" y="658" class="body" font-size="13" fill="#5A5A5A">≈ 110 très grandes entreprises</text>
  </g>

  <!-- Bar 2 -->
  <g class="interactive" data-card="enquete-ibm" tabindex="0" role="button" aria-label="Étude dirigeants, 76 % — cliquez pour les détails">
    <rect x="500" y="286" width="60" height="274" rx="3" fill="#B7332C"/>
    <text x="530" y="275" class="mono" font-size="17" font-weight="600" fill="#B7332C" text-anchor="middle">76 %</text>
    <text x="428" y="638" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Étude dirigeants</text>
    <text x="428" y="658" class="body" font-size="13" fill="#5A5A5A">2 000 dirigeants, 33 pays</text>
  </g>

  <!-- Écart -->
  <line x1="590" y1="286" x2="620" y2="286" stroke="#5A5A5A" stroke-width="0.75"/>
  <line x1="590" y1="421" x2="620" y2="421" stroke="#5A5A5A" stroke-width="0.75"/>
  <line x1="620" y1="286" x2="620" y2="421" stroke="#5A5A5A" stroke-width="0.75"/>
  <text x="632" y="350" class="mono" font-size="13" fill="#5A5A5A">37,5 pts</text>

  <!-- Side legend -->
  <g class="interactive" data-card="objet-non-defini" tabindex="0" role="button" aria-label="Ce que l'écart mesure — cliquez pour les détails">
    <rect x="700" y="190" width="440" height="200" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="700" y="190" width="4" height="200" fill="#B58A2C"/>
    <text x="726" y="224" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Ce que l'écart mesure</text>
    <line x1="726" y1="238" x2="1114" y2="238" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="726" y="266" class="body" font-size="13" fill="#1A1A1A">Trois différences suffisent : la population</text>
    <text x="726" y="288" class="body" font-size="13" fill="#1A1A1A">interrogée, la formulation de la question,</text>
    <text x="726" y="310" class="body" font-size="13" fill="#1A1A1A">et le niveau du répondant.</text>
    <text x="726" y="344" class="body" font-size="13" fill="#5A5A5A">« Avoir un directeur IA en place » admet</text>
    <text x="726" y="366" class="body" font-size="13" fill="#5A5A5A">le cumul ; « avoir nommé » ne l'admet pas.</text>
  </g>

  <g>
    <rect x="700" y="412" width="440" height="148" rx="3" fill="none" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="726" y="446" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Conséquence pratique</text>
    <line x1="726" y1="460" x2="1114" y2="460" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="726" y="488" class="body" font-size="13" fill="#5A5A5A">Le taux d'équipement du marché ne peut pas</text>
    <text x="726" y="510" class="body" font-size="13" fill="#5A5A5A">justifier une création de poste : il ne porte</text>
    <text x="726" y="532" class="body" font-size="13" fill="#5A5A5A">sur aucun objet défini.</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="712" x2="1140" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="740" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : étude annuelle de dirigeants menée auprès de 2 000 répondants dans 33 pays (février-avril 2026) ; enquête de référence du secteur, 15ᵉ édition (≈ 110 entreprises).</text>
  <text x="60" y="762" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Note : chiffres déclaratifs, non audités. Les deux enquêtes n'ont ni la même population ni la même formulation de question.</text>
</svg>
