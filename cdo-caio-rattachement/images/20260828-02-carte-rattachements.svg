<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La carte des rattachements : ce que chaque ligne hiérarchique donne et ce qu'elle retire à une direction data ou IA">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 02</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La carte des rattachements</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque ligne hiérarchique donne un attribut et en retire un autre</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Column heads -->
  <text x="60" y="176" class="mono" font-size="12" fill="#B8B5AE" letter-spacing="0.06em">RATTACHEMENT</text>
  <text x="264" y="176" class="mono" font-size="12" fill="#1F5560" letter-spacing="0.06em">CE QU'IL DONNE</text>
  <text x="614" y="176" class="mono" font-size="12" fill="#B7332C" letter-spacing="0.06em">CE QU'IL RETIRE</text>
  <line x1="60" y1="188" x2="900" y2="188" stroke="#1A1A1A" stroke-width="1.25"/>

  <!-- Row 1 : DG -->
  <g class="interactive" data-card="dg" tabindex="0" role="button" aria-label="Rattachement à la direction générale — cliquez pour les détails">
    <rect x="60" y="188" width="840" height="86" fill="#1F5560" fill-opacity="0.05"/>
    <rect x="60" y="188" width="3" height="86" fill="#1F5560"/>
    <text x="78" y="220" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Direction générale</text>
    <text x="78" y="242" class="mono" font-size="12" fill="#1F5560">36 % en 2025</text>
    <text x="78" y="262" class="body" font-size="12" font-style="italic" fill="#5A5A5A">(21 % un an avant)</text>
    <text x="264" y="220" class="body" font-size="13" fill="#1A1A1A">Accès à l'instance qui tranche, sans filtre</text>
    <text x="264" y="244" class="body" font-size="13" fill="#1A1A1A">Arbitrage direct des conflits entre directions</text>
    <text x="614" y="220" class="body" font-size="13" fill="#1A1A1A">Éloigne du socle et des équipes</text>
    <text x="614" y="244" class="body" font-size="13" fill="#1A1A1A">Expose au changement de dirigeant</text>
  </g>

  <!-- Row 2 : DSI -->
  <g class="interactive" data-card="dsi" tabindex="0" role="button" aria-label="Rattachement à la direction des systèmes d'information — cliquez pour les détails">
    <rect x="60" y="274" width="840" height="86" fill="none"/>
    <rect x="60" y="274" width="3" height="86" fill="#B8B5AE"/>
    <text x="78" y="306" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Systèmes</text>
    <text x="78" y="326" class="body" font-size="15" font-weight="500" fill="#1A1A1A">d'information</text>
    <text x="78" y="348" class="mono" font-size="12" fill="#5A5A5A">34 % (dir. IA)</text>
    <text x="264" y="306" class="body" font-size="13" fill="#1A1A1A">Accès au socle, aux données, aux équipes</text>
    <text x="264" y="330" class="body" font-size="13" fill="#1A1A1A">Budget d'infrastructure déjà constitué</text>
    <text x="614" y="306" class="body" font-size="13" fill="#1A1A1A">Le droit d'arrêt devient interne</text>
    <text x="614" y="330" class="body" font-size="13" fill="#1A1A1A">La priorité suit la file de la DSI</text>
  </g>

  <!-- Row 3 : Métier -->
  <g class="interactive" data-card="metier" tabindex="0" role="button" aria-label="Rattachement à une direction métier — cliquez pour les détails">
    <rect x="60" y="360" width="840" height="86" fill="#1F5560" fill-opacity="0.05"/>
    <rect x="60" y="360" width="3" height="86" fill="#B8B5AE"/>
    <text x="78" y="392" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Direction métier</text>
    <text x="78" y="414" class="mono" font-size="12" fill="#5A5A5A">27 % (dir. IA)</text>
    <text x="264" y="392" class="body" font-size="13" fill="#1A1A1A">Proximité du cas d'usage et du résultat</text>
    <text x="264" y="416" class="body" font-size="13" fill="#1A1A1A">Un budget qui existe et qui est défendu</text>
    <text x="614" y="392" class="body" font-size="13" fill="#1A1A1A">Aucune neutralité entre métiers</text>
    <text x="614" y="416" class="body" font-size="13" fill="#1A1A1A">Le socle transverse cesse d'être financé</text>
  </g>

  <!-- Row 4 : Finance -->
  <g class="interactive" data-card="finance" tabindex="0" role="button" aria-label="Rattachement à la direction financière — cliquez pour les détails">
    <rect x="60" y="446" width="840" height="86" fill="none"/>
    <rect x="60" y="446" width="3" height="86" fill="#B8B5AE"/>
    <text x="78" y="478" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Direction</text>
    <text x="78" y="498" class="body" font-size="15" font-weight="500" fill="#1A1A1A">financière</text>
    <text x="264" y="478" class="body" font-size="13" fill="#1A1A1A">Discipline de mesure et budget crédible</text>
    <text x="264" y="502" class="body" font-size="13" fill="#1A1A1A">Le coût total devient visible</text>
    <text x="614" y="478" class="body" font-size="13" fill="#1A1A1A">Le sujet se réduit à la dépense</text>
    <text x="614" y="502" class="body" font-size="13" fill="#1A1A1A">Faible pouvoir d'entraînement métier</text>
  </g>

  <!-- Row 5 : Transformation -->
  <g>
    <rect x="60" y="532" width="840" height="86" fill="#1F5560" fill-opacity="0.05"/>
    <rect x="60" y="532" width="3" height="86" fill="#B8B5AE"/>
    <text x="78" y="564" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Transformation</text>
    <text x="264" y="564" class="body" font-size="13" fill="#1A1A1A">Mandat explicite de changement</text>
    <text x="264" y="588" class="body" font-size="13" fill="#1A1A1A">Portage de la conduite du changement</text>
    <text x="614" y="564" class="body" font-size="13" fill="#1A1A1A">Structure temporaire par construction</text>
    <text x="614" y="588" class="body" font-size="13" fill="#1A1A1A">Aucun actif ne lui reste à la fin</text>
  </g>
  <line x1="60" y1="618" x2="900" y2="618" stroke="#1A1A1A" stroke-width="1.25"/>

  <!-- Dispersion panel -->
  <g class="interactive" data-card="dispersion-caio" tabindex="0" role="button" aria-label="La dispersion du rattachement du directeur IA — cliquez pour les détails">
    <rect x="940" y="188" width="200" height="430" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="960" y="220" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Où est rattaché</text>
    <text x="960" y="240" class="body" font-size="13" font-weight="500" fill="#1A1A1A">le directeur IA</text>
    <line x1="960" y1="254" x2="1120" y2="254" stroke="#E5E1D8" stroke-width="0.5"/>

    <rect x="960" y="276" width="44" height="102" fill="#B7332C"/>
    <text x="1016" y="316" class="mono" font-size="13" font-weight="600" fill="#1A1A1A">34 %</text>
    <text x="1016" y="336" class="body" font-size="12" fill="#5A5A5A">Technologie</text>

    <rect x="960" y="378" width="44" height="90" fill="#1F5560"/>
    <text x="1016" y="412" class="mono" font-size="13" font-weight="600" fill="#1A1A1A">30 %</text>
    <text x="1016" y="432" class="body" font-size="12" fill="#5A5A5A">Direction data</text>

    <rect x="960" y="468" width="44" height="81" fill="#B58A2C"/>
    <text x="1016" y="500" class="mono" font-size="13" font-weight="600" fill="#1A1A1A">27 %</text>
    <text x="1016" y="520" class="body" font-size="12" fill="#5A5A5A">Métier</text>

    <rect x="960" y="549" width="44" height="27" fill="#B8B5AE"/>
    <text x="1016" y="566" class="mono" font-size="13" font-weight="600" fill="#1A1A1A">9 %</text>
    <text x="1016" y="586" class="body" font-size="12" fill="#5A5A5A">Autres</text>

    <text x="960" y="606" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Aucune ligne majoritaire.</text>
  </g>

  <line x1="60" y1="712" x2="1140" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="740" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : enquête annuelle de 504 dirigeants data et analytique (septembre-novembre 2024) pour le rattachement au directeur général ; enquête de référence du secteur (2026) pour la dispersion du directeur IA.</text>
  <text x="60" y="762" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Note : les colonnes « donne » et « retire » sont une lecture analytique de l'auteur, non un résultat d'enquête.</text>
</svg>
