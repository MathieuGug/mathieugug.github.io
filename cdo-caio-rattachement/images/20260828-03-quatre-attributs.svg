<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Grille des quatre attributs opposables appliquée à cinq configurations de mandat">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 03</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Les quatre attributs opposables</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque attribut se définit par ce qu'il permet de refuser</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Column headers -->
  <g class="interactive" data-card="budget" tabindex="0" role="button" aria-label="Budget propre — cliquez pour les détails">
    <rect x="450" y="150" width="165" height="60" fill="#FAF8F3"/>
    <text x="532" y="176" class="body" font-size="14" font-weight="500" fill="#1A1A1A" text-anchor="middle">Budget propre</text>
    <text x="532" y="196" class="body" font-size="12" font-style="italic" fill="#5A5A5A" text-anchor="middle">refuser de financer</text>
  </g>
  <g class="interactive" data-card="droit-arret" tabindex="0" role="button" aria-label="Droit d'arrêt — cliquez pour les détails">
    <rect x="615" y="150" width="165" height="60" fill="#FAF8F3"/>
    <text x="697" y="176" class="body" font-size="14" font-weight="500" fill="#1A1A1A" text-anchor="middle">Droit d'arrêt</text>
    <text x="697" y="196" class="body" font-size="12" font-style="italic" fill="#5A5A5A" text-anchor="middle">refuser la mise en service</text>
  </g>
  <g class="interactive" data-card="acces-instance" tabindex="0" role="button" aria-label="Accès à l'instance — cliquez pour les détails">
    <rect x="780" y="150" width="165" height="60" fill="#FAF8F3"/>
    <text x="862" y="176" class="body" font-size="14" font-weight="500" fill="#1A1A1A" text-anchor="middle">Accès à l'instance</text>
    <text x="862" y="196" class="body" font-size="12" font-style="italic" fill="#5A5A5A" text-anchor="middle">refuser d'être contourné</text>
  </g>
  <g class="interactive" data-card="protection-mandat" tabindex="0" role="button" aria-label="Protection du mandat — cliquez pour les détails">
    <rect x="945" y="150" width="165" height="60" fill="#FAF8F3"/>
    <text x="1027" y="176" class="body" font-size="14" font-weight="500" fill="#1A1A1A" text-anchor="middle">Protection du mandat</text>
    <text x="1027" y="196" class="body" font-size="12" font-style="italic" fill="#5A5A5A" text-anchor="middle">refuser sans être révoqué</text>
  </g>
  <line x1="60" y1="212" x2="1110" y2="212" stroke="#1A1A1A" stroke-width="1.25"/>

  <!-- Row 1 -->
  <rect x="60" y="212" width="1050" height="64" fill="#1F5560" fill-opacity="0.04"/>
  <text x="78" y="240" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Directeur des données · entreprise</text>
  <text x="78" y="262" class="body" font-size="12" font-style="italic" fill="#5A5A5A">mandat implicite</text>
  <path d="M532 233 A11 11 0 0 1 532 255 Z" fill="#B7332C"/><circle cx="532" cy="244" r="11" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
  <circle cx="697" cy="244" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  <path d="M862 233 A11 11 0 0 1 862 255 Z" fill="#B7332C"/><circle cx="862" cy="244" r="11" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
  <circle cx="1027" cy="244" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>

  <!-- Row 2 -->
  <text x="78" y="304" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Directeur IA · entreprise</text>
  <text x="78" y="326" class="body" font-size="12" font-style="italic" fill="#5A5A5A">mandat implicite</text>
  <path d="M532 297 A11 11 0 0 1 532 319 Z" fill="#B7332C"/><circle cx="532" cy="308" r="11" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
  <circle cx="697" cy="308" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  <path d="M862 297 A11 11 0 0 1 862 319 Z" fill="#B7332C"/><circle cx="862" cy="308" r="11" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
  <circle cx="1027" cy="308" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  <text x="1122" y="288" class="mono" font-size="12" fill="#B7332C" text-anchor="middle" transform="rotate(90 1122 288)">lignes identiques</text>
  <line x1="1112" y1="216" x2="1112" y2="340" stroke="#B7332C" stroke-width="1.25"/>

  <!-- Row 3 -->
  <rect x="60" y="340" width="1050" height="64" fill="#1F5560" fill-opacity="0.04"/>
  <text x="78" y="368" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Délégué à la protection des données</text>
  <text x="78" y="390" class="body" font-size="12" font-style="italic" fill="#5A5A5A">RGPD, art. 37 à 39</text>
  <circle cx="532" cy="372" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  <path d="M697 361 A11 11 0 0 1 697 383 Z" fill="#B7332C"/><circle cx="697" cy="372" r="11" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
  <circle cx="862" cy="372" r="11" fill="#B7332C"/>
  <circle cx="1027" cy="372" r="11" fill="#B7332C"/>

  <!-- Row 4 -->
  <text x="78" y="432" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Directeur IA · agences fédérales américaines</text>
  <text x="78" y="454" class="body" font-size="12" font-style="italic" fill="#5A5A5A">mémorandums M-24-10 et M-25-21</text>
  <circle cx="532" cy="436" r="11" fill="#B7332C"/>
  <circle cx="697" cy="436" r="11" fill="#B7332C"/>
  <circle cx="862" cy="436" r="11" fill="#B7332C"/>
  <path d="M1027 425 A11 11 0 0 1 1027 447 Z" fill="#B7332C"/><circle cx="1027" cy="436" r="11" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>

  <!-- Row 5 -->
  <rect x="60" y="468" width="1050" height="64" fill="#1F5560" fill-opacity="0.04"/>
  <text x="78" y="496" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Administrateur ministériel · France</text>
  <text x="78" y="518" class="body" font-size="12" font-style="italic" fill="#5A5A5A">circulaire du 27 avril 2021</text>
  <circle cx="532" cy="500" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  <circle cx="697" cy="500" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  <path d="M862 489 A11 11 0 0 1 862 511 Z" fill="#B7332C"/><circle cx="862" cy="500" r="11" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
  <circle cx="1027" cy="500" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  <line x1="60" y1="532" x2="1110" y2="532" stroke="#1A1A1A" stroke-width="1.25"/>

  <!-- Legend -->
  <circle cx="72" cy="562" r="9" fill="#B7332C"/>
  <text x="90" y="567" class="body" font-size="12" fill="#5A5A5A">écrit et opposable</text>
  <path d="M242 553 A9 9 0 0 1 242 571 Z" fill="#B7332C"/><circle cx="242" cy="562" r="9" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
  <text x="258" y="567" class="body" font-size="12" fill="#5A5A5A">partiel ou indirect</text>
  <circle cx="410" cy="562" r="9" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  <text x="426" y="567" class="body" font-size="12" fill="#5A5A5A">absent</text>

  <!-- Lecture -->
  <g class="interactive" data-card="lecture-grille" tabindex="0" role="button" aria-label="Comment lire la grille — cliquez pour les détails">
    <rect x="530" y="546" width="580" height="128" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="530" y="546" width="4" height="128" fill="#B58A2C"/>
    <text x="554" y="576" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Comment lire la grille</text>
    <line x1="554" y1="588" x2="1088" y2="588" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="554" y="614" class="body" font-size="13" fill="#1A1A1A">Les quatre attributs sont indépendants. Budget sans droit d'arrêt produit</text>
    <text x="554" y="636" class="body" font-size="13" fill="#1A1A1A">un directeur de plateforme ; droit d'arrêt sans budget produit un contrôleur ;</text>
    <text x="554" y="658" class="body" font-size="13" fill="#1A1A1A">accès seul produit un conseiller.</text>
  </g>

  <line x1="60" y1="712" x2="1140" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="740" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : RGPD art. 37 à 39 ; mémorandums OMB M-24-10 (2024) et M-25-21 (2025) ; circulaire n° 6264/SG du 27 avril 2021.</text>
  <text x="60" y="762" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Note : la grille des quatre attributs est une construction de l'auteur, dérivée par lecture croisée des trois régimes documentés. Elle n'a pas été testée statistiquement.</text>
</svg>
