<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Les obligations européennes qui exigent une autorité sans désigner de titulaire">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 06</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'obligation sans titulaire</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le texte exige une autorité et ne dit pas qui la détient</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="182" class="mono" font-size="12" fill="#B8B5AE" letter-spacing="0.06em">CE QUE LE TEXTE EXIGE</text>

  <!-- Card 1 -->
  <g class="interactive" data-card="art-4" tabindex="0" role="button" aria-label="Article 4, maîtrise de l'IA — cliquez pour les détails">
    <rect x="130" y="200" width="260" height="188" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="130" y="200" width="260" height="4" fill="#1F5560"/>
    <text x="152" y="232" class="mono" font-size="12" font-weight="600" fill="#B7332C" letter-spacing="0.05em">2 FÉVRIER 2025</text>
    <text x="152" y="258" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Maîtrise de l'IA</text>
    <text x="152" y="278" class="mono" font-size="12" fill="#5A5A5A">Art. 4</text>
    <text x="152" y="308" class="body" font-size="13" fill="#5A5A5A">Applicable sans période</text>
    <text x="152" y="330" class="body" font-size="13" fill="#5A5A5A">transitoire. Vise le personnel</text>
    <text x="152" y="352" class="body" font-size="13" fill="#5A5A5A">et les prestataires agissant</text>
    <text x="152" y="374" class="body" font-size="13" fill="#5A5A5A">pour le compte du déployeur.</text>
  </g>
  <line x1="260" y1="388" x2="260" y2="430" stroke="#B8B5AE" stroke-width="0.75"/>

  <!-- Card 2 -->
  <g class="interactive" data-card="surveillance-2026" tabindex="0" role="button" aria-label="Surveillance par les autorités nationales — cliquez pour les détails">
    <rect x="510" y="200" width="260" height="188" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="510" y="200" width="260" height="4" fill="#1F5560"/>
    <text x="532" y="232" class="mono" font-size="12" font-weight="600" fill="#B7332C" letter-spacing="0.05em">3 AOÛT 2026</text>
    <text x="532" y="258" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Surveillance nationale</text>
    <text x="532" y="278" class="mono" font-size="12" fill="#5A5A5A">Autorités des États membres</text>
    <text x="532" y="308" class="body" font-size="13" fill="#5A5A5A">Les autorités commencent à</text>
    <text x="532" y="330" class="body" font-size="13" fill="#5A5A5A">superviser et à faire appliquer.</text>
    <text x="532" y="360" class="body" font-size="13" font-style="italic" fill="#B8B5AE">Dix-huit mois de stock de</text>
    <text x="532" y="380" class="body" font-size="13" font-style="italic" fill="#B8B5AE">non-conformité sans titulaire.</text>
  </g>
  <line x1="640" y1="388" x2="640" y2="430" stroke="#B8B5AE" stroke-width="0.75"/>

  <!-- Card 3 -->
  <g class="interactive" data-card="art-26-autorite" tabindex="0" role="button" aria-label="Article 26, compétence formation et autorité — cliquez pour les détails">
    <rect x="830" y="200" width="260" height="188" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="830" y="200" width="260" height="4" fill="#B7332C"/>
    <text x="852" y="232" class="mono" font-size="12" font-weight="600" fill="#B7332C" letter-spacing="0.05em">SYSTÈMES À HAUT RISQUE</text>
    <text x="852" y="258" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Surveillance humaine</text>
    <text x="852" y="278" class="mono" font-size="12" fill="#5A5A5A">Art. 26 § 2</text>
    <text x="852" y="308" class="body" font-size="13" fill="#5A5A5A">Confiée à des personnes</text>
    <text x="852" y="330" class="body" font-size="13" fill="#5A5A5A">physiques disposant de la</text>
    <text x="852" y="352" class="body" font-size="13" fill="#5A5A5A">compétence, de la formation</text>
    <text x="852" y="374" class="body" font-size="13" font-weight="500" fill="#1A1A1A">et de l'autorité nécessaires.</text>
  </g>
  <line x1="960" y1="388" x2="960" y2="430" stroke="#B8B5AE" stroke-width="0.75"/>

  <!-- Axe -->
  <line x1="120" y1="430" x2="1100" y2="430" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="260" cy="430" r="6" fill="#1A1A1A"/>
  <circle cx="640" cy="430" r="6" fill="#1A1A1A"/>
  <circle cx="960" cy="430" r="6" fill="#B7332C"/>

  <!-- Slots vides -->
  <text x="60" y="484" class="mono" font-size="12" fill="#B8B5AE" letter-spacing="0.06em">QUI LE TEXTE DÉSIGNE</text>
  <rect x="130" y="500" width="260" height="70" rx="3" fill="none" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="260" y="542" class="body" font-size="13" font-style="italic" fill="#B8B5AE" text-anchor="middle">personne</text>
  <rect x="510" y="500" width="260" height="70" rx="3" fill="none" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="640" y="542" class="body" font-size="13" font-style="italic" fill="#B8B5AE" text-anchor="middle">personne</text>
  <rect x="830" y="500" width="260" height="70" rx="3" fill="none" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="960" y="536" class="body" font-size="13" font-style="italic" fill="#B8B5AE" text-anchor="middle">« des personnes physiques »</text>
  <text x="960" y="556" class="body" font-size="13" font-style="italic" fill="#B8B5AE" text-anchor="middle">sans niveau ni rattachement</text>

  <!-- Qui signe -->
  <g class="interactive" data-card="qui-signe" tabindex="0" role="button" aria-label="Qui signe par défaut — cliquez pour les détails">
    <rect x="130" y="596" width="960" height="88" rx="3" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="154" y="626" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Trois manières de répondre, dont une par défaut</text>
    <text x="154" y="652" class="body" font-size="13" fill="#5A5A5A">Le propriétaire métier (cohérent, non neutre)  ·  une fonction transverse dotée d'une lettre de mission (le seul cas tenable)</text>
    <text x="154" y="674" class="body" font-size="13" fill="#5A5A5A">·  le dernier maillon technique capable d'appuyer sur l'interrupteur, qui n'a ni le grade ni la protection pour le faire.</text>
  </g>

  <line x1="60" y1="712" x2="1140" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="740" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : règlement (UE) 2024/1689, art. 4 et art. 26 ; calendrier d'application publié par la Commission européenne.</text>
  <text x="60" y="762" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Note : la ligne inférieure est une lecture de l'auteur. Le règlement crée des obligations pesant sur le déployeur en tant que personne morale, sans prescrire d'organigramme.</text>
</svg>
