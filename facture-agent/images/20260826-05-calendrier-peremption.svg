<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Le calendrier de péremption des modèles imposé par les fournisseurs, et la boucle de re-qualification qu'il déclenche chez le déployeur">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le calendrier qu'on ne choisit pas</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La péremption d'un composant central de votre chaîne de production est datée par un tiers.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUE LE FOURNISSEUR DÉCIDE</text>

  <!-- FRISE -->
  <g class="interactive" data-card="frise-peremption" tabindex="0" role="button" aria-label="La frise de péremption — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="188" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="5" height="188" fill="#B7332C"/>

    <line x1="130" y1="300" x2="1080" y2="300" stroke="#C9C3B6" stroke-width="1.5"/>

    <circle cx="250" cy="300" r="7" fill="#B7332C"/>
    <line x1="250" y1="300" x2="250" y2="256" stroke="#B7332C" stroke-width="1.25"/>
    <text x="250" y="246" class="mono" font-size="11.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">23 JUILLET 2026</text>
    <text x="250" y="330" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Quinze entrées de modèles arrêtées</text>
    <text x="250" y="350" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="middle">Code, conversation, recherche, audio,</text>
    <text x="250" y="368" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="middle">temps réel, usage d'ordinateur</text>

    <circle cx="620" cy="300" r="7" fill="#B58A2C"/>
    <line x1="620" y1="300" x2="620" y2="256" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="620" y="246" class="mono" font-size="11.5" letter-spacing="0.08em" fill="#B58A2C" text-anchor="middle">16 OCTOBRE 2026</text>
    <text x="620" y="330" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Retrait d'une série entière</text>
    <text x="620" y="350" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="middle">« Pas avant » : la date plancher est</text>
    <text x="620" y="368" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="middle">annoncée, la date réelle ne l'est pas</text>

    <circle cx="960" cy="300" r="7" fill="#B7332C"/>
    <line x1="960" y1="300" x2="960" y2="256" stroke="#B7332C" stroke-width="1.25"/>
    <text x="960" y="246" class="mono" font-size="11.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">20 OCTOBRE 2026</text>
    <text x="960" y="330" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Migration obligatoire</text>
    <text x="960" y="350" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="middle">Plateforme d'agents d'entreprise :</text>
    <text x="960" y="368" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="middle">quatre jours après le retrait</text>

    <text x="94" y="386" class="mono" font-size="11" letter-spacing="0.06em" fill="#8A8478">CYCLE DE SORTIE D'UN MODÈLE : 2 À 4 MOIS — CE N'EST PAS UN ÉVÉNEMENT, C'EST UN RÉGIME</text>
  </g>

  <text x="64" y="436" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUE ÇA DÉCLENCHE CHEZ VOUS</text>

  <!-- BOUCLE -->
  <g class="interactive" data-card="boucle-requalification" tabindex="0" role="button" aria-label="La boucle de re-qualification — cliquez pour les détails">
    <rect x="64" y="452" width="700" height="222" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="452" width="5" height="222" fill="#1F5560"/>
    <text x="94" y="482" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">BOUCLE DE RE-QUALIFICATION</text>

    <rect x="94" y="500" width="140" height="52" rx="3" fill="#1F5560" fill-opacity="0.09"/>
    <text x="164" y="522" class="body" font-size="12.5" font-weight="600" fill="#1F5560" text-anchor="middle">Avis de retrait</text>
    <text x="164" y="540" class="body" font-size="12" fill="#5A5A5A" text-anchor="middle">reçu du fournisseur</text>

    <path d="M 240 526 L 268 526" stroke="#1A1A1A" stroke-width="1.75"/>
    <path d="M 262 521 L 270 526 L 262 531 Z" fill="#1A1A1A"/>

    <rect x="276" y="500" width="140" height="52" rx="3" fill="#1F5560" fill-opacity="0.09"/>
    <text x="346" y="522" class="body" font-size="12.5" font-weight="600" fill="#1F5560" text-anchor="middle">Bascule technique</text>
    <text x="346" y="540" class="body" font-size="12" fill="#5A5A5A" text-anchor="middle">une ligne de config</text>

    <path d="M 422 526 L 450 526" stroke="#1A1A1A" stroke-width="1.75"/>
    <path d="M 444 521 L 452 526 L 444 531 Z" fill="#1A1A1A"/>

    <rect x="458" y="500" width="180" height="52" rx="3" fill="#B7332C" fill-opacity="0.12"/>
    <text x="548" y="522" class="body" font-size="12.5" font-weight="600" fill="#B7332C" text-anchor="middle">Exécution du jeu d'évaluation</text>
    <text x="548" y="540" class="body" font-size="12" fill="#5A5A5A" text-anchor="middle">le seul poste qui coûte</text>

    <path d="M 548 558 L 548 586" stroke="#1A1A1A" stroke-width="1.75"/>
    <path d="M 543 580 L 548 588 L 553 580 Z" fill="#1A1A1A"/>

    <rect x="94" y="594" width="640" height="56" rx="3" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="1"/>
    <text x="114" y="618" class="body" font-size="13" fill="#1A1A1A">Sans jeu d'évaluation, la boucle saute l'étape rouge et le système continue de répondre.</text>
    <text x="114" y="638" class="body" font-size="13" font-style="italic" fill="#B7332C">Ce n'est pas un raccourci : c'est le mode de défaillance lui-même.</text>
  </g>

  <!-- RÉGRESSION -->
  <g class="interactive" data-card="regression-silencieuse" tabindex="0" role="button" aria-label="La régression silencieuse — cliquez pour les détails">
    <rect x="788" y="452" width="348" height="222" rx="3" fill="#1A1A1A"/>
    <text x="818" y="482" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">RÉGRESSION SILENCIEUSE</text>
    <text x="818" y="518" class="display" font-size="30" font-weight="600" fill="#FAF8F3">95 à 97 %</text>
    <text x="818" y="542" class="body" font-size="12.5" fill="#C9C3B6">de tests de non-régression passants</text>
    <text x="818" y="560" class="body" font-size="12.5" fill="#C9C3B6">d'une version de modèle à l'autre.</text>
    <line x1="818" y1="578" x2="1106" y2="578" stroke="#3A3A3A" stroke-width="0.5"/>
    <text x="818" y="602" class="body" font-size="12.5" fill="#E8B84B">Soit 3 à 5 % de comportements modifiés :</text>
    <text x="818" y="622" class="body" font-size="12.5" fill="#C9C3B6">format des appels d'outils, conformité JSON,</text>
    <text x="818" y="642" class="body" font-size="12.5" fill="#C9C3B6">frontières de refus, verbosité.</text>
    <text x="818" y="662" class="body" font-size="12.5" font-style="italic" fill="#C9C3B6">Rien ne casse bruyamment.</text>
  </g>

  <!-- CLAUSE -->
  <g class="interactive" data-card="clause-stabilite" tabindex="0" role="button" aria-label="La clause de stabilité — cliquez pour les détails">
    <rect x="64" y="692" width="1072" height="112" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="64" y="692" width="5" height="112" fill="#B58A2C"/>
    <text x="94" y="720" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">CE QUI SE NÉGOCIE — ET QUI NE FIGURE SUR AUCUNE GRILLE TARIFAIRE</text>
    <text x="94" y="752" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La clause de stabilité de modèle</text>
    <text x="94" y="780" class="body" font-size="13" fill="#5A5A5A">Préavis minimum de dépréciation · versions nommément désignées pour la durée du contrat · crédits de migration si la mise à niveau est imposée.</text>
  </g>

  <text x="64" y="852" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">DATES : CALENDRIERS DE DÉPRÉCIATION PUBLIÉS PAR LES FOURNISSEURS. TAUX DE NON-RÉGRESSION : RETEX DE MIGRATION, ORDRE DE GRANDEUR.</text>
</svg>
