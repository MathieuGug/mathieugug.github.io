<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="La distribution à queue lourde du coût par tâche, et la conversion du coût par tentative en coût par résultat">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="900" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce qu'une moyenne ne budgète pas</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La dépense d'un agent ne se groupe pas autour d'une valeur centrale. Elle a une queue, et la queue porte la facture.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">DISTRIBUTION DU COÛT PAR EXÉCUTION</text>
  <text x="1136" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">CE QUE CHAQUE STATISTIQUE VOUS DIT</text>

  <rect x="64" y="206" width="1072" height="330" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>

  <line x1="120" y1="468" x2="1080" y2="468" stroke="#C9C3B6" stroke-width="1"/>
  <text x="120" y="494" class="mono" font-size="11" fill="#8A8478">exécutions bon marché</text>
  <text x="1080" y="494" class="mono" font-size="11" fill="#8A8478" text-anchor="end">tempêtes de reprises et cascades d'outils</text>
  <text x="596" y="514" class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A" text-anchor="middle">COÛT D'UNE EXÉCUTION →</text>

  <!-- courbe densité -->
  <path d="M 130 468 C 175 468, 190 260, 244 252 C 300 244, 320 344, 380 388 C 460 446, 560 456, 700 461 C 840 465, 960 466, 1074 467 L 1074 468 Z" fill="#B7332C" fill-opacity="0.10" stroke="#B7332C" stroke-width="2.25"/>

  <!-- médiane -->
  <g class="interactive" data-card="mediane" tabindex="0" role="button" aria-label="La médiane — cliquez pour les détails">
    <line x1="262" y1="236" x2="262" y2="468" stroke="#1F5560" stroke-width="2"/>
    <circle cx="262" cy="236" r="5" fill="#1F5560"/>
    <text x="278" y="248" class="mono" font-size="11.5" letter-spacing="0.08em" fill="#1F5560">MÉDIANE</text>
    <text x="278" y="270" class="body" font-size="12.5" fill="#5A5A5A">L'efficacité de base du système.</text>
    <text x="278" y="288" class="body" font-size="12.5" fill="#5A5A5A">C'est le chiffre qui figure au dossier.</text>
  </g>

  <!-- P95 -->
  <g class="interactive" data-card="queue-p95" tabindex="0" role="button" aria-label="Le 95e centile — cliquez pour les détails">
    <rect x="700" y="300" width="374" height="168" fill="#B7332C" fill-opacity="0.06"/>
    <line x1="700" y1="300" x2="700" y2="468" stroke="#B7332C" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="700" cy="300" r="5" fill="#B7332C"/>
    <text x="716" y="324" class="mono" font-size="11.5" letter-spacing="0.08em" fill="#B7332C">95ᵉ CENTILE</text>
    <text x="716" y="346" class="body" font-size="12.5" fill="#5A5A5A">Le plafond de budget. C'est là que vivent</text>
    <text x="716" y="364" class="body" font-size="12.5" fill="#5A5A5A">les boucles de reprise et les cascades</text>
    <text x="716" y="382" class="body" font-size="12.5" fill="#5A5A5A">d'appels d'outils.</text>
    <text x="716" y="410" class="body" font-size="12.5" font-style="italic" fill="#B7332C">L'écart entre les deux traits verticaux</text>
    <text x="716" y="428" class="body" font-size="12.5" font-style="italic" fill="#B7332C">est le poste 6. Il ne s'estime pas :</text>
    <text x="716" y="446" class="body" font-size="12.5" font-style="italic" fill="#B7332C">il s'observe dès le pilote.</text>
  </g>

  <!-- CONVERSION -->
  <text x="64" y="576" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">DU COÛT PAR TENTATIVE AU COÛT PAR RÉSULTAT</text>

  <g class="interactive" data-card="taux-succes" tabindex="0" role="button" aria-label="Le taux de succès mesuré — cliquez pour les détails">
    <rect x="64" y="592" width="500" height="200" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="592" width="5" height="200" fill="#1F5560"/>
    <text x="94" y="622" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">MESURE PUBLIQUE — 175 TÂCHES DE BUREAU</text>
    <text x="94" y="656" class="display" font-size="21" font-weight="600" fill="#1A1A1A">≈ 4 $ la tentative</text>
    <text x="94" y="686" class="body" font-size="13" fill="#5A5A5A">Meilleur modèle évalué sur un intranet simulé</text>
    <text x="94" y="706" class="body" font-size="13" fill="#5A5A5A">complet : dépôt de code, partage de fichiers,</text>
    <text x="94" y="726" class="body" font-size="13" fill="#5A5A5A">messagerie d'équipe.</text>
    <line x1="94" y1="742" x2="534" y2="742" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="94" y="766" class="display" font-size="17" font-weight="600" fill="#1F5560">≈ 30 % des tâches complétées</text>
    <text x="94" y="784" class="body" font-size="12" font-style="italic" fill="#8A8478">Banc d'essai, pas une entreprise. Ordre de grandeur.</text>
  </g>

  <path d="M 580 692 L 618 692" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M 612 686 L 620 692 L 612 698 Z" fill="#1A1A1A"/>
  <text x="600" y="676" class="mono" font-size="18" fill="#1A1A1A" text-anchor="middle">÷</text>

  <g class="interactive" data-card="cout-par-resultat" tabindex="0" role="button" aria-label="Le coût par résultat — cliquez pour les détails">
    <rect x="636" y="592" width="500" height="200" rx="3" fill="#1A1A1A"/>
    <text x="666" y="622" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">CE QUE LA LIGNE BUDGÉTAIRE DEVRAIT PORTER</text>
    <text x="666" y="656" class="display" font-size="21" font-weight="600" fill="#FAF8F3">≈ 13 $ le résultat obtenu</text>
    <text x="666" y="686" class="body" font-size="13" fill="#C9C3B6">Et ce chiffre est encore un plancher : il ne</text>
    <text x="666" y="706" class="body" font-size="13" fill="#C9C3B6">compte pas la reprise humaine des sept tâches</text>
    <text x="666" y="726" class="body" font-size="13" fill="#C9C3B6">sur dix qui ont échoué.</text>
    <line x1="666" y1="742" x2="1106" y2="742" stroke="#3A3A3A" stroke-width="0.5"/>
    <text x="666" y="766" class="display" font-size="17" font-weight="600" fill="#E8B84B">L'écart n'est pas de quelques pourcents</text>
    <text x="666" y="784" class="body" font-size="12" font-style="italic" fill="#8A8478">C'est un facteur, et il change l'arbitrage.</text>
  </g>

  <text x="64" y="838" class="body" font-size="13.5" fill="#1A1A1A">On budgète un agent sur le 95ᵉ centile du coût par résultat, pas sur la moyenne du coût par appel.</text>
  <text x="64" y="872" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">DISTRIBUTION ILLUSTRATIVE — LA FORME, PAS DES VALEURS MESURÉES. CHIFFRES DE TÂCHES : THEAGENTCOMPANY, NEURIPS 2025.</text>
</svg>
