<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Les leviers d'optimisation projetés sur les sept postes de coût : tous agissent sur le premier poste, aucun sur les quatre derniers">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Écoper du côté sec</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Les leviers d'optimisation existent et ils fonctionnent. Ils agissent tous sur le seul poste déjà instrumenté.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LEVIER</text>
  <text x="1136" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">POSTES DE COÛT TOUCHÉS</text>

  <rect x="64" y="206" width="1072" height="382" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>

  <!-- ZONE NON COUVERTE -->
  <g class="interactive" data-card="zone-non-couverte" tabindex="0" role="button" aria-label="La zone qu'aucun levier ne touche — cliquez pour les détails">
    <rect x="683" y="222" width="443" height="352" fill="#B7332C" fill-opacity="0.07"/>
    <line x1="683" y1="222" x2="683" y2="574" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="1112" y="248" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C" text-anchor="end">AUCUN LEVIER TECHNIQUE NE PORTE ICI</text>
  </g>

  <!-- EN-TÊTES DE COLONNES -->
  <text x="408" y="292" class="mono" font-size="10.5" letter-spacing="0.05em" fill="#1F5560" text-anchor="middle">1 · JETONS</text>
  <text x="519" y="292" class="mono" font-size="10.5" letter-spacing="0.05em" fill="#4A7C59" text-anchor="middle">2 · LICENCES</text>
  <text x="630" y="292" class="mono" font-size="10.5" letter-spacing="0.05em" fill="#4A7C59" text-anchor="middle">3 · INFRA</text>
  <text x="741" y="292" class="mono" font-size="10.5" letter-spacing="0.05em" fill="#B7332C" text-anchor="middle">4 · GOUV.</text>
  <text x="852" y="292" class="mono" font-size="10.5" letter-spacing="0.05em" fill="#B7332C" text-anchor="middle">5 · CHGMT</text>
  <text x="963" y="292" class="mono" font-size="10.5" letter-spacing="0.05em" fill="#B7332C" text-anchor="middle">6 · ÉCHEC</text>
  <text x="1074" y="292" class="mono" font-size="10.5" letter-spacing="0.05em" fill="#B7332C" text-anchor="middle">7 · TAXES</text>
  <line x1="94" y1="306" x2="1106" y2="306" stroke="#E5E1D8" stroke-width="1"/>

  <!-- LEVIER 1 — CACHE -->
  <g class="interactive" data-card="levier-cache" tabindex="0" role="button" aria-label="La mise en cache d'invite — cliquez pour les détails">
    <text x="94" y="340" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Mise en cache d'invite</text>
    <text x="94" y="362" class="body" font-size="12.5" fill="#5A5A5A">Lecture à 0,1× le tarif d'entrée. Écriture à 1,25× (court)</text>
    <text x="94" y="380" class="body" font-size="12.5" fill="#5A5A5A">ou 2× (long) : le calcul ne tient qu'au-dessus d'un</text>
    <text x="94" y="398" class="body" font-size="12.5" fill="#5A5A5A">taux de réutilisation suffisant.</text>
    <circle cx="408" cy="358" r="13" fill="#1F5560"/>
    <text x="408" y="363" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle">−90</text>
    <circle cx="519" cy="358" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="630" cy="358" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="741" cy="358" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="852" cy="358" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="963" cy="358" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="1074" cy="358" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <line x1="94" y1="414" x2="1106" y2="414" stroke="#E5E1D8" stroke-width="0.5"/>
  </g>

  <!-- LEVIER 2 — LOT -->
  <g class="interactive" data-card="levier-lot" tabindex="0" role="button" aria-label="Le traitement par lot — cliquez pour les détails">
    <text x="94" y="448" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Traitement par lot</text>
    <text x="94" y="470" class="body" font-size="12.5" fill="#5A5A5A">Environ la moitié du tarif sur les charges asynchrones,</text>
    <text x="94" y="488" class="body" font-size="12.5" fill="#5A5A5A">cumulable avec la mise en cache. Contrainte rédhibitoire</text>
    <text x="94" y="506" class="body" font-size="12.5" fill="#5A5A5A">pour tout ce qui est interactif.</text>
    <circle cx="408" cy="466" r="13" fill="#1F5560"/>
    <text x="408" y="471" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle">−50</text>
    <circle cx="519" cy="466" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="630" cy="466" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="741" cy="466" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="852" cy="466" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="963" cy="466" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="1074" cy="466" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <line x1="94" y1="522" x2="1106" y2="522" stroke="#E5E1D8" stroke-width="0.5"/>
  </g>

  <!-- LEVIER 3 — ROUTAGE -->
  <g class="interactive" data-card="levier-routage" tabindex="0" role="button" aria-label="Le routage et la spécialisation — cliquez pour les détails">
    <text x="94" y="552" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Routage et spécialisation</text>
    <text x="94" y="572" class="body" font-size="12.5" fill="#5A5A5A">Un ordre de grandeur sur les tâches à spécification stable.</text>
    <circle cx="408" cy="558" r="13" fill="#1F5560"/>
    <text x="408" y="563" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">×10</text>
    <circle cx="519" cy="558" r="9" fill="#4A7C59" fill-opacity="0.35" stroke="#4A7C59" stroke-width="1.5"/>
    <circle cx="630" cy="558" r="9" fill="#4A7C59" fill-opacity="0.35" stroke="#4A7C59" stroke-width="1.5"/>
    <circle cx="741" cy="558" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="852" cy="558" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="963" cy="558" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
    <circle cx="1074" cy="558" r="9" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
  </g>

  <!-- LÉGENDE -->
  <circle cx="80" cy="616" r="7" fill="#1F5560"/>
  <text x="96" y="621" class="body" font-size="12" fill="#5A5A5A">effet direct et mesurable</text>
  <circle cx="290" cy="616" r="7" fill="#4A7C59" fill-opacity="0.35" stroke="#4A7C59" stroke-width="1.5"/>
  <text x="306" y="621" class="body" font-size="12" fill="#5A5A5A">effet indirect</text>
  <circle cx="440" cy="616" r="7" fill="none" stroke="#C9C3B6" stroke-width="1.5"/>
  <text x="456" y="621" class="body" font-size="12" fill="#5A5A5A">aucun effet</text>

  <!-- PUNCHLINE -->
  <rect x="64" y="646" width="1072" height="152" rx="3" fill="#1A1A1A"/>
  <text x="94" y="676" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">CE QUE CE SCHÉMA REND VISIBLE</text>
  <text x="94" y="712" class="display" font-size="21" font-weight="600" fill="#FAF8F3">Tous les leviers pointent vers le poste qui baissait déjà tout seul.</text>
  <text x="94" y="746" class="body" font-size="13.5" fill="#C9C3B6">Il y a pire qu'inefficace : c'est trompeur. Optimiser le poste 1 produit un indicateur qui s'améliore, un tableau de bord qui verdit</text>
  <text x="94" y="768" class="body" font-size="13.5" fill="#C9C3B6">et un rapport de comité rassurant, pendant que les quatre postes de droite continuent de courir sans témoin.</text>
  <text x="94" y="790" class="body" font-size="13.5" font-style="italic" fill="#E8B84B">L'amélioration mesurable du poste mesuré devient la preuve apparente de la maîtrise de l'ensemble.</text>

  <text x="64" y="846" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">TARIFS DE CACHE ET DE LOT : GRILLES PUBLIQUES DES FOURNISSEURS. PROJECTION SUR LES SEPT POSTES : PROPRE À CE DOSSIER.</text>
</svg>
