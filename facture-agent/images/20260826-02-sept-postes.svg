<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Les sept postes de coût d'un agent, séparés par la ligne de flottaison du dossier d'investissement : trois au-dessus, quatre en dessous">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="900" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La ligne de flottaison du dossier</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Sept postes de coût. Trois entrent dans le dossier d'investissement. Quatre arrivent après la signature.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">POSTE</text>
  <text x="560" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL CONTIENT</text>
  <text x="1136" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">QUAND ON L'APPREND</text>

  <!-- BLOC VISIBLE -->
  <g class="interactive" data-card="postes-visibles" tabindex="0" role="button" aria-label="Les trois postes budgétés — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="200" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="5" height="200" fill="#1F5560"/>
    <text x="94" y="234" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">POSTES 1 À 3 — CE QUI FIGURE AU BUDGET</text>

    <text x="94" y="268" class="display" font-size="17" font-weight="600" fill="#1A1A1A">1 · Jetons et appels d'interface</text>
    <text x="560" y="268" class="body" font-size="13" fill="#5A5A5A">Entrée, sortie, choix du modèle, intensité de raisonnement</text>
    <text x="1106" y="268" class="mono" font-size="11.5" fill="#1F5560" text-anchor="end">À LA FACTURE</text>

    <text x="94" y="308" class="display" font-size="17" font-weight="600" fill="#1A1A1A">2 · Abonnements et licences</text>
    <text x="560" y="308" class="body" font-size="13" fill="#5A5A5A">Contrats de modèles, licences de plateforme, engagements</text>
    <text x="1106" y="308" class="mono" font-size="11.5" fill="#1F5560" text-anchor="end">À LA SIGNATURE</text>

    <text x="94" y="348" class="display" font-size="17" font-weight="600" fill="#1A1A1A">3 · Infrastructure de plateforme</text>
    <text x="560" y="348" class="body" font-size="13" fill="#5A5A5A">Socle technique, stockage, réseau, environnements d'exécution</text>
    <text x="1106" y="348" class="mono" font-size="11.5" fill="#1F5560" text-anchor="end">AU CADRAGE</text>

    <line x1="94" y1="368" x2="1106" y2="368" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="94" y="390" class="body" font-size="12.5" font-style="italic" fill="#1F5560">Ces trois postes ont une source de données. C'est la seule chose qu'ils ont en commun.</text>
  </g>

  <!-- LIGNE DE FLOTTAISON -->
  <g class="interactive" data-card="ligne-dossier" tabindex="0" role="button" aria-label="La ligne de flottaison — cliquez pour les détails">
    <rect x="64" y="424" width="1072" height="56" rx="3" fill="#B7332C" fill-opacity="0.08"/>
    <line x1="64" y1="424" x2="1136" y2="424" stroke="#B7332C" stroke-width="2"/>
    <line x1="64" y1="480" x2="1136" y2="480" stroke="#B7332C" stroke-width="2"/>
    <text x="94" y="450" class="mono" font-size="11.5" letter-spacing="0.1em" fill="#B7332C">LIGNE DE FLOTTAISON DU DOSSIER D'INVESTISSEMENT</text>
    <text x="94" y="470" class="body" font-size="13" fill="#5A5A5A">Ce qui passe au-dessus est chiffré. Ce qui passe en dessous est mentionné, rarement chiffré, jamais provisionné.</text>
  </g>

  <!-- BLOC IMMERGÉ -->
  <g class="interactive" data-card="postes-immerges" tabindex="0" role="button" aria-label="Les quatre postes immergés — cliquez pour les détails">
    <rect x="64" y="498" width="1072" height="242" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="498" width="5" height="242" fill="#B7332C"/>
    <text x="94" y="526" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">POSTES 4 À 7 — CE QUI N'Y FIGURE PAS</text>

    <text x="94" y="560" class="display" font-size="17" font-weight="600" fill="#1A1A1A">4 · Charge de gouvernance</text>
    <text x="560" y="560" class="body" font-size="13" fill="#5A5A5A">Comités, revues, contrôles, documentation, conformité</text>
    <text x="1106" y="560" class="mono" font-size="11.5" fill="#B7332C" text-anchor="end">AU PREMIER AUDIT</text>

    <text x="94" y="600" class="display" font-size="17" font-weight="600" fill="#1A1A1A">5 · Conduite du changement</text>
    <text x="560" y="600" class="body" font-size="13" fill="#5A5A5A">Redécoupage des tâches, formation, accompagnement, résistance</text>
    <text x="1106" y="600" class="mono" font-size="11.5" fill="#B7332C" text-anchor="end">AU DÉPLOIEMENT</text>

    <text x="94" y="640" class="display" font-size="17" font-weight="600" fill="#1A1A1A">6 · Échec et reprise attendus</text>
    <text x="560" y="640" class="body" font-size="13" fill="#5A5A5A">Exécutions ratées, reprises humaines, remédiations, incidents</text>
    <text x="1106" y="640" class="mono" font-size="11.5" fill="#B7332C" text-anchor="end">AU PREMIER PIC</text>

    <text x="94" y="680" class="display" font-size="17" font-weight="600" fill="#1A1A1A">7 · Taxes potentielles sur les agents</text>
    <text x="560" y="680" class="body" font-size="13" fill="#5A5A5A">Fiscalité à venir : taxe au jeton, taxe robot, seuil de FLOP</text>
    <text x="1106" y="680" class="mono" font-size="11.5" fill="#B7332C" text-anchor="end">PAS ENCORE</text>

    <line x1="94" y1="700" x2="1106" y2="700" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="94" y="722" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Aucun des quatre n'a de source de données. Ils ne sont pas oubliés : ils n'ont rien à recopier.</text>
  </g>

  <!-- MOMENT D'APPARITION -->
  <g class="interactive" data-card="moment-apparition" tabindex="0" role="button" aria-label="Le moment d'apparition — cliquez pour les détails">
    <rect x="64" y="758" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="64" y="758" width="5" height="76" fill="#B58A2C"/>
    <text x="94" y="786" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">LE DÉCALAGE QUI FAIT LE PROBLÈME</text>
    <text x="94" y="814" class="body" font-size="13.5" fill="#1A1A1A">Les quatre postes du bas apparaissent après la signature du dossier qui les ignorait. Le projet est alors jugé sur un dépassement.</text>
  </g>

  <text x="64" y="872" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">CADRE À SEPT POSTES : SÉRIE « TOTAL COST OF AGENTS », EY. LECTURE PAR RÉGIME DE MESURE : PROPRE À CE DOSSIER.</text>
</svg>
