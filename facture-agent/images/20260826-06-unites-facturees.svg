<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="L'échelle des unités facturées, du siège au résultat, et l'endroit où la variance atterrit à chaque marche">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="900" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Où atterrit la variance</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">L'unité facturée n'est pas un détail de contrat. C'est la décision qui dit lequel des deux signataires porte l'incertitude.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">UNITÉ FACTURÉE</text>
  <text x="450" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">ORDRE DE GRANDEUR OBSERVÉ</text>
  <text x="800" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">QUI PORTE LA VARIANCE</text>
  <text x="1106" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">ÉCART</text>

  <!-- SIÈGE -->
  <g class="interactive" data-card="unite-siege" tabindex="0" role="button" aria-label="La licence par siège — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="118" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="5" height="118" fill="#1F5560"/>
    <text x="94" y="234" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">MARCHE 1</text>
    <text x="94" y="268" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le siège</text>
    <text x="94" y="296" class="body" font-size="12.5" fill="#5A5A5A">Coût fixe par utilisateur</text>

    <text x="450" y="262" class="body" font-size="13.5" fill="#1A1A1A">Recul de 21 % à 15 % des modèles</text>
    <text x="450" y="284" class="body" font-size="13" fill="#5A5A5A">de tarification logicielle en un an</text>

    <text x="800" y="262" class="body" font-size="13.5" font-weight="600" fill="#1F5560">Le fournisseur</text>
    <text x="800" y="284" class="body" font-size="12.5" fill="#5A5A5A">Vous savez ce que vous payez ;</text>
    <text x="800" y="302" class="body" font-size="12.5" fill="#5A5A5A">vous ignorez ce que vous consommez.</text>

    <text x="1106" y="234" class="mono" font-size="11.5" letter-spacing="0.06em" fill="#B58A2C" text-anchor="end">MOYEN</text>
  </g>

  <!-- CONVERSATION -->
  <g class="interactive" data-card="unite-conversation" tabindex="0" role="button" aria-label="La conversation facturée — cliquez pour les détails">
    <rect x="64" y="336" width="1072" height="118" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="336" width="5" height="118" fill="#4A7C59"/>
    <text x="94" y="364" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">MARCHE 2</text>
    <text x="94" y="398" class="display" font-size="21" font-weight="600" fill="#1A1A1A">La conversation</text>
    <text x="94" y="426" class="body" font-size="12.5" fill="#5A5A5A">Variable, grain grossier</text>

    <text x="450" y="392" class="body" font-size="13.5" fill="#1A1A1A">≈ 2 $ la conversation</text>
    <text x="450" y="414" class="body" font-size="13" fill="#5A5A5A">Modèle historique d'une grande suite métier</text>

    <text x="800" y="392" class="body" font-size="13.5" font-weight="600" fill="#B58A2C">Partagée</text>
    <text x="800" y="414" class="body" font-size="12.5" fill="#5A5A5A">Le fournisseur absorbe la longueur ;</text>
    <text x="800" y="432" class="body" font-size="12.5" fill="#5A5A5A">l'unité reste une intention lisible.</text>

    <text x="1106" y="364" class="mono" font-size="11.5" letter-spacing="0.06em" fill="#4A7C59" text-anchor="end">FAIBLE</text>
  </g>

  <!-- ACTION -->
  <g class="interactive" data-card="unite-action" tabindex="0" role="button" aria-label="L'action et le crédit — cliquez pour les détails">
    <rect x="64" y="466" width="1072" height="142" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="466" width="5" height="142" fill="#B7332C"/>
    <text x="94" y="494" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">MARCHE 3 — LE POINT DE DÉCROCHAGE</text>
    <text x="94" y="530" class="display" font-size="21" font-weight="600" fill="#1A1A1A">L'action, le crédit</text>
    <text x="94" y="558" class="body" font-size="12.5" fill="#5A5A5A">Variable, grain fin,</text>
    <text x="94" y="576" class="body" font-size="12.5" fill="#5A5A5A">défini par le fournisseur</text>

    <text x="450" y="524" class="body" font-size="13.5" fill="#1A1A1A">≈ 0,10 $ l'action standard</text>
    <text x="450" y="548" class="body" font-size="13" fill="#5A5A5A">500 $ les 100 000 crédits flexibles</text>
    <text x="450" y="570" class="body" font-size="13" fill="#5A5A5A">0,01 $ le crédit, ou 200 $ les 25 000</text>

    <text x="800" y="524" class="body" font-size="13.5" font-weight="600" fill="#B7332C">Vous, intégralement</text>
    <text x="800" y="548" class="body" font-size="12.5" fill="#5A5A5A">Combien d'actions fait une tâche métier ?</text>
    <text x="800" y="566" class="body" font-size="12.5" fill="#5A5A5A">Cette relation n'est ni publiée,</text>
    <text x="800" y="584" class="body" font-size="12.5" fill="#5A5A5A">ni stable, ni sous votre contrôle.</text>

    <text x="1106" y="494" class="mono" font-size="11.5" letter-spacing="0.06em" fill="#B7332C" text-anchor="end">MAXIMAL</text>
  </g>

  <!-- RÉSULTAT -->
  <g class="interactive" data-card="unite-resultat" tabindex="0" role="button" aria-label="Le résultat facturé — cliquez pour les détails">
    <rect x="64" y="620" width="1072" height="118" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="620" width="5" height="118" fill="#1F5560"/>
    <text x="94" y="648" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">MARCHE 4</text>
    <text x="94" y="682" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le résultat</text>
    <text x="94" y="710" class="body" font-size="12.5" fill="#5A5A5A">Ticket résolu, dossier traité</text>

    <text x="450" y="676" class="body" font-size="13.5" fill="#1A1A1A">Usage encore minoritaire</text>
    <text x="450" y="698" class="body" font-size="13" fill="#5A5A5A">4 à 6 % de la dépense logicielle totale</text>

    <text x="800" y="676" class="body" font-size="13.5" font-weight="600" fill="#1F5560">Le fournisseur</text>
    <text x="800" y="698" class="body" font-size="12.5" fill="#5A5A5A">Contre une définition contractuelle</text>
    <text x="800" y="716" class="body" font-size="12.5" fill="#5A5A5A">du résultat, que quelqu'un doit écrire.</text>

    <text x="1106" y="648" class="mono" font-size="11.5" letter-spacing="0.06em" fill="#4A7C59" text-anchor="end">NUL</text>
  </g>

  <!-- CLAUSES -->
  <g class="interactive" data-card="ecart-valeur" tabindex="0" role="button" aria-label="Les trois exigences contractuelles — cliquez pour les détails">
    <rect x="64" y="756" width="1072" height="112" rx="3" fill="#1A1A1A"/>
    <text x="94" y="782" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">TROIS EXIGENCES CONTRACTUELLES, TOUTES VÉRIFIABLES</text>
    <text x="94" y="810" class="body" font-size="13" fill="#FAF8F3">1 · Définition versionnée de l'unité facturée, avec notification de toute révision.</text>
    <text x="94" y="832" class="body" font-size="13" fill="#FAF8F3">2 · Plafond de dépense et coupe-circuit aux trois niveaux : agent, flux, entité.</text>
    <text x="94" y="854" class="body" font-size="13" fill="#FAF8F3">3 · Droit de relevé : accès à la consommation détaillée, dans un format qui permet de recalculer la facture.</text>
  </g>

  <text x="64" y="890" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">TARIFS PUBLICS DES ÉDITEURS AU MOMENT DE LA RÉDACTION — ORDRES DE GRANDEUR, GRILLES SUSCEPTIBLES DE RÉVISION.</text>
</svg>
