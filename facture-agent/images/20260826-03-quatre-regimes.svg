<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-label="Les sept postes de coût rangés par régime de mesure : mesuré nativement, reconstruit par recoupement, fabriqué à la main, non mesurable avant l'événement">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="1000" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Quatre régimes de mesure</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce n'est pas la liste des postes qui décide de la sincérité d'un dossier. C'est la manière dont chacun est obtenu.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">RÉGIME</text>
  <text x="392" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">POSTES CONCERNÉS</text>
  <text x="640" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">D'OÙ VIENT LE CHIFFRE</text>
  <text x="1106" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">CE QU'ON A LE DROIT D'AFFIRMER</text>

  <!-- R1 -->
  <g class="interactive" data-card="regime-mesure" tabindex="0" role="button" aria-label="Régime 1, mesuré nativement — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="148" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="5" height="148" fill="#1F5560"/>
    <text x="94" y="236" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">R1</text>
    <text x="94" y="266" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Mesuré nativement</text>
    <text x="94" y="292" class="body" font-size="12.5" fill="#5A5A5A">Le système émet la donnée</text>
    <text x="94" y="310" class="body" font-size="12.5" fill="#5A5A5A">tout seul, sans relevé humain.</text>

    <rect x="380" y="238" width="220" height="34" rx="3" fill="#1F5560" fill-opacity="0.1"/>
    <text x="396" y="260" class="body" font-size="13.5" font-weight="600" fill="#1F5560">1 · Jetons et appels</text>
    <text x="380" y="296" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Un seul poste sur sept.</text>

    <text x="640" y="248" class="body" font-size="13" fill="#5A5A5A">Spans OpenTelemetry GenAI :</text>
    <text x="640" y="268" class="mono" font-size="12" fill="#1A1A1A">invoke_agent · chat · execute_tool</text>
    <text x="640" y="292" class="body" font-size="12.5" fill="#B7332C">Mais aucun attribut de coût en monnaie :</text>
    <text x="640" y="310" class="body" font-size="12.5" fill="#B7332C">la conversion en euros reste à votre charge.</text>

    <text x="1106" y="336" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560" text-anchor="end">UN CHIFFRE</text>
  </g>

  <!-- R2 -->
  <g class="interactive" data-card="regime-recoupement" tabindex="0" role="button" aria-label="Régime 2, reconstruit par recoupement — cliquez pour les détails">
    <rect x="64" y="366" width="1072" height="148" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="366" width="5" height="148" fill="#4A7C59"/>
    <text x="94" y="396" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">R2</text>
    <text x="94" y="426" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Reconstruit</text>
    <text x="94" y="452" class="body" font-size="12.5" fill="#5A5A5A">La donnée existe ailleurs,</text>
    <text x="94" y="470" class="body" font-size="12.5" fill="#5A5A5A">mais pas au bon grain.</text>

    <rect x="380" y="398" width="220" height="34" rx="3" fill="#4A7C59" fill-opacity="0.12"/>
    <text x="396" y="420" class="body" font-size="13.5" font-weight="600" fill="#4A7C59">2 · Abonnements</text>
    <rect x="380" y="440" width="220" height="34" rx="3" fill="#4A7C59" fill-opacity="0.12"/>
    <text x="396" y="462" class="body" font-size="13.5" font-weight="600" fill="#4A7C59">3 · Infrastructure</text>

    <text x="640" y="408" class="body" font-size="13" fill="#5A5A5A">Contrats, factures de nuage, comptabilité</text>
    <text x="640" y="428" class="body" font-size="13" fill="#5A5A5A">analytique, répartis par une règle.</text>
    <text x="640" y="452" class="body" font-size="12.5" fill="#B7332C">Aucune ressource étiquetable au point d'usage :</text>
    <text x="640" y="470" class="body" font-size="12.5" fill="#B7332C">FOCUS 1.3 aide, il ne referme pas le trou.</text>

    <text x="1106" y="496" class="mono" font-size="12" letter-spacing="0.08em" fill="#4A7C59" text-anchor="end">UNE CONVENTION</text>
  </g>

  <!-- R3 -->
  <g class="interactive" data-card="regime-declare" tabindex="0" role="button" aria-label="Régime 3, fabriqué à la main — cliquez pour les détails">
    <rect x="64" y="526" width="1072" height="148" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="526" width="5" height="148" fill="#B58A2C"/>
    <text x="94" y="556" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">R3</text>
    <text x="94" y="586" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Déclaré</text>
    <text x="94" y="612" class="body" font-size="12.5" fill="#5A5A5A">N'existe que si quelqu'un</text>
    <text x="94" y="630" class="body" font-size="12.5" fill="#5A5A5A">tient un relevé.</text>

    <rect x="380" y="558" width="220" height="34" rx="3" fill="#B58A2C" fill-opacity="0.14"/>
    <text x="396" y="580" class="body" font-size="13.5" font-weight="600" fill="#B58A2C">4 · Gouvernance</text>
    <rect x="380" y="600" width="220" height="34" rx="3" fill="#B58A2C" fill-opacity="0.14"/>
    <text x="396" y="622" class="body" font-size="13.5" font-weight="600" fill="#B58A2C">5 · Changement</text>

    <text x="640" y="568" class="body" font-size="13" fill="#5A5A5A">Heures de comité, de revue, de formation,</text>
    <text x="640" y="588" class="body" font-size="13" fill="#5A5A5A">d'accompagnement. Aucune télémétrie.</text>
    <text x="640" y="612" class="body" font-size="12.5" fill="#B7332C">Contestable, politiquement coûteux à défendre,</text>
    <text x="640" y="630" class="body" font-size="12.5" fill="#B7332C">premier à disparaître de l'enveloppe.</text>

    <text x="1106" y="656" class="mono" font-size="12" letter-spacing="0.08em" fill="#B58A2C" text-anchor="end">UNE DÉCLARATION</text>
  </g>

  <!-- R4 -->
  <g class="interactive" data-card="regime-non-mesurable" tabindex="0" role="button" aria-label="Régime 4, non mesurable avant l'événement — cliquez pour les détails">
    <rect x="64" y="686" width="1072" height="148" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="686" width="5" height="148" fill="#B7332C"/>
    <text x="94" y="716" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">R4</text>
    <text x="94" y="746" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Non mesurable</text>
    <text x="94" y="772" class="body" font-size="12.5" fill="#5A5A5A">Aucun effort supplémentaire</text>
    <text x="94" y="790" class="body" font-size="12.5" fill="#5A5A5A">n'y donnera accès avant l'événement.</text>

    <rect x="380" y="718" width="220" height="34" rx="3" fill="#B7332C" fill-opacity="0.12"/>
    <text x="396" y="740" class="body" font-size="13.5" font-weight="600" fill="#B7332C">6 · Échec et reprise</text>
    <rect x="380" y="760" width="220" height="34" rx="3" fill="#B7332C" fill-opacity="0.12"/>
    <text x="396" y="782" class="body" font-size="13.5" font-weight="600" fill="#B7332C">7 · Taxes sur les agents</text>

    <text x="640" y="728" class="body" font-size="13" fill="#5A5A5A">Le poste 6 est une variable aléatoire à queue</text>
    <text x="640" y="748" class="body" font-size="13" fill="#5A5A5A">lourde : on n'en connaît que la distribution.</text>
    <text x="640" y="772" class="body" font-size="12.5" fill="#B7332C">Le poste 7 n'existe pas encore. Aucune taxe sur</text>
    <text x="640" y="790" class="body" font-size="12.5" fill="#B7332C">les agents n'est en vigueur à ce jour.</text>

    <text x="1106" y="816" class="mono" font-size="12" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">UNE PROVISION</text>
  </g>

  <!-- ÉTIQUETTE -->
  <g class="interactive" data-card="etiquette-confiance" tabindex="0" role="button" aria-label="L'étiquette de confiance — cliquez pour les détails">
    <rect x="64" y="852" width="1072" height="92" rx="3" fill="#1A1A1A"/>
    <text x="94" y="882" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">LA DEMANDE À FORMULER — COÛT NUL</text>
    <text x="94" y="912" class="display" font-size="19" font-weight="600" fill="#FAF8F3">Une colonne de plus dans le tableau : mesuré · reconstruit · déclaré · provision</text>
    <text x="94" y="934" class="body" font-size="12.5" fill="#C9C3B6">Un tableur donne le même nombre de décimales à une donnée mesurée et à une hypothèse. L'étiquette rétablit la différence.</text>
  </g>

  <text x="64" y="978" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">POSTES : CADRE EY. RANGEMENT PAR RÉGIME DE MESURE ET ÉTIQUETTE DE CONFIANCE : PROPRES À CE DOSSIER.</text>
</svg>
