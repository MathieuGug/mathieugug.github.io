<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Les ciseaux : le prix par jeton baisse pendant que le nombre de jetons par tâche monte, et la facture est le produit des deux">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Les ciseaux</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le prix par jeton baisse. Les jetons par tâche montent plus vite. La facture est le produit des deux.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">2023 · ASSISTANT CONVERSATIONNEL</text>
  <text x="1136" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">2026 · ORCHESTRATION AGENTIQUE</text>

  <rect x="64" y="208" width="1072" height="392" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>

  <!-- ZONE ILLUSION -->
  <g class="interactive" data-card="zone-illusion" tabindex="0" role="button" aria-label="La fenêtre d'illusion — cliquez pour les détails">
    <rect x="600" y="228" width="480" height="332" fill="#B58A2C" fill-opacity="0.07"/>
    <line x1="600" y1="228" x2="600" y2="560" stroke="#B58A2C" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="620" y="252" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">FENÊTRE D'ILLUSION</text>
    <text x="620" y="274" class="body" font-size="12.5" fill="#5A5A5A">Le tarif négocié baisse et le budget dérape</text>
    <text x="620" y="292" class="body" font-size="12.5" fill="#5A5A5A">dans le même trimestre.</text>
  </g>

  <line x1="120" y1="560" x2="1080" y2="560" stroke="#C9C3B6" stroke-width="1"/>
  <line x1="120" y1="228" x2="120" y2="560" stroke="#C9C3B6" stroke-width="1"/>

  <!-- COURBE PRIX -->
  <g class="interactive" data-card="prix-unitaire" tabindex="0" role="button" aria-label="Le prix par jeton — cliquez pour les détails">
    <path d="M 140 258 C 300 300, 430 400, 560 452 C 700 505, 900 528, 1064 536" fill="none" stroke="#1F5560" stroke-width="2.75"/>
    <circle cx="140" cy="258" r="5" fill="#1F5560"/>
    <circle cx="1064" cy="536" r="5" fill="#1F5560"/>
    <rect x="152" y="234" width="238" height="24" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="156" y="251" class="mono" font-size="11.5" letter-spacing="0.08em" fill="#1F5560">PRIX PAR JETON — DIVISÉ</text>
    <text x="404" y="482" class="body" font-size="12.5" fill="#1F5560">9× à 900× par an selon le palier de capacité</text>
  </g>

  <!-- COURBE JETONS -->
  <g class="interactive" data-card="jetons-par-tache" tabindex="0" role="button" aria-label="Les jetons par tâche — cliquez pour les détails">
    <path d="M 140 528 C 320 522, 460 486, 600 420 C 740 352, 900 288, 1064 246" fill="none" stroke="#B7332C" stroke-width="2.75"/>
    <circle cx="140" cy="528" r="5" fill="#B7332C"/>
    <circle cx="1064" cy="246" r="5" fill="#B7332C"/>
    <rect x="792" y="212" width="272" height="24" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="1064" y="229" class="mono" font-size="11.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">JETONS PAR TÂCHE — MULTIPLIÉS</text>
    <text x="150" y="512" class="body" font-size="12.5" fill="#B7332C">×5 à ×30 par tâche dès qu'un agent appelle des outils</text>
  </g>

  <!-- COURBE FACTURE -->
  <g class="interactive" data-card="facture-resultante" tabindex="0" role="button" aria-label="La facture résultante — cliquez pour les détails">
    <path d="M 140 476 C 300 484, 440 470, 600 428 C 760 384, 920 330, 1064 292" fill="none" stroke="#B58A2C" stroke-width="4" stroke-dasharray="9 5"/>
    <circle cx="1064" cy="292" r="6" fill="#B58A2C"/>
    <rect x="828" y="300" width="236" height="24" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="1064" y="317" class="mono" font-size="11.5" letter-spacing="0.08em" fill="#B58A2C" text-anchor="end">FACTURE = PRODUIT DES DEUX</text>
  </g>

  <text x="140" y="586" class="mono" font-size="11" fill="#5A5A5A">≈ 0,04 $ l'échange</text>
  <text x="1064" y="586" class="mono" font-size="11" fill="#5A5A5A" text-anchor="end">≈ 1,20 $ l'orchestration · ×30</text>

  <!-- CARTES DE LECTURE -->
  <rect x="64" y="632" width="344" height="182" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <rect x="64" y="632" width="5" height="182" fill="#1F5560"/>
  <text x="94" y="664" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">TERME 1</text>
  <text x="94" y="694" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Décidé par le fournisseur</text>
  <text x="94" y="724" class="body" font-size="13" fill="#5A5A5A">Le tarif au million de jetons. C'est le seul</text>
  <text x="94" y="744" class="body" font-size="13" fill="#5A5A5A">terme que la direction achats regarde,</text>
  <text x="94" y="764" class="body" font-size="13" fill="#5A5A5A">et le seul qui évolue en votre faveur.</text>
  <line x1="94" y1="778" x2="378" y2="778" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="94" y="798" class="body" font-size="12" font-style="italic" fill="#1F5560">Négociable. En baisse tendancielle.</text>

  <rect x="428" y="632" width="344" height="182" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <rect x="428" y="632" width="5" height="182" fill="#B7332C"/>
  <text x="458" y="664" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">TERME 2</text>
  <text x="458" y="694" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Décidé par vous</text>
  <text x="458" y="724" class="body" font-size="13" fill="#5A5A5A">Le nombre de jetons consommés par tâche.</text>
  <text x="458" y="744" class="body" font-size="13" fill="#5A5A5A">Il dépend du nombre d'outils, de la taille du</text>
  <text x="458" y="764" class="body" font-size="13" fill="#5A5A5A">contexte, des sous-agents, des reprises.</text>
  <line x1="458" y1="778" x2="742" y2="778" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="458" y="798" class="body" font-size="12" font-style="italic" fill="#B7332C">Non négociable. C'est une décision interne.</text>

  <rect x="792" y="632" width="344" height="182" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <rect x="792" y="632" width="5" height="182" fill="#B58A2C"/>
  <text x="822" y="664" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">PRODUIT</text>
  <text x="822" y="694" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Ce qui est facturé</text>
  <text x="822" y="724" class="body" font-size="13" fill="#5A5A5A">Une prévision bâtie sur la courbe de prix</text>
  <text x="822" y="744" class="body" font-size="13" fill="#5A5A5A">se trompe de variable. Elle suit le terme</text>
  <text x="822" y="764" class="body" font-size="13" fill="#5A5A5A">qui baisse et ignore celui qui monte.</text>
  <line x1="822" y1="778" x2="1106" y2="778" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="822" y="798" class="body" font-size="12" font-style="italic" fill="#B58A2C">C'est ce terme qu'il faut plafonner.</text>

  <text x="64" y="850" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">COURBES ILLUSTRATIVES — LA FORME DU COMPROMIS, PAS DES VALEURS MESURÉES. ORDRES DE GRANDEUR : EPOCH AI, EY.</text>
</svg>
