<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le circuit de signature d'une mesure déléguée : trois artefacts, qui les écrit, qui les signe et qui peut les rejouer, avec la signature de la spécification comme point de non-délégation">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8A8478"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le circuit de signature d'une mesure déléguée</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois artefacts, trois propriétaires distincts, et une seule signature qui ne se délègue pas.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <line x1="236" y1="186" x2="952" y2="186" stroke="#8A8478" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#ar6)"/>
  <text x="600" y="178" class="mono" font-size="10" letter-spacing="0.1em" fill="#8A8478" text-anchor="middle">LE TEMPS DE LA MESURE</text>
  <g class="interactive" data-card="artefact-specification" tabindex="0" role="button" aria-label="La spécification pré-enregistrée — cliquez pour les détails">
    <rect x="64" y="206" width="344" height="348" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="206" width="344" height="4" fill="#B7332C"/>
    <text x="88" y="236" class="mono" font-size="10" letter-spacing="0.08em" fill="#B7332C">ARTEFACT 1 · AVANT COLLECTE</text>
    <text x="88" y="268" class="display" font-size="21" font-weight="600" fill="#1A1A1A">La spécification</text>
    <text x="88" y="292" class="display" font-size="21" font-weight="600" fill="#1A1A1A">pré-enregistrée</text>
    <text x="88" y="322" class="body" font-size="12.5" fill="#5A5A5A">Question posée, plan d'identification,</text>
    <text x="88" y="340" class="body" font-size="12.5" fill="#5A5A5A">indicateur principal, population, fenêtre,</text>
    <text x="88" y="358" class="body" font-size="12.5" fill="#5A5A5A">règle de décision et seuil. Horodatée</text>
    <text x="88" y="376" class="body" font-size="12.5" fill="#5A5A5A">avant que la première donnée n'arrive.</text>
    <line x1="88" y1="408" x2="384" y2="408" stroke="#E5E1D8" stroke-width="1"/>
    <text x="88" y="442" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">ÉCRIT PAR</text>
    <circle cx="94" cy="458" r="5" fill="#1F5560"/>
    <text x="108" y="462" class="body" font-size="13" font-weight="600" fill="#1F5560">Agent</text>
    <text x="88" y="482" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">SIGNÉ PAR</text>
    <circle cx="94" cy="498" r="5" fill="#B7332C"/>
    <text x="108" y="502" class="body" font-size="13" font-weight="600" fill="#B7332C">Responsable de la mesure</text>
    <text x="88" y="522" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">REJOUABLE PAR</text>
    <circle cx="94" cy="538" r="5" fill="#5A5A5A"/>
    <text x="108" y="542" class="body" font-size="13" font-weight="600" fill="#5A5A5A">Un tiers, sans l'agent</text>
    <text x="88" y="540" class="body" font-size="11.5" font-style="italic" fill="#8A8478">Le seul des trois qui porte une signature.</text>
  </g>
  <g class="interactive" data-card="artefact-journal" tabindex="0" role="button" aria-label="Le journal des spécifications — cliquez pour les détails">
    <rect x="428" y="206" width="344" height="348" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="428" y="206" width="344" height="4" fill="#1F5560"/>
    <text x="452" y="236" class="mono" font-size="10" letter-spacing="0.08em" fill="#1F5560">ARTEFACT 2 · PENDANT L'EXÉCUTION</text>
    <text x="452" y="268" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le journal des</text>
    <text x="452" y="292" class="display" font-size="21" font-weight="600" fill="#1A1A1A">spécifications</text>
    <text x="452" y="322" class="body" font-size="12.5" fill="#5A5A5A">Toutes les variantes parcourues, leur</text>
    <text x="452" y="340" class="body" font-size="12.5" fill="#5A5A5A">estimation, et le rang de celle qu'on</text>
    <text x="452" y="358" class="body" font-size="12.5" fill="#5A5A5A">propose dans la distribution obtenue.</text>
    <text x="452" y="376" class="body" font-size="12.5" fill="#5A5A5A">Produit intégralement par l'agent.</text>
    <line x1="452" y1="408" x2="748" y2="408" stroke="#E5E1D8" stroke-width="1"/>
    <text x="452" y="442" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">ÉCRIT PAR</text>
    <circle cx="458" cy="458" r="5" fill="#1F5560"/>
    <text x="472" y="462" class="body" font-size="13" font-weight="600" fill="#1F5560">Agent, sans relecture</text>
    <text x="452" y="482" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">SIGNÉ PAR</text>
    <circle cx="458" cy="498" r="5" fill="#8A8478"/>
    <text x="472" y="502" class="body" font-size="13" font-weight="600" fill="#8A8478">Aucune signature</text>
    <text x="452" y="522" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">REJOUABLE PAR</text>
    <circle cx="458" cy="538" r="5" fill="#5A5A5A"/>
    <text x="472" y="542" class="body" font-size="13" font-weight="600" fill="#5A5A5A">Un tiers, sans l'agent</text>
    <text x="452" y="540" class="body" font-size="11.5" font-style="italic" fill="#8A8478">Il existe pour être consultable le jour d'une contestation.</text>
  </g>
  <g class="interactive" data-card="artefact-refutation" tabindex="0" role="button" aria-label="Le jeu de réfutation — cliquez pour les détails">
    <rect x="792" y="206" width="344" height="348" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="792" y="206" width="344" height="4" fill="#1F5560"/>
    <text x="816" y="236" class="mono" font-size="10" letter-spacing="0.08em" fill="#1F5560">ARTEFACT 3 · AVANT PUBLICATION</text>
    <text x="816" y="268" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le jeu de</text>
    <text x="816" y="292" class="display" font-size="21" font-weight="600" fill="#1A1A1A">réfutation</text>
    <text x="816" y="322" class="body" font-size="12.5" fill="#5A5A5A">Les tests exigés par le plan retenu, avec</text>
    <text x="816" y="340" class="body" font-size="12.5" fill="#5A5A5A">leur verdict. Un échec bloque la</text>
    <text x="816" y="358" class="body" font-size="12.5" fill="#5A5A5A">publication du chiffre sans arbitrage</text>
    <text x="816" y="376" class="body" font-size="12.5" fill="#5A5A5A">humain préalable.</text>
    <line x1="816" y1="408" x2="1112" y2="408" stroke="#E5E1D8" stroke-width="1"/>
    <text x="816" y="442" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">ÉCRIT PAR</text>
    <circle cx="822" cy="458" r="5" fill="#1F5560"/>
    <text x="836" y="462" class="body" font-size="13" font-weight="600" fill="#1F5560">Agent</text>
    <text x="816" y="482" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">SIGNÉ PAR</text>
    <circle cx="822" cy="498" r="5" fill="#B58A2C"/>
    <text x="836" y="502" class="body" font-size="13" font-weight="600" fill="#B58A2C">Analyste, en lecture</text>
    <text x="816" y="522" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">REJOUABLE PAR</text>
    <circle cx="822" cy="538" r="5" fill="#5A5A5A"/>
    <text x="836" y="542" class="body" font-size="13" font-weight="600" fill="#5A5A5A">Un tiers, sans l'agent</text>
    <text x="816" y="540" class="body" font-size="11.5" font-style="italic" fill="#8A8478">Le seul endroit où l'agent dispose d'un droit de veto.</text>
  </g>
  <g class="interactive" data-card="signature-humaine" tabindex="0" role="button" aria-label="Le point de non-délégation : la signature de la spécification — cliquez pour les détails">
    <rect x="64" y="580" width="1072" height="118" rx="3" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="580" width="5" height="118" fill="#B7332C"/>
    <text x="92" y="608" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">LE POINT DE NON-DÉLÉGATION</text>
    <text x="92" y="638" class="display" font-size="20" font-weight="600" fill="#1A1A1A">La signature engage une personne sur une hypothèse que les données ne trancheront jamais.</text>
    <text x="92" y="664" class="body" font-size="13" fill="#1A1A1A">Un agent rédige la spécification ; il ne l'arrête pas. Et le signataire de la spécification se distingue du porteur du résultat :</text>
    <text x="92" y="684" class="body" font-size="13" fill="#1A1A1A">le premier engage une compétence méthodologique, le second une décision budgétaire. Confondus, la revue préalable devient une formalité.</text>
  </g>

  <text x="64" y="742" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">PRÉ-ENREGISTREMENT IMPOSÉ AU NIVEAU DE L'OUTIL ET STANDARDISATION DE LA CHAÎNE D'ANALYSE : DOCUMENTATION SPOTIFY CONFIDENCE.</text>
  <text x="64" y="760" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">RÉPARTITION DES TROIS ARTEFACTS ET DE LEURS PROPRIÉTAIRES : CADRE ANALYTIQUE DE L'AUTEUR.</text>
</svg>