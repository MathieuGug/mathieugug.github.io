<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Neuf tâches de la chaîne de mesure rangées en trois bandes selon la détectabilité d'une erreur par contrôle automatique : déléguer, déléguer sous revue, verrouiller">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Neuf tâches rangées par ce qu'un contrôle automatique peut attraper</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La compétence mesurée de l'agent n'ordonne pas la délégation. La détectabilité de son erreur, si.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="182" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">ANCRAGE PAR BANC D'ESSAI PUBLIC QUAND IL EN EXISTE UN · MENTION EXPLICITE QUAND IL N'EN EXISTE PAS</text>

  <!-- BANDE 1 -->
  <g class="interactive" data-card="zone-deleguer" tabindex="0" role="button" aria-label="Bande déléguer, détectabilité forte — cliquez pour les détails">
    <rect x="64" y="198" width="200" height="170" rx="3" fill="#1F5560" stroke="#1F5560" stroke-width="1.75"/>
    <text x="86" y="228" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#FAF8F3" fill-opacity="0.8">DÉTECTABILITÉ FORTE</text>
    <text x="86" y="262" class="display" font-size="24" font-weight="600" fill="#FAF8F3">Déléguer</text>
    <text x="86" y="294" class="body" font-size="12" fill="#FAF8F3" fill-opacity="0.9">Une erreur produit un écart</text>
    <text x="86" y="312" class="body" font-size="12" fill="#FAF8F3" fill-opacity="0.9">mesurable ou un verdict faux</text>
    <text x="86" y="330" class="body" font-size="12" fill="#FAF8F3" fill-opacity="0.9">qu'un tiers peut rejouer.</text>
    <text x="86" y="354" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#FAF8F3" fill-opacity="0.7">REVUE A POSTERIORI</text>
  </g>
  <g>
    <rect x="288" y="198" width="268" height="170" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="288" y="198" width="268" height="4" fill="#1F5560"/>
    <text x="312" y="228" class="mono" font-size="10" letter-spacing="0.08em" fill="#5A5A5A">PRÉPARATION</text>
    <text x="312" y="254" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Contrôle de cohérence</text>
    <text x="312" y="274" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">des flux</text>
    <line x1="312" y1="288" x2="532" y2="288" stroke="#E5E1D8" stroke-width="1"/>
    <text x="312" y="310" class="body" font-size="12" fill="#5A5A5A">Réconciliation entre la plateforme</text>
    <text x="312" y="328" class="body" font-size="12" fill="#5A5A5A">et l'entrepôt, détection de rupture</text>
    <text x="312" y="346" class="body" font-size="12" fill="#5A5A5A">de collecte. Une erreur casse un</text>
    <text x="312" y="358" class="body" font-size="12" fill="#5A5A5A">total.</text>
  </g>
  <g>
    <rect x="576" y="198" width="268" height="170" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="576" y="198" width="268" height="4" fill="#1F5560"/>
    <text x="600" y="228" class="mono" font-size="10" letter-spacing="0.08em" fill="#5A5A5A">ACCÈS AUX DONNÉES</text>
    <text x="600" y="254" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Traduction d'une</text>
    <text x="600" y="274" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">question en requête</text>
    <line x1="600" y1="288" x2="820" y2="288" stroke="#E5E1D8" stroke-width="1"/>
    <text x="600" y="310" class="mono" font-size="12" font-weight="600" fill="#B7332C">SPIDER 2.0 · 21,3 %</text>
    <text x="600" y="330" class="body" font-size="12" fill="#5A5A5A">contre 91,2 % sur la version</text>
    <text x="600" y="348" class="body" font-size="12" fill="#5A5A5A">précédente. Réussite basse,</text>
    <text x="600" y="360" class="body" font-size="12" fill="#5A5A5A">échec visible.</text>
  </g>
  <g class="interactive" data-card="tache-refutation" tabindex="0" role="button" aria-label="La batterie de réfutation comme tâche déléguable — cliquez pour les détails">
    <rect x="864" y="198" width="268" height="170" rx="3" fill="#1F5560" fill-opacity="0.1" stroke="#1F5560" stroke-width="1.75"/>
    <rect x="864" y="198" width="268" height="4" fill="#1F5560"/>
    <text x="888" y="228" class="mono" font-size="10" letter-spacing="0.08em" fill="#1F5560">RÉFUTATION</text>
    <text x="888" y="254" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Exécution de la</text>
    <text x="888" y="274" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">batterie de contrôles</text>
    <line x1="888" y1="288" x2="1108" y2="288" stroke="#1F5560" stroke-opacity="0.3" stroke-width="1"/>
    <text x="888" y="310" class="body" font-size="12" fill="#1A1A1A">Placebo, contrôle négatif, période</text>
    <text x="888" y="328" class="body" font-size="12" fill="#1A1A1A">antérieure, sensibilité aux priors.</text>
    <text x="888" y="348" class="body" font-size="12" font-weight="600" fill="#1F5560">Verdict binaire, rejouable</text>
    <text x="888" y="362" class="body" font-size="12" font-weight="600" fill="#1F5560">par un tiers.</text>
  </g>

  <!-- BANDE 2 -->
  <g class="interactive" data-card="zone-revue" tabindex="0" role="button" aria-label="Bande déléguer sous revue, détectabilité partielle — cliquez pour les détails">
    <rect x="64" y="386" width="200" height="170" rx="3" fill="#B58A2C" fill-opacity="0.16" stroke="#B58A2C" stroke-width="1.75"/>
    <text x="86" y="416" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A6A1E">DÉTECTABILITÉ PARTIELLE</text>
    <text x="86" y="450" class="display" font-size="24" font-weight="600" fill="#1A1A1A">Sous revue</text>
    <text x="86" y="482" class="body" font-size="12" fill="#5A5A5A">Aucune machine ne tranche,</text>
    <text x="86" y="500" class="body" font-size="12" fill="#5A5A5A">mais un humain peut relire</text>
    <text x="86" y="518" class="body" font-size="12" fill="#5A5A5A">la proposition ligne à ligne.</text>
    <text x="86" y="542" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A6A1E">REVUE PRÉALABLE</text>
  </g>
  <g>
    <rect x="288" y="386" width="268" height="170" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="288" y="386" width="268" height="4" fill="#B58A2C"/>
    <text x="312" y="416" class="mono" font-size="10" letter-spacing="0.08em" fill="#5A5A5A">CONNAISSANCE DU DOMAINE</text>
    <text x="312" y="442" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Proposition des</text>
    <text x="312" y="462" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">facteurs de confusion</text>
    <line x1="312" y1="476" x2="532" y2="476" stroke="#E5E1D8" stroke-width="1"/>
    <text x="312" y="498" class="mono" font-size="12" font-weight="600" fill="#1F5560">KIÇIMAN ET AL. · 86 %</text>
    <text x="312" y="518" class="body" font-size="12" fill="#5A5A5A">sur les causes nécessaires et</text>
    <text x="312" y="536" class="body" font-size="12" fill="#5A5A5A">suffisantes, mais défaillances</text>
    <text x="312" y="548" class="body" font-size="12" fill="#5A5A5A">imprévisibles.</text>
  </g>
  <g>
    <rect x="576" y="386" width="268" height="170" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="576" y="386" width="268" height="4" fill="#B58A2C"/>
    <text x="600" y="416" class="mono" font-size="10" letter-spacing="0.08em" fill="#5A5A5A">ANALYSE COMPLÈTE</text>
    <text x="600" y="442" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Conduite d'une analyse</text>
    <text x="600" y="462" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">de bout en bout</text>
    <line x1="600" y1="476" x2="820" y2="476" stroke="#E5E1D8" stroke-width="1"/>
    <text x="600" y="498" class="mono" font-size="12" font-weight="600" fill="#B7332C">BLADE · REPLI SUR LA BASE</text>
    <text x="600" y="518" class="body" font-size="12" fill="#5A5A5A">L'accès aux données élargit les</text>
    <text x="600" y="536" class="body" font-size="12" fill="#5A5A5A">choix sans atteindre la variété</text>
    <text x="600" y="548" class="body" font-size="12" fill="#5A5A5A">de l'expert.</text>
  </g>
  <g>
    <rect x="864" y="386" width="268" height="170" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="864" y="386" width="268" height="4" fill="#B58A2C"/>
    <text x="888" y="416" class="mono" font-size="10" letter-spacing="0.08em" fill="#5A5A5A">RÉDACTION</text>
    <text x="888" y="442" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Mise en forme de la</text>
    <text x="888" y="462" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">spécification</text>
    <line x1="888" y1="476" x2="1108" y2="476" stroke="#E5E1D8" stroke-width="1"/>
    <text x="888" y="498" class="body" font-size="12" fill="#5A5A5A">Énumérer les choix, leurs</text>
    <text x="888" y="516" class="body" font-size="12" fill="#5A5A5A">justifications et les tests qu'ils</text>
    <text x="888" y="534" class="body" font-size="12" fill="#5A5A5A">appellent. Aucun banc d'essai,</text>
    <text x="888" y="552" class="body" font-size="12" fill="#5A5A5A">mais relecture possible.</text>
  </g>

  <!-- BANDE 3 -->
  <g class="interactive" data-card="zone-verrouiller" tabindex="0" role="button" aria-label="Bande verrouiller, détectabilité nulle — cliquez pour les détails">
    <rect x="64" y="574" width="200" height="170" rx="3" fill="#B7332C" stroke="#B7332C" stroke-width="1.75"/>
    <text x="86" y="604" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#FAF8F3" fill-opacity="0.8">DÉTECTABILITÉ NULLE</text>
    <text x="86" y="638" class="display" font-size="24" font-weight="600" fill="#FAF8F3">Verrouiller</text>
    <text x="86" y="670" class="body" font-size="12" fill="#FAF8F3" fill-opacity="0.9">L'erreur sort sous la forme</text>
    <text x="86" y="688" class="body" font-size="12" fill="#FAF8F3" fill-opacity="0.9">d'un chiffre plausible, et le</text>
    <text x="86" y="706" class="body" font-size="12" fill="#FAF8F3" fill-opacity="0.9">budget engagé ne revient pas.</text>
    <text x="86" y="730" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#FAF8F3" fill-opacity="0.7">L'AGENT PROPOSE SEULEMENT</text>
  </g>
  <g class="interactive" data-card="tache-identification" tabindex="0" role="button" aria-label="La déduction de l'effet estimable à partir du graphe causal — cliquez pour les détails">
    <rect x="288" y="574" width="268" height="170" rx="3" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="1.75"/>
    <rect x="288" y="574" width="268" height="4" fill="#B7332C"/>
    <text x="312" y="604" class="mono" font-size="10" letter-spacing="0.08em" fill="#B7332C">INFÉRENCE FORMELLE</text>
    <text x="312" y="630" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Déduction de l'effet</text>
    <text x="312" y="650" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">estimable</text>
    <line x1="312" y1="664" x2="532" y2="664" stroke="#B7332C" stroke-opacity="0.3" stroke-width="1"/>
    <text x="312" y="686" class="mono" font-size="12" font-weight="600" fill="#B7332C">CORR2CAUSE · HASARD</text>
    <text x="312" y="706" class="body" font-size="12" fill="#1A1A1A">Plus de 200 000 exemples, dix-sept</text>
    <text x="312" y="724" class="body" font-size="12" fill="#1A1A1A">modèles. Aucune généralisation</text>
    <text x="312" y="738" class="body" font-size="12" fill="#1A1A1A">hors distribution.</text>
  </g>
  <g>
    <rect x="576" y="574" width="268" height="170" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="576" y="574" width="268" height="4" fill="#B7332C"/>
    <text x="600" y="604" class="mono" font-size="10" letter-spacing="0.08em" fill="#5A5A5A">PLAN D'IDENTIFICATION</text>
    <text x="600" y="630" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Choix du témoin, de la</text>
    <text x="600" y="650" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">fenêtre, de la population</text>
    <line x1="600" y1="664" x2="820" y2="664" stroke="#E5E1D8" stroke-width="1"/>
    <text x="600" y="686" class="mono" font-size="12" font-weight="600" fill="#B7332C">AUCUN BANC D'ESSAI</text>
    <text x="600" y="706" class="body" font-size="12" fill="#5A5A5A">Faute de vérité de terrain, ce choix</text>
    <text x="600" y="724" class="body" font-size="12" fill="#5A5A5A">n'est noté par aucun dispositif</text>
    <text x="600" y="738" class="body" font-size="12" fill="#5A5A5A">public connu.</text>
  </g>
  <g>
    <rect x="864" y="574" width="268" height="170" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="864" y="574" width="268" height="4" fill="#B7332C"/>
    <text x="888" y="604" class="mono" font-size="10" letter-spacing="0.08em" fill="#5A5A5A">DÉCISION</text>
    <text x="888" y="630" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Arbitrage de la</text>
    <text x="888" y="650" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">réallocation budgétaire</text>
    <line x1="888" y1="664" x2="1108" y2="664" stroke="#E5E1D8" stroke-width="1"/>
    <text x="888" y="686" class="mono" font-size="12" font-weight="600" fill="#B7332C">IAB 2026 · 82 % PRÊTS</text>
    <text x="888" y="706" class="body" font-size="12" fill="#5A5A5A">à confier cette tâche à un agent.</text>
    <text x="888" y="724" class="body" font-size="12" fill="#5A5A5A">C'est la bande la plus permissive</text>
    <text x="888" y="738" class="body" font-size="12" fill="#5A5A5A">du classement déclaré.</text>
  </g>

  <line x1="64" y1="772" x2="1136" y2="772" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="796" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">SCORES : LEI ET AL., SPIDER 2.0, ICLR 2025 ; GU ET AL., BLADE, EMNLP 2024 ; KIÇIMAN, NESS, SHARMA, TAN, TMLR 2024 ; JIN ET AL., CORR2CAUSE, ICLR 2024 ;</text>
  <text x="64" y="814" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">IAB, 2026 OUTLOOK STUDY. RANGEMENT EN TROIS BANDES : GRILLE ANALYTIQUE PROPRE À CE DOSSIER.</text>
</svg>
