<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="La chaîne de mesure marketing rangée par détectabilité de l'erreur : six maillons croisés avec l'appétence de délégation déclarée, la détectabilité d'une erreur par contrôle automatique et la réversibilité de cette erreur">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La chaîne de mesure rangée par détectabilité de l'erreur</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le marché place l'agent sur les deux maillons où une erreur ne se voit pas et ne se rattrape pas.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="186" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">SIX MAILLONS, DE L'INSTRUMENTATION À L'ARCHIVAGE · TROIS CRITÈRES DE DÉLÉGATION</text>

  <!-- Colonnes : en-têtes de maillons -->
  <g class="interactive" data-card="maillon-instrumentation" tabindex="0" role="button" aria-label="Maillon 1, instrumentation — cliquez pour les détails">
    <rect x="320" y="202" width="132" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="320" y="202" width="132" height="4" fill="#1F5560"/>
    <text x="332" y="226" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">MAILLON 1</text>
    <text x="332" y="250" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Instrumen-</text>
    <text x="332" y="268" class="display" font-size="16" font-weight="600" fill="#1A1A1A">tation</text>
  </g>
  <g class="interactive" data-card="maillon-preparation" tabindex="0" role="button" aria-label="Maillon 2, préparation des données — cliquez pour les détails">
    <rect x="456" y="202" width="132" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="456" y="202" width="132" height="4" fill="#1F5560"/>
    <text x="468" y="226" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">MAILLON 2</text>
    <text x="468" y="250" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Préparation</text>
    <text x="468" y="268" class="body" font-size="11.5" fill="#5A5A5A">jointures, qualité</text>
  </g>
  <g class="interactive" data-card="maillon-specification" tabindex="0" role="button" aria-label="Maillon 3, spécification et plan d'identification — cliquez pour les détails">
    <rect x="592" y="202" width="132" height="76" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.75"/>
    <rect x="592" y="202" width="132" height="4" fill="#B7332C"/>
    <text x="604" y="226" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C">MAILLON 3</text>
    <text x="604" y="250" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Spécification</text>
    <text x="604" y="268" class="body" font-size="11.5" fill="#B7332C">plan d'identification</text>
  </g>
  <g class="interactive" data-card="maillon-estimation" tabindex="0" role="button" aria-label="Maillon 4, estimation — cliquez pour les détails">
    <rect x="728" y="202" width="132" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="728" y="202" width="132" height="4" fill="#1F5560"/>
    <text x="740" y="226" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">MAILLON 4</text>
    <text x="740" y="250" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Estimation</text>
    <text x="740" y="268" class="body" font-size="11.5" fill="#5A5A5A">exécution, intervalles</text>
  </g>
  <g class="interactive" data-card="maillon-lecture" tabindex="0" role="button" aria-label="Maillon 5, lecture et réallocation budgétaire — cliquez pour les détails">
    <rect x="864" y="202" width="132" height="76" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.75"/>
    <rect x="864" y="202" width="132" height="4" fill="#B7332C"/>
    <text x="876" y="226" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C">MAILLON 5</text>
    <text x="876" y="250" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Lecture</text>
    <text x="876" y="268" class="body" font-size="11.5" fill="#B7332C">réallocation</text>
  </g>
  <g class="interactive" data-card="maillon-archivage" tabindex="0" role="button" aria-label="Maillon 6, archivage et rejouabilité — cliquez pour les détails">
    <rect x="1000" y="202" width="132" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="1000" y="202" width="132" height="4" fill="#1F5560"/>
    <text x="1012" y="226" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">MAILLON 6</text>
    <text x="1012" y="250" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Archivage</text>
    <text x="1012" y="268" class="body" font-size="11.5" fill="#5A5A5A">registre, rejeu</text>
  </g>

  <line x1="64" y1="294" x2="1132" y2="294" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Ligne A : appétence -->
  <text x="64" y="322" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Appétence de délégation</text>
  <text x="64" y="340" class="body" font-size="12.5" fill="#5A5A5A">déclarée par les acheteurs</text>
  <text x="64" y="358" class="mono" font-size="10" letter-spacing="0.06em" fill="#8A8478">IAB 2026 · DÉCLARATIF</text>
  <g>
    <circle cx="386" cy="336" r="13" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
    <path d="M 386 323 A 13 13 0 0 1 386 349 Z" fill="#5A5A5A"/>
    <circle cx="522" cy="336" r="13" fill="#5A5A5A"/>
    <circle cx="658" cy="336" r="13" fill="#B7332C"/>
    <circle cx="794" cy="336" r="13" fill="#5A5A5A"/>
    <circle cx="930" cy="336" r="13" fill="#B7332C"/>
    <circle cx="1066" cy="336" r="13" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
  </g>
  <text x="930" y="366" class="mono" font-size="10" fill="#B7332C" text-anchor="middle">82 %</text>
  <line x1="64" y1="382" x2="1132" y2="382" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Ligne B : détectabilité -->
  <text x="64" y="410" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Détectabilité d'une erreur</text>
  <text x="64" y="428" class="body" font-size="12.5" fill="#5A5A5A">par contrôle automatique</text>
  <g>
    <circle cx="386" cy="424" r="13" fill="#1F5560"/>
    <circle cx="522" cy="424" r="13" fill="#1F5560"/>
    <circle cx="658" cy="424" r="13" fill="none" stroke="#B7332C" stroke-width="1.75"/>
    <circle cx="794" cy="424" r="13" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
    <path d="M 794 411 A 13 13 0 0 1 794 437 Z" fill="#5A5A5A"/>
    <circle cx="930" cy="424" r="13" fill="none" stroke="#B7332C" stroke-width="1.75"/>
    <circle cx="1066" cy="424" r="13" fill="#1F5560"/>
  </g>
  <text x="658" y="454" class="mono" font-size="10" fill="#B7332C" text-anchor="middle">NULLE</text>
  <text x="930" y="454" class="mono" font-size="10" fill="#B7332C" text-anchor="middle">NULLE</text>
  <line x1="64" y1="470" x2="1132" y2="470" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Ligne C : réversibilité -->
  <text x="64" y="498" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Réversibilité de l'erreur</text>
  <text x="64" y="516" class="body" font-size="12.5" fill="#5A5A5A">une fois la décision prise</text>
  <g>
    <circle cx="386" cy="512" r="13" fill="#1F5560"/>
    <circle cx="522" cy="512" r="13" fill="#1F5560"/>
    <circle cx="658" cy="512" r="13" fill="none" stroke="#B7332C" stroke-width="1.75"/>
    <circle cx="794" cy="512" r="13" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
    <path d="M 794 499 A 13 13 0 0 1 794 525 Z" fill="#5A5A5A"/>
    <circle cx="930" cy="512" r="13" fill="none" stroke="#B7332C" stroke-width="1.75"/>
    <circle cx="1066" cy="512" r="13" fill="#1F5560"/>
  </g>
  <line x1="64" y1="558" x2="1132" y2="558" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Ligne verdict -->
  <text x="64" y="586" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Palier maximal défendable</text>
  <text x="64" y="604" class="mono" font-size="10" letter-spacing="0.06em" fill="#8A8478">LECTURE PROPRE À CE DOSSIER</text>
  <g>
    <rect x="322" y="574" width="128" height="34" rx="3" fill="#1F5560" fill-opacity="0.12"/>
    <text x="386" y="590" class="body" font-size="11.5" fill="#1F5560" text-anchor="middle">Exécute, revue</text>
    <text x="386" y="604" class="body" font-size="11.5" fill="#1F5560" text-anchor="middle">a posteriori</text>
    <rect x="458" y="574" width="128" height="34" rx="3" fill="#1F5560" fill-opacity="0.12"/>
    <text x="522" y="590" class="body" font-size="11.5" fill="#1F5560" text-anchor="middle">Exécute, revue</text>
    <text x="522" y="604" class="body" font-size="11.5" fill="#1F5560" text-anchor="middle">a posteriori</text>
    <rect x="594" y="574" width="128" height="34" rx="3" fill="#B7332C" fill-opacity="0.14"/>
    <text x="658" y="596" class="body" font-size="12" font-weight="600" fill="#B7332C" text-anchor="middle">Propose seulement</text>
    <rect x="730" y="574" width="128" height="34" rx="3" fill="#1F5560" fill-opacity="0.12"/>
    <text x="794" y="590" class="body" font-size="11.5" fill="#1F5560" text-anchor="middle">Exécute sous</text>
    <text x="794" y="604" class="body" font-size="11.5" fill="#1F5560" text-anchor="middle">revue préalable</text>
    <rect x="866" y="574" width="128" height="34" rx="3" fill="#B7332C" fill-opacity="0.14"/>
    <text x="930" y="596" class="body" font-size="12" font-weight="600" fill="#B7332C" text-anchor="middle">Propose seulement</text>
    <rect x="1002" y="574" width="128" height="34" rx="3" fill="#1F5560" fill-opacity="0.12"/>
    <text x="1066" y="596" class="body" font-size="12" fill="#1F5560" text-anchor="middle">Exécute seul</text>
  </g>

  <!-- Légende -->
  <g>
    <text x="64" y="652" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">LECTURE DES PASTILLES</text>
    <circle cx="76" cy="676" r="9" fill="#5A5A5A"/>
    <text x="94" y="681" class="body" font-size="12" fill="#1A1A1A">élevée</text>
    <circle cx="176" cy="676" r="9" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
    <path d="M 176 667 A 9 9 0 0 1 176 685 Z" fill="#5A5A5A"/>
    <text x="194" y="681" class="body" font-size="12" fill="#1A1A1A">partielle</text>
    <circle cx="290" cy="676" r="9" fill="none" stroke="#5A5A5A" stroke-width="1.25"/>
    <text x="308" y="681" class="body" font-size="12" fill="#1A1A1A">faible ou nulle</text>
  </g>

  <!-- Croisement -->
  <g class="interactive" data-card="le-croisement" tabindex="0" role="button" aria-label="Le croisement entre appétence forte et détectabilité nulle — cliquez pour les détails">
    <rect x="460" y="636" width="672" height="112" rx="3" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="1.25"/>
    <rect x="460" y="636" width="5" height="112" fill="#B7332C"/>
    <text x="488" y="664" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">LE CROISEMENT</text>
    <text x="488" y="692" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Deux maillons cumulent une appétence forte et une détectabilité nulle :</text>
    <text x="488" y="714" class="display" font-size="18" font-weight="600" fill="#1A1A1A">la spécification du plan d'identification et la lecture qui engage le budget.</text>
    <text x="488" y="738" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Ce sont les deux seuls où aucun contrôle automatique ne peut contredire l'agent.</text>
  </g>

  <line x1="64" y1="776" x2="1136" y2="776" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="802" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">APPÉTENCE : IAB, 2026 OUTLOOK STUDY (PLUS DE 200 ACHETEURS, DÉCLARATIF) ET WFA, SEPTEMBRE 2026. DÉTECTABILITÉ, RÉVERSIBILITÉ ET PALIERS :</text>
  <text x="64" y="820" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">GRILLE ANALYTIQUE PROPRE À CE DOSSIER, DÉRIVÉE DE L'ARGUMENT D'OBSERVABILITÉ EXPOSÉ EN SECTION 2.</text>
</svg>
