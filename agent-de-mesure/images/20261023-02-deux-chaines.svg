<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Deux chaînes comparées : en prédiction la vérité de terrain finit par être observée et la validation croisée attrape l'erreur, en mesure d'incrémentalité le contre-factuel n'est jamais observé et l'erreur d'identification reste silencieuse">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
    <marker id="ar2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Deux chaînes, un seul contre-factuel observable</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La boucle de validation existe dans l'une et n'a aucun équivalent dans l'autre.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- En-têtes de colonnes -->
  <g>
    <rect x="264" y="192" width="410" height="40" rx="3" fill="#1F5560"/>
    <text x="288" y="218" class="body" font-size="14" font-weight="600" fill="#FAF8F3">CHAÎNE A · prédire un comportement</text>
    <rect x="706" y="192" width="430" height="40" rx="3" fill="#B7332C"/>
    <text x="730" y="218" class="body" font-size="14" font-weight="600" fill="#FAF8F3">CHAÎNE B · mesurer un effet incrémental</text>
  </g>

  <!-- R1 -->
  <text x="64" y="272" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Les données</text>
  <text x="64" y="289" class="body" font-size="12" fill="#5A5A5A">de départ</text>
  <rect x="264" y="250" width="410" height="54" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="288" y="283" class="body" font-size="13.5" fill="#1A1A1A">Historique de clients, de commandes, d'expositions</text>
  <rect x="706" y="250" width="430" height="54" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="730" y="283" class="body" font-size="13.5" fill="#1A1A1A">Historique de clients, de commandes, d'expositions</text>

  <line x1="469" y1="304" x2="469" y2="314" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar2)"/>
  <line x1="921" y1="304" x2="921" y2="314" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar2)"/>

  <!-- R2 -->
  <text x="64" y="342" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Le choix</text>
  <text x="64" y="359" class="body" font-size="12" fill="#5A5A5A">méthodologique</text>
  <rect x="264" y="320" width="410" height="54" rx="3" fill="#1F5560" fill-opacity="0.1" stroke="#1F5560" stroke-width="1.25"/>
  <text x="288" y="345" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Architecture, variables, hyperparamètres</text>
  <text x="288" y="364" class="body" font-size="12" font-style="italic" fill="#5A5A5A">arbitrables par le score obtenu</text>
  <rect x="706" y="320" width="430" height="54" rx="3" fill="#B7332C" fill-opacity="0.12" stroke="#B7332C" stroke-width="1.75"/>
  <text x="730" y="345" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Plan d'identification : qui est le témoin, quelle fenêtre,</text>
  <text x="730" y="364" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">quels facteurs de confusion sont supposés absents</text>

  <line x1="469" y1="374" x2="469" y2="384" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar2)"/>
  <line x1="921" y1="374" x2="921" y2="384" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar2)"/>

  <!-- R3 -->
  <text x="64" y="412" class="body" font-size="13" font-weight="600" fill="#1A1A1A">La sortie</text>
  <text x="64" y="429" class="body" font-size="12" fill="#5A5A5A">produite</text>
  <rect x="264" y="390" width="410" height="54" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="288" y="423" class="body" font-size="13.5" fill="#1A1A1A">Une probabilité d'achat par client</text>
  <rect x="706" y="390" width="430" height="54" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="730" y="423" class="body" font-size="13.5" fill="#1A1A1A">Un retour sur investissement et son intervalle</text>

  <line x1="469" y1="444" x2="469" y2="454" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar2)"/>
  <line x1="921" y1="444" x2="921" y2="454" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar2)"/>

  <!-- R4 : la quantité de référence -->
  <text x="64" y="486" class="body" font-size="13" font-weight="600" fill="#1A1A1A">La quantité</text>
  <text x="64" y="503" class="body" font-size="12" fill="#5A5A5A">de référence</text>
  <g class="interactive" data-card="verite-terrain-supervise" tabindex="0" role="button" aria-label="La vérité de terrain en prédiction — cliquez pour les détails">
    <rect x="264" y="460" width="410" height="78" rx="3" fill="#1F5560" stroke="#1F5560" stroke-width="1.75"/>
    <text x="288" y="486" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#FAF8F3">OBSERVÉE À TERME</text>
    <text x="288" y="512" class="display" font-size="19" font-weight="600" fill="#FAF8F3">Les achats réels du client</text>
    <text x="288" y="530" class="body" font-size="12" fill="#FAF8F3" fill-opacity="0.85">On masque, on attend, on compare, on compte.</text>
  </g>
  <g class="interactive" data-card="verite-terrain-causal" tabindex="0" role="button" aria-label="Le contre-factuel jamais observé en mesure d'incrémentalité — cliquez pour les détails">
    <rect x="706" y="460" width="430" height="78" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.75" stroke-dasharray="6 4"/>
    <text x="730" y="486" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">JAMAIS OBSERVÉ</text>
    <text x="730" y="512" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Les achats des mêmes clients</text>
    <text x="730" y="530" class="body" font-size="12" fill="#5A5A5A">sans la dépense. Cette branche n'existe nulle part.</text>
  </g>

  <!-- R5 : ce que la validation attrape -->
  <text x="64" y="574" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Ce que la</text>
  <text x="64" y="591" class="body" font-size="12" fill="#5A5A5A">validation attrape</text>
  <g class="interactive" data-card="boucle-validation" tabindex="0" role="button" aria-label="La boucle de validation disponible en prédiction — cliquez pour les détails">
    <rect x="264" y="554" width="410" height="76" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <rect x="264" y="554" width="5" height="76" fill="#1F5560"/>
    <text x="292" y="580" class="body" font-size="14" font-weight="600" fill="#1F5560">Un mauvais modèle a un mauvais score.</text>
    <text x="292" y="602" class="body" font-size="12.5" fill="#5A5A5A">La boucle est automatisable, donc l'agent se corrige</text>
    <text x="292" y="620" class="body" font-size="12.5" fill="#5A5A5A">seul et une erreur grossière laisse une trace chiffrée.</text>
  </g>
  <g class="interactive" data-card="erreur-silencieuse" tabindex="0" role="button" aria-label="L'erreur silencieuse en mesure causale — cliquez pour les détails">
    <rect x="706" y="554" width="430" height="76" rx="3" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="1.75"/>
    <rect x="706" y="554" width="5" height="76" fill="#B7332C"/>
    <text x="734" y="580" class="body" font-size="14" font-weight="600" fill="#B7332C">Un mauvais plan produit un chiffre bien formé.</text>
    <text x="734" y="602" class="body" font-size="12.5" fill="#1A1A1A">Ni exception, ni avertissement, ni indicateur dégradé.</text>
    <text x="734" y="620" class="body" font-size="12.5" fill="#1A1A1A">L'erreur sort sous la forme d'un rapport de bonne tenue.</text>
  </g>

  <!-- Boucle de validation, chaîne A -->
  <path d="M 674 499 C 700 499 700 347 676 347" fill="none" stroke="#1F5560" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="690" y="430" class="mono" font-size="10" letter-spacing="0.08em" fill="#1F5560" transform="rotate(90 690 430)" text-anchor="middle">BOUCLE DE VALIDATION</text>

  <!-- Absence de boucle, chaîne B -->
  <path d="M 1136 499 C 1162 499 1162 347 1138 347" fill="none" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 4"/>
  <circle cx="1162" cy="423" r="13" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5"/>
  <line x1="1154" y1="415" x2="1170" y2="431" stroke="#B7332C" stroke-width="1.75"/>

  <!-- Bande chiffrée -->
  <g class="interactive" data-card="chiffre-663" tabindex="0" role="button" aria-label="Le relevé des 663 expériences de Gordon, Moakler et Zettelmeyer — cliquez pour les détails">
    <rect x="64" y="656" width="1072" height="100" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="64" y="656" width="5" height="100" fill="#1A1A1A"/>
    <text x="92" y="684" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">CE QUE COÛTE L'ABSENCE DE BOUCLE · 663 EXPÉRIENCES À GRANDE ÉCHELLE, META</text>
    <text x="92" y="712" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Apprentissage automatique double monté avec des réseaux profonds, données au niveau de l'utilisateur,</text>
    <text x="92" y="734" class="display" font-size="19" font-weight="600" fill="#1A1A1A">expériences randomisées comme référence. Erreur médiane sur l'incrémentalité :</text>
    <text x="864" y="712" class="mono" font-size="22" font-weight="600" fill="#B7332C">83 %</text>
    <text x="946" y="712" class="mono" font-size="22" font-weight="600" fill="#B7332C">58 %</text>
    <text x="1028" y="712" class="mono" font-size="22" font-weight="600" fill="#B7332C">24 %</text>
    <text x="864" y="730" class="mono" font-size="9.5" letter-spacing="0.05em" fill="#8A8478">HAUT</text>
    <text x="946" y="730" class="mono" font-size="9.5" letter-spacing="0.05em" fill="#8A8478">MILIEU</text>
    <text x="1028" y="730" class="mono" font-size="9.5" letter-spacing="0.05em" fill="#8A8478">BAS</text>
    <text x="864" y="746" class="mono" font-size="9.5" letter-spacing="0.05em" fill="#8A8478">DE TUNNEL</text>
  </g>

  <text x="64" y="800" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">CHIFFRES : GORDON, MOAKLER, ZETTELMEYER, « CLOSE ENOUGH? », MARKETING SCIENCE 42(4), 2023, VERSION PUBLIÉE. STRUCTURE DE LA COMPARAISON :</text>
  <text x="64" y="818" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">CADRE ANALYTIQUE DE L'AUTEUR.</text>
</svg>
