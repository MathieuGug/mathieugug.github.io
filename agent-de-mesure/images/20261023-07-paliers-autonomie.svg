<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Quatre paliers d'autonomie croisés avec les six maillons de la chaîne de mesure : le palier plafond défendable au 23 octobre 2026 et la condition qui permettrait d'en monter un">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <pattern id="hatch7" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#B7332C" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="820" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Un palier d'autonomie par maillon, et sa condition de sortie</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un palier unique pour « la mesure » aligne tout le dispositif sur le maillon le plus permissif.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="214" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">LE MAILLON</text>
  <text x="64" y="234" class="body" font-size="11.5" fill="#8A8478">de la chaîne de mesure</text>
  <g class="interactive" data-card="palier-proposer" tabindex="0" role="button" aria-label="L'agent propose — cliquez pour les détails">
    <rect x="300" y="190" width="124" height="60" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="362" y="208" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">PALIER 1</text>
    <text x="362" y="226" class="body" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">L'agent propose</text>
    <text x="362" y="242" class="body" font-size="10" fill="#8A8478" text-anchor="middle">un humain valide</text>
  </g>
  <g class="interactive" data-card="palier-supervise" tabindex="0" role="button" aria-label="Exécute sous revue — cliquez pour les détails">
    <rect x="432" y="190" width="124" height="60" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="494" y="208" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">PALIER 2</text>
    <text x="494" y="226" class="body" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Exécute sous revue</text>
    <text x="494" y="242" class="body" font-size="10" fill="#8A8478" text-anchor="middle">relu avant exécution</text>
  </g>
  <g class="interactive" data-card="palier-revue-posteriori" tabindex="0" role="button" aria-label="Revue a posteriori — cliquez pour les détails">
    <rect x="564" y="190" width="124" height="60" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="626" y="208" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">PALIER 3</text>
    <text x="626" y="226" class="body" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Revue a posteriori</text>
    <text x="626" y="242" class="body" font-size="10" fill="#8A8478" text-anchor="middle">par échantillonnage</text>
  </g>
  <g class="interactive" data-card="palier-autonome" tabindex="0" role="button" aria-label="Exécute seul — cliquez pour les détails">
    <rect x="696" y="190" width="124" height="60" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="758" y="208" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">PALIER 4</text>
    <text x="758" y="226" class="body" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Exécute seul</text>
    <text x="758" y="242" class="body" font-size="10" fill="#8A8478" text-anchor="middle">aucune revue</text>
  </g>
  <g class="interactive" data-card="condition-montee" tabindex="0" role="button" aria-label="La colonne des conditions pour monter d'un palier — cliquez pour les détails">
    <rect x="844" y="190" width="292" height="60" rx="3" fill="#1F5560" fill-opacity="0.1" stroke="#1F5560" stroke-width="1.25"/>
    <text x="864" y="214" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#1F5560">POUR MONTER D'UN PALIER</text>
    <text x="864" y="236" class="body" font-size="11.5" fill="#5A5A5A">une condition vérifiable et datable</text>
  </g>
  <line x1="64" y1="258" x2="1136" y2="258" stroke="#1A1A1A" stroke-width="1"/>
  <g>
    <rect x="64" y="274" width="4" height="44" fill="#1F5560"/>
    <text x="84" y="296" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Instrumentation</text>
    <text x="84" y="316" class="body" font-size="11.5" fill="#5A5A5A">plan de marquage, qualité des flux</text>
    <rect x="300" y="274" width="124" height="44" rx="3" fill="#1F5560" fill-opacity="0.14"/>
    <rect x="432" y="274" width="124" height="44" rx="3" fill="#1F5560" fill-opacity="0.14"/>
    <rect x="564" y="274" width="124" height="44" rx="3" fill="#1F5560"/>
    <text x="626" y="301" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#FAF8F3" text-anchor="middle">PLAFOND</text>
    <rect x="696" y="274" width="124" height="44" rx="3" fill="url(#hatch7)" stroke="#E5E1D8" stroke-width="1"/>
    <text x="864" y="294" class="body" font-size="12" fill="#1A1A1A">Un jeu de contrôles de cohérence qui</text>
    <text x="864" y="312" class="body" font-size="12" fill="#5A5A5A">échoue bruyamment sur les ruptures connues.</text>
  </g>
  <line x1="64" y1="334" x2="1136" y2="334" stroke="#E5E1D8" stroke-width="1"/>
  <g>
    <rect x="64" y="350" width="4" height="44" fill="#1F5560"/>
    <text x="84" y="372" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Préparation</text>
    <text x="84" y="392" class="body" font-size="11.5" fill="#5A5A5A">jointures, réconciliation</text>
    <rect x="300" y="350" width="124" height="44" rx="3" fill="#1F5560" fill-opacity="0.14"/>
    <rect x="432" y="350" width="124" height="44" rx="3" fill="#1F5560" fill-opacity="0.14"/>
    <rect x="564" y="350" width="124" height="44" rx="3" fill="#1F5560"/>
    <text x="626" y="377" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#FAF8F3" text-anchor="middle">PLAFOND</text>
    <rect x="696" y="350" width="124" height="44" rx="3" fill="url(#hatch7)" stroke="#E5E1D8" stroke-width="1"/>
    <text x="864" y="370" class="body" font-size="12" fill="#1A1A1A">Des règles de réconciliation versionnées,</text>
    <text x="864" y="388" class="body" font-size="12" fill="#5A5A5A">et un seuil d'écart qui alerte seul.</text>
  </g>
  <line x1="64" y1="410" x2="1136" y2="410" stroke="#E5E1D8" stroke-width="1"/>
  <g>
    <rect x="64" y="416" width="1072" height="64" rx="3" fill="#B7332C" fill-opacity="0.05"/>
    <rect x="64" y="426" width="4" height="44" fill="#B7332C"/>
    <text x="84" y="448" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Spécification</text>
    <text x="84" y="468" class="body" font-size="11.5" fill="#5A5A5A">plan d'identification</text>
    <rect x="300" y="426" width="124" height="44" rx="3" fill="#B7332C"/>
    <text x="362" y="453" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#FAF8F3" text-anchor="middle">PLAFOND</text>
    <rect x="432" y="426" width="124" height="44" rx="3" fill="url(#hatch7)" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="564" y="426" width="124" height="44" rx="3" fill="url(#hatch7)" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="696" y="426" width="124" height="44" rx="3" fill="url(#hatch7)" stroke="#E5E1D8" stroke-width="1"/>
    <text x="864" y="446" class="body" font-size="12" fill="#1A1A1A">Un dispositif capable de noter un choix</text>
    <text x="864" y="464" class="body" font-size="12" fill="#5A5A5A">d'identification. Il n'en existe aucun.</text>
  </g>
  <line x1="64" y1="486" x2="1136" y2="486" stroke="#E5E1D8" stroke-width="1"/>
  <g>
    <rect x="64" y="502" width="4" height="44" fill="#1F5560"/>
    <text x="84" y="524" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Estimation</text>
    <text x="84" y="544" class="body" font-size="11.5" fill="#5A5A5A">exécution, calculs</text>
    <rect x="300" y="502" width="124" height="44" rx="3" fill="#1F5560" fill-opacity="0.14"/>
    <rect x="432" y="502" width="124" height="44" rx="3" fill="#1F5560"/>
    <text x="494" y="529" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#FAF8F3" text-anchor="middle">PLAFOND</text>
    <rect x="564" y="502" width="124" height="44" rx="3" fill="url(#hatch7)" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="696" y="502" width="124" height="44" rx="3" fill="url(#hatch7)" stroke="#E5E1D8" stroke-width="1"/>
    <text x="864" y="522" class="body" font-size="12" fill="#1A1A1A">La batterie de réfutation du schéma 05</text>
    <text x="864" y="540" class="body" font-size="12" fill="#5A5A5A">exécutée et verte sur le plan retenu.</text>
  </g>
  <line x1="64" y1="562" x2="1136" y2="562" stroke="#E5E1D8" stroke-width="1"/>
  <g>
    <rect x="64" y="568" width="1072" height="64" rx="3" fill="#B7332C" fill-opacity="0.05"/>
    <rect x="64" y="578" width="4" height="44" fill="#B7332C"/>
    <text x="84" y="600" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Lecture</text>
    <text x="84" y="620" class="body" font-size="11.5" fill="#5A5A5A">réallocation budgétaire</text>
    <rect x="300" y="578" width="124" height="44" rx="3" fill="#B7332C"/>
    <text x="362" y="605" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#FAF8F3" text-anchor="middle">PLAFOND</text>
    <rect x="432" y="578" width="124" height="44" rx="3" fill="url(#hatch7)" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="564" y="578" width="124" height="44" rx="3" fill="url(#hatch7)" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="696" y="578" width="124" height="44" rx="3" fill="url(#hatch7)" stroke="#E5E1D8" stroke-width="1"/>
    <text x="864" y="598" class="body" font-size="12" fill="#1A1A1A">Rien de technique : la décision budgétaire</text>
    <text x="864" y="616" class="body" font-size="12" fill="#5A5A5A">appartient à une personne nommée.</text>
  </g>
  <line x1="64" y1="638" x2="1136" y2="638" stroke="#E5E1D8" stroke-width="1"/>
  <g>
    <rect x="64" y="654" width="4" height="44" fill="#1F5560"/>
    <text x="84" y="676" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Archivage et réfutation</text>
    <text x="84" y="696" class="body" font-size="11.5" fill="#5A5A5A">registre, rejeu, contrôles</text>
    <rect x="300" y="654" width="124" height="44" rx="3" fill="#1F5560" fill-opacity="0.14"/>
    <rect x="432" y="654" width="124" height="44" rx="3" fill="#1F5560" fill-opacity="0.14"/>
    <rect x="564" y="654" width="124" height="44" rx="3" fill="#1F5560" fill-opacity="0.14"/>
    <rect x="696" y="654" width="124" height="44" rx="3" fill="#1F5560"/>
    <text x="758" y="681" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#FAF8F3" text-anchor="middle">PLAFOND</text>
    <text x="864" y="674" class="body" font-size="12" fill="#1A1A1A">Déjà au palier maximal : le verdict d'un</text>
    <text x="864" y="692" class="body" font-size="12" fill="#5A5A5A">test se vérifie sans vérité de terrain.</text>
  </g>
  <line x1="64" y1="714" x2="1136" y2="714" stroke="#1A1A1A" stroke-width="1"/>
  <g>
    <rect x="64" y="730" width="24" height="14" rx="2" fill="#1F5560"/>
    <text x="96" y="742" class="body" font-size="11.5" fill="#1A1A1A">palier plafond défendable</text>
    <rect x="276" y="730" width="24" height="14" rx="2" fill="#1F5560" fill-opacity="0.14"/>
    <text x="308" y="742" class="body" font-size="11.5" fill="#1A1A1A">palier inférieur, permis</text>
    <rect x="480" y="730" width="24" height="14" rx="2" fill="url(#hatch7)" stroke="#E5E1D8" stroke-width="1"/>
    <text x="512" y="742" class="body" font-size="11.5" fill="#1A1A1A">au-delà du plafond</text>
    <rect x="684" y="730" width="24" height="14" rx="2" fill="#B7332C"/>
    <text x="716" y="742" class="body" font-size="11.5" fill="#1A1A1A">maillon où le plafond est « propose seulement »</text>
  </g>
  <text x="64" y="788" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">PALIERS ET PLAFONDS : GRILLE ANALYTIQUE PROPRE À CE DOSSIER, ÉTAT AU 23 OCTOBRE 2026. ANCRAGES CHIFFRÉS DES CONDITIONS : SCHÉMAS 03 ET 05.</text>
</svg>