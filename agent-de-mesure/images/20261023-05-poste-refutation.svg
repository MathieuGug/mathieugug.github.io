<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Le poste de travail de la réfutation : six tests de robustesse, ce que chacun attrape, son coût de production à la main et son caractère délégable à un agent">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le poste de travail de la réfutation</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Énumérable, mécanique, vérifiable, coûteux à la main : le profil exact d'une tâche à déléguer.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="206" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">LE TEST</text>
  <text x="380" y="206" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL ATTRAPE, ET QUE L'ESTIMATION SEULE LAISSE PASSER</text>
  <g class="interactive" data-card="colonne-cout" tabindex="0" role="button" aria-label="La colonne du coût de production à la main — cliquez pour les détails">
    <rect x="770" y="188" width="180" height="26" rx="3" fill="#B58A2C" fill-opacity="0.14"/>
    <text x="784" y="206" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A6A1E">COÛT À LA MAIN</text>
  </g>
  <text x="960" y="206" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">DÉLÉGABLE</text>
  <line x1="64" y1="222" x2="1136" y2="222" stroke="#1A1A1A" stroke-width="1"/>
  <g class="interactive" data-card="test-placebo" tabindex="0" role="button" aria-label="Test de placebo — cliquez pour les détails">
    <rect x="64" y="228" width="1072" height="64" rx="3" fill="#1F5560" fill-opacity="0.06"/>
    <rect x="64" y="236" width="4" height="48" fill="#1F5560"/>
    <text x="84" y="254" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#1F5560">PLACEBO</text>
    <text x="84" y="278" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Test de placebo</text>
    <text x="380" y="260" class="body" font-size="12.5" fill="#1A1A1A">Un effet qui remonte là où le traitement n'a pas eu lieu.</text>
    <text x="380" y="280" class="body" font-size="12.5" fill="#5A5A5A">Le plan capte alors autre chose que la campagne.</text>
    <rect x="784" y="256" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <rect x="818" y="256" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <rect x="852" y="256" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1"/>
    <text x="784" y="286" class="body" font-size="11" fill="#8A6A1E">moyen</text>
    <circle cx="972" cy="263" r="7" fill="#1F5560"/>
    <path d="M 969 263 l 2.5 3 l 4.5 -5.5" fill="none" stroke="#FAF8F3" stroke-width="1.6"/>
    <text x="988" y="260" class="body" font-size="12.5" font-weight="600" fill="#1F5560">Oui</text>
    <text x="988" y="278" class="body" font-size="11" fill="#5A5A5A">verdict binaire</text>
  </g>
  <line x1="64" y1="298" x2="1136" y2="298" stroke="#E5E1D8" stroke-width="1"/>
  <g class="interactive" data-card="test-controle-negatif" tabindex="0" role="button" aria-label="Contrôle négatif — cliquez pour les détails">
    <rect x="64" y="304" width="1072" height="64" rx="3" fill="#1F5560" fill-opacity="0.06"/>
    <rect x="64" y="312" width="4" height="48" fill="#1F5560"/>
    <text x="84" y="330" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#1F5560">CONTRÔLE NÉGATIF</text>
    <text x="84" y="354" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Contrôle négatif</text>
    <text x="380" y="336" class="body" font-size="12.5" fill="#1A1A1A">Un indicateur qui ne pouvait pas être affecté par la campagne</text>
    <text x="380" y="356" class="body" font-size="12.5" fill="#5A5A5A">et qui bouge quand même.</text>
    <rect x="784" y="332" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <rect x="818" y="332" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1"/>
    <rect x="852" y="332" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1"/>
    <text x="784" y="362" class="body" font-size="11" fill="#8A6A1E">faible</text>
    <circle cx="972" cy="339" r="7" fill="#1F5560"/>
    <path d="M 969 339 l 2.5 3 l 4.5 -5.5" fill="none" stroke="#FAF8F3" stroke-width="1.6"/>
    <text x="988" y="336" class="body" font-size="12.5" font-weight="600" fill="#1F5560">Oui</text>
    <text x="988" y="354" class="body" font-size="11" fill="#5A5A5A">verdict binaire</text>
  </g>
  <line x1="64" y1="374" x2="1136" y2="374" stroke="#E5E1D8" stroke-width="1"/>
  <g class="interactive" data-card="test-periode-anterieure" tabindex="0" role="button" aria-label="Rejeu avant traitement — cliquez pour les détails">
    <rect x="64" y="380" width="1072" height="64" rx="3" fill="#1F5560" fill-opacity="0.06"/>
    <rect x="64" y="388" width="4" height="48" fill="#1F5560"/>
    <text x="84" y="406" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#1F5560">PÉRIODE ANTÉRIEURE</text>
    <text x="84" y="430" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Rejeu avant traitement</text>
    <text x="380" y="412" class="body" font-size="12.5" fill="#1A1A1A">Un écart entre groupe traité et groupe témoin mesuré avant</text>
    <text x="380" y="432" class="body" font-size="12.5" fill="#5A5A5A">le début de la campagne : les groupes n'étaient pas comparables.</text>
    <rect x="784" y="408" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <rect x="818" y="408" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <rect x="852" y="408" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1"/>
    <text x="784" y="438" class="body" font-size="11" fill="#8A6A1E">moyen</text>
    <circle cx="972" cy="415" r="7" fill="#1F5560"/>
    <path d="M 969 415 l 2.5 3 l 4.5 -5.5" fill="none" stroke="#FAF8F3" stroke-width="1.6"/>
    <text x="988" y="412" class="body" font-size="12.5" font-weight="600" fill="#1F5560">Oui</text>
    <text x="988" y="430" class="body" font-size="11" fill="#5A5A5A">verdict binaire</text>
  </g>
  <line x1="64" y1="450" x2="1136" y2="450" stroke="#E5E1D8" stroke-width="1"/>
  <g>
    <rect x="64" y="464" width="4" height="48" fill="#8A8478"/>
    <text x="84" y="482" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">CONFUSION NON OBSERVÉE</text>
    <text x="84" y="506" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Sensibilité à un facteur caché</text>
    <text x="380" y="488" class="body" font-size="12.5" fill="#1A1A1A">La force qu'il faudrait à un facteur non mesuré pour annuler</text>
    <text x="380" y="508" class="body" font-size="12.5" fill="#5A5A5A">l'effet trouvé. Une borne, plutôt qu'un oui ou un non.</text>
    <rect x="784" y="484" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <rect x="818" y="484" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <rect x="852" y="484" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <text x="784" y="514" class="body" font-size="11" fill="#8A6A1E">élevé</text>
    <circle cx="972" cy="491" r="7" fill="#1F5560"/>
    <path d="M 969 491 l 2.5 3 l 4.5 -5.5" fill="none" stroke="#FAF8F3" stroke-width="1.6"/>
    <text x="988" y="488" class="body" font-size="12.5" font-weight="600" fill="#1F5560">Oui</text>
    <text x="988" y="506" class="body" font-size="11" fill="#5A5A5A">borne chiffrée</text>
  </g>
  <line x1="64" y1="526" x2="1136" y2="526" stroke="#E5E1D8" stroke-width="1"/>
  <g>
    <rect x="64" y="540" width="4" height="48" fill="#8A8478"/>
    <text x="84" y="558" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">RÉÉCHANTILLONNAGE</text>
    <text x="84" y="582" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Amorçage et sous-échantillons</text>
    <text x="380" y="564" class="body" font-size="12.5" fill="#1A1A1A">Un résultat qui ne tient que sur une poignée d'observations</text>
    <text x="380" y="584" class="body" font-size="12.5" fill="#5A5A5A">ou sur une seule zone géographique.</text>
    <rect x="784" y="560" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <rect x="818" y="560" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1"/>
    <rect x="852" y="560" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1"/>
    <text x="784" y="590" class="body" font-size="11" fill="#8A6A1E">faible</text>
    <circle cx="972" cy="567" r="7" fill="#1F5560"/>
    <path d="M 969 567 l 2.5 3 l 4.5 -5.5" fill="none" stroke="#FAF8F3" stroke-width="1.6"/>
    <text x="988" y="564" class="body" font-size="12.5" font-weight="600" fill="#1F5560">Oui</text>
    <text x="988" y="582" class="body" font-size="11" fill="#5A5A5A">verdict binaire</text>
  </g>
  <line x1="64" y1="602" x2="1136" y2="602" stroke="#E5E1D8" stroke-width="1"/>
  <g class="interactive" data-card="test-sensibilite-priors" tabindex="0" role="button" aria-label="Sensibilité aux priors — cliquez pour les détails">
    <rect x="64" y="608" width="1072" height="64" rx="3" fill="#1F5560" fill-opacity="0.06"/>
    <rect x="64" y="616" width="4" height="48" fill="#1F5560"/>
    <text x="84" y="634" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#1F5560">PRIORS</text>
    <text x="84" y="658" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Sensibilité aux priors</text>
    <text x="380" y="640" class="body" font-size="12.5" fill="#1A1A1A">Un retour sur investissement qui reflète le prior du modèle de mix</text>
    <text x="380" y="660" class="body" font-size="12.5" fill="#5A5A5A">davantage que les données de la période.</text>
    <rect x="784" y="636" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <rect x="818" y="636" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <rect x="852" y="636" width="28" height="14" rx="2" fill="#B58A2C" stroke="#B58A2C" stroke-width="1"/>
    <text x="784" y="666" class="body" font-size="11" fill="#8A6A1E">élevé</text>
    <circle cx="972" cy="643" r="7" fill="#1F5560"/>
    <path d="M 969 643 l 2.5 3 l 4.5 -5.5" fill="none" stroke="#FAF8F3" stroke-width="1.6"/>
    <text x="988" y="640" class="body" font-size="12.5" font-weight="600" fill="#1F5560">Oui, après</text>
    <text x="988" y="658" class="body" font-size="11" fill="#5A5A5A">fixation humaine du prior</text>
  </g>
  <line x1="64" y1="678" x2="1136" y2="678" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="64" y="696" width="1072" height="84" rx="3" fill="#1F5560" fill-opacity="0.08" stroke="#1F5560" stroke-width="1.25"/>
  <rect x="64" y="696" width="5" height="84" fill="#1F5560"/>
  <text x="92" y="722" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#1F5560">LE SEUL DROIT DE VETO DE L'AGENT</text>
  <text x="92" y="750" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Un test de réfutation qui échoue est un fait, et il bloque la publication du chiffre sans arbitrage préalable.</text>
  <text x="92" y="772" class="body" font-size="12.5" fill="#5A5A5A">L'agent y dispose d'un pouvoir qu'il n'a nulle part ailleurs dans le dispositif, parce que son verdict se vérifie sans connaître la vérité de terrain.</text>
  <text x="64" y="806" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">CONTENU DE LA BATTERIE : SHARMA ET KIÇIMAN, DOWHY, 2020 (QUATRIÈME TEMPS « RÉFUTER »). CALIBRATION PAR CANAL ET SCORE DE BESOIN :</text>
  <text x="64" y="824" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">DOCUMENTATION GOOGLE MERIDIAN. ÉCHELLE DE COÛT ET VERDICTS DE DÉLÉGABILITÉ : APPRÉCIATION PROPRE À CE DOSSIER.</text>
</svg>