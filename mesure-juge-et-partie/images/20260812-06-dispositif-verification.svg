<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Le dispositif de vérification d'un annonceur : trois lignes de défense et les six clauses contractuelles qui les rendent possibles">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le dispositif de vérification</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois lignes de défense, et les six clauses qu'il faut avoir obtenues avant d'en avoir besoin</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="182" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUE L'ANNONCEUR CONSTRUIT</text>
  <text x="754" y="182" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL ÉCRIT AU CONTRAT</text>

  <!-- ============ LIGNE 1 — TEST POSSÉDÉ ============ -->
  <g class="interactive" data-card="ligne-test" tabindex="0" role="button" aria-label="Première ligne de défense, une capacité de test que l'on possède — cliquez pour les détails">
    <rect x="64" y="196" width="636" height="170" rx="3" fill="#B7332C" opacity="0.06"/>
    <rect x="64" y="196" width="636" height="170" rx="3" fill="none" stroke="#B7332C" stroke-width="1.5"/>
    <circle cx="98" cy="230" r="14" fill="#B7332C"/>
    <text x="98" y="235" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">A</text>
    <text x="126" y="236" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Une capacité de test que l'on possède</text>
    <text x="126" y="264" class="body" font-size="12.5" fill="#1A1A1A">Expérimentation géographique : zones tirées au sort, investissement coupé ou</text>
    <text x="126" y="282" class="body" font-size="12.5" fill="#1A1A1A">augmenté, écart lu sur ses propres ventes. Le seul protocole causal qui ne</text>
    <text x="126" y="300" class="body" font-size="12.5" fill="#1A1A1A">dépend d'aucune régie.</text>
    <text x="126" y="330" class="mono" font-size="11" fill="#B7332C">CADENCE ANNUELLE OU SEMESTRIELLE PAR CANAL SIGNIFICATIF</text>
    <text x="126" y="350" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Coût : du budget délibérément sacrifié. Prérequis : un calcul de puissance avant lancement.</text>
  </g>

  <!-- ============ LIGNE 2 — CALIBRATION ============ -->
  <g class="interactive" data-card="ligne-calibration" tabindex="0" role="button" aria-label="Deuxième ligne de défense, la calibration du modèle de mix — cliquez pour les détails">
    <rect x="64" y="382" width="636" height="164" rx="3" fill="#1F5560" opacity="0.06"/>
    <rect x="64" y="382" width="636" height="164" rx="3" fill="none" stroke="#1F5560" stroke-width="1.25"/>
    <circle cx="98" cy="416" r="14" fill="#1F5560"/>
    <text x="98" y="421" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">B</text>
    <text x="126" y="422" class="display" font-size="20" font-weight="600" fill="#1A1A1A">La calibration par ses propres résultats</text>
    <text x="126" y="450" class="body" font-size="12.5" fill="#1A1A1A">Les modèles de mix bayésiens acceptent les résultats d'expérience comme a priori</text>
    <text x="126" y="468" class="body" font-size="12.5" fill="#1A1A1A">sur le retour par canal. Quand la donnée est pauvre, l'a priori décide.</text>
    <text x="126" y="498" class="mono" font-size="11" fill="#1F5560">RÈGLE : LES A PRIORI VIENNENT DES TESTS QUE L'ON POSSÈDE</text>
    <text x="126" y="520" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Calibrer avec les lifts de ses régies revient à faire ressortir leur chiffre d'un modèle</text>
    <text x="126" y="536" class="body" font-size="12.5" font-style="italic" fill="#B7332C">qui porte son propre nom.</text>
  </g>

  <!-- ============ LIGNE 3 — REGISTRE ============ -->
  <g class="interactive" data-card="ligne-registre" tabindex="0" role="button" aria-label="Troisième ligne de défense, le registre de mesure — cliquez pour les détails">
    <rect x="64" y="562" width="636" height="164" rx="3" fill="#B58A2C" opacity="0.07"/>
    <rect x="64" y="562" width="636" height="164" rx="3" fill="none" stroke="#B58A2C" stroke-width="1.25"/>
    <circle cx="98" cy="596" r="14" fill="#B58A2C"/>
    <text x="98" y="601" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">C</text>
    <text x="126" y="602" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le registre de mesure</text>
    <text x="126" y="630" class="body" font-size="12.5" fill="#1A1A1A">Consigné avant lancement : la règle de décision de chaque test, l'origine de chaque</text>
    <text x="126" y="648" class="body" font-size="12.5" fill="#1A1A1A">a priori, la famille méthodologique déclarée par chaque régie pour chaque chiffre.</text>
    <text x="126" y="678" class="mono" font-size="11" fill="#B58A2C">INDICATEUR DE PILOTAGE : LE TAUX DE TESTS NON CONCLUANTS</text>
    <text x="126" y="700" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Un dispositif dont tous les tests concluent positivement est sous-dimensionné,</text>
    <text x="126" y="716" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">ou lu avec complaisance.</text>
  </g>

  <!-- ============ LES SIX CLAUSES ============ -->
  <g class="interactive" data-card="bloc-clauses" tabindex="0" role="button" aria-label="Les six clauses contractuelles — cliquez pour les détails">
    <rect x="730" y="196" width="406" height="530" rx="3" fill="#F2EFE7" opacity="0.6" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="754" y="228" class="mono" font-size="11" letter-spacing="0.06em" fill="#5A5A5A">PAR DIFFICULTÉ D'OBTENTION CROISSANTE</text>
    <line x1="754" y1="244" x2="1112" y2="244" stroke="#E5E1D8" stroke-width="1"/>

    <text x="754" y="280" class="mono" font-size="12" fill="#B7332C">1</text>
    <text x="784" y="280" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Déclaration de famille méthodologique</text>
    <text x="784" y="298" class="body" font-size="12" fill="#5A5A5A">fenêtre, périmètre, définition du groupe témoin</text>
    <text x="1104" y="280" class="mono" font-size="11" fill="#B8B5AE" text-anchor="end">A B C</text>

    <text x="754" y="342" class="mono" font-size="12" fill="#B7332C">2</text>
    <text x="784" y="342" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Publication de l'incertitude</text>
    <text x="784" y="360" class="body" font-size="12" fill="#5A5A5A">taille d'échantillon et intervalle de confiance</text>
    <text x="1104" y="342" class="mono" font-size="11" fill="#B8B5AE" text-anchor="end">B C</text>

    <text x="754" y="404" class="mono" font-size="12" fill="#B7332C">3</text>
    <text x="784" y="404" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Droit au test</text>
    <text x="784" y="422" class="body" font-size="12" fill="#5A5A5A">périmètre défini par l'annonceur, fréquence</text>
    <text x="784" y="440" class="body" font-size="12" fill="#5A5A5A">contractuelle, accès à la donnée désagrégée</text>
    <text x="1104" y="404" class="mono" font-size="11" fill="#B8B5AE" text-anchor="end">A B</text>

    <text x="754" y="484" class="mono" font-size="12" fill="#B7332C">4</text>
    <text x="784" y="484" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Accès aux journaux</text>
    <text x="784" y="502" class="body" font-size="12" fill="#5A5A5A">exposition et conversion, format lisible par</text>
    <text x="784" y="520" class="body" font-size="12" fill="#5A5A5A">machine, délai contractuel</text>
    <text x="1104" y="484" class="mono" font-size="11" fill="#B8B5AE" text-anchor="end">B C</text>

    <text x="754" y="564" class="mono" font-size="12" fill="#B7332C">5</text>
    <text x="784" y="564" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Exercice de l'article 6(8)</text>
    <text x="784" y="582" class="body" font-size="12" fill="#5A5A5A">pour les contrôleurs d'accès : ce qui relève de</text>
    <text x="784" y="600" class="body" font-size="12" fill="#5A5A5A">la gratuité, et ce qui n'en relève pas</text>
    <text x="1104" y="564" class="mono" font-size="11" fill="#B8B5AE" text-anchor="end">A B</text>

    <text x="754" y="644" class="mono" font-size="12" fill="#B7332C">6</text>
    <text x="784" y="644" class="body" font-size="13" font-weight="600" fill="#B7332C">Non-exclusivité de la mesure</text>
    <text x="784" y="662" class="body" font-size="12" fill="#5A5A5A">droit de recourir à un tiers, interdiction de</text>
    <text x="784" y="680" class="body" font-size="12" fill="#5A5A5A">conditionner un avantage commercial</text>
    <text x="1104" y="644" class="mono" font-size="11" fill="#B8B5AE" text-anchor="end">A B C</text>

    <line x1="754" y1="700" x2="1112" y2="700" stroke="#E5E1D8" stroke-width="1"/>
    <text x="754" y="718" class="body" font-size="11.5" font-style="italic" fill="#B7332C">Le refus de la sixième est en soi une information.</text>
  </g>

  <line x1="64" y1="768" x2="1136" y2="768" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="792" class="body" font-size="11" font-style="italic" fill="#5A5A5A">A · B · C indiquent la ligne de défense que chaque clause rend possible. Sources : règlement (UE) 2022/1925, art. 6(8) ; IAB &amp; IAB Europe, novembre 2025 ;</text>
  <text x="64" y="810" class="body" font-size="11" font-style="italic" fill="#5A5A5A">documentation Google Meridian sur la calibration des a priori de retour. Composition du dispositif : analyse de l'auteur.</text>
</svg>
