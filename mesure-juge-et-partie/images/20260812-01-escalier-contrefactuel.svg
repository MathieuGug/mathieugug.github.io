<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Quatre niveaux de preuve de l'effet publicitaire, du dernier clic au test randomisé possédé par l'annonceur">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'escalier du contrefactuel</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre niveaux de preuve, et à chaque marche la question de savoir qui détient la donnée</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="100" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">NIVEAU DE PREUVE</text>
  <text x="410" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL ÉTABLIT RÉELLEMENT</text>
  <text x="720" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">QUI DÉTIENT LE CONTREFACTUEL</text>
  <text x="1092" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">FORCE</text>

  <!-- ================= MARCHE 1 ================= -->
  <g class="interactive" data-card="marche-dernier-clic" tabindex="0" role="button" aria-label="Dernier clic — cliquez pour les détails">
    <rect x="64" y="204" width="960" height="122" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <circle cx="94" cy="236" r="13" fill="#B8B5AE"/>
    <text x="94" y="240" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <text x="120" y="242" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Dernier clic</text>
    <text x="120" y="268" class="body" font-size="12" fill="#5A5A5A">Le compteur du serveur publicitaire.</text>
    <text x="120" y="286" class="body" font-size="12" fill="#5A5A5A">Aucun contrefactuel n'est construit.</text>

    <text x="410" y="234" class="body" font-size="12.5" fill="#1A1A1A">Une succession temporelle entre une</text>
    <text x="410" y="252" class="body" font-size="12.5" fill="#1A1A1A">exposition et un achat. Rien d'autre.</text>
    <text x="410" y="280" class="body" font-size="12" font-style="italic" fill="#B7332C">Créditerait 100 % du cas eBay</text>

    <text x="720" y="234" class="body" font-size="12.5" fill="#1A1A1A">Personne. La question n'est pas posée :</text>
    <text x="720" y="252" class="body" font-size="12.5" fill="#1A1A1A">l'acheteur non exposé n'existe pas</text>
    <text x="720" y="270" class="body" font-size="12.5" fill="#1A1A1A">dans le tableau de bord.</text>

    <rect x="1062" y="294" width="60" height="16" rx="2" fill="#B8B5AE"/>
  </g>

  <!-- ================= MARCHE 2 ================= -->
  <g class="interactive" data-card="marche-mta" tabindex="0" role="button" aria-label="Attribution multi-touch — cliquez pour les détails">
    <rect x="64" y="346" width="960" height="122" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <circle cx="94" cy="378" r="13" fill="#B58A2C"/>
    <text x="94" y="382" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
    <text x="120" y="384" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Attribution multi-touch</text>
    <text x="120" y="410" class="body" font-size="12" fill="#5A5A5A">Répartition d'un crédit de vente</text>
    <text x="120" y="428" class="body" font-size="12" fill="#5A5A5A">entre les points de contact observés.</text>

    <text x="410" y="376" class="body" font-size="12.5" fill="#1A1A1A">Une règle de partage choisie a priori,</text>
    <text x="410" y="394" class="body" font-size="12.5" fill="#1A1A1A">appliquée à des expositions sélectionnées</text>
    <text x="410" y="412" class="body" font-size="12.5" fill="#1A1A1A">par le système de ciblage lui-même.</text>
    <text x="410" y="440" class="body" font-size="12" font-style="italic" fill="#B7332C">Le biais de sélection est intact</text>

    <text x="720" y="376" class="body" font-size="12.5" fill="#1A1A1A">Personne. Le partage du crédit ne dit</text>
    <text x="720" y="394" class="body" font-size="12.5" fill="#1A1A1A">rien de ce qui serait arrivé sans</text>
    <text x="720" y="412" class="body" font-size="12.5" fill="#1A1A1A">aucun des points de contact.</text>

    <rect x="1062" y="286" width="60" height="24" rx="2" fill="#B58A2C" opacity="0.8"/>
  </g>

  <!-- ================= MARCHE 3 ================= -->
  <g class="interactive" data-card="marche-lift-vendeur" tabindex="0" role="button" aria-label="Lift produit par le vendeur — cliquez pour les détails">
    <rect x="64" y="488" width="960" height="140" rx="3" fill="#F2EFE7" opacity="0.75" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="94" cy="520" r="13" fill="#1F5560"/>
    <text x="94" y="524" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
    <text x="120" y="526" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Lift produit par le vendeur</text>
    <text x="120" y="552" class="body" font-size="12" fill="#5A5A5A">Publicités fantômes, placebo</text>
    <text x="120" y="570" class="body" font-size="12" fill="#5A5A5A">publicitaire, ou contrefactuel modélisé.</text>
    <text x="120" y="596" class="mono" font-size="11" letter-spacing="0.05em" fill="#1F5560">JOHNSON, LEWIS &amp; NUBBEMEYER 2017</text>

    <text x="410" y="518" class="body" font-size="12.5" fill="#1A1A1A">Un effet causal réel quand le protocole</text>
    <text x="410" y="536" class="body" font-size="12.5" fill="#1A1A1A">est randomisé. Une opinion documentée</text>
    <text x="410" y="554" class="body" font-size="12.5" fill="#1A1A1A">quand le contrefactuel est modélisé.</text>
    <text x="410" y="582" class="body" font-size="12" font-style="italic" fill="#B7332C">Les deux arrivent dans la même colonne</text>

    <text x="720" y="518" class="body" font-size="12.5" fill="#1A1A1A">La régie, seule. Seul le système qui</text>
    <text x="720" y="536" class="body" font-size="12.5" fill="#1A1A1A">tient l'enchère sait qui aurait gagné</text>
    <text x="720" y="554" class="body" font-size="12.5" fill="#1A1A1A">l'impression. Le protocole n'est pas</text>
    <text x="720" y="572" class="body" font-size="12.5" fill="#1A1A1A">reproductible par un tiers.</text>

    <rect x="1062" y="266" width="60" height="44" rx="2" fill="#1F5560" opacity="0.75"/>
  </g>

  <!-- ================= MARCHE 4 ================= -->
  <g class="interactive" data-card="marche-test-possede" tabindex="0" role="button" aria-label="Test randomisé possédé par l'annonceur — cliquez pour les détails">
    <rect x="64" y="648" width="960" height="140" rx="3" fill="#B7332C" opacity="0.07"/>
    <rect x="64" y="648" width="960" height="140" rx="3" fill="none" stroke="#B7332C" stroke-width="1.5"/>
    <circle cx="94" cy="680" r="13" fill="#B7332C"/>
    <text x="94" y="684" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">4</text>
    <text x="120" y="686" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Test randomisé possédé</text>
    <text x="120" y="712" class="body" font-size="12" fill="#5A5A5A">Expérimentation géographique :</text>
    <text x="120" y="730" class="body" font-size="12" fill="#5A5A5A">zones tirées au sort, budget coupé,</text>
    <text x="120" y="748" class="body" font-size="12" fill="#5A5A5A">écart lu sur ses propres ventes.</text>

    <text x="410" y="678" class="body" font-size="12.5" fill="#1A1A1A">Un effet causal que l'annonceur peut</text>
    <text x="410" y="696" class="body" font-size="12.5" fill="#1A1A1A">défendre ligne à ligne, protocole</text>
    <text x="410" y="714" class="body" font-size="12.5" fill="#1A1A1A">compris, sous réserve de puissance</text>
    <text x="410" y="732" class="body" font-size="12.5" fill="#1A1A1A">statistique suffisante.</text>
    <text x="410" y="760" class="body" font-size="12" font-style="italic" fill="#B7332C">Sous-dimensionné, il ne prouve rien</text>

    <text x="720" y="678" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">L'annonceur.</text>
    <text x="720" y="700" class="body" font-size="12.5" fill="#1A1A1A">C'est la seule marche de l'escalier</text>
    <text x="720" y="718" class="body" font-size="12.5" fill="#1A1A1A">où le protocole, l'assignation et la</text>
    <text x="720" y="736" class="body" font-size="12.5" fill="#1A1A1A">donnée de résultat lui appartiennent.</text>

    <rect x="1062" y="222" width="60" height="88" rx="2" fill="#B7332C"/>
  </g>

  <!-- gauge baseline -->
  <line x1="1052" y1="312" x2="1132" y2="312" stroke="#1A1A1A" stroke-width="1.25"/>

  <line x1="64" y1="824" x2="1136" y2="824" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="850" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Sources : Blake, Nosko &amp; Tadelis (Econometrica, 2015) ; Johnson, Lewis &amp; Nubbemeyer (JMR, 2017) ; Gordon, Moakler &amp; Zettelmeyer (Marketing Science, 2023).</text>
</svg>
