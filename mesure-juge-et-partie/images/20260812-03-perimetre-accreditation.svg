<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Périmètre de l'accréditation indépendante : le noyau audité couvre le comptage de la diffusion, la couronne non auditée couvre l'incrémentalité">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le périmètre de l'accréditation</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">L'audit indépendant s'arrête au point où l'intérêt du mesureur commence à peser sur le résultat</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ============ COURONNE NON AUDITÉE ============ -->
  <g class="interactive" data-card="couronne-non-auditee" tabindex="0" role="button" aria-label="Ce qui n'est jamais accrédité — cliquez pour les détails">
    <circle cx="400" cy="492" r="248" fill="#B7332C" opacity="0.05"/>
    <circle cx="400" cy="492" r="248" fill="none" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 5"/>

    <text x="400" y="300" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C" text-anchor="middle">INCRÉMENTALITÉ</text>
    <text x="400" y="318" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">le lift publié par la régie</text>

    <text x="592" y="486" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C" text-anchor="middle">ATTRIBUTION</text>
    <text x="592" y="504" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">fenêtre et règle</text>
    <text x="592" y="520" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">de partage</text>

    <text x="400" y="676" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C" text-anchor="middle">HALO HORS LIGNE</text>
    <text x="400" y="694" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">ventes en magasin, effet de marque</text>

    <text x="208" y="486" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C" text-anchor="middle">CONTREFACTUEL</text>
    <text x="208" y="504" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">composition du</text>
    <text x="208" y="520" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">groupe témoin</text>
  </g>

  <!-- ============ NOYAU AUDITÉ ============ -->
  <g class="interactive" data-card="noyau-audite" tabindex="0" role="button" aria-label="Ce que l'accréditation couvre réellement — cliquez pour les détails">
    <circle cx="400" cy="492" r="122" fill="#1F5560" opacity="0.09"/>
    <circle cx="400" cy="492" r="122" fill="none" stroke="#1F5560" stroke-width="1.75"/>
    <text x="400" y="414" class="mono" font-size="11" letter-spacing="0.08em" fill="#1F5560" text-anchor="middle">PÉRIMÈTRE ACCRÉDITÉ</text>
    <text x="400" y="448" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A" text-anchor="middle">Impression affichée</text>
    <text x="400" y="474" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A" text-anchor="middle">Clic</text>
    <text x="400" y="500" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A" text-anchor="middle">Visibilité</text>
    <text x="400" y="526" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A" text-anchor="middle">Trafic invalide</text>
    <text x="400" y="556" class="mono" font-size="10.5" fill="#5A5A5A" text-anchor="middle">comptage de la diffusion</text>
  </g>

  <!-- légende -->
  <rect x="164" y="768" width="14" height="14" fill="#1F5560" opacity="0.35" stroke="#1F5560" stroke-width="1.25"/>
  <text x="186" y="780" class="body" font-size="12" fill="#1A1A1A">audité par un tiers mandaté, sur procédure écrite</text>
  <rect x="164" y="794" width="14" height="14" fill="#B7332C" opacity="0.12" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 3"/>
  <text x="186" y="806" class="body" font-size="12" fill="#1A1A1A">aucune accréditation indépendante n'existe à ce jour</text>

  <!-- ============ REGISTRE DES ACCRÉDITATIONS ============ -->
  <g class="interactive" data-card="registre-accreditations" tabindex="0" role="button" aria-label="Ce qui a réellement été accrédité, et depuis quand — cliquez pour les détails">
    <rect x="736" y="204" width="400" height="536" rx="3" fill="#F2EFE7" opacity="0.6" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="760" y="240" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">CE QUI A ÉTÉ ACCRÉDITÉ, ET QUAND</text>
    <line x1="760" y1="256" x2="1112" y2="256" stroke="#E5E1D8" stroke-width="1"/>

    <text x="760" y="294" class="mono" font-size="11.5" fill="#B7332C">2022</text>
    <text x="828" y="294" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Amazon Ads</text>
    <text x="828" y="314" class="body" font-size="12" fill="#5A5A5A">produits sponsorisés</text>

    <text x="760" y="360" class="mono" font-size="11.5" fill="#B7332C">MARS 2024</text>
    <text x="828" y="360" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Criteo</text>
    <text x="828" y="380" class="body" font-size="12" fill="#5A5A5A">impression affichée et clic, display et</text>
    <text x="828" y="398" class="body" font-size="12" fill="#5A5A5A">produits sponsorisés, ordinateur, web</text>
    <text x="828" y="416" class="body" font-size="12" fill="#5A5A5A">mobile et application</text>

    <text x="760" y="462" class="mono" font-size="11.5" fill="#B7332C">—</text>
    <text x="828" y="462" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Instacart</text>
    <text x="828" y="482" class="body" font-size="12" fill="#5A5A5A">périmètre plus large</text>

    <text x="760" y="528" class="mono" font-size="11.5" fill="#B7332C">2025</text>
    <text x="828" y="528" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Tiers de vérification</text>
    <text x="828" y="548" class="body" font-size="12" fill="#5A5A5A">intégration serveur-à-serveur des</text>
    <text x="828" y="566" class="body" font-size="12" fill="#5A5A5A">impressions, visibilité et trafic</text>
    <text x="828" y="584" class="body" font-size="12" fill="#5A5A5A">invalide du DSP d'Amazon</text>

    <line x1="760" y1="620" x2="1112" y2="620" stroke="#E5E1D8" stroke-width="1"/>
    <text x="760" y="650" class="display" font-size="16" font-style="italic" fill="#1A1A1A">Toutes portent sur le comptage</text>
    <text x="760" y="672" class="display" font-size="16" font-style="italic" fill="#1A1A1A">de la diffusion.</text>
    <text x="760" y="704" class="body" font-size="12.5" fill="#B7332C">Aucune n'atteste qu'un lift estime</text>
    <text x="760" y="722" class="body" font-size="12.5" fill="#B7332C">correctement un effet causal.</text>
  </g>

  <line x1="64" y1="836" x2="1136" y2="836" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="860" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Sources : communiqué Criteo du 28 mars 2024 sur le périmètre de son accréditation MRC ; IAB &amp; Media Rating Council, Retail Media Measurement Guidelines, janvier 2024.</text>
</svg>
