<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Matrice des ressources de la mesure publicitaire par acteur, et périmètre du droit d'accès ouvert par l'article 6 paragraphe 8 du règlement sur les marchés numériques">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="900" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Qui détient quoi</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Les six ressources dont dépend une mesure causale, et le seul levier juridique qui en ouvre une partie</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- bande distributeur mise en évidence -->
  <rect x="515" y="190" width="190" height="470" fill="#B7332C" opacity="0.055"/>

  <!-- lignes de séparation -->
  <line x1="64" y1="333" x2="1125" y2="333" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="64" y1="399" x2="1125" y2="399" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="64" y1="465" x2="1125" y2="465" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="64" y1="531" x2="1125" y2="531" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="64" y1="597" x2="1125" y2="597" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="64" y1="266" x2="1125" y2="266" stroke="#1A1A1A" stroke-width="1"/>

  <!-- libellés de lignes -->
  <text x="64" y="306" class="body" font-size="13.5" fill="#1A1A1A">Inventaire publicitaire</text>
  <text x="64" y="372" class="body" font-size="13.5" fill="#1A1A1A">Identité de l'utilisateur exposé</text>
  <text x="64" y="438" class="body" font-size="13.5" font-weight="600" fill="#B7332C">Contrefactuel exécutable</text>
  <text x="64" y="504" class="body" font-size="13.5" fill="#1A1A1A">Donnée de vente</text>
  <text x="64" y="570" class="body" font-size="13.5" fill="#1A1A1A">Choix du modèle de mesure</text>
  <text x="64" y="636" class="body" font-size="13.5" fill="#1A1A1A">Droit d'audit sur le résultat</text>

  <!-- ============ COLONNE PLATEFORME ============ -->
  <g class="interactive" data-card="col-plateforme" tabindex="0" role="button" aria-label="Colonne plateforme désignée contrôleur d'accès — cliquez pour les détails">
    <rect x="305" y="190" width="190" height="470" fill="transparent"/>
    <text x="400" y="216" class="display" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">Plateforme</text>
    <text x="400" y="238" class="mono" font-size="10.5" letter-spacing="0.05em" fill="#1F5560" text-anchor="middle">CONTRÔLEUR D'ACCÈS</text>
    <circle cx="400" cy="300" r="13" fill="#1A1A1A"/>
    <circle cx="400" cy="366" r="13" fill="#1A1A1A"/>
    <circle cx="400" cy="432" r="13" fill="#1A1A1A"/>
    <circle cx="400" cy="498" r="13" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="400" cy="564" r="13" fill="#1A1A1A"/>
    <circle cx="400" cy="630" r="13" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  </g>

  <!-- ============ COLONNE DISTRIBUTEUR ============ -->
  <g class="interactive" data-card="col-distributeur" tabindex="0" role="button" aria-label="Colonne régie de distributeur — cliquez pour les détails">
    <rect x="515" y="190" width="190" height="470" fill="transparent"/>
    <text x="610" y="216" class="display" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">Régie de</text>
    <text x="610" y="236" class="display" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">distributeur</text>
    <text x="610" y="256" class="mono" font-size="10.5" letter-spacing="0.05em" fill="#B7332C" text-anchor="middle">JUGE ET PARTIE</text>
    <circle cx="610" cy="300" r="13" fill="#B7332C"/>
    <circle cx="610" cy="366" r="13" fill="#B7332C"/>
    <circle cx="610" cy="432" r="13" fill="#B7332C"/>
    <circle cx="610" cy="498" r="13" fill="#B7332C"/>
    <circle cx="610" cy="564" r="13" fill="#B7332C"/>
    <circle cx="610" cy="630" r="13" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  </g>

  <!-- ============ COLONNE ANNONCEUR ============ -->
  <g class="interactive" data-card="col-annonceur" tabindex="0" role="button" aria-label="Colonne annonceur — cliquez pour les détails">
    <rect x="725" y="190" width="190" height="470" fill="transparent"/>
    <text x="820" y="216" class="display" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">Annonceur</text>
    <text x="820" y="238" class="mono" font-size="10.5" letter-spacing="0.05em" fill="#5A5A5A" text-anchor="middle">L'ACHETEUR</text>
    <circle cx="820" cy="300" r="13" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="820" cy="366" r="13" fill="none" stroke="#1A1A1A" stroke-width="1.25"/>
    <path d="M 820 353 A 13 13 0 0 0 820 379 Z" fill="#1A1A1A"/>
    <circle cx="820" cy="432" r="13" fill="none" stroke="#1A1A1A" stroke-width="1.25"/>
    <path d="M 820 419 A 13 13 0 0 0 820 445 Z" fill="#1A1A1A"/>
    <circle cx="820" cy="498" r="13" fill="#1A1A1A"/>
    <circle cx="820" cy="564" r="13" fill="none" stroke="#1A1A1A" stroke-width="1.25"/>
    <path d="M 820 551 A 13 13 0 0 0 820 577 Z" fill="#1A1A1A"/>
    <circle cx="820" cy="630" r="13" fill="none" stroke="#1A1A1A" stroke-width="1.25"/>
    <path d="M 820 617 A 13 13 0 0 0 820 643 Z" fill="#1A1A1A"/>
  </g>

  <!-- ============ COLONNE TIERS ACCRÉDITÉ ============ -->
  <g class="interactive" data-card="col-tiers" tabindex="0" role="button" aria-label="Colonne tiers accrédité — cliquez pour les détails">
    <rect x="935" y="190" width="190" height="470" fill="transparent"/>
    <text x="1030" y="216" class="display" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">Tiers accrédité</text>
    <text x="1030" y="238" class="mono" font-size="10.5" letter-spacing="0.05em" fill="#5A5A5A" text-anchor="middle">L'AUDITEUR</text>
    <circle cx="1030" cy="300" r="13" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="1030" cy="366" r="13" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="1030" cy="432" r="13" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="1030" cy="498" r="13" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="1030" cy="564" r="13" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="1030" cy="630" r="13" fill="none" stroke="#1A1A1A" stroke-width="1.25"/>
    <path d="M 1030 617 A 13 13 0 0 0 1030 643 Z" fill="#1A1A1A"/>
  </g>

  <!-- légende symboles -->
  <circle cx="72" cy="686" r="9" fill="#1A1A1A"/>
  <text x="88" y="691" class="body" font-size="11.5" fill="#5A5A5A">détient</text>
  <circle cx="180" cy="686" r="9" fill="none" stroke="#1A1A1A" stroke-width="1.25"/>
  <path d="M 180 677 A 9 9 0 0 0 180 695 Z" fill="#1A1A1A"/>
  <text x="196" y="691" class="body" font-size="11.5" fill="#5A5A5A">détient partiellement</text>
  <circle cx="366" cy="686" r="9" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  <text x="382" y="691" class="body" font-size="11.5" fill="#5A5A5A">ne détient pas</text>

  <!-- ============ LEVIER DMA ============ -->
  <g class="interactive" data-card="levier-dma" tabindex="0" role="button" aria-label="Le levier de l'article 6 paragraphe 8 du règlement sur les marchés numériques — cliquez pour les détails">
    <rect x="64" y="716" width="1061" height="120" rx="3" fill="#1F5560" opacity="0.07"/>
    <rect x="64" y="716" width="1061" height="120" rx="3" fill="none" stroke="#1F5560" stroke-width="1.5"/>
    <text x="88" y="748" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">LE SEUL LEVIER EXIGIBLE SANS NÉGOCIATION</text>
    <text x="88" y="778" class="body" font-size="13.5" fill="#1A1A1A">Article 6(8) du règlement sur les marchés numériques : accès gratuit, sur demande, aux outils de mesure de performance et aux</text>
    <text x="88" y="798" class="body" font-size="13.5" fill="#1A1A1A">données nécessaires à une vérification indépendante de l'inventaire, agrégées comme non agrégées, en forme lisible par machine.</text>
    <text x="88" y="822" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Il ne vise que les contrôleurs d'accès désignés. La colonne « régie de distributeur » reste hors de son atteinte : là, tout se joue au contrat.</text>
  </g>

  <line x1="64" y1="858" x2="1136" y2="858" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="882" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Sources : règlement (UE) 2022/1925, article 6, paragraphe 8 ; ISBA &amp; PwC, Programmatic Supply Chain Transparency Study II, janvier 2023. Répartition des ressources : analyse de l'auteur.</text>
</svg>
