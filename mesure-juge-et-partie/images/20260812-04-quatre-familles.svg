<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Les quatre familles de méthodes d'incrémentalité du guide IAB de novembre 2025, lues par qui peut les exécuter et par leur falsifiabilité">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Les quatre familles, lues par leur falsifiabilité</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le guide IAB de novembre 2025 classe les méthodes ; il n'ouvre aucun droit de vérification</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- row rules -->
  <line x1="64" y1="264" x2="1136" y2="264" stroke="#E5E1D8" stroke-width="1"/>
  <line x1="64" y1="404" x2="1136" y2="404" stroke="#E5E1D8" stroke-width="1"/>
  <line x1="64" y1="562" x2="1136" y2="562" stroke="#E5E1D8" stroke-width="1"/>
  <line x1="64" y1="726" x2="1136" y2="726" stroke="#E5E1D8" stroke-width="1"/>

  <!-- row labels -->
  <text x="64" y="292" class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A">QUI PEUT</text>
  <text x="64" y="308" class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A">L'EXÉCUTER</text>
  <text x="64" y="432" class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A">CE QU'ELLE</text>
  <text x="64" y="448" class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A">EXIGE</text>
  <text x="64" y="590" class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A">CE QUE</text>
  <text x="64" y="606" class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A">L'ANNONCEUR</text>
  <text x="64" y="622" class="mono" font-size="11" letter-spacing="0.08em" fill="#5A5A5A">PEUT RÉFUTER</text>
  <text x="64" y="754" class="mono" font-size="11" letter-spacing="0.08em" fill="#1A1A1A">FALSIFIABILITÉ</text>

  <!-- ============ FAMILLE 1 — EXPÉRIENCES ============ -->
  <g class="interactive" data-card="famille-experiences" tabindex="0" role="button" aria-label="Famille expériences randomisées — cliquez pour les détails">
    <rect x="226" y="180" width="220" height="600" rx="3" fill="#B7332C" opacity="0.06"/>
    <rect x="226" y="180" width="220" height="600" rx="3" fill="none" stroke="#B7332C" stroke-width="1.5"/>
    <text x="242" y="208" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">FAMILLE A</text>
    <text x="242" y="238" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Expériences</text>
    <text x="242" y="256" class="body" font-size="11.5" fill="#5A5A5A">randomisées</text>

    <text x="242" y="292" class="body" font-size="12" fill="#1A1A1A">La régie, pour les publicités</text>
    <text x="242" y="310" class="body" font-size="12" fill="#1A1A1A">fantômes et le placebo.</text>
    <text x="242" y="336" class="body" font-size="12" font-weight="600" fill="#B7332C">L'annonceur, pour le test</text>
    <text x="242" y="354" class="body" font-size="12" font-weight="600" fill="#B7332C">géographique.</text>

    <text x="242" y="432" class="body" font-size="12" fill="#1A1A1A">Une randomisation décidée</text>
    <text x="242" y="450" class="body" font-size="12" fill="#1A1A1A">avant la campagne.</text>
    <text x="242" y="476" class="body" font-size="12" fill="#1A1A1A">Une taille d'échantillon</text>
    <text x="242" y="494" class="body" font-size="12" fill="#1A1A1A">calculée, pas constatée.</text>
    <text x="242" y="520" class="body" font-size="12" fill="#1A1A1A">Du budget délibérément</text>
    <text x="242" y="538" class="body" font-size="12" fill="#1A1A1A">sacrifié.</text>

    <text x="242" y="590" class="body" font-size="12" fill="#1A1A1A">Le protocole, l'assignation</text>
    <text x="242" y="608" class="body" font-size="12" fill="#1A1A1A">et la puissance statistique,</text>
    <text x="242" y="626" class="body" font-size="12" fill="#1A1A1A">si la régie les communique.</text>
    <text x="242" y="656" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Intégralement, quand</text>
    <text x="242" y="674" class="body" font-size="12" font-style="italic" fill="#5A5A5A">l'annonceur exécute lui-même.</text>

    <rect x="242" y="740" width="110" height="26" rx="3" fill="#B7332C"/>
    <text x="297" y="758" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">FORTE</text>
  </g>

  <!-- ============ FAMILLE 2 — CONTREFACTUELS MODÉLISÉS ============ -->
  <g class="interactive" data-card="famille-contrefactuels" tabindex="0" role="button" aria-label="Famille contrefactuels construits par modèle — cliquez pour les détails">
    <rect x="454" y="180" width="220" height="600" rx="3" fill="#F2EFE7" opacity="0.55" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="470" y="208" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">FAMILLE B</text>
    <text x="470" y="238" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Contrefactuels</text>
    <text x="470" y="256" class="body" font-size="11.5" fill="#5A5A5A">construits par modèle</text>

    <text x="470" y="292" class="body" font-size="12" fill="#1A1A1A">La régie seule. Elle est la</text>
    <text x="470" y="310" class="body" font-size="12" fill="#1A1A1A">seule à détenir la donnée</text>
    <text x="470" y="328" class="body" font-size="12" fill="#1A1A1A">d'exposition individuelle.</text>

    <text x="470" y="432" class="body" font-size="12" fill="#1A1A1A">Un modèle de sélection</text>
    <text x="470" y="450" class="body" font-size="12" fill="#1A1A1A">explicite, qui prétend</text>
    <text x="470" y="468" class="body" font-size="12" fill="#1A1A1A">« défaire » le ciblage.</text>
    <text x="470" y="500" class="body" font-size="12" font-style="italic" fill="#B7332C">C'est exactement ce que</text>
    <text x="470" y="518" class="body" font-size="12" font-style="italic" fill="#B7332C">663 expériences ont montré</text>
    <text x="470" y="536" class="body" font-size="12" font-style="italic" fill="#B7332C">infaisable de façon fiable.</text>

    <text x="470" y="590" class="body" font-size="12" fill="#1A1A1A">Rien, si le modèle n'est</text>
    <text x="470" y="608" class="body" font-size="12" fill="#1A1A1A">pas publié.</text>
    <text x="470" y="640" class="body" font-size="12" fill="#5A5A5A">Le chiffre livré a alors le</text>
    <text x="470" y="658" class="body" font-size="12" fill="#5A5A5A">statut d'une opinion de</text>
    <text x="470" y="676" class="body" font-size="12" fill="#5A5A5A">partie intéressée.</text>

    <rect x="470" y="740" width="110" height="26" rx="3" fill="#B8B5AE"/>
    <text x="525" y="758" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">FAIBLE</text>
  </g>

  <!-- ============ FAMILLE 3 — ÉCONOMÉTRIE ============ -->
  <g class="interactive" data-card="famille-econometrie" tabindex="0" role="button" aria-label="Famille modèles économétriques et mix marketing — cliquez pour les détails">
    <rect x="682" y="180" width="220" height="600" rx="3" fill="#1F5560" opacity="0.06"/>
    <rect x="682" y="180" width="220" height="600" rx="3" fill="none" stroke="#1F5560" stroke-width="1.25"/>
    <text x="698" y="208" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">FAMILLE C</text>
    <text x="698" y="238" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Modèles</text>
    <text x="698" y="256" class="body" font-size="11.5" fill="#5A5A5A">économétriques de mix</text>

    <text x="698" y="292" class="body" font-size="12" font-weight="600" fill="#1F5560">L'annonceur, avec sa</text>
    <text x="698" y="310" class="body" font-size="12" font-weight="600" fill="#1F5560">propre donnée agrégée.</text>
    <text x="698" y="340" class="body" font-size="12" fill="#5A5A5A">Aucune donnée individuelle</text>
    <text x="698" y="358" class="body" font-size="12" fill="#5A5A5A">n'est requise.</text>

    <text x="698" y="432" class="body" font-size="12" fill="#1A1A1A">Un historique long et de la</text>
    <text x="698" y="450" class="body" font-size="12" fill="#1A1A1A">variation d'investissement.</text>
    <text x="698" y="476" class="body" font-size="12" fill="#1A1A1A">Des a priori sur le retour</text>
    <text x="698" y="494" class="body" font-size="12" fill="#1A1A1A">par canal, dont l'origine</text>
    <text x="698" y="512" class="body" font-size="12" fill="#1A1A1A">décide de la conclusion</text>
    <text x="698" y="530" class="body" font-size="12" fill="#1A1A1A">quand la donnée est pauvre.</text>

    <text x="698" y="590" class="body" font-size="12" fill="#1A1A1A">Tout, à une condition :</text>
    <text x="698" y="608" class="body" font-size="12" fill="#1A1A1A">que la provenance de</text>
    <text x="698" y="626" class="body" font-size="12" fill="#1A1A1A">chaque a priori soit tracée.</text>
    <text x="698" y="658" class="body" font-size="12" font-style="italic" fill="#B7332C">Calibré avec les lifts du</text>
    <text x="698" y="676" class="body" font-size="12" font-style="italic" fill="#B7332C">vendeur, il blanchit son</text>
    <text x="698" y="694" class="body" font-size="12" font-style="italic" fill="#B7332C">chiffre au lieu de le tester.</text>

    <rect x="698" y="740" width="130" height="26" rx="3" fill="#1F5560"/>
    <text x="763" y="758" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">CONDITIONNELLE</text>
  </g>

  <!-- ============ FAMILLE 4 — PROXYS HYBRIDES ============ -->
  <g class="interactive" data-card="famille-proxys" tabindex="0" role="button" aria-label="Famille proxys hybrides — cliquez pour les détails">
    <rect x="910" y="180" width="220" height="600" rx="3" fill="#F2EFE7" opacity="0.55" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="926" y="208" class="mono" font-size="11" letter-spacing="0.09em" fill="#B58A2C">FAMILLE D</text>
    <text x="926" y="238" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Proxys</text>
    <text x="926" y="256" class="body" font-size="11.5" fill="#5A5A5A">hybrides</text>

    <text x="926" y="292" class="body" font-size="12" fill="#1A1A1A">La régie, ou un tiers</text>
    <text x="926" y="310" class="body" font-size="12" fill="#1A1A1A">disposant d'un panel ou</text>
    <text x="926" y="328" class="body" font-size="12" fill="#1A1A1A">d'un signal de substitution.</text>

    <text x="926" y="432" class="body" font-size="12" fill="#1A1A1A">Une hypothèse de</text>
    <text x="926" y="450" class="body" font-size="12" fill="#1A1A1A">correspondance entre le</text>
    <text x="926" y="468" class="body" font-size="12" fill="#1A1A1A">signal proxy et la vente.</text>
    <text x="926" y="500" class="body" font-size="12" fill="#5A5A5A">Cette hypothèse est le</text>
    <text x="926" y="518" class="body" font-size="12" fill="#5A5A5A">point faible, et elle est</text>
    <text x="926" y="536" class="body" font-size="12" fill="#5A5A5A">rarement écrite.</text>

    <text x="926" y="590" class="body" font-size="12" fill="#1A1A1A">La correspondance, mais</text>
    <text x="926" y="608" class="body" font-size="12" fill="#1A1A1A">seulement contre une</text>
    <text x="926" y="626" class="body" font-size="12" fill="#1A1A1A">expérience de référence.</text>
    <text x="926" y="658" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sans test de calibration,</text>
    <text x="926" y="676" class="body" font-size="12" font-style="italic" fill="#5A5A5A">le proxy n'est vérifiable</text>
    <text x="926" y="694" class="body" font-size="12" font-style="italic" fill="#5A5A5A">par personne.</text>

    <rect x="926" y="740" width="110" height="26" rx="3" fill="#B58A2C"/>
    <text x="981" y="758" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">MOYENNE</text>
  </g>

  <line x1="64" y1="822" x2="1136" y2="822" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="848" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Familles d'après IAB &amp; IAB Europe, Guidelines for Incremental Measurement in Commerce Media, novembre 2025. Colonnes « qui peut l'exécuter » et « falsifiabilité » : analyse de l'auteur.</text>
</svg>
