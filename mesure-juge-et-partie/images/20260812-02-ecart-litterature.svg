<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Quatre travaux académiques mesurant l'écart entre estimation observationnelle et estimation expérimentale de l'effet publicitaire">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce que la littérature a déjà tranché</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre travaux, un même résultat : la mesure corrélationnelle surestime, et d'un facteur imprévisible</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ============ CARTE 1 — eBay ============ -->
  <g class="interactive" data-card="etude-ebay" tabindex="0" role="button" aria-label="Étude eBay, Blake Nosko et Tadelis 2015 — cliquez pour les détails">
    <rect x="64" y="192" width="253" height="580" rx="3" fill="#F2EFE7" opacity="0.55" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="80" y="224" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">ECONOMETRICA · 2015</text>
    <text x="80" y="256" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le cas eBay</text>
    <text x="80" y="280" class="body" font-size="11.5" fill="#5A5A5A">Blake, Nosko &amp; Tadelis</text>
    <text x="80" y="298" class="body" font-size="11.5" fill="#5A5A5A">Liens sponsorisés coupés par zone</text>
    <line x1="80" y1="318" x2="301" y2="318" stroke="#E5E1D8" stroke-width="1"/>

    <text x="80" y="382" class="mono" font-size="44" font-weight="500" fill="#B7332C">99,5 %</text>
    <text x="80" y="408" class="body" font-size="12" fill="#1A1A1A">du trafic attribué au SEM de marque</text>
    <text x="80" y="426" class="body" font-size="12" fill="#1A1A1A">arrivait de toute façon</text>

    <rect x="80" y="470" width="221" height="26" fill="#B8B5AE" opacity="0.55"/>
    <rect x="298" y="470" width="3" height="26" fill="#B7332C"/>
    <line x1="299" y1="512" x2="299" y2="500" stroke="#B7332C" stroke-width="0.75" marker-end="url(#arw2)"/>
    <text x="301" y="530" class="mono" font-size="10.5" fill="#B7332C" text-anchor="end">effet réel</text>
    <text x="80" y="530" class="mono" font-size="10.5" fill="#5A5A5A">trafic qui serait venu sans annonce</text>

    <line x1="80" y1="566" x2="301" y2="566" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="592" class="body" font-size="12" font-style="italic" fill="#5A5A5A">L'effet existe sur les mots-clés</text>
    <text x="80" y="610" class="body" font-size="12" font-style="italic" fill="#5A5A5A">génériques, et il est concentré sur</text>
    <text x="80" y="628" class="body" font-size="12" font-style="italic" fill="#5A5A5A">les nouveaux inscrits et les</text>
    <text x="80" y="646" class="body" font-size="12" font-style="italic" fill="#5A5A5A">acheteurs occasionnels.</text>
    <text x="80" y="682" class="body" font-size="12" fill="#1A1A1A">Le système de mesure le créditait</text>
    <text x="80" y="700" class="body" font-size="12" fill="#1A1A1A">sur la totalité de l'audience.</text>
  </g>

  <!-- ============ CARTE 2 — Facebook 2019 ============ -->
  <g class="interactive" data-card="etude-facebook-2019" tabindex="0" role="button" aria-label="Étude Facebook 2019, Gordon Zettelmeyer Bhargava et Chapsky — cliquez pour les détails">
    <rect x="337" y="192" width="253" height="580" rx="3" fill="#F2EFE7" opacity="0.55" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="353" y="224" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">MARKETING SCIENCE · 2019</text>
    <text x="353" y="256" class="display" font-size="20" font-weight="600" fill="#1A1A1A">L'écart à la source</text>
    <text x="353" y="280" class="body" font-size="11.5" fill="#5A5A5A">Gordon, Zettelmeyer,</text>
    <text x="353" y="298" class="body" font-size="11.5" fill="#5A5A5A">Bhargava &amp; Chapsky</text>
    <line x1="353" y1="318" x2="574" y2="318" stroke="#E5E1D8" stroke-width="1"/>

    <text x="353" y="382" class="mono" font-size="44" font-weight="500" fill="#B7332C">× 3</text>
    <text x="353" y="408" class="body" font-size="12" fill="#1A1A1A">d'écart sur l'augmentation d'achats,</text>
    <text x="353" y="426" class="body" font-size="12" fill="#1A1A1A">dans la moitié des quinze études</text>

    <rect x="366" y="452" width="46" height="90" fill="#B8B5AE" opacity="0.6"/>
    <rect x="366" y="512" width="46" height="30" fill="#B7332C"/>
    <line x1="353" y1="542" x2="500" y2="542" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="422" y="474" class="mono" font-size="10.5" fill="#5A5A5A">estimation</text>
    <text x="422" y="488" class="mono" font-size="10.5" fill="#5A5A5A">observationnelle</text>
    <text x="422" y="528" class="mono" font-size="10.5" fill="#B7332C">effet mesuré</text>
    <text x="422" y="542" class="mono" font-size="10.5" fill="#B7332C">par l'expérience</text>

    <line x1="353" y1="566" x2="574" y2="566" stroke="#E5E1D8" stroke-width="1"/>
    <text x="353" y="592" class="body" font-size="12" font-style="italic" fill="#5A5A5A">500 millions d'observations</text>
    <text x="353" y="610" class="body" font-size="12" font-style="italic" fill="#5A5A5A">utilisateur-expérience,</text>
    <text x="353" y="628" class="body" font-size="12" font-style="italic" fill="#5A5A5A">1,6 milliard d'impressions.</text>
    <text x="353" y="664" class="body" font-size="12" fill="#1A1A1A">Le conditionnement sur des</text>
    <text x="353" y="682" class="body" font-size="12" fill="#1A1A1A">variables démographiques et</text>
    <text x="353" y="700" class="body" font-size="12" fill="#1A1A1A">comportementales riches</text>
    <text x="353" y="718" class="body" font-size="12" fill="#1A1A1A">ne suffit pas à refermer l'écart.</text>
  </g>

  <!-- ============ CARTE 3 — Close Enough ============ -->
  <g class="interactive" data-card="etude-close-enough" tabindex="0" role="button" aria-label="Étude Close Enough 2023, 663 expériences — cliquez pour les détails">
    <rect x="610" y="192" width="253" height="580" rx="3" fill="#F2EFE7" opacity="0.55" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="626" y="224" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">MARKETING SCIENCE · 2023</text>
    <text x="626" y="256" class="display" font-size="20" font-weight="600" fill="#1A1A1A">La réplication</text>
    <text x="626" y="280" class="body" font-size="11.5" fill="#5A5A5A">Gordon, Moakler</text>
    <text x="626" y="298" class="body" font-size="11.5" fill="#5A5A5A">&amp; Zettelmeyer</text>
    <line x1="626" y1="318" x2="847" y2="318" stroke="#E5E1D8" stroke-width="1"/>

    <text x="626" y="382" class="mono" font-size="44" font-weight="500" fill="#B7332C">663</text>
    <text x="626" y="408" class="body" font-size="12" fill="#1A1A1A">expériences de grande échelle,</text>
    <text x="626" y="426" class="body" font-size="12" fill="#1A1A1A">avec la donnée de la plateforme</text>

    <circle cx="700" cy="500" r="42" fill="none" stroke="#B8B5AE" stroke-width="0.75"/>
    <circle cx="700" cy="500" r="26" fill="none" stroke="#B8B5AE" stroke-width="0.75"/>
    <circle cx="700" cy="500" r="10" fill="none" stroke="#B7332C" stroke-width="1.25"/>
    <circle cx="700" cy="500" r="2.5" fill="#B7332C"/>
    <circle cx="668" cy="474" r="3.5" fill="#5A5A5A"/>
    <circle cx="731" cy="519" r="3.5" fill="#5A5A5A"/>
    <circle cx="683" cy="533" r="3.5" fill="#5A5A5A"/>
    <circle cx="726" cy="470" r="3.5" fill="#5A5A5A"/>
    <circle cx="742" cy="492" r="3.5" fill="#5A5A5A"/>
    <text x="756" y="490" class="mono" font-size="10.5" fill="#5A5A5A">estimations</text>
    <text x="756" y="504" class="mono" font-size="10.5" fill="#5A5A5A">non</text>
    <text x="756" y="518" class="mono" font-size="10.5" fill="#5A5A5A">expérimentales</text>
    <text x="626" y="562" class="mono" font-size="10.5" fill="#B7332C">cible = effet causal vrai</text>

    <line x1="626" y1="580" x2="847" y2="580" stroke="#E5E1D8" stroke-width="1"/>
    <text x="626" y="606" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Les systèmes de diffusion</text>
    <text x="626" y="624" class="body" font-size="12" font-style="italic" fill="#5A5A5A">optimisent l'exposition en temps</text>
    <text x="626" y="642" class="body" font-size="12" font-style="italic" fill="#5A5A5A">réel vers les convertisseurs.</text>
    <text x="626" y="678" class="body" font-size="12" fill="#1A1A1A">Cette sélection est trop complexe</text>
    <text x="626" y="696" class="body" font-size="12" fill="#1A1A1A">et trop mouvante pour être</text>
    <text x="626" y="714" class="body" font-size="12" fill="#1A1A1A">« défaite » a posteriori.</text>
  </g>

  <!-- ============ CARTE 4 — Lewis & Rao ============ -->
  <g class="interactive" data-card="borne-lewis-rao" tabindex="0" role="button" aria-label="Lewis et Rao 2015, la borne haute de ce qu'on peut savoir — cliquez pour les détails">
    <rect x="883" y="192" width="253" height="580" rx="3" fill="#B7332C" opacity="0.06"/>
    <rect x="883" y="192" width="253" height="580" rx="3" fill="none" stroke="#B7332C" stroke-width="1.5"/>
    <text x="899" y="224" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">QJE · 2015</text>
    <text x="899" y="256" class="display" font-size="20" font-weight="600" fill="#1A1A1A">La borne haute</text>
    <text x="899" y="280" class="body" font-size="11.5" fill="#5A5A5A">Lewis &amp; Rao</text>
    <text x="899" y="298" class="body" font-size="11.5" fill="#5A5A5A">25 expériences de terrain</text>
    <line x1="899" y1="318" x2="1120" y2="318" stroke="#E5E1D8" stroke-width="1"/>

    <text x="899" y="382" class="mono" font-size="40" font-weight="500" fill="#B7332C">&gt; 100</text>
    <text x="899" y="408" class="body" font-size="12" fill="#1A1A1A">points de pourcentage : la largeur</text>
    <text x="899" y="426" class="body" font-size="12" fill="#1A1A1A">médiane de l'intervalle sur le ROI</text>

    <line x1="912" y1="490" x2="1108" y2="490" stroke="#B7332C" stroke-width="2.5"/>
    <line x1="912" y1="478" x2="912" y2="502" stroke="#B7332C" stroke-width="2.5"/>
    <line x1="1108" y1="478" x2="1108" y2="502" stroke="#B7332C" stroke-width="2.5"/>
    <line x1="1010" y1="466" x2="1010" y2="514" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="1010" y="458" class="mono" font-size="10.5" fill="#1A1A1A" text-anchor="middle">ROI = 0</text>
    <text x="899" y="534" class="mono" font-size="10.5" fill="#5A5A5A">intervalle de confiance médian</text>

    <line x1="899" y1="566" x2="1120" y2="566" stroke="#E5E1D8" stroke-width="1"/>
    <text x="899" y="592" class="body" font-size="12" font-style="italic" fill="#5A5A5A">2,8 M$ d'investissement testé.</text>
    <text x="899" y="610" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Une expérience informative exige</text>
    <text x="899" y="628" class="body" font-size="12" font-style="italic" fill="#5A5A5A">souvent plus de dix millions</text>
    <text x="899" y="646" class="body" font-size="12" font-style="italic" fill="#5A5A5A">de personnes-semaines.</text>
    <text x="899" y="682" class="body" font-size="12" fill="#1A1A1A">L'avertissement vaut dans les</text>
    <text x="899" y="700" class="body" font-size="12" fill="#1A1A1A">deux sens : il disqualifie aussi</text>
    <text x="899" y="718" class="body" font-size="12" fill="#1A1A1A">le test qu'on sous-dimensionne</text>
    <text x="899" y="736" class="body" font-size="12" fill="#1A1A1A">pour se rassurer.</text>
  </g>

  <line x1="64" y1="820" x2="1136" y2="820" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="846" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Sources : Blake, Nosko &amp; Tadelis, Econometrica 83(1), 2015 ; Gordon, Zettelmeyer, Bhargava &amp; Chapsky, Marketing Science 38(2), 2019 ; Gordon, Moakler &amp; Zettelmeyer, Marketing Science 42(4), 2023 ; Lewis &amp; Rao, QJE 130(4), 2015.</text>
</svg>
