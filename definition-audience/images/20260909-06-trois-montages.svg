<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Trois montages de propriété de la définition d'audience et ce que chacun coûte">
<style>
  .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
  .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
  .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  .interactive { cursor: pointer; }
  .interactive:hover rect.hit { fill-opacity: .10; }
</style>
<rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

<!-- Header -->
<text x="60" y="42" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 06</text>
<text x="60" y="74" class="display" font-size="28" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">Trois montages, trois factures</text>
<text x="60" y="100" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce qui les distingue : ce que chacun rend vérifiable, et ce qu'il coûte de partir.</text>
<line x1="60" y1="118" x2="1140" y2="118" stroke="#E5E1D8" stroke-width="1"/>

<text x="60" y="150" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#5A5A5A">OÙ LE PRÉDICAT EST ÉCRIT</text>

<!-- ===== Montage A ===== -->
<g class="interactive" data-card="montage-console" tabindex="0" role="button" aria-label="Montage A, la définition reste dans la console — cliquez pour les détails">
  <rect class="hit" x="60" y="166" width="346" height="494" rx="3" fill="#B7332C" fill-opacity="0.05" stroke="#B7332C" stroke-width="1.25"/>
  <rect x="84" y="186" width="120" height="24" rx="12" fill="#B7332C"/>
  <text x="144" y="203" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">MONTAGE A</text>
  <text x="84" y="240" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Dans la console</text>
  <text x="84" y="262" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Le segment est composé dans</text>
  <text x="84" y="278" class="body" font-size="11" font-style="italic" fill="#5A5A5A">l'interface d'activation.</text>
  <line x1="84" y1="294" x2="382" y2="294" stroke="#E5E1D8" stroke-width="0.5"/>

  <text x="84" y="318" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B7332C">QUI ÉCRIT</text>
  <text x="84" y="338" class="body" font-size="12" fill="#1A1A1A">Le marketing opérationnel, sans</text>
  <text x="84" y="354" class="body" font-size="12" fill="#1A1A1A">passer par la data.</text>

  <text x="84" y="384" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B7332C">CE QUI EST VERSIONNÉ</text>
  <text x="84" y="404" class="body" font-size="12" fill="#1A1A1A">Ce que l'outil veut bien versionner :</text>
  <text x="84" y="420" class="body" font-size="12" fill="#1A1A1A">l'état courant, un journal d'accès.</text>

  <text x="84" y="450" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B7332C">CE QUI SURVIT AU DÉPART</text>
  <text x="84" y="470" class="body" font-size="12" fill="#1A1A1A">La liste des membres, à la date de</text>
  <text x="84" y="486" class="body" font-size="12" fill="#1A1A1A">l'export. Pas la règle.</text>

  <text x="84" y="516" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B7332C">CE QUE ÇA COÛTE</text>
  <text x="84" y="536" class="body" font-size="12" fill="#1A1A1A">Peu à l'entrée. Une facture de sortie</text>
  <text x="84" y="552" class="body" font-size="12" fill="#1A1A1A">dont le poste principal est la</text>
  <text x="84" y="568" class="body" font-size="12" fill="#1A1A1A">ré-écriture de toutes les définitions.</text>

  <text x="84" y="598" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B7332C">QUAND C'EST LE BON CHOIX</text>
  <text x="84" y="618" class="body" font-size="12" fill="#1A1A1A">Moins d'une dizaine d'audiences,</text>
  <text x="84" y="634" class="body" font-size="12" fill="#1A1A1A">une seule destination, pas</text>
  <text x="84" y="650" class="body" font-size="12" fill="#1A1A1A">d'exigence de reconstitution.</text>
</g>

<!-- ===== Montage B ===== -->
<g class="interactive" data-card="montage-entrepot" tabindex="0" role="button" aria-label="Montage B, la définition vit dans l'entrepôt — cliquez pour les détails">
  <rect class="hit" x="427" y="166" width="346" height="494" rx="3" fill="#B58A2C" fill-opacity="0.06" stroke="#B58A2C" stroke-width="1.25"/>
  <rect x="451" y="186" width="120" height="24" rx="12" fill="#B58A2C"/>
  <text x="511" y="203" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">MONTAGE B</text>
  <text x="451" y="240" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Dans l'entrepôt</text>
  <text x="451" y="262" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Modèle versionné, matérialisé en</text>
  <text x="451" y="278" class="body" font-size="11" font-style="italic" fill="#5A5A5A">table, transmis comme une liste.</text>
  <line x1="451" y1="294" x2="749" y2="294" stroke="#E5E1D8" stroke-width="0.5"/>

  <text x="451" y="318" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B58A2C">QUI ÉCRIT</text>
  <text x="451" y="338" class="body" font-size="12" fill="#1A1A1A">L'équipe data, sur demande du</text>
  <text x="451" y="354" class="body" font-size="12" fill="#1A1A1A">marketing.</text>

  <text x="451" y="384" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B58A2C">CE QUI EST VERSIONNÉ</text>
  <text x="451" y="404" class="body" font-size="12" fill="#1A1A1A">Tout le prédicat, dans le même</text>
  <text x="451" y="420" class="body" font-size="12" fill="#1A1A1A">dépôt que le reste du patrimoine.</text>

  <text x="451" y="450" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B58A2C">CE QUI SURVIT AU DÉPART</text>
  <text x="451" y="470" class="body" font-size="12" fill="#1A1A1A">La définition complète, réutilisable</text>
  <text x="451" y="486" class="body" font-size="12" fill="#1A1A1A">sur une autre plateforme.</text>

  <text x="451" y="516" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B58A2C">CE QUE ÇA COÛTE</text>
  <text x="451" y="536" class="body" font-size="12" fill="#1A1A1A">Un aller-retour data ↔ marketing à</text>
  <text x="451" y="552" class="body" font-size="12" fill="#1A1A1A">chaque itération. Plus un coût de</text>
  <text x="451" y="568" class="body" font-size="12" fill="#1A1A1A">calcul, désormais visible.</text>

  <text x="451" y="598" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B7332C">L'ANGLE MORT</text>
  <text x="451" y="618" class="body" font-size="12" fill="#1A1A1A">Auditabilité gagnée côté data,</text>
  <text x="451" y="634" class="body" font-size="12" fill="#1A1A1A">rien côté aval : la plateforme reçoit</text>
  <text x="451" y="650" class="body" font-size="12" fill="#1A1A1A">toujours une table de membres.</text>
</g>

<!-- ===== Montage C ===== -->
<g class="interactive" data-card="montage-semantique" tabindex="0" role="button" aria-label="Montage C, la définition vit dans la couche sémantique — cliquez pour les détails">
  <rect class="hit" x="794" y="166" width="346" height="494" rx="3" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="2.5"/>
  <rect x="818" y="186" width="120" height="24" rx="12" fill="#1F5560"/>
  <text x="878" y="203" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">MONTAGE C</text>
  <text x="818" y="240" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Dans la couche sémantique</text>
  <text x="818" y="262" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Objet nommé à côté des mesures</text>
  <text x="818" y="278" class="body" font-size="11" font-style="italic" fill="#5A5A5A">et des dimensions, compilé.</text>
  <line x1="818" y1="294" x2="1116" y2="294" stroke="#E5E1D8" stroke-width="0.5"/>

  <text x="818" y="318" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#1F5560">QUI ÉCRIT</text>
  <text x="818" y="338" class="body" font-size="12" fill="#1A1A1A">Les deux, dans le même fichier,</text>
  <text x="818" y="354" class="body" font-size="12" fill="#1A1A1A">avec une revue.</text>

  <text x="818" y="384" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#1F5560">CE QUI EST VERSIONNÉ</text>
  <text x="818" y="404" class="body" font-size="12" fill="#1A1A1A">Le prédicat, la fenêtre, la règle</text>
  <text x="818" y="420" class="body" font-size="12" fill="#1A1A1A">d'identité et la finalité.</text>

  <text x="818" y="450" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#1F5560">CE QUI SURVIT AU DÉPART</text>
  <text x="818" y="470" class="body" font-size="12" fill="#1A1A1A">Tout, y compris la comparabilité</text>
  <text x="818" y="486" class="body" font-size="12" fill="#1A1A1A">entre deux exécutions.</text>

  <text x="818" y="516" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#1F5560">CE QUE ÇA COÛTE</text>
  <text x="818" y="536" class="body" font-size="12" fill="#1A1A1A">L'extension du format, puisque le</text>
  <text x="818" y="552" class="body" font-size="12" fill="#1A1A1A">standard ne fournit pas l'objet.</text>
  <text x="818" y="568" class="body" font-size="12" fill="#1A1A1A">Une convention à maintenir.</text>

  <text x="818" y="598" class="mono" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B7332C">LE RISQUE</text>
  <text x="818" y="618" class="body" font-size="12" fill="#1A1A1A">Construire seul une extension</text>
  <text x="818" y="634" class="body" font-size="12" fill="#1A1A1A">qu'une norme contredira. Rester</text>
  <text x="818" y="650" class="body" font-size="12" fill="#1A1A1A">près de la grammaire existante.</text>
</g>

<!-- Critère de tri -->
<g class="interactive" data-card="critere-verifiabilite" tabindex="0" role="button" aria-label="Le critère de tri — cliquez pour les détails">
  <rect class="hit" x="60" y="678" width="1080" height="62" rx="3" fill="#1A1A1A"/>
  <text x="84" y="704" class="body" font-size="13" font-weight="500" fill="#FAF8F3">Le critère de tri : combien de vos audiences alimentent un chiffre présenté à la direction ?</text>
  <text x="84" y="726" class="body" font-size="12" fill="#B8B5AE">Moins de dix : A tient. De dix à cinquante : B, en acceptant son angle mort. Au-delà, ou dès qu'un test d'incrémentalité annuel structure le plan média : C.</text>
</g>

<!-- Footer -->
<line x1="60" y1="758" x2="1140" y2="758" stroke="#E5E1D8" stroke-width="1"/>
<text x="60" y="780" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Grille de décision de l'auteur, construite sur les architectures documentées aux schémas 03 et 04. Les seuils sont des ordres de grandeur, à recalibrer sur le portefeuille réel.</text>
</svg>
