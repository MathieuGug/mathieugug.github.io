<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La normalisation sémantique 2025-2026 et l'objet qu'elle ne contient pas">
<style>
  .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
  .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
  .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  .interactive { cursor: pointer; }
  .interactive:hover rect.hit { fill-opacity: .12; }
</style>
<rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

<!-- Header -->
<text x="60" y="42" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 04</text>
<text x="60" y="74" class="display" font-size="28" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">La couche sémantique s'est arrêtée avant l'audience</text>
<text x="60" y="100" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Neuf mois pour normaliser ce qu'on compte. Rien pour normaliser qui on compte.</text>
<line x1="60" y1="118" x2="1140" y2="118" stroke="#E5E1D8" stroke-width="1"/>

<text x="60" y="150" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#5A5A5A">LA SÉQUENCE</text>

<!-- Cartes de jalons -->
<g class="interactive" data-card="jalon-osi" tabindex="0" role="button" aria-label="Initiative Open Semantic Interchange — cliquez pour les détails">
  <rect class="hit" x="87" y="166" width="186" height="128" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
  <text x="105" y="190" class="mono" font-size="11" font-weight="600" fill="#B7332C">23 SEPT. 2025</text>
  <text x="105" y="214" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Initiative de format</text>
  <text x="105" y="232" class="body" font-size="13" font-weight="500" fill="#1A1A1A">sémantique commun</text>
  <text x="105" y="258" class="body" font-size="11" fill="#5A5A5A">Snowflake, Salesforce,</text>
  <text x="105" y="274" class="body" font-size="11" fill="#5A5A5A">dbt Labs, BlackRock.</text>
</g>

<g class="interactive" data-card="jalon-metricflow" tabindex="0" role="button" aria-label="MetricFlow ouvert sous Apache 2.0 — cliquez pour les détails">
  <rect class="hit" x="297" y="166" width="186" height="128" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
  <text x="315" y="190" class="mono" font-size="11" font-weight="600" fill="#B7332C">14 OCT. 2025</text>
  <text x="315" y="214" class="body" font-size="13" font-weight="500" fill="#1A1A1A">MetricFlow ouvert</text>
  <text x="315" y="232" class="body" font-size="13" font-weight="500" fill="#1A1A1A">sous Apache 2.0</text>
  <text x="315" y="258" class="body" font-size="11" fill="#5A5A5A">Motivé par la fiabilité</text>
  <text x="315" y="274" class="body" font-size="11" fill="#5A5A5A">des réponses d'agents.</text>
</g>

<g class="interactive" data-card="jalon-ga" tabindex="0" role="button" aria-label="Disponibilité générale des vues sémantiques et des vues de métriques — cliquez pour les détails">
  <rect class="hit" x="507" y="166" width="396" height="128" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
  <text x="525" y="190" class="mono" font-size="11" font-weight="600" fill="#B7332C">2 MARS 2026</text>
  <text x="735" y="190" class="mono" font-size="11" font-weight="600" fill="#B7332C">2 AVRIL 2026</text>
  <text x="525" y="214" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Vues sémantiques</text>
  <text x="525" y="232" class="body" font-size="13" font-weight="500" fill="#1A1A1A">en SQL standard</text>
  <text x="525" y="258" class="body" font-size="11" fill="#5A5A5A">Disponibilité générale.</text>
  <text x="525" y="274" class="body" font-size="11" fill="#5A5A5A">Mesures et dimensions.</text>
  <text x="735" y="214" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Vues de métriques</text>
  <text x="735" y="232" class="body" font-size="13" font-weight="500" fill="#1A1A1A">du catalogue</text>
  <text x="735" y="258" class="body" font-size="11" fill="#5A5A5A">Disponibilité générale.</text>
  <text x="735" y="274" class="body" font-size="11" fill="#5A5A5A">Mesures séparées des</text>
  <text x="735" y="290" class="body" font-size="11" fill="#5A5A5A">champs de découpe.</text>
  <line x1="705" y1="176" x2="705" y2="284" stroke="#E5E1D8" stroke-width="0.5"/>
</g>

<g class="interactive" data-card="jalon-apache" tabindex="0" role="button" aria-label="Donation à la fondation Apache — cliquez pour les détails">
  <rect class="hit" x="927" y="166" width="186" height="128" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
  <text x="945" y="190" class="mono" font-size="11" font-weight="600" fill="#B7332C">JUIN 2026</text>
  <text x="945" y="214" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Donation à la</text>
  <text x="945" y="232" class="body" font-size="13" font-weight="500" fill="#1A1A1A">fondation Apache</text>
  <text x="945" y="258" class="body" font-size="11" fill="#5A5A5A">Entrée en incubation ;</text>
  <text x="945" y="274" class="body" font-size="11" fill="#5A5A5A">de 17 à plus de 50</text>
  <text x="945" y="290" class="body" font-size="11" fill="#5A5A5A">organisations.</text>
</g>

<!-- Axe -->
<line x1="180" y1="330" x2="1020" y2="330" stroke="#1A1A1A" stroke-width="2.5"/>
<line x1="180" y1="304" x2="180" y2="324" stroke="#B8B5AE" stroke-width="0.75"/>
<line x1="390" y1="304" x2="390" y2="324" stroke="#B8B5AE" stroke-width="0.75"/>
<line x1="600" y1="304" x2="600" y2="324" stroke="#B8B5AE" stroke-width="0.75"/>
<line x1="810" y1="304" x2="810" y2="324" stroke="#B8B5AE" stroke-width="0.75"/>
<line x1="1020" y1="304" x2="1020" y2="324" stroke="#B8B5AE" stroke-width="0.75"/>
<circle cx="180" cy="330" r="6" fill="#1F5560"/>
<circle cx="390" cy="330" r="6" fill="#1F5560"/>
<circle cx="600" cy="330" r="6" fill="#1F5560"/>
<circle cx="810" cy="330" r="6" fill="#1F5560"/>
<circle cx="1020" cy="330" r="6" fill="#1F5560"/>
<text x="1044" y="334" class="body" font-size="11" font-style="italic" fill="#5A5A5A">temps</text>

<!-- Panneau gauche : ce que le format contient -->
<rect x="60" y="386" width="540" height="298" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
<text x="84" y="416" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#1F5560">CE QUE LE FORMAT NORMALISE</text>
<text x="84" y="444" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Cinq primitives, toutes au service d'une même question : combien.</text>

<rect x="84" y="462" width="492" height="38" rx="3" fill="#1F5560" fill-opacity="0.05"/>
<text x="102" y="486" class="mono" font-size="12" font-weight="600" fill="#1F5560">datasets</text>
<text x="250" y="486" class="body" font-size="12" fill="#1A1A1A">les tables et leur structure</text>

<rect x="84" y="506" width="492" height="38" rx="3" fill="#1F5560" fill-opacity="0.05"/>
<text x="102" y="530" class="mono" font-size="12" font-weight="600" fill="#1F5560">relationships</text>
<text x="250" y="530" class="body" font-size="12" fill="#1A1A1A">la logique de jointure et la cardinalité</text>

<rect x="84" y="550" width="492" height="38" rx="3" fill="#1F5560" fill-opacity="0.05"/>
<text x="102" y="574" class="mono" font-size="12" font-weight="600" fill="#1F5560">measures</text>
<text x="250" y="574" class="body" font-size="12" fill="#1A1A1A">les calculs quantitatifs gouvernés</text>

<rect x="84" y="594" width="492" height="38" rx="3" fill="#1F5560" fill-opacity="0.05"/>
<text x="102" y="618" class="mono" font-size="12" font-weight="600" fill="#1F5560">dimensions</text>
<text x="250" y="618" class="body" font-size="12" fill="#1A1A1A">les attributs de découpe</text>

<rect x="84" y="638" width="492" height="38" rx="3" fill="#1F5560" fill-opacity="0.05"/>
<text x="102" y="662" class="mono" font-size="12" font-weight="600" fill="#1F5560">context</text>
<text x="250" y="662" class="body" font-size="12" fill="#1A1A1A">les métadonnées lisibles par un agent</text>

<!-- Panneau droit : le trou -->
<g class="interactive" data-card="trou-population" tabindex="0" role="button" aria-label="La primitive manquante — cliquez pour les détails">
  <rect class="hit" x="620" y="386" width="520" height="298" rx="3" fill="#B7332C" fill-opacity="0.06" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="644" y="416" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#B7332C">CE QU'IL NE NORMALISE PAS</text>
  <text x="644" y="446" class="display" font-size="22" font-weight="600" fill="#1A1A1A">La population</text>
  <text x="644" y="474" class="body" font-size="12" fill="#5A5A5A">Une audience n'est ni une mesure ni une dimension.</text>
  <text x="644" y="492" class="body" font-size="12" fill="#5A5A5A">C'est un prédicat d'appartenance à une date, sous une</text>
  <text x="644" y="510" class="body" font-size="12" fill="#5A5A5A">règle d'identité, pour une finalité.</text>

  <line x1="644" y1="530" x2="1116" y2="530" stroke="#B7332C" stroke-width="0.5"/>
  <text x="644" y="556" class="body" font-size="12" font-weight="500" fill="#1A1A1A">Ce qu'un filtre de dimension ne porte pas :</text>
  <circle cx="654" cy="580" r="3" fill="#B7332C"/>
  <text x="668" y="584" class="body" font-size="12" fill="#5A5A5A">sa fenêtre temporelle</text>
  <circle cx="654" cy="604" r="3" fill="#B7332C"/>
  <text x="668" y="608" class="body" font-size="12" fill="#5A5A5A">sa règle de résolution d'identité</text>
  <circle cx="654" cy="628" r="3" fill="#B7332C"/>
  <text x="668" y="632" class="body" font-size="12" fill="#5A5A5A">son rattachement de finalité</text>
  <circle cx="654" cy="652" r="3" fill="#B7332C"/>
  <text x="668" y="656" class="body" font-size="12" fill="#5A5A5A">sa comparabilité d'une exécution à l'autre</text>
</g>

<!-- Encadré de lecture -->
<rect x="60" y="700" width="1080" height="42" rx="3" fill="#1A1A1A"/>
<text x="84" y="727" class="body" font-size="13" font-weight="500" fill="#FAF8F3">Une organisation qui a investi dans une couche sémantique a résolu le problème de ses indicateurs. Ses audiences sont restées exactement où elles étaient.</text>

<!-- Footer -->
<line x1="60" y1="758" x2="1140" y2="758" stroke="#E5E1D8" stroke-width="1"/>
<text x="60" y="780" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : communiqué de lancement de l'initiative sémantique, 23 septembre 2025 ; annonce d'ouverture de MetricFlow, 14 octobre 2025 ; notes de version Snowflake et Databricks ; annonce de donation à la fondation Apache, juin 2026. Affirmation négative vérifiée sur la description publiée du modèle à la date de rédaction.</text>
</svg>
