<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Zéro copie : ce qui bouge et ce qui ne bouge pas, comparaison de trois architectures">
<style>
  .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
  .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
  .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  .interactive { cursor: pointer; }
  .interactive:hover rect.hit { fill-opacity: .14; }
</style>
<rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

<!-- Header -->
<text x="60" y="42" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 03</text>
<text x="60" y="74" class="display" font-size="28" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">Zéro copie : ce qui bouge et ce qui ne bouge pas</text>
<text x="60" y="100" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois architectures publiées, une même asymétrie entre le lieu de la donnée et le lieu de la règle.</text>
<line x1="60" y1="118" x2="1140" y2="118" stroke="#E5E1D8" stroke-width="1"/>

<!-- En-têtes de colonnes -->
<g class="interactive" data-card="col-salesforce" tabindex="0" role="button" aria-label="Salesforce Data 360 — cliquez pour les détails">
  <rect class="hit" x="396" y="130" width="244" height="52" rx="3" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="1.25"/>
  <text x="416" y="152" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Salesforce Data 360</text>
  <text x="416" y="172" class="body" font-size="11" fill="#5A5A5A">Fédération zéro copie</text>
</g>
<g class="interactive" data-card="col-adobe" tabindex="0" role="button" aria-label="Adobe Federated Audience Composition — cliquez pour les détails">
  <rect class="hit" x="656" y="130" width="244" height="52" rx="3" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="1.25"/>
  <text x="676" y="152" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Adobe Experience Platform</text>
  <text x="676" y="172" class="body" font-size="11" fill="#5A5A5A">Composition d'audience fédérée</text>
</g>
<g class="interactive" data-card="col-databricks" tabindex="0" role="button" aria-label="Databricks CustomerLake — cliquez pour les détails">
  <rect class="hit" x="916" y="130" width="224" height="52" rx="3" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="1.25"/>
  <text x="936" y="152" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Databricks CustomerLake</text>
  <text x="936" y="172" class="body" font-size="11" fill="#5A5A5A">Avant-première, juin 2026</text>
</g>

<!-- Ligne 1 — la donnée -->
<rect x="60" y="194" width="1080" height="104" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
<text x="84" y="222" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Où vit la donnée client</text>
<text x="84" y="244" class="body" font-size="11" fill="#5A5A5A">Le seul point sur lequel les</text>
<text x="84" y="262" class="body" font-size="11" fill="#5A5A5A">trois éditeurs se sont alignés.</text>
<text x="416" y="222" class="body" font-size="12" fill="#1A1A1A">Dans l'entrepôt, lue en</text>
<text x="416" y="240" class="body" font-size="12" fill="#1A1A1A">fédération, sans copie.</text>
<text x="416" y="266" class="body" font-size="11" fill="#B7332C">Contrainte : les objets doivent</text>
<text x="416" y="282" class="body" font-size="11" fill="#B7332C">correspondre au modèle C360.</text>
<text x="676" y="222" class="body" font-size="12" fill="#1A1A1A">Dans l'entrepôt. Le service</text>
<text x="676" y="240" class="body" font-size="12" fill="#1A1A1A">ne stocke aucune donnée.</text>
<text x="676" y="266" class="body" font-size="11" fill="#B7332C">Contrainte : région du bac à</text>
<text x="676" y="282" class="body" font-size="11" fill="#B7332C">sable à faire correspondre.</text>
<text x="936" y="222" class="body" font-size="12" fill="#1A1A1A">Dans le lakehouse. La</text>
<text x="936" y="240" class="body" font-size="12" fill="#1A1A1A">plateforme y descend.</text>
<text x="936" y="266" class="body" font-size="11" fill="#B7332C">Contrainte : l'entrepôt doit</text>
<text x="936" y="282" class="body" font-size="11" fill="#B7332C">être celui de l'éditeur.</text>

<!-- Ligne 2 — la définition (mise en évidence) -->
<rect x="60" y="308" width="1080" height="104" rx="3" fill="#B7332C" fill-opacity="0.06" stroke="#B7332C" stroke-width="2.5"/>
<g class="interactive" data-card="ligne-definition" tabindex="0" role="button" aria-label="Où s'écrit la définition — cliquez pour les détails">
  <rect class="hit" x="62" y="310" width="330" height="100" rx="3" fill="#B7332C" fill-opacity="0.06"/>
  <text x="84" y="336" class="body" font-size="14" font-weight="500" fill="#B7332C">Où s'écrit la définition</text>
  <text x="84" y="358" class="body" font-size="11" fill="#5A5A5A">La ligne que le zéro copie n'a</text>
  <text x="84" y="376" class="body" font-size="11" fill="#5A5A5A">pas déplacée. C'est la seule</text>
  <text x="84" y="394" class="body" font-size="11" fill="#5A5A5A">qui décide d'une dépense.</text>
</g>
<text x="416" y="336" class="body" font-size="12" fill="#1A1A1A">Dans la console. La</text>
<text x="416" y="354" class="body" font-size="12" fill="#1A1A1A">segmentation s'exécute</text>
<text x="416" y="372" class="body" font-size="12" fill="#1A1A1A">chez l'éditeur.</text>
<text x="676" y="336" class="body" font-size="12" fill="#1A1A1A">Dans la console. Le SQL</text>
<text x="676" y="354" class="body" font-size="12" fill="#1A1A1A">généré part vers l'entrepôt,</text>
<text x="676" y="372" class="body" font-size="12" fill="#1A1A1A">la composition reste ici.</text>
<text x="936" y="336" class="body" font-size="12" fill="#1A1A1A">Dans l'interface embarquée,</text>
<text x="936" y="354" class="body" font-size="12" fill="#1A1A1A">au-dessus du catalogue de</text>
<text x="936" y="372" class="body" font-size="12" fill="#1A1A1A">gouvernance.</text>

<!-- Ligne 3 — versionnement -->
<rect x="60" y="422" width="1080" height="104" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
<text x="84" y="450" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Ce qui est versionné</text>
<text x="84" y="472" class="body" font-size="11" fill="#5A5A5A">Sans version, aucune dérive</text>
<text x="84" y="490" class="body" font-size="11" fill="#5A5A5A">de population n'est</text>
<text x="84" y="508" class="body" font-size="11" fill="#5A5A5A">diagnosticable après coup.</text>
<text x="416" y="450" class="body" font-size="12" fill="#1A1A1A">L'état courant, plus un</text>
<text x="416" y="468" class="body" font-size="12" fill="#1A1A1A">journal d'accès.</text>
<text x="676" y="450" class="body" font-size="12" fill="#1A1A1A">La composition, au format</text>
<text x="676" y="468" class="body" font-size="12" fill="#1A1A1A">propriétaire de l'éditeur.</text>
<text x="936" y="450" class="body" font-size="12" fill="#1A1A1A">Les habilitations et les</text>
<text x="936" y="468" class="body" font-size="12" fill="#1A1A1A">lectures, via le catalogue.</text>
<text x="936" y="494" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Le prédicat : à démontrer.</text>

<!-- Ligne 4 — coût -->
<rect x="60" y="536" width="1080" height="104" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
<text x="84" y="564" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Ce que coûte un calcul</text>
<text x="84" y="586" class="body" font-size="11" fill="#5A5A5A">Le coût rend visible qui</text>
<text x="84" y="604" class="body" font-size="11" fill="#5A5A5A">exécute réellement la règle.</text>
<text x="416" y="564" class="body" font-size="12" fill="#1A1A1A">Une requête réelle sur</text>
<text x="416" y="582" class="body" font-size="12" fill="#1A1A1A">l'entrepôt à chaque aperçu,</text>
<text x="416" y="600" class="body" font-size="12" fill="#1A1A1A">activation, résolution.</text>
<text x="416" y="624" class="body" font-size="11" fill="#B7332C">Double facture. Recalcul à 12 h.</text>
<text x="676" y="564" class="body" font-size="12" fill="#1A1A1A">Le calcul reste dans</text>
<text x="676" y="582" class="body" font-size="12" fill="#1A1A1A">l'entrepôt du client ; seules</text>
<text x="676" y="600" class="body" font-size="12" fill="#1A1A1A">les identités remontent.</text>
<text x="936" y="564" class="body" font-size="12" fill="#1A1A1A">Le calcul du lakehouse.</text>
<text x="936" y="588" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Tarification non publiée à</text>
<text x="936" y="606" class="body" font-size="11" font-style="italic" fill="#5A5A5A">ce stade.</text>

<!-- Ligne 5 — sortie -->
<rect x="60" y="650" width="1080" height="82" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
<text x="84" y="678" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Ce qui survit au départ</text>
<text x="84" y="700" class="body" font-size="11" fill="#5A5A5A">Le test : peut-on recalculer</text>
<text x="84" y="718" class="body" font-size="11" fill="#5A5A5A">l'audience sans la plateforme ?</text>
<text x="416" y="678" class="body" font-size="12" fill="#1A1A1A">La liste des membres, à la</text>
<text x="416" y="696" class="body" font-size="12" fill="#1A1A1A">date de l'export.</text>
<text x="676" y="678" class="body" font-size="12" fill="#1A1A1A">Le SQL généré, si on l'a</text>
<text x="676" y="696" class="body" font-size="12" fill="#1A1A1A">capté. Sinon, une liste.</text>
<text x="936" y="678" class="body" font-size="12" fill="#1A1A1A">Les tables restent. La forme</text>
<text x="936" y="696" class="body" font-size="12" fill="#1A1A1A">du prédicat reste au produit.</text>

<!-- Séparateurs de colonnes -->
<line x1="392" y1="130" x2="392" y2="732" stroke="#E5E1D8" stroke-width="0.5"/>
<line x1="650" y1="130" x2="650" y2="732" stroke="#E5E1D8" stroke-width="0.5"/>
<line x1="910" y1="130" x2="910" y2="732" stroke="#E5E1D8" stroke-width="0.5"/>

<!-- Footer -->
<line x1="60" y1="756" x2="1140" y2="756" stroke="#E5E1D8" stroke-width="1"/>
<text x="60" y="778" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : documentation Salesforce Data 360 et analyses tierces de ses limites ; documentation Adobe de gouvernance et de confidentialité de la composition fédérée ; annonce Databricks du 16 juin 2026. Éléments cités en substance, à revérifier avant usage contractuel.</text>
</svg>
