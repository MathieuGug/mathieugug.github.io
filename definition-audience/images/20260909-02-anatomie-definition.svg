<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Anatomie d'une définition d'audience : quatre composants, un seul écrit">
<style>
  .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
  .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
  .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  .interactive { cursor: pointer; }
  .interactive:hover rect.hit { fill-opacity: .12; }
</style>
<rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

<!-- Header -->
<text x="60" y="46" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 02</text>
<text x="60" y="80" class="display" font-size="28" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">Anatomie d'une définition d'audience</text>
<text x="60" y="106" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre composants décident de la population. Un seul est habituellement écrit.</text>
<line x1="60" y1="126" x2="1140" y2="126" stroke="#E5E1D8" stroke-width="1"/>

<!-- Étiquette -->
<rect x="60" y="148" width="1080" height="54" rx="3" fill="#FFFFFF" stroke="#B8B5AE" stroke-width="1.25"/>
<text x="84" y="172" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#5A5A5A">L'ÉTIQUETTE</text>
<text x="84" y="192" class="display" font-size="16" font-style="italic" fill="#1A1A1A">« clients actifs à haute valeur »</text>
<text x="560" y="180" class="body" font-size="11" fill="#5A5A5A">Ce que tout le monde voit, cite en réunion et reprend d'un outil à l'autre.</text>
<text x="560" y="198" class="body" font-size="11" fill="#5A5A5A">Elle ne contient aucun des quatre composants ci-dessous.</text>

<!-- En-têtes de colonnes -->
<text x="84" y="230" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#5A5A5A">COMPOSANT</text>
<text x="400" y="230" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#5A5A5A">CE QU'IL FIXE</text>
<text x="880" y="230" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#5A5A5A">STATUT HABITUEL</text>

<!-- Ligne 1 — prédicat -->
<g class="interactive" data-card="predicat" tabindex="0" role="button" aria-label="Le prédicat de population — cliquez pour les détails">
  <rect class="hit" x="60" y="244" width="1080" height="102" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
  <text x="84" y="276" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Le prédicat de population</text>
  <text x="84" y="300" class="body" font-size="11" fill="#5A5A5A">La condition d'appartenance</text>
  <text x="84" y="322" class="mono" font-size="11" fill="#1F5560">achats ≥ 3 ET panier moyen ≥ 80 €</text>
  <text x="400" y="276" class="body" font-size="13" fill="#1A1A1A">Qui satisfait la règle, sur des attributs et des</text>
  <text x="400" y="296" class="body" font-size="13" fill="#1A1A1A">événements que l'interface fait composer.</text>
  <text x="400" y="322" class="body" font-size="11" fill="#5A5A5A">C'est la seule partie que l'organisation croit posséder.</text>
  <rect x="880" y="266" width="102" height="26" rx="13" fill="#2F5D3F"/>
  <text x="931" y="284" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">ÉCRIT</text>
  <text x="880" y="316" class="body" font-size="11" fill="#5A5A5A">quelque part, souvent</text>
  <text x="880" y="332" class="body" font-size="11" fill="#5A5A5A">dans une console</text>
</g>

<!-- Ligne 2 — fenêtre -->
<g class="interactive" data-card="fenetre" tabindex="0" role="button" aria-label="La fenêtre temporelle — cliquez pour les détails">
  <rect class="hit" x="60" y="358" width="1080" height="102" rx="3" fill="#B7332C" fill-opacity="0.05" stroke="#B7332C" stroke-width="1.25"/>
  <text x="84" y="390" class="body" font-size="15" font-weight="500" fill="#1A1A1A">La fenêtre temporelle</text>
  <text x="84" y="414" class="body" font-size="11" fill="#5A5A5A">Sur quelle période, arrêtée quand</text>
  <text x="84" y="436" class="mono" font-size="11" fill="#B7332C">90 jours glissants ? l'exercice ?</text>
  <text x="400" y="390" class="body" font-size="13" fill="#1A1A1A">Deux fenêtres donnent deux populations sous</text>
  <text x="400" y="410" class="body" font-size="13" fill="#1A1A1A">la même étiquette, sans qu'aucune règle change.</text>
  <text x="400" y="436" class="body" font-size="11" fill="#5A5A5A">C'est le composant qui fait dériver un bilan de campagne.</text>
  <rect x="880" y="380" width="126" height="26" rx="13" fill="#B7332C"/>
  <text x="943" y="398" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">IMPLICITE</text>
  <text x="880" y="430" class="body" font-size="11" fill="#5A5A5A">réglage par défaut</text>
  <text x="880" y="446" class="body" font-size="11" fill="#5A5A5A">hérité de l'outil</text>
</g>

<!-- Ligne 3 — identité -->
<g class="interactive" data-card="identite" tabindex="0" role="button" aria-label="La règle de résolution d'identité — cliquez pour les détails">
  <rect class="hit" x="60" y="472" width="1080" height="102" rx="3" fill="#B7332C" fill-opacity="0.05" stroke="#B7332C" stroke-width="1.25"/>
  <text x="84" y="504" class="body" font-size="15" font-weight="500" fill="#1A1A1A">La règle d'identité</text>
  <text x="84" y="528" class="body" font-size="11" fill="#5A5A5A">Ce qui compte pour une personne</text>
  <text x="84" y="550" class="mono" font-size="11" fill="#B7332C">foyer ? individu ? appareil ?</text>
  <text x="400" y="504" class="body" font-size="13" fill="#1A1A1A">Elle change la cardinalité de la population avant</text>
  <text x="400" y="524" class="body" font-size="13" fill="#1A1A1A">même que le prédicat s'applique.</text>
  <text x="400" y="550" class="body" font-size="11" fill="#5A5A5A">Traitée comme un paramètre d'installation, jamais comme une décision.</text>
  <rect x="880" y="494" width="126" height="26" rx="13" fill="#B7332C"/>
  <text x="943" y="512" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">IMPLICITE</text>
  <text x="880" y="544" class="body" font-size="11" fill="#5A5A5A">configuration de la</text>
  <text x="880" y="560" class="body" font-size="11" fill="#5A5A5A">plateforme</text>
</g>

<!-- Ligne 4 — finalité -->
<g class="interactive" data-card="finalite" tabindex="0" role="button" aria-label="Le rattachement de finalité — cliquez pour les détails">
  <rect class="hit" x="60" y="586" width="1080" height="102" rx="3" fill="#B7332C" fill-opacity="0.05" stroke="#B7332C" stroke-width="1.25"/>
  <text x="84" y="618" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Le rattachement de finalité</text>
  <text x="84" y="642" class="body" font-size="11" fill="#5A5A5A">Au titre de quel traitement</text>
  <text x="84" y="664" class="mono" font-size="11" fill="#B7332C">consentement ? intérêt légitime ?</text>
  <text x="400" y="618" class="body" font-size="13" fill="#1A1A1A">Un consentement recueilli pour une finalité ne</text>
  <text x="400" y="638" class="body" font-size="13" fill="#1A1A1A">couvre pas une transmission à une finalité distincte.</text>
  <text x="400" y="664" class="body" font-size="11" fill="#5A5A5A">Vit dans un registre séparé, tenu par d'autres, à une autre fréquence.</text>
  <rect x="880" y="608" width="126" height="26" rx="13" fill="#B7332C"/>
  <text x="943" y="626" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">IMPLICITE</text>
  <text x="880" y="658" class="body" font-size="11" fill="#5A5A5A">ailleurs, dans un</text>
  <text x="880" y="674" class="body" font-size="11" fill="#5A5A5A">autre document</text>
</g>

<!-- Encadré de lecture -->
<rect x="60" y="700" width="1080" height="42" rx="3" fill="#1A1A1A"/>
<text x="84" y="727" class="body" font-size="13" font-weight="500" fill="#FAF8F3">Trois composants sur quatre sont hérités de l'outil dans lequel la définition a été écrite. Changer d'outil change la population sans que personne n'ait touché au prédicat.</text>

<!-- Footer -->
<line x1="60" y1="762" x2="1140" y2="762" stroke="#E5E1D8" stroke-width="1"/>
<text x="60" y="784" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : lignes directrices de la CNIL sur le ciblage publicitaire ; documentation de segmentation Adobe Experience Platform ; documentation Census sur les taux de correspondance. Décomposition de l'auteur.</text>
</svg>
