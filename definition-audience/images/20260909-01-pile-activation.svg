<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La pile d'activation en 2026 et l'endroit où s'écrit la définition d'audience">
<style>
  .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
  .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
  .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  .interactive { cursor: pointer; }
  .interactive:hover rect.hit { fill: #B7332C; fill-opacity: .06; }
</style>
<defs>
  <marker id="arrow01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
  </marker>
  <marker id="arrow01c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B7332C"/>
  </marker>
</defs>

<rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

<!-- Header -->
<text x="60" y="46" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 01</text>
<text x="60" y="80" class="display" font-size="28" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">La pile d'activation en 2026</text>
<text x="60" y="106" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le stockage est descendu dans l'entrepôt. L'écriture de la définition est restée en haut.</text>
<line x1="60" y1="126" x2="1140" y2="126" stroke="#E5E1D8" stroke-width="1"/>

<!-- ===== Colonne gauche : la pile ===== -->
<text x="60" y="158" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#5A5A5A">LA PILE</text>

<!-- B1 Sources -->
<rect x="60" y="172" width="600" height="66" rx="3" fill="#FFFFFF" stroke="#B8B5AE" stroke-width="1.25"/>
<text x="84" y="200" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Sources</text>
<text x="84" y="222" class="body" font-size="11" fill="#5A5A5A">Site, application, caisse, service client, partenaires, régies</text>

<line x1="360" y1="242" x2="360" y2="274" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow01)"/>

<!-- B2 Entrepôt / lakehouse -->
<g class="interactive" data-card="entrepot" tabindex="0" role="button" aria-label="Entrepôt ou lakehouse — cliquez pour les détails">
  <rect class="hit" x="60" y="286" width="600" height="176" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.25"/>
  <text x="84" y="314" class="body" font-size="15" font-weight="500" fill="#1F5560">Entrepôt · lakehouse</text>
  <text x="84" y="336" class="body" font-size="11" fill="#5A5A5A">Tables clients, événements, catalogue de gouvernance, habilitations</text>
</g>

<!-- inner : couche sémantique -->
<g class="interactive" data-card="couche-semantique" tabindex="0" role="button" aria-label="Couche sémantique — cliquez pour les détails">
  <rect class="hit" x="84" y="352" width="552" height="88" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="104" y="378" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Couche sémantique normalisée</text>
  <text x="104" y="399" class="body" font-size="11" fill="#5A5A5A">mesures · dimensions · relations · contexte</text>
  <text x="104" y="422" class="mono" font-size="11" font-weight="600" fill="#B7332C">aucune primitive de population</text>
</g>

<line x1="360" y1="466" x2="360" y2="498" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow01)"/>

<!-- B3 Console d'activation -->
<g class="interactive" data-card="console" tabindex="0" role="button" aria-label="Console d'activation — cliquez pour les détails">
  <rect class="hit" x="60" y="510" width="600" height="96" rx="3" fill="#B7332C" fill-opacity="0.07" stroke="#B7332C" stroke-width="2.5"/>
  <text x="84" y="540" class="body" font-size="15" font-weight="500" fill="#B7332C">Console d'activation</text>
  <text x="84" y="562" class="body" font-size="11" fill="#5A5A5A">Composition du segment, mappage des destinations, calendrier d'envoi</text>
  <text x="84" y="586" class="mono" font-size="11" font-weight="600" fill="#1A1A1A">la définition s'écrit ici</text>
</g>

<line x1="360" y1="610" x2="360" y2="640" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow01)"/>

<!-- B4 Destinations -->
<g class="interactive" data-card="activation" tabindex="0" role="button" aria-label="Destinations média — cliquez pour les détails">
  <rect class="hit" x="60" y="652" width="600" height="62" rx="3" fill="#FFFFFF" stroke="#B8B5AE" stroke-width="1.25"/>
  <text x="84" y="678" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Destinations</text>
  <text x="84" y="700" class="body" font-size="11" fill="#5A5A5A">Régies, messagerie, personnalisation sur site, salles blanches</text>
</g>

<!-- ===== Colonne droite : la définition ===== -->
<text x="720" y="158" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#5A5A5A">CE QUI CIRCULE ENTRE LES ÉTAGES</text>

<rect x="720" y="172" width="420" height="542" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>

<!-- ligne 1 -->
<circle cx="748" cy="212" r="9" fill="#B7332C"/>
<text x="748" y="216" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
<text x="770" y="209" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Vers le bas : une liste de membres</text>
<text x="770" y="230" class="body" font-size="11" fill="#5A5A5A">Le prédicat ne franchit aucune frontière.</text>
<text x="770" y="248" class="body" font-size="11" fill="#5A5A5A">L'étage suivant reçoit un résultat, pas une règle.</text>
<line x1="744" y1="272" x2="1116" y2="272" stroke="#E5E1D8" stroke-width="0.5"/>

<!-- ligne 2 -->
<circle cx="748" cy="308" r="9" fill="#B7332C"/>
<text x="748" y="312" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
<text x="770" y="305" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Vers le haut : rien</text>
<text x="770" y="326" class="body" font-size="11" fill="#5A5A5A">Une audience composée dans l'entrepôt arrive</text>
<text x="770" y="344" class="body" font-size="11" fill="#5A5A5A">dans la console comme une liste orpheline.</text>
<line x1="744" y1="368" x2="1116" y2="368" stroke="#E5E1D8" stroke-width="0.5"/>

<!-- ligne 3 -->
<circle cx="748" cy="404" r="9" fill="#1F5560"/>
<text x="748" y="408" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
<text x="770" y="401" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Le zéro copie déplace la lecture</text>
<text x="770" y="422" class="body" font-size="11" fill="#5A5A5A">La donnée reste dans l'entrepôt. La composition</text>
<text x="770" y="440" class="body" font-size="11" fill="#5A5A5A">reste un acte accompli dans la console.</text>
<line x1="744" y1="464" x2="1116" y2="464" stroke="#E5E1D8" stroke-width="0.5"/>

<!-- ligne 4 : le déplacement souhaitable -->
<g class="interactive" data-card="deplacement" tabindex="0" role="button" aria-label="Le déplacement souhaitable — cliquez pour les détails">
  <rect class="hit" x="744" y="484" width="372" height="210" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="768" y="514" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#1F5560">LE DÉPLACEMENT À DÉCIDER</text>
  <text x="768" y="542" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Faire descendre la définition d'un étage</text>
  <text x="768" y="566" class="body" font-size="11" fill="#5A5A5A">Déclarer l'audience comme un objet nommé à côté</text>
  <text x="768" y="584" class="body" font-size="11" fill="#5A5A5A">des mesures et des dimensions, avec ses quatre</text>
  <text x="768" y="602" class="body" font-size="11" fill="#5A5A5A">composants, et la compiler vers l'entrepôt.</text>
  <text x="768" y="632" class="body" font-size="11" fill="#5A5A5A">Ce que ça change : la règle survit au fournisseur,</text>
  <text x="768" y="650" class="body" font-size="11" fill="#5A5A5A">se compare d'une exécution à l'autre, et se relit</text>
  <text x="768" y="668" class="body" font-size="11" fill="#5A5A5A">sans ouvrir la console de personne.</text>
</g>

<!-- flèche de déplacement -->
<path d="M 668 558 C 696 558 696 500 716 500" fill="none" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#arrow01c)"/>

<!-- Footer -->
<line x1="60" y1="742" x2="1140" y2="742" stroke="#E5E1D8" stroke-width="1"/>
<text x="60" y="768" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : documentation de fédération zéro copie Salesforce et Adobe ; annonce Databricks CustomerLake, 16 juin 2026 ; spécification sémantique Open Semantic Interchange. Lecture de l'auteur.</text>
</svg>
