<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Une audience, quatre populations : définie, résolue, activée, mesurée">
<style>
  .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
  .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
  .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  .interactive { cursor: pointer; }
  .interactive:hover rect.hit { fill-opacity: .12; }
</style>
<defs>
  <marker id="arrow05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

<!-- Header -->
<text x="60" y="42" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 05</text>
<text x="60" y="74" class="display" font-size="28" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">Une audience, quatre populations</text>
<text x="60" y="100" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre nombres différents circulent sous une seule étiquette. L'écart n'est presque jamais affiché.</text>
<line x1="60" y1="118" x2="1140" y2="118" stroke="#E5E1D8" stroke-width="1"/>

<!-- Étiquette unique -->
<rect x="60" y="138" width="1080" height="40" rx="3" fill="#1A1A1A"/>
<text x="84" y="164" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#B8B5AE">L'ÉTIQUETTE, INCHANGÉE D'UN BOUT À L'AUTRE</text>
<text x="560" y="164" class="display" font-size="16" font-style="italic" fill="#FAF8F3">« clients actifs à haute valeur »</text>

<!-- Ligne 1 — définie -->
<g class="interactive" data-card="definie" tabindex="0" role="button" aria-label="Population définie — cliquez pour les détails">
  <rect class="hit" x="60" y="198" width="1080" height="76" rx="3" fill="#1F5560" fill-opacity="0.04"/>
  <rect x="84" y="208" width="540" height="56" rx="3" fill="#1F5560"/>
  <text x="106" y="234" class="body" font-size="15" font-weight="500" fill="#FAF8F3">Population définie</text>
  <text x="106" y="254" class="body" font-size="11" fill="#B8B5AE">le prédicat s'exécute sur l'entrepôt</text>
  <text x="580" y="242" class="mono" font-size="16" font-weight="600" fill="#FAF8F3" text-anchor="end">N₀</text>
  <text x="700" y="228" class="body" font-size="12" fill="#1A1A1A">Le nombre qui apparaît dans la présentation interne.</text>
  <text x="700" y="248" class="body" font-size="12" fill="#5A5A5A">C'est le seul des quatre que l'organisation contrôle entièrement.</text>
</g>

<line x1="200" y1="278" x2="200" y2="296" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow05)"/>

<!-- Ligne 2 — résolue -->
<g class="interactive" data-card="resolue" tabindex="0" role="button" aria-label="Population résolue — cliquez pour les détails">
  <rect class="hit" x="60" y="308" width="1080" height="76" rx="3" fill="#1F5560" fill-opacity="0.04"/>
  <rect x="84" y="318" width="430" height="56" rx="3" fill="#1F5560" fill-opacity="0.62"/>
  <text x="106" y="344" class="body" font-size="15" font-weight="500" fill="#FAF8F3">Population résolue</text>
  <text x="106" y="364" class="body" font-size="11" fill="#FAF8F3">des enregistrements deviennent des personnes</text>
  <text x="580" y="352" class="mono" font-size="16" font-weight="600" fill="#1F5560" text-anchor="end">N₁</text>
  <text x="700" y="338" class="body" font-size="12" fill="#1A1A1A">Écart dû à la règle d'identité : foyer, individu, appareil.</text>
  <text x="700" y="358" class="body" font-size="12" fill="#5A5A5A">L'étape la moins souvent chiffrée, parce qu'elle est traitée</text>
  <text x="700" y="376" class="body" font-size="12" fill="#5A5A5A">comme un réglage d'installation.</text>
</g>

<line x1="200" y1="388" x2="200" y2="406" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow05)"/>

<!-- Ligne 3 — activée -->
<g class="interactive" data-card="activee" tabindex="0" role="button" aria-label="Population activée — cliquez pour les détails">
  <rect class="hit" x="60" y="418" width="1080" height="90" rx="3" fill="#B7332C" fill-opacity="0.04"/>
  <rect x="84" y="428" width="290" height="56" rx="3" fill="#B7332C" fill-opacity="0.8"/>
  <text x="106" y="454" class="body" font-size="15" font-weight="500" fill="#FAF8F3">Population activée</text>
  <text x="106" y="474" class="body" font-size="11" fill="#FAF8F3">reconnue par la destination</text>
  <text x="580" y="462" class="mono" font-size="16" font-weight="600" fill="#B7332C" text-anchor="end">N₂</text>
  <text x="700" y="448" class="body" font-size="12" fill="#1A1A1A">Taille appariée = segment envoyé − invalides − non appariés.</text>
  <text x="700" y="468" class="body" font-size="12" fill="#5A5A5A">Les règles de normalisation diffèrent d'une destination à l'autre,</text>
  <text x="700" y="486" class="body" font-size="12" fill="#5A5A5A">jusqu'à la ponctuation des adresses. Il n'y a pas un N₂ mais un</text>
  <text x="700" y="504" class="body" font-size="12" fill="#5A5A5A">par destination.</text>
</g>

<!-- rupture -->
<line x1="84" y1="530" x2="1116" y2="530" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
<text x="84" y="550" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#B7332C">RUPTURE : ON RECALCULE À UNE AUTRE DATE</text>

<!-- Ligne 4 — mesurée -->
<g class="interactive" data-card="mesuree" tabindex="0" role="button" aria-label="Population mesurée — cliquez pour les détails">
  <rect class="hit" x="60" y="564" width="1080" height="90" rx="3" fill="#B7332C" fill-opacity="0.04"/>
  <rect x="84" y="574" width="395" height="56" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="106" y="600" class="body" font-size="15" font-weight="500" fill="#B7332C">Population mesurée</text>
  <text x="106" y="620" class="body" font-size="11" fill="#5A5A5A">recalculée au moment du bilan</text>
  <text x="580" y="608" class="mono" font-size="16" font-weight="600" fill="#B7332C" text-anchor="end">N₃</text>
  <text x="700" y="594" class="body" font-size="12" fill="#1A1A1A">Ni sous-ensemble ni sur-ensemble des précédentes :</text>
  <text x="700" y="614" class="body" font-size="12" fill="#1A1A1A">une autre composition.</text>
  <text x="700" y="636" class="body" font-size="12" fill="#5A5A5A">La fenêtre glissante a bougé entre l'activation et le bilan.</text>
  <text x="700" y="654" class="body" font-size="12" fill="#5A5A5A">Personne n'a modifié le prédicat.</text>
</g>

<!-- Ce que ça casse -->
<rect x="60" y="672" width="1080" height="66" rx="3" fill="#1A1A1A"/>
<text x="84" y="698" class="body" font-size="13" font-weight="500" fill="#FAF8F3">Ce que la rupture casse : le groupe témoin d'un test d'incrémentalité constitué avec une version du prédicat et reconstitué avec une autre.</text>
<text x="84" y="722" class="body" font-size="12" fill="#B8B5AE">Le biais ne produit ni valeur aberrante ni intervalle anormalement large. Il ne se voit pas dans les résultats.</text>

<!-- Footer -->
<line x1="60" y1="756" x2="1140" y2="756" stroke="#E5E1D8" stroke-width="1"/>
<text x="60" y="778" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : documentation Census sur le calcul des taux de correspondance ; documentation de segmentation Adobe Experience Platform. Largeurs des barres illustratives, non tirées d'un jeu de données réel.</text>
</svg>
