<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Les deux audits de la chaîne britannique comparés : le taux d'appariement des impressions passe de 12 à 58 pour cent, la dépense non attribuable de 15 à 3 pour cent, parce que les fournisseurs ont livré des journaux au lieu d'agrégats">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5560"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'expérience quasi naturelle</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Deux audits de la même chaîne à deux ans d'écart. Entre les deux, le format de la donnée livrée a changé.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- en-têtes de colonnes -->
  <g class="interactive" data-card="audit-2020" tabindex="0" role="button" aria-label="Audit 2020 — cliquez pour les détails">
    <rect x="330" y="186" width="200" height="46" rx="3" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="430" y="207" class="mono" font-size="12" letter-spacing="0.1em" fill="#5A5A5A" text-anchor="middle">AUDIT 2020</text>
    <text x="430" y="224" class="body" font-size="11.5" font-style="italic" fill="#8A8478" text-anchor="middle">agrégats livrés</text>
  </g>
  <g class="interactive" data-card="audit-2022" tabindex="0" role="button" aria-label="Audit 2022 — cliquez pour les détails">
    <rect x="700" y="186" width="200" height="46" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <text x="800" y="207" class="mono" font-size="12" letter-spacing="0.1em" fill="#1F5560" text-anchor="middle">AUDIT 2022</text>
    <text x="800" y="224" class="body" font-size="11.5" font-style="italic" fill="#1F5560" text-anchor="middle">journaux livrés</text>
  </g>
  <text x="950" y="214" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LECTURE</text>

  <!-- Ligne 1 -->
  <line x1="64" y1="252" x2="1136" y2="252" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="282" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Appariement des impressions</text>
  <text x="64" y="300" class="body" font-size="12" fill="#8A8478">de bout en bout de la chaîne</text>
  <text x="430" y="292" class="mono" font-size="26" font-weight="500" fill="#5A5A5A" text-anchor="middle">12 %</text>
  <line x1="545" y1="284" x2="690" y2="284" stroke="#1F5560" stroke-width="2.5" marker-end="url(#arr03)"/>
  <text x="800" y="292" class="mono" font-size="26" font-weight="600" fill="#1F5560" text-anchor="middle">58 %</text>
  <text x="950" y="282" class="body" font-size="12.5" fill="#5A5A5A">70 % sur les transactions</text>
  <text x="950" y="299" class="body" font-size="12.5" fill="#5A5A5A">de marché privé</text>

  <!-- Ligne 2 -->
  <line x1="64" y1="322" x2="1136" y2="322" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="352" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Dépense non attribuable</text>
  <text x="64" y="370" class="body" font-size="12" fill="#8A8478">à un bénéficiaire identifié</text>
  <text x="430" y="362" class="mono" font-size="26" font-weight="500" fill="#5A5A5A" text-anchor="middle">15 %</text>
  <line x1="545" y1="354" x2="690" y2="354" stroke="#1F5560" stroke-width="2.5" marker-end="url(#arr03)"/>
  <text x="800" y="362" class="mono" font-size="26" font-weight="600" fill="#1F5560" text-anchor="middle">3 %</text>
  <text x="950" y="352" class="body" font-size="12.5" fill="#5A5A5A">Le résidu n'était pas</text>
  <text x="950" y="369" class="body" font-size="12.5" fill="#5A5A5A">le problème principal</text>

  <!-- Ligne 3 -->
  <line x1="64" y1="392" x2="1136" y2="392" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="422" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Part reçue par le propriétaire</text>
  <text x="64" y="440" class="body" font-size="12" fill="#8A8478">du média</text>
  <text x="430" y="432" class="mono" font-size="26" font-weight="500" fill="#5A5A5A" text-anchor="middle">51 %</text>
  <line x1="545" y1="424" x2="690" y2="424" stroke="#1F5560" stroke-width="2.5" marker-end="url(#arr03)"/>
  <text x="800" y="432" class="mono" font-size="26" font-weight="600" fill="#1F5560" text-anchor="middle">65 %</text>
  <text x="950" y="422" class="body" font-size="12.5" fill="#5A5A5A">Mesuré, non négocié :</text>
  <text x="950" y="439" class="body" font-size="12.5" fill="#5A5A5A">aucun tarif n'a bougé</text>

  <!-- Ligne 4 -->
  <line x1="64" y1="462" x2="1136" y2="462" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="492" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Impressions observées</text>
  <text x="64" y="510" class="body" font-size="12" fill="#8A8478">et durée d'observation</text>
  <text x="430" y="500" class="mono" font-size="22" font-weight="500" fill="#5A5A5A" text-anchor="middle">267 M · 3 mois</text>
  <line x1="545" y1="494" x2="690" y2="494" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="3 3"/>
  <text x="800" y="500" class="mono" font-size="22" font-weight="500" fill="#1F5560" text-anchor="middle">1,3 Md · 9 mois</text>
  <text x="950" y="492" class="body" font-size="12.5" fill="#5A5A5A">15 annonceurs en 2020,</text>
  <text x="950" y="509" class="body" font-size="12.5" fill="#5A5A5A">11 en 2022</text>
  <line x1="64" y1="532" x2="1136" y2="532" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- Bandes du bas -->
  <g class="interactive" data-card="variable-changee" tabindex="0" role="button" aria-label="La variable qui a changé — cliquez pour les détails">
    <rect x="64" y="564" width="526" height="156" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="564" width="5" height="156" fill="#1F5560"/>
    <text x="94" y="594" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">LA VARIABLE CHANGÉE</text>
    <text x="94" y="624" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le format de la donnée livrée</text>
    <text x="94" y="652" class="body" font-size="13" fill="#5A5A5A">Tous les fournisseurs de la chaîne ont pu livrer des</text>
    <text x="94" y="672" class="body" font-size="13" fill="#5A5A5A">données de niveau journal plutôt que des agrégats.</text>
    <text x="94" y="700" class="body" font-size="12.5" font-style="italic" fill="#1F5560">Aucun euro de média n'a été dépensé pour ce gain.</text>
  </g>

  <g class="interactive" data-card="limite-echantillon" tabindex="0" role="button" aria-label="Ce que la comparaison ne permet pas de dire — cliquez pour les détails">
    <rect x="610" y="564" width="526" height="156" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 4"/>
    <text x="640" y="594" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QU'ELLE NE DIT PAS</text>
    <text x="640" y="624" class="display" font-size="20" font-weight="600" fill="#B7332C">Ce n'est pas une expérience contrôlée</text>
    <text x="640" y="652" class="body" font-size="13" fill="#5A5A5A">Panel, périmètre et appareillage ont changé entre les</text>
    <text x="640" y="672" class="body" font-size="13" fill="#5A5A5A">deux exercices. Le second portait sur un univers plus</text>
    <text x="640" y="692" class="body" font-size="13" fill="#5A5A5A">sélectif, et l'auditeur a travaillé avec les fournisseurs</text>
    <text x="640" y="712" class="body" font-size="13" fill="#5A5A5A">sur le filtrage et le transfert.</text>
  </g>

  <line x1="64" y1="752" x2="1136" y2="752" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="774" class="body" font-size="10.5" font-style="italic" letter-spacing="0.02em" fill="#8A8478">Sources : ISBA / PwC, Programmatic Supply Chain Transparency Study, mai 2020 ; second audit publié le 18 janvier 2023. Indication d'ordre de grandeur, non estimation d'effet.</text>
</svg>
