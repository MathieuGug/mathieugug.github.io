<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Cascade du budget programmatique : sur 100 unités de dépense engagée, 29 partent en coûts de transaction, une dizaine vers l'inventaire fabriqué pour la publicité, et 36 atteignent une impression valide, visible, mesurable et non fabriquée">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Où va l'euro média</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois ponctions séparent la dépense engagée de l'impression que l'annonceur aurait acceptée s'il l'avait vue d'avance.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">UNITÉS DE DÉPENSE PROGRAMMATIQUE, BASE 100</text>

  <!-- grille -->
  <line x1="64" y1="240" x2="1136" y2="240" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="64" y1="350" x2="1136" y2="350" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="64" y1="483" x2="1136" y2="483" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="64" y1="620" x2="1136" y2="620" stroke="#1A1A1A" stroke-width="1.25"/>

  <text x="1136" y="236" class="mono" font-size="10" fill="#B8B5AE" text-anchor="end">100</text>
  <text x="1136" y="346" class="mono" font-size="10" fill="#B8B5AE" text-anchor="end">71</text>
  <text x="1136" y="479" class="mono" font-size="10" fill="#B8B5AE" text-anchor="end">36</text>

  <!-- liens de cascade -->
  <line x1="240" y1="240" x2="325" y2="240" stroke="#B8B5AE" stroke-width="0.75" stroke-dasharray="2 3"/>
  <line x1="455" y1="350" x2="540" y2="350" stroke="#B8B5AE" stroke-width="0.75" stroke-dasharray="2 3"/>
  <line x1="670" y1="388" x2="755" y2="388" stroke="#B8B5AE" stroke-width="0.75" stroke-dasharray="2 3"/>
  <line x1="885" y1="483" x2="970" y2="483" stroke="#B8B5AE" stroke-width="0.75" stroke-dasharray="2 3"/>

  <!-- col 1 : dépense engagée -->
  <g>
    <rect x="110" y="240" width="130" height="380" rx="3" fill="#F2EFE7" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="175" y="226" class="mono" font-size="17" font-weight="500" fill="#1A1A1A" text-anchor="middle">100</text>
    <text x="110" y="648" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Dépense</text>
    <text x="110" y="666" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">engagée</text>
    <text x="110" y="690" class="body" font-size="11.5" fill="#8A8478">Le montant facturé</text>
    <text x="110" y="706" class="body" font-size="11.5" fill="#8A8478">à l'annonceur</text>
  </g>

  <!-- col 2 : coûts de transaction -->
  <g class="interactive" data-card="couts-transaction" tabindex="0" role="button" aria-label="Coûts de transaction — cliquez pour les détails">
    <path d="M325 198 H455 V732 H325 Z" fill="transparent" pointer-events="all"/>
    <rect x="325" y="240" width="130" height="110" rx="3" fill="#B7332C" stroke="#B7332C" stroke-width="1.25"/>
    <text x="390" y="226" class="mono" font-size="17" font-weight="500" fill="#B7332C" text-anchor="middle">−29</text>
    <text x="325" y="648" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Coûts de</text>
    <text x="325" y="666" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">transaction</text>
    <text x="325" y="690" class="body" font-size="11.5" fill="#8A8478">Plateformes d'achat,</text>
    <text x="325" y="706" class="body" font-size="11.5" fill="#8A8478">places de marché,</text>
    <text x="325" y="722" class="body" font-size="11.5" fill="#8A8478">vérification</text>
  </g>

  <!-- col 3 : inventaire fabriqué -->
  <g class="interactive" data-card="inventaire-fabrique" tabindex="0" role="button" aria-label="Inventaire fabriqué pour la publicité — cliquez pour les détails">
    <path d="M540 198 H670 V732 H540 Z" fill="transparent" pointer-events="all"/>
    <rect x="540" y="350" width="130" height="38" rx="3" fill="#B7332C" fill-opacity="0.62" stroke="#B7332C" stroke-width="1.25"/>
    <text x="605" y="338" class="mono" font-size="17" font-weight="500" fill="#B7332C" text-anchor="middle">−10</text>
    <text x="540" y="648" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Inventaire</text>
    <text x="540" y="666" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">fabriqué</text>
    <text x="540" y="690" class="body" font-size="11.5" fill="#8A8478">Des sites dont le modèle</text>
    <text x="540" y="706" class="body" font-size="11.5" fill="#8A8478">produit de l'inventaire</text>
    <text x="540" y="722" class="body" font-size="11.5" fill="#8A8478">plutôt que de l'audience</text>
  </g>

  <!-- col 4 : non visible / non mesurable -->
  <g class="interactive" data-card="non-mesurable" tabindex="0" role="button" aria-label="Impressions non visibles ou non mesurables — cliquez pour les détails">
    <path d="M755 198 H885 V732 H755 Z" fill="transparent" pointer-events="all"/>
    <rect x="755" y="388" width="130" height="95" rx="3" fill="#B7332C" fill-opacity="0.38" stroke="#B7332C" stroke-width="1.25"/>
    <text x="820" y="376" class="mono" font-size="17" font-weight="500" fill="#B7332C" text-anchor="middle">−25</text>
    <text x="755" y="648" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Non visible,</text>
    <text x="755" y="666" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">non mesurable</text>
    <text x="755" y="690" class="body" font-size="11.5" fill="#8A8478">Hors critères de visibilité,</text>
    <text x="755" y="706" class="body" font-size="11.5" fill="#8A8478">de mesurabilité et de</text>
    <text x="755" y="722" class="body" font-size="11.5" fill="#8A8478">sécurité de marque</text>
  </g>

  <!-- col 5 : média utile -->
  <g class="interactive" data-card="media-utile" tabindex="0" role="button" aria-label="Média utile — cliquez pour les détails">
    <path d="M970 198 H1100 V732 H970 Z" fill="transparent" pointer-events="all"/>
    <rect x="970" y="483" width="130" height="137" rx="3" fill="#1F5560" stroke="#1F5560" stroke-width="1.25"/>
    <text x="1035" y="471" class="mono" font-size="19" font-weight="600" fill="#1F5560" text-anchor="middle">36</text>
    <text x="970" y="648" class="body" font-size="13.5" font-weight="500" fill="#1F5560">Média utile</text>
    <text x="970" y="672" class="body" font-size="11.5" fill="#8A8478">Impression valide,</text>
    <text x="970" y="688" class="body" font-size="11.5" fill="#8A8478">visible, mesurable</text>
    <text x="970" y="704" class="body" font-size="11.5" fill="#8A8478">et non fabriquée</text>
  </g>

  <line x1="64" y1="752" x2="1136" y2="752" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="774" class="body" font-size="10.5" font-style="italic" letter-spacing="0.02em" fill="#8A8478">Source : ANA, Programmatic Media Supply Chain Transparency Study, décembre 2023 (21 annonceurs, 123 M$ de dépense, 35,5 Md impressions). La ponction intermédiaire est arrondie à la dizaine.</text>
</svg>
