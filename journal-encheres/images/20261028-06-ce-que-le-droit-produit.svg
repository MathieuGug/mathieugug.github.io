<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Quatre textes et décisions encadrent l'accès aux données d'un achat média entre 2017 et 2026, et tous laissent vide la même case : le droit de l'annonceur à la ligne par impression de ses propres achats">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce que le droit produit déjà</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre textes encadrent la question par un bout. Aucun ne la règle, et la case qu'ils laissent vide est la même.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">DATE</text>
  <text x="210" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">TEXTE OU DÉCISION</text>
  <text x="480" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">CE QU'IL DONNE</text>
  <text x="818" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">CE QU'IL NE DONNE PAS</text>

  <line x1="178" y1="208" x2="178" y2="580" stroke="#E5E1D8" stroke-width="1.25"/>

  <!-- 2017 -->
  <g class="interactive" data-card="decret-2017" tabindex="0" role="button" aria-label="Décret français de 2017 sur les prestations de publicité digitale — cliquez pour les détails">
    <rect x="64" y="208" width="1072" height="90" fill="#FFFFFF" fill-opacity="0.01"/>
    <circle cx="178" cy="248" r="6" fill="#1A1A1A"/>
    <text x="64" y="240" class="mono" font-size="12.5" font-weight="500" fill="#1A1A1A">9 FÉV. 2017</text>
    <text x="64" y="258" class="body" font-size="11.5" fill="#8A8478">France</text>
    <text x="210" y="240" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Décret sur les prestations</text>
    <text x="210" y="260" class="display" font-size="16" font-weight="600" fill="#1A1A1A">de publicité digitale</text>
    <text x="210" y="280" class="body" font-size="11.5" fill="#8A8478">En vigueur le 1er janvier 2018</text>
    <text x="480" y="236" class="body" font-size="12.5" fill="#5A5A5A">Un compte rendu obligatoire du vendeur</text>
    <text x="480" y="254" class="body" font-size="12.5" fill="#5A5A5A">d'espace, à deux niveaux, dont un volet</text>
    <text x="480" y="272" class="body" font-size="12.5" fill="#5A5A5A">renforcé pour le programmatique.</text>
    <text x="818" y="236" class="body" font-size="12.5" fill="#5A5A5A">La ligne par impression, un format, un délai</text>
    <text x="818" y="254" class="body" font-size="12.5" fill="#5A5A5A">opposable. Exclut de son champ les vendeurs</text>
    <text x="818" y="272" class="body" font-size="12.5" fill="#5A5A5A">établis dans un autre État membre.</text>
  </g>
  <line x1="64" y1="306" x2="1136" y2="306" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- 2021 -->
  <g class="interactive" data-card="autorite-2021" tabindex="0" role="button" aria-label="Décision 21-D-11 de l'Autorité de la concurrence — cliquez pour les détails">
    <rect x="64" y="306" width="1072" height="90" fill="#FFFFFF" fill-opacity="0.01"/>
    <circle cx="178" cy="346" r="6" fill="#1A1A1A"/>
    <text x="64" y="338" class="mono" font-size="12.5" font-weight="500" fill="#1A1A1A">7 JUIN 2021</text>
    <text x="64" y="356" class="body" font-size="11.5" fill="#8A8478">France</text>
    <text x="210" y="338" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Décision 21-D-11 de</text>
    <text x="210" y="358" class="display" font-size="16" font-weight="600" fill="#1A1A1A">l'Autorité de la concurrence</text>
    <text x="210" y="378" class="body" font-size="11.5" fill="#8A8478">220 M€, procédure de transaction</text>
    <text x="480" y="334" class="body" font-size="12.5" fill="#5A5A5A">L'interopérabilité du serveur publicitaire</text>
    <text x="480" y="352" class="body" font-size="12.5" fill="#5A5A5A">avec les places de marché concurrentes,</text>
    <text x="480" y="370" class="body" font-size="12.5" fill="#5A5A5A">rendue obligatoire pour trois ans.</text>
    <text x="818" y="334" class="body" font-size="12.5" fill="#5A5A5A">Un droit d'accès aux données au profit de</text>
    <text x="818" y="352" class="body" font-size="12.5" fill="#5A5A5A">l'acheteur. La décision améliore la</text>
    <text x="818" y="370" class="body" font-size="12.5" fill="#5A5A5A">concurrence du seul côté vendeur.</text>
  </g>
  <line x1="64" y1="404" x2="1136" y2="404" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- DMA -->
  <g class="interactive" data-card="marches-numeriques" tabindex="0" role="button" aria-label="Règlement sur les marchés numériques, article 6 § 8 — cliquez pour les détails">
    <rect x="64" y="404" width="1072" height="90" fill="#FFFFFF" fill-opacity="0.01"/>
    <circle cx="178" cy="444" r="6" fill="#1F5560"/>
    <text x="64" y="436" class="mono" font-size="12.5" font-weight="500" fill="#1F5560">ART. 6 § 8</text>
    <text x="64" y="454" class="body" font-size="11.5" fill="#8A8478">Union européenne</text>
    <text x="210" y="436" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Règlement sur les</text>
    <text x="210" y="456" class="display" font-size="16" font-weight="600" fill="#1A1A1A">marchés numériques</text>
    <text x="210" y="476" class="body" font-size="11.5" fill="#8A8478">Avec les art. 5 § 9 et 5 § 10</text>
    <text x="480" y="432" class="body" font-size="12.5" font-weight="500" fill="#1F5560">L'accès gratuit aux outils de mesure et aux</text>
    <text x="480" y="450" class="body" font-size="12.5" font-weight="500" fill="#1F5560">données agrégées et non agrégées, pour</text>
    <text x="480" y="468" class="body" font-size="12.5" font-weight="500" fill="#1F5560">une vérification indépendante.</text>
    <text x="818" y="432" class="body" font-size="12.5" fill="#5A5A5A">Un format, donc une garantie d'appariement.</text>
    <text x="818" y="450" class="body" font-size="12.5" fill="#5A5A5A">Ne vise que les services désignés des</text>
    <text x="818" y="468" class="body" font-size="12.5" fill="#5A5A5A">contrôleurs d'accès désignés.</text>
  </g>
  <line x1="64" y1="502" x2="1136" y2="502" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- US -->
  <g class="interactive" data-card="jugement-americain" tabindex="0" role="button" aria-label="Contentieux américain sur les technologies publicitaires — cliquez pour les détails">
    <rect x="64" y="502" width="1072" height="90" fill="#FFFFFF" fill-opacity="0.01"/>
    <circle cx="178" cy="542" r="6" fill="#1A1A1A"/>
    <text x="64" y="534" class="mono" font-size="12.5" font-weight="500" fill="#1A1A1A">2025 · 2026</text>
    <text x="64" y="552" class="body" font-size="11.5" fill="#8A8478">États-Unis</text>
    <text x="210" y="534" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Responsabilité le 17 avril</text>
    <text x="210" y="554" class="display" font-size="16" font-weight="600" fill="#1A1A1A">2025, remèdes le 2 sept. 2026</text>
    <text x="210" y="574" class="body" font-size="11.5" fill="#8A8478">Opinion pour partie sous scellés</text>
    <text x="480" y="530" class="body" font-size="12.5" fill="#5A5A5A">Une surveillance de la conduite des enchères</text>
    <text x="480" y="548" class="body" font-size="12.5" fill="#5A5A5A">pour six ans, avec moniteur et comité</text>
    <text x="480" y="566" class="body" font-size="12.5" fill="#5A5A5A">technique.</text>
    <text x="818" y="530" class="body" font-size="12.5" fill="#5A5A5A">Un droit de restitution. Le marché proposé du</text>
    <text x="818" y="548" class="body" font-size="12.5" fill="#5A5A5A">côté acheteur est exactement celui où la</text>
    <text x="818" y="566" class="body" font-size="12.5" fill="#5A5A5A">démonstration n'a pas abouti.</text>
  </g>
  <line x1="64" y1="600" x2="1136" y2="600" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- Case vide -->
  <g class="interactive" data-card="case-vide" tabindex="0" role="button" aria-label="La case vide commune aux quatre textes — cliquez pour les détails">
    <rect x="64" y="630" width="1072" height="110" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="94" y="660" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LA CASE COMMUNE</text>
    <text x="94" y="692" class="display" font-size="20" font-weight="600" fill="#B7332C">Aucun de ces textes ne donne à l'annonceur le droit d'obtenir, dans un format et un délai</text>
    <text x="94" y="716" class="display" font-size="20" font-weight="600" fill="#B7332C">qu'il a choisis, la ligne par impression de ses propres achats.</text>
  </g>

  <line x1="64" y1="762" x2="1136" y2="762" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="782" class="body" font-size="10.5" font-style="italic" letter-spacing="0.02em" fill="#8A8478">Sources : décret n° 2017-159 ; décision 21-D-11 ; règlement (UE) 2022/1925 ; United States et al. v. Google LLC, E.D. Va. Les obligations issues de la décision de 2026 proviennent de comptes rendus secondaires.</text>
</svg>
