<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Le trou d'accès aux journaux : sur 67 entreprises volontaires en 2023, 21 ont pu participer ; en 2025, 21 sur 39 annonceurs ont pu fournir des journaux complets">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le trou d'accès est contractuel</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le chiffre le plus parlant des audits n'est pas dans leurs résultats : il est dans leur taux de recrutement.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="100" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">PARTICIPATION EFFECTIVE AUX AUDITS DE JOURNAUX</text>
  <text x="776" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">QUI EST PARTIE AU CONTRAT</text>

  <!-- 2023 -->
  <g class="interactive" data-card="volontaires" tabindex="0" role="button" aria-label="Audit 2023, 67 volontaires pour 21 participants — cliquez pour les détails">
    <text x="100" y="214" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">AUDIT DE DÉCEMBRE 2023</text>
    <rect x="100" y="224" width="636" height="52" rx="3" fill="#F2EFE7" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="120" y="256" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Entreprises membres ayant accepté de participer</text>
    <text x="716" y="257" class="mono" font-size="20" font-weight="500" fill="#1A1A1A" text-anchor="end">67</text>

    <polygon points="100,276 736,276 300,318 100,318" fill="#B7332C" fill-opacity="0.13"/>

    <rect x="100" y="318" width="200" height="52" rx="3" fill="#1F5560" stroke="#1F5560" stroke-width="1.25"/>
    <text x="120" y="351" class="mono" font-size="20" font-weight="600" fill="#FAF8F3">21</text>
    <text x="320" y="345" class="body" font-size="13.5" font-weight="500" fill="#1F5560">participants effectifs</text>
    <text x="320" y="302" class="body" font-size="12.5" font-style="italic" fill="#B7332C">46 n'ont pas pu aller au bout</text>
  </g>

  <!-- 2025 -->
  <g class="interactive" data-card="persistance-2025" tabindex="0" role="button" aria-label="Relevé du deuxième trimestre 2025, 21 journaux complets sur 39 annonceurs — cliquez pour les détails">
    <text x="100" y="420" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">RELEVÉ DU DEUXIÈME TRIMESTRE 2025</text>
    <rect x="100" y="430" width="370" height="52" rx="3" fill="#F2EFE7" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="120" y="462" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Annonceurs participants</text>
    <text x="450" y="463" class="mono" font-size="20" font-weight="500" fill="#1A1A1A" text-anchor="end">39</text>

    <polygon points="100,482 470,482 300,524 100,524" fill="#B7332C" fill-opacity="0.13"/>

    <rect x="100" y="524" width="200" height="52" rx="3" fill="#1F5560" stroke="#1F5560" stroke-width="1.25"/>
    <text x="120" y="557" class="mono" font-size="20" font-weight="600" fill="#FAF8F3">21</text>
    <text x="320" y="551" class="body" font-size="13.5" font-weight="500" fill="#1F5560">ont fourni des journaux complets</text>
    <text x="320" y="508" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Deux ans plus tard, toujours une moitié</text>
  </g>

  <!-- Cause -->
  <g class="interactive" data-card="blocage-juridique" tabindex="0" role="button" aria-label="La nature de l'obstacle — cliquez pour les détails">
    <rect x="100" y="608" width="636" height="104" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="100" y="608" width="5" height="104" fill="#B7332C"/>
    <text x="130" y="636" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">MOTIFS DÉCLARÉS DU BLOCAGE</text>
    <text x="130" y="664" class="body" font-size="13.5" fill="#5A5A5A">Obstacles juridiques, ou impossibilité d'obtenir les données de journal</text>
    <text x="130" y="684" class="body" font-size="13.5" fill="#5A5A5A">auprès des plateformes d'achat, des places de marché et des prestataires</text>
    <text x="130" y="704" class="body" font-size="13.5" fill="#5A5A5A">de vérification.</text>
  </g>

  <!-- Colonne droite : accès médiatisé -->
  <g class="interactive" data-card="acces-mediatise" tabindex="0" role="button" aria-label="Accès direct contre accès médiatisé par l'agence — cliquez pour les détails">
    <rect x="776" y="224" width="360" height="192" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="800" y="254" class="mono" font-size="11" letter-spacing="0.1em" fill="#5A5A5A">PARMI LES 21 PARTICIPANTS</text>

    <rect x="800" y="274" width="164" height="34" rx="3" fill="#1F5560"/>
    <rect x="964" y="274" width="148" height="34" rx="3" fill="#B7332C" fill-opacity="0.75"/>
    <text x="810" y="297" class="mono" font-size="14" font-weight="600" fill="#FAF8F3">52 %</text>
    <text x="974" y="297" class="mono" font-size="14" font-weight="600" fill="#FAF8F3">48 %</text>

    <text x="800" y="334" class="body" font-size="13" font-weight="500" fill="#1F5560">Accès direct aux données</text>
    <text x="800" y="352" class="body" font-size="13" fill="#5A5A5A">par leur propre contrat de plateforme.</text>
    <text x="800" y="382" class="body" font-size="13" font-weight="500" fill="#B7332C">Accès médiatisé</text>
    <text x="800" y="400" class="body" font-size="13" fill="#5A5A5A">par le contrat de l'agence.</text>
  </g>

  <rect x="776" y="440" width="360" height="272" rx="3" fill="#FAF8F3" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="800" y="470" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">CE QUE L'OBSTACLE N'EST PAS</text>
  <text x="800" y="500" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Technique</text>
  <text x="800" y="520" class="body" font-size="12.5" fill="#5A5A5A">Le fichier est le support de la</text>
  <text x="800" y="538" class="body" font-size="12.5" fill="#5A5A5A">facturation. Sa livraison est un</text>
  <text x="800" y="556" class="body" font-size="12.5" fill="#5A5A5A">travail d'exploitation banal.</text>
  <text x="800" y="590" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Réglementaire</text>
  <text x="800" y="610" class="body" font-size="12.5" fill="#5A5A5A">Le second audit britannique s'est</text>
  <text x="800" y="628" class="body" font-size="12.5" fill="#5A5A5A">tenu sous le même droit que le</text>
  <text x="800" y="646" class="body" font-size="12.5" fill="#5A5A5A">premier, et l'appariement a</text>
  <text x="800" y="664" class="body" font-size="12.5" fill="#5A5A5A">quintuplé. La protection des</text>
  <text x="800" y="682" class="body" font-size="12.5" fill="#5A5A5A">données conditionne la forme de</text>
  <text x="800" y="700" class="body" font-size="12.5" fill="#5A5A5A">la livraison, non sa possibilité.</text>

  <line x1="64" y1="736" x2="1136" y2="736" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="758" class="body" font-size="10.5" font-style="italic" letter-spacing="0.02em" fill="#8A8478">Sources : ANA, Programmatic Media Supply Chain Transparency Study — First Look, juin 2023 ; Programmatic Transparency Benchmark, deuxième trimestre 2025.</text>
</svg>
