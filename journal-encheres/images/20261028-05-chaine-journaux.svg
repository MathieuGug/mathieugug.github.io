<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Qui détient quel journal le long de la chaîne : la plateforme d'achat, la place de marché, le serveur publicitaire de l'éditeur et le prestataire de vérification tiennent chacun un fragment, et la valeur du dispositif réside dans la clé qui permet de les apparier">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Personne ne détient le journal entier</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque étage tient un fragment. La valeur du dispositif réside dans la clé qui permet de reconnaître la même impression dans deux fragments.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <rect x="64" y="180" width="1072" height="40" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="90" y="206" class="body" font-size="13.5" font-weight="500" fill="#B7332C">L'annonceur, qui paie la totalité de la chaîne, n'en détient aucun fragment de plein droit.</text>

  <!-- Étage 1 -->
  <g class="interactive" data-card="plateforme-achat" tabindex="0" role="button" aria-label="La plateforme d'achat — cliquez pour les détails">
    <rect x="90" y="250" width="225" height="196" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="90" y="250" width="225" height="5" fill="#1F5560"/>
    <text x="110" y="282" class="mono" font-size="10" letter-spacing="0.1em" fill="#1F5560">ÉTAGE 1</text>
    <text x="110" y="306" class="display" font-size="17" font-weight="600" fill="#1A1A1A">La plateforme</text>
    <text x="110" y="326" class="display" font-size="17" font-weight="600" fill="#1A1A1A">d'achat</text>
    <text x="110" y="352" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">SON JOURNAL CONTIENT</text>
    <text x="110" y="372" class="body" font-size="12.5" fill="#5A5A5A">L'enchère remportée</text>
    <text x="110" y="390" class="body" font-size="12.5" fill="#5A5A5A">Le prix facturé</text>
    <text x="110" y="408" class="body" font-size="12.5" fill="#5A5A5A">Le chemin déclaré</text>
    <text x="110" y="432" class="body" font-size="12" font-style="italic" fill="#B7332C">Pas ce que l'éditeur a reçu</text>
  </g>

  <line x1="315" y1="348" x2="341" y2="348" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arr05)"/>

  <!-- Étage 2 -->
  <g class="interactive" data-card="place-de-marche" tabindex="0" role="button" aria-label="La place de marché — cliquez pour les détails">
    <rect x="355" y="250" width="225" height="196" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="355" y="250" width="225" height="5" fill="#1F5560"/>
    <text x="375" y="282" class="mono" font-size="10" letter-spacing="0.1em" fill="#1F5560">ÉTAGE 2</text>
    <text x="375" y="306" class="display" font-size="17" font-weight="600" fill="#1A1A1A">La place</text>
    <text x="375" y="326" class="display" font-size="17" font-weight="600" fill="#1A1A1A">de marché</text>
    <text x="375" y="352" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">SON JOURNAL CONTIENT</text>
    <text x="375" y="372" class="body" font-size="12.5" fill="#5A5A5A">La vente réalisée</text>
    <text x="375" y="390" class="body" font-size="12.5" fill="#5A5A5A">Le prix reversé</text>
    <text x="375" y="408" class="body" font-size="12.5" fill="#5A5A5A">Les frais prélevés</text>
    <text x="375" y="432" class="body" font-size="12" font-style="italic" fill="#B7332C">Pas ce que l'acheteur a payé</text>
  </g>

  <line x1="580" y1="348" x2="606" y2="348" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arr05)"/>

  <!-- Étage 3 -->
  <g class="interactive" data-card="editeur" tabindex="0" role="button" aria-label="Le serveur publicitaire de l'éditeur — cliquez pour les détails">
    <rect x="620" y="250" width="225" height="196" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="620" y="250" width="225" height="5" fill="#1F5560"/>
    <text x="640" y="282" class="mono" font-size="10" letter-spacing="0.1em" fill="#1F5560">ÉTAGE 3</text>
    <text x="640" y="306" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Le serveur de</text>
    <text x="640" y="326" class="display" font-size="17" font-weight="600" fill="#1A1A1A">l'éditeur</text>
    <text x="640" y="352" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">SON JOURNAL CONTIENT</text>
    <text x="640" y="372" class="body" font-size="12.5" fill="#5A5A5A">L'emplacement servi</text>
    <text x="640" y="390" class="body" font-size="12.5" fill="#5A5A5A">L'ordre d'affichage</text>
    <text x="640" y="408" class="body" font-size="12.5" fill="#5A5A5A">Le revenu encaissé</text>
    <text x="640" y="432" class="body" font-size="12" font-style="italic" fill="#B7332C">Pas le chemin en amont</text>
  </g>

  <line x1="845" y1="348" x2="871" y2="348" stroke="#5A5A5A" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#arr05)"/>

  <!-- Étage 4 -->
  <g class="interactive" data-card="verification" tabindex="0" role="button" aria-label="Le prestataire de vérification — cliquez pour les détails">
    <rect x="885" y="250" width="225" height="196" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="885" y="250" width="225" height="5" fill="#B58A2C"/>
    <text x="905" y="282" class="mono" font-size="10" letter-spacing="0.1em" fill="#B58A2C">EN PARALLÈLE</text>
    <text x="905" y="306" class="display" font-size="17" font-weight="600" fill="#1A1A1A">La vérification</text>
    <text x="905" y="352" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">SON JOURNAL CONTIENT</text>
    <text x="905" y="372" class="body" font-size="12.5" fill="#5A5A5A">La visibilité</text>
    <text x="905" y="390" class="body" font-size="12.5" fill="#5A5A5A">La mesurabilité</text>
    <text x="905" y="408" class="body" font-size="12.5" fill="#5A5A5A">La sécurité de marque</text>
    <text x="905" y="432" class="body" font-size="12" font-style="italic" fill="#B7332C">Pas le prix payé</text>
  </g>

  <!-- Jointures -->
  <circle cx="335" cy="492" r="11" fill="#B7332C"/>
  <text x="335" y="496" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
  <line x1="335" y1="481" x2="335" y2="450" stroke="#5A5A5A" stroke-width="0.75"/>
  <circle cx="600" cy="492" r="11" fill="#B7332C"/>
  <text x="600" y="496" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
  <line x1="600" y1="481" x2="600" y2="450" stroke="#5A5A5A" stroke-width="0.75"/>
  <circle cx="865" cy="492" r="11" fill="#B7332C"/>
  <text x="865" y="496" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
  <line x1="865" y1="481" x2="865" y2="450" stroke="#5A5A5A" stroke-width="0.75"/>

  <g class="interactive" data-card="jointures" tabindex="0" role="button" aria-label="Les trois jointures et la clé de réconciliation — cliquez pour les détails">
    <rect x="64" y="526" width="1072" height="166" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="526" width="5" height="166" fill="#B7332C"/>
    <text x="94" y="556" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LES TROIS JOINTURES</text>
    <text x="94" y="586" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le taux d'appariement est le nom de ces trois jointures</text>
    <text x="94" y="616" class="body" font-size="13.5" fill="#5A5A5A">Chacune suppose un identifiant commun permettant de reconnaître la même impression dans deux journaux différents. Quand il manque,</text>
    <text x="94" y="636" class="body" font-size="13.5" fill="#5A5A5A">les fragments restent côte à côte : on peut additionner des totaux, on ne peut pas suivre une impression.</text>
    <text x="94" y="668" class="body" font-size="13" font-style="italic" fill="#B7332C">Sans clé commune, douze journaux ne font pas une chaîne : ils font douze fichiers.</text>
  </g>

  <line x1="64" y1="718" x2="1136" y2="718" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="740" class="body" font-size="10.5" font-style="italic" letter-spacing="0.02em" fill="#8A8478">Grille de lecture de l'auteur, construite sur la méthode d'appariement décrite par les audits ISBA / PwC (2020, 2022) et ANA (2023).</text>
</svg>
