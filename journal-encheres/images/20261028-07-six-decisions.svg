<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Six décisions classées par la fenêtre où elles restent possibles : trois avant signature, deux en exploitation, une en continu">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Six décisions, classées par fenêtre</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois ne se rattrapent qu'au prix d'une renégociation. Deux ne demandent l'accord d'aucun tiers. Une est une décision d'organisation.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Fenêtre 1 -->
  <g class="interactive" data-card="avant-signature" tabindex="0" role="button" aria-label="Fenêtre 1, avant signature — cliquez pour les détails">
    <rect x="64" y="200" width="345" height="440" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="200" width="345" height="5" fill="#B7332C"/>
    <text x="88" y="236" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">FENÊTRE 1</text>
    <text x="88" y="264" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Avant signature</text>
    <line x1="88" y1="282" x2="385" y2="282" stroke="#E5E1D8" stroke-width="1"/>

    <text x="88" y="312" class="mono" font-size="12" font-weight="600" fill="#B7332C">D1</text>
    <text x="118" y="312" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Le droit au journal, écrit</text>
    <text x="118" y="330" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">avec ses six paramètres</text>
    <text x="118" y="352" class="body" font-size="12" fill="#8A8478">Périmètre énuméré, granularité par</text>
    <text x="118" y="368" class="body" font-size="12" fill="#8A8478">impression, liste de champs, délai et</text>
    <text x="118" y="384" class="body" font-size="12" fill="#8A8478">rythme automatique, rétention, clé de</text>
    <text x="118" y="400" class="body" font-size="12" fill="#8A8478">réconciliation.</text>

    <text x="88" y="440" class="mono" font-size="12" font-weight="600" fill="#B7332C">D2</text>
    <text x="118" y="440" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">L'accès direct, ou la</text>
    <text x="118" y="458" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">cession du droit d'accès</text>
    <text x="118" y="480" class="body" font-size="12" fill="#8A8478">Si l'annonceur n'est pas partie au contrat</text>
    <text x="118" y="496" class="body" font-size="12" fill="#8A8478">de plateforme, D1 figure dans le mandat</text>
    <text x="118" y="512" class="body" font-size="12" fill="#8A8478">d'agence, au même niveau de détail.</text>

    <text x="88" y="552" class="mono" font-size="12" font-weight="600" fill="#B7332C">D3</text>
    <text x="118" y="552" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">La déclaration annexée</text>
    <text x="118" y="570" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">des champs non livrables</text>
    <text x="118" y="592" class="body" font-size="12" fill="#8A8478">Avec le motif de chacun et une date. Une</text>
    <text x="118" y="608" class="body" font-size="12" fill="#8A8478">impossibilité écrite se renégocie au</text>
    <text x="118" y="624" class="body" font-size="12" fill="#8A8478">renouvellement.</text>
  </g>

  <!-- Fenêtre 2 -->
  <g class="interactive" data-card="en-exploitation" tabindex="0" role="button" aria-label="Fenêtre 2, en exploitation — cliquez pour les détails">
    <rect x="427" y="200" width="345" height="440" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="427" y="200" width="345" height="5" fill="#1F5560"/>
    <text x="451" y="236" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">FENÊTRE 2</text>
    <text x="451" y="264" class="display" font-size="21" font-weight="600" fill="#1A1A1A">En exploitation</text>
    <line x1="451" y1="282" x2="748" y2="282" stroke="#E5E1D8" stroke-width="1"/>

    <text x="451" y="312" class="mono" font-size="12" font-weight="600" fill="#1F5560">D4</text>
    <text x="481" y="312" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Un appariement de</text>
    <text x="481" y="330" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">référence par an</text>
    <text x="481" y="352" class="body" font-size="12" fill="#8A8478">Sur un périmètre restreint. L'objectif est</text>
    <text x="481" y="368" class="body" font-size="12" fill="#8A8478">de connaître son propre taux et de le</text>
    <text x="481" y="384" class="body" font-size="12" fill="#8A8478">suivre, sans auditer tout le budget.</text>
    <text x="481" y="408" class="body" font-size="12" font-style="italic" fill="#1F5560">Entre 12 % et 58 % selon la livraison.</text>

    <text x="451" y="462" class="mono" font-size="12" font-weight="600" fill="#1F5560">D5</text>
    <text x="481" y="462" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Une liste restreinte de</text>
    <text x="481" y="480" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">vendeurs, tirée du journal</text>
    <text x="481" y="502" class="body" font-size="12" fill="#8A8478">Les campagnes auditées tournaient sur plus</text>
    <text x="481" y="518" class="body" font-size="12" fill="#8A8478">de 40 000 sites. La liste doit être dérivée</text>
    <text x="481" y="534" class="body" font-size="12" fill="#8A8478">du journal de l'annonceur.</text>
    <text x="481" y="558" class="body" font-size="12" font-style="italic" fill="#1F5560">Un classement acheté réintroduit la</text>
    <text x="481" y="574" class="body" font-size="12" font-style="italic" fill="#1F5560">dépendance qu'on voulait lever.</text>
  </g>

  <!-- Fenêtre 3 -->
  <g class="interactive" data-card="en-continu" tabindex="0" role="button" aria-label="Fenêtre 3, en continu — cliquez pour les détails">
    <rect x="790" y="200" width="346" height="440" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="790" y="200" width="346" height="5" fill="#B58A2C"/>
    <text x="814" y="236" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">FENÊTRE 3</text>
    <text x="814" y="264" class="display" font-size="21" font-weight="600" fill="#1A1A1A">En continu</text>
    <line x1="814" y1="282" x2="1112" y2="282" stroke="#E5E1D8" stroke-width="1"/>

    <text x="814" y="312" class="mono" font-size="12" font-weight="600" fill="#B58A2C">D6</text>
    <text x="844" y="312" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Un propriétaire nommé du</text>
    <text x="844" y="330" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">journal, qui n'est pas</text>
    <text x="844" y="348" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">l'acheteur</text>
    <text x="844" y="370" class="body" font-size="12" fill="#8A8478">Responsable de la réception du fichier, de</text>
    <text x="844" y="386" class="body" font-size="12" fill="#8A8478">son ingestion, du suivi du taux</text>
    <text x="844" y="402" class="body" font-size="12" fill="#8A8478">d'appariement, et de l'alerte quand un</text>
    <text x="844" y="418" class="body" font-size="12" fill="#8A8478">fournisseur cesse de livrer.</text>

    <line x1="814" y1="452" x2="1112" y2="452" stroke="#E5E1D8" stroke-width="1"/>
    <text x="814" y="482" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">POURQUOI PAS L'ACHETEUR</text>
    <text x="814" y="508" class="body" font-size="12.5" fill="#5A5A5A">Le journal est la pièce qui permet de</text>
    <text x="814" y="526" class="body" font-size="12.5" fill="#5A5A5A">contrôler la qualité d'un achat. La confier</text>
    <text x="814" y="544" class="body" font-size="12.5" fill="#5A5A5A">à l'équipe qui réalise cet achat revient à</text>
    <text x="814" y="562" class="body" font-size="12.5" fill="#5A5A5A">lui demander d'instruire son propre</text>
    <text x="814" y="580" class="body" font-size="12.5" fill="#5A5A5A">dossier.</text>
    <text x="814" y="608" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">Elle relève de la direction data, avec le</text>
    <text x="814" y="624" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">reste du registre de mesure.</text>
  </g>

  <rect x="64" y="664" width="1072" height="66" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="94" y="692" class="mono" font-size="11" letter-spacing="0.1em" fill="#5A5A5A">LA CONDITION QUI PORTE LES SIX</text>
  <text x="94" y="716" class="display" font-size="17" font-style="italic" fill="#1A1A1A">La clause ne produit rien si personne n'a budgété l'ingestion du fichier qu'elle fait arriver : environ 290 lignes de journal par unité monétaire dépensée.</text>

  <line x1="64" y1="752" x2="1136" y2="752" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="772" class="body" font-size="10.5" font-style="italic" letter-spacing="0.02em" fill="#8A8478">Grille de décision de l'auteur. Ordres de grandeur : ANA, décembre 2023 (35,5 Md impressions pour 123 M$) ; ISBA / PwC, 2020 et 2022 (taux d'appariement).</text>
</svg>
