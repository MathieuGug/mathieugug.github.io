<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Trois niveaux de restitution d'un achat média : l'agrégat de facturation, le rapport de placement et le journal d'impressions, et la case que le droit laisse vide">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le compte rendu dit combien, le journal dit quoi</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois niveaux de restitution coexistent dans les contrats. Ils se confondent en réunion et n'autorisent pas les mêmes constats.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">NIVEAU DE RESTITUTION</text>
  <text x="470" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL PERMET DE CONSTATER</text>
  <text x="1106" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">EXIGÉ PAR</text>

  <!-- Niveau 1 -->
  <g class="interactive" data-card="niveau-agregat" tabindex="0" role="button" aria-label="Niveau 1, l'agrégat de facturation — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="100" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="5" height="100" fill="#B8B5AE"/>
    <text x="94" y="236" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">NIVEAU 1</text>
    <text x="94" y="264" class="display" font-size="21" font-weight="600" fill="#1A1A1A">L'agrégat de facturation</text>
    <text x="94" y="288" class="body" font-size="12" fill="#8A8478">Montant, période, volume, prix moyen</text>

    <text x="470" y="244" class="body" font-size="13.5" fill="#5A5A5A">Qu'une somme a été dépensée sur une période, et comment</text>
    <text x="470" y="266" class="body" font-size="13.5" fill="#5A5A5A">elle se compare à la période précédente.</text>
    <text x="470" y="290" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Suffit à payer. Ne dit rien de ce qui a été acheté.</text>

    <text x="1106" y="258" class="mono" font-size="12" letter-spacing="0.06em" fill="#8A8478" text-anchor="end">DÉCRET 2017</text>
    <text x="1106" y="278" class="mono" font-size="12" letter-spacing="0.06em" fill="#8A8478" text-anchor="end">SOCLE</text>
  </g>

  <!-- Niveau 2 -->
  <g class="interactive" data-card="niveau-placement" tabindex="0" role="button" aria-label="Niveau 2, le rapport de placement — cliquez pour les détails">
    <rect x="64" y="318" width="1072" height="100" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="318" width="5" height="100" fill="#B58A2C"/>
    <text x="94" y="348" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">NIVEAU 2</text>
    <text x="94" y="376" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le rapport de placement</text>
    <text x="94" y="400" class="body" font-size="12" fill="#8A8478">Liste de domaines, impressions, coût</text>

    <text x="470" y="356" class="body" font-size="13.5" fill="#5A5A5A">Sur quels domaines la diffusion a eu lieu, à quel volume.</text>
    <text x="470" y="378" class="body" font-size="13.5" fill="#5A5A5A">Autorise l'exclusion d'un emplacement, après l'avoir payé.</text>
    <text x="470" y="402" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">Reste un agrégat : le regroupement est choisi par qui le produit.</text>

    <text x="1106" y="358" class="mono" font-size="12" letter-spacing="0.06em" fill="#B58A2C" text-anchor="end">DÉCRET 2017</text>
    <text x="1106" y="378" class="mono" font-size="12" letter-spacing="0.06em" fill="#B58A2C" text-anchor="end">VOLET</text>
    <text x="1106" y="398" class="mono" font-size="12" letter-spacing="0.06em" fill="#B58A2C" text-anchor="end">PROGRAMMATIQUE</text>
  </g>

  <!-- Niveau 3 -->
  <g class="interactive" data-card="niveau-journal" tabindex="0" role="button" aria-label="Niveau 3, le journal d'impressions — cliquez pour les détails">
    <rect x="64" y="430" width="1072" height="124" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="430" width="5" height="124" fill="#1F5560"/>
    <text x="94" y="460" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">NIVEAU 3</text>
    <text x="94" y="488" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le journal d'impressions</text>
    <text x="94" y="512" class="body" font-size="12" fill="#8A8478">Une ligne par impression servie</text>
    <text x="94" y="534" class="body" font-size="12" fill="#8A8478">Horodatage · enchère · chemin · prix</text>

    <text x="470" y="464" class="body" font-size="13.5" fill="#5A5A5A">L'inventaire réellement servi, le chemin d'intermédiaires emprunté,</text>
    <text x="470" y="486" class="body" font-size="13.5" fill="#5A5A5A">le coût à chaque étage, et les achats redondants du même inventaire.</text>
    <text x="470" y="510" class="body" font-size="13.5" fill="#5A5A5A">Le seul niveau à partir duquel on peut recalculer autre chose</text>
    <text x="470" y="532" class="body" font-size="13.5" fill="#5A5A5A">que ce qui a été calculé pour vous.</text>

    <text x="1106" y="476" class="mono" font-size="12" letter-spacing="0.06em" fill="#1F5560" text-anchor="end">MARCHÉS NUMÉRIQUES</text>
    <text x="1106" y="496" class="mono" font-size="12" letter-spacing="0.06em" fill="#1F5560" text-anchor="end">ART. 6 § 8</text>
    <text x="1106" y="520" class="body" font-size="11.5" font-style="italic" fill="#8A8478" text-anchor="end">pour les seuls services</text>
    <text x="1106" y="536" class="body" font-size="11.5" font-style="italic" fill="#8A8478" text-anchor="end">désignés</text>
  </g>

  <!-- Case vide -->
  <g class="interactive" data-card="ce-qui-manque" tabindex="0" role="button" aria-label="La case vide : un droit au journal dans un format et un délai choisis — cliquez pour les détails">
    <rect x="64" y="586" width="1072" height="104" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 4"/>
    <text x="94" y="616" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LA CASE VIDE</text>
    <text x="94" y="646" class="display" font-size="20" font-weight="600" fill="#B7332C">Le niveau 3, dans un format et un délai choisis par l'acheteur</text>
    <text x="94" y="672" class="body" font-size="13.5" fill="#5A5A5A">Le fichier existe déjà : un système qui facture à l'impression tient la trace de chaque impression facturée. Ce qui manque est le droit de le recevoir.</text>
  </g>

  <line x1="64" y1="736" x2="1136" y2="736" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="758" class="body" font-size="10.5" font-style="italic" letter-spacing="0.02em" fill="#8A8478">Sources : décret n° 2017-159 du 9 février 2017 ; règlement (UE) 2022/1925, art. 6 § 8. Les catégories de restitution sont une grille de lecture de l'auteur.</text>
</svg>
