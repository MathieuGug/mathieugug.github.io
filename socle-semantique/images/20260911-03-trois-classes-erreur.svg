<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-label="Les trois classes de défaut d'un socle data rangées par le bruit qu'elles font : erreur silencieuse, erreur bruyante, erreur coûteuse">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="830" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois classes d'erreur, rangées par le bruit qu'elles font</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La gravité d'un défaut ne tient pas à sa fréquence, mais à ce qui signale son apparition.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="190" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">CLASSE</text>
  <text x="420" y="190" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">CE QU'ON OBSERVE, ET SUR QUOI</text>
  <text x="1106" y="190" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478" text-anchor="end">SIGNAL</text>

  <!-- Classe 1 -->
  <g class="interactive" data-card="silencieuse" tabindex="0" role="button" aria-label="Classe 1, l'erreur silencieuse — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="132" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="206" width="5" height="132" fill="#B7332C"/>
    <text x="94" y="238" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CLASSE 1</text>
    <text x="94" y="268" class="display" font-size="22" font-weight="600" fill="#1A1A1A">L'erreur silencieuse</text>
    <text x="94" y="292" class="body" font-size="13" fill="#8A8478">Une réponse plausible,</text>
    <text x="94" y="311" class="body" font-size="13" fill="#8A8478">bien formée, chiffrée</text>
    <text x="94" y="330" class="body" font-size="13" fill="#8A8478">et fausse.</text>

    <text x="420" y="240" class="body" font-size="13.5" fill="#5A5A5A">Définitions divergentes d'un indicateur · granularité d'une table d'instantanés</text>
    <text x="420" y="262" class="body" font-size="13.5" fill="#5A5A5A">sommée comme un flux · deux chemins de jointure possibles entre deux tables</text>
    <text x="420" y="284" class="body" font-size="13.5" fill="#5A5A5A">exercice fiscal décalé · filiales ou lignes d'annulation exclues sans le dire</text>
    <text x="420" y="316" class="mono" font-size="12.5" fill="#B7332C">PromotionKey = 1 signifie « aucune promotion »</text>
    <text x="420" y="333" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Convention écrite nulle part, évidente pour qui connaît le jeu de données.</text>

    <text x="1106" y="268" class="mono" font-size="14" font-weight="600" letter-spacing="0.06em" fill="#B7332C" text-anchor="end">AUCUN</text>
    <text x="1106" y="292" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="end">contamine la décision</text>
  </g>

  <!-- flèche de conversion -->
  <g>
    <line x1="140" y1="348" x2="140" y2="378" stroke="#1A1A1A" stroke-width="1.75"/>
    <path d="M 140 394 L 134 378 L 146 378 Z" fill="#1A1A1A"/>
    <text x="170" y="365" class="mono" font-size="11" letter-spacing="0.09em" fill="#1A1A1A">PRÉPARER LE SOCLE = DÉPLACER LES DÉFAUTS DE LA CLASSE 1 VERS LA CLASSE 2</text>
    <text x="170" y="385" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Le but n'est pas d'obtenir plus de réponses justes, mais de rendre visible chaque réponse fausse.</text>
  </g>

  <!-- Classe 2 -->
  <g class="interactive" data-card="bruyante" tabindex="0" role="button" aria-label="Classe 2, l'erreur bruyante — cliquez pour les détails">
    <rect x="64" y="412" width="1072" height="118" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="412" width="5" height="118" fill="#4A7C59"/>
    <text x="94" y="444" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">CLASSE 2</text>
    <text x="94" y="474" class="display" font-size="22" font-weight="600" fill="#1A1A1A">L'erreur bruyante</text>
    <text x="94" y="498" class="body" font-size="13" fill="#8A8478">Un refus, une erreur</text>
    <text x="94" y="517" class="body" font-size="13" fill="#8A8478">explicite, un « hors périmètre ».</text>

    <text x="420" y="446" class="body" font-size="13.5" fill="#5A5A5A">Accès refusé · table introuvable · question hors du périmètre déclaré</text>
    <text x="420" y="468" class="body" font-size="13.5" fill="#5A5A5A">nombre de sauts entre entités supérieur à ce que la couche sémantique accepte</text>
    <text x="420" y="500" class="body" font-size="12.5" font-style="italic" fill="#4A7C59">Les échecs d'une couche sémantique prennent la forme de refus ; ceux du</text>
    <text x="420" y="518" class="body" font-size="12.5" font-style="italic" fill="#4A7C59">texte-vers-SQL brut prennent la forme de chiffres faux énoncés avec aplomb.</text>

    <text x="1106" y="474" class="mono" font-size="14" font-weight="600" letter-spacing="0.06em" fill="#4A7C59" text-anchor="end">IMMÉDIAT</text>
    <text x="1106" y="498" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="end">coûte un aller-retour</text>
  </g>

  <!-- Classe 3 -->
  <g class="interactive" data-card="couteuse" tabindex="0" role="button" aria-label="Classe 3, l'erreur coûteuse — cliquez pour les détails">
    <rect x="64" y="548" width="1072" height="106" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="548" width="5" height="106" fill="#B58A2C"/>
    <text x="94" y="580" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">CLASSE 3</text>
    <text x="94" y="610" class="display" font-size="22" font-weight="600" fill="#1A1A1A">L'erreur coûteuse</text>
    <text x="94" y="634" class="body" font-size="13" fill="#8A8478">Une réponse juste, une facture fausse.</text>

    <text x="420" y="582" class="body" font-size="13.5" fill="#5A5A5A">Balayage non borné faute de pré-agrégat ou de borne temporelle déclarée</text>
    <text x="420" y="604" class="body" font-size="13.5" fill="#5A5A5A">requête relancée en boucle par un agent qui itère sur sa propre sortie</text>
    <text x="420" y="634" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">Se traite par des plafonds d'exécution. Relève du pilotage financier.</text>

    <text x="1106" y="610" class="mono" font-size="14" font-weight="600" letter-spacing="0.06em" fill="#B58A2C" text-anchor="end">DIFFÉRÉ</text>
    <text x="1106" y="634" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="end">arrive avec la facture</text>
  </g>

  <!-- règle -->
  <g class="interactive" data-card="regle" tabindex="0" role="button" aria-label="La règle de recette — cliquez pour les détails">
    <line x1="64" y1="690" x2="1136" y2="690" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="64" y="710" width="1072" height="86" rx="3" fill="#F2EFE7"/>
    <rect x="64" y="710" width="5" height="86" fill="#1A1A1A"/>
    <text x="94" y="738" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CRITÈRE DE RECETTE</text>
    <text x="94" y="768" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Un socle prêt pour l'agentique est un socle où toute erreur est bruyante.</text>
    <text x="94" y="789" class="body" font-size="13" fill="#5A5A5A">Mesure associée : sur le jeu de questions de référence, quelle proportion des échecs passe inaperçue.</text>
  </g>
</svg>
