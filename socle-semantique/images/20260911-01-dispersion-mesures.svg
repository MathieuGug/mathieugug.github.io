<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Cinq mesures publiées de l'effet d'une couche sémantique sur l'exactitude d'un agent d'analyse : le gain est robuste partout, le niveau absolu varie de 22 à 100 %">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="760" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Cinq mesures du même effet, cinq mondes différents</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Exactitude d'un agent qui interroge un entrepôt, sans puis avec une couche sémantique.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- axe -->
  <text x="220" y="196" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">0 %</text>
  <text x="445" y="196" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">25 %</text>
  <text x="670" y="196" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">50 %</text>
  <text x="895" y="196" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">75 %</text>
  <text x="1120" y="196" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">100 %</text>
  <line x1="220" y1="210" x2="1120" y2="210" stroke="#E5E1D8" stroke-width="1"/>
  <line x1="445" y1="210" x2="445" y2="590" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 5"/>
  <line x1="670" y1="210" x2="670" y2="590" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 5"/>
  <line x1="895" y1="210" x2="895" y2="590" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 5"/>

  <text x="64" y="240" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">BANC</text>
  <text x="1136" y="240" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478" text-anchor="end">GAIN</text>

  <!-- ligne 1 : Spider 2.0, référence académique sans couche -->
  <g class="interactive" data-card="academique" tabindex="0" role="button" aria-label="Spider 2.0, référence académique — cliquez pour les détails">
    <rect x="64" y="258" width="1072" height="62" fill="#F2EFE7"/>
    <text x="80" y="284" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Spider 2.0</text>
    <text x="80" y="306" class="mono" font-size="10" letter-spacing="0.09em" fill="#8A8478">ACADÉMIQUE · ICLR 2025 · 632 TÂCHES</text>
    <circle cx="311" cy="289" r="6" fill="#FAF8F3" stroke="#5A5A5A" stroke-width="1.75"/>
    <circle cx="374" cy="289" r="6" fill="#FAF8F3" stroke="#5A5A5A" stroke-width="1.75"/>
    <text x="311" y="272" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">10,1</text>
    <text x="374" y="272" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">17,1</text>
    <text x="420" y="293" class="body" font-size="13" font-style="italic" fill="#8A8478">patrimoines réels, aucune couche sémantique fournie</text>
    <text x="1136" y="294" class="mono" font-size="12" fill="#8A8478" text-anchor="end">—</text>
  </g>

  <!-- ligne 2 : Atlan -->
  <g class="interactive" data-card="tiers" tabindex="0" role="button" aria-label="Banc Atlan AI Labs — cliquez pour les détails">
    <text x="80" y="354" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Atlan AI Labs</text>
    <text x="80" y="376" class="mono" font-size="10" letter-spacing="0.09em" fill="#8A8478">ÉDITEUR TIERS · 174 REQUÊTES</text>
    <line x1="375" y1="359" x2="404" y2="359" stroke="#1F5560" stroke-width="1.75"/>
    <path d="M 420 359 L 404 353 L 404 365 Z" fill="#1F5560"/>
    <circle cx="365" cy="359" r="6" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.75"/>
    <circle cx="420" cy="359" r="6.5" fill="#1F5560"/>
    <text x="365" y="342" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">16,1</text>
    <text x="420" y="342" class="mono" font-size="11" font-weight="600" fill="#1F5560" text-anchor="middle">22,2</text>
    <text x="1136" y="364" class="mono" font-size="12.5" fill="#1F5560" text-anchor="end">+6,1 pt</text>
  </g>

  <!-- ligne 3 : Cube, banc apparié reproductible -->
  <g class="interactive" data-card="apparie" tabindex="0" role="button" aria-label="Banc Cube apparié et reproductible — cliquez pour les détails">
    <rect x="64" y="398" width="1072" height="62" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="398" width="5" height="62" fill="#B7332C"/>
    <text x="80" y="424" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Cube</text>
    <text x="80" y="446" class="mono" font-size="10" letter-spacing="0.09em" fill="#B7332C">APPARIÉ · REPRODUCTIBLE · McNEMAR p &lt; 0,002</text>
    <line x1="667" y1="429" x2="816" y2="429" stroke="#B7332C" stroke-width="1.75"/>
    <path d="M 832 429 L 816 423 L 816 435 Z" fill="#B7332C"/>
    <circle cx="657" cy="429" r="6" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.75"/>
    <circle cx="832" cy="429" r="6.5" fill="#B7332C"/>
    <text x="657" y="412" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">46–51</text>
    <text x="832" y="412" class="mono" font-size="11" font-weight="600" fill="#B7332C" text-anchor="middle">68</text>
    <text x="1136" y="434" class="mono" font-size="12.5" font-weight="600" fill="#B7332C" text-anchor="end">+17 à +23 pt</text>
  </g>

  <!-- lignes 4 et 5 : chiffres d'éditeur -->
  <g class="interactive" data-card="editeurs" tabindex="0" role="button" aria-label="Chiffres publiés par les éditeurs — cliquez pour les détails">
    <text x="80" y="494" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Snowflake</text>
    <text x="80" y="516" class="mono" font-size="10" letter-spacing="0.09em" fill="#B58A2C">ÉDITEUR · ANNONCÉ, NON AUDITÉ</text>
    <line x1="590" y1="499" x2="992" y2="499" stroke="#B58A2C" stroke-width="1.75"/>
    <path d="M 1008 499 L 992 493 L 992 505 Z" fill="#B58A2C"/>
    <circle cx="580" cy="499" r="6" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1.75"/>
    <circle cx="1008" cy="499" r="6.5" fill="#B58A2C"/>
    <text x="580" y="482" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">~40</text>
    <text x="1008" y="482" class="mono" font-size="11" font-weight="600" fill="#B58A2C" text-anchor="middle">85–90</text>
    <text x="1136" y="504" class="mono" font-size="12.5" fill="#B58A2C" text-anchor="end">+45 pt</text>

    <text x="80" y="564" class="display" font-size="17" font-weight="600" fill="#1A1A1A">dbt Labs</text>
    <text x="80" y="586" class="mono" font-size="10" letter-spacing="0.09em" fill="#B58A2C">ÉDITEUR · PROJET DÉJÀ MODÉLISÉ</text>
    <line x1="987" y1="569" x2="1088" y2="569" stroke="#B58A2C" stroke-width="1.75"/>
    <path d="M 1104 569 L 1088 563 L 1088 575 Z" fill="#B58A2C"/>
    <circle cx="977" cy="569" r="6" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1.75"/>
    <circle cx="1104" cy="569" r="6.5" fill="#B58A2C"/>
    <text x="977" y="552" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">84–90</text>
    <text x="1104" y="552" class="mono" font-size="11" font-weight="600" fill="#B58A2C" text-anchor="middle">98–100</text>
    <text x="1136" y="574" class="mono" font-size="12.5" fill="#B58A2C" text-anchor="end">+8 à +16 pt</text>
  </g>

  <!-- bandeau de lecture -->
  <g class="interactive" data-card="delta" tabindex="0" role="button" aria-label="Comment lire la dispersion — cliquez pour les détails">
    <line x1="64" y1="620" x2="1136" y2="620" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="64" y="640" width="1072" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="640" width="5" height="86" fill="#1A1A1A"/>
    <text x="94" y="668" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QUE MESURE L'ÉCART</text>
    <text x="94" y="694" class="body" font-size="14" fill="#1A1A1A">La direction du gain est constante sur les cinq bancs. Le niveau absolu court de 22 % à 100 %, parce qu'il dépend de la difficulté du</text>
    <text x="94" y="715" class="body" font-size="14" fill="#1A1A1A">patrimoine interrogé. Un taux publié par un fournisseur décrit son jeu de démonstration ; le vôtre se mesure sur vos propres tables.</text>
  </g>
</svg>
