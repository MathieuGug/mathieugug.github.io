<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Ce que la couche sémantique déplace dans l'espace des questions : elle agrandit la zone des réponses justes et ouvre une zone de refus explicite prise sur la zone des réponses fausses">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <pattern id="hachure" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#F2EFE7"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#B8B5AE" stroke-width="1.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="760" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce que la couche sémantique déplace</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">L'espace des questions qu'un agent accepte de traiter, et ce qu'il en fait.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="200" y="196" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">TOUTES LES QUESTIONS MÉTIER POSABLES SUR LE PATRIMOINE</text>

  <!-- État 1 : sans couche sémantique -->
  <g class="interactive" data-card="avant" tabindex="0" role="button" aria-label="Sans couche sémantique — cliquez pour les détails">
    <text x="64" y="248" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">ÉTAT 1</text>
    <text x="64" y="278" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Sans couche</text>
    <text x="64" y="300" class="display" font-size="20" font-weight="600" fill="#1A1A1A">sémantique</text>
    <text x="64" y="324" class="body" font-size="12.5" fill="#8A8478">L'agent tente tout.</text>

    <rect x="200" y="232" width="432" height="76" rx="2" fill="#4A7C59"/>
    <rect x="632" y="232" width="468" height="76" rx="2" fill="#B7332C"/>
    <text x="416" y="266" class="display" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Réponse juste</text>
    <text x="416" y="290" class="mono" font-size="14" fill="#FFFFFF" text-anchor="middle">46 – 51 %</text>
    <text x="866" y="266" class="display" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Réponse fausse, aucun signal</text>
    <text x="866" y="290" class="mono" font-size="14" fill="#FFFFFF" text-anchor="middle">la moitié restante</text>
    <text x="1100" y="330" class="body" font-size="12.5" font-style="italic" fill="#8A8478" text-anchor="end">Aucune zone de refus : toute question reçoit un chiffre.</text>
  </g>

  <!-- flèche -->
  <line x1="650" y1="360" x2="650" y2="398" stroke="#1A1A1A" stroke-width="1.75"/>
  <path d="M 650 414 L 644 398 L 656 398 Z" fill="#1A1A1A"/>
  <text x="676" y="384" class="mono" font-size="11" letter-spacing="0.09em" fill="#1A1A1A">DÉCLARATION DES INDICATEURS, DES JOINTURES ET DES CONVENTIONS</text>

  <!-- État 2 : avec couche sémantique -->
  <g class="interactive" data-card="apres" tabindex="0" role="button" aria-label="Avec couche sémantique — cliquez pour les détails">
    <text x="64" y="452" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ÉTAT 2</text>
    <text x="64" y="482" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Avec couche</text>
    <text x="64" y="504" class="display" font-size="20" font-weight="600" fill="#1A1A1A">sémantique</text>
    <text x="64" y="528" class="body" font-size="12.5" fill="#8A8478">L'agent tente moins.</text>

    <rect x="200" y="436" width="612" height="76" rx="2" fill="#4A7C59"/>
    <rect x="812" y="436" width="180" height="76" fill="#B7332C"/>
    <text x="506" y="470" class="display" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Réponse juste</text>
    <text x="506" y="494" class="mono" font-size="14" fill="#FFFFFF" text-anchor="middle">≈ 68 %</text>
    <text x="902" y="478" class="body" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Fausse,</text>
    <text x="902" y="496" class="body" font-size="12.5" fill="#FFFFFF" text-anchor="middle">sans signal</text>
  </g>

  <g class="interactive" data-card="zone-refus" tabindex="0" role="button" aria-label="La zone de refus explicite — cliquez pour les détails">
    <rect x="992" y="436" width="108" height="76" fill="url(#hachure)" stroke="#8A8478" stroke-width="1.25"/>
    <text x="1046" y="470" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="middle">Refus</text>
    <text x="1046" y="488" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="middle">explicite</text>
    <line x1="1046" y1="522" x2="1046" y2="548" stroke="#8A8478" stroke-width="1"/>
    <text x="1100" y="566" class="body" font-size="12.5" font-style="italic" fill="#8A8478" text-anchor="end">Zone nouvelle, prise sur le rouge. C'est l'effet recherché.</text>
  </g>

  <!-- l'arbitrage -->
  <g class="interactive" data-card="zone-fausse" tabindex="0" role="button" aria-label="L'arbitrage couverture contre fiabilité — cliquez pour les détails">
    <line x1="64" y1="606" x2="1136" y2="606" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="64" y="626" width="524" height="106" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="626" width="5" height="106" fill="#4A7C59"/>
    <text x="94" y="654" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">CE QU'ON GAGNE</text>
    <text x="94" y="682" class="display" font-size="18" font-weight="600" fill="#1A1A1A">De la fiabilité</text>
    <text x="94" y="706" class="body" font-size="13" fill="#5A5A5A">Une partie des réponses fausses devient un refus.</text>
    <text x="94" y="725" class="body" font-size="13" fill="#5A5A5A">Les modèles convergent : le choix du modèle pèse moins.</text>

    <rect x="612" y="626" width="524" height="106" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="612" y="626" width="5" height="106" fill="#B58A2C"/>
    <text x="642" y="654" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">CE QU'ON PAIE</text>
    <text x="642" y="682" class="display" font-size="18" font-weight="600" fill="#1A1A1A">De la couverture</text>
    <text x="642" y="706" class="body" font-size="13" fill="#5A5A5A">Des questions légitimes sortent du périmètre outillé</text>
    <text x="642" y="725" class="body" font-size="13" fill="#5A5A5A">et repassent par un analyste.</text>
  </g>
</svg>
