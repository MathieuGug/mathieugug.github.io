<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Les trois états d'une définition métier : implicite, documentée, opposable. Seul le passage de documentée à opposable change quelque chose pour un agent">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Les trois états d'une définition métier</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un glossaire que rien n'exécute reste un document d'intention.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- État 1 -->
  <g class="interactive" data-card="implicite" tabindex="0" role="button" aria-label="État implicite — cliquez pour les détails">
    <rect x="64" y="198" width="310" height="304" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="198" width="310" height="5" fill="#B8B5AE"/>
    <text x="90" y="234" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">ÉTAT 1</text>
    <text x="90" y="266" class="display" font-size="24" font-weight="600" fill="#1A1A1A">Implicite</text>
    <text x="90" y="292" class="body" font-size="13" fill="#5A5A5A">Dans le SQL d'un rapport et</text>
    <text x="90" y="311" class="body" font-size="13" fill="#5A5A5A">dans la tête de son auteur.</text>
    <line x1="90" y1="332" x2="348" y2="332" stroke="#E5E1D8" stroke-width="1"/>
    <text x="90" y="356" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">COÛT DE PRODUCTION</text>
    <text x="90" y="378" class="body" font-size="13.5" fill="#1A1A1A">Nul</text>
    <text x="90" y="408" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">OPPOSABILITÉ</text>
    <text x="90" y="430" class="body" font-size="13.5" fill="#1A1A1A">Aucune</text>
    <text x="90" y="460" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">CE QUE L'AGENT EN FAIT</text>
    <text x="90" y="482" class="body" font-size="13.5" fill="#B7332C">Rien : il devine</text>
  </g>

  <line x1="382" y1="350" x2="424" y2="350" stroke="#5A5A5A" stroke-width="1.75"/>
  <path d="M 440 350 L 424 344 L 424 356 Z" fill="#5A5A5A"/>
  <text x="411" y="334" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">ÉCRIRE</text>
  <text x="411" y="374" class="body" font-size="11.5" font-style="italic" fill="#8A8478" text-anchor="middle">peu cher</text>

  <!-- État 2 -->
  <g class="interactive" data-card="documente" tabindex="0" role="button" aria-label="État documenté — cliquez pour les détails">
    <rect x="445" y="198" width="310" height="304" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="445" y="198" width="310" height="5" fill="#B58A2C"/>
    <text x="471" y="234" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">ÉTAT 2</text>
    <text x="471" y="266" class="display" font-size="24" font-weight="600" fill="#1A1A1A">Documentée</text>
    <text x="471" y="292" class="body" font-size="13" fill="#5A5A5A">Écrite dans un glossaire ou</text>
    <text x="471" y="311" class="body" font-size="13" fill="#5A5A5A">un catalogue de données.</text>
    <line x1="471" y1="332" x2="729" y2="332" stroke="#E5E1D8" stroke-width="1"/>
    <text x="471" y="356" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">COÛT DE PRODUCTION</text>
    <text x="471" y="378" class="body" font-size="13.5" fill="#1A1A1A">Modéré, un chantier de saisie</text>
    <text x="471" y="408" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">OPPOSABILITÉ</text>
    <text x="471" y="430" class="body" font-size="13.5" fill="#1A1A1A">Nulle : un rapport peut la</text>
    <text x="471" y="448" class="body" font-size="13.5" fill="#1A1A1A">contredire sans obstacle</text>
    <text x="471" y="474" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">CE QUE L'AGENT EN FAIT</text>
    <text x="471" y="493" class="body" font-size="13.5" fill="#B58A2C">Il la lit, sans y être tenu</text>
  </g>

  <line x1="763" y1="350" x2="805" y2="350" stroke="#B7332C" stroke-width="2.25"/>
  <path d="M 821 350 L 805 343 L 805 357 Z" fill="#B7332C"/>
  <text x="792" y="334" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C" text-anchor="middle">ARBITRER</text>
  <text x="792" y="374" class="body" font-size="11.5" font-style="italic" fill="#B7332C" text-anchor="middle">le seul pas qui coûte</text>

  <!-- État 3 -->
  <g class="interactive" data-card="opposable" tabindex="0" role="button" aria-label="État opposable — cliquez pour les détails">
    <rect x="826" y="198" width="310" height="304" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="826" y="198" width="310" height="5" fill="#B7332C"/>
    <text x="852" y="234" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ÉTAT 3</text>
    <text x="852" y="266" class="display" font-size="24" font-weight="600" fill="#1A1A1A">Opposable</text>
    <text x="852" y="292" class="body" font-size="13" fill="#5A5A5A">Objet exécutable, versionné,</text>
    <text x="852" y="311" class="body" font-size="13" fill="#5A5A5A">avec un propriétaire nommé.</text>
    <line x1="852" y1="332" x2="1110" y2="332" stroke="#E5E1D8" stroke-width="1"/>
    <text x="852" y="356" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">COÛT DE PRODUCTION</text>
    <text x="852" y="378" class="body" font-size="13.5" fill="#1A1A1A">Politique : il faut trancher</text>
    <text x="852" y="408" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">OPPOSABILITÉ</text>
    <text x="852" y="430" class="body" font-size="13.5" fill="#1A1A1A">La contredire suppose un objet</text>
    <text x="852" y="448" class="body" font-size="13.5" fill="#1A1A1A">concurrent, donc visible</text>
    <text x="852" y="474" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">CE QUE L'AGENT EN FAIT</text>
    <text x="852" y="493" class="body" font-size="13.5" fill="#4A7C59">Il calcule depuis cet objet</text>
  </g>

  <!-- ce que le format ne fournit pas -->
  <g class="interactive" data-card="proprietaire" tabindex="0" role="button" aria-label="Ce que le format ne fournit pas — cliquez pour les détails">
    <line x1="64" y1="546" x2="1136" y2="546" stroke="#E5E1D8" stroke-width="1"/>
    <text x="64" y="576" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">LES OBJETS QUI PORTENT L'ÉTAT 3 EXISTENT CHEZ TOUS LES GRANDS FOURNISSEURS</text>

    <rect x="64" y="594" width="340" height="72" rx="3" fill="#F2EFE7"/>
    <text x="88" y="622" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Vues sémantiques</text>
    <text x="88" y="646" class="body" font-size="12.5" fill="#5A5A5A">Objet de schéma : faits, dimensions,</text>
    <text x="88" y="662" class="body" font-size="12.5" fill="#5A5A5A">indicateurs, relations.</text>

    <rect x="430" y="594" width="340" height="72" rx="3" fill="#F2EFE7"/>
    <text x="454" y="622" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Vues de métriques</text>
    <text x="454" y="646" class="body" font-size="12.5" fill="#5A5A5A">Définition déclarative, recalcul</text>
    <text x="454" y="662" class="body" font-size="12.5" fill="#5A5A5A">déterministe au moment de la requête.</text>

    <rect x="796" y="594" width="340" height="72" rx="3" fill="#F2EFE7"/>
    <text x="820" y="622" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Indicateurs en YAML</text>
    <text x="820" y="646" class="body" font-size="12.5" fill="#5A5A5A">Définis une fois, versionnés, servis</text>
    <text x="820" y="662" class="body" font-size="12.5" fill="#5A5A5A">à tous les consommateurs.</text>

    <rect x="64" y="692" width="1072" height="80" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="692" width="5" height="80" fill="#B7332C"/>
    <text x="94" y="720" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QU'AUCUN DE CES FORMATS NE FOURNIT</text>
    <text x="94" y="748" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le propriétaire, la procédure de modification, le sort des séries historiques.</text>
    <text x="94" y="768" class="body" font-size="13" fill="#5A5A5A">Ces règles se prennent dans une instance et s'écrivent dans une note. La technique ne les produit pas.</text>
  </g>
</svg>
