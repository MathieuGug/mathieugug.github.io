<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" role="img" aria-label="Six décisions de préparation d'un socle data pour l'agentique, classées par le volume d'erreurs silencieuses qu'elles rendent visibles rapporté à leur coût">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="870" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Six décisions, classées par ce qu'elles rendent bruyant</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chacune se prend séparément. Aucune ne suppose d'avoir choisi une plateforme.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- D1 -->
  <g class="interactive" data-card="d1" tabindex="0" role="button" aria-label="Décision 1, le jeu de questions de référence — cliquez pour les détails">
    <rect x="64" y="188" width="524" height="196" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="188" width="5" height="196" fill="#B7332C"/>
    <text x="90" y="218" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">D1</text>
    <text x="562" y="218" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">RENDEMENT ÉLEVÉ</text>
    <text x="90" y="250" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Un jeu de questions de référence</text>
    <text x="90" y="278" class="body" font-size="13.5" fill="#5A5A5A">Trente à cent questions métier réelles, chacune avec la réponse</text>
    <text x="90" y="297" class="body" font-size="13.5" fill="#5A5A5A">que l'entreprise tient pour juste, exécutable sur le patrimoine réel.</text>
    <line x1="90" y1="316" x2="562" y2="316" stroke="#E5E1D8" stroke-width="1"/>
    <text x="90" y="338" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">COÛT</text>
    <text x="90" y="358" class="body" font-size="13" fill="#1A1A1A">Quelques jours d'analyste</text>
    <text x="330" y="338" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">EFFET</text>
    <text x="330" y="358" class="body" font-size="13" fill="#1A1A1A">Donne le seul taux qui engage</text>
    <text x="330" y="375" class="body" font-size="13" fill="#1A1A1A">une décision. Actif qui reste à vous.</text>
  </g>

  <!-- D2 -->
  <g class="interactive" data-card="d2" tabindex="0" role="button" aria-label="Décision 2, le propriétaire métier — cliquez pour les détails">
    <rect x="612" y="188" width="524" height="196" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="612" y="188" width="5" height="196" fill="#B7332C"/>
    <text x="638" y="218" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">D2</text>
    <text x="1110" y="218" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">RENDEMENT ÉLEVÉ</text>
    <text x="638" y="250" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Un propriétaire métier par famille</text>
    <text x="638" y="278" class="body" font-size="13.5" fill="#5A5A5A">Une personne, pas un comité : le droit de trancher entre deux</text>
    <text x="638" y="297" class="body" font-size="13.5" fill="#5A5A5A">définitions concurrentes, et le devoir de motiver l'arbitrage.</text>
    <line x1="638" y1="316" x2="1110" y2="316" stroke="#E5E1D8" stroke-width="1"/>
    <text x="638" y="338" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">COÛT</text>
    <text x="638" y="358" class="body" font-size="13" fill="#1A1A1A">Politique</text>
    <text x="878" y="338" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">EFFET</text>
    <text x="878" y="358" class="body" font-size="13" fill="#1A1A1A">Débloque le seul chantier que</text>
    <text x="878" y="375" class="body" font-size="13" fill="#1A1A1A">la technique ne fait pas à votre place.</text>
  </g>

  <!-- D3 -->
  <g class="interactive" data-card="d3" tabindex="0" role="button" aria-label="Décision 3, l'identité propagée dès le pilote — cliquez pour les détails">
    <rect x="64" y="404" width="524" height="196" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="404" width="5" height="196" fill="#1F5560"/>
    <text x="90" y="434" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">D3</text>
    <text x="562" y="434" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#1F5560" text-anchor="end">FENÊTRE : AVANT LE PILOTE</text>
    <text x="90" y="466" class="display" font-size="20" font-weight="600" fill="#1A1A1A">L'identité propagée dès le pilote</text>
    <text x="90" y="494" class="body" font-size="13.5" fill="#5A5A5A">Aucune expérimentation sous compte de service au-delà d'un</text>
    <text x="90" y="513" class="body" font-size="13.5" fill="#5A5A5A">jeu de données public.</text>
    <line x1="90" y1="532" x2="562" y2="532" stroke="#E5E1D8" stroke-width="1"/>
    <text x="90" y="554" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">COÛT</text>
    <text x="90" y="574" class="body" font-size="13" fill="#1A1A1A">Quelques semaines de pilote</text>
    <text x="330" y="554" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">EFFET</text>
    <text x="330" y="574" class="body" font-size="13" fill="#1A1A1A">Évite une démonstration réussie sur</text>
    <text x="330" y="591" class="body" font-size="13" fill="#1A1A1A">une architecture qui ne passera pas.</text>
  </g>

  <!-- D4 -->
  <g class="interactive" data-card="d4" tabindex="0" role="button" aria-label="Décision 4, déclarer le périmètre — cliquez pour les détails">
    <rect x="612" y="404" width="524" height="196" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="612" y="404" width="5" height="196" fill="#1F5560"/>
    <text x="638" y="434" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">D4</text>
    <text x="1110" y="434" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#1F5560" text-anchor="end">RENDEMENT MOYEN</text>
    <text x="638" y="466" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Écrire ce que l'agent refuse</text>
    <text x="638" y="494" class="body" font-size="13.5" fill="#5A5A5A">La liste des questions hors périmètre est un livrable au même</text>
    <text x="638" y="513" class="body" font-size="13.5" fill="#5A5A5A">titre que la liste des indicateurs.</text>
    <line x1="638" y1="532" x2="1110" y2="532" stroke="#E5E1D8" stroke-width="1"/>
    <text x="638" y="554" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">COÛT</text>
    <text x="638" y="574" class="body" font-size="13" fill="#1A1A1A">Faible</text>
    <text x="878" y="554" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">EFFET</text>
    <text x="878" y="574" class="body" font-size="13" fill="#1A1A1A">Transforme en refus explicite ce qui</text>
    <text x="878" y="591" class="body" font-size="13" fill="#1A1A1A">serait sorti en chiffre plausible.</text>
  </g>

  <!-- D5 -->
  <g class="interactive" data-card="d5" tabindex="0" role="button" aria-label="Décision 5, écrire les conventions implicites — cliquez pour les détails">
    <rect x="64" y="620" width="524" height="196" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="620" width="5" height="196" fill="#B7332C"/>
    <text x="90" y="650" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">D5</text>
    <text x="562" y="650" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">MEILLEUR RENDEMENT PAR JOUR</text>
    <text x="90" y="682" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Les conventions avant les indicateurs</text>
    <text x="90" y="710" class="body" font-size="13.5" fill="#5A5A5A">Codes techniques porteurs de sens métier, tables gelées, granularité</text>
    <text x="90" y="729" class="body" font-size="13.5" fill="#5A5A5A">des instantanés, exercice fiscal, périmètre par défaut.</text>
    <line x1="90" y1="748" x2="562" y2="748" stroke="#E5E1D8" stroke-width="1"/>
    <text x="90" y="770" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">COÛT</text>
    <text x="90" y="790" class="body" font-size="13" fill="#1A1A1A">Quelques jours d'entretien</text>
    <text x="90" y="807" class="body" font-size="13" fill="#1A1A1A">avec les analystes qui savent</text>
    <text x="330" y="770" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">EFFET</text>
    <text x="330" y="790" class="body" font-size="13" fill="#1A1A1A">Exactement ce qu'aucune génération</text>
    <text x="330" y="807" class="body" font-size="13" fill="#1A1A1A">automatique ne peut deviner.</text>
  </g>

  <!-- D6 -->
  <g class="interactive" data-card="d6" tabindex="0" role="button" aria-label="Décision 6, budgéter la maintenance sémantique — cliquez pour les détails">
    <rect x="612" y="620" width="524" height="196" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="612" y="620" width="5" height="196" fill="#B58A2C"/>
    <text x="638" y="650" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">D6</text>
    <text x="1110" y="650" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B58A2C" text-anchor="end">RÉCURRENT</text>
    <text x="638" y="682" class="display" font-size="20" font-weight="600" fill="#1A1A1A">La maintenance sémantique</text>
    <text x="638" y="710" class="body" font-size="13.5" fill="#5A5A5A">Une définition se périme : nouvelle offre, changement de périmètre,</text>
    <text x="638" y="729" class="body" font-size="13.5" fill="#5A5A5A">refonte d'un système source.</text>
    <line x1="638" y1="748" x2="1110" y2="748" stroke="#E5E1D8" stroke-width="1"/>
    <text x="638" y="770" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">COÛT</text>
    <text x="638" y="790" class="body" font-size="13" fill="#1A1A1A">Une ligne budgétaire annuelle</text>
    <text x="878" y="770" class="mono" font-size="10" letter-spacing="0.08em" fill="#8A8478">EFFET</text>
    <text x="878" y="790" class="body" font-size="13" fill="#1A1A1A">Une couche non entretenue devient</text>
    <text x="878" y="807" class="body" font-size="13" fill="#1A1A1A">un glossaire faux, mais exécuté.</text>
  </g>

  <line x1="64" y1="844" x2="1136" y2="844" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="864" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Décision de calendrier qui s'en déduit : écrire, avant que l'usage ne le décide par défaut, quelle classe de décisions a le droit de s'appuyer sur une réponse d'agent non revue.</text>
</svg>
