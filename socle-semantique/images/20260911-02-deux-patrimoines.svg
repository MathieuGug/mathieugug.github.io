<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Le même modèle résout 86,6 % des tâches sur des bases académiques et 10,1 % sur des patrimoines d'entreprise : l'exactitude mesure le patrimoine avant de mesurer le modèle">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le même modèle, trois patrimoines</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Taux de tâches résolues. Ni le modèle ni l'énoncé ne changent d'une ligne à l'autre.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">BANC ET NATURE DES BASES</text>
  <text x="1136" y="192" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478" text-anchor="end">TÂCHES RÉSOLUES</text>

  <!-- Spider 1.0 -->
  <g class="interactive" data-card="spider1" tabindex="0" role="button" aria-label="Spider 1.0, bases académiques — cliquez pour les détails">
    <text x="64" y="234" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Spider 1.0</text>
    <text x="64" y="256" class="body" font-size="13" fill="#8A8478">Bases académiques, quelques tables, construites pour l'exercice</text>
    <rect x="340" y="272" width="658" height="40" rx="2" fill="#4A7C59"/>
    <text x="1136" y="300" class="mono" font-size="20" font-weight="600" fill="#4A7C59" text-anchor="end">86,6 %</text>
  </g>

  <!-- BIRD -->
  <g class="interactive" data-card="bird" tabindex="0" role="button" aria-label="BIRD, bases réalistes — cliquez pour les détails">
    <text x="64" y="366" class="display" font-size="19" font-weight="600" fill="#1A1A1A">BIRD</text>
    <text x="64" y="388" class="body" font-size="13" fill="#8A8478">Bases réalistes, valeurs sales, quelques conventions implicites</text>
    <rect x="340" y="404" width="436" height="40" rx="2" fill="#B58A2C"/>
    <text x="1136" y="432" class="mono" font-size="20" font-weight="600" fill="#B58A2C" text-anchor="end">57,4 %</text>
  </g>

  <!-- Spider 2.0 -->
  <g class="interactive" data-card="spider2" tabindex="0" role="button" aria-label="Spider 2.0, patrimoines d'entreprise — cliquez pour les détails">
    <text x="64" y="498" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Spider 2.0</text>
    <text x="64" y="520" class="body" font-size="13" fill="#8A8478">Patrimoines d'entreprise réels, plus de 1 000 colonnes par base</text>
    <rect x="340" y="536" width="77" height="40" rx="2" fill="#B7332C"/>
    <text x="433" y="563" class="mono" font-size="12.5" fill="#8A8478">modèle de raisonnement : 17,1 %</text>
    <text x="1136" y="564" class="mono" font-size="20" font-weight="600" fill="#B7332C" text-anchor="end">10,1 %</text>
  </g>

  <line x1="340" y1="264" x2="340" y2="590" stroke="#E5E1D8" stroke-width="1"/>

  <!-- bandeau : ce qui a changé -->
  <g class="interactive" data-card="schema-reel" tabindex="0" role="button" aria-label="Ce que contient un patrimoine réel — cliquez pour les détails">
    <line x1="64" y1="620" x2="1136" y2="620" stroke="#E5E1D8" stroke-width="1"/>
    <text x="64" y="650" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QUI A CHANGÉ ENTRE LA PREMIÈRE LIGNE ET LA DERNIÈRE</text>

    <rect x="64" y="666" width="256" height="82" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="84" y="694" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Le nombre de colonnes</text>
    <text x="84" y="716" class="body" font-size="12.5" fill="#5A5A5A">De quelques dizaines à plus de</text>
    <text x="84" y="734" class="body" font-size="12.5" fill="#5A5A5A">mille par base.</text>

    <rect x="336" y="666" width="256" height="82" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="356" y="694" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Les dialectes</text>
    <text x="356" y="716" class="body" font-size="12.5" fill="#5A5A5A">Plusieurs moteurs cohabitent</text>
    <text x="356" y="734" class="body" font-size="12.5" fill="#5A5A5A">dans le même patrimoine.</text>

    <rect x="608" y="666" width="256" height="82" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="628" y="694" class="display" font-size="16" font-weight="600" fill="#1A1A1A">La longueur</text>
    <text x="628" y="716" class="body" font-size="12.5" fill="#5A5A5A">Les requêtes de référence</text>
    <text x="628" y="734" class="body" font-size="12.5" fill="#5A5A5A">dépassent souvent 100 lignes.</text>

    <rect x="880" y="666" width="256" height="82" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <text x="900" y="694" class="display" font-size="16" font-weight="600" fill="#B7332C">Le non-écrit</text>
    <text x="900" y="716" class="body" font-size="12.5" fill="#5A5A5A">Conventions, périmètres, tables</text>
    <text x="900" y="734" class="body" font-size="12.5" fill="#5A5A5A">gelées : la variable décisive.</text>
  </g>
</svg>
