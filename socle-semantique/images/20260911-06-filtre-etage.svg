<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="L'étage auquel s'applique l'habilitation : au rapport dans l'informatique décisionnelle, nulle part sous compte de service, à la requête avec identité propagée">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le filtre a changé d'étage</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un agent qui écrit ses propres requêtes n'a pas de rapport intermédiaire pour filtrer ce que le lecteur voit.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">MONTAGE</text>
  <text x="320" y="192" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">CHAÎNE DE LA DEMANDE À LA DONNÉE</text>
  <text x="1136" y="192" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478" text-anchor="end">OÙ S'APPLIQUE L'HABILITATION</text>

  <!-- Rangée 1 : informatique décisionnelle -->
  <g class="interactive" data-card="bi" tabindex="0" role="button" aria-label="Informatique décisionnelle classique — cliquez pour les détails">
    <text x="64" y="234" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'informatique</text>
    <text x="64" y="256" class="display" font-size="19" font-weight="600" fill="#1A1A1A">décisionnelle</text>
    <text x="64" y="278" class="body" font-size="12.5" fill="#8A8478">Le modèle des vingt</text>
    <text x="64" y="294" class="body" font-size="12.5" fill="#8A8478">dernières années.</text>

    <rect x="320" y="218" width="150" height="60" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="395" y="245" class="body" font-size="13.5" fill="#1A1A1A" text-anchor="middle">Le lecteur</text>
    <text x="395" y="264" class="body" font-size="12" fill="#8A8478" text-anchor="middle">droits restreints</text>

    <line x1="470" y1="248" x2="494" y2="248" stroke="#5A5A5A" stroke-width="1.5"/>
    <path d="M 510 248 L 494 243 L 494 253 Z" fill="#5A5A5A"/>

    <rect x="510" y="218" width="150" height="60" rx="3" fill="#4A7C59"/>
    <text x="585" y="245" class="body" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Le rapport publié</text>
    <text x="585" y="264" class="mono" font-size="11" fill="#FFFFFF" text-anchor="middle">FILTRE ICI</text>

    <line x1="660" y1="248" x2="684" y2="248" stroke="#5A5A5A" stroke-width="1.5"/>
    <path d="M 700 248 L 684 243 L 684 253 Z" fill="#5A5A5A"/>

    <rect x="700" y="218" width="150" height="60" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="775" y="245" class="body" font-size="13.5" fill="#1A1A1A" text-anchor="middle">Requête préparée</text>
    <text x="775" y="264" class="body" font-size="12" fill="#8A8478" text-anchor="middle">accès large</text>

    <line x1="850" y1="248" x2="874" y2="248" stroke="#5A5A5A" stroke-width="1.5"/>
    <path d="M 890 248 L 874 243 L 874 253 Z" fill="#5A5A5A"/>

    <rect x="890" y="218" width="150" height="60" rx="3" fill="#F2EFE7"/>
    <text x="965" y="252" class="body" font-size="13.5" fill="#1A1A1A" text-anchor="middle">L'entrepôt</text>

    <text x="1136" y="242" class="mono" font-size="12.5" font-weight="600" fill="#4A7C59" text-anchor="end">À LA RESTITUTION</text>
    <text x="1136" y="264" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="end">tient tant qu'un rapport existe</text>
  </g>

  <!-- Rangée 2 : compte de service -->
  <g class="interactive" data-card="service-account" tabindex="0" role="button" aria-label="Agent sous compte de service — cliquez pour les détails">
    <text x="64" y="394" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'agent sous</text>
    <text x="64" y="416" class="display" font-size="19" font-weight="600" fill="#1A1A1A">compte de service</text>
    <text x="64" y="438" class="body" font-size="12.5" fill="#B7332C">Le montage de la plupart</text>
    <text x="64" y="454" class="body" font-size="12.5" fill="#B7332C">des démonstrations.</text>

    <rect x="320" y="378" width="150" height="60" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="395" y="405" class="body" font-size="13.5" fill="#1A1A1A" text-anchor="middle">Le demandeur</text>
    <text x="395" y="424" class="body" font-size="12" fill="#8A8478" text-anchor="middle">droits restreints</text>

    <line x1="470" y1="408" x2="494" y2="408" stroke="#5A5A5A" stroke-width="1.5"/>
    <path d="M 510 408 L 494 403 L 494 413 Z" fill="#5A5A5A"/>

    <rect x="510" y="378" width="150" height="60" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="585" y="405" class="body" font-size="13.5" fill="#1A1A1A" text-anchor="middle">L'agent</text>
    <text x="585" y="424" class="body" font-size="12" fill="#8A8478" text-anchor="middle">écrit sa requête</text>

    <line x1="660" y1="408" x2="684" y2="408" stroke="#B7332C" stroke-width="1.5"/>
    <path d="M 700 408 L 684 403 L 684 413 Z" fill="#B7332C"/>

    <rect x="700" y="378" width="150" height="60" rx="3" fill="#B7332C"/>
    <text x="775" y="405" class="body" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Compte de service</text>
    <text x="775" y="424" class="mono" font-size="11" fill="#FFFFFF" text-anchor="middle">IDENTITÉ PERDUE</text>

    <line x1="850" y1="408" x2="874" y2="408" stroke="#B7332C" stroke-width="1.5"/>
    <path d="M 890 408 L 874 403 L 874 413 Z" fill="#B7332C"/>

    <rect x="890" y="378" width="150" height="60" rx="3" fill="#F2EFE7"/>
    <text x="965" y="412" class="body" font-size="13.5" fill="#1A1A1A" text-anchor="middle">L'entrepôt</text>

    <text x="1136" y="402" class="mono" font-size="12.5" font-weight="600" fill="#B7332C" text-anchor="end">NULLE PART</text>
    <text x="1136" y="424" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="end">chacun hérite des droits du compte</text>
  </g>

  <!-- Rangée 3 : identité propagée -->
  <g class="interactive" data-card="identite-propagee" tabindex="0" role="button" aria-label="Agent à identité propagée — cliquez pour les détails">
    <text x="64" y="554" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'agent à identité</text>
    <text x="64" y="576" class="display" font-size="19" font-weight="600" fill="#1A1A1A">propagée</text>
    <text x="64" y="598" class="body" font-size="12.5" fill="#4A7C59">Le seul montage qui passe</text>
    <text x="64" y="614" class="body" font-size="12.5" fill="#4A7C59">en production.</text>

    <rect x="320" y="538" width="150" height="60" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="395" y="565" class="body" font-size="13.5" fill="#1A1A1A" text-anchor="middle">Le demandeur</text>
    <text x="395" y="584" class="body" font-size="12" fill="#8A8478" text-anchor="middle">authentifié</text>

    <line x1="470" y1="568" x2="494" y2="568" stroke="#4A7C59" stroke-width="1.5"/>
    <path d="M 510 568 L 494 563 L 494 573 Z" fill="#4A7C59"/>

    <rect x="510" y="538" width="150" height="60" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="585" y="565" class="body" font-size="13.5" fill="#1A1A1A" text-anchor="middle">L'agent</text>
    <text x="585" y="584" class="body" font-size="12" fill="#8A8478" text-anchor="middle">écrit sa requête</text>

    <line x1="660" y1="568" x2="684" y2="568" stroke="#4A7C59" stroke-width="1.5"/>
    <path d="M 700 568 L 684 563 L 684 573 Z" fill="#4A7C59"/>

    <rect x="700" y="538" width="150" height="60" rx="3" fill="#FFFFFF" stroke="#4A7C59" stroke-width="1.5"/>
    <text x="775" y="565" class="body" font-size="13.5" fill="#1A1A1A" text-anchor="middle">Jeton délégué</text>
    <text x="775" y="584" class="mono" font-size="11" fill="#4A7C59" text-anchor="middle">IDENTITÉ CONSERVÉE</text>

    <line x1="850" y1="568" x2="874" y2="568" stroke="#4A7C59" stroke-width="1.5"/>
    <path d="M 890 568 L 874 563 L 874 573 Z" fill="#4A7C59"/>

    <rect x="890" y="538" width="150" height="60" rx="3" fill="#4A7C59"/>
    <text x="965" y="565" class="body" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">L'entrepôt</text>
    <text x="965" y="584" class="mono" font-size="11" fill="#FFFFFF" text-anchor="middle">FILTRE ICI</text>

    <text x="1136" y="562" class="mono" font-size="12.5" font-weight="600" fill="#4A7C59" text-anchor="end">À LA REQUÊTE</text>
    <text x="1136" y="584" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="end">règles au niveau des lignes et des colonnes</text>
  </g>

  <!-- bandeau -->
  <g class="interactive" data-card="compilation" tabindex="0" role="button" aria-label="Compiler la règle plutôt que la vérifier — cliquez pour les détails">
    <line x1="64" y1="650" x2="1136" y2="650" stroke="#E5E1D8" stroke-width="1"/>

    <rect x="64" y="670" width="524" height="130" rx="3" fill="#F2EFE7"/>
    <text x="88" y="698" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">L'ÉTAT DU PARC · 235 RESPONSABLES SÉCURITÉ INTERROGÉS</text>
    <text x="88" y="728" class="mono" font-size="22" font-weight="600" fill="#B7332C">92 %</text>
    <text x="152" y="728" class="body" font-size="13.5" fill="#1A1A1A">sans visibilité complète sur leurs identités d'IA</text>
    <text x="88" y="758" class="mono" font-size="22" font-weight="600" fill="#B7332C">86 %</text>
    <text x="152" y="758" class="body" font-size="13.5" fill="#1A1A1A">sans politique d'habilitation appliquée à ces identités</text>
    <text x="88" y="788" class="mono" font-size="22" font-weight="600" fill="#B7332C">16 %</text>
    <text x="152" y="788" class="body" font-size="13.5" fill="#1A1A1A">estiment gouverner cet accès de façon effective</text>

    <rect x="612" y="670" width="524" height="130" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="612" y="670" width="5" height="130" fill="#1A1A1A"/>
    <text x="642" y="698" class="mono" font-size="11" letter-spacing="0.1em" fill="#1A1A1A">LA CONSÉQUENCE ARCHITECTURALE</text>
    <text x="642" y="728" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Compiler la règle dans la requête,</text>
    <text x="642" y="750" class="display" font-size="18" font-weight="600" fill="#1A1A1A">au lieu de la vérifier après coup.</text>
    <text x="642" y="776" class="body" font-size="13" fill="#5A5A5A">La couche sémantique est l'objet que l'agent traverse</text>
    <text x="642" y="794" class="body" font-size="13" fill="#5A5A5A">obligatoirement : c'est le bon endroit pour l'y poser.</text>
  </g>
</svg>
