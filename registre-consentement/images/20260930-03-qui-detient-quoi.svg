<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Qui détient quoi dans la chaîne du consentement : ce que chaque acteur conserve, et le trou documentaire au milieu">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="ah03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8A8478"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Qui détient quoi dans la chaîne</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque acteur conserve ce dont il a besoin. Personne ne conserve ce qui sert à démontrer.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">ACTEUR</text>
  <text x="430" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL CONSERVE</text>
  <text x="800" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL NE CONSERVE PAS</text>
  <text x="1106" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">CHARGE DE LA PREUVE</text>

  <!-- Acteur 1 : utilisateur -->
  <rect x="64" y="206" width="1072" height="82" rx="3" fill="#F2EEE4" stroke="#E5E1D8" stroke-width="1.25"/>
  <rect x="64" y="206" width="5" height="82" fill="#C9C3B6"/>
  <text x="94" y="238" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'utilisateur</text>
  <text x="94" y="262" class="body" font-size="12" fill="#8A8478">Un souvenir approximatif</text>
  <text x="430" y="244" class="body" font-size="13.5" fill="#5A5A5A">Rien de vérifiable. Il n'a ni copie de l'écran, ni horodatage.</text>
  <text x="800" y="244" class="body" font-size="13.5" fill="#5A5A5A">Tout.</text>
  <text x="1106" y="250" class="mono" font-size="12" letter-spacing="0.08em" fill="#8A8478" text-anchor="end">AUCUNE</text>

  <!-- Acteur 2 : plateforme de recueil -->
  <g class="interactive" data-card="outil-recueil" tabindex="0" role="button" aria-label="La plateforme de recueil — cliquez pour les détails">
    <rect x="64" y="300" width="1072" height="112" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="300" width="5" height="112" fill="#4A7C59"/>
    <text x="94" y="332" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La plateforme de recueil</text>
    <text x="94" y="356" class="body" font-size="12" fill="#8A8478">Prestataire technique</text>
    <text x="94" y="378" class="body" font-size="12" fill="#8A8478">sous contrat</text>
    <text x="430" y="332" class="body" font-size="13.5" fill="#5A5A5A">Le choix de chaque visiteur, par finalité et par fournisseur.</text>
    <text x="430" y="354" class="body" font-size="13.5" fill="#5A5A5A">L'état courant de son propre paramétrage.</text>
    <text x="430" y="382" class="body" font-size="12.5" font-style="italic" fill="#4A7C59">Six mois est une bonne pratique admise pour les choix.</text>
    <text x="800" y="332" class="body" font-size="13.5" fill="#5A5A5A">L'historique de ses configurations</text>
    <text x="800" y="354" class="body" font-size="13.5" fill="#5A5A5A">successives. Le rendu affiché.</text>
    <text x="800" y="382" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">Sauf si le contrat l'exige.</text>
    <text x="1106" y="362" class="mono" font-size="12" letter-spacing="0.08em" fill="#4A7C59" text-anchor="end">AUCUNE</text>
  </g>

  <!-- Acteur 3 : éditeur -->
  <g class="interactive" data-card="editeur" tabindex="0" role="button" aria-label="L'éditeur responsable du traitement — cliquez pour les détails">
    <rect x="64" y="424" width="1072" height="130" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="424" width="5" height="130" fill="#B7332C"/>
    <text x="94" y="456" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'éditeur</text>
    <text x="94" y="480" class="body" font-size="12" fill="#8A8478">Responsable</text>
    <text x="94" y="502" class="body" font-size="12" fill="#8A8478">du traitement</text>
    <text x="430" y="456" class="body" font-size="13.5" fill="#5A5A5A">Le code de son site, dans son gestionnaire de versions.</text>
    <text x="430" y="478" class="body" font-size="13.5" fill="#5A5A5A">Ses tableaux de bord de performance, sans annotation.</text>
    <text x="430" y="506" class="body" font-size="12.5" font-style="italic" fill="#B7332C">La conformité progresse sous l'effet des éditeurs, pas de</text>
    <text x="430" y="526" class="body" font-size="12.5" font-style="italic" fill="#B7332C">leurs prestataires : 2,94 % → 30,66 % de refus en un clic.</text>
    <text x="800" y="456" class="body" font-size="13.5" fill="#B7332C">Le rendu daté de sa bannière.</text>
    <text x="800" y="478" class="body" font-size="13.5" fill="#B7332C">L'historique du paramétrage.</text>
    <text x="800" y="500" class="body" font-size="13.5" fill="#B7332C">La série de ses taux.</text>
    <text x="800" y="528" class="body" font-size="12.5" font-style="italic" fill="#B7332C">C'est exactement ce qu'on lui demandera.</text>
    <text x="1106" y="496" class="mono" font-size="12.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">ENTIÈRE</text>
  </g>

  <!-- Acteur 4 : plateformes aval -->
  <g class="interactive" data-card="plateforme" tabindex="0" role="button" aria-label="Les plateformes en aval — cliquez pour les détails">
    <rect x="64" y="566" width="1072" height="112" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="566" width="5" height="112" fill="#B58A2C"/>
    <text x="94" y="598" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Les plateformes</text>
    <text x="94" y="622" class="body" font-size="12" fill="#8A8478">Régies, mesure,</text>
    <text x="94" y="644" class="body" font-size="12" fill="#8A8478">places de marché</text>
    <text x="430" y="598" class="body" font-size="13.5" fill="#5A5A5A">Le signal de consentement reçu à chaque appel.</text>
    <text x="430" y="620" class="body" font-size="13.5" fill="#5A5A5A">Leurs propres modèles d'estimation, non restituables.</text>
    <text x="430" y="648" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">Et une clause qui reporte l'archivage sur le client.</text>
    <text x="800" y="598" class="body" font-size="13.5" fill="#5A5A5A">Ce qui était affiché chez le client.</text>
    <text x="800" y="620" class="body" font-size="13.5" fill="#5A5A5A">La date d'activation de leur</text>
    <text x="800" y="642" class="body" font-size="13.5" fill="#5A5A5A">propre modélisation.</text>
    <text x="1106" y="628" class="mono" font-size="12" letter-spacing="0.08em" fill="#B58A2C" text-anchor="end">REPORTÉE</text>
  </g>

  <!-- Le trou -->
  <g class="interactive" data-card="trou" tabindex="0" role="button" aria-label="Le trou documentaire — cliquez pour les détails">
    <rect x="64" y="702" width="1072" height="86" rx="3" fill="#1A1A1A"/>
    <text x="94" y="734" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">LE TROU</text>
    <text x="94" y="764" class="display" font-size="20" font-weight="600" fill="#FAF8F3">Deux acteurs exigent la même pièce, aucun ne la produit, et celui qui doit la produire ne l'a pas.</text>
  </g>

  <text x="64" y="822" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">SOURCES : RGPD ART. 7 · POLITIQUE DE CONSENTEMENT UE DE GOOGLE · ÉTUDE LONGITUDINALE 11 364 SITES, 30 PAYS, 2018-2024</text>
</svg>
