<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-label="D'où vient la variation : quatre explications concurrentes d'une baisse de conversions, et la pièce qu'il faut avoir conservée pour trancher chaque branche">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="ah05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8A8478"/>
    </marker>
  </defs>

  <rect width="1200" height="860" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">D'où vient la variation ?</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre causes produisent la même courbe. Une seule série datée permet de les séparer.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Observation -->
  <rect x="64" y="186" width="266" height="96" rx="3" fill="#1A1A1A"/>
  <text x="92" y="214" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#E8B84B">OBSERVATION</text>
  <text x="92" y="244" class="display" font-size="21" font-weight="600" fill="#FAF8F3">−11 % de conversions</text>
  <text x="92" y="268" class="body" font-size="13" fill="#C9C3B6">attribuées sur un trimestre</text>

  <!-- Branches -->
  <path d="M 330 234 C 372 234 372 354 404 354" stroke="#8A8478" stroke-width="1.5" fill="none" marker-end="url(#ah05)"/>
  <path d="M 330 234 C 372 234 372 462 404 462" stroke="#8A8478" stroke-width="1.5" fill="none" marker-end="url(#ah05)"/>
  <path d="M 330 234 C 372 234 372 570 404 570" stroke="#8A8478" stroke-width="1.5" fill="none" marker-end="url(#ah05)"/>
  <path d="M 330 234 C 372 234 372 678 404 678" stroke="#8A8478" stroke-width="1.5" fill="none" marker-end="url(#ah05)"/>

  <text x="416" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">EXPLICATION RECEVABLE</text>
  <text x="1106" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">PIÈCE QUI PERMET DE TRANCHER</text>

  <!-- Branche 1 : marché -->
  <g class="interactive" data-card="branche-marche" tabindex="0" role="button" aria-label="L'explication par le marché — cliquez pour les détails">
    <rect x="416" y="314" width="720" height="80" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="416" y="314" width="5" height="80" fill="#C9C3B6"/>
    <text x="444" y="342" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Le marché</text>
    <text x="444" y="366" class="body" font-size="13" fill="#5A5A5A">Demande, concurrence, saisonnalité. L'explication par défaut en comité.</text>
    <text x="1106" y="342" class="mono" font-size="11.5" fill="#5A5A5A" text-anchor="end">DONNÉES EXTERNES</text>
    <text x="1106" y="366" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="end">Recevable seulement si les trois autres sont écartées</text>
  </g>

  <!-- Branche 2 : bannière -->
  <g class="interactive" data-card="branche-banniere" tabindex="0" role="button" aria-label="L'explication par la bannière — cliquez pour les détails">
    <rect x="416" y="422" width="720" height="80" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="416" y="422" width="5" height="80" fill="#B7332C"/>
    <text x="444" y="450" class="display" font-size="18" font-weight="600" fill="#1A1A1A">La bannière</text>
    <text x="444" y="474" class="body" font-size="13" fill="#5A5A5A">Une refonte du premier niveau déplace le consentement de plus de 20 points.</text>
    <text x="1106" y="450" class="mono" font-size="11.5" fill="#B7332C" text-anchor="end">JOURNAL DES VERSIONS</text>
    <text x="1106" y="474" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="end">Le même que celui exigé au titre de la preuve</text>
  </g>

  <!-- Branche 3 : modélisation -->
  <g class="interactive" data-card="branche-modelisation" tabindex="0" role="button" aria-label="L'explication par la modélisation — cliquez pour les détails">
    <rect x="416" y="530" width="720" height="80" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="416" y="530" width="5" height="80" fill="#B58A2C"/>
    <text x="444" y="558" class="display" font-size="18" font-weight="600" fill="#1A1A1A">La modélisation</text>
    <text x="444" y="582" class="body" font-size="13" fill="#5A5A5A">L'extrapolation s'active sur seuils, et le respect des seuils ne garantit pas l'éligibilité.</text>
    <text x="1106" y="558" class="mono" font-size="11.5" fill="#B58A2C" text-anchor="end">SÉRIE DES TAUX ET DES VOLUMES</text>
    <text x="1106" y="582" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="end">Que personne n'exige, donc que personne ne tient</text>
  </g>

  <!-- Branche 4 : périmètre -->
  <g class="interactive" data-card="branche-perimetre" tabindex="0" role="button" aria-label="L'explication par le périmètre — cliquez pour les détails">
    <rect x="416" y="638" width="720" height="80" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="416" y="638" width="5" height="80" fill="#1F5560"/>
    <text x="444" y="666" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Le périmètre</text>
    <text x="444" y="690" class="body" font-size="13" fill="#5A5A5A">Un pixel ajouté, un partenaire retiré, une finalité renommée : la population change.</text>
    <text x="1106" y="666" class="mono" font-size="11.5" fill="#1F5560" text-anchor="end">HISTORIQUE DES CONFIGURATIONS</text>
    <text x="1106" y="690" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="end">À obtenir du prestataire par clause contractuelle</text>
  </g>

  <!-- Verdict -->
  <g class="interactive" data-card="verdict" tabindex="0" role="button" aria-label="Le verdict — cliquez pour les détails">
    <rect x="64" y="746" width="1072" height="78" rx="3" fill="#F2EEE4" stroke="#B7332C" stroke-width="1.5"/>
    <text x="92" y="774" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">VERDICT</text>
    <text x="92" y="802" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Trois des quatre branches se tranchent avec des pièces que le régulateur demande déjà. La quatrième ne se tranche pas.</text>
  </g>

  <text x="64" y="850" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">SOURCES : NOUWENS ET AL., CHI 2020 · SEUILS DOCUMENTÉS DE MODÉLISATION COMPORTEMENTALE · LIGNES DIRECTRICES CEPD 2/2023 V2.0</text>
</svg>
