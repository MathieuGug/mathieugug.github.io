<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Trois registres du consentement : le choix, la preuve, la série — propriétaires, durées et systèmes distincts">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="820" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois registres, un seul nom</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le premier est outillé, le deuxième est exigé, le troisième n'est demandé par personne.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Colonnes -->
  <g class="interactive" data-card="registre-choix" tabindex="0" role="button" aria-label="Le registre des choix — cliquez pour les détails">
    <rect x="64" y="182" width="340" height="536" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="182" width="340" height="5" fill="#4A7C59"/>
    <text x="92" y="222" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">REGISTRE 1</text>
    <text x="92" y="254" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Le choix</text>
    <text x="92" y="282" class="body" font-size="13" font-style="italic" fill="#8A8478">« Cet utilisateur a-t-il accepté ? »</text>
  </g>

  <g class="interactive" data-card="registre-preuve" tabindex="0" role="button" aria-label="Le registre de preuve — cliquez pour les détails">
    <rect x="430" y="182" width="340" height="536" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="430" y="182" width="340" height="5" fill="#B58A2C"/>
    <text x="458" y="222" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">REGISTRE 2</text>
    <text x="458" y="254" class="display" font-size="22" font-weight="600" fill="#1A1A1A">La preuve</text>
    <text x="458" y="282" class="body" font-size="13" font-style="italic" fill="#8A8478">« Que proposait-on, et comment ? »</text>
  </g>

  <g class="interactive" data-card="registre-serie" tabindex="0" role="button" aria-label="La série des taux — cliquez pour les détails">
    <rect x="796" y="182" width="340" height="536" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="796" y="182" width="340" height="5" fill="#B7332C"/>
    <text x="824" y="222" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">REGISTRE 3</text>
    <text x="824" y="254" class="display" font-size="22" font-weight="600" fill="#1A1A1A">La série</text>
    <text x="824" y="282" class="body" font-size="13" font-style="italic" fill="#8A8478">« Comment cela a-t-il évolué ? »</text>
  </g>

  <!-- Ligne INDEXÉ PAR -->
  <line x1="64" y1="306" x2="1136" y2="306" stroke="#E5E1D8" stroke-width="1"/>
  <text x="92" y="332" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">INDEXÉ PAR</text>
  <text x="92" y="358" class="body" font-size="14.5" fill="#1A1A1A">Un identifiant d'utilisateur</text>
  <text x="458" y="332" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">INDEXÉ PAR</text>
  <text x="458" y="358" class="body" font-size="14.5" fill="#1A1A1A">Une version d'affichage</text>
  <text x="824" y="332" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">INDEXÉ PAR</text>
  <text x="824" y="358" class="body" font-size="14.5" fill="#1A1A1A">Une date</text>

  <!-- Ligne PROPRIÉTAIRE -->
  <line x1="64" y1="382" x2="1136" y2="382" stroke="#F2EEE4" stroke-width="1"/>
  <g class="interactive" data-card="ligne-proprietaire" tabindex="0" role="button" aria-label="La ligne des propriétaires — cliquez pour les détails">
    <rect x="64" y="382" width="1072" height="96" fill="#F2EEE4"/>
    <text x="92" y="408" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">PROPRIÉTAIRE NATUREL</text>
    <text x="92" y="436" class="body" font-size="14.5" fill="#1A1A1A">Qui administre l'outil</text>
    <text x="92" y="460" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Désigné, financé, opérationnel</text>

    <text x="458" y="408" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">PROPRIÉTAIRE NATUREL</text>
    <text x="458" y="436" class="body" font-size="14.5" fill="#1A1A1A">Qui porte la conformité</text>
    <text x="458" y="460" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">Rarement doté des accès techniques</text>

    <text x="824" y="408" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">PROPRIÉTAIRE NATUREL</text>
    <text x="824" y="436" class="body" font-size="14.5" fill="#B7332C">Aucun</text>
    <text x="824" y="460" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Intéresse la mesure, sans mandat</text>
  </g>

  <!-- Ligne DURÉE -->
  <line x1="64" y1="478" x2="1136" y2="478" stroke="#F2EEE4" stroke-width="1"/>
  <text x="92" y="504" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">DURÉE DE CONSERVATION</text>
  <text x="92" y="534" class="display" font-size="20" font-weight="600" fill="#4A7C59">6 mois</text>
  <text x="92" y="558" class="body" font-size="12.5" fill="#5A5A5A">Bonne pratique, ajustable</text>
  <text x="92" y="578" class="body" font-size="12.5" fill="#5A5A5A">à l'audience du site</text>

  <text x="458" y="504" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">DURÉE DE CONSERVATION</text>
  <text x="458" y="534" class="display" font-size="20" font-weight="600" fill="#B58A2C">Durée du risque</text>
  <text x="458" y="558" class="body" font-size="12.5" fill="#5A5A5A">Tant qu'un contrôle peut porter</text>
  <text x="458" y="578" class="body" font-size="12.5" fill="#5A5A5A">sur la période concernée</text>

  <text x="824" y="504" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">DURÉE DE CONSERVATION</text>
  <text x="824" y="534" class="display" font-size="20" font-weight="600" fill="#B7332C">Sans limite utile</text>
  <text x="824" y="558" class="body" font-size="12.5" fill="#5A5A5A">Agrégée, sans donnée</text>
  <text x="824" y="578" class="body" font-size="12.5" fill="#5A5A5A">personnelle</text>

  <!-- Ligne SYSTÈME -->
  <line x1="64" y1="598" x2="1136" y2="598" stroke="#F2EEE4" stroke-width="1"/>
  <text x="92" y="624" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">SYSTÈME QUI LE PORTE</text>
  <text x="92" y="650" class="body" font-size="14" fill="#1A1A1A">La plateforme de recueil</text>
  <text x="458" y="624" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">SYSTÈME QUI LE PORTE</text>
  <text x="458" y="650" class="body" font-size="14" fill="#1A1A1A">Aucun, par défaut</text>
  <text x="824" y="624" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">SYSTÈME QUI LE PORTE</text>
  <text x="824" y="650" class="body" font-size="14" fill="#1A1A1A">Aucun, par défaut</text>

  <!-- Ligne ÉTAT OBSERVÉ -->
  <line x1="64" y1="670" x2="1136" y2="670" stroke="#F2EEE4" stroke-width="1"/>
  <text x="92" y="696" class="mono" font-size="11" letter-spacing="0.09em" fill="#4A7C59">FINANCÉ</text>
  <text x="458" y="696" class="mono" font-size="11" letter-spacing="0.09em" fill="#B58A2C">DÉCOUVERT EN CONTRÔLE</text>
  <text x="824" y="696" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">JAMAIS TENU</text>

  <line x1="64" y1="748" x2="1136" y2="748" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="776" class="body" font-size="13" font-style="italic" fill="#5A5A5A">La pièce qui alimente le registre 2 est la même que celle qui annote le registre 3. Deux fonctions différentes regardent le même objet.</text>
  <text x="64" y="800" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">DURÉES : RECOMMANDATION CNIL CONSOLIDÉE, JANVIER 2026 · LECTURE DE L'AUTEUR POUR LA RÉPARTITION DES PROPRIÉTAIRES</text>
</svg>
