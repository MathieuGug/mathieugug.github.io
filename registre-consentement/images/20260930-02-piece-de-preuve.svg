<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Anatomie d'une pièce de preuve opposable : condensat horodaté, captures par terminal, journal des configurations, procédure de restitution">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="ah02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8A8478"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Anatomie d'une pièce de preuve opposable</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois dispositifs recommandés, une procédure de restitution. Aucun n'est produit par défaut.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Colonne gauche : la version -->
  <rect x="64" y="186" width="248" height="330" rx="3" fill="#F2EEE4" stroke="#C9C3B6" stroke-width="1.25"/>
  <text x="88" y="216" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">L'OBJET DÉPOSÉ</text>
  <text x="88" y="248" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Une version</text>
  <text x="88" y="274" class="body" font-size="13" fill="#5A5A5A">de bannière en production</text>

  <line x1="88" y1="296" x2="288" y2="296" stroke="#C9C3B6" stroke-width="1"/>
  <text x="88" y="322" class="mono" font-size="11.5" fill="#1A1A1A">v14 · 2026-03-12</text>
  <text x="88" y="348" class="body" font-size="12.5" fill="#5A5A5A">Auteur du changement</text>
  <text x="88" y="370" class="body" font-size="12.5" fill="#5A5A5A">Motif du changement</text>
  <text x="88" y="392" class="body" font-size="12.5" fill="#5A5A5A">Périmètre servi</text>
  <text x="88" y="414" class="body" font-size="12.5" fill="#5A5A5A">Variantes en parallèle</text>

  <line x1="88" y1="436" x2="288" y2="436" stroke="#C9C3B6" stroke-width="1"/>
  <text x="88" y="462" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Une version non datée ne</text>
  <text x="88" y="482" class="body" font-size="12.5" font-style="italic" fill="#8A8478">prouve rien. Une version</text>
  <text x="88" y="502" class="body" font-size="12.5" font-style="italic" fill="#8A8478">datée par soi-même non plus.</text>

  <!-- Trois dispositifs -->
  <g class="interactive" data-card="condensat" tabindex="0" role="button" aria-label="Le condensat horodaté — cliquez pour les détails">
    <rect x="404" y="186" width="480" height="98" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="404" y="186" width="5" height="98" fill="#4A7C59"/>
    <text x="432" y="214" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#4A7C59">DISPOSITIF 1</text>
    <text x="432" y="242" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Condensat du code, horodaté</text>
    <text x="432" y="266" class="body" font-size="13" fill="#5A5A5A">Publié sur une plate-forme publique, pour que la date soit vérifiable par un tiers.</text>
  </g>

  <g class="interactive" data-card="capture" tabindex="0" role="button" aria-label="Les captures du rendu visuel — cliquez pour les détails">
    <rect x="404" y="302" width="480" height="98" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="404" y="302" width="5" height="98" fill="#4A7C59"/>
    <text x="432" y="330" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#4A7C59">DISPOSITIF 2</text>
    <text x="432" y="358" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Capture du rendu, par terminal</text>
    <text x="432" y="382" class="body" font-size="13" fill="#5A5A5A">Mobile et fixe, premier et second niveau, pour chaque version servie.</text>
  </g>

  <g class="interactive" data-card="configuration" tabindex="0" role="button" aria-label="Le journal des configurations — cliquez pour les détails">
    <rect x="404" y="418" width="480" height="98" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="404" y="418" width="5" height="98" fill="#B58A2C"/>
    <text x="432" y="446" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B58A2C">DISPOSITIF 3</text>
    <text x="432" y="474" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Historique des configurations</text>
    <text x="432" y="498" class="body" font-size="13" fill="#5A5A5A">État du paramétrage et liste des fournisseurs, extraits périodiquement.</text>
  </g>

  <!-- Flèches vers la restitution -->
  <path d="M 312 350 L 392 350" stroke="#8A8478" stroke-width="1.5" fill="none" marker-end="url(#ah02)"/>
  <path d="M 896 235 C 940 235 940 330 976 330" stroke="#8A8478" stroke-width="1.5" fill="none" marker-end="url(#ah02)"/>
  <path d="M 896 351 L 976 351" stroke="#8A8478" stroke-width="1.5" fill="none" marker-end="url(#ah02)"/>
  <path d="M 896 467 C 940 467 940 372 976 372" stroke="#8A8478" stroke-width="1.5" fill="none" marker-end="url(#ah02)"/>

  <!-- Restitution -->
  <g class="interactive" data-card="restitution" tabindex="0" role="button" aria-label="La procédure de restitution — cliquez pour les détails">
    <rect x="988" y="248" width="148" height="206" rx="3" fill="#1A1A1A"/>
    <text x="1012" y="278" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#E8B84B">SORTIE</text>
    <text x="1012" y="308" class="display" font-size="19" font-weight="600" fill="#FAF8F3">Le dossier</text>
    <text x="1012" y="332" class="display" font-size="19" font-weight="600" fill="#FAF8F3">d'une date</text>
    <line x1="1012" y1="352" x2="1112" y2="352" stroke="#5A5A5A" stroke-width="1"/>
    <text x="1012" y="378" class="body" font-size="12.5" fill="#C9C3B6">Produit sur demande,</text>
    <text x="1012" y="398" class="body" font-size="12.5" fill="#C9C3B6">en jours ouvrés,</text>
    <text x="1012" y="418" class="body" font-size="12.5" fill="#C9C3B6">selon une procédure</text>
    <text x="1012" y="438" class="body" font-size="12.5" fill="#C9C3B6">écrite et testée.</text>
  </g>

  <!-- Bandeau destinataires -->
  <line x1="64" y1="556" x2="1136" y2="556" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="586" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">CE QUE LA DÉLIBÉRATION DE DÉCEMBRE 2025 AJOUTE</text>
  <rect x="64" y="600" width="1072" height="104" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
  <text x="92" y="632" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La preuve devient une pièce échangeable.</text>
  <text x="92" y="658" class="body" font-size="13.5" fill="#5A5A5A">L'organisme qui recueille le consentement doit le mettre à disposition des autres parties qui s'en prévalent. Au titre de</text>
  <text x="92" y="680" class="body" font-size="13.5" fill="#5A5A5A">la minimisation, la transmission de l'identifiant de compte de l'utilisateur est déconseillée. Format, délai, recours : au contrat.</text>

  <text x="64" y="748" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Une norme existe pour le transport de ces enregistrements. Elle laisse à l'implémenteur le choix des champs, donc elle ne garantit pas la comparabilité.</text>
  <text x="64" y="778" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">SOURCES : RECOMMANDATION CNIL CONSOLIDÉE (JANVIER 2026) · DÉLIBÉRATION N° 2025-131 DU 18 DÉCEMBRE 2025 · ISO/IEC TS 27560:2023</text>
</svg>
