<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Quatre décisions, quatre pièces : propriétaire du registre, deux durées écrites, clauses d'export et de rejeu, annotation des séries de conversion">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Quatre décisions, quatre pièces</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque décision se solde par un document daté. Sans document, la décision n'a pas été prise.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">DÉCISION</text>
  <text x="520" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">PIÈCE PRODUITE</text>
  <text x="880" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUI CASSE SANS ELLE</text>

  <!-- D1 -->
  <g class="interactive" data-card="d1" tabindex="0" role="button" aria-label="Décision 1, nommer un propriétaire — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="140" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="5" height="140" fill="#B7332C"/>
    <text x="94" y="236" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">D1</text>
    <text x="94" y="266" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Nommer un propriétaire</text>
    <text x="94" y="290" class="display" font-size="20" font-weight="600" fill="#1A1A1A">unique du registre</text>
    <text x="94" y="318" class="body" font-size="12.5" fill="#8A8478">Qui déploie tient le registre,</text>
    <text x="94" y="336" class="body" font-size="12.5" fill="#8A8478">qui porte la conformité en définit le contenu</text>

    <text x="520" y="242" class="body" font-size="13.5" fill="#5A5A5A">Une ligne dans une lettre de mission,</text>
    <text x="520" y="264" class="body" font-size="13.5" fill="#5A5A5A">avec l'accès technique correspondant.</text>
    <text x="520" y="296" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Ni la plateforme de recueil, ni l'agence,</text>
    <text x="520" y="316" class="body" font-size="12.5" font-style="italic" fill="#B7332C">ni le délégué à la protection des données seul.</text>

    <text x="880" y="242" class="body" font-size="13.5" fill="#5A5A5A">Tout le reste. Un registre sans</text>
    <text x="880" y="264" class="body" font-size="13.5" fill="#5A5A5A">propriétaire nommé n'est pas</text>
    <text x="880" y="286" class="body" font-size="13.5" fill="#5A5A5A">un registre incomplet : il</text>
    <text x="880" y="308" class="body" font-size="13.5" fill="#5A5A5A">n'existe pas, quel que soit</text>
    <text x="880" y="330" class="body" font-size="13.5" fill="#5A5A5A">le budget alloué.</text>
  </g>

  <!-- D2 -->
  <g class="interactive" data-card="d2" tabindex="0" role="button" aria-label="Décision 2, deux durées écrites séparément — cliquez pour les détails">
    <rect x="64" y="358" width="1072" height="140" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="358" width="5" height="140" fill="#B58A2C"/>
    <text x="94" y="388" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">D2</text>
    <text x="94" y="418" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Écrire deux durées,</text>
    <text x="94" y="442" class="display" font-size="20" font-weight="600" fill="#1A1A1A">séparément</text>
    <text x="94" y="470" class="body" font-size="12.5" fill="#8A8478">Celle des choix et celle de la preuve</text>
    <text x="94" y="488" class="body" font-size="12.5" fill="#8A8478">ne répondent pas à la même question</text>

    <text x="520" y="394" class="body" font-size="13.5" fill="#5A5A5A">Deux durées distinctes dans le registre</text>
    <text x="520" y="416" class="body" font-size="13.5" fill="#5A5A5A">des traitements, deux justifications,</text>
    <text x="520" y="438" class="body" font-size="13.5" fill="#5A5A5A">une procédure de purge testée.</text>
    <text x="520" y="470" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">Six mois pour les choix. Durée du risque</text>
    <text x="520" y="490" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">pour la preuve.</text>

    <text x="880" y="394" class="body" font-size="13.5" fill="#5A5A5A">L'erreur d'archivage la plus</text>
    <text x="880" y="416" class="body" font-size="13.5" fill="#5A5A5A">courante du domaine : appliquer</text>
    <text x="880" y="438" class="body" font-size="13.5" fill="#5A5A5A">les six mois des choix à la</text>
    <text x="880" y="460" class="body" font-size="13.5" fill="#5A5A5A">preuve, et détruire la pièce</text>
    <text x="880" y="482" class="body" font-size="13.5" fill="#5A5A5A">avant la fin du risque.</text>
  </g>

  <!-- D3 -->
  <g class="interactive" data-card="d3" tabindex="0" role="button" aria-label="Décision 3, les clauses d'export et de rejeu — cliquez pour les détails">
    <rect x="64" y="510" width="1072" height="140" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="510" width="5" height="140" fill="#1F5560"/>
    <text x="94" y="540" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">D3</text>
    <text x="94" y="570" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Exiger l'export et</text>
    <text x="94" y="594" class="display" font-size="20" font-weight="600" fill="#1A1A1A">le rejeu au contrat</text>
    <text x="94" y="622" class="body" font-size="12.5" fill="#8A8478">Trois clauses, négociées</text>
    <text x="94" y="640" class="body" font-size="12.5" fill="#8A8478">au renouvellement</text>

    <text x="520" y="546" class="body" font-size="13.5" fill="#5A5A5A">Export périodique horodaté du paramétrage,</text>
    <text x="520" y="568" class="body" font-size="13.5" fill="#5A5A5A">liste des fournisseurs incluse. Historique</text>
    <text x="520" y="590" class="body" font-size="13.5" fill="#5A5A5A">conservé au moins aussi longtemps que</text>
    <text x="520" y="612" class="body" font-size="13.5" fill="#5A5A5A">la preuve. Restitution d'une version passée.</text>
    <text x="520" y="640" class="body" font-size="12.5" font-style="italic" fill="#1F5560">Et un test de restitution à la recette.</text>

    <text x="880" y="546" class="body" font-size="13.5" fill="#5A5A5A">La branche « périmètre » du</text>
    <text x="880" y="568" class="body" font-size="13.5" fill="#5A5A5A">diagnostic, et la capacité à</text>
    <text x="880" y="590" class="body" font-size="13.5" fill="#5A5A5A">répondre quand le prestataire</text>
    <text x="880" y="612" class="body" font-size="13.5" fill="#5A5A5A">a été changé entre-temps.</text>
  </g>

  <!-- D4 -->
  <g class="interactive" data-card="d4" tabindex="0" role="button" aria-label="Décision 4, annoter les séries de conversion — cliquez pour les détails">
    <rect x="64" y="662" width="1072" height="140" rx="3" fill="#F2EEE4" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="662" width="5" height="140" fill="#B7332C"/>
    <text x="94" y="692" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">D4 · CELLE QUI SAUVE LE TROISIÈME REGISTRE</text>
    <text x="94" y="722" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Annoter les séries</text>
    <text x="94" y="746" class="display" font-size="20" font-weight="600" fill="#1A1A1A">de conversion</text>
    <text x="94" y="774" class="body" font-size="12.5" fill="#8A8478">Rendre la série inséparable</text>
    <text x="94" y="792" class="body" font-size="12.5" fill="#8A8478">de la pièce réglementaire</text>

    <text x="520" y="698" class="body" font-size="13.5" fill="#5A5A5A">Une table de quatre colonnes : date, taux par</text>
    <text x="520" y="720" class="body" font-size="13.5" fill="#5A5A5A">finalité, version de bannière en production,</text>
    <text x="520" y="742" class="body" font-size="13.5" fill="#5A5A5A">régime de modélisation en vigueur.</text>
    <text x="520" y="774" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Règle de comité : aucune variation commentée</text>
    <text x="520" y="794" class="body" font-size="12.5" font-style="italic" fill="#B7332C">sans ces trois informations affichées.</text>

    <text x="880" y="698" class="body" font-size="13.5" fill="#5A5A5A">La lisibilité de toutes les</text>
    <text x="880" y="720" class="body" font-size="13.5" fill="#5A5A5A">séries de performance. Et la</text>
    <text x="880" y="742" class="body" font-size="13.5" fill="#5A5A5A">ligne budgétaire elle-même :</text>
    <text x="880" y="764" class="body" font-size="13.5" fill="#5A5A5A">une série qu'aucune obligation</text>
    <text x="880" y="786" class="body" font-size="13.5" fill="#5A5A5A">ne protège saute au premier</text>
    <text x="880" y="808" class="body" font-size="13.5" fill="#5A5A5A">arbitrage.</text>
  </g>
</svg>
