<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Les six postes d'un registre de preuve opposable : cinq coûts récurrents modestes et un poste de reconstitution rétrospective hors échelle">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Les six postes d'un registre opposable</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Cinq postes tiennent dans un budget d'outillage. Le sixième n'a pas de plafond.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">POSTE</text>
  <text x="462" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL PRODUIT</text>
  <text x="866" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">EFFORT RÉCURRENT</text>

  <!-- Poste 1 -->
  <g class="interactive" data-card="versionnement" tabindex="0" role="button" aria-label="Versionner la bannière — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="72" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="5" height="72" fill="#4A7C59"/>
    <text x="94" y="234" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#4A7C59">POSTE 1</text>
    <text x="94" y="260" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Versionner la bannière</text>
    <text x="462" y="240" class="body" font-size="13.5" fill="#5A5A5A">Un identifiant de version par modification, avec son auteur,</text>
    <text x="462" y="262" class="body" font-size="13.5" fill="#5A5A5A">sa date et son motif.</text>
    <rect x="866" y="234" width="48" height="14" fill="#4A7C59"/>
    <rect x="914" y="234" width="192" height="14" fill="#F2EEE4"/>
    <text x="866" y="270" class="mono" font-size="11" fill="#4A7C59">NUL SI LE CODE EST DÉJÀ VERSIONNÉ</text>
  </g>

  <!-- Poste 2 -->
  <g class="interactive" data-card="capture-rendu" tabindex="0" role="button" aria-label="Capturer le rendu — cliquez pour les détails">
    <rect x="64" y="290" width="1072" height="72" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="290" width="5" height="72" fill="#B58A2C"/>
    <text x="94" y="318" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B58A2C">POSTE 2</text>
    <text x="94" y="344" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Capturer le rendu</text>
    <text x="462" y="324" class="body" font-size="13.5" fill="#5A5A5A">Deux terminaux × deux niveaux × chaque langue servie.</text>
    <text x="462" y="346" class="body" font-size="13.5" fill="#5A5A5A">Trois langues et une refonte par trimestre font 48 pièces par an.</text>
    <rect x="866" y="318" width="120" height="14" fill="#B58A2C"/>
    <rect x="986" y="318" width="120" height="14" fill="#F2EEE4"/>
    <text x="866" y="354" class="mono" font-size="11" fill="#B58A2C">LE POSTE LE PLUS SOUS-ESTIMÉ</text>
  </g>

  <!-- Poste 3 -->
  <g class="interactive" data-card="journal-configuration" tabindex="0" role="button" aria-label="Journaliser les configurations — cliquez pour les détails">
    <rect x="64" y="374" width="1072" height="72" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="374" width="5" height="72" fill="#B58A2C"/>
    <text x="94" y="402" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B58A2C">POSTE 3</text>
    <text x="94" y="428" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Journaliser les configurations</text>
    <text x="462" y="408" class="body" font-size="13.5" fill="#5A5A5A">Un export horodaté du paramétrage complet, liste des fournisseurs</text>
    <text x="462" y="430" class="body" font-size="13.5" fill="#5A5A5A">incluse. La faisabilité dépend entièrement du prestataire.</text>
    <rect x="866" y="402" width="72" height="14" fill="#B58A2C"/>
    <rect x="938" y="402" width="168" height="14" fill="#F2EEE4"/>
    <text x="866" y="438" class="mono" font-size="11" fill="#B58A2C">UN POINT DE CONTRAT, PAS UN PROBLÈME TECHNIQUE</text>
  </g>

  <!-- Poste 4 -->
  <rect x="64" y="458" width="1072" height="72" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <rect x="64" y="458" width="5" height="72" fill="#4A7C59"/>
  <text x="94" y="486" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#4A7C59">POSTE 4</text>
  <text x="94" y="512" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Conserver et purger</text>
  <text x="462" y="492" class="body" font-size="13.5" fill="#5A5A5A">Deux durées écrites séparément, et la règle de purge qui va avec.</text>
  <text x="462" y="514" class="body" font-size="13.5" fill="#5A5A5A">Un registre qui conserve tout sans règle devient un manquement.</text>
  <rect x="866" y="486" width="48" height="14" fill="#4A7C59"/>
  <rect x="914" y="486" width="192" height="14" fill="#F2EEE4"/>
  <text x="866" y="522" class="mono" font-size="11" fill="#4A7C59">FAIBLE, MAIS À ÉCRIRE</text>

  <!-- Poste 5 -->
  <rect x="64" y="542" width="1072" height="72" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <rect x="64" y="542" width="5" height="72" fill="#4A7C59"/>
  <text x="94" y="570" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#4A7C59">POSTE 5</text>
  <text x="94" y="596" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Restituer</text>
  <text x="462" y="576" class="body" font-size="13.5" fill="#5A5A5A">La procédure qui produit, pour une date donnée, le dossier complet.</text>
  <text x="462" y="598" class="body" font-size="13.5" fill="#5A5A5A">Non testée, une procédure de restitution reste une hypothèse.</text>
  <rect x="866" y="570" width="60" height="14" fill="#4A7C59"/>
  <rect x="926" y="570" width="180" height="14" fill="#F2EEE4"/>
  <text x="866" y="606" class="mono" font-size="11" fill="#4A7C59">UN TEST PAR AN SUFFIT</text>

  <!-- Poste 6 -->
  <g class="interactive" data-card="reconstitution" tabindex="0" role="button" aria-label="Reconstituer rétrospectivement — cliquez pour les détails">
    <rect x="64" y="626" width="1072" height="96" rx="3" fill="#1A1A1A"/>
    <rect x="64" y="626" width="5" height="96" fill="#E8B84B"/>
    <text x="94" y="654" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#E8B84B">POSTE 6 · CELUI QU'ON NE PROVISIONNE PAS</text>
    <text x="94" y="682" class="display" font-size="19" font-weight="600" fill="#FAF8F3">Reconstituer ce qu'on n'a pas conservé</text>
    <text x="94" y="708" class="body" font-size="12.5" fill="#C9C3B6">Coût mesuré : une équipe de recherche a dû rebâtir l'histoire des bannières 2018-2024</text>
    <text x="462" y="654" class="body" font-size="13.5" fill="#C9C3B6">Un résultat partiel, sans horodatage opposable :</text>
    <text x="462" y="676" class="body" font-size="13.5" fill="#C9C3B6">la date d'archivage d'un tiers ne prouve pas</text>
    <text x="462" y="698" class="body" font-size="13.5" fill="#C9C3B6">la date de mise en production.</text>
    <text x="1106" y="668" class="mono" font-size="12.5" letter-spacing="0.08em" fill="#E8B84B" text-anchor="end">HORS ÉCHELLE</text>
    <text x="1106" y="694" class="body" font-size="12" fill="#8A8478" text-anchor="end">Compétences rares,</text>
    <text x="1106" y="712" class="body" font-size="12" fill="#8A8478" text-anchor="end">résultat non opposable</text>
  </g>

  <line x1="64" y1="748" x2="1136" y2="748" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="776" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">BARRES : ORDRE DE GRANDEUR RELATIF D'EFFORT RÉCURRENT, GRILLE DE L'AUTEUR · POSTE 6 : MÉTHODE DE REJEU SUR PAGES ARCHIVÉES, ÉTUDE 2026</text>
</svg>
