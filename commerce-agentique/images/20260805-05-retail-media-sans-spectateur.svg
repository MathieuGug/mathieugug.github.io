<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le déplacement de l'inventaire retail media : du placement visuel à l'influence du classement puis au flux produit, et l'état de la certification à chaque étage">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le retail media sans spectateur</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">L'objet vendu se déplace ; l'auditabilité, elle, disparaît en route</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="88" y="200" class="mono" font-size="12" letter-spacing="0.08em" fill="#5A5A5A">DÉPLACEMENT DE L'INVENTAIRE</text>

  <!-- Stage A -->
  <g class="interactive" data-card="placement-visuel" tabindex="0" role="button" aria-label="Étage 1, le placement visuel : impression servie à un humain — cliquez pour les détails">
    <rect x="88" y="216" width="316" height="176" rx="3" fill="#1F5560" opacity="0.10"/>
    <rect x="88" y="216" width="316" height="176" rx="3" fill="none" stroke="#1F5560" stroke-width="1.25"/>
    <text x="112" y="248" class="mono" font-size="12" fill="#1F5560">HIER · ET ENCORE AUJOURD'HUI</text>
    <text x="112" y="278" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Le placement visuel</text>
    <text x="112" y="304" class="body" font-size="13" fill="#5A5A5A">Une impression servie à un humain,</text>
    <text x="112" y="322" class="body" font-size="13" fill="#5A5A5A">dans l'environnement du distributeur.</text>
    <text x="112" y="348" class="body" font-size="13" fill="#5A5A5A">Unité de facturation : le mille.</text>
    <text x="112" y="374" class="body" font-size="13" font-style="italic" fill="#1F5560">Fenêtre d'attribution : 30 jours par défaut.</text>
  </g>

  <line x1="412" y1="304" x2="452" y2="304" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arw05)"/>

  <!-- Stage B -->
  <g class="interactive" data-card="influence-classement" tabindex="0" role="button" aria-label="Étage 2, l'influence du classement consommé par un agent — cliquez pour les détails">
    <rect x="464" y="216" width="316" height="176" rx="3" fill="#B7332C" opacity="0.10"/>
    <rect x="464" y="216" width="316" height="176" rx="3" fill="none" stroke="#B7332C" stroke-width="2.5"/>
    <text x="488" y="248" class="mono" font-size="12" fill="#B7332C">EN COURS DE BASCULE</text>
    <text x="488" y="278" class="body" font-size="15" font-weight="600" fill="#1A1A1A">L'influence du classement</text>
    <text x="488" y="304" class="body" font-size="13" fill="#5A5A5A">Un rang dans une liste consultée</text>
    <text x="488" y="322" class="body" font-size="13" fill="#5A5A5A">par une machine, en 200 ms.</text>
    <text x="488" y="348" class="body" font-size="13" fill="#5A5A5A">Unité de facturation : indéfinie.</text>
    <text x="488" y="374" class="body" font-size="13" font-style="italic" fill="#B7332C">Que vaut une impression que personne ne voit ?</text>
  </g>

  <line x1="788" y1="304" x2="828" y2="304" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arw05)"/>

  <!-- Stage C -->
  <g class="interactive" data-card="flux-produit" tabindex="0" role="button" aria-label="Étage 3, le flux produit et la lisibilité machine — cliquez pour les détails">
    <rect x="840" y="216" width="296" height="176" rx="3" fill="#B58A2C" opacity="0.12"/>
    <rect x="840" y="216" width="296" height="176" rx="3" fill="none" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="864" y="248" class="mono" font-size="12" fill="#B58A2C">CE QUI ARRIVE ENSUITE</text>
    <text x="864" y="278" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Le flux produit</text>
    <text x="864" y="304" class="body" font-size="13" fill="#5A5A5A">Complétude, fraîcheur, structuration.</text>
    <text x="864" y="322" class="body" font-size="13" fill="#5A5A5A">Ce que l'agent lit réellement.</text>
    <text x="864" y="348" class="body" font-size="13" fill="#5A5A5A">Ce n'est plus du média acheté.</text>
    <text x="864" y="374" class="body" font-size="13" font-style="italic" fill="#B58A2C">C'est un actif d'entreprise.</text>
  </g>

  <!-- Certification row -->
  <line x1="88" y1="428" x2="1136" y2="428" stroke="#E5E1D8" stroke-width="1"/>
  <g class="interactive" data-card="certification" tabindex="0" role="button" aria-label="Qui certifie quoi à chaque étage — cliquez pour les détails">
    <text x="88" y="460" class="mono" font-size="12" letter-spacing="0.08em" fill="#5A5A5A">QUI PEUT LE CERTIFIER ?</text>
    <rect x="88" y="476" width="316" height="70" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.25"/>
    <text x="112" y="502" class="body" font-size="15" font-weight="600" fill="#1F5560">Un tiers mesureur</text>
    <text x="112" y="526" class="body" font-size="13" fill="#5A5A5A">Norme de visibilité, audit possible.</text>

    <rect x="464" y="476" width="316" height="70" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="2.5"/>
    <text x="488" y="502" class="body" font-size="15" font-weight="600" fill="#B7332C">Personne</text>
    <text x="488" y="526" class="body" font-size="13" fill="#5A5A5A">Ni norme, ni mesureur, ni définition.</text>

    <rect x="840" y="476" width="296" height="70" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="864" y="502" class="body" font-size="15" font-weight="600" fill="#B58A2C">Le marchand lui-même</text>
    <text x="864" y="526" class="body" font-size="13" fill="#5A5A5A">Sort du périmètre publicitaire.</text>
  </g>

  <!-- Standards band -->
  <rect x="88" y="580" width="1048" height="112" rx="3" fill="#1F5560" opacity="0.07"/>
  <rect x="88" y="580" width="1048" height="112" rx="3" fill="none" stroke="#1F5560" stroke-width="1.25" stroke-dasharray="2 3"/>
  <text x="112" y="610" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560">LE DÉCALAGE DES STANDARDS</text>
  <text x="112" y="638" class="body" font-size="15" fill="#1A1A1A"><tspan font-weight="600">IAB Europe V2</tspan> (janv. 2026, transition close juil. 2026) — solide, et écrit pour un monde à impressions.</text>
  <text x="112" y="662" class="body" font-size="15" fill="#1A1A1A"><tspan font-weight="600">AAMP</tspan> (IAB Tech Lab, 2026) — standardise l'<tspan font-style="italic">achat média par des agents</tspan>, pas la <tspan font-style="italic">mesure d'un achat produit par un agent</tspan>.</text>
  <text x="112" y="682" class="body" font-size="13" font-style="italic" fill="#B7332C">Deux sujets, le même adjectif. Le trou de normalisation est à l'endroit exact où passe l'argent.</text>

  <rect x="64" y="722" width="1072" height="1" fill="#E5E1D8"/>
  <text x="64" y="748" class="body" font-size="13" fill="#1A1A1A">L'annonceur passe d'une boucle fermée auditable en un point à une boucle fermée entièrement déclarative. La parade est contractuelle, pas technique.</text>
  <text x="64" y="776" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : IAB Europe, Commerce (incl. Retail) Media Measurement Standards V2 ; IAB / MRC, Retail Media Measurement Guidelines ; IAB Tech Lab, AAMP. Séquencement des trois étages : analyse de l'auteur.</text>
</svg>
