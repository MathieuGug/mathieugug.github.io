<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Du consentement au mandat : la chaîne intention, panier, paiement ; la comparaison entre consentement RGPD et mandat signé ; et le trou de l'authentification forte du client">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5560"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Du consentement au mandat</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">On remplace un accord révocable par une preuve d'autorisation conservable</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Chain -->
  <text x="88" y="196" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560">LA CHAÎNE SIGNÉE</text>

  <g class="interactive" data-card="intent-mandate" tabindex="0" role="button" aria-label="Le mandat d'intention — cliquez pour les détails">
    <rect x="88" y="212" width="316" height="118" rx="3" fill="#1F5560" opacity="0.10"/>
    <rect x="88" y="212" width="316" height="118" rx="3" fill="none" stroke="#1F5560" stroke-width="1.25"/>
    <text x="112" y="242" class="mono" font-size="12" fill="#1F5560">01</text>
    <text x="112" y="268" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Mandat d'intention</text>
    <text x="112" y="292" class="body" font-size="13" fill="#5A5A5A">« Trouve-moi des chaussures</text>
    <text x="112" y="310" class="body" font-size="13" fill="#5A5A5A">de course sous 120 € »</text>
  </g>
  <line x1="412" y1="271" x2="452" y2="271" stroke="#1F5560" stroke-width="2.5" marker-end="url(#arw06)"/>

  <g class="interactive" data-card="cart-mandate" tabindex="0" role="button" aria-label="Le mandat de panier — cliquez pour les détails">
    <rect x="464" y="212" width="316" height="118" rx="3" fill="#1F5560" opacity="0.10"/>
    <rect x="464" y="212" width="316" height="118" rx="3" fill="none" stroke="#1F5560" stroke-width="1.25"/>
    <text x="488" y="242" class="mono" font-size="12" fill="#1F5560">02</text>
    <text x="488" y="268" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Mandat de panier</text>
    <text x="488" y="292" class="body" font-size="13" fill="#5A5A5A">Articles et prix exacts, figés</text>
    <text x="488" y="310" class="body" font-size="13" fill="#5A5A5A">après approbation de l'utilisateur.</text>
  </g>
  <line x1="788" y1="271" x2="828" y2="271" stroke="#1F5560" stroke-width="2.5" marker-end="url(#arw06)"/>

  <g class="interactive" data-card="payment-mandate" tabindex="0" role="button" aria-label="Le mandat de paiement — cliquez pour les détails">
    <rect x="840" y="212" width="296" height="118" rx="3" fill="#1F5560" opacity="0.10"/>
    <rect x="840" y="212" width="296" height="118" rx="3" fill="none" stroke="#1F5560" stroke-width="1.25"/>
    <text x="864" y="242" class="mono" font-size="12" fill="#1F5560">03</text>
    <text x="864" y="268" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Mandat de paiement</text>
    <text x="864" y="292" class="body" font-size="13" fill="#5A5A5A">Lie le moyen de règlement</text>
    <text x="864" y="310" class="body" font-size="13" fill="#5A5A5A">au panier vérifié.</text>
  </g>

  <text x="88" y="356" class="body" font-size="13" font-style="italic" fill="#1F5560">L'ensemble forme une piste d'audit décrite comme « non répudiable ». Un mandat ne se retire pas : il s'exécute, ou non — et il laisse une trace opposable.</text>

  <!-- Comparison -->
  <line x1="88" y1="380" x2="1136" y2="380" stroke="#E5E1D8" stroke-width="1"/>
  <text x="88" y="410" class="mono" font-size="12" letter-spacing="0.08em" fill="#5A5A5A">DEUX OBJETS DE GOUVERNANCE DIFFÉRENTS</text>

  <rect x="88" y="424" width="500" height="192" rx="3" fill="#B58A2C" opacity="0.10"/>
  <rect x="88" y="424" width="500" height="192" rx="3" fill="none" stroke="#B58A2C" stroke-width="1.25"/>
  <text x="112" y="454" class="body" font-size="15" font-weight="600" fill="#B58A2C">Le consentement</text>
  <text x="112" y="484" class="body" font-size="13" fill="#1A1A1A">Donné par une personne, pour une finalité.</text>
  <text x="112" y="510" class="body" font-size="13" fill="#1A1A1A">Révocable à tout moment.</text>
  <text x="112" y="536" class="body" font-size="13" fill="#1A1A1A">Objet vivant : il expire, se re-collecte.</text>
  <text x="112" y="562" class="body" font-size="13" fill="#1A1A1A">Question posée : <tspan font-style="italic">a-t-elle consenti ?</tspan></text>
  <text x="112" y="596" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Vit dans le registre des traitements.</text>

  <g class="interactive" data-card="conservation" tabindex="0" role="button" aria-label="Le mandat comme preuve à conserver — cliquez pour les détails">
    <rect x="620" y="424" width="516" height="192" rx="3" fill="#1F5560" opacity="0.10"/>
    <rect x="620" y="424" width="516" height="192" rx="3" fill="none" stroke="#1F5560" stroke-width="2.5"/>
    <text x="644" y="454" class="body" font-size="15" font-weight="600" fill="#1F5560">Le mandat</text>
    <text x="644" y="484" class="body" font-size="13" fill="#1A1A1A">Délégation d'autorité, signée, prouvable après coup.</text>
    <text x="644" y="510" class="body" font-size="13" fill="#1A1A1A">Ne se retire pas. S'exécute ou non.</text>
    <text x="644" y="536" class="body" font-size="13" fill="#1A1A1A">Objet mort : il vaut par sa conservation.</text>
    <text x="644" y="562" class="body" font-size="13" fill="#1A1A1A">Question posée : <tspan font-style="italic">pour le compte de qui, sur quelle autorité ?</tspan></text>
    <text x="644" y="596" class="body" font-size="13" font-style="italic" fill="#B7332C">N'a de valeur défensive que s'il est retrouvable. Durée, format, responsable : à écrire.</text>
  </g>

  <!-- SCA gap -->
  <g class="interactive" data-card="trou-sca" tabindex="0" role="button" aria-label="Le trou de l'authentification forte du client : la DSP2 n'a pas de case pour un agent — cliquez pour les détails">
    <rect x="88" y="640" width="1048" height="90" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="6 5"/>
    <text x="112" y="668" class="body" font-size="15" font-weight="600" fill="#B7332C">Le trou : l'authentification forte du client</text>
    <text x="112" y="692" class="body" font-size="13" fill="#1A1A1A">La DSP2 suppose une autorisation humaine claire de l'ordre de paiement. Aucun mécanisme ne permet de traiter un agent comme l'équivalent d'un payeur humain.</text>
    <text x="112" y="714" class="body" font-size="13" fill="#1A1A1A">Parade de marché employée en attendant : le mandat de dépense pré-approuvé, avec plafonds — exactement ce que décrivent le jeton borné et la chaîne de mandats. La DSP3 et le règlement sur les services de paiement devront trancher.</text>
  </g>

  <text x="64" y="768" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : Google Cloud, mandats AP2 ; spécification ACP (jeton de paiement borné) ; Taylor Wessing, « Agentic AI in payments » (fév. 2026) ; Osborne Clarke, « Agentic payments ». Mise en regard consentement / mandat : analyse de l'auteur.</text>
</svg>
