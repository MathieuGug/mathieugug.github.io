<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La pile du commerce agentique en quatre couches : identité et accès, mandat et autorisation, transaction et règlement, et une quatrième couche mesure entièrement vide">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Six protocoles, trois couches — et une case vide</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Rangés par fonction, les « concurrents » ne se disputent presque rien</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ============ COUCHE 4 : MESURE (vide) ============ -->
  <g class="interactive" data-card="couche-mesure" tabindex="0" role="button" aria-label="Couche mesure — inoccupée, aucune spécification ne la traite. Cliquez pour les détails">
    <rect x="200" y="192" width="700" height="96" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="6 5"/>
    <text x="228" y="228" class="body" font-size="15" font-weight="600" letter-spacing="0.06em" fill="#B7332C">COUCHE 4 · MESURE</text>
    <text x="228" y="252" class="display" font-size="18" font-style="italic" fill="#B7332C">Personne.</text>
    <text x="228" y="274" class="body" font-size="13" fill="#5A5A5A">Aucune spécification ne définit l'exposition, l'attribution, ni un droit de vérification.</text>
  </g>
  <text x="176" y="246" class="mono" font-size="13" fill="#B7332C" text-anchor="end">04</text>

  <!-- ============ COUCHE 3 : TRANSACTION ============ -->
  <g class="interactive" data-card="couche-transaction" tabindex="0" role="button" aria-label="Couche transaction et règlement : ACP, OpenAI et Stripe. Cliquez pour les détails">
    <rect x="200" y="316" width="700" height="96" rx="3" fill="#1F5560" opacity="0.08"/>
    <rect x="200" y="316" width="700" height="96" rx="3" fill="none" stroke="#1F5560" stroke-width="1.25"/>
    <text x="228" y="352" class="body" font-size="15" font-weight="600" letter-spacing="0.06em" fill="#1F5560">COUCHE 3 · TRANSACTION &amp; RÈGLEMENT</text>
    <text x="228" y="376" class="body" font-size="15" fill="#1A1A1A">ACP — commande, délégation de paiement, flux produit</text>
    <text x="228" y="398" class="body" font-size="13" fill="#5A5A5A">Jeton borné en montant et en durée. L'agent ne devient pas le marchand de référence.</text>
    <rect x="756" y="336" width="120" height="26" rx="3" fill="#1F5560"/>
    <text x="816" y="354" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">OpenAI · Stripe</text>
  </g>
  <text x="176" y="370" class="mono" font-size="13" fill="#5A5A5A" text-anchor="end">03</text>

  <!-- ============ COUCHE 2 : MANDAT ============ -->
  <g class="interactive" data-card="couche-mandat" tabindex="0" role="button" aria-label="Couche mandat et autorisation : AP2, Google. Cliquez pour les détails">
    <rect x="200" y="440" width="700" height="96" rx="3" fill="#1F5560" opacity="0.08"/>
    <rect x="200" y="440" width="700" height="96" rx="3" fill="none" stroke="#1F5560" stroke-width="1.25"/>
    <text x="228" y="476" class="body" font-size="15" font-weight="600" letter-spacing="0.06em" fill="#1F5560">COUCHE 2 · MANDAT &amp; AUTORISATION</text>
    <text x="228" y="500" class="body" font-size="15" fill="#1A1A1A">AP2 — mandats d'intention, de panier, de paiement</text>
    <text x="228" y="522" class="body" font-size="13" fill="#5A5A5A">Chaîne signée, non répudiable. Agnostique au moyen de règlement.</text>
    <rect x="800" y="460" width="76" height="26" rx="3" fill="#1F5560"/>
    <text x="838" y="478" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">Google</text>
  </g>
  <text x="176" y="494" class="mono" font-size="13" fill="#5A5A5A" text-anchor="end">02</text>

  <!-- ============ COUCHE 1 : IDENTITÉ ============ -->
  <g class="interactive" data-card="couche-identite" tabindex="0" role="button" aria-label="Couche identité et accès : Web Bot Auth et Visa Trusted Agent Protocol. Cliquez pour les détails">
    <rect x="200" y="564" width="700" height="96" rx="3" fill="#1F5560" opacity="0.08"/>
    <rect x="200" y="564" width="700" height="96" rx="3" fill="none" stroke="#1F5560" stroke-width="1.25"/>
    <text x="228" y="600" class="body" font-size="15" font-weight="600" letter-spacing="0.06em" fill="#1F5560">COUCHE 1 · IDENTITÉ &amp; ACCÈS</text>
    <text x="228" y="624" class="body" font-size="15" fill="#1A1A1A">Web Bot Auth · Visa TAP — qui frappe à la porte, et pour quoi faire</text>
    <text x="228" y="646" class="body" font-size="13" fill="#5A5A5A">Socle technique commun : signatures de message HTTP, RFC 9421. Convergence en cours.</text>
    <rect x="748" y="584" width="128" height="26" rx="3" fill="#1F5560"/>
    <text x="812" y="602" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">Cloudflare · Visa</text>
  </g>
  <text x="176" y="618" class="mono" font-size="13" fill="#5A5A5A" text-anchor="end">01</text>

  <!-- ============ HORS PILE ============ -->
  <g class="interactive" data-card="hors-pile-decouverte" tabindex="0" role="button" aria-label="Hors pile : la délibération de l'agent, invisible au marchand. Cliquez pour les détails">
    <rect x="948" y="316" width="188" height="344" rx="3" fill="#B58A2C" opacity="0.10"/>
    <rect x="948" y="316" width="188" height="344" rx="3" fill="none" stroke="#B58A2C" stroke-width="1.25" stroke-dasharray="2 3"/>
    <text x="968" y="352" class="body" font-size="15" font-weight="600" letter-spacing="0.06em" fill="#B58A2C">HORS PILE</text>
    <text x="968" y="380" class="body" font-size="15" fill="#1A1A1A">La délibération</text>
    <text x="968" y="410" class="body" font-size="13" fill="#5A5A5A">Requête initiale</text>
    <text x="968" y="432" class="body" font-size="13" fill="#5A5A5A">Alternatives écartées</text>
    <text x="968" y="454" class="body" font-size="13" fill="#5A5A5A">Critère de choix</text>
    <text x="968" y="476" class="body" font-size="13" fill="#5A5A5A">Rang dans la liste</text>
    <line x1="968" y1="500" x2="1116" y2="500" stroke="#B58A2C" stroke-width="0.5"/>
    <text x="968" y="528" class="body" font-size="13" fill="#1A1A1A">Se déroule chez le</text>
    <text x="968" y="546" class="body" font-size="13" fill="#1A1A1A">fournisseur d'agent.</text>
    <text x="968" y="576" class="body" font-size="13" font-style="italic" fill="#B58A2C">Aucun protocole</text>
    <text x="968" y="594" class="body" font-size="13" font-style="italic" fill="#B58A2C">n'oblige à la restituer.</text>
  </g>

  <!-- Arrow: la délibération alimente la transaction, sans retour -->
  <line x1="944" y1="364" x2="908" y2="364" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arw02)"/>
  <text x="926" y="348" class="mono" font-size="12" fill="#5A5A5A" text-anchor="middle">→</text>

  <!-- Vertical spine -->
  <line x1="176" y1="192" x2="176" y2="660" stroke="#E5E1D8" stroke-width="1"/>

  <rect x="64" y="700" width="1072" height="1" fill="#E5E1D8"/>
  <text x="64" y="726" class="body" font-size="13" fill="#1A1A1A">Un marchand qui implémente ACP, TAP et Web Bot Auth ne fait pas trois paris concurrents : il équipe trois couches. La ressource rare n'est sur aucune des trois.</text>
  <text x="64" y="758" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : dépôt de spécification ACP (OpenAI/Stripe) ; Google Cloud (AP2) ; Visa Trusted Agent Protocol ; Cloudflare Web Bot Auth ; IETF RFC 9421. Lecture et regroupement par couches : analyse de l'auteur.</text>
</svg>
