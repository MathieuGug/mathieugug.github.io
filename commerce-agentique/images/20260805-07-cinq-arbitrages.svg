<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Cinq arbitrages datés pour une direction data ou marketing, classés par réversibilité et par échéance">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Cinq arbitrages, classés par ce qu'ils coûtent à défaire</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La réversibilité dicte l'ordre — pas l'urgence apparente</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Column headers -->
  <text x="130" y="196" class="mono" font-size="12" letter-spacing="0.08em" fill="#5A5A5A">LA DÉCISION</text>
  <text x="580" y="196" class="mono" font-size="12" letter-spacing="0.08em" fill="#5A5A5A">RÉVERSIBILITÉ</text>
  <text x="800" y="196" class="mono" font-size="12" letter-spacing="0.08em" fill="#5A5A5A">CE QUI LA DATE</text>
  <line x1="88" y1="208" x2="1136" y2="208" stroke="#1A1A1A" stroke-width="1.25"/>

  <!-- ROW 1 -->
  <g class="interactive" data-card="politique-acces" tabindex="0" role="button" aria-label="Arbitrage 1 : fixer une politique d'accès des agents au catalogue — cliquez pour les détails">
    <rect x="88" y="220" width="1048" height="88" rx="3" fill="#1F5560" opacity="0.08"/>
    <circle cx="110" cy="264" r="13" fill="#1F5560"/>
    <text x="110" y="269" class="mono" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <text x="140" y="252" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Fixer une politique d'accès des agents au catalogue</text>
    <text x="140" y="276" class="body" font-size="13" fill="#5A5A5A">Ouvert, signé seulement, ou contractuel. Déploiement en semaines.</text>
    <text x="140" y="296" class="body" font-size="13" font-style="italic" fill="#1F5560">À prendre en premier : peu coûteux, et il produit la donnée sur le volume agentique réel.</text>
    <rect x="580" y="254" width="180" height="14" rx="3" fill="#E5E1D8"/>
    <rect x="580" y="254" width="46" height="14" rx="3" fill="#1F5560"/>
    <text x="580" y="288" class="body" font-size="13" fill="#1F5560">Réversible</text>
    <text x="800" y="258" class="body" font-size="13" fill="#1A1A1A">La brique technique existe déjà</text>
    <text x="800" y="278" class="body" font-size="13" fill="#1A1A1A">(signatures RFC 9421, déployées).</text>
  </g>

  <!-- ROW 2 -->
  <g class="interactive" data-card="clause-verification" tabindex="0" role="button" aria-label="Arbitrage 2 : renégocier les clauses de vérification en régie — cliquez pour les détails">
    <rect x="88" y="320" width="1048" height="88" rx="3" fill="#B58A2C" opacity="0.10"/>
    <circle cx="110" cy="364" r="13" fill="#B58A2C"/>
    <text x="110" y="369" class="mono" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
    <text x="140" y="352" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Ouvrir la renégociation des clauses de vérification en régie</text>
    <text x="140" y="376" class="body" font-size="13" fill="#5A5A5A">Droit d'audit · unité facturée définie et versionnée · triangulation obligatoire.</text>
    <text x="140" y="396" class="body" font-size="13" font-style="italic" fill="#B58A2C">Réversible, mais la fenêtre se referme quand la pratique s'installe comme norme par défaut.</text>
    <rect x="580" y="354" width="180" height="14" rx="3" fill="#E5E1D8"/>
    <rect x="580" y="354" width="76" height="14" rx="3" fill="#B58A2C"/>
    <text x="580" y="388" class="body" font-size="13" fill="#B58A2C">Réversible — mais fenêtré</text>
    <text x="800" y="358" class="body" font-size="13" fill="#1A1A1A">Standards de mesure V2 pleinement</text>
    <text x="800" y="378" class="body" font-size="13" fill="#1A1A1A">applicables depuis juillet 2026.</text>
  </g>

  <!-- ROW 3 -->
  <g class="interactive" data-card="conservation-preuve" tabindex="0" role="button" aria-label="Arbitrage 3 : politique de conservation de la chaîne d'autorisation — cliquez pour les détails">
    <rect x="88" y="420" width="1048" height="88" rx="3" fill="#B7332C" opacity="0.08"/>
    <circle cx="110" cy="464" r="13" fill="#B7332C"/>
    <text x="110" y="469" class="mono" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
    <text x="140" y="452" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Décider d'une politique de conservation de la chaîne d'autorisation</text>
    <text x="140" y="476" class="body" font-size="13" fill="#5A5A5A">Durée, format, responsable. Trois lignes à écrire.</text>
    <text x="140" y="496" class="body" font-size="13" font-style="italic" fill="#B7332C">Ce qui n'a pas été conservé au moment de la transaction ne se reconstitue pas.</text>
    <rect x="580" y="454" width="180" height="14" rx="3" fill="#E5E1D8"/>
    <rect x="580" y="454" width="146" height="14" rx="3" fill="#B7332C"/>
    <text x="580" y="488" class="body" font-size="13" fill="#B7332C">Peu réversible</text>
    <text x="800" y="458" class="body" font-size="13" fill="#1A1A1A">Chaque transaction agentique non</text>
    <text x="800" y="478" class="body" font-size="13" fill="#1A1A1A">journalisée est perdue définitivement.</text>
  </g>

  <!-- ROW 4 -->
  <g class="interactive" data-card="reprovisionner-mesure" tabindex="0" role="button" aria-label="Arbitrage 4 : re-provisionner la mesure sur l'incrémentalité expérimentale — cliquez pour les détails">
    <rect x="88" y="520" width="1048" height="88" rx="3" fill="#B7332C" opacity="0.14"/>
    <rect x="88" y="520" width="1048" height="88" rx="3" fill="none" stroke="#B7332C" stroke-width="2.5"/>
    <circle cx="110" cy="564" r="13" fill="#B7332C"/>
    <text x="110" y="569" class="mono" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">4</text>
    <text x="140" y="552" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Re-provisionner la mesure sur l'incrémentalité expérimentale</text>
    <text x="140" y="576" class="body" font-size="13" fill="#5A5A5A">Cadence annuelle · budget témoin provisionné à l'exercice · règle de décision pré-enregistrée.</text>
    <text x="140" y="596" class="body" font-size="13" font-style="italic" fill="#B7332C">Qui décide en 2026 dispose d'une capacité en 2027. Qui attend le constat d'échec décidera trop tard.</text>
    <rect x="580" y="554" width="180" height="14" rx="3" fill="#E5E1D8"/>
    <rect x="580" y="554" width="168" height="14" rx="3" fill="#B7332C"/>
    <text x="580" y="588" class="body" font-size="13" fill="#B7332C">Délai de constitution long</text>
    <text x="800" y="558" class="body" font-size="13" fill="#1A1A1A">La montée en charge du canal, pas</text>
    <text x="800" y="578" class="body" font-size="13" fill="#1A1A1A">une échéance réglementaire.</text>
  </g>

  <!-- ROW 5 -->
  <g class="interactive" data-card="non-standardisation" tabindex="0" role="button" aria-label="Arbitrage 5 : ne pas standardiser prématurément sur un protocole — cliquez pour les détails">
    <rect x="88" y="620" width="1048" height="88" rx="3" fill="#1F5560" opacity="0.08"/>
    <circle cx="110" cy="664" r="13" fill="none" stroke="#1F5560" stroke-width="1.25"/>
    <text x="110" y="669" class="mono" font-size="13" font-weight="600" fill="#1F5560" text-anchor="middle">5</text>
    <text x="140" y="652" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Ne pas standardiser prématurément sur un protocole</text>
    <text x="140" y="676" class="body" font-size="13" fill="#5A5A5A">Implémenter couche par couche ce qui est nécessaire. Aucune des trois ne se dispute la ressource rare.</text>
    <text x="140" y="696" class="body" font-size="13" font-style="italic" fill="#1F5560">La décision la plus rentable du lot est ici de ne pas décider.</text>
    <rect x="580" y="654" width="180" height="14" rx="3" fill="#E5E1D8"/>
    <rect x="580" y="654" width="18" height="14" rx="3" fill="#1F5560"/>
    <text x="580" y="688" class="body" font-size="13" fill="#1F5560">N'engage rien</text>
    <text x="800" y="658" class="body" font-size="13" fill="#1A1A1A">La couche identité converge déjà</text>
    <text x="800" y="678" class="body" font-size="13" fill="#1A1A1A">sur un socle technique commun.</text>
  </g>

  <rect x="64" y="730" width="1072" height="1" fill="#E5E1D8"/>
  <text x="64" y="754" class="body" font-size="13" fill="#1A1A1A">Ordre recommandé : 1 et 3 d'abord (peu coûteux, l'un produit de la donnée, l'autre se perd si on attend), puis 2 tant que la fenêtre est ouverte, puis 4 comme chantier de fond.</text>
  <text x="64" y="780" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Grille de décision : analyse de l'auteur, adossée aux sources du dossier. Les échéances citées sont des repères de calendrier public, pas des obligations réglementaires en vigueur.</text>
</svg>
