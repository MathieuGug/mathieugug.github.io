<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Anatomie d'une transaction agentique : ce qui reste chez le fournisseur d'agent et ce qui traverse jusqu'au marchand">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Mieux authentifiée, moins observable</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce que la transaction agentique fait traverser — et ce qu'elle retient</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Zone labels -->
  <text x="88" y="200" class="body" font-size="15" font-weight="600" letter-spacing="0.06em" fill="#B58A2C">CHEZ LE FOURNISSEUR D'AGENT</text>
  <text x="700" y="200" class="body" font-size="15" font-weight="600" letter-spacing="0.06em" fill="#1F5560">CHEZ LE MARCHAND</text>

  <!-- Opaque zone -->
  <rect x="88" y="216" width="500" height="392" rx="3" fill="#B58A2C" opacity="0.08"/>
  <rect x="88" y="216" width="500" height="392" rx="3" fill="none" stroke="#B58A2C" stroke-width="1.25" stroke-dasharray="2 3"/>

  <g class="interactive" data-card="requete-initiale" tabindex="0" role="button" aria-label="La requête initiale de l'utilisateur — cliquez pour les détails">
    <rect x="116" y="244" width="444" height="62" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="136" y="270" class="body" font-size="15" font-weight="600" fill="#1A1A1A">1 · La requête initiale</text>
    <text x="136" y="292" class="body" font-size="13" fill="#5A5A5A">Formulation, contraintes, budget déclaré, urgence.</text>
  </g>

  <g class="interactive" data-card="deliberation" tabindex="0" role="button" aria-label="La délibération de l'agent : alternatives, critères, classement — cliquez pour les détails">
    <rect x="116" y="322" width="444" height="128" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="2.5"/>
    <text x="136" y="348" class="body" font-size="15" font-weight="600" fill="#1A1A1A">2 · La délibération</text>
    <text x="136" y="372" class="body" font-size="13" fill="#5A5A5A">Marchands consultés · alternatives écartées</text>
    <text x="136" y="392" class="body" font-size="13" fill="#5A5A5A">Critère décisif : prix, délai, stock, avis, rang</text>
    <text x="136" y="412" class="body" font-size="13" fill="#5A5A5A">Durée de délibération · nombre d'itérations</text>
    <text x="136" y="437" class="body" font-size="13" font-style="italic" fill="#B58A2C">C'est ici que se formait la préférence. Plus rien n'en sort.</text>
  </g>

  <rect x="116" y="466" width="444" height="52" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1.25"/>
  <text x="136" y="490" class="body" font-size="15" font-weight="600" fill="#1A1A1A">3 · L'exposition — si tant est qu'il y en ait eu une</text>
  <text x="136" y="510" class="body" font-size="13" fill="#5A5A5A">Un agent n'a rien vu. Il a ingéré des données.</text>

  <text x="116" y="558" class="body" font-size="13" font-style="italic" fill="#B58A2C">Aucune obligation de restitution dans aucun des six protocoles.</text>
  <text x="116" y="582" class="body" font-size="13" font-style="italic" fill="#B58A2C">Bonne raison commerciale de ne pas restituer.</text>

  <!-- Membrane -->
  <line x1="624" y1="192" x2="624" y2="640" stroke="#B7332C" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="624" y="182" class="mono" font-size="12" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">FRONTIÈRE D'OBSERVATION</text>

  <!-- Crossing arrows -->
  <line x1="566" y1="386" x2="676" y2="386" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arw03)"/>
  <text x="624" y="374" class="mono" font-size="12" fill="#B7332C" text-anchor="middle">le seul passage</text>

  <!-- Merchant zone -->
  <rect x="676" y="216" width="460" height="392" rx="3" fill="#1F5560" opacity="0.08"/>
  <rect x="676" y="216" width="460" height="392" rx="3" fill="none" stroke="#1F5560" stroke-width="1.25"/>

  <g class="interactive" data-card="mandat-signe" tabindex="0" role="button" aria-label="Le mandat signé et le panier figé reçus par le marchand — cliquez pour les détails">
    <rect x="704" y="244" width="404" height="76" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.25"/>
    <text x="724" y="270" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Panier figé, signé, non répudiable</text>
    <text x="724" y="292" class="body" font-size="13" fill="#5A5A5A">Articles et prix exacts, approuvés par l'utilisateur.</text>
    <text x="724" y="312" class="body" font-size="13" fill="#5A5A5A">Objet dont le commerce en ligne n'a jamais disposé.</text>
  </g>

  <g class="interactive" data-card="jeton-borne" tabindex="0" role="button" aria-label="Le jeton de paiement borné en montant et en durée — cliquez pour les détails">
    <rect x="704" y="336" width="404" height="62" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.25"/>
    <text x="724" y="362" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Jeton de paiement borné</text>
    <text x="724" y="384" class="body" font-size="13" fill="#5A5A5A">Montant maximal et expiration. Usage unique.</text>
  </g>

  <g class="interactive" data-card="retour-marchand" tabindex="0" role="button" aria-label="Identité d'agent vérifiée et identifiants consentis du consommateur — cliquez pour les détails">
    <rect x="704" y="414" width="404" height="104" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.25"/>
    <text x="724" y="440" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Identité vérifiée — de l'agent, et parfois du client</text>
    <text x="724" y="462" class="body" font-size="13" fill="#5A5A5A">Signature liée au domaine, horodatée, non rejouable.</text>
    <text x="724" y="482" class="body" font-size="13" fill="#5A5A5A">Preuve d'instruction valide de l'utilisateur.</text>
    <text x="724" y="502" class="body" font-size="13" fill="#5A5A5A">Identifiants consentis : compte de paiement, fidélité, courriel.</text>
  </g>

  <text x="704" y="552" class="body" font-size="13" font-style="italic" fill="#1F5560">Identité au moment de payer — pas au moment d'être exposé.</text>
  <text x="704" y="576" class="body" font-size="13" font-style="italic" fill="#1F5560">Inutilisable pour rattacher une vente à un stimulus.</text>

  <!-- Bottom band -->
  <rect x="88" y="640" width="1048" height="46" rx="3" fill="#B7332C"/>
  <text x="112" y="669" class="body" font-size="15" font-weight="600" fill="#FAF8F3">La donnée comportementale du marchand ne commence plus à la première visite. Elle commence à la mise au panier.</text>

  <rect x="64" y="716" width="1072" height="1" fill="#E5E1D8"/>
  <text x="64" y="742" class="body" font-size="13" fill="#1A1A1A">Le contentieux « je n'ai pas commandé ça » devient tranchable par la preuve. La question « qu'est-ce qui a causé cette vente » devient sans réponse.</text>
  <text x="64" y="772" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : spécification ACP (délégation de paiement, flux produit) ; Google Cloud, mandats AP2 ; Visa Trusted Agent Protocol. Découpage opaque / observable : analyse de l'auteur.</text>
</svg>
