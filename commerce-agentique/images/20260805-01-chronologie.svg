<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Chronologie du commerce agentique de septembre 2025 à juillet 2026, en trois pistes : protocoles, standards de mesure, contexte de marché et régulation">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Dix mois de normalisation, zéro norme de mesure</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Septembre 2025 – juillet 2026 : la couche agentique s'installe par le paiement et la sécurité</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Axis -->
  <line x1="140" y1="660" x2="1136" y2="660" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arw01)"/>
  <g class="mono" font-size="12" fill="#5A5A5A" text-anchor="middle">
    <text x="140" y="684">SEP 25</text>
    <text x="336" y="684">NOV 25</text>
    <text x="532" y="684">JAN 26</text>
    <text x="728" y="684">MAR 26</text>
    <text x="924" y="684">MAI 26</text>
    <text x="1120" y="684">JUIL 26</text>
  </g>
  <g stroke="#E5E1D8" stroke-width="0.5">
    <line x1="140" y1="200" x2="140" y2="655"/>
    <line x1="336" y1="200" x2="336" y2="655"/>
    <line x1="532" y1="200" x2="532" y2="655"/>
    <line x1="728" y1="200" x2="728" y2="655"/>
    <line x1="924" y1="200" x2="924" y2="655"/>
    <line x1="1120" y1="200" x2="1120" y2="655"/>
  </g>

  <!-- Track labels -->
  <text x="64" y="248" class="mono" font-size="12" letter-spacing="0.08em" fill="#B7332C">PROTOCOLES</text>
  <text x="64" y="418" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560">STANDARDS</text>
  <text x="64" y="418" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560" dy="16">DE MESURE</text>
  <text x="64" y="578" class="mono" font-size="12" letter-spacing="0.08em" fill="#B58A2C">MARCHÉ &amp;</text>
  <text x="64" y="578" class="mono" font-size="12" letter-spacing="0.08em" fill="#B58A2C" dy="16">RÉGULATION</text>

  <line x1="140" y1="310" x2="1136" y2="310" stroke="#B7332C" stroke-width="0.5" stroke-dasharray="2 3"/>
  <line x1="140" y1="470" x2="1136" y2="470" stroke="#1F5560" stroke-width="0.5" stroke-dasharray="2 3"/>
  <line x1="140" y1="600" x2="1136" y2="600" stroke="#B58A2C" stroke-width="0.5" stroke-dasharray="2 3"/>

  <!-- ===== PROTOCOLES ===== -->
  <!-- AP2 -->
  <g class="interactive" data-card="ap2-lancement" tabindex="0" role="button" aria-label="AP2, Agent Payments Protocol, lancé le 16 septembre 2025 — cliquez pour les détails">
    <line x1="185" y1="310" x2="185" y2="242" stroke="#B7332C" stroke-width="1.25"/>
    <circle cx="185" cy="310" r="6" fill="#B7332C"/>
    <rect x="150" y="204" width="146" height="38" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25"/>
    <text x="162" y="222" class="body" font-size="15" font-weight="600" fill="#1A1A1A">AP2 · Google</text>
    <text x="162" y="237" class="body" font-size="13" fill="#5A5A5A">16 sept. · 3 mandats</text>
  </g>
  <!-- ACP -->
  <g class="interactive" data-card="acp-lancement" tabindex="0" role="button" aria-label="ACP et Instant Checkout, OpenAI et Stripe, 29 septembre 2025 — cliquez pour les détails">
    <line x1="232" y1="310" x2="232" y2="346" stroke="#B7332C" stroke-width="2.5"/>
    <circle cx="232" cy="310" r="6" fill="#B7332C"/>
    <rect x="186" y="346" width="188" height="38" rx="3" fill="#B7332C"/>
    <text x="198" y="364" class="body" font-size="15" font-weight="600" fill="#FAF8F3">ACP · OpenAI + Stripe</text>
    <text x="198" y="379" class="body" font-size="13" fill="#FAF8F3" opacity="0.85">29 sept. · Instant Checkout</text>
  </g>
  <!-- Couche identité -->
  <g class="interactive" data-card="couche-identite" tabindex="0" role="button" aria-label="Couche identité : Visa Trusted Agent Protocol et Web Bot Auth — cliquez pour les détails">
    <line x1="300" y1="310" x2="300" y2="266" stroke="#B7332C" stroke-width="1.25"/>
    <circle cx="300" cy="310" r="6" fill="#B7332C"/>
    <line x1="410" y1="310" x2="410" y2="266" stroke="#B7332C" stroke-width="1.25"/>
    <circle cx="410" cy="310" r="6" fill="#B7332C"/>
    <rect x="300" y="204" width="248" height="62" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25"/>
    <text x="312" y="223" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Couche identité</text>
    <text x="312" y="240" class="body" font-size="13" fill="#5A5A5A">Visa TAP (oct. 25) · Web Bot Auth</text>
    <text x="312" y="256" class="body" font-size="13" fill="#5A5A5A">Socle commun : RFC 9421</text>
  </g>
  <!-- ACP version stable -->
  <line x1="843" y1="310" x2="843" y2="256" stroke="#B7332C" stroke-width="1.25"/>
  <circle cx="843" cy="310" r="5" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25"/>
  <text x="843" y="248" class="body" font-size="13" fill="#5A5A5A" text-anchor="middle">ACP v2026-04-17</text>
  <text x="843" y="232" class="body" font-size="13" fill="#5A5A5A" text-anchor="middle">(version stable)</text>

  <!-- ===== STANDARDS ===== -->
  <g class="interactive" data-card="standards-pub" tabindex="0" role="button" aria-label="Standards publicitaires : IAB Europe V2 et AAMP — cliquez pour les détails">
    <line x1="532" y1="470" x2="532" y2="428" stroke="#1F5560" stroke-width="2.5"/>
    <circle cx="532" cy="470" r="6" fill="#1F5560"/>
    <rect x="452" y="390" width="216" height="38" rx="3" fill="#1F5560"/>
    <text x="464" y="408" class="body" font-size="15" font-weight="600" fill="#FAF8F3">IAB Europe · Standards V2</text>
    <text x="464" y="423" class="body" font-size="13" fill="#FAF8F3" opacity="0.85">janv. 26 · fenêtre 30 jours</text>

    <line x1="655" y1="470" x2="655" y2="508" stroke="#1F5560" stroke-width="1.25"/>
    <circle cx="655" cy="470" r="6" fill="#1F5560"/>
    <line x1="745" y1="470" x2="745" y2="508" stroke="#1F5560" stroke-width="1.25"/>
    <circle cx="745" cy="470" r="6" fill="#1F5560"/>
    <rect x="620" y="508" width="252" height="54" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.25"/>
    <text x="632" y="527" class="body" font-size="15" font-weight="600" fill="#1A1A1A">AAMP · IAB Tech Lab</text>
    <text x="632" y="544" class="body" font-size="13" fill="#5A5A5A">nommé fév. 26 · cadre mars 26</text>
    <text x="632" y="558" class="body" font-size="13" fill="#5A5A5A">socle OpenRTB / AdCOM + MCP</text>
  </g>
  <line x1="1105" y1="470" x2="1105" y2="428" stroke="#1F5560" stroke-width="1.25"/>
  <circle cx="1105" cy="470" r="5" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.25"/>
  <text x="1136" y="420" class="body" font-size="13" fill="#5A5A5A" text-anchor="end">AAMP 2.3 · 30 juil. 26</text>
  <text x="1136" y="404" class="body" font-size="13" fill="#5A5A5A" text-anchor="end">Fin transition V2 · juil. 26</text>

  <!-- ===== MARCHÉ &amp; RÉGULATION ===== -->
  <rect x="336" y="586" width="134" height="28" rx="3" fill="#B58A2C" opacity="0.18"/>
  <text x="403" y="605" class="mono" font-size="13" font-weight="500" fill="#B58A2C" text-anchor="middle">+693 %</text>
  <text x="403" y="632" class="body" font-size="13" fill="#5A5A5A" text-anchor="middle">pic fin d'année 25</text>

  <rect x="532" y="586" width="196" height="28" rx="3" fill="#B58A2C" opacity="0.18"/>
  <text x="630" y="605" class="mono" font-size="13" font-weight="500" fill="#B58A2C" text-anchor="middle">+393 % · T1 2026</text>
  <text x="630" y="632" class="body" font-size="13" fill="#5A5A5A" text-anchor="middle">trafic référé par assistant (annoncé)</text>

  <g class="interactive" data-card="regulation" tabindex="0" role="button" aria-label="Régulation : DSP2 sans case pour l'agent, DSP3 en discussion — cliquez pour les détails">
    <line x1="770" y1="600" x2="1136" y2="600" stroke="#B58A2C" stroke-width="2.5"/>
    <rect x="770" y="540" width="366" height="54" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="782" y="559" class="body" font-size="15" font-weight="600" fill="#1A1A1A">DSP2 · authentification forte du client</text>
    <text x="782" y="576" class="body" font-size="13" fill="#5A5A5A">Aucune case pour un agent. Parade de marché :</text>
    <text x="782" y="590" class="body" font-size="13" fill="#5A5A5A">mandat pré-approuvé. DSP3 / RSP devront trancher.</text>
  </g>

  <!-- Legend / punchline -->
  <rect x="64" y="716" width="1072" height="1" fill="#E5E1D8"/>
  <text x="64" y="742" class="body" font-size="13" fill="#1A1A1A">La normalisation est venue de ceux qui portaient un risque de fraude ou de responsabilité. Personne ne porte de risque symétrique sur la mesure — donc personne ne l'a normalisée.</text>
  <text x="64" y="772" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : Google Cloud (AP2) ; dépôt de spécification ACP ; Visa TAP ; Cloudflare / IETF RFC 9421 ; IAB Europe ; IAB Tech Lab ; Adobe Digital Insights. Volumétries annoncées par leurs auteurs, non auditées.</text>
</svg>
