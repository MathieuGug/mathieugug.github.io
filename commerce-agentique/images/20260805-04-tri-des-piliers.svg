<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Matrice : les quatre familles de mesure marketing croisées avec les briques d'observation que le commerce agentique retire, et le verdict par famille">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce n'est pas une dégradation. C'est un tri.</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre familles de mesure, quatre briques d'observation retirées — et un survivant</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Column headers -->
  <g class="interactive" data-card="brique-exposition" tabindex="0" role="button" aria-label="Les quatre briques d'observation que l'agentique retire — cliquez pour les détails">
    <rect x="352" y="192" width="516" height="52" rx="3" fill="#B7332C" opacity="0.08"/>
    <text x="610" y="212" class="mono" font-size="12" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">CE QUE L'AGENTIQUE RETIRE</text>
    <text x="412" y="236" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Exposition</text>
    <text x="542" y="236" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Parcours</text>
    <text x="672" y="236" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Session</text>
    <text x="802" y="236" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Identité</text>
  </g>
  <text x="88" y="236" class="mono" font-size="12" letter-spacing="0.08em" fill="#5A5A5A">FAMILLE DE MESURE</text>
  <g class="interactive" data-card="verdict" tabindex="0" role="button" aria-label="Colonne verdict : le sort de chaque famille de mesure — cliquez pour les détails">
    <rect x="890" y="192" width="246" height="52" rx="3" fill="#1F5560" opacity="0.10"/>
    <text x="1013" y="224" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560" text-anchor="middle">VERDICT</text>
  </g>

  <line x1="88" y1="254" x2="1136" y2="254" stroke="#1A1A1A" stroke-width="1.25"/>

  <!-- ROW 1 — attribution multi-touch -->
  <g class="interactive" data-card="attribution-multitouch" tabindex="0" role="button" aria-label="Attribution multi-touch : sans objet — cliquez pour les détails">
    <rect x="88" y="264" width="1048" height="96" rx="3" fill="#B7332C" opacity="0.07"/>
    <text x="112" y="298" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Attribution multi-touch</text>
    <text x="112" y="320" class="body" font-size="13" fill="#5A5A5A">Dernier clic, premier clic, en U, pilotée par les données</text>
    <text x="112" y="342" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Elle rattache une conversion à une séquence de contacts observés.</text>
    <circle cx="412" cy="312" r="11" fill="#B7332C"/>
    <circle cx="542" cy="312" r="11" fill="#B7332C"/>
    <circle cx="672" cy="312" r="11" fill="#B7332C"/>
    <circle cx="802" cy="312" r="11" fill="#B7332C"/>
    <rect x="890" y="288" width="246" height="48" rx="3" fill="#B7332C"/>
    <text x="1013" y="309" class="body" font-size="15" font-weight="600" fill="#FAF8F3" text-anchor="middle">Sans objet</text>
    <text x="1013" y="327" class="body" font-size="13" fill="#FAF8F3" opacity="0.85" text-anchor="middle">pas dégradée — privée d'objet</text>
  </g>

  <!-- ROW 2 — retail media -->
  <g class="interactive" data-card="retail-media" tabindex="0" role="button" aria-label="Retail media : l'inventaire perd son spectateur mais garde sa valeur — cliquez pour les détails">
    <rect x="88" y="372" width="1048" height="96" rx="3" fill="#B58A2C" opacity="0.10"/>
    <text x="112" y="406" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Retail media</text>
    <text x="112" y="428" class="body" font-size="13" fill="#5A5A5A">Emplacement acheté chez le distributeur, mesuré en boucle fermée</text>
    <text x="112" y="450" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Ce qui est acheté n'est pas un pixel — c'est de l'influence sur une décision.</text>
    <circle cx="412" cy="420" r="11" fill="#B7332C"/>
    <circle cx="542" cy="420" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="672" cy="420" r="11" fill="#B7332C"/>
    <circle cx="802" cy="420" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <rect x="890" y="396" width="246" height="48" rx="3" fill="#B58A2C"/>
    <text x="1013" y="417" class="body" font-size="15" font-weight="600" fill="#FAF8F3" text-anchor="middle">Se déplace</text>
    <text x="1013" y="435" class="body" font-size="13" fill="#FAF8F3" opacity="0.9" text-anchor="middle">crise de l'unité facturée</text>
  </g>

  <!-- ROW 3 — incrémentalité -->
  <g class="interactive" data-card="incrementalite" tabindex="0" role="button" aria-label="Incrémentalité mesurée par expérience : structurellement indemne — cliquez pour les détails">
    <rect x="88" y="480" width="1048" height="96" rx="3" fill="#1F5560" opacity="0.10"/>
    <text x="112" y="514" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Incrémentalité mesurée par expérience</text>
    <text x="112" y="536" class="body" font-size="13" fill="#5A5A5A">Tests géographiques, bascule temporelle, contrôle synthétique</text>
    <text x="112" y="558" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Compare des agrégats traités à des agrégats témoins. N'a jamais vu d'individu.</text>
    <circle cx="412" cy="528" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="542" cy="528" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="672" cy="528" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="802" cy="528" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <rect x="890" y="504" width="246" height="48" rx="3" fill="#1F5560"/>
    <text x="1013" y="525" class="body" font-size="15" font-weight="600" fill="#FAF8F3" text-anchor="middle">Indemne</text>
    <text x="1013" y="543" class="body" font-size="13" fill="#FAF8F3" opacity="0.9" text-anchor="middle">lente et chère — mais valide</text>
  </g>

  <!-- ROW 4 — MMM -->
  <g class="interactive" data-card="mmm" tabindex="0" role="button" aria-label="Modèle de mix marketing : indemne sous condition — cliquez pour les détails">
    <rect x="88" y="588" width="1048" height="96" rx="3" fill="#1F5560" opacity="0.10"/>
    <text x="112" y="622" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Modèle de mix marketing</text>
    <text x="112" y="644" class="body" font-size="13" fill="#5A5A5A">Séries temporelles agrégées de dépense et de ventes, calibrées par tests</text>
    <text x="112" y="666" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Condition de survie : que les ventes agentiques restent comptées par zone.</text>
    <circle cx="412" cy="636" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="542" cy="636" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="672" cy="636" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <circle cx="802" cy="636" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <rect x="890" y="612" width="246" height="48" rx="3" fill="#1F5560" opacity="0.85"/>
    <text x="1013" y="633" class="body" font-size="15" font-weight="600" fill="#FAF8F3" text-anchor="middle">Indemne sous condition</text>
    <text x="1013" y="651" class="body" font-size="13" fill="#FAF8F3" opacity="0.9" text-anchor="middle">géographie exploitable requise</text>
  </g>

  <!-- Legend -->
  <circle cx="100" cy="712" r="8" fill="#B7332C"/>
  <text x="116" y="717" class="body" font-size="13" fill="#5A5A5A">dépend de cette brique</text>
  <circle cx="300" cy="712" r="8" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  <text x="316" y="717" class="body" font-size="13" fill="#5A5A5A">n'en a jamais dépendu</text>

  <rect x="64" y="736" width="1072" height="1" fill="#E5E1D8"/>
  <text x="64" y="760" class="body" font-size="13" fill="#1A1A1A">L'agentique ne dégrade pas l'attribution : elle la prive d'objet, et promeut par élimination la seule famille qui ne dépendait pas de l'observation individuelle.</text>
  <text x="64" y="784" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Grille et verdicts : analyse de l'auteur. Cadres de référence : IAB / MRC, Retail Media Measurement Guidelines (2024) ; IAB Europe, Standards V2 (2026).</text>
</svg>
