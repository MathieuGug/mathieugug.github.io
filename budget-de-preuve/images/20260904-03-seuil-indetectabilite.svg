<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Le seuil d'indétectabilité : quatre profils d'annonceur, leur seuil de rentabilité en effet relatif et le coût de mesure qui en découle">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="820" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le seuil d'indétectabilité</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Deux grandeurs de gestion fixent l'effet qu'il faut savoir détecter. Le carré fait le reste.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- En-têtes de colonnes -->
  <text x="94" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">PROFIL D'ANNONCEUR</text>
  <text x="452" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">INTENSITÉ</text>
  <text x="576" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">MARGE</text>
  <text x="712" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">SEUIL r*</text>
  <text x="896" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">PERSONNES-SEMAINES</text>
  <text x="1106" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">VERDICT</text>

  <!-- Profil 1 -->
  <g class="interactive" data-card="profil-facile" tabindex="0" role="button" aria-label="Distributeur alimentaire — cliquez pour les détails">
    <rect x="64" y="212" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="212" width="5" height="76" fill="#4A7C59"/>
    <text x="94" y="244" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Distributeur alimentaire</text>
    <text x="94" y="268" class="body" font-size="12" fill="#8A8478">Dépense lourde, marge mince</text>
    <text x="452" y="256" class="mono" font-size="15" fill="#5A5A5A" text-anchor="middle">1,5 %</text>
    <text x="576" y="256" class="mono" font-size="15" fill="#5A5A5A" text-anchor="middle">25 %</text>
    <text x="712" y="256" class="mono" font-size="19" fill="#4A7C59" text-anchor="middle">6,0 %</text>
    <text x="896" y="256" class="mono" font-size="15" fill="#1A1A1A" text-anchor="middle">≈ 0,9 M</text>
    <text x="1106" y="252" class="body" font-size="13" fill="#4A7C59" text-anchor="end">Testable dans l'année</text>
  </g>

  <!-- Profil 2 -->
  <g class="interactive" data-card="profil-median" tabindex="0" role="button" aria-label="Enseigne spécialisée — cliquez pour les détails">
    <rect x="64" y="296" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="296" width="5" height="76" fill="#B58A2C"/>
    <text x="94" y="328" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Enseigne spécialisée</text>
    <text x="94" y="352" class="body" font-size="12" fill="#8A8478">Le cas médian du marché</text>
    <text x="452" y="340" class="mono" font-size="15" fill="#5A5A5A" text-anchor="middle">1,0 %</text>
    <text x="576" y="340" class="mono" font-size="15" fill="#5A5A5A" text-anchor="middle">40 %</text>
    <text x="712" y="340" class="mono" font-size="19" fill="#B58A2C" text-anchor="middle">2,5 %</text>
    <text x="896" y="340" class="mono" font-size="15" fill="#1A1A1A" text-anchor="middle">≈ 5,0 M</text>
    <text x="1106" y="336" class="body" font-size="13" fill="#B58A2C" text-anchor="end">Un exercice entier</text>
  </g>

  <!-- Profil 3 -->
  <g class="interactive" data-card="profil-impossible" tabindex="0" role="button" aria-label="Marque premium — cliquez pour les détails">
    <rect x="64" y="380" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="380" width="5" height="76" fill="#B7332C"/>
    <text x="94" y="412" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Marque premium</text>
    <text x="94" y="436" class="body" font-size="12" fill="#8A8478">Dépense légère, marge forte</text>
    <text x="452" y="424" class="mono" font-size="15" fill="#5A5A5A" text-anchor="middle">0,8 %</text>
    <text x="576" y="424" class="mono" font-size="15" fill="#5A5A5A" text-anchor="middle">60 %</text>
    <text x="712" y="424" class="mono" font-size="19" fill="#B7332C" text-anchor="middle">1,3 %</text>
    <text x="896" y="424" class="mono" font-size="15" fill="#B7332C" text-anchor="middle">≈ 18,6 M</text>
    <text x="1106" y="420" class="body" font-size="13" fill="#B7332C" text-anchor="end">Hors de portée</text>
  </g>

  <!-- Profil 4 -->
  <g>
    <rect x="64" y="464" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="464" width="5" height="76" fill="#4A7C59"/>
    <text x="94" y="496" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Éditeur de logiciel</text>
    <text x="94" y="520" class="body" font-size="12" fill="#8A8478">Dépense lourde, marge très forte</text>
    <text x="452" y="508" class="mono" font-size="15" fill="#5A5A5A" text-anchor="middle">3,0 %</text>
    <text x="576" y="508" class="mono" font-size="15" fill="#5A5A5A" text-anchor="middle">80 %</text>
    <text x="712" y="508" class="mono" font-size="19" fill="#4A7C59" text-anchor="middle">3,8 %</text>
    <text x="896" y="508" class="mono" font-size="15" fill="#1A1A1A" text-anchor="middle">≈ 2,2 M</text>
    <text x="1106" y="504" class="body" font-size="13" fill="#4A7C59" text-anchor="end">Testable dans l'année</text>
  </g>

  <!-- La règle -->
  <g class="interactive" data-card="regle-marge" tabindex="0" role="button" aria-label="La règle contre-intuitive — cliquez pour les détails">
    <rect x="64" y="570" width="640" height="184" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="570" width="5" height="184" fill="#1F5560"/>
    <text x="94" y="600" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">LA RÈGLE QUI SURPREND EN RÉUNION</text>
    <text x="94" y="636" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Plus une entreprise est rentable,</text>
    <text x="94" y="664" class="display" font-size="22" font-weight="600" fill="#1A1A1A">plus il lui coûte cher de savoir</text>
    <text x="94" y="692" class="display" font-size="22" font-weight="600" fill="#1A1A1A">si sa publicité l'est.</text>
    <text x="94" y="724" class="body" font-size="13" fill="#5A5A5A">Une marge élevée abaisse le seuil de rentabilité, donc l'effet</text>
    <text x="94" y="744" class="body" font-size="13" fill="#5A5A5A">à distinguer de zéro, donc le coût de l'expérience au carré.</text>
  </g>

  <!-- Formule -->
  <g>
    <rect x="728" y="570" width="408" height="184" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="756" y="600" class="mono" font-size="11" letter-spacing="0.1em" fill="#5A5A5A">LE SEUIL DE RENTABILITÉ EN EFFET RELATIF</text>
    <text x="756" y="644" class="mono" font-size="22" fill="#1A1A1A">r* = (d / μ) / m</text>
    <text x="756" y="678" class="body" font-size="12.5" fill="#5A5A5A"><tspan class="mono" fill="#1A1A1A">d/μ</tspan> · intensité publicitaire</text>
    <text x="756" y="700" class="body" font-size="12.5" fill="#5A5A5A"><tspan class="mono" fill="#1A1A1A">m</tspan> · marge sur ventes incrémentales</text>
    <text x="756" y="734" class="body" font-size="12" font-style="italic" fill="#1F5560">Aucun choix statistique n'entre dans ce calcul.</text>
  </g>

  <line x1="64" y1="778" x2="1136" y2="778" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="802" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B8B5AE">CALCUL DE L'AUTEUR · CV = 10, PUISSANCE 80 %, SEUIL 5 % BILATÉRAL · INTENSITÉS ET MARGES : HYPOTHÈSES DE TRAVAIL, À REMPLACER PAR LES VALEURS DE L'ENTREPRISE</text>
</svg>
