<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Le dispositif de renoncement sur l'année : cadrage, conception, exécution, restitution">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le dispositif de renoncement</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre moments de l'année. Chacun ferme une porte que le suivant ne pourra plus rouvrir.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">DE LA CONTRAINTE STATISTIQUE À L'ARBITRAGE ASSUMÉ</text>
  <g class="interactive" data-card="cadrage" tabindex="0" role="button" aria-label="T0 · CADRAGE ANNUEL — cliquez pour les détails">
    <rect x="64" y="230" width="244" height="380" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="230" width="244" height="5" fill="#1F5560"/>
    <text x="88" y="264" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#1F5560">T0 · CADRAGE ANNUEL</text>
    <text x="88" y="294" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Le seuil est calculé</text>
    <text x="88" y="326" class="body" font-size="12.5" fill="#5A5A5A">Trois grandeurs de gestion :</text>
    <text x="88" y="344" class="body" font-size="12.5" fill="#5A5A5A">intensité publicitaire, marge</text>
    <text x="88" y="362" class="body" font-size="12.5" fill="#5A5A5A">sur ventes incrémentales,</text>
    <text x="88" y="380" class="body" font-size="12.5" fill="#5A5A5A">coefficient de variation des</text>
    <text x="88" y="398" class="body" font-size="12.5" fill="#5A5A5A">ventes.</text>
    <line x1="88" y1="422" x2="284" y2="422" stroke="#E5E1D8" stroke-width="1"/>
    <text x="88" y="440" class="mono" font-size="10" letter-spacing="0.09em" fill="#1F5560">PRODUIT</text>
    <text x="88" y="458" class="body" font-size="12.5" fill="#1A1A1A">Deux nombres : le seuil r* et</text>
    <text x="88" y="476" class="body" font-size="12.5" fill="#1A1A1A">l'effet minimum atteignable.</text>
    <text x="88" y="506" class="mono" font-size="10" letter-spacing="0.09em" fill="#1F5560">SIGNÉ PAR</text>
    <text x="88" y="526" class="body" font-size="12.5" fill="#5A5A5A">Le niveau qui arbitre le plan</text>
    <text x="88" y="544" class="body" font-size="12.5" fill="#5A5A5A">média.</text>
  </g>
  <line x1="312" y1="420" x2="321" y2="420" stroke="#B8B5AE" stroke-width="1.5"/>
  <path d="M 321 415 L 328 420 L 321 425 Z" fill="#B8B5AE"/>
  <g class="interactive" data-card="conception" tabindex="0" role="button" aria-label="T−6 SEMAINES · CONCEPTION — cliquez pour les détails">
    <rect x="340" y="230" width="244" height="380" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="340" y="230" width="244" height="5" fill="#1F5560"/>
    <text x="364" y="264" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#1F5560">T−6 SEMAINES · CONCEPTION</text>
    <text x="364" y="294" class="display" font-size="17" font-weight="600" fill="#1A1A1A">L'effet détectable</text>
    <text x="364" y="318" class="display" font-size="17" font-weight="600" fill="#1A1A1A">avant le budget</text>
    <text x="364" y="350" class="body" font-size="12.5" fill="#5A5A5A">Simulation sur l'historique,</text>
    <text x="364" y="368" class="body" font-size="12.5" fill="#5A5A5A">sélection des marchés</text>
    <text x="364" y="386" class="body" font-size="12.5" fill="#5A5A5A">témoins, comparaison de</text>
    <text x="364" y="404" class="body" font-size="12.5" fill="#5A5A5A">l'effet minimum détectable au</text>
    <text x="364" y="422" class="body" font-size="12.5" fill="#5A5A5A">seuil r*.</text>
    <line x1="364" y1="446" x2="560" y2="446" stroke="#E5E1D8" stroke-width="1"/>
    <text x="364" y="464" class="mono" font-size="10" letter-spacing="0.09em" fill="#1F5560">RÈGLE</text>
    <text x="364" y="482" class="body" font-size="12.5" fill="#1A1A1A">Si l'effet détectable dépasse</text>
    <text x="364" y="500" class="body" font-size="12.5" fill="#1A1A1A">r*, le test ne se lance pas.</text>
    <text x="364" y="530" class="mono" font-size="10" letter-spacing="0.09em" fill="#1F5560">VERROU</text>
    <text x="364" y="550" class="body" font-size="12.5" fill="#5A5A5A">Aucune dérogation pour «</text>
    <text x="364" y="568" class="body" font-size="12.5" fill="#5A5A5A">avoir un chiffre ».</text>
  </g>
  <line x1="588" y1="420" x2="597" y2="420" stroke="#B8B5AE" stroke-width="1.5"/>
  <path d="M 597 415 L 604 420 L 597 425 Z" fill="#B8B5AE"/>
  <g class="interactive" data-card="execution" tabindex="0" role="button" aria-label="PENDANT · EXÉCUTION — cliquez pour les détails">
    <rect x="616" y="230" width="244" height="380" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="616" y="230" width="244" height="5" fill="#B58A2C"/>
    <text x="640" y="264" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B58A2C">PENDANT · EXÉCUTION</text>
    <text x="640" y="294" class="display" font-size="17" font-weight="600" fill="#1A1A1A">La règle est déjà</text>
    <text x="640" y="318" class="display" font-size="17" font-weight="600" fill="#1A1A1A">écrite</text>
    <text x="640" y="350" class="body" font-size="12.5" fill="#5A5A5A">Durée figée, règle d'arrêt</text>
    <text x="640" y="368" class="body" font-size="12.5" fill="#5A5A5A">figée, et la décision prévue</text>
    <text x="640" y="386" class="body" font-size="12.5" fill="#5A5A5A">pour chacune des trois</text>
    <text x="640" y="404" class="body" font-size="12.5" fill="#5A5A5A">issues, y compris celle qui</text>
    <text x="640" y="422" class="body" font-size="12.5" fill="#5A5A5A">ne tranche pas.</text>
    <line x1="640" y1="446" x2="836" y2="446" stroke="#E5E1D8" stroke-width="1"/>
    <text x="640" y="464" class="mono" font-size="10" letter-spacing="0.09em" fill="#B58A2C">PRODUIT</text>
    <text x="640" y="482" class="body" font-size="12.5" fill="#1A1A1A">Un protocole daté, déposé</text>
    <text x="640" y="500" class="body" font-size="12.5" fill="#1A1A1A">avant le premier euro</text>
    <text x="640" y="518" class="body" font-size="12.5" fill="#1A1A1A">dépensé.</text>
    <text x="640" y="548" class="mono" font-size="10" letter-spacing="0.09em" fill="#B58A2C">VERROU</text>
    <text x="640" y="568" class="body" font-size="12.5" fill="#5A5A5A">Rien ne se renégocie en cours</text>
    <text x="640" y="586" class="body" font-size="12.5" fill="#5A5A5A">de test.</text>
  </g>
  <line x1="864" y1="420" x2="873" y2="420" stroke="#B8B5AE" stroke-width="1.5"/>
  <path d="M 873 415 L 880 420 L 873 425 Z" fill="#B8B5AE"/>
  <g class="interactive" data-card="restitution" tabindex="0" role="button" aria-label="APRÈS · RESTITUTION — cliquez pour les détails">
    <rect x="892" y="230" width="244" height="380" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="892" y="230" width="244" height="5" fill="#B7332C"/>
    <text x="916" y="264" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">APRÈS · RESTITUTION</text>
    <text x="916" y="294" class="display" font-size="17" font-weight="600" fill="#1A1A1A">L'intervalle voyage</text>
    <text x="916" y="318" class="display" font-size="17" font-weight="600" fill="#1A1A1A">avec le point</text>
    <text x="916" y="350" class="body" font-size="12.5" fill="#5A5A5A">L'estimation ponctuelle ne</text>
    <text x="916" y="368" class="body" font-size="12.5" fill="#5A5A5A">circule jamais seule, en note</text>
    <text x="916" y="386" class="body" font-size="12.5" fill="#5A5A5A">de synthèse comme en comité.</text>
    <line x1="916" y1="410" x2="1112" y2="410" stroke="#E5E1D8" stroke-width="1"/>
    <text x="916" y="428" class="mono" font-size="10" letter-spacing="0.09em" fill="#B7332C">SUIVI</text>
    <text x="916" y="446" class="body" font-size="12.5" fill="#1A1A1A">Le taux de tests concluants,</text>
    <text x="916" y="464" class="body" font-size="12.5" fill="#1A1A1A">lu comme un indicateur de</text>
    <text x="916" y="482" class="body" font-size="12.5" fill="#1A1A1A">qualité.</text>
    <text x="916" y="512" class="mono" font-size="10" letter-spacing="0.09em" fill="#B7332C">ALERTE</text>
    <text x="916" y="532" class="body" font-size="12.5" fill="#5A5A5A">Un taux élevé signale une</text>
    <text x="916" y="550" class="body" font-size="12.5" fill="#5A5A5A">sélection dans ce qui</text>
    <text x="916" y="568" class="body" font-size="12.5" fill="#5A5A5A">remonte.</text>
  </g>

  <g>
    <rect x="64" y="640" width="1072" height="106" rx="3" fill="#F2EFE7" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="640" width="5" height="106" fill="#1F5560"/>
    <text x="94" y="670" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">LA RÈGLE QUE L'OUTILLAGE APPLIQUE DÉJÀ, ET QUE LA GOUVERNANCE N'A PAS REPRISE</text>
    <text x="94" y="706" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Ne pas lancer un test dont l'effet minimum détectable dépasse l'effet sur lequel on agirait.</text>
    <text x="94" y="732" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Énoncée dans les guides de test géographique. Absente de la quasi-totalité des notes de cadrage.</text>
  </g>
</svg>
