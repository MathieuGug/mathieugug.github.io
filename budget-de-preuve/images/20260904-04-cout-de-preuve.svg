<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Six questions marketing rangées par coût de preuve, avec le verdict de chacune">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="900" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Six questions, six coûts de preuve</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le plan de mesure n'est pas la liste des questions. C'est la colonne de droite.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="300" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">QUESTION POSÉE PAR LA DIRECTION</text>
  <text x="880" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">COÛT RELATIF</text>
  <text x="1106" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">VERDICT</text>
  <rect x="64" y="214" width="200" height="180" rx="3" fill="#4A7C59" opacity="0.10"/>
  <rect x="64" y="214" width="4" height="180" fill="#4A7C59"/>
  <text x="88" y="244" class="mono" font-size="11.5" letter-spacing="0.1em" fill="#4A7C59">SOCLE TESTABLE</text>
  <text x="88" y="268" class="body" font-size="11.5" fill="#5A5A5A">Ce qu'un budget de mesure</text>
  <text x="88" y="284" class="body" font-size="11.5" fill="#5A5A5A">ordinaire tranche.</text>
  <rect x="64" y="402" width="200" height="86" rx="3" fill="#B58A2C" opacity="0.10"/>
  <rect x="64" y="402" width="4" height="86" fill="#B58A2C"/>
  <text x="88" y="432" class="mono" font-size="11.5" letter-spacing="0.1em" fill="#B58A2C">ZONE DU MODÈLE</text>
  <text x="88" y="456" class="body" font-size="11.5" fill="#5A5A5A">Renvoyé au modèle de mix,</text>
  <text x="88" y="472" class="body" font-size="11.5" fill="#5A5A5A">sous prior calibré.</text>
  <rect x="64" y="496" width="200" height="274" rx="3" fill="#B7332C" opacity="0.10"/>
  <rect x="64" y="496" width="4" height="274" fill="#B7332C"/>
  <text x="88" y="526" class="mono" font-size="11.5" letter-spacing="0.1em" fill="#B7332C">INDÉCIDABLE ASSUMÉ</text>
  <text x="88" y="550" class="body" font-size="11.5" fill="#5A5A5A">Écrit dans la note de</text>
  <text x="88" y="566" class="body" font-size="11.5" fill="#5A5A5A">renoncement.</text>
  <g class="interactive" data-card="socle-testable" tabindex="0" role="button" aria-label="Un canal entier doit-il continuer d'exister ? — cliquez pour les détails">
    <rect x="284" y="214" width="852" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="284" y="214" width="5" height="86" fill="#4A7C59"/>
    <text x="312" y="250" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Un canal entier doit-il continuer d'exister ?</text>
    <text x="312" y="274" class="body" font-size="12.5" fill="#8A8478">Test d'extinction géographique, six à huit semaines.</text>
    <text x="880" y="258" class="mono" font-size="14" fill="#4A7C59" text-anchor="middle">×1</text>
    <text x="1106" y="258" class="body" font-size="13.5" font-weight="500" fill="#4A7C59" text-anchor="end">Testable</text>
  </g>
  <g class="interactive" data-card="socle-testable" tabindex="0" role="button" aria-label="Faut-il déplacer du budget d'un canal vers un autre ? — cliquez pour les détails">
    <rect x="284" y="308" width="852" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="284" y="308" width="5" height="86" fill="#4A7C59"/>
    <text x="312" y="344" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Faut-il déplacer du budget d'un canal vers un autre ?</text>
    <text x="312" y="368" class="body" font-size="12.5" fill="#8A8478">Plusieurs cellules contre un groupe témoin commun.</text>
    <text x="880" y="352" class="mono" font-size="14" fill="#4A7C59" text-anchor="middle">×4 – ×10</text>
    <text x="1106" y="352" class="body" font-size="13.5" font-weight="500" fill="#4A7C59" text-anchor="end">Testable · un exercice</text>
  </g>
  <g class="interactive" data-card="zone-modele" tabindex="0" role="button" aria-label="Quel est le bon niveau de dépense sur ce canal ? — cliquez pour les détails">
    <rect x="284" y="402" width="852" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="284" y="402" width="5" height="86" fill="#B58A2C"/>
    <text x="312" y="438" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Quel est le bon niveau de dépense sur ce canal ?</text>
    <text x="312" y="462" class="body" font-size="12.5" fill="#8A8478">La courbe de rendement demande plusieurs intensités.</text>
    <text x="880" y="446" class="mono" font-size="14" fill="#B58A2C" text-anchor="middle">×20 +</text>
    <text x="1106" y="446" class="body" font-size="13.5" font-weight="500" fill="#B58A2C" text-anchor="end">Modélisable sous prior</text>
  </g>
  <g class="interactive" data-card="zone-indecidable" tabindex="0" role="button" aria-label="Quelle création est la meilleure ? — cliquez pour les détails">
    <rect x="284" y="496" width="852" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="284" y="496" width="5" height="86" fill="#B7332C"/>
    <text x="312" y="532" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Quelle création est la meilleure ?</text>
    <text x="312" y="556" class="body" font-size="12.5" fill="#8A8478">L'écart entre deux créations est un ordre sous l'effet du canal.</text>
    <text x="880" y="540" class="mono" font-size="14" fill="#B7332C" text-anchor="middle">×100</text>
    <text x="1106" y="540" class="body" font-size="13.5" font-weight="500" fill="#B7332C" text-anchor="end">Indécidable assumé</text>
  </g>
  <g class="interactive" data-card="zone-indecidable" tabindex="0" role="button" aria-label="Quelle fréquence, quelle séquence ? — cliquez pour les détails">
    <rect x="284" y="590" width="852" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="284" y="590" width="5" height="86" fill="#B7332C"/>
    <text x="312" y="626" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Quelle fréquence, quelle séquence ?</text>
    <text x="312" y="650" class="body" font-size="12.5" fill="#8A8478">Non assignable directement : la fréquence résulte du comportement.</text>
    <text x="880" y="634" class="mono" font-size="14" fill="#B7332C" text-anchor="middle">×100 +</text>
    <text x="1106" y="634" class="body" font-size="13.5" font-weight="500" fill="#B7332C" text-anchor="end">Indécidable assumé</text>
  </g>
  <g class="interactive" data-card="question-piege" tabindex="0" role="button" aria-label="Que rapporte cette audience fine ? — cliquez pour les détails">
    <rect x="284" y="684" width="852" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="284" y="684" width="5" height="86" fill="#B7332C"/>
    <text x="312" y="720" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Que rapporte cette audience fine ?</text>
    <text x="312" y="744" class="body" font-size="12.5" fill="#8A8478">Échantillon petit par construction. Le tableau de bord répond quand même.</text>
    <text x="880" y="728" class="mono" font-size="14" fill="#B7332C" text-anchor="middle">hors de portée</text>
    <text x="1106" y="728" class="body" font-size="13.5" font-weight="500" fill="#B7332C" text-anchor="end">Indécidable assumé</text>
  </g>

  <line x1="64" y1="820" x2="1136" y2="820" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="848" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Lecture : le coût relatif suit le carré de l'inverse de l'effet à détecter. Une question dont l'effet est dix fois plus petit coûte cent fois plus cher à trancher.</text>
  <text x="64" y="874" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B8B5AE">GRILLE DE L'AUTEUR · ORDRES DE GRANDEUR, NON DES DIMENSIONNEMENTS</text>
</svg>
