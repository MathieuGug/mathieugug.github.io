<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="L'échelle du problème : le signal publicitaire recherché comparé au bruit des ventes individuelles">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'échelle du problème</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois grandeurs par personne et par semaine, à la même échelle. Le signal recherché tient dans l'épaisseur d'un trait.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">GRANDEUR</text>
  <text x="296" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">REPRÉSENTATION À L'ÉCHELLE (1 UNITÉ = 0,84 PX)</text>

  <!-- Ligne 1 : ventes moyennes -->
  <g>
    <rect x="64" y="210" width="1072" height="72" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="210" width="5" height="72" fill="#5A5A5A"/>
    <text x="88" y="238" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Ventes moyennes</text>
    <text x="88" y="262" class="body" font-size="12" fill="#8A8478">Indice de référence · 100</text>
    <rect x="296" y="232" width="84" height="26" fill="#5A5A5A"/>
    <text x="392" y="250" class="mono" font-size="12.5" fill="#5A5A5A">100</text>
  </g>

  <!-- Ligne 2 : écart-type -->
  <g class="interactive" data-card="le-bruit" tabindex="0" role="button" aria-label="Le bruit des ventes individuelles — cliquez pour les détails">
    <rect x="64" y="294" width="1072" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="294" width="5" height="86" fill="#B58A2C"/>
    <text x="88" y="322" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Écart-type des ventes</text>
    <text x="88" y="346" class="body" font-size="12" fill="#8A8478">Coefficient de variation = 10</text>
    <text x="88" y="366" class="mono" font-size="11" fill="#B58A2C">LE BRUIT</text>
    <rect x="296" y="322" width="840" height="26" fill="#B58A2C" opacity="0.85"/>
    <text x="1120" y="368" class="mono" font-size="12.5" fill="#B58A2C" text-anchor="end">1 000</text>
  </g>

  <!-- Ligne 3 : effet recherché -->
  <g class="interactive" data-card="le-signal" tabindex="0" role="button" aria-label="Le signal publicitaire recherché — cliquez pour les détails">
    <rect x="64" y="392" width="1072" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="392" width="5" height="86" fill="#B7332C"/>
    <text x="88" y="420" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Effet publicitaire recherché</text>
    <text x="88" y="444" class="body" font-size="12" fill="#8A8478">Seuil de rentabilité typique · 2,5 % des ventes</text>
    <text x="88" y="464" class="mono" font-size="11" fill="#B7332C">LE SIGNAL</text>

    <rect x="296" y="420" width="2.1" height="26" fill="#B7332C"/>
    <!-- Amorce vers le trait invisible -->
    <line x1="297" y1="460" x2="297" y2="446" stroke="#B7332C" stroke-width="1.25"/>
    <line x1="297" y1="460" x2="352" y2="460" stroke="#B7332C" stroke-width="1.25"/>
    <text x="362" y="464" class="body" font-size="13" fill="#B7332C">2,5 · soit 2,1 pixels de large sur ce schéma</text>
  </g>

  <!-- Conséquence -->
  <g class="interactive" data-card="la-consequence" tabindex="0" role="button" aria-label="La conséquence arithmétique — cliquez pour les détails">
    <rect x="64" y="502" width="640" height="182" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="502" width="5" height="182" fill="#1F5560"/>
    <text x="94" y="532" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">LA CONSÉQUENCE ARITHMÉTIQUE</text>
    <text x="94" y="566" class="mono" font-size="19" fill="#1A1A1A">n ≈ 31,4 × CV² / r²</text>
    <text x="94" y="600" class="body" font-size="13.5" fill="#5A5A5A">Avec un coefficient de variation de 10 et un effet visé de 2,5 %,</text>
    <text x="94" y="622" class="body" font-size="13.5" fill="#5A5A5A">il faut environ <tspan font-weight="600" fill="#1A1A1A">5 millions de personnes-semaines</tspan> pour</text>
    <text x="94" y="644" class="body" font-size="13.5" fill="#5A5A5A">distinguer cet effet de zéro à 80 % de puissance.</text>
    <text x="94" y="670" class="body" font-size="12.5" font-style="italic" fill="#1F5560">Et vingt-cinq fois plus pour savoir de combien il dépasse zéro.</text>
  </g>

  <!-- Les 25 expériences -->
  <g class="interactive" data-card="les-25-experiences" tabindex="0" role="button" aria-label="Les vingt-cinq expériences de Lewis et Rao — cliquez pour les détails">
    <rect x="728" y="502" width="408" height="182" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
    <text x="756" y="532" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QU'ON OBSERVE EN PRATIQUE</text>
    <text x="756" y="572" class="display" font-size="34" font-weight="600" fill="#B7332C">&gt; 100 pts</text>
    <text x="756" y="602" class="body" font-size="13.5" fill="#5A5A5A">Largeur médiane de l'intervalle de</text>
    <text x="756" y="624" class="body" font-size="13.5" fill="#5A5A5A">confiance sur le retour, mesurée sur</text>
    <text x="756" y="646" class="body" font-size="13.5" fill="#5A5A5A">25 grandes expériences publicitaires.</text>
    <text x="756" y="672" class="body" font-size="12" font-style="italic" fill="#8A8478">Lewis &amp; Rao, Quarterly Journal of Economics, 2015.</text>
  </g>

  <line x1="64" y1="716" x2="1136" y2="716" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="744" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Lecture : le signal que toute la discipline de mesure cherche à isoler vaut le quatre-centième de l'écart-type de la variable où on le cherche.</text>
  <text x="64" y="768" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B8B5AE">CALCUL DE L'AUTEUR · HYPOTHÈSES EN NOTE DE MÉTHODE</text>
</svg>
