  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La loi du carré</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque carreau vaut 314 000 personnes-semaines. Diviser par deux l'effet visé quadruple la surface.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">EFFET QUE L'ON VEUT POUVOIR DÉTECTER</text>
  <text x="1136" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">TAILLE DE L'EXPÉRIENCE</text>
