<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Anatomie d'un non-résultat : un intervalle de confiance large et les quatre lectures qu'on en fait en comité">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="900" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Anatomie d'un non-résultat</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un test rendu, un intervalle large, et les quatre façons dont il devient une conclusion.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Axe -->
  <text x="64" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">RETOUR SUR INVESTISSEMENT ESTIMÉ · INTERVALLE DE CONFIANCE À 95 %</text>

  <line x1="200" y1="300" x2="1100" y2="300" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="200" y1="294" x2="200" y2="306" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="369" y1="294" x2="369" y2="306" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="706" y1="294" x2="706" y2="306" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="875" y1="294" x2="875" y2="306" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="1100" y1="294" x2="1100" y2="306" stroke="#B8B5AE" stroke-width="1"/>
  <text x="200" y="330" class="mono" font-size="11.5" fill="#8A8478" text-anchor="middle">−60 %</text>
  <text x="369" y="330" class="mono" font-size="11.5" fill="#8A8478" text-anchor="middle">−30 %</text>
  <text x="706" y="330" class="mono" font-size="11.5" fill="#8A8478" text-anchor="middle">+30 %</text>
  <text x="875" y="330" class="mono" font-size="11.5" fill="#8A8478" text-anchor="middle">+60 %</text>
  <text x="1100" y="330" class="mono" font-size="11.5" fill="#8A8478" text-anchor="middle">+100 %</text>

  <!-- Zéro -->
  <line x1="538" y1="228" x2="538" y2="336" stroke="#1A1A1A" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="538" y="222" class="mono" font-size="12" fill="#1A1A1A" text-anchor="middle">0</text>

  <!-- L'intervalle -->
  <rect x="453" y="286" width="338" height="28" rx="2" fill="#B58A2C" opacity="0.30"/>
  <line x1="453" y1="278" x2="453" y2="322" stroke="#B58A2C" stroke-width="2.5"/>
  <line x1="791" y1="278" x2="791" y2="322" stroke="#B58A2C" stroke-width="2.5"/>
  <circle cx="622" cy="300" r="7" fill="#1A1A1A"/>
  <text x="453" y="268" class="mono" font-size="13" fill="#B58A2C" text-anchor="middle">−15 %</text>
  <text x="791" y="268" class="mono" font-size="13" fill="#B58A2C" text-anchor="middle">+45 %</text>
  <text x="622" y="268" class="mono" font-size="13" fill="#1A1A1A" text-anchor="middle">+15 %</text>
  <text x="200" y="300" class="body" font-size="13" fill="#5A5A5A" text-anchor="end" transform="translate(-16,0)">Le test rendu</text>

  <text x="64" y="378" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">TROIS LECTURES FAUSSES</text>

  <!-- Lecture 1 -->
  <g class="interactive" data-card="lecture-inefficace" tabindex="0" role="button" aria-label="Première lecture fausse, l'absence de preuve — cliquez pour les détails">
    <rect x="64" y="394" width="344" height="196" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="394" width="5" height="196" fill="#B7332C"/>
    <text x="92" y="422" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LECTURE 1</text>
    <text x="92" y="450" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'absence de preuve</text>
    <text x="92" y="478" class="body" font-size="12.5" font-style="italic" fill="#8A8478">« Non significatif, donc ça ne marche pas. »</text>
    <text x="92" y="506" class="body" font-size="13" fill="#5A5A5A">L'intervalle contient +45 %, un très bon</text>
    <text x="92" y="526" class="body" font-size="13" fill="#5A5A5A">investissement. Le test n'a pas montré que</text>
    <text x="92" y="546" class="body" font-size="13" fill="#5A5A5A">le canal était inefficace : il a montré qu'il</text>
    <text x="92" y="566" class="body" font-size="13" fill="#5A5A5A">ne savait pas.</text>
  </g>

  <!-- Lecture 2 -->
  <g class="interactive" data-card="lecture-point" tabindex="0" role="button" aria-label="Deuxième lecture fausse, le point sans l'intervalle — cliquez pour les détails">
    <rect x="428" y="394" width="344" height="196" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="428" y="394" width="5" height="196" fill="#B7332C"/>
    <text x="456" y="422" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LECTURE 2</text>
    <text x="456" y="450" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le point sans l'intervalle</text>
    <text x="456" y="478" class="body" font-size="12.5" font-style="italic" fill="#8A8478">« Le point est à +15 %, donc c'est rentable. »</text>
    <text x="456" y="506" class="body" font-size="13" fill="#5A5A5A">L'estimation ponctuelle survit à la réunion,</text>
    <text x="456" y="526" class="body" font-size="13" fill="#5A5A5A">l'intervalle n'y survit jamais. Le chiffre finit</text>
    <text x="456" y="546" class="body" font-size="13" fill="#5A5A5A">sa vie dans un tableau de suivi, avec</text>
    <text x="456" y="566" class="body" font-size="13" fill="#5A5A5A">l'apparence d'une donnée comptable.</text>
  </g>

  <!-- Lecture 3 -->
  <g class="interactive" data-card="lecture-arret" tabindex="0" role="button" aria-label="Troisième lecture fausse, l'arrêt opportun — cliquez pour les détails">
    <rect x="792" y="394" width="344" height="196" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="792" y="394" width="5" height="196" fill="#B7332C"/>
    <text x="820" y="422" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LECTURE 3</text>
    <text x="820" y="450" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'arrêt opportun</text>
    <text x="820" y="478" class="body" font-size="12.5" font-style="italic" fill="#8A8478">« On coupe, le seuil vient d'être franchi. »</text>
    <text x="820" y="506" class="body" font-size="13" fill="#5A5A5A">Une expérience regardée chaque semaine</text>
    <text x="820" y="526" class="body" font-size="13" fill="#5A5A5A">et arrêtée à la première traversée du seuil</text>
    <text x="820" y="546" class="body" font-size="13" fill="#5A5A5A">n'a plus le taux d'erreur qu'elle annonce.</text>
    <text x="820" y="566" class="body" font-size="13" fill="#5A5A5A">Le remède est gratuit : fixer la durée avant.</text>
  </g>

  <!-- Lecture juste -->
  <g class="interactive" data-card="lecture-juste" tabindex="0" role="button" aria-label="La lecture juste — cliquez pour les détails">
    <rect x="64" y="616" width="1072" height="136" rx="3" fill="#F2EFE7" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="616" width="5" height="136" fill="#1F5560"/>
    <text x="94" y="646" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">LA LECTURE JUSTE</text>
    <text x="94" y="682" class="display" font-size="21" font-weight="600" fill="#1A1A1A">« Ce test excluait un retour inférieur à −15 %. Il n'a jamais pu trancher entre 0 et +45 %. »</text>
    <text x="94" y="712" class="body" font-size="13.5" fill="#5A5A5A">Et la conclusion qui suit : sous cette conception, il n'aurait pas dû être lancé.</text>
    <text x="94" y="734" class="body" font-size="13.5" fill="#5A5A5A">La question à laquelle il devait répondre appartenait à la rubrique 3 de la note de renoncement.</text>
  </g>

  <!-- Biais de remontée -->
  <g class="interactive" data-card="biais-remontee" tabindex="0" role="button" aria-label="La quatrième lecture, organisationnelle — cliquez pour les détails">
    <rect x="64" y="768" width="1072" height="116" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
    <rect x="64" y="768" width="5" height="116" fill="#B7332C"/>
    <text x="94" y="798" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LECTURE 4 · CELLE QUE LA STATISTIQUE NE CORRIGE PAS</text>
    <text x="94" y="830" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Les tests concluants remontent au comité. Les autres meurent dans le fichier de l'analyste.</text>
    <text x="94" y="862" class="body" font-size="13.5" fill="#5A5A5A">Conséquence de pilotage : un taux élevé de tests concluants signale une sélection dans ce qui remonte, et doit se lire comme une alerte.</text>
  </g>
</svg>
