<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La chaîne contre-couplée : parole, décision et action ne se suivent pas, la parole et la décision compensent l'action">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
    <marker id="arrow-carmine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 01</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La chaîne contre-couplée</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce qu'une organisation produit : de la parole, des décisions, de l'action — et dans quel sens</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="186" class="mono" font-size="12" font-weight="600" fill="#B8B5AE" letter-spacing="0.08em">LE MODÈLE SUPPOSÉ</text>

  <g class="interactive" data-card="parole" tabindex="0" role="button" aria-label="La parole — cliquez pour les détails">
    <rect x="60" y="208" width="300" height="156" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="60" y="208" width="4" height="156" fill="#1F5560"/>
    <text x="86" y="244" class="mono" font-size="12" font-weight="600" fill="#1F5560" letter-spacing="0.06em">PAROLE</text>
    <text x="86" y="278" class="body" font-size="15" font-weight="500" fill="#1A1A1A">La charte, les principes,</text>
    <text x="86" y="300" class="body" font-size="15" font-weight="500" fill="#1A1A1A">la politique d'usage</text>
    <text x="86" y="330" class="body" font-size="13" fill="#5A5A5A">Coût : une réunion.</text>
    <text x="86" y="350" class="body" font-size="13" fill="#5A5A5A">Produit de la légitimité.</text>
  </g>

  <line x1="376" y1="286" x2="428" y2="286" stroke="#5A5A5A" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#arrow-ink)"/>

  <g class="interactive" data-card="decision" tabindex="0" role="button" aria-label="La décision — cliquez pour les détails">
    <rect x="450" y="208" width="300" height="156" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="450" y="208" width="4" height="156" fill="#B58A2C"/>
    <text x="476" y="244" class="mono" font-size="12" font-weight="600" fill="#B58A2C" letter-spacing="0.06em">DÉCISION</text>
    <text x="476" y="278" class="body" font-size="15" font-weight="500" fill="#1A1A1A">L'autorisation, le refus,</text>
    <text x="476" y="300" class="body" font-size="15" font-weight="500" fill="#1A1A1A">la condition de maintien</text>
    <text x="476" y="330" class="body" font-size="13" fill="#5A5A5A">Coût : un conflit.</text>
    <text x="476" y="350" class="body" font-size="13" fill="#5A5A5A">Produit une trace.</text>
  </g>

  <line x1="766" y1="286" x2="818" y2="286" stroke="#5A5A5A" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#arrow-ink)"/>

  <g class="interactive" data-card="action" tabindex="0" role="button" aria-label="L'action — cliquez pour les détails">
    <rect x="840" y="208" width="300" height="156" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="840" y="208" width="4" height="156" fill="#B7332C"/>
    <text x="866" y="244" class="mono" font-size="12" font-weight="600" fill="#B7332C" letter-spacing="0.06em">ACTION</text>
    <text x="866" y="278" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Le déploiement réel,</text>
    <text x="866" y="300" class="body" font-size="15" font-weight="500" fill="#1A1A1A">les agents en production</text>
    <text x="866" y="330" class="body" font-size="13" fill="#5A5A5A">Coût : un budget.</text>
    <text x="866" y="350" class="body" font-size="13" fill="#5A5A5A">Ne demande pas d'accord.</text>
  </g>

  <text x="60" y="438" class="mono" font-size="12" font-weight="600" fill="#B7332C" letter-spacing="0.08em">CE QUE BRUNSSON OBSERVE</text>

  <g class="interactive" data-card="contre-couplage" tabindex="0" role="button" aria-label="Le contre-couplage — cliquez pour les détails">
    <path d="M 990 470 C 990 548, 700 556, 530 556" fill="none" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arrow-carmine)"/>
    <path d="M 990 470 C 990 548, 400 566, 215 566" fill="none" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arrow-carmine)"/>
    <circle cx="990" cy="462" r="7" fill="#B7332C"/>
    <rect x="620" y="604" width="520" height="118" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
    <text x="646" y="636" class="body" font-size="15" font-weight="500" fill="#1A1A1A">La parole et la décision compensent l'action</text>
    <text x="646" y="662" class="body" font-size="13" fill="#5A5A5A">Les trois productions ne sont pas faiblement couplées :</text>
    <text x="646" y="682" class="body" font-size="13" fill="#5A5A5A">elles sont contre-couplées. Plus une organisation agit</text>
    <text x="646" y="702" class="body" font-size="13" fill="#5A5A5A">dans un sens, plus elle a besoin de parler dans l'autre.</text>
  </g>

  <g class="interactive" data-card="mesure-2026" tabindex="0" role="button" aria-label="Les chiffres de 2026 — cliquez pour les détails">
    <rect x="60" y="604" width="500" height="118" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="60" y="604" width="4" height="118" fill="#1F5560"/>
    <text x="86" y="636" class="body" font-size="15" font-weight="500" fill="#1A1A1A">L'écart mesuré en 2026</text>
    <text x="86" y="666" class="mono" font-size="17" font-weight="600" fill="#1F5560">60 %</text>
    <text x="150" y="666" class="body" font-size="13" fill="#5A5A5A">déploient à l'échelle…</text>
    <text x="330" y="666" class="mono" font-size="17" font-weight="600" fill="#B7332C">4 %</text>
    <text x="372" y="666" class="body" font-size="13" fill="#5A5A5A">suivent</text>
    <text x="86" y="700" class="body" font-size="13" fill="#5A5A5A">78 % de dirigeants sans confiance de passer un audit de</text>
    <text x="86" y="718" class="body" font-size="13" fill="#5A5A5A">gouvernance IA sous 90 jours.</text>
  </g>

  <line x1="60" y1="752" x2="1140" y2="752" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="60" y="776" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : Brunsson, The Organization of Hypocrisy (1989) ; Credo AI, State of AI Governance 2026 ; Grant Thornton, AI Impact Survey 2026. Déclarations de dirigeants, non auditées.</text>
</svg>
