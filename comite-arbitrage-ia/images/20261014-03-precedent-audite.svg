<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Comparaison du régime SR 11-7 de 2011 et d'une charte IA type de 2026 sur cinq attributs de gouvernance">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 03</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le précédent audité</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce que la supervision bancaire impose depuis 2011, et ce qu'une charte d'IA en retient</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <rect x="500" y="166" width="300" height="34" rx="3" fill="#1F5560"/>
  <text x="650" y="189" class="mono" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">SR 11-7 · 2011</text>
  <rect x="820" y="166" width="320" height="34" rx="3" fill="#B8B5AE"/>
  <text x="980" y="189" class="mono" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">CHARTE IA TYPE · 2026</text>
  <text x="60" y="189" class="mono" font-size="12" font-weight="600" fill="#B8B5AE" letter-spacing="0.06em">ATTRIBUT DE GOUVERNANCE</text>
  <line x1="60" y1="212" x2="1140" y2="212" stroke="#1A1A1A" stroke-width="1.25"/>

  <g class="interactive" data-card="politique-conseil" tabindex="0" role="button" aria-label="Politique approuvée par le conseil — cliquez pour les détails">
    <rect x="60" y="220" width="1080" height="94" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="86" y="252" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Politique approuvée par le conseil</text>
    <text x="86" y="276" class="body" font-size="13" fill="#5A5A5A">Périmètre, hiérarchisation par risque, rôles,</text>
    <text x="86" y="296" class="body" font-size="13" fill="#5A5A5A">chemins d'escalade</text>
    <circle cx="530" cy="267" r="11" fill="#1F5560"/>
    <text x="556" y="262" class="body" font-size="13" fill="#1A1A1A">Exigée, et contrôlée par</text>
    <text x="556" y="282" class="body" font-size="13" fill="#1A1A1A">le superviseur</text>
    <circle cx="850" cy="267" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <path d="M 843 267 L 857 267" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="876" y="262" class="body" font-size="13" fill="#5A5A5A">Fréquente, mais sans</text>
    <text x="876" y="282" class="body" font-size="13" fill="#5A5A5A">tiers qui la lise</text>
  </g>

  <g class="interactive" data-card="inventaire" tabindex="0" role="button" aria-label="Inventaire hiérarchisé par risque — cliquez pour les détails">
    <rect x="60" y="314" width="1080" height="94" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="86" y="346" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Inventaire hiérarchisé par risque</text>
    <text x="86" y="370" class="body" font-size="13" fill="#5A5A5A">Détermine quel objet passe par quel niveau</text>
    <text x="86" y="390" class="body" font-size="13" fill="#5A5A5A">de contrôle</text>
    <circle cx="530" cy="361" r="11" fill="#1F5560"/>
    <text x="556" y="356" class="body" font-size="13" fill="#1A1A1A">Exigé, avec gestion</text>
    <text x="556" y="376" class="body" font-size="13" fill="#1A1A1A">des changements</text>
    <circle cx="850" cy="361" r="11" fill="none" stroke="#B58A2C" stroke-width="1.25"/>
    <path d="M 850 361 L 850 350 A 11 11 0 0 1 861 361 z" fill="#B58A2C"/>
    <text x="876" y="356" class="body" font-size="13" fill="#5A5A5A">Un registre tenu, rarement</text>
    <text x="876" y="376" class="body" font-size="13" fill="#5A5A5A">lié à une règle de saisine</text>
  </g>

  <g class="interactive" data-card="validation-independante" tabindex="0" role="button" aria-label="Validation indépendante séparée — cliquez pour les détails">
    <rect x="60" y="408" width="1080" height="94" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="86" y="440" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Validation organisationnellement séparée</text>
    <text x="86" y="464" class="body" font-size="13" fill="#5A5A5A">Le validateur ne relève ni de celui qui développe</text>
    <text x="86" y="484" class="body" font-size="13" fill="#5A5A5A">ni de celui qui utilise</text>
    <circle cx="530" cy="455" r="11" fill="#1F5560"/>
    <text x="556" y="450" class="body" font-size="13" fill="#1A1A1A">Structurelle, non</text>
    <text x="556" y="470" class="body" font-size="13" fill="#1A1A1A">déclarative</text>
    <circle cx="850" cy="455" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <path d="M 843 455 L 857 455" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="876" y="450" class="body" font-size="13" fill="#5A5A5A">Le plus souvent dans la</text>
    <text x="876" y="470" class="body" font-size="13" fill="#5A5A5A">même ligne hiérarchique</text>
  </g>

  <g class="interactive" data-card="effective-challenge" tabindex="0" role="button" aria-label="Effective challenge, le statut du contestataire — cliquez pour les détails">
    <rect x="60" y="502" width="1080" height="94" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
    <rect x="60" y="502" width="4" height="94" fill="#B7332C"/>
    <text x="86" y="534" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Compétence, connaissance et statut du contestataire</text>
    <text x="86" y="558" class="body" font-size="13" fill="#5A5A5A">Un validateur compétent sans statut ne conteste rien</text>
    <text x="86" y="578" class="body" font-size="13" font-style="italic" fill="#B7332C">La contribution conceptuelle qui ne s'importe jamais</text>
    <circle cx="530" cy="549" r="11" fill="#1F5560"/>
    <text x="556" y="544" class="body" font-size="13" fill="#1A1A1A">Nommée comme</text>
    <text x="556" y="564" class="body" font-size="13" fill="#1A1A1A">condition d'effectivité</text>
    <circle cx="850" cy="549" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <path d="M 843 549 L 857 549" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="876" y="544" class="body" font-size="13" fill="#5A5A5A">Absente : on prescrit une</text>
    <text x="876" y="564" class="body" font-size="13" fill="#5A5A5A">revue, pas un rang</text>
  </g>

  <g class="interactive" data-card="audit-interne" tabindex="0" role="button" aria-label="Audit interne du dispositif lui-même — cliquez pour les détails">
    <rect x="60" y="596" width="1080" height="94" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="86" y="628" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Audit interne portant sur le dispositif</text>
    <text x="86" y="652" class="body" font-size="13" fill="#5A5A5A">L'instance de décision est elle-même un objet audité,</text>
    <text x="86" y="672" class="body" font-size="13" fill="#5A5A5A">sur ses traces</text>
    <circle cx="530" cy="643" r="11" fill="#1F5560"/>
    <text x="556" y="638" class="body" font-size="13" fill="#1A1A1A">Exigé</text>
    <circle cx="850" cy="643" r="11" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
    <path d="M 843 643 L 857 643" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="876" y="638" class="body" font-size="13" fill="#5A5A5A">L'instance est décrite dans</text>
    <text x="876" y="658" class="body" font-size="13" fill="#5A5A5A">un document d'intention</text>
  </g>

  <circle cx="74" cy="722" r="7" fill="#1F5560"/>
  <text x="90" y="727" class="body" font-size="12" fill="#5A5A5A">exigé et contrôlé</text>
  <path d="M 234 722 L 234 715 A 7 7 0 0 1 241 722 z" fill="#B58A2C"/>
  <circle cx="234" cy="722" r="7" fill="none" stroke="#B58A2C" stroke-width="1.25"/>
  <text x="250" y="727" class="body" font-size="12" fill="#5A5A5A">partiel</text>
  <circle cx="340" cy="722" r="7" fill="none" stroke="#B8B5AE" stroke-width="1.25"/>
  <text x="356" y="727" class="body" font-size="12" fill="#5A5A5A">absent ou déclaratif</text>

  <line x1="60" y1="752" x2="1140" y2="752" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="60" y="776" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : SR 11-7, Supervisory Guidance on Model Risk Management, Réserve fédérale, avril 2011 (OCC 2011-12). Colonne de droite : synthèse de l'auteur sur les modèles de charte en circulation.</text>
</svg>
