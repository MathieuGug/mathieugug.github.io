<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Les quatre pièces qu'une instance laisse derrière elle, et le substitut qui occupe la place de chacune">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 02</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Quatre pièces, quatre substituts</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque pièce se définit par ce qu'elle rend indéniable ; chacune a une doublure qui n'en fait pas le travail</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <text x="100" y="178" class="mono" font-size="12" font-weight="600" fill="#B8B5AE" letter-spacing="0.06em">LA PIÈCE</text>
  <text x="560" y="178" class="mono" font-size="12" font-weight="600" fill="#B8B5AE" letter-spacing="0.06em">CE QU'ELLE REND INDÉNIABLE</text>
  <text x="836" y="178" class="mono" font-size="12" font-weight="600" fill="#B8B5AE" letter-spacing="0.06em">LE SUBSTITUT COURANT</text>
  <line x1="60" y1="192" x2="1140" y2="192" stroke="#1A1A1A" stroke-width="1.25"/>

  <g class="interactive" data-card="ordre-du-jour" tabindex="0" role="button" aria-label="L'ordre du jour contraint — cliquez pour les détails">
    <rect x="60" y="200" width="1080" height="110" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="0.5"/>
    <rect x="60" y="200" width="4" height="110" fill="#1F5560"/>
    <circle cx="94" cy="255" r="13" fill="#1F5560"/>
    <text x="94" y="260" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <text x="126" y="240" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Un ordre du jour qu'elle ne choisit pas</text>
    <text x="126" y="266" class="body" font-size="13" fill="#5A5A5A">Une règle lie le registre des cas d'usage</text>
    <text x="126" y="286" class="body" font-size="13" fill="#5A5A5A">à la saisine obligatoire</text>
    <text x="560" y="248" class="display" font-size="17" font-style="italic" fill="#1F5560">Qu'un cas d'usage</text>
    <text x="560" y="272" class="display" font-size="17" font-style="italic" fill="#1F5560">a été vu</text>
    <text x="836" y="248" class="body" font-size="13" fill="#5A5A5A">L'ordre du jour préparé par la</text>
    <text x="836" y="268" class="body" font-size="13" fill="#5A5A5A">direction porteuse. On commente</text>
    <text x="836" y="288" class="body" font-size="13" fill="#5A5A5A">un échantillon choisi.</text>
  </g>

  <g class="interactive" data-card="proces-verbal" tabindex="0" role="button" aria-label="Le procès-verbal nominatif — cliquez pour les détails">
    <rect x="60" y="310" width="1080" height="110" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="0.5"/>
    <rect x="60" y="310" width="4" height="110" fill="#B58A2C"/>
    <circle cx="94" cy="365" r="13" fill="#B58A2C"/>
    <text x="94" y="370" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
    <text x="126" y="350" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Un procès-verbal nominatif</text>
    <text x="126" y="376" class="body" font-size="13" fill="#5A5A5A">« X a décidé, Y s'est opposé, Z était absent »</text>
    <text x="126" y="396" class="body" font-size="13" fill="#5A5A5A">et non « le comité a validé »</text>
    <text x="560" y="358" class="display" font-size="17" font-style="italic" fill="#B58A2C">Qui a décidé</text>
    <text x="836" y="358" class="body" font-size="13" fill="#5A5A5A">Le compte rendu impersonnel,</text>
    <text x="836" y="378" class="body" font-size="13" fill="#5A5A5A">qui enregistre un consensus</text>
    <text x="836" y="398" class="body" font-size="13" fill="#5A5A5A">sans titulaire.</text>
  </g>

  <g class="interactive" data-card="decision-datee" tabindex="0" role="button" aria-label="La décision à effet daté — cliquez pour les détails">
    <rect x="60" y="420" width="1080" height="110" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="0.5"/>
    <rect x="60" y="420" width="4" height="110" fill="#1F5560"/>
    <circle cx="94" cy="475" r="13" fill="#1F5560"/>
    <text x="94" y="480" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
    <text x="126" y="460" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Une décision à effet daté et conditionné</text>
    <text x="126" y="486" class="body" font-size="13" fill="#5A5A5A">Date d'effet, conditions de maintien,</text>
    <text x="126" y="506" class="body" font-size="13" fill="#5A5A5A">procédure de reprise</text>
    <text x="560" y="468" class="display" font-size="17" font-style="italic" fill="#1F5560">Ce qui a été autorisé,</text>
    <text x="560" y="492" class="display" font-size="17" font-style="italic" fill="#1F5560">et jusqu'à quand</text>
    <text x="836" y="468" class="body" font-size="13" fill="#5A5A5A">L'avis favorable, qui autorise</text>
    <text x="836" y="488" class="body" font-size="13" fill="#5A5A5A">sans borner et se périme sans</text>
    <text x="836" y="508" class="body" font-size="13" fill="#5A5A5A">que personne le constate.</text>
  </g>

  <g class="interactive" data-card="trace-refus" tabindex="0" role="button" aria-label="La trace du refus — cliquez pour les détails">
    <rect x="60" y="530" width="1080" height="110" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
    <rect x="60" y="530" width="4" height="110" fill="#B7332C"/>
    <circle cx="94" cy="585" r="13" fill="#B7332C"/>
    <text x="94" y="590" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">4</text>
    <text x="126" y="570" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Une trace de refus</text>
    <text x="126" y="596" class="body" font-size="13" fill="#5A5A5A">La pièce la plus coûteuse à produire</text>
    <text x="126" y="616" class="body" font-size="13" fill="#5A5A5A">et la seule qui ne se simule pas</text>
    <text x="560" y="578" class="display" font-size="17" font-style="italic" fill="#B7332C">Que l'instance</text>
    <text x="560" y="602" class="display" font-size="17" font-style="italic" fill="#B7332C">pouvait refuser</text>
    <text x="836" y="578" class="body" font-size="13" fill="#5A5A5A">Le refus informel obtenu par</text>
    <text x="836" y="598" class="body" font-size="13" fill="#5A5A5A">téléphone avant la séance, qui</text>
    <text x="836" y="618" class="body" font-size="13" fill="#5A5A5A">évite le passage et ne laisse rien.</text>
  </g>

  <g class="interactive" data-card="trois-sur-quatre" tabindex="0" role="button" aria-label="Les figures à trois pièces sur quatre — cliquez pour les détails">
    <rect x="60" y="664" width="1080" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="86" y="692" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Les quatre pièces sont indépendantes. Trois sur quatre produisent des figures reconnaissables :</text>
    <text x="86" y="716" class="body" font-size="13" fill="#5A5A5A">sans refus, un bureau d'enregistrement · sans procès-verbal, une instance que personne ne pourra défendre · sans ordre du jour contraint, un comité d'exception.</text>
  </g>

  <line x1="60" y1="756" x2="1140" y2="756" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="60" y="778" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Grille analytique de l'auteur. Non testée empiriquement : elle se juge à son pouvoir de tri.</text>
</svg>
