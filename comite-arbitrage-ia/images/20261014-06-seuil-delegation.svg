<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le volume de cas d'usage dépasse la capacité d'examen d'une instance centrale : zone d'examen réel, seuil de délégation, zone d'enregistrement">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 06</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le seuil de délégation</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Une instance qui examine tout cesse de décider : la trajectoire de dégradation, et où on l'arrête</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <line x1="140" y1="580" x2="760" y2="580" stroke="#1A1A1A" stroke-width="1.25"/>
  <line x1="140" y1="580" x2="140" y2="190" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="140" y="612" class="body" font-size="13" fill="#5A5A5A">Volume de cas d'usage soumis</text>
  <text x="124" y="200" class="body" font-size="13" fill="#5A5A5A" text-anchor="end" transform="rotate(-90 124 200)">Examen réel par dossier</text>

  <line x1="140" y1="300" x2="760" y2="300" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="140" y1="440" x2="760" y2="440" stroke="#E5E1D8" stroke-width="0.5"/>

  <path d="M 140 230 C 300 232, 380 262, 440 330 C 500 398, 560 486, 760 520" fill="none" stroke="#B7332C" stroke-width="2.5"/>

  <rect x="140" y="190" width="300" height="390" fill="#1F5560" fill-opacity="0.07"/>
  <rect x="440" y="190" width="320" height="390" fill="#B7332C" fill-opacity="0.07"/>
  <line x1="440" y1="190" x2="440" y2="580" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="2 3"/>

  <g class="interactive" data-card="zone-examen" tabindex="0" role="button" aria-label="La zone d'examen réel — cliquez pour les détails">
    <rect x="164" y="214" width="250" height="88" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <text x="188" y="242" class="mono" font-size="12" font-weight="600" fill="#1F5560" letter-spacing="0.06em">ZONE D'EXAMEN RÉEL</text>
    <text x="188" y="268" class="body" font-size="13" fill="#5A5A5A">Temps par dossier suffisant,</text>
    <text x="188" y="288" class="body" font-size="13" fill="#5A5A5A">refus argumentable.</text>
  </g>

  <g class="interactive" data-card="seuil" tabindex="0" role="button" aria-label="Le seuil de délégation — cliquez pour les détails">
    <circle cx="440" cy="330" r="9" fill="#B7332C"/>
    <rect x="480" y="300" width="268" height="124" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="480" y="300" width="4" height="124" fill="#B7332C"/>
    <text x="504" y="328" class="mono" font-size="12" font-weight="600" fill="#B7332C" letter-spacing="0.06em">SEUIL ÉCRIT</text>
    <text x="504" y="354" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Quatre composantes</text>
    <text x="504" y="378" class="body" font-size="13" fill="#5A5A5A">Le critère · le délégataire nommé ·</text>
    <text x="504" y="396" class="body" font-size="13" fill="#5A5A5A">la remontée statistique ·</text>
    <text x="504" y="414" class="body" font-size="13" fill="#5A5A5A">la liste des actes non délégables.</text>
  </g>

  <g class="interactive" data-card="zone-tamponnage" tabindex="0" role="button" aria-label="La zone d'enregistrement — cliquez pour les détails">
    <rect x="480" y="450" width="268" height="112" rx="3" fill="#FFFFFF" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="504" y="478" class="mono" font-size="12" font-weight="600" fill="#B8B5AE" letter-spacing="0.06em">ZONE D'ENREGISTREMENT</text>
    <text x="504" y="504" class="body" font-size="13" fill="#5A5A5A">1. Le temps par dossier se réduit.</text>
    <text x="504" y="524" class="body" font-size="13" fill="#5A5A5A">2. L'examen porte sur la note,</text>
    <text x="504" y="542" class="body" font-size="13" fill="#5A5A5A">    non sur l'objet.</text>
    <text x="504" y="560" class="body" font-size="13" fill="#5A5A5A">3. L'avis par défaut devient favorable.</text>
  </g>

  <g class="interactive" data-card="refus-non-delegable" tabindex="0" role="button" aria-label="Les trois actes non délégables — cliquez pour les détails">
    <rect x="800" y="190" width="340" height="250" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="800" y="190" width="4" height="250" fill="#B7332C"/>
    <text x="826" y="222" class="mono" font-size="12" font-weight="600" fill="#B7332C" letter-spacing="0.06em">NON DÉLÉGABLE</text>
    <text x="826" y="256" class="body" font-size="15" font-weight="500" fill="#1A1A1A">1 · Le refus</text>
    <text x="826" y="278" class="body" font-size="13" fill="#5A5A5A">Si un délégataire peut refuser,</text>
    <text x="826" y="296" class="body" font-size="13" fill="#5A5A5A">chaque refus devient négociable</text>
    <text x="826" y="314" class="body" font-size="13" fill="#5A5A5A">à son niveau.</text>
    <text x="826" y="348" class="body" font-size="15" font-weight="500" fill="#1A1A1A">2 · Le relèvement d'un palier</text>
    <text x="826" y="370" class="body" font-size="13" fill="#5A5A5A">d'autonomie accordé à un agent.</text>
    <text x="826" y="404" class="body" font-size="15" font-weight="500" fill="#1A1A1A">3 · La reprise après incident</text>
    <text x="826" y="426" class="body" font-size="13" fill="#5A5A5A">et la lever des conditions.</text>
  </g>

  <rect x="800" y="458" width="340" height="190" rx="3" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="1"/>
  <text x="826" y="488" class="body" font-size="15" font-weight="500" fill="#1A1A1A">La même contrainte, deux échelles</text>
  <text x="826" y="516" class="body" font-size="13" fill="#5A5A5A">Un comité saturé et un opérateur qui</text>
  <text x="826" y="534" class="body" font-size="13" fill="#5A5A5A">valide par habitude subissent la même</text>
  <text x="826" y="552" class="body" font-size="13" fill="#5A5A5A">chose : un volume supérieur à la capacité</text>
  <text x="826" y="570" class="body" font-size="13" fill="#5A5A5A">d'examen, et aucun coût à l'approbation.</text>
  <text x="826" y="604" class="body" font-size="13" font-style="italic" fill="#B7332C">Un taux d'approbation de 100 % mesure</text>
  <text x="826" y="622" class="body" font-size="13" font-style="italic" fill="#B7332C">l'absence de contrôle plutôt que</text>
  <text x="826" y="640" class="body" font-size="13" font-style="italic" fill="#B7332C">sa réussite.</text>

  <line x1="60" y1="700" x2="1140" y2="700" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="60" y="724" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : Grant Thornton, AI Impact Survey 2026 (saturation des organes de revue centralisés) ; Ben Green, The Flaws of Policies Requiring Human Oversight of Government Algorithms ;</text>
  <text x="60" y="744" class="body" font-size="12" font-style="italic" fill="#5A5A5A">IMDA, Model AI Governance Framework for Agentic AI, 2026. La courbe est illustrative : elle représente une trajectoire, non une mesure.</text>
</svg>
