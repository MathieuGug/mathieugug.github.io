<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Anatomie du conseil de gouvernance IA des agences fédérales américaines : présidence, vice-présidence, cadence, saisine et dérogation">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow-ink4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
    <marker id="arrow-carm4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 04</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La seule instance réellement écrite</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le conseil de gouvernance IA des agences fédérales américaines, tel que les plans de conformité le montent</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <g class="interactive" data-card="presidence" tabindex="0" role="button" aria-label="Le niveau de la présidence — cliquez pour les détails">
    <rect x="330" y="176" width="540" height="92" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="330" y="176" width="4" height="92" fill="#B7332C"/>
    <text x="356" y="208" class="mono" font-size="12" font-weight="600" fill="#B7332C" letter-spacing="0.06em">PRÉSIDENCE</text>
    <text x="356" y="238" class="body" font-size="17" font-weight="500" fill="#1A1A1A">Le secrétaire adjoint</text>
    <text x="356" y="258" class="body" font-size="13" fill="#5A5A5A">Le numéro deux de l'organisation. Montage répliqué d'une agence à l'autre.</text>
  </g>

  <line x1="600" y1="280" x2="600" y2="310" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow-ink4)"/>

  <g class="interactive" data-card="vice-presidence" tabindex="0" role="button" aria-label="La vice-présidence et les sièges — cliquez pour les détails">
    <rect x="240" y="322" width="720" height="124" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="240" y="322" width="4" height="124" fill="#1F5560"/>
    <text x="266" y="352" class="mono" font-size="12" font-weight="600" fill="#1F5560" letter-spacing="0.06em">SIÈGES</text>
    <text x="266" y="382" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Directeur IA — vice-président</text>
    <text x="266" y="406" class="body" font-size="13" fill="#5A5A5A">Selon l'agence : directeur des systèmes d'information en co-vice-présidence,</text>
    <text x="266" y="426" class="body" font-size="13" fill="#5A5A5A">directeur des données, secrétaires adjoints de métier, directeur de cabinet.</text>
    <line x1="700" y1="352" x2="700" y2="426" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="724" y="368" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Une agence a retenu</text>
    <text x="724" y="388" class="body" font-size="13" font-style="italic" fill="#5A5A5A">une instance préexistante</text>
    <text x="724" y="408" class="body" font-size="13" font-style="italic" fill="#5A5A5A">au lieu d'en créer une.</text>
  </g>

  <g class="interactive" data-card="cadence" tabindex="0" role="button" aria-label="La cadence semestrielle — cliquez pour les détails">
    <rect x="60" y="486" width="340" height="150" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="60" y="486" width="4" height="150" fill="#B58A2C"/>
    <text x="86" y="516" class="mono" font-size="12" font-weight="600" fill="#B58A2C" letter-spacing="0.06em">CADENCE</text>
    <text x="86" y="552" class="mono" font-size="24" font-weight="600" fill="#1A1A1A">2 / an</text>
    <text x="86" y="582" class="body" font-size="13" fill="#5A5A5A">Semestrielle, ou plus souvent</text>
    <text x="86" y="602" class="body" font-size="13" fill="#5A5A5A">si nécessaire. Trop faible pour</text>
    <text x="86" y="622" class="body" font-size="13" fill="#5A5A5A">examiner un portefeuille.</text>
  </g>

  <g class="interactive" data-card="registre" tabindex="0" role="button" aria-label="Le registre des cas d'usage — cliquez pour les détails">
    <rect x="430" y="486" width="340" height="150" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="430" y="486" width="4" height="150" fill="#1F5560"/>
    <text x="456" y="516" class="mono" font-size="12" font-weight="600" fill="#1F5560" letter-spacing="0.06em">SAISINE</text>
    <text x="456" y="548" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Registre public des cas</text>
    <text x="456" y="570" class="body" font-size="15" font-weight="500" fill="#1A1A1A">d'usage</text>
    <text x="456" y="598" class="body" font-size="13" fill="#5A5A5A">Catégorie « à fort impact » :</text>
    <text x="456" y="618" class="body" font-size="13" fill="#5A5A5A">pratiques minimales obligatoires.</text>
  </g>

  <g class="interactive" data-card="derogation" tabindex="0" role="button" aria-label="La dérogation documentée — cliquez pour les détails">
    <rect x="800" y="486" width="340" height="150" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="800" y="486" width="4" height="150" fill="#B7332C"/>
    <text x="826" y="516" class="mono" font-size="12" font-weight="600" fill="#B7332C" letter-spacing="0.06em">CHARGE DE LA PREUVE</text>
    <text x="826" y="548" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Dérogation écrite</text>
    <text x="826" y="576" class="body" font-size="13" fill="#5A5A5A">Déployer sans appliquer une</text>
    <text x="826" y="596" class="body" font-size="13" fill="#5A5A5A">pratique minimale exige une</text>
    <text x="826" y="616" class="body" font-size="13" fill="#5A5A5A">dérogation documentée.</text>
  </g>

  <line x1="600" y1="458" x2="600" y2="474" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow-ink4)"/>
  <line x1="970" y1="561" x2="946" y2="561" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arrow-carm4)"/>
  <text x="986" y="552" class="body" font-size="12" font-style="italic" fill="#B7332C">La ligne qui</text>
  <text x="986" y="570" class="body" font-size="12" font-style="italic" fill="#B7332C">se reproduit</text>
  <text x="986" y="588" class="body" font-size="12" font-style="italic" fill="#B7332C">en entreprise</text>

  <text x="60" y="684" class="body" font-size="13" fill="#5A5A5A">M-24-10 (28 mars 2024) puis M-25-21 (3 avril 2025, qui l'abroge) : conseil à convoquer sous 90 jours pour les agences soumises au CFO Act,</text>
  <text x="60" y="704" class="body" font-size="13" fill="#5A5A5A">conseil interagences des directeurs IA, pratiques minimales pour l'IA à fort impact (essais préalables, évaluation d'incidence, surveillance, recours).</text>

  <line x1="60" y1="736" x2="1140" y2="736" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="60" y="760" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : OMB M-25-21 (3 avril 2025) ; plans de conformité M-24-10 du ministère de la Sécurité intérieure et du ministère du Commerce, septembre 2024.</text>
  <text x="60" y="780" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Lecture portant sur le contenu des chartes comme modèles de mandat, non sur le bilan de leur mise en œuvre.</text>
</svg>
