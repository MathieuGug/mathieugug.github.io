<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Calendrier du règlement européen sur l'IA de 2025 à 2028, et le report des obligations de l'annexe III au 2 décembre 2027">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow-carm5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="48" class="mono" font-size="13" font-weight="600" fill="#B7332C" letter-spacing="0.08em">SCHÉMA 05</text>
  <text x="60" y="86" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'échéance qui a disparu</text>
  <text x="60" y="114" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le règlement sur l'IA côté déployeur, et les seize mois que le report a rendus</text>
  <line x1="60" y1="136" x2="1140" y2="136" stroke="#E5E1D8" stroke-width="1"/>

  <line x1="120" y1="420" x2="1140" y2="420" stroke="#1A1A1A" stroke-width="1.25"/>
  <line x1="120" y1="414" x2="120" y2="426" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="120" y="452" class="mono" font-size="12" fill="#B8B5AE" text-anchor="middle">2025</text>
  <line x1="375" y1="414" x2="375" y2="426" stroke="#B8B5AE" stroke-width="0.5"/>
  <text x="375" y="452" class="mono" font-size="12" fill="#B8B5AE" text-anchor="middle">2026</text>
  <line x1="630" y1="414" x2="630" y2="426" stroke="#B8B5AE" stroke-width="0.5"/>
  <text x="630" y="452" class="mono" font-size="12" fill="#B8B5AE" text-anchor="middle">2027</text>
  <line x1="885" y1="414" x2="885" y2="426" stroke="#B8B5AE" stroke-width="0.5"/>
  <text x="885" y="452" class="mono" font-size="12" fill="#B8B5AE" text-anchor="middle">2028</text>

  <g class="interactive" data-card="art4" tabindex="0" role="button" aria-label="Article 4, maîtrise de l'IA — cliquez pour les détails">
    <circle cx="142" cy="420" r="9" fill="#1F5560"/>
    <line x1="142" y1="411" x2="142" y2="340" stroke="#5A5A5A" stroke-width="0.75"/>
    <rect x="80" y="236" width="250" height="98" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="80" y="236" width="4" height="98" fill="#1F5560"/>
    <text x="104" y="262" class="mono" font-size="12" font-weight="600" fill="#1F5560">2 FÉV. 2025</text>
    <text x="104" y="288" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Article 4</text>
    <text x="104" y="310" class="body" font-size="13" fill="#5A5A5A">Maîtrise de l'IA. Aucune</text>
    <text x="104" y="328" class="body" font-size="13" fill="#5A5A5A">période transitoire.</text>
  </g>

  <g class="interactive" data-card="art50" tabindex="0" role="button" aria-label="Article 50 et nouvelles interdictions — cliquez pour les détails">
    <circle cx="368" cy="420" r="9" fill="#1F5560"/>
    <line x1="368" y1="429" x2="368" y2="500" stroke="#5A5A5A" stroke-width="0.75"/>
    <rect x="300" y="506" width="260" height="120" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="300" y="506" width="4" height="120" fill="#1F5560"/>
    <text x="324" y="532" class="mono" font-size="12" font-weight="600" fill="#1F5560">2 AOÛT 2026</text>
    <text x="324" y="558" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Article 50 · transparence</text>
    <text x="324" y="580" class="body" font-size="13" fill="#5A5A5A">Inchangé par l'omnibus.</text>
    <text x="324" y="602" class="body" font-size="13" fill="#5A5A5A">Deux interdictions de l'art. 5</text>
    <text x="324" y="620" class="body" font-size="13" fill="#5A5A5A">suivent au 2 déc. 2026.</text>
  </g>

  <g class="interactive" data-card="report-annexe3" tabindex="0" role="button" aria-label="Le report de l'annexe III au 2 décembre 2027 — cliquez pour les détails">
    <circle cx="368" cy="420" r="15" fill="none" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="2 3"/>
    <line x1="389" y1="420" x2="597" y2="420" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arrow-carm5)"/>
    <text x="400" y="404" class="mono" font-size="13" font-weight="600" fill="#B7332C">+ 16 MOIS</text>
    <circle cx="612" cy="420" r="9" fill="#B7332C"/>
    <line x1="612" y1="411" x2="612" y2="340" stroke="#5A5A5A" stroke-width="0.75"/>
    <rect x="520" y="212" width="330" height="122" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="520" y="212" width="4" height="122" fill="#B7332C"/>
    <text x="544" y="238" class="mono" font-size="12" font-weight="600" fill="#B7332C">2 DÉC. 2027</text>
    <text x="544" y="264" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Annexe III · haut risque autonome</text>
    <text x="544" y="288" class="body" font-size="13" fill="#5A5A5A">Art. 26 § 2 (autorité de la surveillance</text>
    <text x="544" y="306" class="body" font-size="13" fill="#5A5A5A">humaine) et § 6 (journaux, six mois</text>
    <text x="544" y="324" class="body" font-size="13" fill="#5A5A5A">au moins) reportés avec le reste.</text>
  </g>

  <g class="interactive" data-card="annexe1" tabindex="0" role="button" aria-label="Annexe I, 2 août 2028 — cliquez pour les détails">
    <circle cx="880" cy="420" r="9" fill="#B8B5AE"/>
    <line x1="880" y1="429" x2="880" y2="500" stroke="#5A5A5A" stroke-width="0.75"/>
    <rect x="800" y="506" width="300" height="98" rx="3" fill="#FAF8F3" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="824" y="532" class="mono" font-size="12" font-weight="600" fill="#B8B5AE">2 AOÛT 2028</text>
    <text x="824" y="558" class="body" font-size="15" font-weight="500" fill="#5A5A5A">Annexe I · haut risque intégré</text>
    <text x="824" y="582" class="body" font-size="13" fill="#5A5A5A">Systèmes embarqués dans un</text>
    <text x="824" y="600" class="body" font-size="13" fill="#5A5A5A">produit déjà réglementé.</text>
  </g>

  <rect x="60" y="660" width="1080" height="76" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
  <text x="86" y="688" class="body" font-size="15" font-weight="500" fill="#1A1A1A">Seize mois ne rendent pas l'instance moins nécessaire. Ils suppriment la seule contrainte externe qui obligeait à la créer.</text>
  <text x="86" y="716" class="body" font-size="13" fill="#5A5A5A">Beaucoup d'organisations avaient adossé la création de leur comité à l'échéance d'août 2026 : la date servait d'argument budgétaire. Il faut un autre déclencheur, interne.</text>

  <line x1="60" y1="756" x2="1140" y2="756" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="60" y="778" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : règlement (UE) 2024/1689, articles 4, 26 et 50 ; règlement omnibus numérique (UE) 2026/1744, approuvé par le Conseil le 29 juin 2026. Dates à revérifier au Journal officiel.</text>
</svg>
