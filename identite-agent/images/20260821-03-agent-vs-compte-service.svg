<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Ce qu'un agent a de plus qu'un compte de service">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', 'Playfair Display', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B7332C"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="70" y="56" class="mono" font-size="13" font-weight="600" letter-spacing="0.14em" fill="#B7332C">SCHÉMA 03</text>
  <text x="70" y="98" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce qu'un agent a de plus qu'un compte de service</text>
  <text x="70" y="128" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre propriétés qui se cumulent, et une figure ancienne qui les réunit.</text>
  <line x1="70" y1="152" x2="1130" y2="152" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Column headers -->
  <text x="470" y="190" class="mono" font-size="12" letter-spacing="0.09em" fill="#B8B5AE">COMPTE DE SERVICE</text>
  <text x="778" y="190" class="mono" font-size="12" letter-spacing="0.09em" fill="#B7332C">AGENT</text>
  <line x1="70" y1="202" x2="1130" y2="202" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- Row 1 -->
  <g class="interactive" data-card="execution" tabindex="0" role="button" aria-label="Choix des actions à l'exécution — détails">
    <rect x="70" y="212" width="1060" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="92" y="243" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Choix des actions</text>
    <text x="92" y="268" class="body" font-size="13" fill="#5A5A5A">Ce qui décide de la séquence d'appels</text>
    <text x="470" y="256" class="body" font-size="13" fill="#5A5A5A">Écrite dans du code relu</text>
    <text x="778" y="256" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Composée à l'exécution</text>
  </g>

  <!-- Row 2 -->
  <g class="interactive" data-card="enchainement" tabindex="0" role="button" aria-label="Enchaînement d'outils — détails">
    <rect x="70" y="298" width="1060" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="92" y="329" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Enchaînement d'outils</text>
    <text x="92" y="354" class="body" font-size="13" fill="#5A5A5A">Nombre de frontières franchies par tâche</text>
    <text x="470" y="342" class="body" font-size="13" fill="#5A5A5A">Une, connue d'avance</text>
    <text x="778" y="342" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Plusieurs, variable par requête</text>
  </g>

  <!-- Row 3 -->
  <g class="interactive" data-card="sous-agents" tabindex="0" role="button" aria-label="Engendrement de sous-agents — détails">
    <rect x="70" y="384" width="1060" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="92" y="415" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Engendrement de sous-agents</text>
    <text x="92" y="440" class="body" font-size="13" fill="#5A5A5A">Ce que devient l'autorité à chaque saut</text>
    <text x="470" y="428" class="body" font-size="13" fill="#5A5A5A">Sans objet</text>
    <text x="778" y="428" class="body" font-size="13" font-weight="600" fill="#1A1A1A">S'élargit par union au lieu de se restreindre</text>
  </g>

  <!-- Row 4 -->
  <g class="interactive" data-card="detournabilite" tabindex="0" role="button" aria-label="Détournabilité par l'entrée — détails">
    <rect x="70" y="470" width="1060" height="76" rx="3" fill="#FDF0EE" stroke="#B7332C" stroke-width="1.75"/>
    <text x="92" y="501" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Détournabilité par l'entrée</text>
    <text x="92" y="526" class="body" font-size="13" fill="#5A5A5A">Qui peut lui dicter une action</text>
    <text x="470" y="514" class="body" font-size="13" fill="#5A5A5A">Personne : pas de canal</text>
    <text x="778" y="514" class="body" font-size="13" font-weight="600" fill="#B7332C">Quiconque écrit dans ce qu'il lit</text>
  </g>

  <!-- Confused deputy box -->
  <g class="interactive" data-card="depute-confus" tabindex="0" role="button" aria-label="Le député confus — détails">
    <rect x="70" y="586" width="1060" height="122" rx="3" fill="#F2EFE7" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="92" y="616" class="mono" font-size="12" letter-spacing="0.09em" fill="#B58A2C">LA FIGURE QUI RÉUNIT LES QUATRE — LE DÉPUTÉ CONFUS</text>
    <text x="92" y="646" class="body" font-size="14" fill="#1A1A1A">Un intermédiaire légitimement doté d'une autorité en fait usage pour le compte de quelqu'un qui ne l'a pas.</text>
    <text x="92" y="670" class="body" font-size="14" fill="#1A1A1A">Ce qui est nouveau en 2026 tient à l'ampleur de l'autorité déléguée, non à la nature du détournement.</text>
    <text x="92" y="696" class="body" font-size="14" font-weight="600" fill="#B7332C">Conséquence : le correctif est du côté de l'habilitation, jamais du côté de la robustesse du modèle.</text>
    <line x1="600" y1="546" x2="600" y2="582" stroke="#B7332C" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#arr3)"/>
  </g>

  <!-- Footer -->
  <line x1="70" y1="742" x2="1130" y2="742" stroke="#E5E1D8" stroke-width="1"/>
  <text x="70" y="766" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Sources : note de recherche du Cloud Security Alliance sur le détournement d'autorité ; littérature sur la propagation d'autorisation en systèmes multi-agents (arXiv:2605.05440). Grille de l'auteur.</text>
</svg>
