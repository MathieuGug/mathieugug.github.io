<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le ratio d'identités non humaines contre trois taux de pilotage">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', 'Playfair Display', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="70" y="56" class="mono" font-size="13" font-weight="600" letter-spacing="0.14em" fill="#B7332C">SCHÉMA 05</text>
  <text x="70" y="98" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le ratio contre le taux</text>
  <text x="70" y="128" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un chiffre d'alerte destiné à ouvrir un budget, et trois mesures qu'un comité peut piloter.</text>
  <line x1="70" y1="152" x2="1130" y2="152" stroke="#E5E1D8" stroke-width="1"/>

  <!-- LEFT : dispersion -->
  <text x="70" y="192" class="mono" font-size="12" letter-spacing="0.09em" fill="#B8B5AE">IDENTITÉS NON HUMAINES PAR HUMAIN — VALEURS PUBLIÉES SUR DOUZE MOIS</text>

  <g class="interactive" data-card="dispersion" tabindex="0" role="button" aria-label="La dispersion des ratios publiés — détails">
    <rect x="70" y="208" width="500" height="288" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>

    <!-- axis -->
    <line x1="196" y1="466" x2="546" y2="466" stroke="#B8B5AE" stroke-width="0.5"/>
    <text x="196" y="484" class="mono" font-size="11" fill="#B8B5AE">0</text>
    <text x="356" y="484" class="mono" font-size="11" fill="#B8B5AE">60</text>
    <text x="516" y="484" class="mono" font-size="11" fill="#B8B5AE">120</text>

    <!-- bars : x = 196 + v*2.917 -->
    <text x="86" y="248" class="body" font-size="12" fill="#5A5A5A">fourchette basse</text>
    <rect x="196" y="236" width="117" height="16" fill="#1F5560" opacity="0.35"/>
    <text x="321" y="249" class="mono" font-size="12" fill="#5A5A5A">40</text>

    <text x="86" y="288" class="body" font-size="12" fill="#5A5A5A">éditeur A, page produit</text>
    <rect x="196" y="276" width="131" height="16" fill="#1F5560" opacity="0.45"/>
    <text x="335" y="289" class="mono" font-size="12" fill="#5A5A5A">45</text>

    <text x="86" y="328" class="body" font-size="12" fill="#5A5A5A">éditeur A, rapport annuel</text>
    <rect x="196" y="316" width="239" height="16" fill="#1F5560" opacity="0.6"/>
    <text x="443" y="329" class="mono" font-size="12" fill="#5A5A5A">82</text>

    <text x="86" y="368" class="body" font-size="12" fill="#5A5A5A">éditeur B</text>
    <rect x="196" y="356" width="268" height="16" fill="#1F5560" opacity="0.75"/>
    <text x="472" y="369" class="mono" font-size="12" fill="#5A5A5A">92</text>

    <text x="86" y="408" class="body" font-size="12" fill="#5A5A5A">compilation, dont 79 agents</text>
    <rect x="196" y="396" width="318" height="16" fill="#B7332C" opacity="0.85"/>
    <text x="522" y="409" class="mono" font-size="12" fill="#B7332C">109</text>

    <text x="86" y="444" class="body" font-size="13" font-weight="600" fill="#B7332C">écart : facteur 2,7</text>
  </g>

  <g class="interactive" data-card="conflit-source" tabindex="0" role="button" aria-label="Le problème de source — détails">
    <rect x="70" y="512" width="500" height="128" rx="3" fill="#FDF0EE" stroke="#B7332C" stroke-width="1.25"/>
    <text x="90" y="542" class="mono" font-size="12" letter-spacing="0.09em" fill="#B7332C">POURQUOI CE CHIFFRE NE SE PILOTE PAS</text>
    <text x="90" y="570" class="body" font-size="13" fill="#1A1A1A">a. Toutes les mesures viennent d'éditeurs qui vendent le remède.</text>
    <text x="90" y="594" class="body" font-size="13" fill="#1A1A1A">b. Aucun dénominateur commun : jetons, certificats, conteneurs ?</text>
    <text x="90" y="618" class="body" font-size="13" fill="#1A1A1A">c. Il ne se rattache à aucune décision, ni à un ordre de priorité.</text>
  </g>

  <!-- RIGHT : three rates -->
  <line x1="590" y1="180" x2="590" y2="660" stroke="#E5E1D8" stroke-width="1"/>
  <text x="616" y="192" class="mono" font-size="12" letter-spacing="0.09em" fill="#B8B5AE">TROIS TAUX QUE L'ORGANISATION PRODUIT ELLE-MÊME</text>

  <g class="interactive" data-card="taux-propriete" tabindex="0" role="button" aria-label="Taux de propriété — détails">
    <rect x="616" y="208" width="514" height="132" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.75"/>
    <text x="638" y="240" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560">1</text>
    <text x="666" y="240" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Taux de propriété</text>
    <text x="638" y="270" class="body" font-size="13" fill="#1A1A1A">Part des identités non humaines actives portant un propriétaire</text>
    <text x="638" y="292" class="body" font-size="13" fill="#1A1A1A">nommé, vivant, et une date de revue non dépassée.</text>
    <text x="638" y="322" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Borne toute autre ambition de gouvernance.</text>
  </g>

  <g class="interactive" data-card="taux-portee" tabindex="0" role="button" aria-label="Taux de portée — détails">
    <rect x="616" y="352" width="514" height="132" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.75"/>
    <text x="638" y="384" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560">2</text>
    <text x="666" y="384" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Taux de portée</text>
    <text x="638" y="414" class="body" font-size="13" fill="#1A1A1A">Part des habilitations accordées à un agent qui ont été</text>
    <text x="638" y="436" class="body" font-size="13" fill="#1A1A1A">effectivement exercées sur quatre-vingt-dix jours.</text>
    <text x="638" y="466" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Mesure directe du rayon d'un détournement.</text>
  </g>

  <g class="interactive" data-card="taux-reconstitution" tabindex="0" role="button" aria-label="Taux de reconstitution — détails">
    <rect x="616" y="496" width="514" height="144" rx="3" fill="#FDF0EE" stroke="#B7332C" stroke-width="2.5"/>
    <text x="638" y="528" class="mono" font-size="12" letter-spacing="0.08em" fill="#B7332C">3</text>
    <text x="666" y="528" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Taux de reconstitution</text>
    <text x="638" y="558" class="body" font-size="13" fill="#1A1A1A">Sur un échantillon d'actions d'agents tirées au sort dans le</text>
    <text x="638" y="580" class="body" font-size="13" fill="#1A1A1A">trimestre, part de celles qui remontent à un humain nommé.</text>
    <text x="638" y="610" class="body" font-size="12" font-style="italic" fill="#B7332C">Seul des trois à mesurer la chaîne de délégation.</text>
    <text x="638" y="630" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Prédit ce qu'on pourra opposer à un contrôle.</text>
  </g>

  <!-- Note -->
  <text x="70" y="688" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Aucun de ces trois taux ne se compare entre entreprises. C'est leur avantage : ils se comparent à eux-mêmes d'un trimestre à l'autre.</text>

  <!-- Footer -->
  <line x1="70" y1="742" x2="1130" y2="742" stroke="#E5E1D8" stroke-width="1"/>
  <text x="70" y="766" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Sources des ratios : communiqués et rapports d'éditeurs de sécurité des identités machine, 2025-2026 ; compilation de presse spécialisée. Les trois taux sont une proposition de l'auteur.</text>
</svg>
