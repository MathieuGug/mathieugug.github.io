<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La chaîne de délégation et son point de rupture">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', 'Playfair Display', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arr1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="70" y="56" class="mono" font-size="13" font-weight="600" letter-spacing="0.14em" fill="#B7332C">SCHÉMA 01</text>
  <text x="70" y="98" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La chaîne qui casse</text>
  <text x="70" y="128" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le mandat de l'humain se perd toujours au même saut : à la frontière de l'outil.</text>
  <line x1="70" y1="152" x2="1130" y2="152" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Band label -->
  <text x="70" y="192" class="mono" font-size="12" letter-spacing="0.1em" fill="#B8B5AE">CHAÎNE D'APPELS</text>

  <!-- Node A -->
  <g class="interactive" data-card="mandat-humain" tabindex="0" role="button" aria-label="Mandat humain — détails">
    <rect x="70" y="212" width="216" height="104" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.75"/>
    <text x="90" y="243" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560">1</text>
    <text x="90" y="270" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Humain commanditaire</text>
    <text x="90" y="294" class="body" font-size="13" fill="#5A5A5A">Ouvre une session, demande</text>
  </g>

  <!-- Node B -->
  <g class="interactive" data-card="agent" tabindex="0" role="button" aria-label="Agent — détails">
    <rect x="366" y="212" width="216" height="104" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.75"/>
    <text x="386" y="243" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560">2</text>
    <text x="386" y="270" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Agent</text>
    <text x="386" y="294" class="body" font-size="13" fill="#5A5A5A">Compose sa séquence d'appels</text>
  </g>

  <!-- Node C -->
  <g class="interactive" data-card="frontiere-outil" tabindex="0" role="button" aria-label="Frontière de l'outil — détails">
    <rect x="662" y="212" width="216" height="104" rx="3" fill="#FDF0EE" stroke="#B7332C" stroke-width="2.5"/>
    <text x="682" y="243" class="mono" font-size="12" letter-spacing="0.08em" fill="#B7332C">3</text>
    <text x="682" y="270" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Serveur d'outils</text>
    <text x="682" y="294" class="body" font-size="13" fill="#5A5A5A">Reçoit un secret, pas un mandat</text>
  </g>

  <!-- Node D -->
  <g class="interactive" data-card="systeme-cible" tabindex="0" role="button" aria-label="Système cible — détails">
    <rect x="958" y="212" width="172" height="104" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.75"/>
    <text x="978" y="243" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560">4</text>
    <text x="978" y="270" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Système cible</text>
    <text x="978" y="294" class="body" font-size="13" fill="#5A5A5A">Exécute et journalise</text>
  </g>

  <!-- Arrows -->
  <line x1="286" y1="264" x2="352" y2="264" stroke="#1A1A1A" stroke-width="1.75" marker-end="url(#arr1)"/>
  <text x="319" y="252" class="body" font-size="12" fill="#1F5560" text-anchor="middle">mandat</text>

  <line x1="582" y1="264" x2="648" y2="264" stroke="#B7332C" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arr1c)"/>
  <text x="615" y="252" class="body" font-size="12" font-weight="600" fill="#B7332C" text-anchor="middle">rupture</text>

  <line x1="878" y1="264" x2="944" y2="264" stroke="#1A1A1A" stroke-width="1.75" marker-end="url(#arr1)"/>
  <text x="911" y="252" class="body" font-size="12" fill="#5A5A5A" text-anchor="middle">secret</text>

  <!-- Rupture marker -->
  <g class="interactive" data-card="journal-rompu" tabindex="0" role="button" aria-label="Le journal après rupture — détails">
    <line x1="615" y1="330" x2="615" y2="390" stroke="#B7332C" stroke-width="1" stroke-dasharray="3 4"/>
    <circle cx="615" cy="404" r="13" fill="#B7332C"/>
    <text x="615" y="409" class="mono" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">!</text>
    <text x="640" y="409" class="body" font-size="13" font-weight="600" fill="#B7332C">Au-delà de ce point, plus aucun journal ne porte le nom d'un humain.</text>
  </g>

  <!-- Journal band -->
  <text x="70" y="470" class="mono" font-size="12" letter-spacing="0.1em" fill="#B8B5AE">CE QUE LE JOURNAL RETIENT, SAUT PAR SAUT</text>

  <rect x="70" y="488" width="216" height="62" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
  <text x="90" y="514" class="mono" font-size="12" fill="#1F5560">utilisateur : m.dupont</text>
  <text x="90" y="536" class="mono" font-size="12" fill="#1F5560">agent : —</text>

  <rect x="366" y="488" width="216" height="62" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
  <text x="386" y="514" class="mono" font-size="12" fill="#1F5560">utilisateur : m.dupont</text>
  <text x="386" y="536" class="mono" font-size="12" fill="#1F5560">agent : crm-assist</text>

  <rect x="662" y="488" width="216" height="62" rx="3" fill="#FDF0EE" stroke="#B7332C" stroke-width="1.25"/>
  <text x="682" y="514" class="mono" font-size="12" fill="#B7332C">utilisateur : ?</text>
  <text x="682" y="536" class="mono" font-size="12" fill="#1A1A1A">agent : crm-assist</text>

  <rect x="958" y="488" width="172" height="62" rx="3" fill="#FDF0EE" stroke="#B7332C" stroke-width="1.25"/>
  <text x="978" y="514" class="mono" font-size="12" fill="#B7332C">utilisateur : ?</text>
  <text x="978" y="536" class="mono" font-size="12" fill="#1A1A1A">compte : svc_crm</text>

  <!-- Legend / annotations -->
  <line x1="70" y1="592" x2="1130" y2="592" stroke="#E5E1D8" stroke-width="1"/>
  <text x="70" y="624" class="body" font-size="13" fill="#1A1A1A"><tspan font-weight="600">Août 2025.</tspan> Un jeton de rafraîchissement volé à l'intégration d'un agent conversationnel a suffi à interroger</text>
  <text x="70" y="648" class="body" font-size="13" fill="#1A1A1A">plus de sept cents environnements clients en dix jours. Aucun identifiant humain n'a été dérobé, aucune</text>
  <text x="70" y="672" class="body" font-size="13" fill="#1A1A1A">authentification multifacteur n'a été franchie : aucune ne se trouvait sur le chemin emprunté.</text>

  <text x="70" y="712" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Le contrôle d'accès conditionnel regarde des humains se connecter. L'agent ne se connecte pas, il présente un mandat.</text>

  <!-- Footer -->
  <line x1="70" y1="742" x2="1130" y2="742" stroke="#E5E1D8" stroke-width="1"/>
  <text x="70" y="766" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Source : chronologie publique de l'incident UNC6395 (août 2025) ; RFC 8693 pour la sémantique de délégation. Reconstruction schématique de l'auteur.</text>
</svg>
