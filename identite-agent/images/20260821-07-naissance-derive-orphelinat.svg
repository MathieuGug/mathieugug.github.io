<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le cycle de vie d'un agent et les trois portes manquantes">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', 'Playfair Display', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="70" y="56" class="mono" font-size="13" font-weight="600" letter-spacing="0.14em" fill="#B7332C">SCHÉMA 07</text>
  <text x="70" y="98" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Naissance, dérive, orphelinat</text>
  <text x="70" y="128" class="display" font-size="18" font-style="italic" fill="#5A5A5A">L'agent naît en dehors du système qui distribue les identités, et n'en sort jamais.</text>
  <line x1="70" y1="152" x2="1130" y2="152" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Timeline axis -->
  <line x1="120" y1="292" x2="1090" y2="292" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arr7)"/>
  <text x="70" y="192" class="mono" font-size="12" letter-spacing="0.09em" fill="#B8B5AE">CE QUI SE PASSE</text>

  <!-- Stage 1 -->
  <g class="interactive" data-card="naissance" tabindex="0" role="button" aria-label="La naissance et la prolifération — détails">
    <circle cx="240" cy="292" r="11" fill="#1F5560"/>
    <text x="240" y="297" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <rect x="120" y="206" width="240" height="66" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <text x="140" y="232" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Prolifération</text>
    <text x="140" y="256" class="body" font-size="13" fill="#5A5A5A">Créé en heures, arbitré en mois.</text>
  </g>

  <!-- Stage 2 -->
  <g class="interactive" data-card="derive" tabindex="0" role="button" aria-label="L'accumulation de privilèges — détails">
    <circle cx="605" cy="292" r="11" fill="#1F5560"/>
    <text x="605" y="297" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
    <rect x="485" y="206" width="240" height="66" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <text x="505" y="232" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Accumulation</text>
    <text x="505" y="256" class="body" font-size="13" fill="#5A5A5A">Habilitations larges, jamais réduites.</text>
  </g>

  <!-- Stage 3 -->
  <g class="interactive" data-card="orphelinat" tabindex="0" role="button" aria-label="L'orphelinat — détails">
    <circle cx="970" cy="292" r="11" fill="#B7332C"/>
    <text x="970" y="297" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
    <rect x="850" y="206" width="240" height="66" rx="3" fill="#FDF0EE" stroke="#B7332C" stroke-width="1.75"/>
    <text x="870" y="232" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Orphelinat</text>
    <text x="870" y="256" class="body" font-size="13" fill="#5A5A5A">Survit à son cas d'usage et à son</text>
    <text x="870" y="274" class="body" font-size="13" fill="#5A5A5A">propriétaire. Identifiants valides.</text>
  </g>

  <!-- Portes band -->
  <g class="interactive" data-card="portes-manquantes" tabindex="0" role="button" aria-label="Les trois portes manquantes — détails">
    <text x="70" y="368" class="mono" font-size="12" letter-spacing="0.09em" fill="#B58A2C">LES TROIS PORTES QUI MANQUENT — AUCUNE N'EST TECHNIQUEMENT DIFFICILE</text>

    <rect x="120" y="384" width="300" height="152" rx="3" fill="#F2EFE7" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="142" y="414" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Porte à la naissance</text>
    <text x="142" y="442" class="body" font-size="13" fill="#1A1A1A">Pas d'identité sans propriétaire</text>
    <text x="142" y="462" class="body" font-size="13" fill="#1A1A1A">nommé, sans cas d'usage rattaché,</text>
    <text x="142" y="482" class="body" font-size="13" fill="#1A1A1A">sans date d'expiration.</text>
    <text x="142" y="512" class="body" font-size="12" font-style="italic" fill="#B58A2C">L'expiration inverse la charge :</text>
    <text x="142" y="528" class="body" font-size="12" font-style="italic" fill="#B58A2C">le maintien devient l'acte à justifier.</text>

    <rect x="450" y="384" width="300" height="152" rx="3" fill="#F2EFE7" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="472" y="414" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Porte à la mobilité</text>
    <text x="472" y="442" class="body" font-size="13" fill="#1A1A1A">Quand le propriétaire d'un agent</text>
    <text x="472" y="462" class="body" font-size="13" fill="#1A1A1A">change de poste, l'agent figure</text>
    <text x="472" y="482" class="body" font-size="13" fill="#1A1A1A">dans sa liste de transfert.</text>
    <text x="472" y="512" class="body" font-size="12" font-style="italic" fill="#B58A2C">Une ligne à ajouter à un</text>
    <text x="472" y="528" class="body" font-size="12" font-style="italic" fill="#B58A2C">formulaire qui existe déjà.</text>

    <rect x="780" y="384" width="310" height="152" rx="3" fill="#F2EFE7" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="802" y="414" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Porte au départ</text>
    <text x="802" y="442" class="body" font-size="13" fill="#1A1A1A">La liste de sortie d'un salarié</text>
    <text x="802" y="462" class="body" font-size="13" fill="#1A1A1A">comporte une rubrique « agents</text>
    <text x="802" y="482" class="body" font-size="13" fill="#1A1A1A">dont il est propriétaire ».</text>
    <text x="802" y="512" class="body" font-size="12" font-style="italic" fill="#B58A2C">Sans elle, un départ de chef de</text>
    <text x="802" y="528" class="body" font-size="12" font-style="italic" fill="#B58A2C">projet produit une cohorte.</text>
  </g>

  <!-- Registre band -->
  <rect x="120" y="576" width="970" height="112" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.75"/>
  <text x="142" y="606" class="mono" font-size="12" letter-spacing="0.09em" fill="#1F5560">OÙ CES TROIS PORTES S'INSTALLENT</text>
  <text x="142" y="636" class="body" font-size="14" fill="#1A1A1A">Le registre des agents se confond avec le registre des cas d'usage que la conformité réclame déjà : la même table,</text>
  <text x="142" y="658" class="body" font-size="14" fill="#1A1A1A">augmentée de trois colonnes, type d'identifiant, propriétaire technique, date de revue.</text>
  <text x="142" y="680" class="body" font-size="13" font-weight="600" fill="#B7332C">Tenir deux registres séparés garantit qu'au moins l'un des deux ment.</text>

  <!-- Footer -->
  <line x1="70" y1="742" x2="1130" y2="742" stroke="#E5E1D8" stroke-width="1"/>
  <text x="70" y="766" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Sources : littérature professionnelle sur la gestion du cycle de vie des identités non humaines, 2026 ; article 26 du règlement européen sur l'IA pour la conservation des journaux. Grille de l'auteur.</text>
</svg>
