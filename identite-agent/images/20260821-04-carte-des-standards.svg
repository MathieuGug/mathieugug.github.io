<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Ce que les standards d'identité d'agent couvrent et ne couvrent pas">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', 'Playfair Display', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="70" y="56" class="mono" font-size="13" font-weight="600" letter-spacing="0.14em" fill="#B7332C">SCHÉMA 04</text>
  <text x="70" y="98" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La carte des standards, et ses deux colonnes vides</text>
  <text x="70" y="128" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Authentifier et autoriser sont couverts. Révoquer en chaîne et rejouer ne le sont par personne.</text>
  <line x1="70" y1="152" x2="1130" y2="152" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Empty-column highlight band -->
  <g class="interactive" data-card="cases-vides" tabindex="0" role="button" aria-label="Les deux fonctions non couvertes — détails">
    <rect x="855" y="190" width="220" height="368" rx="3" fill="#FDF0EE" stroke="#B7332C" stroke-width="1.75" stroke-dasharray="5 4"/>
  </g>

  <!-- Column headers -->
  <text x="470" y="216" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Authentifier</text>
  <text x="470" y="236" class="body" font-size="11" fill="#B8B5AE" text-anchor="middle">qui est-ce</text>
  <text x="580" y="216" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Autoriser</text>
  <text x="580" y="236" class="body" font-size="11" fill="#B8B5AE" text-anchor="middle">a-t-il le droit</text>
  <text x="690" y="216" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Propager</text>
  <text x="690" y="236" class="body" font-size="11" fill="#B8B5AE" text-anchor="middle">le mandat</text>
  <text x="800" y="216" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Attester</text>
  <text x="800" y="236" class="body" font-size="11" fill="#B8B5AE" text-anchor="middle">la charge</text>
  <text x="910" y="216" class="body" font-size="13" font-weight="600" fill="#B7332C" text-anchor="middle">Révoquer</text>
  <text x="910" y="236" class="body" font-size="11" fill="#B7332C" text-anchor="middle">en chaîne</text>
  <text x="1020" y="216" class="body" font-size="13" font-weight="600" fill="#B7332C" text-anchor="middle">Rejouer</text>
  <text x="1020" y="236" class="body" font-size="11" fill="#B7332C" text-anchor="middle">reconstituer</text>

  <line x1="70" y1="252" x2="1075" y2="252" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Row 1 : RFC 8693 -->
  <g class="interactive" data-card="rfc8693" tabindex="0" role="button" aria-label="RFC 8693 — détails">
    <rect x="70" y="258" width="345" height="56" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <text x="92" y="284" class="body" font-size="14" font-weight="600" fill="#1A1A1A">RFC 8693 — échange de jeton</text>
    <text x="92" y="304" class="mono" font-size="11" fill="#5A5A5A">IETF, janvier 2020 · revendication act</text>
  </g>
  <text x="470" y="292" class="body" font-size="17" fill="#1F5560" text-anchor="middle">●</text>
  <text x="580" y="292" class="body" font-size="17" fill="#1F5560" text-anchor="middle">◐</text>
  <text x="690" y="292" class="body" font-size="17" fill="#1F5560" text-anchor="middle">●</text>
  <text x="800" y="292" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>
  <text x="910" y="292" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>
  <text x="1020" y="292" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">◐</text>

  <!-- Row 2 : SPIFFE -->
  <g class="interactive" data-card="spiffe" tabindex="0" role="button" aria-label="SPIFFE et SPIRE — détails">
    <rect x="70" y="320" width="345" height="56" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <text x="92" y="346" class="body" font-size="14" font-weight="600" fill="#1A1A1A">SPIFFE / SPIRE</text>
    <text x="92" y="366" class="mono" font-size="11" fill="#5A5A5A">attestation nœud puis charge · rotation horaire</text>
  </g>
  <text x="470" y="354" class="body" font-size="17" fill="#1F5560" text-anchor="middle">●</text>
  <text x="580" y="354" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>
  <text x="690" y="354" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>
  <text x="800" y="354" class="body" font-size="17" fill="#1F5560" text-anchor="middle">●</text>
  <text x="910" y="354" class="body" font-size="17" fill="#1F5560" text-anchor="middle">◐</text>
  <text x="1020" y="354" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>

  <!-- Row 3 : MCP -->
  <g class="interactive" data-card="mcp-oauth" tabindex="0" role="button" aria-label="MCP et OAuth 2.1 — détails">
    <rect x="70" y="382" width="345" height="56" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <text x="92" y="408" class="body" font-size="14" font-weight="600" fill="#1A1A1A">MCP — autorisation OAuth 2.1</text>
    <text x="92" y="428" class="mono" font-size="11" fill="#5A5A5A">RFC 7591 / RFC 8414 · serveur de ressource distinct</text>
  </g>
  <text x="470" y="416" class="body" font-size="17" fill="#1F5560" text-anchor="middle">●</text>
  <text x="580" y="416" class="body" font-size="17" fill="#1F5560" text-anchor="middle">●</text>
  <text x="690" y="416" class="body" font-size="17" fill="#B58A2C" text-anchor="middle">◐</text>
  <text x="800" y="416" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>
  <text x="910" y="416" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>
  <text x="1020" y="416" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>

  <!-- Row 4 : A2A -->
  <g class="interactive" data-card="a2a-cartes" tabindex="0" role="button" aria-label="A2A et cartes d'agent signées — détails">
    <rect x="70" y="444" width="345" height="56" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <text x="92" y="470" class="body" font-size="14" font-weight="600" fill="#1A1A1A">A2A 1.0 — cartes d'agent signées</text>
    <text x="92" y="490" class="mono" font-size="11" fill="#5A5A5A">Linux Foundation · registre encore ouvert</text>
  </g>
  <text x="470" y="478" class="body" font-size="17" fill="#1F5560" text-anchor="middle">●</text>
  <text x="580" y="478" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>
  <text x="690" y="478" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>
  <text x="800" y="478" class="body" font-size="17" fill="#B58A2C" text-anchor="middle">◐</text>
  <text x="910" y="478" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>
  <text x="1020" y="478" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>

  <!-- Row 5 : AuthZEN / OIDC drafts -->
  <g class="interactive" data-card="brouillons" tabindex="0" role="button" aria-label="Brouillons d'autorisation à l'ère des agents — détails">
    <rect x="70" y="506" width="345" height="56" rx="3" fill="#F2EFE7" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="92" y="532" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Brouillons — autorisation agentique</text>
    <text x="92" y="552" class="mono" font-size="11" fill="#5A5A5A">&gt; 70 propositions au groupe OAuth de l'IETF</text>
  </g>
  <text x="470" y="540" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>
  <text x="580" y="540" class="body" font-size="17" fill="#B58A2C" text-anchor="middle">◐</text>
  <text x="690" y="540" class="body" font-size="17" fill="#B58A2C" text-anchor="middle">◐</text>
  <text x="800" y="540" class="body" font-size="17" fill="#B8B5AE" text-anchor="middle">○</text>
  <text x="910" y="540" class="body" font-size="17" fill="#B58A2C" text-anchor="middle">◐</text>
  <text x="1020" y="540" class="body" font-size="17" fill="#B58A2C" text-anchor="middle">◐</text>

  <!-- Legend -->
  <text x="70" y="600" class="mono" font-size="12" letter-spacing="0.09em" fill="#B8B5AE">LÉGENDE</text>
  <text x="180" y="600" class="body" font-size="13" fill="#1F5560">● couvert par une spécification stable</text>
  <text x="500" y="600" class="body" font-size="13" fill="#B58A2C">◐ partiel ou à l'état de brouillon</text>
  <text x="790" y="600" class="body" font-size="13" fill="#B8B5AE">○ hors périmètre</text>

  <!-- Verdict -->
  <rect x="70" y="622" width="1060" height="94" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
  <text x="92" y="652" class="mono" font-size="12" letter-spacing="0.09em" fill="#B7332C">VERDICT</text>
  <text x="92" y="680" class="body" font-size="14" fill="#1A1A1A">Une analyse systématique de cinq protocoles d'interopérabilité conclut que la gouvernance d'une communauté d'agents</text>
  <text x="92" y="702" class="body" font-size="14" fill="#1A1A1A">constitue <tspan font-weight="600">une couche architecturale manquante au-dessus</tspan> des standards, non une fonctionnalité manquante à l'intérieur.</text>

  <!-- Footer -->
  <line x1="70" y1="742" x2="1130" y2="742" stroke="#E5E1D8" stroke-width="1"/>
  <text x="70" y="766" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Sources : RFC 8693 ; documentation SPIFFE ; spécification MCP § autorisation ; communiqué Linux Foundation sur A2A ; arXiv:2604.23280 et arXiv:2606.31498. Évaluation de l'auteur.</text>
</svg>
