<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Les paliers d'autonomie relus par la pièce d'identité qu'ils exigent">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', 'Playfair Display', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="70" y="56" class="mono" font-size="13" font-weight="600" letter-spacing="0.14em" fill="#B7332C">SCHÉMA 06</text>
  <text x="70" y="98" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le palier devient opposable ici</text>
  <text x="70" y="128" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un palier qui n'est refusé nulle part est une intention. Chaque marche a son point de refus.</text>
  <line x1="70" y1="152" x2="1130" y2="152" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Column headers -->
  <text x="92" y="192" class="mono" font-size="12" letter-spacing="0.09em" fill="#B8B5AE">PALIER</text>
  <text x="470" y="192" class="mono" font-size="12" letter-spacing="0.09em" fill="#B8B5AE">PIÈCE D'IDENTITÉ EXIGÉE</text>
  <text x="852" y="192" class="mono" font-size="12" letter-spacing="0.09em" fill="#B7332C">QUI REFUSE</text>
  <line x1="70" y1="204" x2="1130" y2="204" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Palier 1 -->
  <g class="interactive" data-card="palier-1" tabindex="0" role="button" aria-label="Palier 1, l'agent propose — détails">
    <rect x="70" y="214" width="1060" height="96" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="92" y="246" class="mono" font-size="12" fill="#1F5560">1</text>
    <text x="118" y="246" class="body" font-size="15" font-weight="600" fill="#1A1A1A">L'agent propose</text>
    <text x="92" y="272" class="body" font-size="13" fill="#5A5A5A">Il lit, il rédige, un humain valide</text>
    <text x="92" y="294" class="body" font-size="13" fill="#5A5A5A">avant tout effet.</text>
    <text x="470" y="252" class="body" font-size="14" fill="#1A1A1A">Principal applicatif enregistré,</text>
    <text x="470" y="274" class="body" font-size="14" fill="#1A1A1A">avec propriétaire nommé.</text>
    <text x="852" y="252" class="body" font-size="14" font-weight="600" fill="#B7332C">Le registre</text>
    <text x="852" y="276" class="body" font-size="12" fill="#5A5A5A">Agent absent du registre :</text>
    <text x="852" y="294" class="body" font-size="12" fill="#5A5A5A">aucun accès hors bac à sable.</text>
  </g>

  <!-- Palier 2 -->
  <g class="interactive" data-card="palier-2" tabindex="0" role="button" aria-label="Palier 2, l'agent exécute sous validation — détails">
    <rect x="70" y="318" width="1060" height="112" rx="3" fill="#FDF0EE" stroke="#B7332C" stroke-width="2.5"/>
    <text x="92" y="350" class="mono" font-size="12" fill="#B7332C">2</text>
    <text x="118" y="350" class="body" font-size="15" font-weight="600" fill="#1A1A1A">L'agent exécute sous validation</text>
    <text x="92" y="376" class="body" font-size="13" fill="#5A5A5A">Il agit, un humain contresigne</text>
    <text x="92" y="398" class="body" font-size="13" fill="#5A5A5A">chaque effet externe.</text>
    <text x="92" y="420" class="body" font-size="12" font-style="italic" fill="#B7332C">La marche presque toujours sautée.</text>
    <text x="470" y="356" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Propagation du mandat.</text>
    <text x="470" y="380" class="body" font-size="13" fill="#1A1A1A">Chaque appel d'outil porte l'identité de</text>
    <text x="470" y="400" class="body" font-size="13" fill="#1A1A1A">l'humain commanditaire, en délégation</text>
    <text x="470" y="420" class="body" font-size="13" fill="#1A1A1A">et non en usurpation.</text>
    <text x="852" y="356" class="body" font-size="14" font-weight="600" fill="#B7332C">Le serveur d'outils</text>
    <text x="852" y="380" class="body" font-size="12" fill="#5A5A5A">Il rejette tout jeton qui ne</text>
    <text x="852" y="398" class="body" font-size="12" fill="#5A5A5A">porte pas de mandat.</text>
  </g>

  <!-- Palier 3 -->
  <g class="interactive" data-card="palier-3" tabindex="0" role="button" aria-label="Palier 3, l'agent exécute et notifie — détails">
    <rect x="70" y="438" width="1060" height="112" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="92" y="470" class="mono" font-size="12" fill="#1F5560">3</text>
    <text x="118" y="470" class="body" font-size="15" font-weight="600" fill="#1A1A1A">L'agent exécute et notifie</text>
    <text x="92" y="496" class="body" font-size="13" fill="#5A5A5A">Il agit, l'humain découvre après</text>
    <text x="92" y="518" class="body" font-size="13" fill="#5A5A5A">coup et peut revenir en arrière.</text>
    <text x="470" y="476" class="body" font-size="14" fill="#1A1A1A">Attestation de la charge de travail,</text>
    <text x="470" y="498" class="body" font-size="14" fill="#1A1A1A">habilitation bornée à l'exécution,</text>
    <text x="470" y="520" class="body" font-size="14" fill="#1A1A1A">journal conservant la chaîne complète.</text>
    <text x="852" y="476" class="body" font-size="14" font-weight="600" fill="#B7332C">Le serveur d'autorisation</text>
    <text x="852" y="500" class="body" font-size="12" fill="#5A5A5A">Il n'échange un jeton qu'au</text>
    <text x="852" y="518" class="body" font-size="12" fill="#5A5A5A">bénéfice d'une charge attestée.</text>
  </g>

  <!-- Palier 4 -->
  <g class="interactive" data-card="palier-4" tabindex="0" role="button" aria-label="Palier 4, l'agent exécute sans notification préalable — détails">
    <rect x="70" y="558" width="1060" height="112" rx="3" fill="#F2EFE7" stroke="#B58A2C" stroke-width="1.75" stroke-dasharray="5 4"/>
    <text x="92" y="590" class="mono" font-size="12" fill="#B58A2C">4</text>
    <text x="118" y="590" class="body" font-size="15" font-weight="600" fill="#1A1A1A">L'agent exécute sans préavis</text>
    <text x="92" y="616" class="body" font-size="13" fill="#5A5A5A">Il agit dans son périmètre sans</text>
    <text x="92" y="638" class="body" font-size="13" fill="#5A5A5A">signalement individuel.</text>
    <text x="470" y="596" class="body" font-size="14" fill="#1A1A1A">Tout ce qui précède, plus une capacité de</text>
    <text x="470" y="618" class="body" font-size="14" fill="#1A1A1A">révocation en chaîne <tspan font-weight="600">éprouvée par exercice</tspan>.</text>
    <text x="852" y="596" class="body" font-size="14" font-weight="600" fill="#B58A2C">Personne, à ce jour</text>
    <text x="852" y="620" class="body" font-size="12" fill="#5A5A5A">Aucun mécanisme normalisé.</text>
    <text x="852" y="640" class="body" font-size="12" font-weight="600" fill="#B7332C">Conséquence : palier fermé</text>
    <text x="852" y="658" class="body" font-size="12" font-weight="600" fill="#B7332C">hors bac à sable.</text>
  </g>

  <!-- Test -->
  <text x="70" y="712" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Le test qui rend la grille falsifiable : prenez une action d'agent au hasard dans le trimestre, et remontez au commanditaire.</text>

  <!-- Footer -->
  <line x1="70" y1="742" x2="1130" y2="742" stroke="#E5E1D8" stroke-width="1"/>
  <text x="70" y="766" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Les paliers reprennent la graduation en quatre marches des cadres de gouvernance agentique publiés en 2025-2026. La colonne « qui refuse » est une construction de l'auteur.</text>
</svg>
