<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Trois identités qu'on croit être une">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', 'Playfair Display', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="70" y="56" class="mono" font-size="13" font-weight="600" letter-spacing="0.14em" fill="#B7332C">SCHÉMA 02</text>
  <text x="70" y="98" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois identités qu'on croit être une</text>
  <text x="70" y="128" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Une organisation qui achète la deuxième croit avoir réglé la troisième.</text>
  <line x1="70" y1="152" x2="1130" y2="152" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Row labels -->
  <text x="70" y="212" class="mono" font-size="12" letter-spacing="0.09em" fill="#B8B5AE">QUESTION POSÉE</text>
  <text x="70" y="330" class="mono" font-size="12" letter-spacing="0.09em" fill="#B8B5AE">TECHNOLOGIE</text>
  <text x="70" y="452" class="mono" font-size="12" letter-spacing="0.09em" fill="#B8B5AE">CE QU'ELLE NE DIT PAS</text>
  <line x1="70" y1="180" x2="1130" y2="180" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="70" y1="300" x2="1130" y2="300" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="70" y1="420" x2="1130" y2="420" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="70" y1="540" x2="1130" y2="540" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- Column 1 -->
  <g class="interactive" data-card="charge-travail" tabindex="0" role="button" aria-label="Identité de charge de travail — détails">
    <rect x="242" y="168" width="286" height="372" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <text x="264" y="203" class="body" font-size="15" font-weight="600" fill="#1F5560">Charge de travail</text>
    <text x="264" y="240" class="body" font-size="14" fill="#1A1A1A">Qu'est-ce qui s'exécute,</text>
    <text x="264" y="262" class="body" font-size="14" fill="#1A1A1A">et sur quelle machine ?</text>
    <text x="264" y="333" class="mono" font-size="13" fill="#1A1A1A">SPIFFE / SPIRE</text>
    <text x="264" y="356" class="body" font-size="13" fill="#5A5A5A">attestation, document</text>
    <text x="264" y="378" class="body" font-size="13" fill="#5A5A5A">de courte durée</text>
    <text x="264" y="453" class="body" font-size="13" fill="#5A5A5A">Ni quel agent c'est,</text>
    <text x="264" y="475" class="body" font-size="13" fill="#5A5A5A">ni pour qui il travaille.</text>
  </g>

  <!-- Column 2 -->
  <g class="interactive" data-card="principal-agent" tabindex="0" role="button" aria-label="Principal applicatif de l'agent — détails">
    <rect x="548" y="168" width="286" height="372" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <text x="570" y="203" class="body" font-size="15" font-weight="600" fill="#1F5560">Principal de l'agent</text>
    <text x="570" y="240" class="body" font-size="14" fill="#1A1A1A">Quel agent est-ce,</text>
    <text x="570" y="262" class="body" font-size="14" fill="#1A1A1A">et qui en répond ?</text>
    <text x="570" y="333" class="mono" font-size="13" fill="#1A1A1A">registre d'agents</text>
    <text x="570" y="356" class="body" font-size="13" fill="#5A5A5A">propriétaire, revue d'accès,</text>
    <text x="570" y="378" class="body" font-size="13" fill="#5A5A5A">carte d'agent signée</text>
    <text x="570" y="453" class="body" font-size="13" fill="#5A5A5A">Ni au nom de qui</text>
    <text x="570" y="475" class="body" font-size="13" fill="#5A5A5A">cet appel-ci est fait.</text>
  </g>

  <!-- Column 3 -->
  <g class="interactive" data-card="mandat-delegue" tabindex="0" role="button" aria-label="Mandat délégué — détails">
    <rect x="854" y="168" width="276" height="372" rx="3" fill="#FDF0EE" stroke="#B7332C" stroke-width="2.5"/>
    <text x="876" y="203" class="body" font-size="15" font-weight="600" fill="#B7332C">Mandat délégué</text>
    <text x="876" y="240" class="body" font-size="14" fill="#1A1A1A">Au nom de qui</text>
    <text x="876" y="262" class="body" font-size="14" fill="#1A1A1A">cette action est-elle faite ?</text>
    <text x="876" y="333" class="mono" font-size="13" fill="#1A1A1A">RFC 8693, revendication</text>
    <text x="876" y="356" class="mono" font-size="13" fill="#1A1A1A">act imbriquée</text>
    <text x="876" y="378" class="body" font-size="13" fill="#5A5A5A">propriété de chaque appel</text>
    <text x="876" y="453" class="body" font-size="13" fill="#5A5A5A">Rien : c'est la seule</text>
    <text x="876" y="475" class="body" font-size="13" fill="#5A5A5A">que le droit interroge.</text>
  </g>

  <!-- Verdict band -->
  <g class="interactive" data-card="case-vide" tabindex="0" role="button" aria-label="La case que personne ne remplit — détails">
    <rect x="242" y="572" width="888" height="86" rx="3" fill="#F2EFE7" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="264" y="604" class="mono" font-size="12" letter-spacing="0.09em" fill="#B58A2C">CE QUE L'ORGANISATION TIENT EFFECTIVEMENT</text>
    <text x="264" y="632" class="body" font-size="14" fill="#1A1A1A">Colonne 2 achetée et administrée. Colonne 1 en projet d'infrastructure. Colonne 3 remplacée par un compte de</text>
    <text x="264" y="652" class="body" font-size="14" fill="#1A1A1A">service partagé, identique pour tous les utilisateurs de l'agent.</text>
  </g>

  <text x="70" y="604" class="mono" font-size="12" letter-spacing="0.09em" fill="#B8B5AE">VERDICT</text>

  <!-- Annotation -->
  <text x="70" y="700" class="body" font-size="13" font-style="italic" fill="#5A5A5A">À partir du moment où la colonne 3 est remplacée par un compte de service, le mandat n'a pas été perdu : il n'a jamais été propagé.</text>

  <!-- Footer -->
  <line x1="70" y1="742" x2="1130" y2="742" stroke="#E5E1D8" stroke-width="1"/>
  <text x="70" y="766" class="body" font-size="12" font-style="italic" fill="#B8B5AE">Sources : RFC 8693 (IETF, 2020) ; documentation SPIFFE/SPIRE ; documentation Microsoft Entra Agent ID ; spécification A2A 1.0. Grille de l'auteur.</text>
</svg>
