<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-label="Cinq mécanismes d'oubli, du plus automatique au plus explicite, et le cliquet d'exclusion que la décroissance de confiance est seule à rouvrir">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="850" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Cinq mécanismes d'oubli, et celui qu'on retire en premier</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">L'oubli est une fonctionnalité de conception, et sa suppression ne se voit qu'après plusieurs mois d'usage</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">AUTOMATIQUE</text>
  <text x="1136" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">EXPLICITE</text>
  <line x1="64" y1="212" x2="1130" y2="212" stroke="#5A5A5A" stroke-width="1.2" marker-end="url(#a6)"/>
  <line x1="164" y1="206" x2="164" y2="218" stroke="#5A5A5A" stroke-width="1.2"/>
  <line x1="382" y1="206" x2="382" y2="218" stroke="#5A5A5A" stroke-width="1.2"/>
  <line x1="600" y1="206" x2="600" y2="218" stroke="#5A5A5A" stroke-width="1.2"/>
  <line x1="818" y1="206" x2="818" y2="218" stroke="#5A5A5A" stroke-width="1.2"/>
  <line x1="1036" y1="206" x2="1036" y2="218" stroke="#5A5A5A" stroke-width="1.2"/>

  <g class="interactive" data-card="oubli-o1" tabindex="0" role="button" aria-label="O1, péremption de portée — cliquez pour les détails">
    <rect x="64" y="244" width="200" height="272" rx="3" fill="#F2EFE7" opacity="0.55" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="244" width="200" height="4" fill="#B58A2C"/>
    <text x="86" y="280" class="mono" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#B58A2C">O1</text>
    <text x="86" y="308" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Péremption</text>
    <text x="86" y="330" class="display" font-size="17" font-weight="600" fill="#1A1A1A">de portée</text>
    <text x="86" y="362" class="body" font-size="11.5" fill="#5A5A5A">Tout ce qui est de portée</text>
    <text x="86" y="380" class="body" font-size="11.5" fill="#5A5A5A">session expire avec elle.</text>
    <text x="86" y="406" class="body" font-size="11.5" fill="#1A1A1A">Le budget d'hier ne</text>
    <text x="86" y="424" class="body" font-size="11.5" fill="#1A1A1A">s'applique pas aujourd'hui.</text>
    <text x="86" y="456" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Le moins coûteux des cinq,</text>
    <text x="86" y="474" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">et le plus rentable.</text>
    <rect x="86" y="486" width="156" height="22" rx="3" fill="#B58A2C"/>
    <text x="164" y="501" class="mono" font-size="10" font-weight="600" fill="#FAF8F3" text-anchor="middle">PORTÉE SESSION</text>
  </g>

  <g class="interactive" data-card="oubli-o2" tabindex="0" role="button" aria-label="O2, décroissance de confiance — cliquez pour les détails">
    <rect x="282" y="244" width="200" height="272" rx="3" fill="#F2EFE7" opacity="0.55" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="282" y="244" width="200" height="4" fill="#1F5560"/>
    <text x="304" y="280" class="mono" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#1F5560">O2</text>
    <text x="304" y="308" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Décroissance</text>
    <text x="304" y="330" class="display" font-size="17" font-weight="600" fill="#1A1A1A">de confiance</text>
    <text x="304" y="362" class="body" font-size="11.5" fill="#5A5A5A">Une préférence observée</text>
    <text x="304" y="380" class="body" font-size="11.5" fill="#5A5A5A">qui n'est plus réactivée</text>
    <text x="304" y="398" class="body" font-size="11.5" fill="#5A5A5A">perd son poids et repasse</text>
    <text x="304" y="416" class="body" font-size="11.5" fill="#5A5A5A">en proposition.</text>
    <text x="304" y="434" class="body" font-size="11.5" fill="#1A1A1A">Six mois par défaut, à</text>
    <text x="304" y="452" class="body" font-size="11.5" fill="#1A1A1A">caler par catégorie.</text>
    <text x="304" y="470" class="body" font-size="11.5" font-style="italic" fill="#B7332C">Le seul qui rouvre le champ.</text>
    <rect x="304" y="486" width="156" height="22" rx="3" fill="#1F5560"/>
    <text x="382" y="501" class="mono" font-size="10" font-weight="600" fill="#FAF8F3" text-anchor="middle">NIVEAU 2 OBSERVÉ</text>
  </g>

  <g class="interactive" data-card="oubli-o3" tabindex="0" role="button" aria-label="O3, invalidation sur événement — cliquez pour les détails">
    <rect x="500" y="244" width="200" height="272" rx="3" fill="#F2EFE7" opacity="0.55" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="500" y="244" width="200" height="4" fill="#1F5560"/>
    <text x="522" y="280" class="mono" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#1F5560">O3</text>
    <text x="522" y="308" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Invalidation</text>
    <text x="522" y="330" class="display" font-size="17" font-weight="600" fill="#1A1A1A">sur événement</text>
    <text x="522" y="362" class="body" font-size="11.5" fill="#5A5A5A">Un changement déclaré</text>
    <text x="522" y="380" class="body" font-size="11.5" fill="#5A5A5A">invalide les items liés.</text>
    <text x="522" y="398" class="body" font-size="11.5" fill="#5A5A5A"></text>
    <text x="522" y="416" class="body" font-size="11.5" fill="#1A1A1A">Composition du foyer, fin</text>
    <text x="522" y="434" class="body" font-size="11.5" fill="#1A1A1A">d'un régime, changement</text>
    <text x="522" y="452" class="body" font-size="11.5" fill="#1A1A1A">de magasin.</text>
    <text x="522" y="470" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Évite les strates figées.</text>
    <rect x="522" y="486" width="156" height="22" rx="3" fill="#1F5560"/>
    <text x="600" y="501" class="mono" font-size="10" font-weight="600" fill="#FAF8F3" text-anchor="middle">TOUTES PORTÉES</text>
  </g>

  <g class="interactive" data-card="oubli-o4" tabindex="0" role="button" aria-label="O4, retrait à la demande — cliquez pour les détails">
    <rect x="718" y="244" width="200" height="272" rx="3" fill="#F2EFE7" opacity="0.55" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="718" y="244" width="200" height="4" fill="#1F5560"/>
    <text x="740" y="280" class="mono" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#1F5560">O4</text>
    <text x="740" y="308" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Retrait à la</text>
    <text x="740" y="330" class="display" font-size="17" font-weight="600" fill="#1A1A1A">demande</text>
    <text x="740" y="362" class="body" font-size="11.5" fill="#5A5A5A">Retirer une ligne, ou</text>
    <text x="740" y="380" class="body" font-size="11.5" fill="#5A5A5A">purger le profil entier.</text>
    <text x="740" y="398" class="body" font-size="11.5" fill="#5A5A5A"></text>
    <text x="740" y="416" class="body" font-size="11.5" fill="#1A1A1A">Le retrait d'un item</text>
    <text x="740" y="434" class="body" font-size="11.5" fill="#1A1A1A">observé doit le neutraliser</text>
    <text x="740" y="452" class="body" font-size="11.5" fill="#1A1A1A">durablement.</text>
    <text x="740" y="470" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Une marque, et non un vide.</text>
    <rect x="740" y="486" width="156" height="22" rx="3" fill="#1F5560"/>
    <text x="818" y="501" class="mono" font-size="10" font-weight="600" fill="#FAF8F3" text-anchor="middle">ACTION UTILISATEUR</text>
  </g>

  <g class="interactive" data-card="oubli-o5" tabindex="0" role="button" aria-label="O5, ce qui ne s'oublie jamais tout seul — cliquez pour les détails">
    <rect x="936" y="244" width="200" height="272" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.75"/>
    <rect x="936" y="244" width="200" height="4" fill="#B7332C"/>
    <text x="958" y="280" class="mono" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#B7332C">O5</text>
    <text x="958" y="308" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Ce qui ne</text>
    <text x="958" y="330" class="display" font-size="17" font-weight="600" fill="#1A1A1A">s'oublie pas seul</text>
    <text x="958" y="362" class="body" font-size="11.5" fill="#5A5A5A">Les contraintes de niveau 0</text>
    <text x="958" y="380" class="body" font-size="11.5" fill="#5A5A5A">ne se périment pas et ne</text>
    <text x="958" y="398" class="body" font-size="11.5" fill="#5A5A5A">décroissent pas.</text>
    <text x="958" y="416" class="body" font-size="11.5" fill="#5A5A5A"></text>
    <text x="958" y="434" class="body" font-size="11.5" fill="#1A1A1A">Retrait sur action explicite</text>
    <text x="958" y="452" class="body" font-size="11.5" fill="#1A1A1A">de l'utilisateur, avec</text>
    <text x="958" y="470" class="body" font-size="11.5" fill="#1A1A1A">confirmation.</text>
    <rect x="958" y="486" width="156" height="22" rx="3" fill="#B7332C"/>
    <text x="1036" y="501" class="mono" font-size="10" font-weight="600" fill="#FAF8F3" text-anchor="middle">JAMAIS AUTOMATIQUE</text>
  </g>

  <text x="64" y="562" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUI ARRIVE QUAND ON RETIRE O2</text>

  <g class="interactive" data-card="cliquet" tabindex="0" role="button" aria-label="Le cliquet d'exclusion — cliquez pour les détails">
    <rect x="64" y="578" width="1072" height="204" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>

    <text x="94" y="606" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">CHAMP PROPOSABLE</text>
    <line x1="94" y1="614" x2="94" y2="748" stroke="#B8B5AE" stroke-width="1.2"/>
    <line x1="94" y1="748" x2="560" y2="748" stroke="#B8B5AE" stroke-width="1.2"/>
    <text x="94" y="766" class="mono" font-size="10" fill="#B8B5AE">0</text>
    <text x="211" y="766" class="mono" font-size="10" fill="#B8B5AE">3 mois</text>
    <text x="328" y="766" class="mono" font-size="10" fill="#B8B5AE">6 mois</text>
    <text x="445" y="766" class="mono" font-size="10" fill="#B8B5AE">12 mois</text>

    <path d="M 94 620 C 200 636, 320 700, 560 738" fill="none" stroke="#B7332C" stroke-width="2.2"/>
    <path d="M 94 620 C 180 646, 240 664, 560 668" fill="none" stroke="#1F5560" stroke-width="2.2"/>

    <circle cx="560" cy="738" r="4" fill="#B7332C"/>
    <circle cx="560" cy="668" r="4" fill="#1F5560"/>

    <rect x="600" y="596" width="14" height="4" fill="#B7332C"/>
    <text x="624" y="604" class="body" font-size="12.5" font-weight="600" fill="#B7332C">Sans décroissance</text>
    <text x="624" y="626" class="body" font-size="12" fill="#1A1A1A">Un refus, un retrait, un remplacement produisent un signal négatif net.</text>
    <text x="624" y="644" class="body" font-size="12" fill="#1A1A1A">Une acceptation ne dit presque rien : accepter un panier entier ne</text>
    <text x="624" y="662" class="body" font-size="12" fill="#1A1A1A">renseigne sur aucune de ses lignes. Le profil accumule donc des</text>
    <text x="624" y="680" class="body" font-size="12" fill="#1A1A1A">exclusions bien plus vite que des inclusions.</text>

    <rect x="600" y="700" width="14" height="4" fill="#1F5560"/>
    <text x="624" y="708" class="body" font-size="12.5" font-weight="600" fill="#1F5560">Avec décroissance</text>
    <text x="624" y="730" class="body" font-size="12" fill="#1A1A1A">Une préférence non réactivée perd son poids : le produit écarté une fois</text>
    <text x="624" y="748" class="body" font-size="12" fill="#1A1A1A">est reproposé au lieu d'être exclu indéfiniment. Le champ se referme,</text>
    <text x="624" y="766" class="body" font-size="12" fill="#1A1A1A">puis se stabilise.</text>
  </g>

  <line x1="64" y1="806" x2="1136" y2="806" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="830" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Courbes illustratives : elles figurent la forme du mécanisme, non des valeurs observées. Typologie : cadre analytique de l'auteur, d'après Barua, Kay, Kummerfeld et Paris (2011).</text>
</svg>
