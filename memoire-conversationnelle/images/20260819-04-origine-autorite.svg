<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" role="img" aria-label="Matrice origine d'une information contre effet autorisé : déclarée, inférée, observée, avec la zone interdite où une observation deviendrait un filtre bloquant">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B7332C" stroke-width="2" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1200" height="950" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'origine fait l'autorité</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce qu'une information a le droit de faire dépend du chemin par lequel elle est arrivée</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="200" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">ORIGINE</text>
  <text x="440" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">AUCUN EFFET</text>
  <text x="440" y="208" class="mono" font-size="11" letter-spacing="0.09em" fill="#B8B5AE">AVANT CONFIRMATION</text>
  <text x="700" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">PONDÈRE</text>
  <text x="700" y="208" class="mono" font-size="11" letter-spacing="0.09em" fill="#B8B5AE">LE CLASSEMENT</text>
  <text x="950" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">FILTRE</text>
  <text x="950" y="208" class="mono" font-size="11" letter-spacing="0.09em" fill="#B8B5AE">ET EXCLUT</text>

  <g class="interactive" data-card="origine-declaree" tabindex="0" role="button" aria-label="Origine déclarée — cliquez pour les détails">
    <rect x="64" y="224" width="1072" height="148" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="224" width="6" height="148" fill="#1F5560"/>
    <text x="94" y="256" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Déclarée</text>
    <text x="94" y="284" class="body" font-size="12.5" fill="#5A5A5A">Formulaire, ou phrase explicite</text>
    <text x="94" y="302" class="body" font-size="12.5" fill="#5A5A5A">en conversation.</text>
    <rect x="94" y="320" width="150" height="24" rx="3" fill="#1F5560"/>
    <text x="169" y="337" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">AUTORITÉ MAXIMALE</text>

    <text x="440" y="272" class="body" font-size="26" fill="#B8B5AE">—</text>
    <text x="440" y="304" class="body" font-size="12" fill="#5A5A5A">Sans objet : la déclaration</text>
    <text x="440" y="322" class="body" font-size="12" fill="#5A5A5A">vaut confirmation.</text>

    <text x="700" y="278" class="body" font-size="26" fill="#1F5560">✓</text>
    <text x="700" y="304" class="body" font-size="12" fill="#5A5A5A">Les goûts déclarés pèsent</text>
    <text x="700" y="322" class="body" font-size="12" fill="#5A5A5A">le classement.</text>

    <text x="950" y="278" class="body" font-size="26" fill="#1F5560">✓</text>
    <text x="950" y="304" class="body" font-size="12" fill="#5A5A5A">Seule origine autorisée à</text>
    <text x="950" y="322" class="body" font-size="12" fill="#5A5A5A">porter un niveau 0.</text>
  </g>

  <g class="interactive" data-card="origine-inferee" tabindex="0" role="button" aria-label="Origine inférée — cliquez pour les détails">
    <rect x="64" y="388" width="1072" height="148" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="388" width="6" height="148" fill="#B58A2C"/>
    <text x="94" y="420" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Inférée</text>
    <text x="94" y="448" class="body" font-size="12.5" fill="#5A5A5A">Comprise d'une phrase ambiguë</text>
    <text x="94" y="466" class="body" font-size="12.5" fill="#5A5A5A">en conversation.</text>
    <rect x="94" y="484" width="150" height="24" rx="3" fill="#B58A2C"/>
    <text x="169" y="501" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">À CONFIRMER</text>

    <text x="440" y="442" class="body" font-size="26" fill="#B58A2C">✓</text>
    <text x="440" y="468" class="body" font-size="12" fill="#5A5A5A">État par défaut. L'item existe,</text>
    <text x="440" y="486" class="body" font-size="12" fill="#5A5A5A">il n'agit pas.</text>

    <text x="700" y="442" class="body" font-size="26" fill="#B7332C">✗</text>
    <text x="700" y="468" class="body" font-size="12" fill="#5A5A5A">Une inférence non confirmée</text>
    <text x="700" y="486" class="body" font-size="12" fill="#5A5A5A">ne déplace aucun rang.</text>

    <text x="950" y="442" class="body" font-size="26" fill="#B7332C">✗</text>
    <text x="950" y="468" class="body" font-size="12" fill="#5A5A5A">« Je crois qu'il ne supporte</text>
    <text x="950" y="486" class="body" font-size="12" fill="#5A5A5A">pas le lactose » ouvre une</text>
    <text x="950" y="504" class="body" font-size="12" fill="#5A5A5A">demande de confirmation.</text>
  </g>

  <g class="interactive" data-card="origine-observee" tabindex="0" role="button" aria-label="Origine observée — cliquez pour les détails">
    <rect x="64" y="552" width="1072" height="148" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="552" width="6" height="148" fill="#B8B5AE"/>
    <text x="94" y="584" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Observée</text>
    <text x="94" y="612" class="body" font-size="12.5" fill="#5A5A5A">Dérivée de l'historique d'achat</text>
    <text x="94" y="630" class="body" font-size="12.5" fill="#5A5A5A">et des arbitrages en session.</text>
    <rect x="94" y="648" width="150" height="24" rx="3" fill="#B8B5AE"/>
    <text x="169" y="665" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">STATISTIQUE</text>

    <text x="440" y="606" class="body" font-size="26" fill="#B8B5AE">—</text>
    <text x="440" y="632" class="body" font-size="12" fill="#5A5A5A">Agit dès qu'un signal</text>
    <text x="440" y="650" class="body" font-size="12" fill="#5A5A5A">est disponible.</text>

    <text x="700" y="606" class="body" font-size="26" fill="#1F5560">✓</text>
    <text x="700" y="632" class="body" font-size="12" fill="#5A5A5A">Un historique premier prix</text>
    <text x="700" y="650" class="body" font-size="12" fill="#5A5A5A">pèse le prix.</text>

    <rect x="920" y="566" width="204" height="128" rx="3" fill="url(#hatch)" stroke="#B7332C" stroke-width="1.5"/>
    <text x="950" y="606" class="body" font-size="26" font-weight="600" fill="#B7332C">✗</text>
    <text x="950" y="632" class="body" font-size="12" font-weight="600" fill="#B7332C">ZONE INTERDITE</text>
    <text x="950" y="652" class="body" font-size="12" fill="#1A1A1A">Une contrainte de niveau 0</text>
    <text x="950" y="670" class="body" font-size="12" fill="#1A1A1A">issue d'une observation</text>
    <text x="950" y="688" class="body" font-size="12" fill="#1A1A1A">n'existe pas.</text>
  </g>

  <g class="interactive" data-card="regle-cjue" tabindex="0" role="button" aria-label="La règle juridique — cliquez pour les détails">
    <rect x="64" y="722" width="1072" height="158" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.75" stroke-dasharray="7 5"/>
    <text x="94" y="752" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">POURQUOI CE N'EST PAS QU'UNE PRÉCAUTION D'ERGONOMIE</text>
    <text x="94" y="782" class="body" font-size="13.5" fill="#1A1A1A">CJUE, C-184/20, 1ᵉʳ août 2022 : une donnée susceptible de révéler une information protégée « au moyen d'une opération intellectuelle</text>
    <text x="94" y="802" class="body" font-size="13.5" fill="#1A1A1A">de rapprochement ou de déduction » relève de l'article 9 du RGPD. Dériver « végétarien » d'un historique d'achat ne contourne pas</text>
    <text x="94" y="822" class="body" font-size="13.5" fill="#1A1A1A">la collecte d'une donnée sensible : cela en produit une, sans base légale.</text>
    <text x="94" y="846" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Allergie et régime médical → santé · interdit religieux → convictions religieuses · végétarisme et véganisme → convictions philosophiques.</text>
    <text x="94" y="866" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">La liste des contraintes de niveau 0 coïncide avec le périmètre de l'article 9.</text>
  </g>

  <line x1="64" y1="906" x2="1136" y2="906" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="930" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Matrice : cadre analytique de l'auteur. Fondement juridique : arrêt CJUE C-184/20 et article 9 du règlement (UE) 2016/679.</text>
</svg>
