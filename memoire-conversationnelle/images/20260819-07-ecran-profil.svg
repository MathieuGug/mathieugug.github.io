<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 904" role="img" aria-label="Anatomie d'un écran de profil scrutable : six colonnes par item de mémoire, dont quatre que presque aucun produit n'affiche">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="904" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'écran qui répond à « comment savez-vous ça ? »</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Six colonnes par item, dont quatre que presque aucun produit grand public n'expose</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <rect x="372" y="212" width="628" height="368" fill="#F2EFE7" opacity="0.75"/>
  <text x="686" y="198" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C" text-anchor="middle">CE QUE PRESQUE AUCUN PRODUIT N'AFFICHE</text>
  <path d="M 372 212 L 372 204 L 1000 204 L 1000 212" fill="none" stroke="#B7332C" stroke-width="1.2"/>

  <text x="80" y="236" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">ÉNONCÉ, EN FRANÇAIS</text>
  <text x="384" y="236" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">ORIGINE</text>
  <text x="516" y="236" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">CONFIRMÉ LE</text>
  <text x="668" y="236" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">PORTÉE</text>
  <text x="800" y="236" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">EFFET SUR LA DÉCISION</text>
  <text x="1012" y="236" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">ACTION</text>
  <line x1="64" y1="248" x2="1136" y2="248" stroke="#B8B5AE" stroke-width="1"/>

  <g class="interactive" data-card="item-allergie" tabindex="0" role="button" aria-label="Item de niveau 0 dans l'écran de profil — cliquez pour les détails">
    <rect x="64" y="248" width="1072" height="82" fill="transparent"/>
    <rect x="64" y="256" width="4" height="66" fill="#B7332C"/>
    <text x="80" y="284" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Votre fils est allergique à</text>
    <text x="80" y="304" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">l'arachide.</text>
    <text x="384" y="284" class="body" font-size="12.5" fill="#1A1A1A">Déclarée</text>
    <text x="384" y="302" class="body" font-size="11" font-style="italic" fill="#5A5A5A">au formulaire</text>
    <text x="516" y="284" class="body" font-size="12.5" fill="#1A1A1A">4 mars 2026</text>
    <text x="668" y="284" class="body" font-size="12.5" fill="#1A1A1A">Permanente</text>
    <text x="800" y="284" class="body" font-size="12.5" fill="#B7332C" font-weight="600">Écarte tout produit concerné</text>
    <text x="800" y="302" class="body" font-size="11.5" fill="#5A5A5A">recette, ingrédient, substitution</text>
    <text x="1012" y="284" class="body" font-size="12" fill="#1F5560">Retirer</text>
    <text x="1012" y="302" class="body" font-size="11" font-style="italic" fill="#5A5A5A">confirmation</text>
    <line x1="64" y1="330" x2="1136" y2="330" stroke="#E5E1D8" stroke-width="1"/>
  </g>

  <g class="interactive" data-card="item-confirme" tabindex="0" role="button" aria-label="Item confirmé récurrent — cliquez pour les détails">
    <rect x="64" y="330" width="1072" height="82" fill="transparent"/>
    <rect x="64" y="338" width="4" height="66" fill="#1F5560"/>
    <text x="80" y="366" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Vous évitez le poisson au</text>
    <text x="80" y="386" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">dîner.</text>
    <text x="384" y="366" class="body" font-size="12.5" fill="#1A1A1A">Confirmée</text>
    <text x="384" y="384" class="body" font-size="11" font-style="italic" fill="#5A5A5A">vous avez dit oui</text>
    <text x="516" y="366" class="body" font-size="12.5" fill="#1A1A1A">2 août 2026</text>
    <text x="668" y="366" class="body" font-size="12.5" fill="#1A1A1A">Récurrente</text>
    <text x="800" y="366" class="body" font-size="12.5" fill="#1A1A1A">Descend dans le classement</text>
    <text x="800" y="384" class="body" font-size="11.5" fill="#5A5A5A">n'exclut aucun produit</text>
    <text x="1012" y="366" class="body" font-size="12" fill="#1F5560">Retirer</text>
    <line x1="64" y1="412" x2="1136" y2="412" stroke="#E5E1D8" stroke-width="1"/>
  </g>

  <g class="interactive" data-card="item-observe" tabindex="0" role="button" aria-label="Item observé — cliquez pour les détails">
    <rect x="64" y="412" width="1072" height="82" fill="transparent"/>
    <rect x="64" y="420" width="4" height="66" fill="#B8B5AE"/>
    <text x="80" y="448" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Vous privilégiez les produits</text>
    <text x="80" y="468" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">régionaux, en frais.</text>
    <text x="384" y="448" class="body" font-size="12.5" fill="#1A1A1A">Observée</text>
    <text x="384" y="466" class="body" font-size="11" font-style="italic" fill="#5A5A5A">14 achats sur 20</text>
    <text x="516" y="448" class="body" font-size="12.5" fill="#1A1A1A">18 juin 2026</text>
    <text x="516" y="466" class="body" font-size="11" font-style="italic" fill="#B58A2C">décroît dans 4 mois</text>
    <text x="668" y="448" class="body" font-size="12.5" fill="#1A1A1A">Récurrente</text>
    <text x="800" y="448" class="body" font-size="12.5" fill="#1A1A1A">Pondère le classement (0,6)</text>
    <text x="800" y="466" class="body" font-size="11.5" fill="#5A5A5A">en frais seulement</text>
    <text x="1012" y="448" class="body" font-size="12" fill="#1F5560">Retirer</text>
    <text x="1012" y="466" class="body" font-size="11" font-style="italic" fill="#5A5A5A">définitivement</text>
    <line x1="64" y1="494" x2="1136" y2="494" stroke="#E5E1D8" stroke-width="1"/>
  </g>

  <g class="interactive" data-card="item-session" tabindex="0" role="button" aria-label="Item de session — cliquez pour les détails">
    <rect x="64" y="494" width="1072" height="82" fill="transparent"/>
    <rect x="64" y="502" width="4" height="66" fill="#B58A2C"/>
    <text x="80" y="530" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Budget de 30 € et quatre</text>
    <text x="80" y="550" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">convives, ce soir.</text>
    <text x="384" y="530" class="body" font-size="12.5" fill="#1A1A1A">Déclarée</text>
    <text x="384" y="548" class="body" font-size="11" font-style="italic" fill="#5A5A5A">en conversation</text>
    <text x="516" y="530" class="body" font-size="12.5" fill="#1A1A1A">aujourd'hui</text>
    <text x="668" y="530" class="body" font-size="12.5" fill="#1A1A1A">Session</text>
    <text x="800" y="530" class="body" font-size="12.5" fill="#1A1A1A">Cadre négociable, annoncé</text>
    <text x="800" y="548" class="body" font-size="11.5" fill="#5A5A5A">si le panier le dépasse</text>
    <text x="1012" y="530" class="body" font-size="12" fill="#5A5A5A">Expire seul</text>
    <line x1="64" y1="576" x2="1136" y2="576" stroke="#B8B5AE" stroke-width="1"/>
  </g>

  <text x="64" y="618" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LES SEPT LIGNES DIRECTRICES D'AMERSHI QUI PORTENT SUR LA MÉMOIRE (CHI 2019)</text>

  <rect x="64" y="634" width="142" height="58" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="135" y="658" class="mono" font-size="12" font-weight="600" fill="#1F5560" text-anchor="middle">G11</text>
  <text x="135" y="678" class="body" font-size="11" fill="#1A1A1A" text-anchor="middle">Motif affiché</text>

  <rect x="219" y="634" width="142" height="58" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="290" y="658" class="mono" font-size="12" font-weight="600" fill="#1F5560" text-anchor="middle">G12</text>
  <text x="290" y="678" class="body" font-size="11" fill="#1A1A1A" text-anchor="middle">Rappel de session</text>

  <rect x="374" y="634" width="142" height="58" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="445" y="658" class="mono" font-size="12" font-weight="600" fill="#1F5560" text-anchor="middle">G13</text>
  <text x="445" y="678" class="body" font-size="11" fill="#1A1A1A" text-anchor="middle">Poids observés</text>

  <rect x="529" y="634" width="142" height="58" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="600" y="658" class="mono" font-size="12" font-weight="600" fill="#1F5560" text-anchor="middle">G15</text>
  <text x="600" y="678" class="body" font-size="11" fill="#1A1A1A" text-anchor="middle">Retour granulaire</text>

  <rect x="684" y="634" width="142" height="58" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="755" y="658" class="mono" font-size="12" font-weight="600" fill="#1F5560" text-anchor="middle">G16</text>
  <text x="755" y="678" class="body" font-size="11" fill="#1A1A1A" text-anchor="middle">Conséquence dite</text>

  <rect x="839" y="634" width="142" height="58" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="910" y="658" class="mono" font-size="12" font-weight="600" fill="#1F5560" text-anchor="middle">G17</text>
  <text x="910" y="678" class="body" font-size="11" fill="#1A1A1A" text-anchor="middle">Contrôles globaux</text>

  <rect x="994" y="634" width="142" height="58" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="1065" y="658" class="mono" font-size="12" font-weight="600" fill="#1F5560" text-anchor="middle">G18</text>
  <text x="1065" y="678" class="body" font-size="11" fill="#1A1A1A" text-anchor="middle">Changements notifiés</text>

  <g class="interactive" data-card="couche-sans-ecran" tabindex="0" role="button" aria-label="La couche sans écran — cliquez pour les détails">
    <rect x="64" y="716" width="1072" height="120" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.75" stroke-dasharray="7 5"/>
    <text x="94" y="746" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LA COUCHE QUI N'A PAS D'ÉCRAN</text>
    <text x="94" y="774" class="body" font-size="13.5" fill="#1A1A1A">ChatGPT distingue les mémoires enregistrées, qui forment une liste éditable item par item, et la référence à l'historique, décrite comme une</text>
    <text x="94" y="794" class="body" font-size="13.5" fill="#1A1A1A">synthèse continûment mise à jour, plus large que ce qu'une liste pourrait montrer.</text>
    <text x="94" y="816" class="body" font-size="13.5" font-weight="600" fill="#B7332C">La scrutabilité se perd là où la mémoire devient utile sans être demandée.</text>
  </g>

  <line x1="64" y1="862" x2="1136" y2="862" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="886" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Maquette d'écran : proposition de l'auteur. Lignes directrices : Amershi et al., CHI 2019. Description des deux couches de mémoire : documentation OpenAI, état à la mi-2026.</text>
</svg>
