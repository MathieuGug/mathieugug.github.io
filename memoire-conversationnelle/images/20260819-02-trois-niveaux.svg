<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 972" role="img" aria-label="Trois niveaux d'engagement d'une information en mémoire : contrainte bloquante, cadre de session, préférence pondérée, et la séquence de traitement avec son contrôle en sortie">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5A5A"/>
    </marker>
    <marker id="arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="972" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois niveaux d'engagement, une seule séquence</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La distinction ne porte ni sur la durée de vie ni sur la certitude, mais sur l'effet autorisé sur la décision</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LA SÉQUENCE DE TRAITEMENT</text>

  <rect x="64" y="204" width="150" height="58" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="139" y="230" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Catalogue</text>
  <text x="139" y="248" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">disponible</text>
  <line x1="218" y1="233" x2="246" y2="233" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="252" y="204" width="200" height="58" rx="3" fill="#B7332C"/>
  <text x="352" y="228" class="body" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">Filtre bloquant</text>
  <text x="352" y="247" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle" opacity="0.85">NIVEAU 0</text>
  <line x1="456" y1="233" x2="484" y2="233" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="490" y="204" width="200" height="58" rx="3" fill="#B58A2C"/>
  <text x="590" y="228" class="body" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">Cadre négociable</text>
  <text x="590" y="247" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle" opacity="0.85">NIVEAU 1</text>
  <line x1="694" y1="233" x2="722" y2="233" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="728" y="204" width="210" height="58" rx="3" fill="#1F5560"/>
  <text x="833" y="228" class="body" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">Classement pondéré</text>
  <text x="833" y="247" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle" opacity="0.85">NIVEAU 2</text>
  <line x1="942" y1="233" x2="970" y2="233" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="976" y="204" width="160" height="58" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="1056" y="230" class="body" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Panier</text>
  <text x="1056" y="248" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">produit retenu</text>

  <path d="M 1056 266 L 1056 306 L 352 306 L 352 272" fill="none" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arC)"/>
  <text x="704" y="330" class="body" font-size="12" font-style="italic" fill="#B7332C" text-anchor="middle">Contrôle en sortie : tout produit substitué ou promu repasse le filtre de niveau 0</text>

  <text x="64" y="368" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LES TROIS NIVEAUX</text>

  <g class="interactive" data-card="niveau-0" tabindex="0" role="button" aria-label="Niveau 0, contrainte bloquante — cliquez pour les détails">
    <rect x="64" y="384" width="1072" height="164" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="384" width="6" height="164" fill="#B7332C"/>
    <text x="94" y="414" class="mono" font-size="12" letter-spacing="0.1em" fill="#B7332C">NIVEAU 0</text>
    <text x="94" y="446" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Contrainte bloquante</text>
    <text x="94" y="478" class="body" font-size="12.5" fill="#5A5A5A">Ne se négocie pas, ne se pondère</text>
    <text x="94" y="496" class="body" font-size="12.5" fill="#5A5A5A">pas, et ne se perd pas.</text>
    <text x="94" y="522" class="body" font-size="12" font-style="italic" fill="#B7332C">Liste courte par construction.</text>

    <text x="460" y="414" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">EXEMPLES</text>
    <text x="460" y="444" class="body" font-size="13" fill="#1A1A1A">Allergie, intolérance</text>
    <text x="460" y="466" class="body" font-size="13" fill="#1A1A1A">Régime médical déclaré</text>
    <text x="460" y="488" class="body" font-size="13" fill="#1A1A1A">Interdit religieux ou éthique</text>
    <text x="460" y="510" class="body" font-size="13" fill="#1A1A1A">Végétarisme, véganisme</text>

    <text x="800" y="414" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">EFFET AUTORISÉ</text>
    <rect x="800" y="428" width="216" height="26" rx="3" fill="#B7332C"/>
    <text x="908" y="446" class="mono" font-size="11.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">FILTRE, JAMAIS COMPENSÉ</text>
    <text x="800" y="480" class="body" font-size="12.5" fill="#1A1A1A">Filtre en amont de tout classement.</text>
    <text x="800" y="500" class="body" font-size="12.5" fill="#1A1A1A">Jamais un critère de tri. Aucune</text>
    <text x="800" y="520" class="body" font-size="12.5" fill="#1A1A1A">promotion ne le contourne.</text>
  </g>

  <g class="interactive" data-card="niveau-1" tabindex="0" role="button" aria-label="Niveau 1, cadre de session — cliquez pour les détails">
    <rect x="64" y="566" width="1072" height="164" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="566" width="6" height="164" fill="#B58A2C"/>
    <text x="94" y="596" class="mono" font-size="12" letter-spacing="0.1em" fill="#B58A2C">NIVEAU 1</text>
    <text x="94" y="628" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Cadre de session</text>
    <text x="94" y="660" class="body" font-size="12.5" fill="#5A5A5A">Se tient à l'échelle du panier</text>
    <text x="94" y="678" class="body" font-size="12.5" fill="#5A5A5A">entier, non de la ligne.</text>
    <text x="94" y="704" class="body" font-size="12" font-style="italic" fill="#B58A2C">Expire avec la session.</text>

    <text x="460" y="596" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">EXEMPLES</text>
    <text x="460" y="626" class="body" font-size="13" fill="#1A1A1A">Budget, nombre de convives</text>
    <text x="460" y="648" class="body" font-size="13" fill="#1A1A1A">Temps disponible, équipement</text>
    <text x="460" y="670" class="body" font-size="13" fill="#1A1A1A">Magasin et disponibilité</text>
    <text x="460" y="692" class="body" font-size="13" fill="#1A1A1A">« Pas de porc ce soir »</text>

    <text x="800" y="596" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">EFFET AUTORISÉ</text>
    <rect x="800" y="610" width="216" height="26" rx="3" fill="#B58A2C"/>
    <text x="908" y="628" class="mono" font-size="11.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">FILTRE NÉGOCIABLE</text>
    <text x="800" y="662" class="body" font-size="12.5" fill="#1A1A1A">Tout dépassement d'enveloppe est</text>
    <text x="800" y="682" class="body" font-size="12.5" fill="#1A1A1A">annoncé avant validation et proposé</text>
    <text x="800" y="702" class="body" font-size="12.5" fill="#1A1A1A">au choix. Jamais remplacé d'office.</text>
  </g>

  <g class="interactive" data-card="niveau-2" tabindex="0" role="button" aria-label="Niveau 2, préférence pondérée — cliquez pour les détails">
    <rect x="64" y="748" width="1072" height="164" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="748" width="6" height="164" fill="#1F5560"/>
    <text x="94" y="778" class="mono" font-size="12" letter-spacing="0.1em" fill="#1F5560">NIVEAU 2</text>
    <text x="94" y="810" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Préférence pondérée</text>
    <text x="94" y="842" class="body" font-size="12.5" fill="#5A5A5A">N'exclut rien. Ordonne, et rend</text>
    <text x="94" y="860" class="body" font-size="12.5" fill="#5A5A5A">le motif du classement visible.</text>
    <text x="94" y="886" class="body" font-size="12" font-style="italic" fill="#1F5560">Trois actives au maximum.</text>

    <text x="460" y="778" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">EXEMPLES</text>
    <text x="460" y="808" class="body" font-size="13" fill="#1A1A1A">Local, prix bas, saison</text>
    <text x="460" y="830" class="body" font-size="13" fill="#1A1A1A">Peu transformé, bio</text>
    <text x="460" y="852" class="body" font-size="13" fill="#1A1A1A">Marque, goûts déclarés</text>
    <text x="460" y="874" class="body" font-size="13" fill="#1A1A1A">Habitudes observées</text>

    <text x="800" y="778" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">EFFET AUTORISÉ</text>
    <rect x="800" y="792" width="216" height="26" rx="3" fill="#1F5560"/>
    <text x="908" y="810" class="mono" font-size="11.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">ORDONNE, NE RETIRE PAS</text>
    <text x="800" y="844" class="body" font-size="12.5" fill="#1A1A1A">Ne peut jamais promouvoir un produit</text>
    <text x="800" y="864" class="body" font-size="12.5" fill="#1A1A1A">qui viole le niveau 0. Aucune promotion</text>
    <text x="800" y="884" class="body" font-size="12.5" fill="#1A1A1A">ne l'écarte sans le dire.</text>
  </g>

  <line x1="64" y1="938" x2="1136" y2="938" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="962" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Cadre analytique de l'auteur, appliqué à un compagnon conversationnel de courses alimentaires.</text>
</svg>
