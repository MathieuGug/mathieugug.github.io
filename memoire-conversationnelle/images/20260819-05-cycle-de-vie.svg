<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Cycle de vie d'un item de mémoire : toute information captée naît en portée session, et deux mécanismes seulement la promeuvent en portée récurrente, aucun ne mène automatiquement au permanent">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5A5A"/>
    </marker>
    <marker id="a5t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F5560"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Où naît un souvenir, et par quelle porte il devient durable</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Deux mécanismes de promotion, et aucune voie automatique vers le permanent</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="772" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">PORTÉE PERMANENTE</text>
  <g class="interactive" data-card="portee-permanente" tabindex="0" role="button" aria-label="Portée permanente — cliquez pour les détails">
    <rect x="772" y="206" width="364" height="96" rx="3" fill="#B7332C"/>
    <text x="796" y="240" class="display" font-size="20" font-weight="600" fill="#FAF8F3">Permanente</text>
    <text x="796" y="266" class="body" font-size="12.5" fill="#FAF8F3" opacity="0.92">Contraintes de niveau 0 et composition du foyer.</text>
    <text x="796" y="286" class="body" font-size="12.5" fill="#FAF8F3" opacity="0.92">Ne se périme pas, ne décroît pas.</text>
  </g>

  <path d="M 159 372 L 159 252 L 764 252" fill="none" stroke="#1F5560" stroke-width="1.6" marker-end="url(#a5t)"/>
  <text x="200" y="242" class="body" font-size="12" font-style="italic" fill="#1F5560">Déclaration explicite et consentement au sens de l'article 9(2)(a) : seule voie d'entrée</text>

  <line x1="930" y1="352" x2="930" y2="316" stroke="#B7332C" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="930" y="340" class="body" font-size="17" font-weight="600" fill="#B7332C" text-anchor="middle">✗</text>
  <text x="1136" y="340" class="body" font-size="11.5" font-style="italic" fill="#B7332C" text-anchor="end">Jamais de promotion automatique</text>

  <text x="64" y="338" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CAPTURE</text>
  <text x="300" y="338" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">PORTÉE SESSION</text>
  <text x="540" y="338" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LES DEUX PORTES</text>
  <text x="772" y="338" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">PORTÉE RÉCURRENTE</text>

  <rect x="64" y="372" width="190" height="90" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="86" y="402" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Phrase captée</text>
  <text x="86" y="424" class="body" font-size="12" fill="#5A5A5A">« Pas de porc ce soir »</text>
  <text x="86" y="444" class="body" font-size="12" fill="#5A5A5A">« Les enfants n'aiment</text>
  <text x="86" y="458" class="body" font-size="12" fill="#5A5A5A">pas le poisson »</text>
  <line x1="258" y1="417" x2="294" y2="417" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#a5)"/>

  <g class="interactive" data-card="portee-session" tabindex="0" role="button" aria-label="Portée session — cliquez pour les détails">
    <rect x="300" y="352" width="200" height="130" rx="3" fill="#B58A2C"/>
    <text x="322" y="386" class="display" font-size="20" font-weight="600" fill="#FAF8F3">Session</text>
    <text x="322" y="412" class="body" font-size="12" fill="#FAF8F3" opacity="0.92">État de naissance de</text>
    <text x="322" y="430" class="body" font-size="12" fill="#FAF8F3" opacity="0.92">toute information</text>
    <text x="322" y="448" class="body" font-size="12" fill="#FAF8F3" opacity="0.92">captée en conversation.</text>
    <text x="322" y="470" class="mono" font-size="11" fill="#FAF8F3" opacity="0.85">EXPIRE AVEC LA SESSION</text>
  </g>

  <line x1="504" y1="382" x2="534" y2="382" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#a5)"/>
  <line x1="504" y1="470" x2="534" y2="470" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#a5)"/>

  <g class="interactive" data-card="porte-p1" tabindex="0" role="button" aria-label="P1, promotion sur confirmation — cliquez pour les détails">
    <rect x="540" y="344" width="190" height="76" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.75"/>
    <text x="558" y="368" class="mono" font-size="11.5" font-weight="600" fill="#1F5560">P1 · CONFIRMATION</text>
    <text x="558" y="390" class="body" font-size="11.5" fill="#1A1A1A">« Je note que vous évitez</text>
    <text x="558" y="408" class="body" font-size="11.5" fill="#1A1A1A">le poisson ? » — réponse oui</text>
  </g>

  <g class="interactive" data-card="porte-p2" tabindex="0" role="button" aria-label="P2, promotion sur répétition — cliquez pour les détails">
    <rect x="540" y="432" width="190" height="76" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.75"/>
    <text x="558" y="456" class="mono" font-size="11.5" font-weight="600" fill="#1F5560">P2 · RÉPÉTITION</text>
    <text x="558" y="478" class="body" font-size="11.5" fill="#1A1A1A">3 occurrences sur 3 sessions</text>
    <text x="558" y="496" class="body" font-size="11.5" fill="#1A1A1A">distinctes, jamais une seule</text>
  </g>

  <line x1="734" y1="382" x2="766" y2="382" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#a5)"/>
  <line x1="734" y1="470" x2="766" y2="470" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#a5)"/>

  <g class="interactive" data-card="portee-recurrente" tabindex="0" role="button" aria-label="Portée récurrente — cliquez pour les détails">
    <rect x="772" y="352" width="364" height="130" rx="3" fill="#1F5560"/>
    <text x="796" y="386" class="display" font-size="20" font-weight="600" fill="#FAF8F3">Récurrente</text>
    <text x="796" y="412" class="body" font-size="12.5" fill="#FAF8F3" opacity="0.92">Ce qui revient d'une session à l'autre, et qui a été</text>
    <text x="796" y="432" class="body" font-size="12.5" fill="#FAF8F3" opacity="0.92">soit confirmé, soit répété trois fois.</text>
    <text x="796" y="458" class="mono" font-size="11" fill="#FAF8F3" opacity="0.85">SOUMISE À DÉCROISSANCE DE CONFIANCE</text>
  </g>

  <text x="64" y="530" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUE PORTE CHAQUE ITEM, QUELLE QUE SOIT SA PORTÉE</text>

  <rect x="64" y="546" width="250" height="76" rx="3" fill="#F2EFE7" opacity="0.6" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="86" y="574" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Origine</text>
  <text x="86" y="596" class="body" font-size="12" fill="#5A5A5A">Déclarée, inférée ou observée.</text>
  <text x="86" y="612" class="body" font-size="12" fill="#5A5A5A">Elle fixe l'effet autorisé.</text>

  <rect x="338" y="546" width="250" height="76" rx="3" fill="#F2EFE7" opacity="0.6" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="360" y="574" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Dernière confirmation</text>
  <text x="360" y="596" class="body" font-size="12" fill="#5A5A5A">La date qui déclenche la</text>
  <text x="360" y="612" class="body" font-size="12" fill="#5A5A5A">décroissance de confiance.</text>

  <rect x="612" y="546" width="250" height="76" rx="3" fill="#F2EFE7" opacity="0.6" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="634" y="574" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Portée</text>
  <text x="634" y="596" class="body" font-size="12" fill="#5A5A5A">Session, récurrente ou</text>
  <text x="634" y="612" class="body" font-size="12" fill="#5A5A5A">permanente.</text>

  <rect x="886" y="546" width="250" height="76" rx="3" fill="#F2EFE7" opacity="0.6" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="908" y="574" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Niveau de confiance</text>
  <text x="908" y="596" class="body" font-size="12" fill="#5A5A5A">Décroît hors des contraintes</text>
  <text x="908" y="612" class="body" font-size="12" fill="#5A5A5A">de niveau 0.</text>

  <rect x="64" y="646" width="1072" height="66" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="94" y="674" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LA RÈGLE QUI PROTÈGE DU CONTRESENS LE PLUS FRÉQUENT</text>
  <text x="94" y="698" class="body" font-size="13.5" fill="#1A1A1A">Prendre une contrainte de circonstance pour un trait durable. « Pas de porc ce soir », dit un mardi, ne fait pas une exclusion permanente.</text>

  <line x1="64" y1="736" x2="1136" y2="736" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="760" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Cadre analytique de l'auteur. Attributs d'item d'après la tradition du modelage utilisateur scrutable (Kay, Personis).</text>
</svg>
