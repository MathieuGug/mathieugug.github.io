<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" role="img" aria-label="Quatre familles de bancs d'essai de la mémoire des agents, et la case vide : aucune ne teste le droit de retenir">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="990" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce que la recherche mesure, et la case qu'elle laisse vide</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre familles de bancs d'essai apparues depuis fin 2024, et la question qu'aucune ne pose</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="120" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">FAMILLE</text>
  <text x="410" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'ELLE MESURE</text>
  <text x="710" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">RÉSULTAT PUBLIÉ</text>
  <text x="920" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'ELLE NE VOIT PAS</text>

  <g class="interactive" data-card="famille-rappel" tabindex="0" role="button" aria-label="Rappel sur longue durée — cliquez pour les détails">
    <rect x="64" y="204" width="1072" height="124" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <circle cx="94" cy="240" r="13" fill="#1F5560"/>
    <text x="94" y="244" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <text x="120" y="238" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Rappel longue durée</text>
    <text x="120" y="264" class="mono" font-size="11.5" fill="#1F5560">LongMemEval · ICLR 2025</text>
    <text x="120" y="288" class="body" font-size="12" fill="#5A5A5A">500 questions insérées dans un</text>
    <text x="120" y="306" class="body" font-size="12" fill="#5A5A5A">historique extensible.</text>

    <text x="410" y="238" class="body" font-size="12.5" fill="#1A1A1A">Retrouver un fait dans un historique long.</text>
    <text x="410" y="262" class="body" font-size="12.5" fill="#1A1A1A">Cinq composantes : extraction, raisonnement</text>
    <text x="410" y="282" class="body" font-size="12.5" fill="#1A1A1A">multi-sessions, temporalité, mise à jour,</text>
    <text x="410" y="302" class="body" font-size="12.5" fill="#1A1A1A">abstention.</text>

    <text x="710" y="238" class="body" font-size="12.5" font-weight="600" fill="#B7332C">−30 % de justesse</text>
    <text x="710" y="258" class="body" font-size="12" fill="#5A5A5A">sur historique prolongé ;</text>
    <text x="710" y="276" class="body" font-size="12" fill="#5A5A5A">−30 à −60 % contre une</text>
    <text x="710" y="294" class="body" font-size="12" fill="#5A5A5A">récupération idéale.</text>

    <text x="920" y="238" class="body" font-size="12" font-style="italic" fill="#5A5A5A">L'item est supposé</text>
    <text x="920" y="256" class="body" font-size="12" font-style="italic" fill="#5A5A5A">légitime. Son origine</text>
    <text x="920" y="274" class="body" font-size="12" font-style="italic" fill="#5A5A5A">n'entre pas dans le</text>
    <text x="920" y="292" class="body" font-size="12" font-style="italic" fill="#5A5A5A">score.</text>
  </g>

  <g class="interactive" data-card="famille-preference" tabindex="0" role="button" aria-label="Suivi de préférence — cliquez pour les détails">
    <rect x="64" y="344" width="1072" height="124" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <circle cx="94" cy="380" r="13" fill="#1F5560"/>
    <text x="94" y="384" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
    <text x="120" y="378" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Suivi de préférence</text>
    <text x="120" y="404" class="mono" font-size="11.5" fill="#1F5560">PrefEval · ICLR 2025 (oral)</text>
    <text x="120" y="428" class="body" font-size="12" fill="#5A5A5A">3 000 paires sur 20 domaines,</text>
    <text x="120" y="446" class="body" font-size="12" fill="#5A5A5A">forme explicite et implicite.</text>

    <text x="410" y="378" class="body" font-size="12.5" fill="#1A1A1A">Appliquer spontanément une préférence</text>
    <text x="410" y="398" class="body" font-size="12.5" fill="#1A1A1A">énoncée plus tôt dans la conversation,</text>
    <text x="410" y="418" class="body" font-size="12.5" fill="#1A1A1A">jusqu'à 100 000 tokens d'historique.</text>

    <text x="710" y="378" class="body" font-size="12.5" font-weight="600" fill="#B7332C">&lt; 10 % de respect</text>
    <text x="710" y="398" class="body" font-size="12" fill="#5A5A5A">dès 10 tours (~3 000 tokens),</text>
    <text x="710" y="416" class="body" font-size="12" fill="#5A5A5A">sans dispositif d'aide, sur</text>
    <text x="710" y="434" class="body" font-size="12" fill="#5A5A5A">la plupart des 10 modèles.</text>

    <text x="920" y="378" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Toutes les préférences</text>
    <text x="920" y="396" class="body" font-size="12" font-style="italic" fill="#5A5A5A">au même rang. Une</text>
    <text x="920" y="414" class="body" font-size="12" font-style="italic" fill="#5A5A5A">allergie et un goût y</text>
    <text x="920" y="432" class="body" font-size="12" font-style="italic" fill="#5A5A5A">pèsent pareil.</text>
  </g>

  <g class="interactive" data-card="famille-integrite" tabindex="0" role="button" aria-label="Intégrité contextuelle — cliquez pour les détails">
    <rect x="64" y="484" width="1072" height="124" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <circle cx="94" cy="520" r="13" fill="#1F5560"/>
    <text x="94" y="524" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
    <text x="120" y="518" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Intégrité contextuelle</text>
    <text x="120" y="544" class="mono" font-size="11.5" fill="#1F5560">CIMemories · CI-Work · PiSAs</text>
    <text x="120" y="568" class="body" font-size="12" fill="#5A5A5A">10 profils, 147 attributs et</text>
    <text x="120" y="586" class="body" font-size="12" fill="#5A5A5A">45 contextes en moyenne.</text>

    <text x="410" y="518" class="body" font-size="12.5" fill="#1A1A1A">La circulation d'un attribut vers un</text>
    <text x="410" y="538" class="body" font-size="12.5" fill="#1A1A1A">destinataire dont les normes de contexte</text>
    <text x="410" y="558" class="body" font-size="12.5" fill="#1A1A1A">ne l'autorisent pas.</text>

    <text x="710" y="518" class="body" font-size="12.5" font-weight="600" fill="#B7332C">Violations cumulatives</text>
    <text x="710" y="538" class="body" font-size="12" fill="#5A5A5A">à mémoire persistante : le</text>
    <text x="710" y="556" class="body" font-size="12" fill="#5A5A5A">risque croît avec le nombre</text>
    <text x="710" y="574" class="body" font-size="12" fill="#5A5A5A">de contextes servis.</text>

    <text x="920" y="518" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Mesure la sortie de</text>
    <text x="920" y="536" class="body" font-size="12" font-style="italic" fill="#5A5A5A">la mémoire. L'entrée</text>
    <text x="920" y="554" class="body" font-size="12" font-style="italic" fill="#5A5A5A">reste hors périmètre.</text>
  </g>

  <g class="interactive" data-card="famille-complaisance" tabindex="0" role="button" aria-label="Complaisance mémorielle — cliquez pour les détails">
    <rect x="64" y="624" width="1072" height="124" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <circle cx="94" cy="660" r="13" fill="#1F5560"/>
    <text x="94" y="664" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">4</text>
    <text x="120" y="658" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Complaisance mémorielle</text>
    <text x="120" y="684" class="mono" font-size="11.5" fill="#1F5560">MemSyco-Bench · juillet 2026</text>
    <text x="120" y="708" class="body" font-size="12" fill="#5A5A5A">Cinq tâches de décision sous</text>
    <text x="120" y="726" class="body" font-size="12" fill="#5A5A5A">mémoire retrouvée.</text>

    <text x="410" y="658" class="body" font-size="12.5" fill="#1A1A1A">Refuser une mémoire comme preuve,</text>
    <text x="410" y="678" class="body" font-size="12.5" fill="#1A1A1A">respecter son périmètre, arbitrer un conflit,</text>
    <text x="410" y="698" class="body" font-size="12.5" fill="#1A1A1A">suivre une mise à jour, personnaliser.</text>

    <text x="710" y="658" class="body" font-size="12.5" font-weight="600" fill="#B7332C">Une mémoire juste</text>
    <text x="710" y="678" class="body" font-size="12" fill="#5A5A5A">peut dégrader la décision :</text>
    <text x="710" y="696" class="body" font-size="12" fill="#5A5A5A">l'agent s'aligne au lieu</text>
    <text x="710" y="714" class="body" font-size="12" fill="#5A5A5A">de raisonner.</text>

    <text x="920" y="658" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Suppose l'item déjà</text>
    <text x="920" y="676" class="body" font-size="12" font-style="italic" fill="#5A5A5A">légitimement acquis.</text>
    <text x="920" y="694" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Le consentement n'est</text>
    <text x="920" y="712" class="body" font-size="12" font-style="italic" fill="#5A5A5A">pas une variable.</text>
  </g>

  <g class="interactive" data-card="case-vide" tabindex="0" role="button" aria-label="La case vide, l'autorité de l'item — cliquez pour les détails">
    <rect x="64" y="778" width="1072" height="132" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.75" stroke-dasharray="7 5"/>
    <text x="94" y="812" class="mono" font-size="11.5" letter-spacing="0.1em" fill="#B7332C">LA CASE VIDE</text>
    <text x="94" y="844" class="display" font-size="21" font-weight="600" fill="#1A1A1A">L'autorité de l'item : l'agent avait-il le droit de le retenir ?</text>
    <text x="94" y="872" class="body" font-size="13" fill="#1A1A1A">Origine de la donnée · portée déclarée · base légale du stockage · réversibilité du retrait · périmètre de la personne concernée.</text>
    <text x="94" y="894" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Un agent qui infère une allergie et l'applique parfaitement obtient un score maximal sur les quatre familles ci-dessus.</text>
  </g>

  <line x1="64" y1="936" x2="1136" y2="936" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="962" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Chiffres publiés par les auteurs des bancs d'essai cités (LongMemEval, PrefEval, CIMemories, MemSyco-Bench), non rejoués. Colonne « ce qu'elle ne voit pas » : analyse de l'auteur.</text>
</svg>
