<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Matrice des coûts d'erreur de mémoire : oublier ce qui était vrai contre retenir ce qui était faux, pour chacun des trois niveaux, et le réglage qui en découle">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="900" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Les deux fautes de mémoire, et leur coût qui s'inverse</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un même produit doit régler la précision et le rappel dans deux sens opposés selon le niveau</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">NIVEAU</text>
  <text x="320" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">OUBLIER CE QUI ÉTAIT VRAI</text>
  <text x="630" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">RETENIR CE QUI ÉTAIT FAUX</text>
  <text x="940" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">RÉGLAGE QUI EN DÉCOULE</text>

  <g class="interactive" data-card="cout-niveau-0" tabindex="0" role="button" aria-label="Coûts d'erreur au niveau 0 — cliquez pour les détails">
    <rect x="64" y="212" width="1072" height="164" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="212" width="6" height="164" fill="#B7332C"/>
    <text x="94" y="244" class="mono" font-size="12" letter-spacing="0.1em" fill="#B7332C">NIVEAU 0</text>
    <text x="94" y="274" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Contrainte</text>
    <text x="94" y="298" class="display" font-size="19" font-weight="600" fill="#1A1A1A">bloquante</text>
    <text x="94" y="330" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Allergie, régime</text>
    <text x="94" y="348" class="body" font-size="12" font-style="italic" fill="#5A5A5A">médical, interdit</text>

    <rect x="320" y="230" width="92" height="24" rx="3" fill="#B7332C"/>
    <text x="366" y="247" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">GRAVE</text>
    <text x="320" y="284" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Incident de sécurité alimentaire.</text>
    <text x="320" y="308" class="body" font-size="12.5" fill="#5A5A5A">Un dommage corporel possible, sans</text>
    <text x="320" y="328" class="body" font-size="12.5" fill="#5A5A5A">rattrapage ni recours utile pour</text>
    <text x="320" y="348" class="body" font-size="12.5" fill="#5A5A5A">l'utilisateur.</text>

    <rect x="630" y="230" width="92" height="24" rx="3" fill="#B58A2C"/>
    <text x="676" y="247" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">MODÉRÉ</text>
    <text x="630" y="284" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Catalogue appauvri.</text>
    <text x="630" y="308" class="body" font-size="12.5" fill="#5A5A5A">Des produits proposables sont écartés.</text>
    <text x="630" y="328" class="body" font-size="12.5" fill="#5A5A5A">L'utilisateur le voit et peut corriger</text>
    <text x="630" y="348" class="body" font-size="12.5" fill="#5A5A5A">sur l'écran de profil.</text>

    <rect x="940" y="230" width="196" height="30" rx="3" fill="#B7332C"/>
    <text x="1038" y="250" class="mono" font-size="11.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">RAPPEL &gt; PRÉCISION</text>
    <text x="940" y="288" class="body" font-size="12.5" fill="#1A1A1A">Dans le doute, exclure.</text>
    <text x="940" y="312" class="body" font-size="12" fill="#5A5A5A">Un produit dont la donnée</text>
    <text x="940" y="330" class="body" font-size="12" fill="#5A5A5A">allergène est incomplète</text>
    <text x="940" y="348" class="body" font-size="12" fill="#5A5A5A">sort du champ.</text>
  </g>

  <g class="interactive" data-card="cout-niveau-1" tabindex="0" role="button" aria-label="Coûts d'erreur au niveau 1 — cliquez pour les détails">
    <rect x="64" y="392" width="1072" height="164" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="392" width="6" height="164" fill="#B58A2C"/>
    <text x="94" y="424" class="mono" font-size="12" letter-spacing="0.1em" fill="#B58A2C">NIVEAU 1</text>
    <text x="94" y="454" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Cadre de</text>
    <text x="94" y="478" class="display" font-size="19" font-weight="600" fill="#1A1A1A">session</text>
    <text x="94" y="510" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Budget, convives,</text>
    <text x="94" y="528" class="body" font-size="12" font-style="italic" fill="#5A5A5A">temps, magasin</text>

    <rect x="320" y="410" width="92" height="24" rx="3" fill="#B8B5AE"/>
    <text x="366" y="427" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">FAIBLE</text>
    <text x="320" y="464" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Une redéclaration.</text>
    <text x="320" y="488" class="body" font-size="12.5" fill="#5A5A5A">Le cadre se réénonce en une phrase</text>
    <text x="320" y="508" class="body" font-size="12.5" fill="#5A5A5A">au début de la session, et le coût</text>
    <text x="320" y="528" class="body" font-size="12.5" fill="#5A5A5A">s'arrête là.</text>

    <rect x="630" y="410" width="92" height="24" rx="3" fill="#B58A2C"/>
    <text x="676" y="427" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">MODÉRÉ</text>
    <text x="630" y="464" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">La contrainte d'hier appliquée</text>
    <text x="630" y="486" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">aujourd'hui.</text>
    <text x="630" y="510" class="body" font-size="12.5" fill="#5A5A5A">Le budget de mardi borne le panier de</text>
    <text x="630" y="530" class="body" font-size="12.5" fill="#5A5A5A">samedi, sans que personne l'ait dit.</text>

    <rect x="940" y="410" width="196" height="30" rx="3" fill="#B58A2C"/>
    <text x="1038" y="430" class="mono" font-size="11.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">PÉREMPTION PAR DÉFAUT</text>
    <text x="940" y="468" class="body" font-size="12.5" fill="#1A1A1A">Rien ne survit à la session.</text>
    <text x="940" y="492" class="body" font-size="12" fill="#5A5A5A">Le mécanisme d'oubli le</text>
    <text x="940" y="510" class="body" font-size="12" fill="#5A5A5A">moins coûteux, et celui qui</text>
    <text x="940" y="528" class="body" font-size="12" fill="#5A5A5A">évite le plus d'erreurs.</text>
  </g>

  <g class="interactive" data-card="cout-niveau-2" tabindex="0" role="button" aria-label="Coûts d'erreur au niveau 2 — cliquez pour les détails">
    <rect x="64" y="572" width="1072" height="164" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="572" width="6" height="164" fill="#1F5560"/>
    <text x="94" y="604" class="mono" font-size="12" letter-spacing="0.1em" fill="#1F5560">NIVEAU 2</text>
    <text x="94" y="634" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Préférence</text>
    <text x="94" y="658" class="display" font-size="19" font-weight="600" fill="#1A1A1A">pondérée</text>
    <text x="94" y="690" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Local, prix, bio,</text>
    <text x="94" y="708" class="body" font-size="12" font-style="italic" fill="#5A5A5A">marque, goûts</text>

    <rect x="320" y="590" width="92" height="24" rx="3" fill="#B8B5AE"/>
    <text x="366" y="607" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">FAIBLE</text>
    <text x="320" y="644" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Une friction.</text>
    <text x="320" y="668" class="body" font-size="12.5" fill="#5A5A5A">L'utilisateur redéclare, l'agent</text>
    <text x="320" y="688" class="body" font-size="12.5" fill="#5A5A5A">s'ajuste, la session continue sans</text>
    <text x="320" y="708" class="body" font-size="12.5" fill="#5A5A5A">dommage durable.</text>

    <rect x="630" y="590" width="92" height="24" rx="3" fill="#B7332C"/>
    <text x="676" y="607" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">ÉLEVÉ</text>
    <text x="630" y="644" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Un classement biaisé durablement.</text>
    <text x="630" y="668" class="body" font-size="12.5" fill="#5A5A5A">La préférence fausse se réactive à</text>
    <text x="630" y="688" class="body" font-size="12.5" fill="#5A5A5A">chaque session sans être questionnée,</text>
    <text x="630" y="708" class="body" font-size="12.5" fill="#5A5A5A">et produit la sensation d'inattention.</text>

    <rect x="940" y="590" width="196" height="30" rx="3" fill="#1F5560"/>
    <text x="1038" y="610" class="mono" font-size="11.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">PRÉCISION &gt; RAPPEL</text>
    <text x="940" y="648" class="body" font-size="12.5" fill="#1A1A1A">Dans le doute, ne pas</text>
    <text x="940" y="668" class="body" font-size="12.5" fill="#1A1A1A">retenir.</text>
    <text x="940" y="692" class="body" font-size="12" fill="#5A5A5A">On n'apprend que sur un</text>
    <text x="940" y="710" class="body" font-size="12" fill="#5A5A5A">choix explicite.</text>
  </g>

  <rect x="64" y="758" width="1072" height="72" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="94" y="786" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">L'INVERSION</text>
  <text x="94" y="812" class="body" font-size="13.5" fill="#1A1A1A">Le réglage juste au niveau 2 est exactement le réglage faux au niveau 0. Une politique de mémoire unique pour tout le profil échouera d'un côté ou de l'autre.</text>

  <line x1="64" y1="856" x2="1136" y2="856" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="880" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Cadre analytique de l'auteur. Les qualificatifs de gravité sont relatifs à un parcours de courses alimentaires et se recalibrent par domaine.</text>
</svg>
