<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" role="img" aria-label="La séquence de décision d'un compagnon de courses, de la conversation au panier : filtrer, classer, comparer, rendre le choix quand l'écart est serré, revérifier en sortie">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8B5AE"/>
    </marker>
  </defs>

  <rect width="1200" height="890" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 08</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">« Local et pas cher » : la séquence qui rend l'arbitrage</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Deux préférences qui se contredisent sont le cas normal, et le choix rendu est le seul signal d'apprentissage propre</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="130" y="192" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">ÉTAPE</text>
  <text x="460" y="192" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">LA RÈGLE</text>
  <text x="860" y="192" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#5A5A5A">CE QUI SORT</text>

  <g class="interactive" data-card="etape-filtrer" tabindex="0" role="button" aria-label="Étape 1, filtrer — cliquez pour les détails">
    <rect x="64" y="208" width="1072" height="88" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <circle cx="94" cy="252" r="14" fill="#B7332C"/>
    <text x="94" y="257" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <text x="130" y="246" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Filtrer</text>
    <text x="130" y="272" class="mono" font-size="11" fill="#B7332C">NIVEAUX 0 ET 1</text>
    <text x="460" y="242" class="body" font-size="12.5" fill="#1A1A1A">Les contraintes bloquantes s'appliquent avant tout</text>
    <text x="460" y="262" class="body" font-size="12.5" fill="#1A1A1A">classement, à la recette, à chaque ingrédient et à</text>
    <text x="460" y="282" class="body" font-size="12.5" fill="#1A1A1A">chaque produit apparié.</text>
    <text x="860" y="248" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Un champ admissible</text>
    <text x="860" y="270" class="body" font-size="12" fill="#5A5A5A">Aucun produit qui viole le</text>
    <text x="860" y="286" class="body" font-size="12" fill="#5A5A5A">niveau 0 n'y figure encore.</text>
  </g>
  <line x1="94" y1="300" x2="94" y2="320" stroke="#B8B5AE" stroke-width="1.4" marker-end="url(#a8)"/>

  <g class="interactive" data-card="etape-classer" tabindex="0" role="button" aria-label="Étape 2, classer — cliquez pour les détails">
    <rect x="64" y="324" width="1072" height="88" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <circle cx="94" cy="368" r="14" fill="#1F5560"/>
    <text x="94" y="373" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
    <text x="130" y="362" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Classer</text>
    <text x="130" y="388" class="mono" font-size="11" fill="#1F5560">NIVEAU 2</text>
    <text x="460" y="358" class="body" font-size="12.5" fill="#1A1A1A">Les poids sont une règle explicite, versionnée et</text>
    <text x="460" y="378" class="body" font-size="12.5" fill="#1A1A1A">testable. Aucune pondération ne vit dans une invite</text>
    <text x="460" y="398" class="body" font-size="12.5" fill="#1A1A1A">système, où elle ne se teste pas.</text>
    <text x="860" y="364" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Un ordre, et un motif</text>
    <text x="860" y="386" class="body" font-size="12" fill="#5A5A5A">Le motif affiché doit</text>
    <text x="860" y="402" class="body" font-size="12" fill="#5A5A5A">correspondre à la règle appliquée.</text>
  </g>
  <line x1="94" y1="416" x2="94" y2="436" stroke="#B8B5AE" stroke-width="1.4" marker-end="url(#a8)"/>

  <g class="interactive" data-card="etape-comparer" tabindex="0" role="button" aria-label="Étape 3, comparer — cliquez pour les détails">
    <rect x="64" y="440" width="1072" height="88" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#E5E1D8" stroke-width="1.25"/>
    <circle cx="94" cy="484" r="14" fill="#1F5560"/>
    <text x="94" y="489" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
    <text x="130" y="478" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Comparer</text>
    <text x="130" y="504" class="mono" font-size="11" fill="#1F5560">TROIS PRÉFÉRENCES AU PLUS</text>
    <text x="460" y="474" class="body" font-size="12.5" fill="#1A1A1A">Le meilleur produit selon chaque préférence active est</text>
    <text x="460" y="494" class="body" font-size="12.5" fill="#1A1A1A">retenu, et l'écart de score entre eux est calculé.</text>
    <text x="460" y="514" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Au-delà de trois préférences, le motif devient invérifiable.</text>
    <text x="860" y="480" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Un écart chiffré</text>
    <text x="860" y="502" class="body" font-size="12" fill="#5A5A5A">Comparé au seuil de choix</text>
    <text x="860" y="518" class="body" font-size="12" fill="#5A5A5A">double, à caler par mesure.</text>
  </g>
  <line x1="94" y1="532" x2="94" y2="552" stroke="#B8B5AE" stroke-width="1.4" marker-end="url(#a8)"/>

  <g class="interactive" data-card="etape-choix" tabindex="0" role="button" aria-label="Étape 4, rendre le choix — cliquez pour les détails">
    <rect x="64" y="556" width="1072" height="148" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1.75"/>
    <circle cx="94" cy="600" r="14" fill="#B58A2C"/>
    <text x="94" y="605" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">4</text>
    <text x="130" y="594" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Rendre le choix</text>
    <text x="130" y="620" class="mono" font-size="11" fill="#B58A2C">SI L'ÉCART EST SOUS LE SEUIL</text>
    <text x="130" y="648" class="body" font-size="12" fill="#5A5A5A">Sinon : proposer le mieux</text>
    <text x="130" y="666" class="body" font-size="12" fill="#5A5A5A">classé, en nommant la</text>
    <text x="130" y="684" class="body" font-size="12" fill="#5A5A5A">préférence qui a tranché.</text>

    <rect x="440" y="576" width="330" height="108" rx="3" fill="#F2EFE7" stroke="#1F5560" stroke-width="1.4"/>
    <text x="462" y="604" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Tomates plein champ, Lot-et-Garonne</text>
    <text x="462" y="628" class="body" font-size="12.5" fill="#1F5560">Le plus local des produits admissibles</text>
    <text x="462" y="654" class="mono" font-size="13" font-weight="600" fill="#1A1A1A">4,10 €</text>
    <text x="462" y="674" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">1,20 € de plus que l'autre proposition</text>

    <rect x="790" y="576" width="330" height="108" rx="3" fill="#F2EFE7" stroke="#1F5560" stroke-width="1.4"/>
    <text x="812" y="604" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Tomates rondes, origine Espagne</text>
    <text x="812" y="628" class="body" font-size="12.5" fill="#1F5560">Le moins cher des produits admissibles</text>
    <text x="812" y="654" class="mono" font-size="13" font-weight="600" fill="#1A1A1A">2,90 €</text>
    <text x="812" y="674" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Le choix devient le signal d'apprentissage</text>
  </g>
  <line x1="94" y1="708" x2="94" y2="728" stroke="#B8B5AE" stroke-width="1.4" marker-end="url(#a8)"/>

  <g class="interactive" data-card="etape-reverifier" tabindex="0" role="button" aria-label="Étape 5, revérifier — cliquez pour les détails">
    <rect x="64" y="732" width="1072" height="88" rx="3" fill="#F2EFE7" opacity="0.5" stroke="#B7332C" stroke-width="1.5"/>
    <circle cx="94" cy="776" r="14" fill="#B7332C"/>
    <text x="94" y="781" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">5</text>
    <text x="130" y="770" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Revérifier</text>
    <text x="130" y="796" class="mono" font-size="11" fill="#B7332C">CONTRÔLE EN SORTIE</text>
    <text x="460" y="766" class="body" font-size="12.5" fill="#1A1A1A">Le produit finalement mis au panier repasse le filtre de</text>
    <text x="460" y="786" class="body" font-size="12.5" fill="#1A1A1A">niveau 0, y compris quand il vient du moteur de</text>
    <text x="460" y="806" class="body" font-size="12.5" fill="#1A1A1A">substitution ou d'une promotion poussée.</text>
    <text x="860" y="772" class="body" font-size="12.5" font-weight="600" fill="#B7332C">Le panier, ou un refus dit</text>
    <text x="860" y="794" class="body" font-size="12" fill="#5A5A5A">Quand rien ne satisfait la</text>
    <text x="860" y="810" class="body" font-size="12" fill="#5A5A5A">contrainte, l'agent l'annonce.</text>
  </g>

  <line x1="64" y1="848" x2="1136" y2="848" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="872" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Séquence et prix d'illustration : proposition de l'auteur. Le principe du choix rendu s'appuie sur la construction de préférence (Slovic, 1995) et sur les travaux CoPref / CoShop (2026).</text>
</svg>
