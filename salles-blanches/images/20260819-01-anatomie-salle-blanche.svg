<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Anatomie réelle d'une salle blanche de données">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect { fill-opacity: .82; }
  </style>
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
    </marker>
    <marker id="ar1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text class="mono" x="60" y="44" font-size="12" font-weight="600" letter-spacing="1.6" fill="#B7332C">SCHÉMA 01</text>
  <text class="display" x="60" y="80" font-size="28" font-weight="600" fill="#1A1A1A">L'anatomie réelle d'une salle blanche</text>
  <text class="display" x="60" y="106" font-size="18" font-style="italic" fill="#5A5A5A">Trois versements, une couche de règles écrite par un seul, une sortie étroite.</text>
  <line x1="60" y1="124" x2="1140" y2="124" stroke="#E5E1D8" stroke-width="1"/>

  <!-- INPUTS -->
  <text class="mono" x="70" y="168" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5A5A5A">CE QUI ENTRE</text>
  <g class="interactive" data-card="entrees" tabindex="0" role="button" aria-label="Ce qui entre dans la salle">
    <rect x="70" y="184" width="232" height="66" rx="3" fill="#1F5560" fill-opacity=".10" stroke="#1F5560" stroke-width="1.25"/>
    <text class="body" x="86" y="212" font-size="15" font-weight="500" fill="#1A1A1A">Données d'exposition</text>
    <text class="body" x="86" y="234" font-size="13" fill="#5A5A5A">Versées par la partie mesurée</text>

    <rect x="70" y="268" width="232" height="66" rx="3" fill="#1F5560" fill-opacity=".10" stroke="#1F5560" stroke-width="1.25"/>
    <text class="body" x="86" y="296" font-size="15" font-weight="500" fill="#1A1A1A">Données propriétaires</text>
    <text class="body" x="86" y="318" font-size="13" fill="#5A5A5A">Versées par l'annonceur</text>

    <rect x="70" y="352" width="232" height="66" rx="3" fill="#B8B5AE" fill-opacity=".18" stroke="#B8B5AE" stroke-width="1.25"/>
    <text class="body" x="86" y="380" font-size="15" font-weight="500" fill="#1A1A1A">Données d'un tiers</text>
    <text class="body" x="86" y="402" font-size="13" fill="#5A5A5A">Optionnel, rarement autorisé</text>
  </g>

  <line x1="306" y1="217" x2="396" y2="270" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#ar1)"/>
  <line x1="306" y1="301" x2="396" y2="301" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#ar1)"/>
  <line x1="306" y1="385" x2="396" y2="332" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#ar1)"/>

  <!-- RULES LAYER -->
  <g class="interactive" data-card="regles" tabindex="0" role="button" aria-label="La couche de règles">
    <rect x="410" y="184" width="300" height="234" rx="3" fill="#FAF8F3" stroke="#1A1A1A" stroke-width="2.5"/>
    <text class="mono" x="430" y="214" font-size="12" font-weight="600" letter-spacing="1.2" fill="#B7332C">COUCHE DE RÈGLES</text>
    <text class="body" x="430" y="244" font-size="15" font-weight="500" fill="#1A1A1A">Requêtes autorisées</text>
    <text class="body" x="430" y="270" font-size="15" font-weight="500" fill="#1A1A1A">Seuil d'agrégation</text>
    <text class="body" x="430" y="296" font-size="15" font-weight="500" fill="#1A1A1A">Contrôle de différence</text>
    <text class="body" x="430" y="322" font-size="15" font-weight="500" fill="#1A1A1A">Bruit et budget</text>
    <line x1="430" y1="342" x2="690" y2="342" stroke="#E5E1D8" stroke-width="1"/>
    <text class="body" x="430" y="368" font-size="13" font-style="italic" fill="#B7332C">Écrite par l'opérateur de la salle,</text>
    <text class="body" x="430" y="388" font-size="13" font-style="italic" fill="#B7332C">qui est souvent la partie mesurée.</text>
  </g>

  <!-- FUNNEL -->
  <path d="M714,240 L800,282 L800,352 L714,394 Z" fill="#B7332C" fill-opacity=".10" stroke="#B7332C" stroke-width="1"/>
  <line x1="800" y1="317" x2="868" y2="317" stroke="#B7332C" stroke-width="2.5" marker-end="url(#ar1c)"/>

  <!-- OUTPUT -->
  <text class="mono" x="884" y="168" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5A5A5A">CE QUI SORT</text>
  <g class="interactive" data-card="sortie" tabindex="0" role="button" aria-label="Ce qui sort de la salle">
    <rect x="884" y="268" width="246" height="100" rx="3" fill="#B7332C" fill-opacity=".12" stroke="#B7332C" stroke-width="1.25"/>
    <text class="body" x="902" y="300" font-size="15" font-weight="500" fill="#1A1A1A">Un agrégat</text>
    <text class="body" x="902" y="324" font-size="13" fill="#5A5A5A">Au-dessus du seuil, éventuellement</text>
    <text class="body" x="902" y="344" font-size="13" fill="#5A5A5A">bruité, jamais individuel.</text>
  </g>
  <text class="body" x="884" y="400" font-size="13" font-style="italic" fill="#B7332C">Ni la microdonnée, ni le plan</text>
  <text class="body" x="884" y="420" font-size="13" font-style="italic" fill="#B7332C">de calcul, ni le groupe témoin.</text>

  <!-- BUDGET BAR -->
  <g class="interactive" data-card="budget" tabindex="0" role="button" aria-label="Le budget de confidentialité">
    <rect x="70" y="492" width="1060" height="112" rx="3" fill="#B58A2C" fill-opacity=".08" stroke="#B58A2C" stroke-width="1.25"/>
    <text class="mono" x="92" y="524" font-size="12" font-weight="600" letter-spacing="1.2" fill="#B58A2C">BUDGET DE CONFIDENTIALITÉ — LA RESSOURCE QUI S'ÉPUISE</text>
    <rect x="92" y="540" width="700" height="18" rx="2" fill="#E5E1D8"/>
    <rect x="92" y="540" width="452" height="18" rx="2" fill="#B58A2C" fill-opacity=".75"/>
    <line x1="544" y1="534" x2="544" y2="564" stroke="#1A1A1A" stroke-width="1.25"/>
    <text class="mono" x="92" y="582" font-size="12" fill="#5A5A5A">Chaque requête en consomme une part. À zéro, plus aucune question n'est acceptée.</text>
    <text class="body" x="820" y="548" font-size="13" font-weight="500" fill="#1A1A1A">Personne ne l'alloue</text>
    <text class="body" x="820" y="570" font-size="13" fill="#5A5A5A">dans l'organisation.</text>
  </g>

  <!-- FOOTER -->
  <line x1="60" y1="700" x2="1140" y2="700" stroke="#E5E1D8" stroke-width="1"/>
  <text class="body" x="60" y="726" font-size="12" font-style="italic" fill="#5A5A5A">Sources : documentation Ads Data Hub, AWS Clean Rooms, Snowflake Data Clean Rooms ; recommandations IAB Tech Lab v1.0 (2024).</text>
  <text class="body" x="60" y="748" font-size="12" font-style="italic" fill="#5A5A5A">Schéma générique : les trois familles de salles diffèrent par l'identité de l'opérateur, pas par cette structure.</text>
</svg>
