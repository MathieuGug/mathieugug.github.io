<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Trois familles de salles blanches comparées par la propriété">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect { fill-opacity: .82; }
  </style>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text class="mono" x="60" y="44" font-size="12" font-weight="600" letter-spacing="1.6" fill="#B7332C">SCHÉMA 02</text>
  <text class="display" x="60" y="80" font-size="28" font-weight="600" fill="#1A1A1A">Trois familles sous un seul mot</text>
  <text class="display" x="60" y="106" font-size="18" font-style="italic" fill="#5A5A5A">« Salle blanche » est une catégorie commerciale. Ce qui change, c'est qui tient la clé.</text>
  <line x1="60" y1="124" x2="1140" y2="124" stroke="#E5E1D8" stroke-width="1"/>

  <!-- column headers -->
  <g class="interactive" data-card="vendeur" tabindex="0" role="button" aria-label="La salle du vendeur">
    <rect x="330" y="150" width="256" height="72" rx="3" fill="#B7332C" fill-opacity=".12" stroke="#B7332C" stroke-width="1.25"/>
    <text class="body" x="348" y="180" font-size="15" font-weight="600" fill="#1A1A1A">La salle du vendeur</text>
    <text class="body" x="348" y="202" font-size="13" fill="#5A5A5A">Ads Data Hub, Amazon MC</text>
  </g>
  <g class="interactive" data-card="infra" tabindex="0" role="button" aria-label="La salle de l'infrastructure">
    <rect x="602" y="150" width="256" height="72" rx="3" fill="#1F5560" fill-opacity=".12" stroke="#1F5560" stroke-width="1.25"/>
    <text class="body" x="620" y="180" font-size="15" font-weight="600" fill="#1A1A1A">La salle de l'infrastructure</text>
    <text class="body" x="620" y="202" font-size="13" fill="#5A5A5A">Snowflake, AWS, Databricks</text>
  </g>
  <g class="interactive" data-card="attestee" tabindex="0" role="button" aria-label="La salle attestée">
    <rect x="874" y="150" width="256" height="72" rx="3" fill="#2F5D3F" fill-opacity=".12" stroke="#2F5D3F" stroke-width="1.25"/>
    <text class="body" x="892" y="180" font-size="15" font-weight="600" fill="#1A1A1A">La salle attestée</text>
    <text class="body" x="892" y="202" font-size="13" fill="#5A5A5A">Enclave matérielle vérifiable</text>
  </g>

  <!-- rows -->
  <line x1="60" y1="240" x2="1140" y2="240" stroke="#E5E1D8" stroke-width="1"/>

  <text class="body" x="60" y="278" font-size="15" font-weight="500" fill="#1A1A1A">Qui écrit les règles</text>
  <text class="body" x="348" y="278" font-size="13" fill="#B7332C">La partie mesurée</text>
  <text class="body" x="620" y="278" font-size="13" fill="#5A5A5A">Les deux participants</text>
  <text class="body" x="892" y="278" font-size="13" fill="#5A5A5A">Le code attesté, figé</text>
  <line x1="60" y1="300" x2="1140" y2="300" stroke="#E5E1D8" stroke-width="1"/>

  <text class="body" x="60" y="338" font-size="15" font-weight="500" fill="#1A1A1A">Qui peut voir la donnée</text>
  <text class="body" x="348" y="338" font-size="13" fill="#B7332C">L'opérateur, par construction</text>
  <text class="body" x="620" y="338" font-size="13" fill="#5A5A5A">L'opérateur, contractuellement lié</text>
  <text class="body" x="892" y="338" font-size="13" fill="#2F5D3F">Personne, y compris l'éditeur</text>
  <line x1="60" y1="360" x2="1140" y2="360" stroke="#E5E1D8" stroke-width="1"/>

  <text class="body" x="60" y="398" font-size="15" font-weight="500" fill="#1A1A1A">Neutre sur le résultat</text>
  <text class="body" x="348" y="398" font-size="13" fill="#B7332C">Non</text>
  <text class="body" x="620" y="398" font-size="13" fill="#2F5D3F">Oui</text>
  <text class="body" x="892" y="398" font-size="13" fill="#2F5D3F">Oui</text>
  <line x1="60" y1="420" x2="1140" y2="420" stroke="#E5E1D8" stroke-width="1"/>

  <text class="body" x="60" y="458" font-size="15" font-weight="500" fill="#1A1A1A">La régie accepte d'y entrer</text>
  <text class="body" x="348" y="458" font-size="13" fill="#2F5D3F">Oui, c'est la sienne</text>
  <text class="body" x="620" y="458" font-size="13" fill="#B7332C">Rarement</text>
  <text class="body" x="892" y="458" font-size="13" fill="#B7332C">Aucune grande régie en 2026</text>
  <line x1="60" y1="480" x2="1140" y2="480" stroke="#E5E1D8" stroke-width="1"/>

  <text class="body" x="60" y="518" font-size="15" font-weight="500" fill="#1A1A1A">Le problème qu'elle résout</text>
  <text class="body" x="348" y="518" font-size="13" fill="#5A5A5A">La conformité du vendeur</text>
  <text class="body" x="620" y="518" font-size="13" fill="#5A5A5A">L'interopérabilité technique</text>
  <text class="body" x="892" y="518" font-size="13" fill="#5A5A5A">La confiance entre méfiants</text>
  <line x1="60" y1="540" x2="1140" y2="540" stroke="#E5E1D8" stroke-width="1"/>

  <!-- verdict -->
  <g class="interactive" data-card="verdict" tabindex="0" role="button" aria-label="Le verdict">
    <rect x="60" y="576" width="1070" height="98" rx="3" fill="#1A1A1A" fill-opacity=".05" stroke="#1A1A1A" stroke-width="1.25"/>
    <text class="mono" x="82" y="606" font-size="12" font-weight="600" letter-spacing="1.2" fill="#B7332C">LE CROISEMENT QUI MANQUE</text>
    <text class="body" x="82" y="634" font-size="15" font-weight="500" fill="#1A1A1A">La seule famille qui résout un problème de confiance est celle où la partie mesurée n'entre pas.</text>
    <text class="body" x="82" y="658" font-size="13" fill="#5A5A5A">Là où elle entre, elle écrit les règles. Le dispositif est disponible ; le consentement de l'autre partie ne l'est pas.</text>
  </g>

  <line x1="60" y1="712" x2="1140" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text class="body" x="60" y="738" font-size="12" font-style="italic" fill="#5A5A5A">Sources : FTC, « Data Clean Rooms: Separating Fact from Fiction », 13 nov. 2024 ; documentation des éditeurs ; Azure Confidential Computing.</text>
  <text class="body" x="60" y="760" font-size="12" font-style="italic" fill="#5A5A5A">Lecture : chaque colonne est une architecture distincte, vendue sous le même nom.</text>
</svg>
