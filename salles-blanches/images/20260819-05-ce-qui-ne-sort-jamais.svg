<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Les quatre choses qui ne sortent jamais d'une salle blanche">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect { fill-opacity: .82; }
  </style>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text class="mono" x="60" y="44" font-size="12" font-weight="600" letter-spacing="1.6" fill="#B7332C">SCHÉMA 05</text>
  <text class="display" x="60" y="80" font-size="28" font-weight="600" fill="#1A1A1A">Les quatre portes fermées</text>
  <text class="display" x="60" y="106" font-size="18" font-style="italic" fill="#5A5A5A">Ce qui ne franchit pas la paroi, et pourquoi aucun réglage n'y change rien.</text>
  <line x1="60" y1="124" x2="1140" y2="124" stroke="#E5E1D8" stroke-width="1"/>

  <!-- the room -->
  <rect x="70" y="180" width="270" height="380" rx="3" fill="#1F5560" fill-opacity=".08" stroke="#1F5560" stroke-width="1.25"/>
  <text class="mono" x="92" y="212" font-size="12" font-weight="600" letter-spacing="1.2" fill="#1F5560">DANS LA SALLE</text>
  <text class="body" x="92" y="248" font-size="15" font-weight="500" fill="#1A1A1A">Chevauchements d'audience</text>
  <text class="body" x="92" y="278" font-size="15" font-weight="500" fill="#1A1A1A">Construction de segments</text>
  <text class="body" x="92" y="308" font-size="15" font-weight="500" fill="#1A1A1A">Fréquence et couverture</text>
  <text class="body" x="92" y="338" font-size="15" font-weight="500" fill="#1A1A1A">Activation d'une audience</text>
  <line x1="92" y1="362" x2="318" y2="362" stroke="#E5E1D8" stroke-width="1"/>
  <text class="body" x="92" y="392" font-size="13" font-style="italic" fill="#5A5A5A">Ce sont des opérations,</text>
  <text class="body" x="92" y="412" font-size="13" font-style="italic" fill="#5A5A5A">et la salle est faite pour ça.</text>
  <text class="body" x="92" y="452" font-size="13" font-style="italic" fill="#1F5560">Ces usages ne demandent</text>
  <text class="body" x="92" y="472" font-size="13" font-style="italic" fill="#1F5560">jamais de vérifier un chiffre.</text>

  <!-- wall -->
  <line x1="392" y1="170" x2="392" y2="600" stroke="#1A1A1A" stroke-width="2.5"/>
  <text class="mono" x="404" y="588" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5A5A5A" transform="rotate(-90 404 588)">LA PAROI</text>

  <!-- blocked flows + cards -->
  <g class="interactive" data-card="contrefactuel" tabindex="0" role="button" aria-label="Le contrefactuel">
    <line x1="352" y1="222" x2="384" y2="222" stroke="#B7332C" stroke-width="2.5"/>
    <line x1="386" y1="208" x2="398" y2="236" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="440" y="182" width="690" height="82" rx="3" fill="#B7332C" fill-opacity=".10" stroke="#B7332C" stroke-width="1.25"/>
    <text class="body" x="460" y="212" font-size="15" font-weight="600" fill="#1A1A1A">1 · Le contrefactuel</text>
    <text class="body" x="460" y="236" font-size="13" fill="#5A5A5A">La salle contient ce qui s'est passé. Le groupe témoin se construit avant la diffusion,</text>
    <text class="body" x="460" y="256" font-size="13" fill="#5A5A5A">par une randomisation que seule la partie qui tient l'enchère peut exécuter.</text>
  </g>

  <g class="interactive" data-card="replication" tabindex="0" role="button" aria-label="La réplication">
    <line x1="352" y1="322" x2="384" y2="322" stroke="#B7332C" stroke-width="2.5"/>
    <line x1="386" y1="308" x2="398" y2="336" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="440" y="282" width="690" height="82" rx="3" fill="#B7332C" fill-opacity=".10" stroke="#B7332C" stroke-width="1.25"/>
    <text class="body" x="460" y="312" font-size="15" font-weight="600" fill="#1A1A1A">2 · La réplication à l'identique</text>
    <text class="body" x="460" y="336" font-size="13" fill="#5A5A5A">Chaque exécution consomme du budget et un mécanisme de bruit correct renvoie une</text>
    <text class="body" x="460" y="356" font-size="13" fill="#5A5A5A">valeur différente. Deux résultats divergents ne sont pas un défaut : c'est la garantie.</text>
  </g>

  <g class="interactive" data-card="tiers" tabindex="0" role="button" aria-label="L'audit par un tiers">
    <line x1="352" y1="422" x2="384" y2="422" stroke="#B7332C" stroke-width="2.5"/>
    <line x1="386" y1="408" x2="398" y2="436" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="440" y="382" width="690" height="82" rx="3" fill="#B7332C" fill-opacity=".10" stroke="#B7332C" stroke-width="1.25"/>
    <text class="body" x="460" y="412" font-size="15" font-weight="600" fill="#1A1A1A">3 · L'audit par un tiers</text>
    <text class="body" x="460" y="436" font-size="13" fill="#5A5A5A">L'accès de l'auditeur consomme du budget, s'ajoute à l'historique opposable des contrôles</text>
    <text class="body" x="460" y="456" font-size="13" fill="#5A5A5A">de différence, et se heurte à la clause qui limite les participants aux parties au contrat.</text>
  </g>

  <g class="interactive" data-card="portabilite" tabindex="0" role="button" aria-label="La portabilité du résultat">
    <line x1="352" y1="522" x2="384" y2="522" stroke="#B7332C" stroke-width="2.5"/>
    <line x1="386" y1="508" x2="398" y2="536" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="440" y="482" width="690" height="82" rx="3" fill="#B7332C" fill-opacity=".10" stroke="#B7332C" stroke-width="1.25"/>
    <text class="body" x="460" y="512" font-size="15" font-weight="600" fill="#1A1A1A">4 · La portabilité du résultat</text>
    <text class="body" x="460" y="536" font-size="13" fill="#5A5A5A">Amazon Marketing Cloud : l'identifiant utilisateur sert aux jointures, aux filtres et aux</text>
    <text class="body" x="460" y="556" font-size="13" fill="#5A5A5A">regroupements, jamais à la sortie. Vous emportez un nombre, pas une pièce.</text>
  </g>

  <!-- root -->
  <rect x="70" y="606" width="1060" height="70" rx="3" fill="#1A1A1A" fill-opacity=".05" stroke="#1A1A1A" stroke-width="1.25"/>
  <text class="body" x="92" y="638" font-size="15" font-weight="500" fill="#1A1A1A">Racine commune aux quatre : vérifier consiste à obtenir plus d'informations sur la même donnée.</text>
  <text class="body" x="92" y="662" font-size="13" font-style="italic" fill="#B7332C">La loi fondamentale du recouvrement d'information dit que c'est exactement ce que la salle doit empêcher.</text>

  <line x1="60" y1="712" x2="1140" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text class="body" x="60" y="738" font-size="12" font-style="italic" fill="#5A5A5A">Sources : documentation Amazon Marketing Cloud, Snowflake, AWS Clean Rooms ; Dinur &amp; Nissim, PODS 2003.</text>
  <text class="body" x="60" y="760" font-size="12" font-style="italic" fill="#5A5A5A">Lecture : aucune des quatre limites ne se lève par un réglage de configuration.</text>
</svg>
