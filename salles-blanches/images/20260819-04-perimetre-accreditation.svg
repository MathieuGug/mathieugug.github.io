<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Où s'arrête l'accréditation d'Ads Data Hub">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect { fill-opacity: .82; }
  </style>
  <defs>
    <pattern id="hatch04" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#B7332C" stroke-width="1.4" stroke-opacity=".38"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text class="mono" x="60" y="44" font-size="12" font-weight="600" letter-spacing="1.6" fill="#B7332C">SCHÉMA 04</text>
  <text class="display" x="60" y="80" font-size="28" font-weight="600" fill="#1A1A1A">Où s'arrête l'accréditation</text>
  <text class="display" x="60" y="106" font-size="18" font-style="italic" fill="#5A5A5A">Le même produit, deux modes, une seule frontière auditée. Google l'écrit lui-même.</text>
  <line x1="60" y1="124" x2="1140" y2="124" stroke="#E5E1D8" stroke-width="1"/>

  <!-- outer decision zone -->
  <rect x="70" y="168" width="640" height="440" rx="3" fill="#B58A2C" fill-opacity=".05" stroke="#B58A2C" stroke-width="1" stroke-dasharray="2 3"/>
  <text class="mono" x="90" y="196" font-size="12" font-weight="600" letter-spacing="1.2" fill="#B58A2C">CE QUI SERT À ARBITRER UN BUDGET MÉDIA</text>

  <!-- product box -->
  <rect x="106" y="250" width="568" height="228" rx="3" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <text class="mono" x="126" y="238" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5A5A5A">UN SEUL PRODUIT — ADS DATA HUB</text>

  <g class="interactive" data-card="accredite" tabindex="0" role="button" aria-label="Le périmètre accrédité">
    <rect x="106" y="250" width="284" height="228" fill="#1F5560" fill-opacity=".14"/>
    <text class="body" x="126" y="286" font-size="15" font-weight="600" fill="#1A1A1A">Mode contrôle de différence</text>
    <text class="mono" x="126" y="312" font-size="12" font-weight="600" letter-spacing="1" fill="#1F5560">ACCRÉDITÉ MRC</text>
    <text class="body" x="126" y="342" font-size="13" fill="#5A5A5A">Impressions vidéo rendues</text>
    <text class="body" x="126" y="362" font-size="13" fill="#5A5A5A">et visibles, filtrées du trafic</text>
    <text class="body" x="126" y="382" font-size="13" fill="#5A5A5A">invalide sophistiqué ; vues</text>
    <text class="body" x="126" y="402" font-size="13" fill="#5A5A5A">TrueView. Périmètre élargi</text>
    <text class="body" x="126" y="422" font-size="13" fill="#5A5A5A">de dix métriques le</text>
    <text class="body" x="126" y="442" font-size="13" fill="#5A5A5A">18 juillet 2025.</text>
  </g>

  <g class="interactive" data-card="mode-bruite" tabindex="0" role="button" aria-label="Le mode bruité, hors accréditation">
    <rect x="390" y="250" width="284" height="228" fill="url(#hatch04)"/>
    <rect x="390" y="250" width="284" height="228" fill="none" stroke="#B7332C" stroke-width="1.25"/>
    <text class="body" x="410" y="286" font-size="15" font-weight="600" fill="#1A1A1A">Mode bruité</text>
    <text class="mono" x="410" y="312" font-size="12" font-weight="600" letter-spacing="1" fill="#B7332C">HORS ACCRÉDITATION</text>
    <text class="body" x="410" y="342" font-size="13" fill="#5A5A5A">La protection la plus forte</text>
    <text class="body" x="410" y="362" font-size="13" fill="#5A5A5A">offerte par le produit sort</text>
    <text class="body" x="410" y="382" font-size="13" fill="#5A5A5A">du périmètre audité.</text>
    <text class="body" x="410" y="414" font-size="13" font-style="italic" fill="#B7332C">Protection et vérifiabilité</text>
    <text class="body" x="410" y="434" font-size="13" font-style="italic" fill="#B7332C">s'excluent dans la même</text>
    <text class="body" x="410" y="454" font-size="13" font-style="italic" fill="#B7332C">interface.</text>
  </g>

  <g class="interactive" data-card="zone-decision" tabindex="0" role="button" aria-label="La zone de décision non couverte">
    <rect x="106" y="506" width="568" height="80" rx="3" fill="#B58A2C" fill-opacity=".14" stroke="#B58A2C" stroke-width="1.25"/>
    <text class="body" x="126" y="536" font-size="15" font-weight="600" fill="#1A1A1A">Incrémentalité, contribution, arbitrage de budget</text>
    <text class="body" x="126" y="562" font-size="13" fill="#5A5A5A">Jamais couvert par une accréditation, dans aucun mode, chez aucun opérateur.</text>
  </g>

  <!-- right annotations -->
  <text class="mono" x="760" y="196" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5A5A5A">CE QUE LA FIGURE MONTRE</text>

  <circle cx="772" cy="236" r="9" fill="#1F5560"/>
  <text class="mono" x="772" y="240" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
  <text class="body" x="794" y="240" font-size="13" fill="#1A1A1A">L'accréditation porte sur la livraison,</text>
  <text class="body" x="794" y="260" font-size="13" fill="#1A1A1A">pas sur la performance.</text>

  <circle cx="772" cy="306" r="9" fill="#B7332C"/>
  <text class="mono" x="772" y="310" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
  <text class="body" x="794" y="310" font-size="13" fill="#1A1A1A">Activer le bruit fait sortir du périmètre.</text>
  <text class="body" x="794" y="330" font-size="13" fill="#1A1A1A">Rester dedans expose à la reconstruction.</text>

  <circle cx="772" cy="376" r="9" fill="#B58A2C"/>
  <text class="mono" x="772" y="380" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
  <text class="body" x="794" y="380" font-size="13" fill="#1A1A1A">Rien ne distingue visuellement, dans une</text>
  <text class="body" x="794" y="400" font-size="13" fill="#1A1A1A">même sortie, le chiffre audité de l'autre.</text>

  <g class="interactive" data-card="cookie-matching" tabindex="0" role="button" aria-label="Le retrait de l'accréditation de l'appariement">
    <rect x="760" y="440" width="370" height="146" rx="3" fill="#1A1A1A" fill-opacity=".05" stroke="#B8B5AE" stroke-width="1.25"/>
    <text class="mono" x="780" y="470" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5A5A5A">LE PÉRIMÈTRE BOUGE</text>
    <text class="body" x="780" y="500" font-size="13" fill="#1A1A1A">Google ne cherche plus l'accréditation</text>
    <text class="body" x="780" y="520" font-size="13" fill="#1A1A1A">pour l'appariement par témoins de</text>
    <text class="body" x="780" y="540" font-size="13" fill="#1A1A1A">connexion, du fait de leur disparition.</text>
    <text class="body" x="780" y="568" font-size="13" font-style="italic" fill="#B7332C">Suivre ce périmètre est un travail à part.</text>
  </g>

  <line x1="60" y1="700" x2="1140" y2="700" stroke="#E5E1D8" stroke-width="1"/>
  <text class="body" x="60" y="726" font-size="12" font-style="italic" fill="#5A5A5A">Sources : documentation de méthodologie Ads Data Hub ; accréditation Media Rating Council ; mise à jour de méthodologie du 18 juillet 2025.</text>
  <text class="body" x="60" y="748" font-size="12" font-style="italic" fill="#5A5A5A">Réserve : documentation primaire inaccessible depuis l'environnement de rédaction, éléments recoupés sur deux formulations indépendantes.</text>
</svg>
