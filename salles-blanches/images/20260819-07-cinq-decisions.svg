<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Cinq décisions classées par coût et réversibilité">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect { fill-opacity: .82; }
  </style>
  <defs>
    <marker id="ax7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text class="mono" x="60" y="44" font-size="12" font-weight="600" letter-spacing="1.6" fill="#B7332C">SCHÉMA 07</text>
  <text class="display" x="60" y="80" font-size="28" font-weight="600" fill="#1A1A1A">Cinq décisions, classées par réversibilité</text>
  <text class="display" x="60" y="106" font-size="18" font-style="italic" fill="#5A5A5A">La plus rentable est gratuite. La plus structurante engage un budget.</text>
  <line x1="60" y1="124" x2="1140" y2="124" stroke="#E5E1D8" stroke-width="1"/>

  <!-- grid -->
  <line x1="100" y1="270" x2="660" y2="270" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="100" y1="370" x2="660" y2="370" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="100" y1="470" x2="660" y2="470" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="240" y1="180" x2="240" y2="580" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="380" y1="180" x2="380" y2="580" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="520" y1="180" x2="520" y2="580" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- axes -->
  <line x1="100" y1="580" x2="676" y2="580" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#ax7)"/>
  <line x1="100" y1="580" x2="100" y2="174" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#ax7)"/>
  <text class="body" x="560" y="606" font-size="13" fill="#5A5A5A">Coût croissant</text>
  <text class="body" x="118" y="192" font-size="13" fill="#5A5A5A">Réversible</text>
  <text class="body" x="118" y="570" font-size="13" fill="#5A5A5A">Peu réversible</text>

  <!-- zones -->
  <g class="interactive" data-card="gratuite" tabindex="0" role="button" aria-label="Les décisions gratuites">
    <rect x="104" y="184" width="200" height="140" rx="3" fill="#2F5D3F" fill-opacity=".08" stroke="#2F5D3F" stroke-width="1" stroke-dasharray="2 3"/>
    <text class="mono" x="118" y="316" font-size="12" font-weight="600" letter-spacing="1.1" fill="#2F5D3F">À PRENDRE CETTE SEMAINE</text>
  </g>
  <g class="interactive" data-card="contractuelle" tabindex="0" role="button" aria-label="Les décisions contractuelles">
    <rect x="312" y="300" width="200" height="160" rx="3" fill="#B58A2C" fill-opacity=".08" stroke="#B58A2C" stroke-width="1" stroke-dasharray="2 3"/>
    <text class="mono" x="326" y="452" font-size="12" font-weight="600" letter-spacing="1.1" fill="#B58A2C">AU PROCHAIN RENOUVELLEMENT</text>
  </g>
  <g class="interactive" data-card="structurante" tabindex="0" role="button" aria-label="La décision structurante">
    <rect x="520" y="460" width="140" height="112" rx="3" fill="#B7332C" fill-opacity=".08" stroke="#B7332C" stroke-width="1" stroke-dasharray="2 3"/>
    <text class="mono" x="534" y="564" font-size="12" font-weight="600" letter-spacing="1.1" fill="#B7332C">PLAN À DOUZE MOIS</text>
  </g>

  <!-- points -->
  <circle cx="160" cy="222" r="11" fill="#2F5D3F"/>
  <text class="mono" x="160" y="226" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
  <circle cx="252" cy="266" r="11" fill="#2F5D3F"/>
  <text class="mono" x="252" y="270" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
  <circle cx="408" cy="392" r="11" fill="#B58A2C"/>
  <text class="mono" x="408" y="396" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
  <circle cx="352" cy="336" r="11" fill="#B58A2C"/>
  <text class="mono" x="352" y="340" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">4</text>
  <circle cx="590" cy="514" r="11" fill="#B7332C"/>
  <text class="mono" x="590" y="518" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">5</text>

  <!-- legend -->
  <line x1="716" y1="180" x2="716" y2="600" stroke="#E5E1D8" stroke-width="1"/>

  <circle cx="748" cy="200" r="9" fill="#2F5D3F"/>
  <text class="mono" x="748" y="204" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
  <text class="body" x="770" y="204" font-size="15" font-weight="600" fill="#1A1A1A">Sortir le chiffre de justification</text>
  <text class="body" x="770" y="226" font-size="13" fill="#5A5A5A">Repérer les indicateurs issus d'une salle qui servent</text>
  <text class="body" x="770" y="246" font-size="13" fill="#5A5A5A">à arbitrer un budget. Changer la source, pas la salle.</text>

  <circle cx="748" cy="288" r="9" fill="#2F5D3F"/>
  <text class="mono" x="748" y="292" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
  <text class="body" x="770" y="292" font-size="15" font-weight="600" fill="#1A1A1A">Écrire les questions non répondables</text>
  <text class="body" x="770" y="314" font-size="13" fill="#5A5A5A">Un plan de mesure qui ne dit pas ce qu'on renonce</text>
  <text class="body" x="770" y="334" font-size="13" fill="#5A5A5A">à mesurer est un plan incomplet.</text>

  <circle cx="748" cy="376" r="9" fill="#B58A2C"/>
  <text class="mono" x="748" y="380" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
  <text class="body" x="770" y="380" font-size="15" font-weight="600" fill="#1A1A1A">Annexer la configuration versionnée</text>
  <text class="body" x="770" y="402" font-size="13" fill="#5A5A5A">Seuil, epsilon, bruit, budget, réinitialisation, mode actif,</text>
  <text class="body" x="770" y="422" font-size="13" fill="#5A5A5A">avec préavis en cas de modification.</text>

  <circle cx="748" cy="464" r="9" fill="#B58A2C"/>
  <text class="mono" x="748" y="468" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">4</text>
  <text class="body" x="770" y="468" font-size="15" font-weight="600" fill="#1A1A1A">Nommer qui alloue le budget</text>
  <text class="body" x="770" y="490" font-size="13" fill="#5A5A5A">Le rattachement compte plus que le titre : pas sous</text>
  <text class="body" x="770" y="510" font-size="13" fill="#5A5A5A">l'équipe dont les campagnes sont mesurées.</text>

  <circle cx="748" cy="552" r="9" fill="#B7332C"/>
  <text class="mono" x="748" y="556" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">5</text>
  <text class="body" x="770" y="556" font-size="15" font-weight="600" fill="#1A1A1A">Séparer opération et preuve</text>
  <text class="body" x="770" y="578" font-size="13" fill="#5A5A5A">On active dedans. On prouve dehors, par l'expérimentation</text>
  <text class="body" x="770" y="598" font-size="13" fill="#5A5A5A">et le modèle de mix.</text>

  <rect x="100" y="622" width="1030" height="54" rx="3" fill="#1A1A1A" fill-opacity=".05" stroke="#1A1A1A" stroke-width="1.25"/>
  <text class="body" x="122" y="646" font-size="15" font-weight="500" fill="#1A1A1A">La question à poser en fin de démonstration : si je conteste ce chiffre dans six mois, qu'est-ce que je peux produire ?</text>
  <text class="body" x="122" y="668" font-size="13" font-style="italic" fill="#B7332C">Si la réponse est le chiffre lui-même, vous n'avez pas acheté une preuve. Vous avez acheté un calcul.</text>

  <line x1="60" y1="712" x2="1140" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text class="body" x="60" y="738" font-size="12" font-style="italic" fill="#5A5A5A">Grille analytique de l'auteur. Positions relatives, sans échelle numérique.</text>
  <text class="body" x="60" y="760" font-size="12" font-style="italic" fill="#5A5A5A">Aucune de ces décisions ne consiste à renoncer aux salles blanches.</text>
</svg>
