<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le triangle impossible entre protection, précision et nombre de questions">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect { fill-opacity: .82; }
    .interactive:hover circle { fill-opacity: .82; }
  </style>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text class="mono" x="60" y="44" font-size="12" font-weight="600" letter-spacing="1.6" fill="#B7332C">SCHÉMA 03</text>
  <text class="display" x="60" y="80" font-size="28" font-weight="600" fill="#1A1A1A">Le triangle qu'aucun fournisseur ne contourne</text>
  <text class="display" x="60" y="106" font-size="18" font-style="italic" fill="#5A5A5A">Protection, précision, liberté d'interroger : on en choisit deux. C'est un théorème, pas un défaut.</text>
  <line x1="60" y1="124" x2="1140" y2="124" stroke="#E5E1D8" stroke-width="1"/>

  <!-- triangle -->
  <path d="M340,200 L180,540 L500,540 Z" fill="#B7332C" fill-opacity=".06" stroke="#1A1A1A" stroke-width="2.5"/>

  <g class="interactive" data-card="theoreme" tabindex="0" role="button" aria-label="Le théorème de Dinur et Nissim">
    <circle cx="340" cy="200" r="10" fill="#B7332C"/>
    <circle cx="180" cy="540" r="10" fill="#1F5560"/>
    <circle cx="500" cy="540" r="10" fill="#B58A2C"/>
    <rect x="240" y="378" width="200" height="86" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25"/>
    <text class="body" x="258" y="406" font-size="13" font-weight="600" fill="#B7332C">Dinur &amp; Nissim, 2003</text>
    <text class="body" x="258" y="428" font-size="13" fill="#5A5A5A">Bruit requis de l'ordre</text>
    <text class="body" x="258" y="448" font-size="13" fill="#5A5A5A">de la racine de n.</text>
  </g>

  <text class="body" x="278" y="176" font-size="15" font-weight="600" fill="#1A1A1A">Protection</text>
  <text class="body" x="70" y="576" font-size="15" font-weight="600" fill="#1A1A1A">Précision du chiffre</text>
  <text class="body" x="450" y="576" font-size="15" font-weight="600" fill="#1A1A1A">Nombre de questions</text>
  <text class="body" x="70" y="598" font-size="13" font-style="italic" fill="#5A5A5A">Ce qu'on veut pour décider</text>
  <text class="body" x="450" y="598" font-size="13" font-style="italic" fill="#5A5A5A">Ce qu'il faut pour vérifier</text>

  <text class="body" x="150" y="646" font-size="13" font-style="italic" fill="#B7332C">« Des réponses trop précises à trop de questions détruisent la</text>
  <text class="body" x="150" y="668" font-size="13" font-style="italic" fill="#B7332C">confidentialité de manière spectaculaire. » — Dwork &amp; Roth</text>

  <!-- mechanisms -->
  <text class="mono" x="620" y="176" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5A5A5A">LES TROIS FAÇONS DE DÉGRADER, ET LEURS PARAMÈTRES PUBLICS</text>

  <g class="interactive" data-card="seuil" tabindex="0" role="button" aria-label="Le seuil d'agrégation">
    <rect x="620" y="192" width="510" height="116" rx="3" fill="#1F5560" fill-opacity=".10" stroke="#1F5560" stroke-width="1.25"/>
    <text class="body" x="640" y="222" font-size="15" font-weight="600" fill="#1A1A1A">1 · Le seuil d'agrégation</text>
    <text class="body" x="640" y="246" font-size="13" fill="#5A5A5A">Une ligne n'est renvoyée que si elle recouvre assez d'utilisateurs.</text>
    <text class="mono" x="640" y="272" font-size="13" font-weight="500" fill="#1F5560">Ads Data Hub : 50 utilisateurs — 10 en clic ou conversion.</text>
    <text class="body" x="640" y="294" font-size="13" font-style="italic" fill="#B7332C">Effet régressif : plus la campagne est ciblée, moins elle est mesurable.</text>
  </g>

  <g class="interactive" data-card="difference" tabindex="0" role="button" aria-label="Le contrôle de différence">
    <rect x="620" y="326" width="510" height="116" rx="3" fill="#B58A2C" fill-opacity=".10" stroke="#B58A2C" stroke-width="1.25"/>
    <text class="body" x="640" y="356" font-size="15" font-weight="600" fill="#1A1A1A">2 · Le contrôle de différence</text>
    <text class="body" x="640" y="380" font-size="13" fill="#5A5A5A">Bloque les requêtes qui isoleraient un individu par soustraction.</text>
    <text class="mono" x="640" y="406" font-size="13" font-weight="500" fill="#B58A2C">Parade directe à l'attaque par reconstruction.</text>
    <text class="body" x="640" y="428" font-size="13" font-style="italic" fill="#B7332C">Votre historique de requêtes devient opposable à votre prochaine question.</text>
  </g>

  <g class="interactive" data-card="bruit" tabindex="0" role="button" aria-label="Le bruit et le budget">
    <rect x="620" y="460" width="510" height="140" rx="3" fill="#B7332C" fill-opacity=".10" stroke="#B7332C" stroke-width="1.25"/>
    <text class="body" x="640" y="490" font-size="15" font-weight="600" fill="#1A1A1A">3 · Le bruit et le budget de confidentialité</text>
    <text class="body" x="640" y="514" font-size="13" fill="#5A5A5A">Bruit calibré sur l'agrégat, perte cumulée comptabilisée dans un budget fini.</text>
    <text class="mono" x="640" y="540" font-size="13" font-weight="500" fill="#B7332C">AWS Clean Rooms : epsilon de 1 à 20 ; bruit de 10 à 100 utilisateurs.</text>
    <text class="mono" x="640" y="562" font-size="13" font-weight="500" fill="#B7332C">Snowflake : budget par défaut de 10, réinitialisation mensuelle optionnelle.</text>
    <text class="body" x="640" y="586" font-size="13" font-style="italic" fill="#B7332C">Budget épuisé : plus aucune question n'est acceptée.</text>
  </g>

  <line x1="60" y1="700" x2="1140" y2="700" stroke="#E5E1D8" stroke-width="1"/>
  <text class="body" x="60" y="726" font-size="12" font-style="italic" fill="#5A5A5A">Sources : Dinur &amp; Nissim, PODS 2003 ; Dwork &amp; Roth, loi fondamentale du recouvrement d'information ; documentation AWS, Snowflake, Google.</text>
  <text class="body" x="60" y="748" font-size="12" font-style="italic" fill="#5A5A5A">Valeurs citées : bornes et valeurs par défaut documentées, pas configurations observées.</text>
</svg>
