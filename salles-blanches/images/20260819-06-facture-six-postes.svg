<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La facture d'une salle blanche en six postes">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover rect { fill-opacity: .82; }
  </style>
  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text class="mono" x="60" y="44" font-size="12" font-weight="600" letter-spacing="1.6" fill="#B7332C">SCHÉMA 06</text>
  <text class="display" x="60" y="80" font-size="28" font-weight="600" fill="#1A1A1A">La facture en six postes</text>
  <text class="display" x="60" y="106" font-size="18" font-style="italic" fill="#5A5A5A">Les deux derniers n'apparaissent dans aucune grille tarifaire, et ils décident du reste.</text>
  <line x1="60" y1="124" x2="1140" y2="124" stroke="#E5E1D8" stroke-width="1"/>

  <text class="mono" x="70" y="164" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5A5A5A">POSTE</text>
  <text class="mono" x="404" y="164" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5A5A5A">CE QU'IL RECOUVRE</text>
  <text class="mono" x="924" y="164" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5A5A5A">CONNU AU CADRAGE</text>
  <line x1="70" y1="176" x2="1130" y2="176" stroke="#E5E1D8" stroke-width="1"/>

  <g class="interactive" data-card="licence" tabindex="0" role="button" aria-label="Licence et calcul">
    <rect x="70" y="188" width="1060" height="62" rx="3" fill="#1F5560" fill-opacity=".07" stroke="#1F5560" stroke-width="1.25"/>
    <text class="body" x="90" y="214" font-size="15" font-weight="600" fill="#1A1A1A">1 · Licence ou abonnement</text>
    <text class="body" x="404" y="214" font-size="13" fill="#5A5A5A">Nul chez le vendeur, facturé chez l'indépendant, adossé au calcul</text>
    <text class="body" x="404" y="234" font-size="13" fill="#5A5A5A">chez le fournisseur d'infrastructure.</text>
    <text class="mono" x="924" y="222" font-size="12" font-weight="600" fill="#1F5560">OUI</text>
  </g>

  <g class="interactive" data-card="integration" tabindex="0" role="button" aria-label="Intégration et ingénierie">
    <rect x="70" y="260" width="1060" height="62" rx="3" fill="#1F5560" fill-opacity=".07" stroke="#1F5560" stroke-width="1.25"/>
    <text class="body" x="90" y="286" font-size="15" font-weight="600" fill="#1A1A1A">2 · Intégration initiale</text>
    <text class="body" x="404" y="286" font-size="13" fill="#5A5A5A">Divergences de schéma, signaux de partition ambigus, conventions de</text>
    <text class="body" x="404" y="306" font-size="13" fill="#5A5A5A">hachage incohérentes. Quatre à huit semaines rapportées.</text>
    <text class="mono" x="924" y="294" font-size="12" font-weight="600" fill="#B58A2C">SOUS-ESTIMÉ</text>
  </g>

  <rect x="70" y="332" width="1060" height="62" rx="3" fill="#1F5560" fill-opacity=".07" stroke="#1F5560" stroke-width="1.25"/>
  <text class="body" x="90" y="358" font-size="15" font-weight="600" fill="#1A1A1A">3 · Ingénierie permanente</text>
  <text class="body" x="404" y="358" font-size="13" fill="#5A5A5A">Chaque partenaire est une intégration de plus, avec sa convention.</text>
  <text class="body" x="404" y="378" font-size="13" fill="#5A5A5A">Aucun standard d'interopérabilité contraignant : l'IAB recommande.</text>
  <text class="mono" x="924" y="366" font-size="12" font-weight="600" fill="#B58A2C">SOUS-ESTIMÉ</text>

  <rect x="70" y="404" width="1060" height="62" rx="3" fill="#1F5560" fill-opacity=".07" stroke="#1F5560" stroke-width="1.25"/>
  <text class="body" x="90" y="430" font-size="15" font-weight="600" fill="#1A1A1A">4 · Calcul</text>
  <text class="body" x="404" y="430" font-size="13" fill="#5A5A5A">Proportionnel au volume interrogé, pas à la valeur de la réponse.</text>
  <text class="body" x="404" y="450" font-size="13" fill="#5A5A5A">Une requête refusée sur un contrôle est facturée comme les autres.</text>
  <text class="mono" x="924" y="438" font-size="12" font-weight="600" fill="#1F5560">OUI</text>

  <g class="interactive" data-card="budget-conf" tabindex="0" role="button" aria-label="La gouvernance du budget de confidentialité">
    <rect x="70" y="476" width="1060" height="62" rx="3" fill="#B7332C" fill-opacity=".12" stroke="#B7332C" stroke-width="1.25"/>
    <text class="body" x="90" y="502" font-size="15" font-weight="600" fill="#1A1A1A">5 · Gouvernance du budget de confidentialité</text>
    <text class="body" x="404" y="502" font-size="13" fill="#5A5A5A">Arbitrer entre exploration et rapports récurrents, décider des relèvements</text>
    <text class="body" x="404" y="522" font-size="13" fill="#5A5A5A">d'epsilon, tenir la trace. Fonction attribuée à personne.</text>
    <text class="mono" x="924" y="510" font-size="12" font-weight="600" fill="#B7332C">ABSENT</text>
  </g>

  <g class="interactive" data-card="hors-salle" tabindex="0" role="button" aria-label="La mesure qui reste dehors">
    <rect x="70" y="548" width="1060" height="62" rx="3" fill="#B7332C" fill-opacity=".12" stroke="#B7332C" stroke-width="1.25"/>
    <text class="body" x="90" y="574" font-size="15" font-weight="600" fill="#1A1A1A">6 · La mesure qui doit rester dehors</text>
    <text class="body" x="404" y="574" font-size="13" fill="#5A5A5A">Le contrefactuel ne se produit pas dans la salle : expérimentation et modèle</text>
    <text class="body" x="404" y="594" font-size="13" fill="#5A5A5A">de mix restent nécessaires, et leur coût ne baisse pas d'un euro.</text>
    <text class="mono" x="924" y="582" font-size="12" font-weight="600" fill="#B7332C">ABSENT</text>
  </g>

  <rect x="70" y="626" width="1060" height="52" rx="3" fill="#B8B5AE" fill-opacity=".16" stroke="#B8B5AE" stroke-width="1.25"/>
  <text class="body" x="90" y="650" font-size="13" fill="#1A1A1A">Seul ordre de grandeur agrégé disponible : environ 880 000 dollars pour un déploiement d'entreprise. Source commerciale, sans méthodologie publiée.</text>
  <text class="body" x="90" y="670" font-size="13" font-style="italic" fill="#B7332C">Le ratio utile n'est pas ce montant : c'est sa part rapportée au budget de mesure hors salle, qui devrait rester la plus grosse.</text>

  <line x1="60" y1="712" x2="1140" y2="712" stroke="#E5E1D8" stroke-width="1"/>
  <text class="body" x="60" y="738" font-size="12" font-style="italic" fill="#5A5A5A">Sources : documentation des éditeurs ; recommandations IAB Tech Lab v1.0 ; retours d'implémentation publics.</text>
  <text class="body" x="60" y="760" font-size="12" font-style="italic" fill="#5A5A5A">Le montant cité est un repère de discussion budgétaire, pas un fait audité.</text>
</svg>
