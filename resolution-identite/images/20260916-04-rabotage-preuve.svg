<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le rabotage de la preuve : effet des faux liens et des faux non-liens sur une estimation d'incrémentalité, et passage sous le seuil de détectabilité">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le rabotage de la preuve</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Les deux erreurs d'appariement ne dégradent pas l'estimation de la même façon, et la plus grave ressemble à de la prudence.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="220" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">EFFET INCRÉMENTAL ESTIMÉ  →</text>

  <!-- zone sous le seuil -->
  <rect x="220" y="212" width="520" height="380" fill="#B8B5AE" fill-opacity="0.13"/>
  <text x="236" y="234" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">ZONE OÙ UNE DIRECTION LIT « PAS D'EFFET MESURABLE »</text>

  <!-- axe zéro -->
  <line x1="220" y1="212" x2="220" y2="612" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="220" y="632" class="mono" font-size="12" fill="#1A1A1A" text-anchor="middle">0</text>

  <!-- seuil -->
  <line x1="740" y1="212" x2="740" y2="612" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="740" y="632" class="mono" font-size="11.5" font-weight="600" fill="#B7332C" text-anchor="middle">seuil de détectabilité du budget de test</text>

  <!-- barre 1 -->
  <g class="interactive" data-card="effet-vrai" tabindex="0" role="button" aria-label="L'effet réel — cliquez pour les détails">
    <rect x="64" y="256" width="1072" height="70" fill="#1F5560" fill-opacity="0.001"/>
    <text x="64" y="278" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">GRAPHE PARFAIT</text>
    <text x="64" y="300" class="display" font-size="17" font-weight="600" fill="#1A1A1A">L'effet réel</text>
    <rect x="220" y="266" width="760" height="46" rx="3" fill="#1F5560" fill-opacity="0.75"/>
    <text x="1000" y="295" class="body" font-size="13" font-weight="600" fill="#1F5560">Conclusion : effet établi</text>
  </g>

  <!-- barre 2 -->
  <g class="interactive" data-card="attenuation" tabindex="0" role="button" aria-label="L'atténuation induite par les faux liens — cliquez pour les détails">
    <rect x="64" y="366" width="1072" height="70" fill="#B7332C" fill-opacity="0.001"/>
    <text x="64" y="388" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">FAUX LIENS  ·  TAUX µ</text>
    <text x="64" y="410" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Atténuation</text>
    <rect x="220" y="376" width="450" height="46" rx="3" fill="#B7332C" fill-opacity="0.7"/>
    <path d="M 968 399 L 692 399" fill="none" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arrow04)"/>
    <text x="830" y="390" class="body" font-size="12.5" font-weight="600" fill="#B7332C" text-anchor="middle">Biais systématique vers zéro</text>
    <text x="830" y="422" class="body" font-size="12" fill="#5A5A5A" text-anchor="middle">Le comportement de deux personnes mélangé aplatit la pente.</text>
  </g>

  <!-- barre 3 -->
  <g class="interactive" data-card="selection" tabindex="0" role="button" aria-label="Le biais de sélection induit par les faux non-liens — cliquez pour les détails">
    <rect x="64" y="476" width="1072" height="90" fill="#B58A2C" fill-opacity="0.001"/>
    <text x="64" y="498" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A6A1E">FAUX NON-LIENS  ·  TAUX λ</text>
    <text x="64" y="520" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Sélection</text>
    <rect x="220" y="486" width="330" height="46" rx="3" fill="#B58A2C" fill-opacity="0.65"/>
    <line x1="430" y1="509" x2="700" y2="509" stroke="#8A6A1E" stroke-width="1.5"/>
    <line x1="430" y1="500" x2="430" y2="518" stroke="#8A6A1E" stroke-width="1.5"/>
    <line x1="700" y1="500" x2="700" y2="518" stroke="#8A6A1E" stroke-width="1.5"/>
    <text x="565" y="552" class="body" font-size="12" fill="#5A5A5A" text-anchor="middle">Les non-appariés sont les personnes mobiles, récentes, peu connectées :</text>
    <text x="565" y="570" class="body" font-size="12" fill="#5A5A5A" text-anchor="middle">l'estimation porte sur une population différente de celle qu'on visait.</text>
  </g>

  <!-- lecture -->
  <g class="interactive" data-card="lecture-direction" tabindex="0" role="button" aria-label="Ce qu'une direction lit — cliquez pour les détails">
    <rect x="64" y="660" width="1072" height="88" rx="3" fill="#B7332C" fill-opacity="0.09" stroke="#B7332C" stroke-width="1.25"/>
    <text x="88" y="688" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QUI ARRIVE EN COMITÉ</text>
    <text x="88" y="716" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Un résultat atténué se lit comme un résultat honnête.</text>
    <text x="88" y="740" class="body" font-size="12.5" fill="#5A5A5A">Personne ne soupçonne un chiffre modeste d'être un artefact de mesure. Un chiffre spectaculaire, lui, aurait déclenché une vérification.</text>
  </g>

  <line x1="64" y1="770" x2="1136" y2="770" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="790" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : Harron et al., Int. J. Epidemiol. 48(6), 2019 ; « Analysis of Linked Files: A Missing Data Perspective », arXiv:2406.14717, 2024. Barres illustratives, non issues d'une mesure terrain.</text>
</svg>
