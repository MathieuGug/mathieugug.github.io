<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-label="La dissymétrie des deux erreurs d'appariement : matrice vérité contre décision, et comparaison du faux non-lien et de la fausse fusion">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="850" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La dissymétrie des deux erreurs</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Les deux cases fautives d'un appariement n'ont ni la même visibilité, ni la même portée, ni le même coût de retour en arrière.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- en-têtes colonnes -->
  <text x="64" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">RÉALITÉ  ↓    DÉCISION DU GRAPHE  →</text>
  <text x="470" y="228" class="mono" font-size="11.5" letter-spacing="0.09em" fill="#1A1A1A" text-anchor="middle">IL LIE</text>
  <text x="890" y="228" class="mono" font-size="11.5" letter-spacing="0.09em" fill="#1A1A1A" text-anchor="middle">IL NE LIE PAS</text>

  <!-- libellés lignes -->
  <text x="64" y="300" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Une seule</text>
  <text x="64" y="322" class="display" font-size="17" font-weight="600" fill="#1A1A1A">et même personne</text>
  <text x="64" y="520" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Deux personnes</text>
  <text x="64" y="542" class="display" font-size="17" font-weight="600" fill="#1A1A1A">distinctes</text>

  <!-- cellule 1 : vrai lien -->
  <rect x="260" y="244" width="420" height="192" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="284" y="278" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">CAS JUSTE</text>
  <text x="284" y="310" class="display" font-size="21" font-weight="600" fill="#5A5A5A">Le vrai lien</text>
  <text x="284" y="340" class="body" font-size="13" fill="#8A8478">Le graphe reconnaît la personne</text>
  <text x="284" y="360" class="body" font-size="13" fill="#8A8478">qu'il devait reconnaître.</text>
  <text x="284" y="398" class="body" font-size="12.5" fill="#8A8478">C'est ce que l'acheteur croit acheter,</text>
  <text x="284" y="416" class="body" font-size="12.5" fill="#8A8478">et la seule case jamais mesurée seule.</text>

  <!-- cellule 2 : faux non-lien -->
  <g class="interactive" data-card="faux-non-lien" tabindex="0" role="button" aria-label="Le faux non-lien — cliquez pour les détails">
    <rect x="700" y="244" width="420" height="192" rx="3" fill="#B58A2C" fill-opacity="0.11" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="700" y="244" width="5" height="192" fill="#B58A2C"/>
    <text x="724" y="278" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">ERREUR 1  ·  TAUX λ</text>
    <text x="724" y="310" class="display" font-size="21" font-weight="600" fill="#8A6A1E">Le faux non-lien</text>
    <text x="724" y="340" class="body" font-size="13" fill="#5A5A5A">Le même client compté deux fois,</text>
    <text x="724" y="360" class="body" font-size="13" fill="#5A5A5A">une exclusion qui ne s'applique pas.</text>
    <rect x="724" y="378" width="372" height="40" rx="3" fill="#B58A2C" fill-opacity="0.16"/>
    <text x="740" y="395" class="body" font-size="12.5" font-weight="600" fill="#8A6A1E">Coût : de la portée perdue.</text>
    <text x="740" y="412" class="body" font-size="12.5" fill="#8A6A1E">Visible en console, la semaine même.</text>
  </g>

  <!-- cellule 3 : fausse fusion -->
  <g class="interactive" data-card="fausse-fusion" tabindex="0" role="button" aria-label="La fausse fusion — cliquez pour les détails">
    <rect x="260" y="460" width="420" height="192" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="260" y="460" width="5" height="192" fill="#B7332C"/>
    <text x="284" y="494" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ERREUR 2  ·  TAUX µ</text>
    <text x="284" y="526" class="display" font-size="21" font-weight="600" fill="#B7332C">La fausse fusion</text>
    <text x="284" y="556" class="body" font-size="13" fill="#5A5A5A">Deux individus réunis dans un seul</text>
    <text x="284" y="576" class="body" font-size="13" fill="#5A5A5A">profil, plus riche que tous les autres.</text>
    <rect x="284" y="594" width="372" height="40" rx="3" fill="#B7332C" fill-opacity="0.16"/>
    <text x="300" y="611" class="body" font-size="12.5" font-weight="600" fill="#B7332C">Coût : de la mesure et du droit.</text>
    <text x="300" y="628" class="body" font-size="12.5" fill="#B7332C">Invisible au point d'origine.</text>
  </g>

  <!-- cellule 4 : vrai non-lien -->
  <rect x="700" y="460" width="420" height="192" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="724" y="494" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">CAS JUSTE</text>
  <text x="724" y="526" class="display" font-size="21" font-weight="600" fill="#5A5A5A">Le vrai non-lien</text>
  <text x="724" y="556" class="body" font-size="13" fill="#8A8478">Le graphe a refusé un rapprochement</text>
  <text x="724" y="576" class="body" font-size="13" fill="#8A8478">que la preuve ne soutenait pas.</text>
  <text x="724" y="614" class="body" font-size="12.5" fill="#8A8478">Il fait baisser le taux d'appariement,</text>
  <text x="724" y="632" class="body" font-size="12.5" fill="#8A8478">donc l'argument de vente.</text>

  <!-- bande comparative -->
  <g class="interactive" data-card="regle-marche" tabindex="0" role="button" aria-label="La règle de marché qui en découle — cliquez pour les détails">
    <rect x="64" y="684" width="1072" height="110" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
    <text x="88" y="712" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">LA RÈGLE QUI EN DÉCOULE</text>
    <text x="88" y="742" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Un fournisseur optimise l'erreur que l'acheteur mesure, et l'acheteur ne mesure que celle qu'il voit.</text>
    <text x="88" y="768" class="body" font-size="12.5" fill="#5A5A5A">Sans exigence écrite sur µ, aucun mécanisme de marché ne pousse à réduire la fausse fusion, et un mécanisme puissant pousse à l'accepter :</text>
    <text x="88" y="786" class="body" font-size="12.5" fill="#5A5A5A">elle augmente le taux d'appariement, le seul chiffre qui circule entre le fournisseur et le comité d'achat.</text>
  </g>

  <line x1="64" y1="816" x2="1136" y2="816" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="838" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : Fellegi &amp; Sunter (1969) pour la définition des deux taux ; Harron et al., International Journal of Epidemiology, 48(6), 2019, pour la typologie des erreurs. Lecture de l'auteur pour l'économie de chaque case.</text>
</svg>
