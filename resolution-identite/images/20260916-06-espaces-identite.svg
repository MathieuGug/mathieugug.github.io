<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" role="img" aria-label="La carte des espaces d'identité : quatre familles rangées par ce qu'elles exigent en entrée, ce qu'elles garantissent et ce qu'elles ne déclarent pas">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="870" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La carte des espaces d'identité</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre familles, quatre définitions de « la même personne », et une colonne de droite qu'aucune d'elles ne remplit.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">FAMILLE</text>
  <text x="376" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">ENTRÉE EXIGÉE</text>
  <text x="636" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">CE QUI EST GARANTI</text>
  <text x="896" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">CE QUI N'EST PAS DÉCLARÉ</text>
  <line x1="64" y1="208" x2="1136" y2="208" stroke="#E5E1D8" stroke-width="1"/>

  <!-- 1 -->
  <g class="interactive" data-card="identite-authentifiee" tabindex="0" role="button" aria-label="Identifiant dérivé d'une authentification — cliquez pour les détails">
    <rect x="64" y="222" width="1072" height="96" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="222" width="5" height="96" fill="#1F5560"/>
    <text x="88" y="250" class="mono" font-size="11" fill="#1F5560">F1</text>
    <text x="88" y="276" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Dérivé d'une</text>
    <text x="88" y="298" class="display" font-size="18" font-weight="600" fill="#1A1A1A">authentification</text>
    <text x="376" y="252" class="body" font-size="12.5" fill="#5A5A5A">Une adresse fournie par</text>
    <text x="376" y="270" class="body" font-size="12.5" fill="#5A5A5A">l'utilisateur connecté, hachée</text>
    <text x="376" y="288" class="body" font-size="12.5" fill="#5A5A5A">et salée, avec consentement</text>
    <text x="376" y="306" class="body" font-size="12.5" fill="#5A5A5A">explicite et rotation périodique.</text>
    <text x="636" y="252" class="body" font-size="12.5" fill="#1F5560">La provenance de l'entrée</text>
    <text x="636" y="270" class="body" font-size="12.5" fill="#1F5560">et la traçabilité du</text>
    <text x="636" y="288" class="body" font-size="12.5" fill="#1F5560">consentement associé.</text>
    <text x="896" y="252" class="body" font-size="12.5" fill="#B7332C">La règle qui rapproche deux</text>
    <text x="896" y="270" class="body" font-size="12.5" fill="#B7332C">adresses d'une même personne,</text>
    <text x="896" y="288" class="body" font-size="12.5" fill="#B7332C">et le taux de fausse fusion</text>
    <text x="896" y="306" class="body" font-size="12.5" fill="#B7332C">qui en résulte.</text>
  </g>

  <!-- 2 -->
  <g class="interactive" data-card="identite-inferee" tabindex="0" role="button" aria-label="Identifiant émis pour trafic non authentifié — cliquez pour les détails">
    <rect x="64" y="330" width="1072" height="96" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="330" width="5" height="96" fill="#B58A2C"/>
    <text x="88" y="358" class="mono" font-size="11" fill="#8A6A1E">F2</text>
    <text x="88" y="384" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Émis pour trafic</text>
    <text x="88" y="406" class="display" font-size="18" font-weight="600" fill="#1A1A1A">non authentifié</text>
    <text x="376" y="360" class="body" font-size="12.5" fill="#5A5A5A">Aucune. L'identifiant est</text>
    <text x="376" y="378" class="body" font-size="12.5" fill="#5A5A5A">construit par inférence à partir</text>
    <text x="376" y="396" class="body" font-size="12.5" fill="#5A5A5A">de signaux d'appareil et de</text>
    <text x="376" y="414" class="body" font-size="12.5" fill="#5A5A5A">contexte.</text>
    <text x="636" y="360" class="body" font-size="12.5" fill="#1F5560">La couverture, qui est</text>
    <text x="636" y="378" class="body" font-size="12.5" fill="#1F5560">justement sa raison d'être</text>
    <text x="636" y="396" class="body" font-size="12.5" fill="#1F5560">et son argument de vente.</text>
    <text x="896" y="360" class="body" font-size="12.5" fill="#B7332C">Tout le reste. La famille où</text>
    <text x="896" y="378" class="body" font-size="12.5" fill="#B7332C">l'écart entre taux d'appariement</text>
    <text x="896" y="396" class="body" font-size="12.5" fill="#B7332C">et exactitude est le plus large.</text>
  </g>

  <!-- 3 -->
  <g class="interactive" data-card="graphe-plateforme" tabindex="0" role="button" aria-label="Graphe propriétaire de plateforme — cliquez pour les détails">
    <rect x="64" y="438" width="1072" height="96" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="438" width="5" height="96" fill="#B7332C"/>
    <text x="88" y="466" class="mono" font-size="11" fill="#B7332C">F3</text>
    <text x="88" y="492" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Graphe propriétaire</text>
    <text x="88" y="514" class="display" font-size="18" font-weight="600" fill="#1A1A1A">de plateforme</text>
    <text x="376" y="468" class="body" font-size="12.5" fill="#5A5A5A">Un compte utilisateur détenu</text>
    <text x="376" y="486" class="body" font-size="12.5" fill="#5A5A5A">par la plateforme, enrichi de</text>
    <text x="376" y="504" class="body" font-size="12.5" fill="#5A5A5A">tout ce qu'elle observe.</text>
    <text x="636" y="468" class="body" font-size="12.5" fill="#1F5560">Rien de vérifiable depuis</text>
    <text x="636" y="486" class="body" font-size="12.5" fill="#1F5560">l'extérieur. L'appariement</text>
    <text x="636" y="504" class="body" font-size="12.5" fill="#1F5560">s'exécute hors de votre vue.</text>
    <text x="896" y="468" class="body" font-size="12.5" fill="#B7332C">La règle, les seuils, la</text>
    <text x="896" y="486" class="body" font-size="12.5" fill="#B7332C">population de référence. Et la</text>
    <text x="896" y="504" class="body" font-size="12.5" fill="#B7332C">plateforme est aussi vendeuse</text>
    <text x="896" y="522" class="body" font-size="12.5" fill="#B7332C">de l'espace qu'on y mesure.</text>
  </g>

  <!-- 4 -->
  <g class="interactive" data-card="graphe-interne" tabindex="0" role="button" aria-label="Graphe interne de l'entreprise — cliquez pour les détails">
    <rect x="64" y="546" width="1072" height="96" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="546" width="5" height="96" fill="#1F5560"/>
    <text x="88" y="574" class="mono" font-size="11" fill="#1F5560">F4</text>
    <text x="88" y="600" class="display" font-size="18" font-weight="600" fill="#1F5560">Graphe interne</text>
    <text x="88" y="622" class="display" font-size="18" font-weight="600" fill="#1F5560">de l'entreprise</text>
    <text x="376" y="576" class="body" font-size="12.5" fill="#5A5A5A">Vos propres identifiants clients,</text>
    <text x="376" y="594" class="body" font-size="12.5" fill="#5A5A5A">et la qualité de vos référentiels,</text>
    <text x="376" y="612" class="body" font-size="12.5" fill="#5A5A5A">qui devient la contrainte réelle.</text>
    <text x="636" y="576" class="body" font-size="12.5" fill="#1F5560">Exactement ce que vous</text>
    <text x="636" y="594" class="body" font-size="12.5" fill="#1F5560">décidez d'exiger, puisque</text>
    <text x="636" y="612" class="body" font-size="12.5" fill="#1F5560">vous fixez les seuils.</text>
    <text x="896" y="576" class="body" font-size="12.5" fill="#1F5560">Rien, à condition de l'écrire.</text>
    <text x="896" y="594" class="body" font-size="12.5" fill="#5A5A5A">C'est la seule famille où la</text>
    <text x="896" y="612" class="body" font-size="12.5" fill="#5A5A5A">restauration du troisième</text>
    <text x="896" y="630" class="body" font-size="12.5" fill="#5A5A5A">verdict ne se négocie pas.</text>
  </g>

  <!-- trous -->
  <g class="interactive" data-card="trou-accreditation" tabindex="0" role="button" aria-label="Les deux trous du dispositif de transparence — cliquez pour les détails">
    <rect x="64" y="672" width="1072" height="128" rx="3" fill="#B7332C" fill-opacity="0.09" stroke="#B7332C" stroke-width="1.25"/>
    <text x="88" y="700" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QU'AUCUN DISPOSITIF DE TRANSPARENCE NE COUVRE</text>
    <text x="88" y="728" class="body" font-size="13" fill="#1A1A1A"><tspan font-weight="600">1.</tspan>  Le standard `id-sources.json` de l'IAB Tech Lab déclare <tspan font-weight="600">quels</tspan> identifiants circulent chez un acteur. Aucun champ ne porte la règle</text>
    <text x="110" y="748" class="body" font-size="13" fill="#1A1A1A">d'appariement, ses seuils, ni ses taux d'erreur.</text>
    <text x="88" y="774" class="body" font-size="13" fill="#1A1A1A"><tspan font-weight="600">2.</tspan>  L'accréditation de référence porte sur les <tspan font-weight="600">services de mesure</tspan>. La résolution d'identité qui les alimente reste hors champ : une</text>
    <text x="110" y="794" class="body" font-size="13" fill="#1A1A1A">couche auditée posée sur une couche qui ne l'est pas.</text>
  </g>

  <line x1="64" y1="822" x2="1136" y2="822" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="844" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : IAB Tech Lab, spécification `id-sources.json`, octobre 2021 ; Media Rating Council, Digital Advertising Auction Transparency Standards, janvier 2026.</text>
  <text x="64" y="862" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Les familles sont décrites par leur mécanisme, sans nommer de fournisseur : plusieurs offres commerciales combinent deux familles dans un même produit.</text>
</svg>
