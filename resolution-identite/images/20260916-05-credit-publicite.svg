<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-label="Ce que le crédit a tranché avant la publicité : comparaison du régime de l'erreur d'appariement dans le renseignement sur la solvabilité et dans la publicité">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="830" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce que le crédit a tranché avant la publicité</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Même opération technique, mêmes erreurs, deux régimes de preuve séparés par un demi-siècle.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="380" y="200" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">RENSEIGNEMENT SUR LA SOLVABILITÉ  ·  ÉTATS-UNIS</text>
  <text x="768" y="200" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">GRAPHE D'IDENTITÉ PUBLICITAIRE  ·  2026</text>
  <line x1="64" y1="210" x2="1136" y2="210" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ligne 1 -->
  <text x="64" y="248" class="body" font-size="13" font-weight="600" fill="#1A1A1A">L'erreur porte-t-elle</text>
  <text x="64" y="266" class="body" font-size="13" font-weight="600" fill="#1A1A1A">un nom ?</text>
  <rect x="368" y="222" width="382" height="76" rx="3" fill="#1F5560" fill-opacity="0.07"/>
  <text x="388" y="250" class="body" font-size="13" fill="#1A1A1A">Oui : le « mixed file », terme consacré</text>
  <text x="388" y="270" class="body" font-size="13" fill="#1A1A1A">par la jurisprudence et le régulateur.</text>
  <rect x="756" y="222" width="380" height="76" rx="3" fill="#B7332C" fill-opacity="0.07"/>
  <text x="776" y="250" class="body" font-size="13" fill="#1A1A1A">Aucun terme standard de marché.</text>
  <text x="776" y="270" class="body" font-size="13" fill="#1A1A1A">Le faux positif reste interne au</text>
  <text x="776" y="288" class="body" font-size="13" fill="#1A1A1A">fournisseur.</text>

  <!-- ligne 2 -->
  <g class="interactive" data-card="fcra-exactitude" tabindex="0" role="button" aria-label="La norme d'exactitude — cliquez pour les détails">
    <rect x="64" y="310" width="1072" height="76" fill="#1F5560" fill-opacity="0.001"/>
    <text x="64" y="338" class="body" font-size="13" font-weight="600" fill="#1A1A1A">La norme d'exactitude</text>
    <text x="64" y="356" class="body" font-size="13" font-weight="600" fill="#1A1A1A">est-elle écrite ?</text>
    <rect x="368" y="310" width="382" height="76" rx="3" fill="#1F5560" fill-opacity="0.07"/>
    <text x="388" y="338" class="body" font-size="13" fill="#1A1A1A">FCRA § 607(b), 1970 : procédures</text>
    <text x="388" y="358" class="body" font-size="13" fill="#1A1A1A">raisonnables pour assurer l'exactitude</text>
    <text x="388" y="376" class="body" font-size="13" fill="#1A1A1A">maximale possible.</text>
    <rect x="756" y="310" width="380" height="76" rx="3" fill="#B7332C" fill-opacity="0.07"/>
    <text x="776" y="338" class="body" font-size="13" fill="#1A1A1A">Aucune. Le contrat porte sur la</text>
    <text x="776" y="358" class="body" font-size="13" fill="#1A1A1A">disponibilité du service et sur le taux</text>
    <text x="776" y="376" class="body" font-size="13" fill="#1A1A1A">d'appariement.</text>
  </g>

  <!-- ligne 3 -->
  <g class="interactive" data-card="regle-illegale" tabindex="0" role="button" aria-label="Une règle d'appariement peut-elle être illégale — cliquez pour les détails">
    <rect x="64" y="398" width="1072" height="76" fill="#1F5560" fill-opacity="0.001"/>
    <text x="64" y="426" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Une règle d'appariement</text>
    <text x="64" y="444" class="body" font-size="13" font-weight="600" fill="#1A1A1A">peut-elle être illégale ?</text>
    <rect x="368" y="398" width="382" height="76" rx="3" fill="#1F5560" fill-opacity="0.13" stroke="#1F5560" stroke-width="1.5"/>
    <text x="388" y="426" class="body" font-size="13" font-weight="600" fill="#1F5560">Oui. Avis du CFPB, 4 novembre 2021 :</text>
    <text x="388" y="446" class="body" font-size="13" fill="#1A1A1A">l'appariement sur le seul nom se situe</text>
    <text x="388" y="464" class="body" font-size="13" fill="#1A1A1A">nettement en deçà de l'obligation.</text>
    <rect x="756" y="398" width="380" height="76" rx="3" fill="#B7332C" fill-opacity="0.07"/>
    <text x="776" y="426" class="body" font-size="13" fill="#1A1A1A">Question non tranchée. Aucune autorité</text>
    <text x="776" y="446" class="body" font-size="13" fill="#1A1A1A">européenne n'a qualifié une règle</text>
    <text x="776" y="464" class="body" font-size="13" fill="#1A1A1A">d'appariement publicitaire.</text>
  </g>

  <!-- ligne 4 -->
  <g class="interactive" data-card="clause-non-garantie" tabindex="0" role="button" aria-label="La clause de non-garantie — cliquez pour les détails">
    <rect x="64" y="486" width="1072" height="76" fill="#1F5560" fill-opacity="0.001"/>
    <text x="64" y="514" class="body" font-size="13" font-weight="600" fill="#1A1A1A">La clause de non-garantie</text>
    <text x="64" y="532" class="body" font-size="13" font-weight="600" fill="#1A1A1A">protège-t-elle ?</text>
    <rect x="368" y="486" width="382" height="76" rx="3" fill="#1F5560" fill-opacity="0.13" stroke="#1F5560" stroke-width="1.5"/>
    <text x="388" y="514" class="body" font-size="13" font-weight="600" fill="#1F5560">Non. Le régulateur avertit contre</text>
    <text x="388" y="534" class="body" font-size="13" fill="#1A1A1A">la mention indiquant que le rapport</text>
    <text x="388" y="552" class="body" font-size="13" fill="#1A1A1A">pourrait viser la mauvaise personne.</text>
    <rect x="756" y="486" width="380" height="76" rx="3" fill="#B7332C" fill-opacity="0.07"/>
    <text x="776" y="514" class="body" font-size="13" fill="#1A1A1A">Elle est la norme contractuelle :</text>
    <text x="776" y="534" class="body" font-size="13" fill="#1A1A1A">le fournisseur décline expressément</text>
    <text x="776" y="552" class="body" font-size="13" fill="#1A1A1A">l'exactitude des appariements.</text>
  </g>

  <!-- ligne 5 -->
  <g class="interactive" data-card="effet-demographique" tabindex="0" role="button" aria-label="Le profil démographique de l'erreur — cliquez pour les détails">
    <rect x="64" y="574" width="1072" height="76" fill="#1F5560" fill-opacity="0.001"/>
    <text x="64" y="602" class="body" font-size="13" font-weight="600" fill="#1A1A1A">L'erreur a-t-elle un profil</text>
    <text x="64" y="620" class="body" font-size="13" font-weight="600" fill="#1A1A1A">démographique ?</text>
    <rect x="368" y="574" width="382" height="76" rx="3" fill="#1F5560" fill-opacity="0.07"/>
    <text x="388" y="602" class="body" font-size="13" fill="#1A1A1A">Documenté : plus fréquente là où la</text>
    <text x="388" y="622" class="body" font-size="13" fill="#1A1A1A">diversité des patronymes est moindre</text>
    <text x="388" y="640" class="body" font-size="13" fill="#1A1A1A">au sein de la population.</text>
    <rect x="756" y="574" width="380" height="76" rx="3" fill="#B7332C" fill-opacity="0.07"/>
    <text x="776" y="602" class="body" font-size="13" fill="#1A1A1A">Le mécanisme est combinatoire, donc</text>
    <text x="776" y="622" class="body" font-size="13" fill="#1A1A1A">identique. Il n'est mesuré par personne,</text>
    <text x="776" y="640" class="body" font-size="13" fill="#1A1A1A">et il déploie un risque de discrimination.</text>
  </g>

  <!-- ligne 6 -->
  <text x="64" y="690" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Qui compte les erreurs ?</text>
  <rect x="368" y="662" width="382" height="76" rx="3" fill="#1F5560" fill-opacity="0.07"/>
  <text x="388" y="690" class="body" font-size="13" fill="#1A1A1A">Un régulateur, par les réclamations,</text>
  <text x="388" y="710" class="body" font-size="13" fill="#1A1A1A">les enquêtes et les contentieux</text>
  <text x="388" y="728" class="body" font-size="13" fill="#1A1A1A">individuels.</text>
  <rect x="756" y="662" width="380" height="76" rx="3" fill="#B7332C" fill-opacity="0.07"/>
  <text x="776" y="690" class="body" font-size="13" fill="#1A1A1A">Le fournisseur, qui publie la seule</text>
  <text x="776" y="710" class="body" font-size="13" fill="#1A1A1A">grandeur que son intérêt commercial</text>
  <text x="776" y="728" class="body" font-size="13" fill="#1A1A1A">lui commande de faire monter.</text>

  <line x1="64" y1="766" x2="1136" y2="766" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="788" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : Fair Credit Reporting Act § 607(b) ; CFPB, avis consultatif « Fair Credit Reporting; Name-Only Matching Procedures » et déclaration du directeur, 4 novembre 2021.</text>
  <text x="64" y="806" class="body" font-size="10.5" font-style="italic" fill="#8A8478">La transposition de la colonne de gauche à la colonne de droite est une lecture de l'auteur : aucune autorité européenne ne l'a à ce jour consacrée.</text>
</svg>
