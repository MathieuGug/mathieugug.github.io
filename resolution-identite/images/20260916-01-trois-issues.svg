<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-label="Trois issues, un seul chiffre : la décision d'appariement selon Fellegi et Sunter comparée à ce qu'un acheteur reçoit en 2026">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="830" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois issues, un seul chiffre</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce que la théorie de l'appariement impose depuis 1969, et ce qu'il en reste dans une proposition commerciale.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ===== BANDE 1969 ===== -->
  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">1969 · LE CADRE DE FELLEGI ET SUNTER</text>

  <g class="interactive" data-card="seuils-utilisateur" tabindex="0" role="button" aria-label="Les deux seuils fixés par l'utilisateur — cliquez pour les détails">
    <rect x="64" y="204" width="1072" height="46" rx="3" fill="#1F5560" fill-opacity="0.07"/>
    <text x="84" y="223" class="body" font-size="13" font-weight="600" fill="#1F5560">L'utilisateur déclare deux taux d'erreur AVANT l'appariement</text>
    <text x="84" y="241" class="body" font-size="12.5" fill="#5A5A5A">µ = probabilité de lier deux personnes distinctes  ·  λ = probabilité de ne pas lier deux enregistrements d'une même personne</text>
    <text x="1112" y="232" class="mono" font-size="16" fill="#1F5560" text-anchor="end">µ  λ</text>
  </g>

  <!-- axe poids de preuve -->
  <text x="64" y="282" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">POIDS DE PREUVE DE LA PAIRE COMPARÉE</text>
  <text x="1136" y="282" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478" text-anchor="end">FORT</text>

  <rect x="64" y="294" width="344" height="76" fill="#B8B5AE" fill-opacity="0.22"/>
  <rect x="408" y="294" width="304" height="76" fill="#B58A2C" fill-opacity="0.2"/>
  <rect x="712" y="294" width="424" height="76" fill="#1F5560" fill-opacity="0.14"/>
  <rect x="64" y="294" width="1072" height="76" fill="none" stroke="#E5E1D8" stroke-width="1.25"/>

  <text x="236" y="330" class="display" font-size="19" font-weight="600" fill="#5A5A5A" text-anchor="middle">Ne pas lier</text>
  <text x="236" y="352" class="body" font-size="12" fill="#8A8478" text-anchor="middle">Deux personnes différentes</text>
  <text x="924" y="330" class="display" font-size="19" font-weight="600" fill="#1F5560" text-anchor="middle">Lier</text>
  <text x="924" y="352" class="body" font-size="12" fill="#5A5A5A" text-anchor="middle">Une seule et même personne</text>

  <g class="interactive" data-card="zone-grise" tabindex="0" role="button" aria-label="La zone de lien possible — cliquez pour les détails">
    <rect x="408" y="294" width="304" height="76" fill="#B58A2C" fill-opacity="0.001"/>
    <text x="560" y="326" class="display" font-size="19" font-weight="600" fill="#8A6A1E" text-anchor="middle">Lien possible</text>
    <text x="560" y="346" class="body" font-size="12" font-weight="600" fill="#8A6A1E" text-anchor="middle">Renvoyé à une revue humaine</text>
    <text x="560" y="363" class="body" font-size="11.5" fill="#8A6A1E" text-anchor="middle">Le troisième verdict</text>
  </g>

  <!-- seuils -->
  <line x1="408" y1="286" x2="408" y2="386" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="712" y1="286" x2="712" y2="386" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="408" y="402" class="mono" font-size="12" font-weight="600" fill="#B7332C" text-anchor="middle">seuil λ</text>
  <text x="712" y="402" class="mono" font-size="12" font-weight="600" fill="#B7332C" text-anchor="middle">seuil µ</text>

  <text x="64" y="436" class="body" font-size="13" fill="#5A5A5A">La procédure optimale est celle qui <tspan font-weight="600" fill="#1A1A1A">minimise la largeur de la zone jaune</tspan> sous les deux contraintes déclarées. La zone ne disparaît jamais : elle rend l'incertitude visible.</text>

  <line x1="64" y1="466" x2="1136" y2="466" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ===== BANDE 2026 ===== -->
  <text x="64" y="500" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">2026 · CE QU'UN ACHETEUR REÇOIT</text>

  <g class="interactive" data-card="verdict-binaire" tabindex="0" role="button" aria-label="Le verdict binaire du marché — cliquez pour les détails">
    <rect x="64" y="516" width="1072" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="65" y="517" width="535" height="84" fill="#B8B5AE" fill-opacity="0.22"/>
    <rect x="600" y="517" width="535" height="84" fill="#1F5560" fill-opacity="0.14"/>
    <line x1="600" y1="508" x2="600" y2="620" stroke="#8A8478" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="332" y="556" class="display" font-size="19" font-weight="600" fill="#5A5A5A" text-anchor="middle">Non apparié</text>
    <text x="332" y="578" class="body" font-size="12" fill="#8A8478" text-anchor="middle">Retiré du livrable, sans motif</text>
    <text x="868" y="556" class="display" font-size="19" font-weight="600" fill="#1F5560" text-anchor="middle">Apparié</text>
    <text x="868" y="578" class="body" font-size="12" fill="#5A5A5A" text-anchor="middle">Livré comme certain, quelle que soit la preuve</text>
    <text x="600" y="636" class="mono" font-size="12" font-weight="600" fill="#5A5A5A" text-anchor="middle">seuil unique, non publié</text>
  </g>

  <text x="64" y="676" class="body" font-size="13" fill="#5A5A5A">La zone jaune a été <tspan font-weight="600" fill="#B7332C">absorbée</tspan> : le fournisseur la tranche en interne par une règle qu'il ne publie pas. Les deux taux d'erreur ne sont ni fixés ni mesurés.</text>

  <g class="interactive" data-card="chiffre-publie" tabindex="0" role="button" aria-label="Le seul chiffre publié — cliquez pour les détails">
    <rect x="64" y="696" width="1072" height="62" rx="3" fill="#B7332C" fill-opacity="0.09" stroke="#B7332C" stroke-width="1.25"/>
    <text x="88" y="722" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LE SEUL CHIFFRE QUI ARRIVE JUSQU'AU CONTRAT</text>
    <text x="88" y="746" class="body" font-size="13.5" fill="#1A1A1A">Taux d'appariement : part des enregistrements confiés qui ressortent avec un identifiant. Il monte quand on abaisse le seuil.</text>
    <text x="1112" y="738" class="mono" font-size="26" font-weight="600" fill="#B7332C" text-anchor="end">1 / 3</text>
  </g>

  <line x1="64" y1="784" x2="1136" y2="784" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="806" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Source : Fellegi &amp; Sunter, « A Theory for Record Linkage », Journal of the American Statistical Association, 64(328), 1969. Bande 2026 : reconstitution à partir des argumentaires publics des fournisseurs.</text>
</svg>
