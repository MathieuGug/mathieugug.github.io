<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-label="La propagation d'une fausse fusion : un seul faux lien hérité par les cinq usages qui consomment un graphe d'identité">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="830" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La propagation d'une fausse fusion</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un seul faux lien, cinq usages qui en héritent, et aucun qui dispose du moyen de le détecter par lui-même.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- origine -->
  <rect x="64" y="386" width="220" height="176" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2.5"/>
  <text x="88" y="416" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ORIGINE</text>
  <circle cx="126" cy="456" r="15" fill="none" stroke="#B7332C" stroke-width="1.5"/>
  <circle cx="158" cy="456" r="15" fill="none" stroke="#B7332C" stroke-width="1.5"/>
  <text x="192" y="461" class="mono" font-size="17" fill="#B7332C">= 1</text>
  <text x="88" y="500" class="display" font-size="18" font-weight="600" fill="#B7332C">Un faux lien</text>
  <text x="88" y="524" class="body" font-size="12.5" fill="#5A5A5A">Écrit une fois, à une date</text>
  <text x="88" y="542" class="body" font-size="12.5" fill="#5A5A5A">que personne ne consigne.</text>

  <text x="64" y="600" class="body" font-size="12" fill="#8A8478">La fusion n'émet aucun signal.</text>
  <text x="64" y="618" class="body" font-size="12" fill="#8A8478">Le profil obtenu paraît meilleur</text>
  <text x="64" y="636" class="body" font-size="12" fill="#8A8478">que les autres : plus riche,</text>
  <text x="64" y="654" class="body" font-size="12" fill="#8A8478">plus actif, plus multi-canal.</text>

  <text x="460" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">USAGE EN AVAL</text>
  <text x="1112" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">DÉTECTION POSSIBLE DEPUIS CET USAGE</text>

  <!-- flèches -->
  <path d="M 284 474 C 360 474, 380 256, 446 256" fill="none" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow03)"/>
  <path d="M 284 474 C 360 474, 380 366, 446 366" fill="none" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow03)"/>
  <path d="M 284 474 C 360 474, 380 476, 446 476" fill="none" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow03)"/>
  <path d="M 284 474 C 360 474, 380 586, 446 586" fill="none" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow03)"/>
  <path d="M 284 474 C 360 474, 380 696, 446 696" fill="none" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow03)"/>

  <!-- 1 activation -->
  <g class="interactive" data-card="usage-activation" tabindex="0" role="button" aria-label="Activation média — cliquez pour les détails">
    <rect x="460" y="212" width="676" height="88" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="484" y="240" class="mono" font-size="11" fill="#B7332C">A1</text>
    <text x="516" y="242" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Activation média</text>
    <text x="516" y="266" class="body" font-size="12.5" fill="#5A5A5A">Le budget d'une personne est dépensé sur deux, ou l'inverse. Le plafond de</text>
    <text x="516" y="284" class="body" font-size="12.5" fill="#5A5A5A">fréquence porte sur une entité qui n'existe pas.</text>
    <text x="1112" y="264" class="mono" font-size="13" font-weight="600" fill="#B7332C" text-anchor="end">Non</text>
  </g>

  <!-- 2 mesure -->
  <g class="interactive" data-card="usage-mesure" tabindex="0" role="button" aria-label="Mesure d'incrémentalité — cliquez pour les détails">
    <rect x="460" y="322" width="676" height="88" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="484" y="350" class="mono" font-size="11" fill="#B7332C">A2</text>
    <text x="516" y="352" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Mesure d'incrémentalité</text>
    <text x="516" y="376" class="body" font-size="12.5" fill="#5A5A5A">Une part du comportement du groupe témoin est attribuée au groupe traité.</text>
    <text x="516" y="394" class="body" font-size="12.5" fill="#5A5A5A">L'effet estimé est tiré vers zéro (voir schéma 04).</text>
    <text x="1112" y="374" class="mono" font-size="13" font-weight="600" fill="#B7332C" text-anchor="end">Non</text>
  </g>

  <!-- 3 exclusion -->
  <g class="interactive" data-card="usage-exclusion" tabindex="0" role="button" aria-label="Listes d'exclusion et de suppression — cliquez pour les détails">
    <rect x="460" y="432" width="676" height="88" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="484" y="460" class="mono" font-size="11" fill="#B7332C">A3</text>
    <text x="516" y="462" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Listes d'exclusion et de suppression</text>
    <text x="516" y="486" class="body" font-size="12.5" fill="#5A5A5A">Une opposition exprimée par une personne s'applique à une autre, ou ne</text>
    <text x="516" y="504" class="body" font-size="12.5" fill="#5A5A5A">s'applique pas à celle qui l'a exprimée.</text>
    <text x="1112" y="484" class="mono" font-size="13" font-weight="600" fill="#B7332C" text-anchor="end">Non</text>
  </g>

  <!-- 4 personnalisation -->
  <g class="interactive" data-card="usage-personnalisation" tabindex="0" role="button" aria-label="Personnalisation et éligibilité — cliquez pour les détails">
    <rect x="460" y="542" width="676" height="88" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="484" y="570" class="mono" font-size="11" fill="#B7332C">A4</text>
    <text x="516" y="572" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Personnalisation, tarification, éligibilité</text>
    <text x="516" y="596" class="body" font-size="12.5" fill="#5A5A5A">Un segment de valeur, une offre, un refus s'appuient sur un historique qui</text>
    <text x="516" y="614" class="body" font-size="12.5" fill="#5A5A5A">appartient pour partie à quelqu'un d'autre.</text>
    <text x="1112" y="594" class="mono" font-size="13" font-weight="600" fill="#B7332C" text-anchor="end">Non</text>
  </g>

  <!-- 5 droits -->
  <g class="interactive" data-card="usage-droits" tabindex="0" role="button" aria-label="Droits des personnes — cliquez pour les détails">
    <rect x="460" y="652" width="676" height="88" rx="3" fill="#B7332C" fill-opacity="0.09" stroke="#B7332C" stroke-width="1.5"/>
    <text x="484" y="680" class="mono" font-size="11" fill="#B7332C">A5</text>
    <text x="516" y="682" class="display" font-size="19" font-weight="600" fill="#B7332C">Droits d'accès et d'effacement</text>
    <text x="516" y="706" class="body" font-size="12.5" fill="#5A5A5A">Répondre à une demande d'accès sur une identité fusionnée communique les</text>
    <text x="516" y="724" class="body" font-size="12.5" fill="#5A5A5A">données d'un tiers. L'exercice d'un droit devient la violation d'un autre.</text>
    <text x="1112" y="704" class="mono" font-size="13" font-weight="600" fill="#B7332C" text-anchor="end">Par réclamation</text>
  </g>

  <line x1="64" y1="778" x2="1136" y2="778" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="800" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Lecture de l'auteur. Le régime probatoire de la case A5 s'appuie sur les articles 15 et 17 du règlement (UE) 2016/679 et sur les lignes directrices EDPB 01/2025 sur la pseudonymisation.</text>
  <text x="64" y="818" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Note de méthode : la colonne de droite décrit la capacité de détection depuis l'usage concerné, sans jeu de vérité terrain détenu par l'acheteur.</text>
</svg>
