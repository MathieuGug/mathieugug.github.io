<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Six décisions classées par la fenêtre pendant laquelle elles restent disponibles : avant signature, en exploitation, et à tout moment">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Six décisions, classées par la fenêtre où elles restent possibles</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le pouvoir de négociation décroît avec l'état accumulé. Ce qui se décide tard ne se décide plus.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Barre de pouvoir de négociation -->
  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">POUVOIR DE NÉGOCIATION</text>
  <rect x="330" y="178" width="806" height="16" rx="8" fill="#E5E1D8"/>
  <rect x="330" y="178" width="300" height="16" rx="8" fill="#4A7C59"/>
  <rect x="630" y="178" width="240" height="16" fill="#B58A2C"/>
  <rect x="870" y="178" width="266" height="16" rx="8" fill="#B7332C"/>
  <text x="360" y="191" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#FFFFFF">INTACT</text>
  <text x="660" y="191" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#FFFFFF">ENTAMÉ</text>
  <text x="900" y="191" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#FFFFFF">RÉSIDUEL</text>

  <!-- Avant signature -->
  <g class="interactive" data-card="avant-signature" tabindex="0" role="button" aria-label="Trois exigences contractuelles avant signature — cliquez pour les détails">
    <rect x="64" y="216" width="1072" height="212" rx="3" fill="#FFFFFF" stroke="#4A7C59" stroke-width="1.75"/>
    <rect x="64" y="216" width="5" height="212" fill="#4A7C59"/>
    <text x="94" y="246" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">FENÊTRE 1 · AVANT SIGNATURE — TROIS EXIGENCES CONTRACTUELLES</text>

    <rect x="94" y="264" width="320" height="146" rx="3" fill="#4A7C59" fill-opacity="0.07"/>
    <text x="114" y="292" class="mono" font-size="11" fill="#4A7C59">D1</text>
    <text x="114" y="318" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Export périodique</text>
    <text x="114" y="338" class="display" font-size="17" font-weight="600" fill="#1A1A1A">et automatisé de l'état</text>
    <text x="114" y="364" class="body" font-size="12.5" fill="#5A5A5A">Les cinq surfaces nommées, un format</text>
    <text x="114" y="382" class="body" font-size="12.5" fill="#5A5A5A">documenté, un rythme, et aucune</text>
    <text x="114" y="400" class="body" font-size="12.5" fill="#5A5A5A">intervention du fournisseur.</text>

    <rect x="440" y="264" width="320" height="146" rx="3" fill="#4A7C59" fill-opacity="0.07"/>
    <text x="460" y="292" class="mono" font-size="11" fill="#4A7C59">D2</text>
    <text x="460" y="318" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Définition versionnée</text>
    <text x="460" y="338" class="display" font-size="17" font-weight="600" fill="#1A1A1A">de « ce qui est exportable »</text>
    <text x="460" y="364" class="body" font-size="12.5" fill="#5A5A5A">Le règlement impose la transparence</text>
    <text x="460" y="382" class="body" font-size="12.5" fill="#5A5A5A">sur la migration. Il n'impose pas de</text>
    <text x="460" y="400" class="body" font-size="12.5" fill="#5A5A5A">figer le périmètre. Faites-le écrire.</text>

    <rect x="786" y="264" width="320" height="146" rx="3" fill="#4A7C59" fill-opacity="0.07"/>
    <text x="806" y="292" class="mono" font-size="11" fill="#4A7C59">D3</text>
    <text x="806" y="318" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Communication des traces</text>
    <text x="806" y="338" class="display" font-size="17" font-weight="600" fill="#1A1A1A">et des versions</text>
    <text x="806" y="364" class="body" font-size="12.5" fill="#5A5A5A">Un délai, un format exploitable.</text>
    <text x="806" y="382" class="body" font-size="12.5" fill="#5A5A5A">La même clause sert deux fois :</text>
    <text x="806" y="400" class="body" font-size="12.5" fill="#5A5A5A">pour se défendre, et pour partir.</text>
  </g>

  <!-- En exploitation -->
  <g class="interactive" data-card="en-exploitation" tabindex="0" role="button" aria-label="Deux règles internes en exploitation — cliquez pour les détails">
    <rect x="64" y="444" width="1072" height="176" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="444" width="5" height="176" fill="#B58A2C"/>
    <text x="94" y="474" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">FENÊTRE 2 · EN EXPLOITATION — DEUX RÈGLES INTERNES, À COÛT QUASI NUL</text>

    <g class="interactive" data-card="decision-gratuite" tabindex="0" role="button" aria-label="La décision gratuite : le jeu d'évaluation vit dans votre dépôt — cliquez pour les détails">
      <rect x="94" y="492" width="493" height="110" rx="3" fill="#4A7C59" fill-opacity="0.1" stroke="#4A7C59" stroke-width="1.5"/>
      <text x="114" y="518" class="mono" font-size="11" fill="#4A7C59">D4 · LA PLUS RENTABLE DU DOSSIER</text>
      <text x="114" y="546" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Le jeu d'évaluation vit dans votre dépôt</text>
      <text x="114" y="572" class="body" font-size="12.5" fill="#5A5A5A">Elle ne coûte rien, elle se prend le premier jour,</text>
      <text x="114" y="590" class="body" font-size="12.5" fill="#5A5A5A">et elle est irrattrapable le dernier.</text>
    </g>

    <rect x="613" y="492" width="493" height="110" rx="3" fill="#B58A2C" fill-opacity="0.08"/>
    <text x="633" y="518" class="mono" font-size="11" fill="#B58A2C">D5</text>
    <text x="633" y="546" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Le registre des habilitations tenu en double</text>
    <text x="633" y="572" class="body" font-size="12.5" fill="#5A5A5A">Un agent, un accès, un propriétaire métier, une date.</text>
    <text x="633" y="590" class="body" font-size="12.5" fill="#5A5A5A">Ce qui transforme une enquête en chantier borné.</text>
  </g>

  <!-- À tout moment -->
  <g class="interactive" data-card="apres" tabindex="0" role="button" aria-label="La décision d'organisation, disponible à tout moment — cliquez pour les détails">
    <rect x="64" y="636" width="1072" height="112" rx="3" fill="#1A1A1A"/>
    <text x="94" y="666" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">FENÊTRE 3 · À TOUT MOMENT — UNE DÉCISION D'ORGANISATION</text>
    <text x="94" y="696" class="display" font-size="19" font-weight="600" fill="#FAF8F3">D6 · Quelqu'un est responsable du coût de sortie, et le révise chaque année</text>
    <text x="94" y="720" class="body" font-size="12.5" fill="#C9C3B6">Pas de la migration, qui n'aura peut-être jamais lieu. De son estimation sur les cinq postes.</text>
    <text x="94" y="740" class="body" font-size="12.5" font-style="italic" fill="#E8B84B">Un coût de sortie que personne n'a chiffré devient une raison de rester.</text>
  </g>

  <text x="64" y="786" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">CLASSEMENT PAR FENÊTRE DE DÉCISION : GRILLE PROPRE À CE DOSSIER.</text>
</svg>
