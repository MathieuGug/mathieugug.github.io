<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="La facture de sortie d'une plateforme agentique en cinq postes, dont aucun ne figure sur une grille tarifaire">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="820" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La facture de sortie en cinq postes</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Aucun de ces postes ne figure sur une grille tarifaire, et le règlement européen n'en supprime aucun.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">POSTE</text>
  <text x="470" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">DANS QUELLE UNITÉ IL SE MESURE</text>
  <text x="1106" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">RÉDUCTIBLE PAR UNE DÉCISION ?</text>

  <!-- P1 -->
  <g class="interactive" data-card="poste-reaccumulation" tabindex="0" role="button" aria-label="Poste 1, re-accumulation de la mémoire — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="104" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.75"/>
    <rect x="64" y="206" width="5" height="104" fill="#B7332C"/>
    <text x="94" y="236" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">P1</text>
    <text x="94" y="264" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Re-accumulation</text>
    <text x="94" y="288" class="body" font-size="12.5" fill="#8A8478">de la mémoire longue</text>

    <text x="470" y="240" class="body" font-size="13.5" fill="#5A5A5A">Des mois de trafic réel, pas des jours-homme.</text>
    <text x="470" y="264" class="body" font-size="13" fill="#5A5A5A">Le nouvel agent n'atteint la qualité de personnalisation</text>
    <text x="470" y="284" class="body" font-size="13" fill="#5A5A5A">de l'ancien qu'après une durée que vous ne fixez pas.</text>

    <text x="1106" y="270" class="mono" font-size="12" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">NON</text>
  </g>

  <!-- P2 -->
  <g class="interactive" data-card="poste-rehabilitation" tabindex="0" role="button" aria-label="Poste 2, ré-habilitation des identités — cliquez pour les détails">
    <rect x="64" y="322" width="1072" height="104" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="322" width="5" height="104" fill="#B7332C"/>
    <text x="94" y="352" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">P2</text>
    <text x="94" y="380" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Ré-habilitation</text>
    <text x="94" y="404" class="body" font-size="12.5" fill="#8A8478">des identités d'agents</text>

    <text x="470" y="356" class="body" font-size="13.5" fill="#5A5A5A">Nombre d'habilitations × délai de re-signature métier.</text>
    <text x="470" y="380" class="body" font-size="13" fill="#5A5A5A">Un travail d'organisation, mené par des personnes qui</text>
    <text x="470" y="400" class="body" font-size="13" fill="#5A5A5A">n'ont aucun intérêt au projet de migration.</text>

    <text x="1106" y="386" class="mono" font-size="12" letter-spacing="0.08em" fill="#B58A2C" text-anchor="end">EN PARTIE</text>
  </g>

  <!-- P3 -->
  <g class="interactive" data-card="poste-recatalogage" tabindex="0" role="button" aria-label="Poste 3, re-catalogage des outils — cliquez pour les détails">
    <rect x="64" y="438" width="1072" height="104" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="438" width="5" height="104" fill="#B58A2C"/>
    <text x="94" y="468" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">P3</text>
    <text x="94" y="496" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Re-catalogage</text>
    <text x="94" y="520" class="body" font-size="12.5" fill="#8A8478">des outils gouvernés</text>

    <text x="470" y="472" class="body" font-size="13.5" fill="#5A5A5A">Un outil × un propriétaire × un historique de version.</text>
    <text x="470" y="496" class="body" font-size="13" fill="#5A5A5A">Le branchement protocolaire prend une semaine.</text>
    <text x="470" y="516" class="body" font-size="13" fill="#5A5A5A">La redéclaration des règles d'accès prend des trimestres.</text>

    <text x="1106" y="502" class="mono" font-size="12" letter-spacing="0.08em" fill="#B58A2C" text-anchor="end">EN PARTIE</text>
  </g>

  <!-- P4 -->
  <g class="interactive" data-card="poste-reevaluation" tabindex="0" role="button" aria-label="Poste 4, ré-étalonnage de l'évaluation — cliquez pour les détails">
    <rect x="64" y="554" width="1072" height="104" rx="3" fill="#FFFFFF" stroke="#4A7C59" stroke-width="1.75"/>
    <rect x="64" y="554" width="5" height="104" fill="#4A7C59"/>
    <text x="94" y="584" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">P4</text>
    <text x="94" y="612" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Ré-étalonnage</text>
    <text x="94" y="636" class="body" font-size="12.5" fill="#8A8478">du jeu d'évaluation</text>

    <text x="470" y="588" class="body" font-size="13.5" fill="#5A5A5A">Zéro, ou la totalité. Il n'y a pas d'intermédiaire.</text>
    <text x="470" y="612" class="body" font-size="13" fill="#5A5A5A">Le seul poste que l'on ramène à zéro par une décision</text>
    <text x="470" y="632" class="body" font-size="13" fill="#5A5A5A">gratuite, prise le premier jour du projet.</text>

    <text x="1106" y="618" class="mono" font-size="12" letter-spacing="0.08em" fill="#4A7C59" text-anchor="end">OUI, À ZÉRO</text>
  </g>

  <!-- P5 -->
  <g class="interactive" data-card="poste-double-run" tabindex="0" role="button" aria-label="Poste 5, double exploitation — cliquez pour les détails">
    <rect x="64" y="670" width="1072" height="104" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="670" width="5" height="104" fill="#1F5560"/>
    <text x="94" y="700" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">P5</text>
    <text x="94" y="728" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Double exploitation</text>
    <text x="94" y="752" class="body" font-size="12.5" fill="#8A8478">pendant le recouvrement</text>

    <text x="470" y="704" class="body" font-size="13.5" fill="#5A5A5A">Deux plateformes facturées en parallèle × la durée de bascule.</text>
    <text x="470" y="728" class="body" font-size="13" fill="#5A5A5A">On ne bascule pas un agent en contact client d'un jour</text>
    <text x="470" y="748" class="body" font-size="13" fill="#5A5A5A">à l'autre, et la durée dépend directement du poste 1.</text>

    <text x="1106" y="734" class="mono" font-size="12" letter-spacing="0.08em" fill="#1F5560" text-anchor="end">DÉRIVÉ DE P1</text>
  </g>

  <text x="64" y="806" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">DÉCOMPOSITION EN CINQ POSTES ET LECTURE PAR LA RÉDUCTIBILITÉ : PROPRES À CE DOSSIER.</text>
</svg>
