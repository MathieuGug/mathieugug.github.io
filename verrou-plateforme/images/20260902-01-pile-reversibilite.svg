<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="La pile agentique rangée par réversibilité : le modèle est la couche la plus interchangeable, l'état accumulé la plus verrouillante">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La pile agentique rangée par réversibilité</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Les comparatifs de plateformes portent sur l'étage du haut. Le coût de sortie se joue à celui du bas.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">COUCHE</text>
  <text x="470" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUI CHANGE SI VOUS CHANGEZ DE FOURNISSEUR</text>
  <text x="1106" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">COÛT DE SORTIE</text>

  <!-- Couche 1 : modèle -->
  <g class="interactive" data-card="couche-modele" tabindex="0" role="button" aria-label="Couche modèle — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="94" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="5" height="94" fill="#4A7C59"/>
    <text x="94" y="238" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">COUCHE 1</text>
    <text x="94" y="266" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le modèle</text>
    <text x="94" y="288" class="body" font-size="12" fill="#8A8478">Catalogue, versions, tarifs au jeton</text>

    <text x="470" y="242" class="body" font-size="13.5" fill="#5A5A5A">Une campagne de non-régression sur les invites et les sorties.</text>
    <text x="470" y="264" class="body" font-size="13.5" fill="#5A5A5A">Un travail connu, chiffrable, dont on sait quand il est fini.</text>
    <text x="470" y="288" class="body" font-size="12.5" font-style="italic" fill="#4A7C59">C'est l'étage que tous les comparatifs comparent.</text>

    <text x="1106" y="266" class="mono" font-size="13" letter-spacing="0.08em" fill="#4A7C59" text-anchor="end">BORNÉ</text>
  </g>

  <!-- Couche 2 : cadre -->
  <g class="interactive" data-card="couche-cadre" tabindex="0" role="button" aria-label="Couche cadre logiciel et protocoles — cliquez pour les détails">
    <rect x="64" y="312" width="1072" height="94" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="312" width="5" height="94" fill="#4A7C59"/>
    <text x="94" y="344" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">COUCHE 2</text>
    <text x="94" y="372" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le cadre et les protocoles</text>
    <text x="94" y="394" class="body" font-size="12" fill="#8A8478">ADK · LangGraph · CrewAI · MCP · A2A</text>

    <text x="470" y="348" class="body" font-size="13.5" fill="#5A5A5A">Peu de chose : les cadres sont multi-plateformes et les protocoles</text>
    <text x="470" y="370" class="body" font-size="13.5" fill="#5A5A5A">sont hébergés par une fondation commune depuis décembre 2025.</text>
    <text x="470" y="394" class="body" font-size="12.5" font-style="italic" fill="#4A7C59">La partie du problème qui a été résolue.</text>

    <text x="1106" y="372" class="mono" font-size="13" letter-spacing="0.08em" fill="#4A7C59" text-anchor="end">FAIBLE</text>
  </g>

  <!-- Couche 3 : exécution -->
  <g class="interactive" data-card="couche-execution" tabindex="0" role="button" aria-label="Couche exécution gérée — cliquez pour les détails">
    <rect x="64" y="418" width="1072" height="94" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="418" width="5" height="94" fill="#B58A2C"/>
    <text x="94" y="450" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">COUCHE 3</text>
    <text x="94" y="478" class="display" font-size="21" font-weight="600" fill="#1A1A1A">L'exécution gérée</text>
    <text x="94" y="500" class="body" font-size="12" fill="#8A8478">Sessions, isolation, mise à l'échelle</text>

    <text x="470" y="454" class="body" font-size="13.5" fill="#5A5A5A">Un ré-empaquetage et une bascule de trafic. Techniquement lourd,</text>
    <text x="470" y="476" class="body" font-size="13.5" fill="#5A5A5A">mais entièrement sous votre contrôle et sans dépendance externe.</text>
    <text x="470" y="500" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">Un projet, pas une négociation.</text>

    <text x="1106" y="478" class="mono" font-size="13" letter-spacing="0.08em" fill="#B58A2C" text-anchor="end">MOYEN</text>
  </g>

  <!-- Couche 4 : état -->
  <g class="interactive" data-card="couche-etat" tabindex="0" role="button" aria-label="Couche état accumulé — cliquez pour les détails">
    <rect x="64" y="524" width="1072" height="118" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.75"/>
    <rect x="64" y="524" width="5" height="118" fill="#B7332C"/>
    <text x="94" y="556" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">COUCHE 4</text>
    <text x="94" y="584" class="display" font-size="21" font-weight="600" fill="#1A1A1A">L'état accumulé</text>
    <text x="94" y="606" class="body" font-size="12" fill="#8A8478">Mémoire · outils · identités</text>
    <text x="94" y="624" class="body" font-size="12" fill="#8A8478">évaluation · traces</text>

    <text x="470" y="560" class="body" font-size="13.5" fill="#5A5A5A">Rien ne se transfère. Tout se reconstitue, et la durée de la</text>
    <text x="470" y="582" class="body" font-size="13.5" fill="#5A5A5A">reconstitution ne dépend pas de vos moyens.</text>
    <text x="470" y="606" class="body" font-size="12.5" fill="#B7332C">Aucun format d'échange normalisé au 2 septembre 2026.</text>
    <text x="470" y="626" class="body" font-size="12.5" fill="#B7332C">Aucune obligation d'équivalence fonctionnelle applicable.</text>

    <text x="1106" y="596" class="mono" font-size="13" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">NON BORNÉ</text>
  </g>

  <!-- Renversement -->
  <g class="interactive" data-card="renversement" tabindex="0" role="button" aria-label="Le renversement du critère — cliquez pour les détails">
    <rect x="64" y="662" width="1072" height="76" rx="3" fill="#1A1A1A"/>
    <text x="94" y="692" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">LE RENVERSEMENT</text>
    <text x="94" y="720" class="display" font-size="19" font-weight="600" fill="#FAF8F3">La visibilité en avant-vente est inversement proportionnelle au pouvoir de verrouillage.</text>
  </g>

  <text x="64" y="768" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">RANGEMENT PAR RÉVERSIBILITÉ ET NOTION D'ÉTAT ACCUMULÉ : PROPRES À CE DOSSIER.</text>
</svg>
