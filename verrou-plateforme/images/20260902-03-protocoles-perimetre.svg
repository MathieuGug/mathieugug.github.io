<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Ce que les protocoles ouverts MCP et A2A standardisent, et ce qu'ils laissent au plan de contrôle du fournisseur">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="760" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce que les protocoles standardisent, et ce qu'ils laissent</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">MCP et A2A normalisent ce qui circule. Rien ne normalise ce qui s'accumule.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Colonne gauche : couvert -->
  <rect x="64" y="184" width="512" height="42" rx="3" fill="#4A7C59"/>
  <text x="88" y="211" class="mono" font-size="12" letter-spacing="0.1em" fill="#FAF8F3">RÉSOLU PAR LES PROTOCOLES OUVERTS</text>

  <g class="interactive" data-card="couvert-mcp" tabindex="0" role="button" aria-label="Ce que MCP normalise — cliquez pour les détails">
    <rect x="64" y="238" width="512" height="150" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="238" width="5" height="150" fill="#4A7C59"/>
    <text x="92" y="268" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">MCP · AGENT VERS OUTIL</text>
    <text x="92" y="298" class="display" font-size="20" font-weight="600" fill="#1A1A1A">L'appel</text>
    <text x="92" y="326" class="body" font-size="13" fill="#5A5A5A">Découverte d'un outil, lecture de sa signature,</text>
    <text x="92" y="346" class="body" font-size="13" fill="#5A5A5A">invocation, retour du résultat.</text>
    <text x="92" y="372" class="body" font-size="12.5" font-style="italic" fill="#4A7C59">Confié à une fondation commune en décembre 2025.</text>
  </g>

  <g class="interactive" data-card="couvert-a2a" tabindex="0" role="button" aria-label="Ce que A2A normalise — cliquez pour les détails">
    <rect x="64" y="400" width="512" height="150" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="400" width="5" height="150" fill="#4A7C59"/>
    <text x="92" y="430" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">A2A · AGENT VERS AGENT</text>
    <text x="92" y="460" class="display" font-size="20" font-weight="600" fill="#1A1A1A">La conversation</text>
    <text x="92" y="488" class="body" font-size="13" fill="#5A5A5A">Échange entre agents de fournisseurs différents,</text>
    <text x="92" y="508" class="body" font-size="13" fill="#5A5A5A">carte d'agent signée, délégation de tâche.</text>
    <text x="92" y="534" class="body" font-size="12.5" font-style="italic" fill="#4A7C59">Plus de 150 organisations au bout d'un an.</text>
  </g>

  <rect x="64" y="562" width="512" height="88" rx="3" fill="#4A7C59" fill-opacity="0.09" stroke="#4A7C59" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="92" y="592" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Ce que ces deux acquis coûtaient à recoder :</text>
  <text x="92" y="616" class="body" font-size="13" fill="#5A5A5A">un adaptateur par couple, une semaine de travail.</text>
  <text x="92" y="638" class="body" font-size="13" font-style="italic" fill="#4A7C59">La partie du problème qui se résolvait déjà.</text>

  <!-- Colonne droite : laissé -->
  <rect x="624" y="184" width="512" height="42" rx="3" fill="#B7332C"/>
  <text x="648" y="211" class="mono" font-size="12" letter-spacing="0.1em" fill="#FAF8F3">LAISSÉ AU PLAN DE CONTRÔLE DU FOURNISSEUR</text>

  <g class="interactive" data-card="laisse-gouvernance" tabindex="0" role="button" aria-label="La gouvernance du catalogue — cliquez pour les détails">
    <rect x="624" y="238" width="512" height="150" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="624" y="238" width="5" height="150" fill="#B7332C"/>
    <text x="652" y="268" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">GOUVERNANCE DU CATALOGUE</text>
    <text x="652" y="298" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Propriété · version · dépréciation</text>
    <text x="652" y="326" class="body" font-size="13" fill="#5A5A5A">Qui possède un outil, qui peut le publier, comment</text>
    <text x="652" y="346" class="body" font-size="13" fill="#5A5A5A">on le retire sans casser les agents qui l'appellent.</text>
    <text x="652" y="372" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Cloud API Registry, AgentCore Gateway, registre Foundry.</text>
  </g>

  <g class="interactive" data-card="laisse-autorisation" tabindex="0" role="button" aria-label="L'autorisation d'entreprise — cliquez pour les détails">
    <rect x="624" y="400" width="512" height="150" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="624" y="400" width="5" height="150" fill="#B7332C"/>
    <text x="652" y="430" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">AUTORISATION D'ENTREPRISE</text>
    <text x="652" y="460" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Qui a le droit, et comment on le prouve</text>
    <text x="652" y="488" class="body" font-size="13" fill="#5A5A5A">Habilitation par agent et par contexte, conservation</text>
    <text x="652" y="508" class="body" font-size="13" fill="#5A5A5A">de la chaîne de délégation, reconstitution après coup.</text>
    <text x="652" y="534" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Une carte signée authentifie une carte, pas une politique.</text>
  </g>

  <g class="interactive" data-card="groupes-ouverts" tabindex="0" role="button" aria-label="Les groupes de travail encore ouverts — cliquez pour les détails">
    <rect x="624" y="562" width="512" height="88" rx="3" fill="#1A1A1A"/>
    <text x="652" y="592" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">CHANTIERS ENCORE OUVERTS À LA FONDATION</text>
    <text x="652" y="618" class="body" font-size="13.5" fill="#FAF8F3">Identité · sécurité · observabilité · registre · interopérabilité</text>
    <text x="652" y="640" class="body" font-size="12.5" font-style="italic" fill="#C9C3B6">Un groupe de travail ouvert est un problème non résolu.</text>
  </g>

  <text x="64" y="700" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Le déséquilibre à retenir : la colonne de gauche se re-branche en une semaine. La colonne de droite se re-négocie en trimestres.</text>

  <text x="64" y="742" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">PÉRIMÈTRES DES PROTOCOLES : SPÉCIFICATIONS ET COMMUNIQUÉS DE LA FONDATION. RÉPARTITION EN DEUX COLONNES : PROPRE À CE DOSSIER.</text>
</svg>
