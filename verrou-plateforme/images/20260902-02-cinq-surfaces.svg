<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-label="Les cinq surfaces d'état d'un agent en production : mémoire longue, catalogue d'outils, identité déléguée, jeu d'évaluation, traces d'exécution">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="860" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Les cinq surfaces d'état</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Cinq objets qui n'existaient pas au démarrage, que personne n'a décidé de faire grossir, et qui décident du prix de la sortie.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">SURFACE</text>
  <text x="420" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">OÙ ELLE VIT CHEZ LES TROIS GRANDS</text>
  <text x="840" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">UNITÉ DU COÛT DE RECONSTITUTION</text>

  <!-- Mémoire -->
  <g class="interactive" data-card="surface-memoire" tabindex="0" role="button" aria-label="Surface mémoire longue — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="112" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="5" height="112" fill="#B7332C"/>
    <text x="94" y="238" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">S1</text>
    <text x="94" y="266" class="display" font-size="20" font-weight="600" fill="#1A1A1A">La mémoire longue</text>
    <text x="94" y="290" class="body" font-size="12" fill="#8A8478">Ce que l'agent retient d'une</text>
    <text x="94" y="308" class="body" font-size="12" fill="#8A8478">session sur l'autre.</text>

    <text x="420" y="238" class="body" font-size="13" fill="#5A5A5A">Memory Bank, adossé à Agent Engine.</text>
    <text x="420" y="262" class="body" font-size="13" fill="#5A5A5A">AgentCore Memory, facturée à l'écriture</text>
    <text x="420" y="282" class="body" font-size="13" fill="#5A5A5A">et à la récupération.</text>
    <text x="420" y="306" class="body" font-size="13" fill="#5A5A5A">Fils de conversation de Foundry.</text>

    <rect x="840" y="228" width="272" height="34" rx="3" fill="#B7332C" fill-opacity="0.1"/>
    <text x="856" y="250" class="body" font-size="13.5" font-weight="600" fill="#B7332C">Des mois de trafic réel</text>
    <text x="840" y="284" class="body" font-size="12.5" fill="#5A5A5A">La seule unité que votre budget</text>
    <text x="840" y="302" class="body" font-size="12.5" fill="#5A5A5A">ne peut pas accélérer.</text>
  </g>

  <!-- Outils -->
  <g class="interactive" data-card="surface-outils" tabindex="0" role="button" aria-label="Surface catalogue d'outils — cliquez pour les détails">
    <rect x="64" y="330" width="1072" height="112" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="330" width="5" height="112" fill="#B58A2C"/>
    <text x="94" y="362" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">S2</text>
    <text x="94" y="390" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le catalogue d'outils</text>
    <text x="94" y="414" class="body" font-size="12" fill="#8A8478">Qui possède quoi, quelle version,</text>
    <text x="94" y="432" class="body" font-size="12" fill="#8A8478">qui a le droit d'appeler.</text>

    <text x="420" y="362" class="body" font-size="13" fill="#5A5A5A">Cloud API Registry et Apigee, avec l'objet</text>
    <text x="420" y="382" class="body" font-size="13" fill="#5A5A5A">ApiRegistry côté développeur.</text>
    <text x="420" y="406" class="body" font-size="13" fill="#5A5A5A">AgentCore Gateway, facturée aux opérations</text>
    <text x="420" y="426" class="body" font-size="13" fill="#5A5A5A">et aux outils indexés.</text>

    <rect x="840" y="352" width="272" height="34" rx="3" fill="#B58A2C" fill-opacity="0.14"/>
    <text x="856" y="374" class="body" font-size="13.5" font-weight="600" fill="#B58A2C">Un outil × un propriétaire</text>
    <text x="840" y="408" class="body" font-size="12.5" fill="#5A5A5A">Le protocole se re-branche vite.</text>
    <text x="840" y="426" class="body" font-size="12.5" fill="#5A5A5A">La gouvernance se re-négocie.</text>
  </g>

  <!-- Identité -->
  <g class="interactive" data-card="surface-identite" tabindex="0" role="button" aria-label="Surface identité déléguée — cliquez pour les détails">
    <rect x="64" y="454" width="1072" height="112" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.75"/>
    <rect x="64" y="454" width="5" height="112" fill="#B7332C"/>
    <text x="94" y="486" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">S3</text>
    <text x="94" y="514" class="display" font-size="20" font-weight="600" fill="#1A1A1A">L'identité déléguée</text>
    <text x="94" y="538" class="body" font-size="12" fill="#8A8478">Au nom de qui l'agent agit,</text>
    <text x="94" y="556" class="body" font-size="12" fill="#8A8478">et jusqu'où.</text>

    <text x="420" y="486" class="body" font-size="13" fill="#5A5A5A">Entra Agent ID : un type d'identité à part</text>
    <text x="420" y="506" class="body" font-size="13" fill="#5A5A5A">entière dans l'annuaire, disponible en version</text>
    <text x="420" y="526" class="body" font-size="13" fill="#5A5A5A">générale depuis avril 2026.</text>
    <text x="420" y="550" class="body" font-size="13" fill="#5A5A5A">AgentCore Identity côté AWS.</text>

    <rect x="840" y="476" width="272" height="34" rx="3" fill="#B7332C" fill-opacity="0.1"/>
    <text x="856" y="498" class="body" font-size="13.5" font-weight="600" fill="#B7332C">Une signature métier par accès</text>
    <text x="840" y="532" class="body" font-size="12.5" fill="#5A5A5A">Un annuaire ne s'exporte pas.</text>
    <text x="840" y="550" class="body" font-size="12.5" fill="#5A5A5A">Il se reconstruit, personne par personne.</text>
  </g>

  <!-- Évaluation -->
  <g class="interactive" data-card="surface-evaluation" tabindex="0" role="button" aria-label="Surface jeu d'évaluation — cliquez pour les détails">
    <rect x="64" y="578" width="1072" height="112" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="578" width="5" height="112" fill="#4A7C59"/>
    <text x="94" y="610" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">S4</text>
    <text x="94" y="638" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le jeu d'évaluation</text>
    <text x="94" y="662" class="body" font-size="12" fill="#8A8478">Les cas qui disent si l'agent</text>
    <text x="94" y="680" class="body" font-size="12" fill="#8A8478">fait encore son travail.</text>

    <text x="420" y="610" class="body" font-size="13" fill="#5A5A5A">Partout : outils d'évaluation intégrés,</text>
    <text x="420" y="630" class="body" font-size="13" fill="#5A5A5A">gratuits à l'usage et déjà branchés</text>
    <text x="420" y="650" class="body" font-size="13" fill="#5A5A5A">sur les traces du fournisseur.</text>
    <text x="420" y="676" class="body" font-size="12.5" font-style="italic" fill="#4A7C59">D'où la tentation de l'y écrire.</text>

    <rect x="840" y="600" width="272" height="34" rx="3" fill="#4A7C59" fill-opacity="0.12"/>
    <text x="856" y="622" class="body" font-size="13.5" font-weight="600" fill="#4A7C59">Zéro, ou tout</text>
    <text x="840" y="656" class="body" font-size="12.5" fill="#5A5A5A">Nul s'il vit dans votre dépôt.</text>
    <text x="840" y="674" class="body" font-size="12.5" fill="#5A5A5A">Total s'il vit dans la console.</text>
  </g>

  <!-- Traces -->
  <g class="interactive" data-card="surface-traces" tabindex="0" role="button" aria-label="Surface traces d'exécution — cliquez pour les détails">
    <rect x="64" y="702" width="1072" height="112" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="702" width="5" height="112" fill="#1F5560"/>
    <text x="94" y="734" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">S5</text>
    <text x="94" y="762" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Les traces d'exécution</text>
    <text x="94" y="786" class="body" font-size="12" fill="#8A8478">Ce que l'agent a fait, quand,</text>
    <text x="94" y="804" class="body" font-size="12" fill="#8A8478">avec quel outil.</text>

    <text x="420" y="734" class="body" font-size="13" fill="#5A5A5A">Une grammaire commune émerge côté</text>
    <text x="420" y="754" class="body" font-size="13" fill="#5A5A5A">OpenTelemetry, encore expérimentale sur</text>
    <text x="420" y="774" class="body" font-size="13" fill="#5A5A5A">la partie agent et sans attribut de coût</text>
    <text x="420" y="794" class="body" font-size="13" fill="#5A5A5A">en monnaie.</text>

    <rect x="840" y="724" width="272" height="34" rx="3" fill="#1F5560" fill-opacity="0.1"/>
    <text x="856" y="746" class="body" font-size="13.5" font-weight="600" fill="#1F5560">La série historique perdue</text>
    <text x="840" y="780" class="body" font-size="12.5" fill="#5A5A5A">On perd la comparabilité avant / après</text>
    <text x="840" y="798" class="body" font-size="12.5" fill="#5A5A5A">au moment où elle servirait le plus.</text>
  </g>

  <text x="64" y="846" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">NOMS DE PRODUITS : DOCUMENTATIONS ÉDITEURS. DÉCOUPAGE EN CINQ SURFACES ET UNITÉS DE RECONSTITUTION : PROPRES À CE DOSSIER.</text>
</svg>
