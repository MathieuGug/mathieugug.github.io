<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Matrice croisant la portabilité déclarée par le fournisseur et le coût réel de reconstitution, avec les cinq surfaces d'état positionnées">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Portabilité déclarée contre coût de reconstitution</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le quadrant dangereux n'est pas celui des objets qu'on sait perdus. C'est celui des exports qui ne restituent pas la fonction.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Axes -->
  <text x="600" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">PORTABILITÉ DÉCLARÉE PAR LE FOURNISSEUR</text>
  <text x="330" y="222" class="mono" font-size="12" letter-spacing="0.08em" fill="#8A8478" text-anchor="middle">FAIBLE</text>
  <text x="870" y="222" class="mono" font-size="12" letter-spacing="0.08em" fill="#8A8478" text-anchor="middle">FORTE</text>

  <text x="96" y="480" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle" transform="rotate(-90 96 480)">COÛT RÉEL DE RECONSTITUTION</text>

  <text x="132" y="320" class="mono" font-size="12" letter-spacing="0.08em" fill="#8A8478" text-anchor="middle">ÉLEVÉ</text>
  <text x="132" y="640" class="mono" font-size="12" letter-spacing="0.08em" fill="#8A8478" text-anchor="middle">FAIBLE</text>

  <!-- Quadrant haut-gauche : perdu -->
  <g class="interactive" data-card="quadrant-perdu" tabindex="0" role="button" aria-label="Quadrant : perdu et assumé — cliquez pour les détails">
    <rect x="176" y="238" width="440" height="248" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="204" y="272" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">PERDU, ET ASSUMÉ</text>
    <text x="204" y="304" class="display" font-size="19" font-weight="600" fill="#1A1A1A">On sait qu'on ne l'emporte pas.</text>
    <text x="204" y="330" class="body" font-size="13" fill="#5A5A5A">Le fournisseur ne promet rien, donc le poste est</text>
    <text x="204" y="350" class="body" font-size="13" fill="#5A5A5A">provisionné dès le dossier d'investissement.</text>

    <rect x="204" y="376" width="200" height="34" rx="3" fill="#B7332C" fill-opacity="0.1"/>
    <text x="220" y="398" class="body" font-size="13.5" font-weight="600" fill="#B7332C">S1 · Mémoire longue</text>
    <rect x="204" y="420" width="200" height="34" rx="3" fill="#1F5560" fill-opacity="0.1"/>
    <text x="220" y="442" class="body" font-size="13.5" font-weight="600" fill="#1F5560">S5 · Traces d'exécution</text>

    <text x="424" y="398" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Le risque géré</text>
    <text x="424" y="418" class="body" font-size="12.5" font-style="italic" fill="#8A8478">est le risque</text>
    <text x="424" y="438" class="body" font-size="12.5" font-style="italic" fill="#8A8478">le moins cher.</text>
  </g>

  <!-- Quadrant haut-droite : piège -->
  <g class="interactive" data-card="quadrant-piege" tabindex="0" role="button" aria-label="Quadrant : le piège de l'export qui ne restitue pas la fonction — cliquez pour les détails">
    <rect x="640" y="238" width="440" height="248" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2"/>
    <text x="668" y="272" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LE PIÈGE</text>
    <text x="668" y="304" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'export existe. Il ne suffit pas.</text>
    <text x="668" y="330" class="body" font-size="13" fill="#5A5A5A">Le fournisseur restitue des enregistrements lisibles,</text>
    <text x="668" y="350" class="body" font-size="13" fill="#5A5A5A">et la fonction ne redémarre pas ailleurs.</text>

    <rect x="668" y="376" width="212" height="34" rx="3" fill="#B7332C" fill-opacity="0.1"/>
    <text x="684" y="398" class="body" font-size="13.5" font-weight="600" fill="#B7332C">S3 · Identité déléguée</text>
    <rect x="668" y="420" width="212" height="34" rx="3" fill="#B58A2C" fill-opacity="0.14"/>
    <text x="684" y="442" class="body" font-size="13.5" font-weight="600" fill="#B58A2C">S2 · Catalogue d'outils</text>

    <text x="900" y="398" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Le quadrant</text>
    <text x="900" y="418" class="body" font-size="12.5" font-style="italic" fill="#B7332C">que les plans de</text>
    <text x="900" y="438" class="body" font-size="12.5" font-style="italic" fill="#B7332C">migration ratent.</text>
  </g>

  <!-- Quadrant bas-gauche : sans objet -->
  <rect x="176" y="500" width="440" height="180" rx="3" fill="#F2EEE4" stroke="#E5E1D8" stroke-width="1"/>
  <text x="204" y="534" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">QUADRANT VIDE</text>
  <text x="204" y="566" class="display" font-size="18" font-weight="600" fill="#8A8478">Aucune surface d'état ne s'y trouve.</text>
  <text x="204" y="594" class="body" font-size="13" fill="#8A8478">Un objet non portable et facile à reconstituer</text>
  <text x="204" y="614" class="body" font-size="13" fill="#8A8478">n'est plus un actif : c'est une configuration,</text>
  <text x="204" y="634" class="body" font-size="13" fill="#8A8478">et on la ré-écrit sans négocier.</text>

  <!-- Quadrant bas-droite : portable -->
  <g class="interactive" data-card="jeu-evaluation" tabindex="0" role="button" aria-label="Le jeu d'évaluation, seul actif réellement portable — cliquez pour les détails">
    <rect x="640" y="500" width="440" height="180" rx="3" fill="#FFFFFF" stroke="#4A7C59" stroke-width="2"/>
    <text x="668" y="534" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">RÉELLEMENT PORTABLE</text>
    <text x="668" y="566" class="display" font-size="19" font-weight="600" fill="#1A1A1A">À une condition, et une seule.</text>

    <rect x="668" y="586" width="212" height="34" rx="3" fill="#4A7C59" fill-opacity="0.12"/>
    <text x="684" y="608" class="body" font-size="13.5" font-weight="600" fill="#4A7C59">S4 · Jeu d'évaluation</text>

    <text x="668" y="646" class="body" font-size="13" fill="#5A5A5A">Il doit vivre dans votre dépôt de sources.</text>
    <text x="668" y="666" class="body" font-size="13" fill="#5A5A5A">Écrit dans la console, il quitte ce quadrant.</text>
  </g>

  <!-- Bandeau -->
  <rect x="64" y="706" width="1072" height="52" rx="3" fill="#1A1A1A"/>
  <text x="94" y="738" class="display" font-size="18" font-weight="600" fill="#FAF8F3">La question à poser au fournisseur : « que restitue votre export, et qu'est-ce qui redémarre avec ? »</text>

  <text x="64" y="788" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">POSITIONNEMENT DES CINQ SURFACES : GRILLE ANALYTIQUE PROPRE À CE DOSSIER, À RÉÉVALUER POUR CHAQUE FOURNISSEUR.</text>
</svg>
