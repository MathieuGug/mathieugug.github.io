<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Arbre de décision : choisir un estimateur causal selon le design de données">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 05 · CHOIX DE MÉTHODE</text>
  <text x="60" y="110" class="display" font-size="29" font-weight="600" fill="#1A1A1A">L'estimateur découle du <tspan font-style="italic">design</tspan>, pas du score.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Descendre l'arbre jusqu'à la première réponse « oui ». Ne jamais sauter une marche.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="192" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">QUESTION DE DESIGN</text>
  <text x="420" y="192" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">FAMILLE D'ESTIMATEURS</text>
  <text x="850" y="192" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">CE QU'ON OBTIENT — ET SON PRIX</text>

  <!-- ROW 1 -->
  <g class="interactive" data-card="row-experience" tabindex="0" role="button" aria-label="Randomisation possible : expérience — détails">
    <rect x="60" y="200" width="300" height="76" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="78" y="226" class="mono" font-size="11" font-weight="600" fill="#B7332C">1</text>
    <text x="96" y="226" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">Puis-je randomiser l'affectation</text>
    <text x="96" y="245" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">du levier, même partiellement ?</text>
    <text x="96" y="265" class="body" font-size="11" font-style="italic" fill="#5A5A5A">clients, magasins, zones, créneaux</text>

    <rect x="420" y="200" width="390" height="76" rx="3" fill="#F2EFE7" stroke="#1F5560" stroke-width="1.25"/>
    <text x="438" y="224" class="display" font-size="16" font-weight="600" fill="#1F5560">Expérimentation</text>
    <text x="438" y="245" class="body" font-size="11.5" fill="#1A1A1A">Test A/B client · lift test · geo-lift avec contrôle</text>
    <text x="438" y="262" class="body" font-size="11.5" fill="#1A1A1A">synthétique · switchback sur créneaux</text>

    <rect x="850" y="200" width="290" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="866" y="224" class="body" font-size="12" font-weight="500" fill="#1A1A1A">ATE non biaisé par construction</text>
    <text x="866" y="245" class="body" font-size="11.5" fill="#5A5A5A">Étalon-or. Coûteux, lent, et souvent</text>
    <text x="866" y="262" class="body" font-size="11.5" fill="#5A5A5A">impossible sur un levier national.</text>

    <line x1="364" y1="238" x2="406" y2="238" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
    <text x="385" y="230" class="mono" font-size="10" fill="#1F5560" text-anchor="middle">oui</text>
    <line x1="814" y1="238" x2="836" y2="238" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow-soft)"/>
  </g>
  <line x1="210" y1="280" x2="210" y2="296" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="224" y="294" class="mono" font-size="10" fill="#B7332C">non</text>

  <!-- ROW 2 -->
  <g class="interactive" data-card="row-quasi" tabindex="0" role="button" aria-label="Instrument ou seuil : quasi-expérience — détails">
    <rect x="60" y="310" width="300" height="76" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="78" y="336" class="mono" font-size="11" font-weight="600" fill="#B7332C">2</text>
    <text x="96" y="336" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">Existe-t-il un instrument crédible</text>
    <text x="96" y="355" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">ou un seuil d'éligibilité net ?</text>
    <text x="96" y="375" class="body" font-size="11" font-style="italic" fill="#5A5A5A">palier de fidélité, montant de panier</text>

    <rect x="420" y="310" width="390" height="76" rx="3" fill="#F2EFE7" stroke="#1F5560" stroke-width="1.25"/>
    <text x="438" y="334" class="display" font-size="16" font-weight="600" fill="#1F5560">Quasi-expérimentation</text>
    <text x="438" y="355" class="body" font-size="11.5" fill="#1A1A1A">Variables instrumentales (2SLS) · régression sur</text>
    <text x="438" y="372" class="body" font-size="11.5" fill="#1A1A1A">discontinuité · critère de porte de devant</text>

    <rect x="850" y="310" width="290" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="866" y="334" class="body" font-size="12" font-weight="500" fill="#1A1A1A">Effet local (LATE), pas global</text>
    <text x="866" y="355" class="body" font-size="11.5" fill="#5A5A5A">Valide au voisinage du seuil ou sur</text>
    <text x="866" y="372" class="body" font-size="11.5" fill="#5A5A5A">les seuls « compliers ».</text>

    <line x1="364" y1="348" x2="406" y2="348" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
    <text x="385" y="340" class="mono" font-size="10" fill="#1F5560" text-anchor="middle">oui</text>
    <line x1="814" y1="348" x2="836" y2="348" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow-soft)"/>
  </g>
  <line x1="210" y1="390" x2="210" y2="406" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="224" y="404" class="mono" font-size="10" fill="#B7332C">non</text>

  <!-- ROW 3 -->
  <g class="interactive" data-card="row-did" tabindex="0" role="button" aria-label="Panel avant après : doubles différences — détails">
    <rect x="60" y="420" width="300" height="76" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="78" y="446" class="mono" font-size="11" font-weight="600" fill="#B7332C">3</text>
    <text x="96" y="446" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">Ai-je un panel avant / après et</text>
    <text x="96" y="465" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">des unités jamais traitées ?</text>
    <text x="96" y="485" class="body" font-size="11" font-style="italic" fill="#5A5A5A">régions, magasins, sous-rayons témoins</text>

    <rect x="420" y="420" width="390" height="76" rx="3" fill="#F2EFE7" stroke="#1F5560" stroke-width="1.25"/>
    <text x="438" y="444" class="display" font-size="16" font-weight="600" fill="#1F5560">Doubles différences</text>
    <text x="438" y="465" class="body" font-size="11.5" fill="#1A1A1A">DiD · event study · contrôle synthétique ·</text>
    <text x="438" y="482" class="body" font-size="11.5" fill="#1A1A1A">CausalImpact (séries temporelles bayésiennes)</text>

    <rect x="850" y="420" width="290" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="866" y="444" class="body" font-size="12" font-weight="500" fill="#1A1A1A">ATT sur la fenêtre traitée</text>
    <text x="866" y="465" class="body" font-size="11.5" fill="#5A5A5A">Repose sur les tendances parallèles —</text>
    <text x="866" y="482" class="body" font-size="11.5" fill="#5A5A5A">hypothèse à tester, pas à supposer.</text>

    <line x1="364" y1="458" x2="406" y2="458" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
    <text x="385" y="450" class="mono" font-size="10" fill="#1F5560" text-anchor="middle">oui</text>
    <line x1="814" y1="458" x2="836" y2="458" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow-soft)"/>
  </g>
  <line x1="210" y1="500" x2="210" y2="516" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="224" y="514" class="mono" font-size="10" fill="#B7332C">non</text>

  <!-- ROW 4 -->
  <g class="interactive" data-card="row-ajustement" tabindex="0" role="button" aria-label="Ajustement par le graphe — détails">
    <rect x="60" y="530" width="300" height="76" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <text x="78" y="556" class="mono" font-size="11" font-weight="600" fill="#B7332C">4</text>
    <text x="96" y="556" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">L'ensemble d'ajustement Z est-il</text>
    <text x="96" y="575" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A">observé, complet et défendable ?</text>
    <text x="96" y="595" class="body" font-size="11" font-style="italic" fill="#B7332C">c'est ici que se situe Leroy Merlin</text>

    <rect x="420" y="530" width="390" height="76" rx="3" fill="#F2EFE7" stroke="#B7332C" stroke-width="1.25"/>
    <text x="438" y="554" class="display" font-size="16" font-weight="600" fill="#B7332C">Ajustement sur le graphe</text>
    <text x="438" y="575" class="body" font-size="11.5" fill="#1A1A1A">Double machine learning · AIPW doublement robuste ·</text>
    <text x="438" y="592" class="body" font-size="11.5" fill="#1A1A1A">forêts causales · MMM bayésien hiérarchique</text>

    <rect x="850" y="530" width="290" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="866" y="554" class="body" font-size="12" font-weight="500" fill="#1A1A1A">ATE et effets conditionnels (CATE)</text>
    <text x="866" y="575" class="body" font-size="11.5" fill="#5A5A5A">Toujours disponible, jamais garanti :</text>
    <text x="866" y="592" class="body" font-size="11.5" fill="#5A5A5A">la validité est celle du graphe.</text>

    <line x1="364" y1="568" x2="406" y2="568" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="385" y="560" class="mono" font-size="10" fill="#B7332C" text-anchor="middle">oui</text>
    <line x1="814" y1="568" x2="836" y2="568" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow-soft)"/>
  </g>
  <line x1="210" y1="610" x2="210" y2="622" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="224" y="620" class="mono" font-size="10" fill="#B7332C">non</text>

  <!-- TERMINAL -->
  <g class="interactive" data-card="row-terminal" tabindex="0" role="button" aria-label="Aucune identification possible — détails">
    <rect x="60" y="636" width="1080" height="82" rx="3" fill="#B7332C" stroke="#B7332C" stroke-width="1.25"/>
    <text x="80" y="660" class="mono" font-size="10" letter-spacing="1.5" fill="#FAF8F3">TERMINAL — AUCUNE IDENTIFICATION</text>
    <text x="80" y="684" class="display" font-size="16" font-style="italic" fill="#FAF8F3">Ne pas livrer un chiffre décoré d'un intervalle de confiance.</text>
    <text x="80" y="707" class="display" font-size="16" font-style="italic" fill="#FAF8F3">Borner l'effet, publier la valeur de robustesse, financer l'expérience qui manque.</text>
  </g>

  <line x1="60" y1="734" x2="1140" y2="734" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="756" class="body" font-size="10" font-style="italic" fill="#5A5A5A">Un R² de 0,95 ne rend pas un estimand identifiable : le fit mesure la prédiction, pas la causalité. — Mathieu Guglielmino.</text>
  <text x="60" y="774" class="body" font-size="10" font-style="italic" fill="#5A5A5A">Sources : Sharma &amp; Kıcıman, DoWhy (arXiv:2011.04216) ; Chernozhukov et al., Double/Debiased ML (2018).</text>
</svg>
