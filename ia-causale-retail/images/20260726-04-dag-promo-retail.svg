<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Graphe causal d'une promotion ciblée en retail, avec ensemble d'ajustement et pièges">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
    </marker>
    <marker id="arrow-emph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 04 · GRAPHE DE TRAVAIL</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Le graphe d'une promotion ciblée, <tspan font-style="italic">tel qu'il se négocie</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Ce que les data scientists et les chefs de produit co-écrivent en atelier — et ce qui s'y joue.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ENSEMBLE D'AJUSTEMENT -->
  <text x="60" y="192" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ENSEMBLE D'AJUSTEMENT Z — OBSERVÉ, BLOQUE LES CHEMINS DÉROBÉS</text>
  <g class="interactive" data-card="z-ensemble" tabindex="0" role="button" aria-label="Ensemble d'ajustement Z — détails">
    <rect x="60" y="200" width="250" height="300" rx="3" fill="#F2EFE7" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 4"/>
    <rect x="80" y="216" width="210" height="54" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="96" y="240" class="body" font-size="12" font-weight="500" fill="#1A1A1A">Saisonnalité &amp;</text>
    <text x="96" y="257" class="body" font-size="12" font-weight="500" fill="#1A1A1A">calendrier commercial</text>
    <rect x="80" y="288" width="210" height="54" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="96" y="312" class="body" font-size="12" font-weight="500" fill="#1A1A1A">Météo et effets</text>
    <text x="96" y="329" class="body" font-size="12" font-weight="500" fill="#1A1A1A">de zone de chalandise</text>
    <rect x="80" y="360" width="210" height="54" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="96" y="384" class="body" font-size="12" font-weight="500" fill="#1A1A1A">Historique de perf.</text>
    <text x="96" y="401" class="body" font-size="12" font-weight="500" fill="#1A1A1A">du sous-rayon</text>
    <rect x="80" y="432" width="210" height="54" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="96" y="456" class="body" font-size="12" font-weight="500" fill="#1A1A1A">Autres leviers activés</text>
    <text x="96" y="473" class="body" font-size="12" font-weight="500" fill="#1A1A1A">simultanément</text>
  </g>

  <!-- TRAITEMENT -->
  <g class="interactive" data-card="traitement-t" tabindex="0" role="button" aria-label="Traitement : promotion ciblée — détails">
    <rect x="440" y="300" width="210" height="68" rx="3" fill="#B7332C" stroke="#B7332C" stroke-width="1.25"/>
    <text x="458" y="324" class="mono" font-size="10" letter-spacing="1.5" fill="#FAF8F3">TRAITEMENT T</text>
    <text x="458" y="350" class="display" font-size="19" font-weight="600" fill="#FAF8F3">Promotion ciblée</text>
  </g>

  <!-- MÉDIATEUR -->
  <g class="interactive" data-card="mediateur" tabindex="0" role="button" aria-label="Médiateur : trafic — détails">
    <rect x="700" y="196" width="190" height="54" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="716" y="218" class="mono" font-size="9" letter-spacing="1.5" fill="#B58A2C">MÉDIATEUR</text>
    <text x="716" y="240" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Trafic magasin / web</text>
  </g>

  <!-- COLLIDER -->
  <g class="interactive" data-card="collider" tabindex="0" role="button" aria-label="Collisionneur : rupture de stock — détails">
    <rect x="700" y="420" width="190" height="54" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <text x="716" y="442" class="mono" font-size="9" letter-spacing="1.5" fill="#1F5560">COLLISIONNEUR</text>
    <text x="716" y="464" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Rupture de stock</text>
  </g>

  <!-- OUTCOME -->
  <g class="interactive" data-card="outcome" tabindex="0" role="button" aria-label="Résultat : ventes du sous-rayon — détails">
    <rect x="950" y="300" width="190" height="68" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
    <text x="966" y="324" class="mono" font-size="10" letter-spacing="1.5" fill="#1A1A1A">RÉSULTAT Y</text>
    <text x="966" y="350" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Ventes sous-rayon</text>
  </g>

  <!-- DEMANDE LATENTE -->
  <g class="interactive" data-card="demande-latente" tabindex="0" role="button" aria-label="Demande locale non observée — détails">
    <rect x="950" y="420" width="190" height="54" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 4"/>
    <text x="966" y="442" class="mono" font-size="9" letter-spacing="1.5" fill="#B7332C">NON OBSERVÉ</text>
    <text x="966" y="464" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Demande locale</text>
  </g>

  <!-- ARÊTES -->
  <line x1="314" y1="340" x2="426" y2="335" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 314,250 C 520,110 840,95 1044,286" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="296" x2="747" y2="255" stroke="#B58A2C" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="894" y1="230" x2="1018" y2="294" stroke="#B58A2C" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="654" y1="334" x2="936" y2="334" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arrow-emph)"/>
  <line x1="610" y1="372" x2="747" y2="416" stroke="#1F5560" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="946" y1="447" x2="904" y2="447" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#arrow-emph)"/>
  <line x1="1045" y1="416" x2="1045" y2="382" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#arrow-emph)"/>

  <g class="interactive" data-card="confusion-residuelle" tabindex="0" role="button" aria-label="Confusion résiduelle non observée — détails">
    <path d="M 546,372 C 660,600 930,600 1034,372" fill="none" stroke="#5A5A5A" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow-soft)" marker-start="url(#arrow-soft)"/>
    <text x="790" y="578" class="body" font-size="12" font-style="italic" fill="#5A5A5A" text-anchor="middle">Confusion résiduelle : tout ce qui agit sur T et sur Y sans figurer dans Z</text>
  </g>

  <text x="662" y="262" class="body" font-size="11" font-style="italic" fill="#B58A2C" text-anchor="middle">effet médié</text>
  <text x="795" y="326" class="body" font-size="11" font-style="italic" fill="#B7332C" text-anchor="middle">effet direct</text>

  <!-- LÉGENDE -->
  <g class="interactive" data-card="legende" tabindex="0" role="button" aria-label="Légende des chemins — détails">
    <rect x="60" y="540" width="340" height="176" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="566" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">LECTURE DES CHEMINS</text>
    <line x1="80" y1="590" x2="120" y2="590" stroke="#B7332C" stroke-width="2.5"/>
    <text x="132" y="594" class="body" font-size="11.5" fill="#1A1A1A">Chemin causal recherché</text>
    <line x1="80" y1="618" x2="120" y2="618" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="132" y="622" class="body" font-size="11.5" fill="#1A1A1A">Chemin médié — compte dans l'effet total</text>
    <line x1="80" y1="646" x2="120" y2="646" stroke="#1A1A1A" stroke-width="2.5"/>
    <text x="132" y="650" class="body" font-size="11.5" fill="#1A1A1A">Chemin dérobé, bloqué en conditionnant sur Z</text>
    <line x1="80" y1="674" x2="120" y2="674" stroke="#5A5A5A" stroke-width="1.25" stroke-dasharray="5 4"/>
    <text x="132" y="678" class="body" font-size="11.5" fill="#1A1A1A">Confusion non observée — non bloquable</text>
    <line x1="80" y1="702" x2="120" y2="702" stroke="#1F5560" stroke-width="1.25"/>
    <text x="132" y="706" class="body" font-size="11.5" fill="#1A1A1A">Vers le collisionneur — ne pas conditionner</text>
  </g>

  <!-- ESTIMAND -->
  <g class="interactive" data-card="estimand" tabindex="0" role="button" aria-label="Estimand identifié — détails">
    <rect x="440" y="612" width="700" height="104" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="460" y="638" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ESTIMAND IDENTIFIÉ SOUS CE GRAPHE</text>
    <text x="460" y="668" class="mono" font-size="13" fill="#1A1A1A">E[Y | do(T=1)] − E[Y | do(T=0)]  =  Σ_z { E[Y | T=1, Z=z] − E[Y | T=0, Z=z] } · P(Z=z)</text>
    <text x="460" y="698" class="body" font-size="12" fill="#5A5A5A">À gauche, une question de décision. À droite, une quantité calculable — <tspan font-weight="500" fill="#1A1A1A">si le graphe est juste</tspan>.</text>
  </g>

  <line x1="60" y1="740" x2="1140" y2="740" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="762" class="body" font-size="10" font-style="italic" fill="#5A5A5A">Graphe illustratif reconstruit à partir des éléments publiés sur le dispositif Leroy Merlin / Ekimetrics ; il ne reproduit pas le graphe réel de l'enseigne. — Mathieu Guglielmino.</text>
</svg>
