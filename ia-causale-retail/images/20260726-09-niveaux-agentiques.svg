<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Quatre niveaux d'agentification de la boucle mesure-décision">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 09 · AGENTIFICATION</text>
  <text x="60" y="110" class="display" font-size="29" font-weight="600" fill="#1A1A1A">Quatre façons d'agentifier la boucle. <tspan font-style="italic">Une seule est mûre.</tspan></text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Plus l'agent remonte vers la spécification du modèle, plus l'erreur devient silencieuse et rapide.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="320" y="182" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">CE QUE L'AGENT FAIT CONCRÈTEMENT</text>
  <text x="780" y="182" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">CE QUI CASSE</text>

  <!-- NIVEAU 1 -->
  <g class="interactive" data-card="niveau-lire" tabindex="0" role="button" aria-label="Niveau 1 : l'agent lit le modèle — détails">
    <rect x="60" y="192" width="1080" height="106" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <line x1="310" y1="204" x2="310" y2="286" stroke="#E5E1D8" stroke-width="1"/>
    <line x1="770" y1="204" x2="770" y2="286" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="218" class="mono" font-size="10" letter-spacing="1.5" fill="#1F5560">NIVEAU 1 — LIRE</text>
    <text x="80" y="246" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'agent lit le modèle</text>
    <rect x="80" y="258" width="150" height="24" rx="12" fill="#1F5560"/>
    <text x="155" y="274" class="mono" font-size="10" letter-spacing="1" fill="#FAF8F3" text-anchor="middle">DÉPLOYABLE</text>
    <text x="330" y="216" class="body" font-size="12" fill="#1A1A1A">Interface conversationnelle sur les résultats, commentaire automatique</text>
    <text x="330" y="236" class="body" font-size="12" fill="#1A1A1A">d'un tableau de bord, alerte sur une variation de ROI d'un trimestre à</text>
    <text x="330" y="256" class="body" font-size="12" fill="#1A1A1A">l'autre, réponse aux questions d'un chef de produit sans passer par</text>
    <text x="330" y="276" class="body" font-size="12" fill="#1A1A1A">l'équipe data. Le modèle causal reste souverain.</text>
    <text x="790" y="216" class="body" font-size="11.5" fill="#5A5A5A">Risque contenu : l'agent reformule, il</text>
    <text x="790" y="236" class="body" font-size="11.5" fill="#5A5A5A">n'estime rien. Le danger réel est la</text>
    <text x="790" y="256" class="body" font-size="11.5" fill="#5A5A5A">disparition de l'incertitude : un intervalle</text>
    <text x="790" y="276" class="body" font-size="11.5" fill="#5A5A5A">s'évapore vite dans une phrase fluide.</text>
  </g>

  <!-- NIVEAU 2 -->
  <g class="interactive" data-card="niveau-decider" tabindex="0" role="button" aria-label="Niveau 2 : l'agent décide avec le modèle — détails">
    <rect x="60" y="314" width="1080" height="106" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.25"/>
    <line x1="310" y1="326" x2="310" y2="408" stroke="#E5E1D8" stroke-width="1"/>
    <line x1="770" y1="326" x2="770" y2="408" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="340" class="mono" font-size="10" letter-spacing="1.5" fill="#B58A2C">NIVEAU 2 — DÉCIDER</text>
    <text x="80" y="368" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'agent décide</text>
    <rect x="80" y="380" width="150" height="24" rx="12" fill="#B58A2C"/>
    <text x="155" y="396" class="mono" font-size="10" letter-spacing="1" fill="#FAF8F3" text-anchor="middle">SOUS CONDITION</text>
    <text x="330" y="338" class="body" font-size="12" fill="#1A1A1A">Réallocation budgétaire sous contrainte à partir des courbes de réponse :</text>
    <text x="330" y="358" class="body" font-size="12" fill="#1A1A1A">égaliser les ROI marginaux, respecter des planchers par rayon, intégrer</text>
    <text x="330" y="378" class="body" font-size="12" fill="#1A1A1A">le rôle de produit d'appel de certaines catégories. C'est le simulateur</text>
    <text x="330" y="398" class="body" font-size="12" fill="#1A1A1A">qui se met à agir plutôt qu'à proposer.</text>
    <text x="790" y="338" class="body" font-size="11.5" fill="#5A5A5A">L'agent hérite de l'estimand sans pouvoir</text>
    <text x="790" y="358" class="body" font-size="11.5" fill="#5A5A5A">le contester. Si le graphe est faux, l'erreur</text>
    <text x="790" y="378" class="body" font-size="11.5" fill="#5A5A5A">cesse d'être lente et humaine : elle</text>
    <text x="790" y="398" class="body" font-size="11.5" fill="#5A5A5A">s'applique partout, chaque semaine.</text>
  </g>

  <!-- NIVEAU 3 -->
  <g class="interactive" data-card="niveau-construire" tabindex="0" role="button" aria-label="Niveau 3 : l'agent construit le modèle — détails">
    <rect x="60" y="436" width="1080" height="106" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <line x1="310" y1="448" x2="310" y2="530" stroke="#E5E1D8" stroke-width="1"/>
    <line x1="770" y1="448" x2="770" y2="530" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="462" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">NIVEAU 3 — CONSTRUIRE</text>
    <text x="80" y="490" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'agent spécifie</text>
    <rect x="80" y="502" width="180" height="24" rx="12" fill="#B7332C"/>
    <text x="170" y="518" class="mono" font-size="10" letter-spacing="1" fill="#FAF8F3" text-anchor="middle">ASSISTANCE SEULEMENT</text>
    <text x="330" y="460" class="body" font-size="12" fill="#1A1A1A">Proposition d'arêtes candidates à partir de la documentation métier,</text>
    <text x="330" y="480" class="body" font-size="12" fill="#1A1A1A">détection de variables oubliées, exécution automatique de la batterie</text>
    <text x="330" y="500" class="body" font-size="12" fill="#1A1A1A">de réfutations, rédaction du rapport de sensibilité. Une assistance</text>
    <text x="330" y="520" class="body" font-size="12" fill="#1A1A1A">réelle — à condition que la validation reste humaine.</text>
    <text x="790" y="460" class="body" font-size="11.5" fill="#5A5A5A">C'est là que la littérature est la plus</text>
    <text x="790" y="480" class="body" font-size="11.5" fill="#5A5A5A">sévère : sur la découverte causale pure,</text>
    <text x="790" y="500" class="body" font-size="11.5" fill="#5A5A5A">les modèles plafonnent, et la performance</text>
    <text x="790" y="520" class="body" font-size="11.5" fill="#5A5A5A">chute dès qu'on renomme les variables.</text>
  </g>

  <!-- NIVEAU 4 -->
  <g class="interactive" data-card="niveau-canal" tabindex="0" role="button" aria-label="Hors boucle : l'agent devient le canal — détails">
    <rect x="60" y="558" width="1080" height="106" rx="3" fill="#F2EFE7" stroke="#5A5A5A" stroke-width="1.25" stroke-dasharray="5 4"/>
    <line x1="310" y1="570" x2="310" y2="652" stroke="#E5E1D8" stroke-width="1"/>
    <line x1="770" y1="570" x2="770" y2="652" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="584" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">HORS BOUCLE</text>
    <text x="80" y="612" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'agent devient le canal</text>
    <rect x="80" y="624" width="150" height="24" rx="12" fill="#5A5A5A"/>
    <text x="155" y="640" class="mono" font-size="10" letter-spacing="1" fill="#FAF8F3" text-anchor="middle">À SURVEILLER</text>
    <text x="330" y="582" class="body" font-size="12" fill="#1A1A1A">Le parcours d'achat passe par un assistant : découverte, comparaison,</text>
    <text x="330" y="602" class="body" font-size="12" fill="#1A1A1A">commande. Le levier commercial ne s'adresse plus à un humain mais à</text>
    <text x="330" y="622" class="body" font-size="12" fill="#1A1A1A">un système de sélection qui lit des attributs structurés et arbitre sur</text>
    <text x="330" y="642" class="body" font-size="12" fill="#1A1A1A">des critères explicites.</text>
    <text x="790" y="582" class="body" font-size="11.5" fill="#5A5A5A">L'objet mesuré change. Les traces côté</text>
    <text x="790" y="602" class="body" font-size="11.5" fill="#5A5A5A">navigateur s'effacent, l'unité de traitement</text>
    <text x="790" y="622" class="body" font-size="11.5" fill="#5A5A5A">n'est plus la personne, et l'élasticité-prix</text>
    <text x="790" y="642" class="body" font-size="11.5" fill="#5A5A5A">n'a plus le même sens face à une machine.</text>
  </g>

  <!-- PRINCIPE -->
  <g class="interactive" data-card="principe-agentique" tabindex="0" role="button" aria-label="Le principe directeur — détails">
    <rect x="60" y="682" width="1080" height="52" rx="3" fill="#B7332C" stroke="#B7332C" stroke-width="1.25"/>
    <text x="80" y="714" class="display" font-size="16" font-style="italic" fill="#FAF8F3">Un agent qui optimise sur des corrélations ne se trompe pas moins qu'un humain : il se trompe plus vite, et sans témoin.</text>
  </g>

  <line x1="60" y1="754" x2="1140" y2="754" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="776" class="body" font-size="10" font-style="italic" fill="#5A5A5A">Sources : Jin et al., Corr2Cause ; Zečević et al., « Causal Parrots » ; Roy et al., arXiv:2605.27567 ; Chen et al., CausalGame (arXiv:2607.04293). — Mathieu Guglielmino.</text>
</svg>
