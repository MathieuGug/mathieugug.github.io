<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="Grammaire du graphe causal : trois structures élémentaires et quatre rôles de variable">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="900" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 03 · GRAMMAIRE DU DAG</text>
  <text x="60" y="110" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois briques, quatre <tspan font-style="italic">rôles</tspan>, un seul geste.</text>
  <text x="60" y="141" class="display" font-size="16" font-style="italic" fill="#5A5A5A">Ce qu'il faut mettre dans le modèle — et surtout ce qu'il ne faut pas y mettre.</text>
  <line x1="60" y1="160" x2="840" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">A · LES TROIS STRUCTURES ÉLÉMENTAIRES</text>

  <!-- CHAÎNE -->
  <g class="interactive" data-card="struct-chaine" tabindex="0" role="button" aria-label="Structure chaîne — détails">
    <rect x="60" y="214" width="240" height="250" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <circle cx="105" cy="285" r="18" fill="#FAF8F3" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="105" y="290" class="mono" font-size="12" fill="#1A1A1A" text-anchor="middle">X</text>
    <circle cx="180" cy="285" r="18" fill="#FAF8F3" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="180" y="290" class="mono" font-size="12" fill="#1A1A1A" text-anchor="middle">M</text>
    <circle cx="255" cy="285" r="18" fill="#FAF8F3" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="255" y="290" class="mono" font-size="12" fill="#1A1A1A" text-anchor="middle">Y</text>
    <line x1="127" y1="285" x2="150" y2="285" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
    <line x1="202" y1="285" x2="225" y2="285" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
    <text x="80" y="348" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Chaîne</text>
    <text x="80" y="372" class="body" font-size="11" fill="#5A5A5A">Le chemin est <tspan font-weight="500" fill="#1A1A1A">ouvert</tspan>.</text>
    <text x="80" y="390" class="body" font-size="11" fill="#5A5A5A">Conditionner sur M le ferme</text>
    <text x="80" y="406" class="body" font-size="11" fill="#5A5A5A">— et détruit l'effet total.</text>
    <text x="80" y="434" class="mono" font-size="10" letter-spacing="1" fill="#B7332C">EXEMPLE RETAIL</text>
    <text x="80" y="452" class="body" font-size="11" fill="#1A1A1A">Promo → trafic → ventes</text>
  </g>

  <!-- FOURCHE -->
  <g class="interactive" data-card="struct-fourche" tabindex="0" role="button" aria-label="Structure fourche — détails">
    <rect x="330" y="214" width="240" height="250" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <circle cx="450" cy="248" r="18" fill="#FAF8F3" stroke="#B7332C" stroke-width="2.5"/>
    <text x="450" y="253" class="mono" font-size="12" fill="#B7332C" text-anchor="middle">Z</text>
    <circle cx="390" cy="328" r="18" fill="#FAF8F3" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="390" y="333" class="mono" font-size="12" fill="#1A1A1A" text-anchor="middle">X</text>
    <circle cx="510" cy="328" r="18" fill="#FAF8F3" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="510" y="333" class="mono" font-size="12" fill="#1A1A1A" text-anchor="middle">Y</text>
    <line x1="437" y1="266" x2="408" y2="304" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
    <line x1="463" y1="266" x2="492" y2="304" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
    <text x="350" y="378" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Fourche</text>
    <text x="350" y="402" class="body" font-size="11" fill="#5A5A5A">Chemin dérobé <tspan font-weight="500" fill="#1A1A1A">ouvert</tspan> :</text>
    <text x="350" y="418" class="body" font-size="11" fill="#5A5A5A">X et Y corrèlent sans lien</text>
    <text x="350" y="434" class="body" font-size="11" fill="#5A5A5A">causal. Conditionner sur Z.</text>
    <text x="350" y="452" class="mono" font-size="10" letter-spacing="1" fill="#B7332C">EX. : SAISONNALITÉ → {PROMO, VENTES}</text>
  </g>

  <!-- COLLIDER -->
  <g class="interactive" data-card="struct-collider" tabindex="0" role="button" aria-label="Structure collider — détails">
    <rect x="600" y="214" width="240" height="250" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <circle cx="660" cy="248" r="18" fill="#FAF8F3" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="660" y="253" class="mono" font-size="12" fill="#1A1A1A" text-anchor="middle">X</text>
    <circle cx="780" cy="248" r="18" fill="#FAF8F3" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="780" y="253" class="mono" font-size="12" fill="#1A1A1A" text-anchor="middle">Y</text>
    <circle cx="720" cy="328" r="18" fill="#FAF8F3" stroke="#1F5560" stroke-width="2.5"/>
    <text x="720" y="333" class="mono" font-size="12" fill="#1F5560" text-anchor="middle">C</text>
    <line x1="673" y1="266" x2="702" y2="304" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
    <line x1="767" y1="266" x2="738" y2="304" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
    <text x="620" y="378" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Collisionneur</text>
    <text x="620" y="402" class="body" font-size="11" fill="#5A5A5A">Chemin <tspan font-weight="500" fill="#1A1A1A">fermé</tspan> par défaut.</text>
    <text x="620" y="418" class="body" font-size="11" fill="#5A5A5A">Conditionner sur C l'<tspan font-style="italic">ouvre</tspan></text>
    <text x="620" y="434" class="body" font-size="11" fill="#5A5A5A">et fabrique un faux lien.</text>
    <text x="620" y="452" class="mono" font-size="10" letter-spacing="1" fill="#B7332C">EX. : PROMO → RUPTURE ← DEMANDE</text>
  </g>

  <text x="60" y="502" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">B · LES QUATRE RÔLES, ET LE GESTE ASSOCIÉ</text>

  <!-- ROLE 1 : CONFONDEUR -->
  <g class="interactive" data-card="role-confondeur" tabindex="0" role="button" aria-label="Rôle confondeur — détails">
    <rect x="60" y="520" width="380" height="140" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="546" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">RÔLE 1</text>
    <text x="80" y="572" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Confondeur</text>
    <text x="80" y="596" class="body" font-size="11.5" fill="#5A5A5A">Cause commune du levier et du résultat.</text>
    <text x="80" y="614" class="body" font-size="11.5" fill="#5A5A5A">Saison, calendrier promo national, météo, prix concurrent.</text>
    <rect x="80" y="626" width="340" height="24" rx="2" fill="#F2EFE7"/>
    <text x="92" y="643" class="mono" font-size="11" font-weight="600" fill="#1F5560">GESTE → CONDITIONNER. Sans ça, le ROI est gonflé.</text>
  </g>

  <!-- ROLE 2 : MÉDIATEUR -->
  <g class="interactive" data-card="role-mediateur" tabindex="0" role="button" aria-label="Rôle médiateur — détails">
    <rect x="460" y="520" width="380" height="140" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="480" y="546" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">RÔLE 2</text>
    <text x="480" y="572" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Médiateur</text>
    <text x="480" y="596" class="body" font-size="11.5" fill="#5A5A5A">Sur le chemin causal entre le levier et le résultat.</text>
    <text x="480" y="614" class="body" font-size="11.5" fill="#5A5A5A">Trafic magasin, recherche de marque, panier moyen.</text>
    <rect x="480" y="626" width="340" height="24" rx="2" fill="#F2EFE7"/>
    <text x="492" y="643" class="mono" font-size="11" font-weight="600" fill="#B58A2C">GESTE → NE PAS conditionner (effet total).</text>
  </g>

  <!-- ROLE 3 : COLLIDER -->
  <g class="interactive" data-card="role-collider" tabindex="0" role="button" aria-label="Rôle collisionneur — détails">
    <rect x="60" y="680" width="380" height="140" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="706" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">RÔLE 3</text>
    <text x="80" y="732" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Collisionneur</text>
    <text x="80" y="756" class="body" font-size="11.5" fill="#5A5A5A">Effet commun du levier et d'une autre cause.</text>
    <text x="80" y="774" class="body" font-size="11.5" fill="#5A5A5A">Rupture de stock, saturation de la logistique, file en caisse.</text>
    <rect x="80" y="786" width="340" height="24" rx="2" fill="#F2EFE7"/>
    <text x="92" y="803" class="mono" font-size="11" font-weight="600" fill="#B7332C">GESTE → NE JAMAIS conditionner. Crée un biais.</text>
  </g>

  <!-- ROLE 4 : BAD CONTROL -->
  <g class="interactive" data-card="role-bad-control" tabindex="0" role="button" aria-label="Rôle mauvais contrôle — détails">
    <rect x="460" y="680" width="380" height="140" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="480" y="706" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">RÔLE 4</text>
    <text x="480" y="732" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Descendant du résultat</text>
    <text x="480" y="756" class="body" font-size="11.5" fill="#5A5A5A">Conséquence de Y, pas cause. Le « mauvais contrôle ».</text>
    <text x="480" y="774" class="body" font-size="11.5" fill="#5A5A5A">Marge réalisée, encours de SAV, réassort déclenché.</text>
    <rect x="480" y="786" width="340" height="24" rx="2" fill="#F2EFE7"/>
    <text x="492" y="803" class="mono" font-size="11" font-weight="600" fill="#B7332C">GESTE → EXCLURE du jeu de features.</text>
  </g>

  <line x1="60" y1="842" x2="840" y2="842" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="862" class="body" font-size="10" font-style="italic" fill="#5A5A5A">La sélection de features d'un modèle prédictif maximise le fit. Celle d'un modèle causal obéit à un critère graphique.</text>
  <text x="60" y="880" class="body" font-size="10" font-style="italic" fill="#5A5A5A">Source : critère de porte dérobée, Pearl (2009). — Mathieu Guglielmino.</text>
</svg>
