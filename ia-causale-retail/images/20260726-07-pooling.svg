<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Trois régimes de mutualisation : pooling complet, pooling nul, pooling partiel">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 07 · RÉGIMES DE MUTUALISATION</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">40 000 modèles séparés, c'est un <tspan font-style="italic">choix</tspan> statistique.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Entre un modèle unique et 40 000 modèles isolés, il existe un troisième régime — et il est bien documenté.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <!-- PANEL 1 : POOLING COMPLET -->
  <g class="interactive" data-card="pooling-complet" tabindex="0" role="button" aria-label="Pooling complet — détails">
    <rect x="60" y="196" width="340" height="330" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="224" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">RÉGIME A</text>
    <text x="80" y="252" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Mutualisation totale</text>
    <text x="80" y="272" class="body" font-size="11" font-style="italic" fill="#5A5A5A">un modèle national, un coefficient</text>

    <rect x="100" y="290" width="245" height="42" rx="3" fill="#1F5560" stroke="#1F5560" stroke-width="1.25"/>
    <text x="222" y="316" class="mono" font-size="13" fill="#FAF8F3" text-anchor="middle">β commun</text>
    <line x1="222" y1="332" x2="222" y2="350" stroke="#1A1A1A" stroke-width="1.25"/>
    <line x1="125" y1="350" x2="320" y2="350" stroke="#1A1A1A" stroke-width="1.25"/>
    <line x1="125" y1="350" x2="125" y2="366" stroke="#1A1A1A" stroke-width="1.25"/>
    <line x1="190" y1="350" x2="190" y2="366" stroke="#1A1A1A" stroke-width="1.25"/>
    <line x1="255" y1="350" x2="255" y2="366" stroke="#1A1A1A" stroke-width="1.25"/>
    <line x1="320" y1="350" x2="320" y2="366" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="100" y="368" width="50" height="42" rx="2" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1"/>
    <rect x="165" y="368" width="50" height="42" rx="2" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1"/>
    <rect x="230" y="368" width="50" height="42" rx="2" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1"/>
    <rect x="295" y="368" width="50" height="42" rx="2" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1"/>
    <text x="222" y="428" class="body" font-size="10.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">cellules sous-rayon × région</text>

    <text x="80" y="458" class="mono" font-size="11" font-weight="600" fill="#B7332C">BIAIS ↑↑ · VARIANCE ↓↓</text>
    <text x="80" y="480" class="body" font-size="11.5" fill="#5A5A5A">Un seul chiffre pour 200 sous-rayons.</text>
    <text x="80" y="497" class="body" font-size="11.5" fill="#5A5A5A">Toute l'hétérogénéité disparaît — or c'est</text>
    <text x="80" y="514" class="body" font-size="11.5" fill="#5A5A5A">exactement elle qui intéresse le commerçant.</text>
  </g>

  <!-- PANEL 2 : POOLING NUL -->
  <g class="interactive" data-card="pooling-nul" tabindex="0" role="button" aria-label="Pooling nul — détails">
    <rect x="430" y="196" width="340" height="330" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <text x="450" y="224" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">RÉGIME B — LE DISPOSITIF DÉCRIT</text>
    <text x="450" y="252" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Aucune mutualisation</text>
    <text x="450" y="272" class="body" font-size="11" font-style="italic" fill="#5A5A5A">40 000 modèles unitaires, chacun seul</text>

    <text x="592" y="316" class="body" font-size="12" font-style="italic" fill="#B8B5AE" text-anchor="middle">— aucun lien entre les cellules —</text>
    <line x1="470" y1="332" x2="715" y2="332" stroke="#B8B5AE" stroke-width="0.75" stroke-dasharray="2 5"/>
    <rect x="470" y="368" width="50" height="42" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="495" y="394" class="mono" font-size="11" fill="#1A1A1A" text-anchor="middle">β₁</text>
    <rect x="535" y="368" width="50" height="42" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="560" y="394" class="mono" font-size="11" fill="#1A1A1A" text-anchor="middle">β₂</text>
    <rect x="600" y="368" width="50" height="42" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="625" y="394" class="mono" font-size="11" fill="#1A1A1A" text-anchor="middle">β₃</text>
    <rect x="665" y="368" width="50" height="42" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="690" y="394" class="mono" font-size="11" fill="#1A1A1A" text-anchor="middle">β₄</text>
    <text x="592" y="428" class="body" font-size="10.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">chaque cellule réapprend tout de zéro</text>

    <text x="450" y="458" class="mono" font-size="11" font-weight="600" fill="#B7332C">BIAIS ↓ · VARIANCE ↑↑</text>
    <text x="450" y="480" class="body" font-size="11.5" fill="#5A5A5A">Les cellules bien fournies s'en sortent. Les</text>
    <text x="450" y="497" class="body" font-size="11.5" fill="#5A5A5A">cellules maigres produisent du bruit — mais</text>
    <text x="450" y="514" class="body" font-size="11.5" fill="#5A5A5A">du bruit <tspan font-weight="500" fill="#1A1A1A">signé</tspan>, donc lu comme un arbitrage.</text>
  </g>

  <!-- PANEL 3 : POOLING PARTIEL -->
  <g class="interactive" data-card="pooling-partiel" tabindex="0" role="button" aria-label="Pooling partiel hiérarchique — détails">
    <rect x="800" y="196" width="340" height="330" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="820" y="224" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">RÉGIME C</text>
    <text x="820" y="252" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Mutualisation partielle</text>
    <text x="820" y="272" class="body" font-size="11" font-style="italic" fill="#5A5A5A">hiérarchie bayésienne, rétrécissement</text>

    <rect x="840" y="290" width="245" height="42" rx="3" fill="#B58A2C" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="962" y="316" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">μ, τ — a priori partagé</text>
    <line x1="865" y1="336" x2="865" y2="362" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow-soft)" marker-start="url(#arrow-soft)"/>
    <line x1="930" y1="336" x2="930" y2="362" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow-soft)" marker-start="url(#arrow-soft)"/>
    <line x1="995" y1="336" x2="995" y2="362" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow-soft)" marker-start="url(#arrow-soft)"/>
    <line x1="1060" y1="336" x2="1060" y2="362" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arrow-soft)" marker-start="url(#arrow-soft)"/>
    <rect x="840" y="368" width="50" height="42" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="865" y="394" class="mono" font-size="11" fill="#1A1A1A" text-anchor="middle">β₁</text>
    <rect x="905" y="368" width="50" height="42" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="930" y="394" class="mono" font-size="11" fill="#1A1A1A" text-anchor="middle">β₂</text>
    <rect x="970" y="368" width="50" height="42" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="995" y="394" class="mono" font-size="11" fill="#1A1A1A" text-anchor="middle">β₃</text>
    <rect x="1035" y="368" width="50" height="42" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="1060" y="394" class="mono" font-size="11" fill="#1A1A1A" text-anchor="middle">β₄</text>
    <text x="962" y="428" class="body" font-size="10.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">chaque cellule emprunte de la force aux autres</text>

    <text x="820" y="458" class="mono" font-size="11" font-weight="600" fill="#1F5560">BIAIS ↓ · VARIANCE ↓</text>
    <text x="820" y="480" class="body" font-size="11.5" fill="#5A5A5A">Le rétrécissement est proportionnel au bruit :</text>
    <text x="820" y="497" class="body" font-size="11.5" fill="#5A5A5A">une cellule bien dotée garde son estimation,</text>
    <text x="820" y="514" class="body" font-size="11.5" fill="#5A5A5A">une cellule maigre est tirée vers la moyenne.</text>
  </g>

  <!-- BANDE BASSE -->
  <g class="interactive" data-card="tension-40000" tabindex="0" role="button" aria-label="La tension du dispositif décrit — détails">
    <rect x="60" y="552" width="520" height="158" rx="3" fill="#F2EFE7" stroke="#B7332C" stroke-width="1.25"/>
    <text x="80" y="580" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">CE QUE DIT LA FORMULE « 40 000 MODÈLES UNITAIRES »</text>
    <text x="80" y="608" class="body" font-size="12.5" fill="#1A1A1A">Descendre à 400 000 modèles « ne marcherait plus » : trop de</text>
    <text x="80" y="627" class="body" font-size="12.5" fill="#1A1A1A">compute, et des combinaisons non significatives. C'est le diagnostic</text>
    <text x="80" y="646" class="body" font-size="12.5" fill="#1A1A1A">exact du régime B — la variance explose quand les cellules maigrissent.</text>
    <text x="80" y="674" class="body" font-size="12.5" font-weight="500" fill="#B7332C">Le mur n'est pas un mur de calcul. C'est un mur d'information.</text>
    <text x="80" y="695" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Ajouter des GPU ne crée pas de tickets de caisse supplémentaires.</text>
  </g>

  <g class="interactive" data-card="alternative-hierarchique" tabindex="0" role="button" aria-label="L'alternative hiérarchique — détails">
    <rect x="620" y="552" width="520" height="158" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="640" y="580" class="mono" font-size="10" letter-spacing="1.5" fill="#1F5560">CE QUE LE RÉGIME C CHANGERAIT</text>
    <text x="640" y="608" class="body" font-size="12.5" fill="#1A1A1A">Un modèle hiérarchique estime toutes les cellules <tspan font-style="italic">conjointement</tspan>.</text>
    <text x="640" y="627" class="body" font-size="12.5" fill="#1A1A1A">La maille magasin cesse alors d'être un mur : les 140 magasins</text>
    <text x="640" y="646" class="body" font-size="12.5" fill="#1A1A1A">deviennent 140 réalisations d'un même effet régional, pas 140 problèmes.</text>
    <text x="640" y="674" class="body" font-size="12.5" font-weight="500" fill="#1F5560">C'est le choix de Meridian : hiérarchie géographique, pas parallélisme.</text>
    <text x="640" y="695" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Prix à payer : un seul gros modèle à faire converger, moins facile à débuguer.</text>
  </g>

  <line x1="60" y1="738" x2="1140" y2="738" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="760" class="body" font-size="10" font-style="italic" fill="#5A5A5A">Lecture d'analyste : l'architecture réelle du moteur Ekimetrics n'est pas publique ; le raisonnement porte sur la description publiée (« modèles unitaires »).</text>
  <text x="60" y="778" class="body" font-size="10" font-style="italic" fill="#5A5A5A">Sources : LeMagIT (2026) ; Sun et al., « Geo-level Bayesian Hierarchical Media Mix Modeling » (Google, 2017). — Mathieu Guglielmino.</text>
</svg>
