<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Anatomie combinatoire des 40 000 modèles de Leroy Merlin">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-emph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 01 · MAILLE D'ANALYSE</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Les « 40 000 IA » ne sont pas 40 000 <tspan font-style="italic">idées</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">C'est une combinatoire de mailles — et une frontière de compute assumée.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <!-- CASCADE -->
  <text x="60" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">LA COMBINATOIRE RETENUE</text>

  <g class="interactive" data-card="leviers" tabindex="0" role="button" aria-label="Leviers commerciaux — détails">
    <rect x="60" y="212" width="185" height="132" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="78" y="236" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">DIMENSION 1</text>
    <text x="78" y="276" class="display" font-size="34" font-weight="600" fill="#1A1A1A">13</text>
    <text x="78" y="300" class="body" font-size="12" font-weight="500" fill="#1A1A1A">leviers commerciaux</text>
    <text x="78" y="320" class="body" font-size="11" fill="#5A5A5A">fidélité, remises,</text>
    <text x="78" y="335" class="body" font-size="11" fill="#5A5A5A">promotions, média…</text>
  </g>
  <text x="264" y="286" class="display" font-size="22" fill="#B8B5AE" text-anchor="middle">×</text>

  <g class="interactive" data-card="sous-rayons" tabindex="0" role="button" aria-label="Sous-rayons — détails">
    <rect x="295" y="212" width="185" height="132" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="313" y="236" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">DIMENSION 2</text>
    <text x="313" y="276" class="display" font-size="34" font-weight="600" fill="#1A1A1A">200</text>
    <text x="313" y="300" class="body" font-size="12" font-weight="500" fill="#1A1A1A">sous-rayons</text>
    <text x="313" y="320" class="body" font-size="11" fill="#5A5A5A">réagrégés depuis la</text>
    <text x="313" y="335" class="body" font-size="11" fill="#5A5A5A">maille ticket de caisse</text>
  </g>
  <text x="499" y="286" class="display" font-size="22" fill="#B8B5AE" text-anchor="middle">×</text>

  <g class="interactive" data-card="regions" tabindex="0" role="button" aria-label="Régions — détails">
    <rect x="530" y="212" width="185" height="132" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="548" y="236" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">DIMENSION 3</text>
    <text x="548" y="276" class="display" font-size="34" font-weight="600" fill="#1A1A1A">11</text>
    <text x="548" y="300" class="body" font-size="12" font-weight="500" fill="#1A1A1A">régions</text>
    <text x="548" y="320" class="body" font-size="11" fill="#5A5A5A">et non 140 magasins :</text>
    <text x="548" y="335" class="body" font-size="11" fill="#5A5A5A">c'est l'arbitrage clé</text>
  </g>
  <text x="734" y="286" class="display" font-size="22" fill="#B8B5AE" text-anchor="middle">×</text>

  <g class="interactive" data-card="typologies" tabindex="0" role="button" aria-label="Typologies clients — détails">
    <rect x="765" y="212" width="185" height="132" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="783" y="236" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">DIMENSION 4</text>
    <text x="783" y="276" class="display" font-size="34" font-weight="600" fill="#1A1A1A">n</text>
    <text x="783" y="300" class="body" font-size="12" font-weight="500" fill="#1A1A1A">typologies clients</text>
    <text x="783" y="320" class="body" font-size="11" fill="#5A5A5A">à raffiner : segments</text>
    <text x="783" y="335" class="body" font-size="11" fill="#5A5A5A">pro et « projet »</text>
  </g>
  <text x="969" y="286" class="display" font-size="22" fill="#B8B5AE" text-anchor="middle">=</text>

  <g class="interactive" data-card="resultat" tabindex="0" role="button" aria-label="Résultat 40 000 modèles — détails">
    <rect x="990" y="212" width="150" height="132" rx="3" fill="#B7332C" stroke="#B7332C" stroke-width="1.25"/>
    <text x="1008" y="236" class="mono" font-size="10" letter-spacing="1.5" fill="#FAF8F3">RÉSULTAT</text>
    <text x="1008" y="278" class="display" font-size="32" font-weight="600" fill="#FAF8F3">40 000</text>
    <text x="1008" y="302" class="body" font-size="12" font-weight="500" fill="#FAF8F3">modèles unitaires</text>
    <text x="1008" y="322" class="body" font-size="11" fill="#F2EFE7">≈ 48 h de calcul</text>
    <text x="1008" y="337" class="body" font-size="11" fill="#F2EFE7">continu par cycle</text>
  </g>

  <!-- AXE DE MAILLE -->
  <text x="60" y="404" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">L'ARBITRAGE DE GRANULARITÉ</text>
  <line x1="60" y1="470" x2="1100" y2="470" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>

  <g>
    <circle cx="140" cy="470" r="6" fill="#1F5560"/>
    <text x="140" y="500" class="body" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">National</text>
    <text x="140" y="518" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">1 modèle</text>
  </g>
  <g>
    <circle cx="400" cy="470" r="6" fill="#1F5560"/>
    <text x="400" y="500" class="body" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">MMM classique</text>
    <text x="400" y="518" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">quelques dizaines</text>
  </g>
  <g class="interactive" data-card="arbitrage" tabindex="0" role="button" aria-label="Point d'arbitrage retenu — détails">
    <circle cx="700" cy="470" r="9" fill="#B7332C"/>
    <line x1="700" y1="461" x2="700" y2="424" stroke="#B7332C" stroke-width="0.75"/>
    <text x="700" y="416" class="body" font-size="12" font-weight="500" fill="#B7332C" text-anchor="middle">Point retenu</text>
    <text x="700" y="500" class="body" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">Sous-rayon × région</text>
    <text x="700" y="518" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">40 000 modèles</text>
  </g>
  <g class="interactive" data-card="mur-compute" tabindex="0" role="button" aria-label="Le mur des 400 000 modèles — détails">
    <circle cx="990" cy="470" r="6" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25"/>
    <line x1="990" y1="440" x2="990" y2="500" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="2 3"/>
    <text x="990" y="432" class="body" font-size="11" font-style="italic" fill="#B7332C" text-anchor="middle">mur</text>
    <text x="990" y="518" class="body" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">Maille magasin</text>
    <text x="990" y="536" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">400 000 modèles</text>
  </g>

  <!-- CE QUI MONTE / CE QUI DESCEND -->
  <line x1="60" y1="572" x2="1140" y2="572" stroke="#E5E1D8" stroke-width="1"/>

  <g class="interactive" data-card="ce-qui-monte" tabindex="0" role="button" aria-label="Ce qui augmente avec la finesse — détails">
    <rect x="60" y="592" width="330" height="130" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="618" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">↑ CE QUI AUGMENTE</text>
    <text x="80" y="644" class="body" font-size="12" fill="#1A1A1A">Coût de calcul et durée de cycle</text>
    <text x="80" y="666" class="body" font-size="12" fill="#1A1A1A">Variance des estimateurs</text>
    <text x="80" y="688" class="body" font-size="12" fill="#1A1A1A">Surface d'erreur à monitorer</text>
    <text x="80" y="710" class="body" font-size="12" fill="#1A1A1A">Nombre de tests multiples</text>
  </g>

  <g class="interactive" data-card="ce-qui-descend" tabindex="0" role="button" aria-label="Ce qui diminue avec la finesse — détails">
    <rect x="415" y="592" width="330" height="130" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <text x="435" y="618" class="mono" font-size="10" letter-spacing="1.5" fill="#1F5560">↓ CE QUI DIMINUE</text>
    <text x="435" y="644" class="body" font-size="12" fill="#1A1A1A">Biais d'agrégation entre segments</text>
    <text x="435" y="666" class="body" font-size="12" fill="#1A1A1A">Confusion par mix produit / région</text>
    <text x="435" y="688" class="body" font-size="12" fill="#1A1A1A">Significativité par cellule</text>
    <text x="435" y="710" class="body" font-size="12" fill="#1A1A1A">Cohérence avec le niveau national</text>
  </g>

  <g class="interactive" data-card="lecture" tabindex="0" role="button" aria-label="Lecture technique de l'arbitrage — détails">
    <rect x="770" y="592" width="370" height="130" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="790" y="618" class="mono" font-size="10" letter-spacing="1.5" fill="#1A1A1A">LECTURE</text>
    <text x="790" y="644" class="display" font-size="14" font-style="italic" fill="#1A1A1A">La question n'est pas « combien de</text>
    <text x="790" y="664" class="display" font-size="14" font-style="italic" fill="#1A1A1A">modèles ? » mais « à partir de quelle</text>
    <text x="790" y="684" class="display" font-size="14" font-style="italic" fill="#1A1A1A">maille l'effet cesse d'être identifiable</text>
    <text x="790" y="704" class="display" font-size="14" font-style="italic" fill="#1A1A1A">avec une variance utilisable ? »</text>
  </g>

  <!-- FOOTER -->
  <text x="60" y="762" class="body" font-size="10" font-style="italic" fill="#5A5A5A">Sources : LeMagIT (juillet 2026), déclarations Leroy Merlin / Ekimetrics. Chiffres communiqués par l'entreprise. — Mathieu Guglielmino.</text>
</svg>
