<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Pipeline MLOps causal : graphe versionné et porte de réfutation">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-emph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 08 · ARCHITECTURE D'EXÉCUTION</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Le graphe est du <tspan font-style="italic">code</tspan>. La validation n'est pas un score.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Ce qu'il faut ajouter à une chaîne MLOps standard pour qu'elle porte de l'inférence causale.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <!-- SPÉCIFICATION CAUSALE -->
  <g class="interactive" data-card="spec-causale" tabindex="0" role="button" aria-label="Le graphe causal comme artefact versionné — détails">
    <rect x="284" y="192" width="632" height="98" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <text x="304" y="216" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ARTEFACT DE PREMIER RANG — VERSIONNÉ, REVU, TESTÉ</text>
    <text x="304" y="244" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le graphe causal</text>
    <line x1="560" y1="204" x2="560" y2="278" stroke="#E5E1D8" stroke-width="1"/>
    <line x1="740" y1="204" x2="740" y2="278" stroke="#E5E1D8" stroke-width="1"/>
    <text x="304" y="266" class="body" font-size="11" fill="#5A5A5A">Fichier DOT ou YAML dans le dépôt,</text>
    <text x="304" y="281" class="body" font-size="11" fill="#5A5A5A">relu en revue par un chef de produit.</text>
    <text x="576" y="244" class="body" font-size="11" fill="#5A5A5A">Modifier une arête,</text>
    <text x="576" y="259" class="body" font-size="11" fill="#5A5A5A">c'est modifier l'estimand :</text>
    <text x="576" y="274" class="body" font-size="11" fill="#5A5A5A">tout doit être rejoué.</text>
    <text x="756" y="244" class="body" font-size="11" fill="#5A5A5A">Il dérive. Les paramètres</text>
    <text x="756" y="259" class="body" font-size="11" fill="#5A5A5A">du graphe bougent quand</text>
    <text x="756" y="274" class="body" font-size="11" fill="#5A5A5A">le marché bouge.</text>
  </g>
  <line x1="376" y1="294" x2="376" y2="316" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrow-emph)"/>
  <line x1="600" y1="294" x2="600" y2="316" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrow-emph)"/>
  <line x1="824" y1="294" x2="824" y2="316" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrow-emph)"/>

  <!-- PIPELINE -->
  <g class="interactive" data-card="stage-sources" tabindex="0" role="button" aria-label="Sources de données — détails">
    <rect x="60" y="330" width="184" height="144" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="76" y="354" class="mono" font-size="9" letter-spacing="1.5" fill="#5A5A5A">1 · SOURCES</text>
    <text x="76" y="380" class="body" font-size="11" fill="#1A1A1A">Data lake groupe</text>
    <text x="76" y="399" class="body" font-size="11" fill="#1A1A1A">Tickets de caisse</text>
    <text x="76" y="418" class="body" font-size="11" fill="#1A1A1A">CRM fidélité</text>
    <text x="76" y="437" class="body" font-size="11" fill="#1A1A1A">Calendrier promo</text>
    <text x="76" y="456" class="body" font-size="11" fill="#1A1A1A">Météo, relevés prix</text>
  </g>
  <line x1="248" y1="402" x2="270" y2="402" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>

  <g class="interactive" data-card="stage-preparation" tabindex="0" role="button" aria-label="Préparation et mise à la maille — détails">
    <rect x="284" y="330" width="184" height="144" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="300" y="354" class="mono" font-size="9" letter-spacing="1.5" fill="#5A5A5A">2 · MISE À LA MAILLE</text>
    <text x="300" y="380" class="body" font-size="11" fill="#1A1A1A">Ticket → sous-rayon</text>
    <text x="300" y="399" class="body" font-size="11" fill="#1A1A1A">Web et magasin sur</text>
    <text x="300" y="414" class="body" font-size="11" fill="#1A1A1A">la même maille</text>
    <text x="300" y="437" class="body" font-size="11" fill="#1A1A1A">Rémanence, saturation</text>
    <text x="300" y="456" class="body" font-size="11" fill="#1A1A1A">Sélection de Z</text>
  </g>
  <line x1="472" y1="402" x2="494" y2="402" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>

  <g class="interactive" data-card="stage-entrainement" tabindex="0" role="button" aria-label="Entraînement en éventail — détails">
    <rect x="508" y="330" width="184" height="144" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="524" y="354" class="mono" font-size="9" letter-spacing="1.5" fill="#5A5A5A">3 · ENTRAÎNEMENT</text>
    <text x="524" y="380" class="body" font-size="11" fill="#1A1A1A">Éventail orchestré</text>
    <text x="524" y="395" class="body" font-size="11" fill="#1A1A1A">de N jobs unitaires</text>
    <text x="524" y="418" class="body" font-size="11" fill="#1A1A1A">≈ 48 h de calcul</text>
    <text x="524" y="437" class="body" font-size="11" fill="#1A1A1A">Cycle trimestriel</text>
    <text x="524" y="456" class="body" font-size="11" fill="#1A1A1A">Reprise sur échec</text>
  </g>
  <line x1="696" y1="402" x2="718" y2="402" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>

  <g class="interactive" data-card="stage-validation" tabindex="0" role="button" aria-label="Porte de validation causale — détails">
    <rect x="732" y="330" width="184" height="144" rx="3" fill="#B7332C" stroke="#B7332C" stroke-width="1.25"/>
    <text x="748" y="354" class="mono" font-size="9" letter-spacing="1.5" fill="#FAF8F3">4 · PORTE DE VALIDATION</text>
    <text x="748" y="380" class="body" font-size="11" fill="#FAF8F3">Fit hors échantillon</text>
    <text x="748" y="399" class="body" font-size="11" fill="#FAF8F3">Traitement placebo</text>
    <text x="748" y="418" class="body" font-size="11" fill="#FAF8F3">Cause commune aléatoire</text>
    <text x="748" y="437" class="body" font-size="11" fill="#FAF8F3">Sous-échantillonnage</text>
    <text x="748" y="456" class="body" font-size="11" fill="#FAF8F3">Valeur de robustesse</text>
  </g>
  <line x1="920" y1="402" x2="942" y2="402" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>

  <g class="interactive" data-card="stage-service" tabindex="0" role="button" aria-label="Service et décision — détails">
    <rect x="956" y="330" width="184" height="144" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="972" y="354" class="mono" font-size="9" letter-spacing="1.5" fill="#5A5A5A">5 · SERVICE</text>
    <text x="972" y="380" class="body" font-size="11" fill="#1A1A1A">Tableau de bord</text>
    <text x="972" y="399" class="body" font-size="11" fill="#1A1A1A">Simulateur de</text>
    <text x="972" y="414" class="body" font-size="11" fill="#1A1A1A">réallocation</text>
    <text x="972" y="437" class="body" font-size="11" fill="#1A1A1A">30 à 40 décideurs</text>
    <text x="972" y="456" class="body" font-size="11" fill="#1A1A1A">Cible : ~100 chefs produit</text>
  </g>

  <!-- TICKS VERS L'OBSERVABILITÉ -->
  <line x1="152" y1="478" x2="152" y2="514" stroke="#B8B5AE" stroke-width="0.75" stroke-dasharray="2 3"/>
  <line x1="376" y1="478" x2="376" y2="514" stroke="#B8B5AE" stroke-width="0.75" stroke-dasharray="2 3"/>
  <line x1="600" y1="478" x2="600" y2="514" stroke="#B8B5AE" stroke-width="0.75" stroke-dasharray="2 3"/>
  <line x1="824" y1="478" x2="824" y2="514" stroke="#B8B5AE" stroke-width="0.75" stroke-dasharray="2 3"/>
  <line x1="1048" y1="478" x2="1048" y2="514" stroke="#B8B5AE" stroke-width="0.75" stroke-dasharray="2 3"/>

  <!-- OBSERVABILITÉ -->
  <g class="interactive" data-card="observabilite" tabindex="0" role="button" aria-label="Bus d'observabilité — détails">
    <rect x="60" y="516" width="1080" height="88" rx="3" fill="#F2EFE7" stroke="#1F5560" stroke-width="1.25"/>
    <text x="80" y="540" class="mono" font-size="10" letter-spacing="1.5" fill="#1F5560">BUS D'OBSERVABILITÉ — TRANSVERSAL</text>
    <line x1="330" y1="552" x2="330" y2="592" stroke="#E5E1D8" stroke-width="1"/>
    <line x1="600" y1="552" x2="600" y2="592" stroke="#E5E1D8" stroke-width="1"/>
    <line x1="870" y1="552" x2="870" y2="592" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="570" class="body" font-size="11.5" font-weight="500" fill="#1A1A1A">Lignage</text>
    <text x="80" y="588" class="body" font-size="11" fill="#5A5A5A">Quelle version de graphe a produit ce chiffre ?</text>
    <text x="350" y="570" class="body" font-size="11.5" font-weight="500" fill="#1A1A1A">Dérive des données</text>
    <text x="350" y="588" class="body" font-size="11" fill="#5A5A5A">Distributions d'entrée, couverture des cellules</text>
    <text x="620" y="570" class="body" font-size="11.5" font-weight="500" fill="#1A1A1A">Dérive du graphe</text>
    <text x="620" y="588" class="body" font-size="11" fill="#5A5A5A">Une arête est-elle devenue fausse ?</text>
    <text x="890" y="570" class="body" font-size="11.5" font-weight="500" fill="#1A1A1A">Reproductibilité</text>
    <text x="890" y="588" class="body" font-size="11" fill="#5A5A5A">Rejouer un run d'il y a six mois</text>
  </g>

  <!-- INSIGHT -->
  <g class="interactive" data-card="insight-validation" tabindex="0" role="button" aria-label="Ce qui change par rapport à un pipeline prédictif — détails">
    <rect x="60" y="632" width="1080" height="86" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="656" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LA DIFFÉRENCE STRUCTURANTE</text>
    <text x="80" y="682" class="display" font-size="16" font-style="italic" fill="#1A1A1A">Un pipeline prédictif possède une métrique d'arrêt : l'erreur hors échantillon. Un pipeline causal n'en a aucune —</text>
    <text x="80" y="705" class="display" font-size="16" font-style="italic" fill="#1A1A1A">aucun jeu de test ne contient le contrefactuel. La porte de validation ne peut donc être qu'une batterie de réfutations.</text>
  </g>

  <line x1="60" y1="742" x2="1140" y2="742" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="764" class="body" font-size="10" font-style="italic" fill="#5A5A5A">Sources : LeMagIT (2026) pour les paramètres d'exécution ; étude de cas ZenML / ADEO ; API de réfutation DoWhy. — Mathieu Guglielmino.</text>
</svg>
