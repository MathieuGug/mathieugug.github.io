<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Les trois barreaux de l'échelle causale appliqués au pilotage commercial">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 02 · HIÉRARCHIE DES QUESTIONS</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Trois barreaux, trois <tspan font-style="italic">questions</tspan> — un seul est budgétaire.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Un modèle entraîné au barreau 1 ne peut pas répondre à une question posée au barreau 3.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ESCALIER -->
  <rect x="60" y="550" width="76" height="60" rx="2" fill="#E5E1D8"/>
  <rect x="142" y="405" width="76" height="205" rx="2" fill="#B8B5AE"/>
  <rect x="224" y="260" width="76" height="350" rx="2" fill="#1F5560"/>
  <text x="98" y="586" class="mono" font-size="16" font-weight="600" fill="#5A5A5A" text-anchor="middle">1</text>
  <text x="180" y="441" class="mono" font-size="16" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
  <text x="262" y="296" class="mono" font-size="16" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
  <line x1="60" y1="610" x2="300" y2="610" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="60" y="634" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Chaque barreau exige</text>
  <text x="60" y="650" class="body" font-size="11" font-style="italic" fill="#5A5A5A">strictement plus</text>
  <text x="60" y="666" class="body" font-size="11" font-style="italic" fill="#5A5A5A">d'hypothèses que le</text>
  <text x="60" y="682" class="body" font-size="11" font-style="italic" fill="#5A5A5A">précédent.</text>

  <!-- CARTE 3 : CONTREFACTUEL -->
  <g class="interactive" data-card="barreau-3" tabindex="0" role="button" aria-label="Barreau 3 : contrefactuel — détails">
    <rect x="340" y="200" width="800" height="120" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="2.5"/>
    <line x1="700" y1="216" x2="700" y2="304" stroke="#E5E1D8" stroke-width="1"/>
    <text x="362" y="228" class="mono" font-size="10" letter-spacing="1.5" fill="#1F5560">BARREAU 3 · CONTREFACTUEL — IMAGINER</text>
    <text x="362" y="262" class="mono" font-size="19" font-weight="500" fill="#1A1A1A">P(Y₀ | promo = 1)</text>
    <text x="362" y="288" class="body" font-size="12" fill="#5A5A5A">Ce qui se serait passé sans la promo,</text>
    <text x="362" y="305" class="body" font-size="12" fill="#5A5A5A">pour les clients qui l'ont bel et bien reçue.</text>
    <text x="722" y="240" class="body" font-size="12" font-weight="500" fill="#1A1A1A">« Ces ventes auraient-elles eu lieu de toute façon ? »</text>
    <text x="722" y="266" class="body" font-size="12" fill="#5A5A5A">C'est la définition exacte de l'incrémentalité — et donc</text>
    <text x="722" y="283" class="body" font-size="12" fill="#5A5A5A">du ROI d'un levier. La quantité n'est jamais observée :</text>
    <text x="722" y="300" class="body" font-size="12" fill="#5A5A5A">elle est <tspan font-weight="500" fill="#1A1A1A">reconstruite sous hypothèses</tspan>.</text>
  </g>

  <!-- CARTE 2 : INTERVENTION -->
  <g class="interactive" data-card="barreau-2" tabindex="0" role="button" aria-label="Barreau 2 : intervention — détails">
    <rect x="340" y="345" width="800" height="120" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <line x1="700" y1="361" x2="700" y2="449" stroke="#E5E1D8" stroke-width="1"/>
    <text x="362" y="373" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">BARREAU 2 · INTERVENTION — FAIRE</text>
    <text x="362" y="407" class="mono" font-size="19" font-weight="500" fill="#1A1A1A">P(Y | do(promo))</text>
    <text x="362" y="433" class="body" font-size="12" fill="#5A5A5A">La distribution des ventes si je <tspan font-style="italic">décide</tspan></text>
    <text x="362" y="450" class="body" font-size="12" fill="#5A5A5A">la promo, au lieu de l'observer.</text>
    <text x="722" y="385" class="body" font-size="12" font-weight="500" fill="#1A1A1A">« Si j'active ce levier, que produit-il ? »</text>
    <text x="722" y="411" class="body" font-size="12" fill="#5A5A5A">Accessible depuis des données d'observation seulement si</text>
    <text x="722" y="428" class="body" font-size="12" fill="#5A5A5A">un critère d'identification s'applique : porte dérobée,</text>
    <text x="722" y="445" class="body" font-size="12" fill="#5A5A5A">porte de devant, variable instrumentale. Sinon : expérience.</text>
  </g>

  <!-- CARTE 1 : ASSOCIATION -->
  <g class="interactive" data-card="barreau-1" tabindex="0" role="button" aria-label="Barreau 1 : association — détails">
    <rect x="340" y="490" width="800" height="120" rx="3" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1.25"/>
    <line x1="700" y1="506" x2="700" y2="594" stroke="#E5E1D8" stroke-width="1"/>
    <text x="362" y="518" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">BARREAU 1 · ASSOCIATION — VOIR</text>
    <text x="362" y="552" class="mono" font-size="19" font-weight="500" fill="#1A1A1A">P(Y | promo)</text>
    <text x="362" y="578" class="body" font-size="12" fill="#5A5A5A">Ce que je constate dans l'historique</text>
    <text x="362" y="595" class="body" font-size="12" fill="#5A5A5A">quand une promo est présente.</text>
    <text x="722" y="530" class="body" font-size="12" font-weight="500" fill="#1A1A1A">« Les semaines de promo se vendent-elles mieux ? »</text>
    <text x="722" y="556" class="body" font-size="12" fill="#5A5A5A">Tout le machine learning prédictif vit ici — forecast de</text>
    <text x="722" y="573" class="body" font-size="12" fill="#5A5A5A">ventes, scoring de churn, reco produit. Excellent pour</text>
    <text x="722" y="590" class="body" font-size="12" fill="#5A5A5A">anticiper, <tspan font-weight="500" fill="#B7332C">structurellement muet pour arbitrer un budget</tspan>.</text>
  </g>

  <!-- BANDE BASSE -->
  <g class="interactive" data-card="probleme-fondamental" tabindex="0" role="button" aria-label="Le probleme fondamental de l'inference causale - details">
    <text x="340" y="648" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">PROBLÈME FONDAMENTAL</text>
    <text x="340" y="672" class="display" font-size="15" font-style="italic" fill="#1A1A1A">Pour une même unité, on n'observe jamais Y(1) et Y(0).</text>
    <text x="340" y="693" class="display" font-size="15" font-style="italic" fill="#1A1A1A">Le contrefactuel est toujours estimé, jamais mesuré.</text>
  </g>

  <g class="interactive" data-card="ordre-de-grandeur" tabindex="0" role="button" aria-label="Ordre de grandeur du biais de confusion - details">
    <rect x="340" y="708" width="800" height="54" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
    <text x="360" y="731" class="body" font-size="12" fill="#1A1A1A"><tspan class="mono" font-weight="600" fill="#B7332C">ORDRE DE GRANDEUR —</tspan> sur un cas réel de search payant, un ROAS estimé</text>
    <text x="360" y="751" class="body" font-size="12" fill="#1A1A1A">naïvement à <tspan class="mono" font-weight="600">8,4</tspan> tombe à <tspan class="mono" font-weight="600">1,9</tspan> après correction par porte dérobée. Facteur ≈ 4.</text>
  </g>

  <text x="60" y="786" class="body" font-size="10" font-style="italic" fill="#5A5A5A">Sources : Pearl &amp; Mackenzie (2018) ; Chen et al., « Bias Correction For Paid Search In Media Mix Modeling », arXiv:1807.03292. — Mathieu Guglielmino.</text>
</svg>
