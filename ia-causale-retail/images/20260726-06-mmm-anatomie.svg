<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Anatomie d'un Marketing Mix Model et points d'insertion du graphe causal">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 06 · MMM ET INFÉRENCE CAUSALE</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Le MMM est déjà un modèle causal — <tspan font-style="italic">implicite</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">L'expliciter ne change pas la chaîne de traitement. Cela change ce qu'on a le droit d'en conclure.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="192" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">LA CHAÎNE DE TRANSFORMATION D'UN MMM</text>

  <!-- STAGE 1 -->
  <g class="interactive" data-card="stage-signal" tabindex="0" role="button" aria-label="Signal brut par levier — détails">
    <rect x="60" y="206" width="185" height="140" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="76" y="230" class="mono" font-size="9" letter-spacing="1.5" fill="#5A5A5A">ÉTAPE 1</text>
    <text x="76" y="254" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Signal brut</text>
    <text x="76" y="280" class="mono" font-size="11" fill="#B7332C">x[c,t]</text>
    <text x="76" y="304" class="body" font-size="10.5" fill="#5A5A5A">Pression du levier c en</text>
    <text x="76" y="319" class="body" font-size="10.5" fill="#5A5A5A">semaine t : euros de</text>
    <text x="76" y="334" class="body" font-size="10.5" fill="#5A5A5A">remise, GRP, bons émis.</text>
    <circle cx="227" cy="224" r="11" fill="#B7332C"/>
    <text x="227" y="228" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
  </g>
  <line x1="249" y1="276" x2="270" y2="276" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- STAGE 2 -->
  <g class="interactive" data-card="stage-adstock" tabindex="0" role="button" aria-label="Rémanence adstock — détails">
    <rect x="284" y="206" width="185" height="140" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="300" y="230" class="mono" font-size="9" letter-spacing="1.5" fill="#5A5A5A">ÉTAPE 2</text>
    <text x="300" y="254" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Rémanence</text>
    <text x="300" y="280" class="mono" font-size="10" fill="#B7332C">Σ w(s;α)·x[t−s] / Σ w</text>
    <text x="300" y="304" class="body" font-size="10.5" fill="#5A5A5A">L'effet d'une action</text>
    <text x="300" y="319" class="body" font-size="10.5" fill="#5A5A5A">déborde sur les semaines</text>
    <text x="300" y="334" class="body" font-size="10.5" fill="#5A5A5A">suivantes. α = décroissance.</text>
  </g>
  <line x1="473" y1="276" x2="494" y2="276" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- STAGE 3 -->
  <g class="interactive" data-card="stage-saturation" tabindex="0" role="button" aria-label="Saturation Hill — détails">
    <rect x="508" y="206" width="185" height="140" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="524" y="230" class="mono" font-size="9" letter-spacing="1.5" fill="#5A5A5A">ÉTAPE 3</text>
    <text x="524" y="254" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Saturation</text>
    <text x="524" y="280" class="mono" font-size="10" fill="#B7332C">x^s / (K^s + x^s)</text>
    <text x="524" y="304" class="body" font-size="10.5" fill="#5A5A5A">Rendements décroissants.</text>
    <text x="524" y="319" class="body" font-size="10.5" fill="#5A5A5A">K = point de demi-</text>
    <text x="524" y="334" class="body" font-size="10.5" fill="#5A5A5A">saturation (fonction Hill).</text>
  </g>
  <line x1="697" y1="276" x2="718" y2="276" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- STAGE 4 -->
  <g class="interactive" data-card="stage-decomposition" tabindex="0" role="button" aria-label="Décomposition additive — détails">
    <rect x="732" y="206" width="185" height="140" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <text x="748" y="230" class="mono" font-size="9" letter-spacing="1.5" fill="#5A5A5A">ÉTAPE 4</text>
    <text x="748" y="254" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Décomposition</text>
    <text x="748" y="278" class="mono" font-size="10" fill="#B7332C">y = base + Σ β·f(x)</text>
    <text x="748" y="293" class="mono" font-size="10" fill="#B7332C">+ Σ γ·Z + ε</text>
    <text x="748" y="315" class="body" font-size="10.5" fill="#5A5A5A">Tendance, saison, et les</text>
    <text x="748" y="330" class="body" font-size="10.5" fill="#5A5A5A">contrôles Z. Le point chaud.</text>
    <circle cx="899" cy="224" r="11" fill="#B7332C"/>
    <text x="899" y="228" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
  </g>
  <line x1="921" y1="276" x2="941" y2="276" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- STAGE 5 -->
  <g class="interactive" data-card="stage-sorties" tabindex="0" role="button" aria-label="Sorties décisionnelles — détails">
    <rect x="955" y="206" width="185" height="140" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="971" y="230" class="mono" font-size="9" letter-spacing="1.5" fill="#5A5A5A">ÉTAPE 5</text>
    <text x="971" y="254" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Sorties</text>
    <text x="971" y="280" class="mono" font-size="10" fill="#B7332C">ROI moyen ≠ ROI marginal</text>
    <text x="971" y="304" class="body" font-size="10.5" fill="#5A5A5A">Contributions, courbes de</text>
    <text x="971" y="319" class="body" font-size="10.5" fill="#5A5A5A">réponse, réallocation sous</text>
    <text x="971" y="334" class="body" font-size="10.5" fill="#5A5A5A">contrainte de budget.</text>
    <circle cx="1122" cy="224" r="11" fill="#B7332C"/>
    <text x="1122" y="228" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
  </g>

  <line x1="60" y1="386" x2="1140" y2="386" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="416" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">TROIS POINTS D'INSERTION DU GRAPHE CAUSAL</text>

  <!-- INSERTION 1 -->
  <g class="interactive" data-card="insertion-1" tabindex="0" role="button" aria-label="Insertion 1 : dépendances entre leviers — détails">
    <rect x="60" y="432" width="340" height="160" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <circle cx="88" cy="460" r="11" fill="#B7332C"/>
    <text x="88" y="464" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <text x="110" y="465" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Les leviers ne sont pas</text>
    <text x="110" y="486" class="display" font-size="17" font-weight="600" fill="#1A1A1A">indépendants</text>
    <text x="80" y="514" class="body" font-size="11.5" fill="#5A5A5A">Un plan commercial est <tspan font-style="italic">optimisé</tspan> : on met</text>
    <text x="80" y="531" class="body" font-size="11.5" fill="#5A5A5A">la remise là où l'on attend de la demande.</text>
    <text x="80" y="548" class="body" font-size="11.5" fill="#5A5A5A">D'où un biais de sélection structurel, plus</text>
    <text x="80" y="565" class="body" font-size="11.5" fill="#5A5A5A">des chemins croisés : fidélité → éligibilité</text>
    <text x="80" y="582" class="body" font-size="11.5" fill="#5A5A5A">promo, média → recherche de marque.</text>
  </g>

  <!-- INSERTION 2 -->
  <g class="interactive" data-card="insertion-2" tabindex="0" role="button" aria-label="Insertion 2 : les contrôles deviennent un ensemble d'ajustement — détails">
    <rect x="430" y="432" width="340" height="160" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <circle cx="458" cy="460" r="11" fill="#B7332C"/>
    <text x="458" y="464" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
    <text x="480" y="465" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Les contrôles Z cessent</text>
    <text x="480" y="486" class="display" font-size="17" font-weight="600" fill="#1A1A1A">d'être des features</text>
    <text x="450" y="514" class="body" font-size="11.5" fill="#5A5A5A">Ils deviennent un ensemble d'ajustement</text>
    <text x="450" y="531" class="body" font-size="11.5" fill="#5A5A5A">dérivé du graphe. Conséquence directe :</text>
    <text x="450" y="548" class="body" font-size="11.5" fill="#5A5A5A">certaines variables très prédictives sont</text>
    <text x="450" y="565" class="body" font-size="11.5" fill="#5A5A5A"><tspan font-weight="500" fill="#B7332C">interdites</tspan> — médiateurs, collisionneurs,</text>
    <text x="450" y="582" class="body" font-size="11.5" fill="#5A5A5A">descendants du résultat.</text>
  </g>

  <!-- INSERTION 3 -->
  <g class="interactive" data-card="insertion-3" tabindex="0" role="button" aria-label="Insertion 3 : calibration expérimentale — détails">
    <rect x="800" y="432" width="340" height="160" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
    <circle cx="828" cy="460" r="11" fill="#B7332C"/>
    <text x="828" y="464" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
    <text x="850" y="465" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Les expériences entrent</text>
    <text x="850" y="486" class="display" font-size="17" font-weight="600" fill="#1A1A1A">comme <tspan font-style="italic">a priori</tspan></text>
    <text x="820" y="514" class="body" font-size="11.5" fill="#5A5A5A">Un geo-lift produit une distribution, pas</text>
    <text x="820" y="531" class="body" font-size="11.5" fill="#5A5A5A">un point. Injectée comme a priori sur le</text>
    <text x="820" y="548" class="body" font-size="11.5" fill="#5A5A5A">ROI d'un levier, elle ancre le modèle sur</text>
    <text x="820" y="565" class="body" font-size="11.5" fill="#5A5A5A">une mesure causale réelle et réduit la</text>
    <text x="820" y="582" class="body" font-size="11.5" fill="#5A5A5A">variance due à la colinéarité.</text>
  </g>

  <!-- BANDE FINALE -->
  <g class="interactive" data-card="synthese-mmm" tabindex="0" role="button" aria-label="Ce que le MMM est formellement — détails">
    <rect x="60" y="620" width="1080" height="90" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="646" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">FORMELLEMENT</text>
    <text x="80" y="674" class="display" font-size="17" font-style="italic" fill="#1A1A1A">Un MMM est un modèle structurel additif à transformations non linéaires. Les hypothèses causales y sont déjà là,</text>
    <text x="80" y="698" class="display" font-size="17" font-style="italic" fill="#1A1A1A">mais tacites — dissoutes dans la liste des variables de contrôle. Le graphe ne les invente pas : il les rend discutables.</text>
  </g>

  <line x1="60" y1="734" x2="1140" y2="734" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="756" class="body" font-size="10" font-style="italic" fill="#5A5A5A">Sources : documentation méthodologique Meridian (Google) ; Jin et al., « Bayesian Methods for Media Mix Modeling with Carryover and Shape Effects » ; Ekimetrics Eki.Lab. — Mathieu Guglielmino.</text>
</svg>
