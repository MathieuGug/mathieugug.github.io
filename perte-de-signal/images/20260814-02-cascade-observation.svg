<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Cascade multiplicative du taux d'observation d'un parcours numérique, de cent parcours réels à quarante et un observés">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="820" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La cascade d'observation</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Les pertes ne s'additionnent pas, elles se multiplient</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">ÉTAPE</text>
  <text x="1136" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">PARCOURS ENCORE OBSERVABLES</text>

  <!-- barre 1 -->
  <g class="interactive" data-card="visiteurs" tabindex="0" role="button" aria-label="Cent parcours réels — cliquez pour les détails">
    <rect x="64" y="212" width="880" height="86" rx="3" fill="#1F5560" opacity="0.14" stroke="#1F5560" stroke-width="1.25"/>
    <text x="92" y="248" class="display" font-size="20" font-weight="600" fill="#1A1A1A">100 parcours réels</text>
    <text x="92" y="276" class="body" font-size="13" fill="#5A5A5A">La population que la campagne a effectivement touchée, connue de personne</text>
    <text x="1136" y="266" class="mono" font-size="30" font-weight="600" fill="#1A1A1A" text-anchor="end">100</text>
  </g>

  <!-- barre 2 — consentement -->
  <g class="interactive" data-card="consentement" tabindex="0" role="button" aria-label="Filtre du consentement — cliquez pour les détails">
    <rect x="64" y="326" width="493" height="86" rx="3" fill="#B7332C" opacity="0.16" stroke="#B7332C" stroke-width="1.25"/>
    <rect x="557" y="326" width="387" height="86" rx="3" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="92" y="362" class="display" font-size="20" font-weight="600" fill="#1A1A1A">× 56 % — acceptation explicite</text>
    <text x="92" y="390" class="body" font-size="13" fill="#5A5A5A">Le refus et le non-choix sortent définitivement du périmètre observable</text>
    <text x="585" y="380" class="body" font-size="12" font-style="italic" fill="#B7332C">44 parcours perdus au consentement</text>
    <text x="1136" y="380" class="mono" font-size="30" font-weight="600" fill="#1A1A1A" text-anchor="end">56</text>
  </g>

  <!-- barre 3 — navigateur -->
  <g class="interactive" data-card="navigateur" tabindex="0" role="button" aria-label="Érosion navigateur — cliquez pour les détails">
    <rect x="64" y="440" width="394" height="86" rx="3" fill="#B58A2C" opacity="0.18" stroke="#B58A2C" stroke-width="1.25"/>
    <rect x="458" y="440" width="486" height="86" rx="3" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="92" y="476" class="display" font-size="20" font-weight="600" fill="#1A1A1A">× 80 % — durée de vie</text>
    <text x="92" y="504" class="body" font-size="13" fill="#5A5A5A">Le consentement survit, l'identifiant non, sur les cycles longs</text>
    <text x="486" y="494" class="body" font-size="12" font-style="italic" fill="#B58A2C">11 parcours consentants devenus anonymes</text>
    <text x="1136" y="494" class="mono" font-size="30" font-weight="600" fill="#1A1A1A" text-anchor="end">45</text>
  </g>

  <!-- barre 4 — restitution -->
  <g class="interactive" data-card="residuel" tabindex="0" role="button" aria-label="Restitution par la plateforme — cliquez pour les détails">
    <rect x="64" y="554" width="355" height="86" rx="3" fill="#2F5D3F" opacity="0.18" stroke="#2F5D3F" stroke-width="1.25"/>
    <rect x="419" y="554" width="525" height="86" rx="3" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="92" y="590" class="display" font-size="20" font-weight="600" fill="#1A1A1A">× 90 % — restitution</text>
    <text x="92" y="618" class="body" font-size="13" fill="#5A5A5A">Seuils, agrégation, paramètres supprimés au clic</text>
    <text x="447" y="608" class="body" font-size="12" font-style="italic" fill="#2F5D3F">4 parcours observés mais non restitués au bon niveau</text>
    <text x="1136" y="608" class="mono" font-size="30" font-weight="600" fill="#B7332C" text-anchor="end">41</text>
  </g>

  <!-- accolade / conclusion -->
  <line x1="64" y1="672" x2="1136" y2="672" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="704" class="display" font-size="21" font-weight="600" fill="#1A1A1A">41 parcours sur 100 restent directement observables.</text>
  <text x="64" y="732" class="body" font-size="14" fill="#5A5A5A">Les 59 autres sont soit reconstitués par appariement, soit estimés par modèle, soit absents. La restitution ne dit pas lequel des trois.</text>

  <line x1="64" y1="762" x2="1136" y2="762" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="788" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Méthode : illustration à partir du taux d'opt-in explicite Europe de l'Ouest 2026 (55,7 %, Didomi) ; les deux coefficients suivants sont des ordres de grandeur de place, à recalculer par annonceur.</text>
  <text x="64" y="808" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Lecture : la largeur de chaque barre est proportionnelle au nombre de parcours encore observables à l'issue de l'étape.</text>
</svg>
