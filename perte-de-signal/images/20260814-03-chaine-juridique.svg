<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Chaîne juridique du signal publicitaire : article 82, exemption de mesure d'audience, consentir ou payer, et charge de la preuve côté déployeur">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La chaîne juridique du signal</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre textes, et ce que chacun oblige un déployeur à produire</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LE TEXTE</text>
  <text x="480" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL EXIGE</text>
  <text x="856" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL FAUT POUVOIR PRODUIRE</text>

  <!-- ligne 1 : article 82 -->
  <g class="interactive" data-card="article-82" tabindex="0" role="button" aria-label="Article 82 — cliquez pour les détails">
    <rect x="64" y="208" width="1072" height="140" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="208" width="5" height="140" fill="#1E3A5F"/>
    <text x="94" y="242" class="mono" font-size="11" letter-spacing="0.1em" fill="#1E3A5F">SOCLE</text>
    <text x="94" y="272" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Article 82, loi</text>
    <text x="94" y="298" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Informatique et Libertés</text>
    <text x="94" y="326" class="body" font-size="12" font-style="italic" fill="#5A5A5A">transposition ePrivacy</text>
    <line x1="452" y1="228" x2="452" y2="328" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="480" y="252" class="body" font-size="13" fill="#1A1A1A">Consentement préalable pour tout traceur qui n'est</text>
    <text x="480" y="272" class="body" font-size="13" fill="#1A1A1A">pas strictement nécessaire au service.</text>
    <text x="480" y="300" class="body" font-size="13" fill="#5A5A5A">Libre, spécifique, éclairé, univoque. Le refus doit</text>
    <text x="480" y="320" class="body" font-size="13" fill="#5A5A5A">être aussi simple que l'acceptation.</text>
    <line x1="828" y1="228" x2="828" y2="328" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="856" y="252" class="body" font-size="13" fill="#1A1A1A">La preuve du recueil : version de bannière servie,</text>
    <text x="856" y="272" class="body" font-size="13" fill="#1A1A1A">horodatage, finalités acceptées.</text>
    <text x="856" y="300" class="body" font-size="12" font-style="italic" fill="#B7332C">Peu d'organisations savent le reconstituer</text>
    <text x="856" y="320" class="body" font-size="12" font-style="italic" fill="#B7332C">six mois en arrière.</text>
  </g>

  <line x1="600" y1="348" x2="600" y2="372" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow03)"/>

  <!-- ligne 2 : exemption CNIL -->
  <g class="interactive" data-card="exemption-cnil" tabindex="0" role="button" aria-label="Exemption de mesure d'audience — cliquez pour les détails">
    <rect x="64" y="384" width="1072" height="140" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="384" width="5" height="140" fill="#1F5560"/>
    <text x="94" y="418" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">EXCEPTION</text>
    <text x="94" y="448" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Délibération CNIL</text>
    <text x="94" y="474" class="display" font-size="20" font-weight="600" fill="#1A1A1A">du 4 juillet 2025</text>
    <text x="94" y="502" class="body" font-size="12" font-style="italic" fill="#5A5A5A">applicable au 1ᵉʳ janvier 2026</text>
    <line x1="452" y1="404" x2="452" y2="504" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="480" y="428" class="body" font-size="13" fill="#1A1A1A">Mesure d'audience sans consentement, à condition</text>
    <text x="480" y="448" class="body" font-size="13" fill="#1A1A1A">de produire des statistiques anonymes, pour le seul</text>
    <text x="480" y="468" class="body" font-size="13" fill="#1A1A1A">compte de l'éditeur, sans croisement ni transmission.</text>
    <text x="480" y="496" class="body" font-size="13" fill="#5A5A5A">Aucun suivi global entre sites ou applications.</text>
    <line x1="828" y1="404" x2="828" y2="504" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="856" y="428" class="body" font-size="13" fill="#1A1A1A">La grille d'auto-évaluation renseignée, conservée,</text>
    <text x="856" y="448" class="body" font-size="13" fill="#1A1A1A">et la configuration qui la justifie.</text>
    <text x="856" y="476" class="body" font-size="12" font-style="italic" fill="#B7332C">Elle n'a pas valeur de certification</text>
    <text x="856" y="496" class="body" font-size="12" font-style="italic" fill="#B7332C">et n'empêche aucun contrôle.</text>
  </g>

  <line x1="600" y1="524" x2="600" y2="548" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow03)"/>

  <!-- ligne 3 : consentir ou payer -->
  <g class="interactive" data-card="consentir-payer" tabindex="0" role="button" aria-label="Consentir ou payer — cliquez pour les détails">
    <rect x="64" y="560" width="1072" height="140" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="560" width="5" height="140" fill="#B7332C"/>
    <text x="94" y="594" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">PLAFOND</text>
    <text x="94" y="624" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Avis EDPB 08/2024</text>
    <text x="94" y="650" class="display" font-size="20" font-weight="600" fill="#1A1A1A">consentir ou payer</text>
    <text x="94" y="678" class="body" font-size="12" font-style="italic" fill="#5A5A5A">17 avril 2024, non contraignant</text>
    <line x1="452" y1="580" x2="452" y2="680" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="480" y="604" class="body" font-size="13" fill="#1A1A1A">Une grande plateforme ne peut, dans la plupart des</text>
    <text x="480" y="624" class="body" font-size="13" fill="#1A1A1A">cas, recueillir un consentement valable en n'offrant</text>
    <text x="480" y="644" class="body" font-size="13" fill="#1A1A1A">qu'un choix binaire entre accepter et payer.</text>
    <text x="480" y="672" class="body" font-size="13" fill="#5A5A5A">Recours en annulation introduit par Meta en 2024.</text>
    <line x1="828" y1="580" x2="828" y2="680" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="856" y="604" class="body" font-size="13" fill="#1A1A1A">Rien de nouveau à produire. Ce texte ferme une voie</text>
    <text x="856" y="624" class="body" font-size="13" fill="#1A1A1A">d'optimisation plutôt qu'il n'ouvre une obligation.</text>
    <text x="856" y="652" class="body" font-size="12" font-style="italic" fill="#B7332C">Conséquence : le taux de consentement</text>
    <text x="856" y="672" class="body" font-size="12" font-style="italic" fill="#B7332C">cesse d'être un levier pilotable.</text>
  </g>

  <line x1="600" y1="700" x2="600" y2="724" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow03)"/>

  <!-- ligne 4 : charge de la preuve -->
  <g class="interactive" data-card="charge-preuve" tabindex="0" role="button" aria-label="Charge de la preuve — cliquez pour les détails">
    <rect x="64" y="736" width="1072" height="92" rx="3" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="94" y="768" class="mono" font-size="11" letter-spacing="0.1em" fill="#5A5A5A">CE QUE LA CHAÎNE PRODUIT</text>
    <text x="94" y="798" class="display" font-size="20" font-weight="600" fill="#1A1A1A">La charge de la preuve est intégralement du côté du déployeur.</text>
    <text x="856" y="798" class="body" font-size="13" font-style="italic" fill="#B7332C">Un registre de mesure, ou rien.</text>
  </g>

  <line x1="64" y1="852" x2="1136" y2="852" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="878" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : article 82 de la loi Informatique et Libertés ; délibération CNIL du 4 juillet 2025 et outil d'auto-évaluation ; avis EDPB 08/2024.</text>
</svg>
