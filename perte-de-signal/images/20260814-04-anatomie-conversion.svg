<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-label="Anatomie d'une conversion remontée dans un rapport publicitaire : trois régimes empilés, observé, apparié et estimé, avec les seuils d'éligibilité de la modélisation">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="860" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Anatomie d'une conversion remontée</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois régimes empilés dans une seule ligne de rapport, sans distinction visuelle</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- La ligne de rapport -->
  <rect x="64" y="188" width="1072" height="72" rx="3" fill="#1A1A1A"/>
  <text x="94" y="220" class="mono" font-size="11" letter-spacing="0.1em" fill="#B8B5AE">CE QUE LE RAPPORT AFFICHE</text>
  <text x="94" y="248" class="display" font-size="22" font-weight="600" fill="#FAF8F3">Campagne « Rentrée » · conversions</text>
  <text x="1106" y="243" class="mono" font-size="30" font-weight="600" fill="#FAF8F3" text-anchor="end">1 240</text>

  <line x1="600" y1="260" x2="600" y2="290" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow04)"/>
  <text x="620" y="282" class="body" font-size="12" font-style="italic" fill="#5A5A5A">décomposition non restituée à l'acheteur</text>

  <!-- Régime 1 : observé -->
  <g class="interactive" data-card="observe" tabindex="0" role="button" aria-label="Régime observé — cliquez pour les détails">
    <rect x="64" y="302" width="1072" height="118" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="302" width="440" height="118" rx="3" fill="#1F5560" opacity="0.14"/>
    <rect x="64" y="302" width="5" height="118" fill="#1F5560"/>
    <text x="94" y="334" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">RÉGIME 1 · OBSERVÉ</text>
    <text x="94" y="364" class="display" font-size="20" font-weight="600" fill="#1A1A1A">L'événement a été vu</text>
    <text x="94" y="392" class="body" font-size="13" fill="#5A5A5A">Identifiant présent, consentement accordé, restitution complète.</text>
    <text x="880" y="358" class="mono" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="end">508</text>
    <text x="906" y="358" class="body" font-size="14" fill="#5A5A5A">conversions</text>
    <text x="906" y="386" class="body" font-size="12" font-style="italic" fill="#5A5A5A">le seul régime contestable pièce par pièce</text>
  </g>

  <!-- Régime 2 : apparié -->
  <g class="interactive" data-card="apparie" tabindex="0" role="button" aria-label="Régime apparié — cliquez pour les détails">
    <rect x="64" y="434" width="1072" height="118" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="434" width="286" height="118" rx="3" fill="#B58A2C" opacity="0.18"/>
    <rect x="64" y="434" width="5" height="118" fill="#B58A2C"/>
    <text x="94" y="466" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">RÉGIME 2 · APPARIÉ</text>
    <text x="94" y="496" class="display" font-size="20" font-weight="600" fill="#1A1A1A">L'événement a été rapproché</text>
    <text x="94" y="524" class="body" font-size="13" fill="#5A5A5A">Identifiant de première partie haché, rapproché d'un compte connecté.</text>
    <text x="880" y="490" class="mono" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="end">312</text>
    <text x="906" y="490" class="body" font-size="14" fill="#5A5A5A">conversions</text>
    <text x="906" y="518" class="body" font-size="12" font-style="italic" fill="#5A5A5A">réel, mais conditionné à l'état du consentement</text>
  </g>

  <!-- Régime 3 : estimé -->
  <g class="interactive" data-card="estime" tabindex="0" role="button" aria-label="Régime estimé — cliquez pour les détails">
    <rect x="64" y="566" width="1072" height="118" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
    <rect x="64" y="566" width="394" height="118" rx="3" fill="#B7332C" opacity="0.16"/>
    <rect x="64" y="566" width="5" height="118" fill="#B7332C"/>
    <text x="94" y="598" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">RÉGIME 3 · ESTIMÉ</text>
    <text x="94" y="628" class="display" font-size="20" font-weight="600" fill="#1A1A1A">L'événement n'a jamais été vu</text>
    <text x="94" y="656" class="body" font-size="13" fill="#5A5A5A">Relation apprise sur les consentants, appliquée aux refusants.</text>
    <text x="880" y="622" class="mono" font-size="26" font-weight="600" fill="#B7332C" text-anchor="end">420</text>
    <text x="906" y="622" class="body" font-size="14" fill="#5A5A5A">conversions</text>
    <text x="906" y="650" class="body" font-size="12" font-style="italic" fill="#B7332C">un nombre, jamais un intervalle</text>
  </g>

  <!-- Seuils -->
  <g class="interactive" data-card="seuils" tabindex="0" role="button" aria-label="Seuils d'éligibilité — cliquez pour les détails">
    <rect x="64" y="702" width="1072" height="98" rx="3" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="94" y="732" class="mono" font-size="11" letter-spacing="0.1em" fill="#5A5A5A">CONDITIONS D'ACCÈS AU RÉGIME 3</text>
    <text x="94" y="762" class="body" font-size="14" fill="#1A1A1A">700 clics publicitaires sur 7 jours, par pays et par groupement de domaines · 1 000 utilisateurs consentants par jour sur 7 des 28 derniers jours côté analytique</text>
    <text x="94" y="786" class="body" font-size="13" font-style="italic" fill="#B7332C">En dessous du seuil, pas de conversions modélisées : à performance réelle égale, le petit annonceur affiche des chiffres plus bas que le gros.</text>
  </g>

  <line x1="64" y1="822" x2="1136" y2="822" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="848" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : documentation Google Ads sur la modélisation des conversions et sur les conversions améliorées. Volumes illustratifs, répartition cohérente avec la cascade du schéma 02.</text>
</svg>
