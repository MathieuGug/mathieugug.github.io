<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Les quatre robinets de la perte de signal publicitaire, dont un seul dépendait de la décision de Chrome sur les cookies tiers">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Les quatre robinets</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">D'où le signal part réellement, et lequel dépendait de la décision de Chrome</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">QUI DÉCIDE</text>
  <text x="632" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUI SE FERME</text>
  <text x="1136" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">LEVIER DE L'ANNONCEUR</text>

  <!-- ROBINET 1 — navigateur -->
  <g class="interactive" data-card="robinet-navigateur" tabindex="0" role="button" aria-label="Le navigateur — cliquez pour les détails">
    <rect x="64" y="208" width="524" height="182" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="208" width="5" height="182" fill="#1F5560"/>
    <text x="94" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">ROBINET 1</text>
    <text x="94" y="270" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le navigateur</text>
    <text x="94" y="298" class="body" font-size="13" fill="#5A5A5A">Safari limite à 7 jours la durée de vie d'un cookie</text>
    <text x="94" y="318" class="body" font-size="13" fill="#5A5A5A">déposé par script, 24 h sur les navigations issues</text>
    <text x="94" y="338" class="body" font-size="13" fill="#5A5A5A">d'un site de suivi. Firefox cloisonne par site.</text>
    <line x1="94" y1="352" x2="558" y2="352" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="94" y="374" class="body" font-size="12" font-style="italic" fill="#B7332C">Levier : marquage de première partie côté serveur</text>
  </g>

  <!-- ROBINET 2 — consentement -->
  <g class="interactive" data-card="robinet-consentement" tabindex="0" role="button" aria-label="Le consentement — cliquez pour les détails">
    <rect x="612" y="208" width="524" height="182" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="612" y="208" width="5" height="182" fill="#B7332C"/>
    <text x="642" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ROBINET 2</text>
    <text x="642" y="270" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le consentement</text>
    <text x="642" y="298" class="body" font-size="13" fill="#5A5A5A">55,7 % d'acceptation explicite en Europe de l'Ouest,</text>
    <text x="642" y="318" class="body" font-size="13" fill="#5A5A5A">21,7 % à 24 % de visiteurs qui ne tranchent pas.</text>
    <text x="642" y="338" class="body" font-size="13" fill="#5A5A5A">La France ferme la marche du continent.</text>
    <line x1="642" y1="352" x2="1106" y2="352" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="642" y="374" class="body" font-size="12" font-style="italic" fill="#B7332C">Levier : conception de la bannière, dans la limite du droit</text>
  </g>

  <!-- ROBINET 3 — système mobile -->
  <g class="interactive" data-card="robinet-os" tabindex="0" role="button" aria-label="Le système d'exploitation mobile — cliquez pour les détails">
    <rect x="64" y="414" width="524" height="182" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="414" width="5" height="182" fill="#B58A2C"/>
    <text x="94" y="446" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">ROBINET 3</text>
    <text x="94" y="476" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le système mobile</text>
    <text x="94" y="504" class="body" font-size="13" fill="#5A5A5A">App Tracking Transparency ramène l'acceptation du</text>
    <text x="94" y="524" class="body" font-size="13" fill="#5A5A5A">suivi inter-applications autour de 14 %. L'attribution</text>
    <text x="94" y="544" class="body" font-size="13" fill="#5A5A5A">passe à des retours agrégés et différés.</text>
    <line x1="94" y1="558" x2="558" y2="558" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="94" y="580" class="body" font-size="12" font-style="italic" fill="#B7332C">Levier : aucun. Le cadre est imposé par la plateforme.</text>
  </g>

  <!-- ROBINET 4 — plateforme publicitaire -->
  <g class="interactive" data-card="robinet-plateforme" tabindex="0" role="button" aria-label="La plateforme publicitaire — cliquez pour les détails">
    <rect x="612" y="414" width="524" height="182" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="612" y="414" width="5" height="182" fill="#2F5D3F"/>
    <text x="642" y="446" class="mono" font-size="11" letter-spacing="0.1em" fill="#2F5D3F">ROBINET 4</text>
    <text x="642" y="476" class="display" font-size="21" font-weight="600" fill="#1A1A1A">La plateforme</text>
    <text x="642" y="504" class="body" font-size="13" fill="#5A5A5A">Seuils de confidentialité, agrégation par campagne,</text>
    <text x="642" y="524" class="body" font-size="13" fill="#5A5A5A">fenêtres d'attribution non modifiables, paramètres</text>
    <text x="642" y="544" class="body" font-size="13" fill="#5A5A5A">d'URL supprimés au clic.</text>
    <line x1="642" y1="558" x2="1106" y2="558" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="642" y="580" class="body" font-size="12" font-style="italic" fill="#B7332C">Levier : le contrat, et lui seul</text>
  </g>

  <!-- BANDEAU CHROME -->
  <rect x="64" y="628" width="1072" height="126" rx="3" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="94" y="662" class="mono" font-size="11" letter-spacing="0.1em" fill="#5A5A5A">CE QUE LA DÉCISION CHROME A CHANGÉ</text>
  <text x="94" y="696" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Avril 2025 : les cookies tiers restent. Octobre 2025 : dix interfaces Privacy Sandbox sont retirées.</text>
  <text x="94" y="726" class="body" font-size="13" fill="#5A5A5A">Aucun des quatre robinets ne s'est rouvert. Le seul qui dépendait de Chrome n'a jamais été fermé.</text>

  <line x1="64" y1="792" x2="1136" y2="792" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="820" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : Privacy Sandbox (avril et octobre 2025) ; référentiel européen Didomi 2026 ; documentation Apple AdAttributionKit.</text>
  <text x="64" y="840" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Lecture : chaque encadré donne l'autorité qui décide de la fermeture et le levier réellement disponible côté annonceur.</text>
</svg>
