<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-label="Grille croisant quatre questions de direction et quatre régimes de mesure, montrant que la modélisation ne répond à aucune question causale">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="860" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce que chaque régime peut répondre</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre questions de direction, quatre régimes, et les cases vides qu'on assume</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- en-têtes colonnes -->
  <text x="64" y="212" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LA QUESTION POSÉE</text>
  <text x="618" y="200" class="body" font-size="13" font-weight="600" fill="#1F5560" text-anchor="middle">Observé</text>
  <text x="618" y="218" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">comptage direct</text>
  <text x="768" y="200" class="body" font-size="13" font-weight="600" fill="#B58A2C" text-anchor="middle">Apparié</text>
  <text x="768" y="218" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">rapprochement</text>
  <text x="918" y="200" class="body" font-size="13" font-weight="600" fill="#B7332C" text-anchor="middle">Estimé</text>
  <text x="918" y="218" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">modélisation</text>
  <text x="1068" y="200" class="body" font-size="13" font-weight="600" fill="#2F5D3F" text-anchor="middle">Expérimenté</text>
  <text x="1068" y="218" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">randomisation</text>
  <line x1="64" y1="234" x2="1136" y2="234" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ligne 1 -->
  <g class="interactive" data-card="question-budget" tabindex="0" role="button" aria-label="Combien de conversions ont suivi mes campagnes — cliquez pour les détails">
    <rect x="64" y="242" width="1072" height="110" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="94" y="278" class="display" font-size="19" font-weight="600" fill="#1A1A1A">« Combien de conversions ont suivi mes campagnes ? »</text>
    <text x="94" y="306" class="body" font-size="13" fill="#5A5A5A">Question de comptage. Elle porte sur ce qui s'est produit, sans</text>
    <text x="94" y="326" class="body" font-size="13" fill="#5A5A5A">rien affirmer sur ce qui l'a causé.</text>
    <circle cx="618" cy="297" r="15" fill="#1F5560"/>
    <text x="618" y="303" class="mono" font-size="14" font-weight="600" fill="#FAF8F3" text-anchor="middle">✓</text>
    <circle cx="768" cy="297" r="15" fill="#B58A2C"/>
    <text x="768" y="303" class="mono" font-size="14" font-weight="600" fill="#FAF8F3" text-anchor="middle">✓</text>
    <circle cx="918" cy="297" r="15" fill="#B7332C" opacity="0.45"/>
    <text x="918" y="303" class="mono" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">~</text>
    <circle cx="1068" cy="297" r="15" fill="none" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="2 3"/>
  </g>

  <!-- ligne 2 -->
  <g class="interactive" data-card="question-incrementalite" tabindex="0" role="button" aria-label="Quel budget déplacer — cliquez pour les détails">
    <rect x="64" y="364" width="1072" height="110" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="94" y="400" class="display" font-size="19" font-weight="600" fill="#1A1A1A">« Quel budget ai-je intérêt à déplacer ? »</text>
    <text x="94" y="428" class="body" font-size="13" fill="#5A5A5A">Question causale. Elle exige un contrefactuel, donc une</text>
    <text x="94" y="448" class="body" font-size="13" fill="#5A5A5A">population comparable et non exposée.</text>
    <circle cx="618" cy="419" r="15" fill="none" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="2 3"/>
    <circle cx="768" cy="419" r="15" fill="none" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="2 3"/>
    <circle cx="918" cy="419" r="15" fill="none" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="2 3"/>
    <circle cx="1068" cy="419" r="15" fill="#2F5D3F"/>
    <text x="1068" y="425" class="mono" font-size="14" font-weight="600" fill="#FAF8F3" text-anchor="middle">✓</text>
  </g>

  <!-- ligne 3 -->
  <g class="interactive" data-card="question-facturation" tabindex="0" role="button" aria-label="Combien dois-je à mon prestataire — cliquez pour les détails">
    <rect x="64" y="486" width="1072" height="110" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="94" y="522" class="display" font-size="19" font-weight="600" fill="#1A1A1A">« Combien dois-je à mon prestataire à la performance ? »</text>
    <text x="94" y="550" class="body" font-size="13" fill="#5A5A5A">Question contractuelle. Elle exige un chiffre opposable, dont</text>
    <text x="94" y="570" class="body" font-size="13" fill="#5A5A5A">chaque unité peut être vérifiée pièce en main.</text>
    <circle cx="618" cy="541" r="15" fill="#1F5560"/>
    <text x="618" y="547" class="mono" font-size="14" font-weight="600" fill="#FAF8F3" text-anchor="middle">✓</text>
    <circle cx="768" cy="541" r="15" fill="#B58A2C" opacity="0.45"/>
    <text x="768" y="547" class="mono" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">~</text>
    <circle cx="918" cy="541" r="15" fill="none" stroke="#B7332C" stroke-width="1.5"/>
    <line x1="909" y1="532" x2="927" y2="550" stroke="#B7332C" stroke-width="1.5"/>
    <line x1="927" y1="532" x2="909" y2="550" stroke="#B7332C" stroke-width="1.5"/>
    <circle cx="1068" cy="541" r="15" fill="none" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="2 3"/>
  </g>

  <!-- ligne 4 -->
  <g class="interactive" data-card="angle-mort" tabindex="0" role="button" aria-label="De combien mon chiffre peut-il se tromper — cliquez pour les détails">
    <rect x="64" y="608" width="1072" height="110" rx="3" fill="#F2EFE7" stroke="#B7332C" stroke-width="1.25"/>
    <text x="94" y="644" class="display" font-size="19" font-weight="600" fill="#1A1A1A">« De combien ce chiffre peut-il se tromper ? »</text>
    <text x="94" y="672" class="body" font-size="13" fill="#5A5A5A">Question d'incertitude. Aucun des quatre régimes ne la restitue</text>
    <text x="94" y="692" class="body" font-size="13" fill="#5A5A5A">spontanément dans un rapport d'achat média.</text>
    <circle cx="618" cy="663" r="15" fill="none" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="2 3"/>
    <circle cx="768" cy="663" r="15" fill="none" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="2 3"/>
    <circle cx="918" cy="663" r="15" fill="none" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="2 3"/>
    <circle cx="1068" cy="663" r="15" fill="#2F5D3F" opacity="0.45"/>
    <text x="1068" y="669" class="mono" font-size="13" font-weight="600" fill="#FAF8F3" text-anchor="middle">~</text>
  </g>

  <!-- légende -->
  <line x1="64" y1="748" x2="1136" y2="748" stroke="#E5E1D8" stroke-width="0.5"/>
  <circle cx="76" cy="776" r="9" fill="#1A1A1A"/>
  <text x="94" y="781" class="body" font-size="12" fill="#5A5A5A">répond directement</text>
  <circle cx="256" cy="776" r="9" fill="#1A1A1A" opacity="0.4"/>
  <text x="274" y="781" class="body" font-size="12" fill="#5A5A5A">répond partiellement, sous conditions</text>
  <circle cx="556" cy="776" r="9" fill="none" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="2 3"/>
  <text x="574" y="781" class="body" font-size="12" fill="#5A5A5A">ne répond pas</text>
  <circle cx="716" cy="776" r="9" fill="none" stroke="#B7332C" stroke-width="1.5"/>
  <line x1="710" y1="770" x2="722" y2="782" stroke="#B7332C" stroke-width="1.5"/>
  <line x1="722" y1="770" x2="710" y2="782" stroke="#B7332C" stroke-width="1.5"/>
  <text x="734" y="781" class="body" font-size="12" fill="#5A5A5A">usage à proscrire</text>

  <text x="64" y="822" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Lecture : la colonne « Estimé » ne contient aucune réponse pleine. La modélisation améliore la complétude d'un comptage sans changer la nature de la question à laquelle ce comptage répond.</text>
  <text x="64" y="842" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : littérature expérimentale sur l'écart entre estimation observationnelle et effet causal ; documentation des plateformes sur la restitution des conversions modélisées.</text>
</svg>
