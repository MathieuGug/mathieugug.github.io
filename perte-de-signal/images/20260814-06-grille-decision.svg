<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Grille de décision : où l'estimation est admissible, sous condition, ou interdite, et les sept décisions à écrire">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La grille de décision</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Où l'estimation est admissible, où elle est interdite, et ce qu'on écrit au contrat</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ZONE 1 -->
  <g class="interactive" data-card="admissible" tabindex="0" role="button" aria-label="Zone admissible — cliquez pour les détails">
    <rect x="64" y="192" width="342" height="330" rx="3" fill="#FFFFFF" stroke="#2F5D3F" stroke-width="1.25"/>
    <rect x="64" y="192" width="342" height="6" fill="#2F5D3F"/>
    <text x="90" y="230" class="mono" font-size="11" letter-spacing="0.1em" fill="#2F5D3F">ZONE 1</text>
    <text x="90" y="260" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Admissible</text>
    <text x="90" y="290" class="body" font-size="13" fill="#5A5A5A">L'estimation aide et ne coûte rien</text>
    <text x="90" y="310" class="body" font-size="13" fill="#5A5A5A">si elle se trompe modérément.</text>
    <line x1="90" y1="330" x2="380" y2="330" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="90" y="358" class="body" font-size="13" fill="#1A1A1A">· Suivi de tendance d'un canal</text>
    <text x="90" y="384" class="body" font-size="13" fill="#1A1A1A">· Détection de rupture de série</text>
    <text x="90" y="410" class="body" font-size="13" fill="#1A1A1A">· Optimisation intra-canal des</text>
    <text x="102" y="430" class="body" font-size="13" fill="#1A1A1A">enchères au quotidien</text>
    <text x="90" y="456" class="body" font-size="13" fill="#1A1A1A">· Alimentation du modèle de mix,</text>
    <text x="102" y="476" class="body" font-size="13" fill="#1A1A1A">une fois calibré par test</text>
    <text x="90" y="504" class="body" font-size="12" font-style="italic" fill="#2F5D3F">Condition : afficher la part estimée.</text>
  </g>

  <!-- ZONE 2 -->
  <g class="interactive" data-card="sous-condition" tabindex="0" role="button" aria-label="Zone sous condition — cliquez pour les détails">
    <rect x="429" y="192" width="342" height="330" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.25"/>
    <rect x="429" y="192" width="342" height="6" fill="#B58A2C"/>
    <text x="455" y="230" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">ZONE 2</text>
    <text x="455" y="260" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Sous condition</text>
    <text x="455" y="290" class="body" font-size="13" fill="#5A5A5A">L'estimation est tolérable si elle</text>
    <text x="455" y="310" class="body" font-size="13" fill="#5A5A5A">est ancrée à une mesure externe.</text>
    <line x1="455" y1="330" x2="745" y2="330" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="455" y="358" class="body" font-size="13" fill="#1A1A1A">· Réallocation entre canaux</text>
    <text x="455" y="384" class="body" font-size="13" fill="#1A1A1A">· Arbitrage de budget annuel</text>
    <text x="455" y="410" class="body" font-size="13" fill="#1A1A1A">· Comparaison de deux régies</text>
    <text x="455" y="436" class="body" font-size="13" fill="#1A1A1A">· Décision d'arrêt d'un dispositif</text>
    <text x="455" y="470" class="body" font-size="12" font-style="italic" fill="#B58A2C">Condition : un test d'incrémentalité</text>
    <text x="455" y="490" class="body" font-size="12" font-style="italic" fill="#B58A2C">de moins de six mois sur le canal,</text>
    <text x="455" y="510" class="body" font-size="12" font-style="italic" fill="#B58A2C">avec règle de lecture pré-écrite.</text>
  </g>

  <!-- ZONE 3 -->
  <g class="interactive" data-card="interdit" tabindex="0" role="button" aria-label="Zone interdite — cliquez pour les détails">
    <rect x="794" y="192" width="342" height="330" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
    <rect x="794" y="192" width="342" height="6" fill="#B7332C"/>
    <text x="820" y="230" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ZONE 3</text>
    <text x="820" y="260" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Interdit</text>
    <text x="820" y="290" class="body" font-size="13" fill="#5A5A5A">Une estimation fournie par le</text>
    <text x="820" y="310" class="body" font-size="13" fill="#5A5A5A">vendeur n'y a aucune place.</text>
    <line x1="820" y1="330" x2="1110" y2="330" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="820" y="358" class="body" font-size="13" fill="#1A1A1A">· Facturation d'un prestataire</text>
    <text x="832" y="378" class="body" font-size="13" fill="#1A1A1A">rémunéré à la performance</text>
    <text x="820" y="404" class="body" font-size="13" fill="#1A1A1A">· Calcul d'une part variable de</text>
    <text x="832" y="424" class="body" font-size="13" fill="#1A1A1A">rémunération interne</text>
    <text x="820" y="450" class="body" font-size="13" fill="#1A1A1A">· Toute reprise en communication</text>
    <text x="832" y="470" class="body" font-size="13" fill="#1A1A1A">financière ou extra-financière</text>
    <text x="820" y="504" class="body" font-size="12" font-style="italic" fill="#B7332C">Principe : ce qu'on doit au vendeur</text>
  </g>

  <!-- LES SEPT DÉCISIONS -->
  <g class="interactive" data-card="clause-contrat" tabindex="0" role="button" aria-label="Les sept décisions — cliquez pour les détails">
    <rect x="64" y="556" width="1072" height="234" rx="3" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="94" y="590" class="mono" font-size="11" letter-spacing="0.1em" fill="#5A5A5A">LES SEPT DÉCISIONS À ÉCRIRE</text>

    <circle cx="106" cy="622" r="12" fill="#1A1A1A"/>
    <text x="106" y="627" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <text x="128" y="627" class="body" font-size="13" fill="#1A1A1A">Afficher la part modélisée dans toute restitution de performance</text>

    <circle cx="106" cy="656" r="12" fill="#1A1A1A"/>
    <text x="106" y="661" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
    <text x="128" y="661" class="body" font-size="13" fill="#1A1A1A">Fixer un plancher d'observation directe en dessous duquel le chiffre porte réserve</text>

    <circle cx="106" cy="690" r="12" fill="#1A1A1A"/>
    <text x="106" y="695" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
    <text x="128" y="695" class="body" font-size="13" fill="#1A1A1A">Délimiter le périmètre interdit à l'estimation (zone 3 ci-dessus)</text>

    <circle cx="106" cy="724" r="12" fill="#B7332C"/>
    <text x="106" y="729" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">4</text>
    <text x="128" y="729" class="body" font-size="13" font-weight="600" fill="#B7332C">Écrire une clause de restitution : méthodologie, seuils appliqués, part modélisée par campagne</text>

    <circle cx="632" cy="622" r="12" fill="#1A1A1A"/>
    <text x="632" y="627" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">5</text>
    <text x="654" y="627" class="body" font-size="13" fill="#1A1A1A">Tenir un registre de mesure daté</text>

    <circle cx="632" cy="656" r="12" fill="#1A1A1A"/>
    <text x="632" y="661" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">6</text>
    <text x="654" y="661" class="body" font-size="13" fill="#1A1A1A">Fixer une cadence de calibration semestrielle</text>

    <circle cx="632" cy="690" r="12" fill="#1A1A1A"/>
    <text x="632" y="695" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">7</text>
    <text x="654" y="695" class="body" font-size="13" fill="#1A1A1A">Publier la liste de ce qu'on renonce à mesurer</text>

    <line x1="654" y1="716" x2="1106" y2="716" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="654" y="740" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Aucune de ces décisions ne demande un outil nouveau.</text>
    <text x="654" y="762" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Elles demandent d'être écrites quelque part et tenues.</text>
  </g>

  <line x1="64" y1="820" x2="1136" y2="820" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="848" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Cadre analytique de l'auteur, construit à partir de la documentation des plateformes, de la doctrine CNIL et de la littérature expérimentale sur la mesure publicitaire.</text>
</svg>
