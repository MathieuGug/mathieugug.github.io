<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Meridian, Robyn et PyMC-Marketing comparés par la surface de déclaration qu'ils imposent avant l'estimation">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois piles, trois surfaces de déclaration</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La mathématique converge. Ce qui diverge, c'est ce que l'annonceur doit écrire avant l'estimation.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- MERIDIAN -->
  <g class="interactive" data-card="meridian" tabindex="0" role="button" aria-label="Meridian de Google — cliquez pour les détails">
    <rect x="64" y="186" width="344" height="536" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="186" width="344" height="6" fill="#B7332C"/>

    <text x="88" y="224" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B7332C">GOOGLE · JANVIER 2025</text>
    <text x="88" y="254" class="display" font-size="23" font-weight="600" fill="#1A1A1A">Meridian</text>
    <text x="88" y="276" class="body" font-size="12" fill="#8A8478">Bayésien · TensorFlow Probability</text>

    <line x1="88" y1="294" x2="384" y2="294" stroke="#E5E1D8" stroke-width="1"/>

    <text x="88" y="322" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">SURFACE DE DÉCLARATION</text>
    <text x="88" y="346" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Le retour lui-même</text>
    <text x="88" y="368" class="body" font-size="12.5" fill="#5A5A5A">La loi a priori porte sur le ROI du</text>
    <text x="88" y="386" class="body" font-size="12.5" fill="#5A5A5A">canal, grandeur que le directeur</text>
    <text x="88" y="404" class="body" font-size="12.5" fill="#5A5A5A">média sait lire et contester.</text>

    <line x1="88" y1="422" x2="384" y2="422" stroke="#E5E1D8" stroke-width="1"/>

    <text x="88" y="450" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">VALEUR PAR DÉFAUT</text>
    <rect x="88" y="462" width="296" height="34" rx="2" fill="#B7332C" opacity="0.1"/>
    <text x="102" y="484" class="mono" font-size="13" fill="#B7332C">LogNormal(0,2 ; 0,9)</text>
    <text x="88" y="516" class="body" font-size="12.5" fill="#5A5A5A">Médiane autour de 1,2. Un canal</text>
    <text x="88" y="534" class="body" font-size="12.5" fill="#5A5A5A">est réputé rentable par défaut.</text>

    <line x1="88" y1="552" x2="384" y2="552" stroke="#E5E1D8" stroke-width="1"/>

    <text x="88" y="580" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">ENTRÉE DE L'EXPÉRIENCE</text>
    <text x="88" y="604" class="body" font-size="12.5" fill="#5A5A5A">Un outil dédié traduit un résultat</text>
    <text x="88" y="622" class="body" font-size="12.5" fill="#5A5A5A">de test en a priori sur le ROI, avec</text>
    <text x="88" y="640" class="body" font-size="12.5" fill="#5A5A5A">intégration directe de GeoX.</text>

    <rect x="88" y="662" width="296" height="40" rx="2" fill="#1A1A1A"/>
    <text x="102" y="687" class="body" font-size="12.5" font-weight="500" fill="#FAF8F3">Déclaration explicite et auditable</text>
  </g>

  <!-- ROBYN -->
  <g class="interactive" data-card="robyn" tabindex="0" role="button" aria-label="Robyn de Meta — cliquez pour les détails">
    <rect x="428" y="186" width="344" height="536" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="428" y="186" width="344" height="6" fill="#B58A2C"/>

    <text x="452" y="224" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B58A2C">META · MAINTENU EN 2026</text>
    <text x="452" y="254" class="display" font-size="23" font-weight="600" fill="#1A1A1A">Robyn</text>
    <text x="452" y="276" class="body" font-size="12" fill="#8A8478">Ridge · Nevergrad · front de Pareto</text>

    <line x1="452" y1="294" x2="748" y2="294" stroke="#E5E1D8" stroke-width="1"/>

    <text x="452" y="322" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">SURFACE DE DÉCLARATION</text>
    <text x="452" y="346" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Les bornes de la forme</text>
    <text x="452" y="368" class="body" font-size="12.5" fill="#5A5A5A">On déclare l'intervalle admissible</text>
    <text x="452" y="386" class="body" font-size="12.5" fill="#5A5A5A">de rémanence et de saturation,</text>
    <text x="452" y="404" class="body" font-size="12.5" fill="#5A5A5A">jamais l'ampleur de l'effet.</text>

    <line x1="452" y1="422" x2="748" y2="422" stroke="#E5E1D8" stroke-width="1"/>

    <text x="452" y="450" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">VALEUR PAR DÉFAUT</text>
    <rect x="452" y="462" width="296" height="34" rx="2" fill="#B58A2C" opacity="0.12"/>
    <text x="466" y="484" class="mono" font-size="13" fill="#B58A2C">Uniforme sur l'intervalle</text>
    <text x="452" y="516" class="body" font-size="12.5" fill="#5A5A5A">Moins informatif, donc plus</text>
    <text x="452" y="534" class="body" font-size="12.5" fill="#5A5A5A">discret et plus difficile à auditer.</text>

    <line x1="452" y1="552" x2="748" y2="552" stroke="#E5E1D8" stroke-width="1"/>

    <text x="452" y="580" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">ENTRÉE DE L'EXPÉRIENCE</text>
    <text x="452" y="604" class="body" font-size="12.5" fill="#5A5A5A">Un troisième objectif d'optimisation</text>
    <text x="452" y="622" class="body" font-size="12.5" fill="#5A5A5A">s'active et favorise les modèles</text>
    <text x="452" y="640" class="body" font-size="12.5" fill="#5A5A5A">compatibles avec le test.</text>

    <rect x="452" y="662" width="296" height="40" rx="2" fill="#F2EEE4" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="466" y="687" class="body" font-size="12.5" font-weight="500" fill="#B58A2C">Déclaration implicite, peu tracée</text>
  </g>

  <!-- PYMC -->
  <g class="interactive" data-card="pymc" tabindex="0" role="button" aria-label="PyMC-Marketing — cliquez pour les détails">
    <rect x="792" y="186" width="344" height="536" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="792" y="186" width="344" height="6" fill="#1F5560"/>

    <text x="816" y="224" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#1F5560">PYMC LABS · INDÉPENDANT</text>
    <text x="816" y="254" class="display" font-size="23" font-weight="600" fill="#1A1A1A">PyMC-Marketing</text>
    <text x="816" y="276" class="body" font-size="12" fill="#8A8478">Bayésien · spécification libre</text>

    <line x1="816" y1="294" x2="1112" y2="294" stroke="#E5E1D8" stroke-width="1"/>

    <text x="816" y="322" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">SURFACE DE DÉCLARATION</text>
    <text x="816" y="346" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Tout, sans filet</text>
    <text x="816" y="368" class="body" font-size="12.5" fill="#5A5A5A">Chaque loi a priori est écrite par</text>
    <text x="816" y="386" class="body" font-size="12.5" fill="#5A5A5A">l'utilisateur, qui en assume seul</text>
    <text x="816" y="404" class="body" font-size="12.5" fill="#5A5A5A">la justification.</text>

    <line x1="816" y1="422" x2="1112" y2="422" stroke="#E5E1D8" stroke-width="1"/>

    <text x="816" y="450" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">VALEUR PAR DÉFAUT</text>
    <rect x="816" y="462" width="296" height="34" rx="2" fill="#1F5560" opacity="0.1"/>
    <text x="830" y="484" class="mono" font-size="13" fill="#1F5560">Aucune qui engage</text>
    <text x="816" y="516" class="body" font-size="12.5" fill="#5A5A5A">Rien à contester, donc rien non</text>
    <text x="816" y="534" class="body" font-size="12.5" fill="#5A5A5A">plus à relire six mois plus tard.</text>

    <line x1="816" y1="552" x2="1112" y2="552" stroke="#E5E1D8" stroke-width="1"/>

    <text x="816" y="580" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">ENTRÉE DE L'EXPÉRIENCE</text>
    <text x="816" y="604" class="body" font-size="12.5" fill="#5A5A5A">Une vraisemblance supplémentaire</text>
    <text x="816" y="622" class="body" font-size="12.5" fill="#5A5A5A">portant sur la courbe de saturation</text>
    <text x="816" y="640" class="body" font-size="12.5" fill="#5A5A5A">elle-même, et non sur son niveau.</text>

    <rect x="816" y="662" width="296" height="40" rx="2" fill="#F2EEE4" stroke="#1F5560" stroke-width="1.25"/>
    <text x="830" y="687" class="body" font-size="12.5" font-weight="500" fill="#1F5560">Déclaration libre, traçabilité à créer</text>
  </g>

  <rect x="64" y="742" width="1072" height="54" rx="3" fill="#1A1A1A"/>
  <text x="94" y="768" class="display" font-size="18" font-weight="600" fill="#FAF8F3">Deux des trois piles sont publiées par les deux premiers vendeurs d'espace publicitaire.</text>
  <text x="94" y="788" class="body" font-size="13" fill="#B8B5AE">La troisième est indépendante, et c'est celle qui laisse l'annonceur le plus seul devant sa déclaration.</text>

  <text x="64" y="824" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">SOURCES : DÉPÔT PUBLIC ET DOCUMENTATION DE CHAQUE PILE, CONSULTÉS LE 25 SEPTEMBRE 2026. LECTURE PAR SURFACE DE DÉCLARATION PROPRE À CE DOSSIER.</text>
</svg>
