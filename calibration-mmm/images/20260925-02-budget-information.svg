<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Le budget d'information d'un modèle de mix média : le nombre d'observations disponibles rapporté au nombre de paramètres à estimer">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="760" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le budget d'information</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Ce dont le modèle dispose, rapporté à ce qu'il doit estimer. L'écart est ce que l'a priori vient combler.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Gauche : observations -->
  <g class="interactive" data-card="donnees" tabindex="0" role="button" aria-label="Les observations disponibles — cliquez pour les détails">
    <rect x="64" y="186" width="500" height="300" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <text x="94" y="216" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CE DONT ON DISPOSE</text>
    <text x="94" y="256" class="display" font-size="46" font-weight="600" fill="#1A1A1A">156</text>
    <text x="180" y="256" class="body" font-size="15" fill="#5A5A5A">points hebdomadaires</text>
    <text x="180" y="276" class="body" font-size="13" fill="#8A8478">soit trois ans de recul</text>

    <line x1="94" y1="300" x2="534" y2="300" stroke="#E5E1D8" stroke-width="1"/>

    <text x="94" y="330" class="body" font-size="13.5" fill="#5A5A5A">Au-delà de trois ans, l'entreprise a changé de gamme,</text>
    <text x="94" y="352" class="body" font-size="13.5" fill="#5A5A5A">de périmètre ou de stratégie. Les semaines anciennes</text>
    <text x="94" y="374" class="body" font-size="13.5" fill="#5A5A5A">décrivent un autre monde et dégradent l'estimation</text>
    <text x="94" y="396" class="body" font-size="13.5" fill="#5A5A5A">au lieu de l'enrichir.</text>

    <rect x="94" y="418" width="440" height="46" rx="2" fill="#1F5560" opacity="0.1"/>
    <text x="110" y="440" class="body" font-size="12.5" fill="#1F5560">Deux ans de recul, cas fréquent, ramènent le compte</text>
    <text x="110" y="458" class="body" font-size="12.5" fill="#1F5560">à 104 points.</text>
  </g>

  <!-- Droite : paramètres -->
  <g class="interactive" data-card="parametres" tabindex="0" role="button" aria-label="Les paramètres à estimer — cliquez pour les détails">
    <rect x="636" y="186" width="500" height="300" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <text x="666" y="216" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QU'IL FAUT ESTIMER</text>
    <text x="666" y="256" class="display" font-size="46" font-weight="600" fill="#1A1A1A">57</text>
    <text x="736" y="256" class="body" font-size="15" fill="#5A5A5A">paramètres, configuration courante</text>
    <text x="736" y="276" class="body" font-size="13" fill="#8A8478">douze canaux, un modèle national</text>

    <line x1="666" y1="300" x2="1106" y2="300" stroke="#E5E1D8" stroke-width="1"/>

    <rect x="666" y="316" width="440" height="24" rx="2" fill="#B7332C" opacity="0.18"/>
    <text x="680" y="333" class="body" font-size="12.5" fill="#1A1A1A">Effet, rémanence et saturation, douze canaux</text>
    <text x="1092" y="333" class="mono" font-size="12.5" fill="#B7332C" text-anchor="end">36</text>

    <rect x="666" y="346" width="290" height="24" rx="2" fill="#B7332C" opacity="0.13"/>
    <text x="680" y="363" class="body" font-size="12.5" fill="#1A1A1A">Tendance et saisonnalité</text>
    <text x="1092" y="363" class="mono" font-size="12.5" fill="#B7332C" text-anchor="end">14</text>

    <rect x="666" y="376" width="140" height="24" rx="2" fill="#B7332C" opacity="0.09"/>
    <text x="680" y="393" class="body" font-size="12.5" fill="#1A1A1A">Prix, promotion, contrôles</text>
    <text x="1092" y="393" class="mono" font-size="12.5" fill="#B7332C" text-anchor="end">6</text>

    <rect x="666" y="406" width="40" height="24" rx="2" fill="#B7332C" opacity="0.07"/>
    <text x="680" y="423" class="body" font-size="12.5" fill="#1A1A1A">Variance résiduelle</text>
    <text x="1092" y="423" class="mono" font-size="12.5" fill="#B7332C" text-anchor="end">1</text>

    <text x="666" y="458" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Une version géographique ajoute une structure par région.</text>
  </g>

  <!-- Verdict ratio -->
  <g class="interactive" data-card="zone-sous-determinee" tabindex="0" role="button" aria-label="La zone où le modèle ne peut plus trancher — cliquez pour les détails">
    <rect x="64" y="510" width="1072" height="150" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.75"/>
    <text x="94" y="540" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">LE RATIO</text>

    <text x="94" y="590" class="display" font-size="40" font-weight="600" fill="#1A1A1A">2,7</text>
    <text x="164" y="580" class="body" font-size="13.5" fill="#5A5A5A">observations par paramètre</text>
    <text x="164" y="600" class="body" font-size="13.5" fill="#8A8478">dans la configuration ci-dessus</text>

    <line x1="470" y1="548" x2="470" y2="636" stroke="#E5E1D8" stroke-width="1"/>

    <text x="510" y="576" class="body" font-size="13.5" fill="#5A5A5A">La règle usuelle en régression demande dix à vingt observations</text>
    <text x="510" y="598" class="body" font-size="13.5" fill="#5A5A5A">par paramètre. Et la colinéarité entre canaux poussés ensemble</text>
    <text x="510" y="620" class="body" font-size="13.5" fill="#5A5A5A">réduit encore le nombre d'observations réellement informatives.</text>
  </g>

  <rect x="64" y="676" width="1072" height="42" rx="3" fill="#1A1A1A"/>
  <text x="94" y="703" class="display" font-size="17" font-weight="600" fill="#FAF8F3">Dans cette configuration, l'a priori est ce qui permet au modèle de rendre un nombre.</text>

  <text x="64" y="744" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">DÉCOMPTE DE PARAMÈTRES ÉTABLI POUR CE DOSSIER SUR UNE CONFIGURATION NATIONALE À DOUZE CANAUX ; ORDRE DE GRANDEUR ILLUSTRATIF.</text>
</svg>
