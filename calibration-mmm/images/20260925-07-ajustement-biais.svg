<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Qualité d'ajustement et biais d'attribution sont deux axes indépendants : le quadrant dangereux réunit un bon ajustement et un fort biais">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Deux axes indépendants, un seul est mesuré</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un modèle peut reproduire la courbe de ventes à la perfection et répartir l'effet entre les canaux de travers.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Colonne gauche : les instruments -->
  <g class="interactive" data-card="indicateurs-comite" tabindex="0" role="button" aria-label="Les indicateurs présentés en comité — cliquez pour les détails">
    <rect x="64" y="222" width="276" height="158" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="86" y="250" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">CE QUE LE COMITÉ REGARDE</text>
    <text x="86" y="278" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Coefficient de détermination</text>
    <text x="86" y="298" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Erreur en pourcentage absolu</text>
    <text x="86" y="318" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Prédiction hors échantillon</text>
    <line x1="86" y1="334" x2="318" y2="334" stroke="#E5E1D8" stroke-width="1"/>
    <text x="86" y="356" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Les trois lisent le même axe,</text>
    <text x="86" y="372" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">celui du bas.</text>
  </g>
  <line x1="340" y1="640" x2="374" y2="640" stroke="#5A5A5A" stroke-width="1.3" marker-end="url(#a7)"/>
  <path d="M 202,380 L 202,640 L 336,640" fill="none" stroke="#5A5A5A" stroke-width="1.3"/>

  <g class="interactive" data-card="ce-qui-detecte" tabindex="0" role="button" aria-label="Ce qui lit l'axe vertical — cliquez pour les détails">
    <rect x="64" y="424" width="276" height="158" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <text x="86" y="452" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#1F5560">CE QUI LIT L'AXE VERTICAL</text>
    <text x="86" y="480" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Une source d'information</text>
    <text x="86" y="500" class="body" font-size="13" font-weight="500" fill="#1A1A1A">extérieure au modèle</text>
    <line x1="86" y1="516" x2="318" y2="516" stroke="#E5E1D8" stroke-width="1"/>
    <text x="86" y="538" class="body" font-size="12.5" fill="#5A5A5A">La seule disponible est l'expérience</text>
    <text x="86" y="556" class="body" font-size="12.5" fill="#5A5A5A">randomisée, et elle ne figure sur</text>
    <text x="86" y="574" class="body" font-size="12.5" fill="#5A5A5A">aucun tableau de bord de qualité.</text>
  </g>
  <path d="M 340,486 L 358,486 L 358,300 L 374,300" fill="none" stroke="#1F5560" stroke-width="1.3" marker-end="url(#a7)"/>

  <!-- Matrice -->
  <rect x="380" y="196" width="600" height="420" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <line x1="680" y1="196" x2="680" y2="616" stroke="#E5E1D8" stroke-width="1.25"/>
  <line x1="380" y1="406" x2="980" y2="406" stroke="#E5E1D8" stroke-width="1.25"/>

  <!-- Q haut-gauche -->
  <text x="404" y="228" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">AJUSTEMENT FAIBLE · BIAIS FORT</text>
  <text x="404" y="262" class="display" font-size="18" font-weight="600" fill="#5A5A5A">Rejeté, pour la</text>
  <text x="404" y="284" class="display" font-size="18" font-weight="600" fill="#5A5A5A">mauvaise raison</text>
  <text x="404" y="312" class="body" font-size="12.5" fill="#8A8478">Le modèle est refait parce qu'il</text>
  <text x="404" y="330" class="body" font-size="12.5" fill="#8A8478">ajuste mal. Le biais d'attribution</text>
  <text x="404" y="348" class="body" font-size="12.5" fill="#8A8478">survit à l'itération suivante.</text>

  <!-- Q haut-droite : dangereux -->
  <g class="interactive" data-card="bon-ajustement-fort-biais" tabindex="0" role="button" aria-label="Le quadrant dangereux — cliquez pour les détails">
    <rect x="680" y="196" width="300" height="210" fill="#B7332C" fill-opacity="0.1"/>
    <rect x="680" y="196" width="300" height="210" fill="none" stroke="#B7332C" stroke-width="2.25"/>
    <text x="704" y="228" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">AJUSTEMENT FORT · BIAIS FORT</text>
    <text x="704" y="262" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Validé en comité,</text>
    <text x="704" y="284" class="display" font-size="18" font-weight="600" fill="#1A1A1A">faux dans la répartition</text>
    <text x="704" y="312" class="body" font-size="12.5" fill="#5A5A5A">La courbe de ventes est reproduite,</text>
    <text x="704" y="330" class="body" font-size="12.5" fill="#5A5A5A">le total est juste, et l'effet a été</text>
    <text x="704" y="348" class="body" font-size="12.5" fill="#5A5A5A">attribué au mauvais canal.</text>
    <text x="704" y="378" class="mono" font-size="11.5" letter-spacing="0.08em" fill="#B7332C">AUCUN INDICATEUR NE LE SIGNALE</text>
  </g>

  <!-- Q bas-gauche -->
  <text x="404" y="438" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">AJUSTEMENT FAIBLE · BIAIS FAIBLE</text>
  <text x="404" y="472" class="display" font-size="18" font-weight="600" fill="#5A5A5A">Rejeté à raison</text>
  <text x="404" y="502" class="body" font-size="12.5" fill="#8A8478">Le modèle est refait, et la décision</text>
  <text x="404" y="520" class="body" font-size="12.5" fill="#8A8478">de le refaire est la bonne. Le seul</text>
  <text x="404" y="538" class="body" font-size="12.5" fill="#8A8478">quadrant où l'indicateur usuel</text>
  <text x="404" y="556" class="body" font-size="12.5" fill="#8A8478">et la vérité coïncident.</text>

  <!-- Q bas-droite -->
  <rect x="680" y="406" width="300" height="210" fill="#1F5560" fill-opacity="0.08"/>
  <text x="704" y="438" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#1F5560">AJUSTEMENT FORT · BIAIS FAIBLE</text>
  <text x="704" y="472" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Ce qu'on croit avoir</text>
  <text x="704" y="502" class="body" font-size="12.5" fill="#5A5A5A">Le cas visé. On ne sait qu'on y est</text>
  <text x="704" y="520" class="body" font-size="12.5" fill="#5A5A5A">qu'en comparant la sortie du modèle</text>
  <text x="704" y="538" class="body" font-size="12.5" fill="#5A5A5A">à une expérience qu'on a menée.</text>
  <text x="704" y="568" class="mono" font-size="11.5" letter-spacing="0.08em" fill="#1F5560">SE DÉMONTRE, NE SE CONSTATE PAS</text>

  <text x="680" y="644" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">QUALITÉ D'AJUSTEMENT DU MODÈLE</text>
  <text x="0" y="0" transform="translate(366,406) rotate(-90)" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">BIAIS D'ATTRIBUTION ENTRE CANAUX</text>

  <!-- Preuves -->
  <rect x="1004" y="196" width="132" height="420" rx="3" fill="#F2EEE4"/>
  <text x="1020" y="228" class="mono" font-size="10" letter-spacing="0.08em" fill="#5A5A5A">DEUX TRAVAUX</text>
  <text x="1020" y="244" class="mono" font-size="10" letter-spacing="0.08em" fill="#5A5A5A">INDÉPENDANTS</text>

  <text x="1020" y="292" class="display" font-size="30" font-weight="600" fill="#B7332C">663</text>
  <text x="1020" y="314" class="body" font-size="11.5" fill="#5A5A5A">expériences à</text>
  <text x="1020" y="330" class="body" font-size="11.5" fill="#5A5A5A">grande échelle :</text>
  <text x="1020" y="346" class="body" font-size="11.5" fill="#5A5A5A">aucune méthode</text>
  <text x="1020" y="362" class="body" font-size="11.5" fill="#5A5A5A">non expérimentale</text>
  <text x="1020" y="378" class="body" font-size="11.5" fill="#5A5A5A">ne retrouve l'effet</text>
  <text x="1020" y="394" class="body" font-size="11.5" fill="#5A5A5A">mesuré.</text>

  <line x1="1020" y1="418" x2="1120" y2="418" stroke="#E5E1D8" stroke-width="1"/>

  <text x="1020" y="462" class="display" font-size="30" font-weight="600" fill="#1F5560">156</text>
  <text x="1020" y="484" class="body" font-size="11.5" fill="#5A5A5A">semaines à vérité</text>
  <text x="1020" y="500" class="body" font-size="11.5" fill="#5A5A5A">connue, dépense</text>
  <text x="1020" y="516" class="body" font-size="11.5" fill="#5A5A5A">endogène : le seul</text>
  <text x="1020" y="532" class="body" font-size="11.5" fill="#5A5A5A">terrain où l'on peut</text>
  <text x="1020" y="548" class="body" font-size="11.5" fill="#5A5A5A">poser la question</text>
  <text x="1020" y="564" class="body" font-size="11.5" fill="#5A5A5A">du biais.</text>

  <rect x="64" y="688" width="1072" height="76" rx="3" fill="#1A1A1A"/>
  <text x="94" y="720" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#E8B84B">CE QU'IL FAUT EN RETENIR</text>
  <text x="94" y="748" class="display" font-size="19" font-weight="600" fill="#FAF8F3">Le tableau de bord de qualité est muet sur la seule propriété qui commande la décision.</text>

  <text x="64" y="812" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">SOURCES : GORDON, MOAKLER ET ZETTELMEYER, MARKETING SCIENCE 2023 (663 EXPÉRIENCES) ; HEUSCH, ARXIV 2608.21130, AOÛT 2026 (156 SEMAINES).</text>
  <text x="64" y="832" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">LECTURE EN QUATRE QUADRANTS PROPRE À CE DOSSIER.</text>
</svg>
