<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Le poids de l'a priori dans le résultat final selon la force du signal contenu dans les données">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .prior   { fill: none; stroke: #B7332C; stroke-width: 1.8; stroke-dasharray: 6 4; }
    .lik     { fill: #1F5560; fill-opacity: 0.12; stroke: #1F5560; stroke-width: 1.6; }
    .post    { fill: none; stroke: #1A1A1A; stroke-width: 2.6; }
  </style>

  <rect width="1200" height="820" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce que l'a priori pèse, selon ce que les données disent</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le même a priori s'efface ou gouverne le résultat. C'est la richesse du signal qui décide, et elle n'est jamais affichée.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- CAS 1 : SIGNAL FORT -->
  <g class="interactive" data-card="signal-fort" tabindex="0" role="button" aria-label="Cas du signal fort — cliquez pour les détails">
    <rect x="64" y="186" width="1072" height="150" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="186" width="5" height="150" fill="#1F5560"/>

    <text x="96" y="216" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#1F5560">CAS 1</text>
    <text x="96" y="248" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Signal fort</text>
    <text x="96" y="272" class="body" font-size="12.5" fill="#5A5A5A">Canal coupé puis relancé, variation</text>
    <text x="96" y="290" class="body" font-size="12.5" fill="#5A5A5A">large, peu corrélé aux autres.</text>
    <text x="96" y="316" class="body" font-size="12.5" font-style="italic" fill="#1F5560">Le cas rare.</text>

    <path class="prior" d="M 400,312 C 517,312 535,272 660,272 C 785,272 803,312 920,312"/>
    <path class="lik" d="M 440,312 C 471,312 476,222 500,222 C 524,222 529,312 560,312 Z"/>
    <path class="post" d="M 444,312 C 475,312 480,226 504,226 C 528,226 533,312 564,312"/>
    <line x1="400" y1="312" x2="920" y2="312" stroke="#B8B5AE" stroke-width="1"/>

    <rect x="960" y="222" width="152" height="80" rx="2" fill="#1F5560" opacity="0.1"/>
    <text x="976" y="248" class="body" font-size="12.5" font-weight="500" fill="#1F5560">Le résultat suit</text>
    <text x="976" y="266" class="body" font-size="12.5" font-weight="500" fill="#1F5560">les données.</text>
    <text x="976" y="290" class="mono" font-size="11.5" fill="#1F5560">A PRIORI EFFACÉ</text>
  </g>

  <!-- CAS 2 : SIGNAL FAIBLE -->
  <g class="interactive" data-card="signal-faible" tabindex="0" role="button" aria-label="Cas du signal faible — cliquez pour les détails">
    <rect x="64" y="346" width="1072" height="150" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="346" width="5" height="150" fill="#B58A2C"/>

    <text x="96" y="376" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B58A2C">CAS 2</text>
    <text x="96" y="408" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Signal faible</text>
    <text x="96" y="432" class="body" font-size="12.5" fill="#5A5A5A">Budget stable, canal poussé en même</text>
    <text x="96" y="450" class="body" font-size="12.5" fill="#5A5A5A">temps que deux autres.</text>
    <text x="96" y="476" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">Le cas ordinaire.</text>

    <path class="prior" d="M 610,472 C 676,472 686,404 756,404 C 826,404 836,472 902,472"/>
    <path class="lik" d="M 400,472 C 490,472 504,412 600,412 C 696,412 710,472 800,472 Z"/>
    <path class="post" d="M 520,472 C 592,472 603,398 680,398 C 757,398 768,472 840,472"/>
    <line x1="400" y1="472" x2="920" y2="472" stroke="#B8B5AE" stroke-width="1"/>

    <rect x="960" y="382" width="152" height="80" rx="2" fill="#B58A2C" opacity="0.12"/>
    <text x="976" y="408" class="body" font-size="12.5" font-weight="500" fill="#B58A2C">Le résultat est un</text>
    <text x="976" y="426" class="body" font-size="12.5" font-weight="500" fill="#B58A2C">compromis.</text>
    <text x="976" y="450" class="mono" font-size="11.5" fill="#B58A2C">A PRIORI TIRE</text>
  </g>

  <!-- CAS 3 : SIGNAL ABSENT -->
  <g class="interactive" data-card="signal-absent" tabindex="0" role="button" aria-label="Cas du signal absent — cliquez pour les détails">
    <rect x="64" y="506" width="1072" height="150" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.75"/>
    <rect x="64" y="506" width="5" height="150" fill="#B7332C"/>

    <text x="96" y="536" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B7332C">CAS 3</text>
    <text x="96" y="568" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Signal absent</text>
    <text x="96" y="592" class="body" font-size="12.5" fill="#5A5A5A">Canal toujours actif au même niveau,</text>
    <text x="96" y="610" class="body" font-size="12.5" fill="#5A5A5A">ou indicateur sans valeur monétaire.</text>
    <text x="96" y="636" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Le cas aveugle.</text>

    <path class="prior" d="M 610,632 C 676,632 686,564 756,564 C 826,564 836,632 902,632"/>
    <path class="lik" d="M 400,632 C 496,632 512,614 660,614 C 808,614 824,632 920,632 Z"/>
    <path class="post" d="M 614,632 C 680,632 690,568 760,568 C 830,568 840,632 906,632"/>
    <line x1="400" y1="632" x2="920" y2="632" stroke="#B8B5AE" stroke-width="1"/>

    <rect x="960" y="542" width="152" height="80" rx="2" fill="#B7332C" opacity="0.13"/>
    <text x="976" y="568" class="body" font-size="12.5" font-weight="500" fill="#B7332C">Le résultat est</text>
    <text x="976" y="586" class="body" font-size="12.5" font-weight="500" fill="#B7332C">l'a priori.</text>
    <text x="976" y="610" class="mono" font-size="11.5" fill="#B7332C">A PRIORI RENDU</text>
  </g>

  <!-- Légende -->
  <line x1="400" y1="678" x2="440" y2="678" stroke="#B7332C" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="450" y="682" class="body" font-size="12" fill="#5A5A5A">A priori déclaré</text>
  <rect x="580" y="671" width="40" height="14" fill="#1F5560" fill-opacity="0.12" stroke="#1F5560" stroke-width="1.6"/>
  <text x="630" y="682" class="body" font-size="12" fill="#5A5A5A">Ce que les données disent</text>
  <line x1="820" y1="678" x2="860" y2="678" stroke="#1A1A1A" stroke-width="2.6"/>
  <text x="870" y="682" class="body" font-size="12" fill="#5A5A5A">Le chiffre remonté</text>

  <text x="660" y="712" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478" text-anchor="middle">RETOUR ESTIMÉ POUR UN CANAL</text>

  <rect x="64" y="728" width="1072" height="46" rx="3" fill="#1A1A1A"/>
  <text x="94" y="757" class="display" font-size="17" font-weight="600" fill="#FAF8F3">Les trois courbes noires se ressemblent à l'écran. Seule celle du haut a été mesurée.</text>

  <text x="64" y="804" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">ILLUSTRATION QUALITATIVE DU MÉCANISME BAYÉSIEN ; LES COURBES NE SONT PAS ISSUES D'UNE ESTIMATION RÉELLE.</text>
</svg>
