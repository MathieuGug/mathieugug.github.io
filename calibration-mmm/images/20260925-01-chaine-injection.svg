<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Anatomie d'un modèle de mix média et les trois points où une déclaration humaine entre dans la chaîne">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5A5A"/>
    </marker>
    <marker id="a1r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Où la déclaration entre dans la chaîne</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un modèle de mix transforme une dépense en retour. Trois fois en chemin, un humain a écrit quelque chose.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Bandeau déclaration -->
  <text x="64" y="196" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QUI EST DÉCLARÉ AVANT L'ESTIMATION</text>

  <g class="interactive" data-card="adstock" tabindex="0" role="button" aria-label="Déclaration sur la rémanence — cliquez pour les détails">
    <rect x="266" y="212" width="220" height="86" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <text x="286" y="240" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">DÉCLARATION 1</text>
    <text x="286" y="264" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Combien de semaines</text>
    <text x="286" y="284" class="body" font-size="13" font-weight="500" fill="#1A1A1A">l'effet peut durer</text>
    <line x1="376" y1="298" x2="376" y2="342" stroke="#B7332C" stroke-width="1.4" marker-end="url(#a1r)"/>
  </g>

  <g class="interactive" data-card="saturation" tabindex="0" role="button" aria-label="Déclaration sur la saturation — cliquez pour les détails">
    <rect x="490" y="212" width="220" height="86" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <text x="510" y="240" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">DÉCLARATION 2</text>
    <text x="510" y="264" class="body" font-size="13" font-weight="500" fill="#1A1A1A">À partir de quel niveau</text>
    <text x="510" y="284" class="body" font-size="13" font-weight="500" fill="#1A1A1A">les retours décroissent</text>
    <line x1="600" y1="298" x2="600" y2="342" stroke="#B7332C" stroke-width="1.4" marker-end="url(#a1r)"/>
  </g>

  <g class="interactive" data-card="prior-roi" tabindex="0" role="button" aria-label="Déclaration sur le retour lui-même — cliquez pour les détails">
    <rect x="916" y="212" width="220" height="86" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.25"/>
    <text x="936" y="240" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">DÉCLARATION 3</text>
    <text x="936" y="264" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Ce que le canal rend,</text>
    <text x="936" y="284" class="body" font-size="13" font-weight="500" fill="#1A1A1A">avant toute donnée</text>
    <line x1="1026" y1="298" x2="1026" y2="342" stroke="#B7332C" stroke-width="1.4" marker-end="url(#a1r)"/>
  </g>

  <!-- Chaîne -->
  <rect x="42" y="352" width="1116" height="128" rx="4" fill="#F2EEE4"/>

  <rect x="64" y="374" width="176" height="84" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="84" y="402" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">ÉTAPE 1</text>
  <text x="84" y="428" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Dépense</text>
  <text x="84" y="448" class="body" font-size="11.5" fill="#8A8478">Série hebdomadaire</text>
  <line x1="248" y1="416" x2="274" y2="416" stroke="#5A5A5A" stroke-width="1.3" marker-end="url(#a1)"/>

  <rect x="288" y="374" width="176" height="84" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="308" y="402" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">ÉTAPE 2</text>
  <text x="308" y="428" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Rémanence</text>
  <text x="308" y="448" class="body" font-size="11.5" fill="#8A8478">L'effet s'étale</text>
  <line x1="472" y1="416" x2="498" y2="416" stroke="#5A5A5A" stroke-width="1.3" marker-end="url(#a1)"/>

  <rect x="512" y="374" width="176" height="84" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="532" y="402" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">ÉTAPE 3</text>
  <text x="532" y="428" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Saturation</text>
  <text x="532" y="448" class="body" font-size="11.5" fill="#8A8478">L'effet plafonne</text>
  <line x1="696" y1="416" x2="722" y2="416" stroke="#5A5A5A" stroke-width="1.3" marker-end="url(#a1)"/>

  <rect x="736" y="374" width="176" height="84" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="756" y="402" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">ÉTAPE 4</text>
  <text x="756" y="428" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Contribution</text>
  <text x="756" y="448" class="body" font-size="11.5" fill="#8A8478">Part de la vente</text>
  <line x1="920" y1="416" x2="946" y2="416" stroke="#5A5A5A" stroke-width="1.3" marker-end="url(#a1)"/>

  <rect x="960" y="374" width="176" height="84" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.75"/>
  <text x="980" y="402" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">ÉTAPE 5</text>
  <text x="980" y="428" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Retour</text>
  <text x="980" y="448" class="body" font-size="11.5" fill="#8A8478">Le chiffre remonté</text>

  <!-- Postérieur -->
  <g class="interactive" data-card="posterior" tabindex="0" role="button" aria-label="Ce qui sort du modèle — cliquez pour les détails">
    <rect x="64" y="518" width="1072" height="122" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <text x="94" y="548" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CE QUI SORT</text>
    <text x="94" y="580" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Une distribution a posteriori, soit un arbitrage entre deux sources</text>

    <rect x="94" y="596" width="470" height="26" rx="2" fill="#1F5560" opacity="0.14"/>
    <text x="108" y="614" class="body" font-size="12.5" fill="#1F5560">Ce que 104 à 156 semaines de données supportent</text>

    <rect x="580" y="596" width="470" height="26" rx="2" fill="#B7332C" opacity="0.14"/>
    <text x="594" y="614" class="body" font-size="12.5" fill="#B7332C">Ce que les trois déclarations ci-dessus imposent</text>

    <text x="1066" y="614" class="mono" font-size="12" fill="#5A5A5A" text-anchor="end">= ROI</text>
  </g>

  <rect x="64" y="662" width="1072" height="56" rx="3" fill="#1A1A1A"/>
  <text x="94" y="696" class="display" font-size="18" font-weight="600" fill="#FAF8F3">La note de synthèse remontée au comité contient la sortie. Elle ne contient jamais les trois entrées.</text>

  <text x="64" y="744" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">STRUCTURE COMMUNE AUX TROIS PILES OUVERTES ; REPÉRAGE DES POINTS DE DÉCLARATION PROPRE À CE DOSSIER.</text>
</svg>
