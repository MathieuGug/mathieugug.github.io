<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Le cycle annuel de calibration d'un modèle de mix et le point de rupture d'estimand qui l'invalide">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5A5A"/>
    </marker>
    <marker id="a6r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le cycle annuel de calibration</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Une ligne du plan média, avec sa cadence et sa règle de péremption. Un protocole s'y décide avant le test.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Callout rupture -->
  <g class="interactive" data-card="estimand" tabindex="0" role="button" aria-label="Le point de rupture d'estimand — cliquez pour les détails">
    <rect x="288" y="182" width="400" height="54" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.75"/>
    <text x="306" y="204" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">POINT DE RUPTURE</text>
    <text x="306" y="226" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Un test de baisse partielle ne calibre pas un modèle à dépense nulle</text>
    <line x1="376" y1="236" x2="376" y2="268" stroke="#B7332C" stroke-width="1.4" marker-end="url(#a6r)"/>
  </g>

  <!-- Étapes -->
  <g class="interactive" data-card="plan-test" tabindex="0" role="button" aria-label="Le plan de test — cliquez pour les détails">
    <rect x="64" y="278" width="176" height="140" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <text x="84" y="306" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#1F5560">ÉTAPE 1</text>
    <text x="84" y="332" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Plan de test</text>
    <text x="84" y="356" class="body" font-size="11.5" fill="#5A5A5A">Quels canaux, dans</text>
    <text x="84" y="373" class="body" font-size="11.5" fill="#5A5A5A">quel ordre, avec quel</text>
    <text x="84" y="390" class="body" font-size="11.5" fill="#5A5A5A">budget sacrifié.</text>
  </g>
  <line x1="248" y1="348" x2="274" y2="348" stroke="#5A5A5A" stroke-width="1.3" marker-end="url(#a6)"/>

  <rect x="288" y="278" width="176" height="140" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.75"/>
  <text x="308" y="306" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">ÉTAPE 2</text>
  <text x="308" y="332" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Protocole</text>
  <text x="308" y="356" class="body" font-size="11.5" fill="#5A5A5A">Lift moyen contre</text>
  <text x="308" y="373" class="body" font-size="11.5" fill="#5A5A5A">contrefactuel de</text>
  <text x="308" y="390" class="body" font-size="11.5" fill="#5A5A5A">dépense nulle.</text>
  <line x1="472" y1="348" x2="498" y2="348" stroke="#5A5A5A" stroke-width="1.3" marker-end="url(#a6)"/>

  <rect x="512" y="278" width="176" height="140" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="532" y="306" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">ÉTAPE 3</text>
  <text x="532" y="332" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Expérience</text>
  <text x="532" y="356" class="body" font-size="11.5" fill="#5A5A5A">Six à huit semaines,</text>
  <text x="532" y="373" class="body" font-size="11.5" fill="#5A5A5A">régions témoins tenues</text>
  <text x="532" y="390" class="body" font-size="11.5" fill="#5A5A5A">jusqu'au bout.</text>
  <line x1="696" y1="348" x2="722" y2="348" stroke="#5A5A5A" stroke-width="1.3" marker-end="url(#a6)"/>

  <rect x="736" y="278" width="176" height="140" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="756" y="306" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">ÉTAPE 4</text>
  <text x="756" y="332" class="display" font-size="17" font-weight="600" fill="#1A1A1A">A priori</text>
  <text x="756" y="356" class="body" font-size="11.5" fill="#5A5A5A">Traduction du résultat</text>
  <text x="756" y="373" class="body" font-size="11.5" fill="#5A5A5A">en déclaration datée</text>
  <text x="756" y="390" class="body" font-size="11.5" fill="#5A5A5A">et signée.</text>
  <line x1="920" y1="348" x2="946" y2="348" stroke="#5A5A5A" stroke-width="1.3" marker-end="url(#a6)"/>

  <g class="interactive" data-card="repartition" tabindex="0" role="button" aria-label="La répartition du budget — cliquez pour les détails">
    <rect x="960" y="278" width="176" height="140" rx="3" fill="#1A1A1A"/>
    <text x="980" y="306" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#E8B84B">ÉTAPE 5</text>
    <text x="980" y="332" class="display" font-size="17" font-weight="600" fill="#FAF8F3">Répartition</text>
    <text x="980" y="356" class="body" font-size="11.5" fill="#B8B5AE">Le modèle tourne, le</text>
    <text x="980" y="373" class="body" font-size="11.5" fill="#B8B5AE">budget de l'année</text>
    <text x="980" y="390" class="body" font-size="11.5" fill="#B8B5AE">suivante se décide.</text>
  </g>

  <!-- Boucle de retour -->
  <path d="M 1048,418 L 1048,452 L 152,452 L 152,424" fill="none" stroke="#1F5560" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#a6)"/>
  <text x="600" y="444" class="body" font-size="12" font-style="italic" fill="#1F5560" text-anchor="middle">La répartition de l'année dicte ce qu'il faudra tester l'année d'après</text>

  <!-- Ce que la cadence impose -->
  <rect x="64" y="480" width="344" height="128" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="88" y="508" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">ROTATION</text>
  <text x="88" y="534" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Un ou deux canaux par trimestre</text>
  <text x="88" y="560" class="body" font-size="12.5" fill="#5A5A5A">Une campagne unique sur un canal ne</text>
  <text x="88" y="578" class="body" font-size="12.5" fill="#5A5A5A">couvre pas un portefeuille de douze.</text>
  <text x="88" y="596" class="body" font-size="12.5" fill="#5A5A5A">Le plan se lit sur trois ans.</text>

  <rect x="428" y="480" width="344" height="128" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="452" y="508" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">PÉREMPTION</text>
  <text x="452" y="534" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Un a priori calibré vieillit</text>
  <text x="452" y="560" class="body" font-size="12.5" fill="#5A5A5A">Création, pression concurrentielle et</text>
  <text x="452" y="578" class="body" font-size="12.5" fill="#5A5A5A">algorithmes de régie changent. Passé</text>
  <text x="452" y="596" class="body" font-size="12.5" fill="#5A5A5A">un délai, la mesure redevient opinion.</text>

  <rect x="792" y="480" width="344" height="128" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
  <text x="816" y="508" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#B7332C">SEUIL D'INDÉTECTABILITÉ</text>
  <text x="816" y="534" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Certains canaux ne sont pas calibrables</text>
  <text x="816" y="560" class="body" font-size="12.5" fill="#5A5A5A">Sous le seuil de détection de l'annonceur,</text>
  <text x="816" y="578" class="body" font-size="12.5" fill="#5A5A5A">aucun budget de test ne produit un</text>
  <text x="816" y="596" class="body" font-size="12.5" fill="#5A5A5A">résultat. Ils restent gouvernés par l'a priori.</text>

  <rect x="64" y="626" width="1072" height="46" rx="3" fill="#1A1A1A"/>
  <text x="94" y="655" class="display" font-size="17" font-weight="600" fill="#FAF8F3">La calibration se provisionne dans le plan média, avec une ligne et une date.</text>

  <text x="64" y="706" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">AVERTISSEMENT D'INCOMPATIBILITÉ D'ESTIMAND : DOCUMENTATION DE CALIBRATION MERIDIAN. CADENCE ET RÈGLE DE PÉREMPTION PROPRES À CE DOSSIER.</text>
  <text x="64" y="726" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">SEUIL D'INDÉTECTABILITÉ : DÉRIVÉ DE LEWIS ET RAO, QJE 2015.</text>
</svg>
