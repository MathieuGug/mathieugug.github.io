<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Les trois origines possibles d'un a priori et ce que chacune rend opposable, vérifiable et réexécutable">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">D'où vient l'a priori, et ce que chaque origine engage</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le modèle traite les trois origines de façon identique. La chaîne de décision devrait les distinguer.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- En-têtes de colonnes -->
  <text x="94" y="192" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A">ORIGINE DE LA VALEUR DÉCLARÉE</text>
  <text x="505" y="192" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">PROTOCOLE</text>
  <text x="505" y="206" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">ÉCRIT</text>
  <text x="691" y="192" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">INTERVALLE</text>
  <text x="691" y="206" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">PUBLIÉ</text>
  <text x="877" y="192" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">REFAISABLE</text>
  <text x="877" y="206" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">PAR UN TIERS</text>
  <text x="1057" y="192" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">COÛT POUR</text>
  <text x="1057" y="206" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">L'ANNONCEUR</text>

  <!-- Origine 1 -->
  <g class="interactive" data-card="experience-propre" tabindex="0" role="button" aria-label="A priori issu d'une expérience propre — cliquez pour les détails">
    <rect x="64" y="220" width="1072" height="122" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="220" width="5" height="122" fill="#1F5560"/>
    <text x="94" y="250" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#1F5560">ORIGINE 1</text>
    <text x="94" y="280" class="display" font-size="20" font-weight="600" fill="#1A1A1A">L'expérience propre</text>
    <text x="94" y="304" class="body" font-size="12.5" fill="#5A5A5A">Test géographique mené par l'annonceur : régions traitées,</text>
    <text x="94" y="322" class="body" font-size="12.5" fill="#5A5A5A">régions témoins, écart mesuré.</text>

    <text x="505" y="292" class="mono" font-size="13" letter-spacing="0.06em" fill="#1F5560" text-anchor="middle">OUI</text>
    <text x="691" y="292" class="mono" font-size="13" letter-spacing="0.06em" fill="#1F5560" text-anchor="middle">OUI</text>
    <text x="877" y="292" class="mono" font-size="13" letter-spacing="0.06em" fill="#1F5560" text-anchor="middle">OUI</text>
    <text x="1057" y="292" class="mono" font-size="13" letter-spacing="0.06em" fill="#B58A2C" text-anchor="middle">ÉLEVÉ</text>
  </g>

  <!-- Origine 2 -->
  <g class="interactive" data-card="expert" tabindex="0" role="button" aria-label="A priori issu d'un jugement d'expert — cliquez pour les détails">
    <rect x="64" y="354" width="1072" height="122" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="354" width="5" height="122" fill="#B58A2C"/>
    <text x="94" y="384" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B58A2C">ORIGINE 2</text>
    <text x="94" y="414" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le jugement d'expert</text>
    <text x="94" y="438" class="body" font-size="12.5" fill="#5A5A5A">Reprise d'un modèle antérieur, d'un référentiel sectoriel ou</text>
    <text x="94" y="456" class="body" font-size="12.5" fill="#5A5A5A">de l'expérience accumulée d'un analyste. Le cas majoritaire.</text>

    <text x="505" y="426" class="mono" font-size="13" letter-spacing="0.06em" fill="#B7332C" text-anchor="middle">NON</text>
    <text x="691" y="426" class="mono" font-size="13" letter-spacing="0.06em" fill="#B7332C" text-anchor="middle">NON</text>
    <text x="877" y="426" class="mono" font-size="13" letter-spacing="0.06em" fill="#B7332C" text-anchor="middle">NON</text>
    <text x="1057" y="426" class="mono" font-size="13" letter-spacing="0.06em" fill="#1F5560" text-anchor="middle">NUL</text>
  </g>

  <!-- Origine 3 -->
  <g class="interactive" data-card="vendeur" tabindex="0" role="button" aria-label="A priori issu d'une étude du vendeur d'espace — cliquez pour les détails">
    <rect x="64" y="488" width="1072" height="140" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.75"/>
    <rect x="64" y="488" width="5" height="140" fill="#B7332C"/>
    <text x="94" y="518" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B7332C">ORIGINE 3 · CELLE QUI A CHANGÉ DE NATURE EN 2026</text>
    <text x="94" y="548" class="display" font-size="20" font-weight="600" fill="#1A1A1A">L'étude du vendeur d'espace</text>
    <text x="94" y="572" class="body" font-size="12.5" fill="#5A5A5A">Résultat de lift fourni par la régie du canal concerné. Depuis</text>
    <text x="94" y="590" class="body" font-size="12.5" fill="#5A5A5A">le 9 septembre 2026, le vendeur fournit aussi la bibliothèque</text>
    <text x="94" y="608" class="body" font-size="12.5" fill="#5A5A5A">d'expérimentation et le pont vers le modèle.</text>

    <text x="505" y="558" class="mono" font-size="13" letter-spacing="0.06em" fill="#1F5560" text-anchor="middle">OUI</text>
    <text x="691" y="558" class="mono" font-size="13" letter-spacing="0.06em" fill="#1F5560" text-anchor="middle">OUI</text>
    <text x="877" y="558" class="mono" font-size="13" letter-spacing="0.06em" fill="#B7332C" text-anchor="middle">NON</text>
    <text x="1057" y="558" class="mono" font-size="13" letter-spacing="0.06em" fill="#1F5560" text-anchor="middle">FAIBLE</text>
    <text x="877" y="580" class="body" font-size="11" font-style="italic" fill="#B7332C" text-anchor="middle">la colonne qui décide</text>
  </g>

  <!-- Verdict -->
  <g class="interactive" data-card="verdict" tabindex="0" role="button" aria-label="Le verdict praticable — cliquez pour les détails">
    <rect x="64" y="648" width="1072" height="96" rx="3" fill="#1A1A1A"/>
    <text x="94" y="678" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#E8B84B">LE VERDICT PRATICABLE</text>
    <text x="94" y="708" class="display" font-size="19" font-weight="600" fill="#FAF8F3">Aucune origine n'est interdite. Ce qui manque est la colonne qui dit laquelle a servi.</text>
    <text x="94" y="732" class="body" font-size="13" fill="#B8B5AE">Un a priori entre dans un modèle et n'en ressort plus sous forme de ligne séparée. Il faut donc l'étiqueter avant.</text>
  </g>

  <text x="64" y="784" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">TAXONOMIE DES ORIGINES ET GRILLE D'ÉVALUATION PROPRES À CE DOSSIER ; DATE DE DISPONIBILITÉ MONDIALE DE L'OUTIL D'EXPÉRIMENTATION SOURCÉE.</text>
</svg>
