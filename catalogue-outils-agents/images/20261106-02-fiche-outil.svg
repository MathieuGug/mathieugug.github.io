<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Le modèle de données canonique d'un serveur d'outils : onze propriétés dont trois obligatoires, et les quatre champs de gouvernance qui n'existent pas">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Onze champs, et quatre absences</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le modèle de données canonique d'un serveur d'outils, lu par ce qu'il contient puis par ce qu'il ne contient pas.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">CE QUE LE SCHÉMA OFFICIEL DÉFINIT</text>
  <text x="648" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">CE QU'AUCUN CHAMP NE PORTE</text>

  <!-- colonne gauche : les champs présents -->
  <g class="interactive" data-card="champs-presents" tabindex="0" role="button" aria-label="Les onze propriétés du schéma officiel — cliquez pour les détails">
    <rect x="64" y="212" width="536" height="382" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="88" y="242" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">OBJET  ServerDetail  ·  3 CHAMPS OBLIGATOIRES</text>

    <rect x="88" y="258" width="488" height="30" rx="2" fill="#B7332C" fill-opacity="0.09"/>
    <text x="102" y="278" class="mono" font-size="12.5" font-weight="600" fill="#B7332C">name</text>
    <text x="250" y="278" class="body" font-size="12" fill="#5A5A5A">DNS inversé, un seul « / » : espace de noms + nom</text>

    <rect x="88" y="292" width="488" height="30" rx="2" fill="#B7332C" fill-opacity="0.09"/>
    <text x="102" y="312" class="mono" font-size="12.5" font-weight="600" fill="#B7332C">description</text>
    <text x="250" y="312" class="body" font-size="12" fill="#5A5A5A">texte libre, lu par le modèle au moment du choix</text>

    <rect x="88" y="326" width="488" height="30" rx="2" fill="#B7332C" fill-opacity="0.09"/>
    <text x="102" y="346" class="mono" font-size="12.5" font-weight="600" fill="#B7332C">version</text>
    <text x="250" y="346" class="body" font-size="12" fill="#5A5A5A">chaîne libre, versionnage sémantique recommandé</text>

    <text x="88" y="384" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">8 CHAMPS FACULTATIFS</text>
    <text x="102" y="412" class="mono" font-size="12.5" fill="#5A5A5A">title</text>
    <text x="250" y="412" class="body" font-size="12" fill="#8A8478">libellé d'affichage</text>
    <text x="102" y="436" class="mono" font-size="12.5" fill="#5A5A5A">icons</text>
    <text x="250" y="436" class="body" font-size="12" fill="#8A8478">jeu d'icônes dimensionnées</text>
    <text x="102" y="460" class="mono" font-size="12.5" fill="#5A5A5A">websiteUrl</text>
    <text x="250" y="460" class="body" font-size="12" fill="#8A8478">page du projet</text>
    <text x="102" y="484" class="mono" font-size="12.5" fill="#5A5A5A">repository</text>
    <text x="250" y="484" class="body" font-size="12" fill="#8A8478">dépôt de code, « pour l'inspection »</text>
    <text x="102" y="508" class="mono" font-size="12.5" fill="#5A5A5A">packages</text>
    <text x="250" y="508" class="body" font-size="12" fill="#8A8478">paquets installables</text>
    <text x="102" y="532" class="mono" font-size="12.5" fill="#5A5A5A">remotes</text>
    <text x="250" y="532" class="body" font-size="12" fill="#8A8478">points d'accès distants</text>
    <text x="102" y="556" class="mono" font-size="12.5" fill="#5A5A5A">_meta</text>
    <text x="250" y="556" class="body" font-size="12" fill="#8A8478">extensions, espaces de noms en DNS inversé</text>
    <text x="102" y="580" class="mono" font-size="12.5" fill="#5A5A5A">$schema</text>
    <text x="250" y="580" class="body" font-size="12" fill="#8A8478">référence du format lui-même</text>
  </g>

  <!-- colonne droite : les absences -->
  <g class="interactive" data-card="absence-proprietaire" tabindex="0" role="button" aria-label="L'absence de champ propriétaire — cliquez pour les détails">
    <rect x="648" y="212" width="488" height="86" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2"/>
    <rect x="648" y="212" width="5" height="86" fill="#B7332C"/>
    <text x="672" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ABSENCE 1</text>
    <text x="672" y="266" class="display" font-size="19" font-weight="600" fill="#B7332C">Aucun propriétaire</text>
    <text x="672" y="288" class="body" font-size="12.5" fill="#5A5A5A">Ni personne, ni équipe, ni service responsable.</text>
  </g>

  <g class="interactive" data-card="absence-contact" tabindex="0" role="button" aria-label="L'absence de contact d'alerte — cliquez pour les détails">
    <rect x="648" y="314" width="488" height="86" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2"/>
    <rect x="648" y="314" width="5" height="86" fill="#B7332C"/>
    <text x="672" y="342" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ABSENCE 2</text>
    <text x="672" y="368" class="display" font-size="19" font-weight="600" fill="#B7332C">Aucun contact</text>
    <text x="672" y="390" class="body" font-size="12.5" fill="#5A5A5A">Rien qui dise où une alerte arrive, ni en quel délai.</text>
  </g>

  <g class="interactive" data-card="absence-cycle-vie" tabindex="0" role="button" aria-label="L'absence d'état de cycle de vie déclaré — cliquez pour les détails">
    <rect x="648" y="416" width="488" height="86" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2"/>
    <rect x="648" y="416" width="5" height="86" fill="#B7332C"/>
    <text x="672" y="444" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ABSENCE 3</text>
    <text x="672" y="470" class="display" font-size="19" font-weight="600" fill="#B7332C">Aucun état déclaré</text>
    <text x="672" y="492" class="body" font-size="12.5" fill="#5A5A5A">L'état vit côté registre, pas dans le contrat de l'objet.</text>
  </g>

  <g class="interactive" data-card="absence-support" tabindex="0" role="button" aria-label="L'absence d'engagement de support — cliquez pour les détails">
    <rect x="648" y="518" width="488" height="76" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2"/>
    <rect x="648" y="518" width="5" height="76" fill="#B7332C"/>
    <text x="672" y="546" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ABSENCE 4</text>
    <text x="672" y="572" class="display" font-size="19" font-weight="600" fill="#B7332C">Aucun engagement</text>
    <text x="672" y="590" class="body" font-size="12.5" fill="#5A5A5A">Pas de durée, pas de préavis, pas de niveau de service.</text>
  </g>

  <!-- bande : ce que le nom prouve -->
  <g class="interactive" data-card="namespace-preuve" tabindex="0" role="button" aria-label="Ce que l'espace de noms prouve, et ce qu'il ne prouve pas — cliquez pour les détails">
    <rect x="64" y="624" width="1072" height="128" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.5"/>
    <text x="88" y="652" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">LE SEUL SIGNAL DE PROPRIÉTÉ DISPONIBLE</text>
    <text x="88" y="682" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le préfixe du nom, prouvé une fois à la publication, par authentification de plateforme ou vérification de domaine.</text>
    <text x="88" y="712" class="body" font-size="13" fill="#5A5A5A">Cela établit <tspan font-weight="600">qui a publié</tspan> l'outil, à une date. Cela n'établit pas qui en répond aujourd'hui, ni qui a le droit de le retirer, ni à qui s'adresse</text>
    <text x="88" y="732" class="body" font-size="13" fill="#5A5A5A">la demande quand il casse. Les quatre absences ne sont pas un oubli de conception : le protocole les renvoie à l'organisation qui déploie.</text>
  </g>

  <line x1="64" y1="784" x2="1136" y2="784" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="804" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Source : schéma canonique server.json, définition ServerDetail (static.modelcontextprotocol.io, version 2025-12-11), relevé le 6 novembre 2026. Les onze propriétés et</text>
  <text x="64" y="822" class="body" font-size="10.5" font-style="italic" fill="#8A8478">les trois champs obligatoires sont ceux du schéma ; la lecture par les absences est de l'auteur.</text>
</svg>
