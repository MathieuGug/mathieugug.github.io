<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" role="img" aria-label="Le double coût d'un catalogue d'outils : des jetons de définitions chargés avant le premier appel, et une exactitude d'appel qui se dégrade quand la liste s'allonge">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="810" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Un catalogue coûte deux fois</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Des jetons avant le premier appel, et de l'exactitude sur l'appel lui-même. Aucun des deux coûts n'est porté par l'équipe qui publie l'outil.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- coût 1 : les jetons -->
  <g class="interactive" data-card="jetons-134k" tabindex="0" role="button" aria-label="Les 134 000 jetons de définitions mesurés — cliquez pour les détails">
    <rect x="64" y="190" width="536" height="140" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2"/>
    <rect x="64" y="190" width="5" height="140" fill="#B7332C"/>
    <text x="88" y="218" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">COÛT 1  ·  AVANT LE PREMIER APPEL</text>
    <text x="88" y="280" class="display" font-size="46" font-weight="600" fill="#B7332C">134 K</text>
    <text x="252" y="266" class="body" font-size="13" fill="#5A5A5A">jetons de définitions d'outils mesurés</text>
    <text x="252" y="285" class="body" font-size="13" fill="#5A5A5A">avant optimisation, sur des déploiements</text>
    <text x="252" y="304" class="body" font-size="13" fill="#5A5A5A">internes documentés.</text>
    <text x="88" y="320" class="body" font-size="11.5" font-style="italic" fill="#8A8478">portés à chaque tour</text>
  </g>

  <!-- coût 1 bis : le chargement en amont -->
  <g class="interactive" data-card="chargement-amont" tabindex="0" role="button" aria-label="Le chargement en amont de toutes les définitions — cliquez pour les détails">
    <rect x="64" y="346" width="536" height="176" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="88" y="374" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">MÊME FLUX DE TRAVAIL, DEUX RÉGIMES DE CHARGEMENT</text>

    <text x="88" y="404" class="body" font-size="12" fill="#5A5A5A">Toutes les définitions chargées en amont</text>
    <rect x="88" y="412" width="400" height="24" rx="2" fill="#B7332C" fill-opacity="0.75"/>
    <text x="498" y="429" class="mono" font-size="12.5" font-weight="600" fill="#B7332C">150 000</text>

    <text x="88" y="466" class="body" font-size="12" fill="#5A5A5A">Définitions découvertes à la demande</text>
    <rect x="88" y="474" width="6" height="24" rx="1.5" fill="#1F5560"/>
    <text x="104" y="491" class="mono" font-size="12.5" font-weight="600" fill="#1F5560">2 000</text>

    <text x="88" y="514" class="body" font-size="11.5" font-style="italic" fill="#8A8478">Échelle commune. La plupart des clients chargent en amont par défaut.</text>
  </g>

  <!-- coût 2 : l'exactitude -->
  <g class="interactive" data-card="exactitude" tabindex="0" role="button" aria-label="L'effet de la taille du catalogue sur l'exactitude d'appel — cliquez pour les détails">
    <rect x="632" y="190" width="504" height="332" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.5"/>
    <text x="656" y="218" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">COÛT 2  ·  SUR L'APPEL LUI-MÊME</text>
    <text x="656" y="246" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Exactitude sur évaluations d'appel d'outils</text>

    <!-- axe -->
    <line x1="676" y1="452" x2="1112" y2="452" stroke="#1F5560" stroke-opacity="0.4" stroke-width="1"/>
    <text x="656" y="456" class="mono" font-size="10" fill="#8A8478">0</text>
    <line x1="676" y1="272" x2="1112" y2="272" stroke="#1F5560" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="650" y="276" class="mono" font-size="10" fill="#8A8478">100</text>

    <!-- groupe 1 -->
    <rect x="712" y="364" width="56" height="88" fill="#B8B5AE"/>
    <text x="740" y="356" class="mono" font-size="12.5" font-weight="600" fill="#5A5A5A" text-anchor="middle">49 %</text>
    <rect x="784" y="319" width="56" height="133" fill="#1F5560"/>
    <text x="812" y="311" class="mono" font-size="12.5" font-weight="600" fill="#1F5560" text-anchor="middle">74 %</text>
    <text x="776" y="474" class="body" font-size="12" fill="#5A5A5A" text-anchor="middle">Modèle de génération n</text>

    <!-- groupe 2 -->
    <rect x="936" y="309" width="56" height="143" fill="#B8B5AE"/>
    <text x="964" y="301" class="mono" font-size="12.5" font-weight="600" fill="#5A5A5A" text-anchor="middle">79,5 %</text>
    <rect x="1008" y="293" width="56" height="159" fill="#1F5560"/>
    <text x="1036" y="285" class="mono" font-size="12.5" font-weight="600" fill="#1F5560" text-anchor="middle">88,1 %</text>
    <text x="1000" y="474" class="body" font-size="12" fill="#5A5A5A" text-anchor="middle">Modèle de génération n+1</text>

    <!-- légende -->
    <rect x="656" y="492" width="14" height="14" fill="#B8B5AE"/>
    <text x="678" y="504" class="body" font-size="12" fill="#5A5A5A">liste entière portée en contexte</text>
    <rect x="896" y="492" width="14" height="14" fill="#1F5560"/>
    <text x="918" y="504" class="body" font-size="12" fill="#5A5A5A">découverte à la demande</text>
  </g>

  <!-- l'asymétrie d'incitations -->
  <g class="interactive" data-card="dimensionnement" tabindex="0" role="button" aria-label="L'asymétrie entre celui qui publie et celui qui paie — cliquez pour les détails">
    <rect x="64" y="548" width="1072" height="130" rx="3" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="64" y="548" width="5" height="130" fill="#B58A2C"/>
    <text x="88" y="576" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">L'ASYMÉTRIE QUI REND TOUTE POLITIQUE DÉCLARATIVE</text>
    <text x="88" y="606" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Celui qui publie gagne la visibilité de son outil. Celui qui paie exploite le socle, sur une ligne où personne n'isole la part des définitions.</text>
    <text x="88" y="636" class="body" font-size="13" fill="#5A5A5A">Trois coûts s'ajoutent à chaque outil inscrit : du contexte consommé, une sélection dégradée, une surface d'autorisation de plus. Aucun des trois n'est</text>
    <text x="88" y="656" class="body" font-size="13" fill="#5A5A5A">facturé à l'éditeur. L'instrumentation possible existe déjà : un budget de jetons de définitions par domaine, mesuré et publié comme un budget d'appels.</text>
  </g>

  <rect x="64" y="698" width="1072" height="56" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="88" y="732" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La décision qui en découle : un catalogue se dimensionne. Ajouter un outil n'est pas une opération neutre.</text>

  <line x1="64" y1="778" x2="1136" y2="778" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="798" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : Anthropic, « Advanced tool use » (134 K jetons de définitions ; exactitude 49 → 74 % et 79,5 → 88,1 % avec découverte à la demande) et « Code execution with MCP » (150 000 → 2 000 jetons sur un flux documenté). Les deux séries proviennent d'évaluations internes de l'éditeur et non d'un référentiel public.</text>
</svg>
