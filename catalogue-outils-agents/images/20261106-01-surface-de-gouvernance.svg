<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Trois couches d'une pile agentique et la seule sur laquelle une politique d'entreprise s'applique : le modèle s'achète, l'agent se reconfigure, l'outil se déclare">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw-c01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
    <marker id="arw-c01r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois couches, une seule se gouverne</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Une politique ne s'applique qu'à un objet déclaré, énumérable et versionnable. Sur les trois couches d'une pile agentique, une seule l'est.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">CE QU'UNE DIRECTION PEUT ÉCRIRE</text>
  <text x="840" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">CE QUI ATTEINT LE MONDE</text>

  <!-- couche 1 : le modèle -->
  <g class="interactive" data-card="couche-modele" tabindex="0" role="button" aria-label="La couche du modèle — cliquez pour les détails">
    <rect x="64" y="212" width="680" height="122" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="88" y="244" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">COUCHE 1  ·  LE MODÈLE</text>
    <text x="88" y="276" class="display" font-size="21" font-weight="600" fill="#5A5A5A">Il ne s'arbitre pas, il s'achète.</text>
    <text x="88" y="304" class="body" font-size="13" fill="#8A8478">Une direction choisit un fournisseur, négocie une facture, encadre un usage.</text>
    <text x="88" y="323" class="body" font-size="13" fill="#8A8478">Les garde-fous portent sur ce qui entre et ce qui sort, via une interface qu'elle ne possède pas.</text>
  </g>
  <line x1="404" y1="334" x2="404" y2="352" stroke="#5A5A5A" stroke-width="1.5" marker-end="url(#arw-c01)"/>

  <!-- couche 2 : l'agent -->
  <g class="interactive" data-card="couche-agent" tabindex="0" role="button" aria-label="La couche de l'agent — cliquez pour les détails">
    <rect x="64" y="366" width="680" height="122" rx="3" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="64" y="366" width="5" height="122" fill="#B58A2C"/>
    <text x="88" y="398" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">COUCHE 2  ·  L'AGENT</text>
    <text x="88" y="430" class="display" font-size="21" font-weight="600" fill="#8A6A1E">Il n'a pas de forme stable.</text>
    <text x="88" y="458" class="body" font-size="13" fill="#5A5A5A">Une boucle : il observe, décide, appelle, observe à nouveau. Sa configuration</text>
    <text x="88" y="477" class="body" font-size="13" fill="#5A5A5A">effective change à chaque tour, selon ce que le tour précédent a produit.</text>
  </g>
  <line x1="404" y1="488" x2="404" y2="506" stroke="#5A5A5A" stroke-width="1.5" marker-end="url(#arw-c01)"/>

  <!-- couche 3 : l'outil -->
  <g class="interactive" data-card="couche-outil" tabindex="0" role="button" aria-label="La couche de l'outil — cliquez pour les détails">
    <rect x="64" y="520" width="680" height="140" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="64" y="520" width="5" height="140" fill="#B7332C"/>
    <text x="88" y="552" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">COUCHE 3  ·  L'OUTIL</text>
    <text x="88" y="584" class="display" font-size="21" font-weight="600" fill="#B7332C">Il est déclaré avant l'exécution.</text>
    <text x="88" y="612" class="body" font-size="13" fill="#5A5A5A">Un nom, une description, un schéma d'entrée, une adresse. Donc énumérable,</text>
    <text x="88" y="631" class="body" font-size="13" fill="#5A5A5A">versionnable, attribuable à un propriétaire. C'est la définition d'un inventaire,</text>
    <text x="88" y="650" class="body" font-size="13" fill="#5A5A5A">et un inventaire se tient.</text>
  </g>
  <line x1="744" y1="590" x2="824" y2="590" stroke="#B7332C" stroke-width="2" marker-end="url(#arw-c01r)"/>

  <!-- le passage obligé -->
  <g class="interactive" data-card="point-de-controle" tabindex="0" role="button" aria-label="Le point de passage obligé — cliquez pour les détails">
    <rect x="840" y="212" width="296" height="448" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.5"/>
    <text x="864" y="244" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">POINT DE PASSAGE OBLIGÉ</text>
    <text x="864" y="278" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Tout effet</text>
    <text x="864" y="302" class="display" font-size="20" font-weight="600" fill="#1A1A1A">passe par un appel.</text>
    <line x1="864" y1="322" x2="1112" y2="322" stroke="#1F5560" stroke-opacity="0.35" stroke-width="1"/>
    <text x="864" y="352" class="body" font-size="12.5" fill="#5A5A5A">Lire une base de production.</text>
    <text x="864" y="378" class="body" font-size="12.5" fill="#5A5A5A">Écrire dans la gestion de la</text>
    <text x="864" y="396" class="body" font-size="12.5" fill="#5A5A5A">relation client.</text>
    <text x="864" y="422" class="body" font-size="12.5" fill="#5A5A5A">Émettre un paiement.</text>
    <text x="864" y="448" class="body" font-size="12.5" fill="#5A5A5A">Envoyer un message à un client.</text>
    <text x="864" y="474" class="body" font-size="12.5" fill="#5A5A5A">Supprimer un enregistrement.</text>
    <line x1="864" y1="500" x2="1112" y2="500" stroke="#1F5560" stroke-opacity="0.35" stroke-width="1"/>
    <text x="864" y="528" class="body" font-size="12.5" font-weight="600" fill="#1F5560">Il n'existe pas d'autre chemin</text>
    <text x="864" y="546" class="body" font-size="12.5" font-weight="600" fill="#1F5560">entre l'intention de la machine</text>
    <text x="864" y="564" class="body" font-size="12.5" font-weight="600" fill="#1F5560">et l'effet sur le monde.</text>
    <text x="864" y="598" class="body" font-size="12.5" fill="#5A5A5A">D'où le critère de tri : un contrôle</text>
    <text x="864" y="616" class="body" font-size="12.5" fill="#5A5A5A">posé sur le catalogue d'outils est</text>
    <text x="864" y="634" class="body" font-size="12.5" fill="#5A5A5A">le seul qui porte sur un objet que</text>
    <text x="864" y="652" class="body" font-size="12.5" fill="#5A5A5A">l'organisation détient.</text>
  </g>

  <!-- bande de lecture -->
  <rect x="64" y="688" width="1072" height="72" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="88" y="716" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">LA CONSÉQUENCE POUR UN COMITÉ</text>
  <text x="88" y="744" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Un palier d'autonomie sans catalogue est une intention : il ne dit pas sur quelle liste il s'applique.</text>

  <line x1="64" y1="776" x2="1136" y2="776" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="794" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Lecture de l'auteur. La formulation « objet déclaré » reprend la structure du modèle de données canonique d'un serveur d'outils (nom, description, version), cf. schéma 02.</text>
</svg>
