<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-label="Relevé du 6 novembre 2026 sur le registre public de serveurs d'outils : 3,54 pour cent des versions publiées portent l'état déprécié, aucune n'est supprimée, et 63,2 pour cent des noms n'ont jamais publié qu'une version">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="830" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'état existe, l'usage non</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le registre public offre aux éditeurs un état de dépréciation documenté. Relevé du 6 novembre 2026 sur ce qu'ils en font.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- méthode -->
  <rect x="64" y="190" width="1072" height="98" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="88" y="218" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">MÉTHODE</text>
  <text x="88" y="246" class="body" font-size="13" fill="#5A5A5A">Interrogation de l'interface publique du registre officiel par pagination, curseurs semés sur trente-six points d'entrée de l'espace des noms (vingt-six lettres,</text>
  <text x="88" y="266" class="body" font-size="13" fill="#5A5A5A">dix chiffres), six pages de cent enregistrements par point d'entrée. <tspan font-weight="600">21 029 enregistrements de version, 4 743 noms de serveurs distincts.</tspan> Échantillon</text>
  <text x="88" y="279" class="body" font-size="11.5" font-style="italic" fill="#8A8478">stratifié sur l'espace des noms, et non recensement exhaustif : les proportions sont à lire comme des proportions.</text>

  <!-- la barre d'état -->
  <rect x="64" y="310" width="1072" height="152" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="88" y="338" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">ÉTAT PORTÉ PAR LES 21 029 VERSIONS RELEVÉES</text>
  <text x="1112" y="338" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C" text-anchor="end">3,54 %  DÉPRÉCIÉ</text>

  <g class="interactive" data-card="part-active" tabindex="0" role="button" aria-label="La part des versions encore actives — cliquez pour les détails">
    <rect x="88" y="364" width="988" height="52" fill="#B8B5AE" fill-opacity="0.55" stroke="#B8B5AE" stroke-width="1"/>
    <text x="110" y="396" class="mono" font-size="14" font-weight="600" fill="#5A5A5A">96,46 %   ·   active</text>
  </g>
  <g class="interactive" data-card="part-depreciee" tabindex="0" role="button" aria-label="La part des versions marquées dépréciées — cliquez pour les détails">
    <rect x="1076" y="364" width="36" height="52" fill="#B7332C"/>
    <line x1="1094" y1="416" x2="1094" y2="432" stroke="#B7332C" stroke-width="1.25"/>
    <text x="1112" y="446" class="mono" font-size="12.5" font-weight="600" fill="#B7332C" text-anchor="end">744 versions sur 21 029</text>
  </g>
  <text x="88" y="446" class="body" font-size="12.5" fill="#8A8478">Trois versions publiées sur cent portent l'état que le registre leur offre. L'abandon silencieux est la norme ; la dépréciation est l'exception.</text>

  <!-- trois tuiles -->
  <g class="interactive" data-card="aucun-supprime" tabindex="0" role="button" aria-label="Aucune version supprimée dans l'échantillon — cliquez pour les détails">
    <rect x="64" y="486" width="344" height="144" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2"/>
    <rect x="64" y="486" width="5" height="144" fill="#B7332C"/>
    <text x="88" y="514" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">SUPPRESSION</text>
    <text x="88" y="566" class="display" font-size="42" font-weight="600" fill="#B7332C">0</text>
    <text x="88" y="594" class="body" font-size="12.5" fill="#5A5A5A">enregistrement supprimé.</text>
    <text x="88" y="614" class="body" font-size="12.5" fill="#5A5A5A">Un catalogue public ne se vide</text>
    <text x="88" y="626" class="body" font-size="11.5" font-style="italic" fill="#8A8478">jamais : il s'allonge.</text>
  </g>

  <g class="interactive" data-card="version-unique" tabindex="0" role="button" aria-label="Les noms n'ayant jamais publié qu'une version — cliquez pour les détails">
    <rect x="428" y="486" width="344" height="144" rx="3" fill="#B58A2C" fill-opacity="0.11" stroke="#B58A2C" stroke-width="1.75"/>
    <rect x="428" y="486" width="5" height="144" fill="#B58A2C"/>
    <text x="452" y="514" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">PUBLICATION UNIQUE</text>
    <text x="452" y="566" class="display" font-size="42" font-weight="600" fill="#8A6A1E">63,2 %</text>
    <text x="452" y="594" class="body" font-size="12.5" fill="#5A5A5A">des noms n'ont jamais publié</text>
    <text x="452" y="612" class="body" font-size="12.5" fill="#5A5A5A">qu'une seule version.</text>
    <text x="452" y="626" class="body" font-size="11.5" font-style="italic" fill="#8A8478">2 996 noms sur 4 743.</text>
  </g>

  <g>
    <rect x="792" y="486" width="344" height="144" rx="3" fill="#1F5560" fill-opacity="0.08" stroke="#1F5560" stroke-width="1.5"/>
    <text x="816" y="514" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CADENCE MOYENNE</text>
    <text x="816" y="566" class="display" font-size="42" font-weight="600" fill="#1F5560">4,43</text>
    <text x="816" y="594" class="body" font-size="12.5" fill="#5A5A5A">versions publiées par nom.</text>
    <text x="816" y="612" class="body" font-size="12.5" fill="#5A5A5A">Moyenne portée par une</text>
    <text x="816" y="626" class="body" font-size="11.5" font-style="italic" fill="#8A8478">minorité de projets tenus.</text>
  </g>

  <!-- lecture -->
  <rect x="64" y="656" width="1072" height="112" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.5"/>
  <text x="88" y="684" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CE QUE CELA DIT À UN DÉPLOYEUR</text>
  <text x="88" y="714" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Une liste tirée d'un registre public sans filtrage actif ne rétrécit par aucun mécanisme naturel.</text>
  <text x="88" y="742" class="body" font-size="13" fill="#5A5A5A">La seule force de réduction disponible est une décision interne. La curation est une fonction permanente, et se finance comme telle. Rien de ceci ne condamne</text>
  <text x="88" y="760" class="body" font-size="13" fill="#5A5A5A">le registre public, qui remplit l'office qu'il s'est donné : la découvrabilité et les métadonnées de base.</text>

  <line x1="64" y1="790" x2="1136" y2="790" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="810" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Source : relevé de l'auteur sur l'interface publique du registre officiel (GET /v0/servers), 6 novembre 2026. Les états active / deprecated / deleted sont ceux définis par la référence</text>
  <text x="64" y="824" class="body" font-size="10.5" font-style="italic" fill="#8A8478">d'interface du registre. Script et paramètres de pagination reproductibles sur demande.</text>
</svg>
