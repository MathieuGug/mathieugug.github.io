<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le trajet d'une description d'outil, rédigée par le fournisseur, jusqu'au contexte du modèle, et le point où la notion de serveur de confiance n'est définie par personne">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw-c03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La description d'outil est une consigne</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un texte rédigé par le fournisseur de l'outil entre dans le contexte du modèle et décide de l'appel. La spécification impose de s'en défier.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">LE TRAJET DU TEXTE</text>

  <!-- étape 1 -->
  <g class="interactive" data-card="description" tabindex="0" role="button" aria-label="La description rédigée par le fournisseur — cliquez pour les détails">
    <rect x="64" y="212" width="242" height="190" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="86" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">ÉTAPE 1</text>
    <text x="86" y="268" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le fournisseur</text>
    <text x="86" y="290" class="display" font-size="19" font-weight="600" fill="#1A1A1A">rédige</text>
    <text x="86" y="320" class="body" font-size="12.5" fill="#5A5A5A">Nom, description,</text>
    <text x="86" y="338" class="body" font-size="12.5" fill="#5A5A5A">schéma d'entrée,</text>
    <text x="86" y="356" class="body" font-size="12.5" fill="#5A5A5A">annotations de</text>
    <text x="86" y="374" class="body" font-size="12.5" fill="#5A5A5A">comportement.</text>
  </g>
  <line x1="306" y1="307" x2="324" y2="307" stroke="#5A5A5A" stroke-width="1.5" marker-end="url(#arw-c03)"/>

  <!-- étape 2 -->
  <g class="interactive" data-card="annotations" tabindex="0" role="button" aria-label="Les annotations de comportement — cliquez pour les détails">
    <rect x="340" y="212" width="242" height="190" rx="3" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="340" y="212" width="5" height="190" fill="#B58A2C"/>
    <text x="362" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">ÉTAPE 2</text>
    <text x="362" y="268" class="display" font-size="19" font-weight="600" fill="#8A6A1E">Le client</text>
    <text x="362" y="290" class="display" font-size="19" font-weight="600" fill="#8A6A1E">énumère</text>
    <text x="362" y="320" class="body" font-size="12.5" fill="#5A5A5A">Il interroge le serveur,</text>
    <text x="362" y="338" class="body" font-size="12.5" fill="#5A5A5A">reçoit la liste et les</text>
    <text x="362" y="356" class="body" font-size="12.5" fill="#5A5A5A">annotations, sans</text>
    <text x="362" y="374" class="body" font-size="12.5" fill="#5A5A5A">moyen de les vérifier.</text>
  </g>
  <line x1="582" y1="307" x2="600" y2="307" stroke="#5A5A5A" stroke-width="1.5" marker-end="url(#arw-c03)"/>

  <!-- étape 3 -->
  <g class="interactive" data-card="contexte-modele" tabindex="0" role="button" aria-label="L'entrée dans le contexte du modèle — cliquez pour les détails">
    <rect x="616" y="212" width="242" height="190" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="616" y="212" width="5" height="190" fill="#B7332C"/>
    <text x="638" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ÉTAPE 3</text>
    <text x="638" y="268" class="display" font-size="19" font-weight="600" fill="#B7332C">Le texte entre</text>
    <text x="638" y="290" class="display" font-size="19" font-weight="600" fill="#B7332C">dans le contexte</text>
    <text x="638" y="320" class="body" font-size="12.5" fill="#5A5A5A">À ce point, la</text>
    <text x="638" y="338" class="body" font-size="12.5" fill="#5A5A5A">description cesse d'être</text>
    <text x="638" y="356" class="body" font-size="12.5" fill="#5A5A5A">une fiche produit et</text>
    <text x="638" y="374" class="body" font-size="12.5" fill="#5A5A5A">devient une instruction.</text>
  </g>
  <line x1="858" y1="307" x2="876" y2="307" stroke="#5A5A5A" stroke-width="1.5" marker-end="url(#arw-c03)"/>

  <!-- étape 4 -->
  <g>
    <rect x="892" y="212" width="242" height="190" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="914" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">ÉTAPE 4</text>
    <text x="914" y="268" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le modèle</text>
    <text x="914" y="290" class="display" font-size="19" font-weight="600" fill="#1A1A1A">choisit</text>
    <text x="914" y="320" class="body" font-size="12.5" fill="#5A5A5A">Il sélectionne un outil</text>
    <text x="914" y="338" class="body" font-size="12.5" fill="#5A5A5A">et des paramètres sur</text>
    <text x="914" y="356" class="body" font-size="12.5" fill="#5A5A5A">la base de ce texte,</text>
    <text x="914" y="374" class="body" font-size="12.5" fill="#5A5A5A">et de rien d'autre.</text>
  </g>

  <!-- le trou de confiance -->
  <g class="interactive" data-card="trou-de-confiance" tabindex="0" role="button" aria-label="Le trou de confiance laissé par la spécification — cliquez pour les détails">
    <rect x="64" y="438" width="1070" height="162" rx="3" fill="#B7332C" fill-opacity="0.09" stroke="#B7332C" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="88" y="466" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LA RÈGLE, ET LE TROU QU'ELLE LAISSE</text>
    <text x="88" y="500" class="display" font-size="21" font-weight="600" font-style="italic" fill="#1A1A1A">« Les clients DOIVENT considérer les annotations d'outils comme non fiables, sauf si elles proviennent</text>
    <text x="88" y="526" class="display" font-size="21" font-weight="600" font-style="italic" fill="#1A1A1A">de serveurs de confiance. »</text>
    <text x="88" y="556" class="body" font-size="13" fill="#5A5A5A">La spécification exige de distinguer les serveurs de confiance des autres. Elle ne définit nulle part ce qu'est un serveur de confiance, et ne peut pas le faire :</text>
    <text x="88" y="576" class="body" font-size="13" fill="#5A5A5A">la confiance est une décision d'organisation. Le protocole renvoie donc la frontière au déployeur, qui dans la plupart des cas n'a pas de liste sur laquelle la tracer.</text>
  </g>

  <!-- conséquences -->
  <rect x="64" y="624" width="340" height="112" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
  <text x="86" y="652" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CONSÉQUENCE 1</text>
  <text x="86" y="680" class="display" font-size="17" font-weight="600" fill="#1A1A1A">L'échelon de la politique</text>
  <text x="86" y="700" class="display" font-size="17" font-weight="600" fill="#1A1A1A">est l'autorisation.</text>
  <text x="86" y="724" class="body" font-size="12" fill="#5A5A5A">Un outil irréprochable reste dangereux</text>
  <text x="86" y="740" class="body" font-size="12" fill="#5A5A5A">s'il est habilité au-delà de son usage.</text>

  <rect x="430" y="624" width="340" height="112" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
  <text x="452" y="652" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CONSÉQUENCE 2</text>
  <text x="452" y="680" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Découverte et autorisation</text>
  <text x="452" y="700" class="display" font-size="17" font-weight="600" fill="#1A1A1A">sont deux décisions.</text>
  <text x="452" y="724" class="body" font-size="12" fill="#5A5A5A">Les fusionner dans un seul réglage</text>
  <text x="452" y="740" class="body" font-size="12" fill="#5A5A5A">de console supprime tout palier.</text>

  <rect x="796" y="624" width="338" height="112" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
  <text x="818" y="652" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CONSÉQUENCE 3</text>
  <text x="818" y="680" class="display" font-size="17" font-weight="600" fill="#1A1A1A">L'inventaire doit porter</text>
  <text x="818" y="700" class="display" font-size="17" font-weight="600" fill="#1A1A1A">l'habilitation.</text>
  <text x="818" y="724" class="body" font-size="12" fill="#5A5A5A">« Quel agent appelle quoi, au nom</text>
  <text x="818" y="740" class="body" font-size="12" fill="#5A5A5A">de qui », et non « quels outils ».</text>

  <line x1="64" y1="764" x2="1136" y2="764" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="784" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Source : spécification du protocole, révision 2026-07-28, section Tools (traduction de l'auteur de « clients MUST consider tool annotations to be untrusted unless they come from trusted servers »).</text>
</svg>
