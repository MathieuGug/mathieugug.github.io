<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Deux horloges : le cycle de vie formel adopté par le protocole en juillet 2026, avec trois états et une fenêtre minimale de douze mois, face à l'absence de tout cycle de vie dans le catalogue d'outils d'une entreprise">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arw-c06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Deux horloges</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La couche qui ne porte aucune valeur métier s'est dotée d'un cycle de vie écrit. La couche qui porte le droit d'écrire en production n'en a pas.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">HORLOGE 1  ·  LE PROTOCOLE, DEPUIS LE 28 JUILLET 2026</text>

  <!-- état actif -->
  <g class="interactive" data-card="etat-actif" tabindex="0" role="button" aria-label="L'état actif — cliquez pour les détails">
    <rect x="64" y="212" width="320" height="110" rx="3" fill="#1F5560" fill-opacity="0.08" stroke="#1F5560" stroke-width="1.5"/>
    <text x="88" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">ÉTAT 1</text>
    <text x="88" y="270" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Actif</text>
    <text x="88" y="296" class="body" font-size="12.5" fill="#5A5A5A">La fonctionnalité est au contrat.</text>
    <text x="88" y="314" class="body" font-size="12.5" fill="#5A5A5A">Les implémentations peuvent l'adopter.</text>
  </g>
  <line x1="384" y1="267" x2="404" y2="267" stroke="#5A5A5A" stroke-width="1.5" marker-end="url(#arw-c06)"/>

  <!-- état déprécié -->
  <g class="interactive" data-card="etat-deprecie" tabindex="0" role="button" aria-label="L'état déprécié — cliquez pour les détails">
    <rect x="420" y="212" width="320" height="110" rx="3" fill="#B58A2C" fill-opacity="0.12" stroke="#B58A2C" stroke-width="1.75"/>
    <rect x="420" y="212" width="5" height="110" fill="#B58A2C"/>
    <text x="444" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">ÉTAT 2</text>
    <text x="444" y="270" class="display" font-size="22" font-weight="600" fill="#8A6A1E">Déprécié</text>
    <text x="444" y="296" class="body" font-size="12.5" fill="#5A5A5A">Elle fonctionne encore, intégralement.</text>
    <text x="444" y="314" class="body" font-size="12.5" fill="#5A5A5A">Consigne : ne plus l'adopter.</text>
  </g>
  <line x1="740" y1="267" x2="760" y2="267" stroke="#5A5A5A" stroke-width="1.5" marker-end="url(#arw-c06)"/>

  <!-- état supprimé -->
  <g class="interactive" data-card="etat-supprime" tabindex="0" role="button" aria-label="L'état supprimé — cliquez pour les détails">
    <rect x="776" y="212" width="320" height="110" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2"/>
    <rect x="776" y="212" width="5" height="110" fill="#B7332C"/>
    <text x="800" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ÉTAT 3</text>
    <text x="800" y="270" class="display" font-size="22" font-weight="600" fill="#B7332C">Supprimé</text>
    <text x="800" y="296" class="body" font-size="12.5" fill="#5A5A5A">Exige une proposition distincte.</text>
    <text x="800" y="314" class="body" font-size="12.5" fill="#5A5A5A">Aucun retrait par péremption.</text>
  </g>

  <!-- la fenêtre -->
  <g class="interactive" data-card="fenetre-douze-mois" tabindex="0" role="button" aria-label="La fenêtre minimale de douze mois — cliquez pour les détails">
    <line x1="424" y1="344" x2="424" y2="372" stroke="#B7332C" stroke-width="1.5"/>
    <line x1="1092" y1="344" x2="1092" y2="372" stroke="#B7332C" stroke-width="1.5"/>
    <line x1="424" y1="358" x2="1092" y2="358" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="658" y="342" width="200" height="32" rx="3" fill="#FAF8F3"/>
    <text x="758" y="364" class="mono" font-size="13.5" font-weight="600" fill="#B7332C" text-anchor="middle">FENÊTRE  ≥  12 MOIS</text>
    <text x="424" y="396" class="body" font-size="12.5" fill="#5A5A5A">28 juillet 2026 : première application de la politique.</text>
    <text x="1092" y="396" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="end">Retrait possible au plus tôt le 28 juillet 2027.</text>
    <text x="424" y="414" class="body" font-size="11.5" font-style="italic" fill="#8A8478">La fenêtre se compte depuis la révision qui marque la dépréciation, et non depuis l'adoption de la proposition qui l'a décidée.</text>
  </g>

  <line x1="64" y1="444" x2="1136" y2="444" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="478" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">HORLOGE 2  ·  LE CATALOGUE D'OUTILS D'UNE ENTREPRISE</text>

  <g class="interactive" data-card="cote-entreprise" tabindex="0" role="button" aria-label="L'absence de cycle de vie côté entreprise — cliquez pour les détails">
    <rect x="64" y="498" width="320" height="92" rx="3" fill="none" stroke="#B8B5AE" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="224" y="540" class="display" font-size="24" font-weight="600" fill="#B8B5AE" text-anchor="middle">?</text>
    <text x="224" y="566" class="body" font-size="12.5" fill="#8A8478" text-anchor="middle">Aucun état nommé</text>
    <rect x="420" y="498" width="320" height="92" rx="3" fill="none" stroke="#B8B5AE" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="580" y="540" class="display" font-size="24" font-weight="600" fill="#B8B5AE" text-anchor="middle">?</text>
    <text x="580" y="566" class="body" font-size="12.5" fill="#8A8478" text-anchor="middle">Aucune fenêtre de préavis</text>
    <rect x="776" y="498" width="320" height="92" rx="3" fill="none" stroke="#B8B5AE" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="936" y="540" class="display" font-size="24" font-weight="600" fill="#B8B5AE" text-anchor="middle">?</text>
    <text x="936" y="566" class="body" font-size="12.5" fill="#8A8478" text-anchor="middle">Aucune procédure de retrait</text>
  </g>

  <!-- ce qui s'emprunte -->
  <text x="64" y="628" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">CE QUI S'EMPRUNTE TEL QUEL, EN CHANGEANT SEULEMENT L'ÉCHELLE</text>
  <rect x="64" y="644" width="259" height="90" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="84" y="670" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Trois états nommés</text>
  <text x="84" y="694" class="body" font-size="12" fill="#5A5A5A">Actif, déprécié, supprimé.</text>
  <text x="84" y="712" class="body" font-size="12" fill="#5A5A5A">Pas de quatrième, pas de</text>
  <text x="84" y="726" class="body" font-size="12" fill="#5A5A5A">« en cours de retrait ».</text>

  <rect x="335" y="644" width="259" height="90" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="355" y="670" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Une fenêtre chiffrée</text>
  <text x="355" y="694" class="body" font-size="12" fill="#5A5A5A">Un nombre de mois, donc</text>
  <text x="355" y="712" class="body" font-size="12" fill="#5A5A5A">une grandeur négociable</text>
  <text x="355" y="726" class="body" font-size="12" fill="#5A5A5A">entre éditeur et exploitant.</text>

  <rect x="606" y="644" width="259" height="90" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="626" y="670" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Un registre tenu</text>
  <text x="626" y="694" class="body" font-size="12" fill="#5A5A5A">Une liste des outils</text>
  <text x="626" y="712" class="body" font-size="12" fill="#5A5A5A">dépréciés, chacun avec sa</text>
  <text x="626" y="726" class="body" font-size="12" fill="#5A5A5A">date de retrait au plus tôt.</text>

  <rect x="877" y="644" width="259" height="90" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="897" y="670" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Un retrait décidé</text>
  <text x="897" y="694" class="body" font-size="12" fill="#5A5A5A">Le retrait exige un acte</text>
  <text x="897" y="712" class="body" font-size="12" fill="#5A5A5A">explicite. L'oubli ne vaut</text>
  <text x="897" y="726" class="body" font-size="12" fill="#5A5A5A">pas suppression.</text>

  <line x1="64" y1="766" x2="1136" y2="766" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="786" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : annonce de la révision 2026-07-28 du protocole (politique de dépréciation à fenêtre minimale de douze mois) et propositions SEP-2596, qui définit la politique, et SEP-2577,</text>
  <text x="64" y="802" class="body" font-size="10.5" font-style="italic" fill="#8A8478">qui en fait la première application. L'horloge 2 décrit l'état observé dans la majorité des organisations ; c'est un constat de l'auteur, non une mesure.</text>
</svg>
