<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La généalogie d'un taux : de la tribune de 2017 aux reprises de 2026, avec le changement de population à chaque reprise">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8A8478"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La généalogie d'un taux</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Huit ans, six populations, une base de calcul jamais publiée. L'autorité croît à chaque reprise.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">AUTORITÉ PERÇUE DE LA SOURCE →</text>

  <!-- Échelle verticale d'autorité -->
  <line x1="120" y1="212" x2="120" y2="604" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Nœud 2017 -->
  <g class="interactive" data-card="noeud-2017" tabindex="0" role="button" aria-label="2017, la tribune d'opinion — cliquez pour les détails">
    <rect x="144" y="520" width="228" height="84" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="144" y="520" width="5" height="84" fill="#B8B5AE"/>
    <text x="168" y="546" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">2017 · TRIBUNE D'OPINION</text>
    <text x="168" y="572" class="mono" font-size="20" font-weight="600" fill="#1A1A1A">13 %</text>
    <text x="236" y="572" class="body" font-size="12.5" fill="#5A5A5A">de succès</text>
    <text x="168" y="592" class="body" font-size="12" fill="#8A8478">Projets de données · aucune méthode</text>
  </g>

  <!-- Nœud 2019 -->
  <g class="interactive" data-card="noeud-2019" tabindex="0" role="button" aria-label="2019, l'article de presse spécialisée — cliquez pour les détails">
    <rect x="420" y="432" width="228" height="84" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="420" y="432" width="5" height="84" fill="#B58A2C"/>
    <text x="444" y="458" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B58A2C">JUIL. 2019 · PRESSE SPÉCIALISÉE</text>
    <text x="444" y="484" class="mono" font-size="20" font-weight="600" fill="#1A1A1A">87 %</text>
    <text x="512" y="484" class="body" font-size="12.5" fill="#5A5A5A">d'échec</text>
    <text x="444" y="504" class="body" font-size="12" fill="#8A8478">Science des données · complément à 100</text>
  </g>

  <!-- Nœud Gartner -->
  <g class="interactive" data-card="noeud-gartner" tabindex="0" role="button" aria-label="L'estimation de cabinet sur une autre population — cliquez pour les détails">
    <rect x="420" y="330" width="228" height="84" rx="3" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="3 3"/>
    <rect x="420" y="330" width="5" height="84" fill="#1F5560"/>
    <text x="444" y="356" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#1F5560">VERS 2017-2019 · CABINET</text>
    <text x="444" y="382" class="mono" font-size="20" font-weight="600" fill="#1A1A1A">85 %</text>
    <text x="512" y="382" class="body" font-size="12.5" fill="#5A5A5A">d'échec</text>
    <text x="444" y="402" class="body" font-size="12" fill="#B7332C">Grands volumes de données · autre population</text>
  </g>

  <!-- Nœud RAND -->
  <g class="interactive" data-card="noeud-rand" tabindex="0" role="button" aria-label="2024, l'institution de recherche — cliquez pour les détails">
    <rect x="696" y="244" width="228" height="84" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="696" y="244" width="5" height="84" fill="#B7332C"/>
    <text x="720" y="270" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B7332C">AOÛT 2024 · INSTITUT DE RECHERCHE</text>
    <text x="720" y="296" class="mono" font-size="20" font-weight="600" fill="#1A1A1A">&gt; 80 %</text>
    <text x="800" y="296" class="body" font-size="12.5" fill="#5A5A5A">« selon certaines estimations »</text>
    <text x="720" y="316" class="body" font-size="12" fill="#8A8478">Phrase d'ouverture, non résultat d'étude</text>
  </g>

  <!-- Nœud 2026 -->
  <g class="interactive" data-card="noeud-2026" tabindex="0" role="button" aria-label="2026, les reprises — cliquez pour les détails">
    <rect x="696" y="140" width="400" height="84" rx="3" fill="#1A1A1A"/>
    <text x="720" y="166" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#E8B84B">2026 · REPRISES COURANTES</text>
    <text x="720" y="192" class="body" font-size="14" font-weight="600" fill="#FAF8F3">« RAND a établi que 80 % des projets d'IA échouent »</text>
    <text x="720" y="214" class="body" font-size="12" font-style="italic" fill="#B8B5AE">La réserve est tombée. L'institution est restée.</text>
  </g>

  <!-- Flèches -->
  <line x1="372" y1="552" x2="414" y2="480" stroke="#8A8478" stroke-width="1.25" marker-end="url(#arrow04)"/>
  <line x1="648" y1="462" x2="690" y2="300" stroke="#8A8478" stroke-width="1.25" marker-end="url(#arrow04)"/>
  <line x1="648" y1="366" x2="690" y2="292" stroke="#8A8478" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#arrow04)"/>
  <line x1="810" y1="244" x2="810" y2="230" stroke="#8A8478" stroke-width="1.25" marker-end="url(#arrow04)"/>

  <!-- Étiquettes de transformation sur les arêtes -->
  <text x="382" y="508" class="body" font-size="11.5" font-style="italic" fill="#B7332C">succès → échec</text>
  <text x="658" y="398" class="body" font-size="11.5" font-style="italic" fill="#B7332C">fusion de deux populations</text>
  <text x="824" y="238" class="body" font-size="11.5" font-style="italic" fill="#B7332C">la réserve disparaît</text>

  <!-- Trois déplacements -->
  <line x1="64" y1="628" x2="1136" y2="628" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="658" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">TROIS DÉPLACEMENTS, INVISIBLES DANS LA CITATION FINALE</text>
  <circle cx="78" cy="690" r="9" fill="#B7332C"/>
  <text x="78" y="694" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
  <text x="100" y="694" class="body" font-size="13" fill="#1A1A1A">Du succès à l'échec par complément à 100, ce qui suppose qu'un projet en cours ou arrêté volontairement soit un échec.</text>
  <circle cx="78" cy="720" r="9" fill="#B7332C"/>
  <text x="78" y="724" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
  <text x="100" y="724" class="body" font-size="13" fill="#1A1A1A">Six populations en huit ans : données, science des données, grands volumes, IA, pilotes d'IA générative, projets agentiques.</text>
  <circle cx="78" cy="750" r="9" fill="#B7332C"/>
  <text x="78" y="754" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
  <text x="100" y="754" class="body" font-size="13" fill="#1A1A1A">Un gain d'autorité à chaque reprise, sans aucun ajout à la base de calcul. Le test tient en deux niveaux de citation remontés.</text>

  <text x="64" y="788" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">CHAÎNE RECONSTITUÉE À PARTIR DE RELECTURES CRITIQUES PUBLIÉES, NON À PARTIR DES DOCUMENTS D'ORIGINE. DATATION DU 85 % APPROXIMATIVE.</text>
</svg>
