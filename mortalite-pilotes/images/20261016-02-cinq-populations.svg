<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Six chiffres, six populations : unité comptée, seuil retenu, nature de l'affirmation, base et date pour chacun des taux les plus cités">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Six chiffres, six populations</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Rangés par ce qu'ils comptent. La colonne « nature » est celle qu'aucune reprise ne mentionne.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- En-têtes colonnes -->
  <text x="64" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">ÉMETTEUR · DATE</text>
  <text x="300" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CHIFFRE</text>
  <text x="408" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">UNITÉ COMPTÉE</text>
  <text x="638" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">SEUIL RETENU</text>
  <text x="896" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">NATURE</text>
  <text x="1136" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">BASE</text>
  <line x1="64" y1="198" x2="1136" y2="198" stroke="#B8B5AE" stroke-width="0.5"/>

  <!-- Ligne MIT -->
  <g class="interactive" data-card="ligne-mit" tabindex="0" role="button" aria-label="MIT NANDA 95 pour cent — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="5" height="76" fill="#B7332C"/>
    <text x="90" y="236" class="body" font-size="14" font-weight="600" fill="#1A1A1A">MIT NANDA</text>
    <text x="90" y="258" class="body" font-size="12" fill="#8A8478">Juillet 2025</text>
    <text x="300" y="248" class="mono" font-size="20" font-weight="600" fill="#B7332C">95 %</text>
    <text x="408" y="238" class="body" font-size="13" fill="#5A5A5A">Des organisations</text>
    <text x="408" y="260" class="body" font-size="12" font-style="italic" fill="#B7332C">Dénominateur non explicité</text>
    <text x="638" y="238" class="body" font-size="13" fill="#5A5A5A">Retour mesurable au</text>
    <text x="638" y="258" class="body" font-size="13" fill="#5A5A5A">compte de résultat</text>
    <text x="896" y="248" class="mono" font-size="12" letter-spacing="0.07em" fill="#5A5A5A">DÉCLARATIF</text>
    <text x="1136" y="238" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="end">52 entretiens, 153 réponses</text>
    <text x="1136" y="258" class="body" font-size="12" font-style="italic" fill="#B7332C" text-anchor="end">deux versions en circulation</text>
  </g>

  <!-- Ligne S&P -->
  <g class="interactive" data-card="ligne-sp" tabindex="0" role="button" aria-label="S and P Global 42 et 46 pour cent — cliquez pour les détails">
    <rect x="64" y="292" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="292" width="5" height="76" fill="#B58A2C"/>
    <text x="90" y="322" class="body" font-size="14" font-weight="600" fill="#1A1A1A">S&amp;P Global</text>
    <text x="90" y="344" class="body" font-size="12" fill="#8A8478">2025</text>
    <text x="300" y="334" class="mono" font-size="20" font-weight="600" fill="#B58A2C">42 / 46</text>
    <text x="408" y="328" class="body" font-size="13" fill="#5A5A5A">Deux unités dans une</text>
    <text x="408" y="348" class="body" font-size="13" fill="#5A5A5A">même enquête</text>
    <text x="638" y="328" class="body" font-size="13" fill="#5A5A5A">Abandon de la plupart</text>
    <text x="638" y="348" class="body" font-size="13" fill="#5A5A5A">des initiatives · abandon avant adoption</text>
    <text x="896" y="334" class="mono" font-size="12" letter-spacing="0.07em" fill="#5A5A5A">DÉCLARATIF</text>
    <text x="1136" y="334" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="end">Plus de 1 000 répondants</text>
  </g>

  <!-- Ligne Gartner -->
  <g class="interactive" data-card="ligne-gartner" tabindex="0" role="button" aria-label="Gartner plus de 40 pour cent — cliquez pour les détails">
    <rect x="64" y="378" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="378" width="5" height="76" fill="#1F5560"/>
    <text x="90" y="408" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Gartner</text>
    <text x="90" y="430" class="body" font-size="12" fill="#8A8478">25 juin 2025</text>
    <text x="300" y="420" class="mono" font-size="20" font-weight="600" fill="#1F5560">&gt; 40 %</text>
    <text x="408" y="414" class="body" font-size="13" fill="#5A5A5A">Des projets agentiques</text>
    <text x="408" y="434" class="body" font-size="12" font-style="italic" fill="#5A5A5A">population future, non observée</text>
    <text x="638" y="420" class="body" font-size="13" fill="#5A5A5A">L'annulation, d'ici fin 2027</text>
    <text x="896" y="420" class="mono" font-size="12" letter-spacing="0.07em" fill="#B7332C">PRÉVISION</text>
    <text x="1136" y="420" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="end">Jugement d'analyste</text>
  </g>

  <!-- Ligne McKinsey -->
  <g class="interactive" data-card="ligne-mckinsey" tabindex="0" role="button" aria-label="McKinsey 88 contre 39 pour cent — cliquez pour les détails">
    <rect x="64" y="464" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="464" width="5" height="76" fill="#2F5D3F"/>
    <text x="90" y="494" class="body" font-size="14" font-weight="600" fill="#1A1A1A">McKinsey</text>
    <text x="90" y="516" class="body" font-size="12" fill="#8A8478">2025</text>
    <text x="300" y="506" class="mono" font-size="20" font-weight="600" fill="#2F5D3F">88 / 39</text>
    <text x="408" y="500" class="body" font-size="13" fill="#5A5A5A">Des organisations,</text>
    <text x="408" y="520" class="body" font-size="13" fill="#5A5A5A">population identique</text>
    <text x="638" y="500" class="body" font-size="13" fill="#5A5A5A">Usage régulier · effet au</text>
    <text x="638" y="520" class="body" font-size="13" fill="#5A5A5A">résultat d'exploitation</text>
    <text x="896" y="506" class="mono" font-size="12" letter-spacing="0.07em" fill="#5A5A5A">DÉCLARATIF</text>
    <text x="1136" y="506" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="end">Près de 2 000 répondants</text>
  </g>

  <!-- Ligne BCG -->
  <g class="interactive" data-card="ligne-bcg" tabindex="0" role="button" aria-label="BCG 5 pour cent puis près de la moitié — cliquez pour les détails">
    <rect x="64" y="550" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="550" width="5" height="76" fill="#1E3A5F"/>
    <text x="90" y="580" class="body" font-size="14" font-weight="600" fill="#1A1A1A">BCG</text>
    <text x="90" y="602" class="body" font-size="12" fill="#8A8478">Sept. 2025 → sept. 2026</text>
    <text x="300" y="592" class="mono" font-size="20" font-weight="600" fill="#1E3A5F">5 % → ≈50 %</text>
    <text x="408" y="586" class="body" font-size="13" fill="#5A5A5A">Des entreprises,</text>
    <text x="408" y="606" class="body" font-size="13" fill="#5A5A5A">deux bases distinctes</text>
    <text x="638" y="586" class="body" font-size="13" fill="#5A5A5A">Valeur à l'échelle, puis</text>
    <text x="638" y="606" class="body" font-size="13" fill="#5A5A5A">création de valeur</text>
    <text x="896" y="592" class="mono" font-size="12" letter-spacing="0.07em" fill="#5A5A5A">DÉCLARATIF</text>
    <text x="1136" y="586" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="end">1 250 puis 1 330</text>
    <text x="1136" y="606" class="body" font-size="12" font-style="italic" fill="#1E3A5F" text-anchor="end">seuils non superposables</text>
  </g>

  <!-- Ligne RAND -->
  <g class="interactive" data-card="ligne-rand" tabindex="0" role="button" aria-label="RAND plus de 80 pour cent — cliquez pour les détails">
    <rect x="64" y="636" width="1072" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="636" width="5" height="76" fill="#B7332C"/>
    <text x="90" y="666" class="body" font-size="14" font-weight="600" fill="#1A1A1A">RAND</text>
    <text x="90" y="688" class="body" font-size="12" fill="#8A8478">13 août 2024</text>
    <text x="300" y="678" class="mono" font-size="20" font-weight="600" fill="#B7332C">&gt; 80 %</text>
    <text x="408" y="672" class="body" font-size="13" fill="#5A5A5A">Des projets d'IA,</text>
    <text x="408" y="692" class="body" font-size="13" fill="#5A5A5A">population non définie</text>
    <text x="638" y="678" class="body" font-size="13" fill="#5A5A5A">« Échouer », sans critère</text>
    <text x="896" y="678" class="mono" font-size="12" letter-spacing="0.07em" fill="#B7332C">ESTIMATION REPRISE</text>
    <text x="1136" y="672" class="body" font-size="12.5" fill="#5A5A5A" text-anchor="end">65 entretiens qualitatifs</text>
    <text x="1136" y="692" class="body" font-size="12" font-style="italic" fill="#B7332C" text-anchor="end">qui ne portent pas sur le taux</text>
  </g>

  <g class="interactive" data-card="colonne-nature" tabindex="0" role="button" aria-label="La colonne nature — cliquez pour les détails">
    <rect x="884" y="206" width="110" height="506" rx="3" fill="#B7332C" fill-opacity="0.045" stroke="#B7332C" stroke-width="1" stroke-dasharray="2 3"/>
  </g>

  <text x="64" y="748" class="body" font-size="13" fill="#1A1A1A">Trois natures différentes dans une même colonne de diapositive : une mesure déclarative, une prévision d'analyste, une estimation reprise d'un tiers.</text>
  <text x="64" y="784" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">CHIFFRES RAPPORTÉS TELS QUE PUBLIÉS PAR LEURS ÉMETTEURS, NON AUDITÉS. RANGEMENT PAR UNITÉ COMPTÉE : PROPRE À CE DOSSIER.</text>
</svg>
