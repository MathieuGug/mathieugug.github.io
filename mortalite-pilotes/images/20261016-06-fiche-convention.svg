<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La fiche de convention : trois conventions à écrire, quatre décisions qui en découlent, un propriétaire par ligne">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La fiche de convention</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois conventions écrites avant les résultats, quatre décisions qui en découlent, un propriétaire par ligne.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LES TROIS CONVENTIONS</text>

  <g class="interactive" data-card="convention-unite" tabindex="0" role="button" aria-label="Convention 1, l'unité comptée — cliquez pour les détails">
    <rect x="64" y="206" width="344" height="198" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="344" height="5" fill="#B7332C"/>
    <text x="88" y="240" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B7332C">CONVENTION 1</text>
    <text x="88" y="270" class="display" font-size="21" font-weight="600" fill="#1A1A1A">L'unité comptée</text>
    <text x="88" y="300" class="body" font-size="13" fill="#5A5A5A">La ligne du registre, et non le</text>
    <text x="88" y="318" class="body" font-size="13" fill="#5A5A5A">« pilote », qui n'a pas de contour.</text>
    <text x="88" y="346" class="body" font-size="12.5" fill="#1A1A1A">· Fait déclencheur bas</text>
    <text x="88" y="366" class="body" font-size="12.5" fill="#1A1A1A">· Propriétaire métier nommé</text>
    <text x="88" y="386" class="body" font-size="12.5" fill="#1A1A1A">· Règle de fusion et de scission</text>
  </g>

  <g class="interactive" data-card="convention-seuil" tabindex="0" role="button" aria-label="Convention 2, le seuil de passage — cliquez pour les détails">
    <rect x="428" y="206" width="344" height="198" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="428" y="206" width="344" height="5" fill="#1F5560"/>
    <text x="452" y="240" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#1F5560">CONVENTION 2</text>
    <text x="452" y="270" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le seuil de passage</text>
    <text x="452" y="300" class="body" font-size="13" fill="#5A5A5A">Vérifiable par un tiers, écrit avant</text>
    <text x="452" y="318" class="body" font-size="13" fill="#5A5A5A">la mise en service.</text>
    <text x="452" y="346" class="body" font-size="12.5" fill="#1A1A1A">· Usage mesuré sur les traces</text>
    <text x="452" y="366" class="body" font-size="12.5" fill="#1A1A1A">· Propriétaire d'exploitation nommé</text>
    <text x="452" y="386" class="body" font-size="12.5" fill="#1A1A1A">· Effet chiffré et daté à l'ouverture</text>
  </g>

  <g class="interactive" data-card="convention-date" tabindex="0" role="button" aria-label="Convention 3, la date de recensement — cliquez pour les détails">
    <rect x="792" y="206" width="344" height="198" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="792" y="206" width="344" height="5" fill="#2F5D3F"/>
    <text x="816" y="240" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#2F5D3F">CONVENTION 3</text>
    <text x="816" y="270" class="display" font-size="21" font-weight="600" fill="#1A1A1A">La date de recensement</text>
    <text x="816" y="300" class="body" font-size="13" fill="#5A5A5A">Une survie de cohorte, et non un</text>
    <text x="816" y="318" class="body" font-size="13" fill="#5A5A5A">ratio de stock à une date.</text>
    <text x="816" y="346" class="body" font-size="12.5" fill="#1A1A1A">· Cohorte par trimestre d'ouverture</text>
    <text x="816" y="366" class="body" font-size="12.5" fill="#1A1A1A">· Relevés à 6, 12 et 18 mois</text>
    <text x="816" y="386" class="body" font-size="12.5" fill="#1A1A1A">· Censure publiée séparément</text>
  </g>

  <line x1="236" y1="404" x2="236" y2="436" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow06)"/>
  <line x1="600" y1="404" x2="600" y2="436" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow06)"/>
  <line x1="964" y1="404" x2="964" y2="436" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow06)"/>

  <text x="64" y="466" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LES QUATRE DÉCISIONS</text>
  <text x="712" y="466" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">COÛT RÉEL</text>
  <text x="1136" y="466" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">PROPRIÉTAIRE</text>
  <line x1="64" y1="476" x2="1136" y2="476" stroke="#B8B5AE" stroke-width="0.5"/>

  <g class="interactive" data-card="decision-d1" tabindex="0" role="button" aria-label="Décision D1 — cliquez pour les détails">
    <rect x="64" y="484" width="1072" height="62" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="484" width="5" height="62" fill="#B7332C"/>
    <text x="90" y="510" class="mono" font-size="12" font-weight="600" fill="#B7332C">D1</text>
    <text x="126" y="510" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Le registre porte la date d'ouverture et le seuil de passage</text>
    <text x="126" y="532" class="body" font-size="12.5" fill="#8A8478">Deux colonnes, une règle d'inscription basse</text>
    <text x="712" y="521" class="body" font-size="12.5" fill="#5A5A5A">Mandat de refuser une ligne sans propriétaire</text>
    <text x="1136" y="521" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A" text-anchor="end">Titulaire du registre</text>
  </g>

  <g class="interactive" data-card="decision-d2" tabindex="0" role="button" aria-label="Décision D2 — cliquez pour les détails">
    <rect x="64" y="556" width="1072" height="62" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="556" width="5" height="62" fill="#2F5D3F"/>
    <text x="90" y="582" class="mono" font-size="12" font-weight="600" fill="#2F5D3F">D2</text>
    <text x="126" y="582" class="body" font-size="14" font-weight="500" fill="#1A1A1A">La mesure est une survie de cohorte trimestrielle, publiée avec sa censure</text>
    <text x="126" y="604" class="body" font-size="12.5" fill="#8A8478">Un tableau par cohorte, trois relevés</text>
    <text x="712" y="593" class="body" font-size="12.5" fill="#5A5A5A">Ne rien dire des six premiers mois</text>
    <text x="1136" y="593" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A" text-anchor="end">Contrôle de gestion</text>
  </g>

  <g class="interactive" data-card="decision-d3" tabindex="0" role="button" aria-label="Décision D3 — cliquez pour les détails">
    <rect x="64" y="628" width="1072" height="62" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="628" width="5" height="62" fill="#B58A2C"/>
    <text x="90" y="654" class="mono" font-size="12" font-weight="600" fill="#B58A2C">D3</text>
    <text x="126" y="654" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Le taux d'arrêt porte une cible assumée, distincte du taux d'échec</text>
    <text x="126" y="676" class="body" font-size="12.5" fill="#8A8478">Arrêt décidé contre abandon par abandon</text>
    <text x="712" y="665" class="body" font-size="12.5" fill="#5A5A5A">Écrire qui signe un arrêt, et à quel niveau</text>
    <text x="1136" y="665" class="body" font-size="12.5" font-weight="500" fill="#1A1A1A" text-anchor="end">Instance d'arbitrage</text>
  </g>

  <g class="interactive" data-card="decision-d4" tabindex="0" role="button" aria-label="Décision D4 — cliquez pour les détails">
    <rect x="64" y="700" width="1072" height="62" rx="3" fill="#1A1A1A"/>
    <text x="90" y="726" class="mono" font-size="12" font-weight="600" fill="#E8B84B">D4</text>
    <text x="126" y="726" class="body" font-size="14" font-weight="500" fill="#FAF8F3">Aucun taux externe en comité sans sa convention jointe</text>
    <text x="126" y="748" class="body" font-size="12.5" fill="#B8B5AE">Trois lignes sous le nombre : unité, seuil, base et date</text>
    <text x="712" y="737" class="body" font-size="12.5" fill="#B8B5AE">Nul, sauf en confort rhétorique</text>
    <text x="1136" y="737" class="body" font-size="12.5" font-weight="500" fill="#FAF8F3" text-anchor="end">Direction data</text>
  </g>

  <text x="64" y="788" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">CONVENTIONS ET DÉCISIONS : PROPOSITION DE L'AUTEUR, NON RELEVÉ DE PRATIQUES OBSERVÉES.</text>
</svg>
