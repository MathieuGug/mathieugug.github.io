<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Stock contre cohorte : les mêmes quarante cas d'usage comptés en ratio de stock puis en survie de cohorte">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Stock contre cohorte</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quarante cas d'usage, deux façons de les compter. La première confond la lenteur avec l'échec.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- VUE STOCK -->
  <g class="interactive" data-card="vue-stock" tabindex="0" role="button" aria-label="La vue de stock — cliquez pour les détails">
    <rect x="64" y="182" width="512" height="300" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="182" width="512" height="5" fill="#B7332C"/>
    <text x="90" y="216" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B7332C">VUE A · RATIO DE STOCK AU 30 SEPTEMBRE</text>
    <text x="90" y="246" class="display" font-size="21" font-weight="600" fill="#1A1A1A">« 12 en production sur 40 »</text>

    <!-- barre empilée -->
    <rect x="90" y="276" width="138" height="42" fill="#2F5D3F"/>
    <rect x="228" y="276" width="126" height="42" fill="#B58A2C"/>
    <rect x="354" y="276" width="196" height="42" fill="#B7332C"/>
    <text x="100" y="303" class="mono" font-size="14" font-weight="600" fill="#FAF8F3">12 passés</text>
    <text x="238" y="303" class="mono" font-size="14" font-weight="600" fill="#FAF8F3">11 en cours</text>
    <text x="364" y="303" class="mono" font-size="14" font-weight="600" fill="#FAF8F3">17 arrêtés</text>

    <text x="90" y="352" class="body" font-size="13.5" fill="#5A5A5A">Le taux publié verse les 11 cas en cours dans l'échec.</text>
    <text x="90" y="374" class="mono" font-size="19" font-weight="600" fill="#B7332C">70 % d'échec</text>
    <text x="248" y="374" class="body" font-size="12.5" font-style="italic" fill="#8A8478">(28 sur 40)</text>

    <line x1="90" y1="398" x2="550" y2="398" stroke="#E5E1D8" stroke-width="1"/>
    <text x="90" y="424" class="body" font-size="13" fill="#1A1A1A">Mélange des cas ouverts il y a trois ans et le mois dernier.</text>
    <text x="90" y="446" class="body" font-size="13" fill="#1A1A1A">Bouge dès qu'on ouvre une ligne, sans changement d'état.</text>
    <text x="90" y="468" class="body" font-size="13" fill="#B7332C">Non comparable d'un trimestre à l'autre.</text>
  </g>

  <!-- VUE COHORTE -->
  <g class="interactive" data-card="vue-cohorte" tabindex="0" role="button" aria-label="La vue de cohorte — cliquez pour les détails">
    <rect x="624" y="182" width="512" height="300" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="624" y="182" width="512" height="5" fill="#2F5D3F"/>
    <text x="650" y="216" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#2F5D3F">VUE B · SURVIE DE LA COHORTE OUVERTE AU T1</text>
    <text x="650" y="246" class="display" font-size="21" font-weight="600" fill="#1A1A1A">La même cohorte à trois relevés</text>

    <!-- axes -->
    <line x1="684" y1="440" x2="1096" y2="440" stroke="#1A1A1A" stroke-width="1.25"/>
    <line x1="684" y1="276" x2="684" y2="440" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="676" y="282" class="mono" font-size="10.5" fill="#5A5A5A" text-anchor="end">100%</text>
    <text x="676" y="444" class="mono" font-size="10.5" fill="#5A5A5A" text-anchor="end">0</text>
    <text x="760" y="460" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">6 mois</text>
    <text x="890" y="460" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">12 mois</text>
    <text x="1020" y="460" class="mono" font-size="11" fill="#5A5A5A" text-anchor="middle">18 mois</text>

    <!-- grille -->
    <line x1="684" y1="358" x2="1096" y2="358" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="684" y1="317" x2="1096" y2="317" stroke="#E5E1D8" stroke-width="0.5"/>

    <!-- courbe passés : 20% / 38% / 55% -->
    <path d="M 684 440 C 710 428 740 420 760 407 S 850 374 890 371 S 990 332 1020 334" fill="none" stroke="#2F5D3F" stroke-width="2.5"/>
    <circle cx="760" cy="407" r="4.5" fill="#2F5D3F"/>
    <circle cx="890" cy="371" r="4.5" fill="#2F5D3F"/>
    <circle cx="1020" cy="334" r="4.5" fill="#2F5D3F"/>
    <text x="766" y="400" class="mono" font-size="12" font-weight="600" fill="#2F5D3F">20 %</text>
    <text x="896" y="364" class="mono" font-size="12" font-weight="600" fill="#2F5D3F">38 %</text>
    <text x="1026" y="327" class="mono" font-size="12" font-weight="600" fill="#2F5D3F">55 %</text>

    <!-- courbe arrêtés : 10% / 18% / 27% -->
    <path d="M 684 440 C 712 436 742 432 760 424 S 850 412 890 408 S 990 392 1020 390" fill="none" stroke="#B7332C" stroke-width="2.5" stroke-dasharray="5 3"/>
    <circle cx="1020" cy="390" r="4.5" fill="#B7332C"/>
    <text x="1026" y="394" class="mono" font-size="12" font-weight="600" fill="#B7332C">27 %</text>

    <text x="684" y="300" class="body" font-size="12.5" font-weight="500" fill="#2F5D3F">Part passée (cumul)</text>
    <text x="864" y="300" class="body" font-size="12.5" font-weight="500" fill="#B7332C">Part arrêtée (cumul)</text>
  </g>

  <!-- Effet de censure -->
  <g class="interactive" data-card="effet-censure" tabindex="0" role="button" aria-label="L'effet de censure — cliquez pour les détails">
    <rect x="64" y="506" width="1072" height="110" rx="3" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="90" y="536" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#1F5560">L'ERREUR DE COMPTAGE LA PLUS RÉPANDUE · LA CENSURE</text>
    <text x="90" y="566" class="body" font-size="14" fill="#1A1A1A">Un cas d'usage ouvert il y a quatre mois n'a pas échoué : il n'est pas encore observable. Le verser dans l'échec</text>
    <text x="90" y="588" class="body" font-size="14" fill="#1A1A1A">gonfle le taux d'autant que le portefeuille s'est étoffé récemment, donc d'autant plus que l'organisation investit.</text>
    <text x="90" y="608" class="body" font-size="12.5" font-style="italic" fill="#1F5560">Même mécanique qu'une table de survie en démographie ou qu'une cohorte d'essai clinique : les cas en cours sortent du numérateur.</text>
  </g>

  <!-- Trois propriétés -->
  <text x="64" y="652" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUE LA COHORTE PERMET, QUE LE STOCK INTERDIT</text>
  <circle cx="78" cy="682" r="9" fill="#2F5D3F"/>
  <text x="78" y="686" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">a</text>
  <text x="100" y="686" class="body" font-size="13" fill="#1A1A1A">Séparer la lenteur de l'échec : 20 % à six mois et 55 % à dix-huit mois décrivent une organisation lente, non défaillante.</text>
  <circle cx="78" cy="712" r="9" fill="#2F5D3F"/>
  <text x="78" y="716" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">b</text>
  <text x="100" y="716" class="body" font-size="13" fill="#1A1A1A">Rendre la censure explicite, au lieu de la verser par défaut dans le numérateur d'échec.</text>
  <circle cx="78" cy="742" r="9" fill="#2F5D3F"/>
  <text x="78" y="746" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">c</text>
  <text x="100" y="746" class="body" font-size="13" fill="#1A1A1A">Imputer l'effet d'une décision d'organisation à la cohorte qui l'a suivie, ce qu'aucun taux global ne montre.</text>

  <text x="64" y="784" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">VALEURS ILLUSTRATIVES SUR UN PORTEFEUILLE FICTIF. TRANSPOSITION DE LA TABLE DE SURVIE AU PORTEFEUILLE DE CAS D'USAGE : PROPRE À CE DOSSIER.</text>
</svg>
