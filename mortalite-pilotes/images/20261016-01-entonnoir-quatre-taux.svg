<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Un entonnoir de cas d'usage, quatre taux : le même portefeuille donne quatre nombres selon le dénominateur et le seuil retenus">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Un entonnoir, quatre taux</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un portefeuille fictif de 100 intentions d'usage, calculé de quatre façons. Aucun des quatre nombres n'est faux.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LE PORTEFEUILLE OBSERVÉ</text>
  <text x="664" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LE TAUX QU'ON EN TIRE</text>

  <!-- Entonnoir : 5 étages -->
  <g>
    <rect x="64" y="206" width="520" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="88" y="232" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Intentions d'usage exprimées</text>
    <text x="88" y="252" class="body" font-size="12" fill="#8A8478">Dont 38 ne laissent aucune trace écrite</text>
    <text x="560" y="241" class="mono" font-size="17" font-weight="600" fill="#1A1A1A" text-anchor="end">100</text>
  </g>
  <g>
    <rect x="104" y="274" width="480" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="128" y="300" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Essais effectivement lancés</text>
    <text x="128" y="320" class="body" font-size="12" fill="#8A8478">Preuves de concept, maquettes, essais d'équipe</text>
    <text x="560" y="309" class="mono" font-size="17" font-weight="600" fill="#1A1A1A" text-anchor="end">62</text>
  </g>
  <g>
    <rect x="164" y="342" width="420" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="188" y="368" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Essais dont quelqu'un se souvient</text>
    <text x="188" y="388" class="body" font-size="12" fill="#8A8478">La population réellement interrogeable par questionnaire</text>
    <text x="560" y="377" class="mono" font-size="17" font-weight="600" fill="#B7332C" text-anchor="end">31</text>
  </g>
  <g>
    <rect x="224" y="410" width="360" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="248" y="436" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Mis en service</text>
    <text x="248" y="456" class="body" font-size="12" fill="#8A8478">Un propriétaire d'exploitation, un usage mesuré</text>
    <text x="560" y="445" class="mono" font-size="17" font-weight="600" fill="#1F5560" text-anchor="end">14</text>
  </g>
  <g>
    <rect x="284" y="478" width="300" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="308" y="504" class="body" font-size="14" font-weight="500" fill="#1A1A1A">Effet chiffré au critère d'ouverture</text>
    <text x="308" y="524" class="body" font-size="12" fill="#8A8478">Le seuil le plus exigeant</text>
    <text x="560" y="513" class="mono" font-size="17" font-weight="600" fill="#1F5560" text-anchor="end">5</text>
  </g>

  <line x1="596" y1="234" x2="648" y2="234" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow01)"/>
  <line x1="596" y1="371" x2="648" y2="371" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow01)"/>
  <line x1="596" y1="440" x2="648" y2="440" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow01)"/>
  <line x1="596" y1="508" x2="648" y2="508" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow01)"/>

  <!-- Les quatre taux -->
  <g class="interactive" data-card="denominateur-organisations" tabindex="0" role="button" aria-label="Taux calculé sur les intentions exprimées — cliquez pour les détails">
    <rect x="664" y="206" width="472" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="664" y="206" width="5" height="56" fill="#B7332C"/>
    <text x="690" y="230" class="body" font-size="13.5" fill="#5A5A5A">5 effets chiffrés sur 100 intentions exprimées</text>
    <text x="690" y="252" class="mono" font-size="12" letter-spacing="0.06em" fill="#B7332C">DÉNOMINATEUR COMPLET · SEUIL EXIGEANT</text>
    <text x="1112" y="241" class="mono" font-size="19" font-weight="600" fill="#B7332C" text-anchor="end">95 %</text>
  </g>

  <g class="interactive" data-card="denominateur-initiatives" tabindex="0" role="button" aria-label="Taux calculé sur les essais mémorisés — cliquez pour les détails">
    <rect x="664" y="343" width="472" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="664" y="343" width="5" height="56" fill="#B58A2C"/>
    <text x="690" y="367" class="body" font-size="13.5" fill="#5A5A5A">14 mises en service sur 31 essais mémorisés</text>
    <text x="690" y="389" class="mono" font-size="12" letter-spacing="0.06em" fill="#B58A2C">DÉNOMINATEUR DÉCLARATIF · SEUIL DE MISE EN SERVICE</text>
    <text x="1112" y="378" class="mono" font-size="19" font-weight="600" fill="#B58A2C" text-anchor="end">55 %</text>
  </g>

  <g class="interactive" data-card="seuil-passage" tabindex="0" role="button" aria-label="Taux calculé sur les essais lancés — cliquez pour les détails">
    <rect x="664" y="411" width="472" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="664" y="411" width="5" height="56" fill="#1F5560"/>
    <text x="690" y="435" class="body" font-size="13.5" fill="#5A5A5A">14 mises en service sur 62 essais lancés</text>
    <text x="690" y="457" class="mono" font-size="12" letter-spacing="0.06em" fill="#1F5560">DÉNOMINATEUR RÉEL · SEUIL DE MISE EN SERVICE</text>
    <text x="1112" y="446" class="mono" font-size="19" font-weight="600" fill="#1F5560" text-anchor="end">77 %</text>
  </g>

  <g class="interactive" data-card="denominateur-cohorte" tabindex="0" role="button" aria-label="Taux calculé par cohorte à dix-huit mois — cliquez pour les détails">
    <rect x="664" y="479" width="472" height="56" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="664" y="479" width="5" height="56" fill="#2F5D3F"/>
    <text x="690" y="503" class="body" font-size="13.5" fill="#5A5A5A">Cohorte d'ouverture suivie à 18 mois, censure explicite</text>
    <text x="690" y="525" class="mono" font-size="12" letter-spacing="0.06em" fill="#2F5D3F">11 EN COURS SORTIS DU NUMÉRATEUR D'ÉCHEC</text>
    <text x="1112" y="514" class="mono" font-size="19" font-weight="600" fill="#2F5D3F" text-anchor="end">59 %</text>
  </g>

  <!-- Annotations -->
  <line x1="64" y1="566" x2="1136" y2="566" stroke="#E5E1D8" stroke-width="1"/>
  <circle cx="78" cy="598" r="9" fill="#B7332C"/>
  <text x="78" y="602" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
  <text x="100" y="602" class="body" font-size="13" fill="#1A1A1A">Les 38 intentions sans trace écrite n'entrent dans aucun questionnaire. Elles déplacent le taux de 18 points à elles seules.</text>
  <circle cx="78" cy="630" r="9" fill="#B58A2C"/>
  <text x="78" y="634" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
  <text x="100" y="634" class="body" font-size="13" fill="#1A1A1A">Le biais de mémoire joue dans le sens d'un taux déclaré plus favorable que le taux réel, contrairement à l'intuition courante.</text>
  <circle cx="78" cy="662" r="9" fill="#1F5560"/>
  <text x="78" y="666" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
  <text x="100" y="666" class="body" font-size="13" fill="#1A1A1A">Passer du seuil « mise en service » au seuil « effet chiffré » retire neuf cas sur quatorze. Le seuil pèse autant que le dénominateur.</text>

  <g class="interactive" data-card="lecture" tabindex="0" role="button" aria-label="Lecture du schéma — cliquez pour les détails">
    <rect x="64" y="690" width="1072" height="66" rx="3" fill="#1A1A1A"/>
    <text x="94" y="718" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">LECTURE</text>
    <text x="94" y="744" class="display" font-size="19" font-weight="600" fill="#FAF8F3">Quatre nombres, un seul portefeuille. Le chiffre publié dépend de deux choix de comptage, et de rien d'autre.</text>
  </g>

  <text x="64" y="784" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">PORTEFEUILLE FICTIF À VISÉE DÉMONSTRATIVE. CONSTRUCTION DES QUATRE DÉNOMINATEURS : PROPRE À CE DOSSIER.</text>
</svg>
