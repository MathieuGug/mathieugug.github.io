<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="L'acte de naissance manquant : les quatre moments où un cas d'usage pourrait être inscrit, et qui détient la trace à chacun">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'acte de naissance manquant</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre moments où un cas d'usage pourrait être inscrit. Quatre détenteurs de trace différents, dont un inexistant.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Axe de vie -->
  <line x1="120" y1="252" x2="1110" y2="252" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#arrow03)"/>
  <text x="120" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">VIE D'UN CAS D'USAGE</text>
  <text x="1110" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">TEMPS</text>

  <!-- Moment 1 -->
  <g class="interactive" data-card="moment-idee" tabindex="0" role="button" aria-label="Moment 1, l'idée — cliquez pour les détails">
    <circle cx="190" cy="252" r="11" fill="#FAF8F3" stroke="#B7332C" stroke-width="2.5"/>
    <text x="190" y="228" class="mono" font-size="11" font-weight="600" fill="#B7332C" text-anchor="middle">1</text>
    <rect x="96" y="288" width="208" height="178" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="96" y="288" width="208" height="5" fill="#B7332C"/>
    <text x="118" y="320" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'idée</text>
    <text x="118" y="346" class="body" font-size="12.5" fill="#5A5A5A">Une conversation, un essai</text>
    <text x="118" y="364" class="body" font-size="12.5" fill="#5A5A5A">sur un poste de travail.</text>
    <text x="118" y="398" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">DÉTENTEUR DE LA TRACE</text>
    <text x="118" y="420" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Le métier</text>
    <text x="118" y="446" class="body" font-size="12" font-style="italic" fill="#B7332C">Aucune trace écrite</text>
  </g>

  <!-- Moment 2 -->
  <g class="interactive" data-card="moment-budget" tabindex="0" role="button" aria-label="Moment 2, l'engagement de budget — cliquez pour les détails">
    <circle cx="450" cy="252" r="11" fill="#FAF8F3" stroke="#B58A2C" stroke-width="2.5"/>
    <text x="450" y="228" class="mono" font-size="11" font-weight="600" fill="#B58A2C" text-anchor="middle">2</text>
    <rect x="346" y="288" width="208" height="178" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="346" y="288" width="208" height="5" fill="#B58A2C"/>
    <text x="368" y="320" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le budget</text>
    <text x="368" y="346" class="body" font-size="12.5" fill="#5A5A5A">Une ligne engagée, ou du</text>
    <text x="368" y="364" class="body" font-size="12.5" fill="#5A5A5A">temps déjà financé.</text>
    <text x="368" y="398" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">DÉTENTEUR DE LA TRACE</text>
    <text x="368" y="420" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Le contrôle de gestion</text>
    <text x="368" y="446" class="body" font-size="12" font-style="italic" fill="#B58A2C">Visible seulement si dépensé</text>
  </g>

  <!-- Moment 3 -->
  <g class="interactive" data-card="moment-mise-en-service" tabindex="0" role="button" aria-label="Moment 3, la mise en service — cliquez pour les détails">
    <circle cx="710" cy="252" r="11" fill="#FAF8F3" stroke="#1F5560" stroke-width="2.5"/>
    <text x="710" y="228" class="mono" font-size="11" font-weight="600" fill="#1F5560" text-anchor="middle">3</text>
    <rect x="606" y="288" width="208" height="178" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="606" y="288" width="208" height="5" fill="#1F5560"/>
    <text x="628" y="320" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La mise en service</text>
    <text x="628" y="346" class="body" font-size="12.5" fill="#5A5A5A">Un accès ouvert, un outil</text>
    <text x="628" y="364" class="body" font-size="12.5" fill="#5A5A5A">exposé à des utilisateurs.</text>
    <text x="628" y="398" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">DÉTENTEUR DE LA TRACE</text>
    <text x="628" y="420" class="body" font-size="13" font-weight="500" fill="#1A1A1A">L'exploitation informatique</text>
    <text x="628" y="446" class="body" font-size="12" font-style="italic" fill="#1F5560">Trace fiable, mais tardive</text>
  </g>

  <!-- Moment 4 -->
  <g class="interactive" data-card="moment-arret" tabindex="0" role="button" aria-label="Moment 4, l'arrêt — cliquez pour les détails">
    <circle cx="970" cy="252" r="11" fill="#FAF8F3" stroke="#8A8478" stroke-width="2.5" stroke-dasharray="3 3"/>
    <text x="970" y="228" class="mono" font-size="11" font-weight="600" fill="#8A8478" text-anchor="middle">4</text>
    <rect x="866" y="288" width="208" height="178" rx="3" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1.25" stroke-dasharray="3 3"/>
    <rect x="866" y="288" width="208" height="5" fill="#8A8478"/>
    <text x="888" y="320" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'arrêt</text>
    <text x="888" y="346" class="body" font-size="12.5" fill="#5A5A5A">Plus personne ne s'en</text>
    <text x="888" y="364" class="body" font-size="12.5" fill="#5A5A5A">occupe, sans décision.</text>
    <text x="888" y="398" class="mono" font-size="10.5" letter-spacing="0.09em" fill="#8A8478">DÉTENTEUR DE LA TRACE</text>
    <text x="888" y="420" class="body" font-size="13" font-weight="600" fill="#B7332C">Personne</text>
    <text x="888" y="446" class="body" font-size="12" font-style="italic" fill="#B7332C">Le moment qu'aucun système n'enregistre</text>
  </g>

  <!-- Conséquences -->
  <line x1="64" y1="506" x2="1136" y2="506" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="538" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">TROIS CONSÉQUENCES SUR LE COMPTAGE</text>

  <g class="interactive" data-card="biais-memoire" tabindex="0" role="button" aria-label="Le dénominateur reconstitué de mémoire — cliquez pour les détails">
    <rect x="64" y="554" width="340" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="88" y="584" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B7332C">CONSÉQUENCE A</text>
    <text x="88" y="612" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Dénominateur de mémoire</text>
    <text x="88" y="636" class="body" font-size="12.5" fill="#5A5A5A">Le répondant estime au lieu de</text>
    <text x="88" y="654" class="body" font-size="12.5" fill="#5A5A5A">consulter. Les cas anciens et</text>
    <text x="88" y="668" class="body" font-size="12.5" fill="#5A5A5A">discrets disparaissent d'abord.</text>
  </g>

  <g class="interactive" data-card="essais-sans-nom" tabindex="0" role="button" aria-label="Les essais sans nom — cliquez pour les détails">
    <rect x="430" y="554" width="340" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="454" y="584" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#B58A2C">CONSÉQUENCE B</text>
    <text x="454" y="612" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Les essais sans nom</text>
    <text x="454" y="636" class="body" font-size="12.5" fill="#5A5A5A">Trois semaines à deux, sur un</text>
    <text x="454" y="654" class="body" font-size="12.5" fill="#5A5A5A">outil sous licence : aucune trace</text>
    <text x="454" y="668" class="body" font-size="12.5" fill="#5A5A5A">comptable, aucun dénominateur.</text>
  </g>

  <g class="interactive" data-card="seuil-mobile" tabindex="0" role="button" aria-label="Le seuil qui se déplace — cliquez pour les détails">
    <rect x="796" y="554" width="340" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="820" y="584" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#1F5560">CONSÉQUENCE C</text>
    <text x="820" y="612" class="body" font-size="14" font-weight="600" fill="#1A1A1A">Le seuil qui se déplace</text>
    <text x="820" y="636" class="body" font-size="12.5" fill="#5A5A5A">Quand rien n'a été écrit au départ,</text>
    <text x="820" y="654" class="body" font-size="12.5" fill="#5A5A5A">le classement se décide au</text>
    <text x="820" y="668" class="body" font-size="12.5" fill="#5A5A5A">moment du recensement.</text>
  </g>

  <g class="interactive" data-card="lecture-03" tabindex="0" role="button" aria-label="Lecture du schéma — cliquez pour les détails">
    <rect x="64" y="698" width="1072" height="62" rx="3" fill="#1A1A1A"/>
    <text x="94" y="724" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">LECTURE</text>
    <text x="94" y="748" class="display" font-size="19" font-weight="600" fill="#FAF8F3">Le registre ne sert pas d'abord la conformité. Il fournit le seul dénominateur qu'une organisation puisse opposer.</text>
  </g>

  <text x="64" y="788" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">DÉCOUPAGE EN QUATRE MOMENTS ET ATTRIBUTION DES DÉTENTEURS DE TRACE : PROPRES À CE DOSSIER.</text>
</svg>
