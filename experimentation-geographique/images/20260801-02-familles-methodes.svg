<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Cinq familles de méthodes d'expérimentation géographique, ordonnées par nombre d'unités disponibles">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 02 · MÉTHODES</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Ce qui sépare les méthodes n'est pas la finesse. C'est le <tspan font-style="italic">nombre d'unités</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Cinq familles, ordonnées par ce dont elles ont besoin pour fonctionner.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">CINQ RÉPONSES À LA MÊME QUESTION</text>

  <!-- CARTE 1 — GBR -->
  <g class="interactive" data-card="gbr" tabindex="0" role="button" aria-label="Régression géographique GBR — détails">
    <rect x="60" y="216" width="202" height="316" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="78" y="246" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">FAMILLE 1</text>
    <text x="78" y="278" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Régression</text>
    <text x="78" y="299" class="display" font-size="18" font-weight="600" fill="#1A1A1A">géographique</text>
    <text x="78" y="332" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">QUAND</text>
    <text x="78" y="352" class="body" font-size="11.5" fill="#5A5A5A">Beaucoup de zones,</text>
    <text x="78" y="368" class="body" font-size="11.5" fill="#5A5A5A">assez comparables pour</text>
    <text x="78" y="384" class="body" font-size="11.5" fill="#5A5A5A">une régression entre elles.</text>
    <text x="78" y="418" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'ON LIT</text>
    <text x="78" y="438" class="body" font-size="11.5" fill="#1A1A1A">Le coefficient se lit</text>
    <text x="78" y="454" class="body" font-size="11.5" fill="#1A1A1A">directement comme un iROAS.</text>
    <text x="78" y="494" class="mono" font-size="10" letter-spacing="0.5" fill="#B7332C">Vaver &amp; Koehler, 2011 [1]</text>
    <text x="78" y="514" class="body" font-size="11" font-style="italic" fill="#8A8579">Le texte fondateur.</text>
  </g>

  <!-- CARTE 2 — TBR -->
  <g class="interactive" data-card="tbr" tabindex="0" role="button" aria-label="Régression temporelle TBR — détails">
    <rect x="277" y="216" width="202" height="316" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="295" y="246" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">FAMILLE 2</text>
    <text x="295" y="278" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Régression</text>
    <text x="295" y="299" class="display" font-size="18" font-weight="600" fill="#1A1A1A">temporelle</text>
    <text x="295" y="332" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">QUAND</text>
    <text x="295" y="352" class="body" font-size="11.5" fill="#5A5A5A">Peu de zones — jusqu'au</text>
    <text x="295" y="368" class="body" font-size="11.5" fill="#5A5A5A">cas d'un seul marché test</text>
    <text x="295" y="384" class="body" font-size="11.5" fill="#5A5A5A">contre un seul témoin.</text>
    <text x="295" y="418" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'ON LIT</text>
    <text x="295" y="438" class="body" font-size="11.5" fill="#1A1A1A">L'écart cumulé entre série</text>
    <text x="295" y="454" class="body" font-size="11.5" fill="#1A1A1A">observée et série prédite.</text>
    <text x="295" y="494" class="mono" font-size="10" letter-spacing="0.5" fill="#B7332C">Kerman, Wang, Vaver [2]</text>
    <text x="295" y="514" class="body" font-size="11" font-style="italic" fill="#8A8579">L'information passe au temps.</text>
  </g>

  <!-- CARTE 3 — SCM -->
  <g class="interactive" data-card="scm" tabindex="0" role="button" aria-label="Contrôle synthétique — détails">
    <rect x="494" y="216" width="202" height="316" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="512" y="246" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">FAMILLE 3</text>
    <text x="512" y="278" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Contrôle</text>
    <text x="512" y="299" class="display" font-size="18" font-weight="600" fill="#1A1A1A">synthétique</text>
    <text x="512" y="332" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">QUAND</text>
    <text x="512" y="352" class="body" font-size="11.5" fill="#5A5A5A">Une zone traitée, un vivier</text>
    <text x="512" y="368" class="body" font-size="11.5" fill="#5A5A5A">de donneurs, un historique</text>
    <text x="512" y="384" class="body" font-size="11.5" fill="#5A5A5A">pré-test suffisant.</text>
    <text x="512" y="418" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'ON LIT</text>
    <text x="512" y="438" class="body" font-size="11.5" fill="#1A1A1A">Le lift contre un « jumeau »</text>
    <text x="512" y="454" class="body" font-size="11.5" fill="#1A1A1A">reconstruit par pondération.</text>
    <text x="512" y="494" class="mono" font-size="10" letter-spacing="0.5" fill="#B7332C">GeoLift, Meta [6]</text>
    <text x="512" y="514" class="body" font-size="11" font-style="italic" fill="#8A8579">Le plus prudent — voir schéma 3.</text>
  </g>

  <!-- CARTE 4 — Appariement robuste -->
  <g class="interactive" data-card="trimmed-match" tabindex="0" role="button" aria-label="Appariement robuste et supergeos — détails">
    <rect x="711" y="216" width="202" height="316" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="729" y="246" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">FAMILLE 4</text>
    <text x="729" y="278" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Appariement</text>
    <text x="729" y="299" class="display" font-size="18" font-weight="600" fill="#1A1A1A">robuste</text>
    <text x="729" y="332" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">QUAND</text>
    <text x="729" y="352" class="body" font-size="11.5" fill="#5A5A5A">Zones à queue lourde :</text>
    <text x="729" y="368" class="body" font-size="11.5" fill="#5A5A5A">quelques-unes pèsent une</text>
    <text x="729" y="384" class="body" font-size="11.5" fill="#5A5A5A">part disproportionnée.</text>
    <text x="729" y="418" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'ON LIT</text>
    <text x="729" y="438" class="body" font-size="11.5" fill="#1A1A1A">Un iROAS qui ne dépend pas</text>
    <text x="729" y="454" class="body" font-size="11.5" fill="#1A1A1A">d'une seule paire aberrante.</text>
    <text x="729" y="494" class="mono" font-size="10" letter-spacing="0.5" fill="#B7332C">Trimmed Match [3] [4]</text>
    <text x="729" y="514" class="body" font-size="11" font-style="italic" fill="#8A8579">+ supergeos [5] : NP-difficile.</text>
  </g>

  <!-- CARTE 5 — Switchback -->
  <g class="interactive" data-card="switchback" tabindex="0" role="button" aria-label="Switchback — détails">
    <rect x="928" y="216" width="202" height="316" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25" stroke-dasharray="5 3"/>
    <text x="946" y="246" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">HORS GÉOGRAPHIE</text>
    <text x="946" y="278" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Bascule</text>
    <text x="946" y="299" class="display" font-size="18" font-weight="600" fill="#1A1A1A">temporelle</text>
    <text x="946" y="332" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">QUAND</text>
    <text x="946" y="352" class="body" font-size="11.5" fill="#5A5A5A">Les unités ne peuvent pas</text>
    <text x="946" y="368" class="body" font-size="11.5" fill="#5A5A5A">être séparées : marché</text>
    <text x="946" y="384" class="body" font-size="11.5" fill="#5A5A5A">unique, place de marché.</text>
    <text x="946" y="418" class="mono" font-size="9" letter-spacing="1.5" fill="#8A8579">CE QU'ON LIT</text>
    <text x="946" y="438" class="body" font-size="11.5" fill="#1A1A1A">L'écart entre périodes</text>
    <text x="946" y="454" class="body" font-size="11.5" fill="#1A1A1A">alternées de la même unité.</text>
    <text x="946" y="494" class="mono" font-size="10" letter-spacing="0.5" fill="#B7332C">Bojinov et al., 2022 [12]</text>
    <text x="946" y="514" class="body" font-size="11" font-style="italic" fill="#8A8579">La rémanence fixe la cadence.</text>
  </g>

  <!-- AXE -->
  <line x1="60" y1="574" x2="1130" y2="574" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="161" y1="568" x2="161" y2="580" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="378" y1="568" x2="378" y2="580" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="595" y1="568" x2="595" y2="580" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="812" y1="568" x2="812" y2="580" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="1029" y1="568" x2="1029" y2="580" stroke="#1A1A1A" stroke-width="1"/>
  <text x="60" y="600" class="mono" font-size="10.5" letter-spacing="1.5" fill="#5A5A5A">BEAUCOUP D'UNITÉS COMPARABLES</text>
  <text x="1130" y="600" class="mono" font-size="10.5" letter-spacing="1.5" fill="#5A5A5A" text-anchor="end">UNE SEULE UNITÉ, INSÉPARABLE</text>

  <!-- ARBITRAGE -->
  <g class="interactive" data-card="arbitrage-methode" tabindex="0" role="button" aria-label="Ce que le choix de méthode ne règle pas — détails">
    <rect x="60" y="630" width="1070" height="112" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="656" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">CE QUE LE CHOIX DE MÉTHODE NE RÈGLE PAS</text>
    <text x="80" y="686" class="display" font-size="19" font-weight="600" fill="#1A1A1A">À budget témoin et durée constants, l'outil ne déplace le résultat qu'à la marge.</text>
    <text x="80" y="712" class="body" font-size="12.5" fill="#5A5A5A">Sur données simulées à vérité connue, l'écart entre outils porte surtout sur la calibration des intervalles — pas sur la capacité à voir un effet.</text>
    <text x="80" y="731" class="body" font-size="12.5" fill="#5A5A5A">Ce qui commande la détection, c'est le dimensionnement. C'est l'objet du schéma suivant.</text>
  </g>

  <line x1="60" y1="762" x2="1140" y2="762" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="782" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">SOURCES [1] [2] [3] [4] [5] [6] [12] · POSITIONNEMENT SUR L'AXE : LECTURE DE L'AUTEUR</text>
</svg>
