<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Cinq façons de rater une expérience géographique : symptôme, mécanisme, parade">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 05 · ANTI-PATRONS</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Cinq façons de rater un test — toutes <tspan font-style="italic">détectables au design</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Aucune n'est exotique. Toutes se répètent avec régularité.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="196" class="mono" font-size="10" letter-spacing="2" fill="#8A8579">L'ANTI-PATRON</text>
  <text x="392" y="196" class="mono" font-size="10" letter-spacing="2" fill="#8A8579">LE MÉCANISME</text>
  <text x="784" y="196" class="mono" font-size="10" letter-spacing="2" fill="#8A8579">LA PARADE</text>

  <!-- ROW 1 — débordement -->
  <g class="interactive" data-card="debordement" tabindex="0" role="button" aria-label="Le débordement entre zones — détails">
    <rect x="60" y="212" width="1080" height="98" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <line x1="372" y1="212" x2="372" y2="310" stroke="#E5E1D8" stroke-width="1"/>
    <line x1="764" y1="212" x2="764" y2="310" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="238" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ANTI-PATRON 1</text>
    <text x="80" y="266" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le débordement</text>
    <text x="80" y="290" class="body" font-size="11.5" font-style="italic" fill="#8A8579">violation de l'hypothèse SUTVA</text>
    <text x="392" y="246" class="body" font-size="12" fill="#5A5A5A">Les habitants circulent, les médias débordent</text>
    <text x="392" y="266" class="body" font-size="12" fill="#5A5A5A">des frontières, le ciblage de la régie est</text>
    <text x="392" y="286" class="body" font-size="12" fill="#1A1A1A">approximatif : le témoin est partiellement traité,</text>
    <text x="392" y="303" class="body" font-size="12" fill="#1A1A1A">et l'effet mesuré est comprimé vers zéro.</text>
    <text x="784" y="246" class="body" font-size="12" fill="#5A5A5A">Exclure du témoin les zones adjacentes</text>
    <text x="784" y="266" class="body" font-size="12" fill="#5A5A5A">(tampon géographique), ou regrouper en</text>
    <text x="784" y="286" class="body" font-size="12" fill="#5A5A5A">supergeos assez larges [5].</text>
    <text x="784" y="303" class="body" font-size="12" font-style="italic" fill="#B7332C">Détection : décroissance avec la distance.</text>
  </g>

  <!-- ROW 2 — rémanence -->
  <g class="interactive" data-card="remanence-piege" tabindex="0" role="button" aria-label="La rémanence — détails">
    <rect x="60" y="318" width="1080" height="98" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <line x1="372" y1="318" x2="372" y2="416" stroke="#E5E1D8" stroke-width="1"/>
    <line x1="764" y1="318" x2="764" y2="416" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="344" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ANTI-PATRON 2</text>
    <text x="80" y="372" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La rémanence</text>
    <text x="80" y="396" class="body" font-size="11.5" font-style="italic" fill="#8A8579">effet de report et délai de conversion</text>
    <text x="392" y="352" class="body" font-size="12" fill="#5A5A5A">Un test de coupe conclut à un effet nul parce</text>
    <text x="392" y="372" class="body" font-size="12" fill="#5A5A5A">que les conversions résiduelles ont maintenu</text>
    <text x="392" y="392" class="body" font-size="12" fill="#1A1A1A">les ventes pendant les deux semaines mesurées.</text>
    <text x="392" y="409" class="body" font-size="12" fill="#1A1A1A">Le test suivant hérite de la contamination.</text>
    <text x="784" y="352" class="body" font-size="12" fill="#5A5A5A">Prolonger la fenêtre de mesure au-delà de</text>
    <text x="784" y="372" class="body" font-size="12" fill="#5A5A5A">la fin de diffusion, et imposer une période</text>
    <text x="784" y="392" class="body" font-size="12" fill="#5A5A5A">de refroidissement avant le test suivant.</text>
    <text x="784" y="409" class="body" font-size="12" font-style="italic" fill="#B7332C">C'est une contrainte de calendrier.</text>
  </g>

  <!-- ROW 3 — saisonnalité -->
  <g class="interactive" data-card="saisonnalite" tabindex="0" role="button" aria-label="Saisonnalité et chocs exogènes — détails">
    <rect x="60" y="424" width="1080" height="98" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <line x1="372" y1="424" x2="372" y2="522" stroke="#E5E1D8" stroke-width="1"/>
    <line x1="764" y1="424" x2="764" y2="522" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="450" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ANTI-PATRON 3</text>
    <text x="80" y="478" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le choc exogène</text>
    <text x="80" y="502" class="body" font-size="11.5" font-style="italic" fill="#8A8579">saisonnalité, concurrence, événement local</text>
    <text x="392" y="458" class="body" font-size="12" fill="#5A5A5A">Le contrefactuel suppose que la relation entre</text>
    <text x="392" y="478" class="body" font-size="12" fill="#5A5A5A">zones reste stable. Une opération concurrente</text>
    <text x="392" y="498" class="body" font-size="12" fill="#1A1A1A">régionale suffit à la casser — et le risque croît</text>
    <text x="392" y="515" class="body" font-size="12" fill="#1A1A1A">avec la durée du test.</text>
    <text x="784" y="458" class="body" font-size="12" fill="#5A5A5A">Rejouer l'analyse sur une période sans</text>
    <text x="784" y="478" class="body" font-size="12" fill="#5A5A5A">intervention (test A/A) et vérifier que l'effet</text>
    <text x="784" y="498" class="body" font-size="12" fill="#5A5A5A">estimé est bien nul.</text>
    <text x="784" y="515" class="body" font-size="12" font-style="italic" fill="#B7332C">Le seul diagnostic honnête avant d'engager.</text>
  </g>

  <!-- ROW 4 — sélection post-hoc -->
  <g class="interactive" data-card="selection-post-hoc" tabindex="0" role="button" aria-label="La sélection après coup — détails">
    <rect x="60" y="530" width="1080" height="98" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <line x1="372" y1="530" x2="372" y2="628" stroke="#E0C9C2" stroke-width="1"/>
    <line x1="764" y1="530" x2="764" y2="628" stroke="#E0C9C2" stroke-width="1"/>
    <text x="80" y="556" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ANTI-PATRON 4 · LE PÉCHÉ CAPITAL</text>
    <text x="80" y="584" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La sélection après coup</text>
    <text x="80" y="608" class="body" font-size="11.5" font-style="italic" fill="#8A8579">degrés de liberté de l'analyste</text>
    <text x="392" y="564" class="body" font-size="12" fill="#5A5A5A">Quelles zones dans le vivier, quelle fenêtre</text>
    <text x="392" y="584" class="body" font-size="12" fill="#5A5A5A">pré-test, quelle variable de correspondance :</text>
    <text x="392" y="604" class="body" font-size="12" fill="#1A1A1A">explorer après avoir vu le résultat, puis retenir</text>
    <text x="392" y="621" class="body" font-size="12" fill="#1A1A1A">la meilleure, vide la p-valeur de son sens.</text>
    <text x="784" y="564" class="body" font-size="12" fill="#5A5A5A">Figer la spécification par écrit avant</text>
    <text x="784" y="584" class="body" font-size="12" fill="#5A5A5A">l'ouverture des données de test. Toute</text>
    <text x="784" y="604" class="body" font-size="12" fill="#5A5A5A">déviation devient explicitement exploratoire.</text>
    <text x="784" y="621" class="body" font-size="12" font-style="italic" fill="#B7332C">Parade procédurale, pas statistique.</text>
  </g>

  <!-- ROW 5 — test unique -->
  <g class="interactive" data-card="test-unique" tabindex="0" role="button" aria-label="Le test unique surinterprété — détails">
    <rect x="60" y="636" width="1080" height="98" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <line x1="372" y1="636" x2="372" y2="734" stroke="#E5E1D8" stroke-width="1"/>
    <line x1="764" y1="636" x2="764" y2="734" stroke="#E5E1D8" stroke-width="1"/>
    <text x="80" y="662" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ANTI-PATRON 5</text>
    <text x="80" y="690" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le test unique</text>
    <text x="80" y="714" class="body" font-size="11.5" font-style="italic" fill="#8A8579">un tirage pris pour une loi</text>
    <text x="392" y="670" class="body" font-size="12" fill="#5A5A5A">Un test donne un intervalle, souvent large, sur</text>
    <text x="392" y="690" class="body" font-size="12" fill="#5A5A5A">un canal, une période, un contexte. En faire une</text>
    <text x="392" y="710" class="body" font-size="12" fill="#1A1A1A">vérité générale et réallouer des millions dessus,</text>
    <text x="392" y="727" class="body" font-size="12" fill="#1A1A1A">c'est l'erreur la plus coûteuse — dans les deux sens.</text>
    <text x="784" y="670" class="body" font-size="12" fill="#5A5A5A">Passer du test au programme : ce n'est pas</text>
    <text x="784" y="690" class="body" font-size="12" fill="#5A5A5A">un test qui informe, c'est une série.</text>
    <text x="784" y="710" class="body" font-size="12" fill="#5A5A5A">Voir schéma 6.</text>
    <text x="784" y="727" class="body" font-size="12" font-style="italic" fill="#B7332C">Parade programmatique, pas méthodologique.</text>
  </g>

  <line x1="60" y1="762" x2="1140" y2="762" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="782" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">CATALOGUE DE L'AUTEUR · SOURCE [5] POUR LES SUPERGEOS</text>
</svg>
