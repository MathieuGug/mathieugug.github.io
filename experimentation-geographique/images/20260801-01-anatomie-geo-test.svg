<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Anatomie d'une expérience géographique : trois périodes, assignation des zones, estimand en sortie">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-emph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 01 · ANATOMIE</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Une expérience géographique, c'est d'abord un <tspan font-style="italic">calendrier</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Trois périodes, une règle d'assignation, un estimand choisi à l'avance.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <!-- TIMELINE -->
  <text x="60" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">LES TROIS PÉRIODES</text>

  <g class="interactive" data-card="pretest" tabindex="0" role="button" aria-label="Période pré-test — détails">
    <rect x="60" y="212" width="400" height="88" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="238" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">PÉRIODE 1</text>
    <text x="80" y="264" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Pré-test</text>
    <text x="80" y="286" class="body" font-size="12" fill="#5A5A5A">On apprend la relation entre zones — c'est elle qui produit le contrefactuel.</text>
  </g>

  <g class="interactive" data-card="test-periode" tabindex="0" role="button" aria-label="Période de test — détails">
    <rect x="460" y="212" width="400" height="88" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="480" y="238" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">PÉRIODE 2</text>
    <text x="480" y="264" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Test</text>
    <text x="480" y="286" class="body" font-size="12" fill="#5A5A5A">L'intervention est active. 7 à 56 jours dans le produit de mesure de Google.</text>
  </g>

  <g class="interactive" data-card="remanence" tabindex="0" role="button" aria-label="Période de rémanence — détails">
    <rect x="860" y="212" width="220" height="88" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25" stroke-dasharray="5 3"/>
    <text x="880" y="238" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A">PÉRIODE 3</text>
    <text x="880" y="264" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Rémanence</text>
    <text x="880" y="286" class="body" font-size="12" fill="#5A5A5A">Celle qu'on oublie.</text>
  </g>

  <!-- bracket : fenêtre de mesure -->
  <path d="M460,316 L460,326 L1080,326 L1080,316" fill="none" stroke="#B7332C" stroke-width="1.25"/>
  <rect x="640" y="316" width="260" height="22" fill="#FAF8F3"/>
  <text x="770" y="332" class="mono" font-size="11" letter-spacing="1.5" fill="#B7332C" text-anchor="middle">FENÊTRE DE MESURE UTILE</text>
  <text x="60" y="356" class="body" font-size="12" font-style="italic" fill="#8A8579">Arrêter la mesure au dernier jour de diffusion sous-estime l'effet. Enchaîner deux tests sans refroidissement contamine le second.</text>

  <line x1="60" y1="378" x2="1140" y2="378" stroke="#E5E1D8" stroke-width="1"/>

  <!-- ASSIGNATION -->
  <text x="60" y="412" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">L'ASSIGNATION DES ZONES</text>

  <g class="interactive" data-card="assignation" tabindex="0" role="button" aria-label="Assignation des zones — détails">
    <rect x="60" y="428" width="262" height="176" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <!-- rangée 1 -->
    <rect x="78" y="448" width="42" height="30" rx="2" fill="#B7332C"/>
    <rect x="128" y="448" width="42" height="30" rx="2" fill="#EFEBE1"/>
    <rect x="178" y="448" width="42" height="30" rx="2" fill="#EFEBE1"/>
    <rect x="228" y="448" width="42" height="30" rx="2" fill="#B7332C"/>
    <!-- rangée 2 -->
    <rect x="78" y="486" width="42" height="30" rx="2" fill="#EFEBE1"/>
    <rect x="128" y="486" width="42" height="30" rx="2" fill="#D8D3C6"/>
    <rect x="178" y="486" width="42" height="30" rx="2" fill="#B7332C"/>
    <rect x="228" y="486" width="42" height="30" rx="2" fill="#EFEBE1"/>
    <!-- rangée 3 -->
    <rect x="78" y="524" width="42" height="30" rx="2" fill="#B7332C"/>
    <rect x="128" y="524" width="42" height="30" rx="2" fill="#EFEBE1"/>
    <rect x="178" y="524" width="42" height="30" rx="2" fill="#D8D3C6"/>
    <rect x="228" y="524" width="42" height="30" rx="2" fill="#EFEBE1"/>
    <text x="78" y="580" class="body" font-size="11" fill="#5A5A5A">On choisit l'affectation. C'est ce geste,</text>
    <text x="78" y="595" class="body" font-size="11" fill="#5A5A5A">et lui seul, qui rend la comparaison causale.</text>
  </g>

  <!-- légende -->
  <rect x="60" y="620" width="14" height="12" rx="2" fill="#B7332C"/>
  <text x="82" y="631" class="body" font-size="11.5" fill="#1A1A1A">zone traitée</text>
  <rect x="180" y="620" width="14" height="12" rx="2" fill="#EFEBE1" stroke="#B8B5AE" stroke-width="0.75"/>
  <text x="202" y="631" class="body" font-size="11.5" fill="#1A1A1A">zone témoin</text>
  <rect x="60" y="646" width="14" height="12" rx="2" fill="#D8D3C6"/>
  <text x="82" y="657" class="body" font-size="11.5" fill="#1A1A1A">zone tampon (exclue — voir schéma 5)</text>

  <!-- ESTIMAND -->
  <text x="380" y="412" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">L'ESTIMAND EN SORTIE — À CHOISIR AVANT, PAS APRÈS</text>

  <g class="interactive" data-card="estimand-lift" tabindex="0" role="button" aria-label="Estimand lift cumulé — détails">
    <rect x="380" y="428" width="360" height="176" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="400" y="454" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ESTIMAND A</text>
    <text x="400" y="484" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le lift cumulé</text>
    <text x="400" y="510" class="body" font-size="12" fill="#5A5A5A">« Combien de conversions supplémentaires</text>
    <text x="400" y="527" class="body" font-size="12" fill="#5A5A5A">sur la période ? »</text>
    <text x="400" y="556" class="body" font-size="12" fill="#1A1A1A">Une différence. Relativement stable.</text>
    <text x="400" y="576" class="body" font-size="12" font-style="italic" fill="#8A8579">Ce que la méthode estime le mieux.</text>
  </g>

  <g class="interactive" data-card="estimand-iroas" tabindex="0" role="button" aria-label="Estimand iROAS — détails">
    <rect x="770" y="428" width="370" height="176" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="790" y="454" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ESTIMAND B</text>
    <text x="790" y="484" class="display" font-size="21" font-weight="600" fill="#1A1A1A">L'iROAS</text>
    <text x="790" y="510" class="body" font-size="12" fill="#5A5A5A">« Combien d'euros gagnés par euro</text>
    <text x="790" y="527" class="body" font-size="12" fill="#5A5A5A">dépensé ? »</text>
    <text x="790" y="556" class="body" font-size="12" fill="#1A1A1A">Un rapport de deux différences. Instable.</text>
    <text x="790" y="576" class="body" font-size="12" font-style="italic" fill="#8A8579">Ce dont la décision a besoin.</text>
  </g>

  <!-- CONTRAINTE -->
  <g class="interactive" data-card="contrainte" tabindex="0" role="button" aria-label="La contrainte de design — détails">
    <rect x="380" y="620" width="760" height="122" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="400" y="646" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LA CONTRAINTE QUI COMMANDE TOUT LE RESTE</text>
    <text x="400" y="676" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Peu d'unités, très hétérogènes, à queue lourde.</text>
    <text x="400" y="702" class="body" font-size="12.5" fill="#5A5A5A">210 zones médias aux États-Unis. Treize régions en France métropolitaine. Trente zones de chalandise, ce sont trente</text>
    <text x="400" y="721" class="body" font-size="12.5" fill="#5A5A5A">points de données — quelle que soit la population qu'elles contiennent. Et l'une d'elles peut peser 15 % du chiffre d'affaires.</text>
  </g>

  <line x1="60" y1="762" x2="1140" y2="762" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="782" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">CADRE ANALYTIQUE DE L'AUTEUR · SOURCES [1] [2] [14]</text>
</svg>
