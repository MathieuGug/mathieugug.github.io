<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le mur de la puissance : effet minimal détectable, zone aveugle, taux de faux positifs et effets manqués">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 03 · PUISSANCE</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Un test non concluant n'est pas une information. C'est une <tspan font-style="italic">dépense</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">L'effet minimal détectable se calcule avant, et il conditionne la décision de lancer.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="192" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">CE QU'UN DISPOSITIF PEUT VOIR</text>

  <!-- zones -->
  <g class="interactive" data-card="zone-aveugle" tabindex="0" role="button" aria-label="Zone aveugle — détails">
    <rect x="111" y="211" width="309" height="219" fill="#EFEBE1"/>
  </g>
  <g class="interactive" data-card="zone-utile" tabindex="0" role="button" aria-label="Zone utile — détails">
    <rect x="420" y="431" width="220" height="88" fill="#F6E7E3"/>
  </g>

  <!-- axes -->
  <line x1="110" y1="210" x2="110" y2="520" stroke="#1A1A1A" stroke-width="1.25"/>
  <line x1="110" y1="520" x2="645" y2="520" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- courbe MDE -->
  <path d="M120,232 C 210,330 300,398 420,430 C 520,456 580,466 632,472" fill="none" stroke="#1A1A1A" stroke-width="2.25"/>
  <text x="150" y="224" class="mono" font-size="10" letter-spacing="1" fill="#1A1A1A">MDE DU DISPOSITIF</text>

  <!-- seuil de décision -->
  <g class="interactive" data-card="seuil-decision" tabindex="0" role="button" aria-label="Le seuil de décision — détails">
    <rect x="110" y="418" width="530" height="26" fill="transparent"/>
    <line x1="110" y1="430" x2="640" y2="430" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>
  <text x="644" y="426" class="mono" font-size="10" letter-spacing="1" fill="#B7332C">EFFET QUI CHANGERAIT</text>
  <text x="644" y="440" class="mono" font-size="10" letter-spacing="1" fill="#B7332C">LA DÉCISION</text>

  <!-- point de bascule -->
  <circle cx="420" cy="430" r="5.5" fill="#B7332C"/>
  <line x1="420" y1="430" x2="420" y2="520" stroke="#B7332C" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- labels de zone -->
  <text x="131" y="286" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Zone aveugle</text>
  <text x="131" y="308" class="body" font-size="12" fill="#5A5A5A">Le dispositif ne peut pas détecter</text>
  <text x="131" y="324" class="body" font-size="12" fill="#5A5A5A">l'effet qui vous intéresse.</text>
  <text x="131" y="345" class="body" font-size="12" font-style="italic" fill="#B7332C">Lancer ici, c'est payer pour rien.</text>

  <text x="440" y="462" class="display" font-size="16" font-weight="600" fill="#1A1A1A">Zone utile</text>
  <text x="440" y="482" class="body" font-size="11.5" fill="#5A5A5A">Le test peut trancher.</text>

  <!-- axis labels -->
  <text x="98" y="205" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A" text-anchor="end" transform="rotate(-90 98 205)">EFFET MINIMAL DÉTECTABLE →</text>
  <text x="110" y="548" class="mono" font-size="10.5" letter-spacing="1.5" fill="#5A5A5A">DIMENSIONNEMENT → DURÉE × TAILLE DU TÉMOIN × AMPLEUR DE LA COUPE</text>

  <!-- CHIFFRES -->
  <text x="680" y="192" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">CE QUE MESURE LA LITTÉRATURE</text>

  <g class="interactive" data-card="lewis-rao" tabindex="0" role="button" aria-label="Lewis et Rao, l'économie défavorable de la mesure — détails">
    <rect x="680" y="210" width="460" height="108" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="700" y="236" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">25 EXPÉRIENCES DE TERRAIN · 2,8 M$ DE DÉPENSE [8]</text>
    <text x="700" y="274" class="display" font-size="30" font-weight="600" fill="#1A1A1A">&gt; 100 points</text>
    <text x="700" y="298" class="body" font-size="12.5" fill="#5A5A5A">de largeur médiane de l'intervalle de confiance sur le ROI.</text>
  </g>

  <g class="interactive" data-card="faux-positifs" tabindex="0" role="button" aria-label="Taux de faux positifs des outils — détails">
    <rect x="680" y="334" width="460" height="108" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="700" y="360" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">SIMULATION À VÉRITÉ CONNUE, QUATRE OUTILS OUVERTS [7]</text>
    <text x="700" y="398" class="display" font-size="30" font-weight="600" fill="#1A1A1A">3–5 %  contre  &gt; 24 %</text>
    <text x="700" y="422" class="body" font-size="12.5" fill="#5A5A5A">de faux positifs : le meilleur outil contre les plus fragiles, en régime de rareté.</text>
  </g>

  <g class="interactive" data-card="puissance-manquee" tabindex="0" role="button" aria-label="Effets réels manqués — détails">
    <rect x="680" y="458" width="460" height="108" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="700" y="484" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">L'AUTRE FACE DU MÊME ARBITRAGE [7]</text>
    <text x="700" y="522" class="display" font-size="30" font-weight="600" fill="#1A1A1A">89 à 96 %</text>
    <text x="700" y="546" class="body" font-size="12.5" fill="#5A5A5A">des effets réellement présents ne sont pas détectés par l'outil le plus prudent.</text>
  </g>

  <!-- CONSÉQUENCE -->
  <g class="interactive" data-card="consequence-gouvernance" tabindex="0" role="button" aria-label="La conséquence de gouvernance — détails">
    <rect x="60" y="600" width="1080" height="140" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <text x="80" y="626" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LA CONSÉQUENCE DE GOUVERNANCE</text>
    <text x="80" y="658" class="display" font-size="21" font-weight="600" fill="#1A1A1A">« Non significatif » ne veut pas dire « pas incrémental ». Cela veut souvent dire « sous-dimensionné ».</text>
    <text x="80" y="688" class="body" font-size="12.5" fill="#5A5A5A">Quand la puissance est de 5 %, un résultat nul ne dit rien sur le canal : il dit que le dispositif était trop petit pour voir quoi que ce soit.</text>
    <text x="80" y="707" class="body" font-size="12.5" fill="#5A5A5A">La question à poser avant de lancer n'est donc pas « ce test sera-t-il significatif ? » mais <tspan font-style="italic">« quel est le plus petit effet qu'il peut voir,</tspan></text>
    <text x="80" y="726" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">et cet effet est-il plus petit que celui qui changerait ma décision ? »</text>
  </g>

  <line x1="60" y1="762" x2="1140" y2="762" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="782" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">COURBE ILLUSTRATIVE · CHIFFRES : SOURCES [7] [8]</text>
</svg>
