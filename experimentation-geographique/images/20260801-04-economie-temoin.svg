<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="L'économie du budget témoin : coût d'opportunité croissant contre précision, zone de compromis et seuil d'adoption">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 04 · ÉCONOMIE</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Les outils sont gratuits. Ce qui coûte, c'est le <tspan font-style="italic">chiffre d'affaires qu'on ne fait pas</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Plus la campagne est efficace, plus le test coûte cher — et plus il est justifié de le mener.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="192" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">DEUX COURBES QUI S'OPPOSENT</text>

  <!-- zone de compromis -->
  <g class="interactive" data-card="optimum" tabindex="0" role="button" aria-label="La zone de compromis — détails">
    <rect x="270" y="240" width="100" height="280" fill="#F6E7E3"/>
  </g>
  <text x="320" y="232" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C" text-anchor="middle">ZONE DE COMPROMIS</text>

  <!-- axes -->
  <line x1="110" y1="210" x2="110" y2="520" stroke="#1A1A1A" stroke-width="1.25"/>
  <line x1="110" y1="520" x2="700" y2="520" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- courbe coût d'opportunité -->
  <path d="M120,502 C 260,448 420,352 680,254" fill="none" stroke="#B7332C" stroke-width="2.25"/>
  <g class="interactive" data-card="cout-opportunite" tabindex="0" role="button" aria-label="Le coût d'opportunité — détails">
    <rect x="430" y="222" width="252" height="34" fill="transparent"/>
    <text x="676" y="238" class="mono" font-size="10.5" letter-spacing="1" fill="#B7332C" text-anchor="end">COÛT D'OPPORTUNITÉ →</text>
    <text x="676" y="252" class="body" font-size="11" fill="#B7332C" text-anchor="end">ventes non réalisées dans le témoin</text>
  </g>

  <!-- courbe largeur IC -->
  <path d="M120,236 C 250,398 330,438 440,458 C 550,474 620,480 680,484" fill="none" stroke="#1A1A1A" stroke-width="2.25"/>
  <g class="interactive" data-card="precision" tabindex="0" role="button" aria-label="La précision achetée — détails">
    <rect x="430" y="490" width="252" height="20" fill="transparent"/>
    <text x="676" y="504" class="mono" font-size="10.5" letter-spacing="1" fill="#1A1A1A" text-anchor="end">← LARGEUR DE L'INTERVALLE</text>
  </g>
  <text x="140" y="232" class="body" font-size="11" fill="#5A5A5A">précision achetée en √n :</text>
  <text x="140" y="247" class="body" font-size="11" fill="#5A5A5A">le rendement décroît vite</text>

  <text x="98" y="205" class="mono" font-size="10" letter-spacing="1.5" fill="#5A5A5A" text-anchor="end" transform="rotate(-90 98 205)">COÛT · IMPRÉCISION →</text>
  <text x="110" y="548" class="mono" font-size="10.5" letter-spacing="1.5" fill="#5A5A5A">TAILLE DU GROUPE TÉMOIN × DURÉE × AMPLEUR DE LA COUPE →</text>

  <!-- COLONNE DROITE -->
  <text x="740" y="192" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">CE QU'IL FAUT SAVOIR AVANT DE PROVISIONNER</text>

  <g class="interactive" data-card="ce-qu-on-paie" tabindex="0" role="button" aria-label="Ce qu'on paie vraiment — détails">
    <rect x="740" y="210" width="400" height="104" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="760" y="236" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LE POSTE JAMAIS CHIFFRÉ</text>
    <text x="760" y="264" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le logiciel vaut zéro.</text>
    <text x="760" y="288" class="body" font-size="12" fill="#5A5A5A">GeoLift, Matched Markets, CausalImpact,</text>
    <text x="760" y="304" class="body" font-size="12" fill="#5A5A5A">Trimmed Match, CausalPy : tous ouverts.</text>
  </g>

  <g class="interactive" data-card="paradoxe" tabindex="0" role="button" aria-label="Le paradoxe du témoin — détails">
    <rect x="740" y="330" width="400" height="104" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="760" y="356" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LA TENSION QUI TUE LES PROGRAMMES</text>
    <text x="760" y="384" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Coût immédiat, imputable.</text>
    <text x="760" y="408" class="body" font-size="12" fill="#5A5A5A">Bénéfice différé, diffus, global. Sans arbitrage</text>
    <text x="760" y="424" class="body" font-size="12" fill="#5A5A5A">au sommet, l'échelon local a toujours raison.</text>
  </g>

  <g class="interactive" data-card="ghost-ads" tabindex="0" role="button" aria-label="Les publicités fantômes — détails">
    <rect x="740" y="450" width="400" height="126" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="760" y="476" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">L'EXCEPTION QUI N'EST PAS À VOUS [11]</text>
    <text x="760" y="506" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Publicités fantômes :</text>
    <text x="760" y="528" class="display" font-size="19" font-weight="600" fill="#1A1A1A">un ordre de grandeur de moins.</text>
    <text x="760" y="552" class="body" font-size="12" fill="#5A5A5A">Même précision, dépense divisée par dix — mais</text>
    <text x="760" y="568" class="body" font-size="12" fill="#5A5A5A">la technique appartient à la plateforme.</text>
  </g>

  <!-- SEUIL -->
  <g class="interactive" data-card="seuil-adoption" tabindex="0" role="button" aria-label="Le seuil de financement — détails">
    <rect x="60" y="600" width="1080" height="140" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="626" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LE SEUIL DE FINANCEMENT — À CALCULER SUR SON PROPRE PORTEFEUILLE</text>
    <text x="80" y="658" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Sous un certain volume de dépense, le témoin coûte plus cher que la décision qu'il éclaire.</text>
    <text x="80" y="688" class="body" font-size="12.5" fill="#5A5A5A">En dessous du seuil, la bonne réponse est d'acheter quelques tests ponctuels — pas de bâtir une capacité. Au-dessus, le test géographique</text>
    <text x="80" y="707" class="body" font-size="12.5" fill="#5A5A5A">en continu devient la norme, et ce qui se construit alors n'est plus un test mais un programme.</text>
    <text x="80" y="730" class="body" font-size="12.5" font-style="italic" fill="#8A8579">Le curseur le moins discuté et souvent le plus rentable : couper totalement sur peu de zones, plutôt que réduire partiellement sur beaucoup.</text>
  </g>

  <line x1="60" y1="762" x2="1140" y2="762" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="782" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">COURBES ILLUSTRATIVES · SOURCE [11] POUR LES PUBLICITÉS FANTÔMES · SEUIL : REPÈRE DE TERRAIN, PAS UNE MESURE</text>
</svg>
