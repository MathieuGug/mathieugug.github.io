<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La boucle expérience, prior calibré, modèle de mix, réallocation, et la cadence annuelle">
  <style>
    .display { font-family: 'Spectral', 'Fraunces', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-emph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="72" class="mono" font-size="13" letter-spacing="3" fill="#B7332C">SCHÉMA 06 · LA BOUCLE</text>
  <text x="60" y="110" class="display" font-size="31" font-weight="600" fill="#1A1A1A">Ce qui transforme une dépense de mesure en <tspan font-style="italic">actif</tspan>.</text>
  <text x="60" y="141" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Le test identifie ce que le modèle ne peut pas identifier seul. Le modèle propage à tout le portefeuille.</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#E5E1D8" stroke-width="1"/>

  <text x="60" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">LE CYCLE</text>

  <!-- NŒUD A — expérience -->
  <g class="interactive" data-card="experience" tabindex="0" role="button" aria-label="L'expérience — détails">
    <rect x="170" y="230" width="200" height="76" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="190" y="256" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ÉTAPE 1</text>
    <text x="190" y="280" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'expérience</text>
    <text x="190" y="298" class="body" font-size="11.5" fill="#5A5A5A">précise, étroite, coûteuse</text>
  </g>

  <!-- NŒUD B — prior -->
  <g class="interactive" data-card="prior" tabindex="0" role="button" aria-label="Le prior calibré — détails">
    <rect x="470" y="230" width="200" height="76" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="490" y="256" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ÉTAPE 2</text>
    <text x="490" y="280" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le prior calibré</text>
    <text x="490" y="298" class="body" font-size="11.5" fill="#5A5A5A">posé directement sur le ROI [13]</text>
  </g>

  <!-- NŒUD C — modèle de mix -->
  <g class="interactive" data-card="mmm" tabindex="0" role="button" aria-label="Le modèle de mix média — détails">
    <rect x="470" y="430" width="200" height="76" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="490" y="456" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ÉTAPE 3</text>
    <text x="490" y="480" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le modèle de mix</text>
    <text x="490" y="498" class="body" font-size="11.5" fill="#5A5A5A">large, continu, sans coût de test</text>
  </g>

  <!-- NŒUD D — réallocation -->
  <g class="interactive" data-card="reallocation" tabindex="0" role="button" aria-label="La réallocation — détails">
    <rect x="170" y="430" width="200" height="76" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="190" y="456" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">ÉTAPE 4</text>
    <text x="190" y="480" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La réallocation</text>
    <text x="190" y="498" class="body" font-size="11.5" fill="#5A5A5A">et la question de test suivante</text>
  </g>

  <!-- flèches -->
  <line x1="372" y1="268" x2="456" y2="268" stroke="#B7332C" stroke-width="1.75" marker-end="url(#arrow-emph)"/>
  <line x1="570" y1="308" x2="570" y2="416" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="468" y1="468" x2="384" y2="468" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="428" x2="270" y2="320" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="420" y="258" class="body" font-size="11" fill="#B7332C" text-anchor="middle">calibre</text>
  <text x="586" y="368" class="body" font-size="11" fill="#5A5A5A">propage</text>
  <text x="420" y="458" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">arbitre</text>
  <text x="146" y="374" class="body" font-size="11" fill="#5A5A5A" text-anchor="end">réinterroge</text>

  <text x="60" y="548" class="body" font-size="12.5" fill="#5A5A5A">Sans l'étape 2, la valeur du test s'arrête à la seule décision qu'il a directement éclairée. Avec elle, le résultat devient une</text>
  <text x="60" y="567" class="body" font-size="12.5" fill="#5A5A5A">contrainte sur toute la surface d'allocation — y compris sur les canaux qui n'ont jamais été testés.</text>

  <!-- COLONNE DROITE -->
  <text x="720" y="196" class="mono" font-size="11" letter-spacing="2" fill="#5A5A5A">LES DEUX PRÉCAUTIONS ESCAMOTÉES</text>

  <g class="interactive" data-card="perimetre" tabindex="0" role="button" aria-label="La correspondance de périmètre — détails">
    <rect x="720" y="212" width="420" height="118" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="740" y="238" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">PRÉCAUTION 1</text>
    <text x="740" y="268" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La correspondance de périmètre</text>
    <text x="740" y="294" class="body" font-size="12" fill="#5A5A5A">Calibrer le rendement annuel d'un canal entier avec un test</text>
    <text x="740" y="311" class="body" font-size="12" fill="#5A5A5A">mené sur une sous-région, un format et une saison creuse,</text>
    <text x="740" y="323" class="body" font-size="12" font-style="italic" fill="#B7332C">c'est importer une précision qui n'existe pas.</text>
  </g>

  <g class="interactive" data-card="peremption" tabindex="0" role="button" aria-label="La péremption des résultats — détails">
    <rect x="720" y="346" width="420" height="118" rx="3" fill="#F6E7E3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="740" y="372" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">PRÉCAUTION 2</text>
    <text x="740" y="402" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La péremption</text>
    <text x="740" y="428" class="body" font-size="12" fill="#5A5A5A">Le mix concurrentiel change, les enchères des régies changent,</text>
    <text x="740" y="445" class="body" font-size="12" fill="#5A5A5A">le point de saturation se déplace. Un prior calibré sur un test</text>
    <text x="740" y="457" class="body" font-size="12" font-style="italic" fill="#B7332C">de dix-huit mois n'est pas une donnée, c'est un souvenir.</text>
  </g>

  <g class="interactive" data-card="faux-debat" tabindex="0" role="button" aria-label="Le faux débat MMM contre tests — détails">
    <rect x="720" y="480" width="420" height="118" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="740" y="506" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">CE QUI OCCUPE ENCORE DES COMITÉS EN 2026</text>
    <text x="740" y="536" class="display" font-size="19" font-weight="600" fill="#1A1A1A">« Modèle de mix <tspan font-style="italic">ou</tspan> tests ? »</text>
    <text x="740" y="562" class="body" font-size="12" fill="#5A5A5A">Les deux objets ne répondent pas à la même question. Le test</text>
    <text x="740" y="579" class="body" font-size="12" fill="#5A5A5A">identifie ; le modèle propage. Poser le « ou » est le symptôme</text>
    <text x="740" y="591" class="body" font-size="12" font-style="italic" fill="#B7332C">d'une organisation qui n'a pas encore construit la boucle.</text>
  </g>

  <!-- CADENCE -->
  <g class="interactive" data-card="cadence" tabindex="0" role="button" aria-label="La cadence annuelle — détails">
    <rect x="60" y="626" width="1080" height="116" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="80" y="652" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">LA CADENCE — SIX À DOUZE TESTS PAR AN, CHOISIS PAR LA DÉCISION QU'ILS ÉCLAIRENT</text>
    <rect x="80" y="668" width="248" height="54" rx="2" fill="#F6E7E3" stroke="#E0C9C2" stroke-width="1"/>
    <text x="96" y="690" class="mono" font-size="10" letter-spacing="1.5" fill="#B7332C">T1</text>
    <text x="96" y="710" class="body" font-size="12" fill="#1A1A1A">Le canal le plus doté</text>
    <rect x="342" y="668" width="248" height="54" rx="2" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="358" y="690" class="mono" font-size="10" letter-spacing="1.5" fill="#8A8579">T2</text>
    <text x="358" y="710" class="body" font-size="12" fill="#1A1A1A">Un canal de haut d'entonnoir</text>
    <rect x="604" y="668" width="248" height="54" rx="2" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="620" y="690" class="mono" font-size="10" letter-spacing="1.5" fill="#8A8579">T3</text>
    <text x="620" y="710" class="body" font-size="12" fill="#1A1A1A">Un test de croissance</text>
    <rect x="866" y="668" width="254" height="54" rx="2" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <text x="882" y="690" class="mono" font-size="10" letter-spacing="1.5" fill="#8A8579">T4</text>
    <text x="882" y="710" class="body" font-size="12" fill="#1A1A1A">Recalibrage avant la planification</text>
  </g>

  <line x1="60" y1="762" x2="1140" y2="762" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="782" class="mono" font-size="10.5" letter-spacing="1" fill="#8A8579">MÉCANIQUE DE CALIBRATION : SOURCE [13] · CADENCE : REPÈRE DE TERRAIN, PAS UNE NORME</text>
</svg>
