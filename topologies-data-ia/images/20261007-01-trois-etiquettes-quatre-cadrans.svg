<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Les trois topologies déclarées décomposées en quatre cadrans de décision : l'étiquette ne fixe aucun des quatre réglages">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover .hit { fill: #B7332C; fill-opacity: 0.045; }
  </style>
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#B7332C" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois étiquettes, quatre cadrans</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Les topologies vendues sont des préréglages. Elles ne fixent aucune des quatre décisions qui comptent.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- column headers -->
  <text x="94" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LA DÉCISION À PRENDRE</text>
  <text x="410" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">CENTRE D'EXCELLENCE</text>
  <text x="676" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">FÉDÉRÉ COHÉRENT</text>
  <text x="942" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">ÉQUIPES PRODUIT</text>
  <line x1="64" y1="212" x2="1136" y2="212" stroke="#B8B5AE" stroke-width="0.5"/>

  <!-- left label column : the four dials -->
  <g class="interactive" data-card="cadrans" tabindex="0" role="button" aria-label="Les quatre cadrans — cliquez pour les détails">
    <rect class="hit" x="64" y="222" width="300" height="300" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="222" width="4" height="300" fill="#B7332C"/>

    <text x="94" y="256" class="body" font-size="15" font-weight="600" fill="#1A1A1A">1 · Propriété du cas d'usage</text>
    <text x="94" y="276" class="body" font-size="12.5" fill="#5A5A5A">Qui voit son objectif bouger si ça échoue</text>
    <line x1="94" y1="292" x2="334" y2="292" stroke="#E5E1D8" stroke-width="0.5"/>

    <text x="94" y="326" class="body" font-size="15" font-weight="600" fill="#1A1A1A">2 · Plateforme</text>
    <text x="94" y="346" class="body" font-size="12.5" fill="#5A5A5A">Socle d'exécution, données, outils, traces</text>
    <line x1="94" y1="362" x2="334" y2="362" stroke="#E5E1D8" stroke-width="0.5"/>

    <text x="94" y="396" class="body" font-size="15" font-weight="600" fill="#1A1A1A">3 · Norme opposable</text>
    <text x="94" y="416" class="body" font-size="12.5" fill="#5A5A5A">Seuils, traçabilité, paliers d'autonomie</text>
    <line x1="94" y1="432" x2="334" y2="432" stroke="#E5E1D8" stroke-width="0.5"/>

    <text x="94" y="466" class="body" font-size="15" font-weight="600" fill="#1A1A1A">4 · Budget</text>
    <text x="94" y="486" class="body" font-size="12.5" fill="#5A5A5A">Où le coût apparaît pour le demandeur</text>
    <text x="94" y="508" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#B7332C">CLIQUEZ · 2⁴ = 16 COMBINAISONS</text>
  </g>

  <!-- preset A : centre d'excellence -->
  <g class="interactive" data-card="coe" tabindex="0" role="button" aria-label="Centre d'excellence — cliquez pour les détails">
    <rect class="hit" x="380" y="222" width="250" height="300" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="410" y="262" class="mono" font-size="13" font-weight="600" fill="#1F5560">CENTRALE</text>
    <line x1="410" y1="292" x2="600" y2="292" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="410" y="332" class="mono" font-size="13" font-weight="600" fill="#1F5560">CENTRALE</text>
    <line x1="410" y1="362" x2="600" y2="362" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="410" y="402" class="mono" font-size="13" font-weight="600" fill="#1F5560">CENTRALE</text>
    <line x1="410" y1="432" x2="600" y2="432" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="410" y="472" class="mono" font-size="13" font-weight="600" fill="#1F5560">CENTRAL</text>
    <text x="410" y="500" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Mutualise une compétence rare</text>
  </g>

  <!-- preset B : fédéré cohérent -->
  <g class="interactive" data-card="federe" tabindex="0" role="button" aria-label="Fédéré cohérent — cliquez pour les détails">
    <rect class="hit" x="646" y="222" width="250" height="300" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.5"/>
    <text x="676" y="262" class="mono" font-size="13" font-weight="600" fill="#B7332C">LOCALE</text>
    <line x1="676" y1="292" x2="866" y2="292" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="676" y="332" class="mono" font-size="13" font-weight="600" fill="#1F5560">CENTRALE</text>
    <text x="676" y="350" class="body" font-size="11.5" font-style="italic" fill="#B58A2C">en mode service</text>
    <line x1="676" y1="362" x2="866" y2="362" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="676" y="402" class="mono" font-size="13" font-weight="600" fill="#1F5560">CENTRALE</text>
    <line x1="676" y1="432" x2="866" y2="432" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="676" y="472" class="mono" font-size="13" font-weight="600" fill="#B7332C">LOCAL</text>
    <text x="676" y="500" class="body" font-size="12" font-style="italic" fill="#B58A2C">Le seul réglage qui tienne</text>
  </g>

  <!-- preset C : équipes produit -->
  <g class="interactive" data-card="produit" tabindex="0" role="button" aria-label="Équipes produit autonomes — cliquez pour les détails">
    <rect class="hit" x="912" y="222" width="224" height="300" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="942" y="262" class="mono" font-size="13" font-weight="600" fill="#B7332C">LOCALE</text>
    <line x1="942" y1="292" x2="1106" y2="292" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="942" y="332" class="mono" font-size="13" font-weight="600" fill="#B7332C">LOCALE</text>
    <line x1="942" y1="362" x2="1106" y2="362" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="942" y="402" class="mono" font-size="13" font-weight="600" fill="#B7332C">LOCALE</text>
    <line x1="942" y1="432" x2="1106" y2="432" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="942" y="472" class="mono" font-size="13" font-weight="600" fill="#B7332C">LOCAL</text>
    <text x="942" y="500" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Duplique le socle</text>
  </g>

  <!-- the two measured variables -->
  <rect x="64" y="564" width="1072" height="166" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="94" y="598" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QUE L'ÉTIQUETTE NE DIT PAS, ET QUE LA RECHERCHE MESURE</text>

  <g>
    <rect x="94" y="616" width="470" height="92" rx="3" fill="#FFFFFF" stroke="#B8B5AE" stroke-width="0.5"/>
    <text x="118" y="646" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Facteur d'intersection organisationnelle</text>
    <text x="118" y="668" class="body" font-size="12.5" fill="#5A5A5A">Nombre d'organisations qui contribuent chacune</text>
    <text x="118" y="686" class="body" font-size="12.5" fill="#5A5A5A">pour plus de 10 % au même objet livrable.</text>
  </g>
  <g>
    <rect x="612" y="616" width="494" height="92" rx="3" fill="#FFFFFF" stroke="#B8B5AE" stroke-width="0.5"/>
    <text x="636" y="646" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Profondeur de la propriété</text>
    <text x="636" y="668" class="body" font-size="12.5" fill="#5A5A5A">Rang hiérarchique du responsable qui couvre</text>
    <text x="636" y="686" class="body" font-size="12.5" fill="#5A5A5A">75 % du travail effectué sur cet objet.</text>
  </g>

  <path d="M 505 530 C 505 546, 400 548, 400 612" fill="none" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#ar1)"/>
  <path d="M 771 530 C 771 546, 860 548, 860 612" fill="none" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#ar1)"/>

  <text x="64" y="766" class="body" font-size="13" fill="#5A5A5A">Un centre d'excellence peut produire un facteur d'intersection de 1 ou de 4. Un modèle fédéré aussi. Les trois préréglages occupent 3 des 16 combinaisons possibles ;</text>
  <text x="64" y="786" class="body" font-size="13" fill="#5A5A5A">les 13 autres se rencontrent tous les jours sans porter de nom, et c'est dans leurs incohérences que se logent les symptômes attribués au modèle affiché.</text>

  <text x="64" y="820" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">DÉCOMPOSITION PROPRE À CE DOSSIER ; VARIABLES MESURÉES D'APRÈS NAGAPPAN, MURPHY ET BASILI (ICSE 2008).</text>
</svg>
