<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-label="Les quatre cadrans de décision, ce que chaque position achète, et le mode d'interaction comme variable cachée du cadran plateforme">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover .hit { fill: #B7332C; fill-opacity: 0.045; }
  </style>

  <rect width="1200" height="920" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le tableau des quatre cadrans</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque cadran se règle seul. Ce que chaque position achète, et ce qu'elle coûte quand elle est mal placée.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- cadran 1 : propriété -->
  <g class="interactive" data-card="cadran-propriete" tabindex="0" role="button" aria-label="Cadran 1, la propriété — cliquez pour les détails">
    <rect class="hit" x="64" y="186" width="520" height="256" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="186" width="5" height="256" fill="#B7332C"/>
    <text x="94" y="216" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">CADRAN 1</text>
    <text x="94" y="246" class="display" font-size="21" font-weight="600" fill="#1A1A1A">La propriété du cas d'usage</text>
    <text x="94" y="270" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Qui voit son objectif annuel bouger si le cas d'usage échoue ?</text>

    <line x1="94" y1="298" x2="554" y2="298" stroke="#B8B5AE" stroke-width="2"/>
    <circle cx="94" cy="298" r="5" fill="#1F5560"/>
    <circle cx="554" cy="298" r="5" fill="#B7332C"/>
    <text x="94" y="320" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#1F5560">CENTRALE</text>
    <text x="554" y="320" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">LOCALE</text>

    <text x="94" y="352" class="body" font-size="13" fill="#1A1A1A">Centrale : une norme homogène, un seul interlocuteur.</text>
    <text x="94" y="374" class="body" font-size="13" fill="#1A1A1A">Locale : un arbitrage réel, une profondeur de propriété faible.</text>
    <line x1="94" y1="392" x2="554" y2="392" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="94" y="416" class="body" font-size="13" fill="#B7332C">Mal réglé : un propriétaire nominal, que rien n'engage.</text>
  </g>

  <!-- cadran 2 : plateforme -->
  <g class="interactive" data-card="cadran-plateforme" tabindex="0" role="button" aria-label="Cadran 2, la plateforme — cliquez pour les détails">
    <rect class="hit" x="616" y="186" width="520" height="256" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="616" y="186" width="5" height="256" fill="#B58A2C"/>
    <text x="646" y="216" class="mono" font-size="11" letter-spacing="0.09em" fill="#B58A2C">CADRAN 2</text>
    <text x="646" y="246" class="display" font-size="21" font-weight="600" fill="#1A1A1A">La plateforme</text>
    <text x="646" y="270" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Qui fournit le socle : exécution, données, outils, traces ?</text>

    <line x1="646" y1="298" x2="1106" y2="298" stroke="#B8B5AE" stroke-width="2"/>
    <circle cx="646" cy="298" r="5" fill="#1F5560"/>
    <circle cx="1106" cy="298" r="5" fill="#B7332C"/>
    <text x="646" y="320" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#1F5560">CENTRALE</text>
    <text x="1106" y="320" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">LOCALE</text>

    <text x="646" y="352" class="body" font-size="13" fill="#1A1A1A">Centrale : un socle unique, une couche sémantique partagée.</text>
    <text x="646" y="374" class="body" font-size="13" fill="#1A1A1A">Locale : une autonomie totale, n socles à financer.</text>
    <line x1="646" y1="392" x2="1106" y2="392" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="646" y="416" class="body" font-size="13" fill="#B58A2C">Ce cadran a un second réglage, souvent ignoré : voir en bas.</text>
  </g>

  <!-- cadran 3 : norme -->
  <g class="interactive" data-card="cadran-norme" tabindex="0" role="button" aria-label="Cadran 3, la norme — cliquez pour les détails">
    <rect class="hit" x="64" y="472" width="520" height="256" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="472" width="5" height="256" fill="#1F5560"/>
    <text x="94" y="502" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">CADRAN 3</text>
    <text x="94" y="532" class="display" font-size="21" font-weight="600" fill="#1A1A1A">La norme opposable</text>
    <text x="94" y="556" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Qui fixe seuils d'évaluation, traçabilité, paliers d'autonomie ?</text>

    <line x1="94" y1="584" x2="554" y2="584" stroke="#B8B5AE" stroke-width="2"/>
    <circle cx="94" cy="584" r="5" fill="#1F5560"/>
    <circle cx="554" cy="584" r="5" fill="#B7332C"/>
    <text x="94" y="606" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#1F5560">CENTRALE</text>
    <text x="554" y="606" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">LOCALE</text>

    <text x="94" y="638" class="body" font-size="13" fill="#1A1A1A">Centrale : une comparabilité entre cas d'usage et dans le temps.</text>
    <text x="94" y="660" class="body" font-size="13" fill="#1A1A1A">Locale : une norme adaptée au métier, incomparable d'un métier à l'autre.</text>
    <line x1="94" y1="678" x2="554" y2="678" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="94" y="702" class="body" font-size="13" fill="#B7332C">Mal réglé : centralisée sans la plateforme qui la rend applicable.</text>
  </g>

  <!-- cadran 4 : budget -->
  <g class="interactive" data-card="cadran-budget" tabindex="0" role="button" aria-label="Cadran 4, le budget — cliquez pour les détails">
    <rect class="hit" x="616" y="472" width="520" height="256" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="616" y="472" width="5" height="256" fill="#B7332C"/>
    <text x="646" y="502" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">CADRAN 4</text>
    <text x="646" y="532" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le budget</text>
    <text x="646" y="556" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">À quel point de consommation le coût apparaît-il ?</text>

    <line x1="646" y1="584" x2="1106" y2="584" stroke="#B8B5AE" stroke-width="2"/>
    <circle cx="646" cy="584" r="5" fill="#1F5560"/>
    <circle cx="1106" cy="584" r="5" fill="#B7332C"/>
    <text x="646" y="606" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#1F5560">LIGNE CENTRALE</text>
    <text x="1106" y="606" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">REFACTURÉ</text>

    <text x="646" y="638" class="body" font-size="13" fill="#1A1A1A">Ligne centrale : aucun frein à la demande, donc une demande infinie.</text>
    <text x="646" y="660" class="body" font-size="13" fill="#1A1A1A">Refacturé : une demande solvable, arbitrée contre autre chose.</text>
    <line x1="646" y1="678" x2="1106" y2="678" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="646" y="702" class="body" font-size="13" fill="#B7332C">Le cadran le plus oublié, et le plus déterminant.</text>
  </g>

  <!-- the hidden sub-dial : interaction mode -->
  <rect x="64" y="758" width="1072" height="112" rx="3" fill="#F2EFE7" stroke="#B58A2C" stroke-width="1.5"/>
  <text x="94" y="790" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">LE SECOND RÉGLAGE DU CADRAN 2 — LE MODE D'INTERACTION</text>

  <g>
    <rect x="94" y="802" width="330" height="48" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <text x="114" y="822" class="body" font-size="13" font-weight="600" fill="#1F5560">Mode service</text>
    <text x="114" y="840" class="body" font-size="12" fill="#5A5A5A">Se consomme sans réunion. Intersection = 1.</text>
  </g>
  <g>
    <rect x="440" y="802" width="330" height="48" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25"/>
    <text x="460" y="822" class="body" font-size="13" font-weight="600" fill="#B7332C">Collaboration permanente</text>
    <text x="460" y="840" class="body" font-size="12" fill="#5A5A5A">Un échange par usage. Intersection ≥ 2.</text>
  </g>
  <g>
    <rect x="786" y="802" width="320" height="48" rx="3" fill="#FFFFFF" stroke="#B8B5AE" stroke-width="0.5"/>
    <text x="806" y="822" class="body" font-size="13" font-weight="600" fill="#5A5A5A">Facilitation</text>
    <text x="806" y="840" class="body" font-size="12" fill="#5A5A5A">Transitoire par construction.</text>
  </g>

  <text x="64" y="898" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">MODES D'INTERACTION D'APRÈS SKELTON ET PAIS, TEAM TOPOLOGIES. DÉCOMPOSITION EN QUATRE CADRANS PROPRE À CE DOSSIER.</text>
</svg>
