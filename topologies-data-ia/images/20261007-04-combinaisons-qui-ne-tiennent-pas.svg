<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" role="img" aria-label="Quatre réglages incohérents des cadrans, leur signature observable, et le diagnostic erroné qu'on leur applique">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover .hit { fill: #B7332C; fill-opacity: 0.045; }
  </style>

  <rect width="1200" height="930" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Les combinaisons qui ne tiennent pas</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque incohérence produit une signature observable, et reçoit un diagnostic qui visera le mauvais cadran.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LE RÉGLAGE</text>
  <text x="474" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LA SIGNATURE OBSERVABLE</text>
  <text x="844" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LE DIAGNOSTIC QU'ON PORTE À TORT</text>
  <line x1="64" y1="206" x2="1136" y2="206" stroke="#B8B5AE" stroke-width="0.5"/>

  <!-- legend for the dial strip -->
  <text x="94" y="228" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">P = PROPRIÉTÉ · PL = PLATEFORME · N = NORME · B = BUDGET</text>
  <g>
    <rect x="520" y="218" width="12" height="12" fill="#1F5560"/>
    <text x="540" y="228" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">CENTRAL</text>
    <rect x="628" y="218" width="12" height="12" fill="#B7332C"/>
    <text x="648" y="228" class="mono" font-size="9.5" letter-spacing="0.08em" fill="#8A8478">LOCAL</text>
  </g>

  <!-- row 1 : la file d'attente -->
  <g class="interactive" data-card="file-attente" tabindex="0" role="button" aria-label="Le service gratuit et sa file d'attente — cliquez pour les détails">
    <rect class="hit" x="64" y="244" width="1072" height="156" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="244" width="5" height="156" fill="#B7332C"/>
    <text x="94" y="276" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">INCOHÉRENCE A</text>
    <text x="94" y="306" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le service gratuit</text>
    <g>
      <rect x="94" y="324" width="30" height="30" rx="2" fill="#1F5560"/><text x="109" y="344" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">P</text>
      <rect x="130" y="324" width="30" height="30" rx="2" fill="#1F5560"/><text x="145" y="344" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle">PL</text>
      <rect x="166" y="324" width="30" height="30" rx="2" fill="#1F5560"/><text x="181" y="344" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">N</text>
      <rect x="202" y="324" width="30" height="30" rx="2" fill="#1F5560"/><text x="217" y="344" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">B</text>
    </g>
    <text x="94" y="378" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Tout central, demande locale libre</text>

    <text x="474" y="276" class="body" font-size="13" fill="#1A1A1A">Un coût invisible chez le demandeur, donc</text>
    <text x="474" y="296" class="body" font-size="13" fill="#1A1A1A">une demande que rien n'arbitre. Les délais</text>
    <text x="474" y="316" class="body" font-size="13" fill="#1A1A1A">d'attente se comptent en trimestres, et les</text>
    <text x="474" y="336" class="body" font-size="13" fill="#1A1A1A">entités construisent ailleurs.</text>
    <text x="474" y="370" class="mono" font-size="11.5" fill="#B7332C">INTERSECTION 1 · PROFONDEUR FAIBLE · FILE SATURÉE</text>

    <text x="844" y="276" class="body" font-size="13" fill="#5A5A5A">« L'équipe centrale manque</text>
    <text x="844" y="296" class="body" font-size="13" fill="#5A5A5A">de moyens. »</text>
    <line x1="844" y1="314" x2="1106" y2="314" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="844" y="340" class="body" font-size="13" font-weight="600" fill="#B7332C">Cadran en cause : budget.</text>
    <text x="844" y="362" class="body" font-size="12.5" fill="#1A1A1A">Ajouter des moyens à service</text>
    <text x="844" y="380" class="body" font-size="12.5" fill="#1A1A1A">gratuit déplace la file.</text>
  </g>

  <!-- row 2 : le veto central -->
  <g class="interactive" data-card="veto-central" tabindex="0" role="button" aria-label="Le droit de veto central — cliquez pour les détails">
    <rect class="hit" x="64" y="412" width="1072" height="156" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="64" y="412" width="5" height="156" fill="#B7332C"/>
    <text x="94" y="444" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">INCOHÉRENCE B · LA PLUS COÛTEUSE</text>
    <text x="94" y="474" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le droit de veto</text>
    <g>
      <rect x="94" y="492" width="30" height="30" rx="2" fill="#B7332C"/><text x="109" y="512" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">P</text>
      <rect x="130" y="492" width="30" height="30" rx="2" fill="#B7332C"/><text x="145" y="512" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle">PL</text>
      <rect x="166" y="492" width="30" height="30" rx="2" fill="#1F5560"/><text x="181" y="512" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">N</text>
      <rect x="202" y="492" width="30" height="30" rx="2" fill="#B7332C"/><text x="217" y="512" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">B</text>
    </g>
    <text x="94" y="546" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Norme centrale sans plateforme</text>

    <text x="474" y="444" class="body" font-size="13" fill="#1A1A1A">Le centre n'a ni le socle, ni la connaissance</text>
    <text x="474" y="464" class="body" font-size="13" fill="#1A1A1A">du cas d'usage, ni la responsabilité du</text>
    <text x="474" y="484" class="body" font-size="13" fill="#1A1A1A">résultat. Rien qu'un droit de veto sur chaque</text>
    <text x="474" y="504" class="body" font-size="13" fill="#1A1A1A">mise en service.</text>
    <text x="474" y="538" class="mono" font-size="11.5" fill="#B7332C">INTERSECTION 2 · PROFONDEUR ÉLEVÉE · LES DEUX AU PIRE</text>

    <text x="844" y="444" class="body" font-size="13" fill="#5A5A5A">« La gouvernance est trop</text>
    <text x="844" y="464" class="body" font-size="13" fill="#5A5A5A">lourde. »</text>
    <line x1="844" y1="482" x2="1106" y2="482" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="844" y="508" class="body" font-size="13" font-weight="600" fill="#B7332C">Cadran en cause : plateforme.</text>
    <text x="844" y="530" class="body" font-size="12.5" fill="#1A1A1A">La norme a été centralisée sans</text>
    <text x="844" y="548" class="body" font-size="12.5" fill="#1A1A1A">ce qui la rend applicable.</text>
  </g>

  <!-- row 3 : plateformes dupliquées -->
  <g class="interactive" data-card="plateformes-dupliquees" tabindex="0" role="button" aria-label="Les plateformes dupliquées — cliquez pour les détails">
    <rect class="hit" x="64" y="580" width="1072" height="156" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="580" width="5" height="156" fill="#B58A2C"/>
    <text x="94" y="612" class="mono" font-size="11" letter-spacing="0.09em" fill="#B58A2C">INCOHÉRENCE C</text>
    <text x="94" y="642" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Les n glossaires</text>
    <g>
      <rect x="94" y="660" width="30" height="30" rx="2" fill="#B7332C"/><text x="109" y="680" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">P</text>
      <rect x="130" y="660" width="30" height="30" rx="2" fill="#B7332C"/><text x="145" y="680" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle">PL</text>
      <rect x="166" y="660" width="30" height="30" rx="2" fill="#B7332C"/><text x="181" y="680" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">N</text>
      <rect x="202" y="660" width="30" height="30" rx="2" fill="#B7332C"/><text x="217" y="680" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">B</text>
    </g>
    <text x="94" y="714" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Tout local, plateforme comprise</text>

    <text x="474" y="612" class="body" font-size="13" fill="#1A1A1A">Les coûts dupliqués se voient et se chiffrent.</text>
    <text x="474" y="632" class="body" font-size="13" fill="#1A1A1A">La première victime est ailleurs : la couche</text>
    <text x="474" y="652" class="body" font-size="13" fill="#1A1A1A">sémantique, dont l'intérêt vient de ce que</text>
    <text x="474" y="672" class="body" font-size="13" fill="#1A1A1A">tout le monde s'y réfère.</text>
    <text x="474" y="706" class="mono" font-size="11.5" fill="#B58A2C">INTERSECTION 1 PAR ENTITÉ · AUCUN ACTIF PARTAGÉ</text>

    <text x="844" y="612" class="body" font-size="13" fill="#5A5A5A">« Il nous manque un outil de</text>
    <text x="844" y="632" class="body" font-size="13" fill="#5A5A5A">catalogue. »</text>
    <line x1="844" y1="650" x2="1106" y2="650" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="844" y="676" class="body" font-size="13" font-weight="600" fill="#B58A2C">Cadran en cause : plateforme.</text>
    <text x="844" y="698" class="body" font-size="12.5" fill="#1A1A1A">Aucun outil ne répare quatre</text>
    <text x="844" y="716" class="body" font-size="12.5" fill="#1A1A1A">définitions divergentes.</text>
  </g>

  <!-- row 4 : le réglage cohérent -->
  <g class="interactive" data-card="coherente" tabindex="0" role="button" aria-label="Le réglage cohérent — cliquez pour les détails">
    <rect class="hit" x="64" y="748" width="1072" height="140" rx="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="64" y="748" width="5" height="140" fill="#E8B84B"/>
    <text x="94" y="780" class="mono" font-size="11" letter-spacing="0.09em" fill="#E8B84B">LE SEUL RÉGLAGE QUI TIENNE</text>
    <text x="94" y="810" class="display" font-size="20" font-weight="600" fill="#FAF8F3">Le fédéré cohérent</text>
    <g>
      <rect x="94" y="828" width="30" height="30" rx="2" fill="#B7332C"/><text x="109" y="848" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">P</text>
      <rect x="130" y="828" width="30" height="30" rx="2" fill="#4A8F9E"/><text x="145" y="848" class="mono" font-size="11" fill="#1A1A1A" text-anchor="middle">PL</text>
      <rect x="166" y="828" width="30" height="30" rx="2" fill="#4A8F9E"/><text x="181" y="848" class="mono" font-size="12" fill="#1A1A1A" text-anchor="middle">N</text>
      <rect x="202" y="828" width="30" height="30" rx="2" fill="#B7332C"/><text x="217" y="848" class="mono" font-size="12" fill="#FAF8F3" text-anchor="middle">B</text>
    </g>

    <text x="474" y="780" class="body" font-size="13" fill="#FAF8F3">Le propriétaire métier décide, paie, et arbitre</text>
    <text x="474" y="800" class="body" font-size="13" fill="#FAF8F3">donc réellement. Le centre fournit un socle en</text>
    <text x="474" y="820" class="body" font-size="13" fill="#FAF8F3">mode service et une norme opposable qui</text>
    <text x="474" y="840" class="body" font-size="13" fill="#FAF8F3">s'applique sans validation au cas par cas.</text>
    <text x="474" y="872" class="mono" font-size="11.5" fill="#E8B84B">INTERSECTION 1 · PROFONDEUR FAIBLE</text>

    <text x="844" y="780" class="body" font-size="13" fill="#C9C3B6">Aucun diagnostic à porter.</text>
    <line x1="844" y1="798" x2="1106" y2="798" stroke="#3A3A3A" stroke-width="0.5"/>
    <text x="844" y="824" class="body" font-size="13" font-weight="600" fill="#E8B84B">Le plus rare des quatre.</text>
    <text x="844" y="846" class="body" font-size="12.5" fill="#C9C3B6">Il demande au centre de céder le</text>
    <text x="844" y="864" class="body" font-size="12.5" fill="#C9C3B6">droit de regard qu'il croit être</text>
    <text x="844" y="882" class="body" font-size="12.5" fill="#C9C3B6">sa raison d'être.</text>
  </g>

  <text x="64" y="918" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">GRILLE PROPRE À CE DOSSIER. AUCUNE DES QUATRE LIGNES NE DÉCRIT UNE FAUTE DE COMPÉTENCE.</text>
</svg>
