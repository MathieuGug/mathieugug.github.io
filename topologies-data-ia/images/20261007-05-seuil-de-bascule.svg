<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Le seuil de bascule entre mutualisation et décentralisation, fonction de la continuité de la demande par entité et non de la maturité">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover .hit { fill: #B7332C; fill-opacity: 0.05; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le seuil de bascule n'est pas la maturité</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La mutualisation paie tant que la demande est sporadique. Elle cesse de payer quand elle devient continue.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- plot frame -->
  <text x="120" y="194" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">VALEUR POUR L'ENTITÉ</text>
  <line x1="120" y1="220" x2="120" y2="566" stroke="#1A1A1A" stroke-width="1.25"/>
  <line x1="120" y1="566" x2="724" y2="566" stroke="#1A1A1A" stroke-width="1.25"/>

  <!-- gridlines -->
  <line x1="236" y1="228" x2="236" y2="566" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="468" y1="228" x2="468" y2="566" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="584" y1="228" x2="584" y2="566" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="700" y1="228" x2="700" y2="566" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- x ticks -->
  <text x="120" y="588" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">0</text>
  <text x="236" y="588" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">0,5</text>
  <text x="352" y="588" class="mono" font-size="11" font-weight="600" fill="#B7332C" text-anchor="middle">1</text>
  <text x="468" y="588" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">1,5</text>
  <text x="584" y="588" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">2</text>
  <text x="700" y="588" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">2,5</text>
  <text x="422" y="614" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">ÉQUIVALENTS TEMPS PLEIN DE DEMANDE PERMANENTE, PAR ENTITÉ</text>

  <!-- curves -->
  <path d="M 155 250 C 220 290, 280 350, 352 390 C 420 428, 520 480, 700 515" fill="none" stroke="#1F5560" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 155 545 C 230 538, 290 480, 352 390 C 400 322, 500 265, 700 238" fill="none" stroke="#B7332C" stroke-width="2.5" stroke-linecap="round"/>

  <text x="166" y="238" class="body" font-size="13" font-weight="600" fill="#1F5560">Gain de la mutualisation</text>
  <text x="594" y="228" class="body" font-size="13" font-weight="600" fill="#B7332C" text-anchor="end">Coût de l'attente</text>

  <!-- threshold -->
  <line x1="352" y1="228" x2="352" y2="566" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 4"/>
  <circle cx="352" cy="390" r="6" fill="#FAF8F3" stroke="#B7332C" stroke-width="2.5"/>

  <!-- clickable halves -->
  <g class="interactive" data-card="sporadique" tabindex="0" role="button" aria-label="La demande sporadique — cliquez pour les détails">
    <rect class="hit" x="121" y="228" width="230" height="338" fill="#1F5560" fill-opacity="0.03"/>
    <text x="236" y="454" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560" text-anchor="middle">DEMANDE SPORADIQUE</text>
    <text x="236" y="478" class="body" font-size="12.5" fill="#1F5560" text-anchor="middle">La mutualisation paie</text>
    <text x="236" y="500" class="body" font-size="12" font-style="italic" fill="#5A5A5A" text-anchor="middle">Quatre entités financent</text>
    <text x="236" y="518" class="body" font-size="12" font-style="italic" fill="#5A5A5A" text-anchor="middle">un spécialiste à elles quatre</text>
  </g>
  <g class="interactive" data-card="continue" tabindex="0" role="button" aria-label="La demande continue — cliquez pour les détails">
    <rect class="hit" x="353" y="228" width="347" height="338" fill="#B7332C" fill-opacity="0.03"/>
    <text x="540" y="320" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C" text-anchor="middle">DEMANDE CONTINUE</text>
    <text x="540" y="344" class="body" font-size="12.5" fill="#B7332C" text-anchor="middle">La file ne mutualise plus, elle ordonne</text>
    <text x="540" y="368" class="body" font-size="12" font-style="italic" fill="#5A5A5A" text-anchor="middle">Les deux derniers points de charge coûtent</text>
    <text x="540" y="386" class="body" font-size="12" font-style="italic" fill="#5A5A5A" text-anchor="middle">plus d'attente que les quarante premiers</text>
  </g>

  <text x="352" y="214" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C" text-anchor="middle">SEUIL</text>

  <!-- right panel : the rule -->
  <g class="interactive" data-card="seuil-etp" tabindex="0" role="button" aria-label="La règle de décision chiffrable — cliquez pour les détails">
    <rect class="hit" x="760" y="186" width="376" height="238" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="760" y="186" width="376" height="5" fill="#B7332C"/>
    <text x="786" y="224" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">LA RÈGLE QUI REMPLACE LA MATURITÉ</text>
    <text x="786" y="258" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Compter, par entité,</text>
    <text x="786" y="284" class="display" font-size="21" font-weight="600" fill="#1A1A1A">la demande permanente</text>
    <text x="786" y="318" class="body" font-size="12.5" fill="#5A5A5A">Le volume de travail data et IA qu'elle aurait</text>
    <text x="786" y="336" class="body" font-size="12.5" fill="#5A5A5A">à confier de façon continue, et non en pics.</text>
    <text x="786" y="366" class="body" font-size="13" fill="#1A1A1A">Au-delà d'environ un équivalent temps plein,</text>
    <text x="786" y="384" class="body" font-size="13" fill="#1A1A1A">la mutualisation cesse de payer pour cette</text>
    <text x="786" y="402" class="body" font-size="13" font-weight="600" fill="#B7332C">entité, et pour elle seule.</text>
  </g>

  <!-- right panel : two consequences -->
  <rect x="760" y="440" width="376" height="188" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="786" y="472" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">DEUX CONSÉQUENCES</text>
  <text x="786" y="502" class="body" font-size="13" font-weight="600" fill="#1A1A1A">1 · La bascule se fait entité par entité</text>
  <text x="786" y="522" class="body" font-size="12.5" fill="#5A5A5A">Sur six divisions, deux dépasseront le seuil et</text>
  <text x="786" y="540" class="body" font-size="12.5" fill="#5A5A5A">quatre resteront servies par le centre.</text>
  <text x="786" y="574" class="body" font-size="13" font-weight="600" fill="#1A1A1A">2 · Le seuil se franchit dans les deux sens</text>
  <text x="786" y="594" class="body" font-size="12.5" fill="#5A5A5A">Une division qui perd son flux continu redevient</text>
  <text x="786" y="612" class="body" font-size="12.5" fill="#5A5A5A">candidate à la mutualisation.</text>

  <!-- bottom band : the maturity error -->
  <g class="interactive" data-card="erreur-maturite" tabindex="0" role="button" aria-label="L'erreur de la progression par maturité — cliquez pour les détails">
    <rect class="hit" x="64" y="658" width="1072" height="126" rx="3" fill="#1A1A1A"/>
    <rect x="64" y="658" width="5" height="126" fill="#E8B84B"/>
    <text x="94" y="690" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">CE QUE LA PROGRESSION PAR MATURITÉ FAIT MANQUER</text>
    <text x="94" y="722" class="display" font-size="20" font-weight="600" fill="#FAF8F3">« On commence en centre d'excellence, on passe au fédéré quand on mûrit, on finit en équipes produit. »</text>
    <text x="94" y="752" class="body" font-size="13" fill="#C9C3B6">La variable explicative est fausse. Elle fait basculer tout le monde en même temps, là où il fallait basculer deux divisions sur six ;</text>
    <text x="94" y="772" class="body" font-size="13" fill="#C9C3B6">et elle présente la remutualisation comme une régression, ce qui interdit le geste utile quand un flux continu se tarit.</text>
  </g>

  <text x="64" y="824" class="body" font-size="13" fill="#5A5A5A">Un métier qui attend deux trimestres reformule son besoin en fonction de ce qu'il croit obtenable : l'attente dégrade aussi la qualité de la demande.</text>

  <text x="64" y="862" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">COURBES SCHÉMATIQUES, NON MESURÉES : LE SEUIL D'UN ÉQUIVALENT TEMPS PLEIN EST UN ORDRE DE GRANDEUR DÉRIVÉ DU RAISONNEMENT DE FILE D'ATTENTE, À RECALIBRER LOCALEMENT.</text>
</svg>
