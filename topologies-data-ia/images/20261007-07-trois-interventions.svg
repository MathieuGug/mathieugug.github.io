<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Trois interventions sur une topologie, rangées par coût, réversibilité et délai avant effet mesurable">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover .hit { fill: #B7332C; fill-opacity: 0.045; }
  </style>

  <rect width="1200" height="820" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois interventions, trois coûts</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Réorganiser dégrade la qualité de façon documentée. Ce qui disqualifie le geste le plus souvent choisi.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- 1 : tourner un cadran -->
  <g class="interactive" data-card="tourner" tabindex="0" role="button" aria-label="Tourner un cadran — cliquez pour les détails">
    <rect class="hit" x="64" y="186" width="340" height="406" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="186" width="340" height="5" fill="#1F5560"/>
    <text x="90" y="224" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">INTERVENTION 1</text>
    <text x="90" y="256" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Tourner un cadran</text>

    <line x1="90" y1="278" x2="378" y2="278" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="90" y="300" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">COÛT</text>
    <rect x="90" y="310" width="48" height="8" fill="#1F5560"/><rect x="142" y="310" width="236" height="8" fill="#E5E1D8"/>
    <text x="90" y="340" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">RÉVERSIBILITÉ</text>
    <rect x="90" y="350" width="268" height="8" fill="#1F5560"/><rect x="362" y="350" width="16" height="8" fill="#E5E1D8"/>
    <text x="90" y="380" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">DÉLAI AVANT EFFET MESURABLE</text>
    <text x="90" y="402" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Un à deux trimestres</text>

    <line x1="90" y1="420" x2="378" y2="420" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="90" y="444" class="body" font-size="12.5" fill="#5A5A5A">Refacturer la plateforme aux entités.</text>
    <text x="90" y="464" class="body" font-size="12.5" fill="#5A5A5A">Imposer le mode service au centre.</text>
    <text x="90" y="484" class="body" font-size="12.5" fill="#5A5A5A">Remonter d'un niveau le propriétaire.</text>
    <text x="90" y="504" class="body" font-size="12.5" fill="#5A5A5A">Sortir le jeu d'évaluation d'une entité.</text>

    <text x="90" y="542" class="body" font-size="13" fill="#1F5560">Une seule variable change, les équipes</text>
    <text x="90" y="560" class="body" font-size="13" fill="#1F5560">restent en place, aucun organigramme.</text>
    <text x="90" y="582" class="mono" font-size="11" letter-spacing="0.08em" fill="#1F5560">LE GESTE DE PREMIER RECOURS</text>
  </g>

  <!-- 2 : changer de modèle -->
  <g class="interactive" data-card="changer" tabindex="0" role="button" aria-label="Changer de modèle — cliquez pour les détails">
    <rect class="hit" x="430" y="186" width="340" height="406" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="430" y="186" width="340" height="5" fill="#B58A2C"/>
    <text x="456" y="224" class="mono" font-size="11" letter-spacing="0.09em" fill="#B58A2C">INTERVENTION 2</text>
    <text x="456" y="256" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Changer de modèle</text>

    <line x1="456" y1="278" x2="744" y2="278" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="456" y="300" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">COÛT</text>
    <rect x="456" y="310" width="236" height="8" fill="#B58A2C"/><rect x="696" y="310" width="48" height="8" fill="#E5E1D8"/>
    <text x="456" y="340" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">RÉVERSIBILITÉ</text>
    <rect x="456" y="350" width="62" height="8" fill="#B58A2C"/><rect x="522" y="350" width="222" height="8" fill="#E5E1D8"/>
    <text x="456" y="380" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">DÉLAI AVANT EFFET MESURABLE</text>
    <text x="456" y="402" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Plusieurs trimestres</text>

    <line x1="456" y1="420" x2="744" y2="420" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="456" y="444" class="body" font-size="12.5" fill="#5A5A5A">Les quatre cadrans bougent ensemble,</text>
    <text x="456" y="464" class="body" font-size="12.5" fill="#5A5A5A">et les personnes changent de place.</text>
    <text x="456" y="492" class="body" font-size="12.5" fill="#B7332C">La proximité d'un changement</text>
    <text x="456" y="510" class="body" font-size="12.5" fill="#B7332C">d'organisation va avec une baisse de</text>
    <text x="456" y="528" class="body" font-size="12.5" fill="#B7332C">qualité ; l'effet du nouveau réglage</text>
    <text x="456" y="546" class="body" font-size="12.5" fill="#B7332C">n'est lisible qu'après résorption.</text>

    <text x="456" y="582" class="mono" font-size="11" letter-spacing="0.08em" fill="#B58A2C">JUSTIFIÉ SI PLUSIEURS CADRANS SONT LIÉS</text>
  </g>

  <!-- 3 : copier un modèle -->
  <g class="interactive" data-card="copier" tabindex="0" role="button" aria-label="Copier un modèle publié — cliquez pour les détails">
    <rect class="hit" x="796" y="186" width="340" height="406" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="796" y="186" width="340" height="5" fill="#B7332C"/>
    <text x="822" y="224" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">INTERVENTION 3</text>
    <text x="822" y="256" class="display" font-size="22" font-weight="600" fill="#1A1A1A">Copier un modèle</text>

    <line x1="822" y1="278" x2="1110" y2="278" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="822" y="300" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">COÛT</text>
    <rect x="822" y="310" width="268" height="8" fill="#B7332C"/><rect x="1094" y="310" width="16" height="8" fill="#E5E1D8"/>
    <text x="822" y="340" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">RÉVERSIBILITÉ</text>
    <rect x="822" y="350" width="40" height="8" fill="#B7332C"/><rect x="866" y="350" width="244" height="8" fill="#E5E1D8"/>
    <text x="822" y="380" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A8478">EFFET ATTENDU</text>
    <text x="822" y="402" class="body" font-size="13" font-weight="600" fill="#B7332C">Aucun</text>

    <line x1="822" y1="420" x2="1110" y2="420" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="822" y="444" class="body" font-size="12.5" fill="#5A5A5A">Le cas canonique : escouades, tribus,</text>
    <text x="822" y="464" class="body" font-size="12.5" fill="#5A5A5A">chapitres, guildes. Le modèle décrit en</text>
    <text x="822" y="484" class="body" font-size="12.5" fill="#5A5A5A">2012 relevait largement de l'aspiration.</text>
    <text x="822" y="512" class="body" font-size="12.5" fill="#1A1A1A">La copie reproduit le cadran propriété</text>
    <text x="822" y="530" class="body" font-size="12.5" fill="#1A1A1A">en position locale et laisse les trois</text>
    <text x="822" y="548" class="body" font-size="12.5" fill="#1A1A1A">autres indéterminés.</text>

    <text x="822" y="582" class="mono" font-size="11" letter-spacing="0.08em" fill="#B7332C">CE QUI MANQUAIT : LE MODE D'INTERACTION</text>
  </g>

  <!-- two rules -->
  <rect x="64" y="624" width="1072" height="124" rx="3" fill="#1A1A1A"/>
  <rect x="64" y="624" width="5" height="124" fill="#E8B84B"/>
  <text x="94" y="656" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">LES DEUX RÈGLES QUI EN DÉCOULENT</text>
  <text x="94" y="690" class="display" font-size="19" font-weight="600" fill="#FAF8F3">1 · Devant un symptôme d'organisation, chercher lequel des quatre cadrans est au mauvais réglage avant d'envisager un changement de modèle.</text>
  <text x="94" y="724" class="display" font-size="19" font-weight="600" fill="#FAF8F3">2 · Ne jamais réorganiser et changer de plateforme la même année : les deux produisent de la volatilité, et l'effet observé devient inattribuable.</text>

  <text x="64" y="800" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">COÛT DE TRANSITION D'APRÈS MOCKUS (FSE 2010) ET SA RÉPLICATION SUR CHROME (2015) ; CAS DE LA COPIE DE FORME D'APRÈS JEREMIAH LEE (2020). RANGEMENT PROPRE À CE DOSSIER.</text>
</svg>
