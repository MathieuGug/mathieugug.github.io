<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Le déplacement de la ressource rare du constructeur vers le propriétaire-réviseur, et les deux cadrans qui bougent en conséquence">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover .hit { fill: #B7332C; fill-opacity: 0.045; }
  </style>
  <defs>
    <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#B7332C" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
    <marker id="ar6t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1F5560" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce que l'agentique déplace</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La construction s'automatise en partie. La supervision ne s'automatise pas. La ressource rare change de place.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- AVANT -->
  <g class="interactive" data-card="avant" tabindex="0" role="button" aria-label="L'équipe avant les agents — cliquez pour les détails">
    <rect class="hit" x="64" y="186" width="480" height="222" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="94" y="218" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">AVANT</text>
    <text x="94" y="250" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Huit à dix personnes</text>
    <g fill="#5A5A5A">
      <circle cx="106" cy="292" r="12"/><circle cx="140" cy="292" r="12"/><circle cx="174" cy="292" r="12"/>
      <circle cx="208" cy="292" r="12"/><circle cx="242" cy="292" r="12"/><circle cx="276" cy="292" r="12"/>
      <circle cx="310" cy="292" r="12"/><circle cx="344" cy="292" r="12"/><circle cx="378" cy="292" r="12"/>
    </g>
    <text x="94" y="342" class="body" font-size="13" fill="#5A5A5A">La capacité de construire est le facteur limitant.</text>
    <text x="94" y="364" class="body" font-size="13" fill="#5A5A5A">Un ingénieur de plus accroît le débit livré.</text>
    <text x="94" y="392" class="mono" font-size="11" letter-spacing="0.08em" fill="#1F5560">RESSOURCE RARE : LE CONSTRUCTEUR</text>
  </g>

  <path d="M 564 297 L 612 297" fill="none" stroke="#B7332C" stroke-width="2.5" marker-end="url(#ar6)"/>

  <!-- APRÈS -->
  <g class="interactive" data-card="apres" tabindex="0" role="button" aria-label="L'équipe hybride appuyée par des agents — cliquez pour les détails">
    <rect class="hit" x="636" y="186" width="500" height="222" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <text x="666" y="218" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">APRÈS</text>
    <text x="666" y="250" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Quatre à six, appuyées par des agents</text>
    <g fill="#1A1A1A">
      <circle cx="678" cy="292" r="12"/><circle cx="712" cy="292" r="12"/><circle cx="746" cy="292" r="12"/>
      <circle cx="780" cy="292" r="12"/><circle cx="814" cy="292" r="12"/>
    </g>
    <g fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5">
      <rect x="854" y="280" width="24" height="24" rx="2"/><rect x="890" y="280" width="24" height="24" rx="2"/>
      <rect x="926" y="280" width="24" height="24" rx="2"/><rect x="962" y="280" width="24" height="24" rx="2"/>
      <rect x="998" y="280" width="24" height="24" rx="2"/><rect x="1034" y="280" width="24" height="24" rx="2"/>
    </g>
    <text x="666" y="342" class="body" font-size="13" fill="#1A1A1A">Décider qu'une sortie est acceptable suppose</text>
    <text x="666" y="364" class="body" font-size="13" fill="#1A1A1A">la connaissance du métier, et ne se mutualise pas.</text>
    <text x="666" y="392" class="mono" font-size="11" letter-spacing="0.08em" fill="#B7332C">RESSOURCE RARE : LE PROPRIÉTAIRE-RÉVISEUR</text>
  </g>

  <text x="854" y="328" class="mono" font-size="10" letter-spacing="0.06em" fill="#8A8478">AGENTS</text>

  <!-- consequence band -->
  <rect x="64" y="438" width="1072" height="92" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="94" y="470" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">LA CONSÉQUENCE SUR LES CADRANS</text>
  <text x="94" y="504" class="display" font-size="20" font-weight="600" fill="#1A1A1A">La norme et l'évaluation remontent. La propriété et la décision descendent.</text>

  <!-- what moves up -->
  <g class="interactive" data-card="jeu-evaluation" tabindex="0" role="button" aria-label="Le jeu d'évaluation comme actif central — cliquez pour les détails">
    <rect class="hit" x="64" y="558" width="520" height="212" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="558" width="520" height="5" fill="#1F5560"/>
    <text x="94" y="596" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">CE QUI REMONTE VERS LE CENTRE</text>
    <text x="94" y="628" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le jeu d'évaluation</text>
    <path d="M 500 648 L 500 604" fill="none" stroke="#1F5560" stroke-width="2" marker-end="url(#ar6t)"/>
    <text x="94" y="660" class="body" font-size="13" fill="#5A5A5A">Non parce que le centre saurait mieux évaluer.</text>
    <text x="94" y="682" class="body" font-size="13" fill="#1A1A1A">Parce qu'un jeu d'évaluation n'a de valeur que s'il est</text>
    <text x="94" y="702" class="body" font-size="13" fill="#1A1A1A">comparable entre cas d'usage et stable dans le temps.</text>
    <text x="94" y="730" class="body" font-size="13" font-style="italic" fill="#1F5560">Reconstitué localement, il perd sa seule propriété utile.</text>
    <text x="94" y="756" class="mono" font-size="11" letter-spacing="0.08em" fill="#B7332C">FENÊTRE : LE PREMIER JOUR. ELLE SE REFERME.</text>
  </g>

  <!-- what moves down : article 26 -->
  <g class="interactive" data-card="article-26" tabindex="0" role="button" aria-label="L'article 26 et la borne de profondeur — cliquez pour les détails">
    <rect class="hit" x="616" y="558" width="520" height="212" rx="3" fill="#1A1A1A"/>
    <rect x="616" y="558" width="520" height="5" fill="#E8B84B"/>
    <text x="646" y="596" class="mono" font-size="11" letter-spacing="0.09em" fill="#E8B84B">CE QUI DESCEND, ET QUE LE DROIT VERROUILLE</text>
    <text x="646" y="628" class="display" font-size="21" font-weight="600" fill="#FAF8F3">L'autorité du propriétaire</text>
    <path d="M 1052 604 L 1052 648" fill="none" stroke="#E8B84B" stroke-width="2" marker-end="url(#ar6)"/>
    <text x="646" y="660" class="body" font-size="13" fill="#C9C3B6">Article 26 : la surveillance humaine est confiée à des</text>
    <text x="646" y="680" class="body" font-size="13" fill="#C9C3B6">personnes dotées de la compétence, de la formation</text>
    <text x="646" y="700" class="body" font-size="13" fill="#C9C3B6">et de l'<tspan font-weight="600" fill="#E8B84B">autorité</tspan> nécessaires.</text>
    <text x="646" y="730" class="body" font-size="13" font-style="italic" fill="#FAF8F3">Trois conditions de personne. Une condition d'organisation.</text>
    <text x="646" y="756" class="mono" font-size="11" letter-spacing="0.08em" fill="#E8B84B">UNE BORNE SUPÉRIEURE À LA PROFONDEUR DE PROPRIÉTÉ</text>
  </g>

  <text x="64" y="814" class="body" font-size="13" fill="#5A5A5A">L'autorité désigne ici la capacité de suspendre l'usage du système sans demander la permission à quelqu'un dont les objectifs dépendent du débit. Un propriétaire placé</text>
  <text x="64" y="834" class="body" font-size="13" fill="#5A5A5A">cinq niveaux sous la décision budgétaire ne l'a pas, quelle que soit la compétence qu'on lui reconnaît. Le réglage que l'agentique désigne est celui du schéma 04.</text>

  <text x="64" y="878" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">EFFECTIFS D'APRÈS MCKINSEY (5 OCTOBRE 2026) ; OBLIGATION D'APRÈS L'ARTICLE 26 DU RÈGLEMENT (UE) 2024/1689, CITÉ EN SUBSTANCE. LECTURE ORGANISATIONNELLE PROPRE À CE DOSSIER.</text>
</svg>
