<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Les huit métriques organisationnelles rangées par ce qu'une direction peut effectivement régler, avec le résultat nul géographique en contrepoint">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
    .interactive:hover .hit { fill: #B7332C; fill-opacity: 0.045; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce que la recherche mesure, et ce qu'on peut régler</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Huit métriques organisationnelles prédisent les défaillances mieux que le code. Deux seulement se décident.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">RÉGLABLE PAR DÉCISION EXPLICITE</text>

  <!-- DMO -->
  <g class="interactive" data-card="dmo" tabindex="0" role="button" aria-label="Profondeur de la propriété — cliquez pour les détails">
    <rect class="hit" x="64" y="204" width="636" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="204" width="5" height="86" fill="#B7332C"/>
    <text x="94" y="232" class="mono" font-size="11" letter-spacing="0.08em" fill="#B7332C">DMO</text>
    <text x="150" y="232" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Profondeur de la propriété</text>
    <text x="94" y="256" class="body" font-size="13" fill="#5A5A5A">Rang hiérarchique du responsable qui couvre 75 % du travail sur l'objet.</text>
    <text x="94" y="276" class="body" font-size="13" font-style="italic" fill="#1F5560">Se règle en remontant le propriétaire d'un niveau. Coût : une nomination.</text>
  </g>

  <!-- OIF -->
  <g class="interactive" data-card="oif" tabindex="0" role="button" aria-label="Facteur d'intersection organisationnelle — cliquez pour les détails">
    <rect class="hit" x="64" y="300" width="636" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="300" width="5" height="86" fill="#B7332C"/>
    <text x="94" y="328" class="mono" font-size="11" letter-spacing="0.08em" fill="#B7332C">OIF</text>
    <text x="150" y="328" class="body" font-size="15" font-weight="600" fill="#1A1A1A">Facteur d'intersection organisationnelle</text>
    <text x="94" y="352" class="body" font-size="13" fill="#5A5A5A">Nombre d'organisations contribuant chacune pour plus de 10 % au même objet.</text>
    <text x="94" y="372" class="body" font-size="13" font-style="italic" fill="#1F5560">Se règle par le mode d'interaction imposé à la plateforme. Coût : un renoncement.</text>
  </g>

  <text x="64" y="424" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">OBSERVABLE, CONSÉQUENCE DES DEUX PRÉCÉDENTES</text>
  <g>
    <rect x="64" y="436" width="636" height="106" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="94" y="464" class="body" font-size="13" fill="#1A1A1A"><tspan class="mono" font-size="11" fill="#1F5560">OCO</tspan>  Niveau de propriété organisationnelle du code</text>
    <text x="94" y="490" class="body" font-size="13" fill="#1A1A1A"><tspan class="mono" font-size="11" fill="#1F5560">OOW</tspan>  Propriété globale de l'organisation</text>
    <text x="94" y="516" class="body" font-size="13" fill="#1A1A1A"><tspan class="mono" font-size="11" fill="#1F5560">PO</tspan>   Part de l'organisation effectivement mobilisée</text>
  </g>

  <!-- effectifs -->
  <g class="interactive" data-card="effectif" tabindex="0" role="button" aria-label="Les métriques d'effectif — cliquez pour les détails">
    <text x="64" y="580" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">COMPTAGES D'EFFECTIF : CORRÉLÉS, MAIS SANS LEVIER DIRECT</text>
    <rect class="hit" x="64" y="592" width="636" height="106" rx="3" fill="#FFFFFF" stroke="#B8B5AE" stroke-width="0.5"/>
    <text x="94" y="620" class="body" font-size="13" fill="#5A5A5A"><tspan class="mono" font-size="11" fill="#8A8478">NOE</tspan>  Nombre d'ingénieurs ayant modifié l'objet</text>
    <text x="94" y="646" class="body" font-size="13" fill="#5A5A5A"><tspan class="mono" font-size="11" fill="#8A8478">NOEE</tspan> Nombre d'entre eux ayant quitté l'entreprise</text>
    <text x="94" y="672" class="body" font-size="13" fill="#5A5A5A"><tspan class="mono" font-size="11" fill="#8A8478">EF</tspan>   Fréquence d'édition</text>
  </g>

  <!-- right column : the null result -->
  <g class="interactive" data-card="distance-nulle" tabindex="0" role="button" aria-label="Le résultat nul géographique — cliquez pour les détails">
    <rect class="hit" x="736" y="204" width="400" height="230" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="736" y="204" width="400" height="5" fill="#1F5560"/>
    <text x="762" y="242" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">LE RÉSULTAT NUL QUI TRANCHE</text>
    <text x="762" y="274" class="display" font-size="20" font-weight="600" fill="#1A1A1A">La distance n'explique</text>
    <text x="762" y="300" class="display" font-size="20" font-weight="600" fill="#1A1A1A">presque rien</text>
    <text x="762" y="332" class="body" font-size="12.5" fill="#5A5A5A">Une fois le nombre de contributeurs</text>
    <text x="762" y="350" class="body" font-size="12.5" fill="#5A5A5A">contrôlé, l'écart entre développement</text>
    <text x="762" y="368" class="body" font-size="12.5" fill="#5A5A5A">distribué et co-localisé devient encore</text>
    <text x="762" y="386" class="body" font-size="12.5" fill="#5A5A5A">moins significatif.</text>
    <text x="762" y="414" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Où les gens siègent ne prédit rien.</text>
  </g>

  <!-- right column : the ownership confirmation -->
  <g class="interactive" data-card="propriete" tabindex="0" role="button" aria-label="La confirmation par la propriété — cliquez pour les détails">
    <rect class="hit" x="736" y="450" width="400" height="248" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="736" y="450" width="400" height="5" fill="#B58A2C"/>
    <text x="762" y="488" class="mono" font-size="11" letter-spacing="0.09em" fill="#B58A2C">LA CONFIRMATION PAR LA PROPRIÉTÉ</text>
    <text x="762" y="520" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Un propriétaire dominant,</text>
    <text x="762" y="546" class="display" font-size="20" font-weight="600" fill="#1A1A1A">peu de passants</text>
    <text x="762" y="578" class="body" font-size="12.5" fill="#5A5A5A">Deux grandeurs ressortent sur Vista et</text>
    <text x="762" y="596" class="body" font-size="12.5" fill="#5A5A5A">Windows 7 : la part de propriété du</text>
    <text x="762" y="614" class="body" font-size="12.5" fill="#5A5A5A">contributeur principal, et le nombre de</text>
    <text x="762" y="632" class="body" font-size="12.5" fill="#5A5A5A">contributeurs de faible expertise. Les</text>
    <text x="762" y="650" class="body" font-size="12.5" fill="#5A5A5A">deux sont reliées aux défauts, avant</text>
    <text x="762" y="668" class="body" font-size="12.5" fill="#5A5A5A">comme après la mise en service.</text>
  </g>

  <!-- bottom rule -->
  <rect x="64" y="730" width="1072" height="88" rx="3" fill="#1A1A1A"/>
  <text x="94" y="762" class="mono" font-size="11" letter-spacing="0.1em" fill="#E8B84B">LA RÈGLE DE LECTURE QUI EN DÉCOULE</text>
  <text x="94" y="792" class="display" font-size="20" font-weight="600" fill="#FAF8F3">Combien d'organisations ont voix au chapitre sur ce cas d'usage, et à quelle profondeur siège celui qui en décide ?</text>

  <text x="64" y="858" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#8A8478">MÉTRIQUES D'APRÈS NAGAPPAN, MURPHY ET BASILI (ICSE 2008) ; RÉSULTAT NUL D'APRÈS BIRD ET AL. (ICSE 2009) ; PROPRIÉTÉ D'APRÈS BIRD ET AL. (2011). RANGEMENT PROPRE À CE DOSSIER.</text>
</svg>
