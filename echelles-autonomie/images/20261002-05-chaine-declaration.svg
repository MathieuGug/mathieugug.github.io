<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La chaîne de déclaration de réversibilité : le serveur d'outils déclare quatre booléens, le client les reçoit, mais la spécification les qualifie d'indices non contractuels, ce qui impose au déployeur de tenir sa propre classification">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
    <marker id="arr05t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5560"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce que le protocole sait déjà, et où la chaîne casse</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre booléens encodent la réversibilité depuis mars 2025. Ils sont déclarés par la partie qu'ils bornent.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="186" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LES QUATRE ANNOTATIONS D'OUTIL · RÉVISION 2025-03-26</text>

  <rect x="64" y="198" width="254" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="84" y="226" class="mono" font-size="13" fill="#1F5560">readOnlyHint</text>
  <text x="84" y="250" class="body" font-size="12.5" fill="#5A5A5A">L'outil ne modifie rien</text>
  <text x="84" y="272" class="body" font-size="12.5" font-weight="500" fill="#2F5D3F">Correspond à la classe R0</text>

  <rect x="336" y="198" width="254" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="356" y="226" class="mono" font-size="13" fill="#1F5560">destructiveHint</text>
  <text x="356" y="250" class="body" font-size="12.5" fill="#5A5A5A">La modification détruit</text>
  <text x="356" y="272" class="body" font-size="12.5" font-weight="500" fill="#B7332C">Correspond à la classe R3</text>

  <rect x="608" y="198" width="254" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="628" y="226" class="mono" font-size="13" fill="#1F5560">idempotentHint</text>
  <text x="628" y="250" class="body" font-size="12.5" fill="#5A5A5A">Un rappel n'ajoute rien</text>
  <text x="628" y="272" class="body" font-size="12.5" font-weight="500" fill="#1F5560">Rend la reprise possible</text>

  <rect x="880" y="198" width="256" height="86" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="900" y="226" class="mono" font-size="13" fill="#1F5560">openWorldHint</text>
  <text x="900" y="250" class="body" font-size="12.5" fill="#5A5A5A">Entités externes</text>
  <text x="900" y="272" class="body" font-size="12.5" font-weight="500" fill="#B58A2C">Correspond à la classe R2</text>

  <text x="64" y="324" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LA CHAÎNE DÉCLARATIVE</text>

  <g class="interactive" data-card="serveur" tabindex="0" role="button" aria-label="Le serveur d'outils qui déclare — cliquez pour les détails">
    <rect x="64" y="338" width="300" height="112" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="338" width="5" height="112" fill="#B7332C"/>
    <text x="92" y="368" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ÉTAPE 1</text>
    <text x="92" y="396" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le serveur d'outils</text>
    <text x="92" y="420" class="body" font-size="12.5" fill="#5A5A5A">déclare les quatre booléens</text>
    <text x="92" y="438" class="body" font-size="12.5" font-style="italic" fill="#B7332C">La partie même qu'on cherche à borner</text>
  </g>

  <line x1="370" y1="394" x2="420" y2="394" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arr05)"/>

  <g class="interactive" data-card="client" tabindex="0" role="button" aria-label="Le client agentique qui reçoit la déclaration — cliquez pour les détails">
    <rect x="436" y="338" width="300" height="112" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="436" y="338" width="5" height="112" fill="#B8B5AE"/>
    <text x="464" y="368" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">ÉTAPE 2</text>
    <text x="464" y="396" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le client agentique</text>
    <text x="464" y="420" class="body" font-size="12.5" fill="#5A5A5A">reçoit la déclaration telle quelle</text>
    <text x="464" y="438" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Défauts pessimistes en l'absence de champ</text>
  </g>

  <line x1="742" y1="394" x2="768" y2="394" stroke="#5A5A5A" stroke-width="1.25"/>

  <g class="interactive" data-card="rupture" tabindex="0" role="button" aria-label="La rupture : les annotations sont des indices non contractuels — cliquez pour les détails">
    <path d="M782,356 L794,394 L782,432" fill="none" stroke="#B7332C" stroke-width="2.5"/>
    <path d="M800,356 L812,394 L800,432" fill="none" stroke="#B7332C" stroke-width="2.5"/>
    <text x="797" y="470" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C" text-anchor="middle">RUPTURE</text>
    <text x="797" y="490" class="body" font-size="12.5" font-style="italic" fill="#B7332C" text-anchor="middle">Indices non</text>
    <text x="797" y="506" class="body" font-size="12.5" font-style="italic" fill="#B7332C" text-anchor="middle">contractuels</text>
  </g>

  <line x1="820" y1="394" x2="844" y2="394" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 3"/>

  <rect x="860" y="338" width="276" height="112" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="888" y="368" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">ÉTAPE 3</text>
  <text x="888" y="396" class="display" font-size="20" font-weight="600" fill="#1A1A1A">L'habilitation</text>
  <text x="888" y="420" class="body" font-size="12.5" fill="#5A5A5A">de l'agent sur cet outil</text>
  <text x="888" y="438" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Ce qui doit être opposable</text>

  <!-- chemin corrigé -->
  <text x="64" y="552" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">LE CHEMIN QUI GOUVERNE</text>

  <g class="interactive" data-card="catalogue-deployeur" tabindex="0" role="button" aria-label="Le catalogue du déployeur, source de vérité — cliquez pour les détails">
    <rect x="64" y="566" width="672" height="112" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="2"/>
    <rect x="64" y="566" width="5" height="112" fill="#1F5560"/>
    <text x="92" y="596" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">TENU PAR LE DÉPLOYEUR</text>
    <text x="92" y="624" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le catalogue d'outils du déployeur</text>
    <text x="92" y="648" class="body" font-size="13" fill="#5A5A5A">Par outil : la classe R0 à R3, le propriétaire, la date du dernier test d'annulation et son résultat.</text>
    <text x="92" y="668" class="body" font-size="12.5" font-style="italic" fill="#1F5560">Un outil sans classification est traité en R3 jusqu'à classement.</text>
  </g>

  <path d="M742,622 C 840,622 900,560 998,478" fill="none" stroke="#1F5560" stroke-width="2.5" marker-end="url(#arr05t)"/>
  <text x="900" y="546" class="body" font-size="12.5" font-weight="500" fill="#1F5560">gouverne</text>

  <path d="M214,456 C 214,510 300,528 420,580" fill="none" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 4"/>
  <text x="232" y="534" class="body" font-size="12.5" font-style="italic" fill="#B7332C">sert d'indice à comparer</text>

  <rect x="64" y="702" width="1072" height="46" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="94" y="730" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Quand la déclaration du serveur et la classification du déployeur divergent, c'est la seconde qui gouverne l'habilitation.</text>

  <line x1="64" y1="766" x2="1136" y2="766" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="786" class="body" font-size="12" font-style="italic" fill="#8A8478">Sources : spécification du protocole de contexte pour les modèles, révision 2025-03-26 ; initiative de normalisation des agents du NIST (17 février 2026). Correspondance avec les classes R0-R3 : analyse de l'auteur.</text>
</svg>
