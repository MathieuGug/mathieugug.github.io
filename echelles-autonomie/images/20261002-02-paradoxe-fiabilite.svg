<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le paradoxe de la graduation par la fiabilité : l'autonomie accordée monte avec la justesse de l'agent pendant que l'effectivité de la supervision humaine décroît avec cette même justesse">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le paradoxe de la graduation par la fiabilité</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le critère qui autorise la montée dégrade le mécanisme de contrôle qui sécurisait le palier d'avant.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- grille -->
  <line x1="150" y1="200" x2="860" y2="200" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="150" y1="370" x2="860" y2="370" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- zone du palier fictif (déclarée avant les courbes pour rester sous elles) -->
  <g class="interactive" data-card="palier-fictif" tabindex="0" role="button" aria-label="Le palier supervisé fictif — cliquez pour les détails">
    <rect x="620" y="200" width="240" height="340" fill="#B7332C" fill-opacity="0.06" stroke="#B7332C" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="740" y="226" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C" text-anchor="middle">PALIER SUPERVISÉ FICTIF</text>
  </g>

  <!-- axes -->
  <line x1="150" y1="540" x2="880" y2="540" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arr02)"/>
  <line x1="150" y1="540" x2="150" y2="192" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="200" y="562" class="mono" font-size="12" fill="#8A8478" text-anchor="middle">92 %</text>
  <text x="400" y="562" class="mono" font-size="12" fill="#8A8478" text-anchor="middle">95 %</text>
  <text x="620" y="562" class="mono" font-size="12" fill="#8A8478" text-anchor="middle">98 %</text>
  <text x="820" y="562" class="mono" font-size="12" fill="#8A8478" text-anchor="middle">99,5 %</text>
  <text x="150" y="588" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">JUSTESSE MESURÉE DE L'AGENT</text>
  <text x="134" y="370" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle" transform="rotate(-90 134 370)">NIVEAU</text>

  <!-- courbe 1 : autonomie accordée -->
  <g class="interactive" data-card="critere-montee" tabindex="0" role="button" aria-label="L'autonomie accordée par le cadre de paliers mérités — cliquez pour les détails">
    <path d="M150,512 C 350,506 430,340 860,236" fill="none" stroke="transparent" stroke-width="26"/>
    <path d="M150,512 C 350,506 430,340 860,236" fill="none" stroke="#B7332C" stroke-width="2.5"/>
    <circle cx="300" cy="494" r="9" fill="#B7332C"/>
    <text x="300" y="498" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
    <text x="330" y="470" class="body" font-size="13" font-weight="500" fill="#B7332C">Autonomie accordée</text>
  </g>

  <!-- courbe 2 : effectivité de la supervision -->
  <g class="interactive" data-card="vigilance" tabindex="0" role="button" aria-label="L'effectivité de la supervision humaine — cliquez pour les détails">
    <path d="M150,248 C 380,258 470,436 860,502" fill="none" stroke="transparent" stroke-width="26"/>
    <path d="M150,248 C 380,258 470,436 860,502" fill="none" stroke="#1F5560" stroke-width="2.5"/>
    <circle cx="300" cy="286" r="9" fill="#1F5560"/>
    <text x="300" y="290" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
    <text x="330" y="268" class="body" font-size="13" font-weight="500" fill="#1F5560">Effectivité de la supervision</text>
  </g>

  <!-- croisement -->
  <g class="interactive" data-card="ciseaux" tabindex="0" role="button" aria-label="Le point de croisement non signalé — cliquez pour les détails">
    <circle cx="498" cy="382" r="22" fill="none" stroke="#B58A2C" stroke-width="1.25" stroke-dasharray="2 3"/>
    <circle cx="498" cy="382" r="9" fill="#B58A2C"/>
    <text x="498" y="386" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
    <line x1="520" y1="382" x2="566" y2="382" stroke="#5A5A5A" stroke-width="0.75"/>
    <text x="572" y="378" class="body" font-size="13" font-weight="500" fill="#B58A2C">Aucun indicateur ne le signale</text>
    <text x="572" y="398" class="body" font-size="12.5" font-style="italic" fill="#8A8478">La supervision se dégrade sans tomber en panne</text>
  </g>

  <!-- légende latérale -->
  <line x1="912" y1="200" x2="912" y2="540" stroke="#E5E1D8" stroke-width="1"/>
  <text x="944" y="212" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LES TROIS CONDITIONS</text>
  <text x="944" y="236" class="body" font-size="12.5" fill="#5A5A5A">de la complaisance d'automatisation,</text>
  <text x="944" y="254" class="body" font-size="12.5" fill="#5A5A5A">établies par la littérature de 2010 :</text>

  <circle cx="952" cy="288" r="4" fill="#1F5560"/>
  <text x="968" y="292" class="body" font-size="13" fill="#1A1A1A">une automatisation très fiable</text>
  <circle cx="952" cy="322" r="4" fill="#1F5560"/>
  <text x="968" y="326" class="body" font-size="13" fill="#1A1A1A">une charge de travail élevée</text>
  <text x="968" y="344" class="body" font-size="12.5" font-style="italic" fill="#8A8478">avec des tâches concurrentes</text>
  <circle cx="952" cy="378" r="4" fill="#1F5560"/>
  <text x="968" y="382" class="body" font-size="13" fill="#1A1A1A">une expérience positive longue</text>

  <rect x="944" y="412" width="192" height="108" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1"/>
  <text x="962" y="438" class="mono" font-size="20" font-weight="500" fill="#B7332C">÷ 2</text>
  <text x="962" y="462" class="body" font-size="12.5" fill="#5A5A5A">détection des défaillances</text>
  <text x="962" y="480" class="body" font-size="12.5" fill="#5A5A5A">sur les systèmes à fiabilité</text>
  <text x="962" y="498" class="body" font-size="12.5" fill="#5A5A5A">constamment élevée</text>

  <rect x="64" y="618" width="1072" height="76" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="94" y="646" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Le cadre de graduation dit : plus l'agent est juste, plus on lui accorde d'autonomie.</text>
  <text x="94" y="668" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">La littérature de facteurs humains dit : plus l'agent est juste, moins sa supervision est effective.</text>
  <text x="94" y="686" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">La complaisance se retrouve chez les experts comme chez les novices, et elle ne se corrige pas par l'entraînement.</text>

  <line x1="64" y1="748" x2="1136" y2="748" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="768" class="body" font-size="12" font-style="italic" fill="#8A8478">Sources : Parasuraman &amp; Manzey, Human Factors 52(3), 2010 ; Goddard, Roudsari &amp; Wyatt, JAMIA, 2012. Courbes illustratives, non issues d'une mesure.</text>
  <text x="64" y="786" class="body" font-size="12" font-style="italic" fill="#8A8478">Analyse de l'auteur : le rapprochement des deux pentes n'est posé par aucune des sources citées.</text>
</svg>
