<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Quatre cadres de gouvernance de l'autonomie agentique rangés par la variable qu'ils graduent : supervision, espace d'action, usage, ou rien">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois variables sous un seul mot</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Les quatre cadres disponibles ne graduent pas la même grandeur. Un comité qui les empile en manipule trois.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="94" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LE CADRE</text>
  <text x="430" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL GRADUE</text>
  <text x="720" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">SON CRITÈRE DE MONTÉE</text>
  <text x="1106" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">SE VÉRIFIE ?</text>

  <g class="interactive" data-card="bcg" tabindex="0" role="button" aria-label="Paliers mérités — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="104" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="206" width="5" height="104" fill="#B7332C"/>
    <text x="94" y="236" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CABINET · 2026</text>
    <text x="94" y="264" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Les paliers mérités</text>
    <text x="94" y="290" class="body" font-size="12" fill="#8A8478">Mode fantôme → autonomie complète</text>

    <text x="430" y="248" class="body" font-size="13.5" fill="#5A5A5A">Le degré de supervision humaine</text>
    <text x="430" y="272" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Combien d'humain reste dans la boucle</text>

    <text x="720" y="248" class="body" font-size="13.5" fill="#5A5A5A">La justesse mesurée de l'agent</text>
    <text x="720" y="272" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Une probabilité, pas un coût</text>

    <text x="1106" y="262" class="mono" font-size="13" letter-spacing="0.08em" fill="#B7332C" text-anchor="end">NON</text>
  </g>

  <g class="interactive" data-card="mckinsey" tabindex="0" role="button" aria-label="Autonomie gouvernée — cliquez pour les détails">
    <rect x="64" y="322" width="1072" height="104" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="322" width="5" height="104" fill="#B8B5AE"/>
    <text x="94" y="352" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">CABINET · 2025</text>
    <text x="94" y="380" class="display" font-size="21" font-weight="600" fill="#1A1A1A">L'autonomie gouvernée</text>
    <text x="94" y="406" class="body" font-size="12" fill="#8A8478">Cinquième principe du maillage</text>

    <text x="430" y="364" class="body" font-size="13.5" fill="#5A5A5A">Aucune grandeur : un mécanisme</text>
    <text x="430" y="388" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Politiques, habilitations, escalade</text>

    <text x="720" y="364" class="body" font-size="13.5" fill="#5A5A5A">Aucun critère publié</text>
    <text x="720" y="388" class="body" font-size="12.5" font-style="italic" fill="#8A8478">La plomberie sans le robinet</text>

    <text x="1106" y="378" class="mono" font-size="13" letter-spacing="0.08em" fill="#8A8478" text-anchor="end">SANS OBJET</text>
  </g>

  <g class="interactive" data-card="imda" tabindex="0" role="button" aria-label="Cadre singapourien, bornage par conception — cliquez pour les détails">
    <rect x="64" y="438" width="1072" height="104" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="2"/>
    <rect x="64" y="438" width="5" height="104" fill="#1F5560"/>
    <text x="94" y="468" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">ÉTAT · 22 JANVIER 2026</text>
    <text x="94" y="496" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le bornage par conception</text>
    <text x="94" y="522" class="body" font-size="12" fill="#8A8478">Quatre dimensions, cadre volontaire</text>

    <text x="430" y="480" class="body" font-size="13.5" fill="#5A5A5A">L'espace d'action et la réversibilité</text>
    <text x="430" y="504" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Outils, données, autorité de décision</text>

    <text x="720" y="480" class="body" font-size="13.5" fill="#5A5A5A">La classe de l'acte posé</text>
    <text x="720" y="504" class="body" font-size="12.5" font-style="italic" fill="#1F5560">Un test d'annulation se rejoue</text>

    <text x="1106" y="494" class="mono" font-size="13" letter-spacing="0.08em" fill="#1F5560" text-anchor="end">OUI</text>
  </g>

  <g class="interactive" data-card="ai-act" tabindex="0" role="button" aria-label="Règlement européen sur l'IA, articles 14 et 26 — cliquez pour les détails">
    <rect x="64" y="554" width="1072" height="104" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="554" width="5" height="104" fill="#B58A2C"/>
    <text x="94" y="584" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">RÈGLEMENT · UE 2024/1689</text>
    <text x="94" y="612" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Les articles 14 et 26</text>
    <text x="94" y="638" class="body" font-size="12" fill="#8A8478">Obligations du déployeur</text>

    <text x="430" y="596" class="body" font-size="13.5" fill="#5A5A5A">L'usage auquel le système est affecté</text>
    <text x="430" y="620" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Classes de risque, non paliers d'agent</text>

    <text x="720" y="596" class="body" font-size="13.5" fill="#5A5A5A">Hors échelle : exigence en bloc</text>
    <text x="720" y="620" class="body" font-size="12.5" font-style="italic" fill="#B58A2C">Dont « inverser » la sortie, art. 14 § 4</text>

    <text x="1106" y="610" class="mono" font-size="13" letter-spacing="0.08em" fill="#B58A2C" text-anchor="end">AUTRE AXE</text>
  </g>

  <rect x="64" y="686" width="1072" height="56" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="94" y="710" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Les trois variables sont orthogonales : un même agent occupe le palier le plus bas d'une échelle et le plus haut d'une autre.</text>
  <text x="94" y="730" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Un agent autonome qui écrit dans un brouillon expose moins qu'un agent supervisé qui déclenche un virement.</text>

  <line x1="64" y1="762" x2="1136" y2="762" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="782" class="body" font-size="12" font-style="italic" fill="#8A8478">Sources : cadre IMDA v1.0 (22 janvier 2026) ; règlement (UE) 2024/1689, art. 14 et 26 ; publications de cabinets 2025-2026 ; analyse de l'auteur.</text>
</svg>
