<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="La matrice des quatre régimes d'habilitation, croisant le coût d'annulation de l'acte et sa portée par exécution">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect width="900" height="900" fill="#FAF8F3"/>

  <text x="48" y="58" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="48" y="98" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Quatre régimes, pas une échelle</text>
  <text x="48" y="128" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un régime est un jeu d'exigences. Deux agents peuvent vivre dans deux régimes sans qu'aucun soit plus avancé.</text>
  <line x1="48" y1="152" x2="852" y2="152" stroke="#E5E1D8" stroke-width="1"/>

  <!-- quadrant haut-gauche : régime 3 -->
  <g class="interactive" data-card="regime-3" tabindex="0" role="button" aria-label="Régime 3, validation par acte — cliquez pour les détails">
    <rect x="170" y="194" width="330" height="262" fill="#B58A2C" fill-opacity="0.07" stroke="#E5E1D8" stroke-width="1"/>
    <text x="196" y="230" class="mono" font-size="12" font-weight="600" fill="#B58A2C">RÉGIME 3</text>
    <text x="196" y="262" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Validation par acte</text>
    <text x="196" y="290" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Classe R2, portée bornée</text>
    <circle cx="202" cy="322" r="3.5" fill="#B58A2C"/>
    <text x="216" y="326" class="body" font-size="13" fill="#1A1A1A">validation nominative, acte par acte</text>
    <circle cx="202" cy="352" r="3.5" fill="#B58A2C"/>
    <text x="216" y="356" class="body" font-size="13" fill="#1A1A1A">le contenu exact de ce qui sortira</text>
    <circle cx="202" cy="382" r="3.5" fill="#B58A2C"/>
    <text x="216" y="386" class="body" font-size="13" fill="#1A1A1A">conservation du couple</text>
    <text x="216" y="404" class="body" font-size="13" fill="#1A1A1A">proposition / validation</text>
    <circle cx="202" cy="430" r="3.5" fill="#B58A2C"/>
    <text x="216" y="434" class="body" font-size="13" fill="#1A1A1A">compensation écrite, avec porteur</text>
  </g>

  <!-- quadrant haut-droite : régime 4 -->
  <g class="interactive" data-card="regime-4" tabindex="0" role="button" aria-label="Régime 4, acte humain délibéré — cliquez pour les détails">
    <rect x="500" y="194" width="330" height="262" fill="#B7332C" fill-opacity="0.09" stroke="#B7332C" stroke-width="2"/>
    <text x="526" y="230" class="mono" font-size="12" font-weight="600" fill="#B7332C">RÉGIME 4</text>
    <text x="526" y="262" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Acte humain délibéré</text>
    <text x="526" y="290" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Classe R3, toute portée</text>
    <circle cx="532" cy="322" r="3.5" fill="#B7332C"/>
    <text x="546" y="326" class="body" font-size="13" fill="#1A1A1A">l'agent prépare, l'humain pose l'acte</text>
    <circle cx="532" cy="352" r="3.5" fill="#B7332C"/>
    <text x="546" y="356" class="body" font-size="13" fill="#1A1A1A">l'agent n'a pas l'habilitation</text>
    <text x="546" y="374" class="body" font-size="13" fill="#1A1A1A">technique de l'acte</text>
    <circle cx="532" cy="400" r="3.5" fill="#B7332C"/>
    <text x="546" y="404" class="body" font-size="13" fill="#1A1A1A">séparation des habilitations entre</text>
    <text x="546" y="422" class="body" font-size="13" fill="#1A1A1A">celui qui prépare et celui qui pose</text>
  </g>

  <!-- quadrant bas-gauche : régime 1 -->
  <g class="interactive" data-card="regime-1" tabindex="0" role="button" aria-label="Régime 1, exécution libre — cliquez pour les détails">
    <rect x="170" y="456" width="330" height="262" fill="#2F5D3F" fill-opacity="0.07" stroke="#E5E1D8" stroke-width="1"/>
    <text x="196" y="492" class="mono" font-size="12" font-weight="600" fill="#2F5D3F">RÉGIME 1</text>
    <text x="196" y="524" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Exécution libre</text>
    <text x="196" y="552" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Classe R0, portée bornée</text>
    <circle cx="202" cy="584" r="3.5" fill="#2F5D3F"/>
    <text x="216" y="588" class="body" font-size="13" fill="#1A1A1A">identité propre et journal des actes</text>
    <circle cx="202" cy="614" r="3.5" fill="#2F5D3F"/>
    <text x="216" y="618" class="body" font-size="13" fill="#1A1A1A">plafond de volume par exécution</text>
    <circle cx="202" cy="644" r="3.5" fill="#2F5D3F"/>
    <text x="216" y="648" class="body" font-size="13" fill="#1A1A1A">test d'annulation à chaque version</text>
    <circle cx="202" cy="674" r="3.5" fill="#2F5D3F"/>
    <text x="216" y="678" class="body" font-size="13" fill="#1A1A1A">aucun valideur humain : il ne</text>
    <text x="216" y="696" class="body" font-size="13" fill="#1A1A1A">lirait rien et simulerait un contrôle</text>
  </g>

  <!-- quadrant bas-droite : régime 2 -->
  <g class="interactive" data-card="regime-2" tabindex="0" role="button" aria-label="Régime 2, exécution plafonnée — cliquez pour les détails">
    <rect x="500" y="456" width="330" height="262" fill="#1F5560" fill-opacity="0.07" stroke="#E5E1D8" stroke-width="1"/>
    <text x="526" y="492" class="mono" font-size="12" font-weight="600" fill="#1F5560">RÉGIME 2</text>
    <text x="526" y="524" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Exécution plafonnée</text>
    <text x="526" y="552" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Classe R0 ou R1, portée large</text>
    <circle cx="532" cy="584" r="3.5" fill="#1F5560"/>
    <text x="546" y="588" class="body" font-size="13" fill="#1A1A1A">les exigences du régime 1</text>
    <circle cx="532" cy="614" r="3.5" fill="#1F5560"/>
    <text x="546" y="618" class="body" font-size="13" fill="#1A1A1A">un seuil de volume écrit, qui</text>
    <text x="546" y="636" class="body" font-size="13" fill="#1A1A1A">déclenche l'arrêt et la reprise</text>
    <circle cx="532" cy="662" r="3.5" fill="#1F5560"/>
    <text x="546" y="666" class="body" font-size="13" fill="#1A1A1A">un titulaire nommé pour l'arbitrer</text>
    <circle cx="532" cy="692" r="3.5" fill="#1F5560"/>
    <text x="546" y="696" class="body" font-size="13" fill="#1A1A1A">le seuil est l'objet de gouvernance</text>
  </g>

  <!-- axes -->
  <line x1="170" y1="730" x2="846" y2="730" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arr06)"/>
  <line x1="170" y1="730" x2="170" y2="186" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arr06)"/>

  <text x="335" y="752" class="body" font-size="13" fill="#5A5A5A" text-anchor="middle">Bornée</text>
  <text x="665" y="752" class="body" font-size="13" fill="#5A5A5A" text-anchor="middle">Large, ou destinataire externe</text>
  <text x="500" y="774" class="mono" font-size="11" letter-spacing="0.09em" fill="#1A1A1A" text-anchor="middle">PORTÉE DE L'ACTE PAR EXÉCUTION</text>

  <text x="152" y="590" class="body" font-size="13" fill="#5A5A5A" text-anchor="middle" transform="rotate(-90 152 590)">Annulable · R0-R1</text>
  <text x="152" y="326" class="body" font-size="13" fill="#5A5A5A" text-anchor="middle" transform="rotate(-90 152 326)">Non restituable · R2-R3</text>
  <text x="128" y="458" class="mono" font-size="11" letter-spacing="0.09em" fill="#1A1A1A" text-anchor="middle" transform="rotate(-90 128 458)">COÛT D'ANNULATION</text>

  <rect x="48" y="792" width="804" height="46" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="76" y="820" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">La classe R3 impose le régime 4 quelle que soit la portée : aucune confiance ne borne une perte non reconstituable.</text>

  <line x1="48" y1="856" x2="852" y2="856" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="48" y="878" class="body" font-size="12" font-style="italic" fill="#8A8478">Cadre analytique de l'auteur, dérivé de la première dimension du cadre IMDA et de la littérature sur l'effectivité de la surveillance humaine.</text>
</svg>
