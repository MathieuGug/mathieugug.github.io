<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="L'échelle d'automatisation automobile J3016 face aux paliers agentiques : le niveau 3 correspond à l'autonomie supervisée, et neuf ans de déploiement montrent qu'il ne tient qu'en rétrécissant l'espace d'action">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le palier intermédiaire, neuf ans après</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">L'industrie qui a inventé l'échelle de référence a borné l'espace d'action plutôt que de renforcer la vigilance.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">NORME J3016 · SIX NIVEAUX D'AUTOMATISATION DE LA CONDUITE</text>

  <rect x="64" y="202" width="165" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="80" y="228" class="mono" font-size="12" fill="#8A8478">0</text>
  <text x="80" y="252" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Aucune</text>
  <text x="80" y="270" class="body" font-size="12" fill="#8A8478">L'humain conduit</text>

  <rect x="245" y="202" width="165" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="261" y="228" class="mono" font-size="12" fill="#8A8478">1</text>
  <text x="261" y="252" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Assistance</text>
  <text x="261" y="270" class="body" font-size="12" fill="#8A8478">Un axe délégué</text>

  <rect x="426" y="202" width="165" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="442" y="228" class="mono" font-size="12" fill="#8A8478">2</text>
  <text x="442" y="252" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Partielle</text>
  <text x="442" y="270" class="body" font-size="12" fill="#8A8478">Mains libres surveillé</text>

  <g class="interactive" data-card="niveau-3" tabindex="0" role="button" aria-label="Le niveau 3, automatisation conditionnelle — cliquez pour les détails">
    <rect x="607" y="196" width="165" height="88" rx="3" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="2"/>
    <text x="623" y="224" class="mono" font-size="12" font-weight="600" fill="#B7332C">3</text>
    <text x="623" y="248" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Conditionnelle</text>
    <text x="623" y="266" class="body" font-size="12" fill="#B7332C">Reprise obligatoire</text>
    <text x="623" y="280" class="body" font-size="12" fill="#B7332C">sur demande</text>
  </g>

  <rect x="788" y="202" width="165" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="804" y="228" class="mono" font-size="12" fill="#8A8478">4</text>
  <text x="804" y="252" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Élevée</text>
  <text x="804" y="270" class="body" font-size="12" fill="#8A8478">Domaine restreint</text>

  <rect x="969" y="202" width="165" height="76" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="985" y="228" class="mono" font-size="12" fill="#8A8478">5</text>
  <text x="985" y="252" class="body" font-size="13" font-weight="500" fill="#1A1A1A">Complète</text>
  <text x="985" y="270" class="body" font-size="12" fill="#8A8478">Sans condition</text>

  <!-- correspondance -->
  <g class="interactive" data-card="transposition" tabindex="0" role="button" aria-label="La transposition vers les paliers agentiques — cliquez pour les détails">
    <line x1="689" y1="290" x2="689" y2="326" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#arr03)"/>
    <rect x="430" y="330" width="520" height="34" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 4"/>
    <text x="690" y="352" class="body" font-size="13" font-weight="500" fill="#B7332C" text-anchor="middle">Même configuration que l'« autonomie supervisée » des cadres agentiques</text>
  </g>

  <text x="64" y="398" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">PALIERS AGENTIQUES · GRADUATION PAR LA JUSTESSE MESURÉE</text>

  <rect x="64" y="412" width="254" height="72" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="84" y="438" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Mode fantôme</text>
  <text x="84" y="460" class="body" font-size="12.5" fill="#8A8478">L'agent propose, l'humain agit</text>

  <g class="interactive" data-card="superviseur-passif" tabindex="0" role="button" aria-label="Le superviseur passif — cliquez pour les détails">
    <rect x="334" y="406" width="524" height="84" rx="3" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="2"/>
    <text x="354" y="434" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Autonomie supervisée, puis guidée</text>
    <text x="354" y="456" class="body" font-size="12.5" fill="#B7332C">L'agent agit, l'humain valide ou reprend. Le rôle humain passe de</text>
    <text x="354" y="474" class="body" font-size="12.5" fill="#B7332C">contrôleur actif à superviseur passif : les deux paliers du milieu.</text>
  </g>

  <rect x="874" y="412" width="260" height="72" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="894" y="438" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Autonomie complète</text>
  <text x="894" y="460" class="body" font-size="12.5" fill="#8A8478">Humain hors de la boucle</text>

  <!-- chronologie -->
  <g class="interactive" data-card="deploiements" tabindex="0" role="button" aria-label="Neuf ans de déploiement du niveau 3 — cliquez pour les détails">
    <text x="64" y="546" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUE LE NIVEAU 3 A RÉELLEMENT PRODUIT EN NEUF ANS</text>
    <line x1="120" y1="610" x2="1120" y2="610" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arr03)"/>

    <circle cx="180" cy="610" r="7" fill="#B58A2C"/>
    <line x1="180" y1="603" x2="180" y2="584" stroke="#5A5A5A" stroke-width="0.75"/>
    <text x="180" y="576" class="mono" font-size="12" fill="#B58A2C" text-anchor="middle">2017</text>
    <text x="180" y="636" class="body" font-size="13" font-weight="500" fill="#1A1A1A" text-anchor="middle">Annonce</text>
    <text x="180" y="654" class="body" font-size="12.5" fill="#8A8478" text-anchor="middle">Pilote d'embouteillage</text>
    <text x="180" y="670" class="body" font-size="12.5" fill="#8A8478" text-anchor="middle">en caractéristique phare</text>

    <circle cx="440" cy="610" r="7" fill="#B7332C"/>
    <line x1="440" y1="603" x2="440" y2="584" stroke="#5A5A5A" stroke-width="0.75"/>
    <text x="440" y="576" class="mono" font-size="12" fill="#B7332C" text-anchor="middle">2020</text>
    <text x="440" y="636" class="body" font-size="13" font-weight="500" fill="#1A1A1A" text-anchor="middle">Renoncement</text>
    <text x="440" y="654" class="body" font-size="12.5" fill="#8A8478" text-anchor="middle">Retour au niveau 2,</text>
    <text x="440" y="670" class="body" font-size="12.5" fill="#8A8478" text-anchor="middle">faute d'homologation</text>

    <circle cx="700" cy="610" r="7" fill="#1F5560"/>
    <line x1="700" y1="603" x2="700" y2="584" stroke="#5A5A5A" stroke-width="0.75"/>
    <text x="700" y="576" class="mono" font-size="12" fill="#1F5560" text-anchor="middle">MARS 2021</text>
    <text x="700" y="636" class="body" font-size="13" font-weight="500" fill="#1A1A1A" text-anchor="middle">Série limitée</text>
    <text x="700" y="654" class="body" font-size="12.5" fill="#8A8478" text-anchor="middle">100 exemplaires,</text>
    <text x="700" y="670" class="body" font-size="12.5" fill="#8A8478" text-anchor="middle">location sur trois ans</text>

    <circle cx="960" cy="610" r="7" fill="#1F5560"/>
    <line x1="960" y1="603" x2="960" y2="584" stroke="#5A5A5A" stroke-width="0.75"/>
    <text x="960" y="576" class="mono" font-size="12" fill="#1F5560" text-anchor="middle">DÉC. 2024</text>
    <text x="960" y="636" class="body" font-size="13" font-weight="500" fill="#1A1A1A" text-anchor="middle">Domaine rétréci</text>
    <text x="960" y="654" class="body" font-size="12.5" fill="#8A8478" text-anchor="middle">Suivi d'un véhicule sur</text>
    <text x="960" y="670" class="body" font-size="12.5" fill="#8A8478" text-anchor="middle">autoroute, sous 95 km/h</text>
  </g>

  <rect x="64" y="696" width="1072" height="46" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="94" y="724" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Le palier du milieu n'a survécu qu'en rétrécissant le domaine opérationnel jusqu'à ce que la reprise ne serve presque jamais.</text>

  <line x1="64" y1="760" x2="1136" y2="760" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="782" class="body" font-size="12" font-style="italic" fill="#8A8478">Sources : norme SAE J3016 ; travaux QUT sur le transfert de tâche en niveau 3 ; Automotive News (2020) ; Mercedes-Benz Group (décembre 2024). Transposition : analyse de l'auteur.</text>
</svg>
