<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="Quatre classes d'actes agentiques définies par trois propriétés mesurables : le délai de rétractation, l'acteur de l'annulation et l'observation par un tiers">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="900" height="900" fill="#FAF8F3"/>

  <text x="48" y="58" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="48" y="98" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Quatre classes d'actes</text>
  <text x="48" y="128" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois propriétés qu'un ingénieur peut coder et qu'un auditeur peut vérifier.</text>
  <line x1="48" y1="152" x2="852" y2="152" stroke="#E5E1D8" stroke-width="1"/>

  <text x="48" y="182" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LA CLASSE DE L'ACTE</text>
  <text x="310" y="182" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">DÉLAI</text>
  <text x="470" y="182" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">ANNULE</text>
  <text x="630" y="182" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">VU DEHORS</text>
  <text x="852" y="182" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="end">RÉGIME</text>
  <line x1="48" y1="194" x2="852" y2="194" stroke="#E5E1D8" stroke-width="0.5"/>

  <g class="interactive" data-card="classe-r0" tabindex="0" role="button" aria-label="Classe R0, acte annulable seul — cliquez pour les détails">
    <rect x="48" y="206" width="804" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="48" y="206" width="5" height="120" fill="#2F5D3F"/>
    <text x="76" y="238" class="mono" font-size="15" font-weight="500" fill="#2F5D3F">R0</text>
    <text x="76" y="268" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Annulable seul</text>
    <text x="76" y="292" class="body" font-size="12.5" fill="#8A8478">Brouillon, étiquetage,</text>
    <text x="76" y="310" class="body" font-size="12.5" fill="#8A8478">enrichissement de fiche interne</text>

    <rect x="310" y="252" width="12" height="12" fill="#2F5D3F" fill-opacity="0.2"/>
    <text x="310" y="286" class="body" font-size="13" fill="#5A5A5A">Long</text>
    <rect x="470" y="252" width="12" height="12" fill="#2F5D3F" fill-opacity="0.2"/>
    <text x="470" y="286" class="body" font-size="13" fill="#5A5A5A">Soi seul</text>
    <rect x="630" y="252" width="12" height="12" fill="#2F5D3F" fill-opacity="0.2"/>
    <text x="630" y="286" class="body" font-size="13" fill="#5A5A5A">Non</text>

    <text x="852" y="262" class="body" font-size="13" font-weight="500" fill="#2F5D3F" text-anchor="end">Exécution</text>
    <text x="852" y="282" class="body" font-size="13" font-weight="500" fill="#2F5D3F" text-anchor="end">libre</text>
  </g>

  <g class="interactive" data-card="classe-r1" tabindex="0" role="button" aria-label="Classe R1, acte annulable avec un tiers — cliquez pour les détails">
    <rect x="48" y="344" width="804" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="48" y="344" width="5" height="120" fill="#1F5560"/>
    <text x="76" y="376" class="mono" font-size="15" font-weight="500" fill="#1F5560">R1</text>
    <text x="76" y="406" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Annulable avec un tiers</text>
    <text x="76" y="430" class="body" font-size="12.5" fill="#8A8478">Commande fournisseur avant</text>
    <text x="76" y="448" class="body" font-size="12.5" fill="#8A8478">traitement, réservation annulable</text>

    <rect x="310" y="390" width="12" height="12" fill="#1F5560" fill-opacity="0.45"/>
    <text x="310" y="424" class="body" font-size="13" fill="#5A5A5A">Court</text>
    <rect x="470" y="390" width="12" height="12" fill="#1F5560" fill-opacity="0.45"/>
    <text x="470" y="424" class="body" font-size="13" fill="#5A5A5A">Un tiers</text>
    <rect x="630" y="390" width="12" height="12" fill="#1F5560" fill-opacity="0.2"/>
    <text x="630" y="424" class="body" font-size="13" fill="#5A5A5A">Non</text>

    <text x="852" y="400" class="body" font-size="13" font-weight="500" fill="#1F5560" text-anchor="end">Exécution</text>
    <text x="852" y="420" class="body" font-size="13" font-weight="500" fill="#1F5560" text-anchor="end">plafonnée</text>
  </g>

  <g class="interactive" data-card="classe-r2" tabindex="0" role="button" aria-label="Classe R2, acte compensable — cliquez pour les détails">
    <rect x="48" y="482" width="804" height="120" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="2"/>
    <rect x="48" y="482" width="5" height="120" fill="#B58A2C"/>
    <text x="76" y="514" class="mono" font-size="15" font-weight="500" fill="#B58A2C">R2</text>
    <text x="76" y="544" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Compensable</text>
    <text x="76" y="568" class="body" font-size="12.5" fill="#8A8478">Courriel client, message public,</text>
    <text x="76" y="586" class="body" font-size="12.5" fill="#8A8478">devis ou tarif transmis</text>

    <rect x="310" y="528" width="12" height="12" fill="#B58A2C" fill-opacity="0.7"/>
    <text x="310" y="562" class="body" font-size="13" fill="#5A5A5A">Court</text>
    <rect x="470" y="528" width="12" height="12" fill="#B58A2C" fill-opacity="0.7"/>
    <text x="470" y="562" class="body" font-size="13" fill="#5A5A5A">Personne</text>
    <rect x="630" y="528" width="12" height="12" fill="#B58A2C" fill-opacity="0.9"/>
    <text x="630" y="562" class="body" font-size="13" font-weight="500" fill="#B58A2C">Oui</text>

    <text x="852" y="538" class="body" font-size="13" font-weight="500" fill="#B58A2C" text-anchor="end">Validation</text>
    <text x="852" y="558" class="body" font-size="13" font-weight="500" fill="#B58A2C" text-anchor="end">par acte</text>
  </g>

  <g class="interactive" data-card="classe-r3" tabindex="0" role="button" aria-label="Classe R3, acte irréversible — cliquez pour les détails">
    <rect x="48" y="620" width="804" height="120" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2"/>
    <rect x="48" y="620" width="5" height="120" fill="#B7332C"/>
    <text x="76" y="652" class="mono" font-size="15" font-weight="500" fill="#B7332C">R3</text>
    <text x="76" y="682" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Irréversible</text>
    <text x="76" y="706" class="body" font-size="12.5" fill="#8A8478">Signature, paiement exécuté,</text>
    <text x="76" y="724" class="body" font-size="12.5" fill="#8A8478">suppression, déclaration</text>

    <rect x="310" y="666" width="12" height="12" fill="#B7332C" fill-opacity="1"/>
    <text x="310" y="700" class="body" font-size="13" font-weight="500" fill="#B7332C">Nul</text>
    <rect x="470" y="666" width="12" height="12" fill="#B7332C" fill-opacity="1"/>
    <text x="470" y="700" class="body" font-size="13" font-weight="500" fill="#B7332C">Personne</text>
    <rect x="630" y="666" width="12" height="12" fill="#B7332C" fill-opacity="1"/>
    <text x="630" y="700" class="body" font-size="13" font-weight="500" fill="#B7332C">Oui</text>

    <text x="852" y="676" class="body" font-size="13" font-weight="500" fill="#B7332C" text-anchor="end">Acte humain</text>
    <text x="852" y="696" class="body" font-size="13" font-weight="500" fill="#B7332C" text-anchor="end">délibéré</text>
  </g>

  <rect x="48" y="758" width="804" height="70" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="76" y="784" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Un acte R2 n'appelle pas la question « comment annuler » mais « quelle compensation,</text>
  <text x="76" y="804" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">et qui la porte ». C'est là que vit la majorité des agents d'entreprise déployés.</text>
  <text x="76" y="820" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Le dégradé des carrés mesure le coût d'annulation, non la probabilité d'erreur.</text>

  <line x1="48" y1="848" x2="852" y2="848" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="48" y="870" class="body" font-size="12" font-style="italic" fill="#8A8478">Les trois propriétés dérivent de la première dimension du cadre IMDA (22 janvier 2026).</text>
  <text x="48" y="886" class="body" font-size="12" font-style="italic" fill="#8A8478">Le découpage en quatre classes est un cadre analytique de l'auteur, repris d'aucune source.</text>
</svg>
