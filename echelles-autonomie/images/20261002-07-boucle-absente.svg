<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Le cycle d'autonomie d'un agent : la montée est documentée par les quatre cadres, la rétrogradation ne l'est par aucun, et les quatre éléments d'une clause praticable">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
    <marker id="arr07r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La boucle que personne n'a écrite</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Les quatre cadres décrivent la montée. Aucun n'écrit la descente, et l'autonomie accordée devient un acquis.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">LE CYCLE D'AUTONOMIE D'UN AGENT</text>

  <g class="interactive" data-card="montee" tabindex="0" role="button" aria-label="La montée d'un palier — cliquez pour les détails">
    <rect x="267" y="204" width="230" height="92" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="267" y="204" width="5" height="92" fill="#1F5560"/>
    <text x="291" y="232" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">DOCUMENTÉ · 4 CADRES SUR 4</text>
    <text x="291" y="260" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La montée d'un palier</text>
    <text x="291" y="282" class="body" font-size="12.5" fill="#5A5A5A">Seuils, tests, instance qui signe</text>
  </g>

  <path d="M470,300 C 522,314 562,342 574,366" fill="none" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arr07)"/>

  <g class="interactive" data-card="exploitation" tabindex="0" role="button" aria-label="L'exploitation au nouveau régime — cliquez pour les détails">
    <rect x="471" y="384" width="230" height="92" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="471" y="384" width="5" height="92" fill="#1F5560"/>
    <text x="495" y="412" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">EN PRODUCTION</text>
    <text x="495" y="440" class="display" font-size="19" font-weight="600" fill="#1A1A1A">L'exploitation</text>
    <text x="495" y="462" class="body" font-size="12.5" fill="#5A5A5A">Le régime s'installe, puis se tasse</text>
  </g>

  <path d="M598,480 C 614,538 562,588 513,602" fill="none" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arr07)"/>

  <g class="interactive" data-card="signal" tabindex="0" role="button" aria-label="Les trois signaux déclencheurs — cliquez pour les détails">
    <rect x="267" y="564" width="230" height="110" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="2"/>
    <rect x="267" y="564" width="5" height="110" fill="#B58A2C"/>
    <text x="291" y="592" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">TROIS SIGNAUX CALCULABLES</text>
    <text x="291" y="618" class="body" font-size="13" fill="#1A1A1A">échec d'un test d'annulation</text>
    <text x="291" y="640" class="body" font-size="13" fill="#1A1A1A">taux d'incident par mille actes</text>
    <text x="291" y="662" class="body" font-size="13" font-weight="500" fill="#B58A2C">taux d'approbation vers 100 %</text>
  </g>

  <path d="M261,598 C 206,578 178,536 178,492" fill="none" stroke="#B7332C" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arr07r)"/>
  <line x1="198" y1="528" x2="222" y2="552" stroke="#B7332C" stroke-width="2.5"/>
  <line x1="222" y1="528" x2="198" y2="552" stroke="#B7332C" stroke-width="2.5"/>

  <g class="interactive" data-card="retrogradation" tabindex="0" role="button" aria-label="La rétrogradation, absente des quatre cadres — cliquez pour les détails">
    <rect x="63" y="384" width="230" height="92" rx="3" fill="#B7332C" fill-opacity="0.07" stroke="#B7332C" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="87" y="412" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ABSENTE · 0 CADRE SUR 4</text>
    <text x="87" y="440" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La rétrogradation</text>
    <text x="87" y="462" class="body" font-size="12.5" fill="#B7332C">Ni critère, ni titulaire, ni durée</text>
  </g>

  <path d="M172,380 C 158,320 200,268 251,254" fill="none" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#arr07r)"/>
  <text x="104" y="324" class="body" font-size="12.5" font-style="italic" fill="#B7332C">retour conditionné</text>
  <text x="104" y="342" class="body" font-size="12.5" font-style="italic" fill="#B7332C">au rejeu des tests</text>

  <!-- colonne droite : la clause -->
  <line x1="730" y1="186" x2="730" y2="690" stroke="#E5E1D8" stroke-width="1"/>
  <g class="interactive" data-card="clause" tabindex="0" role="button" aria-label="Les quatre éléments d'une clause de rétrogradation praticable — cliquez pour les détails">
    <text x="762" y="188" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">CE QU'UNE CLAUSE PRATICABLE DOIT PORTER</text>

    <rect x="762" y="204" width="374" height="106" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="786" y="234" class="mono" font-size="12" font-weight="600" fill="#1F5560">1 · LE SIGNAL</text>
    <text x="786" y="260" class="body" font-size="13" fill="#5A5A5A">Quelle mesure déclenche l'examen. Le taux</text>
    <text x="786" y="278" class="body" font-size="13" fill="#5A5A5A">d'approbation qui tend vers 100 % est un</text>
    <text x="786" y="296" class="body" font-size="13" fill="#5A5A5A">indicateur de défaillance de la supervision.</text>

    <rect x="762" y="326" width="374" height="88" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="786" y="356" class="mono" font-size="12" font-weight="600" fill="#1F5560">2 · LE TITULAIRE</text>
    <text x="786" y="382" class="body" font-size="13" fill="#5A5A5A">Qui prononce la descente. Un titulaire qui ne</text>
    <text x="786" y="400" class="body" font-size="13" fill="#5A5A5A">peut pas rétrograder a un intitulé, non une autorité.</text>

    <rect x="762" y="430" width="374" height="88" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="786" y="460" class="mono" font-size="12" font-weight="600" fill="#1F5560">3 · L'AUTOMATICITÉ</text>
    <text x="786" y="486" class="body" font-size="13" fill="#5A5A5A">L'échec d'un test sur un outil R3 suspend</text>
    <text x="786" y="504" class="body" font-size="13" fill="#5A5A5A">l'habilitation sans attendre une réunion.</text>

    <rect x="762" y="534" width="374" height="88" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="786" y="564" class="mono" font-size="12" font-weight="600" fill="#1F5560">4 · LA DURÉE</text>
    <text x="786" y="590" class="body" font-size="13" fill="#5A5A5A">Sans terme, c'est une sanction. Avec un terme</text>
    <text x="786" y="608" class="body" font-size="13" fill="#5A5A5A">et des conditions de retour, c'est un dispositif.</text>
  </g>

  <rect x="64" y="700" width="1072" height="46" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="94" y="728" class="body" font-size="13.5" font-weight="500" fill="#1A1A1A">Sans boucle de descente, l'organisation empile des contrôles en aval sur un palier qu'elle n'ose plus réduire.</text>

  <line x1="64" y1="764" x2="1136" y2="764" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="786" class="body" font-size="12" font-style="italic" fill="#8A8478">Relevé sur les quatre cadres comparés au schéma 01. Les quatre éléments de la clause sont une proposition de l'auteur, adossée à l'exigence d'autorité de l'article 26 du règlement européen.</text>
</svg>
