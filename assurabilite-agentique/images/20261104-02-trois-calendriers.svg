<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Trois calendriers désalignés : la responsabilité, la conformité et l'assurance entre 2024 et 2028, et la fenêtre d'exposition de douze mois qui en résulte">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="760" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois calendriers qui se sont désalignés</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le régime qui crée l'exposition s'applique douze mois avant celui qui devait outiller le déployeur.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- fenêtre d'exposition -->
  <g class="interactive" data-card="fenetre-exposition" tabindex="0" role="button" aria-label="La fenêtre d'exposition de douze mois — cliquez pour les détails">
    <rect x="722" y="206" width="190" height="240" fill="#B7332C" fill-opacity="0.08"/>
    <line x1="722" y1="206" x2="722" y2="446" stroke="#B7332C" stroke-width="1.5"/>
    <line x1="912" y1="206" x2="912" y2="446" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="817" y="226" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">FENÊTRE</text>
    <text x="817" y="241" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#B7332C" text-anchor="middle">12 MOIS</text>
  </g>

  <!-- axe des années -->
  <text x="347" y="196" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">2025</text>
  <text x="540" y="196" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">2026</text>
  <text x="734" y="196" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">2027</text>
  <text x="927" y="196" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">2028</text>
  <line x1="347" y1="206" x2="347" y2="446" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="540" y1="206" x2="540" y2="446" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="734" y1="206" x2="734" y2="446" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="927" y1="206" x2="927" y2="446" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- piste 1 : responsabilité -->
  <text x="64" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">RESPONSABILITÉ</text>
  <text x="64" y="258" class="body" font-size="11" fill="#8A8478">ce qui crée l'exposition</text>
  <line x1="250" y1="268" x2="1120" y2="268" stroke="#B7332C" stroke-width="2.5"/>
  <circle cx="310" cy="268" r="10" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5"/>
  <text x="310" y="272" class="mono" font-size="11" font-weight="600" fill="#B7332C" text-anchor="middle">1</text>
  <g class="interactive" data-card="retrait-aild" tabindex="0" role="button" aria-label="Le retrait de la directive sur la responsabilité en matière d'IA — cliquez pour les détails">
    <circle cx="494" cy="268" r="13" fill="#B7332C"/>
    <text x="494" y="273" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
  </g>
  <g class="interactive" data-card="application-pld" tabindex="0" role="button" aria-label="L'application de la directive 2024/2853 le 9 décembre 2026 — cliquez pour les détails">
    <circle cx="722" cy="268" r="15" fill="#B7332C"/>
    <text x="722" y="273" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
  </g>

  <!-- piste 2 : conformité -->
  <text x="64" y="320" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CONFORMITÉ</text>
  <text x="64" y="338" class="body" font-size="11" fill="#8A8478">ce qui outille la défense</text>
  <line x1="250" y1="348" x2="1120" y2="348" stroke="#1F5560" stroke-width="2.5"/>
  <g class="interactive" data-card="report-omnibus" tabindex="0" role="button" aria-label="Le report des obligations haut risque par l'omnibus numérique — cliquez pour les détails">
    <circle cx="648" cy="348" r="10" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.5"/>
    <text x="648" y="352" class="mono" font-size="11" font-weight="600" fill="#1F5560" text-anchor="middle">4</text>
    <circle cx="912" cy="348" r="13" fill="#1F5560"/>
    <text x="912" y="353" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">5</text>
    <circle cx="1041" cy="348" r="10" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.5"/>
    <text x="1041" y="352" class="mono" font-size="11" font-weight="600" fill="#1F5560" text-anchor="middle">6</text>
  </g>
  <path d="M 648 362 C 700 392, 860 392, 912 362" fill="none" stroke="#1F5560" stroke-width="0.75" stroke-dasharray="3 3"/>
  <text x="780" y="388" class="body" font-size="11" fill="#1F5560" text-anchor="middle">report de seize mois</text>

  <!-- piste 3 : assurance -->
  <text x="64" y="406" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">ASSURANCE</text>
  <text x="64" y="424" class="body" font-size="11" fill="#8A8478">ce qui absorbait la zone grise</text>
  <g class="interactive" data-card="exclusions-marche" tabindex="0" role="button" aria-label="Le retrait de l'assurance de la zone grise — cliquez pour les détails">
    <line x1="250" y1="428" x2="540" y2="428" stroke="#B58A2C" stroke-width="2.5"/>
    <line x1="540" y1="428" x2="1120" y2="428" stroke="#B58A2C" stroke-width="2.5" stroke-dasharray="6 5"/>
    <circle cx="540" cy="428" r="13" fill="#B58A2C"/>
    <text x="540" y="433" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">7</text>
    <circle cx="676" cy="428" r="10" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1.5"/>
    <text x="676" y="432" class="mono" font-size="11" font-weight="600" fill="#8A6A1E" text-anchor="middle">8</text>
    <text x="1120" y="449" class="body" font-size="11" font-style="italic" fill="#8A6A1E" text-anchor="end">couverture non affirmative en voie d'exclusion</text>
  </g>

  <line x1="64" y1="470" x2="1136" y2="470" stroke="#E5E1D8" stroke-width="1"/>

  <!-- légende -->
  <text x="64" y="496" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">LES HUIT JALONS</text>

  <circle cx="76" cy="520" r="9" fill="#B7332C"/>
  <text x="76" y="524" class="mono" font-size="10.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
  <text x="96" y="518" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">23 octobre 2024 · adoption de la directive 2024/2853</text>
  <text x="96" y="535" class="body" font-size="11.5" fill="#5A5A5A">Le logiciel et les systèmes d'IA entrent dans la définition du produit.</text>

  <circle cx="76" cy="568" r="9" fill="#B7332C"/>
  <text x="76" y="572" class="mono" font-size="10.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">2</text>
  <text x="96" y="566" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">6 octobre 2025 · retrait de la directive responsabilité IA</text>
  <text x="96" y="583" class="body" font-size="11.5" fill="#5A5A5A">Avis C/2025/5423. Les pertes économiques retombent dans les droits nationaux.</text>

  <circle cx="76" cy="616" r="9" fill="#B7332C"/>
  <text x="76" y="620" class="mono" font-size="10.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">3</text>
  <text x="96" y="614" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">9 décembre 2026 · application de la directive 2024/2853</text>
  <text x="96" y="631" class="body" font-size="11.5" fill="#5A5A5A">Échéance de transposition. Aucun texte français déposé à la dernière réponse publiée.</text>

  <circle cx="76" cy="664" r="9" fill="#1F5560"/>
  <text x="76" y="668" class="mono" font-size="10.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">4</text>
  <text x="96" y="662" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">24 juillet 2026 · règlement (UE) 2026/1744</text>
  <text x="96" y="679" class="body" font-size="11.5" fill="#5A5A5A">L'omnibus numérique IA substitue des dates fixes au critère des normes.</text>

  <circle cx="620" cy="520" r="9" fill="#1F5560"/>
  <text x="620" y="524" class="mono" font-size="10.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">5</text>
  <text x="640" y="518" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">2 décembre 2027 · haut risque, annexe III</text>
  <text x="640" y="535" class="body" font-size="11.5" fill="#5A5A5A">Surveillance humaine, journalisation, information des personnes concernées.</text>

  <circle cx="620" cy="568" r="9" fill="#1F5560"/>
  <text x="620" y="572" class="mono" font-size="10.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">6</text>
  <text x="640" y="566" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">2 août 2028 · haut risque, annexe I</text>
  <text x="640" y="583" class="body" font-size="11.5" fill="#5A5A5A">Mêmes obligations sur les systèmes intégrés à des produits régulés.</text>

  <circle cx="620" cy="616" r="9" fill="#B58A2C"/>
  <text x="620" y="620" class="mono" font-size="10.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">7</text>
  <text x="640" y="614" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">janvier 2026 · avenants d'exclusion ISO</text>
  <text x="640" y="631" class="body" font-size="11.5" fill="#5A5A5A">Formulaires CG 40 47 et CG 35 08, mis à disposition des assureurs.</text>

  <circle cx="620" cy="664" r="9" fill="#B58A2C"/>
  <text x="620" y="668" class="mono" font-size="10.5" font-weight="600" fill="#FAF8F3" text-anchor="middle">8</text>
  <text x="640" y="662" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">milieu 2026 · 2 369 exclusions enregistrées</text>
  <text x="640" y="679" class="body" font-size="11.5" fill="#5A5A5A">Dans 49 États américains, plus de soixante groupes ayant déposé un libellé.</text>

  <line x1="64" y1="706" x2="1136" y2="706" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="728" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : directive (UE) 2024/2853 ; avis de retrait C/2025/5423 (JO, 6 oct. 2025) ; règlement (UE) 2026/1744 et communiqué du Conseil du 7 mai 2026 ; relevés de dépôts réglementaires rapportés par The Insurer, 23 juill. 2026.</text>
  <text x="64" y="746" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Le rapprochement des trois pistes en une fenêtre d'exposition unique est une construction de l'auteur.</text>
</svg>
