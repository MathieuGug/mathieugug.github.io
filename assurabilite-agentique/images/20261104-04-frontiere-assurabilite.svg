<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" aria-label="La frontière d'assurabilité du risque agentique : couverture affirmative, exposition non affirmative, zone d'exclusion, et le sens du mouvement de 2025 à 2026">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
    <pattern id="hatch04" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B7332C" stroke-width="1.5" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="770" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La frontière d'assurabilité</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois zones, et la bande du milieu qui se vide par le bas depuis janvier 2026.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">OÙ SE TROUVE CHAQUE FAMILLE DE SINISTRE AGENTIQUE</text>

  <!-- ===== BANDE 1 ===== -->
  <g class="interactive" data-card="zone-affirmative" tabindex="0" role="button" aria-label="La zone de couverture affirmative — cliquez pour les détails">
    <rect x="64" y="208" width="896" height="116" rx="3" fill="#1F5560" fill-opacity="0.11" stroke="#1F5560" stroke-width="1.25"/>
    <text x="88" y="236" class="display" font-size="19" font-weight="600" fill="#1F5560">Couverture affirmative</text>
    <text x="88" y="258" class="body" font-size="11.5" fill="#1F5560">Le contrat nomme l'IA</text>
    <text x="88" y="276" class="body" font-size="11.5" fill="#5A5A5A">Sinistre vérifiable,</text>
    <text x="88" y="292" class="body" font-size="11.5" fill="#5A5A5A">limite bornée,</text>
    <text x="88" y="308" class="body" font-size="11.5" fill="#5A5A5A">prime acceptée</text>
    <rect x="330" y="226" width="300" height="38" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="346" y="250" class="body" font-size="12" fill="#1A1A1A">Défaut de performance d'un modèle</text>
    <rect x="644" y="226" width="300" height="38" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="660" y="250" class="body" font-size="12" fill="#1A1A1A">Perte de tiers après hallucination</text>
    <rect x="330" y="272" width="300" height="38" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="346" y="296" class="body" font-size="12" fill="#1A1A1A">Dérive de précision sous seuil convenu</text>
    <text x="660" y="296" class="body" font-size="11.5" font-style="italic" fill="#1F5560">5 M$ par modèle · 25 M$ en agrégé</text>
  </g>

  <!-- ===== BANDE 2 ===== -->
  <g class="interactive" data-card="zone-silencieuse" tabindex="0" role="button" aria-label="La zone d'exposition non affirmative — cliquez pour les détails">
    <rect x="64" y="336" width="896" height="116" rx="3" fill="#B58A2C" fill-opacity="0.13" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="88" y="364" class="display" font-size="19" font-weight="600" fill="#8A6A1E">Exposition non affirmative</text>
    <text x="88" y="386" class="body" font-size="11.5" fill="#8A6A1E">Le contrat est muet</text>
    <text x="88" y="404" class="body" font-size="11.5" fill="#5A5A5A">Évaluabilité ambiguë,</text>
    <text x="88" y="420" class="body" font-size="11.5" fill="#5A5A5A">traitement selon la</text>
    <text x="88" y="436" class="body" font-size="11.5" fill="#5A5A5A">nature du dommage</text>
    <rect x="330" y="354" width="300" height="38" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1"/>
    <text x="346" y="378" class="body" font-size="12" fill="#1A1A1A">Décision automatisée erronée</text>
    <rect x="644" y="354" width="300" height="38" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1"/>
    <text x="660" y="378" class="body" font-size="12" fill="#1A1A1A">Corruption d'un référentiel interne</text>
    <rect x="330" y="400" width="300" height="38" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1"/>
    <text x="346" y="424" class="body" font-size="12" fill="#1A1A1A">Ciblage contesté comme discriminant</text>
    <rect x="644" y="400" width="300" height="38" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1"/>
    <text x="660" y="424" class="body" font-size="12" fill="#1A1A1A">Atteinte à la réputation d'un tiers</text>
  </g>

  <!-- ===== BANDE 3 ===== -->
  <g class="interactive" data-card="zone-exclue" tabindex="0" role="button" aria-label="La zone d'exclusion par avenant — cliquez pour les détails">
    <rect x="64" y="464" width="896" height="116" rx="3" fill="url(#hatch04)" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="65" y="465" width="894" height="114" rx="3" fill="#FAF8F3" fill-opacity="0.78"/>
    <text x="88" y="492" class="display" font-size="19" font-weight="600" fill="#B7332C">Zone d'exclusion</text>
    <text x="88" y="514" class="body" font-size="11.5" fill="#B7332C">Le contrat la retire</text>
    <text x="88" y="532" class="body" font-size="11.5" fill="#5A5A5A">Avenant inséré au</text>
    <text x="88" y="548" class="body" font-size="11.5" fill="#5A5A5A">renouvellement de</text>
    <text x="88" y="564" class="body" font-size="11.5" fill="#5A5A5A">police</text>
    <rect x="330" y="482" width="300" height="38" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1"/>
    <text x="346" y="506" class="body" font-size="12" fill="#1A1A1A">Corporel et matériel, IA génératrice</text>
    <text x="620" y="506" class="mono" font-size="10" fill="#B7332C" text-anchor="end">CG 40 47</text>
    <rect x="644" y="482" width="300" height="38" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1"/>
    <text x="660" y="506" class="body" font-size="12" fill="#1A1A1A">Produits et travaux achevés</text>
    <text x="934" y="506" class="mono" font-size="10" fill="#B7332C" text-anchor="end">CG 35 08</text>
    <rect x="330" y="528" width="300" height="38" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1"/>
    <text x="346" y="552" class="body" font-size="12" fill="#1A1A1A">Usage d'IA par un fournisseur</text>
    <rect x="644" y="528" width="300" height="38" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1"/>
    <text x="660" y="552" class="body" font-size="12" fill="#1A1A1A">Mandataires sociaux et emploi</text>
  </g>

  <!-- colonne mouvement -->
  <g class="interactive" data-card="bascule" tabindex="0" role="button" aria-label="Le sens du mouvement depuis 2025 — cliquez pour les détails">
    <rect x="976" y="336" width="160" height="244" rx="3" fill="#B7332C" fill-opacity="0.06" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="1000" y="364" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C">SENS DU</text>
    <text x="1000" y="380" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C">MOUVEMENT</text>
    <line x1="1056" y1="398" x2="1056" y2="500" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arr04)"/>
    <text x="1000" y="528" class="body" font-size="11.5" fill="#1A1A1A">La bande du</text>
    <text x="1000" y="544" class="body" font-size="11.5" fill="#1A1A1A">milieu se vide</text>
    <text x="1000" y="560" class="body" font-size="11.5" fill="#1A1A1A">par le bas.</text>
  </g>

  <text x="64" y="614" class="body" font-size="13" fill="#5A5A5A">Le même mouvement a eu lieu en cyber entre 2017 et 2021, sous le nom de fin du <tspan font-style="italic">silent cyber</tspan>. L'issue connue est une branche séparée, chère et plafonnée.</text>

  <rect x="64" y="634" width="1072" height="54" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
  <text x="88" y="656" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#1F5560">LE SIGNAL CONTRAIRE, À NE PAS NÉGLIGER</text>
  <text x="88" y="677" class="body" font-size="12" fill="#1A1A1A">Un porteur a déclaré en 2026 ne pas chercher à mettre en œuvre ces avenants, des courtiers s'y opposent, et des assureurs spécialisés préfèrent souscrire le risque.</text>

  <line x1="64" y1="706" x2="1136" y2="706" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="728" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : formulaires d'exclusion mis à disposition en janvier 2026 (CG 40 47, CG 35 08) ; relevés de dépôts et anatomie des libellés rapportés par The Insurer (29 oct. 2025 et 23 juill. 2026) et Insurance Business ;</text>
  <text x="64" y="746" class="body" font-size="10.5" font-style="italic" fill="#8A8478">limites de produit publiées par Armilla ; cartographie en trois zones d'après une préimpression de 2026. Le placement des familles de sinistre dans les trois bandes est une lecture de l'auteur.</text>
</svg>
