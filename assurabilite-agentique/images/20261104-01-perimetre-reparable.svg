<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-label="Ce que la responsabilité du fait des produits couvre : les quatre catégories de dommages croisées avec l'usage privé et l'usage professionnel">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <pattern id="hatch01" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#B8B5AE" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="790" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le périmètre réparable, et ce qui tombe à côté</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Les quatre catégories de dommages de la directive 2024/2853, croisées avec la qualité du demandeur et l'usage du bien.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">ARTICLES 5 ET 6 · CE QUI OUVRE UN DROIT À RÉPARATION</text>

  <g class="interactive" data-card="personnes-physiques" tabindex="0" role="button" aria-label="Le droit à réparation réservé aux personnes physiques — cliquez pour les détails">
    <rect x="480" y="206" width="280" height="48" rx="3" fill="#1F5560" fill-opacity="0.10" stroke="#1F5560" stroke-width="1.25"/>
    <text x="620" y="228" class="body" font-size="12.5" font-weight="600" fill="#1F5560" text-anchor="middle">Personne physique</text>
    <text x="620" y="245" class="body" font-size="11.5" fill="#1F5560" text-anchor="middle">usage non professionnel</text>
  </g>
  <g class="interactive" data-card="usage-professionnel" tabindex="0" role="button" aria-label="L'usage professionnel exclu du périmètre — cliquez pour les détails">
    <rect x="768" y="206" width="280" height="48" rx="3" fill="#B8B5AE" fill-opacity="0.20" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="908" y="228" class="body" font-size="12.5" font-weight="600" fill="#5A5A5A" text-anchor="middle">Entreprise déployeuse</text>
    <text x="908" y="245" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">usage professionnel</text>
  </g>

  <!-- Ligne 1 : dommage corporel -->
  <rect x="64" y="266" width="400" height="70" rx="3" fill="#F2EFE7"/>
  <text x="84" y="294" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Mort ou dommage corporel</text>
  <text x="84" y="314" class="body" font-size="11.5" fill="#5A5A5A">art. 6 § 1 a), santé psychologique incluse</text>
  <rect x="480" y="266" width="280" height="70" rx="3" fill="#1F5560" fill-opacity="0.14" stroke="#1F5560" stroke-width="1.25"/>
  <text x="620" y="300" class="display" font-size="17" font-weight="600" fill="#1F5560" text-anchor="middle">Réparable</text>
  <text x="620" y="320" class="body" font-size="11" fill="#1F5560" text-anchor="middle">action de la victime contre le fabricant</text>
  <rect x="768" y="266" width="280" height="70" rx="3" fill="url(#hatch01)" fill-opacity="0.5" stroke="#B8B5AE" stroke-width="1.25"/>
  <rect x="769" y="267" width="278" height="68" rx="3" fill="#FAF8F3" fill-opacity="0.72"/>
  <text x="908" y="297" class="display" font-size="16" font-weight="600" fill="#5A5A5A" text-anchor="middle">Pas demanderesse</text>
  <text x="908" y="317" class="body" font-size="11" fill="#8A8478" text-anchor="middle">art. 5 : personnes physiques seulement</text>

  <!-- Ligne 2 : biens -->
  <rect x="64" y="344" width="400" height="70" rx="3" fill="#F2EFE7"/>
  <text x="84" y="372" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Destruction ou détérioration d'un bien</text>
  <text x="84" y="392" class="body" font-size="11.5" fill="#5A5A5A">art. 6 § 1 b)</text>
  <rect x="480" y="344" width="280" height="70" rx="3" fill="#1F5560" fill-opacity="0.14" stroke="#1F5560" stroke-width="1.25"/>
  <text x="620" y="378" class="display" font-size="17" font-weight="600" fill="#1F5560" text-anchor="middle">Réparable</text>
  <text x="620" y="398" class="body" font-size="11" fill="#1F5560" text-anchor="middle">usage mixte inclus, cons. 25</text>
  <g class="interactive" data-card="biens-professionnels" tabindex="0" role="button" aria-label="L'exclusion des biens à usage exclusivement professionnel — cliquez pour les détails">
    <rect x="768" y="344" width="280" height="70" rx="3" fill="url(#hatch01)" stroke="#B7332C" stroke-width="1.25"/>
    <rect x="769" y="345" width="278" height="68" rx="3" fill="#FAF8F3" fill-opacity="0.72"/>
    <text x="908" y="375" class="display" font-size="16" font-weight="600" fill="#B7332C" text-anchor="middle">Exclu</text>
    <text x="908" y="395" class="body" font-size="11" fill="#8A4A42" text-anchor="middle">usage exclusivement pro., art. 6 § 1 b) iii)</text>
  </g>

  <!-- Ligne 3 : données -->
  <rect x="64" y="422" width="400" height="70" rx="3" fill="#F2EFE7"/>
  <text x="84" y="450" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A">Destruction ou corruption de données</text>
  <text x="84" y="470" class="body" font-size="11.5" fill="#5A5A5A">art. 6 § 1 c)</text>
  <rect x="480" y="422" width="280" height="70" rx="3" fill="#1F5560" fill-opacity="0.14" stroke="#1F5560" stroke-width="1.25"/>
  <text x="620" y="456" class="display" font-size="17" font-weight="600" fill="#1F5560" text-anchor="middle">Réparable</text>
  <text x="620" y="476" class="body" font-size="11" fill="#1F5560" text-anchor="middle">coût de restauration compris, cons. 20</text>
  <g class="interactive" data-card="donnees-professionnelles" tabindex="0" role="button" aria-label="L'exclusion des données à usage professionnel même non exclusif — cliquez pour les détails">
    <rect x="768" y="422" width="280" height="70" rx="3" fill="url(#hatch01)" stroke="#B7332C" stroke-width="1.25"/>
    <rect x="769" y="423" width="278" height="68" rx="3" fill="#FAF8F3" fill-opacity="0.72"/>
    <text x="908" y="453" class="display" font-size="16" font-weight="600" fill="#B7332C" text-anchor="middle">Exclu</text>
    <text x="908" y="473" class="body" font-size="11" fill="#8A4A42" text-anchor="middle">même en usage non exclusif, cons. 22</text>
  </g>

  <!-- Ligne 4 : perte économique -->
  <rect x="64" y="500" width="400" height="70" rx="3" fill="#B7332C" fill-opacity="0.07"/>
  <text x="84" y="528" class="body" font-size="13.5" font-weight="600" fill="#B7332C">Perte purement économique</text>
  <text x="84" y="548" class="body" font-size="11.5" fill="#8A4A42">remise erronée, achat au mauvais prix, honoraire restitué</text>
  <g class="interactive" data-card="perte-economique" tabindex="0" role="button" aria-label="La perte purement économique, hors champ des deux côtés — cliquez pour les détails">
    <rect x="480" y="500" width="568" height="70" rx="3" fill="url(#hatch01)" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="481" y="501" width="566" height="68" rx="3" fill="#FAF8F3" fill-opacity="0.7"/>
    <text x="764" y="530" class="display" font-size="18" font-weight="600" fill="#B7332C" text-anchor="middle">Hors champ des deux côtés</text>
    <text x="764" y="552" class="body" font-size="12" fill="#8A4A42" text-anchor="middle">aucune des trois catégories de l'article 6 ne la recouvre</text>
  </g>

  <text x="64" y="600" class="body" font-size="13" fill="#5A5A5A">La ligne 4 est celle que produit un agent en exploitation. Les trois régimes qui restent pour la couvrir se sont dégradés en même temps.</text>

  <g class="interactive" data-card="ce-qui-reste" tabindex="0" role="button" aria-label="Les trois régimes qui restent au déployeur — cliquez pour les détails">
    <rect x="64" y="618" width="1072" height="96" rx="3" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="88" y="644" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">CE QUI RESTE AU DÉPLOYEUR POUR CETTE LIGNE</text>
    <line x1="420" y1="656" x2="420" y2="700" stroke="#B58A2C" stroke-width="0.75"/>
    <line x1="778" y1="656" x2="778" y2="700" stroke="#B58A2C" stroke-width="0.75"/>
    <text x="88" y="676" class="body" font-size="13" font-weight="600" fill="#1A1A1A">Le contrat de fourniture</text>
    <text x="88" y="696" class="body" font-size="11.5" fill="#5A5A5A">plafonné à douze mois de redevances</text>
    <text x="446" y="676" class="body" font-size="13" font-weight="600" fill="#1A1A1A">La responsabilité civile nationale</text>
    <text x="446" y="696" class="body" font-size="11.5" fill="#5A5A5A">vingt-sept régimes, non harmonisés</text>
    <text x="804" y="676" class="body" font-size="13" font-weight="600" fill="#1A1A1A">La police d'assurance</text>
    <text x="804" y="696" class="body" font-size="11.5" fill="#5A5A5A">en cours d'exclusion par avenant</text>
  </g>

  <line x1="64" y1="744" x2="1136" y2="744" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="766" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Source : directive (UE) 2024/2853, articles 5, 6 et 14, considérants 20, 22 et 25. Qualification de la ligne 4 : lecture de l'auteur à partir du texte, aucune décision juridictionnelle ne l'ayant encore interprétée.</text>
</svg>
