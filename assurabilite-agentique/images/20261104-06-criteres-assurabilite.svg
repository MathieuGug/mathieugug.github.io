<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-label="Les neuf critères d'assurabilité de Berliner appliqués au risque agentique, avec un verdict par critère">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="790" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Neuf critères, trois échecs</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La grille d'assurabilité de Berliner (1982) appliquée au risque d'un agent en exploitation.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="80" y="192" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">CRITÈRE</text>
  <text x="338" y="192" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">CE QUE LE RISQUE AGENTIQUE LUI OPPOSE</text>
  <text x="1013" y="192" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478" text-anchor="middle">VERDICT</text>

  <!-- 1 -->
  <g class="interactive" data-card="aleas" tabindex="0" role="button" aria-label="L'aléa et la vérifiabilité du sinistre — cliquez pour les détails">
    <rect x="64" y="206" width="1072" height="46" rx="3" fill="#B7332C" fill-opacity="0.07"/>
    <text x="80" y="234" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Aléa et vérifiabilité</text>
    <text x="338" y="234" class="body" font-size="12" fill="#5A5A5A">Sans journal conservé et horodaté, la cause du sinistre reste invérifiable.</text>
    <rect x="938" y="216" width="150" height="26" rx="13" fill="#B7332C"/>
    <text x="1013" y="234" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#FAF8F3" text-anchor="middle">ÉCHOUE</text>
  </g>

  <!-- 2 -->
  <g class="interactive" data-card="perte-maximale" tabindex="0" role="button" aria-label="La perte maximale possible et l'accumulation — cliquez pour les détails">
    <rect x="64" y="258" width="1072" height="46" rx="3" fill="#B7332C" fill-opacity="0.07"/>
    <text x="80" y="286" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Perte maximale possible</text>
    <text x="338" y="286" class="body" font-size="12" fill="#5A5A5A">Trente agents reposent sur deux ou trois modèles amont : les sinistres sont corrélés.</text>
    <rect x="938" y="268" width="150" height="26" rx="13" fill="#B7332C"/>
    <text x="1013" y="286" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#FAF8F3" text-anchor="middle">ÉCHOUE</text>
  </g>

  <!-- 3 -->
  <rect x="64" y="310" width="1072" height="46" rx="3" fill="#B58A2C" fill-opacity="0.08"/>
  <text x="80" y="338" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Coût moyen par sinistre</text>
  <text x="338" y="338" class="body" font-size="12" fill="#5A5A5A">Série trop courte : deux cas publics documentés, de faible montant, en deux ans.</text>
  <rect x="938" y="320" width="150" height="26" rx="13" fill="#B58A2C" fill-opacity="0.85"/>
  <text x="1013" y="338" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#FAF8F3" text-anchor="middle">TENDU</text>

  <!-- 4 -->
  <rect x="64" y="362" width="1072" height="46" rx="3" fill="#1F5560" fill-opacity="0.07"/>
  <text x="80" y="390" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Nombre d'unités de risque</text>
  <text x="338" y="390" class="body" font-size="12" fill="#5A5A5A">Le parc de déploiements croît assez vite pour qu'une mutualisation soit possible.</text>
  <rect x="938" y="372" width="150" height="26" rx="13" fill="#1F5560" fill-opacity="0.85"/>
  <text x="1013" y="390" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#FAF8F3" text-anchor="middle">SATISFAIT</text>

  <!-- 5 -->
  <g class="interactive" data-card="asymetrie-information" tabindex="0" role="button" aria-label="L'asymétrie d'information entre assuré et assureur — cliquez pour les détails">
    <rect x="64" y="414" width="1072" height="46" rx="3" fill="#B7332C" fill-opacity="0.07"/>
    <text x="80" y="442" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Asymétrie d'information</text>
    <text x="338" y="442" class="body" font-size="12" fill="#5A5A5A">L'assureur n'observe ni le périmètre d'autorisation de l'agent ni ses jeux d'évaluation.</text>
    <rect x="938" y="424" width="150" height="26" rx="13" fill="#B7332C"/>
    <text x="1013" y="442" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#FAF8F3" text-anchor="middle">ÉCHOUE</text>
  </g>

  <!-- 6 -->
  <rect x="64" y="466" width="1072" height="46" rx="3" fill="#B58A2C" fill-opacity="0.08"/>
  <text x="80" y="494" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Prime acceptable</text>
  <text x="338" y="494" class="body" font-size="12" fill="#5A5A5A">La tarification se construit sans historique de sinistralité exploitable.</text>
  <rect x="938" y="476" width="150" height="26" rx="13" fill="#B58A2C" fill-opacity="0.85"/>
  <text x="1013" y="494" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#FAF8F3" text-anchor="middle">TENDU</text>

  <!-- 7 -->
  <g class="interactive" data-card="limites-garantie" tabindex="0" role="button" aria-label="Les limites de garantie comme réponse du marché — cliquez pour les détails">
    <rect x="64" y="518" width="1072" height="46" rx="3" fill="#1F5560" fill-opacity="0.07"/>
    <text x="80" y="546" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Limites de garantie</text>
    <text x="338" y="546" class="body" font-size="12" fill="#5A5A5A">C'est la réponse effective du marché : 5 M$ par modèle, 25 M$ en agrégé.</text>
    <rect x="938" y="528" width="150" height="26" rx="13" fill="#1F5560" fill-opacity="0.85"/>
    <text x="1013" y="546" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#FAF8F3" text-anchor="middle">SATISFAIT</text>
  </g>

  <!-- 8 -->
  <rect x="64" y="570" width="1072" height="46" rx="3" fill="#1F5560" fill-opacity="0.07"/>
  <text x="80" y="598" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Ordre public</text>
  <text x="338" y="598" class="body" font-size="12" fill="#5A5A5A">Aucun obstacle de principe à indemniser un dommage causé par un agent.</text>
  <rect x="938" y="580" width="150" height="26" rx="13" fill="#1F5560" fill-opacity="0.85"/>
  <text x="1013" y="598" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#FAF8F3" text-anchor="middle">SATISFAIT</text>

  <!-- 9 -->
  <rect x="64" y="622" width="1072" height="46" rx="3" fill="#B58A2C" fill-opacity="0.08"/>
  <text x="80" y="650" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Restrictions légales</text>
  <text x="338" y="650" class="body" font-size="12" fill="#5A5A5A">Vingt-sept régimes nationaux de responsabilité depuis le retrait d'octobre 2025.</text>
  <rect x="938" y="632" width="150" height="26" rx="13" fill="#B58A2C" fill-opacity="0.85"/>
  <text x="1013" y="650" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#FAF8F3" text-anchor="middle">TENDU</text>

  <text x="64" y="700" class="body" font-size="13" fill="#5A5A5A">Les trois échecs sont les trois mêmes questions qu'un souscripteur pose, et chacune se traite par une clause contractuelle plutôt que par une prime.</text>

  <line x1="64" y1="724" x2="1136" y2="724" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="746" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : grille d'assurabilité de Baruch Berliner (1982), reprise et appliquée à l'IA génératrice par The Geneva Association, <tspan font-style="italic">Gen AI Risks for Businesses</tspan>, octobre 2025 (enquête auprès de</text>
  <text x="64" y="764" class="body" font-size="10.5" font-style="italic" fill="#8A8478">600 décideurs en assurance d'entreprise) ; travaux de la même institution sur l'accumulation en cyber, 2023. L'attribution d'un verdict par critère est une lecture de l'auteur.</text>
</svg>
