<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="La cascade de recours et l'endroit où elle casse : responsabilité pleine envers le tiers, recours plafonné et amorti le long de la chaîne de fourniture, part conservée">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
    <marker id="arr03c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
    <pattern id="hatch03" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B7332C" stroke-width="1.6" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La cascade de recours et l'endroit où elle casse</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Responsabilité pleine d'un côté, recours plafonné et amorti de l'autre. L'écart est la part conservée.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">LA CHAÎNE, ET CE QUE CHAQUE MAILLON CONSENT</text>

  <!-- victime -->
  <g class="interactive" data-card="victime" tabindex="0" role="button" aria-label="L'action du tiers contre l'entreprise — cliquez pour les détails">
    <rect x="64" y="208" width="196" height="92" rx="3" fill="#FAF8F3" stroke="#1A1A1A" stroke-width="1.25"/>
    <text x="162" y="238" class="body" font-size="13.5" font-weight="600" fill="#1A1A1A" text-anchor="middle">Le tiers lésé</text>
    <text x="162" y="259" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">client, partenaire,</text>
    <text x="162" y="275" class="body" font-size="11.5" fill="#5A5A5A" text-anchor="middle">personne concernée</text>
    <text x="162" y="292" class="mono" font-size="11" fill="#B7332C" text-anchor="middle">2 400 000 €</text>
  </g>

  <line x1="262" y1="254" x2="310" y2="254" stroke="#B7332C" stroke-width="2.5" marker-end="url(#arr03c)"/>

  <!-- déployeur -->
  <rect x="320" y="208" width="224" height="92" rx="3" fill="#B7332C" fill-opacity="0.12" stroke="#B7332C" stroke-width="2.5"/>
  <text x="432" y="238" class="body" font-size="13.5" font-weight="600" fill="#B7332C" text-anchor="middle">L'entreprise déployeuse</text>
  <text x="432" y="259" class="body" font-size="11.5" fill="#8A4A42" text-anchor="middle">accessible, identifiable,</text>
  <text x="432" y="275" class="body" font-size="11.5" fill="#8A4A42" text-anchor="middle">solvable</text>
  <text x="432" y="293" class="mono" font-size="11.5" font-weight="600" fill="#B7332C" text-anchor="middle">répond du dommage intégral</text>

  <line x1="546" y1="254" x2="602" y2="254" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arr03)"/>
  <text x="574" y="246" class="body" font-size="10.5" fill="#5A5A5A" text-anchor="middle">recours</text>

  <!-- fournisseurs -->
  <g class="interactive" data-card="plafond-contractuel" tabindex="0" role="button" aria-label="Le plafond contractuel du fournisseur d'agent — cliquez pour les détails">
    <rect x="612" y="208" width="160" height="92" rx="3" fill="#1F5560" fill-opacity="0.12" stroke="#1F5560" stroke-width="1.25"/>
    <text x="692" y="236" class="body" font-size="12.5" font-weight="600" fill="#1F5560" text-anchor="middle">Fournisseur</text>
    <text x="692" y="253" class="body" font-size="12.5" font-weight="600" fill="#1F5560" text-anchor="middle">de l'agent</text>
    <text x="692" y="274" class="body" font-size="11" fill="#1F5560" text-anchor="middle">400 k€ de redevances</text>
    <text x="692" y="292" class="mono" font-size="12" font-weight="600" fill="#1F5560" text-anchor="middle">plafond 400 k€</text>
  </g>

  <line x1="774" y1="254" x2="794" y2="254" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arr03)"/>

  <g class="interactive" data-card="amortissement-chaine" tabindex="0" role="button" aria-label="L'amortissement du recours le long de la chaîne — cliquez pour les détails">
    <rect x="804" y="208" width="152" height="92" rx="3" fill="#1F5560" fill-opacity="0.08" stroke="#1F5560" stroke-width="1.25"/>
    <text x="880" y="236" class="body" font-size="12.5" font-weight="600" fill="#1F5560" text-anchor="middle">Plateforme</text>
    <text x="880" y="253" class="body" font-size="12.5" font-weight="600" fill="#1F5560" text-anchor="middle">d'orchestration</text>
    <text x="880" y="274" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">120 k€ de redevances</text>
    <text x="880" y="292" class="mono" font-size="12" font-weight="600" fill="#1F5560" text-anchor="middle">plafond 120 k€</text>
    <rect x="984" y="208" width="152" height="92" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#B8B5AE" stroke-width="1.25"/>
    <text x="1060" y="236" class="body" font-size="12.5" font-weight="600" fill="#5A5A5A" text-anchor="middle">Fournisseur</text>
    <text x="1060" y="253" class="body" font-size="12.5" font-weight="600" fill="#5A5A5A" text-anchor="middle">du modèle</text>
    <text x="1060" y="274" class="body" font-size="11" fill="#8A8478" text-anchor="middle">45 k€ de consommation</text>
    <text x="1060" y="292" class="mono" font-size="12" font-weight="600" fill="#5A5A5A" text-anchor="middle">plafond 45 k€</text>
    <line x1="958" y1="254" x2="978" y2="254" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arr03)"/>
  </g>

  <g class="interactive" data-card="article-14" tabindex="0" role="button" aria-label="La portée exacte de l'article 14 — cliquez pour les détails">
    <rect x="64" y="318" width="480" height="58" rx="3" fill="#B7332C" fill-opacity="0.07" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="84" y="341" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#B7332C">ARTICLE 14 · CE QU'IL PROTÈGE, ET CE QU'IL NE PROTÈGE PAS</text>
    <text x="84" y="363" class="body" font-size="12" fill="#1A1A1A">Aucune clause limitative n'est opposable au tiers lésé. Entre professionnels, le plafond joue.</text>
  </g>
  <text x="612" y="341" class="body" font-size="12" fill="#5A5A5A">Chaque maillon plafonne sur ses propres redevances,</text>
  <text x="612" y="360" class="body" font-size="12" fill="#5A5A5A">qui décroissent à mesure qu'on remonte la chaîne.</text>

  <line x1="64" y1="398" x2="1136" y2="398" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="428" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">LE MÊME SINISTRE, VU DES DEUX CÔTÉS</text>

  <!-- barre dommage -->
  <text x="64" y="470" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Dommage dû au tiers</text>
  <text x="64" y="488" class="body" font-size="11" fill="#5A5A5A">responsabilité pleine</text>
  <rect x="320" y="448" width="816" height="52" rx="3" fill="#B7332C" fill-opacity="0.85"/>
  <text x="1116" y="480" class="mono" font-size="15" font-weight="600" fill="#FAF8F3" text-anchor="end">2 400 000 €</text>

  <!-- barre recours -->
  <text x="64" y="546" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Recours mobilisable</text>
  <text x="64" y="564" class="body" font-size="11" fill="#5A5A5A">cumul des trois plafonds</text>
  <rect x="320" y="524" width="136" height="52" fill="#1F5560" fill-opacity="0.85"/>
  <rect x="456" y="524" width="41" height="52" fill="#1F5560" fill-opacity="0.5"/>
  <rect x="497" y="524" width="15" height="52" fill="#1F5560" fill-opacity="0.28"/>
  <g class="interactive" data-card="part-conservee" tabindex="0" role="button" aria-label="La part conservée, différence entre les deux barres — cliquez pour les détails">
    <rect x="512" y="524" width="624" height="52" fill="url(#hatch03)" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="513" y="525" width="622" height="50" fill="#FAF8F3" fill-opacity="0.66"/>
    <text x="824" y="548" class="display" font-size="18" font-weight="600" fill="#B7332C" text-anchor="middle">La part conservée</text>
    <text x="824" y="568" class="body" font-size="12" fill="#8A4A42" text-anchor="middle">1 835 000 € · ni transférée au fournisseur, ni couverte par la directive</text>
  </g>
  <text x="388" y="596" class="mono" font-size="11" fill="#1F5560" text-anchor="middle">400 k€</text>
  <text x="476" y="612" class="mono" font-size="10.5" fill="#1F5560" text-anchor="middle">120 k€</text>
  <line x1="476" y1="580" x2="476" y2="602" stroke="#1F5560" stroke-width="0.75"/>
  <text x="520" y="632" class="mono" font-size="10.5" fill="#5A5A5A" text-anchor="middle">45 k€</text>
  <line x1="505" y1="580" x2="505" y2="622" stroke="#5A5A5A" stroke-width="0.75"/>
  <line x1="505" y1="622" x2="516" y2="622" stroke="#5A5A5A" stroke-width="0.75"/>

  <text x="64" y="668" class="body" font-size="13" fill="#5A5A5A">Le recours ne couvre que <tspan font-weight="600" fill="#B7332C">24 %</tspan> du dommage, et il suppose encore que les trois fournisseurs soient solvables et que la cause soit prouvée contre chacun.</text>

  <rect x="64" y="688" width="1072" height="52" rx="3" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1.25"/>
  <text x="88" y="710" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A6A1E">CE QUE MESURE CE SCHÉMA</text>
  <text x="88" y="730" class="body" font-size="12" fill="#1A1A1A">Une direction qui n'a pas relevé le plafond de chacun de ses fournisseurs d'IA ne connaît pas la hauteur de sa barre hachurée.</text>

  <line x1="64" y1="758" x2="1136" y2="758" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="780" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : directive (UE) 2024/2853, article 14 ; taux de plafonnement relevés par Stanford CodeX sur données TermScout, mars 2025 (88 % des fournisseurs d'IA plafonnent). Les montants sont un exemple chiffré construit par l'auteur, non un cas observé.</text>
</svg>
