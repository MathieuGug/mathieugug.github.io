<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="L'arbre de la rétention : quatre décisions enchaînées, du plafond par conception à la provision budgétaire">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5560"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'arbre de la rétention</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre décisions enchaînées. La première est la seule qui rende les trois suivantes possibles.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">DANS CET ORDRE, ET PAS DANS UN AUTRE</text>

  <!-- ===== D1 ===== -->
  <g class="interactive" data-card="d1-plafond-conception" tabindex="0" role="button" aria-label="Décision 1, plafonner l'exposition par conception — cliquez pour les détails">
    <rect x="64" y="208" width="250" height="300" rx="3" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="2.5"/>
    <text x="82" y="234" class="mono" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#B7332C">D1</text>
    <text x="82" y="262" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Plafonner par</text>
    <text x="82" y="282" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">conception</text>
    <line x1="82" y1="300" x2="296" y2="300" stroke="#B7332C" stroke-width="0.75"/>
    <text x="82" y="326" class="mono" font-size="10.5" fill="#B7332C">01</text>
    <text x="108" y="326" class="body" font-size="11.5" fill="#1A1A1A">Montant maximal engagé</text>
    <text x="108" y="342" class="body" font-size="11.5" fill="#1A1A1A">par acte</text>
    <text x="82" y="372" class="mono" font-size="10.5" fill="#B7332C">02</text>
    <text x="108" y="372" class="body" font-size="11.5" fill="#1A1A1A">Nombre d'actes entre deux</text>
    <text x="108" y="388" class="body" font-size="11.5" fill="#1A1A1A">contrôles humains</text>
    <text x="82" y="418" class="mono" font-size="10.5" fill="#B7332C">03</text>
    <text x="108" y="418" class="body" font-size="11.5" fill="#1A1A1A">Réversibilité : un chemin</text>
    <text x="108" y="434" class="body" font-size="11.5" fill="#1A1A1A">de retour testé</text>
    <rect x="82" y="452" width="214" height="42" rx="3" fill="#B7332C" fill-opacity="0.12"/>
    <text x="94" y="470" class="body" font-size="11" font-weight="600" fill="#B7332C">Une exposition bornée,</text>
    <text x="94" y="486" class="body" font-size="11" font-weight="600" fill="#B7332C">donc négociable</text>
  </g>

  <line x1="318" y1="358" x2="334" y2="358" stroke="#1F5560" stroke-width="1.5" marker-end="url(#arr07)"/>

  <!-- ===== D2 ===== -->
  <g class="interactive" data-card="d2-provision" tabindex="0" role="button" aria-label="Décision 2, nommer la part conservée et la provisionner — cliquez pour les détails">
    <rect x="338" y="208" width="250" height="300" rx="3" fill="#1F5560" fill-opacity="0.08" stroke="#1F5560" stroke-width="1.25"/>
    <text x="356" y="234" class="mono" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#1F5560">D2</text>
    <text x="356" y="262" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Nommer et</text>
    <text x="356" y="282" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">provisionner</text>
    <line x1="356" y1="300" x2="570" y2="300" stroke="#1F5560" stroke-width="0.75"/>
    <text x="356" y="326" class="mono" font-size="10.5" fill="#1F5560">01</text>
    <text x="382" y="326" class="body" font-size="11.5" fill="#1A1A1A">Exposition annuelle du</text>
    <text x="382" y="342" class="body" font-size="11.5" fill="#1A1A1A">portefeuille d'agents</text>
    <text x="356" y="372" class="mono" font-size="10.5" fill="#1F5560">02</text>
    <text x="382" y="372" class="body" font-size="11.5" fill="#1A1A1A">Recours réellement</text>
    <text x="382" y="388" class="body" font-size="11.5" fill="#1A1A1A">mobilisable, pondéré</text>
    <text x="356" y="418" class="mono" font-size="10.5" fill="#1F5560">03</text>
    <text x="382" y="418" class="body" font-size="11.5" fill="#1A1A1A">Couverture affirmative,</text>
    <text x="382" y="434" class="body" font-size="11.5" fill="#1A1A1A">avenants lus</text>
    <rect x="356" y="452" width="214" height="42" rx="3" fill="#1F5560" fill-opacity="0.12"/>
    <text x="368" y="470" class="body" font-size="11" font-weight="600" fill="#1F5560">Une ligne budgétaire</text>
    <text x="368" y="486" class="body" font-size="11" font-weight="600" fill="#1F5560">et un propriétaire</text>
  </g>

  <line x1="592" y1="358" x2="608" y2="358" stroke="#1F5560" stroke-width="1.5" marker-end="url(#arr07)"/>

  <!-- ===== D3 ===== -->
  <g class="interactive" data-card="d3-clauses" tabindex="0" role="button" aria-label="Décision 3, les trois clauses à exiger — cliquez pour les détails">
    <rect x="612" y="208" width="250" height="300" rx="3" fill="#1F5560" fill-opacity="0.08" stroke="#1F5560" stroke-width="1.25"/>
    <text x="630" y="234" class="mono" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#1F5560">D3</text>
    <text x="630" y="262" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Exiger trois</text>
    <text x="630" y="282" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">clauses</text>
    <line x1="630" y1="300" x2="844" y2="300" stroke="#1F5560" stroke-width="0.75"/>
    <text x="630" y="326" class="mono" font-size="10.5" fill="#1F5560">01</text>
    <text x="656" y="326" class="body" font-size="11.5" fill="#1A1A1A">Communication des</text>
    <text x="656" y="342" class="body" font-size="11.5" fill="#1A1A1A">journaux, sous délai</text>
    <text x="630" y="372" class="mono" font-size="10.5" fill="#1F5560">02</text>
    <text x="656" y="372" class="body" font-size="11.5" fill="#1A1A1A">Propagation du mandat</text>
    <text x="656" y="388" class="body" font-size="11.5" fill="#1A1A1A">aux sous-traitants</text>
    <text x="630" y="418" class="mono" font-size="10.5" fill="#1F5560">03</text>
    <text x="656" y="418" class="body" font-size="11.5" fill="#1A1A1A">Restitution des traces</text>
    <text x="656" y="434" class="body" font-size="11.5" fill="#1A1A1A">à la sortie du contrat</text>
    <rect x="630" y="452" width="214" height="42" rx="3" fill="#1F5560" fill-opacity="0.12"/>
    <text x="642" y="470" class="body" font-size="11" font-weight="600" fill="#1F5560">La preuve existe le</text>
    <text x="642" y="486" class="body" font-size="11" font-weight="600" fill="#1F5560">jour du sinistre</text>
  </g>

  <line x1="866" y1="358" x2="882" y2="358" stroke="#1F5560" stroke-width="1.5" marker-end="url(#arr07)"/>

  <!-- ===== D4 ===== -->
  <g class="interactive" data-card="d4-police" tabindex="0" role="button" aria-label="Décision 4, relire les exclusions au renouvellement de police — cliquez pour les détails">
    <rect x="886" y="208" width="250" height="300" rx="3" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="904" y="234" class="mono" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#8A6A1E">D4</text>
    <text x="904" y="262" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">Relire les</text>
    <text x="904" y="282" class="display" font-size="16.5" font-weight="600" fill="#1A1A1A">exclusions</text>
    <line x1="904" y1="300" x2="1118" y2="300" stroke="#B58A2C" stroke-width="0.75"/>
    <text x="904" y="326" class="mono" font-size="10.5" fill="#8A6A1E">01</text>
    <text x="930" y="326" class="body" font-size="11.5" fill="#1A1A1A">Quelles polices</text>
    <text x="930" y="342" class="body" font-size="11.5" fill="#1A1A1A">répondraient</text>
    <text x="904" y="372" class="mono" font-size="10.5" fill="#8A6A1E">02</text>
    <text x="930" y="372" class="body" font-size="11.5" fill="#1A1A1A">Quel avenant au</text>
    <text x="930" y="388" class="body" font-size="11.5" fill="#1A1A1A">prochain renouvellement</text>
    <text x="904" y="418" class="mono" font-size="10.5" fill="#8A6A1E">03</text>
    <text x="930" y="418" class="body" font-size="11.5" fill="#1A1A1A">Atteint-il l'IA</text>
    <text x="930" y="434" class="body" font-size="11.5" fill="#1A1A1A">employée par un tiers</text>
    <rect x="904" y="452" width="214" height="42" rx="3" fill="#B58A2C" fill-opacity="0.16"/>
    <text x="916" y="470" class="body" font-size="11" font-weight="600" fill="#8A6A1E">La zone grise est</text>
    <text x="916" y="486" class="body" font-size="11" font-weight="600" fill="#8A6A1E">cartographiée</text>
  </g>

  <!-- bande résultat -->
  <rect x="64" y="536" width="1072" height="106" rx="3" fill="#1A1A1A" fill-opacity="0.04" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="88" y="562" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#1A1A1A">CE QUE LES QUATRE DÉCISIONS PRODUISENT</text>
  <text x="88" y="594" class="body" font-size="14" fill="#1A1A1A">Part conservée</text>
  <text x="212" y="594" class="mono" font-size="15" fill="#5A5A5A">=</text>
  <text x="236" y="594" class="body" font-size="13" fill="#1A1A1A">exposition annuelle du portefeuille</text>
  <text x="474" y="594" class="mono" font-size="15" fill="#B7332C">−</text>
  <text x="498" y="594" class="body" font-size="13" fill="#1A1A1A">recours mobilisable amorti</text>
  <text x="684" y="594" class="mono" font-size="15" fill="#B7332C">−</text>
  <text x="708" y="594" class="body" font-size="13" fill="#1A1A1A">couverture affirmative effective</text>
  <line x1="88" y1="608" x2="1112" y2="608" stroke="#B8B5AE" stroke-width="0.5"/>
  <text x="88" y="630" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">Le solde est la provision. Tant qu'il n'est pas calculé, il vaut la totalité de l'exposition et il n'a pas de propriétaire.</text>

  <text x="64" y="672" class="body" font-size="13" fill="#5A5A5A">D1 relève de la direction data, et non de la direction des risques : le plafond se pose dans la configuration de l'agent, avant toute discussion d'assurance.</text>

  <line x1="64" y1="700" x2="1136" y2="700" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="722" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Les quatre décisions, les trois grandeurs du plafond par conception et la formule de la part conservée sont une construction de l'auteur. Elles s'appuient sur la grille d'assurabilité de Berliner telle</text>
  <text x="64" y="740" class="body" font-size="10.5" font-style="italic" fill="#8A8478">qu'appliquée par The Geneva Association (octobre 2025) et sur l'article 14 de la directive (UE) 2024/2853. Aucune n'a été éprouvée contractuellement à grande échelle.</text>
</svg>
