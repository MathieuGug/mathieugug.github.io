<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 786" role="img" aria-label="Capacité offerte contre exposition : les limites publiées des produits d'assurance IA comparées à l'exposition d'un portefeuille de trente agents">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <pattern id="hatch05" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B7332C" stroke-width="1.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="786" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La capacité offerte, et ce qu'elle doit couvrir</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Limites publiées des produits de 2026, comparées à l'exposition d'un portefeuille de trente agents.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="192" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">EN MILLIONS DE DOLLARS</text>

  <!-- axe -->
  <text x="336" y="214" class="mono" font-size="10.5" fill="#8A8478" text-anchor="middle">0</text>
  <text x="436" y="214" class="mono" font-size="10.5" fill="#8A8478" text-anchor="middle">10</text>
  <text x="586" y="214" class="mono" font-size="10.5" fill="#8A8478" text-anchor="middle">25</text>
  <text x="836" y="214" class="mono" font-size="10.5" fill="#8A8478" text-anchor="middle">50</text>
  <text x="1086" y="214" class="mono" font-size="10.5" fill="#8A8478" text-anchor="middle">75</text>
  <line x1="336" y1="222" x2="336" y2="566" stroke="#B8B5AE" stroke-width="1"/>
  <line x1="436" y1="222" x2="436" y2="566" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="836" y1="222" x2="836" y2="566" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="1086" y1="222" x2="1086" y2="566" stroke="#E5E1D8" stroke-width="0.5"/>
  <line x1="586" y1="222" x2="586" y2="590" stroke="#1F5560" stroke-width="1.25" stroke-dasharray="5 4"/>

  <!-- barre 1 : par modèle -->
  <g class="interactive" data-card="limite-par-modele" tabindex="0" role="button" aria-label="La limite par modèle — cliquez pour les détails">
    <text x="64" y="252" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Limite par modèle</text>
    <text x="64" y="269" class="body" font-size="11" fill="#5A5A5A">responsabilité civile IA</text>
    <rect x="336" y="234" width="50" height="44" rx="2" fill="#1F5560" fill-opacity="0.85"/>
    <text x="400" y="262" class="mono" font-size="13" font-weight="600" fill="#1F5560">5 M$</text>
  </g>

  <!-- barre 2 : agrégé -->
  <g class="interactive" data-card="limite-agregee" tabindex="0" role="button" aria-label="La limite agrégée par assuré — cliquez pour les détails">
    <text x="64" y="318" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Limite agrégée par assuré</text>
    <text x="64" y="335" class="body" font-size="11" fill="#5A5A5A">tous modèles confondus</text>
    <rect x="336" y="300" width="250" height="44" rx="2" fill="#1F5560" fill-opacity="0.85"/>
    <text x="600" y="328" class="mono" font-size="13" font-weight="600" fill="#1F5560">25 M$</text>
  </g>

  <!-- barre 3 : garantie de performance -->
  <g class="interactive" data-card="garantie-performance" tabindex="0" role="button" aria-label="La garantie de performance souscrite par le fournisseur — cliquez pour les détails">
    <text x="64" y="384" class="body" font-size="12.5" font-weight="600" fill="#1A1A1A">Garantie de performance</text>
    <text x="64" y="401" class="body" font-size="11" fill="#5A5A5A">souscrite par le fournisseur</text>
    <text x="64" y="417" class="body" font-size="11" font-style="italic" fill="#8A6A1E">pas une RC du déployeur</text>
    <rect x="336" y="366" width="500" height="44" rx="2" fill="#B58A2C" fill-opacity="0.35" stroke="#B58A2C" stroke-width="1.25" stroke-dasharray="5 4"/>
    <text x="850" y="394" class="mono" font-size="13" font-weight="600" fill="#8A6A1E">50 M$</text>
  </g>

  <!-- barre 4 : exposition -->
  <g class="interactive" data-card="exposition-portefeuille" tabindex="0" role="button" aria-label="L'exposition d'un portefeuille de trente agents — cliquez pour les détails">
    <text x="64" y="470" class="body" font-size="12.5" font-weight="600" fill="#B7332C">Exposition du portefeuille</text>
    <text x="64" y="487" class="body" font-size="11" fill="#8A4A42">trente agents, un sinistre</text>
    <text x="64" y="503" class="body" font-size="11" fill="#8A4A42">plausible de 2,4 M$ chacun</text>
    <rect x="336" y="446" width="720" height="48" rx="2" fill="url(#hatch05)" stroke="#B7332C" stroke-width="1.5"/>
    <rect x="337" y="447" width="718" height="46" rx="2" fill="#FAF8F3" fill-opacity="0.6"/>
    <text x="1072" y="476" class="mono" font-size="13" font-weight="600" fill="#B7332C">72 M$</text>
  </g>

  <text x="594" y="588" class="body" font-size="11.5" font-weight="600" fill="#1F5560">l'agrégé disponible est consommé par le premier sinistre sérieux</text>

  <line x1="64" y1="612" x2="1136" y2="612" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="640" class="body" font-size="13" fill="#5A5A5A">Une entreprise qui exploite trente agents ne dispose pas de trente fois cinq millions. Elle dispose d'un agrégé de vingt-cinq millions.</text>

  <rect x="64" y="660" width="528" height="56" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
  <text x="88" y="682" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#1F5560">CE QUE LA BARRE JAUNE N'EST PAS</text>
  <text x="88" y="702" class="body" font-size="12" fill="#1A1A1A">Elle s'active sur un seuil de performance manqué, et non sur un dommage de tiers.</text>

  <rect x="608" y="660" width="528" height="56" rx="3" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1.25"/>
  <text x="632" y="682" class="mono" font-size="10.5" letter-spacing="0.08em" fill="#8A6A1E">L'ORDRE DE GRANDEUR DU MARCHÉ DE L'ÉCART</text>
  <text x="632" y="702" class="body" font-size="12" fill="#1A1A1A">Une structure positionnée sur l'exposition exclue a levé 10 M$ de fonds propres en 2026.</text>

  <line x1="64" y1="736" x2="1136" y2="736" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="752" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : limites publiées par Armilla (25 M$ en agrégé par assuré, 5 M$ par modèle) ; documentation produit aiSure de Munich Re ; levée de fonds</text>
  <text x="64" y="768" class="body" font-size="10.5" font-style="italic" fill="#8A8478">rapportée par Insurance Business, 2026. L'exposition du portefeuille est un exemple chiffré construit par l'auteur, prolongeant le schéma 03.</text>
</svg>
