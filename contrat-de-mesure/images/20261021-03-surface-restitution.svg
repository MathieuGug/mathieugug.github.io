<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="La surface de restitution d'une plateforme rangée en trois zones : ce qui est publié par défaut, ce qui se négocie, ce qui ne s'obtient pas">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Ce qui est déjà publié, et que personne ne demande</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La surface de restitution est plus large qu'on ne le croit. L'écart exploitable tient dans la zone du milieu.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Zone 1 -->
  <g class="interactive" data-card="publie-defaut" tabindex="0" role="button" aria-label="Zone 1, ce qui est publié par défaut — cliquez pour les détails">
    <rect x="64" y="190" width="1072" height="156" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="190" width="5" height="156" fill="#1F5560"/>
    <line x1="248" y1="206" x2="248" y2="330" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="90" y="220" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">ZONE 1</text>
    <text x="90" y="250" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Publié par</text>
    <text x="90" y="274" class="display" font-size="20" font-weight="600" fill="#1A1A1A">défaut</text>
    <text x="90" y="310" class="body" font-size="12" font-style="italic" fill="#5A5A5A">coût de négociation : nul</text>
    <text x="272" y="226" class="body" font-size="14" fill="#1A1A1A">▪ L'impact du mode consentement : la part des</text>
    <text x="286" y="245" class="body" font-size="14" fill="#5A5A5A">conversions modélisées sur les observées</text>
    <text x="272" y="286" class="body" font-size="14" fill="#1A1A1A">▪ Les seuils d'activation de la modélisation</text>
    <text x="286" y="305" class="body" font-size="14" fill="#5A5A5A">(ordre de 700 clics sur 7 jours selon le produit)</text>
    <text x="704" y="226" class="body" font-size="14" fill="#1A1A1A">▪ Les seuils d'agrégation de la salle blanche :</text>
    <text x="718" y="245" class="body" font-size="14" fill="#5A5A5A">dix ou cinquante utilisateurs par ligne</text>
    <text x="704" y="286" class="body" font-size="14" fill="#1A1A1A">▪ Le périmètre d'accréditation déclaré par le</text>
    <text x="718" y="305" class="body" font-size="14" fill="#5A5A5A">fournisseur, et ses exclusions</text>
  </g>

  <!-- Zone 2 -->
  <g class="interactive" data-card="sur-demande" tabindex="0" role="button" aria-label="Zone 2, ce qui se négocie — cliquez pour les détails">
    <rect x="64" y="362" width="1072" height="200" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="2.5"/>
    <rect x="64" y="362" width="5" height="200" fill="#B58A2C"/>
    <line x1="248" y1="378" x2="248" y2="546" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="90" y="392" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">ZONE 2</text>
    <text x="90" y="422" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Sur demande,</text>
    <text x="90" y="446" class="display" font-size="20" font-weight="600" fill="#1A1A1A">négociable</text>
    <text x="90" y="484" class="display" font-size="15" font-style="italic" fill="#B7332C">l'écart exploitable</text>
    <text x="90" y="512" class="body" font-size="12" font-style="italic" fill="#5A5A5A">c'est ici que se joue</text>
    <text x="90" y="530" class="body" font-size="12" font-style="italic" fill="#5A5A5A">le contrat de mesure</text>
    <text x="272" y="398" class="body" font-size="14" fill="#1A1A1A">▪ L'export vers les outils de mesure de</text>
    <text x="286" y="417" class="body" font-size="14" fill="#5A5A5A">l'annonceur, déjà déclaré à la Commission</text>
    <text x="272" y="450" class="body" font-size="14" fill="#1A1A1A">▪ Le journal d'événements au niveau impression</text>
    <text x="272" y="483" class="body" font-size="14" fill="#1A1A1A">▪ Le résumé de lignes filtrées comme livrable</text>
    <text x="286" y="502" class="body" font-size="14" fill="#5A5A5A">obligatoire, et non comme option</text>
    <text x="272" y="535" class="body" font-size="14" fill="#1A1A1A">▪ La part modélisée inscrite au compte rendu</text>
    <text x="704" y="398" class="body" font-size="14" fill="#1A1A1A">▪ La notification préalable de tout changement</text>
    <text x="718" y="417" class="body" font-size="14" fill="#5A5A5A">de seuil ou de définition d'indicateur</text>
    <text x="704" y="450" class="body" font-size="14" fill="#1A1A1A">▪ Les variables de contrôle fournies au modèle</text>
    <text x="718" y="469" class="body" font-size="14" fill="#5A5A5A">interne, à la même maille et au même délai</text>
    <text x="704" y="502" class="body" font-size="14" fill="#1A1A1A">▪ La restitution terminale de l'historique en</text>
    <text x="718" y="521" class="body" font-size="14" fill="#5A5A5A">fin de contrat, et sa durée de conservation</text>
  </g>

  <!-- Zone 3 -->
  <g class="interactive" data-card="jamais" tabindex="0" role="button" aria-label="Zone 3, ce qui ne s'obtient pas — cliquez pour les détails">
    <rect x="64" y="578" width="1072" height="122" rx="3" fill="#F2EFE7" stroke="#B7332C" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="64" y="578" width="5" height="122" fill="#B7332C"/>
    <line x1="248" y1="594" x2="248" y2="684" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="90" y="608" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ZONE 3</text>
    <text x="90" y="638" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Jamais</text>
    <text x="90" y="662" class="display" font-size="20" font-weight="600" fill="#1A1A1A">communiqué</text>
    <text x="272" y="614" class="body" font-size="14" fill="#5A5A5A">▪ Les poids du modèle et la liste des variables</text>
    <text x="286" y="633" class="body" font-size="14" fill="#5A5A5A">explicatives retenues</text>
    <text x="272" y="666" class="body" font-size="14" fill="#5A5A5A">▪ La procédure de calibration et l'historique</text>
    <text x="286" y="685" class="body" font-size="14" fill="#5A5A5A">des réentraînements</text>
    <text x="704" y="614" class="body" font-size="14" fill="#5A5A5A">▪ Le détail des cas situés sous le plancher de</text>
    <text x="718" y="633" class="body" font-size="14" fill="#5A5A5A">confidentialité, qu'un audit devrait éprouver</text>
    <text x="704" y="666" class="body" font-size="14" fill="#5A5A5A">▪ Les paramètres du dispositif d'attribution</text>
    <text x="718" y="685" class="body" font-size="14" fill="#5A5A5A">propriétaire</text>
  </g>

  <!-- Règle -->
  <g class="interactive" data-card="ecart" tabindex="0" role="button" aria-label="Règle de rédaction — cliquez pour les détails">
    <rect x="64" y="724" width="1072" height="84" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="64" y="724" width="5" height="84" fill="#1A1A1A"/>
    <text x="94" y="752" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">RÈGLE DE RÉDACTION</text>
    <text x="94" y="780" class="display" font-size="18" fill="#1A1A1A">Une clause utile ne demande rien à la zone 3. Elle verrouille par écrit ce que la zone 1 publie</text>
    <text x="94" y="802" class="display" font-size="18" fill="#1A1A1A">déjà sans engagement, et conquiert la zone 2 ligne par ligne.</text>
  </g>

  <text x="64" y="846" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : documentation Google sur la modélisation du mode consentement et sur Ads Data Hub ; résumé public du rapport de conformité de Meta au règlement sur</text>
  <text x="64" y="864" class="body" font-size="12" font-style="italic" fill="#5A5A5A">les marchés numériques ; Media Rating Council, politique de représentation 2024. Classement en trois zones établi par l'auteur.</text>
</svg>
