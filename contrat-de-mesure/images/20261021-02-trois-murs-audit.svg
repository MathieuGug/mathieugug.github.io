<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Les trois obstacles structurels à l'audit de la méthode de mesure d'une plateforme : plancher de confidentialité, absence d'auditeur de place, manque de puissance statistique">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois murs devant l'audit de la méthode</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Aucun des trois ne se lève par la négociation commerciale. Ils sont indépendants et cumulatifs.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- La demande -->
  <rect x="64" y="186" width="1072" height="58" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="88" y="211" class="mono" font-size="11" letter-spacing="0.1em" fill="#5A5A5A">LA CLAUSE QU'ON ÉCRIT SPONTANÉMENT</text>
  <text x="88" y="233" class="display" font-size="17" font-style="italic" fill="#1A1A1A">« Le prestataire communique la méthodologie de modélisation de ses indicateurs et en permet l'audit par un tiers mandaté. »</text>

  <line x1="600" y1="248" x2="600" y2="272" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow02)"/>

  <!-- Mur 1 -->
  <g class="interactive" data-card="mur-confidentialite" tabindex="0" role="button" aria-label="Premier mur, le plancher de confidentialité — cliquez pour les détails">
    <rect x="64" y="286" width="340" height="334" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="286" width="340" height="5" fill="#1F5560"/>
    <text x="88" y="320" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">MUR 1</text>
    <text x="88" y="350" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le plancher de</text>
    <text x="88" y="374" class="display" font-size="20" font-weight="600" fill="#1A1A1A">confidentialité</text>
    <text x="88" y="422" class="mono" font-size="30" font-weight="500" fill="#1F5560">10 / 50</text>
    <text x="88" y="444" class="body" font-size="12" font-style="italic" fill="#5A5A5A">utilisateurs minimum par ligne</text>
    <text x="88" y="462" class="body" font-size="12" font-style="italic" fill="#5A5A5A">de résultat, selon le type de requête</text>
    <line x1="88" y1="478" x2="380" y2="478" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="88" y="504" class="body" font-size="14" fill="#1A1A1A">Les lignes sous le seuil sont écartées</text>
    <text x="88" y="523" class="body" font-size="14" fill="#1A1A1A">du résultat, et toute désagrégation</text>
    <text x="88" y="542" class="body" font-size="14" fill="#1A1A1A">est interdite par les conditions</text>
    <text x="88" y="561" class="body" font-size="14" fill="#1A1A1A">d'usage. Les mailles fines qu'un audit</text>
    <text x="88" y="580" class="body" font-size="14" fill="#1A1A1A">devrait éprouver disparaissent les</text>
    <text x="88" y="599" class="body" font-size="14" fill="#1A1A1A">premières.</text>
  </g>

  <!-- Mur 2 -->
  <g class="interactive" data-card="mur-juge-partie" tabindex="0" role="button" aria-label="Deuxième mur, juge et partie sans arbitre — cliquez pour les détails">
    <rect x="430" y="286" width="340" height="334" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="430" y="286" width="340" height="5" fill="#B58A2C"/>
    <text x="454" y="320" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">MUR 2</text>
    <text x="454" y="350" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Juge et partie,</text>
    <text x="454" y="374" class="display" font-size="20" font-weight="600" fill="#1A1A1A">sans arbitre</text>
    <text x="454" y="422" class="mono" font-size="30" font-weight="500" fill="#B58A2C">5 domaines</text>
    <text x="454" y="444" class="body" font-size="12" font-style="italic" fill="#5A5A5A">résumés par l'organisme</text>
    <text x="454" y="462" class="body" font-size="12" font-style="italic" fill="#5A5A5A">d'accréditation de la place</text>
    <line x1="454" y1="478" x2="746" y2="478" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="454" y="504" class="body" font-size="14" fill="#1A1A1A">Visibilité, trafic invalide sophistiqué,</text>
    <text x="454" y="523" class="body" font-size="14" fill="#1A1A1A">audience, sûreté de marque, résultats.</text>
    <text x="454" y="542" class="body" font-size="14" fill="#1A1A1A">La mesure du lift n'y figure pas.</text>
    <text x="454" y="561" class="body" font-size="14" fill="#1A1A1A">L'annonceur demande un service</text>
    <text x="454" y="580" class="body" font-size="14" fill="#1A1A1A">qu'aucune institution ne rend : il n'y a</text>
    <text x="454" y="599" class="body" font-size="14" fill="#1A1A1A">pas d'auditeur à mandater.</text>
  </g>

  <!-- Mur 3 -->
  <g class="interactive" data-card="mur-puissance" tabindex="0" role="button" aria-label="Troisième mur, le manque de puissance statistique — cliquez pour les détails">
    <rect x="796" y="286" width="340" height="334" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="796" y="286" width="340" height="5" fill="#B7332C"/>
    <text x="820" y="320" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">MUR 3</text>
    <text x="820" y="350" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Le signal</text>
    <text x="820" y="374" class="display" font-size="20" font-weight="600" fill="#1A1A1A">n'y est pas</text>
    <text x="820" y="422" class="mono" font-size="30" font-weight="500" fill="#B7332C">&gt; 100 pts</text>
    <text x="820" y="444" class="body" font-size="12" font-style="italic" fill="#5A5A5A">d'intervalle de confiance médian</text>
    <text x="820" y="462" class="body" font-size="12" font-style="italic" fill="#5A5A5A">sur le retour, 25 expériences</text>
    <line x1="820" y1="478" x2="1112" y2="478" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="820" y="504" class="body" font-size="14" fill="#1A1A1A">Le coefficient de variation des ventes</text>
    <text x="820" y="523" class="body" font-size="14" fill="#1A1A1A">individuelles atteint couramment un</text>
    <text x="820" y="542" class="body" font-size="14" fill="#1A1A1A">ordre de grandeur de dix. Même avec</text>
    <text x="820" y="561" class="body" font-size="14" fill="#1A1A1A">un accès intégral aux données brutes,</text>
    <text x="820" y="580" class="body" font-size="14" fill="#1A1A1A">deux méthodes ne se départagent pas</text>
    <text x="820" y="599" class="body" font-size="14" fill="#1A1A1A">sur un trimestre.</text>
  </g>

  <!-- Conséquence -->
  <g class="interactive" data-card="consequence" tabindex="0" role="button" aria-label="Conséquence de rédaction — cliquez pour les détails">
    <rect x="64" y="652" width="1072" height="84" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="64" y="652" width="5" height="84" fill="#1A1A1A"/>
    <text x="94" y="680" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CONSÉQUENCE DE RÉDACTION</text>
    <text x="94" y="708" class="display" font-size="18" fill="#1A1A1A">L'audit de la méthode n'est pas refusé par les plateformes : il est hors de portée de l'annonceur.</text>
    <text x="94" y="730" class="display" font-size="18" fill="#1A1A1A">Une clause qui l'exige produit une négociation enlisée. Il faut demander la restitution.</text>
  </g>

  <text x="64" y="774" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : documentation Ads Data Hub (seuils d'agrégation, lignes écartées, interdiction de désagréger) ; Media Rating Council, périmètre d'accréditation résumé ;</text>
  <text x="64" y="792" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Lewis &amp; Rao, « The Unfavorable Economics of Measuring the Returns to Advertising », Quarterly Journal of Economics, 2015. Mise en regard de l'auteur.</text>
</svg>
