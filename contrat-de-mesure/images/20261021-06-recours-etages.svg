<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Les quatre étages de recours ouverts à l'annonceur quand la restitution n'est pas remise, avec le délai réaliste et l'effet de chacun">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arrow06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Le recours, étage par étage</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">L'efficacité réelle de ces quatre étages est l'inverse de leur réputation.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="184" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">ESCALADE</text>
  <line x1="150" y1="180" x2="1136" y2="180" stroke="#5A5A5A" stroke-width="0.75" marker-end="url(#arrow06)"/>

  <!-- Étage 1 -->
  <g class="interactive" data-card="etage-credit" tabindex="0" role="button" aria-label="Premier étage, le crédit de service — cliquez pour les détails">
    <rect x="64" y="200" width="256" height="376" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="200" width="256" height="5" fill="#1F5560"/>
    <text x="88" y="232" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">ÉTAGE 1</text>
    <text x="88" y="262" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le crédit</text>
    <text x="88" y="285" class="display" font-size="19" font-weight="600" fill="#1A1A1A">de service</text>
    <text x="88" y="322" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">DÉLAI RÉALISTE</text>
    <text x="88" y="352" class="mono" font-size="22" font-weight="500" fill="#1F5560">1 mois</text>
    <line x1="88" y1="372" x2="296" y2="372" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="88" y="396" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL PRODUIT</text>
    <text x="88" y="418" class="body" font-size="13" fill="#1A1A1A">Une trace datée du</text>
    <text x="88" y="436" class="body" font-size="13" fill="#1A1A1A">manquement. Sa valeur</text>
    <text x="88" y="454" class="body" font-size="13" fill="#1A1A1A">est documentaire avant</text>
    <text x="88" y="472" class="body" font-size="13" fill="#1A1A1A">d'être financière : c'est</text>
    <text x="88" y="490" class="body" font-size="13" fill="#1A1A1A">elle qui rend les étages</text>
    <text x="88" y="508" class="body" font-size="13" fill="#1A1A1A">suivants utilisables.</text>
    <line x1="88" y1="526" x2="296" y2="526" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="88" y="548" class="body" font-size="12" font-style="italic" fill="#5A5A5A">La clause la moins chère</text>
    <text x="88" y="565" class="body" font-size="12" font-style="italic" fill="#5A5A5A">et la plus oubliée.</text>
  </g>

  <!-- Étage 2 -->
  <g class="interactive" data-card="etage-audit" tabindex="0" role="button" aria-label="Deuxième étage, le droit d'audit — cliquez pour les détails">
    <rect x="336" y="200" width="256" height="376" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="336" y="200" width="256" height="5" fill="#1F5560"/>
    <text x="360" y="232" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">ÉTAGE 2</text>
    <text x="360" y="262" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le droit</text>
    <text x="360" y="285" class="display" font-size="19" font-weight="600" fill="#1A1A1A">d'audit</text>
    <text x="360" y="322" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">DÉLAI RÉALISTE</text>
    <text x="360" y="352" class="mono" font-size="22" font-weight="500" fill="#1F5560">3 à 6 mois</text>
    <line x1="360" y1="372" x2="568" y2="372" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="360" y="396" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL PRODUIT</text>
    <text x="360" y="418" class="body" font-size="13" fill="#1A1A1A">Un constat contradictoire.</text>
    <text x="360" y="436" class="body" font-size="13" fill="#1A1A1A">Le modèle de contrat de</text>
    <text x="360" y="454" class="body" font-size="13" fill="#1A1A1A">place distingue l'audit de</text>
    <text x="360" y="472" class="body" font-size="13" fill="#1A1A1A">conformité de l'audit de</text>
    <text x="360" y="490" class="body" font-size="13" fill="#1A1A1A">performance, et couvre les</text>
    <text x="360" y="508" class="body" font-size="13" fill="#1A1A1A">prestations opaques.</text>
    <line x1="360" y1="526" x2="568" y2="526" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="360" y="548" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Demander une clause de</text>
    <text x="360" y="565" class="body" font-size="12" font-style="italic" fill="#5A5A5A">place est plus facile.</text>
  </g>

  <!-- Étage 3 -->
  <g class="interactive" data-card="etage-regulateur" tabindex="0" role="button" aria-label="Troisième étage, le régulateur — cliquez pour les détails">
    <rect x="608" y="200" width="256" height="376" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="608" y="200" width="256" height="5" fill="#B58A2C"/>
    <text x="632" y="232" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">ÉTAGE 3</text>
    <text x="632" y="262" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le</text>
    <text x="632" y="285" class="display" font-size="19" font-weight="600" fill="#1A1A1A">régulateur</text>
    <text x="632" y="322" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">DÉLAI RÉALISTE</text>
    <text x="632" y="352" class="mono" font-size="22" font-weight="500" fill="#B58A2C">18 mois +</text>
    <line x1="632" y1="372" x2="840" y2="372" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="632" y="396" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL PRODUIT</text>
    <text x="632" y="418" class="body" font-size="13" fill="#1A1A1A">Un échange documenté</text>
    <text x="632" y="436" class="body" font-size="13" fill="#1A1A1A">entre la plateforme et la</text>
    <text x="632" y="454" class="body" font-size="13" fill="#1A1A1A">Commission. Le levier joue</text>
    <text x="632" y="472" class="body" font-size="13" fill="#1A1A1A">par anticipation, bien</text>
    <text x="632" y="490" class="body" font-size="13" fill="#1A1A1A">avant la décision.</text>
    <line x1="632" y1="526" x2="840" y2="526" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="632" y="548" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Réservé aux contrôleurs</text>
    <text x="632" y="565" class="body" font-size="12" font-style="italic" fill="#5A5A5A">d'accès désignés.</text>
  </g>

  <!-- Étage 4 -->
  <g class="interactive" data-card="etage-budget" tabindex="0" role="button" aria-label="Quatrième étage, la réallocation du budget — cliquez pour les détails">
    <rect x="880" y="200" width="256" height="376" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="880" y="200" width="256" height="5" fill="#B7332C"/>
    <text x="904" y="232" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ÉTAGE 4 · LE SEUL AUTONOME</text>
    <text x="904" y="262" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La réallocation</text>
    <text x="904" y="285" class="display" font-size="19" font-weight="600" fill="#1A1A1A">du budget</text>
    <text x="904" y="322" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">DÉLAI RÉALISTE</text>
    <text x="904" y="352" class="mono" font-size="22" font-weight="500" fill="#B7332C">1 arbitrage</text>
    <line x1="904" y1="372" x2="1112" y2="372" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="904" y="396" class="mono" font-size="10" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL PRODUIT</text>
    <text x="904" y="418" class="body" font-size="13" fill="#1A1A1A">Le seul effet qui ne</text>
    <text x="904" y="436" class="body" font-size="13" fill="#1A1A1A">dépende pas de l'accord</text>
    <text x="904" y="454" class="body" font-size="13" fill="#1A1A1A">du fournisseur, dont le</text>
    <text x="904" y="472" class="body" font-size="13" fill="#1A1A1A">délai soit maîtrisé et dont</text>
    <text x="904" y="490" class="body" font-size="13" fill="#1A1A1A">le montant se chiffre.</text>
    <line x1="904" y1="526" x2="1112" y2="526" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="904" y="548" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Condition unique, et elle</text>
    <text x="904" y="565" class="body" font-size="12" font-style="italic" fill="#5A5A5A">est organisationnelle.</text>
  </g>

  <!-- Règle -->
  <rect x="64" y="608" width="1072" height="92" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
  <rect x="64" y="608" width="5" height="92" fill="#1A1A1A"/>
  <text x="94" y="638" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LA RÈGLE QUI SE DÉGAGE</text>
  <text x="94" y="666" class="display" font-size="18" fill="#1A1A1A">Un contrat sans crédit de service documentaire (étage 1) et sans chemin court vers l'arbitre</text>
  <text x="94" y="690" class="display" font-size="18" fill="#1A1A1A">budgétaire (étage 4) n'a pas de recours, quelles que soient les obligations qu'il énonce.</text>

  <text x="64" y="742" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : ANA, Master Media Buying Services Agreement, version de juin 2023 (distinction audit de conformité / audit de performance) ; règlement (UE) 2022/1925,</text>
  <text x="64" y="760" class="body" font-size="12" font-style="italic" fill="#5A5A5A">art. 6(8) ; décisions de la Commission européenne des 5 septembre 2025 et 23 juillet 2026. Délais indicatifs estimés par l'auteur.</text>
</svg>
