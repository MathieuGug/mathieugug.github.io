<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-label="Trois régimes d'accès créés par le droit européen, comparés sur quatre questions : qui demande, qui vérifie, ce qui est produit, sous quel délai">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="830" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois régimes d'accès, un seul sans procédure</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le même législateur, en moins de quatre ans, a écrit trois droits d'accès aux données. Deux sont outillés.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Column headers -->
  <g class="interactive" data-card="regime-art15" tabindex="0" role="button" aria-label="Régime de l'article 15 du règlement sur les marchés numériques — cliquez pour les détails">
    <rect x="240" y="196" width="296" height="76" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.25"/>
    <rect x="240" y="196" width="296" height="5" fill="#1F5560"/>
    <text x="258" y="229" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">MARCHÉS NUMÉRIQUES · ART. 15</text>
    <text x="258" y="254" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Profilage des personnes</text>
  </g>
  <g class="interactive" data-card="regime-dsa40" tabindex="0" role="button" aria-label="Régime de l'article 40 du règlement sur les services numériques — cliquez pour les détails">
    <rect x="544" y="196" width="296" height="76" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.25"/>
    <rect x="544" y="196" width="296" height="5" fill="#B58A2C"/>
    <text x="562" y="229" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">SERVICES NUMÉRIQUES · ART. 40</text>
    <text x="562" y="254" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Recherche publique</text>
  </g>
  <g class="interactive" data-card="regime-art68" tabindex="0" role="button" aria-label="Régime de l'article 6(8) du règlement sur les marchés numériques — cliquez pour les détails">
    <rect x="848" y="196" width="288" height="76" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="848" y="196" width="288" height="5" fill="#B7332C"/>
    <text x="866" y="229" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">MARCHÉS NUMÉRIQUES · ART. 6(8)</text>
    <text x="866" y="254" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Mesure publicitaire</text>
  </g>

  <!-- Row 1 -->
  <line x1="64" y1="288" x2="1136" y2="288" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="316" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">QUI DEMANDE</text>
  <text x="258" y="318" class="body" font-size="14" fill="#1A1A1A">La Commission, d'office, dans les</text>
  <text x="258" y="337" class="body" font-size="14" fill="#1A1A1A">six mois de la désignation.</text>
  <text x="562" y="318" class="body" font-size="14" fill="#1A1A1A">Le chercheur, par un portail</text>
  <text x="562" y="337" class="body" font-size="14" fill="#1A1A1A">central d'instruction.</text>
  <text x="866" y="318" class="body" font-size="14" fill="#1A1A1A">L'annonceur, auprès du</text>
  <text x="866" y="337" class="body" font-size="14" fill="#1A1A1A">fournisseur, à titre gratuit.</text>

  <!-- Row 2 -->
  <line x1="64" y1="368" x2="1136" y2="368" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="396" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">QUI VÉRIFIE</text>
  <text x="258" y="398" class="body" font-size="14" fill="#1A1A1A">Un auditeur indépendant, avec</text>
  <text x="258" y="417" class="body" font-size="14" fill="#1A1A1A">une assurance raisonnable.</text>
  <text x="562" y="398" class="body" font-size="14" fill="#1A1A1A">Le coordinateur national des</text>
  <text x="562" y="417" class="body" font-size="14" fill="#1A1A1A">services numériques.</text>
  <text x="866" y="398" class="display" font-size="19" font-weight="600" font-style="italic" fill="#B7332C">Personne.</text>

  <!-- Row 3 -->
  <line x1="64" y1="448" x2="1136" y2="448" stroke="#E5E1D8" stroke-width="0.5"/>
  <g class="interactive" data-card="ligne-produit" tabindex="0" role="button" aria-label="Ce que chaque régime produit — cliquez pour les détails">
    <rect x="60" y="452" width="176" height="74" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
    <text x="72" y="482" class="mono" font-size="11" letter-spacing="0.09em" fill="#1A1A1A">CE QUI EST</text>
    <text x="72" y="500" class="mono" font-size="11" letter-spacing="0.09em" fill="#1A1A1A">PRODUIT</text>
    <text x="72" y="518" class="mono" font-size="10" letter-spacing="0.06em" fill="#B7332C">▸ détail</text>
  </g>
  <text x="258" y="478" class="body" font-size="14" fill="#1A1A1A">Un document normalisé : modèle</text>
  <text x="258" y="497" class="body" font-size="14" fill="#1A1A1A">de rapport publié par la</text>
  <text x="258" y="516" class="body" font-size="14" fill="#1A1A1A">Commission, révisé chaque an.</text>
  <text x="562" y="478" class="body" font-size="14" fill="#1A1A1A">Un jeu de données : types et</text>
  <text x="562" y="497" class="body" font-size="14" fill="#1A1A1A">formats éligibles définis par</text>
  <text x="562" y="516" class="body" font-size="14" fill="#1A1A1A">l'acte délégué.</text>
  <text x="866" y="478" class="body" font-size="14" fill="#1A1A1A">Un accès. Le texte ne dit ni la</text>
  <text x="866" y="497" class="body" font-size="14" fill="#1A1A1A">forme, ni la maille, ni le</text>
  <text x="866" y="516" class="body" font-size="14" fill="#1A1A1A">format de restitution.</text>

  <!-- Row 4 -->
  <line x1="64" y1="546" x2="1136" y2="546" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="64" y="574" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">DÉLAI</text>
  <text x="258" y="576" class="body" font-size="14" fill="#1A1A1A">Six mois, puis révision au</text>
  <text x="258" y="595" class="body" font-size="14" fill="#1A1A1A">moins annuelle.</text>
  <text x="562" y="576" class="body" font-size="14" fill="#1A1A1A">Instruction encadrée depuis</text>
  <text x="562" y="595" class="body" font-size="14" fill="#1A1A1A">le 29 octobre 2025.</text>
  <text x="866" y="576" class="display" font-size="19" font-weight="600" font-style="italic" fill="#B7332C">Aucun.</text>
  <line x1="64" y1="626" x2="1136" y2="626" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Verdict -->
  <g class="interactive" data-card="verdict" tabindex="0" role="button" aria-label="Verdict de lecture — cliquez pour les détails">
    <rect x="64" y="656" width="1072" height="92" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <rect x="64" y="656" width="5" height="92" fill="#1A1A1A"/>
    <text x="94" y="686" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QUE LA COMPARAISON ÉTABLIT</text>
    <text x="94" y="714" class="display" font-size="18" fill="#1A1A1A">Le législateur sait imposer un document audité, et sait construire une procédure d'accès.</text>
    <text x="94" y="738" class="display" font-size="18" fill="#1A1A1A">Pour l'annonceur, il a écrit le droit et laissé la procédure au contrat.</text>
  </g>

  <text x="64" y="786" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : règlement (UE) 2022/1925, art. 6(8) et 15 ; modèle de rapport art. 15 de la Commission européenne (12 décembre 2023) ; acte délégué relatif à</text>
  <text x="64" y="804" class="body" font-size="12" font-style="italic" fill="#5A5A5A">l'art. 40 du règlement sur les services numériques, en vigueur le 29 octobre 2025. Lecture et mise en regard de l'auteur.</text>
</svg>
