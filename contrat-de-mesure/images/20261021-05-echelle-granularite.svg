<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 836" role="img" aria-label="L'échelle de granularité de la restitution : journal d'événements, salle blanche, flux agrégé, tableau de bord, et ce que chaque niveau permet de trancher">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="836" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'échelle de granularité se tranche avant de signer</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La largeur de chaque barreau mesure l'étendue des questions que l'entreprise pourra trancher elle-même.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="64" y="186" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">NIVEAU DE RESTITUTION INSCRIT AU CONTRAT</text>

  <!-- Niveau 1 -->
  <g class="interactive" data-card="niveau-journal" tabindex="0" role="button" aria-label="Niveau 1, le journal d'événements — cliquez pour les détails">
    <rect x="64" y="200" width="1072" height="112" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="64" y="200" width="5" height="112" fill="#B7332C"/>
    <text x="90" y="226" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">NIVEAU 1 · LE PLUS RICHE, LE PLUS RARE</text>
    <text x="90" y="256" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le journal d'événements</text>
    <text x="90" y="282" class="body" font-size="14" fill="#1A1A1A">On peut trancher : réconciliation financière indépendante, vérification de la chaîne d'approvisionnement, recomptage des conversions.</text>
    <text x="90" y="302" class="body" font-size="13" fill="#5A5A5A">Le seul niveau qui permette de contredire le fournisseur sur son propre chiffre. Rarement accordé par contrat.</text>
    <circle cx="1096" cy="288" r="9" fill="#B7332C"/>
    <text x="1096" y="292" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">a</text>
  </g>
  <line x1="1096" y1="302" x2="1096" y2="446" stroke="#5A5A5A" stroke-width="0.75" stroke-dasharray="2 3"/>

  <!-- Niveau 2 -->
  <g class="interactive" data-card="niveau-salle-blanche" tabindex="0" role="button" aria-label="Niveau 2, la salle blanche — cliquez pour les détails">
    <rect x="64" y="326" width="880" height="112" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="326" width="5" height="112" fill="#1F5560"/>
    <text x="90" y="352" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">NIVEAU 2 · LE PLUS RÉPANDU</text>
    <text x="90" y="382" class="display" font-size="21" font-weight="600" fill="#1A1A1A">La salle blanche</text>
    <text x="90" y="408" class="body" font-size="14" fill="#1A1A1A">On peut trancher : recoupement d'audience, séquence d'exposition, contribution par segment.</text>
    <text x="90" y="428" class="body" font-size="13" fill="#5A5A5A">Gouverné par le plancher de confidentialité. Exiger le résumé de lignes filtrées comme livrable.</text>
  </g>

  <!-- Niveau 3 -->
  <g class="interactive" data-card="niveau-flux" tabindex="0" role="button" aria-label="Niveau 3, le flux agrégé — cliquez pour les détails">
    <rect x="64" y="452" width="680" height="112" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="452" width="5" height="112" fill="#B58A2C"/>
    <text x="90" y="478" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">NIVEAU 3 · LE PLUS FACILE À OBTENIR</text>
    <text x="90" y="508" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Le flux agrégé</text>
    <text x="90" y="534" class="body" font-size="14" fill="#1A1A1A">On peut trancher : pilotage budgétaire, modèle de contribution interne.</text>
    <text x="90" y="554" class="body" font-size="13" fill="#5A5A5A">Le piège est la maille : sans découpage géographique, pas de calibration.</text>
  </g>

  <!-- Niveau 4 -->
  <g class="interactive" data-card="niveau-tableau" tabindex="0" role="button" aria-label="Niveau 4, le tableau de bord — cliquez pour les détails">
    <rect x="64" y="578" width="440" height="94" rx="3" fill="#F2EFE7" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="64" y="578" width="5" height="94" fill="#B8B5AE"/>
    <text x="90" y="604" class="mono" font-size="11" letter-spacing="0.1em" fill="#5A5A5A">NIVEAU 4 · CE N'EST PAS UNE RESTITUTION</text>
    <text x="90" y="634" class="display" font-size="21" font-weight="600" fill="#5A5A5A">Le tableau de bord</text>
    <text x="90" y="660" class="body" font-size="13" fill="#5A5A5A">On ne tranche rien qui soit opposable.</text>
  </g>

  <!-- Annotation (a) -->
  <g class="interactive" data-card="annotation-ana" tabindex="0" role="button" aria-label="Encadré sur l'étude de 2023 relative à l'accès aux journaux d'événements — cliquez pour les détails">
    <rect x="800" y="452" width="336" height="308" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
    <circle cx="824" cy="452" r="9" fill="#B7332C"/>
    <text x="824" y="456" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">a</text>
    <text x="824" y="492" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">L'OBSTACLE EST CONTRACTUEL</text>
    <text x="824" y="520" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Ce que l'étude de 2023</text>
    <text x="824" y="543" class="display" font-size="18" font-weight="600" fill="#1A1A1A">a réellement mesuré</text>
    <line x1="824" y1="560" x2="1112" y2="560" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="824" y="584" class="body" font-size="14" fill="#1A1A1A">123 M$ de dépense, 21 annonceurs</text>
    <text x="824" y="603" class="body" font-size="14" fill="#1A1A1A">et 35 milliards d'impressions</text>
    <text x="824" y="622" class="body" font-size="14" fill="#1A1A1A">analysés au niveau du journal.</text>
    <text x="824" y="650" class="body" font-size="14" fill="#1A1A1A">67 volontaires au départ. 46 n'ont</text>
    <text x="824" y="669" class="body" font-size="14" fill="#1A1A1A">pas pu obtenir leurs journaux</text>
    <text x="824" y="688" class="body" font-size="14" fill="#1A1A1A">auprès de leurs plateformes ou de</text>
    <text x="824" y="707" class="body" font-size="14" fill="#1A1A1A">leurs prestataires de vérification.</text>
    <text x="824" y="730" class="body" font-size="13" font-style="italic" fill="#5A5A5A">Un peu plus de la moitié seulement avaient</text>
    <text x="824" y="747" class="body" font-size="13" font-style="italic" fill="#5A5A5A">un accès direct par leur propre contrat.</text>
  </g>

  <text x="64" y="798" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Sources : Association of National Advertisers, Programmatic Media Supply Chain Transparency Study, 2023 ; documentation Ads Data Hub (seuils d'agrégation et</text>
  <text x="64" y="816" class="body" font-size="12" font-style="italic" fill="#5A5A5A">résumé de lignes filtrées). Échelle et correspondance questions-niveaux établies par l'auteur ; la largeur des barreaux est qualitative.</text>
</svg>
