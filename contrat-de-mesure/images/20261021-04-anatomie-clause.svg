<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="Anatomie de la clause de restitution : quatre paramètres, ce que chacun demande, comment il se vérifie, et ce que son absence coûte">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="880" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Anatomie de la clause de restitution</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre paramètres. Aucun ne demande la méthode, et chacun se vérifie sans y accéder.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="74" y="186" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">PARAMÈTRE</text>
  <text x="324" y="186" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUE LA CLAUSE DEMANDE</text>
  <text x="640" y="186" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">COMMENT ON VÉRIFIE</text>
  <text x="904" y="186" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUE SON ABSENCE COÛTE</text>

  <!-- Paramètre 1 -->
  <g class="interactive" data-card="param-part-modelisee" tabindex="0" role="button" aria-label="Premier paramètre, la part modélisée — cliquez pour les détails">
    <rect x="64" y="198" width="1072" height="132" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="198" width="5" height="132" fill="#1F5560"/>
    <line x1="300" y1="212" x2="300" y2="316" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="616" y1="212" x2="616" y2="316" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="880" y1="212" x2="880" y2="316" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="90" y="228" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">P1</text>
    <text x="90" y="256" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La part</text>
    <text x="90" y="279" class="display" font-size="19" font-weight="600" fill="#1A1A1A">modélisée</text>
    <text x="90" y="310" class="body" font-size="12" font-style="italic" fill="#5A5A5A">un chiffre, pas une méthode</text>
    <text x="324" y="230" class="body" font-size="14" fill="#1A1A1A">Pour chaque indicateur facturé ou</text>
    <text x="324" y="249" class="body" font-size="14" fill="#1A1A1A">utilisé en pilotage : la proportion</text>
    <text x="324" y="268" class="body" font-size="14" fill="#1A1A1A">issue d'un modèle et celle issue</text>
    <text x="324" y="287" class="body" font-size="14" fill="#1A1A1A">d'une observation, à la maille du</text>
    <text x="324" y="306" class="body" font-size="14" fill="#1A1A1A">rapport remis.</text>
    <text x="640" y="230" class="body" font-size="14" fill="#5A5A5A">Comparaison au ratio</text>
    <text x="640" y="249" class="body" font-size="14" fill="#5A5A5A">que le fournisseur publie</text>
    <text x="640" y="268" class="body" font-size="14" fill="#5A5A5A">déjà, couple domaine-</text>
    <text x="640" y="287" class="body" font-size="14" fill="#5A5A5A">pays par couple.</text>
    <text x="904" y="230" class="body" font-size="14" fill="#5A5A5A">Une variation de</text>
    <text x="904" y="249" class="body" font-size="14" fill="#5A5A5A">performance devient</text>
    <text x="904" y="268" class="body" font-size="14" fill="#5A5A5A">indécidable : changement</text>
    <text x="904" y="287" class="body" font-size="14" fill="#5A5A5A">de modèle ou de marché.</text>
  </g>

  <!-- Paramètre 2 -->
  <g class="interactive" data-card="param-seuil" tabindex="0" role="button" aria-label="Deuxième paramètre, le seuil de non-réponse — cliquez pour les détails">
    <rect x="64" y="342" width="1072" height="132" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="64" y="342" width="5" height="132" fill="#B7332C"/>
    <line x1="300" y1="356" x2="300" y2="460" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="616" y1="356" x2="616" y2="460" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="880" y1="356" x2="880" y2="460" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="90" y="372" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">P2 · PIVOT</text>
    <text x="90" y="400" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le seuil de</text>
    <text x="90" y="423" class="display" font-size="19" font-weight="600" fill="#1A1A1A">non-réponse</text>
    <text x="90" y="454" class="body" font-size="12" font-style="italic" fill="#5A5A5A">le plus négligé des quatre</text>
    <text x="324" y="374" class="body" font-size="14" fill="#1A1A1A">La publication des seuils sous</text>
    <text x="324" y="393" class="body" font-size="14" fill="#1A1A1A">lesquels rien n'est restitué —</text>
    <text x="324" y="412" class="body" font-size="14" fill="#1A1A1A">activation, agrégation, apport —</text>
    <text x="324" y="431" class="body" font-size="14" fill="#1A1A1A">et la notification préalable de</text>
    <text x="324" y="450" class="body" font-size="14" fill="#1A1A1A">chaque évolution.</text>
    <text x="640" y="374" class="body" font-size="14" fill="#5A5A5A">Lecture des mailles vides</text>
    <text x="640" y="393" class="body" font-size="14" fill="#5A5A5A">du rapport : chacune doit</text>
    <text x="640" y="412" class="body" font-size="14" fill="#5A5A5A">s'expliquer par un seuil</text>
    <text x="640" y="431" class="body" font-size="14" fill="#5A5A5A">connu d'avance.</text>
    <text x="904" y="374" class="body" font-size="14" fill="#5A5A5A">Une maille non restituée</text>
    <text x="904" y="393" class="body" font-size="14" fill="#5A5A5A">est lue comme une maille</text>
    <text x="904" y="412" class="body" font-size="14" fill="#5A5A5A">sans effet. C'est l'erreur de</text>
    <text x="904" y="431" class="body" font-size="14" fill="#5A5A5A">lecture la plus coûteuse.</text>
  </g>

  <!-- Paramètre 3 -->
  <g class="interactive" data-card="param-delai" tabindex="0" role="button" aria-label="Troisième paramètre, le délai et le format — cliquez pour les détails">
    <rect x="64" y="486" width="1072" height="132" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="486" width="5" height="132" fill="#B58A2C"/>
    <line x1="300" y1="500" x2="300" y2="604" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="616" y1="500" x2="616" y2="604" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="880" y1="500" x2="880" y2="604" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="90" y="516" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">P3</text>
    <text x="90" y="544" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le délai et</text>
    <text x="90" y="567" class="display" font-size="19" font-weight="600" fill="#1A1A1A">le format</text>
    <text x="90" y="598" class="body" font-size="12" font-style="italic" fill="#5A5A5A">un engagement de service</text>
    <text x="324" y="518" class="body" font-size="14" fill="#1A1A1A">Niveau de granularité, format,</text>
    <text x="324" y="537" class="body" font-size="14" fill="#1A1A1A">fréquence, délai de mise à</text>
    <text x="324" y="556" class="body" font-size="14" fill="#1A1A1A">disposition, durée de conservation.</text>
    <text x="324" y="575" class="body" font-size="14" fill="#1A1A1A">Les variables de contrôle du modèle</text>
    <text x="324" y="594" class="body" font-size="14" fill="#1A1A1A">interne entrent dans le périmètre.</text>
    <text x="640" y="518" class="body" font-size="14" fill="#5A5A5A">Horodatage des remises</text>
    <text x="640" y="537" class="body" font-size="14" fill="#5A5A5A">et stabilité des colonnes</text>
    <text x="640" y="556" class="body" font-size="14" fill="#5A5A5A">d'une période à l'autre.</text>
    <text x="904" y="518" class="body" font-size="14" fill="#5A5A5A">L'analyse ne sort jamais</text>
    <text x="904" y="537" class="body" font-size="14" fill="#5A5A5A">de l'environnement du</text>
    <text x="904" y="556" class="body" font-size="14" fill="#5A5A5A">fournisseur, et la série</text>
    <text x="904" y="575" class="body" font-size="14" fill="#5A5A5A">repart de zéro à la sortie.</text>
  </g>

  <!-- Paramètre 4 -->
  <g class="interactive" data-card="param-recours" tabindex="0" role="button" aria-label="Quatrième paramètre, le recours — cliquez pour les détails">
    <rect x="64" y="630" width="1072" height="132" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="630" width="5" height="132" fill="#B7332C"/>
    <line x1="300" y1="644" x2="300" y2="748" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="616" y1="644" x2="616" y2="748" stroke="#E5E1D8" stroke-width="0.5"/>
    <line x1="880" y1="644" x2="880" y2="748" stroke="#E5E1D8" stroke-width="0.5"/>
    <text x="90" y="660" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">P4</text>
    <text x="90" y="688" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le recours</text>
    <text x="90" y="724" class="body" font-size="12" font-style="italic" fill="#5A5A5A">le seul des quatre</text>
    <text x="90" y="742" class="body" font-size="12" font-style="italic" fill="#5A5A5A">qui ait un prix</text>
    <text x="324" y="662" class="body" font-size="14" fill="#1A1A1A">Ce qui se déclenche quand rien</text>
    <text x="324" y="681" class="body" font-size="14" fill="#1A1A1A">n'est remis : crédit de service sur le</text>
    <text x="324" y="700" class="body" font-size="14" fill="#1A1A1A">délai, droit d'audit distingué,</text>
    <text x="324" y="719" class="body" font-size="14" fill="#1A1A1A">chemin court vers l'arbitre du</text>
    <text x="324" y="738" class="body" font-size="14" fill="#1A1A1A">budget.</text>
    <text x="640" y="662" class="body" font-size="14" fill="#5A5A5A">Un manquement daté, et</text>
    <text x="640" y="681" class="body" font-size="14" fill="#5A5A5A">la trace de son traitement</text>
    <text x="640" y="700" class="body" font-size="14" fill="#5A5A5A">dans le registre des droits</text>
    <text x="640" y="719" class="body" font-size="14" fill="#5A5A5A">d'accès.</text>
    <text x="904" y="662" class="body" font-size="14" fill="#5A5A5A">Les trois paramètres</text>
    <text x="904" y="681" class="body" font-size="14" fill="#5A5A5A">précédents redeviennent</text>
    <text x="904" y="700" class="body" font-size="14" fill="#5A5A5A">des déclarations</text>
    <text x="904" y="719" class="body" font-size="14" fill="#5A5A5A">d'intention.</text>
  </g>

  <rect x="64" y="784" width="1072" height="48" rx="3" fill="#F2EFE7" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="90" y="804" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ORDRE DE NÉGOCIATION</text>
  <text x="90" y="824" class="display" font-size="16" fill="#1A1A1A">Du calcul que le fournisseur fait déjà (P1) au seul des quatre qui ait un prix (P4). Ouvrir par le recours produit un refus global.</text>

  <text x="64" y="862" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Grille de rédaction établie par l'auteur, à partir de la documentation publique des plateformes et du modèle de contrat d'achat média de l'ANA (juin 2023).</text>
</svg>
