<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-label="Six clauses de mesure rangées par moment de négociation, avec leur coût apparent pour le fournisseur et leur valeur probatoire pour l'annonceur">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="860" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Six clauses, trois moments</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">La sortie opérationnelle du dossier. Quatre des six coûtent peu au fournisseur, et c'est par elles qu'on ouvre.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="70" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">MOMENT</text>
  <text x="240" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CLAUSE À ÉCRIRE</text>
  <text x="840" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">COÛT APPARENT</text>
  <text x="992" y="190" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">VALEUR PROBATOIRE</text>
  <line x1="64" y1="202" x2="1136" y2="202" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Moment labels -->
  <g class="interactive" data-card="moment-avant" tabindex="0" role="button" aria-label="Moment : avant de signer — cliquez pour les détails">
    <rect x="64" y="202" width="152" height="288" fill="#F2EFE7"/>
    <rect x="64" y="202" width="5" height="288" fill="#1F5560"/>
    <text x="88" y="238" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">MOMENT 1</text>
    <text x="88" y="268" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Avant de</text>
    <text x="88" y="291" class="display" font-size="19" font-weight="600" fill="#1A1A1A">signer</text>
    <text x="88" y="322" class="body" font-size="12" font-style="italic" fill="#5A5A5A">trois clauses</text>
    <text x="88" y="354" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Irrattrapable après</text>
    <text x="88" y="370" class="body" font-size="11" font-style="italic" fill="#5A5A5A">la signature : le</text>
    <text x="88" y="386" class="body" font-size="11" font-style="italic" fill="#5A5A5A">niveau de granularité</text>
    <text x="88" y="402" class="body" font-size="11" font-style="italic" fill="#5A5A5A">ne se renégocie pas</text>
    <text x="88" y="418" class="body" font-size="11" font-style="italic" fill="#5A5A5A">en cours de contrat.</text>
  </g>
  <g class="interactive" data-card="moment-exploitation" tabindex="0" role="button" aria-label="Moment : en exploitation — cliquez pour les détails">
    <rect x="64" y="490" width="152" height="192" fill="#F2EFE7"/>
    <rect x="64" y="490" width="5" height="192" fill="#B58A2C"/>
    <text x="88" y="526" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">MOMENT 2</text>
    <text x="88" y="556" class="display" font-size="19" font-weight="600" fill="#1A1A1A">En</text>
    <text x="88" y="579" class="display" font-size="19" font-weight="600" fill="#1A1A1A">exploitation</text>
    <text x="88" y="610" class="body" font-size="12" font-style="italic" fill="#5A5A5A">deux clauses</text>
    <text x="88" y="644" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Elles produisent</text>
    <text x="88" y="660" class="body" font-size="11" font-style="italic" fill="#5A5A5A">la preuve datée.</text>
  </g>
  <g class="interactive" data-card="moment-sortie" tabindex="0" role="button" aria-label="Moment : à la sortie — cliquez pour les détails">
    <rect x="64" y="682" width="152" height="100" fill="#F2EFE7"/>
    <rect x="64" y="682" width="5" height="100" fill="#B7332C"/>
    <text x="88" y="712" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">MOMENT 3</text>
    <text x="88" y="742" class="display" font-size="19" font-weight="600" fill="#1A1A1A">À la sortie</text>
    <text x="88" y="770" class="body" font-size="12" font-style="italic" fill="#5A5A5A">une clause</text>
  </g>

  <!-- Clause 1 -->
  <text x="240" y="226" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">CLAUSE 1</text>
  <text x="240" y="252" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Restitution de la part modélisée</text>
  <text x="240" y="275" class="body" font-size="14" fill="#5A5A5A">Pour chaque indicateur facturé ou utilisé en pilotage, la proportion issue d'un modèle</text>
  <text x="240" y="293" class="body" font-size="14" fill="#5A5A5A">et celle issue d'une observation, à la maille du rapport remis.</text>
  <circle cx="847" cy="247" r="6" fill="#5A5A5A" fill-opacity="0.22" stroke="#5A5A5A" stroke-width="1"/><text x="862" y="252" class="mono" font-size="15" fill="#5A5A5A">faible</text>
  <text x="840" y="276" class="body" font-size="11" font-style="italic" fill="#5A5A5A">le calcul existe déjà</text>
  <text x="992" y="252" class="mono" font-size="17" fill="#B7332C">●●●</text>
  <text x="992" y="276" class="body" font-size="11" font-style="italic" fill="#5A5A5A">date les ruptures de série</text>
  <line x1="228" y1="298" x2="1136" y2="298" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- Clause 2 (pivot) -->
  <g class="interactive" data-card="clause-pivot" tabindex="0" role="button" aria-label="Clause pivot, la publication et la notification préalable des seuils — cliquez pour les détails">
    <rect x="228" y="298" width="908" height="96" fill="#FFFFFF" stroke="#B7332C" stroke-width="2.5"/>
    <text x="240" y="322" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">CLAUSE 2 · LA CLAUSE PIVOT</text>
    <text x="240" y="348" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Publication et notification préalable des seuils</text>
    <text x="240" y="371" class="body" font-size="14" fill="#5A5A5A">Les seuils sous lesquels rien n'est restitué sont publiés, et leur évolution notifiée avant</text>
    <text x="240" y="389" class="body" font-size="14" fill="#5A5A5A">application. Seuils d'activation, d'agrégation, et d'apport minimal par maille.</text>
    <circle cx="847" cy="343" r="6" fill="#5A5A5A" fill-opacity="0.22" stroke="#5A5A5A" stroke-width="1"/><text x="862" y="348" class="mono" font-size="15" fill="#5A5A5A">faible</text>
    <text x="840" y="372" class="body" font-size="11" font-style="italic" fill="#5A5A5A">documentation publique</text>
    <text x="992" y="348" class="mono" font-size="17" fill="#B7332C">●●●</text>
    <text x="992" y="372" class="body" font-size="11" font-style="italic" fill="#5A5A5A">une absence lue</text>
    <text x="992" y="388" class="body" font-size="11" font-style="italic" fill="#5A5A5A">comme un effet nul</text>
  </g>

  <!-- Clause 3 -->
  <text x="240" y="422" class="mono" font-size="11" letter-spacing="0.09em" fill="#1F5560">CLAUSE 3</text>
  <text x="240" y="448" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Granularité, format, délai, conservation</text>
  <text x="240" y="471" class="body" font-size="14" fill="#5A5A5A">Le niveau choisi sur l'échelle du schéma 5. Les variables de contrôle du modèle interne</text>
  <text x="240" y="489" class="body" font-size="14" fill="#5A5A5A">entrent au même régime. En salle blanche, le résumé de lignes filtrées est un livrable.</text>
  <circle cx="847" cy="443" r="6" fill="#B58A2C" fill-opacity="0.55" stroke="#B58A2C" stroke-width="1"/><text x="862" y="448" class="mono" font-size="15" fill="#B58A2C">moyen</text>
  <text x="840" y="472" class="body" font-size="11" font-style="italic" fill="#5A5A5A">dépend du niveau visé</text>
  <text x="992" y="448" class="mono" font-size="17" fill="#B7332C">●●</text>
  <text x="992" y="472" class="body" font-size="11" font-style="italic" fill="#5A5A5A">autonomie de l'analyse</text>
  <line x1="228" y1="494" x2="1136" y2="494" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Clause 4 -->
  <text x="240" y="518" class="mono" font-size="11" letter-spacing="0.09em" fill="#B58A2C">CLAUSE 4</text>
  <text x="240" y="544" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Crédit de service sur le délai de remise</text>
  <text x="240" y="567" class="body" font-size="14" fill="#5A5A5A">Pénalité modeste, déclenchement automatique au dépassement. La valeur</text>
  <text x="240" y="585" class="body" font-size="14" fill="#5A5A5A">recherchée est la trace datée du manquement plutôt que le montant recouvré.</text>
  <circle cx="847" cy="539" r="6" fill="#5A5A5A" fill-opacity="0.22" stroke="#5A5A5A" stroke-width="1"/><text x="862" y="544" class="mono" font-size="15" fill="#5A5A5A">faible</text>
  <text x="840" y="568" class="body" font-size="11" font-style="italic" fill="#5A5A5A">montant symbolique</text>
  <text x="992" y="544" class="mono" font-size="17" fill="#B7332C">●●</text>
  <text x="992" y="568" class="body" font-size="11" font-style="italic" fill="#5A5A5A">ouvre les étages suivants</text>
  <line x1="228" y1="590" x2="1136" y2="590" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- Clause 5 -->
  <text x="240" y="614" class="mono" font-size="11" letter-spacing="0.09em" fill="#B58A2C">CLAUSE 5</text>
  <text x="240" y="640" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Droit d'audit distingué</text>
  <text x="240" y="663" class="body" font-size="14" fill="#5A5A5A">Audit de conformité et audit de performance traités séparément, en s'appuyant sur le</text>
  <text x="240" y="681" class="body" font-size="14" fill="#5A5A5A">modèle de place. Le périmètre couvre les prestations non transparentes.</text>
  <circle cx="847" cy="635" r="6" fill="#B58A2C" fill-opacity="0.55" stroke="#B58A2C" stroke-width="1"/><text x="862" y="640" class="mono" font-size="15" fill="#B58A2C">moyen</text>
  <text x="840" y="664" class="body" font-size="11" font-style="italic" fill="#5A5A5A">clause de place existante</text>
  <text x="992" y="640" class="mono" font-size="17" fill="#B7332C">●●</text>
  <text x="992" y="664" class="body" font-size="11" font-style="italic" fill="#5A5A5A">constat contradictoire</text>
  <line x1="228" y1="686" x2="1136" y2="686" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Clause 6 -->
  <text x="240" y="710" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">CLAUSE 6</text>
  <text x="240" y="736" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Restitution terminale et conservation</text>
  <text x="240" y="759" class="body" font-size="14" fill="#5A5A5A">Remise finale de l'historique complet au niveau convenu, dans un délai fixé, et accès en</text>
  <text x="240" y="777" class="body" font-size="14" fill="#5A5A5A">lecture maintenu pendant une période déterminée après la fin du contrat.</text>
  <circle cx="847" cy="731" r="6" fill="#B7332C" fill-opacity="1.0" stroke="#B7332C" stroke-width="1"/><text x="862" y="736" class="mono" font-size="15" fill="#B7332C">élevé</text>
  <text x="840" y="760" class="body" font-size="11" font-style="italic" fill="#5A5A5A">le point dur</text>
  <text x="992" y="736" class="mono" font-size="17" fill="#B7332C">●●●</text>
  <text x="992" y="760" class="body" font-size="11" font-style="italic" fill="#5A5A5A">continuité de la série au</text>
  <text x="992" y="777" class="body" font-size="11" font-style="italic" fill="#5A5A5A">changement de régie</text>
  <line x1="64" y1="790" x2="1136" y2="790" stroke="#1A1A1A" stroke-width="1"/>

  <text x="64" y="818" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Grille de rédaction établie par l'auteur. Appuis documentaires : documentation publique de Google (modélisation du mode consentement, Ads Data Hub) ; résumé</text>
  <text x="64" y="836" class="body" font-size="12" font-style="italic" fill="#5A5A5A">public du rapport de conformité de Meta ; ANA, Master Media Buying Services Agreement, juin 2023. Coût et valeur sont des appréciations qualitatives.</text>
</svg>
