<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Inter, sans-serif">
  <defs>
    <style>
      .display{font-family:'Fraunces','Spectral',Georgia,serif;}
      .mono{font-family:'JetBrains Mono','IBM Plex Mono',monospace;}
      .interactive{cursor:pointer;}
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="900" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="50" y="52" class="mono" font-size="13" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 03</text>
  <text x="50" y="90" class="display" font-size="28" font-weight="600" fill="#1A1A1A">EP · TP · DP : la grammaire du parallélisme</text>
  <text x="50" y="117" class="display" font-size="16" font-style="italic" fill="#5A5A5A">Trois façons de répartir une couche MoE — et la combinaison canonique de 2026.</text>
  <line x1="50" y1="138" x2="850" y2="138" stroke="#E5E1D8" stroke-width="1"/>

  <!-- TP panel -->
  <g class="interactive" data-card="tp" tabindex="0" role="button" aria-label="Parallélisme de tenseurs — cliquez pour les détails">
    <rect x="50" y="165" width="380" height="255" rx="5" fill="#FAF8F3" stroke="#B8B5AE" stroke-width="1"/>
    <text x="70" y="196" class="display" font-size="18" font-weight="600" fill="#1F5560">Parallélisme de tenseurs (TP)</text>
    <text x="70" y="218" class="body" font-size="12" fill="#5A5A5A">chaque expert découpé en tranches</text>
    <rect x="70" y="238" width="340" height="90" rx="3" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="1"/>
    <text x="240" y="256" text-anchor="middle" class="mono" font-size="11" fill="#1F5560">un expert</text>
    <rect x="90" y="266" width="70" height="50" rx="2" fill="#1F5560" fill-opacity="0.25" stroke="#1F5560" stroke-width="0.75"/>
    <rect x="170" y="266" width="70" height="50" rx="2" fill="#1F5560" fill-opacity="0.25" stroke="#1F5560" stroke-width="0.75"/>
    <rect x="250" y="266" width="70" height="50" rx="2" fill="#1F5560" fill-opacity="0.25" stroke="#1F5560" stroke-width="0.75"/>
    <rect x="330" y="266" width="60" height="50" rx="2" fill="#1F5560" fill-opacity="0.25" stroke="#1F5560" stroke-width="0.75"/>
    <text x="125" y="296" text-anchor="middle" class="mono" font-size="10" fill="#1A1A1A">GPU0</text>
    <text x="205" y="296" text-anchor="middle" class="mono" font-size="10" fill="#1A1A1A">GPU1</text>
    <text x="285" y="296" text-anchor="middle" class="mono" font-size="10" fill="#1A1A1A">GPU2</text>
    <text x="360" y="296" text-anchor="middle" class="mono" font-size="10" fill="#1A1A1A">GPU3</text>
    <text x="70" y="356" class="body" font-size="12" fill="#B7332C">− all-reduce à chaque couche · ne passe pas l'échelle</text>
    <text x="70" y="378" class="body" font-size="12" fill="#2F5D3F">+ charge équilibrée par construction · simple</text>
  </g>

  <!-- EP panel -->
  <g class="interactive" data-card="ep" tabindex="0" role="button" aria-label="Parallélisme d'experts — cliquez pour les détails">
    <rect x="470" y="165" width="380" height="255" rx="5" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5"/>
    <text x="490" y="196" class="display" font-size="18" font-weight="600" fill="#B7332C">Parallélisme d'experts (EP)</text>
    <text x="490" y="218" class="body" font-size="12" fill="#5A5A5A">des experts entiers sur des GPU distincts</text>
    <rect x="490" y="238" width="80" height="80" rx="3" fill="#B7332C" fill-opacity="0.12" stroke="#B7332C" stroke-width="1"/>
    <text x="530" y="274" text-anchor="middle" class="mono" font-size="10" fill="#1A1A1A">GPU0</text>
    <text x="530" y="290" text-anchor="middle" class="mono" font-size="9" fill="#5A5A5A">exp 0-3</text>
    <rect x="585" y="238" width="80" height="80" rx="3" fill="#B7332C" fill-opacity="0.12" stroke="#B7332C" stroke-width="1"/>
    <text x="625" y="274" text-anchor="middle" class="mono" font-size="10" fill="#1A1A1A">GPU1</text>
    <text x="625" y="290" text-anchor="middle" class="mono" font-size="9" fill="#5A5A5A">exp 4-7</text>
    <rect x="680" y="238" width="80" height="80" rx="3" fill="#B7332C" fill-opacity="0.12" stroke="#B7332C" stroke-width="1"/>
    <text x="720" y="274" text-anchor="middle" class="mono" font-size="10" fill="#1A1A1A">GPU2</text>
    <text x="720" y="290" text-anchor="middle" class="mono" font-size="9" fill="#5A5A5A">exp 8-11</text>
    <rect x="770" y="238" width="60" height="80" rx="3" fill="#B7332C" fill-opacity="0.12" stroke="#B7332C" stroke-width="1"/>
    <text x="800" y="274" text-anchor="middle" class="mono" font-size="9" fill="#5A5A5A">…</text>
    <text x="490" y="356" class="body" font-size="12" fill="#B7332C">− introduit le double all-to-all · déséquilibre</text>
    <text x="490" y="378" class="body" font-size="12" fill="#2F5D3F">+ experts locaux intacts · passe l'échelle</text>
  </g>

  <!-- DP-attention panel -->
  <g class="interactive" data-card="dp-attention" tabindex="0" role="button" aria-label="Parallélisme de données sur l'attention — cliquez pour les détails">
    <rect x="50" y="440" width="380" height="255" rx="5" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1"/>
    <text x="70" y="471" class="display" font-size="18" font-weight="600" fill="#B58A2C">DP sur l'attention</text>
    <text x="70" y="493" class="body" font-size="12" fill="#5A5A5A">attention répliquée · chaque GPU son lot</text>
    <rect x="70" y="513" width="160" height="80" rx="3" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1"/>
    <text x="150" y="545" text-anchor="middle" class="mono" font-size="10" fill="#1A1A1A">GPU0 · attn</text>
    <text x="150" y="563" text-anchor="middle" class="body" font-size="10" fill="#5A5A5A">cache KV · lot A</text>
    <rect x="250" y="513" width="160" height="80" rx="3" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1"/>
    <text x="330" y="545" text-anchor="middle" class="mono" font-size="10" fill="#1A1A1A">GPU1 · attn</text>
    <text x="330" y="563" text-anchor="middle" class="body" font-size="10" fill="#5A5A5A">cache KV · lot B</text>
    <text x="70" y="628" class="body" font-size="12" fill="#2F5D3F">+ pas de duplication du cache KV sur tout le TP</text>
    <text x="70" y="650" class="body" font-size="12" fill="#5A5A5A">découple l'attention du MoE</text>
  </g>

  <!-- Hybrid panel -->
  <g class="interactive" data-card="hybrid" tabindex="0" role="button" aria-label="Combinaison DP-attention + EP-MoE — cliquez pour les détails">
    <rect x="470" y="440" width="380" height="255" rx="5" fill="#1A1A1A" fill-opacity="0.04" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="490" y="471" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Patron canonique 2026</text>
    <text x="490" y="493" class="body" font-size="12" fill="#5A5A5A">DP-attention + EP-MoE</text>
    <rect x="490" y="513" width="340" height="55" rx="3" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1"/>
    <text x="660" y="546" text-anchor="middle" class="mono" font-size="11" fill="#B58A2C">Attention → DP (répliquée)</text>
    <rect x="490" y="576" width="340" height="55" rx="3" fill="#B7332C" fill-opacity="0.10" stroke="#B7332C" stroke-width="1"/>
    <text x="660" y="609" text-anchor="middle" class="mono" font-size="11" fill="#B7332C">MoE → EP (à grande échelle)</text>
    <text x="490" y="662" class="body" font-size="12" fill="#2F5D3F">le meilleur des deux · standard SGLang / vLLM</text>
  </g>

  <!-- Memory tradeoff strip -->
  <g class="interactive" data-card="memory-tradeoff" tabindex="0" role="button" aria-label="Le compromis mémoire — cliquez pour les détails">
    <rect x="50" y="715" width="800" height="95" rx="5" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="1"/>
    <text x="70" y="744" class="mono" font-size="12" font-weight="600" fill="#1A1A1A">LE COMPROMIS SE LIT EN MÉMOIRE</text>
    <text x="70" y="768" class="body" font-size="13" fill="#1A1A1A">TP : réplique les activations, sature la bande passante — robuste dans le nœud.</text>
    <text x="70" y="790" class="body" font-size="13" fill="#1A1A1A">EP : disperse les experts (peu de mémoire de poids par GPU), paie l'all-to-all et exige un équilibrage dynamique.</text>
  </g>

  <!-- Footer -->
  <line x1="50" y1="838" x2="850" y2="838" stroke="#E5E1D8" stroke-width="1"/>
  <text x="50" y="862" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Source : SGLang large-scale EP (2025) ; DeepSeek-V3, 2024.</text>
</svg>
