<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, sans-serif">
  <defs>
    <style>
      .display{font-family:'Fraunces','Spectral',Georgia,serif;}
      .mono{font-family:'JetBrains Mono','IBM Plex Mono',monospace;}
      .interactive{cursor:pointer;}
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="60" y="52" class="mono" font-size="13" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 05</text>
  <text x="60" y="90" class="display" font-size="30" font-weight="600" fill="#1A1A1A">Le déséquilibre des experts</text>
  <text x="60" y="118" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Le tout-à-tout est synchrone : le GPU le plus chargé impose sa cadence à tout le groupe.</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Histogram: expert load -->
  <g class="interactive" data-card="hot-expert" tabindex="0" role="button" aria-label="Experts populaires — cliquez pour les détails">
    <rect x="60" y="170" width="520" height="290" rx="6" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="1"/>
    <text x="84" y="200" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Charge par expert (au service)</text>
    <line x1="90" y1="420" x2="560" y2="420" stroke="#B8B5AE" stroke-width="1"/>
    <rect x="100" y="370" width="34" height="50" fill="#5A5A5A" fill-opacity="0.4"/>
    <rect x="144" y="345" width="34" height="75" fill="#5A5A5A" fill-opacity="0.4"/>
    <rect x="188" y="300" width="34" height="120" fill="#B7332C" fill-opacity="0.75"/>
    <text x="205" y="290" text-anchor="middle" class="mono" font-size="10" fill="#B7332C">hot</text>
    <rect x="232" y="360" width="34" height="60" fill="#5A5A5A" fill-opacity="0.4"/>
    <rect x="276" y="390" width="34" height="30" fill="#5A5A5A" fill-opacity="0.4"/>
    <rect x="320" y="330" width="34" height="90" fill="#5A5A5A" fill-opacity="0.4"/>
    <rect x="364" y="400" width="34" height="20" fill="#5A5A5A" fill-opacity="0.4"/>
    <rect x="408" y="315" width="34" height="105" fill="#B7332C" fill-opacity="0.6"/>
    <rect x="452" y="395" width="34" height="25" fill="#5A5A5A" fill-opacity="0.4"/>
    <rect x="496" y="380" width="34" height="40" fill="#5A5A5A" fill-opacity="0.4"/>
    <text x="325" y="446" text-anchor="middle" class="body" font-size="11" fill="#5A5A5A">experts (routés inégalement)</text>
  </g>

  <!-- Straggler barrier -->
  <g class="interactive" data-card="straggler-barrier" tabindex="0" role="button" aria-label="Le straggler et le barrier synchrone — cliquez pour les détails">
    <rect x="620" y="170" width="520" height="290" rx="6" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="1"/>
    <text x="644" y="200" class="display" font-size="17" font-weight="600" fill="#1A1A1A">Le straggler commande le barrier</text>
    <!-- lanes -->
    <text x="644" y="245" class="mono" font-size="11" fill="#1A1A1A">GPU0</text>
    <rect x="700" y="232" width="180" height="20" rx="2" fill="#2F5D3F" fill-opacity="0.4"/>
    <text x="644" y="285" class="mono" font-size="11" fill="#1A1A1A">GPU1</text>
    <rect x="700" y="272" width="150" height="20" rx="2" fill="#2F5D3F" fill-opacity="0.4"/>
    <text x="644" y="325" class="mono" font-size="11" fill="#B7332C">GPU2</text>
    <rect x="700" y="312" width="380" height="20" rx="2" fill="#B7332C" fill-opacity="0.55"/>
    <text x="1088" y="327" class="mono" font-size="10" fill="#B7332C">hot</text>
    <text x="644" y="365" class="mono" font-size="11" fill="#1A1A1A">GPU3</text>
    <rect x="700" y="352" width="200" height="20" rx="2" fill="#2F5D3F" fill-opacity="0.4"/>
    <!-- barrier line -->
    <line x1="1080" y1="220" x2="1080" y2="390" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1072" y="410" text-anchor="end" class="body" font-size="11" fill="#B7332C">tous attendent le plus lent</text>
    <text x="644" y="440" class="body" font-size="12" fill="#5A5A5A">Un déséquilibre de 2× = latence de 2× sur la couche.</text>
  </g>

  <!-- EPLB redundant experts -->
  <g class="interactive" data-card="redundant-replica" tabindex="0" role="button" aria-label="EPLB et experts redondants — cliquez pour les détails">
    <rect x="60" y="486" width="760" height="222" rx="6" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="1.5"/>
    <text x="84" y="518" class="display" font-size="18" font-weight="600" fill="#1F5560">EPLB — la redondance d'experts</text>
    <text x="84" y="542" class="body" font-size="12.5" fill="#5A5A5A">On réplique les experts populaires sur plusieurs GPU et on répartit leurs tokens entre les copies.</text>
    <!-- before -->
    <text x="84" y="578" class="mono" font-size="11" fill="#5A5A5A">AVANT</text>
    <rect x="150" y="565" width="90" height="40" rx="3" fill="#B7332C" fill-opacity="0.6"/>
    <text x="195" y="590" text-anchor="middle" class="mono" font-size="10" fill="#FAF8F3">hot → GPU2</text>
    <!-- arrow -->
    <line x1="252" y1="585" x2="292" y2="585" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arrow05)"/>
    <!-- after -->
    <text x="84" y="648" class="mono" font-size="11" fill="#5A5A5A">APRÈS</text>
    <rect x="310" y="565" width="90" height="40" rx="3" fill="#1F5560" fill-opacity="0.3" stroke="#1F5560" stroke-width="0.75"/>
    <text x="355" y="590" text-anchor="middle" class="mono" font-size="10" fill="#1F5560">copie · GPU2</text>
    <rect x="410" y="565" width="90" height="40" rx="3" fill="#1F5560" fill-opacity="0.3" stroke="#1F5560" stroke-width="0.75"/>
    <text x="455" y="590" text-anchor="middle" class="mono" font-size="10" fill="#1F5560">copie · GPU5</text>
    <rect x="510" y="565" width="90" height="40" rx="3" fill="#1F5560" fill-opacity="0.3" stroke="#1F5560" stroke-width="0.75"/>
    <text x="555" y="590" text-anchor="middle" class="mono" font-size="10" fill="#1F5560">copie · GPU9</text>
    <text x="84" y="672" class="body" font-size="12.5" fill="#1A1A1A">Placement hiérarchique (respecte les nœuds) ou global (lissage maximal) · recalculé quand la charge dérive.</text>
    <text x="84" y="694" class="body" font-size="12.5" fill="#B7332C">Coût : la VRAM des copies n'accueille plus de cache KV. DeepSeek-V3 decode : 32 experts redondants.</text>
    <defs>
      <marker id="arrow05" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#1A1A1A"/>
      </marker>
    </defs>
  </g>

  <!-- bias term -->
  <g class="interactive" data-card="bias-term" tabindex="0" role="button" aria-label="Biais sans-loss et limite du service — cliquez pour les détails">
    <rect x="840" y="486" width="300" height="222" rx="6" fill="#B58A2C" fill-opacity="0.08" stroke="#B58A2C" stroke-width="1"/>
    <text x="864" y="518" class="mono" font-size="12" font-weight="600" fill="#B58A2C">POURQUOI L'ENTRAÎNEMENT NE SUFFIT PAS</text>
    <text x="864" y="548" class="body" font-size="12.5" fill="#1A1A1A">Le biais sans-loss (auxiliary-</text>
    <text x="864" y="568" class="body" font-size="12.5" fill="#1A1A1A">loss-free) équilibre à</text>
    <text x="864" y="588" class="body" font-size="12.5" fill="#1A1A1A">l'entraînement…</text>
    <text x="864" y="624" class="body" font-size="12.5" fill="#1A1A1A">…mais la distribution des</text>
    <text x="864" y="644" class="body" font-size="12.5" fill="#1A1A1A">requêtes réelles diffère.</text>
    <text x="864" y="680" class="body" font-size="12.5" fill="#B58A2C">D'où un équilibrage au moment</text>
    <text x="864" y="700" class="body" font-size="12.5" fill="#B58A2C">du service, pas seulement avant.</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="740" x2="1140" y2="740" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="766" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Source : EPLB (DeepSeek, github, 2025) ; DeepSeek-V3 Technical Report, 2024. Histogramme illustratif.</text>
</svg>
