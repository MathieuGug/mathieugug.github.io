<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, sans-serif">
  <defs>
    <marker id="arrow01" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1A1A1A"/>
    </marker>
    <style>
      .display{font-family:'Fraunces','Spectral',Georgia,serif;}
      .mono{font-family:'JetBrains Mono','IBM Plex Mono',monospace;}
      .interactive{cursor:pointer;}
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="60" y="52" class="mono" font-size="13" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 01</text>
  <text x="60" y="90" class="display" font-size="30" font-weight="600" fill="#1A1A1A">Anatomie d'une couche MoE en service</text>
  <text x="60" y="118" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Deux tout-à-tout synchrones par couche — et en décodage, ce sont eux qui dominent le temps.</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Pipeline -->
  <!-- 1. Gate -->
  <g class="interactive" data-card="gate" tabindex="0" role="button" aria-label="Routeur — cliquez pour les détails">
    <rect x="70" y="220" width="150" height="130" rx="4" fill="#1F5560" fill-opacity="0.10" stroke="#1F5560" stroke-width="1.5"/>
    <text x="145" y="270" text-anchor="middle" class="display" font-size="17" font-weight="600" fill="#1F5560">Routeur</text>
    <text x="145" y="294" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">gate · top-k</text>
    <text x="145" y="322" text-anchor="middle" class="mono" font-size="11" fill="#5A5A5A">local au GPU</text>
  </g>

  <!-- 2. Dispatch all-to-all -->
  <g class="interactive" data-card="dispatch-a2a" tabindex="0" role="button" aria-label="Dispatch all-to-all — cliquez pour les détails">
    <rect x="300" y="200" width="180" height="170" rx="4" fill="#B7332C" fill-opacity="0.10" stroke="#B7332C" stroke-width="2"/>
    <text x="390" y="248" text-anchor="middle" class="display" font-size="17" font-weight="600" fill="#B7332C">Dispatch</text>
    <text x="390" y="270" text-anchor="middle" class="mono" font-size="12" fill="#B7332C">all-to-all #1</text>
    <!-- crossing lines motif -->
    <line x1="320" y1="300" x2="460" y2="345" stroke="#B7332C" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="320" y1="322" x2="460" y2="300" stroke="#B7332C" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="320" y1="345" x2="460" y2="322" stroke="#B7332C" stroke-width="1" stroke-opacity="0.55"/>
    <text x="390" y="360" text-anchor="middle" class="body" font-size="11" fill="#5A5A5A">tokens → experts</text>
  </g>

  <!-- 3. Experts FFN -->
  <g class="interactive" data-card="expert-ffn" tabindex="0" role="button" aria-label="Calcul des experts — cliquez pour les détails">
    <rect x="560" y="196" width="180" height="178" rx="4" fill="#B58A2C" fill-opacity="0.10" stroke="#B58A2C" stroke-width="1.5"/>
    <text x="650" y="230" text-anchor="middle" class="display" font-size="16" font-weight="600" fill="#B58A2C">Experts FFN</text>
    <rect x="580" y="246" width="140" height="30" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1"/>
    <text x="650" y="266" text-anchor="middle" class="mono" font-size="11" fill="#5A5A5A">expert 3</text>
    <rect x="580" y="284" width="140" height="30" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1"/>
    <text x="650" y="304" text-anchor="middle" class="mono" font-size="11" fill="#5A5A5A">expert 17</text>
    <rect x="580" y="322" width="140" height="30" rx="3" fill="#FAF8F3" stroke="#B58A2C" stroke-width="1"/>
    <text x="650" y="342" text-anchor="middle" class="mono" font-size="11" fill="#5A5A5A">expert 128</text>
  </g>

  <!-- 4. Combine all-to-all -->
  <g class="interactive" data-card="combine-a2a" tabindex="0" role="button" aria-label="Combine all-to-all — cliquez pour les détails">
    <rect x="820" y="200" width="180" height="170" rx="4" fill="#B7332C" fill-opacity="0.10" stroke="#B7332C" stroke-width="2"/>
    <text x="910" y="248" text-anchor="middle" class="display" font-size="17" font-weight="600" fill="#B7332C">Combine</text>
    <text x="910" y="270" text-anchor="middle" class="mono" font-size="12" fill="#B7332C">all-to-all #2</text>
    <line x1="840" y1="300" x2="980" y2="345" stroke="#B7332C" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="840" y1="322" x2="980" y2="300" stroke="#B7332C" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="840" y1="345" x2="980" y2="322" stroke="#B7332C" stroke-width="1" stroke-opacity="0.55"/>
    <text x="910" y="360" text-anchor="middle" class="body" font-size="11" fill="#5A5A5A">sorties → origine</text>
  </g>

  <!-- Output -->
  <rect x="1040" y="250" width="100" height="70" rx="4" fill="#E5E1D8" stroke="#B8B5AE" stroke-width="1"/>
  <text x="1090" y="282" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">sortie</text>
  <text x="1090" y="300" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">couche</text>

  <!-- arrows between stages (white gap before target) -->
  <line x1="222" y1="285" x2="292" y2="285" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow01)"/>
  <line x1="482" y1="285" x2="552" y2="285" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow01)"/>
  <line x1="742" y1="285" x2="812" y2="285" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow01)"/>
  <line x1="1002" y1="285" x2="1032" y2="285" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow01)"/>

  <!-- Time bar -->
  <text x="60" y="470" class="display" font-size="16" font-style="italic" fill="#1A1A1A">Répartition du temps sur le chemin critique · décodage (illustratif)</text>
  <rect x="60" y="492" width="1080" height="44" rx="3" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="1"/>
  <!-- attention -->
  <rect x="60" y="492" width="200" height="44" fill="#B8B5AE" fill-opacity="0.5"/>
  <text x="160" y="519" text-anchor="middle" class="body" font-size="11" fill="#1A1A1A">attention</text>
  <!-- gate -->
  <rect x="260" y="492" width="70" height="44" fill="#1F5560" fill-opacity="0.35"/>
  <text x="295" y="519" text-anchor="middle" class="body" font-size="10" fill="#1A1A1A">gate</text>
  <!-- all-to-all (dominant) -->
  <rect x="330" y="492" width="620" height="44" fill="#B7332C" fill-opacity="0.35"/>
  <text x="640" y="514" text-anchor="middle" class="body" font-size="12" font-weight="600" fill="#B7332C">dispatch + combine (all-to-all)</text>
  <text x="640" y="530" text-anchor="middle" class="body" font-size="10" fill="#5A5A5A">le poste dominant</text>
  <!-- expert gemm -->
  <rect x="950" y="492" width="190" height="44" fill="#B58A2C" fill-opacity="0.35"/>
  <text x="1045" y="519" text-anchor="middle" class="body" font-size="10" fill="#1A1A1A">calcul experts</text>

  <!-- Annotation -->
  <circle cx="76" cy="600" r="9" fill="#B7332C"/>
  <text x="76" y="604" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#FAF8F3">1</text>
  <text x="96" y="604" class="body" font-size="13" fill="#1A1A1A">En décodage (limité par la mémoire), le calcul des experts est presque gratuit ; les deux collectifs synchrones portent le coût.</text>
  <circle cx="76" cy="632" r="9" fill="#1F5560"/>
  <text x="76" y="636" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#FAF8F3">2</text>
  <text x="96" y="636" class="body" font-size="13" fill="#1A1A1A">Un modèle de 60 couches aligne 120 tout-à-tout sur le chemin critique de chaque token généré.</text>

  <!-- Footer -->
  <line x1="60" y1="740" x2="1140" y2="740" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="766" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Source : GShard (Lepikhin et al. 2020) ; DeepSeek-V3 Technical Report, 2024. Décomposition du temps illustrative.</text>
</svg>
