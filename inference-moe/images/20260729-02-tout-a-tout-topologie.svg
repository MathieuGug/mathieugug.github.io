<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, sans-serif">
  <defs>
    <marker id="arrow02" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B7332C"/>
    </marker>
    <style>
      .display{font-family:'Fraunces','Spectral',Georgia,serif;}
      .mono{font-family:'JetBrains Mono','IBM Plex Mono',monospace;}
      .interactive{cursor:pointer;}
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="60" y="52" class="mono" font-size="13" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 02</text>
  <text x="60" y="90" class="display" font-size="30" font-weight="600" fill="#1A1A1A">Le tout-à-tout, anatomie d'un goulot</text>
  <text x="60" y="118" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Deux domaines de communication séparés par un ordre de grandeur — d'où le routage borné aux nœuds.</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Node A (NVLink domain) -->
  <g class="interactive" data-card="nvlink-domain" tabindex="0" role="button" aria-label="Domaine NVLink intra-nœud — cliquez pour les détails">
    <rect x="80" y="180" width="380" height="300" rx="6" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="1.5"/>
    <text x="100" y="208" class="mono" font-size="12" fill="#1F5560">NŒUD A · 8 GPU · NVLink</text>
    <rect x="110" y="230" width="150" height="95" rx="4" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="185" y="282" text-anchor="middle" class="mono" font-size="12" fill="#1A1A1A">GPU 0</text>
    <rect x="290" y="230" width="150" height="95" rx="4" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="365" y="282" text-anchor="middle" class="mono" font-size="12" fill="#1A1A1A">GPU 1</text>
    <rect x="110" y="345" width="150" height="95" rx="4" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="185" y="397" text-anchor="middle" class="mono" font-size="12" fill="#1A1A1A">GPU 2</text>
    <rect x="290" y="345" width="150" height="95" rx="4" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="365" y="397" text-anchor="middle" class="mono" font-size="12" fill="#1A1A1A">GPU 3</text>
    <!-- NVLink mesh -->
    <line x1="260" y1="277" x2="290" y2="277" stroke="#1F5560" stroke-width="1.25"/>
    <line x1="185" y1="325" x2="185" y2="345" stroke="#1F5560" stroke-width="1.25"/>
    <line x1="365" y1="325" x2="365" y2="345" stroke="#1F5560" stroke-width="1.25"/>
    <line x1="260" y1="392" x2="290" y2="392" stroke="#1F5560" stroke-width="1.25"/>
    <line x1="260" y1="325" x2="290" y2="345" stroke="#1F5560" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="290" y1="325" x2="260" y2="345" stroke="#1F5560" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- Node B -->
  <g class="interactive" data-card="all-to-all-matrix" tabindex="0" role="button" aria-label="Le motif all-to-all — cliquez pour les détails">
    <rect x="740" y="180" width="380" height="300" rx="6" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="1.5"/>
    <text x="760" y="208" class="mono" font-size="12" fill="#1F5560">NŒUD B · 8 GPU · NVLink</text>
    <rect x="770" y="230" width="150" height="95" rx="4" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="845" y="282" text-anchor="middle" class="mono" font-size="12" fill="#1A1A1A">GPU 4</text>
    <rect x="950" y="230" width="150" height="95" rx="4" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="1025" y="282" text-anchor="middle" class="mono" font-size="12" fill="#1A1A1A">GPU 5</text>
    <rect x="770" y="345" width="150" height="95" rx="4" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="845" y="397" text-anchor="middle" class="mono" font-size="12" fill="#1A1A1A">GPU 6</text>
    <rect x="950" y="345" width="150" height="95" rx="4" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="1025" y="397" text-anchor="middle" class="mono" font-size="12" fill="#1A1A1A">GPU 7</text>
    <line x1="920" y1="277" x2="950" y2="277" stroke="#1F5560" stroke-width="1.25"/>
    <line x1="845" y1="325" x2="845" y2="345" stroke="#1F5560" stroke-width="1.25"/>
    <line x1="1025" y1="325" x2="1025" y2="345" stroke="#1F5560" stroke-width="1.25"/>
    <line x1="920" y1="392" x2="950" y2="392" stroke="#1F5560" stroke-width="1.25"/>
  </g>

  <!-- Inter-node RDMA link -->
  <g class="interactive" data-card="rdma-domain" tabindex="0" role="button" aria-label="Domaine RDMA inter-nœud — cliquez pour les détails">
    <rect x="470" y="300" width="260" height="60" rx="6" fill="#B7332C" fill-opacity="0.06" stroke="#B7332C" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="465" y1="330" x2="595" y2="330" stroke="#B7332C" stroke-width="2.5" stroke-dasharray="8 5" marker-start="url(#arrow02)"/>
    <line x1="605" y1="330" x2="735" y2="330" stroke="#B7332C" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow02)"/>
    <text x="600" y="326" text-anchor="middle" class="mono" font-size="12" fill="#B7332C">RDMA</text>
    <text x="600" y="348" text-anchor="middle" class="body" font-size="11" fill="#5A5A5A">InfiniBand</text>
  </g>

  <!-- Bandwidth comparison -->
  <text x="60" y="540" class="display" font-size="16" font-style="italic" fill="#1A1A1A">L'asymétrie de bande passante (mesures DeepEP)</text>
  <text x="60" y="580" class="body" font-size="13" fill="#1F5560">NVLink intra-nœud</text>
  <rect x="260" y="566" width="600" height="22" rx="3" fill="#1F5560" fill-opacity="0.6"/>
  <text x="872" y="583" class="mono" font-size="13" fill="#1F5560">~150 Go/s</text>
  <text x="60" y="618" class="body" font-size="13" fill="#B7332C">RDMA inter-nœud</text>
  <rect x="260" y="604" width="210" height="22" rx="3" fill="#B7332C" fill-opacity="0.6"/>
  <text x="482" y="621" class="mono" font-size="13" fill="#B7332C">~45–90 Go/s</text>

  <!-- Node-limited routing annotation -->
  <g class="interactive" data-card="node-limited-routing" tabindex="0" role="button" aria-label="Routage borné aux nœuds — cliquez pour les détails">
    <rect x="60" y="656" width="1080" height="52" rx="4" fill="#B58A2C" fill-opacity="0.08" stroke="#B58A2C" stroke-width="1"/>
    <text x="80" y="678" class="mono" font-size="12" font-weight="600" fill="#B58A2C">PARADE — routage borné aux nœuds</text>
    <text x="80" y="698" class="body" font-size="12.5" fill="#1A1A1A">Chaque token ne choisit ses experts que dans 4 nœuds au plus (DeepSeek-V3) : le nombre de sauts RDMA coûteux est plafonné, la communication se recouvre par le calcul.</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="740" x2="1140" y2="740" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="766" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Source : DeepEP (DeepSeek, 2025) ; DeepSeek-V3 Technical Report, 2024. Débits selon configuration matérielle.</text>
</svg>
