<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, sans-serif">
  <defs>
    <style>
      .display{font-family:'Fraunces','Spectral',Georgia,serif;}
      .mono{font-family:'JetBrains Mono','IBM Plex Mono',monospace;}
      .interactive{cursor:pointer;}
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="60" y="52" class="mono" font-size="13" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 07</text>
  <text x="60" y="90" class="display" font-size="30" font-weight="600" fill="#1A1A1A">Le paysage outillage 2026</text>
  <text x="60" y="118" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Une pile ouverte convergente — le socle DeepSeek sous des serveurs qui savent tous faire de l'EP.</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Column headers -->
  <text x="350" y="188" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">EP grande</text>
  <text x="350" y="204" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">échelle</text>
  <text x="520" y="188" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">DP-</text>
  <text x="520" y="204" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">attention</text>
  <text x="690" y="188" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">Désagrég.</text>
  <text x="690" y="204" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">P/D</text>
  <text x="860" y="188" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">Kernels</text>
  <text x="860" y="204" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">faible lat.</text>
  <text x="1030" y="188" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">Fabric</text>
  <text x="1030" y="204" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">NVL72</text>
  <line x1="60" y1="218" x2="1120" y2="218" stroke="#E5E1D8" stroke-width="1"/>

  <!-- SGLang row -->
  <g class="interactive" data-card="sglang" tabindex="0" role="button" aria-label="SGLang — cliquez pour les détails">
    <rect x="60" y="228" width="1060" height="64" rx="4" fill="#B7332C" fill-opacity="0.05"/>
    <text x="80" y="266" class="display" font-size="17" font-weight="600" fill="#1A1A1A">SGLang</text>
    <text x="80" y="284" class="body" font-size="11" fill="#5A5A5A">1ʳᵉ implémentation ouverte P/D + EP</text>
    <circle cx="350" cy="260" r="10" fill="#1F5560"/>
    <circle cx="520" cy="260" r="10" fill="#1F5560"/>
    <circle cx="690" cy="260" r="10" fill="#1F5560"/>
    <circle cx="860" cy="260" r="10" fill="#1F5560"/>
    <circle cx="1030" cy="260" r="10" fill="#1F5560"/>
  </g>

  <!-- vLLM row -->
  <g class="interactive" data-card="vllm" tabindex="0" role="button" aria-label="vLLM — cliquez pour les détails">
    <rect x="60" y="300" width="1060" height="64" rx="4" fill="#FAF8F3"/>
    <text x="80" y="338" class="display" font-size="17" font-weight="600" fill="#1A1A1A">vLLM</text>
    <text x="80" y="356" class="body" font-size="11" fill="#5A5A5A">DP-attention + EP · intégration DeepEP</text>
    <circle cx="350" cy="332" r="10" fill="#1F5560"/>
    <circle cx="520" cy="332" r="10" fill="#1F5560"/>
    <circle cx="690" cy="332" r="10" fill="#1F5560"/>
    <circle cx="860" cy="332" r="10" fill="#1F5560"/>
    <path d="M1030 322 A10 10 0 0 1 1030 342 Z" fill="#B58A2C"/>
    <circle cx="1030" cy="332" r="10" fill="none" stroke="#B58A2C" stroke-width="1"/>
  </g>

  <!-- Dynamo row -->
  <g class="interactive" data-card="dynamo" tabindex="0" role="button" aria-label="NVIDIA Dynamo / TensorRT-LLM — cliquez pour les détails">
    <rect x="60" y="372" width="1060" height="64" rx="4" fill="#B7332C" fill-opacity="0.05"/>
    <text x="80" y="410" class="display" font-size="17" font-weight="600" fill="#1A1A1A">NVIDIA Dynamo · TensorRT-LLM</text>
    <text x="80" y="428" class="body" font-size="11" fill="#5A5A5A">désagrégation + EP jusqu'au NVL72</text>
    <circle cx="350" cy="404" r="10" fill="#1F5560"/>
    <circle cx="520" cy="404" r="10" fill="#1F5560"/>
    <circle cx="690" cy="404" r="10" fill="#1F5560"/>
    <circle cx="860" cy="404" r="10" fill="#1F5560"/>
    <circle cx="1030" cy="404" r="10" fill="#B7332C"/>
  </g>

  <text x="80" y="462" class="body" font-size="11" fill="#5A5A5A">● présent   ◐ partiel — la ligne de fracture n'est plus « qui sait faire de l'EP » mais la maturité de l'équilibrage et du recouvrement.</text>

  <!-- Socle -->
  <g class="interactive" data-card="socle" tabindex="0" role="button" aria-label="Le socle DeepSeek — cliquez pour les détails">
    <rect x="60" y="486" width="700" height="222" rx="6" fill="#1A1A1A" fill-opacity="0.04" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="84" y="518" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Le socle ouvert (DeepSeek)</text>
    <text x="84" y="540" class="body" font-size="12.5" fill="#5A5A5A">Intégré plutôt que réimplémenté par la plupart des serveurs.</text>
    <rect x="84" y="558" width="210" height="120" rx="4" fill="#B7332C" fill-opacity="0.08" stroke="#B7332C" stroke-width="1"/>
    <text x="189" y="600" text-anchor="middle" class="mono" font-size="15" fill="#B7332C">DeepEP</text>
    <text x="189" y="624" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">communication</text>
    <text x="189" y="642" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">(all-to-all)</text>
    <rect x="309" y="558" width="210" height="120" rx="4" fill="#B58A2C" fill-opacity="0.08" stroke="#B58A2C" stroke-width="1"/>
    <text x="414" y="600" text-anchor="middle" class="mono" font-size="15" fill="#B58A2C">DeepGEMM</text>
    <text x="414" y="624" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">calcul FP8</text>
    <text x="414" y="642" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">(experts)</text>
    <rect x="534" y="558" width="210" height="120" rx="4" fill="#1F5560" fill-opacity="0.08" stroke="#1F5560" stroke-width="1"/>
    <text x="639" y="600" text-anchor="middle" class="mono" font-size="15" fill="#1F5560">EPLB</text>
    <text x="639" y="624" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">équilibrage</text>
    <text x="639" y="642" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">de charge</text>
  </g>

  <!-- NVL72 card -->
  <g class="interactive" data-card="nvl72" tabindex="0" role="button" aria-label="La fabric scale-up NVL72 — cliquez pour les détails">
    <rect x="780" y="486" width="360" height="222" rx="6" fill="#2F5D3F" fill-opacity="0.07" stroke="#2F5D3F" stroke-width="1.5"/>
    <text x="804" y="518" class="display" font-size="18" font-weight="600" fill="#2F5D3F">Fabric scale-up NVL72</text>
    <text x="804" y="548" class="body" font-size="13" fill="#1A1A1A">72 GPU dans un seul domaine de</text>
    <text x="804" y="568" class="body" font-size="13" fill="#1A1A1A">cohérence NVLink.</text>
    <text x="804" y="604" class="body" font-size="13" fill="#1A1A1A">Le tout-à-tout redevient</text>
    <text x="804" y="624" class="body" font-size="13" fill="#1A1A1A">intra-domaine rapide —</text>
    <text x="804" y="644" class="body" font-size="13" fill="#1A1A1A">l'asymétrie du schéma 2 se dissout.</text>
    <text x="804" y="680" class="mono" font-size="13" fill="#2F5D3F">×3,8 prefill · ×4,8 decode</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="740" x2="1140" y2="740" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="766" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Source : SGLang (lmsys.org, 2025) ; DeepEP / DeepGEMM / EPLB (DeepSeek, 2025) ; NVIDIA Dynamo. Matrice indicative.</text>
</svg>
