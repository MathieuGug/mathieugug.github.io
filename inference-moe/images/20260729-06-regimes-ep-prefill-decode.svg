<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, sans-serif">
  <defs>
    <marker id="arrow06" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1A1A1A"/>
    </marker>
    <style>
      .display{font-family:'Fraunces','Spectral',Georgia,serif;}
      .mono{font-family:'JetBrains Mono','IBM Plex Mono',monospace;}
      .interactive{cursor:pointer;}
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="60" y="52" class="mono" font-size="13" letter-spacing="0.08em" fill="#B7332C">SCHÉMA 06</text>
  <text x="60" y="90" class="display" font-size="30" font-weight="600" fill="#1A1A1A">Deux régimes EP : prefill contre decode</text>
  <text x="60" y="118" class="display" font-size="17" font-style="italic" fill="#5A5A5A">Deux phases, deux profils — donc deux tailles de groupe d'experts, sur des pools désagrégés.</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Prefill pool -->
  <g class="interactive" data-card="prefill-pool" tabindex="0" role="button" aria-label="Pool prefill EP32 — cliquez pour les détails">
    <rect x="60" y="175" width="440" height="270" rx="6" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="1.5"/>
    <text x="84" y="210" class="display" font-size="20" font-weight="600" fill="#1F5560">Pool prefill</text>
    <text x="84" y="236" class="mono" font-size="12" fill="#5A5A5A">LIMITÉ PAR LE CALCUL</text>
    <rect x="84" y="256" width="392" height="70" rx="4" fill="#FAF8F3" stroke="#1F5560" stroke-width="1"/>
    <text x="280" y="288" text-anchor="middle" class="mono" font-size="22" fill="#1F5560">EP32</text>
    <text x="280" y="312" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">experts étalés sur 4 nœuds</text>
    <text x="84" y="360" class="body" font-size="13" fill="#1A1A1A">Gros lots · on veut le débit maximal.</text>
    <text x="84" y="384" class="body" font-size="13" fill="#1A1A1A">Groupe EP modéré · mode normal de DeepEP.</text>
    <text x="84" y="420" class="mono" font-size="12" fill="#1F5560">DeepSeek-V3 : prefill EP32 · 4 nœuds</text>
  </g>

  <!-- KV transfer -->
  <line x1="505" y1="310" x2="655" y2="310" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow06)"/>
  <text x="580" y="298" text-anchor="middle" class="body" font-size="11" fill="#5A5A5A">transfert</text>
  <text x="580" y="332" text-anchor="middle" class="mono" font-size="11" fill="#5A5A5A">cache KV</text>

  <!-- Decode pool -->
  <g class="interactive" data-card="decode-pool" tabindex="0" role="button" aria-label="Pool decode EP144 — cliquez pour les détails">
    <rect x="700" y="175" width="440" height="270" rx="6" fill="#B7332C" fill-opacity="0.06" stroke="#B7332C" stroke-width="2"/>
    <text x="724" y="210" class="display" font-size="20" font-weight="600" fill="#B7332C">Pool decode</text>
    <text x="724" y="236" class="mono" font-size="12" fill="#5A5A5A">LIMITÉ PAR LA MÉMOIRE</text>
    <rect x="724" y="256" width="392" height="70" rx="4" fill="#FAF8F3" stroke="#B7332C" stroke-width="1"/>
    <text x="920" y="288" text-anchor="middle" class="mono" font-size="22" fill="#B7332C">EP144</text>
    <text x="920" y="312" text-anchor="middle" class="body" font-size="12" fill="#5A5A5A">experts étalés sur 18 nœuds</text>
    <text x="724" y="360" class="body" font-size="13" fill="#1A1A1A">Petits lots · l'all-to-all pèse le plus lourd.</text>
    <text x="724" y="384" class="body" font-size="13" fill="#1A1A1A">On étale au maximum · mode faible latence.</text>
    <text x="724" y="420" class="mono" font-size="12" fill="#B7332C">DeepSeek-V3 : decode EP144 · 18 nœuds</text>
  </g>

  <!-- Redundancy -->
  <g class="interactive" data-card="redundancy" tabindex="0" role="button" aria-label="Experts redondants au decode — cliquez pour les détails">
    <rect x="700" y="465" width="440" height="110" rx="6" fill="#B58A2C" fill-opacity="0.08" stroke="#B58A2C" stroke-width="1"/>
    <text x="724" y="495" class="mono" font-size="12" font-weight="600" fill="#B58A2C">+ 32 EXPERTS REDONDANTS (EPLB)</text>
    <text x="724" y="522" class="body" font-size="13" fill="#1A1A1A">Le decode large exige un lissage de charge :</text>
    <text x="724" y="544" class="body" font-size="13" fill="#1A1A1A">les experts populaires sont répliqués pour</text>
    <text x="724" y="566" class="body" font-size="13" fill="#1A1A1A">éviter le straggler (schéma 5).</text>
  </g>

  <!-- Two-batch overlap -->
  <g class="interactive" data-card="two-batch-overlap" tabindex="0" role="button" aria-label="Recouvrement à deux lots et chiffres — cliquez pour les détails">
    <rect x="60" y="465" width="600" height="110" rx="6" fill="#1A1A1A" fill-opacity="0.04" stroke="#1A1A1A" stroke-width="1"/>
    <text x="84" y="495" class="mono" font-size="12" font-weight="600" fill="#1A1A1A">RECOUVREMENT À DEUX LOTS (two-batch overlap)</text>
    <text x="84" y="522" class="body" font-size="13" fill="#1A1A1A">Le lot est coupé en deux micro-lots entrelacés :</text>
    <text x="84" y="544" class="body" font-size="13" fill="#1A1A1A">le all-to-all de l'un se déroule pendant le calcul</text>
    <text x="84" y="566" class="body" font-size="13" fill="#1A1A1A">de l'autre. Combiné au hook DeepEP et à l'EPLB.</text>
  </g>

  <!-- Numbers strip -->
  <rect x="60" y="596" width="1080" height="112" rx="6" fill="#FAF8F3" stroke="#E5E1D8" stroke-width="1"/>
  <text x="84" y="626" class="display" font-size="16" font-style="italic" fill="#1A1A1A">Ce que ça donne, mesuré (SGLang, réplication open source du déploiement DeepSeek)</text>
  <text x="84" y="664" class="mono" font-size="24" fill="#B7332C">52,3k</text>
  <text x="200" y="664" class="body" font-size="13" fill="#1A1A1A">tokens d'entrée/s · nœud</text>
  <text x="440" y="664" class="mono" font-size="24" fill="#B7332C">22,3k</text>
  <text x="556" y="664" class="body" font-size="13" fill="#1A1A1A">tokens de sortie/s · nœud</text>
  <text x="800" y="664" class="mono" font-size="24" fill="#2F5D3F">×5</text>
  <text x="860" y="664" class="body" font-size="13" fill="#1A1A1A">débit de sortie vs TP simple</text>
  <text x="84" y="694" class="body" font-size="12.5" fill="#5A5A5A">96 GPU H100 (12 nœuds), séquences de 2 000 tokens. Sur GB200 NVL72 : ×3,8 en prefill, ×4,8 en decode — la fabric scale-up ramène le tout-à-tout dans le domaine rapide.</text>

  <!-- Footer -->
  <line x1="60" y1="740" x2="1140" y2="740" stroke="#E5E1D8" stroke-width="1"/>
  <text x="60" y="766" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Source : SGLang large-scale EP (lmsys.org, mai 2025) ; GB200 NVL72 Part II (sept. 2025) ; DeepSeek-V3, 2024.</text>
</svg>
