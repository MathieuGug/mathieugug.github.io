<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Les quatre populations d'une campagne : réfractaires, acquis d'avance, perdus d'avance et persuadables, et ce que chaque type de score voit">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="820" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Les quatre populations d'une campagne</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un score de propension sépare deux colonnes. Un score d'effet sépare une diagonale.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <text x="660" y="192" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">CE QUI SE PASSE SI ON LE SOLLICITE</text>
  <text x="470" y="216" class="mono" font-size="12" letter-spacing="0.08em" fill="#8A8478" text-anchor="middle">IL N'ACHÈTE PAS</text>
  <text x="850" y="216" class="mono" font-size="12" letter-spacing="0.08em" fill="#8A8478" text-anchor="middle">IL ACHÈTE</text>

  <text x="88" y="440" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle" transform="rotate(-90 88 440)">CE QUI SE PASSE SI ON NE LE SOLLICITE PAS</text>

  <text x="266" y="330" class="mono" font-size="12" letter-spacing="0.08em" fill="#8A8478" text-anchor="end">IL ACHÈTE</text>
  <text x="266" y="550" class="mono" font-size="12" letter-spacing="0.08em" fill="#8A8478" text-anchor="end">IL N'ACHÈTE PAS</text>

  <!-- Quadrant : réfractaires -->
  <g class="interactive" data-region="refractaires" data-card="refractaires" tabindex="0" role="button" aria-label="Les réfractaires — cliquez pour les détails">
    <rect x="300" y="236" width="340" height="188" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="300" y="236" width="5" height="188" fill="#B7332C"/>
    <text x="326" y="266" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">EFFET NÉGATIF</text>
    <text x="326" y="296" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Les réfractaires</text>
    <text x="326" y="322" class="body" font-size="13" fill="#5A5A5A">La sollicitation annule un achat qui</text>
    <text x="326" y="340" class="body" font-size="13" fill="#5A5A5A">aurait eu lieu : une relance qui réveille</text>
    <text x="326" y="358" class="body" font-size="13" fill="#5A5A5A">une résiliation oubliée, un coupon qui</text>
    <text x="326" y="376" class="body" font-size="13" fill="#5A5A5A">dégrade la perception de prix.</text>
    <text x="326" y="406" class="body" font-size="12.5" font-style="italic" fill="#B7332C">Le score de propension les place en bas.</text>
  </g>

  <!-- Quadrant : acquis d'avance -->
  <g class="interactive" data-region="acquis" data-card="acquis" tabindex="0" role="button" aria-label="Les acquis d'avance — cliquez pour les détails">
    <rect x="680" y="236" width="340" height="188" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="680" y="236" width="5" height="188" fill="#8A8478"/>
    <text x="706" y="266" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">EFFET NUL</text>
    <text x="706" y="296" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Les acquis d'avance</text>
    <text x="706" y="324" class="body" font-size="13" fill="#5A5A5A">Ils achètent dans les deux cas. La dépense</text>
    <text x="706" y="344" class="body" font-size="13" fill="#5A5A5A">consentie sur eux est une remise accordée</text>
    <text x="706" y="364" class="body" font-size="13" fill="#5A5A5A">sans aucune contrepartie.</text>
    <text x="706" y="400" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Le score de propension les place en haut.</text>
  </g>

  <!-- Quadrant : perdus d'avance -->
  <g class="interactive" data-region="perdus" data-card="perdus" tabindex="0" role="button" aria-label="Les perdus d'avance — cliquez pour les détails">
    <rect x="300" y="456" width="340" height="188" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="300" y="456" width="5" height="188" fill="#8A8478"/>
    <text x="326" y="486" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">EFFET NUL</text>
    <text x="326" y="516" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Les perdus d'avance</text>
    <text x="326" y="544" class="body" font-size="13" fill="#5A5A5A">Ils n'achètent dans aucun des deux cas.</text>
    <text x="326" y="564" class="body" font-size="13" fill="#5A5A5A">La dépense est perdue, sans rien détruire</text>
    <text x="326" y="584" class="body" font-size="13" fill="#5A5A5A">d'autre que le budget.</text>
    <text x="326" y="620" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Le score de propension les place en bas.</text>
  </g>

  <!-- Quadrant : persuadables -->
  <g class="interactive" data-region="persuadables" data-card="persuadables" tabindex="0" role="button" aria-label="Les persuadables — cliquez pour les détails">
    <rect x="680" y="456" width="340" height="188" rx="3" fill="#FFFFFF" stroke="#4A7C59" stroke-width="1.75"/>
    <rect x="680" y="456" width="5" height="188" fill="#4A7C59"/>
    <text x="706" y="486" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">EFFET POSITIF</text>
    <text x="706" y="516" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Les persuadables</text>
    <text x="706" y="544" class="body" font-size="13" fill="#5A5A5A">Ils achètent seulement si on les sollicite.</text>
    <text x="706" y="564" class="body" font-size="13" fill="#5A5A5A">Les seuls sur lesquels un budget de</text>
    <text x="706" y="584" class="body" font-size="13" fill="#5A5A5A">sollicitation produit de la valeur.</text>
    <text x="706" y="620" class="body" font-size="12.5" font-style="italic" fill="#4A7C59">Le score de propension les place en haut.</text>
  </g>

  <!-- Ce que retient un score de propension -->
  <path d="M 1034 246 L 1052 246 L 1052 634 L 1034 634" fill="none" stroke="#B58A2C" stroke-width="1.25"/>
  <text x="1064" y="428" class="mono" font-size="11" letter-spacing="0.09em" fill="#B58A2C" transform="rotate(-90 1064 428)" text-anchor="middle">CE QUE RETIENT UN SCORE DE PROPENSION</text>

  <!-- Diagonale de l'effet -->
  <line x1="320" y1="300" x2="1000" y2="600" stroke="#4A7C59" stroke-width="1.25" stroke-dasharray="5 5" opacity="0.45"/>

  <line x1="64" y1="686" x2="1136" y2="686" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="718" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL FAUT EN RETENIR</text>
  <text x="64" y="746" class="body" font-size="14" fill="#1A1A1A">Le classement par propension sépare la colonne de droite de la colonne de gauche. Il mélange les acquis d'avance avec les persuadables,</text>
  <text x="64" y="770" class="body" font-size="14" fill="#1A1A1A">et les perdus d'avance avec les réfractaires. Le classement par effet, lui, sépare le coin bas-droit du coin haut-gauche : ce ne sont pas</text>
  <text x="64" y="794" class="body" font-size="14" fill="#1A1A1A">les mêmes personnes, et l'écart se paie sur le budget de sollicitation.</text>
</svg>
