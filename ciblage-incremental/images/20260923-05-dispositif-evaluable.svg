<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Anatomie d'un dispositif de ciblage évaluable : témoin permanent, trace d'assignation, politiques candidates, évaluation hors politique, et la boucle de révision">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="720" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Anatomie d'un dispositif de ciblage évaluable</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Quatre éléments, quatre propriétaires. Le premier disparaît si personne n'est chargé de le défendre.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- 1. Le témoin permanent -->
  <g class="interactive" data-region="temoin" data-card="temoin-permanent" tabindex="0" role="button" aria-label="Le témoin permanent — cliquez pour les détails">
    <rect x="64" y="200" width="235" height="270" rx="3" fill="#FFFFFF" stroke="#4A7C59" stroke-width="1.75"/>
    <rect x="64" y="200" width="5" height="270" fill="#4A7C59"/>
    <text x="86" y="230" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">ÉLÉMENT 1</text>
    <text x="86" y="260" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Le témoin</text>
    <text x="86" y="282" class="display" font-size="18" font-weight="600" fill="#1A1A1A">permanent</text>
    <line x1="86" y1="300" x2="277" y2="300" stroke="#E5E1D8" stroke-width="1"/>
    <text x="86" y="324" class="body" font-size="12" fill="#5A5A5A">Une fraction tirée au sort,</text>
    <text x="86" y="342" class="body" font-size="12" fill="#5A5A5A">non sollicitée, reconstituée</text>
    <text x="86" y="360" class="body" font-size="12" fill="#5A5A5A">à chaque cycle plutôt que</text>
    <text x="86" y="378" class="body" font-size="12" fill="#5A5A5A">figée une fois pour toutes.</text>
    <text x="86" y="412" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">PORTÉ PAR</text>
    <text x="86" y="434" class="body" font-size="12.5" fill="#1A1A1A">un tiers hors de la chaîne</text>
    <text x="86" y="452" class="body" font-size="12.5" fill="#1A1A1A">commerciale</text>
  </g>

  <!-- 2. La trace d'assignation -->
  <g class="interactive" data-region="trace" data-card="trace" tabindex="0" role="button" aria-label="La trace d'assignation — cliquez pour les détails">
    <rect x="343" y="200" width="235" height="270" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="343" y="200" width="5" height="270" fill="#1F5560"/>
    <text x="365" y="230" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">ÉLÉMENT 2</text>
    <text x="365" y="260" class="display" font-size="18" font-weight="600" fill="#1A1A1A">La trace</text>
    <text x="365" y="282" class="display" font-size="18" font-weight="600" fill="#1A1A1A">d'assignation</text>
    <line x1="365" y1="300" x2="556" y2="300" stroke="#E5E1D8" stroke-width="1"/>
    <text x="365" y="324" class="body" font-size="12" fill="#5A5A5A">Bras, horodatage, version</text>
    <text x="365" y="342" class="body" font-size="12" fill="#5A5A5A">de la règle appliquée et</text>
    <text x="365" y="360" class="body" font-size="12" fill="#5A5A5A">probabilité d'assignation,</text>
    <text x="365" y="378" class="body" font-size="12" fill="#5A5A5A">conservées avec le reste.</text>
    <text x="365" y="412" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">PORTÉ PAR</text>
    <text x="365" y="434" class="body" font-size="12.5" fill="#1A1A1A">l'ingénierie du socle de</text>
    <text x="365" y="452" class="body" font-size="12.5" fill="#1A1A1A">données</text>
  </g>

  <!-- 3. Les politiques candidates -->
  <g class="interactive" data-region="politiques" data-card="politiques" tabindex="0" role="button" aria-label="Les politiques candidates — cliquez pour les détails">
    <rect x="622" y="200" width="235" height="270" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="622" y="200" width="5" height="270" fill="#B58A2C"/>
    <text x="644" y="230" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">ÉLÉMENT 3</text>
    <text x="644" y="260" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Les politiques</text>
    <text x="644" y="282" class="display" font-size="18" font-weight="600" fill="#1A1A1A">candidates</text>
    <line x1="644" y1="300" x2="835" y2="300" stroke="#E5E1D8" stroke-width="1"/>
    <text x="644" y="324" class="body" font-size="12" fill="#5A5A5A">Chaque règle qui transforme</text>
    <text x="644" y="342" class="body" font-size="12" fill="#5A5A5A">un score en décision de</text>
    <text x="644" y="360" class="body" font-size="12" fill="#5A5A5A">contacter : un seuil, un</text>
    <text x="644" y="378" class="body" font-size="12" fill="#5A5A5A">volume, des exclusions.</text>
    <text x="644" y="412" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">PORTÉ PAR</text>
    <text x="644" y="434" class="body" font-size="12.5" fill="#1A1A1A">l'équipe data, qui les</text>
    <text x="644" y="452" class="body" font-size="12.5" fill="#1A1A1A">versionne et les date</text>
  </g>

  <!-- 4. L'évaluation hors politique -->
  <g class="interactive" data-region="evaluation" data-card="evaluation" tabindex="0" role="button" aria-label="L'évaluation hors politique — cliquez pour les détails">
    <rect x="901" y="200" width="235" height="270" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="901" y="200" width="5" height="270" fill="#B7332C"/>
    <text x="923" y="230" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ÉLÉMENT 4</text>
    <text x="923" y="260" class="display" font-size="18" font-weight="600" fill="#1A1A1A">L'évaluation</text>
    <text x="923" y="282" class="display" font-size="18" font-weight="600" fill="#1A1A1A">hors politique</text>
    <line x1="923" y1="300" x2="1114" y2="300" stroke="#E5E1D8" stroke-width="1"/>
    <text x="923" y="324" class="body" font-size="12" fill="#5A5A5A">Un seul jeu randomisé évalue</text>
    <text x="923" y="342" class="body" font-size="12" fill="#5A5A5A">un nombre arbitraire de</text>
    <text x="923" y="360" class="body" font-size="12" fill="#5A5A5A">politiques candidates, sans</text>
    <text x="923" y="378" class="body" font-size="12" fill="#5A5A5A">repayer une expérience.</text>
    <text x="923" y="412" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">PORTÉ PAR</text>
    <text x="923" y="434" class="body" font-size="12.5" fill="#1A1A1A">l'instance qui arbitre le</text>
    <text x="923" y="452" class="body" font-size="12.5" fill="#1A1A1A">budget de sollicitation</text>
  </g>

  <!-- Flèches -->
  <line x1="303" y1="335" x2="321" y2="335" stroke="#8A8478" stroke-width="1.5"/>
  <polygon points="321,329 331,335 321,341" fill="#8A8478"/>
  <line x1="582" y1="335" x2="600" y2="335" stroke="#8A8478" stroke-width="1.5"/>
  <polygon points="600,329 610,335 600,341" fill="#8A8478"/>
  <line x1="861" y1="335" x2="879" y2="335" stroke="#8A8478" stroke-width="1.5"/>
  <polygon points="879,329 889,335 879,341" fill="#8A8478"/>

  <!-- Boucle de révision -->
  <g class="interactive" data-region="revision" data-card="revision" tabindex="0" role="button" aria-label="La boucle de révision — cliquez pour les détails">
    <path d="M 1018 470 L 1018 528 L 181 528 L 181 494" fill="none" stroke="#4A7C59" stroke-width="1.5" stroke-dasharray="6 4"/>
    <polygon points="175,494 181,482 187,494" fill="#4A7C59"/>
    <rect x="466" y="510" width="268" height="36" rx="3" fill="#FAF8F3"/>
    <text x="600" y="534" class="mono" font-size="11" letter-spacing="0.09em" fill="#4A7C59" text-anchor="middle">RÉVISION DU SEUIL ET DU VOLUME</text>
  </g>

  <!-- Bande de gouvernance -->
  <g class="interactive" data-region="garde" data-card="garde" tabindex="0" role="button" aria-label="Ce qui fait tenir le dispositif — cliquez pour les détails">
    <rect x="64" y="586" width="1072" height="96" rx="3" fill="#F2EEE4" stroke="#B7332C" stroke-width="1.5"/>
    <text x="88" y="616" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LE POINT DE RUPTURE</text>
    <text x="88" y="644" class="body" font-size="14" fill="#1A1A1A">Vu d'une direction commerciale en fin de trimestre, un groupe témoin est un stock de clients non sollicités disponible immédiatement.</text>
    <text x="88" y="668" class="body" font-size="14" fill="#1A1A1A">Il disparaît dans l'année si sa protection n'est écrite nulle part et si personne n'a l'autorité de refuser sa réaffectation.</text>
  </g>
</svg>
