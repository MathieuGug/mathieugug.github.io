<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-label="Trois chemins de la donnée au classement par effet : transformation de la réponse, méta-apprenants, forêts causales, et l'exigence de randomisation commune aux trois">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="790" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois chemins de la donnée au classement par effet</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le choix se joue sur la variance, le déséquilibre entre bras et l'outillage à maintenir.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Chemin 1 -->
  <g class="interactive" data-region="transformation" data-card="transformation" tabindex="0" role="button" aria-label="La transformation de la réponse — cliquez pour les détails">
    <rect x="64" y="200" width="336" height="430" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="64" y="200" width="5" height="430" fill="#4A7C59"/>
    <text x="88" y="232" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">CHEMIN 1</text>
    <text x="88" y="266" class="display" font-size="20" font-weight="600" fill="#1A1A1A">La transformation</text>
    <text x="88" y="292" class="display" font-size="20" font-weight="600" fill="#1A1A1A">de la réponse</text>
    <text x="88" y="318" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Le moins coûteux à mettre en place</text>
    <line x1="88" y1="338" x2="376" y2="338" stroke="#E5E1D8" stroke-width="1"/>

    <text x="88" y="366" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">COMMENT</text>
    <text x="88" y="390" class="body" font-size="12.5" fill="#5A5A5A">On réécrit l'étiquette de sorte qu'une</text>
    <text x="88" y="408" class="body" font-size="12.5" fill="#5A5A5A">régression ordinaire estime l'effet en</text>
    <text x="88" y="426" class="body" font-size="12.5" fill="#5A5A5A">espérance plutôt que la probabilité.</text>

    <text x="88" y="464" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">CE QUE ÇA COÛTE</text>
    <text x="88" y="488" class="body" font-size="12.5" fill="#5A5A5A">Une variance élevée : l'étiquette</text>
    <text x="88" y="506" class="body" font-size="12.5" fill="#5A5A5A">transformée est bruitée, et il faut</text>
    <text x="88" y="524" class="body" font-size="12.5" fill="#5A5A5A">beaucoup d'observations pour voir.</text>

    <text x="88" y="562" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">CE QU'IL FAUT AVOIR</text>
    <text x="88" y="586" class="body" font-size="12.5" fill="#5A5A5A">Une probabilité d'assignation connue</text>
    <text x="88" y="604" class="body" font-size="12.5" fill="#5A5A5A">et maîtrisée.</text>
  </g>

  <!-- Chemin 2 -->
  <g class="interactive" data-region="metaapprenants" data-card="metaapprenants" tabindex="0" role="button" aria-label="Les méta-apprenants — cliquez pour les détails">
    <rect x="432" y="200" width="336" height="430" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="432" y="200" width="5" height="430" fill="#B58A2C"/>
    <text x="456" y="232" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">CHEMIN 2</text>
    <text x="456" y="266" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Les méta-apprenants</text>
    <text x="456" y="292" class="mono" font-size="14" letter-spacing="0.14em" fill="#8A8478">S · T · X · R</text>
    <text x="456" y="318" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Le compromis le plus courant</text>
    <line x1="456" y1="338" x2="744" y2="338" stroke="#E5E1D8" stroke-width="1"/>

    <text x="456" y="366" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">COMMENT</text>
    <text x="456" y="390" class="body" font-size="12.5" fill="#5A5A5A">On décompose l'estimation en plusieurs</text>
    <text x="456" y="408" class="body" font-size="12.5" fill="#5A5A5A">régressions confiées à n'importe quel</text>
    <text x="456" y="426" class="body" font-size="12.5" fill="#5A5A5A">algorithme d'apprentissage existant.</text>

    <text x="456" y="464" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">CE QUE ÇA COÛTE</text>
    <text x="456" y="488" class="body" font-size="12.5" fill="#5A5A5A">Le choix de la variante dépend du</text>
    <text x="456" y="506" class="body" font-size="12.5" fill="#5A5A5A">déséquilibre entre les deux bras, qui</text>
    <text x="456" y="524" class="body" font-size="12.5" fill="#5A5A5A">est lui-même une décision de budget.</text>

    <text x="456" y="562" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">CE QU'IL FAUT AVOIR</text>
    <text x="456" y="586" class="body" font-size="12.5" fill="#5A5A5A">Deux bras exploitables. Le X-apprenant</text>
    <text x="456" y="604" class="body" font-size="12.5" fill="#5A5A5A">tient un déséquilibre fort.</text>
  </g>

  <!-- Chemin 3 -->
  <g class="interactive" data-region="foret" data-card="foret" tabindex="0" role="button" aria-label="Les forêts causales et l'apprentissage de politique — cliquez pour les détails">
    <rect x="800" y="200" width="336" height="430" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="800" y="200" width="5" height="430" fill="#1F5560"/>
    <text x="824" y="232" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CHEMIN 3</text>
    <text x="824" y="266" class="display" font-size="20" font-weight="600" fill="#1A1A1A">Les forêts causales</text>
    <text x="824" y="292" class="display" font-size="20" font-weight="600" fill="#1A1A1A">et la politique</text>
    <text x="824" y="318" class="body" font-size="12.5" font-style="italic" fill="#8A8478">Le seul chemin qui chiffre l'incertitude</text>
    <line x1="824" y1="338" x2="1112" y2="338" stroke="#E5E1D8" stroke-width="1"/>

    <text x="824" y="366" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">COMMENT</text>
    <text x="824" y="390" class="body" font-size="12.5" fill="#5A5A5A">Un partitionnement adapté aux effets,</text>
    <text x="824" y="408" class="body" font-size="12.5" fill="#5A5A5A">qui fournit un intervalle de confiance</text>
    <text x="824" y="426" class="body" font-size="12.5" fill="#5A5A5A">sur l'effet estimé pour un individu.</text>

    <text x="824" y="464" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">CE QUE ÇA COÛTE</text>
    <text x="824" y="488" class="body" font-size="12.5" fill="#5A5A5A">Un temps de calcul supérieur et une</text>
    <text x="824" y="506" class="body" font-size="12.5" fill="#5A5A5A">chaîne d'outillage dédiée à maintenir</text>
    <text x="824" y="524" class="body" font-size="12.5" fill="#5A5A5A">dans la durée.</text>

    <text x="824" y="562" class="mono" font-size="10.5" letter-spacing="0.1em" fill="#8A8478">CE QU'IL FAUT AVOIR</text>
    <text x="824" y="586" class="body" font-size="12.5" fill="#5A5A5A">De quoi optimiser la règle de décision</text>
    <text x="824" y="604" class="body" font-size="12.5" fill="#5A5A5A">elle-même, sous contrainte de budget.</text>
  </g>

  <!-- Exigence commune -->
  <line x1="232" y1="646" x2="232" y2="668" stroke="#B7332C" stroke-width="1.5"/>
  <line x1="600" y1="646" x2="600" y2="668" stroke="#B7332C" stroke-width="1.5"/>
  <line x1="968" y1="646" x2="968" y2="668" stroke="#B7332C" stroke-width="1.5"/>
  <line x1="232" y1="668" x2="968" y2="668" stroke="#B7332C" stroke-width="1.5"/>
  <line x1="600" y1="668" x2="600" y2="684" stroke="#B7332C" stroke-width="1.5"/>
  <polygon points="594,684 600,698 606,684" fill="#B7332C"/>

  <g class="interactive" data-region="exigence" data-card="exigence" tabindex="0" role="button" aria-label="L'exigence commune aux trois chemins — cliquez pour les détails">
    <rect x="64" y="706" width="1072" height="66" rx="3" fill="#F2EEE4" stroke="#B7332C" stroke-width="1.5"/>
    <text x="88" y="732" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">L'EXIGENCE COMMUNE AUX TROIS CHEMINS</text>
    <text x="88" y="758" class="body" font-size="14" fill="#1A1A1A">Une population délibérément non sollicitée. La randomisation est la matière première du classement par effet, et non une précaution ajoutée.</text>
  </g>
</svg>
