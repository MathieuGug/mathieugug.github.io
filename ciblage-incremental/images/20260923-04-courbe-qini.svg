<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-label="La courbe de gain incrémental cumulé lue en décision : aire de Qini, point de retournement, descente au-delà du maximum, et le témoin sans lequel la courbe n'existe pas">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="740" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La courbe de gain incrémental, lue en décision</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Elle ne dit pas seulement si le modèle est bon. Elle dit à quel volume de sollicitation s'arrêter.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Aire de Qini -->
  <g class="interactive" data-region="aire" data-card="aire" tabindex="0" role="button" aria-label="L'aire de Qini — cliquez pour les détails">
    <path d="M 190 540 C 270 460, 350 300, 440 248 C 510 222, 570 238, 760 400 L 190 540 Z" fill="#4A7C59" opacity="0.13"/>
  </g>

  <!-- Grille -->
  <line x1="190" y1="540" x2="760" y2="540" stroke="#C9C3B6" stroke-width="1.25"/>
  <line x1="190" y1="540" x2="190" y2="210" stroke="#C9C3B6" stroke-width="1.25"/>
  <line x1="190" y1="226" x2="760" y2="226" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Droite du ciblage aléatoire -->
  <line x1="190" y1="540" x2="760" y2="400" stroke="#8A8478" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="486" class="body" font-size="12" font-style="italic" fill="#8A8478" transform="rotate(-13.8 600 486)">ciblage aléatoire</text>

  <!-- Courbe du modèle -->
  <path d="M 190 540 C 270 460, 350 300, 440 248 C 510 222, 570 238, 760 400" fill="none" stroke="#4A7C59" stroke-width="2.5"/>

  <!-- Point de retournement -->
  <g class="interactive" data-region="retournement" data-card="retournement" tabindex="0" role="button" aria-label="Le point de retournement — cliquez pour les détails">
    <line x1="500" y1="228" x2="500" y2="540" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="4 4"/>
    <circle cx="500" cy="228" r="5.5" fill="#B7332C"/>
    <text x="512" y="212" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C">POINT DE RETOURNEMENT</text>
    <text x="512" y="560" class="body" font-size="12" font-style="italic" fill="#B7332C">le volume où l'on devrait s'arrêter</text>
  </g>

  <!-- Zone de descente -->
  <g class="interactive" data-region="descente" data-card="descente" tabindex="0" role="button" aria-label="La descente au-delà du maximum — cliquez pour les détails">
    <rect x="500" y="210" width="260" height="330" fill="#B7332C" opacity="0.05"/>
    <text x="630" y="486" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C" text-anchor="middle">ZONE DE DÉPENSE</text>
    <text x="630" y="506" class="mono" font-size="11" letter-spacing="0.09em" fill="#B7332C" text-anchor="middle">DESTRUCTRICE</text>
  </g>

  <!-- Axes -->
  <text x="190" y="580" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">0 %</text>
  <text x="475" y="580" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">50 %</text>
  <text x="760" y="580" class="mono" font-size="11" fill="#8A8478" text-anchor="middle">100 %</text>
  <text x="475" y="608" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle">PART DE LA BASE SOLLICITÉE, TRIÉE PAR EFFET PRÉDIT DÉCROISSANT</text>
  <text x="160" y="375" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A" text-anchor="middle" transform="rotate(-90 160 375)">GAIN INCRÉMENTAL CUMULÉ</text>

  <!-- Lectures -->
  <g class="interactive" data-region="aire" data-card="aire" tabindex="0" role="button" aria-label="L'aire de Qini — cliquez pour les détails">
    <rect x="800" y="210" width="336" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="800" y="210" width="5" height="120" fill="#4A7C59"/>
    <text x="824" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">L'AIRE</text>
    <text x="824" y="268" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le coefficient de Qini</text>
    <text x="824" y="294" class="body" font-size="12.5" fill="#5A5A5A">L'aire entre la courbe et la droite du ciblage</text>
    <text x="824" y="314" class="body" font-size="12.5" fill="#5A5A5A">aléatoire. Une seule mesure, un seul chiffre.</text>
  </g>

  <g class="interactive" data-region="retournement" data-card="retournement" tabindex="0" role="button" aria-label="Le point de retournement — cliquez pour les détails">
    <rect x="800" y="348" width="336" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="800" y="348" width="5" height="120" fill="#B7332C"/>
    <text x="824" y="378" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">LE MAXIMUM</text>
    <text x="824" y="406" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La décision achetée</text>
    <text x="824" y="432" class="body" font-size="12.5" fill="#5A5A5A">Le sommet dit à quel volume s'arrêter. Piloter</text>
    <text x="824" y="452" class="body" font-size="12.5" fill="#5A5A5A">au taux de couverture fait dépenser au-delà.</text>
  </g>

  <g class="interactive" data-region="descente" data-card="descente" tabindex="0" role="button" aria-label="La descente — cliquez pour les détails">
    <rect x="800" y="486" width="336" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="800" y="486" width="5" height="120" fill="#B58A2C"/>
    <text x="824" y="516" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">LA DESCENTE</text>
    <text x="824" y="544" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Ce que coûte le zèle</text>
    <text x="824" y="570" class="body" font-size="12.5" fill="#5A5A5A">Au-delà du sommet, chaque tranche ajoutée</text>
    <text x="824" y="590" class="body" font-size="12.5" fill="#5A5A5A">contient plus de réfractaires que de gagnants.</text>
  </g>

  <!-- Condition d'existence -->
  <g class="interactive" data-region="temoin" data-card="temoin" tabindex="0" role="button" aria-label="Ce que la courbe exige — cliquez pour les détails">
    <rect x="64" y="638" width="1072" height="76" rx="3" fill="#F2EEE4" stroke="#1F5560" stroke-width="1.5"/>
    <text x="88" y="666" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CE QUE LA COURBE EXIGE POUR EXISTER</text>
    <text x="88" y="692" class="body" font-size="14" fill="#1A1A1A">Chaque tranche du classement doit contenir des individus sollicités et des individus tirés au sort qui ne l'ont pas été.</text>
    <text x="88" y="712" class="body" font-size="14" fill="#1A1A1A">Une campagne qui a sollicité toute sa cible ne produit aucune courbe, quelle que soit la sophistication du modèle en amont.</text>
  </g>
</svg>
