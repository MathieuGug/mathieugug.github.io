<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Qui détient le groupe témoin : la régie, l'annonceur ou un tiers indépendant, et ce que chaque montage rend vérifiable">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="820" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Qui détient le groupe témoin</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Depuis que la régie optimise sur l'incrémental, elle ne mesure plus seulement son effet : elle choisit à qui parler.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- En-têtes de colonnes -->
  <rect x="304" y="196" width="266" height="52" rx="3" fill="#F2EEE4"/>
  <text x="437" y="228" class="display" font-size="20" font-weight="600" fill="#B7332C" text-anchor="middle">La régie</text>
  <rect x="586" y="196" width="266" height="52" rx="3" fill="#F2EEE4"/>
  <text x="719" y="228" class="display" font-size="20" font-weight="600" fill="#B58A2C" text-anchor="middle">L'annonceur</text>
  <rect x="868" y="196" width="266" height="52" rx="3" fill="#F2EEE4"/>
  <text x="1001" y="228" class="display" font-size="20" font-weight="600" fill="#1F5560" text-anchor="middle">Un tiers</text>

  <!-- Ligne 1 -->
  <text x="64" y="288" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">QUI TIRE AU SORT</text>
  <line x1="64" y1="260" x2="1134" y2="260" stroke="#E5E1D8" stroke-width="1"/>
  <text x="304" y="288" class="body" font-size="12.5" fill="#1A1A1A">La plateforme, au niveau de</text>
  <text x="304" y="306" class="body" font-size="12.5" fill="#1A1A1A">l'enchère, sans priver personne</text>
  <text x="304" y="324" class="body" font-size="12.5" fill="#1A1A1A">d'une offre commerciale.</text>
  <text x="586" y="288" class="body" font-size="12.5" fill="#1A1A1A">L'entreprise, sur sa base, avant</text>
  <text x="586" y="306" class="body" font-size="12.5" fill="#1A1A1A">l'envoi de la sollicitation.</text>
  <text x="868" y="288" class="body" font-size="12.5" fill="#1A1A1A">Un protocole géographique arrêté</text>
  <text x="868" y="306" class="body" font-size="12.5" fill="#1A1A1A">avant la campagne, indépendant</text>
  <text x="868" y="324" class="body" font-size="12.5" fill="#1A1A1A">du canal mesuré.</text>

  <!-- Ligne 2 -->
  <line x1="64" y1="348" x2="1134" y2="348" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="376" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUE L'ACHETEUR</text>
  <text x="64" y="394" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">PEUT VÉRIFIER</text>
  <text x="304" y="376" class="body" font-size="12.5" fill="#1A1A1A">Ce que la plateforme restitue</text>
  <text x="304" y="394" class="body" font-size="12.5" fill="#1A1A1A">dans ses colonnes, et rien</text>
  <text x="304" y="412" class="body" font-size="12.5" fill="#1A1A1A">au-delà.</text>
  <text x="586" y="376" class="body" font-size="12.5" fill="#1A1A1A">Tout, dans la limite de ce que</text>
  <text x="586" y="394" class="body" font-size="12.5" fill="#1A1A1A">l'entreprise observe de ses</text>
  <text x="586" y="412" class="body" font-size="12.5" fill="#1A1A1A">propres clients.</text>
  <text x="868" y="376" class="body" font-size="12.5" fill="#1A1A1A">L'effet total du canal, sans</text>
  <text x="868" y="394" class="body" font-size="12.5" fill="#1A1A1A">dépendre de la comptabilité</text>
  <text x="868" y="412" class="body" font-size="12.5" fill="#1A1A1A">de la régie.</text>

  <!-- Ligne 3 -->
  <line x1="64" y1="436" x2="1134" y2="436" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="464" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QU'IL DÉLÈGUE</text>
  <text x="304" y="464" class="body" font-size="12.5" fill="#1A1A1A">Le ciblage et sa preuve, à la</text>
  <text x="304" y="482" class="body" font-size="12.5" fill="#1A1A1A">même partie et au même</text>
  <text x="304" y="500" class="body" font-size="12.5" fill="#1A1A1A">moment.</text>
  <text x="586" y="464" class="body" font-size="12.5" fill="#1A1A1A">Rien. Le coût du témoin et la</text>
  <text x="586" y="482" class="body" font-size="12.5" fill="#1A1A1A">charge d'analyse restent</text>
  <text x="586" y="500" class="body" font-size="12.5" fill="#1A1A1A">internes.</text>
  <text x="868" y="464" class="body" font-size="12.5" fill="#1A1A1A">L'exécution seulement, avec un</text>
  <text x="868" y="482" class="body" font-size="12.5" fill="#1A1A1A">protocole et une règle de</text>
  <text x="868" y="500" class="body" font-size="12.5" fill="#1A1A1A">lecture arrêtés d'avance.</text>

  <!-- Ligne 4 -->
  <line x1="64" y1="524" x2="1134" y2="524" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="552" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">CE QUI RESTE HORS</text>
  <text x="64" y="570" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">DE PORTÉE</text>
  <text x="304" y="552" class="body" font-size="12.5" fill="#1A1A1A">La vérification indépendante :</text>
  <text x="304" y="570" class="body" font-size="12.5" fill="#1A1A1A">le protocole n'est ni choisi</text>
  <text x="304" y="588" class="body" font-size="12.5" fill="#1A1A1A">ni rejouable par l'acheteur.</text>
  <text x="586" y="552" class="body" font-size="12.5" fill="#1A1A1A">Ce qui se passe hors de la base :</text>
  <text x="586" y="570" class="body" font-size="12.5" fill="#1A1A1A">impressions non servies, effets</text>
  <text x="586" y="588" class="body" font-size="12.5" fill="#1A1A1A">de report entre canaux.</text>
  <text x="868" y="552" class="body" font-size="12.5" fill="#1A1A1A">Le pilotage continu : la cadence</text>
  <text x="868" y="570" class="body" font-size="12.5" fill="#1A1A1A">autorise quelques questions par</text>
  <text x="868" y="588" class="body" font-size="12.5" fill="#1A1A1A">an, sous contrainte de puissance.</text>

  <!-- Verdicts -->
  <line x1="64" y1="612" x2="1134" y2="612" stroke="#C9C3B6" stroke-width="1.25"/>
  <text x="64" y="654" class="mono" font-size="11" letter-spacing="0.09em" fill="#5A5A5A">EN UN MOT</text>

  <g class="interactive" data-region="regie" data-card="regie" tabindex="0" role="button" aria-label="Le témoin tenu par la régie — cliquez pour les détails">
    <rect x="304" y="626" width="266" height="58" rx="3" fill="#FFFFFF" stroke="#B7332C" stroke-width="1.5"/>
    <text x="437" y="650" class="display" font-size="17" font-weight="600" fill="#1A1A1A" text-anchor="middle">Efficace, non opposable</text>
    <text x="437" y="670" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="middle">à activer, jamais à croire seul</text>
  </g>
  <g class="interactive" data-region="annonceur" data-card="annonceur" tabindex="0" role="button" aria-label="Le témoin tenu par l'annonceur — cliquez pour les détails">
    <rect x="586" y="626" width="266" height="58" rx="3" fill="#FFFFFF" stroke="#B58A2C" stroke-width="1.5"/>
    <text x="719" y="650" class="display" font-size="17" font-weight="600" fill="#1A1A1A" text-anchor="middle">Opposable, myope</text>
    <text x="719" y="670" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="middle">le socle du ciblage sur base</text>
  </g>
  <g class="interactive" data-region="tiers" data-card="tiers" tabindex="0" role="button" aria-label="Le témoin tenu par un tiers — cliquez pour les détails">
    <rect x="868" y="626" width="266" height="58" rx="3" fill="#FFFFFF" stroke="#1F5560" stroke-width="1.5"/>
    <text x="1001" y="650" class="display" font-size="17" font-weight="600" fill="#1A1A1A" text-anchor="middle">La référence externe</text>
    <text x="1001" y="670" class="body" font-size="12" font-style="italic" fill="#8A8478" text-anchor="middle">rare, cadencé, pré-enregistré</text>
  </g>

  <!-- Décision -->
  <g class="interactive" data-region="contrat" data-card="contrat" tabindex="0" role="button" aria-label="Ce qui se négocie au contrat — cliquez pour les détails">
    <rect x="64" y="712" width="1070" height="86" rx="3" fill="#F2EEE4" stroke="#B7332C" stroke-width="1.5"/>
    <text x="88" y="740" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QUI SE NÉGOCIE AU CONTRAT, ET NON APRÈS LES RÉSULTATS</text>
    <text x="88" y="768" class="body" font-size="14" fill="#1A1A1A">Les trois montages se combinent. Le seul arbitrage qui ne se délègue pas est de ne pas acheter à la même partie le ciblage et sa preuve :</text>
    <text x="88" y="790" class="body" font-size="14" fill="#1A1A1A">l'optimisation incrémentale d'une régie s'active, à condition d'être adossée à une vérification tenue ailleurs et lue selon une règle écrite avant.</text>
  </g>
</svg>
