<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="La boucle de rétroaction du ciblage : sélection, observation, réapprentissage, resserrement, et le groupe témoin comme seule sortie de boucle">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="760" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La boucle qui se confirme elle-même</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque tour améliore l'indicateur interne et rétrécit ce que l'organisation peut encore observer.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Étape 1 -->
  <g class="interactive" data-region="selection" data-card="selection" tabindex="0" role="button" aria-label="La politique sélectionne — cliquez pour les détails">
    <rect x="140" y="210" width="320" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="140" y="210" width="5" height="120" fill="#B58A2C"/>
    <text x="164" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">ÉTAPE 1</text>
    <text x="164" y="268" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La politique sélectionne</text>
    <text x="164" y="294" class="body" font-size="12.5" fill="#5A5A5A">Le score en vigueur retient une fraction de</text>
    <text x="164" y="314" class="body" font-size="12.5" fill="#5A5A5A">la base. Le reste ne sera pas sollicité.</text>
  </g>

  <!-- Étape 2 -->
  <g class="interactive" data-region="observation" data-card="observation" tabindex="0" role="button" aria-label="La campagne observe — cliquez pour les détails">
    <rect x="740" y="210" width="320" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="740" y="210" width="5" height="120" fill="#B58A2C"/>
    <text x="764" y="240" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">ÉTAPE 2</text>
    <text x="764" y="268" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La campagne observe</text>
    <text x="764" y="294" class="body" font-size="12.5" fill="#5A5A5A">On enregistre les conversions des seuls</text>
    <text x="764" y="314" class="body" font-size="12.5" fill="#5A5A5A">individus que la politique a retenus.</text>
  </g>

  <!-- Étape 3 -->
  <g class="interactive" data-region="apprentissage" data-card="apprentissage" tabindex="0" role="button" aria-label="Le modèle réapprend — cliquez pour les détails">
    <rect x="740" y="410" width="320" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="740" y="410" width="5" height="120" fill="#B7332C"/>
    <text x="764" y="440" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ÉTAPE 3</text>
    <text x="764" y="468" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le modèle réapprend</text>
    <text x="764" y="494" class="body" font-size="12.5" fill="#5A5A5A">Le réentraînement se fait sur une population</text>
    <text x="764" y="514" class="body" font-size="12.5" fill="#5A5A5A">que le modèle précédent a choisie.</text>
  </g>

  <!-- Étape 4 -->
  <g class="interactive" data-region="confirmation" data-card="confirmation" tabindex="0" role="button" aria-label="Le ciblage se resserre — cliquez pour les détails">
    <rect x="140" y="410" width="320" height="120" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
    <rect x="140" y="410" width="5" height="120" fill="#B7332C"/>
    <text x="164" y="440" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">ÉTAPE 4</text>
    <text x="164" y="468" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Le ciblage se resserre</text>
    <text x="164" y="494" class="body" font-size="12.5" fill="#5A5A5A">Les segments jamais sollicités restent</text>
    <text x="164" y="514" class="body" font-size="12.5" fill="#5A5A5A">inconnus et sortent définitivement du champ.</text>
  </g>

  <!-- Flèches du cycle -->
  <line x1="476" y1="270" x2="712" y2="270" stroke="#8A8478" stroke-width="1.5"/>
  <polygon points="712,264 726,270 712,276" fill="#8A8478"/>

  <line x1="900" y1="346" x2="900" y2="382" stroke="#8A8478" stroke-width="1.5"/>
  <polygon points="894,382 900,396 906,382" fill="#8A8478"/>

  <line x1="724" y1="470" x2="488" y2="470" stroke="#8A8478" stroke-width="1.5"/>
  <polygon points="488,464 474,470 488,476" fill="#8A8478"/>

  <line x1="300" y1="394" x2="300" y2="358" stroke="#8A8478" stroke-width="1.5"/>
  <polygon points="294,358 300,344 306,358" fill="#8A8478"/>

  <!-- Annotation centrale -->
  <text x="600" y="342" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C" text-anchor="middle">À CHAQUE TOUR</text>
  <text x="600" y="372" class="body" font-size="13" fill="#1A1A1A" text-anchor="middle">Le taux de conversion observé</text>
  <text x="600" y="392" class="body" font-size="13" fill="#1A1A1A" text-anchor="middle">sur la population ciblée monte.</text>
  <text x="600" y="420" class="body" font-size="12.5" font-style="italic" fill="#B7332C" text-anchor="middle">L'effet, lui, n'est jamais mesuré.</text>

  <!-- Sortie de boucle -->
  <line x1="600" y1="546" x2="600" y2="576" stroke="#4A7C59" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="594,576 600,590 606,576" fill="#4A7C59"/>

  <g class="interactive" data-region="rupture" data-card="rupture" tabindex="0" role="button" aria-label="La sortie de boucle — cliquez pour les détails">
    <rect x="140" y="604" width="920" height="110" rx="3" fill="#FFFFFF" stroke="#4A7C59" stroke-width="1.75" stroke-dasharray="7 4"/>
    <text x="164" y="636" class="mono" font-size="11" letter-spacing="0.1em" fill="#4A7C59">LA SEULE SORTIE DE BOUCLE</text>
    <text x="164" y="666" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Une fraction tirée au sort et non sollicitée, à chaque cycle</text>
    <text x="164" y="694" class="body" font-size="13" fill="#5A5A5A">Elle réintroduit dans les données la seule information que la boucle a cessé de produire : ce qui arrive quand on ne sollicite pas.</text>
  </g>
</svg>
