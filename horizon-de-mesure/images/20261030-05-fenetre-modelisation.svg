<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Deux courbes de rémanence sur le même investissement et le trait vertical du max_lag : la part de l'effet capturée dépend de trois réglages de modélisation">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La fenêtre est aussi un réglage</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Trois paramètres décident si l'effet long apparaît dans un modèle de mix. La documentation de l'outil le dit.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- graphique -->
  <text x="64" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">EFFET RÉSIDUEL D'UNE EXPOSITION, PÉRIODE PAR PÉRIODE</text>

  <!-- axes -->
  <line x1="110" y1="440" x2="900" y2="440" stroke="#1A1A1A" stroke-width="1.25"/>
  <line x1="110" y1="440" x2="110" y2="216" stroke="#1A1A1A" stroke-width="1.25"/>
  <text x="96" y="222" class="mono" font-size="10.5" fill="#8A8478" text-anchor="end">effet</text>
  <g class="mono" font-size="10.5" fill="#8A8478">
    <text x="110" y="462" text-anchor="middle">0</text>
    <text x="268" y="462" text-anchor="middle">S4</text>
    <text x="426" y="462" text-anchor="middle">S8</text>
    <text x="584" y="462" text-anchor="middle">S12</text>
    <text x="742" y="462" text-anchor="middle">S16</text>
    <text x="900" y="462" text-anchor="middle">S20</text>
  </g>
  <line x1="268" y1="440" x2="268" y2="434" stroke="#1A1A1A" stroke-width="0.75"/>
  <line x1="426" y1="440" x2="426" y2="434" stroke="#1A1A1A" stroke-width="0.75"/>
  <line x1="584" y1="440" x2="584" y2="434" stroke="#1A1A1A" stroke-width="0.75"/>
  <line x1="742" y1="440" x2="742" y2="434" stroke="#1A1A1A" stroke-width="0.75"/>

  <!-- courbe géométrique -->
  <g class="interactive" data-card="courbe-geometrique" tabindex="0" role="button" aria-label="La décroissance géométrique — cliquez pour les détails">
    <path d="M 110 240 C 180 300 230 376 300 406 C 400 428 560 436 900 438 L 900 440 L 110 440 Z" fill="#1F5560" fill-opacity="0.16"/>
    <path d="M 110 240 C 180 300 230 376 300 406 C 400 428 560 436 900 438" fill="none" stroke="#1F5560" stroke-width="2.5"/>
    <circle cx="110" cy="240" r="4" fill="#1F5560"/>
    <text x="322" y="398" class="body" font-size="12.5" font-weight="600" fill="#1F5560">Décroissance géométrique</text>
    <text x="322" y="416" class="body" font-size="11.5" fill="#1F5560">pic immédiat, extinction rapide</text>
  </g>

  <!-- courbe binomiale -->
  <g class="interactive" data-card="courbe-binomiale" tabindex="0" role="button" aria-label="La décroissance binomiale — cliquez pour les détails">
    <path d="M 110 404 C 200 356 280 300 380 296 C 520 292 680 356 900 420 L 900 440 L 110 440 Z" fill="#B7332C" fill-opacity="0.12"/>
    <path d="M 110 404 C 200 356 280 300 380 296 C 520 292 680 356 900 420" fill="none" stroke="#B7332C" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="380" cy="296" r="4" fill="#B7332C"/>
    <text x="406" y="282" class="body" font-size="12.5" font-weight="600" fill="#B7332C">Décroissance binomiale</text>
    <text x="406" y="300" class="body" font-size="11.5" fill="#B7332C">pic différé, traîne longue</text>
  </g>

  <!-- max lag -->
  <g class="interactive" data-card="max-lag" tabindex="0" role="button" aria-label="Le paramètre max_lag — cliquez pour les détails">
    <line x1="426" y1="216" x2="426" y2="440" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="434" y="216" width="152" height="46" rx="3" fill="#1A1A1A"/>
    <text x="448" y="236" class="mono" font-size="11.5" fill="#FAF8F3">max_lag = 8</text>
    <text x="448" y="254" class="body" font-size="11" fill="#B8B5AE">mur d'attribution</text>
    <rect x="426" y="266" width="474" height="166" fill="#8A8478" fill-opacity="0.10"/>
    <text x="664" y="340" class="display" font-size="17" font-style="italic" fill="#8A8478" text-anchor="middle">au-delà du mur, l'effet n'est pas</text>
    <text x="664" y="362" class="display" font-size="17" font-style="italic" fill="#8A8478" text-anchor="middle">sous-estimé : il est hors du modèle</text>
  </g>

  <!-- prior -->
  <g class="interactive" data-card="prior-alpha" tabindex="0" role="button" aria-label="Le prior sur le paramètre de décroissance — cliquez pour les détails">
    <rect x="936" y="216" width="200" height="216" rx="3" fill="#B58A2C" fill-opacity="0.11" stroke="#B58A2C" stroke-width="1.5"/>
    <text x="956" y="244" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">RÉGLAGE 3</text>
    <text x="956" y="274" class="display" font-size="18" font-weight="600" fill="#8A6A1E">Le prior sur</text>
    <text x="956" y="296" class="display" font-size="18" font-weight="600" fill="#8A6A1E">la décroissance</text>
    <text x="956" y="328" class="body" font-size="12" fill="#5A5A5A">Poussé vers 1, il étire</text>
    <text x="956" y="346" class="body" font-size="12" fill="#5A5A5A">l'effet dans le temps.</text>
    <text x="956" y="376" class="body" font-size="12" fill="#5A5A5A">Souvent laissé à sa</text>
    <text x="956" y="394" class="body" font-size="12" fill="#5A5A5A">valeur par défaut, et</text>
    <text x="956" y="412" class="body" font-size="12" fill="#5A5A5A">jamais restitué.</text>
  </g>

  <!-- citation documentation -->
  <rect x="64" y="496" width="1072" height="112" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.25"/>
  <rect x="64" y="496" width="5" height="112" fill="#B7332C"/>
  <text x="92" y="524" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CE QUE L'ÉDITEUR DE L'OUTIL ÉCRIT LUI-MÊME</text>
  <text x="92" y="556" class="display" font-size="19" font-style="italic" fill="#1A1A1A">« Si des effets longs attendus ne se matérialisent pas dans un modèle, une combinaison</text>
  <text x="92" y="580" class="display" font-size="19" font-style="italic" fill="#1A1A1A">de courbe binomiale, de prior modifié et de max_lag élargi peut aider. »</text>
  <text x="92" y="600" class="body" font-size="11.5" fill="#8A8478">Documentation Meridian, paramètre adstock_decay_spec (reformulation fidèle du passage).</text>

  <!-- bandeau conséquence -->
  <rect x="64" y="628" width="1072" height="84" rx="3" fill="#1A1A1A"/>
  <text x="88" y="654" class="mono" font-size="11" letter-spacing="0.1em" fill="#B8B5AE">LA CONSÉQUENCE POUR UN COMITÉ</text>
  <text x="88" y="678" class="display" font-size="19" font-weight="600" fill="#FAF8F3">« Les médias de marque ne paient pas » peut être la conséquence de trois réglages,</text>
  <text x="88" y="702" class="display" font-size="19" font-weight="600" fill="#FAF8F3">et l'outil documente lui-même le moyen d'inverser le résultat.</text>

  <line x1="64" y1="740" x2="1136" y2="740" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="762" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : documentation Meridian (paramètre adstock_decay_spec) ; Dekimpe &amp; Hanssens, Marketing Science 14(1), 1995, pour la sous-estimation des effets de tendance. Les courbes sont schématiques, non ajustées sur des données.</text>
</svg>
