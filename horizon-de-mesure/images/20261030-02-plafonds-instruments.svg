<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 816" role="img" aria-label="Quatre instruments de mesure et leur plafond d'horizon : test géographique, incrémentalité en régie, modèle de mix, modélisation de persistance, et la zone commune d'aveuglement">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="816" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Quatre instruments, quatre plafonds</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque famille de mesure porte une borne haute d'horizon. Les plus crédibles sont les plus courtes.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- échelle temporelle -->
  <text x="392" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">PORTÉE D'OBSERVATION  →</text>
  <line x1="392" y1="210" x2="1104" y2="210" stroke="#B8B5AE" stroke-width="0.5"/>
  <g class="mono" font-size="10.5" fill="#8A8478">
    <text x="392" y="228">0</text>
    <text x="500" y="228" text-anchor="middle">1 mois</text>
    <text x="620" y="228" text-anchor="middle">3 mois</text>
    <text x="760" y="228" text-anchor="middle">6 mois</text>
    <text x="900" y="228" text-anchor="middle">1 an</text>
    <text x="1040" y="228" text-anchor="middle">3 ans +</text>
  </g>
  <line x1="392" y1="238" x2="392" y2="690" stroke="#B8B5AE" stroke-width="0.5" stroke-dasharray="2 3"/>
  <line x1="620" y1="238" x2="620" y2="690" stroke="#B8B5AE" stroke-width="0.5" stroke-dasharray="2 3"/>
  <line x1="900" y1="238" x2="900" y2="690" stroke="#B8B5AE" stroke-width="0.5" stroke-dasharray="2 3"/>

  <!-- 1 test géo -->
  <g class="interactive" data-card="test-geo" tabindex="0" role="button" aria-label="Le test géographique — cliquez pour les détails">
    <rect x="64" y="250" width="1040" height="94" rx="3" fill="#FFFFFF" fill-opacity="0" stroke="#FFFFFF" stroke-opacity="0"/>
    <text x="64" y="276" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">INSTRUMENT 1</text>
    <text x="64" y="302" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Test géographique</text>
    <text x="64" y="326" class="body" font-size="12" fill="#8A8478">Contrefactuel propre</text>
    <rect x="392" y="266" width="165" height="56" rx="3" fill="#1F5560" fill-opacity="0.18" stroke="#1F5560" stroke-width="1.5"/>
    <text x="410" y="290" class="body" font-size="12.5" font-weight="600" fill="#1F5560">2 à 8 semaines</text>
    <text x="410" y="310" class="body" font-size="11.5" fill="#1F5560">borne économique</text>
    <text x="580" y="298" class="body" font-size="12.5" fill="#5A5A5A">La zone témoin est du budget sacrifié : chaque semaine de test coûte de la vente renoncée.</text>
  </g>

  <!-- 2 lift régie -->
  <g class="interactive" data-card="lift-regie" tabindex="0" role="button" aria-label="La mesure d'incrémentalité en régie — cliquez pour les détails">
    <text x="64" y="382" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">INSTRUMENT 2</text>
    <text x="64" y="408" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Incrémentalité en régie</text>
    <text x="64" y="432" class="body" font-size="12" fill="#8A8478">Contrefactuel tenu par le vendeur</text>
    <rect x="392" y="372" width="118" height="56" rx="3" fill="#1F5560" fill-opacity="0.18" stroke="#1F5560" stroke-width="1.5"/>
    <text x="410" y="396" class="body" font-size="12.5" font-weight="600" fill="#1F5560">jours à</text>
    <text x="410" y="414" class="body" font-size="12.5" font-weight="600" fill="#1F5560">semaines</text>
    <text x="534" y="404" class="body" font-size="12.5" fill="#5A5A5A">Au-delà, les cohortes se dissolvent. Aucun client ne réclame l'horizon long, la régie ne l'instrumente pas.</text>
  </g>

  <!-- 3 modèle de mix -->
  <g class="interactive" data-card="modele-mix" tabindex="0" role="button" aria-label="Le modèle de mix marketing et son paramètre max_lag — cliquez pour les détails">
    <text x="64" y="488" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">INSTRUMENT 3</text>
    <text x="64" y="514" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Modèle de mix</text>
    <text x="64" y="538" class="body" font-size="12" fill="#8A8478">Pas de contrefactuel · borne écrite</text>
    <rect x="392" y="478" width="240" height="56" rx="3" fill="#B7332C" fill-opacity="0.16" stroke="#B7332C" stroke-width="2.5"/>
    <text x="410" y="502" class="body" font-size="12.5" font-weight="600" fill="#B7332C">8 à 20 semaines</text>
    <text x="410" y="521" class="mono" font-size="11.5" fill="#B7332C">max_lag = 2–10 ou 4–20</text>
    <text x="656" y="502" class="body" font-size="12.5" fill="#5A5A5A">La seule borne explicitement documentée, et la moins regardée : elle est renseignée par</text>
    <text x="656" y="520" class="body" font-size="12.5" fill="#5A5A5A">l'équipe de modélisation et ne figure sur aucun support de restitution.</text>
  </g>

  <!-- 4 persistance -->
  <g class="interactive" data-card="persistance" tabindex="0" role="button" aria-label="La modélisation de persistance — cliquez pour les détails">
    <text x="64" y="594" class="mono" font-size="11" letter-spacing="0.1em" fill="#B58A2C">INSTRUMENT 4</text>
    <text x="64" y="620" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Persistance</text>
    <text x="64" y="644" class="body" font-size="12" fill="#8A8478">Aucun contrefactuel</text>
    <rect x="392" y="584" width="712" height="56" rx="3" fill="#B58A2C" fill-opacity="0.14" stroke="#B58A2C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="410" y="608" class="body" font-size="12.5" font-weight="600" fill="#8A6A1E">Plusieurs années de série</text>
    <text x="410" y="628" class="body" font-size="12" fill="#8A6A1E">Elle voit loin, et ne compare rien : elle lit une trajectoire et teste une structure.</text>
  </g>

  <!-- zone aveugle -->
  <g class="interactive" data-card="zone-aveugle" tabindex="0" role="button" aria-label="La zone d'aveuglement commune — cliquez pour les détails">
    <rect x="64" y="684" width="1040" height="60" rx="3" fill="#1A1A1A"/>
    <text x="88" y="708" class="mono" font-size="11" letter-spacing="0.1em" fill="#B8B5AE">L'ABSENCE QUI STRUCTURE TOUT</text>
    <text x="88" y="732" class="display" font-size="19" font-weight="600" fill="#FAF8F3">Aucun dispositif ne combine un contrefactuel propre et un horizon de plusieurs années.</text>
  </g>

  <line x1="64" y1="764" x2="1136" y2="764" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="786" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : documentation Meridian (paramètre adstock_decay_spec) pour les plages de max_lag ; Dekimpe &amp; Hanssens, Marketing Science 14(1), 1995, pour la modélisation de persistance. Les plages des</text>
  <text x="64" y="802" class="body" font-size="10.5" font-style="italic" fill="#8A8478">instruments 1 et 2 sont une lecture de l'auteur des pratiques courantes.</text>
</svg>
