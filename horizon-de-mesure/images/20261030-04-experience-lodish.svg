<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-label="Le protocole de l'expérience de 1995 : un an de surpression télévisée puis deux ans de suivi, et la condition découverte selon laquelle l'absence d'effet la première année n'est pas rattrapée ensuite">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
    <marker id="arr04r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B7332C"/>
    </marker>
  </defs>

  <rect width="1200" height="790" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">L'expérience qui a prolongé la fenêtre</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Cinquante-cinq tests en marché réel : un an de surpression, deux ans de suivi sans traitement.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- protocole -->
  <text x="64" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">LE PROTOCOLE</text>

  <g class="interactive" data-card="annee-traitement" tabindex="0" role="button" aria-label="L'année de traitement — cliquez pour les détails">
    <rect x="64" y="214" width="420" height="110" rx="3" fill="#1F5560" fill-opacity="0.11" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="214" width="5" height="110" fill="#1F5560"/>
    <text x="88" y="242" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">ANNÉE 1  ·  TRAITEMENT</text>
    <text x="88" y="272" class="display" font-size="20" font-weight="600" fill="#1F5560">Surpression télévisée</text>
    <text x="88" y="296" class="body" font-size="12.5" fill="#5A5A5A">Groupe test sous pression supérieure,</text>
    <text x="88" y="314" class="body" font-size="12.5" fill="#5A5A5A">groupe témoin apparié, panel de distribution.</text>
  </g>

  <line x1="492" y1="269" x2="552" y2="269" stroke="#5A5A5A" stroke-width="1.25" marker-end="url(#arr04)"/>

  <g class="interactive" data-card="suivi-deux-ans" tabindex="0" role="button" aria-label="Les deux années de suivi — cliquez pour les détails">
    <rect x="560" y="214" width="576" height="110" rx="3" fill="#B58A2C" fill-opacity="0.11" stroke="#B58A2C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="584" y="242" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">ANNÉES 2 ET 3  ·  SUIVI SANS TRAITEMENT</text>
    <text x="584" y="272" class="display" font-size="20" font-weight="600" fill="#8A6A1E">Les deux groupes restent observés</text>
    <text x="584" y="296" class="body" font-size="12.5" fill="#5A5A5A">La seule différence entre eux est désormais la surpression de l'année 1.</text>
    <text x="584" y="314" class="body" font-size="12.5" fill="#5A5A5A">C'est le seul dispositif publié qui tienne un contrefactuel aussi longtemps.</text>
  </g>

  <line x1="64" y1="356" x2="1136" y2="356" stroke="#E5E1D8" stroke-width="1"/>

  <!-- les deux branches -->
  <text x="64" y="392" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">CE QUE LE SUIVI A TROUVÉ, SELON L'EFFET DE LA PREMIÈRE ANNÉE</text>

  <!-- branche positive -->
  <rect x="64" y="412" width="500" height="150" rx="3" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.25"/>
  <text x="88" y="440" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">EFFET SIGNIFICATIF EN ANNÉE 1</text>
  <text x="88" y="472" class="display" font-size="21" font-weight="600" fill="#5A5A5A">Des effets persistants documentés</text>
  <text x="88" y="500" class="body" font-size="12.5" fill="#8A8478">Le corpus relève, dans ces cas, des prolongements</text>
  <text x="88" y="518" class="body" font-size="12.5" fill="#8A8478">de l'effet au-delà de l'année de traitement.</text>
  <text x="88" y="546" class="body" font-size="12.5" font-style="italic" fill="#8A8478">La branche qui autorise l'argument du long terme.</text>

  <!-- branche nulle -->
  <g class="interactive" data-card="branche-nulle" tabindex="0" role="button" aria-label="La branche de l'effet nul en première année — cliquez pour les détails">
    <rect x="596" y="412" width="540" height="150" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="596" y="412" width="5" height="150" fill="#B7332C"/>
    <text x="620" y="440" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">PAS D'EFFET SIGNIFICATIF EN ANNÉE 1</text>
    <text x="620" y="472" class="display" font-size="21" font-weight="600" fill="#B7332C">En moyenne, aucun effet</text>
    <text x="620" y="496" class="display" font-size="21" font-weight="600" fill="#B7332C">les deux années suivantes.</text>
    <line x1="620" y1="512" x2="1112" y2="512" stroke="#B7332C" stroke-width="0.75"/>
    <text x="620" y="534" class="body" font-size="12.5" fill="#5A5A5A">La défense « c'est du long terme » a été testée dans le seul dispositif</text>
    <text x="620" y="552" class="body" font-size="12.5" fill="#5A5A5A">construit pour la tester. Elle n'a pas tenu.</text>
  </g>

  <!-- portée -->
  <g class="interactive" data-card="portee-de-la-regle" tabindex="0" role="button" aria-label="La portée exacte de la règle, et ses limites — cliquez pour les détails">
    <rect x="64" y="594" width="1072" height="130" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
    <text x="88" y="622" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">PORTÉE EXACTE  ·  CE QUE LE RÉSULTAT NE DIT PAS</text>
    <text x="88" y="652" class="body" font-size="13" fill="#5A5A5A">Il ne dit pas que les effets longs n'existent pas : le même corpus en documente là où la première année en montrait.</text>
    <text x="88" y="672" class="body" font-size="13" fill="#5A5A5A">Il ne porte ni sur les médias numériques, absents du dispositif, ni sur les marques jeunes, l'échantillon étant fait de produits établis.</text>
    <text x="88" y="700" class="display" font-size="19" font-weight="600" fill="#1A1A1A">Il dit une chose : l'argument du long terme n'est pas disponible pour sauver une campagne plate.</text>
  </g>

  <line x1="64" y1="748" x2="1136" y2="748" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="770" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Source : Lodish, Abraham, Livelsberger, Lubetkin, Richardson &amp; Stevens, Marketing Science 14(3), 1995, p. G133-G140. Tests conduits entre 1982 et 1988 sur des produits de grande consommation établis.</text>
</svg>
