<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Un même résultat nul à l'écran, trois causes distinctes et trois décisions opposées : effet nul, effet trop petit pour l'échantillon, effet trop lent pour la fenêtre">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8A8478"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Trois nuls qu'on confond</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Un même résultat à l'écran, trois causes, trois décisions qui n'ont rien en commun.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- affichage commun -->
  <rect x="370" y="188" width="460" height="74" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
  <text x="600" y="214" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478" text-anchor="middle">CE QUE LE TABLEAU DE BORD AFFICHE</text>
  <text x="600" y="244" class="display" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle">« Pas d'effet détecté »</text>

  <line x1="248" y1="262" x2="248" y2="300" stroke="#8A8478" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="600" y1="262" x2="600" y2="300" stroke="#8A8478" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="952" y1="262" x2="952" y2="300" stroke="#8A8478" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="248" y1="282" x2="952" y2="282" stroke="#8A8478" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- colonne 1 : nul réel -->
  <g class="interactive" data-card="nul-reel" tabindex="0" role="button" aria-label="L'effet réellement nul — cliquez pour les détails">
    <rect x="64" y="308" width="336" height="268" rx="3" fill="#8A8478" fill-opacity="0.08" stroke="#8A8478" stroke-width="1.25"/>
    <rect x="64" y="308" width="5" height="268" fill="#8A8478"/>
    <text x="88" y="336" class="mono" font-size="11" letter-spacing="0.1em" fill="#5A5A5A">CAUSE 1</text>
    <text x="88" y="368" class="display" font-size="22" font-weight="600" fill="#1A1A1A">L'effet est nul</text>
    <line x1="88" y1="386" x2="376" y2="386" stroke="#8A8478" stroke-width="0.75"/>
    <text x="88" y="412" class="body" font-size="12.5" fill="#5A5A5A">Le levier ne produit pas</text>
    <text x="88" y="430" class="body" font-size="12.5" fill="#5A5A5A">ce qu'on en attendait.</text>
    <text x="88" y="466" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">DIAGNOSTIC</text>
    <text x="88" y="490" class="body" font-size="12.5" fill="#5A5A5A">Intervalle serré autour</text>
    <text x="88" y="508" class="body" font-size="12.5" fill="#5A5A5A">de zéro, fenêtre adéquate.</text>
    <text x="88" y="544" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A8478">DÉCISION</text>
    <text x="88" y="566" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Arrêter ou réaffecter</text>
  </g>

  <!-- colonne 2 : trop petit -->
  <g class="interactive" data-card="trop-petit" tabindex="0" role="button" aria-label="L'effet trop petit pour l'échantillon — cliquez pour les détails">
    <rect x="432" y="308" width="336" height="268" rx="3" fill="#B58A2C" fill-opacity="0.11" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="432" y="308" width="5" height="268" fill="#B58A2C"/>
    <text x="456" y="336" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">CAUSE 2  ·  PUISSANCE</text>
    <text x="456" y="368" class="display" font-size="22" font-weight="600" fill="#8A6A1E">Trop petit</text>
    <text x="456" y="390" class="display" font-size="22" font-weight="600" fill="#8A6A1E">pour l'échantillon</text>
    <line x1="456" y1="406" x2="744" y2="406" stroke="#B58A2C" stroke-width="0.75"/>
    <text x="456" y="430" class="body" font-size="12.5" fill="#5A5A5A">Sur de grandes expériences,</text>
    <text x="456" y="448" class="body" font-size="12.5" fill="#5A5A5A">l'intervalle médian dépasse</text>
    <text x="456" y="466" class="body" font-size="12.5" fill="#5A5A5A">cent points de pourcentage.</text>
    <text x="456" y="498" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">DIAGNOSTIC</text>
    <text x="456" y="520" class="body" font-size="12.5" fill="#5A5A5A">La largeur de l'intervalle.</text>
    <text x="456" y="544" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">DÉCISION</text>
    <text x="456" y="566" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Agrandir l'échantillon</text>
  </g>

  <!-- colonne 3 : trop lent -->
  <g class="interactive" data-card="trop-lent" tabindex="0" role="button" aria-label="L'effet trop lent pour la fenêtre — cliquez pour les détails">
    <rect x="800" y="308" width="336" height="268" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="800" y="308" width="5" height="268" fill="#B7332C"/>
    <text x="824" y="336" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">CAUSE 3  ·  HORIZON</text>
    <text x="824" y="368" class="display" font-size="22" font-weight="600" fill="#B7332C">Trop lent</text>
    <text x="824" y="390" class="display" font-size="22" font-weight="600" fill="#B7332C">pour la fenêtre</text>
    <line x1="824" y1="406" x2="1112" y2="406" stroke="#B7332C" stroke-width="0.75"/>
    <text x="824" y="430" class="body" font-size="12.5" fill="#5A5A5A">L'effet se déploie au-delà</text>
    <text x="824" y="448" class="body" font-size="12.5" fill="#5A5A5A">de la borne de l'instrument.</text>
    <text x="824" y="480" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">DIAGNOSTIC</text>
    <text x="824" y="502" class="body" font-size="12.5" fill="#5A5A5A">La configuration : demi-vie,</text>
    <text x="824" y="520" class="body" font-size="12.5" fill="#5A5A5A">max_lag, durée du test.</text>
    <text x="824" y="544" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">DÉCISION</text>
    <text x="824" y="566" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Allonger ou sortir du comparatif</text>
  </g>

  <!-- ordre du diagnostic -->
  <g class="interactive" data-card="decision-opposee" tabindex="0" role="button" aria-label="L'ordre de diagnostic et la question à poser avant de lire un résultat — cliquez pour les détails">
    <rect x="64" y="608" width="1072" height="116" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
    <text x="88" y="636" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">L'ORDRE QUI DÉPARTAGE</text>
    <text x="88" y="664" class="body" font-size="13" fill="#5A5A5A">1. Quelle est la largeur de l'intervalle ?  Large autour de zéro = manque d'information, non absence d'effet.</text>
    <text x="88" y="686" class="body" font-size="13" fill="#5A5A5A">2. Quelle est la fenêtre de l'instrument ?  Connue de l'équipe de mesure, absente de la restitution.</text>
    <text x="88" y="714" class="display" font-size="18" font-weight="600" fill="#1A1A1A">Sans ces deux réponses, un comité ne sait pas laquelle des trois situations il a sous les yeux.</text>
  </g>

  <line x1="64" y1="752" x2="1136" y2="752" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="774" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : Lewis &amp; Rao, Quarterly Journal of Economics 130(4), 2015, pour la borne de puissance ; documentation Meridian pour les paramètres de fenêtre. La taxinomie des trois causes est une</text>
  <text x="64" y="790" class="body" font-size="10.5" font-style="italic" fill="#8A8478">proposition de l'auteur.</text>
</svg>
