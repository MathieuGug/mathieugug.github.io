<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 774" role="img" aria-label="Une même campagne, deux bornes de lecture, deux chiffres de retour sur investissement : 1,87 livre à treize semaines, 4,11 livres à vingt-quatre mois">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>
  <defs>
    <marker id="arr01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="774" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Deux bornes, deux chiffres, une seule campagne</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Le même corpus de campagnes produit deux retours sur investissement selon l'endroit où l'on arrête de compter.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- axe de temps -->
  <text x="64" y="200" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">AXE DE TEMPS DEPUIS LA DIFFUSION</text>

  <!-- bande courte -->
  <g class="interactive" data-card="borne-courte" tabindex="0" role="button" aria-label="La borne courte, treize semaines — cliquez pour les détails">
    <rect x="64" y="226" width="248" height="118" rx="3" fill="#1F5560" fill-opacity="0.10" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="226" width="5" height="118" fill="#1F5560"/>
    <text x="88" y="256" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">0 À 13 SEMAINES</text>
    <text x="88" y="290" class="display" font-size="24" font-weight="600" fill="#1F5560">1,87 £</text>
    <text x="88" y="316" class="body" font-size="12.5" fill="#5A5A5A">de profit par livre investie.</text>
    <text x="88" y="334" class="body" font-size="12.5" fill="#5A5A5A">La fenêtre du tableau de bord.</text>
  </g>

  <!-- bande soutenue -->
  <g class="interactive" data-card="zone-soutenue" tabindex="0" role="button" aria-label="La zone soutenue, de la quatorzième semaine au vingt-quatrième mois — cliquez pour les détails">
    <rect x="320" y="226" width="520" height="118" rx="3" fill="#B7332C" fill-opacity="0.10" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="344" y="256" class="mono" font-size="11" letter-spacing="0.1em" fill="#B7332C">SEMAINE 14 → MOIS 24</text>
    <text x="344" y="290" class="display" font-size="20" font-weight="600" fill="#B7332C">La part que personne ne regarde</text>
    <text x="344" y="316" class="body" font-size="12.5" fill="#5A5A5A">Aucun instrument de l'organisation n'observe cette zone en continu.</text>
    <text x="344" y="334" class="body" font-size="12.5" fill="#5A5A5A">Elle n'apparaît que dans une étude commandée, une fois, après coup.</text>
  </g>

  <!-- total -->
  <rect x="848" y="226" width="288" height="118" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
  <text x="872" y="256" class="mono" font-size="11" letter-spacing="0.1em" fill="#1A1A1A">0 À 24 MOIS</text>
  <text x="872" y="290" class="display" font-size="24" font-weight="600" fill="#1A1A1A">4,11 £</text>
  <text x="872" y="316" class="body" font-size="12.5" fill="#5A5A5A">de profit par livre investie,</text>
  <text x="872" y="334" class="body" font-size="12.5" fill="#5A5A5A">sur le même corpus.</text>

  <!-- règle graduée -->
  <line x1="64" y1="382" x2="1136" y2="382" stroke="#1A1A1A" stroke-width="1.25" marker-end="url(#arr01)"/>
  <line x1="64" y1="376" x2="64" y2="394" stroke="#1A1A1A" stroke-width="1.25"/>
  <line x1="316" y1="376" x2="316" y2="402" stroke="#1F5560" stroke-width="2.5"/>
  <line x1="844" y1="376" x2="844" y2="402" stroke="#B7332C" stroke-width="2.5"/>
  <text x="64" y="416" class="mono" font-size="11" fill="#8A8478">diffusion</text>
  <text x="316" y="416" class="mono" font-size="11" fill="#1F5560" text-anchor="middle">S13</text>
  <text x="844" y="416" class="mono" font-size="11" fill="#B7332C" text-anchor="middle">M24</text>
  <text x="1136" y="416" class="mono" font-size="11" fill="#8A8478" text-anchor="end">au-delà : rien</text>

  <!-- part après 13 semaines -->
  <g class="interactive" data-card="part-apres-13-semaines" tabindex="0" role="button" aria-label="La part du profit produite après la treizième semaine — cliquez pour les détails">
    <rect x="64" y="456" width="520" height="150" rx="3" fill="#B58A2C" fill-opacity="0.11" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="64" y="456" width="5" height="150" fill="#B58A2C"/>
    <text x="88" y="486" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">LA PROPORTION QUI CHANGE LA LECTURE</text>
    <text x="88" y="524" class="display" font-size="34" font-weight="600" fill="#8A6A1E">58 %</text>
    <text x="178" y="524" class="display" font-size="19" font-weight="600" fill="#1A1A1A">du profit total attribué</text>
    <text x="178" y="548" class="display" font-size="19" font-weight="600" fill="#1A1A1A">arrive après la semaine 13.</text>
    <text x="88" y="580" class="body" font-size="12.5" fill="#5A5A5A">Un comité qui lit un tableau arrêté au trimestre regarde donc, dans ce corpus,</text>
    <text x="88" y="598" class="body" font-size="12.5" fill="#5A5A5A">un peu moins de la moitié du phénomène qu'il croit arbitrer.</text>
  </g>

  <!-- ce qui a bougé -->
  <g class="interactive" data-card="ce-qui-a-bouge" tabindex="0" role="button" aria-label="La seule variable qui a changé entre les deux chiffres — cliquez pour les détails">
    <rect x="616" y="456" width="520" height="150" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
    <text x="640" y="486" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CE QUI A BOUGÉ ENTRE LES DEUX CHIFFRES</text>
    <text x="640" y="518" class="body" font-size="13.5" fill="#5A5A5A">Ni le média.</text>
    <text x="640" y="540" class="body" font-size="13.5" fill="#5A5A5A">Ni le modèle économétrique.</text>
    <text x="640" y="562" class="body" font-size="13.5" fill="#5A5A5A">Ni le périmètre d'annonceurs.</text>
    <text x="640" y="592" class="display" font-size="19" font-weight="600" fill="#1A1A1A">La borne de lecture, et elle seule.</text>
  </g>

  <!-- bandeau règle -->
  <rect x="64" y="632" width="1072" height="62" rx="3" fill="#1A1A1A"/>
  <text x="88" y="658" class="mono" font-size="11" letter-spacing="0.1em" fill="#B8B5AE">LA RÈGLE QUI EN DÉCOULE</text>
  <text x="88" y="682" class="display" font-size="19" font-weight="600" fill="#FAF8F3">Un retour sur investissement sans borne de temps déclarée n'est pas une grandeur comparable.</text>

  <line x1="64" y1="722" x2="1136" y2="722" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="744" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Source : Thinkbox, « Profit Ability 2 » (2024), étude d'origine professionnelle commanditée par un organisme de promotion d'un média. Les chiffres illustrent ici une propriété formelle de la borne,</text>
  <text x="64" y="760" class="body" font-size="10.5" font-style="italic" fill="#8A8478">non un niveau d'efficacité.</text>
</svg>
