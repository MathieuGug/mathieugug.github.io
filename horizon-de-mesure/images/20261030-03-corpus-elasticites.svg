<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="L'échelle des élasticités publicitaires publiées, de 0,41 en 1984 à moins de 0,02 après correction du biais de publication en 2025">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="780" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">La grandeur qui a reculé trois fois</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Chaque amélioration méthodologique de la méta-analyse a abaissé l'élasticité publicitaire moyenne.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- axe barres -->
  <text x="64" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">ÉLASTICITÉ MOYENNE RAPPORTÉE  ·  ÉCHELLE COMMUNE 0 → 0,45</text>
  <line x1="300" y1="212" x2="1104" y2="212" stroke="#B8B5AE" stroke-width="0.5"/>
  <g class="mono" font-size="10.5" fill="#8A8478">
    <text x="300" y="206">0</text>
    <text x="478" y="206" text-anchor="middle">0,10</text>
    <text x="657" y="206" text-anchor="middle">0,20</text>
    <text x="836" y="206" text-anchor="middle">0,30</text>
    <text x="1015" y="206" text-anchor="middle">0,40</text>
  </g>

  <!-- 1984 -->
  <text x="64" y="252" class="display" font-size="15" font-weight="600" fill="#8A8478">1984 · long terme</text>
  <text x="64" y="270" class="body" font-size="11.5" fill="#B8B5AE">méta-analyse antérieure</text>
  <rect x="300" y="234" width="734" height="30" rx="3" fill="#B8B5AE" fill-opacity="0.38" stroke="#B8B5AE" stroke-width="1.25"/>
  <text x="1048" y="254" class="mono" font-size="14" fill="#8A8478">0,41</text>

  <!-- 2011 long -->
  <g class="interactive" data-card="elasticite-longue" tabindex="0" role="button" aria-label="L'élasticité de long terme de 2011 — cliquez pour les détails">
    <text x="64" y="316" class="display" font-size="15" font-weight="600" fill="#1A1A1A">2011 · long terme</text>
    <text x="64" y="334" class="body" font-size="11.5" fill="#8A8478">402 estimations</text>
    <rect x="300" y="298" width="430" height="30" rx="3" fill="#B7332C" fill-opacity="0.30" stroke="#B7332C" stroke-width="2.5"/>
    <text x="744" y="318" class="mono" font-size="14" fill="#B7332C">0,24</text>
  </g>

  <!-- 2011 court -->
  <g class="interactive" data-card="elasticite-courte" tabindex="0" role="button" aria-label="L'élasticité de court terme de 2011 — cliquez pour les détails">
    <text x="64" y="380" class="display" font-size="15" font-weight="600" fill="#1A1A1A">2011 · court terme</text>
    <text x="64" y="398" class="body" font-size="11.5" fill="#8A8478">751 estimations</text>
    <rect x="300" y="362" width="215" height="30" rx="3" fill="#1F5560" fill-opacity="0.30" stroke="#1F5560" stroke-width="2.5"/>
    <text x="529" y="382" class="mono" font-size="14" fill="#1F5560">0,12</text>
  </g>

  <!-- 2025 rapporté -->
  <text x="64" y="444" class="display" font-size="15" font-weight="600" fill="#1A1A1A">2025 · moyenne rapportée</text>
  <text x="64" y="462" class="body" font-size="11.5" fill="#8A8478">538 élasticités</text>
  <rect x="300" y="426" width="161" height="30" rx="3" fill="#1F5560" fill-opacity="0.22" stroke="#1F5560" stroke-width="1.25"/>
  <text x="475" y="446" class="mono" font-size="14" fill="#1F5560">≈ 0,09</text>

  <!-- 2025 corrigé -->
  <g class="interactive" data-card="correction-biais" tabindex="0" role="button" aria-label="L'élasticité après correction du biais de sélection de publication — cliquez pour les détails">
    <text x="64" y="508" class="display" font-size="15" font-weight="600" fill="#B7332C">2025 · après correction</text>
    <text x="64" y="526" class="body" font-size="11.5" fill="#B7332C">biais de publication retiré</text>
    <rect x="300" y="490" width="36" height="30" rx="3" fill="#B7332C" stroke="#B7332C" stroke-width="2.5"/>
    <text x="350" y="510" class="mono" font-size="14" fill="#B7332C">&lt; 0,02</text>
    <text x="430" y="510" class="body" font-size="12.5" fill="#5A5A5A">Les estimations antérieures sont gonflées par la sélection des résultats publiés.</text>
  </g>

  <line x1="300" y1="548" x2="1104" y2="548" stroke="#E5E1D8" stroke-width="1"/>

  <!-- part non significative -->
  <g class="interactive" data-card="part-non-significative" tabindex="0" role="button" aria-label="La part des élasticités non significativement supérieures à zéro — cliquez pour les détails">
    <rect x="64" y="578" width="520" height="122" rx="3" fill="#B58A2C" fill-opacity="0.11" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="64" y="578" width="5" height="122" fill="#B58A2C"/>
    <text x="88" y="606" class="mono" font-size="11" letter-spacing="0.1em" fill="#8A6A1E">LE DÉTAIL QU'ON NE REPREND JAMAIS</text>
    <text x="88" y="644" class="display" font-size="30" font-weight="600" fill="#8A6A1E">53 %</text>
    <text x="172" y="644" class="display" font-size="17" font-weight="600" fill="#1A1A1A">des élasticités recensées</text>
    <text x="172" y="666" class="display" font-size="17" font-weight="600" fill="#1A1A1A">sont significatives.</text>
    <text x="88" y="690" class="body" font-size="12.5" fill="#5A5A5A">Dans près d'une étude sur deux, l'effet mesuré n'est pas distinguable du bruit.</text>
  </g>

  <!-- le multiplicateur -->
  <g class="interactive" data-card="multiplicateur" tabindex="0" role="button" aria-label="Le multiplicateur par deux hérité de 2011 — cliquez pour les détails">
    <rect x="616" y="578" width="520" height="122" rx="3" fill="#1F5560" fill-opacity="0.07" stroke="#1F5560" stroke-width="1.25"/>
    <text x="640" y="606" class="mono" font-size="11" letter-spacing="0.1em" fill="#1F5560">CE QUI CIRCULE EN COMITÉ</text>
    <text x="640" y="638" class="display" font-size="19" font-weight="600" fill="#1A1A1A">« L'effet total vaut le double</text>
    <text x="640" y="660" class="display" font-size="19" font-weight="600" fill="#1A1A1A">de l'effet observé. »</text>
    <text x="640" y="686" class="body" font-size="12.5" fill="#5A5A5A">Le ratio 0,24 / 0,12 devenu règle de place, et la partie du corpus la moins stable.</text>
  </g>

  <line x1="64" y1="736" x2="1136" y2="736" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="758" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Sources : Sethuraman, Tellis &amp; Briesch, Journal of Marketing Research, 2011 (dont la moyenne de 1984 citée en comparaison) ; Korkames, Stanley &amp; Stremersch, International Journal of Research in Marketing 43(1), 2025. Les versions de travail et publiée de ce dernier diffèrent sur certaines valeurs.</text>
</svg>
