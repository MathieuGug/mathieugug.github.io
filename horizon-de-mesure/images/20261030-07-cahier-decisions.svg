<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Les quatre décisions de gouvernance de l'horizon de mesure, avec pour chacune le document où elle s'inscrit, son coût et la question qu'elle rend opposable">
  <style>
    .display { font-family: 'Fraunces', 'Spectral', Georgia, serif; }
    .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    .interactive { cursor: pointer; }
  </style>

  <rect width="1200" height="840" fill="#FAF8F3"/>

  <text x="64" y="62" class="mono" font-size="13" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="64" y="102" class="display" font-size="28" font-weight="600" fill="#1A1A1A">Les quatre décisions</text>
  <text x="64" y="132" class="display" font-size="18" font-style="italic" fill="#5A5A5A">Aucune n'est technique. Trois ne coûtent rien. Chacune s'inscrit dans un document qui existe déjà.</text>
  <line x1="64" y1="158" x2="1136" y2="158" stroke="#E5E1D8" stroke-width="1"/>

  <!-- en-têtes colonnes -->
  <text x="64" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">DÉCISION</text>
  <text x="560" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">OÙ ELLE S'INSCRIT</text>
  <text x="824" y="196" class="mono" font-size="11" letter-spacing="0.09em" fill="#8A8478">CE QU'ELLE REND OPPOSABLE</text>
  <line x1="64" y1="208" x2="1136" y2="208" stroke="#B8B5AE" stroke-width="0.5"/>

  <!-- D1 -->
  <g class="interactive" data-card="d1-horizon" tabindex="0" role="button" aria-label="Décision 1, déclarer l'horizon de décision — cliquez pour les détails">
    <rect x="64" y="222" width="1072" height="136" rx="3" fill="#1F5560" fill-opacity="0.09" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="222" width="5" height="136" fill="#1F5560"/>
    <text x="88" y="250" class="mono" font-size="12" letter-spacing="0.1em" fill="#1F5560">D1  ·  COÛT NUL</text>
    <text x="88" y="282" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Déclarer l'horizon</text>
    <text x="88" y="304" class="display" font-size="21" font-weight="600" fill="#1A1A1A">avant la mesure</text>
    <text x="88" y="334" class="body" font-size="12.5" fill="#5A5A5A">Un engagement sur la borne de lecture, pris</text>
    <text x="88" y="350" class="body" font-size="12.5" fill="#5A5A5A">avant de connaître le résultat.</text>
    <text x="560" y="282" class="body" font-size="13" font-weight="600" fill="#1F5560">Plan de mesure annuel,</text>
    <text x="560" y="300" class="body" font-size="13" font-weight="600" fill="#1F5560">première ligne</text>
    <text x="560" y="328" class="body" font-size="12" fill="#5A5A5A">Une phrase, pas une annexe.</text>
    <text x="824" y="282" class="body" font-size="12.5" fill="#5A5A5A">L'interdiction de choisir après coup</text>
    <text x="824" y="300" class="body" font-size="12.5" fill="#5A5A5A">la borne qui arrange la conclusion.</text>
    <text x="824" y="328" class="body" font-size="12.5" fill="#5A5A5A">Et la comparabilité de chiffres</text>
    <text x="824" y="346" class="body" font-size="12.5" fill="#5A5A5A">qui ne l'étaient pas.</text>
  </g>

  <!-- D2 -->
  <g class="interactive" data-card="d2-remanence" tabindex="0" role="button" aria-label="Décision 2, déclarer et défendre le paramètre de rémanence — cliquez pour les détails">
    <rect x="64" y="372" width="1072" height="136" rx="3" fill="#1F5560" fill-opacity="0.09" stroke="#1F5560" stroke-width="1.5"/>
    <rect x="64" y="372" width="5" height="136" fill="#1F5560"/>
    <text x="88" y="400" class="mono" font-size="12" letter-spacing="0.1em" fill="#1F5560">D2  ·  COÛT NUL</text>
    <text x="88" y="432" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Déclarer et défendre</text>
    <text x="88" y="454" class="display" font-size="21" font-weight="600" fill="#1A1A1A">la rémanence</text>
    <text x="88" y="484" class="body" font-size="12.5" fill="#5A5A5A">Forme de courbe, max_lag, prior : trois</text>
    <text x="88" y="500" class="body" font-size="12.5" fill="#5A5A5A">réglages qui relèvent de l'arbitrage.</text>
    <text x="560" y="432" class="body" font-size="13" font-weight="600" fill="#1F5560">Support de restitution</text>
    <text x="560" y="450" class="body" font-size="13" font-weight="600" fill="#1F5560">du modèle de mix</text>
    <text x="560" y="478" class="body" font-size="12" fill="#5A5A5A">Sur la page du résultat,</text>
    <text x="560" y="494" class="body" font-size="12" fill="#5A5A5A">pas en annexe technique.</text>
    <text x="824" y="432" class="body" font-size="12.5" fill="#5A5A5A">La publication d'un second jeu de</text>
    <text x="824" y="450" class="body" font-size="12.5" fill="#5A5A5A">résultats sous réglage alternatif,</text>
    <text x="824" y="468" class="body" font-size="12.5" fill="#5A5A5A">pour que l'écart soit discuté</text>
    <text x="824" y="486" class="body" font-size="12.5" fill="#5A5A5A">au lieu d'être tranché en silence.</text>
  </g>

  <!-- D3 -->
  <g class="interactive" data-card="d3-zone-temoin" tabindex="0" role="button" aria-label="Décision 3, financer une fenêtre longue — cliquez pour les détails">
    <rect x="64" y="522" width="1072" height="136" rx="3" fill="#B7332C" fill-opacity="0.11" stroke="#B7332C" stroke-width="2.5"/>
    <rect x="64" y="522" width="5" height="136" fill="#B7332C"/>
    <text x="88" y="550" class="mono" font-size="12" letter-spacing="0.1em" fill="#B7332C">D3  ·  LA SEULE QUI COÛTE</text>
    <text x="88" y="582" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Financer une fenêtre</text>
    <text x="88" y="604" class="display" font-size="21" font-weight="600" fill="#1A1A1A">longue, une fois</text>
    <text x="88" y="634" class="body" font-size="12.5" fill="#5A5A5A">Une zone témoin maintenue douze mois,</text>
    <text x="88" y="650" class="body" font-size="12.5" fill="#5A5A5A">budget sacrifié inscrit en clair.</text>
    <text x="560" y="582" class="body" font-size="13" font-weight="600" fill="#B7332C">Budget média,</text>
    <text x="560" y="600" class="body" font-size="13" font-weight="600" fill="#B7332C">ligne dédiée</text>
    <text x="560" y="628" class="body" font-size="12" fill="#5A5A5A">Dimensionnement par la</text>
    <text x="560" y="644" class="body" font-size="12" fill="#5A5A5A">puissance, non par l'horizon.</text>
    <text x="824" y="582" class="body" font-size="12.5" fill="#5A5A5A">La seule décision de la liste qui</text>
    <text x="824" y="600" class="body" font-size="12.5" fill="#5A5A5A">produise une mesure plutôt qu'un</text>
    <text x="824" y="618" class="body" font-size="12.5" fill="#5A5A5A">réglage. Une zone trop petite tenue</text>
    <text x="824" y="636" class="body" font-size="12.5" fill="#5A5A5A">un an dépense le budget pour rien.</text>
  </g>

  <!-- D4 -->
  <g class="interactive" data-card="d4-hors-arbitrage" tabindex="0" role="button" aria-label="Décision 4, ouvrir une ligne hors arbitrage — cliquez pour les détails">
    <rect x="64" y="672" width="1072" height="136" rx="3" fill="#B58A2C" fill-opacity="0.11" stroke="#B58A2C" stroke-width="1.5"/>
    <rect x="64" y="672" width="5" height="136" fill="#B58A2C"/>
    <text x="88" y="700" class="mono" font-size="12" letter-spacing="0.1em" fill="#8A6A1E">D4  ·  COÛT NUL</text>
    <text x="88" y="732" class="display" font-size="21" font-weight="600" fill="#1A1A1A">Ouvrir une ligne</text>
    <text x="88" y="754" class="display" font-size="21" font-weight="600" fill="#1A1A1A">« hors arbitrage »</text>
    <text x="88" y="784" class="body" font-size="12.5" fill="#5A5A5A">La part de budget soustraite au comparatif,</text>
    <text x="88" y="800" class="body" font-size="12.5" fill="#5A5A5A">parce que les instruments ne la jugent pas.</text>
    <text x="560" y="732" class="body" font-size="13" font-weight="600" fill="#8A6A1E">Document d'allocation</text>
    <text x="560" y="750" class="body" font-size="13" font-weight="600" fill="#8A6A1E">budgétaire</text>
    <text x="560" y="778" class="body" font-size="12" fill="#5A5A5A">Trois mentions : montant,</text>
    <text x="560" y="794" class="body" font-size="12" fill="#5A5A5A">motif, date de réexamen.</text>
    <text x="824" y="732" class="body" font-size="12.5" fill="#5A5A5A">Le bornage de l'argument non</text>
    <text x="824" y="750" class="body" font-size="12.5" fill="#5A5A5A">mesurable, qui cesse de pouvoir</text>
    <text x="824" y="768" class="body" font-size="12.5" fill="#5A5A5A">s'étendre à toute ligne dont</text>
    <text x="824" y="786" class="body" font-size="12.5" fill="#5A5A5A">le résultat déplaît.</text>
  </g>

  <line x1="64" y1="818" x2="1136" y2="818" stroke="#E5E1D8" stroke-width="1"/>
  <text x="64" y="834" class="body" font-size="10.5" font-style="italic" fill="#8A8478">Proposition de l'auteur. Aucun référentiel existant ne porte ces quatre décisions ; les ancrages sont la documentation Meridian pour D2 et Lewis &amp; Rao (2015) pour le dimensionnement de D3.</text>
</svg>
