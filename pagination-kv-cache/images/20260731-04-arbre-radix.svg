<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <defs>
    <style>
      .display { font-family: 'Spectral', 'Playfair Display', Georgia, serif; }
      .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
      .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    </style>
    <marker id="arrow04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="900" height="900" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="56" y="52" class="mono" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 04</text>
  <text x="56" y="88" class="display" font-size="25" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">L'arbre radix : partager entre toutes les requêtes</text>
  <text x="56" y="114" class="display" font-size="15" font-style="italic" fill="#5A5A5A">Le KV-cache conservé et indexé — un préfixe partagé n'est stocké qu'une fois, l'éviction LRU frappe les feuilles</text>
  <line x1="56" y1="136" x2="844" y2="136" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- edges first (behind nodes) -->
  <line x1="450" y1="210" x2="270" y2="330" stroke="#1F5560" stroke-width="2.5"/>
  <line x1="450" y1="210" x2="630" y2="330" stroke="#1F5560" stroke-width="2.5"/>
  <line x1="270" y1="380" x2="180" y2="500" stroke="#5A5A5A" stroke-width="1.5"/>
  <line x1="270" y1="380" x2="360" y2="500" stroke="#5A5A5A" stroke-width="1.5"/>
  <line x1="630" y1="380" x2="630" y2="500" stroke="#5A5A5A" stroke-width="1.5"/>
  <line x1="180" y1="548" x2="140" y2="650" stroke="#B8B5AE" stroke-width="1.25"/>
  <line x1="180" y1="548" x2="240" y2="650" stroke="#B8B5AE" stroke-width="1.25"/>
  <line x1="360" y1="548" x2="360" y2="650" stroke="#B8B5AE" stroke-width="1.25"/>
  <line x1="630" y1="548" x2="630" y2="650" stroke="#B8B5AE" stroke-width="1.25"/>

  <!-- ROOT -->
  <g class="interactive" data-card="root-prefix" tabindex="0" role="button" aria-label="Racine, préfixe système partagé">
    <rect x="330" y="170" width="240" height="44" rx="4" fill="#1F5560"/>
    <text x="450" y="190" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle">RACINE · prompt système</text>
    <text x="450" y="206" class="mono" font-size="9.5" fill="#FAF8F3" text-anchor="middle">« Tu es un assistant… » — partagé par tous</text>
  </g>

  <!-- level 1 : shared branches -->
  <g class="interactive" data-card="shared-branch" tabindex="0" role="button" aria-label="Branche partagée, contexte commun">
    <rect x="160" y="336" width="220" height="44" rx="4" fill="#1F5560" fill-opacity="0.55"/>
    <text x="270" y="356" class="mono" font-size="10.5" fill="#FAF8F3" text-anchor="middle">contexte A — document X</text>
    <text x="270" y="372" class="mono" font-size="9.5" fill="#FAF8F3" text-anchor="middle">interrogé par 5 utilisateurs</text>
    <rect x="520" y="336" width="220" height="44" rx="4" fill="#1F5560" fill-opacity="0.55"/>
    <text x="630" y="356" class="mono" font-size="10.5" fill="#FAF8F3" text-anchor="middle">exemples few-shot</text>
    <text x="630" y="372" class="mono" font-size="9.5" fill="#FAF8F3" text-anchor="middle">réutilisés à chaque appel</text>
  </g>

  <!-- level 2 : intermediate -->
  <rect x="90" y="502" width="180" height="42" rx="4" fill="#B8B5AE" fill-opacity="0.3" stroke="#5A5A5A" stroke-width="1"/>
  <text x="180" y="528" class="mono" font-size="10" fill="#1A1A1A" text-anchor="middle">tour 1 · question U1</text>
  <rect x="280" y="502" width="160" height="42" rx="4" fill="#B8B5AE" fill-opacity="0.3" stroke="#5A5A5A" stroke-width="1"/>
  <text x="360" y="528" class="mono" font-size="10" fill="#1A1A1A" text-anchor="middle">tour 1 · question U2</text>
  <rect x="540" y="502" width="180" height="42" rx="4" fill="#B8B5AE" fill-opacity="0.3" stroke="#5A5A5A" stroke-width="1"/>
  <text x="630" y="528" class="mono" font-size="10" fill="#1A1A1A" text-anchor="middle">requête few-shot n</text>

  <!-- level 3 : leaves -->
  <g class="interactive" data-card="leaf-eviction" tabindex="0" role="button" aria-label="Feuilles, éviction LRU">
    <rect x="90" y="652" width="100" height="40" rx="4" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="140" y="676" class="mono" font-size="9.5" fill="#B7332C" text-anchor="middle">feuille · LRU</text>
    <rect x="200" y="652" width="90" height="40" rx="4" fill="#FAF8F3" stroke="#B8B5AE" stroke-width="1"/>
    <text x="245" y="676" class="mono" font-size="9.5" fill="#5A5A5A" text-anchor="middle">génér.</text>
    <rect x="315" y="652" width="90" height="40" rx="4" fill="#FAF8F3" stroke="#B8B5AE" stroke-width="1"/>
    <text x="360" y="676" class="mono" font-size="9.5" fill="#5A5A5A" text-anchor="middle">génér.</text>
    <rect x="585" y="652" width="90" height="40" rx="4" fill="#FAF8F3" stroke="#B8B5AE" stroke-width="1"/>
    <text x="630" y="676" class="mono" font-size="9.5" fill="#5A5A5A" text-anchor="middle">génér.</text>
  </g>

  <!-- LRU eviction annotation -->
  <circle cx="140" cy="730" r="9" fill="#B7332C"/><text x="140" y="734" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">1</text>
  <line x1="140" y1="694" x2="140" y2="721" stroke="#B7332C" stroke-width="0.9" marker-end="url(#arrow04)"/>
  <text x="160" y="734" class="body" font-size="11.5" fill="#1A1A1A">On évince d'abord la feuille la moins récemment utilisée — jamais un ancêtre encore partagé.</text>
  <text x="160" y="752" class="body" font-size="11.5" fill="#5A5A5A">Un ancêtre ne devient évinçable que lorsqu'il est lui-même devenu une feuille.</text>

  <!-- cache-aware scheduling -->
  <g class="interactive" data-card="cache-aware-sched" tabindex="0" role="button" aria-label="Ordonnancement conscient du cache">
    <rect x="640" y="404" width="204" height="86" rx="3" fill="#B58A2C" fill-opacity="0.08" stroke="#B58A2C" stroke-width="1.25"/>
    <text x="656" y="428" class="mono" font-size="9.5" font-weight="600" letter-spacing="0.08em" fill="#B58A2C">CACHE-AWARE SCHEDULING</text>
    <text x="656" y="450" class="body" font-size="10.5" fill="#1A1A1A">Le scheduler priorise les requêtes</text>
    <text x="656" y="466" class="body" font-size="10.5" fill="#1A1A1A">qui partagent le plus de préfixe</text>
    <text x="656" y="482" class="body" font-size="10.5" fill="#1A1A1A">avec le cache — max. de réutilisation.</text>
  </g>

  <!-- verdict -->
  <rect x="56" y="784" width="788" height="60" rx="3" fill="#B7332C" fill-opacity="0.05" stroke="#B7332C" stroke-width="1.5"/>
  <text x="80" y="822" class="mono" font-size="26" font-weight="600" fill="#B7332C">×5</text>
  <text x="150" y="810" class="body" font-size="12.5" fill="#1A1A1A">jusqu'à ×5 (voire 6,4 sur programmes structurés) de débit sur les charges à fort partage :</text>
  <text x="150" y="830" class="body" font-size="12.5" fill="#1A1A1A">dialogues multi-tours, few-shot répétés, arbres de pensée. Compatible pagination + batching continu.</text>

  <!-- FOOTER -->
  <text x="56" y="872" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Source : Zheng et al., SGLang / RadixAttention (NeurIPS 2024) ; blog LMSYS (janv. 2024).</text>
</svg>
