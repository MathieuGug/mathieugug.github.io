<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .display { font-family: 'Spectral', 'Playfair Display', Georgia, serif; }
      .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
      .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    </style>
    <marker id="arrow03b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="55" class="mono" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 03</text>
  <text x="60" y="92" class="display" font-size="26" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">Copie-sur-écriture : partager le prompt jusqu'à la divergence</text>
  <text x="60" y="118" class="display" font-size="16" font-style="italic" fill="#5A5A5A">Un prompt, k sorties échantillonnées — un compteur de références duplique le bloc au moment précis d'une écriture</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- three time columns -->
  <text x="230" y="176" class="mono" font-size="11" font-weight="600" letter-spacing="0.1em" fill="#5A5A5A" text-anchor="middle">t₀ — lecture partagée</text>
  <text x="600" y="176" class="mono" font-size="11" font-weight="600" letter-spacing="0.1em" fill="#B7332C" text-anchor="middle">t₁ — une branche écrit</text>
  <text x="970" y="176" class="mono" font-size="11" font-weight="600" letter-spacing="0.1em" fill="#5A5A5A" text-anchor="middle">t₂ — copie privée</text>
  <line x1="415" y1="190" x2="415" y2="600" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="785" y1="190" x2="785" y2="600" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- t0: shared -->
  <g class="interactive" data-card="shared-prompt" tabindex="0" role="button" aria-label="Prompt partagé par k branches">
    <rect x="70" y="210" width="140" height="40" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.25"/><text x="140" y="235" class="mono" font-size="10.5" fill="#1F5560" text-anchor="middle">branche A · L0→P7</text>
    <rect x="70" y="272" width="140" height="40" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.25"/><text x="140" y="297" class="mono" font-size="10.5" fill="#1F5560" text-anchor="middle">branche B · L0→P7</text>
    <rect x="70" y="334" width="140" height="40" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.25"/><text x="140" y="359" class="mono" font-size="10.5" fill="#1F5560" text-anchor="middle">branche C · L0→P7</text>
  </g>
  <g class="interactive" data-card="ref-count" tabindex="0" role="button" aria-label="Compteur de références">
    <rect x="270" y="262" width="120" height="60" rx="3" fill="#1F5560"/><text x="330" y="288" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle">P7 · prompt</text><text x="330" y="308" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">refcount = 3</text>
  </g>
  <line x1="210" y1="230" x2="268" y2="282" stroke="#1F5560" stroke-width="1.1" marker-end="url(#arrow03b)"/>
  <line x1="210" y1="292" x2="268" y2="292" stroke="#1F5560" stroke-width="1.1" marker-end="url(#arrow03b)"/>
  <line x1="210" y1="354" x2="268" y2="302" stroke="#1F5560" stroke-width="1.1" marker-end="url(#arrow03b)"/>
  <text x="230" y="410" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">un seul exemplaire du prompt</text>
  <text x="230" y="428" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">pour les k branches</text>

  <!-- t1: write event -->
  <g class="interactive" data-card="fork-point" tabindex="0" role="button" aria-label="Point de divergence, détection refcount supérieur à 1">
    <rect x="460" y="262" width="120" height="60" rx="3" fill="#1F5560"/><text x="520" y="288" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle">P7 · prompt</text><text x="520" y="308" class="mono" font-size="12" font-weight="600" fill="#FAF8F3" text-anchor="middle">refcount = 3</text>
    <rect x="620" y="272" width="130" height="40" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5"/><text x="685" y="297" class="mono" font-size="10.5" fill="#B7332C" text-anchor="middle">B veut écrire</text>
    <line x1="618" y1="292" x2="582" y2="292" stroke="#B7332C" stroke-width="1.5" marker-end="url(#arrow03b)"/>
  </g>
  <text x="600" y="372" class="body" font-size="12" fill="#1A1A1A" text-anchor="middle">refcount &gt; 1 détecté</text>
  <text x="600" y="392" class="body" font-size="12" font-weight="600" fill="#B7332C" text-anchor="middle">→ ne pas écrire en place</text>
  <text x="600" y="426" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">l'écriture déclenche la copie,</text>
  <text x="600" y="444" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">jamais la lecture</text>

  <!-- t2: forked -->
  <g class="interactive" data-card="cow-copy" tabindex="0" role="button" aria-label="Bloc copié, tables mises à jour">
    <rect x="830" y="222" width="120" height="52" rx="3" fill="#1F5560"/><text x="890" y="244" class="mono" font-size="10.5" fill="#FAF8F3" text-anchor="middle">P7 · A & C</text><text x="890" y="262" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">refcount = 2</text>
    <rect x="830" y="308" width="120" height="52" rx="3" fill="#B7332C"/><text x="890" y="330" class="mono" font-size="10.5" fill="#FAF8F3" text-anchor="middle">P11 copié · B</text><text x="890" y="348" class="mono" font-size="11" font-weight="600" fill="#FAF8F3" text-anchor="middle">refcount = 1</text>
    <rect x="990" y="210" width="150" height="36" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.1"/><text x="1065" y="233" class="mono" font-size="10" fill="#1F5560" text-anchor="middle">A · L0→P7</text>
    <rect x="990" y="286" width="150" height="36" rx="3" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.25"/><text x="1065" y="309" class="mono" font-size="10" fill="#B7332C" text-anchor="middle">B · L0→P11</text>
    <rect x="990" y="330" width="150" height="36" rx="3" fill="#FAF8F3" stroke="#1F5560" stroke-width="1.1"/><text x="1065" y="353" class="mono" font-size="10" fill="#1F5560" text-anchor="middle">C · L0→P7</text>
    <line x1="950" y1="240" x2="988" y2="228" stroke="#1F5560" stroke-width="1" marker-end="url(#arrow03b)"/>
    <line x1="950" y1="334" x2="988" y2="304" stroke="#B7332C" stroke-width="1" marker-end="url(#arrow03b)"/>
    <line x1="950" y1="340" x2="988" y2="348" stroke="#1F5560" stroke-width="1" marker-end="url(#arrow03b)"/>
  </g>
  <text x="970" y="410" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">seule B a sa copie privée ;</text>
  <text x="970" y="428" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">A et C partagent toujours P7</text>

  <!-- verdict -->
  <rect x="60" y="490" width="1080" height="118" rx="3" fill="#B58A2C" fill-opacity="0.07" stroke="#B58A2C" stroke-width="1.5"/>
  <text x="88" y="534" class="mono" font-size="40" font-weight="600" fill="#B58A2C">−55 %</text>
  <text x="280" y="522" class="body" font-size="14" fill="#1A1A1A">d'économie de mémoire mesurée en échantillonnage parallèle et beam search : de nombreuses</text>
  <text x="280" y="544" class="body" font-size="14" fill="#1A1A1A">branches partagent de longs préfixes communs avant de bifurquer.</text>
  <text x="280" y="580" class="display" font-size="15" font-style="italic" fill="#1F5560">Le partage reste intra-requête : il vit et meurt avec les k complétions d'un même appel.</text>

  <!-- FOOTER -->
  <text x="60" y="640" class="body" font-size="11.5" fill="#1A1A1A">RadixAttention (schéma 04) fera déborder ce partage au-delà des frontières d'une requête, entre requêtes séparées dans le temps.</text>
  <line x1="60" y1="740" x2="1140" y2="740" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="60" y="772" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Source : Kwon et al., PagedAttention (SOSP 2023) ; blog vLLM (2023). Identifiants et refcounts illustratifs.</text>
</svg>
