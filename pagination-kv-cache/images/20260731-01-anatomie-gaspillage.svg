<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .display { font-family: 'Spectral', 'Playfair Display', Georgia, serif; }
      .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
      .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    </style>
    <pattern id="hatch01" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B7332C" stroke-width="1.4" stroke-opacity="0.35"/>
    </pattern>
    <marker id="arrow01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="55" class="mono" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 01</text>
  <text x="60" y="92" class="display" font-size="26" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">Le tableau contigu qui gaspille 60 à 80 %</text>
  <text x="60" y="118" class="display" font-size="16" font-style="italic" fill="#5A5A5A">Réserver au pire cas (max_seq_len) fragmente la mémoire du cas moyen — trois gaspillages cumulés</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- axis label -->
  <text x="60" y="180" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#5A5A5A">MÉMOIRE GPU RÉSERVÉE — trois séquences en réservation contiguë</text>

  <!-- three sequence bars, each reserving max_seq_len -->
  <!-- Bar A -->
  <g class="interactive" data-card="used" tabindex="0" role="button" aria-label="KV réellement utilisé">
    <rect x="60" y="210" width="150" height="60" rx="2" fill="#1F5560" fill-opacity="0.9"/>
    <text x="135" y="245" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle">utilisé</text>
  </g>
  <g class="interactive" data-card="internal-waste" tabindex="0" role="button" aria-label="Fragmentation interne">
    <rect x="210" y="210" width="46" height="60" rx="2" fill="#B58A2C" fill-opacity="0.6"/>
  </g>
  <g class="interactive" data-card="reserve-slot" tabindex="0" role="button" aria-label="Sur-réservation">
    <rect x="256" y="210" width="620" height="60" rx="2" fill="url(#hatch01)" stroke="#B7332C" stroke-width="1" stroke-opacity="0.5"/>
    <text x="566" y="245" class="body" font-size="12" font-style="italic" fill="#B7332C" text-anchor="middle">réservé mais jamais généré (sur-réservation)</text>
  </g>
  <text x="895" y="238" class="mono" font-size="10" fill="#5A5A5A">req. A — max_seq_len</text>

  <!-- Bar B -->
  <g class="interactive" data-card="used" tabindex="0" role="button" aria-label="KV réellement utilisé">
    <rect x="60" y="284" width="300" height="60" rx="2" fill="#1F5560" fill-opacity="0.9"/>
    <text x="210" y="319" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle">utilisé</text>
  </g>
  <g class="interactive" data-card="internal-waste" tabindex="0" role="button" aria-label="Fragmentation interne">
    <rect x="360" y="284" width="30" height="60" rx="2" fill="#B58A2C" fill-opacity="0.6"/>
  </g>
  <g class="interactive" data-card="reserve-slot" tabindex="0" role="button" aria-label="Sur-réservation">
    <rect x="390" y="284" width="486" height="60" rx="2" fill="url(#hatch01)" stroke="#B7332C" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <text x="895" y="312" class="mono" font-size="10" fill="#5A5A5A">req. B — max_seq_len</text>

  <!-- Bar C -->
  <g class="interactive" data-card="used" tabindex="0" role="button" aria-label="KV réellement utilisé">
    <rect x="60" y="358" width="110" height="60" rx="2" fill="#1F5560" fill-opacity="0.9"/>
    <text x="115" y="393" class="mono" font-size="11" fill="#FAF8F3" text-anchor="middle">util.</text>
  </g>
  <g class="interactive" data-card="internal-waste" tabindex="0" role="button" aria-label="Fragmentation interne">
    <rect x="170" y="358" width="52" height="60" rx="2" fill="#B58A2C" fill-opacity="0.6"/>
  </g>
  <g class="interactive" data-card="reserve-slot" tabindex="0" role="button" aria-label="Sur-réservation">
    <rect x="222" y="358" width="654" height="60" rx="2" fill="url(#hatch01)" stroke="#B7332C" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <text x="895" y="386" class="mono" font-size="10" fill="#5A5A5A">req. C — max_seq_len</text>

  <!-- external fragmentation zone -->
  <g class="interactive" data-card="external-waste" tabindex="0" role="button" aria-label="Fragmentation externe">
    <rect x="60" y="440" width="816" height="54" rx="3" fill="#1A1A1A" fill-opacity="0.04" stroke="#5A5A5A" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="80" y="463" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#5A5A5A">FRAGMENTATION EXTERNE</text>
    <text x="80" y="482" class="body" font-size="11.5" fill="#1A1A1A">Les trous entre réservations contiguës de tailles différentes : inutilisables même s'ils totalisent de la place</text>
  </g>

  <!-- legend -->
  <rect x="60" y="524" width="16" height="16" rx="2" fill="#1F5560" fill-opacity="0.9"/>
  <text x="84" y="537" class="body" font-size="11.5" fill="#1A1A1A">KV réellement utilisé</text>
  <rect x="260" y="524" width="16" height="16" rx="2" fill="#B58A2C" fill-opacity="0.6"/>
  <text x="284" y="537" class="body" font-size="11.5" fill="#1A1A1A">fragmentation interne (dernier bloc)</text>
  <rect x="560" y="524" width="16" height="16" rx="2" fill="url(#hatch01)" stroke="#B7332C" stroke-width="1" stroke-opacity="0.5"/>
  <text x="584" y="537" class="body" font-size="11.5" fill="#1A1A1A">sur-réservation (poste dominant)</text>

  <!-- verdict callout -->
  <rect x="60" y="576" width="1080" height="150" rx="3" fill="#B7332C" fill-opacity="0.05" stroke="#B7332C" stroke-width="1.5"/>
  <text x="88" y="622" class="mono" font-size="46" font-weight="600" fill="#B7332C">60–80 %</text>
  <text x="300" y="608" class="body" font-size="14" fill="#1A1A1A">de la mémoire du KV-cache gaspillée par les systèmes de service de première génération.</text>
  <text x="300" y="632" class="body" font-size="14" fill="#1A1A1A">Chaque octet perdu est une requête de moins servie en parallèle — donc un plafond de débit.</text>
  <text x="300" y="668" class="display" font-size="15" font-style="italic" fill="#1F5560">Le gaspillage mémoire était le plafond de débit. La pagination va le lever.</text>
  <text x="300" y="700" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Diagnostic mesuré par l'équipe vLLM (Kwon et al., SOSP 2023).</text>

  <!-- FOOTER -->
  <text x="60" y="772" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Source : Kwon et al., PagedAttention (SOSP 2023). Barres illustratives, proportions schématiques.</text>
</svg>
