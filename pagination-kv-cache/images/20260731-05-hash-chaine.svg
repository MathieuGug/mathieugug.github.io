<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .display { font-family: 'Spectral', 'Playfair Display', Georgia, serif; }
      .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
      .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    </style>
    <marker id="arrow05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="55" class="mono" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 05</text>
  <text x="60" y="92" class="display" font-size="26" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">Le hash chaîné : identifier un préfixe sans parcourir d'arbre</text>
  <text x="60" y="118" class="display" font-size="16" font-style="italic" fill="#5A5A5A">vLLM Automatic Prefix Caching — le hash d'un bloc dérive de celui du parent, imposant une correspondance exacte du préfixe</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- chained hash formula -->
  <g class="interactive" data-card="chained-hash" tabindex="0" role="button" aria-label="Le hash chaîné bloc par bloc">
    <text x="60" y="182" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#B7332C">CHAÎNE DE HACHAGE — chaque bloc hache tout ce qui le précède</text>

    <rect x="60" y="200" width="200" height="72" rx="3" fill="#1F5560" fill-opacity="0.85"/>
    <text x="160" y="226" class="mono" font-size="10.5" fill="#FAF8F3" text-anchor="middle">bloc 0</text>
    <text x="160" y="244" class="mono" font-size="9" fill="#FAF8F3" text-anchor="middle">h0 = H(∅, tok₀…₁₅)</text>
    <text x="160" y="261" class="mono" font-size="9" fill="#FAF8F3" text-anchor="middle">= a3f1</text>

    <rect x="320" y="200" width="200" height="72" rx="3" fill="#1F5560" fill-opacity="0.85"/>
    <text x="420" y="226" class="mono" font-size="10.5" fill="#FAF8F3" text-anchor="middle">bloc 1</text>
    <text x="420" y="244" class="mono" font-size="9" fill="#FAF8F3" text-anchor="middle">h1 = H(h0, tok₁₆…₃₁)</text>
    <text x="420" y="261" class="mono" font-size="9" fill="#FAF8F3" text-anchor="middle">= c7b2</text>

    <rect x="580" y="200" width="200" height="72" rx="3" fill="#1F5560" fill-opacity="0.85"/>
    <text x="680" y="226" class="mono" font-size="10.5" fill="#FAF8F3" text-anchor="middle">bloc 2</text>
    <text x="680" y="244" class="mono" font-size="9" fill="#FAF8F3" text-anchor="middle">h2 = H(h1, tok₃₂…₄₇)</text>
    <text x="680" y="261" class="mono" font-size="9" fill="#FAF8F3" text-anchor="middle">= 9e05</text>

    <line x1="262" y1="236" x2="318" y2="236" stroke="#5A5A5A" stroke-width="1.1" marker-end="url(#arrow05)"/>
    <line x1="522" y1="236" x2="578" y2="236" stroke="#5A5A5A" stroke-width="1.1" marker-end="url(#arrow05)"/>
  </g>

  <!-- exact match -->
  <g class="interactive" data-card="exact-match" tabindex="0" role="button" aria-label="Correspondance exacte du préfixe">
    <rect x="840" y="200" width="300" height="72" rx="3" fill="#B7332C" fill-opacity="0.06" stroke="#B7332C" stroke-width="1.25"/>
    <text x="860" y="224" class="body" font-size="11.5" fill="#1A1A1A">Même hash ⇔ même suite de tokens</text>
    <text x="860" y="242" class="body" font-size="11.5" fill="#1A1A1A">depuis le tout début.</text>
    <text x="860" y="262" class="body" font-size="11.5" font-weight="600" fill="#B7332C">Un cache hit = match token par token.</text>
  </g>

  <!-- two requests comparison -->
  <text x="60" y="322" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#5A5A5A">DEUX REQUÊTES — le partage s'arrête au premier token qui diffère</text>
  <rect x="60" y="338" width="150" height="40" rx="3" fill="#1F5560" fill-opacity="0.85"/><text x="135" y="363" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">a3f1</text>
  <rect x="220" y="338" width="150" height="40" rx="3" fill="#1F5560" fill-opacity="0.85"/><text x="295" y="363" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">c7b2</text>
  <rect x="380" y="338" width="150" height="40" rx="3" fill="#B58A2C" fill-opacity="0.75"/><text x="455" y="363" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">req. X : 9e05</text>
  <text x="545" y="363" class="body" font-size="11.5" fill="#1F5560">◄ préfixe partagé (hit)</text>

  <rect x="60" y="386" width="150" height="40" rx="3" fill="#1F5560" fill-opacity="0.85"/><text x="135" y="411" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">a3f1</text>
  <rect x="220" y="386" width="150" height="40" rx="3" fill="#1F5560" fill-opacity="0.85"/><text x="295" y="411" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">c7b2</text>
  <rect x="380" y="386" width="150" height="40" rx="3" fill="#B7332C" fill-opacity="0.8"/><text x="455" y="411" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">req. Y : 4d1a</text>
  <text x="545" y="411" class="body" font-size="11.5" fill="#B7332C">◄ diverge ici (miss à partir du bloc 2)</text>

  <!-- extra keys -->
  <g class="interactive" data-card="extra-keys" tabindex="0" role="button" aria-label="Les clés supplémentaires">
    <rect x="60" y="454" width="520" height="220" rx="3" fill="#B58A2C" fill-opacity="0.07" stroke="#B58A2C" stroke-width="1.5"/>
    <text x="80" y="480" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#B58A2C">EXTRA KEYS — au-delà des tokens visibles</text>
    <text x="80" y="504" class="body" font-size="12" fill="#1A1A1A">Deux prompts textuellement identiques peuvent produire des</text>
    <text x="80" y="522" class="body" font-size="12" fill="#1A1A1A">activations différentes. Le hash intègre donc aussi :</text>
    <circle cx="92" cy="548" r="3" fill="#B58A2C"/><text x="106" y="552" class="body" font-size="12" fill="#1A1A1A"><tspan class="mono" font-size="11" fill="#B7332C">LoRA id</tspan> — l'adaptateur actif change les activations</text>
    <circle cx="92" cy="576" r="3" fill="#B58A2C"/><text x="106" y="580" class="body" font-size="12" fill="#1A1A1A"><tspan class="mono" font-size="11" fill="#B7332C">hash multimodal</tspan> — une image modifie le calcul</text>
    <circle cx="92" cy="604" r="3" fill="#B58A2C"/><text x="106" y="608" class="body" font-size="12" fill="#1A1A1A"><tspan class="mono" font-size="11" fill="#B7332C">cache_salt</tspan> — isole délibérément un client (parade cross-tenant)</text>
    <text x="80" y="648" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">Sans ces clés, on servirait à une requête le cache d'une autre</text>
    <text x="80" y="666" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">qui n'a de commun que les tokens visibles.</text>
  </g>

  <!-- last block eviction -->
  <g class="interactive" data-card="last-block-evict" tabindex="0" role="button" aria-label="Éviction du dernier bloc en premier">
    <rect x="620" y="454" width="520" height="220" rx="3" fill="#B7332C" fill-opacity="0.05" stroke="#B7332C" stroke-width="1.5"/>
    <text x="640" y="480" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#B7332C">ÉVICTION — le dernier bloc part en premier</text>
    <!-- gradient of reusability -->
    <rect x="640" y="500" width="120" height="46" rx="2" fill="#1F5560" fill-opacity="0.85"/><text x="700" y="522" class="mono" font-size="9.5" fill="#FAF8F3" text-anchor="middle">bloc système</text><text x="700" y="537" class="mono" font-size="8.5" fill="#FAF8F3" text-anchor="middle">réutilisé par tous</text>
    <rect x="770" y="500" width="120" height="46" rx="2" fill="#1F5560" fill-opacity="0.55"/><text x="830" y="522" class="mono" font-size="9.5" fill="#FAF8F3" text-anchor="middle">bloc contexte</text><text x="830" y="537" class="mono" font-size="8.5" fill="#FAF8F3" text-anchor="middle">réutilisé souvent</text>
    <rect x="900" y="500" width="120" height="46" rx="2" fill="#1F5560" fill-opacity="0.3"/><text x="960" y="522" class="mono" font-size="9.5" fill="#1A1A1A" text-anchor="middle">bloc question</text><text x="960" y="537" class="mono" font-size="8.5" fill="#1A1A1A" text-anchor="middle">rarement</text>
    <rect x="1030" y="500" width="90" height="46" rx="2" fill="#FAF8F3" stroke="#B7332C" stroke-width="1.5" stroke-dasharray="3 3"/><text x="1075" y="522" class="mono" font-size="9.5" fill="#B7332C" text-anchor="middle">dernier</text><text x="1075" y="537" class="mono" font-size="8.5" fill="#B7332C" text-anchor="middle">évincé 1ᵉʳ</text>
    <text x="640" y="580" class="body" font-size="12" fill="#1A1A1A">Le dernier bloc hache le plus de tokens : c'est le</text>
    <text x="640" y="598" class="body" font-size="12" fill="#1A1A1A">moins susceptible d'être partagé par une autre requête.</text>
    <text x="640" y="628" class="display" font-size="13.5" font-style="italic" fill="#1F5560">On protège les préfixes courts et populaires,</text>
    <text x="640" y="648" class="display" font-size="13.5" font-style="italic" fill="#1F5560">on sacrifie les suffixes longs et rares.</text>
    <text x="640" y="668" class="body" font-size="11" fill="#5A5A5A">Logique inverse d'un « dernier entré, premier sorti ».</text>
  </g>

  <!-- FOOTER -->
  <line x1="60" y1="740" x2="1140" y2="740" stroke="#E5E1D8" stroke-width="0.5"/>
  <text x="60" y="772" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Source : documentation vLLM, Automatic Prefix Caching (design v1). Valeurs de hash illustratives.</text>
</svg>
