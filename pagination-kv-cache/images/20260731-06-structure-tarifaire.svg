<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .display { font-family: 'Spectral', 'Playfair Display', Georgia, serif; }
      .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
      .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    </style>
    <marker id="arrow06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="55" class="mono" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 06</text>
  <text x="60" y="92" class="display" font-size="26" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">La mémoire devient une ligne de facturation</text>
  <text x="60" y="118" class="display" font-size="16" font-style="italic" fill="#5A5A5A">Le prompt caching monétise RadixAttention/APC : écriture chère une fois, lectures amorties à −90 %</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- pricing table left -->
  <g class="interactive" data-card="cache-write" tabindex="0" role="button" aria-label="Coût d'écriture du cache">
    <rect x="60" y="170" width="360" height="120" rx="3" fill="#B7332C" fill-opacity="0.05" stroke="#B7332C" stroke-width="1.5"/>
    <text x="80" y="196" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#B7332C">ÉCRITURE (cache write)</text>
    <text x="80" y="226" class="mono" font-size="22" font-weight="600" fill="#B7332C">×1,25</text>
    <text x="200" y="226" class="body" font-size="12" fill="#1A1A1A">du prix d'entrée · TTL 5 min</text>
    <text x="80" y="258" class="mono" font-size="22" font-weight="600" fill="#B7332C">×2,0</text>
    <text x="200" y="258" class="body" font-size="12" fill="#1A1A1A">du prix d'entrée · TTL 1 h</text>
    <text x="80" y="282" class="body" font-size="11" font-style="italic" fill="#5A5A5A">coût de calculer + stocker le KV-cache</text>
  </g>
  <g class="interactive" data-card="cache-read" tabindex="0" role="button" aria-label="Coût de lecture du cache">
    <rect x="60" y="304" width="360" height="120" rx="3" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="1.5"/>
    <text x="80" y="330" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#1F5560">LECTURE (cache read)</text>
    <text x="80" y="366" class="mono" font-size="30" font-weight="600" fill="#1F5560">×0,1</text>
    <text x="210" y="360" class="body" font-size="13" font-weight="600" fill="#1F5560">−90 %</text>
    <text x="210" y="380" class="body" font-size="12" fill="#1A1A1A">sur la portion mise en cache</text>
    <text x="80" y="410" class="body" font-size="11" font-style="italic" fill="#5A5A5A">le KV qu'on n'a pas à recalculer · OpenAI : −50 % auto</text>
  </g>

  <!-- cumulative cost chart right -->
  <text x="470" y="182" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#5A5A5A">COÛT CUMULÉ — conversation multi-tours, préfixe stable réutilisé</text>
  <!-- axes -->
  <line x1="500" y1="200" x2="500" y2="420" stroke="#5A5A5A" stroke-width="1"/>
  <line x1="500" y1="420" x2="1120" y2="420" stroke="#5A5A5A" stroke-width="1"/>
  <text x="486" y="206" class="body" font-size="10" fill="#5A5A5A" text-anchor="end">coût</text>
  <text x="1120" y="440" class="body" font-size="10" fill="#5A5A5A" text-anchor="end">tours →</text>
  <!-- no-cache line (steep) -->
  <polyline points="500,410 620,360 740,310 860,260 980,210 1100,160" fill="none" stroke="#B7332C" stroke-width="2.5"/>
  <text x="1030" y="150" class="body" font-size="11" fill="#B7332C">sans cache</text>
  <!-- cache line: high first step then shallow -->
  <polyline points="500,410 560,330 620,318 740,300 860,282 980,264 1100,246" fill="none" stroke="#1F5560" stroke-width="2.5"/>
  <text x="1040" y="262" class="body" font-size="11" fill="#1F5560">avec cache</text>
  <!-- break-even marker -->
  <g class="interactive" data-card="break-even" tabindex="0" role="button" aria-label="Seuil de rentabilité du cache">
    <circle cx="560" cy="330" r="6" fill="#B58A2C"/>
    <line x1="560" y1="330" x2="560" y2="200" stroke="#B58A2C" stroke-width="0.75" stroke-dasharray="2 3"/>
    <text x="572" y="214" class="body" font-size="10.5" fill="#B58A2C">écriture initiale (le pic)</text>
    <text x="572" y="230" class="body" font-size="10.5" fill="#5A5A5A">min. 1 024 tokens cacheables</text>
  </g>
  <text x="640" y="392" class="body" font-size="11" font-style="italic" fill="#5A5A5A">après le préchauffage, chaque tour ne repaie que la lecture à 0,1×</text>

  <!-- TTL reset -->
  <g class="interactive" data-card="ttl-reset" tabindex="0" role="button" aria-label="Réinitialisation du TTL à chaque lecture">
    <rect x="60" y="452" width="1080" height="96" rx="3" fill="#B58A2C" fill-opacity="0.07" stroke="#B58A2C" stroke-width="1.5"/>
    <text x="80" y="478" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#B58A2C">TTL — toute lecture réinitialise le compteur</text>
    <text x="80" y="504" class="body" font-size="13" fill="#1A1A1A">Un préfixe fréquemment sollicité reste chaud indéfiniment et ne repaie jamais son écriture après le préchauffage.</text>
    <text x="80" y="528" class="body" font-size="12.5" font-style="italic" fill="#5A5A5A">C'est le comportement d'un cache LRU, exposé tel quel au client. Anthropic : bêta publique août 2024, disponibilité générale déc. 2024.</text>
  </g>

  <!-- strategic verdict -->
  <rect x="60" y="576" width="1080" height="150" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.5"/>
  <text x="80" y="606" class="mono" font-size="10" font-weight="600" letter-spacing="0.12em" fill="#1F5560">CONSÉQUENCE STRATÉGIQUE</text>
  <text x="80" y="638" class="display" font-size="19" font-style="italic" fill="#1A1A1A">L'architecture du service devient l'architecture du prompt.</text>
  <text x="80" y="668" class="body" font-size="13" fill="#1A1A1A">Seul un préfixe stable se partage → intérêt économique direct à ordonner du plus stable au plus variable :</text>
  <rect x="80" y="684" width="270" height="30" rx="3" fill="#1F5560" fill-opacity="0.85"/><text x="215" y="704" class="mono" font-size="10.5" fill="#FAF8F3" text-anchor="middle">système + outils (écrit 1×, lu 1000×)</text>
  <rect x="360" y="684" width="230" height="30" rx="3" fill="#1F5560" fill-opacity="0.5"/><text x="475" y="704" class="mono" font-size="10.5" fill="#FAF8F3" text-anchor="middle">contexte / documents</text>
  <rect x="600" y="684" width="200" height="30" rx="3" fill="#B7332C" fill-opacity="0.75"/><text x="700" y="704" class="mono" font-size="10.5" fill="#FAF8F3" text-anchor="middle">question utilisateur</text>
  <text x="820" y="704" class="body" font-size="11.5" font-style="italic" fill="#5A5A5A">mettre la question en tête annule tout.</text>

  <!-- FOOTER -->
  <text x="60" y="772" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Source : documentation Anthropic (prompt caching) ; documentation OpenAI. Courbes de coût illustratives.</text>
</svg>
