<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .display { font-family: 'Spectral', 'Playfair Display', Georgia, serif; }
      .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
      .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    </style>
    <marker id="arrow07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="55" class="mono" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 07</text>
  <text x="60" y="92" class="display" font-size="26" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">Le mur du préfixe et la hiérarchie mémoire</text>
  <text x="60" y="118" class="display" font-size="16" font-style="italic" fill="#5A5A5A">On ne partage qu'un préfixe. En RAG, tout sauf le premier chunk rate le cache — deux familles de réponses</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- RAG concatenation -->
  <text x="60" y="180" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#5A5A5A">UNE REQUÊTE RAG — concaténation système + chunks dynamiques + question</text>
  <g class="interactive" data-card="prefix-hit" tabindex="0" role="button" aria-label="Le préfixe système, seul segment partagé">
    <rect x="60" y="196" width="200" height="56" rx="3" fill="#1F5560" fill-opacity="0.85"/>
    <text x="160" y="220" class="mono" font-size="10.5" fill="#FAF8F3" text-anchor="middle">prompt système</text>
    <text x="160" y="238" class="mono" font-size="9.5" fill="#FAF8F3" text-anchor="middle">HIT ✓ (préfixe)</text>
  </g>
  <g class="interactive" data-card="non-prefix-miss" tabindex="0" role="button" aria-label="Les chunks non-préfixes ratent le cache">
    <rect x="268" y="196" width="180" height="56" rx="3" fill="#B7332C" fill-opacity="0.15" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 3"/>
    <text x="358" y="220" class="mono" font-size="10.5" fill="#B7332C" text-anchor="middle">chunk A</text>
    <text x="358" y="238" class="mono" font-size="9.5" fill="#B7332C" text-anchor="middle">MISS ✕</text>
    <rect x="456" y="196" width="180" height="56" rx="3" fill="#B7332C" fill-opacity="0.15" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 3"/>
    <text x="546" y="220" class="mono" font-size="10.5" fill="#B7332C" text-anchor="middle">chunk B</text>
    <text x="546" y="238" class="mono" font-size="9.5" fill="#B7332C" text-anchor="middle">MISS ✕</text>
    <rect x="644" y="196" width="160" height="56" rx="3" fill="#B7332C" fill-opacity="0.15" stroke="#B7332C" stroke-width="1.25" stroke-dasharray="3 3"/>
    <text x="724" y="220" class="mono" font-size="10.5" fill="#B7332C" text-anchor="middle">question</text>
    <text x="724" y="238" class="mono" font-size="9.5" fill="#B7332C" text-anchor="middle">MISS ✕</text>
  </g>
  <text x="830" y="220" class="body" font-size="12" fill="#1A1A1A">Dès le 2ᵉ chunk, la suite diffère</text>
  <text x="830" y="238" class="body" font-size="12" fill="#1A1A1A">d'une requête à l'autre → pas un préfixe.</text>
  <text x="60" y="280" class="display" font-size="14" font-style="italic" fill="#B7332C">La mise en cache de préfixe classique peut être presque aussi lente que l'absence totale de cache.</text>

  <line x1="60" y1="300" x2="1140" y2="300" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- Family 1: recompute -->
  <g class="interactive" data-card="cacheblend-recompute" tabindex="0" role="button" aria-label="CacheBlend, recalcul sélectif des tokens critiques">
    <rect x="60" y="320" width="540" height="240" rx="3" fill="#B58A2C" fill-opacity="0.07" stroke="#B58A2C" stroke-width="1.5"/>
    <text x="80" y="346" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#B58A2C">FAMILLE 1 — recomputer intelligemment</text>
    <text x="80" y="372" class="display" font-size="16" fill="#1A1A1A">CacheBlend</text>
    <text x="180" y="372" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Best Paper, EuroSys 2025</text>
    <text x="80" y="396" class="body" font-size="12" fill="#1A1A1A">Part du KV pré-calculé de chaque chunk isolé (réutilisable</text>
    <text x="80" y="414" class="body" font-size="12" fill="#1A1A1A">hors préfixe) et ne recalcule que les tokens critiques.</text>
    <!-- chunk with 15% recompute -->
    <rect x="80" y="430" width="240" height="30" rx="2" fill="#1F5560" fill-opacity="0.35"/>
    <rect x="80" y="430" width="36" height="30" rx="2" fill="#B7332C" fill-opacity="0.8"/>
    <rect x="180" y="430" width="24" height="30" rx="2" fill="#B7332C" fill-opacity="0.8"/>
    <text x="330" y="450" class="mono" font-size="10.5" fill="#B7332C">≈ 15 % recalculé</text>
    <text x="80" y="490" class="mono" font-size="13" font-weight="600" fill="#1F5560">TTFT −2,2 à −3,3×</text>
    <text x="290" y="490" class="mono" font-size="13" font-weight="600" fill="#1F5560">débit ×2,8 à ×5</text>
    <text x="80" y="514" class="body" font-size="11.5" fill="#1A1A1A">Taux de succès ~100 % en RAG, sans dégrader la qualité.</text>
    <text x="80" y="540" class="body" font-size="11" font-style="italic" fill="#5A5A5A">Prompt Cache (MLSys 2024) : précalcul de modules réutilisables hors préfixe.</text>
  </g>

  <!-- Family 2: hierarchy -->
  <g class="interactive" data-card="memory-hierarchy" tabindex="0" role="button" aria-label="Hiérarchie mémoire et cache-as-a-service">
    <rect x="620" y="320" width="520" height="240" rx="3" fill="#1F5560" fill-opacity="0.06" stroke="#1F5560" stroke-width="1.5"/>
    <text x="640" y="346" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#1F5560">FAMILLE 2 — descendre la hiérarchie mémoire</text>
    <!-- tiers -->
    <rect x="640" y="362" width="480" height="26" rx="2" fill="#1F5560" fill-opacity="0.85"/><text x="654" y="380" class="mono" font-size="10" fill="#FAF8F3">HBM — rapide, rare</text>
    <rect x="640" y="392" width="480" height="26" rx="2" fill="#1F5560" fill-opacity="0.6"/><text x="654" y="410" class="mono" font-size="10" fill="#FAF8F3">DRAM</text>
    <rect x="640" y="422" width="480" height="26" rx="2" fill="#1F5560" fill-opacity="0.38"/><text x="654" y="440" class="mono" font-size="10" fill="#1A1A1A">SSD</text>
    <rect x="640" y="452" width="480" height="26" rx="2" fill="#1F5560" fill-opacity="0.2"/><text x="654" y="470" class="mono" font-size="10" fill="#1A1A1A">stockage distant — lent, vaste</text>
    <text x="640" y="500" class="body" font-size="12" fill="#1A1A1A"><tspan class="mono" font-size="11" font-weight="600" fill="#1F5560">LMCache</tspan> : couche persistante, cross-moteur → RAG ×4,5</text>
    <text x="640" y="520" class="body" font-size="12" fill="#1A1A1A"><tspan class="mono" font-size="11" font-weight="600" fill="#1F5560">Mooncake</tspan> (FAST 2025) : pool KV DRAM/SSD à l'échelle</text>
    <text x="640" y="540" class="body" font-size="12" fill="#1A1A1A"><tspan class="mono" font-size="11" font-weight="600" fill="#1F5560">llm-d</tspan> (CNCF) : ordonnancement cache-aware distribué</text>
  </g>

  <!-- security frontier -->
  <rect x="60" y="584" width="1080" height="142" rx="3" fill="#B7332C" fill-opacity="0.05" stroke="#B7332C" stroke-width="1.5"/>
  <text x="80" y="612" class="mono" font-size="10" font-weight="600" letter-spacing="0.12em" fill="#B7332C">LA FRONTIÈRE DE SÉCURITÉ — la mutualisation qui donne l'efficacité crée la surface d'attaque</text>
  <text x="80" y="642" class="body" font-size="13" fill="#1A1A1A">Dès que des blocs de KV-cache sont partagés entre requêtes, utilisateurs, voire locataires, le cache devient attaquable :</text>
  <circle cx="92" cy="664" r="3" fill="#B7332C"/><text x="106" y="668" class="body" font-size="12.5" fill="#1A1A1A">fuite par canal temporel — la latence révèle qu'un préfixe est déjà en cache, donc déjà soumis par un autre ;</text>
  <circle cx="92" cy="688" r="3" fill="#B7332C"/><text x="106" y="692" class="body" font-size="12.5" fill="#1A1A1A">un bloc partagé corrompu empoisonne toutes les requêtes qui le réutilisent.</text>
  <text x="80" y="716" class="body" font-size="12" font-style="italic" fill="#5A5A5A">L'isolation par cache_salt est la parade minimale — mais elle sacrifie le partage qui faisait tout l'intérêt du cache.</text>

  <!-- FOOTER -->
  <text x="60" y="772" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Sources : Yao et al., CacheBlend (EuroSys 2025) ; LMCache (2024) ; Qin et al., Mooncake (FAST 2025) ; llm-d (CNCF).</text>
</svg>
