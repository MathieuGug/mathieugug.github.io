<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .display { font-family: 'Spectral', 'Playfair Display', Georgia, serif; }
      .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
      .mono    { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
    </style>
    <marker id="arrow02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F3"/>

  <!-- HEADER -->
  <text x="60" y="55" class="mono" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#B7332C">SCHÉMA 02</text>
  <text x="60" y="92" class="display" font-size="26" font-weight="600" letter-spacing="-0.01em" fill="#1A1A1A">La table de blocs : une table des pages pour le cache d'attention</text>
  <text x="60" y="118" class="display" font-size="16" font-style="italic" fill="#5A5A5A">Même mécanique que la mémoire virtuelle de l'OS — l'indirection projette une vue logique contiguë sur des blocs physiques épars</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#E5E1D8" stroke-width="0.5"/>

  <!-- OS analogy band (top) -->
  <g class="interactive" data-card="os-analogy" tabindex="0" role="button" aria-label="Analogie mémoire virtuelle de l'OS">
    <rect x="60" y="164" width="1080" height="200" rx="3" fill="#5A5A5A" fill-opacity="0.05" stroke="#B8B5AE" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="80" y="190" class="mono" font-size="10" font-weight="600" letter-spacing="0.12em" fill="#5A5A5A">LE MODÈLE OS — mémoire virtuelle (rappel)</text>

    <!-- virtual pages -->
    <text x="150" y="216" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">pages virtuelles</text>
    <rect x="95" y="226" width="110" height="30" rx="2" fill="#B8B5AE" fill-opacity="0.35"/><text x="150" y="246" class="mono" font-size="10" fill="#1A1A1A" text-anchor="middle">page 0</text>
    <rect x="95" y="260" width="110" height="30" rx="2" fill="#B8B5AE" fill-opacity="0.35"/><text x="150" y="280" class="mono" font-size="10" fill="#1A1A1A" text-anchor="middle">page 1</text>
    <rect x="95" y="294" width="110" height="30" rx="2" fill="#B8B5AE" fill-opacity="0.35"/><text x="150" y="314" class="mono" font-size="10" fill="#1A1A1A" text-anchor="middle">page 2</text>

    <!-- page table -->
    <text x="370" y="216" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">table des pages</text>
    <rect x="300" y="226" width="140" height="98" rx="2" fill="#FAF8F3" stroke="#B8B5AE" stroke-width="0.75"/>
    <text x="316" y="248" class="mono" font-size="10" fill="#1A1A1A">page 0 → cadre 12</text>
    <text x="316" y="272" class="mono" font-size="10" fill="#1A1A1A">page 1 → cadre 03</text>
    <text x="316" y="296" class="mono" font-size="10" fill="#1A1A1A">page 2 → cadre 20</text>

    <!-- frames -->
    <text x="720" y="216" class="body" font-size="11" fill="#5A5A5A" text-anchor="middle">cadres physiques (RAM) — dispersés</text>
    <rect x="540" y="226" width="70" height="30" rx="2" fill="#E5E1D8"/><text x="575" y="246" class="mono" font-size="9" fill="#5A5A5A" text-anchor="middle">c03</text>
    <rect x="620" y="226" width="70" height="30" rx="2" fill="#E5E1D8"/><text x="655" y="246" class="mono" font-size="9" fill="#5A5A5A" text-anchor="middle">c12</text>
    <rect x="700" y="226" width="70" height="30" rx="2" fill="#E5E1D8"/><text x="735" y="246" class="mono" font-size="9" fill="#5A5A5A" text-anchor="middle">c20</text>
    <rect x="780" y="226" width="70" height="30" rx="2" fill="#E5E1D8"/><text x="815" y="246" class="mono" font-size="9" fill="#5A5A5A" text-anchor="middle">c21</text>
    <text x="540" y="300" class="body" font-size="12" font-style="italic" fill="#5A5A5A">Un problème vieux d'un demi-siècle,</text>
    <text x="540" y="318" class="body" font-size="12" font-style="italic" fill="#5A5A5A">déjà résolu.</text>
    <line x1="205" y1="241" x2="298" y2="241" stroke="#5A5A5A" stroke-width="0.9" marker-end="url(#arrow02)"/>
    <line x1="440" y1="270" x2="533" y2="241" stroke="#5A5A5A" stroke-width="0.9" marker-end="url(#arrow02)"/>
  </g>

  <!-- KV-cache instance band (bottom) -->
  <text x="60" y="404" class="mono" font-size="10" font-weight="600" letter-spacing="0.12em" fill="#B7332C">L'INSTANCE KV-CACHE — PagedAttention, blocs de 16 tokens</text>

  <!-- logical blocks -->
  <g class="interactive" data-card="logical-blocks" tabindex="0" role="button" aria-label="Vue logique contiguë de la séquence">
    <rect x="60" y="420" width="220" height="300" rx="3" fill="#1F5560" fill-opacity="0.05" stroke="#1F5560" stroke-width="1.5"/>
    <text x="80" y="446" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#1F5560">VUE LOGIQUE</text>
    <text x="80" y="464" class="body" font-size="11" fill="#5A5A5A">contiguë — 16 tokens / bloc</text>
    <rect x="80" y="478" width="180" height="52" rx="2" fill="#1F5560" fill-opacity="0.85"/><text x="170" y="500" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">bloc logique 0</text><text x="170" y="516" class="mono" font-size="9" fill="#FAF8F3" text-anchor="middle">tokens 0–15</text>
    <rect x="80" y="536" width="180" height="52" rx="2" fill="#1F5560" fill-opacity="0.85"/><text x="170" y="558" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">bloc logique 1</text><text x="170" y="574" class="mono" font-size="9" fill="#FAF8F3" text-anchor="middle">tokens 16–31</text>
    <rect x="80" y="594" width="180" height="52" rx="2" fill="#1F5560" fill-opacity="0.85"/><text x="170" y="616" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">bloc logique 2</text><text x="170" y="632" class="mono" font-size="9" fill="#FAF8F3" text-anchor="middle">tokens 32–47</text>
    <rect x="80" y="652" width="180" height="52" rx="2" fill="#1F5560" fill-opacity="0.5"/><text x="170" y="674" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">bloc logique 3</text><text x="170" y="690" class="mono" font-size="9" fill="#FAF8F3" text-anchor="middle">en cours…</text>
  </g>

  <!-- block table -->
  <g class="interactive" data-card="block-table" tabindex="0" role="button" aria-label="La table de blocs, indirection logique vers physique">
    <rect x="360" y="420" width="240" height="300" rx="3" fill="#B7332C" fill-opacity="0.05" stroke="#B7332C" stroke-width="1.5"/>
    <text x="380" y="446" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#B7332C">TABLE DE BLOCS</text>
    <text x="380" y="464" class="body" font-size="11" fill="#5A5A5A">logique → physique</text>
    <g class="mono" font-size="12" fill="#1A1A1A">
      <rect x="380" y="478" width="200" height="52" rx="2" fill="#FAF8F3" stroke="#B8B5AE" stroke-width="0.75"/><text x="398" y="510">L0 → <tspan font-weight="600" fill="#B7332C">P07</tspan></text>
      <rect x="380" y="536" width="200" height="52" rx="2" fill="#FAF8F3" stroke="#B8B5AE" stroke-width="0.75"/><text x="398" y="568">L1 → <tspan font-weight="600" fill="#B7332C">P02</tspan></text>
      <rect x="380" y="594" width="200" height="52" rx="2" fill="#FAF8F3" stroke="#B8B5AE" stroke-width="0.75"/><text x="398" y="626">L2 → <tspan font-weight="600" fill="#B7332C">P09</tspan></text>
      <rect x="380" y="652" width="200" height="52" rx="2" fill="#FAF8F3" stroke="#B8B5AE" stroke-width="0.75"/><text x="398" y="684">L3 → <tspan font-weight="600" fill="#B7332C">P04</tspan></text>
    </g>
  </g>

  <line x1="262" y1="504" x2="358" y2="504" stroke="#5A5A5A" stroke-width="1" marker-end="url(#arrow02)"/>
  <line x1="262" y1="562" x2="358" y2="562" stroke="#5A5A5A" stroke-width="1" marker-end="url(#arrow02)"/>
  <line x1="262" y1="620" x2="358" y2="620" stroke="#5A5A5A" stroke-width="1" marker-end="url(#arrow02)"/>
  <line x1="262" y1="678" x2="358" y2="678" stroke="#5A5A5A" stroke-width="1" marker-end="url(#arrow02)"/>

  <line x1="600" y1="562" x2="700" y2="562" stroke="#B7332C" stroke-width="1.25" marker-end="url(#arrow02)"/>
  <text x="650" y="554" class="body" font-size="10" fill="#B7332C" text-anchor="middle">indirection</text>

  <!-- physical pool -->
  <g class="interactive" data-card="physical-pool" tabindex="0" role="button" aria-label="Pool de blocs physiques et noyau paginé">
    <rect x="700" y="420" width="440" height="300" rx="3" fill="#1A1A1A" fill-opacity="0.04" stroke="#5A5A5A" stroke-width="1.25"/>
    <text x="720" y="446" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#1A1A1A">POOL PHYSIQUE — blocs épars</text>
    <text x="720" y="464" class="body" font-size="10.5" fill="#5A5A5A">teal = requête courante · gris = autres / libre</text>
    <rect x="720" y="478" width="96" height="46" rx="2" fill="#E5E1D8"/><text x="768" y="506" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">P00</text>
    <rect x="826" y="478" width="96" height="46" rx="2" fill="#E5E1D8"/><text x="874" y="506" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">P01</text>
    <rect x="932" y="478" width="96" height="46" rx="2" fill="#1F5560" fill-opacity="0.85"/><text x="980" y="506" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">P02·L1</text>
    <rect x="1038" y="478" width="96" height="46" rx="2" fill="#E5E1D8"/><text x="1086" y="506" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">P03</text>
    <rect x="720" y="530" width="96" height="46" rx="2" fill="#1F5560" fill-opacity="0.5"/><text x="768" y="558" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">P04·L3</text>
    <rect x="826" y="530" width="96" height="46" rx="2" fill="#E5E1D8"/><text x="874" y="558" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">P05</text>
    <rect x="932" y="530" width="96" height="46" rx="2" fill="#E5E1D8"/><text x="980" y="558" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">P06</text>
    <rect x="1038" y="530" width="96" height="46" rx="2" fill="#1F5560" fill-opacity="0.85"/><text x="1086" y="558" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">P07·L0</text>
    <rect x="720" y="582" width="96" height="46" rx="2" fill="#E5E1D8"/><text x="768" y="610" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">P08</text>
    <rect x="826" y="582" width="96" height="46" rx="2" fill="#1F5560" fill-opacity="0.85"/><text x="874" y="610" class="mono" font-size="10" fill="#FAF8F3" text-anchor="middle">P09·L2</text>
    <rect x="932" y="582" width="96" height="46" rx="2" fill="#E5E1D8"/><text x="980" y="610" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">P10</text>
    <rect x="1038" y="582" width="96" height="46" rx="2" fill="#E5E1D8"/><text x="1086" y="610" class="mono" font-size="10" fill="#5A5A5A" text-anchor="middle">P11</text>
    <text x="720" y="662" class="body" font-size="11.5" fill="#1A1A1A">Aucune contiguïté requise : le noyau paginé suit la table pour lire</text>
    <text x="720" y="680" class="body" font-size="11.5" fill="#1A1A1A">chaque bloc où qu'il soit. <tspan font-weight="600" fill="#1F5560">Gaspillage &lt; 4 %.</tspan></text>
    <text x="720" y="702" class="body" font-size="11.5" fill="#1A1A1A"><tspan font-weight="600" fill="#B7332C">Débit ×24 vs HuggingFace</tspan>, sans toucher au modèle.</text>
  </g>

  <!-- FOOTER -->
  <text x="60" y="772" class="body" font-size="10" font-style="italic" letter-spacing="0.02em" fill="#5A5A5A">Source : Kwon et al., PagedAttention (SOSP 2023) ; blog vLLM (2023). Identifiants de blocs illustratifs.</text>
</svg>
